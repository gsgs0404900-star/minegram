<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#000000"
>

<title>Hesabını doğrula - Minegram</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI",Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
}

.page{
  min-height:100vh;
  background:#000;
}

.header{
  height:60px;
  border-bottom:1px solid #262626;
  display:flex;
  align-items:center;
  padding:0 18px;
}

.back{
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:28px;
  cursor:pointer;
  padding:0;
}

.title{
  font-size:16px;
  font-weight:600;
  margin-left:8px;
}

.wrap{
  width:100%;
  max-width:420px;
  margin:0 auto;
  padding:38px 24px 40px;
}

.icon{
  width:64px;
  height:64px;
  border:1px solid #333;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 24px;
  font-size:29px;
}

.heading{
  text-align:center;
  font-size:25px;
  line-height:1.25;
  margin:0 0 10px;
  font-weight:700;
}

.sub{
  text-align:center;
  color:#a8a8a8;
  font-size:14px;
  line-height:1.55;
  margin:0 auto 26px;
  max-width:340px;
}

.emailBox{
  border:1px solid #292929;
  background:#101010;
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:20px;
  text-align:center;
}

.emailLabel{
  color:#8e8e8e;
  font-size:12px;
  margin-bottom:5px;
}

.emailValue{
  font-size:14px;
  font-weight:600;
  word-break:break-all;
}

.code{
  width:100%;
  height:58px;
  background:#0d0d0d;
  border:1px solid #333;
  border-radius:12px;
  color:#fff;
  text-align:center;
  font-size:25px;
  letter-spacing:9px;
  outline:none;
  padding-left:9px;
}

.code:focus{
  border-color:#777;
}

.btn{
  width:100%;
  height:50px;
  border:0;
  border-radius:9px;
  background:#2677b5;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  margin-top:16px;
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.secondary{
  background:#1b1b1b;
  border:1px solid #303030;
  color:#fff;
}

.msg{
  min-height:22px;
  text-align:center;
  font-size:13px;
  margin-top:14px;
  color:#aaa;
}

.error{
  color:#ff6b6b;
}

.success{
  color:#55d98b;
}

.small{
  color:#777;
  font-size:12px;
  text-align:center;
  margin-top:18px;
  line-height:1.5;
}

.spinner{
  display:inline-block;
  width:17px;
  height:17px;
  border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:-3px;
  margin-right:7px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@media(max-width:480px){

  .wrap{
    padding-left:20px;
    padding-right:20px;
  }

  .heading{
    font-size:23px;
  }

}

</style>

</head>

<body>

<div class="page">

  <header class="header">

    <button
      class="back"
      id="backBtn"
      type="button"
      aria-label="Geri"
    >
      ‹
    </button>

    <div class="title">
      Hesabını doğrula
    </div>

  </header>


  <main class="wrap">

    <div class="icon">
      ✉
    </div>


    <h1 class="heading">
      Hesabını doğrula
    </h1>


    <p class="sub">
      Hesabını bulmak için e-posta
      adresine gönderdiğimiz 6 haneli
      doğrulama kodunu gir.
    </p>


    <div class="emailBox">

      <div class="emailLabel">
        Kod gönderilen e-posta
      </div>

      <div
        class="emailValue"
        id="emailValue"
      >
        E-posta adresin
      </div>

    </div>


    <input
      id="codeInput"
      class="code"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      placeholder="••••••"
      aria-label="6 haneli doğrulama kodu"
    >


    <button
      class="btn"
      id="verifyBtn"
      type="button"
    >
      Doğrula
    </button>


    <button
      class="btn secondary"
      id="resendBtn"
      type="button"
    >
      Kodu yeniden gönder
    </button>


    <div
      id="message"
      class="msg"
    ></div>


    <div
      id="timer"
      class="small"
    ></div>

  </main>

</div>


<script>

(() => {

  "use strict";


  /* =====================================================
     ELEMENTLER
  ===================================================== */

  const codeInput =
    document.getElementById("codeInput");

  const verifyBtn =
    document.getElementById("verifyBtn");

  const resendBtn =
    document.getElementById("resendBtn");

  const message =
    document.getElementById("message");

  const emailValue =
    document.getElementById("emailValue");

  const timer =
    document.getElementById("timer");

  const backBtn =
    document.getElementById("backBtn");


  /* =====================================================
     SESSION STORAGE
  ===================================================== */

  function getSession(key){

    try{

      return (
        sessionStorage.getItem(key) ||
        ""
      );

    }catch{

      return "";

    }

  }


  function setSession(key,value){

    try{

      sessionStorage.setItem(
        key,
        String(value ?? "")
      );

    }catch{}

  }


  function removeSession(key){

    try{

      sessionStorage.removeItem(key);

    }catch{}

  }


  /* =====================================================
     LOCAL STORAGE
  ===================================================== */

  function setLocal(key,value){

    try{

      localStorage.setItem(
        key,
        String(value ?? "")
      );

    }catch{}

  }


  function removeLocal(key){

    try{

      localStorage.removeItem(key);

    }catch{}

  }


  /* =====================================================
     FIRST
  ===================================================== */

  function first(...values){

    return values.find(
      value =>
        value !== undefined &&
        value !== null &&
        String(value).trim() !== ""
    ) || "";

  }


  /* =====================================================
     URL
  ===================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  /* =====================================================
     RECOVERY BİLGİLERİ
  ===================================================== */

  const identifier =
    first(

      params.get("identifier"),

      getSession(
        "minegram_recovery_identifier"
      )

    )
    .trim()
    .replace(/^@/,"");


  const mode =
    first(

      params.get("mode"),

      getSession(
        "minegram_recovery_mode"
      ),

      "email"

    )
    .trim();


  const email =
    first(

      params.get("email"),

      getSession(
        "minegram_recovery_email"
      )

    )
    .trim()
    .toLowerCase();


  /* =====================================================
     EMAIL GÖSTER
  ===================================================== */

  emailValue.textContent =
    email ||
    "E-posta adresi";


  /* =====================================================
     MESAJ
  ===================================================== */

  function show(text,type=""){

    message.textContent =
      String(text || "");

    message.className =
      "msg";

    if(type){

      message.classList.add(type);

    }

  }


  /* =====================================================
     API
  ===================================================== */

  async function api(
    path,
    options={}
  ){

    const response =
      await fetch(
        path,
        {

          ...options,

          headers:{

            "Content-Type":
              "application/json",

            "Accept":
              "application/json",

            ...(options.headers || {})

          },

          credentials:
            "include",

          cache:
            "no-store"

        }
      );


    const raw =
      await response.text();


    let data = {};


    try{

      data =
        raw
          ? JSON.parse(raw)
          : {};

    }catch{

      data = {

        error:
          raw ||
          "Sunucudan geçersiz cevap geldi."

      };

    }


    console.log(
      "[MINEGRAM RECOVERY API]",
      path,
      response.status,
      data
    );


    if(!response.ok){

      throw new Error(

        data?.error ||
        data?.message ||
        "Sunucu hatası."

      );

    }


    return data;

  }


  /* =====================================================
     RESET TOKEN KAYDET
  ===================================================== */

  function saveResetToken(data){

    const token =
      first(

        data?.resetToken,

        data?.reset_token,

        data?.token,

        data?.recoveryToken

      ).trim();


    if(!token){

      console.error(
        "[MINEGRAM] RESET TOKEN BULUNAMADI",
        data
      );

      return "";

    }


    setSession(
      "minegram_password_reset_token",
      token
    );

    setSession(
      "minegram_reset_token",
      token
    );

    setSession(
      "resetToken",
      token
    );


    setLocal(
      "minegram_password_reset_token",
      token
    );

    setLocal(
      "minegram_reset_token",
      token
    );


    return token;

  }


  /* =====================================================
     YENİ ŞİFRE SAYFASINA GİT
  ===================================================== */

  function goNewPassword(token){

    if(!token){

      show(
        "Şifre sıfırlama oturumu oluşturulamadı.",
        "error"
      );

      return;

    }


    show(
      "Kod doğrulandı. Yeni şifre ekranına gidiyorsun...",
      "success"
    );


    verifyBtn.disabled =
      true;

    resendBtn.disabled =
      true;


    const url =
      new URL(
        "./yeni-sifre.html",
        window.location.href
      );


    url.searchParams.set(
      "token",
      token
    );


    if(identifier){

      url.searchParams.set(
        "identifier",
        identifier
      );

    }


    if(email){

      url.searchParams.set(
        "email",
        email
      );

    }


    setTimeout(
      function(){

        window.location.replace(
          url.href
        );

      },
      500
    );

  }


  /* =====================================================
     KOD DOĞRULA
  ===================================================== */

  async function verify(){

    const code =
      String(
        codeInput.value || ""
      )
      .replace(/\D/g,"")
      .slice(0,6);


    codeInput.value =
      code;


    if(!identifier && !email){

      show(
        "Şifre sıfırlama bilgileri bulunamadı. Lütfen işlemi yeniden başlat.",
        "error"
      );

      return;

    }


    if(!/^\d{6}$/.test(code)){

      show(
        "6 haneli doğrulama kodunu gir.",
        "error"
      );

      codeInput.focus();

      return;

    }


    verifyBtn.disabled =
      true;

    resendBtn.disabled =
      true;


    verifyBtn.innerHTML =
      '<span class="spinner"></span>Doğrulanıyor...';


    show(
      "Doğrulama kodu kontrol ediliyor..."
    );


    try{

      /*
       * ÇOK ÖNEMLİ:
       *
       * ARTIK register/verify YOK.
       *
       * Şifre kurtarma:
       * /api/forgot/verify
       */

      const data =
        await api(
          "/api/forgot/verify",
          {

            method:
              "POST",

            body:
              JSON.stringify({

                identifier:
                  identifier,

                email:
                  email,

                mode:
                  mode,

                code:
                  code

              })

          }
        );


      console.log(
        "[MINEGRAM FORGOT VERIFY RESULT]",
        data
      );


      if(
        !data ||
        data.ok !== true
      ){

        throw new Error(

          data?.error ||
          data?.message ||
          "Doğrulama başarısız."

        );

      }


      const resetToken =
        saveResetToken(
          data
        );


      if(!resetToken){

        throw new Error(
          "Kod doğrulandı ancak şifre sıfırlama anahtarı alınamadı."
        );

      }


      /*
       * Yeni şifre sayfasına git.
       */

      goNewPassword(
        resetToken
      );

    }
    catch(error){

      console.error(
        "[MINEGRAM FORGOT VERIFY ERROR]",
        error
      );


      show(

        error?.message ||
        "Kod doğrulanamadı. Lütfen tekrar dene.",

        "error"

      );


      verifyBtn.disabled =
        false;

      resendBtn.disabled =
        false;

      verifyBtn.textContent =
        "Doğrula";

    }

  }


  /* =====================================================
     YENİDEN GÖNDER SAYACI
  ===================================================== */

  let remaining =
    60;

  let timerId =
    null;

  let resendLocked =
    true;


  function startTimer(seconds=60){

    remaining =
      Number(seconds);


    resendLocked =
      true;


    resendBtn.disabled =
      true;


    clearInterval(
      timerId
    );


    function tick(){

      if(remaining <= 0){

        clearInterval(
          timerId
        );

        timerId =
          null;

        resendLocked =
          false;

        resendBtn.disabled =
          false;

        resendBtn.textContent =
          "Kodu yeniden gönder";

        timer.textContent =
          "";

        return;

      }


      timer.textContent =
        "Yeni kod göndermek için " +
        remaining +
        " saniye bekle.";


      resendBtn.textContent =
        "Tekrar gönder (" +
        remaining +
        ")";


      remaining--;

    }


    tick();


    timerId =
      setInterval(
        tick,
        1000
      );

  }


  /* =====================================================
     YENİDEN GÖNDER
  ===================================================== */

  async function resend(){

    if(
      resendLocked ||
      (!identifier && !email)
    ){

      return;

    }


    resendLocked =
      true;

    resendBtn.disabled =
      true;

    resendBtn.textContent =
      "Gönderiliyor...";


    show(
      "Yeni doğrulama kodu gönderiliyor..."
    );


    try{

      const data =
        await api(
          "/api/forgot/start",
          {

            method:
              "POST",

            body:
              JSON.stringify({

                identifier:
                  identifier || email,

                email:
                  email,

                mode:
                  mode || "email"

              })

          }
        );


      if(
        !data ||
        data.ok !== true
      ){

        throw new Error(

          data?.error ||
          "Yeni kod gönderilemedi."

        );

      }


      /*
       * Sunucu farklı email döndürürse
       * session'a güncelle.
       */

      const newEmail =
        first(
          data?.email,
          email
        )
        .trim()
        .toLowerCase();


      if(newEmail){

        setSession(
          "minegram_recovery_email",
          newEmail
        );

        emailValue.textContent =
          newEmail;

      }


      show(
        data?.message ||
        "Yeni doğrulama kodu gönderildi.",
        "success"
      );


      codeInput.value =
        "";

      codeInput.focus();


      startTimer(
        60
      );

    }
    catch(error){

      console.error(
        "[MINEGRAM RECOVERY RESEND ERROR]",
        error
      );


      show(

        error?.message ||
        "Yeni kod gönderilemedi.",

        "error"

      );


      resendLocked =
        false;

      resendBtn.disabled =
        false;

      resendBtn.textContent =
        "Kodu yeniden gönder";

    }

  }


  /* =====================================================
     GERİ
  ===================================================== */

  backBtn.addEventListener(
    "click",
    function(){

      window.location.href =
        "./hesaplarini-bulduk.html";

    }
  );


  /* =====================================================
     BUTON
  ===================================================== */

  verifyBtn.addEventListener(
    "click",
    verify
  );


  resendBtn.addEventListener(
    "click",
    resend
  );


  /* =====================================================
     INPUT
  ===================================================== */

  codeInput.addEventListener(
    "input",
    function(){

      this.value =
        this.value
          .replace(/\D/g,"")
          .slice(0,6);


      if(
        this.value.length === 6 &&
        !verifyBtn.disabled
      ){

        verify();

      }

    }
  );


  /* =====================================================
     ENTER
  ===================================================== */

  codeInput.addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        if(
          this.value.length === 6 &&
          !verifyBtn.disabled
        ){

          verify();

        }

      }

    }
  );


  /* =====================================================
     BAŞLAT
  ===================================================== */

  function start(){

    console.log(
      "[MINEGRAM] ŞİFRE KURTARMA DOĞRULAMASI BAŞLADI"
    );

    console.log(
      "[MINEGRAM] identifier:",
      identifier
    );

    console.log(
      "[MINEGRAM] email:",
      email
    );

    console.log(
      "[MINEGRAM] mode:",
      mode
    );


    /*
     * Burada artık:
     *
     * minegram_register_password
     *
     * KESİNLİKLE ARANMIYOR.
     */


    if(
      !identifier &&
      !email
    ){

      show(
        "Şifre sıfırlama bilgileri bulunamadı. Lütfen işlemi yeniden başlat.",
        "error"
      );


      verifyBtn.disabled =
        true;

      resendBtn.disabled =
        true;

      return;

    }


    show(
      "E-postana gönderilen 6 haneli kodu gir.",
      "success"
    );


    codeInput.focus();


    startTimer(
      60
    );

  }


  start();


})();

</script>

</body>

</html>
