<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#000000"
>

<title>Hesabını doğrula - Minegram</title>


<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}


html,
body{

  margin:0;
  width:100%;
  height:100%;

  background:#000;
  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}


body{
  overflow:hidden;
}


.page{

  width:100%;
  height:100dvh;
  min-height:100vh;

  background:#000;

  position:relative;

}


/* =========================
   ÜST
========================= */

.header{

  height:82px;

  display:flex;
  align-items:center;

  padding:0 48px;

}


.back{

  color:#fff;

  font-size:55px;

  line-height:1;

  font-weight:300;

  margin-right:27px;

  margin-top:-7px;

  cursor:pointer;

  user-select:none;

}


.header-title{

  font-size:29px;

  font-weight:700;

}


/* =========================
   İÇERİK
========================= */

.content{

  position:absolute;

  left:7.2%;
  right:7.2%;

  top:17.2%;

}


.title{

  text-align:center;

  font-size:47px;

  line-height:1.15;

  font-weight:800;

  margin:0 0 34px;

}


.description{

  color:#b9b9b9;

  font-size:31px;

  line-height:1.55;

  margin:0 0 69px;

}


/* =========================
   KOD
========================= */

.code{

  width:100%;

  height:119px;

  background:#111;

  border:2px solid #666;

  border-radius:10px;

  color:#fff;

  outline:none;

  padding:0 32px;

  font-size:31px;

  letter-spacing:5px;

}


.code:focus{

  border-color:#888;

}


.code::placeholder{

  color:#b8b8b8;

  opacity:1;

  letter-spacing:0;

}


/* =========================
   DURUM
========================= */

.status{

  position:absolute;

  left:7.2%;

  right:7.2%;

  bottom:calc(6.1% + 150px);

  text-align:center;

  font-size:18px;

  color:#ff4d4d;

  display:none;

}


.status.success{

  color:#35c759;

}


/* =========================
   ALT
========================= */

.bottom{

  position:absolute;

  left:7.2%;

  right:7.2%;

  bottom:6.1%;

  text-align:center;

}


.verify{

  width:100%;

  height:88px;

  border:0;

  border-radius:50px;

  background:#62b0ed;

  color:#30207c;

  font-size:27px;

  font-weight:800;

  cursor:pointer;

}


.verify:hover{

  background:#70b9f1;

}


.verify:disabled{

  opacity:.6;

  cursor:not-allowed;

}


.change{

  border:0;

  background:transparent;

  color:#62b0ed;

  font-size:27px;

  font-weight:700;

  margin-top:45px;

  cursor:pointer;

}


.change:hover{

  color:#80c3f5;

}


/* =========================
   MOBİL
========================= */

@media(max-width:600px){

  .header{

    height:72px;

    padding:0 19px;

  }


  .back{

    font-size:43px;

    margin-right:17px;

  }


  .header-title{

    font-size:23px;

  }


  .content{

    left:7.2%;

    right:7.2%;

    top:16.5%;

  }


  .title{

    font-size:34px;

    margin-bottom:27px;

  }


  .description{

    font-size:22px;

    line-height:1.55;

    margin-bottom:47px;

  }


  .code{

    height:82px;

    padding:0 22px;

    font-size:24px;

    border-radius:9px;

  }


  .bottom{

    left:7.2%;

    right:7.2%;

    bottom:5.8%;

  }


  .verify{

    height:72px;

    font-size:21px;

  }


  .change{

    font-size:21px;

    margin-top:34px;

  }


  .status{

    bottom:calc(5.8% + 125px);

    font-size:14px;

  }

}

</style>

</head>


<body>


<div class="page">


  <!-- =========================
       ÜST
  ========================== -->

  <header class="header">

    <div
      class="back"
      id="backButton"
      aria-label="Geri"
    >
      ‹
    </div>

    <div class="header-title">
      Kayıt ol
    </div>

  </header>


  <!-- =========================
       İÇERİK
  ========================== -->

  <main class="content">

    <h1 class="title">
      Hesabını doğrula
    </h1>


    <p class="description">

      E-posta adresine gönderilen doğrulama<br>
      kodunu gir.

    </p>


    <input
      id="code"
      class="code"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      placeholder="Doğrulama kodu"
      aria-label="Doğrulama kodu"
    >

  </main>


  <!-- =========================
       DURUM
  ========================== -->

  <div
    id="status"
    class="status"
  ></div>


  <!-- =========================
       ALT
  ========================== -->

  <div class="bottom">

    <button
      id="verifyButton"
      class="verify"
      type="button"
    >
      Kodu doğrula ve Minegram'a gir
    </button>


    <button
      id="changeButton"
      class="change"
      type="button"
    >
      İletişim bilgini değiştir
    </button>

  </div>


</div>


<!-- =========================================================
     FIREBASE
========================================================= -->

<script type="module">

"use strict";


/* =========================================================
   FIREBASE IMPORT
========================================================= */

import {

  initializeApp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

  getAuth

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================================
   FIREBASE AYARLARI
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

  authDomain:
    "mim-ea133.firebaseapp.com",

  databaseURL:
    "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "mim-ea133",

  storageBucket:
    "mim-ea133.firebasestorage.app",

  messagingSenderId:
    "303525353436",

  appId:
    "1:303525353436:web:082fc090b5025e19942119",

  measurementId:
    "G-K962QE5P1R"

};


/* =========================================================
   FIREBASE BAŞLAT
========================================================= */

const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


/* =========================================================
   ELEMENTLER
========================================================= */

const codeInput =
  document.getElementById(
    "code"
  );


const verifyButton =
  document.getElementById(
    "verifyButton"
  );


const changeButton =
  document.getElementById(
    "changeButton"
  );


const backButton =
  document.getElementById(
    "backButton"
  );


const status =
  document.getElementById(
    "status"
  );


/* =========================================================
   KULLANICI BİLGİLERİ
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const username =
  params.get("username") ||
  sessionStorage.getItem(
    "minegram_register_username"
  ) ||
  "";


const email =
  params.get("email") ||
  sessionStorage.getItem(
    "minegram_register_email"
  ) ||
  "";


const phone =
  params.get("phone") ||
  sessionStorage.getItem(
    "minegram_register_phone"
  ) ||
  "";


/* =========================================================
   DURUM MESAJI
========================================================= */

function showStatus(
  text,
  success = false
){

  status.textContent =
    text || "";


  status.className =
    success
      ? "status success"
      : "status";


  status.style.display =
    text
      ? "block"
      : "none";

}


/* =========================================================
   KOD INPUT
========================================================= */

codeInput.addEventListener(
  "input",
  function(){

    codeInput.value =
      codeInput.value
        .replace(/\D/g,"")
        .slice(0,6);


    showStatus("");

  }
);


/* =========================================================
   GİRİŞ SAYFASINA / GERİ
========================================================= */

function goBack(){

  window.location.href =
    "./iletisim-bilgileri.html" +
    "?username=" +
    encodeURIComponent(username);

}


backButton.addEventListener(
  "click",
  goBack
);


changeButton.addEventListener(
  "click",
  goBack
);


/* =========================================================
   DOĞRULAMA
========================================================= */

async function verifyCode(){

  const code =
    codeInput.value.trim();


  showStatus("");


  /* Kod kontrol */

  if(!code){

    showStatus(
      "Lütfen doğrulama kodunu gir."
    );

    codeInput.focus();

    return;

  }


  if(code.length !== 6){

    showStatus(
      "Doğrulama kodu 6 haneli olmalıdır."
    );

    codeInput.focus();

    return;

  }


  verifyButton.disabled =
    true;


  verifyButton.textContent =
    "Doğrulanıyor...";


  try{

    /*
     * =====================================================
     * GERÇEK OTP DOĞRULAMA
     * =====================================================
     *
     * Burada backend API kullanılacak.
     *
     * API:
     *
     * POST /api/verify-code
     *
     * Gönderilen bilgiler:
     *
     * username
     * email
     * phone
     * code
     *
     */


    const response =
      await fetch(
        "/api/verify-code",
        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "Accept":
              "application/json"

          },

          body:
            JSON.stringify({

              username:
                username,

              email:
                email,

              phone:
                phone,

              code:
                code

            }),

          cache:
            "no-store"

        }
      );


    const data =
      await response
        .json()
        .catch(
          function(){

            return {};

          }
        );


    console.log(
      "[MINEGRAM VERIFY RESPONSE]",
      data
    );


    if(!response.ok){

      throw new Error(

        data.error ||
        data.message ||
        "Doğrulama kodu hatalı."

      );

    }


    /* =====================================================
       BAŞARILI
    ===================================================== */

    if(data.token){

      localStorage.setItem(
        "minegram_token",
        String(data.token)
      );


      localStorage.setItem(
        "minegram_supabase_token",
        String(data.token)
      );

    }


    if(data.user){

      localStorage.setItem(
        "minegram_user",
        JSON.stringify(
          data.user
        )
      );


      if(data.user.id){

        localStorage.setItem(
          "minegram_user_id",
          String(data.user.id)
        );

      }


      if(data.user.username){

        localStorage.setItem(
          "minegram_username",
          String(
            data.user.username
          )
        );

      }


      if(data.user.email){

        localStorage.setItem(
          "minegram_email",
          String(
            data.user.email
          )
        );

      }

    }


    showStatus(
      "Hesabın doğrulandı. Minegram'a giriyorsun...",
      true
    );


    verifyButton.textContent =
      "Doğrulandı";


    /*
     * Kısa bekleme.
     */

    setTimeout(
      function(){

        window.location.href =
          "./index.html";

      },
      500
    );

  }
  catch(error){

    console.error(
      "[MINEGRAM VERIFY ERROR]",
      error
    );


    showStatus(

      error.message ||
      "Doğrulama yapılamadı."

    );


    verifyButton.disabled =
      false;


    verifyButton.textContent =
      "Kodu doğrula ve Minegram'a gir";

  }

}


/* =========================================================
   BUTON
========================================================= */

verifyButton.addEventListener(
  "click",
  verifyCode
);


/* =========================================================
   ENTER
========================================================= */

codeInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      verifyCode();

    }

  }
);


/* =========================================================
   FIREBASE KONTROL
========================================================= */

console.log(
  "[MINEGRAM] Firebase hazır:",
  !!auth
);


console.log(
  "[MINEGRAM] Doğrulama e-postası:",
  email
);


console.log(
  "[MINEGRAM] Kullanıcı adı:",
  username
);


console.log(
  "[MINEGRAM] Telefon:",
  phone
);


/* =========================================================
   SAYFA AÇILIŞI
========================================================= */

if(
  !email &&
  !phone
){

  showStatus(
    "İletişim bilgisi bulunamadı."
  );

}


codeInput.focus();

</script>


</body>

</html>
