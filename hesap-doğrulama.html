<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Hesabını doğrula - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:365px;
    margin-top:90px;
    text-align:center;
}

.header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:25px;
}

.back{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    margin-right:8px;
}

.header-title{
    font-size:16px;
    font-weight:700;
}

.title{
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 12px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.45;
    margin:0 0 22px;
}

.code{
    width:100%;
    height:44px;
    margin-bottom:9px;
    padding:0 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#000;
    color:#fff;
    outline:none;
    font-size:12px;
    letter-spacing:2px;
}

.code::placeholder{
    color:#777;
    letter-spacing:0;
}

.code:focus{
    border-color:#555;
}

.status{
    min-height:20px;
    margin-top:10px;
    font-size:12px;
    color:#ff4d4d;
}

.status.success{
    color:#35c759;
}

.status.loading{
    color:#aaa;
}

.bottom{
    display:flex;
    gap:9px;
    width:100%;
    margin-top:25px;
}

.action{
    width:50%;
    height:42px;
    border-radius:22px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.back-btn{
    background:#000;
    border:1px solid #555;
    color:#0095f6;
}

.verify{
    background:#2d80bd;
    border:0;
    color:#000;
}

.verify:hover{
    background:#348dca;
}

.verify:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.resend{
    width:100%;
    height:38px;
    margin-top:10px;
    border:0;
    background:transparent;
    color:#0095f6;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.resend:disabled{
    color:#555;
    cursor:not-allowed;
}

@media(max-width:600px){

    .box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:60px;
    }

    .header{
        margin-bottom:22px;
    }

    .header-title{
        font-size:15px;
    }

    .title{
        font-size:21px;
    }

    .description{
        font-size:12px;
    }

    .code{
        height:44px;
        font-size:12px;
    }

    .action{
        height:42px;
        font-size:12px;
    }

    .status{
        font-size:12px;
    }
}
</style>

</head>

<body>

<div class="page">
<div class="box">

<header class="header">

```
<div
    class="back"
    id="backButton"
    aria-label="Geri"
    role="button"
    tabindex="0"
>‹</div>

<div class="header-title">
    Kayıt ol
</div>
```

</header>

<h1 class="title">
    Hesabını doğrula
</h1>

<p class="description">
    E-posta adresine gönderilen doğrulama<br>
    bağlantısına tıkla.
</p>

<input
id="code"
class="code"
type="text"
inputmode="numeric"
autocomplete="one-time-code"
maxlength="6"
placeholder="Doğrulama kodu"
aria-label="Doğrulama kodu"

>

<div id="status" class="status loading">
    Firebase oturumu yükleniyor...
</div>

<div class="bottom">

```
<button
    id="changeButton"
    class="action back-btn"
    type="button"
>
    İletişim bilgini değiştir
</button>

<button
    id="verifyButton"
    class="action verify"
    type="button"
    disabled
>
    Kontrol et
</button>
```

</div>

<button
id="resendButton"
class="resend"
type="button"
disabled

>

```
Doğrulama e-postasını tekrar gönder
```

</button>

</div>
</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    initializeAuth,
    indexedDBLocalPersistence,
    browserLocalPersistence,
    onAuthStateChanged,
    sendEmailVerification,
    reload
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain:
        "mim-ea133.firebaseapp.com",

    databaseURL:
        "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "mim-ea133",

    storageBucket:
        "mim-ea133.firebasestorage.app",

    messagingSenderId:
        "303525353436",

    appId:
        "1:303525353436:web:082fc090b5025e19942119",

    measurementId:
        "G-K962QE5P1R"
};


/* =========================================
   FIREBASE APP
========================================= */

const app = initializeApp(firebaseConfig);


/*
 * Firebase Auth oturumunu tarayıcıda
 * kalıcı tut.
 */

const auth = initializeAuth(app, {

    persistence: [
        indexedDBLocalPersistence,
        browserLocalPersistence
    ]

});


/* =========================================
   ELEMENTLER
========================================= */

const codeInput =
    document.getElementById("code");

const verifyButton =
    document.getElementById("verifyButton");

const resendButton =
    document.getElementById("resendButton");

const changeButton =
    document.getElementById("changeButton");

const backButton =
    document.getElementById("backButton");

const status =
    document.getElementById("status");


/* =========================================
   URL
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const username =
    params.get("username") ||
    sessionStorage.getItem(
        "minegram_register_username"
    ) ||
    "";


const email =
    params.get("email") ||
    sessionStorage.getItem(
        "minegram_register_email"
    ) ||
    "";


/* =========================================
   DURUM
========================================= */

function showStatus(
    text,
    type = ""
){

    status.textContent =
        text || "";

    status.className =
        "status";

    if(type){

        status.classList.add(type);

    }

}


/* =========================================
   GERİ
========================================= */

function goBack(){

    let url =
        "./iletisim-bilgileri.html";

    if(username){

        url +=
            "?username=" +
            encodeURIComponent(username);

    }

    window.location.href =
        url;
}


backButton.addEventListener(
    "click",
    goBack
);


changeButton.addEventListener(
    "click",
    goBack
);


backButton.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            goBack();

        }

    }
);


/* =========================================
   KOD ALANI
========================================= */

codeInput.addEventListener(
    "input",
    function(){

        codeInput.value =
            codeInput.value
                .replace(/\D/g,"")
                .slice(0,6);

    }
);


/* =========================================
   AUTH KULLANICISI
========================================= */

let currentUser = null;


/* =========================================
   KULLANICIYI KONTROL ET
========================================= */

async function checkUser(){

    try{

        /*
         * Auth'un hazır olmasını bekle.
         */

        const user =
            await new Promise(
                function(resolve){

                    let finished = false;

                    const unsubscribe =
                        onAuthStateChanged(
                            auth,
                            function(user){

                                if(finished){
                                    return;
                                }

                                finished = true;

                                unsubscribe();

                                resolve(user);

                            }
                        );

                }
            );


        currentUser =
            user || null;


        /* =============================
           OTURUM YOK
        ============================= */

        if(!currentUser){

            showStatus(
                "Firebase oturumu bulunamadı. Kayıt işlemini aynı tarayıcıda tekrar başlat.",
                ""
            );

            verifyButton.disabled =
                true;

            resendButton.disabled =
                true;

            return;

        }


        /* =============================
           OTURUM VAR
        ============================= */

        console.log(
            "[MINEGRAM] Firebase UID:",
            currentUser.uid
        );

        console.log(
            "[MINEGRAM] Firebase email:",
            currentUser.email
        );


        /*
         * SessionStorage'a da yaz.
         */

        if(currentUser.email){

            sessionStorage.setItem(
                "minegram_register_email",
                currentUser.email
            );

        }


        if(username){

            sessionStorage.setItem(
                "minegram_register_username",
                username
            );

        }


        /* =============================
           ZATEN DOĞRULU
        ============================= */

        if(currentUser.emailVerified){

            showStatus(
                "Hesabın zaten doğrulanmış.",
                "success"
            );

            verifyButton.disabled =
                false;

            verifyButton.textContent =
                "Doğrulandı";

            resendButton.disabled =
                true;

            setTimeout(
                function(){

                    window.location.href =
                        "./index.html";

                },
                700
            );

            return;

        }


        /* =============================
           NORMAL
        ============================= */

        showStatus(
            "Doğrulama e-postası hazırlanıyor...",
            "loading"
        );

        verifyButton.disabled =
            false;

        resendButton.disabled =
            false;


        /*
         * İlk doğrulama e-postasını gönder.
         */

        await sendVerificationEmail(
            false
        );

    }
    catch(error){

        console.error(
            "[MINEGRAM AUTH ERROR]",
            error
        );


        showStatus(
            firebaseError(error),
            ""
        );

        verifyButton.disabled =
            true;

        resendButton.disabled =
            true;

    }

}


/* =========================================
   DOĞRULAMA E-POSTASI
========================================= */

async function sendVerificationEmail(
    manual
){

    if(!currentUser){

        showStatus(
            "Firebase oturumu bulunamadı.",
            ""
        );

        return;

    }


    try{

        await sendEmailVerification(
            currentUser
        );


        showStatus(
            "Doğrulama e-postası gönderildi. E-postanı kontrol et ve bağlantıya tıkla.",
            "success"
        );


        if(manual){

            startResendTimer();

        }

    }
    catch(error){

        console.error(
            "[MINEGRAM EMAIL ERROR]",
            error
        );


        if(
            error.code ===
            "auth/too-many-requests"
        ){

            showStatus(
                "Çok fazla e-posta gönderme isteği oldu. Biraz sonra tekrar dene.",
                ""
            );

        }
        else{

            showStatus(
                firebaseError(error),
                ""
            );

        }


        if(manual){

            resendButton.disabled =
                false;

            resendButton.textContent =
                "Doğrulama e-postasını tekrar gönder";

        }

    }

}


/* =========================================
   TEKRAR GÖNDER ZAMANLAYICI
========================================= */

function startResendTimer(){

    let seconds = 30;


    resendButton.disabled =
        true;


    resendButton.textContent =
        "Tekrar gönder (" +
        seconds +
        ")";


    const timer =
        setInterval(
            function(){

                seconds--;


                resendButton.textContent =
                    "Tekrar gönder (" +
                    seconds +
                    ")";


                if(seconds <= 0){

                    clearInterval(timer);


                    resendButton.disabled =
                        false;


                    resendButton.textContent =
                        "Doğrulama e-postasını tekrar gönder";

                }

            },
            1000
        );

}


/* =========================================
   KONTROL ET
========================================= */

verifyButton.addEventListener(
    "click",
    async function(){

        if(!currentUser){

            showStatus(
                "Firebase oturumu bulunamadı.",
                ""
            );

            return;

        }


        verifyButton.disabled =
            true;

        verifyButton.textContent =
            "Kontrol ediliyor...";


        try{

            /*
             * Firebase kullanıcı bilgisini
             * sunucudan tekrar al.
             */

            await reload(
                currentUser
            );


            /*
             * Yenilenmiş kullanıcı.
             */

            currentUser =
                auth.currentUser;


            if(
                currentUser &&
                currentUser.emailVerified
            ){

                if(username){

                    sessionStorage.setItem(
                        "minegram_register_username",
                        username
                    );

                }


                if(currentUser.email){

                    sessionStorage.setItem(
                        "minegram_register_email",
                        currentUser.email
                    );

                }


                sessionStorage.setItem(
                    "minegram_uid",
                    currentUser.uid
                );


                showStatus(
                    "Hesabın doğrulandı. Minegram'a giriyorsun...",
                    "success"
                );


                verifyButton.textContent =
                    "Doğrulandı";


                setTimeout(
                    function(){

                        window.location.href =
                            "./index.html";

                    },
                    700
                );


            }
            else{

                showStatus(
                    "E-posta henüz doğrulanmamış. E-postandaki doğrulama bağlantısına tıkla.",
                    ""
                );


                verifyButton.disabled =
                    false;

                verifyButton.textContent =
                    "Kontrol et";

            }

        }
        catch(error){

            console.error(error);


            showStatus(
                firebaseError(error),
                ""
            );


            verifyButton.disabled =
                false;

            verifyButton.textContent =
                "Kontrol et";

        }

    }
);


/* =========================================
   TEKRAR GÖNDER
========================================= */

resendButton.addEventListener(
    "click",
    async function(){

        if(!currentUser){

            showStatus(
                "Firebase oturumu bulunamadı.",
                ""
            );

            return;

        }


        await sendVerificationEmail(
            true
        );

    }
);


/* =========================================
   FIREBASE HATA MESAJLARI
========================================= */

function firebaseError(error){

    if(!error){

        return "Bir hata oluştu.";

    }


    switch(error.code){

        case "auth/too-many-requests":

            return "Çok fazla istek gönderildi. Daha sonra tekrar dene.";

        case "auth/network-request-failed":

            return "İnternet bağlantısını kontrol et.";

        case "auth/user-disabled":

            return "Bu hesap devre dışı bırakılmış.";

        case "auth/user-token-expired":

            return "Oturumun süresi dolmuş. Kayıt işlemini tekrar başlat.";

        case "auth/invalid-user-token":

            return "Firebase oturumu geçersiz. Kayıt işlemini tekrar başlat.";

        default:

            return (
                error.message ||
                "Firebase işlemi başarısız oldu."
            );

    }

}


/* =========================================
   ENTER
========================================= */

codeInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            verifyButton.click();

        }

    }
);


/* =========================================
   BAŞLAT
========================================= */

console.log(
    "[MINEGRAM] Hesap doğrulama başlatılıyor..."
);

console.log(
    "[MINEGRAM] Email:",
    email
);

checkUser();

</script>

</body>
</html>
