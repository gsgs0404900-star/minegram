<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Hesabını doğrula - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif
}

body{
    min-height:100vh
}

.page{
    min-height:100vh;
    background:#000
}

.header{
    height:60px;
    border-bottom:1px solid #262626;
    display:flex;
    align-items:center;
    padding:0 18px
}

.back{
    width:40px;
    height:40px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:28px;
    cursor:pointer;
    padding:0
}

.title{
    font-size:16px;
    font-weight:600;
    margin-left:8px
}

.wrap{
    width:100%;
    max-width:420px;
    margin:0 auto;
    padding:38px 24px 40px
}

.icon{
    width:64px;
    height:64px;
    border:1px solid #333;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 24px;
    font-size:29px
}

.heading{
    text-align:center;
    font-size:25px;
    line-height:1.25;
    margin:0 0 10px;
    font-weight:700
}

.sub{
    text-align:center;
    color:#a8a8a8;
    font-size:14px;
    line-height:1.55;
    margin:0 auto 26px;
    max-width:340px
}

.emailBox{
    border:1px solid #292929;
    background:#101010;
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:20px;
    text-align:center
}

.emailLabel{
    color:#8e8e8e;
    font-size:12px;
    margin-bottom:5px
}

.emailValue{
    font-size:14px;
    font-weight:600;
    word-break:break-all
}

.code{
    width:100%;
    height:58px;
    background:#0d0d0d;
    border:1px solid #333;
    border-radius:12px;
    color:#fff;
    text-align:center;
    font-size:25px;
    letter-spacing:9px;
    outline:none;
    padding-left:9px
}

.code:focus{
    border-color:#777
}

.btn{
    width:100%;
    height:50px;
    border:0;
    border-radius:9px;
    background:#2677b5;
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:16px
}

.btn:disabled{
    opacity:.55;
    cursor:not-allowed
}

.secondary{
    background:#1b1b1b;
    border:1px solid #303030;
    color:#fff
}

.msg{
    min-height:22px;
    text-align:center;
    font-size:13px;
    margin-top:14px;
    color:#aaa
}

.error{
    color:#ff6b6b
}

.success{
    color:#55d98b
}

.small{
    color:#777;
    font-size:12px;
    text-align:center;
    margin-top:18px;
    line-height:1.5
}

.spinner{
    display:inline-block;
    width:17px;
    height:17px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:-3px;
    margin-right:7px
}

@keyframes spin{
    to{
        transform:rotate(360deg)
    }
}

@media(max-width:480px){

    .wrap{
        padding-left:20px;
        padding-right:20px
    }

    .heading{
        font-size:23px
    }

}
</style>
</head>

<body>

<div class="page">

<header class="header">

<button
    class="back"
    id="backBtn"
    type="button"
    aria-label="Geri"
>
‹
</button>

<div class="title">
Hesabını doğrula
</div>

</header>

<main class="wrap">

<div class="icon">
✉
</div>

<h1
    class="heading"
    id="heading"
>
Hesabını doğrula
</h1>

<p
    class="sub"
    id="sub"
>
E-posta adresine gönderdiğimiz 6 haneli doğrulama kodunu gir.
</p>

<div class="emailBox">

<div class="emailLabel">
Kod gönderilen e-posta
</div>

<div
    class="emailValue"
    id="emailValue"
>
E-posta adresin
</div>

</div>

<input
    id="codeInput"
    class="code"
    type="text"
    inputmode="numeric"
    autocomplete="one-time-code"
    maxlength="6"
    placeholder="••••••"
    aria-label="6 haneli doğrulama kodu"
>

<button
    class="btn"
    id="verifyBtn"
    type="button"
>
Doğrula
</button>

<button
    class="btn secondary"
    id="resendBtn"
    type="button"
>
Kodu yeniden gönder
</button>

<div
    id="message"
    class="msg"
></div>

<div
    id="timer"
    class="small"
></div>

</main>

</div>

<script>
(()=>{
"use strict";


/* =========================================================
   ELEMENTLER
========================================================= */

const codeInput =
    document.getElementById("codeInput");

const verifyBtn =
    document.getElementById("verifyBtn");

const resendBtn =
    document.getElementById("resendBtn");

const message =
    document.getElementById("message");

const emailValue =
    document.getElementById("emailValue");

const timer =
    document.getElementById("timer");

const backBtn =
    document.getElementById("backBtn");

const heading =
    document.getElementById("heading");

const sub =
    document.getElementById("sub");


/* =========================================================
   URL
========================================================= */

const params =
    new URLSearchParams(
        location.search
    );


/* =========================================================
   SESSION STORAGE
========================================================= */

const getS =
    key => {

        try{

            return (
                sessionStorage.getItem(key) ||
                ""
            );

        }catch{

            return "";

        }

    };


const setS =
    (key,value) => {

        try{

            sessionStorage.setItem(
                key,
                String(value ?? "")
            );

        }catch{}

    };


/* =========================================================
   LOCAL STORAGE
========================================================= */

const getL =
    key => {

        try{

            return (
                localStorage.getItem(key) ||
                ""
            );

        }catch{

            return "";

        }

    };


const setL =
    (key,value) => {

        try{

            localStorage.setItem(
                key,
                String(value ?? "")
            );

        }catch{}

    };


/* =========================================================
   İLK DOLU DEĞER
========================================================= */

const first =
    (...values) =>

        values.find(
            value =>
                value !== undefined &&
                value !== null &&
                String(value).trim() !== ""
        ) || "";


/* =========================================================
   MOD
========================================================= */

const mode =
    first(
        params.get("mode"),
        getS("minegram_verification_mode"),
        "email"
    )
    .trim()
    .toLowerCase();


const isRegister =
    mode === "register";


/* =========================================================
   IDENTIFIER
========================================================= */

const identifier =
    first(
        params.get("identifier"),
        params.get("username"),
        getS("minegram_recovery_identifier"),
        getS("minegram_register_username")
    )
    .trim()
    .replace(/^@/,"");


/* =========================================================
   EMAIL
========================================================= */

const email =
    first(
        params.get("email"),
        getS(
            isRegister
                ? "minegram_register_email"
                : "minegram_recovery_email"
        )
    )
    .trim()
    .toLowerCase();


/* =========================================================
   REGISTRATION ID
========================================================= */

const registrationId =
    first(
        params.get("registrationId"),
        params.get("registration_id"),
        getS("minegram_register_registration_id")
    )
    .trim();


/* =========================================================
   ŞİFRE
========================================================= */

const password =
    getS(
        "minegram_register_password"
    );


/* =========================================================
   EKRAN
========================================================= */

emailValue.textContent =
    email ||
    "E-posta adresin";


if(isRegister){

    heading.textContent =
        "E-postanı doğrula";

    sub.textContent =
        "Minegram hesabını oluşturmak için e-posta adresine gönderdiğimiz 6 haneli kodu gir.";

}


/* =========================================================
   MESAJ
========================================================= */

function show(
    text,
    type=""
){

    message.textContent =
        String(text || "");

    message.className =
        "msg" +
        (
            type
                ? " " + type
                : ""
        );

}


/* =========================================================
   TOKEN BUL
========================================================= */

function extractToken(data){

    if(!data){

        return "";

    }


    const candidates = [

        data.access_token,
        data.accessToken,
        data.token,

        data.supabaseAccessToken,

        data.session?.access_token,
        data.session?.accessToken,
        data.session?.token,

        data.data?.access_token,
        data.data?.accessToken,
        data.data?.token,

        data.data?.session?.access_token,
        data.data?.session?.accessToken,
        data.data?.session?.token,

        data.auth?.access_token,
        data.auth?.accessToken,
        data.auth?.token,

        data.data?.auth?.access_token,
        data.data?.auth?.accessToken,
        data.data?.auth?.token,

        data.result?.access_token,
        data.result?.accessToken,
        data.result?.token,

        data.result?.session?.access_token,
        data.result?.session?.accessToken,
        data.result?.session?.token

    ];


    for(
        const value
        of candidates
    ){

        if(
            value &&
            typeof value === "string" &&
            value.trim() &&
            value !== "null" &&
            value !== "undefined"
        ){

            return value.trim();

        }

    }


    return "";

}


/* =========================================================
   REFRESH TOKEN
========================================================= */

function extractRefreshToken(data){

    if(!data){

        return "";

    }


    return first(

        data.refresh_token,
        data.refreshToken,

        data.session?.refresh_token,
        data.session?.refreshToken,

        data.data?.refresh_token,
        data.data?.refreshToken,

        data.data?.session?.refresh_token,
        data.data?.session?.refreshToken,

        data.auth?.refresh_token,
        data.auth?.refreshToken,

        data.data?.auth?.refresh_token,
        data.data?.auth?.refreshToken

    );

}


/* =========================================================
   USER BUL
========================================================= */

function extractUser(data){

    if(!data){

        return null;

    }


    return (

        data.user ||

        data.profile ||

        data.account ||

        data.data?.user ||

        data.data?.profile ||

        data.data?.account ||

        data.result?.user ||

        data.result?.profile ||

        data.result?.account ||

        null

    );

}


/* =========================================================
   PROFILE BUL
========================================================= */

function extractProfile(data){

    if(!data){

        return null;

    }


    return (

        data.profile ||

        data.data?.profile ||

        data.result?.profile ||

        null

    );

}


/* =========================================================
   KAYIT BAŞARILI CEVABINDAN OTURUM KUR
========================================================= */

function saveRegisterSession(data){

    console.log(
        "[MINEGRAM REGISTER VERIFY RESPONSE]",
        data
    );


    const token =
        extractToken(data);


    const refreshToken =
        extractRefreshToken(data);


    const user =
        extractUser(data);


    const profile =
        extractProfile(data);


    /*
    ========================================================
    TOKEN
    ========================================================
    */

    if(token){

        setL(
            "minegram_token",
            token
        );

        setL(
            "minegram_supabase_token",
            token
        );

        setL(
            "minegram_access_token",
            token
        );

        setL(
            "access_token",
            token
        );

    }


    /*
    ========================================================
    REFRESH TOKEN
    ========================================================
    */

    if(refreshToken){

        setL(
            "minegram_refresh_token",
            refreshToken
        );

    }


    /*
    ========================================================
    USER
    ========================================================
    */

    if(user){

        setL(
            "minegram_user",
            JSON.stringify(user)
        );


        if(user.id != null){

            setL(
                "minegram_user_id",
                user.id
            );

        }


        if(user.username){

            setL(
                "minegram_username",
                user.username
            );

        }


        if(user.email){

            setL(
                "minegram_email",
                user.email
            );

        }

    }


    /*
    ========================================================
    PROFILE
    ========================================================
    */

    if(profile){

        setL(
            "minegram_profile",
            JSON.stringify(profile)
        );

    }


    /*
    ========================================================
    YEDEK KULLANICI BİLGİLERİ
    ========================================================
    */

    const finalUsername =
        first(

            user?.username,
            profile?.username,

            data.username,
            data.data?.username,
            data.result?.username,

            identifier

        );


    const finalEmail =
        first(

            user?.email,
            profile?.email,

            data.email,
            data.authEmail,

            data.data?.email,
            data.data?.authEmail,

            data.result?.email,
            data.result?.authEmail,

            email

        );


    if(finalUsername){

        setL(
            "minegram_username",
            finalUsername
        );

    }


    if(finalEmail){

        setL(
            "minegram_email",
            finalEmail
        );

    }


    /*
    ========================================================
    DOĞRULAMA DURUMU
    ========================================================
    */

    setL(
        "minegram_verified",
        "true"
    );

    setL(
        "minegram_email_verified",
        "true"
    );


    setS(
        "minegram_register_verified",
        "true"
    );


    console.log(
        "[MINEGRAM REGISTER] Token:",
        !!token
    );

    console.log(
        "[MINEGRAM REGISTER] Username:",
        finalUsername
    );

    console.log(
        "[MINEGRAM REGISTER] Email:",
        finalEmail
    );


    return {
        token,
        refreshToken,
        user,
        profile,
        username:finalUsername,
        email:finalEmail
    };

}


/* =========================================================
   TOKEN YOKSA KAYIT SONRASI LOGIN YAP
========================================================= */

async function createSessionAfterRegister(){

    /*
    Eğer verify endpoint token döndürdüyse
    zaten saveRegisterSession bunu kaydetti.

    Token dönmediyse ikinci bir login isteği
    sadece kayıt için kullanılır.
    */

    const existingToken =
        getL("minegram_token");


    if(existingToken){

        return existingToken;

    }


    if(
        !email ||
        !password
    ){

        console.warn(
            "[MINEGRAM REGISTER] Token dönmedi ve kayıt şifresi bulunamadı."
        );

        return "";

    }


    try{

        const loginResponse =
            await api(
                "/api/login",
                {
                    method:"POST",

                    body:
                        JSON.stringify({

                            identifier:email,

                            username:identifier,

                            email:email,

                            password:password

                        })

                }
            );


        console.log(
            "[MINEGRAM REGISTER AUTO LOGIN]",
            loginResponse
        );


        const session =
            saveRegisterSession(
                loginResponse
            );


        return session.token || "";

    }catch(error){

        console.error(
            "[MINEGRAM REGISTER AUTO LOGIN ERROR]",
            error
        );

        return "";

    }

}


/* =========================================================
   API
========================================================= */

async function api(
    path,
    options={}
){

    const response =
        await fetch(
            path,
            {

                ...options,

                headers:{
                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json",

                    ...(options.headers || {})

                },

                credentials:
                    "include",

                cache:
                    "no-store"

            }
        );


    const raw =
        await response.text();


    let data = {};


    try{

        data =
            raw
                ? JSON.parse(raw)
                : {};

    }catch{

        data = {
            error:
                raw ||
                "Sunucudan geçersiz cevap geldi."
        };

    }


    if(!response.ok){

        throw new Error(

            data.error ||

            data.message ||

            "Sunucu hatası."

        );

    }


    return data;

}


/* =========================================================
   TIMER
========================================================= */

let remaining = 60;

let timerId = null;

let resendLocked = true;


function startTimer(
    seconds=60
){

    remaining =
        Number(seconds) ||
        60;

    resendLocked =
        true;

    resendBtn.disabled =
        true;

    clearInterval(
        timerId
    );


    const tick =
        ()=>{

            if(remaining <= 0){

                clearInterval(
                    timerId
                );

                timerId =
                    null;

                resendLocked =
                    false;

                resendBtn.disabled =
                    false;

                resendBtn.textContent =
                    "Kodu yeniden gönder";

                timer.textContent =
                    "";

                return;

            }


            timer.textContent =
                "Yeni kod göndermek için " +
                remaining +
                " saniye bekle.";


            resendBtn.textContent =
                "Tekrar gönder (" +
                remaining +
                ")";


            remaining--;

        };


    tick();


    timerId =
        setInterval(
            tick,
            1000
        );

}


/* =========================================================
   KAYIT DOĞRULAMA
========================================================= */

async function verifyRegister(){

    const code =
        String(
            codeInput.value || ""
        )
        .replace(/\D/g,"")
        .slice(0,6);


    codeInput.value =
        code;


    if(!/^\d{6}$/.test(code)){

        show(
            "6 haneli doğrulama kodunu gir.",
            "error"
        );

        return;

    }


    if(!registrationId){

        show(
            "Kayıt doğrulama oturumu bulunamadı. Lütfen kayıt işlemine baştan başla.",
            "error"
        );

        return;

    }


    verifyBtn.disabled =
        true;

    resendBtn.disabled =
        true;

    verifyBtn.innerHTML =
        '<span class="spinner"></span>Doğrulanıyor...';


    show(
        "Doğrulama kodu kontrol ediliyor..."
    );


    try{

        /*
        ====================================================
        KODU DOĞRULA
        ====================================================
        */

        const data =
            await api(
                "/api/register/verify",
                {

                    method:"POST",

                    body:
                        JSON.stringify({

                            registrationId:
                                registrationId,

                            registration_id:
                                registrationId,

                            email:
                                email,

                            username:
                                identifier,

                            code:
                                code,

                            password:
                                password

                        })

                }
            );


        console.log(
            "[MINEGRAM REGISTER VERIFY]",
            data
        );


        if(
            data.ok === false
        ){

            throw new Error(
                data.error ||
                data.message ||
                "Doğrulama başarısız."
            );

        }


        /*
        ====================================================
        OTURUMU KUR
        ====================================================
        */

        const session =
            saveRegisterSession(
                data
            );


        /*
        ====================================================
        TOKEN YOKSA OTOMATİK LOGIN
        ====================================================
        */

        let token =
            session.token ||
            getL("minegram_token");


        if(!token){

            token =
                await createSessionAfterRegister();

        }


        /*
        ====================================================
        TOKEN KONTROLÜ
        ====================================================
        */

        if(!token){

            /*
            Burada artık index.html'e gidip
            "Oturum açman gerekiyor" göstermiyoruz.

            Kullanıcıya gerçek problemi söylüyoruz.
            */

            throw new Error(
                "Hesabın doğrulandı ancak oturum oluşturulamadı. Lütfen tekrar giriş yap."
            );

        }


        /*
        ====================================================
        BAŞARILI
        ====================================================
        */

        show(
            "Hesabın başarıyla doğrulandı. Minegram açılıyor...",
            "success"
        );


        verifyBtn.textContent =
            "Minegram açılıyor...";


        /*
        ====================================================
        KAYIT BİLGİLERİNİ TEMİZLE
        ====================================================
        */

        try{

            sessionStorage.removeItem(
                "minegram_register_password"
            );

            sessionStorage.removeItem(
                "minegram_register_registration_id"
            );

            sessionStorage.removeItem(
                "minegram_register_verified"
            );

        }catch{}


        /*
        ====================================================
        INDEX
        ====================================================
        */

        setTimeout(
            ()=>{

                window.location.replace(
                    "/index.html"
                );

            },
            500
        );


    }catch(error){

        console.error(
            "[MINEGRAM REGISTER VERIFY ERROR]",
            error
        );


        show(
            error?.message ||
            "Kod doğrulanamadı. Lütfen tekrar dene.",
            "error"
        );


        verifyBtn.disabled =
            false;

        resendBtn.disabled =
            false;

        verifyBtn.textContent =
            "Doğrula";

    }

}


/* =========================================================
   ŞİFRE SIFIRLAMA DOĞRULAMA
========================================================= */

async function verifyReset(){

    const code =
        String(
            codeInput.value || ""
        )
        .replace(/\D/g,"")
        .slice(0,6);


    codeInput.value =
        code;


    if(!/^\d{6}$/.test(code)){

        show(
            "6 haneli doğrulama kodunu gir.",
            "error"
        );

        return;

    }


    verifyBtn.disabled =
        true;

    resendBtn.disabled =
        true;

    verifyBtn.innerHTML =
        '<span class="spinner"></span>Doğrulanıyor...';


    show(
        "Doğrulama kodu kontrol ediliyor..."
    );


    try{

        const data =
            await api(
                "/api/forgot/verify",
                {

                    method:"POST",

                    body:
                        JSON.stringify({

                            identifier:
                                identifier,

                            email:
                                email,

                            mode:
                                mode,

                            code:
                                code

                        })

                }
            );


        const token =
            first(

                data.resetToken,

                data.reset_token,

                data.token,

                data.recoveryToken,

                data.data?.resetToken,

                data.data?.reset_token,

                data.data?.token,

                data.data?.recoveryToken

            );


        if(!token){

            throw new Error(
                "Kod doğrulandı ancak şifre sıfırlama anahtarı alınamadı."
            );

        }


        setS(
            "minegram_password_reset_token",
            token
        );

        setS(
            "minegram_reset_token",
            token
        );

        setS(
            "resetToken",
            token
        );


        show(
            "Kod doğrulandı. Yeni şifre ekranına gidiyorsun...",
            "success"
        );


        const url =
            new URL(
                "./yeni-sifre.html",
                location.href
            );


        url.searchParams.set(
            "token",
            token
        );


        if(identifier){

            url.searchParams.set(
                "identifier",
                identifier
            );

        }


        if(email){

            url.searchParams.set(
                "email",
                email
            );

        }


        setTimeout(
            ()=>{

                location.replace(
                    url.href
                );

            },
            500
        );


    }catch(error){

        console.error(
            "[MINEGRAM RESET VERIFY ERROR]",
            error
        );


        show(
            error?.message ||
            "Kod doğrulanamadı. Lütfen tekrar dene.",
            "error"
        );


        verifyBtn.disabled =
            false;

        resendBtn.disabled =
            false;

        verifyBtn.textContent =
            "Doğrula";

    }

}


/* =========================================================
   GENEL DOĞRULAMA
========================================================= */

async function verify(){

    if(isRegister){

        await verifyRegister();

    }else{

        await verifyReset();

    }

}


/* =========================================================
   YENİ KOD
========================================================= */

async function resend(){

    if(resendLocked){

        return;

    }


    resendLocked =
        true;

    resendBtn.disabled =
        true;

    resendBtn.textContent =
        "Gönderiliyor...";


    show(
        "Yeni doğrulama kodu gönderiliyor..."
    );


    try{

        let data;


        if(isRegister){

            data =
                await api(
                    "/api/register/resend",
                    {

                        method:"POST",

                        body:
                            JSON.stringify({

                                registrationId:
                                    registrationId,

                                email:
                                    email

                            })

                    }
                );

        }else{

            data =
                await api(
                    "/api/forgot/start",
                    {

                        method:"POST",

                        body:
                            JSON.stringify({

                                identifier:
                                    identifier ||
                                    email,

                                email:
                                    email,

                                mode:
                                    mode ||
                                    "email"

                            })

                    }
                );

        }


        if(data?.email){

            setS(
                isRegister
                    ? "minegram_register_email"
                    : "minegram_recovery_email",

                data.email
            );


            emailValue.textContent =
                data.email;

        }


        show(
            data?.message ||
            "Yeni doğrulama kodu gönderildi.",
            "success"
        );


        codeInput.value =
            "";

        codeInput.focus();


        startTimer(
            60
        );


    }catch(error){

        console.error(
            "[MINEGRAM RESEND ERROR]",
            error
        );


        show(
            error.message ||
            "Yeni kod gönderilemedi.",
            "error"
        );


        resendLocked =
            false;

        resendBtn.disabled =
            false;

        resendBtn.textContent =
            "Kodu yeniden gönder";

    }

}


/* =========================================================
   GERİ
========================================================= */

backBtn.onclick =
    ()=>{

        if(isRegister){

            location.href =
                "/sifre-olustur.html";

        }else{

            location.href =
                "./hesaplarini-bulduk.html";

        }

    };


/* =========================================================
   BUTONLAR
========================================================= */

verifyBtn.onclick =
    verify;

resendBtn.onclick =
    resend;


/* =========================================================
   KOD INPUT
========================================================= */

codeInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,6);


        if(
            this.value.length === 6 &&
            !verifyBtn.disabled
        ){

            verify();

        }

    }
);


/* =========================================================
   ENTER
========================================================= */

codeInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();


            if(
                codeInput.value.length === 6 &&
                !verifyBtn.disabled
            ){

                verify();

            }

        }

    }
);


/* =========================================================
   SAYFA AÇILIŞI
========================================================= */

if(
    !isRegister &&
    !identifier &&
    !email
){

    show(
        "Şifre sıfırlama bilgileri bulunamadı. Lütfen işlemi yeniden başlat.",
        "error"
    );


    verifyBtn.disabled =
        true;

    resendBtn.disabled =
        true;

}else{

    show(
        isRegister
            ? "E-postana gönderilen 6 haneli kodu gir."
            : "E-postana gönderilen 6 haneli kodu gir.",
        "success"
    );


    codeInput.focus();


    startTimer(
        60
    );

}


console.log(
    "[MINEGRAM] Hesap doğrulama sayfası hazır."
);

console.log(
    "[MINEGRAM] Register:",
    isRegister
);

console.log(
    "[MINEGRAM] Registration ID:",
    registrationId
);

})();
</script>
