<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>Hesabını doğrula - Minegram</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:365px;
    margin-top:90px;
    text-align:center;
}

.header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:25px;
}

.back{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    margin-right:8px;
}

.header-title{
    font-size:16px;
    font-weight:700;
}

.title{
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 12px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.45;
    margin:0 0 22px;
}

.email-box{
    width:100%;
    min-height:44px;
    padding:13px 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#050505;
    color:#fff;
    font-size:12px;
    word-break:break-all;
}

.status{
    min-height:20px;
    margin-top:15px;
    font-size:12px;
    line-height:1.45;
    color:#ff4d4d;
}

.status.success{
    color:#35c759;
}

.status.loading{
    color:#aaa;
}

.bottom{
    display:flex;
    gap:9px;
    width:100%;
    margin-top:25px;
}

.action{
    width:50%;
    height:42px;
    border-radius:22px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.back-btn{
    background:#000;
    border:1px solid #555;
    color:#0095f6;
}

.verify{
    background:#2d80bd;
    border:0;
    color:#000;
}

.verify:hover{
    background:#348dca;
}

.verify:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.resend{
    width:100%;
    height:38px;
    margin-top:10px;
    border:0;
    background:transparent;
    color:#0095f6;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.resend:disabled{
    color:#555;
    cursor:not-allowed;
}

@media(max-width:600px){

    .box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:60px;
    }

    .header{
        margin-bottom:22px;
    }

    .header-title{
        font-size:15px;
    }

    .title{
        font-size:21px;
    }

    .description{
        font-size:12px;
    }

    .email-box{
        font-size:12px;
    }

    .action{
        height:42px;
        font-size:12px;
    }

    .status{
        font-size:12px;
    }
}

</style>

</head>

<body>

<div class="page">

<div class="box">

<header class="header">

<div
    class="back"
    id="backButton"
    aria-label="Geri"
    role="button"
    tabindex="0"
>
    ‹
</div>

<div class="header-title">
    Kayıt ol
</div>

</header>


<h1 class="title">
    Hesabını doğrula
</h1>


<p class="description">
    E-posta adresine gönderilen doğrulama<br>
    bağlantısına tıkla.
</p>


<div
    id="emailBox"
    class="email-box"
>
    E-posta yükleniyor...
</div>


<div
    id="status"
    class="status loading"
>
    Firebase hazırlanıyor...
</div>


<div class="bottom">

<button
    id="changeButton"
    class="action back-btn"
    type="button"
>
    İletişim bilgini değiştir
</button>


<button
    id="verifyButton"
    class="action verify"
    type="button"
    disabled
>
    Kontrol et
</button>

</div>


<button
    id="resendButton"
    class="resend"
    type="button"
    disabled
>
    Doğrulama e-postasını tekrar gönder
</button>


</div>

</div>


<script type="module">

"use strict";


/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    setPersistence,
    browserLocalPersistence,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    sendEmailVerification,
    reload
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain:
        "mim-ea133.firebaseapp.com",

    databaseURL:
        "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "mim-ea133",

    storageBucket:
        "mim-ea133.firebasestorage.app",

    messagingSenderId:
        "303525353436",

    appId:
        "1:303525353436:web:082fc090b5025e19942119",

    measurementId:
        "G-K962QE5P1R"
};


/* =====================================================
   FIREBASE BAŞLAT
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =====================================================
   ELEMENTLER
===================================================== */

const emailBox =
    document.getElementById("emailBox");

const status =
    document.getElementById("status");

const verifyButton =
    document.getElementById("verifyButton");

const resendButton =
    document.getElementById("resendButton");

const changeButton =
    document.getElementById("changeButton");

const backButton =
    document.getElementById("backButton");


/* =====================================================
   URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


/* =====================================================
   KAYIT BİLGİLERİ
===================================================== */

const username =
    (
        params.get("username") ||
        sessionStorage.getItem(
            "minegram_register_username"
        ) ||
        ""
    )
    .trim()
    .replace(/^@/, "")
    .toLowerCase();


const email =
    (
        params.get("email") ||
        sessionStorage.getItem(
            "minegram_register_email"
        ) ||
        ""
    )
    .trim();


const password =
    sessionStorage.getItem(
        "minegram_register_password"
    ) || "";


/* =====================================================
   EMAIL GÖSTER
===================================================== */

if(email){

    emailBox.textContent =
        email;

}
else{

    emailBox.textContent =
        "E-posta adresi bulunamadı.";

}


/* =====================================================
   DURUM MESAJI
===================================================== */

function showStatus(
    text,
    type = ""
){

    status.textContent =
        text || "";

    status.className =
        "status";

    if(type){

        status.classList.add(type);

    }

}


/* =====================================================
   GERİ
===================================================== */

function goBack(){

    let url =
        "./iletisim-bilgileri.html";

    if(username){

        url +=
            "?username=" +
            encodeURIComponent(username);

    }

    window.location.href =
        url;

}


backButton.addEventListener(
    "click",
    goBack
);


changeButton.addEventListener(
    "click",
    goBack
);


backButton.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            goBack();

        }

    }
);


/* =====================================================
   FIREBASE HESABI HAZIRLA
===================================================== */

async function prepareFirebaseUser(){

    if(!email){

        showStatus(
            "E-posta adresi bulunamadı."
        );

        return null;

    }


    if(!password){

        showStatus(
            "Kayıt şifresi bulunamadı. Kayıt işlemini tekrar başlat."
        );

        return null;

    }


    showStatus(
        "Firebase hesabı hazırlanıyor...",
        "loading"
    );


    try{

        /*
         * Önce mevcut oturumu kontrol et.
         */

        if(auth.currentUser){

            console.log(
                "[MINEGRAM] Mevcut Firebase oturumu bulundu:",
                auth.currentUser.uid
            );

            return auth.currentUser;

        }


        /*
         * Önce Firebase'de yeni kullanıcı oluşturmayı dene.
         */

        console.log(
            "[MINEGRAM] Firebase hesabı oluşturuluyor..."
        );


        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        console.log(
            "[MINEGRAM] Firebase hesabı oluşturuldu:",
            result.user.uid
        );


        sessionStorage.setItem(
            "minegram_uid",
            result.user.uid
        );


        return result.user;

    }
    catch(error){

        console.error(
            "[MINEGRAM] Hesap oluşturma hatası:",
            error
        );


        /*
         * Hesap zaten varsa giriş yap.
         */

        if(
            error.code ===
            "auth/email-already-in-use"
        ){

            try{

                showStatus(
                    "Mevcut hesapla giriş yapılıyor...",
                    "loading"
                );


                const result =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                console.log(
                    "[MINEGRAM] Firebase giriş başarılı:",
                    result.user.uid
                );


                sessionStorage.setItem(
                    "minegram_uid",
                    result.user.uid
                );


                return result.user;

            }
            catch(loginError){

                console.error(
                    "[MINEGRAM] Giriş hatası:",
                    loginError
                );


                if(
                    loginError.code ===
                    "auth/invalid-credential"
                ){

                    showStatus(
                        "Bu e-posta için kayıtlı şifre farklı. Kayıt işlemini yeniden başlat."
                    );

                }
                else if(
                    loginError.code ===
                    "auth/wrong-password"
                ){

                    showStatus(
                        "Şifre yanlış."
                    );

                }
                else{

                    showStatus(
                        "Firebase giriş hatası: " +
                        (
                            loginError.message ||
                            loginError.code ||
                            "Bilinmeyen hata"
                        )
                    );

                }


                return null;

            }

        }


        if(
            error.code ===
            "auth/invalid-email"
        ){

            showStatus(
                "Geçersiz e-posta adresi."
            );

        }
        else if(
            error.code ===
            "auth/weak-password"
        ){

            showStatus(
                "Şifre çok zayıf. En az 6 karakter kullan."
            );

        }
        else{

            showStatus(
                "Firebase hesabı oluşturulamadı: " +
                (
                    error.message ||
                    error.code ||
                    "Bilinmeyen hata"
                )
            );

        }


        return null;

    }

}


/* =====================================================
   DOĞRULAMA MAILİ GÖNDER
===================================================== */

async function sendVerificationEmail(user){

    if(!user){

        return false;

    }


    /*
     * Zaten doğrulanmışsa mail göndermeye gerek yok.
     */

    if(user.emailVerified){

        showStatus(
            "Hesabın zaten doğrulanmış.",
            "success"
        );

        verifyButton.disabled =
            false;

        resendButton.disabled =
            false;

        return true;

    }


    try{

        showStatus(
            "Doğrulama e-postası gönderiliyor...",
            "loading"
        );


        await sendEmailVerification(
            user
        );


        showStatus(
            "Doğrulama e-postası gönderildi. E-postanı kontrol et ve bağlantıya tıkla.",
            "success"
        );


        verifyButton.disabled =
            false;


        resendButton.disabled =
            false;


        console.log(
            "[MINEGRAM] Doğrulama maili gönderildi."
        );


        return true;

    }
    catch(error){

        console.error(
            "[MINEGRAM] Mail gönderme hatası:",
            error
        );


        if(
            error.code ===
            "auth/too-many-requests"
        ){

            showStatus(
                "Çok fazla istek gönderildi. Biraz sonra tekrar dene."
            );

        }
        else if(
            error.code ===
            "auth/network-request-failed"
        ){

            showStatus(
                "İnternet bağlantısı nedeniyle e-posta gönderilemedi."
            );

        }
        else{

            showStatus(
                "Doğrulama e-postası gönderilemedi: " +
                (
                    error.message ||
                    error.code ||
                    "Bilinmeyen hata"
                )
            );

        }


        return false;

    }

}


/* =====================================================
   FIREBASE BAŞLANGIÇ
===================================================== */

async function start(){

    try{

        /*
         * Oturumu tarayıcıda kalıcı yap.
         */

        await setPersistence(
            auth,
            browserLocalPersistence
        );


        console.log(
            "[MINEGRAM] Firebase persistence hazır."
        );


        /*
         * Firebase hesabını oluştur veya giriş yap.
         */

        const user =
            await prepareFirebaseUser();


        if(!user){

            return;

        }


        /*
         * Bilgileri sakla.
         */

        sessionStorage.setItem(
            "minegram_uid",
            user.uid
        );


        if(user.email){

            sessionStorage.setItem(
                "minegram_register_email",
                user.email
            );

        }


        if(username){

            sessionStorage.setItem(
                "minegram_register_username",
                username
            );

        }


        emailBox.textContent =
            user.email || email;


        /*
         * Kullanıcı zaten doğrulanmış mı?
         */

        if(user.emailVerified){

            showStatus(
                "Hesabın zaten doğrulanmış. Minegram'a giriyorsun...",
                "success"
            );


            verifyButton.disabled =
                false;


            verifyButton.textContent =
                "Doğrulandı";


            resendButton.disabled =
                true;


            setTimeout(
                function(){

                    window.location.href =
                        "./index.html";

                },
                800
            );


            return;

        }


        /*
         * Mail gönder.
         */

        await sendVerificationEmail(
            user
        );

    }
    catch(error){

        console.error(
            "[MINEGRAM] Başlangıç hatası:",
            error
        );


        showStatus(
            "Firebase başlatılamadı: " +
            (
                error.message ||
                error.code ||
                "Bilinmeyen hata"
            )
        );

    }

}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    function(user){

        console.log(
            "[MINEGRAM] Auth durumu:",
            user
                ? user.uid
                : "OTURUM YOK"
        );


        if(user){

            sessionStorage.setItem(
                "minegram_uid",
                user.uid
            );

        }

    }
);


/* =====================================================
   KONTROL ET
===================================================== */

verifyButton.addEventListener(
    "click",
    async function(){

        const user =
            auth.currentUser;


        if(!user){

            showStatus(
                "Firebase oturumu bulunamadı. Lütfen sayfayı yenile veya kayıt işlemini tekrar başlat."
            );

            return;

        }


        verifyButton.disabled =
            true;


        verifyButton.textContent =
            "Kontrol ediliyor...";


        try{

            /*
             * Firebase kullanıcı bilgisini yenile.
             */

            await reload(
                user
            );


            const updatedUser =
                auth.currentUser;


            if(
                updatedUser &&
                updatedUser.emailVerified
            ){

                showStatus(
                    "Hesabın doğrulandı. Minegram'a giriyorsun...",
                    "success"
                );


                verifyButton.textContent =
                    "Doğrulandı";


                sessionStorage.setItem(
                    "minegram_email_verified",
                    "true"
                );


                setTimeout(
                    function(){

                        window.location.href =
                            "./index.html";

                    },
                    800
                );

            }
            else{

                showStatus(
                    "E-posta henüz doğrulanmamış. E-postandaki doğrulama bağlantısına tıkla."
                );


                verifyButton.disabled =
                    false;


                verifyButton.textContent =
                    "Kontrol et";

            }

        }
        catch(error){

            console.error(
                "[MINEGRAM] Kontrol hatası:",
                error
            );


            showStatus(
                "Doğrulama kontrol edilemedi. İnternet bağlantını kontrol et."
            );


            verifyButton.disabled =
                false;


            verifyButton.textContent =
                "Kontrol et";

        }

    }
);


/* =====================================================
   TEKRAR GÖNDER
===================================================== */

resendButton.addEventListener(
    "click",
    async function(){

        const user =
            auth.currentUser;


        if(!user){

            showStatus(
                "Firebase oturumu bulunamadı."
            );

            return;

        }


        resendButton.disabled =
            true;


        resendButton.textContent =
            "Gönderiliyor...";


        const success =
            await sendVerificationEmail(
                user
            );


        if(!success){

            resendButton.disabled =
                false;


            resendButton.textContent =
                "Doğrulama e-postasını tekrar gönder";

            return;

        }


        let seconds =
            30;


        resendButton.textContent =
            "Tekrar gönder (" +
            seconds +
            ")";


        const timer =
            setInterval(
                function(){

                    seconds--;


                    resendButton.textContent =
                        "Tekrar gönder (" +
                        seconds +
                        ")";


                    if(seconds <= 0){

                        clearInterval(
                            timer
                        );


                        resendButton.disabled =
                            false;


                        resendButton.textContent =
                            "Doğrulama e-postasını tekrar gönder";

                    }

                },
                1000
            );

    }
);


/* =====================================================
   SAYFA BAŞLAT
===================================================== */

console.log(
    "[MINEGRAM] hesap-doğrulama.html başladı."
);

console.log(
    "[MINEGRAM] Username:",
    username
);

console.log(
    "[MINEGRAM] Email:",
    email
);

console.log(
    "[MINEGRAM] Password mevcut:",
    password
        ? "EVET"
        : "HAYIR"
);


/*
 * Firebase işlemini başlat.
 */

start();

</script>

</body>
</html>
