<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
name="theme-color"
content="#000000"
>

<title>Hesabını doğrula - Minegram</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:365px;
    margin-top:90px;
    text-align:center;
}

.header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:25px;
}

.back{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    margin-right:8px;
}

.header-title{
    font-size:16px;
    font-weight:700;
}

.title{
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 12px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.45;
    margin:0 0 22px;
}

.email-box{
    width:100%;
    min-height:44px;
    padding:13px 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#050505;
    color:#fff;
    font-size:12px;
    word-break:break-all;
}

.code-box{
    width:100%;
    height:50px;
    margin-top:12px;
    padding:0 14px;
    border:1px solid #292929;
    border-radius:7px;
    outline:none;
    background:#050505;
    color:#fff;
    text-align:center;
    font-size:22px;
    font-weight:700;
    letter-spacing:8px;
}

.code-box:focus{
    border-color:#0095f6;
}

.code-box::placeholder{
    color:#555;
    letter-spacing:2px;
    font-size:13px;
}

.status{
    min-height:20px;
    margin-top:15px;
    font-size:12px;
    line-height:1.45;
    color:#ff4d4d;
}

.status.success{
    color:#35c759;
}

.status.loading{
    color:#aaa;
}

.bottom{
    display:flex;
    gap:9px;
    width:100%;
    margin-top:25px;
}

.action{
    width:50%;
    height:42px;
    border-radius:22px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.back-btn{
    background:#000;
    border:1px solid #555;
    color:#0095f6;
}

.verify{
    background:#2d80bd;
    border:0;
    color:#000;
}

.verify:hover{
    background:#348dca;
}

.verify:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.resend{
    width:100%;
    height:38px;
    margin-top:10px;
    border:0;
    background:transparent;
    color:#0095f6;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.resend:disabled{
    color:#555;
    cursor:not-allowed;
}

@media(max-width:600px){

    .box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:60px;
    }

    .header{
        margin-bottom:22px;
    }

    .header-title{
        font-size:15px;
    }

    .title{
        font-size:21px;
    }

    .description{
        font-size:12px;
    }

    .email-box{
        font-size:12px;
    }

    .code-box{
        height:48px;
        font-size:20px;
    }

    .action{
        height:42px;
        font-size:12px;
    }

    .status{
        font-size:12px;
    }

}

</style>

</head>

<body>

<div class="page">

<div class="box">

<header class="header">

<div
    class="back"
    id="backButton"
    aria-label="Geri"
    role="button"
    tabindex="0"
>
    ‹
</div>

<div class="header-title">
    Şifre değiştirme
</div>

</header>


<h1 class="title">
    Hesabını doğrula
</h1>


<p class="description">
    E-posta adresine gönderilen 6 haneli<br>
    doğrulama kodunu aşağıya yaz.
</p>


<div
    id="emailBox"
    class="email-box"
>
    E-posta yükleniyor...
</div>


<input
    id="codeInput"
    class="code-box"
    type="text"
    inputmode="numeric"
    autocomplete="one-time-code"
    maxlength="6"
    placeholder="6 haneli kod"
>


<div
    id="status"
    class="status loading"
>
    Doğrulama hazırlanıyor...
</div>


<div class="bottom">

<button
    id="changeButton"
    class="action back-btn"
    type="button"
>
    Hesabı değiştir
</button>


<button
    id="verifyButton"
    class="action verify"
    type="button"
    disabled
>
    Kontrol et
</button>

</div>


<button
    id="resendButton"
    class="resend"
    type="button"
    disabled
>
    Doğrulama kodunu tekrar gönder
</button>


</div>
</div>


<script>

"use strict";


/* =====================================================
   ELEMENTLER
===================================================== */

const emailBox =
    document.getElementById("emailBox");

const codeInput =
    document.getElementById("codeInput");

const status =
    document.getElementById("status");

const verifyButton =
    document.getElementById("verifyButton");

const resendButton =
    document.getElementById("resendButton");

const changeButton =
    document.getElementById("changeButton");

const backButton =
    document.getElementById("backButton");


/* =====================================================
   URL PARAMETRELERİ
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


/* =====================================================
   HESAP BİLGİLERİ
===================================================== */

const identifier =
    (
        params.get("identifier") ||
        params.get("username") ||
        sessionStorage.getItem(
            "minegram_recovery_identifier"
        ) ||
        ""
    )
    .trim()
    .replace(/^@/, "")
    .toLowerCase();


const mode =
    (
        params.get("mode") ||
        sessionStorage.getItem(
            "minegram_recovery_mode"
        ) ||
        "username"
    )
    .trim()
    .toLowerCase();


const email =
    (
        params.get("email") ||
        sessionStorage.getItem(
            "minegram_recovery_email"
        ) ||
        ""
    )
    .trim()
    .toLowerCase();


/* =====================================================
   BİLGİLERİ SESSION'A KAYDET
===================================================== */

if(identifier){

    sessionStorage.setItem(
        "minegram_recovery_identifier",
        identifier
    );

}

if(email){

    sessionStorage.setItem(
        "minegram_recovery_email",
        email
    );

}

sessionStorage.setItem(
    "minegram_recovery_mode",
    mode
);


/* =====================================================
   EMAIL GÖSTER
===================================================== */

if(email){

    emailBox.textContent =
        email;

}else{

    emailBox.textContent =
        "E-posta adresi bulunamadı.";

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    text,
    type = ""
){

    status.textContent =
        text || "";

    status.className =
        "status";

    if(type){

        status.classList.add(
            type
        );

    }

}


/* =====================================================
   API
===================================================== */

async function api(
    url,
    options = {}
){

    try{

        const response =
            await fetch(
                url,
                {
                    ...options,

                    headers:{
                        "Content-Type":
                            "application/json",

                        ...(options.headers || {})
                    }
                }
            );


        const text =
            await response.text();


        let data = {};


        try{

            data =
                text
                    ? JSON.parse(text)
                    : {};

        }catch{

            data = {};

        }


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "Sunucu hatası."
            );

        }


        return data;

    }catch(error){

        if(
            error instanceof TypeError
        ){

            throw new Error(
                "Sunucuya bağlanılamadı. İnternet bağlantını ve Minegram sunucusunu kontrol et."
            );

        }

        throw error;

    }

}


/* =====================================================
   GERİ
===================================================== */

function goBack(){

    window.location.href =
        "./sifremi-unuttum.html";

}


backButton.addEventListener(
    "click",
    goBack
);


changeButton.addEventListener(
    "click",
    goBack
);


backButton.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            goBack();

        }

    }
);


/* =====================================================
   KOD GİRİŞİ
===================================================== */

codeInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,6);


        verifyButton.disabled =
            this.value.length !== 6;

    }
);


/* =====================================================
   TEKRAR GÖNDER SAYACI
===================================================== */

let resendTimer = null;


function startResendTimer(){

    if(resendTimer){

        clearInterval(
            resendTimer
        );

    }


    let seconds = 30;


    resendButton.disabled =
        true;


    resendButton.textContent =
        "Tekrar gönder (" +
        seconds +
        ")";


    resendTimer =
        setInterval(
            function(){

                seconds--;


                resendButton.textContent =
                    "Tekrar gönder (" +
                    seconds +
                    ")";


                if(seconds <= 0){

                    clearInterval(
                        resendTimer
                    );

                    resendTimer =
                        null;


                    resendButton.disabled =
                        false;


                    resendButton.textContent =
                        "Doğrulama kodunu tekrar gönder";

                }

            },
            1000
        );

}


/* =====================================================
   KURTARMA KODU GÖNDER
===================================================== */

async function sendRecoveryCode(){

    if(!identifier){

        showStatus(
            "Hesap bilgisi bulunamadı. Lütfen şifre yenileme işlemini yeniden başlat."
        );

        return false;

    }


    try{

        resendButton.disabled =
            true;

        resendButton.textContent =
            "Gönderiliyor...";


        showStatus(
            "Doğrulama kodu gönderiliyor...",
            "loading"
        );


        const result =
            await api(
                "/api/forgot/start",
                {
                    method:"POST",

                    body:
                        JSON.stringify({

                            identifier:
                                identifier,

                            mode:
                                mode

                        })
                }
            );


        if(
            result &&
            result.ok === false
        ){

            throw new Error(
                result.error ||
                "Kod gönderilemedi."
            );

        }


        if(result?.email){

            sessionStorage.setItem(
                "minegram_recovery_email",
                String(
                    result.email
                )
                .trim()
                .toLowerCase()
            );


            emailBox.textContent =
                String(
                    result.email
                )
                .trim()
                .toLowerCase();

        }


        sessionStorage.setItem(
            "minegram_recovery_started",
            "true"
        );


        showStatus(
            "6 haneli doğrulama kodu e-posta adresine gönderildi.",
            "success"
        );


        startResendTimer();


        verifyButton.disabled =
            codeInput.value.length !== 6;


        codeInput.focus();


        return true;

    }
    catch(error){

        console.error(
            "[MINEGRAM] Şifre kurtarma kodu gönderme hatası:",
            error
        );


        showStatus(
            error.message ||
            "Doğrulama kodu gönderilemedi."
        );


        resendButton.disabled =
            false;


        resendButton.textContent =
            "Doğrulama kodunu tekrar gönder";


        return false;

    }

}


/* =====================================================
   KOD DOĞRULA
===================================================== */

verifyButton.addEventListener(
    "click",
    async function(){

        const code =
            codeInput.value.trim();


        if(
            !identifier
        ){

            showStatus(
                "Hesap bilgisi bulunamadı."
            );

            return;

        }


        if(
            code.length !== 6
        ){

            showStatus(
                "6 haneli doğrulama kodunu gir."
            );

            return;

        }


        verifyButton.disabled =
            true;

        resendButton.disabled =
            true;


        verifyButton.textContent =
            "Kontrol ediliyor...";


        showStatus(
            "Doğrulama kodu kontrol ediliyor...",
            "loading"
        );


        try{

            /*
             * ÖNEMLİ:
             * Bu artık register/verify DEĞİL.
             *
             * Şifre kurtarma doğrulaması:
             * /api/forgot/verify
             */

            const result =
                await api(
                    "/api/forgot/verify",
                    {
                        method:"POST",

                        body:
                            JSON.stringify({

                                identifier:
                                    identifier,

                                email:
                                    email,

                                mode:
                                    mode,

                                code:
                                    code

                            })
                    }
                );


            if(
                !result ||
                result.ok !== true
            ){

                throw new Error(
                    result?.error ||
                    "Doğrulama kodu yanlış veya süresi dolmuş."
                );

            }


            /*
             * SERVER TARAFINDAN ÜRETİLEN
             * RESET TOKEN
             */

            const resetToken =
                result.resetToken ||
                result.token ||
                "";


            if(!resetToken){

                throw new Error(
                    "Kod doğrulandı ancak şifre yenileme anahtarı alınamadı. Lütfen tekrar kod iste."
                );

            }


            /*
             * TOKEN'I SESSION'A DA KAYDET
             */

            sessionStorage.setItem(
                "minegram_password_reset_token",
                resetToken
            );


            if(result.email){

                sessionStorage.setItem(
                    "minegram_recovery_email",
                    String(
                        result.email
                    )
                    .trim()
                    .toLowerCase()
                );

            }


            sessionStorage.setItem(
                "minegram_recovery_verified",
                "true"
            );


            showStatus(
                "Kod doğrulandı. Yeni şifreni oluşturabilirsin.",
                "success"
            );


            verifyButton.textContent =
                "Doğrulandı";


            /*
             * YENİ ŞİFRE SAYFASINA GİT
             */

            setTimeout(
                function(){

                    const nextParams =
                        new URLSearchParams();


                    nextParams.set(
                        "token",
                        resetToken
                    );


                    if(identifier){

                        nextParams.set(
                            "identifier",
                            identifier
                        );

                    }


                    if(result.email){

                        nextParams.set(
                            "email",
                            result.email
                        );

                    }else if(email){

                        nextParams.set(
                            "email",
                            email
                        );

                    }


                    window.location.href =
                        "./yeni-sifre.html?" +
                        nextParams.toString();

                },
                700
            );

        }
        catch(error){

            console.error(
                "[MINEGRAM] Şifre kurtarma doğrulama hatası:",
                error
            );


            showStatus(
                error.message ||
                "Doğrulama kodu yanlış."
            );


            verifyButton.disabled =
                codeInput.value.length !== 6;


            resendButton.disabled =
                false;


            verifyButton.textContent =
                "Kontrol et";

        }

    }
);


/* =====================================================
   TEKRAR GÖNDER
===================================================== */

resendButton.addEventListener(
    "click",
    async function(){

        await sendRecoveryCode();

    }
);


/* =====================================================
   ENTER
===================================================== */

codeInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            codeInput.value.length === 6
        ){

            event.preventDefault();

            verifyButton.click();

        }

    }
);


/* =====================================================
   SAYFA BAŞLAT
===================================================== */

async function start(){

    console.log(
        "[MINEGRAM] sifremi-unuttum-dogrulama.html başladı."
    );

    console.log(
        "[MINEGRAM] Identifier:",
        identifier
    );

    console.log(
        "[MINEGRAM] Mode:",
        mode
    );

    console.log(
        "[MINEGRAM] Email:",
        email
    );


    if(!identifier){

        showStatus(
            "Hesap bilgisi bulunamadı. Şifre değiştirme işlemini yeniden başlat."
        );


        verifyButton.disabled =
            true;


        resendButton.disabled =
            true;


        return;

    }


    /*
     * ŞİFRE KURTARMA SAYFASINDAN GELDİYSE
     * KOD ZATEN GÖNDERİLMİŞ OLABİLİR.
     */

    const recoveryStarted =
        sessionStorage.getItem(
            "minegram_recovery_started"
        );


    if(
        recoveryStarted === "true"
    ){

        showStatus(
            "E-postana gönderilen 6 haneli kodu gir.",
            "success"
        );


        startResendTimer();


        codeInput.focus();


        return;

    }


    /*
     * SAYFA DOĞRUDAN AÇILDIYSA
     * KOD GÖNDER
     */

    await sendRecoveryCode();

}


/* =====================================================
   BAŞLAT
===================================================== */

start();

</script>

</body>
</html>
