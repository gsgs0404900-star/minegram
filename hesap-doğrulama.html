<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#000000"
>

<title>Hesabını doğrula - Minegram</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI",Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
}

.page{
  min-height:100vh;
  background:#000;
}

.header{
  height:60px;
  border-bottom:1px solid #262626;
  display:flex;
  align-items:center;
  padding:0 18px;
}

.back{
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:28px;
  cursor:pointer;
  padding:0;
}

.title{
  font-size:16px;
  font-weight:600;
  margin-left:8px;
}

.wrap{
  width:100%;
  max-width:420px;
  margin:0 auto;
  padding:38px 24px 40px;
}

.icon{
  width:64px;
  height:64px;
  border:1px solid #333;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 24px;
  font-size:29px;
}

.heading{
  text-align:center;
  font-size:25px;
  line-height:1.25;
  margin:0 0 10px;
  font-weight:700;
}

.sub{
  text-align:center;
  color:#a8a8a8;
  font-size:14px;
  line-height:1.55;
  margin:0 auto 26px;
  max-width:340px;
}

.emailBox{
  border:1px solid #292929;
  background:#101010;
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:20px;
  text-align:center;
}

.emailLabel{
  color:#8e8e8e;
  font-size:12px;
  margin-bottom:5px;
}

.emailValue{
  font-size:14px;
  font-weight:600;
  word-break:break-all;
}

.code{
  width:100%;
  height:58px;
  background:#0d0d0d;
  border:1px solid #333;
  border-radius:12px;
  color:#fff;
  text-align:center;
  font-size:25px;
  letter-spacing:9px;
  outline:none;
  padding-left:9px;
}

.code:focus{
  border-color:#777;
}

.btn{
  width:100%;
  height:50px;
  border:0;
  border-radius:9px;
  background:#2677b5;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  margin-top:16px;
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.secondary{
  background:#1b1b1b;
  border:1px solid #303030;
  color:#fff;
}

.msg{
  min-height:22px;
  text-align:center;
  font-size:13px;
  margin-top:14px;
  color:#aaa;
}

.error{
  color:#ff6b6b;
}

.success{
  color:#55d98b;
}

.small{
  color:#777;
  font-size:12px;
  text-align:center;
  margin-top:18px;
  line-height:1.5;
}

.spinner{
  display:inline-block;
  width:17px;
  height:17px;
  border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:-3px;
  margin-right:7px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@media(max-width:480px){

  .wrap{
    padding-left:20px;
    padding-right:20px;
  }

  .heading{
    font-size:23px;
  }

}

</style>

</head>

<body>

<div class="page">

  <header class="header">

    <button
      class="back"
      id="backBtn"
      type="button"
      aria-label="Geri"
    >
      ‹
    </button>

    <div class="title">
      Hesabını doğrula
    </div>

  </header>


  <main class="wrap">

    <div class="icon">
      ✉
    </div>


    <h1 class="heading">
      Hesabını doğrula
    </h1>


    <p class="sub">
      Hesabını tamamlamak için e-posta
      adresine gönderdiğimiz 6 haneli
      doğrulama kodunu gir.
    </p>


    <div class="emailBox">

      <div class="emailLabel">
        Kod gönderilen e-posta
      </div>

      <div
        class="emailValue"
        id="emailValue"
      >
        E-posta adresin
      </div>

    </div>


    <input
      id="codeInput"
      class="code"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      placeholder="••••••"
      aria-label="6 haneli doğrulama kodu"
    >


    <button
      class="btn"
      id="verifyBtn"
      type="button"
    >
      Doğrula ve profile git
    </button>


    <button
      class="btn secondary"
      id="resendBtn"
      type="button"
    >
      Kodu yeniden gönder
    </button>


    <div
      id="message"
      class="msg"
    ></div>


    <div
      id="timer"
      class="small"
    ></div>

  </main>

</div>


<script>

(() => {

  "use strict";


  /* =====================================================
     ELEMENTLER
  ===================================================== */

  const codeInput =
    document.getElementById(
      "codeInput"
    );

  const verifyBtn =
    document.getElementById(
      "verifyBtn"
    );

  const resendBtn =
    document.getElementById(
      "resendBtn"
    );

  const message =
    document.getElementById(
      "message"
    );

  const emailValue =
    document.getElementById(
      "emailValue"
    );

  const timer =
    document.getElementById(
      "timer"
    );

  const backBtn =
    document.getElementById(
      "backBtn"
    );


  /* =====================================================
     LOCAL STORAGE
  ===================================================== */

  function get(key){

    try{

      return (
        localStorage.getItem(key) ||
        ""
      );

    }catch{

      return "";

    }

  }


  function set(key,value){

    try{

      localStorage.setItem(
        key,
        String(value ?? "")
      );

    }catch{}

  }


  function removeLocal(key){

    try{

      localStorage.removeItem(key);

    }catch{}

  }


  /* =====================================================
     SESSION STORAGE
  ===================================================== */

  function getSession(key){

    try{

      return (
        sessionStorage.getItem(key) ||
        ""
      );

    }catch{

      return "";

    }

  }


  function setSession(key,value){

    try{

      sessionStorage.setItem(
        key,
        String(value ?? "")
      );

    }catch{}

  }


  function removeSession(key){

    try{

      sessionStorage.removeItem(key);

    }catch{}

  }


  /* =====================================================
     DEĞER SEÇ
  ===================================================== */

  function first(...values){

    return values.find(
      value =>
        value !== undefined &&
        value !== null &&
        String(value).trim() !== ""
    ) || "";

  }


  /* =====================================================
     URL PARAMETRELERİ
  ===================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  /* =====================================================
     EMAIL
  ===================================================== */

  const email =
    first(

      params.get("email"),

      getSession(
        "minegram_register_email"
      ),

      getSession(
        "minegram_otp_email"
      ),

      get(
        "minegram_register_email"
      ),

      get(
        "minegram_email"
      ),

      get(
        "register_email"
      ),

      get(
        "pending_email"
      )

    )
    .trim()
    .toLowerCase();


  /* =====================================================
     USERNAME
  ===================================================== */

  const username =
    first(

      params.get("username"),

      getSession(
        "minegram_register_username"
      ),

      get(
        "minegram_register_username"
      ),

      get(
        "minegram_username"
      ),

      get(
        "register_username"
      )

    )
    .trim()
    .replace(/^@/,"")
    .toLowerCase();


  /* =====================================================
     ŞİFRE
     
     BURADA ŞİFREYİ YAZMIYORUZ.
     SADECE KAYIT SAYFASINDAN OKUYORUZ.
  ===================================================== */

  const password =
    first(

      getSession(
        "minegram_register_password"
      ),

      getSession(
        "minegram_password"
      )

    );


  /* =====================================================
     EMAIL GÖSTER
  ===================================================== */

  if(email){

    emailValue.textContent =
      email;

  }else{

    emailValue.textContent =
      "E-posta adresi bulunamadı.";

  }


  /* =====================================================
     MESAJ
  ===================================================== */

  function show(
    text,
    type = ""
  ){

    message.textContent =
      text || "";

    message.className =
      "msg";

    if(type){

      message.classList.add(
        type
      );

    }

  }


  /* =====================================================
     API
  ===================================================== */

  async function api(
    path,
    options = {}
  ){

    const response =
      await fetch(
        path,
        {

          ...options,

          headers:{

            "Content-Type":
              "application/json",

            "Accept":
              "application/json",

            ...(options.headers || {})

          },

          credentials:
            "include",

          cache:
            "no-store"

        }
      );


    const text =
      await response.text();


    let data = {};


    try{

      data =
        text
          ? JSON.parse(text)
          : {};

    }catch{

      data = {};

    }


    console.log(
      "[MINEGRAM API]",
      path,
      response.status,
      data
    );


    if(!response.ok){

      throw new Error(

        data?.error ||
        data?.message ||
        "Sunucu hatası."

      );

    }


    return data;

  }


  /* =====================================================
     TOKEN KAYDET
  ===================================================== */

  function saveToken(data){

    const token =
      first(

        data?.access_token,

        data?.token,

        data?.supabaseAccessToken,

        data?.session?.access_token,

        data?.session?.accessToken

      ).trim();


    if(!token){

      console.error(
        "[MINEGRAM] TOKEN BULUNAMADI",
        data
      );

      return false;

    }


    /*
     * Eski bozuk tokenları temizle.
     */

    removeLocal(
      "minegram_needs_login"
    );


    set(
      "minegram_token",
      token
    );

    set(
      "token",
      token
    );

    set(
      "access_token",
      token
    );

    set(
      "supabaseAccessToken",
      token
    );


    /*
     * Bazı Minegram sayfaları sessionStorage
     * üzerinden de token okuyabiliyor.
     */

    setSession(
      "minegram_token",
      token
    );

    setSession(
      "token",
      token
    );

    setSession(
      "access_token",
      token
    );


    console.log(
      "[MINEGRAM] TOKEN KAYDEDİLDİ"
    );


    return true;

  }


  /* =====================================================
     KULLANICI KAYDET
  ===================================================== */

  function saveUser(data){

    const user =
      data?.user ||
      data?.profile ||
      {};


    const finalUsername =
      first(

        user?.username,

        data?.username,

        username

      )
      .replace(/^@/,"")
      .toLowerCase();


    const finalDisplayName =
      first(

        user?.displayName,

        user?.display_name,

        data?.displayName,

        finalUsername

      );


    const finalEmail =
      first(

        user?.email,

        email

      )
      .trim()
      .toLowerCase();


    const sessionUser = {

      id:
        first(
          user?.id,
          data?.id
        ),

      username:
        finalUsername,

      displayName:
        finalDisplayName,

      email:
        finalEmail,

      avatar:
        first(
          user?.avatar,
          user?.avatar_url,
          ""
        ),

      bio:
        first(
          user?.bio,
          ""
        )

    };


    /*
     * LocalStorage
     */

    try{

      localStorage.setItem(
        "minegram_user",
        JSON.stringify(
          sessionUser
        )
      );

      localStorage.setItem(
        "user",
        JSON.stringify(
          sessionUser
        )
      );

      localStorage.setItem(
        "currentUser",
        JSON.stringify(
          sessionUser
        )
      );

    }catch{}


    /*
     * Kullanıcı bilgileri
     */

    if(finalUsername){

      set(
        "minegram_username",
        finalUsername
      );

      set(
        "username",
        finalUsername
      );

      set(
        "minegram_register_username",
        finalUsername
      );

    }


    if(finalEmail){

      set(
        "minegram_email",
        finalEmail
      );

      set(
        "minegram_register_email",
        finalEmail
      );

    }


    set(
      "minegram_logged_in",
      "1"
    );


    set(
      "minegram_register_verified",
      "1"
    );


    setSession(
      "minegram_email_verified",
      "true"
    );


    setSession(
      "minegram_register_verified_email",
      finalEmail
    );


    return sessionUser;

  }


  /* =====================================================
     BAŞARILI YÖNLENDİRME
  ===================================================== */

  let redirecting =
    false;


  function goProfile(){

    if(redirecting){

      return;

    }


    redirecting =
      true;


    verifyBtn.disabled =
      true;

    resendBtn.disabled =
      true;


    show(
      "Hesabın doğrulandı. Minegram'a giriyorsun...",
      "success"
    );


    verifyBtn.textContent =
      "Doğrulandı";


    /*
     * Şifre artık gerekli değil.
     */

    removeSession(
      "minegram_register_password"
    );

    removeSession(
      "minegram_password"
    );


    removeSession(
      "minegram_otp_pending"
    );


    setTimeout(
      () => {

        window.location.replace(
          "./profile.html"
        );

      },
      600
    );

  }


  /* =====================================================
     KOD DOĞRULA
  ===================================================== */

  async function verify(){

    const code =
      String(
        codeInput.value || ""
      )
      .replace(/\D/g,"")
      .slice(0,6);


    codeInput.value =
      code;


    /* ---------------------------------------------
       EMAIL
    --------------------------------------------- */

    if(!email){

      show(
        "E-posta bilgisi bulunamadı. Kayıt işlemine geri dön.",
        "error"
      );

      return;

    }


    /* ---------------------------------------------
       USERNAME
    --------------------------------------------- */

    if(!username){

      show(
        "Kullanıcı adı bulunamadı. Kayıt işlemine geri dön.",
        "error"
      );

      return;

    }


    /* ---------------------------------------------
       KOD
    --------------------------------------------- */

    if(!/^\d{6}$/.test(code)){

      show(
        "6 haneli doğrulama kodunu gir.",
        "error"
      );

      codeInput.focus();

      return;

    }


    /* ---------------------------------------------
       ŞİFRE
    --------------------------------------------- */

    if(!password){

      show(
        "Kayıt şifresi bulunamadı. Lütfen kayıt işlemine yeniden başla.",
        "error"
      );

      return;

    }


    verifyBtn.disabled =
      true;

    resendBtn.disabled =
      true;


    verifyBtn.innerHTML =
      '<span class="spinner"></span>Doğrulanıyor...';


    show(
      "Doğrulama kodu kontrol ediliyor...",
      ""
    );


    try{

      /* =========================================
         SERVER
      ========================================= */

      const data =
        await api(
          "/api/register/verify",
          {

            method:
              "POST",

            body:
              JSON.stringify({

                username:
                  username,

                email:
                  email,

                code:
                  code,

                password:
                  password

              })

          }
        );


      console.log(
        "[MINEGRAM REGISTER VERIFY RESULT]",
        data
      );


      /* =========================================
         SUNUCU CEVABI
      ========================================= */

      if(
        !data ||
        data.ok !== true ||
        data.verified !== true
      ){

        throw new Error(

          data?.error ||
          data?.message ||
          "Doğrulama başarısız."

        );

      }


      /* =========================================
         TOKEN
      ========================================= */

      const tokenOK =
        saveToken(
          data
        );


      if(!tokenOK){

        throw new Error(
          "Hesabın doğrulandı ancak oturum başlatılamadı. Lütfen tekrar dene."
        );

      }


      /* =========================================
         USER
      ========================================= */

      saveUser(
        data
      );


      /* =========================================
         DOĞRULAMA FLAGLERİ
      ========================================= */

      set(
        "minegram_register_verified",
        "true"
      );

      set(
        "minegram_email_verified",
        "true"
      );

      setSession(
        "minegram_register_verified",
        "true"
      );

      setSession(
        "minegram_email_verified",
        "true"
      );


      /* =========================================
         BAŞARILI
      ========================================= */

      goProfile();

    }
    catch(error){

      console.error(
        "[MINEGRAM VERIFY ERROR]",
        error
      );


      show(

        error?.message ||
        "Doğrulama başarısız. Lütfen tekrar dene.",

        "error"

      );


      verifyBtn.disabled =
        false;

      resendBtn.disabled =
        false;


      verifyBtn.textContent =
        "Doğrula ve profile git";

    }

  }


  /* =====================================================
     YENİDEN GÖNDER SAYACI
  ===================================================== */

  let resendLocked =
    false;

  let remaining =
    0;

  let timerId =
    null;


  function startTimer(
    seconds = 60
  ){

    remaining =
      Number(seconds);


    resendLocked =
      true;


    resendBtn.disabled =
      true;


    clearInterval(
      timerId
    );


    function tick(){

      if(remaining <= 0){

        clearInterval(
          timerId
        );


        timerId =
          null;


        resendLocked =
          false;


        resendBtn.disabled =
          false;


        resendBtn.textContent =
          "Kodu yeniden gönder";


        timer.textContent =
          "";


        return;

      }


      timer.textContent =
        "Yeni kod göndermek için " +
        remaining +
        " saniye bekle.";


      resendBtn.textContent =
        "Tekrar gönder (" +
        remaining +
        ")";


      remaining--;

    }


    tick();


    timerId =
      setInterval(
        tick,
        1000
      );

  }


  /* =====================================================
     YENİDEN GÖNDER
  ===================================================== */

  async function resend(){

    if(
      resendLocked ||
      !email
    ){

      return;

    }


    resendLocked =
      true;


    resendBtn.disabled =
      true;


    resendBtn.textContent =
      "Gönderiliyor...";


    show(
      "Yeni doğrulama kodu gönderiliyor...",
      ""
    );


    try{

      const data =
        await api(
          "/api/register/resend",
          {

            method:
              "POST",

            body:
              JSON.stringify({

                email:
                  email,

                username:
                  username,

                mode:
                  "email"

              })

          }
        );


      show(

        data?.message ||
        "Yeni doğrulama kodu gönderildi.",

        "success"

      );


      codeInput.value =
        "";

      codeInput.focus();


      startTimer(
        60
      );

    }
    catch(error){

      console.error(
        "[MINEGRAM RESEND ERROR]",
        error
      );


      show(

        error?.message ||
        "Yeni kod gönderilemedi.",

        "error"

      );


      resendLocked =
        false;


      resendBtn.disabled =
        false;


      resendBtn.textContent =
        "Kodu yeniden gönder";

    }

  }


  /* =====================================================
     GERİ
  ===================================================== */

  backBtn.addEventListener(
    "click",
    function(){

      window.location.href =
        "./iletisim-bilgileri.html";

    }
  );


  /* =====================================================
     KOD GİRİŞİ
  ===================================================== */

  codeInput.addEventListener(
    "input",
    function(){

      this.value =
        this.value
          .replace(/\D/g,"")
          .slice(0,6);


      /*
       * 6 hane tamamlanınca otomatik doğrulama.
       */

      if(
        this.value.length === 6
      ){

        verify();

      }

    }
  );


  /* =====================================================
     ENTER
  ===================================================== */

  codeInput.addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        if(
          this.value.length === 6
        ){

          verify();

        }

      }

    }
  );


  /* =====================================================
     BAŞLAT
  ===================================================== */

  function start(){

    console.log(
      "[MINEGRAM] hesap-doğrulama.html başladı"
    );

    console.log(
      "[MINEGRAM] username:",
      username
    );

    console.log(
      "[MINEGRAM] email:",
      email
    );


    if(!email){

      show(
        "E-posta bilgisi bulunamadı. Kayıt işlemine geri dön.",
        "error"
      );


      verifyBtn.disabled =
        true;

      resendBtn.disabled =
        true;


      return;

    }


    if(!username){

      show(
        "Kullanıcı adı bulunamadı. Kayıt işlemine geri dön.",
        "error"
      );


      verifyBtn.disabled =
        true;

      resendBtn.disabled =
        true;


      return;

    }


    /*
     * Şifre yoksa burada kullanıcıya açık hata göster.
     */

    if(!password){

      show(
        "Kayıt oturumu bulunamadı. Lütfen kayıt işlemine yeniden başla.",
        "error"
      );


      verifyBtn.disabled =
        true;


      return;

    }


    show(
      "E-postana gönderilen 6 haneli kodu gir.",
      "success"
    );


    codeInput.focus();


    startTimer(
      60
    );

  }


  /* =====================================================
     ÇALIŞTIR
  ===================================================== */

  start();


})();

</script>

</body>

</html>
