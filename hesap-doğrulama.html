<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>Hesabını doğrula - Minegram</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:365px;
    margin-top:90px;
    text-align:center;
}

.header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:25px;
}

.back{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    margin-right:8px;
}

.header-title{
    font-size:16px;
    font-weight:700;
}

.title{
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 12px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.45;
    margin:0 0 22px;
}

.email-box{
    width:100%;
    min-height:44px;
    padding:13px 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#050505;
    color:#fff;
    font-size:12px;
    word-break:break-word;
}

.status{
    min-height:20px;
    margin-top:15px;
    font-size:12px;
    line-height:1.5;
    color:#ff4d4d;
}

.status.success{
    color:#35c759;
}

.status.loading{
    color:#aaa;
}

.bottom{
    display:flex;
    gap:9px;
    width:100%;
    margin-top:25px;
}

.action{
    width:50%;
    height:42px;
    border-radius:22px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.back-btn{
    background:#000;
    border:1px solid #555;
    color:#0095f6;
}

.verify{
    background:#2d80bd;
    border:0;
    color:#000;
}

.verify:hover{
    background:#348dca;
}

.verify:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.resend{
    width:100%;
    height:38px;
    margin-top:10px;
    border:0;
    background:transparent;
    color:#0095f6;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.resend:disabled{
    color:#555;
    cursor:not-allowed;
}

@media(max-width:600px){

    .box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:60px;
    }

    .header{
        margin-bottom:22px;
    }

    .header-title{
        font-size:15px;
    }

    .title{
        font-size:21px;
    }

    .description{
        font-size:12px;
    }

    .email-box{
        font-size:12px;
    }

    .action{
        height:42px;
        font-size:12px;
    }

    .status{
        font-size:12px;
    }

}

</style>

</head>

<body>

<div class="page">

<div class="box">

<header class="header">

    <div
        class="back"
        id="backButton"
        aria-label="Geri"
        role="button"
        tabindex="0"
    >‹</div>

    <div class="header-title">
        Kayıt ol
    </div>

</header>


<h1 class="title">
    Hesabını doğrula
</h1>


<p class="description">
    E-posta adresine gönderilen doğrulama<br>
    bağlantısına tıkla.
</p>


<div
    id="emailBox"
    class="email-box"
>
    E-posta hazırlanıyor...
</div>


<div
    id="status"
    class="status loading"
>
    Doğrulama e-postası hazırlanıyor...
</div>


<div class="bottom">

    <button
        id="changeButton"
        class="action back-btn"
        type="button"
    >
        İletişim bilgini değiştir
    </button>

    <button
        id="verifyButton"
        class="action verify"
        type="button"
        disabled
    >
        Kontrol et
    </button>

</div>


<button
    id="resendButton"
    class="resend"
    type="button"
    disabled
>
    Doğrulama e-postasını tekrar gönder
</button>


</div>
</div>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    sendEmailVerification,
    reload
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain:
        "mim-ea133.firebaseapp.com",

    databaseURL:
        "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "mim-ea133",

    storageBucket:
        "mim-ea133.firebasestorage.app",

    messagingSenderId:
        "303525353436",

    appId:
        "1:303525353436:web:082fc090b5025e19942119",

    measurementId:
        "G-K962QE5P1R"
};


/* =========================================
   FIREBASE BAŞLAT
========================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =========================================
   ELEMENTLER
========================================= */

const emailBox =
    document.getElementById("emailBox");

const status =
    document.getElementById("status");

const verifyButton =
    document.getElementById("verifyButton");

const resendButton =
    document.getElementById("resendButton");

const changeButton =
    document.getElementById("changeButton");

const backButton =
    document.getElementById("backButton");


/* =========================================
   URL
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const username =
    params.get("username") ||
    sessionStorage.getItem(
        "minegram_register_username"
    ) ||
    "";


const email =
    params.get("email") ||
    sessionStorage.getItem(
        "minegram_register_email"
    ) ||
    "";


/* =========================================
   MESAJ
========================================= */

function showStatus(
    text,
    type = ""
){

    status.textContent =
        text || "";

    status.className =
        "status";

    if(type){

        status.classList.add(type);

    }

}


/* =========================================
   GERİ
========================================= */

function goBack(){

    let url =
        "./iletisim-bilgileri.html";

    if(username){

        url +=
            "?username=" +
            encodeURIComponent(username);

    }

    window.location.href =
        url;
}


backButton.addEventListener(
    "click",
    goBack
);


changeButton.addEventListener(
    "click",
    goBack
);


backButton.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            goBack();

        }

    }
);


/* =========================================
   KAYIT BİLGİLERİNİ SAKLA
========================================= */

if(username){

    sessionStorage.setItem(
        "minegram_register_username",
        username
    );

}


if(email){

    sessionStorage.setItem(
        "minegram_register_email",
        email
    );

}


/* =========================================
   DOĞRULAMA MAİLİ GÖNDER
========================================= */

async function sendVerificationEmail(user){

    if(!user){

        showStatus(
            "Firebase kullanıcı oturumu bulunamadı.",
            ""
        );

        return false;

    }


    if(user.email){

        emailBox.textContent =
            user.email;

    }


    /*
     * Kullanıcı zaten doğrulanmışsa
     */

    if(user.emailVerified){

        showStatus(
            "E-posta adresin zaten doğrulanmış.",
            "success"
        );

        verifyButton.disabled =
            false;

        return true;

    }


    try{

        showStatus(
            "Doğrulama e-postası gönderiliyor...",
            "loading"
        );


        /*
         * GERÇEK FIREBASE DOĞRULAMA MAİLİ
         */

        await sendEmailVerification(
            user
        );


        showStatus(
            "Doğrulama e-postası gönderildi. E-posta kutunu kontrol et ve bağlantıya tıkla.",
            "success"
        );


        verifyButton.disabled =
            false;

        resendButton.disabled =
            false;


        return true;

    }
    catch(error){

        console.error(
            "[MINEGRAM EMAIL VERIFICATION]",
            error
        );


        if(
            error.code ===
            "auth/too-many-requests"
        ){

            showStatus(
                "Çok fazla e-posta isteği gönderildi. Birkaç dakika sonra tekrar dene."
            );

        }
        else if(
            error.code ===
            "auth/network-request-failed"
        ){

            showStatus(
                "İnternet bağlantısını kontrol et."
            );

        }
        else if(
            error.code ===
            "auth/invalid-user-token"
        ){

            showStatus(
                "Firebase oturumu geçersiz. Kayıt işlemini yeniden başlat."
            );

        }
        else{

            showStatus(
                "Doğrulama e-postası gönderilemedi: " +
                (
                    error.message ||
                    "Bilinmeyen hata"
                )
            );

        }


        return false;

    }

}


/* =========================================
   FIREBASE OTURUMU
========================================= */

onAuthStateChanged(
    auth,
    async function(user){

        console.log(
            "[MINEGRAM] Auth değişti:",
            user
        );


        if(!user){

            /*
             * Burada artık hemen
             * sayfayı kilitlemiyoruz.
             *
             * Firebase oturumunun
             * yüklenmesini bekliyoruz.
             */

            showStatus(
                "Firebase oturumu yükleniyor...",
                "loading"
            );

            return;

        }


        console.log(
            "[MINEGRAM] UID:",
            user.uid
        );

        console.log(
            "[MINEGRAM] EMAIL:",
            user.email
        );

        console.log(
            "[MINEGRAM] VERIFIED:",
            user.emailVerified
        );


        if(user.email){

            emailBox.textContent =
                user.email;

        }


        /*
         * Kullanıcı bulundu.
         * GERÇEK MAİLİ GÖNDER.
         */

        await sendVerificationEmail(
            user
        );

    }
);


/* =========================================
   KONTROL ET
========================================= */

verifyButton.addEventListener(
    "click",
    async function(){

        const user =
            auth.currentUser;


        if(!user){

            showStatus(
                "Firebase oturumu henüz hazır değil. Birkaç saniye bekle."
            );

            return;

        }


        verifyButton.disabled =
            true;

        verifyButton.textContent =
            "Kontrol ediliyor...";


        try{

            /*
             * Firebase'den kullanıcıyı
             * yeniden yükle.
             */

            await reload(user);


            const updatedUser =
                auth.currentUser;


            console.log(
                "[MINEGRAM] Güncel kullanıcı:",
                updatedUser
            );


            if(
                updatedUser &&
                updatedUser.emailVerified
            ){

                showStatus(
                    "Hesabın doğrulandı. Minegram'a giriyorsun...",
                    "success"
                );


                verifyButton.textContent =
                    "Doğrulandı";


                /*
                 * Bilgileri sakla.
                 */

                if(updatedUser.uid){

                    sessionStorage.setItem(
                        "minegram_uid",
                        updatedUser.uid
                    );

                }


                if(updatedUser.email){

                    sessionStorage.setItem(
                        "minegram_register_email",
                        updatedUser.email
                    );

                }


                if(username){

                    sessionStorage.setItem(
                        "minegram_register_username",
                        username
                    );

                }


                setTimeout(
                    function(){

                        window.location.href =
                            "./index.html";

                    },
                    800
                );


            }
            else{

                showStatus(
                    "E-posta henüz doğrulanmamış. E-postandaki doğrulama bağlantısına tıkla."
                );


                verifyButton.disabled =
                    false;

                verifyButton.textContent =
                    "Kontrol et";

            }

        }
        catch(error){

            console.error(
                "[MINEGRAM VERIFY]",
                error
            );


            showStatus(
                "Doğrulama kontrol edilirken hata oluştu."
            );


            verifyButton.disabled =
                false;

            verifyButton.textContent =
                "Kontrol et";

        }

    }
);


/* =========================================
   TEKRAR GÖNDER
========================================= */

resendButton.addEventListener(
    "click",
    async function(){

        const user =
            auth.currentUser;


        if(!user){

            showStatus(
                "Firebase oturumu bulunamadı."
            );

            return;

        }


        resendButton.disabled =
            true;

        resendButton.textContent =
            "Gönderiliyor...";


        const result =
            await sendVerificationEmail(
                user
            );


        if(result){

            let seconds =
                30;


            resendButton.textContent =
                "Tekrar gönder (" +
                seconds +
                ")";


            const timer =
                setInterval(
                    function(){

                        seconds--;


                        resendButton.textContent =
                            "Tekrar gönder (" +
                            seconds +
                            ")";


                        if(seconds <= 0){

                            clearInterval(
                                timer
                            );


                            resendButton.disabled =
                                false;


                            resendButton.textContent =
                                "Doğrulama e-postasını tekrar gönder";

                        }

                    },
                    1000
                );

        }
        else{

            resendButton.disabled =
                false;

            resendButton.textContent =
                "Doğrulama e-postasını tekrar gönder";

        }

    }
);


/* =========================================
   SAYFA BAŞLANGICI
========================================= */

if(!email){

    console.warn(
        "[MINEGRAM] URL/session içinde e-posta yok."
    );

}
else{

    emailBox.textContent =
        email;

}


console.log(
    "[MINEGRAM] Hesap doğrulama sayfası hazır."
);

console.log(
    "[MINEGRAM] Username:",
    username
);

console.log(
    "[MINEGRAM] Email:",
    email
);

</script>

</body>
</html>
