<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Hesabını doğrula - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:365px;
    margin-top:90px;
    text-align:center;
}

.header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:25px;
}

.back{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    margin-right:8px;
}

.header-title{
    font-size:16px;
    font-weight:700;
}

.title{
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 12px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.45;
    margin:0 0 22px;
}

.email-box{
    width:100%;
    min-height:44px;
    padding:13px 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#050505;
    color:#fff;
    font-size:12px;
    word-break:break-all;
}

.code-box{
    width:100%;
    height:50px;
    margin-top:12px;
    padding:0 14px;
    border:1px solid #292929;
    border-radius:7px;
    outline:none;
    background:#050505;
    color:#fff;
    text-align:center;
    font-size:22px;
    font-weight:700;
    letter-spacing:8px;
}

.code-box:focus{
    border-color:#0095f6;
}

.code-box::placeholder{
    color:#555;
    letter-spacing:2px;
    font-size:13px;
}

.status{
    min-height:20px;
    margin-top:15px;
    font-size:12px;
    line-height:1.45;
    color:#ff4d4d;
}

.status.success{
    color:#35c759;
}

.status.loading{
    color:#aaa;
}

.bottom{
    display:flex;
    gap:9px;
    width:100%;
    margin-top:25px;
}

.action{
    width:50%;
    height:42px;
    border-radius:22px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    font-family:Arial,Helvetica,sans-serif;
}

.back-btn{
    background:#000;
    border:1px solid #555;
    color:#0095f6;
}

.verify{
    background:#2d80bd;
    border:0;
    color:#000;
}

.verify:hover{
    background:#348dca;
}

.verify:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.resend{
    width:100%;
    height:38px;
    margin-top:10px;
    border:0;
    background:transparent;
    color:#0095f6;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    font-family:Arial,Helvetica,sans-serif;
}

.resend:disabled{
    color:#555;
    cursor:not-allowed;
}

button{
    -webkit-appearance:none;
    appearance:none;
    outline:none;
}

button:active{
    transform:scale(.98);
}

@media(max-width:600px){

    .box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:60px;
    }

    .header{
        margin-bottom:22px;
    }

    .header-title{
        font-size:15px;
    }

    .title{
        font-size:21px;
    }

    .description{
        font-size:12px;
    }

    .email-box{
        font-size:12px;
    }

    .code-box{
        height:48px;
        font-size:20px;
    }

    .action{
        height:42px;
        font-size:12px;
    }

    .status{
        font-size:12px;
    }
}
</style>

</head>

<body>

<div class="page">

<div class="box">

<header class="header">

<button
type="button"
class="back"
id="backButton"
aria-label="Geri"

>

```
‹
```

</button>

<div class="header-title">
    Kayıt ol
</div>

</header>

<h1 class="title">
    Hesabını doğrula
</h1>

<p class="description">
    E-posta adresine gönderilen 6 haneli<br>
    doğrulama kodunu aşağıya yaz.
</p>

<div
    id="emailBox"
    class="email-box"
>
    E-posta yükleniyor...
</div>

<input
id="codeInput"
class="code-box"
type="text"
inputmode="numeric"
autocomplete="one-time-code"
maxlength="6"
placeholder="6 haneli kod"

>

<div
    id="status"
    class="status loading"
>
    Doğrulama hazırlanıyor...
</div>

<div class="bottom">

<button
id="changeButton"
class="action back-btn"
type="button"

>

```
İletişim bilgini değiştir
```

</button>

<button
id="verifyButton"
class="action verify"
type="button"
disabled

>

```
Kontrol et
```

</button>

</div>

<button
id="resendButton"
class="resend"
type="button"
disabled

>

```
Doğrulama kodunu tekrar gönder
```

</button>

</div>
</div>

<script>

"use strict";


/* =====================================================
   ELEMENTLER
===================================================== */

const emailBox = document.getElementById("emailBox");
const codeInput = document.getElementById("codeInput");
const statusBox = document.getElementById("status");
const verifyButton = document.getElementById("verifyButton");
const resendButton = document.getElementById("resendButton");
const changeButton = document.getElementById("changeButton");
const backButton = document.getElementById("backButton");


/* =====================================================
   PARAMETRELER
===================================================== */

const params = new URLSearchParams(
    window.location.search
);


/* =====================================================
   KULLANICI BİLGİLERİ
===================================================== */

const username = (
    params.get("username") ||
    sessionStorage.getItem("minegram_register_username") ||
    localStorage.getItem("minegram_register_username") ||
    ""
)
.trim()
.replace(/^@/, "")
.toLowerCase();


const email = (
    params.get("email") ||
    sessionStorage.getItem("minegram_register_email") ||
    sessionStorage.getItem("minegram_otp_email") ||
    localStorage.getItem("minegram_register_email") ||
    localStorage.getItem("minegram_otp_email") ||
    ""
)
.trim()
.toLowerCase();


/* =====================================================
   E-POSTA
===================================================== */

if(email){

    emailBox.textContent = email;

}else{

    emailBox.textContent =
        "E-posta adresi bulunamadı.";

}


/* =====================================================
   DURUM
===================================================== */

function showStatus(text,type=""){

    statusBox.textContent = text || "";

    statusBox.className = "status";

    if(type){
        statusBox.classList.add(type);
    }

}


/* =====================================================
   GERİ
===================================================== */

function goBack(){

    let url = "./iletisim-bilgileri.html";

    const query = [];

    if(username){

        query.push(
            "username=" +
            encodeURIComponent(username)
        );

    }

    if(email){

        query.push(
            "email=" +
            encodeURIComponent(email)
        );

    }

    if(query.length){

        url += "?" + query.join("&");

    }

    window.location.href = url;

}


/* =====================================================
   BUTONLAR
===================================================== */

backButton.onclick = function(){

    goBack();

};


changeButton.onclick = function(){

    goBack();

};


/* =====================================================
   KOD INPUT
===================================================== */

codeInput.oninput = function(){

    this.value =
        this.value
        .replace(/[^0-9]/g,"")
        .slice(0,6);


    if(this.value.length === 6){

        verifyButton.disabled = false;

    }else{

        verifyButton.disabled = true;

    }

};


/* =====================================================
   API
===================================================== */

async function api(url,options={}){

    const response = await fetch(
        url,
        {
            ...options,

            headers:{
                "Content-Type":"application/json",
                ...(options.headers || {})
            }
        }
    );


    const text = await response.text();

    let data = {};


    try{

        data = text
            ? JSON.parse(text)
            : {};

    }catch{

        data = {};

    }


    if(!response.ok){

        throw new Error(
            data.error ||
            data.message ||
            "Sunucu hatası."
        );

    }


    return data;

}


/* =====================================================
   SAYAC
===================================================== */

let resendTimer = null;


function startResendTimer(){

    if(resendTimer){

        clearInterval(resendTimer);

    }


    let seconds = 30;


    resendButton.disabled = true;


    resendButton.textContent =
        "Tekrar gönder (" +
        seconds +
        ")";


    resendTimer = setInterval(
        function(){

            seconds--;


            resendButton.textContent =
                "Tekrar gönder (" +
                seconds +
                ")";


            if(seconds <= 0){

                clearInterval(resendTimer);

                resendTimer = null;

                resendButton.disabled = false;

                resendButton.textContent =
                    "Doğrulama kodunu tekrar gönder";

            }

        },
        1000
    );

}


/* =====================================================
   KOD GÖNDER
===================================================== */

async function sendCode(){

    if(!email){

        showStatus(
            "E-posta adresi bulunamadı."
        );

        return false;

    }


    try{

        resendButton.disabled = true;

        resendButton.textContent =
            "Gönderiliyor...";


        showStatus(
            "Doğrulama kodu gönderiliyor...",
            "loading"
        );


        const result = await api(
            "/api/register/send-code",
            {
                method:"POST",

                body:JSON.stringify({
                    email:email,
                    username:username
                })
            }
        );


        if(
            result &&
            result.ok === false
        ){

            throw new Error(
                result.error ||
                "Kod gönderilemedi."
            );

        }


        sessionStorage.setItem(
            "minegram_otp_pending",
            "true"
        );


        showStatus(
            "6 haneli doğrulama kodu e-posta adresine gönderildi.",
            "success"
        );


        startResendTimer();


        verifyButton.disabled =
            codeInput.value.length !== 6;


        codeInput.focus();


        return true;

    }
    catch(error){

        console.error(
            "[MINEGRAM] OTP gönderme hatası:",
            error
        );


        showStatus(
            error.message ||
            "Doğrulama kodu gönderilemedi."
        );


        resendButton.disabled = false;

        resendButton.textContent =
            "Doğrulama kodunu tekrar gönder";


        return false;

    }

}


/* =====================================================
   DOĞRULA
===================================================== */

verifyButton.onclick = async function(){

    const code =
        codeInput.value.trim();


    if(!email){

        showStatus(
            "E-posta adresi bulunamadı."
        );

        return;

    }


    if(code.length !== 6){

        showStatus(
            "6 haneli doğrulama kodunu gir."
        );

        return;

    }


    verifyButton.disabled = true;

    resendButton.disabled = true;


    verifyButton.textContent =
        "Kontrol ediliyor...";


    showStatus(
        "Doğrulama kodu kontrol ediliyor...",
        "loading"
    );


    try{

        const result = await api(
            "/api/register/verify-code",
            {
                method:"POST",

                body:JSON.stringify({
                    email:email,
                    code:code,
                    username:username
                })
            }
        );


        if(
            !result ||
            result.ok !== true ||
            result.verified !== true
        ){

            throw new Error(
                result?.error ||
                "Doğrulama kodu yanlış."
            );

        }


        /* =============================================
           DOĞRULAMA BAŞARILI
        ============================================= */

        sessionStorage.setItem(
            "minegram_email_verified",
            "true"
        );


        sessionStorage.setItem(
            "minegram_register_verified_email",
            email
        );


        sessionStorage.removeItem(
            "minegram_otp_pending"
        );


        if(username){

            localStorage.setItem(
                "minegram_username",
                username
            );

            localStorage.setItem(
                "minegram_register_username",
                username
            );

        }


        localStorage.setItem(
            "minegram_email",
            email
        );


        /* =============================================
           TOKEN VARSA KAYDET
        ============================================= */

        const token =
            result.token ||
            result.accessToken ||
            result.access_token ||
            result.authToken ||
            result.auth_token ||
            "";


        if(token){

            localStorage.setItem(
                "minegram_token",
                token
            );

            localStorage.setItem(
                "token",
                token
            );

            sessionStorage.setItem(
                "minegram_token",
                token
            );

        }


        /* =============================================
           USER VARSA KAYDET
        ============================================= */

        if(result.user){

            try{

                localStorage.setItem(
                    "minegram_user",
                    JSON.stringify(result.user)
                );

            }catch(error){

                console.warn(
                    "[MINEGRAM] User kaydedilemedi:",
                    error
                );

            }

        }


        showStatus(
            "E-posta adresin doğrulandı. Minegram'a giriyorsun...",
            "success"
        );


        verifyButton.textContent =
            "Doğrulandı";


        setTimeout(
            function(){

                window.location.replace(
                    "./index.html"
                );

            },
            700
        );


    }
    catch(error){

        console.error(
            "[MINEGRAM] OTP doğrulama hatası:",
            error
        );


        showStatus(
            error.message ||
            "Doğrulama kodu yanlış."
        );


        verifyButton.disabled =
            codeInput.value.length !== 6;


        resendButton.disabled = false;


        verifyButton.textContent =
            "Kontrol et";

    }

};


/* =====================================================
   TEKRAR GÖNDER
===================================================== */

resendButton.onclick = async function(){

    if(this.disabled){

        return;

    }

    await sendCode();

};


/* =====================================================
   ENTER
===================================================== */

codeInput.onkeydown = function(event){

    if(
        event.key === "Enter" &&
        codeInput.value.length === 6 &&
        !verifyButton.disabled
    ){

        event.preventDefault();

        verifyButton.click();

    }

};


/* =====================================================
   BAŞLAT
===================================================== */

async function start(){

    console.log(
        "[MINEGRAM] hesap-doğrulama.html başladı"
    );


    if(!email){

        showStatus(
            "E-posta adresi bulunamadı."
        );

        verifyButton.disabled = true;
        resendButton.disabled = true;

        return;

    }


    const otpPending =
        sessionStorage.getItem(
            "minegram_otp_pending"
        );


    if(otpPending === "true"){

        showStatus(
            "E-postana gönderilen 6 haneli kodu gir.",
            "success"
        );


        resendButton.disabled = true;

        startResendTimer();

        codeInput.focus();

        return;

    }


    await sendCode();

}


/* =====================================================
   ÇALIŞTIR
===================================================== */

start();

</script>

</body>
</html>
