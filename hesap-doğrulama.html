<!DOCTYPE html>

<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"

>

<meta
name="theme-color"
content="#000000"

>

<title>Hesabını doğrula - Minegram</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:365px;
    margin-top:90px;
    text-align:center;
}

.header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:25px;
}

.back{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    margin-right:8px;
}

.header-title{
    font-size:16px;
    font-weight:700;
}

.title{
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 12px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.45;
    margin:0 0 22px;
}

.email-box{
    width:100%;
    min-height:44px;
    padding:13px 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#050505;
    color:#fff;
    font-size:12px;
    word-break:break-all;
}

.code-box{
    width:100%;
    height:50px;
    margin-top:12px;
    padding:0 14px;
    border:1px solid #292929;
    border-radius:7px;
    outline:none;
    background:#050505;
    color:#fff;
    text-align:center;
    font-size:22px;
    font-weight:700;
    letter-spacing:8px;
}

.code-box:focus{
    border-color:#0095f6;
}

.code-box::placeholder{
    color:#555;
    letter-spacing:2px;
    font-size:13px;
}

.status{
    min-height:20px;
    margin-top:15px;
    font-size:12px;
    line-height:1.45;
    color:#ff4d4d;
}

.status.success{
    color:#35c759;
}

.status.loading{
    color:#aaa;
}

.bottom{
    display:flex;
    gap:9px;
    width:100%;
    margin-top:25px;
}

.action{
    width:50%;
    height:42px;
    border-radius:22px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.back-btn{
    background:#000;
    border:1px solid #555;
    color:#0095f6;
}

.verify{
    background:#2d80bd;
    border:0;
    color:#000;
}

.verify:hover{
    background:#348dca;
}

.verify:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.resend{
    width:100%;
    height:38px;
    margin-top:10px;
    border:0;
    background:transparent;
    color:#0095f6;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.resend:disabled{
    color:#555;
    cursor:not-allowed;
}

@media(max-width:600px){

    .box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:60px;
    }

    .header{
        margin-bottom:22px;
    }

    .header-title{
        font-size:15px;
    }

    .title{
        font-size:21px;
    }

    .description{
        font-size:12px;
    }

    .email-box{
        font-size:12px;
    }

    .code-box{
        height:48px;
        font-size:20px;
    }

    .action{
        height:42px;
        font-size:12px;
    }

    .status{
        font-size:12px;
    }
}

</style>

</head>

<body>

<div class="page">

<div class="box">

<header class="header">

<div
    class="back"
    id="backButton"
    aria-label="Geri"
    role="button"
    tabindex="0"
>
    ‹
</div>

<div class="header-title">
    Kayıt ol
</div>

</header>

<h1 class="title">
    Hesabını doğrula
</h1>

<p class="description">
    E-posta adresine gönderilen 6 haneli<br>
    doğrulama kodunu aşağıya yaz.
</p>

<div
    id="emailBox"
    class="email-box"
>
    E-posta yükleniyor...
</div>

<input
id="codeInput"
class="code-box"
type="text"
inputmode="numeric"
autocomplete="one-time-code"
maxlength="6"
placeholder="6 haneli kod"

>

<div
    id="status"
    class="status loading"
>
    Doğrulama hazırlanıyor...
</div>

<div class="bottom">

<button
id="changeButton"
class="action back-btn"
type="button"

>

```
İletişim bilgini değiştir
```

</button>

<button
id="verifyButton"
class="action verify"
type="button"
disabled

>

```
Kontrol et
```

</button>

</div>

<button
id="resendButton"
class="resend"
type="button"
disabled

>

```
Doğrulama kodunu tekrar gönder
```

</button>

</div>

</div>

<script>

"use strict";


/* =====================================================
   ELEMENTLER
===================================================== */

const emailBox =
    document.getElementById(
        "emailBox"
    );

const codeInput =
    document.getElementById(
        "codeInput"
    );

const status =
    document.getElementById(
        "status"
    );

const verifyButton =
    document.getElementById(
        "verifyButton"
    );

const resendButton =
    document.getElementById(
        "resendButton"
    );

const changeButton =
    document.getElementById(
        "changeButton"
    );

const backButton =
    document.getElementById(
        "backButton"
    );


/* =====================================================
   URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


/* =====================================================
   KAYIT BİLGİLERİ
===================================================== */

const username =
    (
        params.get("username") ||
        sessionStorage.getItem(
            "minegram_register_username"
        ) ||
        ""
    )
    .trim()
    .replace(/^@/, "")
    .toLowerCase();


const email =
    (
        params.get("email") ||
        sessionStorage.getItem(
            "minegram_register_email"
        ) ||
        ""
    )
    .trim()
    .toLowerCase();


/* =====================================================
   EMAIL
===================================================== */

if(email){

    emailBox.textContent =
        email;

}
else{

    emailBox.textContent =
        "E-posta adresi bulunamadı.";

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    text,
    type = ""
){

    status.textContent =
        text || "";

    status.className =
        "status";

    if(type){

        status.classList.add(
            type
        );

    }

}


/* =====================================================
   GERİ
===================================================== */

function goBack(){

    let url =
        "./iletisim-bilgileri.html";

    if(username){

        url +=
            "?username=" +
            encodeURIComponent(
                username
            );

    }

    window.location.href =
        url;

}


backButton.addEventListener(
    "click",
    goBack
);


changeButton.addEventListener(
    "click",
    goBack
);


backButton.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            goBack();

        }

    }
);


/* =====================================================
   KOD INPUT
===================================================== */

codeInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,6);

        verifyButton.disabled =
            this.value.length !== 6;

    }
);


/* =====================================================
   API YARDIMCI
===================================================== */

async function api(
    url,
    options = {}
){

    const response =
        await fetch(
            url,
            {
                ...options,
                headers:{
                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})
                }
            }
        );

    const data =
        await response
            .json()
            .catch(
                () => ({})
            );

    if(!response.ok){

        throw new Error(
            data.error ||
            "Sunucu hatası."
        );

    }

    return data;

}


/* =====================================================
   KOD GÖNDER
===================================================== */

async function sendCode(){

    if(!email){

        showStatus(
            "E-posta adresi bulunamadı."
        );

        return false;

    }


    try{

        resendButton.disabled =
            true;

        resendButton.textContent =
            "Gönderiliyor...";


        showStatus(
            "Doğrulama kodu gönderiliyor...",
            "loading"
        );


        await api(
            "/api/register/send-code",
            {
                method:
                    "POST",

                body:
                    JSON.stringify({
                        email
                    })
            }
        );


        showStatus(
            "6 haneli doğrulama kodu e-posta adresine gönderildi.",
            "success"
        );


        verifyButton.disabled =
            codeInput.value.length !== 6;


        startResendTimer();


        return true;

    }
    catch(error){

        console.error(
            "OTP gönderme hatası:",
            error
        );


        showStatus(
            error.message ||
            "Doğrulama kodu gönderilemedi."
        );


        resendButton.disabled =
            false;

        resendButton.textContent =
            "Doğrulama kodunu tekrar gönder";


        return false;

    }

}


/* =====================================================
   TEKRAR GÖNDER SAYACI
===================================================== */

let resendTimer = null;


function startResendTimer(){

    if(resendTimer){

        clearInterval(
            resendTimer
        );

    }


    let seconds =
        30;


    resendButton.disabled =
        true;


    resendButton.textContent =
        "Tekrar gönder (" +
        seconds +
        ")";


    resendTimer =
        setInterval(
            function(){

                seconds--;


                resendButton.textContent =
                    "Tekrar gönder (" +
                    seconds +
                    ")";


                if(seconds <= 0){

                    clearInterval(
                        resendTimer
                    );

                    resendTimer =
                        null;


                    resendButton.disabled =
                        false;


                    resendButton.textContent =
                        "Doğrulama kodunu tekrar gönder";

                }

            },
            1000
        );

}


/* =====================================================
   KOD DOĞRULA
===================================================== */

verifyButton.addEventListener(
    "click",
    async function(){

        const code =
            codeInput.value.trim();


        if(
            !email ||
            code.length !== 6
        ){

            showStatus(
                "6 haneli doğrulama kodunu gir."
            );

            return;

        }


        verifyButton.disabled =
            true;

        resendButton.disabled =
            true;


        verifyButton.textContent =
            "Kontrol ediliyor...";


        showStatus(
            "Doğrulama kodu kontrol ediliyor...",
            "loading"
        );


        try{

            const result =
                await api(
                    "/api/register/verify-code",
                    {
                        method:
                            "POST",

                        body:
                            JSON.stringify({
                                email,
                                code
                            })
                    }
                );


            if(
                result.ok &&
                result.verified
            ){

                sessionStorage.setItem(
                    "minegram_email_verified",
                    "true"
                );


                sessionStorage.setItem(
                    "minegram_register_verified_email",
                    email
                );


                showStatus(
                    "E-posta adresin doğrulandı. Minegram'a giriyorsun...",
                    "success"
                );


                verifyButton.textContent =
                    "Doğrulandı";


                setTimeout(
                    function(){

                        window.location.href =
                            "./index.html";

                    },
                    800
                );

            }
            else{

                throw new Error(
                    "Doğrulama başarısız."
                );

            }

        }
        catch(error){

            console.error(
                "OTP doğrulama hatası:",
                error
            );


            showStatus(
                error.message ||
                "Doğrulama kodu yanlış."
            );


            verifyButton.disabled =
                false;


            resendButton.disabled =
                false;


            verifyButton.textContent =
                "Kontrol et";

        }

    }
);


/* =====================================================
   TEKRAR GÖNDER
===================================================== */

resendButton.addEventListener(
    "click",
    async function(){

        await sendCode();

    }
);


/* =====================================================
   SAYFA BAŞLAT
===================================================== */

async function start(){

    console.log(
        "[MINEGRAM] hesap-doğrulama.html başladı."
    );


    console.log(
        "[MINEGRAM] Username:",
        username
    );


    console.log(
        "[MINEGRAM] Email:",
        email
    );


    if(!email){

        showStatus(
            "E-posta adresi bulunamadı."
        );

        verifyButton.disabled =
            true;

        resendButton.disabled =
            true;

        return;

    }


    /*
     * İlk doğrulama kodunu gönder.
     */

    await sendCode();

}


start();

</script>

</body>
</html>
