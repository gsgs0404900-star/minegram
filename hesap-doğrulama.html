<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Hesabını doğrula - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:365px;
    margin-top:90px;
    text-align:center;
}

/* ÜST */
.header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:25px;
}

.back{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    margin-right:8px;
}

.header-title{
    font-size:16px;
    font-weight:700;
}

/* İÇERİK */
.title{
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 12px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.45;
    margin:0 0 22px;
}

/* KOD */
.code{
    width:100%;
    height:44px;
    margin-bottom:9px;
    padding:0 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#000;
    color:#fff;
    outline:none;
    font-size:12px;
    letter-spacing:2px;
}

.code::placeholder{
    color:#777;
    letter-spacing:0;
}

.code:focus{
    border-color:#555;
}

/* DURUM */
.status{
    min-height:20px;
    margin-top:10px;
    font-size:12px;
    color:#ff4d4d;
}

.status.success{
    color:#35c759;
}

/* ALT */
.bottom{
    display:flex;
    gap:9px;
    width:100%;
    margin-top:25px;
}

.action{
    width:50%;
    height:42px;
    border-radius:22px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.back-btn{
    background:#000;
    border:1px solid #555;
    color:#0095f6;
}

.verify{
    background:#2d80bd;
    border:0;
    color:#000;
}

.verify:hover{
    background:#348dca;
}

.verify:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* MOBİL */
@media(max-width:600px){

    .box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:60px;
    }

    .header{
        margin-bottom:22px;
    }

    .header-title{
        font-size:15px;
    }

    .title{
        font-size:21px;
    }

    .description{
        font-size:12px;
    }

    .code{
        height:44px;
        font-size:12px;
    }

    .action{
        height:42px;
        font-size:12px;
    }

    .status{
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="page">
<div class="box">

<header class="header">
    <div
        class="back"
        id="backButton"
        aria-label="Geri"
        role="button"
        tabindex="0"
    >‹</div>

    <div class="header-title">
        Kayıt ol
    </div>
</header>

<h1 class="title">
    Hesabını doğrula
</h1>

<p class="description">
    E-posta adresine gönderilen doğrulama<br>
    kodunu gir.
</p>

<input
    id="code"
    class="code"
    type="text"
    inputmode="numeric"
    autocomplete="one-time-code"
    maxlength="6"
    placeholder="Doğrulama kodu"
    aria-label="Doğrulama kodu"
>

<div id="status" class="status"></div>

<div class="bottom">

    <button
        id="changeButton"
        class="action back-btn"
        type="button"
    >
        İletişim bilgini değiştir
    </button>

    <button
        id="verifyButton"
        class="action verify"
        type="button"
    >
        Doğrula
    </button>

</div>

</div>
</div>

<script>
"use strict";

const codeInput = document.getElementById("code");
const verifyButton = document.getElementById("verifyButton");
const changeButton = document.getElementById("changeButton");
const backButton = document.getElementById("backButton");
const status = document.getElementById("status");

const params = new URLSearchParams(window.location.search);

const username =
    params.get("username") ||
    sessionStorage.getItem("minegram_register_username") ||
    "";

const email =
    params.get("email") ||
    sessionStorage.getItem("minegram_register_email") ||
    "";

const phone =
    params.get("phone") ||
    sessionStorage.getItem("minegram_register_phone") ||
    "";

function showStatus(text, success = false){
    status.textContent = text || "";
    status.className = success ? "status success" : "status";
}

codeInput.addEventListener("input", function(){
    codeInput.value =
        codeInput.value.replace(/\D/g,"").slice(0,6);
    showStatus("");
});

function goBack(){
    let url = "./iletisim-bilgileri.html";

    if(username){
        url += "?username=" + encodeURIComponent(username);
    }

    window.location.href = url;
}

backButton.addEventListener("click", goBack);
changeButton.addEventListener("click", goBack);

backButton.addEventListener("keydown", function(event){
    if(event.key === "Enter" || event.key === " "){
        event.preventDefault();
        goBack();
    }
});

verifyButton.addEventListener("click", function(){

    const code = codeInput.value.trim();

    if(!code){
        showStatus("Lütfen doğrulama kodunu gir.");
        codeInput.focus();
        return;
    }

    if(code.length !== 6){
        showStatus("Doğrulama kodu 6 haneli olmalıdır.");
        codeInput.focus();
        return;
    }

    if(username){
        sessionStorage.setItem(
            "minegram_register_username",
            username
        );
    }

    if(email){
        sessionStorage.setItem(
            "minegram_register_email",
            email
        );
    }

    if(phone){
        sessionStorage.setItem(
            "minegram_register_phone",
            phone
        );
    }

    showStatus(
        "Kod alındı. Doğrulama yapılıyor...",
        true
    );

    verifyButton.disabled = true;
    verifyButton.textContent = "Doğrulanıyor...";

    setTimeout(function(){

        showStatus(
            "Hesabın doğrulandı. Minegram'a giriyorsun...",
            true
        );

        verifyButton.textContent = "Doğrulandı";

        setTimeout(function(){
            window.location.href = "./index.html";
        },700);

    },500);
});

codeInput.addEventListener("keydown", function(event){
    if(event.key === "Enter"){
        event.preventDefault();
        verifyButton.click();
    }
});

if(!email && !phone){
    showStatus("İletişim bilgisi bulunamadı.");
}

codeInput.focus();

console.log("[MINEGRAM] Hesap doğrulama sayfası hazır.");
console.log("[MINEGRAM] Username:", username);
console.log("[MINEGRAM] Email:", email);
console.log("[MINEGRAM] Phone:", phone);
</script>

</body>
</html>
