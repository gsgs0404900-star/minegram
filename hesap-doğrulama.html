<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Hesabını doğrula - Minegram</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh}.page{min-height:100vh;background:#000}.header{height:60px;border-bottom:1px solid #262626;display:flex;align-items:center;padding:0 18px}.back{width:40px;height:40px;border:0;background:transparent;color:#fff;font-size:28px;cursor:pointer;padding:0}.title{font-size:16px;font-weight:600;margin-left:8px}.wrap{width:100%;max-width:420px;margin:0 auto;padding:38px 24px 40px}.icon{width:64px;height:64px;border:1px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:29px}.heading{text-align:center;font-size:25px;line-height:1.25;margin:0 0 10px;font-weight:700}.sub{text-align:center;color:#a8a8a8;font-size:14px;line-height:1.55;margin:0 auto 26px;max-width:340px}.emailBox{border:1px solid #292929;background:#101010;border-radius:12px;padding:14px 16px;margin-bottom:20px;text-align:center}.emailLabel{color:#8e8e8e;font-size:12px;margin-bottom:5px}.emailValue{font-size:14px;font-weight:600;word-break:break-all}.code{width:100%;height:58px;background:#0d0d0d;border:1px solid #333;border-radius:12px;color:#fff;text-align:center;font-size:25px;letter-spacing:9px;outline:none;padding-left:9px}.code:focus{border-color:#777}.btn{width:100%;height:50px;border:0;border-radius:9px;background:#2677b5;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px}.btn:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#1b1b1b;border:1px solid #303030;color:#fff}.msg{min-height:22px;text-align:center;font-size:13px;margin-top:14px;color:#aaa}.error{color:#ff6b6b}.success{color:#55d98b}.small{color:#777;font-size:12px;text-align:center;margin-top:18px;line-height:1.5}.spinner{display:inline-block;width:17px;height:17px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:480px){.wrap{padding-left:20px;padding-right:20px}.heading{font-size:23px}}
</style></head>
<body><div class="page"><header class="header"><button class="back" id="backBtn" type="button" aria-label="Geri">‹</button><div class="title">Hesabını doğrula</div></header><main class="wrap"><div class="icon">✉</div><h1 class="heading" id="heading">Hesabını doğrula</h1><p class="sub" id="sub">E-posta adresine gönderdiğimiz 6 haneli doğrulama kodunu gir.</p><div class="emailBox"><div class="emailLabel">Kod gönderilen e-posta</div><div class="emailValue" id="emailValue">E-posta adresin</div></div><input id="codeInput" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" aria-label="6 haneli doğrulama kodu"><button class="btn" id="verifyBtn" type="button">Doğrula</button><button class="btn secondary" id="resendBtn" type="button">Kodu yeniden gönder</button><div id="message" class="msg"></div><div id="timer" class="small"></div></main></div>
<script>
(()=>{"use strict";
const codeInput=document.getElementById("codeInput"),verifyBtn=document.getElementById("verifyBtn"),resendBtn=document.getElementById("resendBtn"),message=document.getElementById("message"),emailValue=document.getElementById("emailValue"),timer=document.getElementById("timer"),backBtn=document.getElementById("backBtn"),heading=document.getElementById("heading"),sub=document.getElementById("sub");
const params=new URLSearchParams(location.search);const getS=k=>{try{return sessionStorage.getItem(k)||""}catch{return""}};const setS=(k,v)=>{try{sessionStorage.setItem(k,String(v??""))}catch{}};const first=(...v)=>v.find(x=>x!==undefined&&x!==null&&String(x).trim()!=="")||"";
const mode=first(params.get("mode"),getS("minegram_verification_mode"),"email").trim().toLowerCase();
const isRegister=mode==="register";
const identifier=first(params.get("identifier"),params.get("username"),getS("minegram_recovery_identifier"),getS("minegram_register_username")).trim().replace(/^@/,"");
const email=first(params.get("email"),getS(isRegister?"minegram_register_email":"minegram_recovery_email")).trim().toLowerCase();
const registrationId=first(params.get("registrationId"),params.get("registration_id"),getS("minegram_register_registration_id")).trim();
const password=getS("minegram_register_password");
emailValue.textContent=email||"E-posta adresin";
if(isRegister){heading.textContent="E-postanı doğrula";sub.textContent="Minegram hesabını oluşturmak için e-posta adresine gönderdiğimiz 6 haneli kodu gir."}
function show(t,type=""){message.textContent=String(t||"");message.className="msg"+(type?" "+type:"")}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{"Content-Type":"application/json","Accept":"application/json",...(options.headers||{})},credentials:"include",cache:"no-store"});const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{d={error:raw||"Sunucudan geçersiz cevap geldi."}};if(!r.ok)throw new Error(d.error||d.message||"Sunucu hatası.");return d}
let remaining=60,timerId=null,resendLocked=true;
function startTimer(seconds=60){remaining=Number(seconds)||60;resendLocked=true;resendBtn.disabled=true;clearInterval(timerId);const tick=()=>{if(remaining<=0){clearInterval(timerId);timerId=null;resendLocked=false;resendBtn.disabled=false;resendBtn.textContent="Kodu yeniden gönder";timer.textContent="";return}timer.textContent="Yeni kod göndermek için "+remaining+" saniye bekle.";resendBtn.textContent="Tekrar gönder ("+remaining+")";remaining--};tick();timerId=setInterval(tick,1000)}
async function verify(){const code=String(codeInput.value||"").replace(/\D/g,"").slice(0,6);codeInput.value=code;if(!/^\d{6}$/.test(code)){show("6 haneli doğrulama kodunu gir.","error");return}if(isRegister&&!registrationId){show("Kayıt doğrulama oturumu bulunamadı. Lütfen kayıt işlemine baştan başla.","error");return}verifyBtn.disabled=true;resendBtn.disabled=true;verifyBtn.innerHTML='<span class="spinner"></span>Doğrulanıyor...';show("Doğrulama kodu kontrol ediliyor...");try{let data;if(isRegister){data=await api("/api/register/verify",{method:"POST",body:JSON.stringify({registrationId,email,code,password})});if(data.ok!==true)throw new Error(data.error||"Doğrulama başarısız.");setS("minegram_register_verified","true");setS("minegram_register_auth_email",data.authEmail||"");show("Hesabın başarıyla doğrulandı. Giriş sayfasına yönlendiriliyorsun...","success");setTimeout(()=>{location.replace("/giris.html")},700)}else{data=await api("/api/forgot/verify",{method:"POST",body:JSON.stringify({identifier,email,mode,code})});const token=first(data.resetToken,data.reset_token,data.token,data.recoveryToken);if(!token)throw new Error("Kod doğrulandı ancak şifre sıfırlama anahtarı alınamadı.");setS("minegram_password_reset_token",token);setS("minegram_reset_token",token);setS("resetToken",token);show("Kod doğrulandı. Yeni şifre ekranına gidiyorsun...","success");const url=new URL("./yeni-sifre.html",location.href);url.searchParams.set("token",token);if(identifier)url.searchParams.set("identifier",identifier);if(email)url.searchParams.set("email",email);setTimeout(()=>location.replace(url.href),500)}}catch(e){show(e.message||"Kod doğrulanamadı. Lütfen tekrar dene.","error");verifyBtn.disabled=false;resendBtn.disabled=false;verifyBtn.textContent="Doğrula"}}
async function resend(){if(resendLocked)return;resendLocked=true;resendBtn.disabled=true;resendBtn.textContent="Gönderiliyor...";show("Yeni doğrulama kodu gönderiliyor...");try{let data;if(isRegister){data=await api("/api/register/resend",{method:"POST",body:JSON.stringify({registrationId,email})})}else{data=await api("/api/forgot/start",{method:"POST",body:JSON.stringify({identifier:identifier||email,email,mode:mode||"email"})})}if(data?.email){setS(isRegister?"minegram_register_email":"minegram_recovery_email",data.email);emailValue.textContent=data.email}show(data?.message||"Yeni doğrulama kodu gönderildi.","success");codeInput.value="";codeInput.focus();startTimer(60)}catch(e){show(e.message||"Yeni kod gönderilemedi.","error");resendLocked=false;resendBtn.disabled=false;resendBtn.textContent="Kodu yeniden gönder"}}
backBtn.onclick=()=>{if(isRegister)location.href="/sifre-olustur.html";else location.href="./hesaplarini-bulduk.html"};verifyBtn.onclick=verify;resendBtn.onclick=resend;codeInput.addEventListener("input",function(){this.value=this.value.replace(/\D/g,"").slice(0,6);if(this.value.length===6&&!verifyBtn.disabled)verify()});codeInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(codeInput.value.length===6&&!verifyBtn.disabled)verify()}});
if(!isRegister&& !identifier&&!email){show("Şifre sıfırlama bilgileri bulunamadı. Lütfen işlemi yeniden başlat.","error");verifyBtn.disabled=true;resendBtn.disabled=true}else{show(isRegister?"E-postana gönderilen 6 haneli kodu gir.":"E-postana gönderilen 6 haneli kodu gir.","success");codeInput.focus();startTimer(60)}
})();
</script></body></html>
