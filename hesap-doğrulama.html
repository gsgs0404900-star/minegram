<script>
"use strict";

document.addEventListener("DOMContentLoaded", function () {

    /* =====================================================
       ELEMENTLER
    ===================================================== */

    const emailBox = document.getElementById("emailBox");
    const codeInput = document.getElementById("codeInput");
    const status = document.getElementById("status");
    const verifyButton = document.getElementById("verifyButton");
    const resendButton = document.getElementById("resendButton");
    const changeButton = document.getElementById("changeButton");
    const backButton = document.getElementById("backButton");


    /* =====================================================
       ELEMENT KONTROLÜ
    ===================================================== */

    if (
        !emailBox ||
        !codeInput ||
        !status ||
        !verifyButton ||
        !resendButton ||
        !changeButton ||
        !backButton
    ) {
        console.error(
            "[MINEGRAM] Doğrulama sayfasındaki HTML elemanları eksik."
        );

        if (document.body) {
            document.body.innerHTML = `
                <div style="
                    min-height:100vh;
                    background:#000;
                    color:#fff;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    padding:30px;
                    box-sizing:border-box;
                    font-family:Arial,sans-serif;
                    text-align:center;
                ">
                    <div>
                        <h2>Minegram</h2>
                        <p>
                            Doğrulama sayfası yüklenemedi.
                        </p>
                        <p style="color:#aaa;font-size:14px;">
                            Sayfanın HTML yapısını kontrol et.
                        </p>
                    </div>
                </div>
            `;
        }

        return;
    }


    /* =====================================================
       URL PARAMETRELERİ
    ===================================================== */

    const params = new URLSearchParams(
        window.location.search
    );


    /* =====================================================
       HESAP BİLGİLERİ
    ===================================================== */

    let identifier = (
        params.get("identifier") ||
        params.get("username") ||
        sessionStorage.getItem(
            "minegram_recovery_identifier"
        ) ||
        ""
    )
        .trim()
        .replace(/^@/, "")
        .toLowerCase();


    let mode = (
        params.get("mode") ||
        sessionStorage.getItem(
            "minegram_recovery_mode"
        ) ||
        "username"
    )
        .trim()
        .toLowerCase();


    let email = (
        params.get("email") ||
        sessionStorage.getItem(
            "minegram_recovery_email"
        ) ||
        ""
    )
        .trim()
        .toLowerCase();


    /* =====================================================
       SESSION KAYDET
    ===================================================== */

    if (identifier) {
        sessionStorage.setItem(
            "minegram_recovery_identifier",
            identifier
        );
    }

    if (email) {
        sessionStorage.setItem(
            "minegram_recovery_email",
            email
        );
    }

    sessionStorage.setItem(
        "minegram_recovery_mode",
        mode
    );


    /* =====================================================
       EMAIL GÖSTER
    ===================================================== */

    if (email) {
        emailBox.textContent = email;
    } else {
        emailBox.textContent =
            "E-posta adresi yükleniyor...";
    }


    /* =====================================================
       STATUS
    ===================================================== */

    function showStatus(text, type) {

        status.textContent = text || "";
        status.className = "status";

        if (type) {
            status.classList.add(type);
        }
    }


    /* =====================================================
       API
    ===================================================== */

    async function api(url, options) {

        options = options || {};

        let response;

        try {

            response = await fetch(
                url,
                {
                    ...options,

                    headers: {
                        "Content-Type":
                            "application/json",

                        ...(options.headers || {})
                    }
                }
            );

        } catch (error) {

            console.error(
                "[MINEGRAM] FETCH HATASI:",
                error
            );

            throw new Error(
                "Sunucuya bağlanılamadı. Minegram sunucusunu kontrol et."
            );
        }


        const text =
            await response.text();


        let data = {};

        try {

            data = text
                ? JSON.parse(text)
                : {};

        } catch (error) {

            console.error(
                "[MINEGRAM] JSON HATASI:",
                text
            );

            data = {};
        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Sunucu hatası."
            );
        }


        return data;
    }


    /* =====================================================
       GERİ
    ===================================================== */

    function goBack() {

        window.location.href =
            "./hesaplarini-bulduk.html";
    }


    backButton.addEventListener(
        "click",
        goBack
    );


    changeButton.addEventListener(
        "click",
        goBack
    );


    backButton.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();
                goBack();
            }
        }
    );


    /* =====================================================
       KOD GİRİŞİ
    ===================================================== */

    codeInput.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 6);


            verifyButton.disabled =
                this.value.length !== 6;
        }
    );


    /* =====================================================
       TEKRAR GÖNDER SAYACI
    ===================================================== */

    let resendTimer = null;


    function startResendTimer() {

        if (resendTimer) {

            clearInterval(
                resendTimer
            );

            resendTimer = null;
        }


        let seconds = 30;


        resendButton.disabled = true;


        resendButton.textContent =
            "Tekrar gönder (" +
            seconds +
            ")";


        resendTimer =
            setInterval(
                function () {

                    seconds--;


                    resendButton.textContent =
                        "Tekrar gönder (" +
                        seconds +
                        ")";


                    if (seconds <= 0) {

                        clearInterval(
                            resendTimer
                        );

                        resendTimer = null;


                        resendButton.disabled =
                            false;


                        resendButton.textContent =
                            "Doğrulama kodunu tekrar gönder";
                    }

                },
                1000
            );
    }


    /* =====================================================
       KURTARMA KODU GÖNDER
    ===================================================== */

    async function sendRecoveryCode() {

        if (!identifier) {

            showStatus(
                "Hesap bilgisi bulunamadı. Şifre yenileme işlemini yeniden başlat."
            );

            return false;
        }


        try {

            resendButton.disabled = true;

            resendButton.textContent =
                "Gönderiliyor...";


            showStatus(
                "Doğrulama kodu gönderiliyor...",
                "loading"
            );


            const result =
                await api(
                    "/api/forgot/start",
                    {
                        method: "POST",

                        body: JSON.stringify({
                            identifier:
                                identifier,

                            mode:
                                mode
                        })
                    }
                );


            if (
                !result ||
                result.ok === false
            ) {

                throw new Error(
                    result?.error ||
                    "Kod gönderilemedi."
                );
            }


            /* ---------------------------------------------
               SUNUCUDAN GELEN EMAIL
            --------------------------------------------- */

            if (result.email) {

                email =
                    String(
                        result.email
                    )
                        .trim()
                        .toLowerCase();


                sessionStorage.setItem(
                    "minegram_recovery_email",
                    email
                );


                emailBox.textContent =
                    email;
            }


            /* ---------------------------------------------
               RECOVERY BAŞLADI
            --------------------------------------------- */

            sessionStorage.setItem(
                "minegram_recovery_started",
                "true"
            );


            showStatus(
                "6 haneli doğrulama kodu e-posta adresine gönderildi.",
                "success"
            );


            startResendTimer();


            verifyButton.disabled =
                codeInput.value.length !== 6;


            try {
                codeInput.focus();
            } catch (e) {}


            return true;

        } catch (error) {

            console.error(
                "[MINEGRAM] Kod gönderme hatası:",
                error
            );


            showStatus(
                error.message ||
                "Doğrulama kodu gönderilemedi."
            );


            resendButton.disabled =
                false;


            resendButton.textContent =
                "Doğrulama kodunu tekrar gönder";


            return false;
        }
    }


    /* =====================================================
       KOD DOĞRULA
    ===================================================== */

    verifyButton.addEventListener(
        "click",
        async function () {

            const code =
                codeInput.value.trim();


            if (!identifier) {

                showStatus(
                    "Hesap bilgisi bulunamadı."
                );

                return;
            }


            if (code.length !== 6) {

                showStatus(
                    "6 haneli doğrulama kodunu gir."
                );

                return;
            }


            verifyButton.disabled = true;
            resendButton.disabled = true;


            verifyButton.textContent =
                "Kontrol ediliyor...";


            showStatus(
                "Doğrulama kodu kontrol ediliyor...",
                "loading"
            );


            try {

                const result =
                    await api(
                        "/api/forgot/verify",
                        {
                            method: "POST",

                            body: JSON.stringify({

                                identifier:
                                    identifier,

                                email:
                                    email,

                                mode:
                                    mode,

                                code:
                                    code
                            })
                        }
                    );


                /* -----------------------------------------
                   BAŞARISIZ
                ----------------------------------------- */

                if (
                    !result ||
                    result.ok !== true
                ) {

                    throw new Error(
                        result?.error ||
                        "Doğrulama kodu yanlış veya süresi dolmuş."
                    );
                }


                /* -----------------------------------------
                   EMAIL KAYDET
                ----------------------------------------- */

                if (result.email) {

                    email =
                        String(
                            result.email
                        )
                            .trim()
                            .toLowerCase();


                    sessionStorage.setItem(
                        "minegram_recovery_email",
                        email
                    );
                }


                /* -----------------------------------------
                   HESAP KAYDET
                ----------------------------------------- */

                if (result.account) {

                    sessionStorage.setItem(
                        "minegram_recovery_account",
                        JSON.stringify(
                            result.account
                        )
                    );
                }


                /* -----------------------------------------
                   DOĞRULANDI
                ----------------------------------------- */

                sessionStorage.setItem(
                    "minegram_recovery_verified",
                    "true"
                );


                showStatus(
                    "Kod doğrulandı. Hesapların bulundu.",
                    "success"
                );


                verifyButton.textContent =
                    "Doğrulandı";


                /* -----------------------------------------
                   HESAPLARINI BULDUK SAYFASINA GİT
                ----------------------------------------- */

                setTimeout(
                    function () {

                        const nextParams =
                            new URLSearchParams();


                        if (identifier) {

                            nextParams.set(
                                "identifier",
                                identifier
                            );
                        }


                        if (email) {

                            nextParams.set(
                                "email",
                                email
                            );
                        }


                        if (
                            result.account &&
                            result.account.username
                        ) {

                            nextParams.set(
                                "username",
                                result.account.username
                            );
                        }


                        if (
                            result.account &&
                            (
                                result.account.displayName ||
                                result.account.display_name
                            )
                        ) {

                            nextParams.set(
                                "displayName",
                                result.account.displayName ||
                                result.account.display_name
                            );
                        }


                        const target =
                            "./hesaplarini-bulduk.html" +
                            (
                                nextParams.toString()
                                    ? "?" +
                                      nextParams.toString()
                                    : ""
                            );


                        console.log(
                            "[MINEGRAM] Hesap bulundu, yönlendiriliyor:",
                            target
                        );


                        window.location.href =
                            target;

                    },
                    700
                );

            } catch (error) {

                console.error(
                    "[MINEGRAM] Doğrulama hatası:",
                    error
                );


                showStatus(
                    error.message ||
                    "Doğrulama kodu yanlış."
                );


                verifyButton.disabled =
                    codeInput.value.length !== 6;


                resendButton.disabled =
                    false;


                verifyButton.textContent =
                    "Kontrol et";
            }

        }
    );


    /* =====================================================
       TEKRAR GÖNDER
    ===================================================== */

    resendButton.addEventListener(
        "click",
        async function () {

            await sendRecoveryCode();

        }
    );


    /* =====================================================
       ENTER
    ===================================================== */

    codeInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" &&
                codeInput.value.length === 6 &&
                !verifyButton.disabled
            ) {

                event.preventDefault();

                verifyButton.click();
            }
        }
    );


    /* =====================================================
       SAYFA BAŞLAT
    ===================================================== */

    async function start() {

        console.log(
            "[MINEGRAM] Doğrulama sayfası başlatıldı."
        );

        console.log(
            "[MINEGRAM] identifier:",
            identifier
        );

        console.log(
            "[MINEGRAM] mode:",
            mode
        );

        console.log(
            "[MINEGRAM] email:",
            email
        );


        /* ---------------------------------------------
           IDENTIFIER YOK
        --------------------------------------------- */

        if (!identifier) {

            showStatus(
                "Hesap bilgisi bulunamadı. Şifre yenileme işlemini yeniden başlat."
            );


            verifyButton.disabled = true;
            resendButton.disabled = true;


            return;
        }


        /* ---------------------------------------------
           DAHA ÖNCE KOD GÖNDERİLDİYSE
        --------------------------------------------- */

        const recoveryStarted =
            sessionStorage.getItem(
                "minegram_recovery_started"
            );


        if (
            recoveryStarted === "true"
        ) {

            showStatus(
                "E-postana gönderilen 6 haneli kodu gir.",
                "success"
            );


            startResendTimer();


            try {
                codeInput.focus();
            } catch (e) {}


            return;
        }


        /* ---------------------------------------------
           İLK KEZ
        --------------------------------------------- */

        await sendRecoveryCode();
    }


    /* =====================================================
       BAŞLAT
    ===================================================== */

    start();

});
</script>
