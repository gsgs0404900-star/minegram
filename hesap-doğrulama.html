<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#000000"
>

<title>Hesabını doğrula - Minegram</title>


<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}


html,
body{

  margin:0;
  width:100%;
  height:100%;

  background:#000;
  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}


body{
  overflow:hidden;
}


.page{

  width:100%;
  height:100dvh;
  min-height:100vh;

  background:#000;

  position:relative;

}


/* =========================
   ÜST
========================= */

.header{

  height:82px;

  display:flex;
  align-items:center;

  padding:0 48px;

}


.back{

  color:#fff;

  font-size:55px;

  line-height:1;

  font-weight:300;

  margin-right:27px;

  margin-top:-7px;

  cursor:pointer;

  user-select:none;

}


.header-title{

  font-size:29px;

  font-weight:700;

}


/* =========================
   İÇERİK
========================= */

.content{

  position:absolute;

  left:7.2%;
  right:7.2%;

  top:17.2%;

}


.title{

  text-align:center;

  font-size:47px;

  line-height:1.15;

  font-weight:800;

  margin:0 0 34px;

}


.description{

  color:#b9b9b9;

  font-size:31px;

  line-height:1.55;

  margin:0 0 69px;

}


/* =========================
   KOD
========================= */

.code{

  width:100%;

  height:119px;

  background:#111;

  border:2px solid #666;

  border-radius:10px;

  color:#fff;

  outline:none;

  padding:0 32px;

  font-size:31px;

  letter-spacing:5px;

}


.code:focus{

  border-color:#888;

}


.code::placeholder{

  color:#b8b8b8;

  opacity:1;

  letter-spacing:0;

}


/* =========================
   DURUM
========================= */

.status{

  position:absolute;

  left:7.2%;

  right:7.2%;

  bottom:calc(6.1% + 150px);

  text-align:center;

  font-size:18px;

  color:#ff4d4d;

  display:none;

}


.status.success{

  color:#35c759;

}


/* =========================
   ALT
========================= */

.bottom{

  position:absolute;

  left:7.2%;

  right:7.2%;

  bottom:6.1%;

  text-align:center;

}


.verify{

  width:100%;

  height:88px;

  border:0;

  border-radius:50px;

  background:#62b0ed;

  color:#30207c;

  font-size:27px;

  font-weight:800;

  cursor:pointer;

}


.verify:hover{

  background:#70b9f1;

}


.verify:disabled{

  opacity:.6;

  cursor:not-allowed;

}


.change{

  border:0;

  background:transparent;

  color:#62b0ed;

  font-size:27px;

  font-weight:700;

  margin-top:45px;

  cursor:pointer;

}


.change:hover{

  color:#80c3f5;

}


/* =========================
   MOBİL
========================= */

@media(max-width:600px){

  .header{

    height:72px;

    padding:0 19px;

  }


  .back{

    font-size:43px;

    margin-right:17px;

  }


  .header-title{

    font-size:23px;

  }


  .content{

    left:7.2%;

    right:7.2%;

    top:16.5%;

  }


  .title{

    font-size:34px;

    margin-bottom:27px;

  }


  .description{

    font-size:22px;

    line-height:1.55;

    margin-bottom:47px;

  }


  .code{

    height:82px;

    padding:0 22px;

    font-size:24px;

    border-radius:9px;

  }


  .bottom{

    left:7.2%;

    right:7.2%;

    bottom:5.8%;

  }


  .verify{

    height:72px;

    font-size:21px;

  }


  .change{

    font-size:21px;

    margin-top:34px;

  }


  .status{

    bottom:calc(5.8% + 125px);

    font-size:14px;

  }

}

</style>

</head>


<body>


<div class="page">


  <!-- =========================
       ÜST
  ========================== -->

  <header class="header">

    <div
      class="back"
      id="backButton"
      aria-label="Geri"
    >
      ‹
    </div>

    <div class="header-title">
      Kayıt ol
    </div>

  </header>


  <!-- =========================
       İÇERİK
  ========================== -->

  <main class="content">

    <h1 class="title">
      Hesabını doğrula
    </h1>


    <p class="description">

      E-posta adresine gönderilen doğrulama<br>
      kodunu gir.

    </p>


    <input
      id="code"
      class="code"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      placeholder="Doğrulama kodu"
      aria-label="Doğrulama kodu"
    >

  </main>


  <!-- =========================
       DURUM
  ========================== -->

  <div
    id="status"
    class="status"
  ></div>


  <!-- =========================
       ALT
  ========================== -->

  <div class="bottom">

    <button
      id="verifyButton"
      class="verify"
      type="button"
    >
      Kodu doğrula ve Minegram'a gir
    </button>


    <button
      id="changeButton"
      class="change"
      type="button"
    >
      İletişim bilgini değiştir
    </button>

  </div>


</div>


<!-- =========================================================
     MINEGRAM KAYIT DOĞRULAMA
========================================================= -->

<script>

"use strict";


/* =========================================================
   ELEMENTLER
========================================================= */

const codeInput =
  document.getElementById("code");

const verifyButton =
  document.getElementById("verifyButton");

const changeButton =
  document.getElementById("changeButton");

const backButton =
  document.getElementById("backButton");

const status =
  document.getElementById("status");


/* =========================================================
   STORAGE
========================================================= */

function getStorageValue(key){

  return (
    sessionStorage.getItem(key) ||
    localStorage.getItem(key) ||
    ""
  ).trim();

}


/* =========================================================
   URL PARAMETRELERİ
========================================================= */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


/* =========================================================
   KAYIT BİLGİLERİ
========================================================= */

const username =
  (
    urlParams.get("username") ||
    getStorageValue(
      "minegram_register_username"
    )
  )
  .trim()
  .replace(/^@/, "");


const email =
  (
    urlParams.get("email") ||
    getStorageValue(
      "minegram_register_email"
    )
  )
  .trim()
  .toLowerCase();


const phone =
  (
    urlParams.get("phone") ||
    getStorageValue(
      "minegram_register_phone"
    )
  )
  .trim();


const displayName =
  (
    urlParams.get("displayName") ||
    getStorageValue(
      "minegram_register_display_name"
    ) ||
    username
  )
  .trim();


/* =========================================================
   BİLGİLERİ KORU
========================================================= */

if(username){

  sessionStorage.setItem(
    "minegram_register_username",
    username
  );

}


if(email){

  sessionStorage.setItem(
    "minegram_register_email",
    email
  );

}


if(phone){

  sessionStorage.setItem(
    "minegram_register_phone",
    phone
  );

}


if(displayName){

  sessionStorage.setItem(
    "minegram_register_display_name",
    displayName
  );

}


/* =========================================================
   DURUM MESAJI
========================================================= */

function showStatus(
  text,
  success = false
){

  status.textContent =
    text || "";


  status.className =
    success
      ? "status success"
      : "status";


  status.style.display =
    text
      ? "block"
      : "none";

}


/* =========================================================
   KOD INPUT
========================================================= */

codeInput.addEventListener(
  "input",
  function(){

    this.value =
      this.value
        .replace(/\D/g, "")
        .slice(0, 6);

    showStatus("");

  }
);


/* =========================================================
   GERİ
========================================================= */

function goBack(){

  const params =
    new URLSearchParams();


  if(username){

    params.set(
      "username",
      username
    );

  }


  if(email){

    params.set(
      "email",
      email
    );

  }


  if(phone){

    params.set(
      "phone",
      phone
    );

  }


  const query =
    params.toString();


  let url =
    "./iletisim-bilgileri.html";


  if(query){

    url += "?" + query;

  }


  window.location.href =
    url;

}


backButton.addEventListener(
  "click",
  goBack
);


changeButton.addEventListener(
  "click",
  goBack
);


/* =========================================================
   KOD DOĞRULAMA
========================================================= */

async function verifyCode(){

  const code =
    codeInput.value.trim();


  showStatus("");


  if(!username){

    showStatus(
      "Kayıt bilgileri bulunamadı. Lütfen kayıt işlemine yeniden başla."
    );

    return;

  }


  if(!email && !phone){

    showStatus(
      "İletişim bilgileri bulunamadı. Lütfen geri dönüp tekrar dene."
    );

    return;

  }


  if(!code){

    showStatus(
      "Lütfen 6 haneli doğrulama kodunu gir."
    );

    codeInput.focus();

    return;

  }


  if(!/^\d{6}$/.test(code)){

    showStatus(
      "Doğrulama kodu 6 haneli olmalıdır."
    );

    codeInput.focus();

    return;

  }


  verifyButton.disabled =
    true;

  verifyButton.textContent =
    "Doğrulanıyor...";


  try{

    const response =
      await fetch(
        "/api/register/verify",
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:
            JSON.stringify({

              username:
                username,

              email:
                email,

              phone:
                phone,

              code:
                code

            }),

          cache:
            "no-store"

        }
      );


    const data =
      await response
        .json()
        .catch(
          () => ({})
        );


    console.log(
      "[MINEGRAM REGISTER VERIFY]",
      data
    );


    if(!response.ok){

      throw new Error(

        data.error ||
        data.message ||
        "Doğrulama kodu hatalı veya süresi dolmuş."

      );

    }


    if(data.ok === false){

      throw new Error(

        data.error ||
        data.message ||
        "Doğrulama başarısız."

      );

    }


    /* =====================================================
       BAŞARILI
    ===================================================== */

    sessionStorage.setItem(
      "minegram_register_verified",
      "true"
    );


    sessionStorage.setItem(
      "minegram_register_username",
      username
    );


    if(email){

      sessionStorage.setItem(
        "minegram_register_email",
        email
      );

    }


    if(phone){

      sessionStorage.setItem(
        "minegram_register_phone",
        phone
      );

    }


    if(displayName){

      sessionStorage.setItem(
        "minegram_register_display_name",
        displayName
      );

    }


    /* =====================================================
       TOKEN
    ===================================================== */

    if(data.token){

      sessionStorage.setItem(
        "minegram_register_token",
        String(data.token)
      );

      localStorage.setItem(
        "minegram_token",
        String(data.token)
      );

    }


    if(data.access_token){

      sessionStorage.setItem(
        "minegram_register_access_token",
        String(data.access_token)
      );

      localStorage.setItem(
        "minegram_supabase_token",
        String(data.access_token)
      );

    }


    /* =====================================================
       USER
    ===================================================== */

    if(data.user){

      try{

        sessionStorage.setItem(
          "minegram_register_user",
          JSON.stringify(data.user)
        );

        localStorage.setItem(
          "minegram_user",
          JSON.stringify(data.user)
        );

      }
      catch(error){

        console.warn(
          "Kullanıcı bilgisi saklanamadı:",
          error
        );

      }


      if(data.user.id){

        localStorage.setItem(
          "minegram_user_id",
          String(data.user.id)
        );

      }


      if(data.user.username){

        localStorage.setItem(
          "minegram_username",
          String(data.user.username)
        );

      }

    }


    /* =====================================================
       BAŞARILI MESAJ
    ===================================================== */

    showStatus(
      "Hesabın doğrulandı. Profil oluşturma sayfasına geçiliyor...",
      true
    );


    verifyButton.textContent =
      "Doğrulandı";


    /* =====================================================
       PROFİL OLUŞTUR
    ===================================================== */

    setTimeout(
      function(){

        window.location.href =
          "./profil-olustur.html";

      },
      500
    );

  }
  catch(error){

    console.error(
      "[MINEGRAM REGISTER VERIFY ERROR]",
      error
    );


    showStatus(
      error.message ||
      "Doğrulama yapılamadı. Lütfen tekrar dene."
    );


    verifyButton.disabled =
      false;


    verifyButton.textContent =
      "Kodu doğrula ve Minegram'a gir";

  }

}


/* =========================================================
   BUTON
========================================================= */

verifyButton.addEventListener(
  "click",
  verifyCode
);


/* =========================================================
   ENTER
========================================================= */

codeInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      verifyCode();

    }

  }
);


/* =========================================================
   SAYFA KONTROL
========================================================= */

if(!username){

  showStatus(
    "Kayıt bilgileri bulunamadı. Lütfen kayıt işlemine yeniden başla."
  );

}
else if(!email && !phone){

  showStatus(
    "İletişim bilgileri bulunamadı. Lütfen geri dönüp tekrar dene."
  );

}


/* =========================================================
   BAŞLANGIÇ
========================================================= */

setTimeout(
  function(){

    codeInput.focus();

  },
  150
);


console.log(
  "[MINEGRAM] Kayıt doğrulama sayfası hazır."
);

console.log(
  "[MINEGRAM] username:",
  username
);

console.log(
  "[MINEGRAM] email:",
  email
);

console.log(
  "[MINEGRAM] phone:",
  phone
);

</script>


</body>

</html>
