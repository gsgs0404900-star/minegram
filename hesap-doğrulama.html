<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>E-posta Kontrol Et - Minegram</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}


/* =========================
   ÜST BAR
========================= */

.topbar{
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:25px;
    height:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    font-size:34px;
    font-weight:300;
    line-height:1;

    cursor:pointer;
    user-select:none;
}

.top-title{
    margin-left:15px;
    font-size:20px;
    font-weight:700;
    color:#fff;
}


/* =========================
   İÇERİK
========================= */

.content{
    width:317px;
    margin:115px auto 0;
}


/* =========================
   BAŞLIK
========================= */

.title{
    text-align:center;

    font-size:30px;
    line-height:1.15;
    font-weight:700;

    margin:0 0 34px;
    color:#fff;
}


/* =========================
   AÇIKLAMA
========================= */

.description{
    font-size:18px;
    line-height:1.45;

    color:#bdbdbd;

    margin:0 0 65px;
}


/* =========================
   KOD
========================= */

.code-input{
    display:block;

    width:100%;
    height:39px;

    padding:0 10px;

    border:1px solid #252525;
    border-radius:6px;

    background:#050505;
    color:#fff;

    outline:none;

    font-size:12px;
    font-family:Arial,Helvetica,sans-serif;

    letter-spacing:3px;
}

.code-input::placeholder{
    color:#777;
    opacity:1;
    letter-spacing:0;
}

.code-input:focus{
    border-color:#2677b5;

    box-shadow:
        0 0 0 1px #2677b5;
}


/* =========================
   DOĞRULA
========================= */

.verify-btn{
    display:block;

    width:100%;
    height:37px;

    margin-top:8px;

    border:0;
    border-radius:22px;

    background:#2677b5;
    color:#000;

    font-size:12px;
    font-weight:700;

    cursor:pointer;

    transition:
        opacity .15s ease,
        transform .1s ease;
}

.verify-btn:hover{
    opacity:.92;
}

.verify-btn:active{
    transform:scale(.99);
}

.verify-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* =========================
   TEKRAR GÖNDER
========================= */

.resend-btn{
    display:block;

    width:100%;

    margin-top:12px;
    padding:0;

    border:0;
    background:transparent;

    text-align:center;

    color:#2677b5;

    font-size:12px;
    font-weight:400;

    cursor:pointer;
    line-height:1.4;
}

.resend-btn:hover{
    text-decoration:underline;
}

.resend-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* =========================
   MESAJ
========================= */

.message{
    min-height:18px;

    margin-top:12px;

    text-align:center;

    font-size:11px;
    line-height:1.4;

    color:#2677b5;
}

.message.success{
    color:#2677b5;
}

.message.error{
    color:#ff5c5c;
}


/* =========================
   MOBİL
========================= */

@media(max-width:600px){

    .topbar{
        height:70px;
        padding-left:28px;
    }

    .back{
        width:30px;
        height:38px;
        font-size:38px;
    }

    .top-title{
        margin-left:12px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 120px);
        max-width:714px;
        margin:105px auto 0;
    }

    .title{
        font-size:42px;
        margin-bottom:30px;
    }

    .description{
        font-size:21px;
        line-height:1.5;
        margin-bottom:55px;
    }

    .code-input{
        height:68px;

        padding:0 20px;

        font-size:18px;

        border:2px solid #686868;
        border-radius:9px;
    }

    .code-input:focus{
        border-color:#2677b5;

        box-shadow:
            0 0 0 1px #2677b5;
    }

    .verify-btn{
        height:58px;
        margin-top:18px;

        font-size:20px;

        border-radius:32px;

        background:#2677b5;
        color:#000;
    }

    .resend-btn{
        margin-top:25px;

        font-size:18px;
        font-weight:700;

        color:#2677b5;
    }

    .message{
        font-size:14px;
    }

}


/* =========================
   KÜÇÜK TELEFON
========================= */

@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        margin-top:65px;
    }

    .title{
        font-size:38px;
    }

    .description{
        font-size:20px;
    }

}

</style>
</head>


<body>

<div class="page">

    <!-- ÜST BAR -->

    <div class="topbar">

        <div
            class="back"
            onclick="goBack()"
            aria-label="Geri"
        >
            ‹
        </div>

        <div class="top-title">
            Şifremi unuttum
        </div>

    </div>


    <!-- ANA İÇERİK -->

    <main class="content">

        <h1 class="title">
            E-postanı kontrol et
        </h1>

        <p class="description">
            Hesabını onaylamak için e-posta adresine
            gönderilen 6 haneli kodu aşağıya gir.
        </p>


        <input
            type="text"
            id="code"
            class="code-input"
            placeholder="Kod"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            oninput="onlyNumbers(this)"
            onkeydown="if(event.key==='Enter') verifyCode()"
        >


        <div
            id="codeMessage"
            class="message success"
        >
            Kod e-posta adresine gönderildi.
        </div>


        <button
            type="button"
            id="verifyButton"
            class="verify-btn"
            onclick="verifyCode()"
        >
            Kodu doğrula
        </button>


        <button
            type="button"
            id="resendButton"
            class="resend-btn"
            onclick="resendCode()"
        >
            Kodu tekrar gönder
        </button>

    </main>

</div>


<script>

"use strict";


/* =====================================================
   GERİ
===================================================== */

function goBack(){

    if(window.history.length > 1){

        window.history.back();

        return;
    }

    window.location.href =
        "sifremi-unuttum.html";
}


/* =====================================================
   SADECE RAKAM
===================================================== */

function onlyNumbers(input){

    input.value =
        input.value
            .replace(/\D/g,"")
            .slice(0,6);
}


/* =====================================================
   MESAJ
===================================================== */

function showMessage(text,type){

    const message =
        document.getElementById("codeMessage");

    if(!message){
        return;
    }

    message.textContent =
        text;

    message.className =
        "message";

    if(type === "success"){
        message.classList.add("success");
    }

    if(type === "error"){
        message.classList.add("error");
    }
}


/* =====================================================
   RECOVERY BİLGİLERİNİ AL
===================================================== */

function getRecoveryData(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const identifier =
        (
            params.get("identifier") ||
            params.get("username") ||
            sessionStorage.getItem(
                "minegram_recovery_identifier"
            ) ||
            sessionStorage.getItem(
                "minegram_recovery_username"
            ) ||
            ""
        )
        .trim()
        .replace(/^@/,"");


    const mode =
        (
            params.get("mode") ||
            sessionStorage.getItem(
                "minegram_recovery_mode"
            ) ||
            "email"
        )
        .trim()
        .toLowerCase();


    const email =
        (
            params.get("email") ||
            sessionStorage.getItem(
                "minegram_recovery_email"
            ) ||
            ""
        )
        .trim()
        .toLowerCase();


    return {
        identifier:identifier,
        mode:mode,
        email:email
    };
}


/* =====================================================
   KODU DOĞRULA
===================================================== */

async function verifyCode(){

    const input =
        document.getElementById("code");

    const button =
        document.getElementById("verifyButton");


    if(!input || !button){
        return;
    }


    const code =
        input.value.trim();


    if(!/^\d{6}$/.test(code)){

        showMessage(
            "Lütfen 6 haneli doğrulama kodunu gir.",
            "error"
        );

        input.focus();

        return;
    }


    const recovery =
        getRecoveryData();


    if(
        !recovery.identifier &&
        !recovery.email
    ){

        showMessage(
            "Hesap bilgisi bulunamadı. Lütfen şifre sıfırlama işlemini yeniden başlat.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "Doğrulanıyor...";


    try{

        const body = {
            code:code
        };


        if(recovery.identifier){

            body.identifier =
                recovery.identifier;
        }


        if(recovery.mode){

            body.mode =
                recovery.mode;
        }


        if(recovery.email){

            body.email =
                recovery.email;
        }


        const response =
            await fetch(
                "/api/forgot/verify",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body),

                    cache:
                        "no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(
                    () => ({})
                );


        console.log(
            "[MINEGRAM VERIFY]",
            data
        );


        if(!response.ok){

            throw new Error(
                data.error ||
                "Doğrulama kodu hatalı veya süresi dolmuş."
            );
        }


        if(!data.ok){

            throw new Error(
                data.error ||
                "Doğrulama başarısız."
            );
        }


        /*
         * Backend'in farklı isimlendirmelerini
         * destekliyoruz.
         */

        const token =
            data.resetToken ||
            data.reset_token ||
            data.token ||
            data.recoveryToken ||
            data.recovery_token ||
            "";


        /*
         * Hesap bilgilerini sakla.
         */

        sessionStorage.setItem(
            "minegram_recovery_verified",
            "true"
        );


        if(token){

            sessionStorage.setItem(
                "minegram_recovery_token",
                token
            );
        }


        if(recovery.identifier){

            sessionStorage.setItem(
                "minegram_recovery_identifier",
                recovery.identifier
            );

            sessionStorage.setItem(
                "minegram_recovery_username",
                recovery.identifier
            );
        }


        if(recovery.mode){

            sessionStorage.setItem(
                "minegram_recovery_mode",
                recovery.mode
            );
        }


        if(data.email){

            sessionStorage.setItem(
                "minegram_recovery_email",
                data.email
            );

        }
        else if(recovery.email){

            sessionStorage.setItem(
                "minegram_recovery_email",
                recovery.email
            );
        }


        showMessage(
            "Kod doğrulandı. Hesabın bulunuyor...",
            "success"
        );


        /*
         * HESAPLARINI BULDUK SAYFASI
         */

        setTimeout(
            function(){

                const nextParams =
                    new URLSearchParams();


                if(token){

                    nextParams.set(
                        "token",
                        token
                    );
                }


                if(recovery.identifier){

                    nextParams.set(
                        "identifier",
                        recovery.identifier
                    );
                }


                if(recovery.mode){

                    nextParams.set(
                        "mode",
                        recovery.mode
                    );
                }


                if(data.email){

                    nextParams.set(
                        "email",
                        data.email
                    );

                }
                else if(recovery.email){

                    nextParams.set(
                        "email",
                        recovery.email
                    );
                }


                const query =
                    nextParams.toString();


                window.location.href =
                    "hesaplarini-bulduk.html" +
                    (
                        query
                            ? "?" + query
                            : ""
                    );

            },
            500
        );

    }
    catch(error){

        console.error(
            "[MINEGRAM VERIFY ERROR]",
            error
        );


        showMessage(
            error.message ||
            "Bir hata oluştu. Lütfen tekrar dene.",
            "error"
        );


        button.disabled =
            false;

        button.textContent =
            "Kodu doğrula";

    }

}


/* =====================================================
   TEKRAR KOD GÖNDER
===================================================== */

async function resendCode(){

    const button =
        document.getElementById(
            "resendButton"
        );


    if(!button){
        return;
    }


    const recovery =
        getRecoveryData();


    if(
        !recovery.identifier &&
        !recovery.email
    ){

        showMessage(
            "Hesap bilgisi bulunamadı. İşlemi baştan başlat.",
            "error"
        );

        return;
    }


    button.disabled =
        true;

    button.textContent =
        "Gönderiliyor...";


    try{

        const body = {

            identifier:
                recovery.identifier ||
                recovery.email,

            mode:
                recovery.identifier
                    ? recovery.mode
                    : "email"

        };


        const response =
            await fetch(
                "/api/forgot/start",
                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify(body),

                    cache:
                        "no-store"

                }
            );


        const data =
            await response
                .json()
                .catch(
                    () => ({})
                );


        console.log(
            "[MINEGRAM RESEND]",
            data
        );


        if(!response.ok){

            throw new Error(
                data.error ||
                "Kod tekrar gönderilemedi."
            );
        }


        if(data.email){

            sessionStorage.setItem(
                "minegram_recovery_email",
                data.email
            );
        }


        showMessage(
            "Yeni doğrulama kodu e-posta adresine gönderildi.",
            "success"
        );


    }
    catch(error){

        console.error(
            "[MINEGRAM RESEND ERROR]",
            error
        );


        showMessage(
            error.message ||
            "Kod gönderilemedi.",
            "error"
        );

    }
    finally{

        button.disabled =
            false;

        button.textContent =
            "Kodu tekrar gönder";

    }

}


/* =====================================================
   SAYFA AÇILIŞI
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const input =
            document.getElementById(
                "code"
            );


        if(input){

            setTimeout(
                function(){

                    input.focus();

                },
                100
            );

        }

    }
);

</script>

</body>
</html>
