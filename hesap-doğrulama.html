<script>
"use strict";

/* =====================================================
   ELEMENTLER
===================================================== */

const emailBox =
    document.getElementById("emailBox");

const codeInput =
    document.getElementById("codeInput");

const status =
    document.getElementById("status");

const verifyButton =
    document.getElementById("verifyButton");

const resendButton =
    document.getElementById("resendButton");

const changeButton =
    document.getElementById("changeButton");

const backButton =
    document.getElementById("backButton");


/* =====================================================
   URL PARAMETRELERİ
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


/* =====================================================
   HESAP BİLGİLERİ
===================================================== */

const identifier =
    (
        params.get("identifier") ||
        params.get("username") ||
        sessionStorage.getItem(
            "minegram_recovery_identifier"
        ) ||
        ""
    )
    .trim()
    .replace(/^@/, "")
    .toLowerCase();


const mode =
    (
        params.get("mode") ||
        sessionStorage.getItem(
            "minegram_recovery_mode"
        ) ||
        "username"
    )
    .trim()
    .toLowerCase();


const email =
    (
        params.get("email") ||
        sessionStorage.getItem(
            "minegram_recovery_email"
        ) ||
        ""
    )
    .trim()
    .toLowerCase();


/* =====================================================
   SESSION'A KAYDET
===================================================== */

if(identifier){

    sessionStorage.setItem(
        "minegram_recovery_identifier",
        identifier
    );

}

if(email){

    sessionStorage.setItem(
        "minegram_recovery_email",
        email
    );

}

sessionStorage.setItem(
    "minegram_recovery_mode",
    mode
);


/* =====================================================
   EMAIL GÖSTER
===================================================== */

if(email){

    emailBox.textContent =
        email;

}else{

    emailBox.textContent =
        "E-posta adresi bulunamadı.";

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    text,
    type = ""
){

    status.textContent =
        text || "";

    status.className =
        "status";

    if(type){

        status.classList.add(
            type
        );

    }

}


/* =====================================================
   API
===================================================== */

async function api(
    url,
    options = {}
){

    try{

        const response =
            await fetch(
                url,
                {
                    ...options,

                    headers:{
                        "Content-Type":
                            "application/json",

                        ...(options.headers || {})
                    }
                }
            );


        const text =
            await response.text();


        let data = {};


        try{

            data =
                text
                    ? JSON.parse(text)
                    : {};

        }catch{

            data = {};

        }


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "Sunucu hatası."
            );

        }


        return data;

    }catch(error){

        if(
            error instanceof TypeError
        ){

            throw new Error(
                "Sunucuya bağlanılamadı. İnternet bağlantını ve Minegram sunucusunu kontrol et."
            );

        }

        throw error;

    }

}


/* =====================================================
   GERİ
===================================================== */

function goBack(){

    window.location.href =
        "./hesaplarini-bulduk.html";

}


backButton.addEventListener(
    "click",
    goBack
);


changeButton.addEventListener(
    "click",
    goBack
);


backButton.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            goBack();

        }

    }
);


/* =====================================================
   KOD GİRİŞİ
===================================================== */

codeInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,6);


        verifyButton.disabled =
            this.value.length !== 6;

    }
);


/* =====================================================
   TEKRAR GÖNDER SAYACI
===================================================== */

let resendTimer = null;


function startResendTimer(){

    if(resendTimer){

        clearInterval(
            resendTimer
        );

    }


    let seconds = 30;


    resendButton.disabled =
        true;


    resendButton.textContent =
        "Tekrar gönder (" +
        seconds +
        ")";


    resendTimer =
        setInterval(
            function(){

                seconds--;


                resendButton.textContent =
                    "Tekrar gönder (" +
                    seconds +
                    ")";


                if(seconds <= 0){

                    clearInterval(
                        resendTimer
                    );

                    resendTimer =
                        null;


                    resendButton.disabled =
                        false;


                    resendButton.textContent =
                        "Doğrulama kodunu tekrar gönder";

                }

            },
            1000
        );

}


/* =====================================================
   KURTARMA KODU GÖNDER
===================================================== */

async function sendRecoveryCode(){

    if(!identifier){

        showStatus(
            "Hesap bilgisi bulunamadı. Lütfen şifre yenileme işlemini yeniden başlat."
        );

        return false;

    }


    try{

        resendButton.disabled =
            true;

        resendButton.textContent =
            "Gönderiliyor...";


        showStatus(
            "Doğrulama kodu gönderiliyor...",
            "loading"
        );


        const result =
            await api(
                "/api/forgot/start",
                {
                    method:"POST",

                    body:
                        JSON.stringify({

                            identifier:
                                identifier,

                            mode:
                                mode

                        })
                }
            );


        if(
            result &&
            result.ok === false
        ){

            throw new Error(
                result.error ||
                "Kod gönderilemedi."
            );

        }


        if(result?.email){

            sessionStorage.setItem(
                "minegram_recovery_email",
                String(
                    result.email
                )
                .trim()
                .toLowerCase()
            );


            emailBox.textContent =
                String(
                    result.email
                )
                .trim()
                .toLowerCase();

        }


        sessionStorage.setItem(
            "minegram_recovery_started",
            "true"
        );


        showStatus(
            "6 haneli doğrulama kodu e-posta adresine gönderildi.",
            "success"
        );


        startResendTimer();


        verifyButton.disabled =
            codeInput.value.length !== 6;


        codeInput.focus();


        return true;

    }
    catch(error){

        console.error(
            "[MINEGRAM] Şifre kurtarma kodu gönderme hatası:",
            error
        );


        showStatus(
            error.message ||
            "Doğrulama kodu gönderilemedi."
        );


        resendButton.disabled =
            false;


        resendButton.textContent =
            "Doğrulama kodunu tekrar gönder";


        return false;

    }

}


/* =====================================================
   KOD DOĞRULA
===================================================== */

verifyButton.addEventListener(
    "click",
    async function(){

        const code =
            codeInput.value.trim();


        if(!identifier){

            showStatus(
                "Hesap bilgisi bulunamadı."
            );

            return;

        }


        if(code.length !== 6){

            showStatus(
                "6 haneli doğrulama kodunu gir."
            );

            return;

        }


        verifyButton.disabled =
            true;

        resendButton.disabled =
            true;


        verifyButton.textContent =
            "Kontrol ediliyor...";


        showStatus(
            "Doğrulama kodu kontrol ediliyor...",
            "loading"
        );


        try{

            const result =
                await api(
                    "/api/forgot/verify",
                    {
                        method:"POST",

                        body:
                            JSON.stringify({

                                identifier:
                                    identifier,

                                email:
                                    email,

                                mode:
                                    mode,

                                code:
                                    code

                            })
                    }
                );


            /* =================================================
               DOĞRULAMA BAŞARISIZ
            ================================================= */

            if(
                !result ||
                result.ok !== true
            ){

                throw new Error(
                    result?.error ||
                    "Doğrulama kodu yanlış veya süresi dolmuş."
                );

            }


            /* =================================================
               HESAP BİLGİLERİNİ KAYDET
            ================================================= */

            if(result.email){

                sessionStorage.setItem(
                    "minegram_recovery_email",
                    String(
                        result.email
                    )
                    .trim()
                    .toLowerCase()
                );

            }


            if(result.account){

                sessionStorage.setItem(
                    "minegram_recovery_account",
                    JSON.stringify(
                        result.account
                    )
                );

            }


            sessionStorage.setItem(
                "minegram_recovery_verified",
                "true"
            );


            /* =================================================
               BAŞARILI
            ================================================= */

            showStatus(
                "Kod doğrulandı. Hesapların bulundu.",
                "success"
            );


            verifyButton.textContent =
                "Doğrulandı";


            /* =================================================
               HESAPLARINI-BULDUK.HTML
               GÖNDER
            ================================================= */

            setTimeout(
                function(){

                    const nextParams =
                        new URLSearchParams();


                    if(identifier){

                        nextParams.set(
                            "identifier",
                            identifier
                        );

                    }


                    if(result.email){

                        nextParams.set(
                            "email",
                            result.email
                        );

                    }else if(email){

                        nextParams.set(
                            "email",
                            email
                        );

                    }


                    if(result.account){

                        if(
                            result.account.username
                        ){

                            nextParams.set(
                                "username",
                                result.account.username
                            );

                        }

                        if(
                            result.account.displayName
                        ){

                            nextParams.set(
                                "displayName",
                                result.account.displayName
                            );

                        }

                    }


                    window.location.href =
                        "./hesaplarini-bulduk.html?" +
                        nextParams.toString();

                },
                500
            );


        }
        catch(error){

            console.error(
                "[MINEGRAM] Şifre kurtarma doğrulama hatası:",
                error
            );


            showStatus(
                error.message ||
                "Doğrulama kodu yanlış."
            );


            verifyButton.disabled =
                codeInput.value.length !== 6;


            resendButton.disabled =
                false;


            verifyButton.textContent =
                "Kontrol et";

        }

    }
);


/* =====================================================
   TEKRAR GÖNDER
===================================================== */

resendButton.addEventListener(
    "click",
    async function(){

        await sendRecoveryCode();

    }
);


/* =====================================================
   ENTER
===================================================== */

codeInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            codeInput.value.length === 6
        ){

            event.preventDefault();

            verifyButton.click();

        }

    }
);


/* =====================================================
   SAYFA BAŞLAT
===================================================== */

async function start(){

    console.log(
        "[MINEGRAM] sifremi-unuttum-dogrulama.html başladı."
    );

    console.log(
        "[MINEGRAM] Identifier:",
        identifier
    );

    console.log(
        "[MINEGRAM] Mode:",
        mode
    );

    console.log(
        "[MINEGRAM] Email:",
        email
    );


    if(!identifier){

        showStatus(
            "Hesap bilgisi bulunamadı. Şifre değiştirme işlemini yeniden başlat."
        );


        verifyButton.disabled =
            true;


        resendButton.disabled =
            true;


        return;

    }


    const recoveryStarted =
        sessionStorage.getItem(
            "minegram_recovery_started"
        );


    if(
        recoveryStarted === "true"
    ){

        showStatus(
            "E-postana gönderilen 6 haneli kodu gir.",
            "success"
        );


        startResendTimer();


        codeInput.focus();


        return;

    }


    await sendRecoveryCode();

}


/* =====================================================
   BAŞLAT
===================================================== */

start();

</script>
