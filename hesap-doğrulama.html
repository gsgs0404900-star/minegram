<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#000000"
>

<title>Hesabını doğrula - Minegram</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

.page{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.box{
  width:365px;
  margin-top:90px;
  text-align:center;
}

.header{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  margin-bottom:25px;
}

.back{
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:30px;
  line-height:1;
  font-weight:300;
  cursor:pointer;
  user-select:none;
  margin-right:8px;
}

.header-title{
  font-size:16px;
  font-weight:700;
}

.title{
  font-size:22px;
  line-height:1.25;
  font-weight:700;
  margin:0 0 12px;
}

.description{
  color:#777;
  font-size:13px;
  line-height:1.45;
  margin:0 0 22px;
}

.code{
  width:100%;
  height:44px;
  margin-bottom:9px;
  padding:0 12px;
  border:1px solid #292929;
  border-radius:7px;
  background:#000;
  color:#fff;
  outline:none;
  font-size:12px;
  letter-spacing:4px;
  text-align:center;
}

.code:focus{
  border-color:#555;
}

.code::placeholder{
  color:#777;
  opacity:1;
  letter-spacing:0;
}

.status{
  min-height:20px;
  margin-top:10px;
  font-size:12px;
  color:#ff4d4d;
  line-height:1.4;
}

.status.success{
  color:#35c759;
}

.bottom{
  width:100%;
  margin-top:25px;
  text-align:center;
}

.verify{
  width:100%;
  height:42px;
  border:0;
  border-radius:22px;
  background:#62b0ed;
  color:#30207c;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

.verify:hover{
  background:#70b9f1;
}

.verify:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.change{
  border:0;
  background:transparent;
  color:#62b0ed;
  font-size:12px;
  font-weight:700;
  margin-top:18px;
  cursor:pointer;
}

.change:hover{
  color:#80c3f5;
}

@media(max-width:600px){

  .box{
    width:calc(100% - 40px);
    max-width:365px;
    margin-top:60px;
  }

  .title{
    font-size:21px;
  }

  .description{
    font-size:12px;
  }

  .code{
    height:44px;
    font-size:12px;
  }

  .verify{
    height:42px;
  }

  .change{
    font-size:12px;
    margin-top:18px;
  }

}

</style>

</head>

<body>

<div class="page">

  <div class="box">

    <header class="header">

      <div
        class="back"
        id="backButton"
        aria-label="Geri"
      >
        ‹
      </div>

      <div class="header-title">
        Kayıt ol
      </div>

    </header>

    <main>

      <h1 class="title">
        Hesabını doğrula
      </h1>

      <p class="description">
        E-posta adresine gönderilen doğrulama<br>
        kodunu gir.
      </p>

      <input
        id="code"
        class="code"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="Doğrulama kodu"
        aria-label="Doğrulama kodu"
      >

      <div
        id="status"
        class="status"
      ></div>

      <div class="bottom">

        <button
          id="verifyButton"
          class="verify"
          type="button"
        >
          Kodu doğrula ve Minegram'a gir
        </button>

        <button
          id="changeButton"
          class="change"
          type="button"
        >
          İletişim bilgini değiştir
        </button>

      </div>

    </main>

  </div>

</div>


<script>

"use strict";


/* =========================================================
   ELEMENTLER
========================================================= */

const codeInput =
  document.getElementById("code");

const verifyButton =
  document.getElementById("verifyButton");

const changeButton =
  document.getElementById("changeButton");

const backButton =
  document.getElementById("backButton");

const status =
  document.getElementById("status");


/* =========================================================
   STORAGE
========================================================= */

function getStorageValue(key){

  return (
    sessionStorage.getItem(key) ||
    localStorage.getItem(key) ||
    ""
  ).trim();

}


/* =========================================================
   URL PARAMETRELERİ
========================================================= */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


/* =========================================================
   KAYIT BİLGİLERİ
========================================================= */

const username =
  (
    urlParams.get("username") ||
    getStorageValue(
      "minegram_register_username"
    )
  )
  .trim()
  .replace(/^@/, "");


const email =
  (
    urlParams.get("email") ||
    getStorageValue(
      "minegram_register_email"
    )
  )
  .trim()
  .toLowerCase();


const phone =
  (
    urlParams.get("phone") ||
    getStorageValue(
      "minegram_register_phone"
    )
  )
  .trim();


const displayName =
  (
    urlParams.get("displayName") ||
    getStorageValue(
      "minegram_register_display_name"
    ) ||
    username
  )
  .trim();


/* =========================================================
   BİLGİLERİ KORU
========================================================= */

if(username){

  sessionStorage.setItem(
    "minegram_register_username",
    username
  );

}

if(email){

  sessionStorage.setItem(
    "minegram_register_email",
    email
  );

}

if(phone){

  sessionStorage.setItem(
    "minegram_register_phone",
    phone
  );

}

if(displayName){

  sessionStorage.setItem(
    "minegram_register_display_name",
    displayName
  );

}


/* =========================================================
   DURUM MESAJI
========================================================= */

function showStatus(
  text,
  success = false
){

  status.textContent =
    text || "";

  status.className =
    success
      ? "status success"
      : "status";

}


/* =========================================================
   KOD INPUT
========================================================= */

codeInput.addEventListener(
  "input",
  function(){

    this.value =
      this.value
        .replace(/\D/g,"")
        .slice(0,6);

    showStatus("");

  }
);


/* =========================================================
   GERİ / İLETİŞİM BİLGİLERİNİ DEĞİŞTİR
========================================================= */

function goBack(){

  const params =
    new URLSearchParams();


  if(username){

    params.set(
      "username",
      username
    );

  }


  if(email){

    params.set(
      "email",
      email
    );

  }


  if(phone){

    params.set(
      "phone",
      phone
    );

  }


  if(displayName){

    params.set(
      "displayName",
      displayName
    );

  }


  const query =
    params.toString();


  let url =
    "./iletisim-bilgileri.html";


  if(query){

    url += "?" + query;

  }


  window.location.href =
    url;

}


/* =========================================================
   GERİ BUTONLARI
========================================================= */

backButton.addEventListener(
  "click",
  goBack
);


changeButton.addEventListener(
  "click",
  goBack
);


/* =========================================================
   KOD DOĞRULAMA
========================================================= */

async function verifyCode(){

  const code =
    codeInput.value.trim();


  showStatus("");


  if(!username){

    showStatus(
      "Kayıt bilgileri bulunamadı. Lütfen kayıt işlemine yeniden başla."
    );

    return;

  }


  if(!email && !phone){

    showStatus(
      "İletişim bilgileri bulunamadı. Lütfen geri dönüp tekrar dene."
    );

    return;

  }


  if(!/^\d{6}$/.test(code)){

    showStatus(
      "Lütfen 6 haneli doğrulama kodunu gir."
    );

    codeInput.focus();

    return;

  }


  verifyButton.disabled =
    true;

  verifyButton.textContent =
    "Doğrulanıyor...";


  try{

    const response =
      await fetch(
        "/api/register/verify",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:
            JSON.stringify({

              username:
                username,

              email:
                email,

              phone:
                phone,

              code:
                code

            }),

          cache:
            "no-store"

        }
      );


    const data =
      await response
        .json()
        .catch(
          () => ({})
        );


    console.log(
      "[MINEGRAM REGISTER VERIFY]",
      data
    );


    if(!response.ok){

      throw new Error(

        data.error ||
        data.message ||
        "Doğrulama kodu hatalı veya süresi dolmuş."

      );

    }


    if(data.ok === false){

      throw new Error(

        data.error ||
        data.message ||
        "Doğrulama başarısız."

      );

    }


    /* =====================================================
       BAŞARILI DOĞRULAMA
    ===================================================== */

    sessionStorage.setItem(
      "minegram_register_verified",
      "true"
    );


    localStorage.setItem(
      "minegram_register_verified",
      "true"
    );


    sessionStorage.setItem(
      "minegram_register_username",
      username
    );


    localStorage.setItem(
      "minegram_username",
      username
    );


    if(email){

      sessionStorage.setItem(
        "minegram_register_email",
        email
      );

    }


    if(phone){

      sessionStorage.setItem(
        "minegram_register_phone",
        phone
      );

    }


    if(displayName){

      sessionStorage.setItem(
        "minegram_register_display_name",
        displayName
      );

    }

   // KAYIT BAŞARILI
localStorage.setItem("minegram_register_verified", "true");

const finalUsername = String(
  data.user?.username ||
  username ||
  ""
)
  .trim()
  .replace(/^@/, "");

if (finalUsername) {
  sessionStorage.setItem(
    "minegram_register_username",
    finalUsername
  );

  localStorage.setItem(
    "minegram_register_username",
    finalUsername
  );

  localStorage.setItem(
    "minegram_username",
    finalUsername
  );

  localStorage.setItem(
    "username",
    finalUsername
  );
}

// TOKEN'I KAYDET
const finalToken = String(
  data.access_token ||
  data.token ||
  data.session?.access_token ||
  data.session?.accessToken ||
  ""
).trim();

if (finalToken) {
  localStorage.setItem(
    "minegram_token",
    finalToken
  );

  localStorage.setItem(
    "access_token",
    finalToken
  );

  localStorage.setItem(
    "token",
    finalToken
  );

  sessionStorage.setItem(
    "minegram_token",
    finalToken
  );

  sessionStorage.setItem(
    "access_token",
    finalToken
  );
}

// PROFİL SAYFASINA GİT
setTimeout(function () {
  window.location.replace("./profile.html");
}, 500);
    

    /* =====================================================
       TOKEN
    ===================================================== */

    if(data.token){

      sessionStorage.setItem(
        "minegram_register_token",
        String(data.token)
      );

      localStorage.setItem(
        "minegram_token",
        String(data.token)
      );

    }


    if(data.access_token){

      sessionStorage.setItem(
        "minegram_register_access_token",
        String(data.access_token)
      );

      localStorage.setItem(
        "minegram_access_token",
        String(data.access_token)
      );

      localStorage.setItem(
        "minegram_supabase_token",
        String(data.access_token)
      );

    }


    /* =====================================================
       USER
    ===================================================== */

    if(data.user){

      try{

        sessionStorage.setItem(
          "minegram_register_user",
          JSON.stringify(data.user)
        );

        localStorage.setItem(
          "minegram_user",
          JSON.stringify(data.user)
        );

      }
      catch(error){

        console.warn(
          "Kullanıcı bilgisi saklanamadı:",
          error
        );

      }


      if(data.user.id){

        localStorage.setItem(
          "minegram_user_id",
          String(data.user.id)
        );

      }


      if(data.user.username){

        localStorage.setItem(
          "minegram_username",
          String(data.user.username)
        );

      }

    }


    /* =====================================================
       BAŞARILI MESAJ
    ===================================================== */

    showStatus(
      "Hesabın doğrulandı. Minegram'a giriliyor...",
      true
    );


    verifyButton.textContent =
      "Doğrulandı";
    
/* =====================================================
   DİREKT PROFILE.HTML
===================================================== */

setTimeout(function(){

  window.location.replace("./profile.html");

}, 500);

  }
  catch(error){

    console.error(
      "[MINEGRAM REGISTER VERIFY ERROR]",
      error
    );


    showStatus(
      error.message ||
      "Doğrulama yapılamadı. Lütfen tekrar dene."
    );


    verifyButton.disabled =
      false;


    verifyButton.textContent =
      "Kodu doğrula ve Minegram'a gir";

  }

}


/* =========================================================
   DOĞRULAMA BUTONU
========================================================= */

verifyButton.addEventListener(
  "click",
  verifyCode
);


/* =========================================================
   ENTER TUŞU
========================================================= */

codeInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      verifyCode();

    }

  }
);


/* =========================================================
   SAYFA KONTROL
========================================================= */

if(!username){

  showStatus(
    "Kayıt bilgileri bulunamadı. Lütfen kayıt işlemine yeniden başla."
  );

}
else if(!email && !phone){

  showStatus(
    "İletişim bilgileri bulunamadı. Lütfen geri dönüp tekrar dene."
  );

}


/* =========================================================
   BAŞLANGIÇ
========================================================= */

setTimeout(
  function(){

    codeInput.focus();

  },
  150
);


console.log(
  "[MINEGRAM] Kayıt doğrulama sayfası hazır."
);

console.log(
  "[MINEGRAM] username:",
  username
);

console.log(
  "[MINEGRAM] email:",
  email
);

console.log(
  "[MINEGRAM] phone:",
  phone
);

</script>

</body>
</html>
