<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>E-posta Kontrol Et - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

/* =========================
   ÜST BAR
========================= */

.topbar{
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:25px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    font-size:34px;
    font-weight:300;
    line-height:1;

    cursor:pointer;
    user-select:none;
}

.top-title{
    margin-left:15px;
    font-size:20px;
    font-weight:700;
    color:#fff;
}

/* =========================
   İÇERİK
========================= */

.content{
    width:317px;
    margin:115px auto 0;
}

.title{
    text-align:center;

    font-size:30px;
    line-height:1.15;
    font-weight:700;

    margin:0 0 34px;
    color:#fff;
}

.description{
    font-size:18px;
    line-height:1.45;

    color:#bdbdbd;

    margin:0 0 18px;
}

/* =========================
   E-POSTA BİLGİSİ
========================= */

.email-info{
    width:100%;
    min-height:42px;

    padding:11px 12px;
    margin-bottom:45px;

    border:1px solid #252525;
    border-radius:7px;

    background:#050505;

    color:#fff;

    font-size:13px;
    line-height:1.4;

    word-break:break-word;
}

/* =========================
   KOD
========================= */

.code-input{
    display:block;

    width:100%;
    height:39px;

    padding:0 10px;

    border:1px solid #252525;
    border-radius:6px;

    background:#050505;
    color:#fff;

    outline:none;

    font-size:12px;
    font-family:Arial,Helvetica,sans-serif;

    letter-spacing:3px;
}

.code-input::placeholder{
    color:#777;
    opacity:1;
    letter-spacing:0;
}

.code-input:focus{
    border-color:#2677b5;

    box-shadow:
        0 0 0 1px #2677b5;
}

/* =========================
   DOĞRULA
========================= */

.verify-btn{
    display:block;

    width:100%;
    height:37px;

    margin-top:8px;

    border:0;
    border-radius:22px;

    background:#2677b5;
    color:#000;

    font-size:12px;
    font-weight:700;

    cursor:pointer;

    transition:
        opacity .15s ease,
        transform .1s ease;
}

.verify-btn:hover{
    opacity:.92;
}

.verify-btn:active{
    transform:scale(.99);
}

.verify-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =========================
   TEKRAR GÖNDER
========================= */

.resend-btn{
    display:block;

    width:100%;

    margin-top:12px;
    padding:0;

    border:0;
    background:transparent;

    text-align:center;

    color:#2677b5;

    font-size:12px;
    font-weight:400;

    cursor:pointer;
    line-height:1.4;
}

.resend-btn:hover{
    text-decoration:underline;
}

.resend-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =========================
   MESAJ
========================= */

.message{
    min-height:18px;

    margin-top:12px;

    text-align:center;

    font-size:11px;
    line-height:1.4;

    color:#2677b5;
}

.message.success{
    color:#2677b5;
}

.message.error{
    color:#ff5c5c;
}

/* =========================
   MOBİL
========================= */

@media(max-width:600px){

    .topbar{
        height:70px;
        padding-left:28px;
    }

    .back{
        width:30px;
        height:38px;
        font-size:38px;
    }

    .top-title{
        margin-left:12px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 120px);
        max-width:714px;
        margin:105px auto 0;
    }

    .title{
        font-size:42px;
        margin-bottom:30px;
    }

    .description{
        font-size:21px;
        line-height:1.5;
        margin-bottom:18px;
    }

    .email-info{
        font-size:16px;
        padding:14px;
        margin-bottom:40px;
    }

    .code-input{
        height:68px;

        padding:0 20px;

        font-size:18px;

        border:2px solid #686868;
        border-radius:9px;
    }

    .code-input:focus{
        border-color:#2677b5;

        box-shadow:
            0 0 0 1px #2677b5;
    }

    .verify-btn{
        height:58px;
        margin-top:18px;

        font-size:20px;

        border-radius:32px;

        background:#2677b5;
        color:#000;
    }

    .resend-btn{
        margin-top:25px;

        font-size:18px;
        font-weight:700;

        color:#2677b5;
    }

    .message{
        font-size:14px;
    }
}

/* =========================
   KÜÇÜK TELEFON
========================= */

@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        margin-top:65px;
    }

    .title{
        font-size:38px;
    }

    .description{
        font-size:20px;
    }

    .email-info{
        font-size:15px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- ÜST BAR -->

    <div class="topbar">

        <div
            class="back"
            onclick="goBack()"
            aria-label="Geri"
        >
            ‹
        </div>

        <div class="top-title">
            Hesabını doğrula
        </div>

    </div>


    <!-- ANA İÇERİK -->

    <main class="content">

        <h1 class="title">
            E-postanı kontrol et
        </h1>

        <p class="description">
            Hesabını doğrulamak için e-posta adresine
            gönderilen 6 haneli kodu aşağıya gir.
        </p>

        <div
            id="emailInfo"
            class="email-info"
        >
            E-posta adresine doğrulama kodu gönderildi.
        </div>


        <input
            type="text"
            id="code"
            class="code-input"
            placeholder="Kod"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
        >


        <div
            id="codeMessage"
            class="message success"
        >
            Kod e-posta adresine gönderildi.
        </div>


        <button
            type="button"
            id="verifyButton"
            class="verify-btn"
        >
            Kodu doğrula
        </button>


        <button
            type="button"
            id="resendButton"
            class="resend-btn"
        >
            Kodu tekrar gönder
        </button>

    </main>

</div>


<script>
"use strict";

/* =====================================================
   AYARLAR
===================================================== */

const REGISTER_USERNAME_KEY =
    "minegram_register_username";

const REGISTER_PASSWORD_KEY =
    "minegram_register_password";

const REGISTER_EMAIL_KEY =
    "minegram_register_email";

const REGISTER_PHONE_KEY =
    "minegram_register_phone";

const REGISTER_DISPLAY_NAME_KEY =
    "minegram_register_display_name";

const REGISTER_MODE_KEY =
    "minegram_register_mode";

const REGISTER_PENDING_KEY =
    "minegram_register_pending";


/* =====================================================
   GERİ
===================================================== */

function goBack(){

    if(window.history.length > 1){

        window.history.back();

        return;
    }

    window.location.href =
        "iletisim-bilgileri.html";
}


/* =====================================================
   SADECE RAKAM
===================================================== */

function onlyNumbers(input){

    input.value =
        input.value
            .replace(/\D/g,"")
            .slice(0,6);
}


/* =====================================================
   MESAJ
===================================================== */

function showMessage(text,type){

    const message =
        document.getElementById("codeMessage");

    if(!message){
        return;
    }

    message.textContent =
        text;

    message.className =
        "message";

    if(type === "success"){
        message.classList.add("success");
    }

    if(type === "error"){
        message.classList.add("error");
    }
}


/* =====================================================
   KAYIT BİLGİLERİNİ AL
===================================================== */

function getRegisterData(){

    const username =
        (
            sessionStorage.getItem(
                REGISTER_USERNAME_KEY
            ) ||
            localStorage.getItem(
                REGISTER_USERNAME_KEY
            ) ||
            ""
        )
        .trim()
        .replace(/^@/,"");


    const email =
        (
            sessionStorage.getItem(
                REGISTER_EMAIL_KEY
            ) ||
            localStorage.getItem(
                REGISTER_EMAIL_KEY
            ) ||
            ""
        )
        .trim()
        .toLowerCase();


    const phone =
        (
            sessionStorage.getItem(
                REGISTER_PHONE_KEY
            ) ||
            localStorage.getItem(
                REGISTER_PHONE_KEY
            ) ||
            ""
        )
        .trim();


    const displayName =
        (
            sessionStorage.getItem(
                REGISTER_DISPLAY_NAME_KEY
            ) ||
            localStorage.getItem(
                REGISTER_DISPLAY_NAME_KEY
            ) ||
            username
        )
        .trim();


    const mode =
        (
            sessionStorage.getItem(
                REGISTER_MODE_KEY
            ) ||
            localStorage.getItem(
                REGISTER_MODE_KEY
            ) ||
            "email"
        )
        .trim()
        .toLowerCase();


    return {
        username,
        email,
        phone,
        displayName,
        mode
    };
}


/* =====================================================
   E-POSTA GÖSTER
===================================================== */

function maskEmail(email){

    if(!email){
        return "";
    }

    const parts =
        email.split("@");

    if(parts.length !== 2){
        return email;
    }

    const name =
        parts[0];

    const domain =
        parts[1];

    if(name.length <= 2){

        return (
            name.charAt(0) +
            "*" +
            "@" +
            domain
        );
    }

    return (
        name.substring(0,2) +
        "*****@" +
        domain
    );
}


/* =====================================================
   KOD DOĞRULAMA
===================================================== */

async function verifyCode(){

    const input =
        document.getElementById("code");

    const button =
        document.getElementById("verifyButton");


    if(!input || !button){
        return;
    }


    const code =
        input.value
            .trim();


    if(!/^\d{6}$/.test(code)){

        showMessage(
            "Lütfen 6 haneli doğrulama kodunu gir.",
            "error"
        );

        input.focus();

        return;
    }


    const register =
        getRegisterData();


    if(!register.username){

        showMessage(
            "Kullanıcı bilgisi bulunamadı. Lütfen kayıt işlemine yeniden başla.",
            "error"
        );

        return;
    }


    button.disabled =
        true;

    button.textContent =
        "Doğrulanıyor...";


    try{

        const body = {

            username:
                register.username,

            code:
                code

        };


        /*
         * Backend'in beklediği alanları
         * mümkün olduğunca eksiksiz gönderiyoruz.
         */

        if(register.email){

            body.email =
                register.email;
        }

        if(register.phone){

            body.phone =
                register.phone;
        }


        const response =
            await fetch(
                "/api/register/verify",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body),

                    cache:
                        "no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(
                    () => ({})
                );


        console.log(
            "[MINEGRAM REGISTER VERIFY]",
            data
        );


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "Doğrulama kodu hatalı veya süresi dolmuş."
            );
        }


        if(data.ok === false){

            throw new Error(
                data.error ||
                data.message ||
                "E-posta doğrulaması başarısız."
            );
        }


        /*
         * Başarılı doğrulama.
         *
         * Backend bazı sürümlerde token/session
         * döndürebilir. Varsa saklıyoruz.
         */

        if(data.token){

            sessionStorage.setItem(
                "minegram_register_token",
                data.token
            );
        }

        if(data.access_token){

            sessionStorage.setItem(
                "minegram_register_access_token",
                data.access_token
            );
        }

        if(data.user){

            try{

                sessionStorage.setItem(
                    "minegram_register_user",
                    JSON.stringify(data.user)
                );

            }
            catch(_){}
        }


        sessionStorage.setItem(
            "minegram_register_verified",
            "true"
        );


        sessionStorage.setItem(
            "minegram_register_username",
            register.username
        );


        if(register.email){

            sessionStorage.setItem(
                "minegram_register_email",
                register.email
            );
        }


        if(register.displayName){

            sessionStorage.setItem(
                "minegram_register_display_name",
                register.displayName
            );
        }


        /*
         * Artık kayıt doğrulandı.
         */

        sessionStorage.removeItem(
            REGISTER_PENDING_KEY
        );


        showMessage(
            "E-posta doğrulandı. Profil oluşturma sayfasına geçiliyor...",
            "success"
        );


        button.textContent =
            "Doğrulandı";


        /*
         * PROFİL OLUŞTURMA
         */

        setTimeout(
            function(){

                window.location.href =
                    "profil-olustur.html";

            },
            500
        );

    }
    catch(error){

        console.error(
            "[MINEGRAM REGISTER VERIFY ERROR]",
            error
        );


        showMessage(
            error.message ||
            "Bir hata oluştu. Lütfen tekrar dene.",
            "error"
        );


        button.disabled =
            false;

        button.textContent =
            "Kodu doğrula";
    }
}


/* =====================================================
   TEKRAR KOD GÖNDER
===================================================== */

async function resendCode(){

    const button =
        document.getElementById(
            "resendButton"
        );


    if(!button){
        return;
    }


    const register =
        getRegisterData();


    if(!register.username){

        showMessage(
            "Kayıt bilgileri bulunamadı. Lütfen kayıt işlemini yeniden başlat.",
            "error"
        );

        return;
    }


    button.disabled =
        true;

    button.textContent =
        "Gönderiliyor...";


    try{

        const body = {

            username:
                register.username

        };


        if(register.email){

            body.email =
                register.email;
        }


        if(register.phone){

            body.phone =
                register.phone;
        }


        const response =
            await fetch(
                "/api/register/resend",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body),

                    cache:
                        "no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(
                    () => ({})
                );


        console.log(
            "[MINEGRAM REGISTER RESEND]",
            data
        );


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "Kod tekrar gönderilemedi."
            );
        }


        if(data.ok === false){

            throw new Error(
                data.error ||
                data.message ||
                "Kod tekrar gönderilemedi."
            );
        }


        if(data.email){

            sessionStorage.setItem(
                REGISTER_EMAIL_KEY,
                data.email
            );
        }


        showMessage(
            "Yeni doğrulama kodu e-posta adresine gönderildi.",
            "success"
        );


        /*
         * Spam/çok hızlı tekrar gönderimi önlemek için
         * 60 saniyelik sayaç.
         */

        let seconds = 60;


        button.textContent =
            "Tekrar gönder (" +
            seconds +
            ")";


        const timer =
            setInterval(
                function(){

                    seconds--;

                    if(seconds <= 0){

                        clearInterval(timer);

                        button.disabled =
                            false;

                        button.textContent =
                            "Kodu tekrar gönder";

                        return;
                    }


                    button.textContent =
                        "Tekrar gönder (" +
                        seconds +
                        ")";

                },
                1000
            );

    }
    catch(error){

        console.error(
            "[MINEGRAM REGISTER RESEND ERROR]",
            error
        );


        showMessage(
            error.message ||
            "Kod gönderilemedi.",
            "error"
        );


        button.disabled =
            false;

        button.textContent =
            "Kodu tekrar gönder";
    }
}


/* =====================================================
   SAYFA AÇILIŞI
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const register =
            getRegisterData();


        const emailInfo =
            document.getElementById(
                "emailInfo"
            );


        if(emailInfo){

            if(register.email){

                emailInfo.textContent =
                    maskEmail(register.email) +
                    " adresine 6 haneli doğrulama kodu gönderildi.";

            }
            else if(register.phone){

                emailInfo.textContent =
                    register.phone +
                    " numarasına doğrulama kodu gönderildi.";

            }
            else{

                emailInfo.textContent =
                    "İletişim adresine 6 haneli doğrulama kodu gönderildi.";
            }
        }


        const input =
            document.getElementById(
                "code"
            );


        if(input){

            input.addEventListener(
                "input",
                function(){

                    onlyNumbers(this);

                }
            );


            input.addEventListener(
                "keydown",
                function(event){

                    if(event.key === "Enter"){

                        event.preventDefault();

                        verifyCode();
                    }
                }
            );


            setTimeout(
                function(){

                    input.focus();

                },
                150
            );
        }


        const verifyButton =
            document.getElementById(
                "verifyButton"
            );


        if(verifyButton){

            verifyButton.addEventListener(
                "click",
                verifyCode
            );
        }


        const resendButton =
            document.getElementById(
                "resendButton"
            );


        if(resendButton){

            resendButton.addEventListener(
                "click",
                resendCode
            );
        }


        /*
         * Sayfa doğrudan açıldıysa kayıt bilgisi
         * var mı kontrol et.
         */

        if(!register.username){

            showMessage(
                "Kayıt bilgileri bulunamadı. Lütfen kayıt işlemini yeniden başlat.",
                "error"
            );
        }

    }
);
</script>

</body>
</html>
