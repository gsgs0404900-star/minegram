<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Hesabını doğrula - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:365px;
    margin-top:90px;
    text-align:center;
}

.header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:25px;
}

.back{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    margin-right:8px;
}

.header-title{
    font-size:16px;
    font-weight:700;
}

.title{
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 12px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.45;
    margin:0 0 22px;
}

.email-box{
    width:100%;
    min-height:44px;
    padding:13px 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#050505;
    color:#fff;
    font-size:12px;
    word-break:break-all;
}

.status{
    min-height:20px;
    margin-top:15px;
    font-size:12px;
    line-height:1.45;
    color:#ff4d4d;
}

.status.success{
    color:#35c759;
}

.status.loading{
    color:#aaa;
}

.bottom{
    display:flex;
    gap:9px;
    width:100%;
    margin-top:25px;
}

.action{
    width:50%;
    height:42px;
    border-radius:22px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.back-btn{
    background:#000;
    border:1px solid #555;
    color:#0095f6;
}

.verify{
    background:#2d80bd;
    border:0;
    color:#000;
}

.verify:hover{
    background:#348dca;
}

.verify:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.resend{
    width:100%;
    height:38px;
    margin-top:10px;
    border:0;
    background:transparent;
    color:#0095f6;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.resend:disabled{
    color:#555;
    cursor:not-allowed;
}

@media(max-width:600px){

    .box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:60px;
    }

    .header{
        margin-bottom:22px;
    }

    .header-title{
        font-size:15px;
    }

    .title{
        font-size:21px;
    }

    .description{
        font-size:12px;
    }

    .email-box{
        font-size:12px;
    }

    .action{
        height:42px;
        font-size:12px;
    }

    .status{
        font-size:12px;
    }
}
</style>

</head>

<body>

<div class="page">
<div class="box">

<header class="header">

```
<div
    class="back"
    id="backButton"
    aria-label="Geri"
    role="button"
    tabindex="0"
>‹</div>

<div class="header-title">
    Kayıt ol
</div>
```

</header>

<h1 class="title">
    Hesabını doğrula
</h1>

<p class="description">
    E-posta adresine gönderilen doğrulama<br>
    bağlantısına tıkla.
</p>

<div id="emailBox" class="email-box">
    E-posta yükleniyor...
</div>

<div id="status" class="status loading">
    Firebase oturumu yükleniyor...
</div>

<div class="bottom">

```
<button
    id="changeButton"
    class="action back-btn"
    type="button"
>
    İletişim bilgini değiştir
</button>

<button
    id="verifyButton"
    class="action verify"
    type="button"
    disabled
>
    Kontrol et
</button>
```

</div>

<button
id="resendButton"
class="resend"
type="button"
disabled

>

```
Doğrulama e-postasını tekrar gönder
```

</button>

</div>
</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    setPersistence,
    browserLocalPersistence,
    onAuthStateChanged,
    sendEmailVerification,
    reload
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain:
        "mim-ea133.firebaseapp.com",

    databaseURL:
        "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "mim-ea133",

    storageBucket:
        "mim-ea133.firebasestorage.app",

    messagingSenderId:
        "303525353436",

    appId:
        "1:303525353436:web:082fc090b5025e19942119",

    measurementId:
        "G-K962QE5P1R"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* =========================================
   ELEMENTLER
========================================= */

const emailBox =
    document.getElementById("emailBox");

const status =
    document.getElementById("status");

const verifyButton =
    document.getElementById("verifyButton");

const resendButton =
    document.getElementById("resendButton");

const changeButton =
    document.getElementById("changeButton");

const backButton =
    document.getElementById("backButton");


/* =========================================
   URL
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const username =
    params.get("username") ||
    sessionStorage.getItem(
        "minegram_register_username"
    ) ||
    "";


const email =
    params.get("email") ||
    sessionStorage.getItem(
        "minegram_register_email"
    ) ||
    "";


/* =========================================
   EMAIL GÖSTER
========================================= */

if(email){

    emailBox.textContent =
        email;

}else{

    emailBox.textContent =
        "E-posta adresi bulunamadı.";
}


/* =========================================
   DURUM
========================================= */

function showStatus(
    text,
    type = ""
){

    status.textContent =
        text || "";

    status.className =
        "status";

    if(type){

        status.classList.add(type);
    }
}


/* =========================================
   GERİ
========================================= */

function goBack(){

    let url =
        "./iletisim-bilgileri.html";

    if(username){

        url +=
            "?username=" +
            encodeURIComponent(username);
    }

    window.location.href =
        url;
}


backButton.addEventListener(
    "click",
    goBack
);


changeButton.addEventListener(
    "click",
    goBack
);


backButton.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            goBack();
        }

    }
);


/* =========================================
   FIREBASE PERSISTENCE
========================================= */

try{

    await setPersistence(
        auth,
        browserLocalPersistence
    );

    console.log(
        "[MINEGRAM] Firebase persistence hazır."
    );

}catch(error){

    console.error(
        "[MINEGRAM] Persistence hatası:",
        error
    );

}


/* =========================================
   DOĞRULAMA MAILİ
========================================= */

let verificationSent = false;


async function sendVerification(user){

    if(!user){

        showStatus(
            "Firebase kullanıcısı bulunamadı.",
            ""
        );

        return false;
    }


    try{

        await sendEmailVerification(
            user
        );

        verificationSent = true;

        showStatus(
            "Doğrulama e-postası gönderildi. E-postanı kontrol et ve bağlantıya tıkla.",
            "success"
        );

        resendButton.disabled =
            false;

        return true;

    }catch(error){

        console.error(
            "[MINEGRAM] Mail gönderme hatası:",
            error
        );


        if(
            error.code ===
            "auth/too-many-requests"
        ){

            showStatus(
                "Çok fazla e-posta isteği gönderildi. Biraz sonra tekrar dene."
            );

        }else{

            showStatus(
                "Doğrulama e-postası gönderilemedi: " +
                (error.message || error.code || "Bilinmeyen hata")
            );
        }

        return false;
    }
}


/* =========================================
   AUTH DURUMU
========================================= */

let authResolved = false;


onAuthStateChanged(
    auth,
    async function(user){

        authResolved = true;


        console.log(
            "[MINEGRAM] Auth sonucu:",
            user
                ? user.uid
                : "YOK"
        );


        /* -----------------------------
           OTURUM YOK
        ----------------------------- */

        if(!user){

            showStatus(
                "Firebase oturumu bulunamadı. Kayıt işlemini aynı tarayıcıda tekrar başlat.",
                ""
            );

            verifyButton.disabled =
                true;

            resendButton.disabled =
                true;

            return;
        }


        /* -----------------------------
           USER VAR
        ----------------------------- */

        console.log(
            "[MINEGRAM] Firebase kullanıcı:",
            user.uid
        );

        console.log(
            "[MINEGRAM] Firebase e-posta:",
            user.email
        );


        if(user.email){

            emailBox.textContent =
                user.email;
        }


        /* -----------------------------
           SESSION
        ----------------------------- */

        sessionStorage.setItem(
            "minegram_uid",
            user.uid
        );


        if(user.email){

            sessionStorage.setItem(
                "minegram_register_email",
                user.email
            );
        }


        if(username){

            sessionStorage.setItem(
                "minegram_register_username",
                username
            );
        }


        /* -----------------------------
           ZATEN DOĞRULANDI
        ----------------------------- */

        if(user.emailVerified){

            showStatus(
                "Hesabın zaten doğrulanmış. Minegram'a giriyorsun...",
                "success"
            );

            verifyButton.disabled =
                false;

            verifyButton.textContent =
                "Doğrulandı";


            setTimeout(
                function(){

                    window.location.href =
                        "./index.html";

                },
                800
            );

            return;
        }


        /* -----------------------------
           KONTROL AKTİF
        ----------------------------- */

        verifyButton.disabled =
            false;

        resendButton.disabled =
            false;


        /* -----------------------------
           MAIL GÖNDER
        ----------------------------- */

        await sendVerification(
            user
        );

    }
);


/* =========================================
   KONTROL ET
========================================= */

verifyButton.addEventListener(
    "click",
    async function(){

        const user =
            auth.currentUser;


        if(!user){

            showStatus(
                "Firebase oturumu bulunamadı. Kayıt işlemini aynı tarayıcıda tekrar başlat."
            );

            return;
        }


        verifyButton.disabled =
            true;

        verifyButton.textContent =
            "Kontrol ediliyor...";


        try{

            await reload(user);


            const updatedUser =
                auth.currentUser;


            if(
                updatedUser &&
                updatedUser.emailVerified
            ){

                showStatus(
                    "Hesabın doğrulandı. Minegram'a giriyorsun...",
                    "success"
                );


                verifyButton.textContent =
                    "Doğrulandı";


                setTimeout(
                    function(){

                        window.location.href =
                            "./index.html";

                    },
                    800
                );


            }else{

                showStatus(
                    "E-posta henüz doğrulanmamış. E-postandaki doğrulama bağlantısına tıkla."
                );


                verifyButton.disabled =
                    false;

                verifyButton.textContent =
                    "Kontrol et";
            }


        }catch(error){

            console.error(
                "[MINEGRAM] Kontrol hatası:",
                error
            );


            showStatus(
                "Doğrulama kontrol edilemedi. İnternet bağlantını kontrol et."
            );


            verifyButton.disabled =
                false;

            verifyButton.textContent =
                "Kontrol et";
        }

    }
);


/* =========================================
   TEKRAR GÖNDER
========================================= */

resendButton.addEventListener(
    "click",
    async function(){

        const user =
            auth.currentUser;


        if(!user){

            showStatus(
                "Firebase oturumu bulunamadı."
            );

            return;
        }


        resendButton.disabled =
            true;

        resendButton.textContent =
            "Gönderiliyor...";


        const success =
            await sendVerification(
                user
            );


        if(!success){

            resendButton.disabled =
                false;

            resendButton.textContent =
                "Doğrulama e-postasını tekrar gönder";

            return;
        }


        let seconds = 30;


        resendButton.textContent =
            "Tekrar gönder (" +
            seconds +
            ")";


        const timer =
            setInterval(
                function(){

                    seconds--;


                    resendButton.textContent =
                        "Tekrar gönder (" +
                        seconds +
                        ")";


                    if(seconds <= 0){

                        clearInterval(timer);


                        resendButton.disabled =
                            false;


                        resendButton.textContent =
                            "Doğrulama e-postasını tekrar gönder";
                    }

                },
                1000
            );

    }
);


/* =========================================
   SAYFA AÇILIŞI
========================================= */

console.log(
    "[MINEGRAM] hesap-doğrulama.html açıldı."
);

console.log(
    "[MINEGRAM] username:",
    username
);

console.log(
    "[MINEGRAM] email:",
    email
);

</script>

</body>
</html>
