<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Hesaplarını bulduk - Minegram</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:430px;background:#050505;border:1px solid #262626;border-radius:18px;padding:30px 24px;box-shadow:0 15px 50px rgba(0,0,0,.5)}h1{font-size:27px;margin:0 0 10px}p{color:#aaa;line-height:1.5}.account{border:1px solid #2d2d2d;border-radius:14px;padding:15px;margin:12px 0;cursor:pointer;display:flex;align-items:center;gap:12px}.account.selected{border-color:#fff;background:#111}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#222;font-weight:700}.info{flex:1}.username{font-weight:700}.email{font-size:13px;color:#888;margin-top:4px}.check{font-size:20px}.btn{width:100%;height:50px;border:0;border-radius:10px;background:#fff;color:#000;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#151515;color:#fff;border:1px solid #333}.msg{min-height:22px;margin-top:14px;color:#ff7777;font-size:14px}.ok{color:#65d98b}.back{display:block;text-align:center;color:#aaa;text-decoration:none;margin-top:18px;font-size:14px}
</style>
</head>
<body><main class="card"><h1>Hesaplarını bulduk</h1><p id="desc">Devam etmek istediğin hesabı seç.</p><div id="accounts"></div><div id="message" class="msg"></div><button id="continueBtn" class="btn" disabled>Şifre değiştirmeye devam et</button><button class="btn secondary" onclick="location.href='giris.html'">Direkt giriş yap</button><a class="back" href="sifremi-unuttum.html">Geri dön</a></main>
<script>
const params=new URLSearchParams(location.search);let selected=null;const accountsEl=document.getElementById('accounts'),msg=document.getElementById('message'),btn=document.getElementById('continueBtn');
function store(k,v){if(!v)return;try{sessionStorage.setItem(k,String(v))}catch(e){}try{localStorage.setItem(k,String(v))}catch(e){}}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function accountList(data){return data?.accounts||data?.matches||data?.results||(data?.account?[data.account]:[])||[]}
function render(list){accountsEl.innerHTML='';if(!list.length){msg.textContent='Hesap bulunamadı.';return}list.forEach((a,i)=>{const username=a.username||a.userName||a.profile?.username||'minegram';const email=a.email||a.profile?.email||'';const el=document.createElement('div');el.className='account';el.innerHTML=`<div class="avatar">${esc(username[0]?.toUpperCase()||'M')}</div><div class="info"><div class="username">@${esc(username)}</div><div class="email">${esc(a.maskedEmail||email)}</div></div><div class="check">○</div>`;el.onclick=()=>{selected={...a,username,email};document.querySelectorAll('.account').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');el.querySelector('.check').textContent='✓';btn.disabled=false;msg.textContent=''};accountsEl.appendChild(el)})}
async function find(){const identifier=params.get('identifier')||params.get('email')||params.get('username')||sessionStorage.getItem('minegram_recovery_identifier')||localStorage.getItem('minegram_recovery_identifier')||'';const mode=params.get('mode')||sessionStorage.getItem('minegram_recovery_mode')||'email';if(!identifier){msg.textContent='Hesap bilgisi bulunamadı.';return}store('minegram_recovery_identifier',identifier);store('minegram_recovery_mode',mode);try{const r=await fetch('/api/forgot-password/find-account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier,mode})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Hesap bulunamadı.');const list=accountList(d);render(list)}catch(e){msg.textContent=e.message}}
btn.onclick=async()=>{if(!selected)return;btn.disabled=true;btn.textContent='Kod gönderiliyor...';msg.textContent='';try{const identifier=selected.username||selected.email||params.get('identifier');const mode=selected.email?'email':(params.get('mode')||'email');const r=await fetch('/api/forgot/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier,mode,email:selected.email,username:selected.username})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Doğrulama kodu gönderilemedi.');const recoveryId=d.recoveryId||d.recovery_id;if(!recoveryId)throw new Error('Şifre sıfırlama oturumu oluşturulamadı.');['minegram_recovery_id','recoveryId','recovery_id'].forEach(k=>store(k,recoveryId));['minegram_recovery_identifier','identifier'].forEach(k=>store(k,identifier));if(d.email)store('email',d.email);location.href='yeni-sifre.html'}catch(e){msg.textContent=e.message;btn.disabled=false;btn.textContent='Şifre değiştirmeye devam et'}};find();
</script></body></html>
