<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>Şifremi unuttum • Minegram</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body{
    min-height:100vh;
    min-height:100dvh;
}

button{
    font-family:inherit;
}

.page{
    width:100%;
    min-height:100vh;
    min-height:100dvh;

    background:#000;

    padding:
        max(18px,env(safe-area-inset-top))
        22px
        calc(28px + env(safe-area-inset-bottom));
}


/* =====================================================
   ÜST BAR
===================================================== */

.header{

    height:72px;

    display:flex;
    align-items:center;

    gap:20px;
}

.back{

    width:38px;
    height:38px;

    border:0;
    background:transparent;

    color:#fff;

    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.back svg{

    width:32px;
    height:32px;

    stroke:currentColor;
    stroke-width:3;

    fill:none;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.header-title{

    font-size:29px;
    line-height:1;

    font-weight:700;

    letter-spacing:-.6px;
}


/* =====================================================
   ANA İÇERİK
===================================================== */

.content{

    width:100%;
    max-width:720px;

    margin:125px auto 0;
}

h1{

    margin:0;

    text-align:center;

    font-size:46px;
    line-height:1.12;

    font-weight:750;

    letter-spacing:-1.5px;
}

.subtitle{

    margin:32px auto 42px;

    max-width:680px;

    color:#b7b7b7;

    font-size:26px;
    line-height:1.42;

    text-align:left;
}


/* =====================================================
   HESAPLAR
===================================================== */

.accounts{

    display:flex;
    flex-direction:column;

    gap:16px;
}

.account{

    width:100%;
    min-height:145px;

    padding:27px 30px;

    border:2px solid transparent;

    border-radius:25px;

    background:#121212;

    color:#fff;

    text-align:left;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:space-between;

    transition:
        background .15s ease,
        border-color .15s ease,
        transform .1s ease;
}

.account:hover{

    background:#171717;
}

.account:active{

    transform:scale(.99);
}

.account.selected{

    border-color:#0095f6;

    background:#141414;
}

.account-info{

    min-width:0;

    flex:1;
}

.username{

    font-size:31px;

    font-weight:750;

    line-height:1.2;

    margin-bottom:12px;
}

.email{

    color:#b6b6b6;

    font-size:26px;

    line-height:1.2;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* =====================================================
   RADIO
===================================================== */

.radio{

    flex:0 0 auto;

    width:48px;
    height:48px;

    margin-left:18px;

    border:3px solid #555;

    border-radius:50%;

    background:transparent;

    position:relative;
}

.account.selected .radio{

    border-color:#0095f6;
}

.account.selected .radio::after{

    content:"";

    position:absolute;

    width:24px;
    height:24px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#0095f6;
}


/* =====================================================
   BUTONLAR
===================================================== */

.actions{

    display:none;

    flex-direction:column;

    gap:12px;

    margin-top:16px;

    animation:
        showButtons .18s ease;
}

.actions.show{

    display:flex;
}

@keyframes showButtons{

    from{

        opacity:0;

        transform:
            translateY(-5px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}

.action-btn{

    width:100%;

    min-height:58px;

    border:0;

    border-radius:15px;

    padding:15px 18px;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    transition:
        opacity .15s ease,
        transform .1s ease;
}

.action-btn:hover{

    opacity:.92;
}

.action-btn:active{

    transform:scale(.99);
}

.primary{

    background:#0095f6;

    color:#fff;
}

.secondary{

    background:#0095f6;

    color:#fff;
}


/* =====================================================
   DURUM
===================================================== */

.status{

    display:none;

    margin-top:18px;

    padding:14px 16px;

    border-radius:14px;

    background:#171717;

    color:#cfcfcf;

    font-size:15px;

    line-height:1.4;
}

.status.show{

    display:block;
}

.status.error{

    color:#ff6b6b;
}

.status.success{

    color:#63e6be;
}


/* =====================================================
   LOADING
===================================================== */

.action-btn.loading{

    opacity:.65;

    pointer-events:none;
}


/* =====================================================
   HESAP YÜKLENİYOR
===================================================== */

.loading-box{

    width:100%;

    min-height:145px;

    border-radius:25px;

    background:#121212;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#b7b7b7;

    font-size:18px;
}

.spinner{

    width:25px;
    height:25px;

    margin-right:12px;

    border:3px solid #333;

    border-top-color:#0095f6;

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =====================================================
   HESAP YOK
===================================================== */

.empty{

    width:100%;

    padding:30px;

    border-radius:25px;

    background:#121212;

    color:#b7b7b7;

    text-align:center;

    font-size:18px;

    line-height:1.5;
}


/* =====================================================
   MOBİL
===================================================== */

@media(max-width:600px){

    .page{

        padding-left:20px;
        padding-right:20px;
    }

    .header{

        height:62px;

        gap:16px;
    }

    .header-title{

        font-size:27px;
    }

    .content{

        margin-top:112px;
    }

    h1{

        font-size:43px;
    }

    .subtitle{

        margin-top:30px;
        margin-bottom:38px;

        font-size:24px;

        line-height:1.45;
    }

    .account{

        min-height:145px;

        padding:25px;

        border-radius:24px;
    }

    .username{

        font-size:29px;
    }

    .email{

        font-size:24px;
    }

    .radio{

        width:45px;
        height:45px;
    }

    .account.selected .radio::after{

        width:22px;
        height:22px;
    }

    .action-btn{

        min-height:57px;

        font-size:17px;
    }
}

</style>

</head>


<body>


<div class="page">


    <!-- =================================================
         ÜST BAR
    ================================================== -->

    <header class="header">

        <button
            class="back"
            type="button"
            onclick="goBack()"
            aria-label="Geri"
        >

            <svg viewBox="0 0 32 32">

                <path
                    d="M20 5 L9 16 L20 27"
                ></path>

                <path
                    d="M10 16 H27"
                ></path>

            </svg>

        </button>


        <div class="header-title">
            Şifremi unuttum
        </div>

    </header>


    <!-- =================================================
         İÇERİK
    ================================================== -->

    <main class="content">


        <h1>
            Hesaplarını bulduk
        </h1>


        <div class="subtitle">
            Kayıtlı hesaplarından devam etmek istediğini seç.
        </div>


        <!-- =================================================
             HESAPLAR
        ================================================== -->

        <section
            class="accounts"
            id="accounts"
        >

            <div class="loading-box">

                <div class="spinner"></div>

                Hesapların aranıyor...

            </div>

        </section>


        <!-- =================================================
             BUTONLAR
        ================================================== -->

        <div
            class="actions"
            id="actions"
        >


            <!-- DİREKT GİRİŞ -->

            <button
                class="action-btn primary"
                id="loginButton"
                type="button"
                onclick="directLogin(event)"
            >

                Direkt giriş yap

            </button>


            <!-- ŞİFRE DEĞİŞTİR -->

            <button
                class="action-btn secondary"
                id="resetButton"
                type="button"
                onclick="startPasswordReset(event)"
            >

                Şifre değiştirmeye devam et

            </button>


        </div>


        <!-- =================================================
             DURUM
        ================================================== -->

        <div
            class="status"
            id="status"
        ></div>


    </main>

</div>


<script>

"use strict";


/* =====================================================
   GLOBAL
===================================================== */

let selectedAccount = null;


/* =====================================================
   SAYFA PARAMETRELERİ
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const recoveryToken =
    (
        urlParams.get("token") ||
        sessionStorage.getItem(
            "minegram_recovery_token"
        ) ||
        ""
    ).trim();


let recoveryIdentifier =
    (
        urlParams.get("identifier") ||
        urlParams.get("username") ||
        sessionStorage.getItem(
            "minegram_recovery_identifier"
        ) ||
        sessionStorage.getItem(
            "minegram_recovery_username"
        ) ||
        ""
    )
    .trim()
    .replace(/^@/, "")
    .toLowerCase();


let recoveryMode =
    (
        urlParams.get("mode") ||
        sessionStorage.getItem(
            "minegram_recovery_mode"
        ) ||
        ""
    )
    .trim()
    .toLowerCase();


let recoveryEmail =
    (
        urlParams.get("email") ||
        sessionStorage.getItem(
            "minegram_recovery_email"
        ) ||
        ""
    )
    .trim()
    .toLowerCase();


/* =====================================================
   GERİ
===================================================== */

function goBack(){

    if(
        document.referrer &&
        document.referrer !== window.location.href
    ){

        history.back();

        return;
    }


    window.location.href =
        "giris.html";
}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    type = ""
){

    const status =
        document.getElementById(
            "status"
        );


    if(!status){
        return;
    }


    status.classList.remove(
        "error",
        "success"
    );


    status.classList.add(
        "show"
    );


    if(type){

        status.classList.add(
            type
        );
    }


    status.textContent =
        message;
}


/* =====================================================
   HESAP SEÇ
===================================================== */

function selectAccount(button){

    if(!button){
        return;
    }


    document
        .querySelectorAll(".account")
        .forEach(account => {

            account.classList.remove(
                "selected"
            );

        });


    button.classList.add(
        "selected"
    );


    selectedAccount = {

        id:
            String(
                button.dataset.id ||
                ""
            ).trim(),

        username:
            String(
                button.dataset.username ||
                ""
            )
            .trim()
            .replace(/^@/, "")
            .toLowerCase(),

        email:
            String(
                button.dataset.email ||
                ""
            )
            .trim()
            .toLowerCase(),

        displayName:
            String(
                button.dataset.displayName ||
                ""
            ).trim(),

        avatar:
            String(
                button.dataset.avatar ||
                ""
            ).trim()

    };


    /* Recovery bilgilerini sakla */

    if(
        selectedAccount.username
    ){

        recoveryIdentifier =
            selectedAccount.username;

        recoveryMode =
            "username";

        sessionStorage.setItem(
            "minegram_recovery_identifier",
            selectedAccount.username
        );

        sessionStorage.setItem(
            "minegram_recovery_username",
            selectedAccount.username
        );

        sessionStorage.setItem(
            "minegram_recovery_mode",
            "username"
        );
    }


    if(
        selectedAccount.email
    ){

        recoveryEmail =
            selectedAccount.email;

        sessionStorage.setItem(
            "minegram_recovery_email",
            selectedAccount.email
        );
    }


    const actions =
        document.getElementById(
            "actions"
        );


    if(actions){

        actions.classList.add(
            "show"
        );
    }


    const status =
        document.getElementById(
            "status"
        );


    if(status){

        status.classList.remove(
            "show",
            "error",
            "success"
        );

        status.textContent = "";
    }

}


/* =====================================================
   HESAP KARTI OLUŞTUR
===================================================== */

function createAccountCard(account){

    if(!account){
        return null;
    }


    const username =
        String(
            account.username ||
            ""
        )
        .trim()
        .replace(/^@/, "")
        .toLowerCase();


    const email =
        String(
            account.email ||
            ""
        )
        .trim()
        .toLowerCase();


    if(!username && !email){
        return null;
    }


    const button =
        document.createElement(
            "button"
        );


    button.type =
        "button";


    button.className =
        "account";


    button.dataset.id =
        String(
            account.id ||
            ""
        );


    button.dataset.username =
        username;


    button.dataset.email =
        email;


    button.dataset.displayName =
        String(
            account.displayName ||
            account.display_name ||
            username
        );


    button.dataset.avatar =
        String(
            account.avatar ||
            account.avatar_url ||
            ""
        );


    const info =
        document.createElement(
            "div"
        );


    info.className =
        "account-info";


    const usernameDiv =
        document.createElement(
            "div"
        );


    usernameDiv.className =
        "username";


    usernameDiv.textContent =
        "@" +
        (
            username ||
            "minegram"
        );


    const emailDiv =
        document.createElement(
            "div"
        );


    emailDiv.className =
        "email";


    emailDiv.textContent =
        email ||
        "E-posta adresi bulunamadı";


    info.appendChild(
        usernameDiv
    );


    info.appendChild(
        emailDiv
    );


    const radio =
        document.createElement(
            "div"
        );


    radio.className =
        "radio";


    button.appendChild(
        info
    );


    button.appendChild(
        radio
    );


    button.addEventListener(
        "click",
        function(){

            selectAccount(
                button
            );

        }
    );


    return button;
}


/* =====================================================
   HESAPLARI GÖSTER
===================================================== */

function renderAccounts(accounts){

    const container =
        document.getElementById(
            "accounts"
        );


    if(!container){
        return;
    }


    container.innerHTML = "";


    if(
        !Array.isArray(accounts) ||
        accounts.length === 0
    ){

        container.innerHTML = `
            <div class="empty">
                Bu bilgilerle eşleşen Minegram hesabı bulunamadı.
            </div>
        `;

        return;
    }


    let firstCard = null;


    accounts.forEach(
        account => {

            const card =
                createAccountCard(
                    account
                );


            if(card){

                container.appendChild(
                    card
                );


                if(!firstCard){

                    firstCard =
                        card;
                }

            }

        }
    );


    if(
        container.children.length === 0
    ){

        container.innerHTML = `
            <div class="empty">
                Hesap bilgileri yüklenemedi.
            </div>
        `;

        return;
    }


    /*
     * Önceden seçilmiş kullanıcı adı varsa
     * onu otomatik seç.
     */

    if(recoveryIdentifier){

        const cards =
            container.querySelectorAll(
                ".account"
            );


        cards.forEach(
            card => {

                if(
                    String(
                        card.dataset.username ||
                        ""
                    ).toLowerCase() ===
                    recoveryIdentifier
                ){

                    selectAccount(
                        card
                    );

                }

            }
        );
    }

}


/* =====================================================
   HESAP BUL
===================================================== */

async function findAccount(){

    const container =
        document.getElementById(
            "accounts"
        );


    try{

        /*
         * Öncelik:
         * username
         */

        let identifier =
            recoveryIdentifier;


        let mode =
            recoveryMode;


        /*
         * Eğer username yok ama e-posta varsa
         * e-posta üzerinden arama yap.
         */

        if(!identifier && recoveryEmail){

            identifier =
                recoveryEmail;

            mode =
                "email";
        }


        /*
         * Hiç bilgi yoksa:
         * Token tek başına hesap arama endpoint'inde
         * kullanılmıyor.
         */

        if(!identifier){

            throw new Error(
                "Hesap bilgisi bulunamadı. Lütfen şifre sıfırlama işlemini baştan başlat."
            );
        }


        const response =
            await fetch(
                "/api/forgot-password/find-account",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({

                        identifier:
                            identifier,

                        mode:
                            mode ||
                            (
                                identifier.includes("@")
                                    ? "email"
                                    : "username"
                            )

                    }),

                    cache:"no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(
                    () => ({})
                );


        console.log(
            "[MINEGRAM FIND ACCOUNT]",
            data
        );


        if(
            !response.ok ||
            data.ok === false
        ){

            throw new Error(
                data.error ||
                "Hesap bulunamadı."
            );
        }


        /*
         * Backend tek account döndürüyor.
         */

        if(
            data.account
        ){

            renderAccounts([
                data.account
            ]);


            return;
        }


        /*
         * İleride backend birden fazla hesap
         * döndürürse bunu da destekle.
         */

        if(
            Array.isArray(
                data.accounts
            )
        ){

            renderAccounts(
                data.accounts
            );

            return;
        }


        /*
         * profile formatı gelirse
         */

        if(
            data.profile
        ){

            renderAccounts([
                data.profile
            ]);

            return;
        }


        throw new Error(
            "Hesap bilgileri alınamadı."
        );


    }
    catch(error){

        console.error(
            "[MINEGRAM FIND ACCOUNT ERROR]",
            error
        );


        if(container){

            container.innerHTML = `
                <div class="empty">
                    ${escapeHtml(
                        error?.message ||
                        "Hesap bulunamadı."
                    )}
                </div>
            `;
        }


        showStatus(
            error?.message ||
            "Hesap bulunamadı.",
            "error"
        );
    }

}


/* =====================================================
   HTML GÜVENLİ METİN
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


/* =====================================================
   DİREKT GİRİŞ
===================================================== */

function directLogin(event){

    if(event){

        event.stopPropagation();

    }


    if(!selectedAccount){

        showStatus(
            "Önce bir hesap seç.",
            "error"
        );

        return;
    }


    /*
     * Giriş sayfasına username gönder.
     * Mevcut login sistemin bunu destekliyor.
     */

    const params =
        new URLSearchParams();


    if(
        selectedAccount.username
    ){

        params.set(
            "username",
            selectedAccount.username
        );
    }


    if(
        selectedAccount.email
    ){

        params.set(
            "email",
            selectedAccount.email
        );
    }


    window.location.href =
        "giris.html?" +
        params.toString();
}


/* =====================================================
   ŞİFRE DEĞİŞTİRME
===================================================== */

async function startPasswordReset(event){

    if(event){

        event.stopPropagation();

    }


    if(!selectedAccount){

        showStatus(
            "Önce bir hesap seç.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById(
            "resetButton"
        );


    const status =
        document.getElementById(
            "status"
        );


    if(!button){
        return;
    }


    button.classList.add(
        "loading"
    );


    button.textContent =
        "Kod gönderiliyor...";


    if(status){

        status.classList.remove(
            "error",
            "success"
        );

        status.classList.add(
            "show"
        );

        status.textContent =
            (
                selectedAccount.email ||
                "E-posta adresine"
            ) +
            " doğrulama kodu gönderiliyor...";
    }


    try{

        /*
         * Kullanıcı adı ile gönderiyoruz.
         *
         * Böylece aynı e-posta adresine bağlı
         * profiller olsa bile seçilen kullanıcı
         * hedeflenir.
         */

        const response =
            await fetch(
                "/api/forgot/start",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({

                        identifier:
                            selectedAccount.username,

                        mode:
                            "username"

                    }),

                    cache:"no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(
                    () => ({})
                );


        console.log(
            "[MINEGRAM PASSWORD RESET START]",
            data
        );


        if(
            !response.ok ||
            data.ok === false
        ){

            throw new Error(
                data.error ||
                "Doğrulama kodu gönderilemedi."
            );
        }


        /*
         * Recovery bilgilerini sakla.
         */

        sessionStorage.setItem(
            "minegram_recovery_identifier",
            selectedAccount.username
        );


        sessionStorage.setItem(
            "minegram_recovery_username",
            selectedAccount.username
        );


        sessionStorage.setItem(
            "minegram_recovery_mode",
            "username"
        );


        if(
            data.email ||
            selectedAccount.email
        ){

            sessionStorage.setItem(
                "minegram_recovery_email",
                (
                    data.email ||
                    selectedAccount.email
                )
                .trim()
                .toLowerCase()
            );
        }


        /*
         * Doğrulama sayfasına git.
         */

        const params =
            new URLSearchParams();


        params.set(
            "identifier",
            selectedAccount.username
        );


        params.set(
            "mode",
            "username"
        );


        if(
            data.email ||
            selectedAccount.email
        ){

            params.set(
                "email",
                data.email ||
                selectedAccount.email
            );
        }


        window.location.href =
            "sifremi-unuttum-dogrulama.html?" +
            params.toString();


    }
    catch(error){

        console.error(
            "[MINEGRAM RESET START ERROR]",
            error
        );


        button.classList.remove(
            "loading"
        );


        button.textContent =
            "Şifre değiştirmeye devam et";


        showStatus(
            error?.message ||
            "Bir hata oluştu. Lütfen tekrar deneyin.",
            "error"
        );
    }

}
