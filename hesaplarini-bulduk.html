<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
name="theme-color"
content="#000000"
>

<title>Minegram - Şifremi unuttum</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:365px;
    margin-top:90px;
    text-align:center;
}

.header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:25px;
}

.back{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    margin-right:8px;
}

.header-title{
    font-size:16px;
    font-weight:700;
}

.title{
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 12px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.45;
    margin:0 0 22px;
}

.tabs{
    display:flex;
    gap:9px;
    width:100%;
    margin-bottom:9px;
}

.tab{
    width:50%;
    height:44px;
    border-radius:7px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.tab.email{
    border:1px solid #554f67;
    background:#554f67;
    color:#eee8fa;
}

.tab.phone{
    border:1px solid #292929;
    background:#000;
    color:#fff;
}

.input{
    width:100%;
    height:44px;
    margin-bottom:9px;
    padding:0 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#000;
    color:#fff;
    outline:none;
    font-size:12px;
}

.input::placeholder{
    color:#777;
}

.input:focus{
    border-color:#555;
}

.note{
    min-height:20px;
    margin:8px 0 0;
    color:#777;
    font-size:12px;
    line-height:1.45;
}

.status{
    min-height:20px;
    margin-top:10px;
    font-size:12px;
    color:#ff4d4d;
}

.status.success{
    color:#35c759;
}

.status.loading{
    color:#aaa;
}

.bottom{
    display:flex;
    gap:9px;
    width:100%;
    margin-top:25px;
}

.action{
    width:50%;
    height:42px;
    border-radius:22px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.back-btn{
    background:#000;
    border:1px solid #555;
    color:#0095f6;
}

.next-btn{
    background:#2d80bd;
    border:0;
    color:#000;
}

.next-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

@media(max-width:600px){

    .box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:60px;
    }

    .title{
        font-size:21px;
    }

    .description{
        font-size:12px;
    }

}

</style>

</head>

<body>

<div class="page">

    <div class="box">

        <div class="header">

            <div
                id="topBack"
                class="back"
                role="button"
                tabindex="0"
                aria-label="Geri"
            >‹</div>

            <div class="header-title">
                Şifremi unuttum
            </div>

        </div>


        <h1 class="title">
            İletişim bilgini ekle
        </h1>


        <p class="description">
            Şifreni yenilemek için hesabındaki<br>
            e-posta adresini kullan.
        </p>


        <div class="tabs">

            <button
                id="emailTab"
                class="tab email"
                type="button"
            >
                E-posta
            </button>

            <button
                id="phoneTab"
                class="tab phone"
                type="button"
            >
                Telefon
            </button>

        </div>


        <input
            id="contact"
            class="input"
            type="email"
            autocomplete="email"
            placeholder="E-posta adresi"
            maxlength="254"
        >


        <div id="note" class="note">
            Devam ettiğinde e-posta adresine
            6 haneli doğrulama kodu gönderilir.
        </div>


        <div id="status" class="status"></div>


        <div class="bottom">

            <button
                id="backBtn"
                class="action back-btn"
                type="button"
            >
                Geri
            </button>

            <button
                id="nextBtn"
                class="action next-btn"
                type="button"
            >
                İleri
            </button>

        </div>

    </div>

</div>


<script>

"use strict";


/* =========================================================
   MINEGRAM ŞİFRE KURTARMA
   BU SAYFA KAYIT SİSTEMİ DEĞİLDİR.
   /api/register/* KULLANILMAZ.
========================================================= */

console.log("========================================");
console.log("MINEGRAM ŞİFRE KURTARMA AKTİF");
console.log("SAYFA:",window.location.href);
console.log("========================================");


/* =========================================================
   ELEMENTLER
========================================================= */

const emailTab =
    document.getElementById("emailTab");

const phoneTab =
    document.getElementById("phoneTab");

const contact =
    document.getElementById("contact");

const note =
    document.getElementById("note");

const status =
    document.getElementById("status");

const nextBtn =
    document.getElementById("nextBtn");

const backBtn =
    document.getElementById("backBtn");

const topBack =
    document.getElementById("topBack");


/* =========================================================
   DEĞİŞKENLER
========================================================= */

let mode = "email";

let busy = false;


/* =========================================================
   URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


/* =========================================================
   KAYITLI RECOVERY E-POSTASI
========================================================= */

const savedEmail =
    String(
        params.get("email") ||
        params.get("identifier") ||
        sessionStorage.getItem(
            "minegram_recovery_email"
        ) ||
        ""
    )
    .trim()
    .toLowerCase();


/* =========================================================
   DURUM MESAJI
========================================================= */

function showStatus(
    text,
    success = false,
    loading = false
){

    status.textContent =
        text || "";

    if(loading){

        status.className =
            "status loading";

        return;
    }

    status.className =
        success
            ? "status success"
            : "status";
}


/* =========================================================
   E-POSTA SEÇ
========================================================= */

function selectEmail(){

    mode = "email";


    emailTab.style.background =
        "#554f67";

    emailTab.style.borderColor =
        "#554f67";

    emailTab.style.color =
        "#eee8fa";


    phoneTab.style.background =
        "#000";

    phoneTab.style.borderColor =
        "#292929";

    phoneTab.style.color =
        "#fff";


    contact.type =
        "email";

    contact.autocomplete =
        "email";

    contact.placeholder =
        "E-posta adresi";


    note.textContent =
        "Devam ettiğinde e-posta adresine 6 haneli doğrulama kodu gönderilir.";


    showStatus("");

}


emailTab.addEventListener(
    "click",
    selectEmail
);


/* =========================================================
   TELEFON
========================================================= */

phoneTab.addEventListener(
    "click",
    function(){

        selectEmail();

        showStatus(
            "Şimdilik yalnızca e-posta ile şifre yenileme yapılabilir."
        );

        contact.focus();

    }
);


/* =========================================================
   GERİ
========================================================= */

function goBack(){

    window.location.href =
        "login.html";

}


topBack.addEventListener(
    "click",
    goBack
);


backBtn.addEventListener(
    "click",
    goBack
);


topBack.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            goBack();

        }

    }
);


/* =========================================================
   E-POSTA KONTROL
========================================================= */

function validEmail(email){

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
        email
    );

}


/* =========================================================
   ŞİFRE KURTARMA KODU
========================================================= */

async function sendRecoveryCode(email){

    console.log(
        "[MINEGRAM] /api/forgot/start gönderiliyor:",
        email
    );


    const response =
        await fetch(
            "/api/forgot/start",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"
                },

                body:JSON.stringify({

                    identifier:
                        email,

                    email:
                        email,

                    mode:
                        "email"

                }),

                cache:"no-store"
            }
        );


    let result = {};


    try{

        result =
            await response.json();

    }
    catch(error){

        console.error(
            "[MINEGRAM] JSON okunamadı:",
            error
        );

    }


    console.log(
        "[MINEGRAM FORGOT START]",
        response.status,
        result
    );


    if(!response.ok){

        throw new Error(
            result.error ||
            result.message ||
            "Hesap bulunamadı veya kod gönderilemedi."
        );

    }


    if(result.ok === false){

        throw new Error(
            result.error ||
            result.message ||
            "Kod gönderilemedi."
        );

    }


    return result;

}


/* =========================================================
   İLERİ
========================================================= */

async function goNext(){

    if(busy){

        return;

    }


    if(mode !== "email"){

        selectEmail();

    }


    const email =
        String(
            contact.value || ""
        )
        .trim()
        .toLowerCase();


    if(!email){

        showStatus(
            "Lütfen e-posta adresini gir."
        );

        contact.focus();

        return;

    }


    if(!validEmail(email)){

        showStatus(
            "Geçerli bir e-posta adresi gir."
        );

        contact.focus();

        return;

    }


    /* -----------------------------------------------------
       SADECE RECOVERY STORAGE
    ----------------------------------------------------- */

    sessionStorage.setItem(
        "minegram_recovery_identifier",
        email
    );

    sessionStorage.setItem(
        "minegram_recovery_email",
        email
    );

    sessionStorage.setItem(
        "minegram_recovery_mode",
        "email"
    );


    /* -----------------------------------------------------
       BUTON
    ----------------------------------------------------- */

    busy = true;

    nextBtn.disabled = true;

    nextBtn.textContent =
        "Gönderiliyor...";


    showStatus(
        "E-posta adresin kontrol ediliyor...",
        false,
        true
    );


    try{

        /* -------------------------------------------------
           SADECE /api/forgot/start
        ------------------------------------------------- */

        const result =
            await sendRecoveryCode(
                email
            );


        /* -------------------------------------------------
           SUNUCUDAN GELEN E-POSTA
        ------------------------------------------------- */

        const serverEmail =
            String(
                result?.email ||
                result?.account?.email ||
                email
            )
            .trim()
            .toLowerCase();


        sessionStorage.setItem(
            "minegram_recovery_email",
            serverEmail
        );

        sessionStorage.setItem(
            "minegram_recovery_identifier",
            serverEmail
        );

        sessionStorage.setItem(
            "minegram_recovery_mode",
            "email"
        );


        /* -------------------------------------------------
           BAŞARILI
        ------------------------------------------------- */

        showStatus(
            "Kod gönderildi. E-postanı kontrol et.",
            true
        );


        nextBtn.textContent =
            "Kod gönderildi";


        /* -------------------------------------------------
           KOD SAYFASINA GİT
        ------------------------------------------------- */

        const next =
            new URLSearchParams();


        next.set(
            "identifier",
            serverEmail
        );


        next.set(
            "email",
            serverEmail
        );


        next.set(
            "mode",
            "email"
        );


        setTimeout(
            function(){

                window.location.replace(
                    "./sifremi-unuttum.html?" +
                    next.toString()
                );

            },
            700
        );


    }
    catch(error){

        console.error(
            "[MINEGRAM] ŞİFRE KURTARMA HATASI:",
            error
        );


        busy = false;

        nextBtn.disabled =
            false;

        nextBtn.textContent =
            "İleri";


        showStatus(
            error?.message ||
            "Kod gönderilemedi. Lütfen tekrar dene."
        );

    }

}


/* =========================================================
   İLERİ BUTONU
========================================================= */

nextBtn.addEventListener(
    "click",
    goNext
);


/* =========================================================
   ENTER
========================================================= */

contact.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            goNext();

        }

    }
);


/* =========================================================
   KAYITLI E-POSTA
========================================================= */

if(savedEmail){

    contact.value =
        savedEmail;

}


/* =========================================================
   BAŞLANGIÇ
========================================================= */

selectEmail();


console.log(
    "[MINEGRAM] Şifre kurtarma iletişim ekranı hazır."
);

console.log(
    "[MINEGRAM] Recovery email:",
    savedEmail || "YOK"
);

</script>

</body>
</html>
