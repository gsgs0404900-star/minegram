<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Yeni şifre - Minegram</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;overflow-x:hidden}.page{width:100%;min-height:100vh;background:#000}
.topbar{width:100%;height:60px;display:flex;align-items:center;padding-left:38px}
.back{width:25px;height:35px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:300;cursor:pointer}
.top-title{margin-left:15px;font-size:20px;font-weight:700}.content{width:317px;margin:115px auto 0}
.title{text-align:center;font-size:30px;line-height:1.15;font-weight:700;margin:0 0 24px}
.description{font-size:18px;line-height:1.45;color:#bdbdbd;margin:0 0 45px}
.input{display:block;width:100%;height:39px;padding:0 10px;border:1px solid #252525;border-radius:6px;background:#050505;color:#fff;outline:none;font-size:12px;margin-bottom:12px}
.input::placeholder{color:#777}.input:focus{border-color:#555}
.continue-btn{display:block;width:100%;height:37px;margin-top:18px;border:0;border-radius:22px;background:#2677b5;color:#000;font-size:12px;font-weight:700;cursor:pointer}
.continue-btn:disabled{opacity:.6;cursor:not-allowed}.message{min-height:18px;margin-top:12px;text-align:center;font-size:11px;line-height:1.4;color:#ff5c5c}
.message.success{color:#55b8ff}.login-link{display:block;margin-top:25px;text-align:center;color:#008cff;font-size:12px;text-decoration:none}.login-link:hover{text-decoration:underline}
@media(max-width:600px){.topbar{height:70px;padding-left:28px}.back{width:30px;height:38px;font-size:38px}.top-title{margin-left:12px;font-size:21px}.content{width:calc(100% - 40px);max-width:714px;margin:105px auto 0}.title{font-size:42px}.description{font-size:21px;line-height:1.5;margin-bottom:40px}.input{height:68px;padding:0 20px;font-size:18px;border:2px solid #686868;border-radius:9px}.continue-btn{height:58px;font-size:20px;border-radius:32px}.message{font-size:14px}.login-link{font-size:18px;font-weight:700}}
@media(max-width:430px){.content{width:calc(100% - 40px);margin-top:65px}.title{font-size:38px}.description{font-size:20px}}
</style>
</head>
<body>
<div class="page">
  <div class="topbar"><div class="back" id="backButton">‹</div><div class="top-title">Yeni şifre</div></div>
  <main class="content">
    <h1 class="title">Yeni şifreni oluştur</h1>
    <p class="description">Hesabın için yeni şifreni belirle. Şifre değiştikten sonra Minegram ana sayfasına otomatik olarak giriş yapılacak.</p>
    <input type="password" id="password" class="input" placeholder="Yeni şifre" autocomplete="new-password" maxlength="128">
    <input type="password" id="confirmPassword" class="input" placeholder="Yeni şifre tekrar" autocomplete="new-password" maxlength="128">
    <button type="button" id="continueButton" class="continue-btn">Şifreyi değiştir</button>
    <div id="message" class="message"></div>
    <a href="giris.html" class="login-link">Giriş ekranına dön</a>
  </main>
</div>
<script>
"use strict";
const passwordInput=document.getElementById("password");
const confirmInput=document.getElementById("confirmPassword");
const continueButton=document.getElementById("continueButton");
const message=document.getElementById("message");
const backButton=document.getElementById("backButton");
const API="https://minegram-hwns.onrender.com/api";
const params=new URLSearchParams(location.search);
function getS(k){try{return sessionStorage.getItem(k)||""}catch{return""}}
function setL(k,v){try{localStorage.setItem(k,String(v??""))}catch{}}
function setS(k,v){try{sessionStorage.setItem(k,String(v??""))}catch{}}
function first(...v){return v.find(x=>x!==undefined&&x!==null&&String(x).trim()!=="")||""}
function showMessage(text,success=false){message.textContent=text||"";message.className="message"+(success?" success":"")}
const resetToken=first(params.get("token"),params.get("resetToken"),getS("minegram_password_reset_token"),getS("minegram_reset_token"),getS("resetToken"));
const identifier=first(params.get("identifier"),getS("minegram_reset_username"),getS("minegram_recovery_identifier"));
const email=first(params.get("email"),getS("minegram_reset_email"),getS("minegram_recovery_email"));
async function api(path,options={}){
  const r=await fetch(API+path,{...options,headers:{"Content-Type":"application/json","Accept":"application/json",...(options.headers||{})},credentials:"include",cache:"no-store"});
  const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{d={error:raw||"Sunucudan geçersiz cevap geldi."}}
  if(!r.ok)throw new Error(d.error||d.message||"Sunucu hatası.");
  return d;
}
function clearSession(){
  const keys=[
    "minegram_token","minegram_supabase_token","minegram_access_token",
    "minegram_refresh_token","supabase_token","access_token",
    "minegram_user_id","minegram_username","minegram_email",
    "minegram_user","minegram_profile"
  ];
  for(const key of keys){
    localStorage.removeItem(key);
    sessionStorage.removeItem(key);
  }
}

function extractToken(data){
  const candidates=[
    data?.access_token,data?.accessToken,data?.token,data?.supabaseAccessToken,
    data?.session?.access_token,data?.session?.accessToken,data?.session?.token,
    data?.data?.access_token,data?.data?.accessToken,data?.data?.token,
    data?.data?.session?.access_token,data?.data?.session?.accessToken
  ];
  for(const value of candidates){
    if(value && typeof value==="string" && value.trim() && value!=="null" && value!=="undefined") return value.trim();
  }
  return "";
}

function extractUser(data){
  return data?.user || data?.profile || data?.data?.user || data?.data?.profile ||
    (Array.isArray(data?.profiles) ? data.profiles[0] : null) ||
    (Array.isArray(data?.data?.profiles) ? data.data.profiles[0] : null) || null;
}

function saveSession(data){
  const token=extractToken(data);
  if(!token) return false;

  const user=extractUser(data);
  const refresh=first(
    data?.refresh_token,data?.refreshToken,
    data?.session?.refresh_token,data?.data?.refresh_token,data?.data?.refreshToken
  );

  clearSession();

  for(const key of [
    "minegram_token","minegram_supabase_token","minegram_access_token",
    "supabase_token","access_token"
  ]) localStorage.setItem(key,token);

  if(refresh){
    for(const key of ["minegram_refresh_token","refresh_token","supabase_refresh_token"]){
      localStorage.setItem(key,String(refresh));
      sessionStorage.setItem(key,String(refresh));
    }
  }

  if(user){
    localStorage.setItem("minegram_user",JSON.stringify(user));
    if(user.id!=null) localStorage.setItem("minegram_user_id",String(user.id));
    if(user.username) localStorage.setItem("minegram_username",String(user.username));
    if(user.email) localStorage.setItem("minegram_email",String(user.email));
  }

  const profile=data?.profile || data?.data?.profile || null;
  if(profile) localStorage.setItem("minegram_profile",JSON.stringify(profile));

  return !!localStorage.getItem("minegram_token");
}

async function loginFallback(loginIdentifier,password){
  const id=first(
    loginIdentifier,
    email,
    identifier,
    params.get("username"),
    sessionStorage.getItem("minegram_recovery_identifier"),
    sessionStorage.getItem("minegram_recovery_username"),
    sessionStorage.getItem("minegram_reset_username"),
    sessionStorage.getItem("minegram_recovery_email"),
    localStorage.getItem("minegram_email")
  );

  if(!id) throw new Error("Otomatik giriş için hesap bilgisi bulunamadı.");

  let response=null;
  for(let attempt=1;attempt<=3;attempt++){
    try{
      response=await fetch(API+"/login",{
        method:"POST",
        headers:{"Content-Type":"application/json","Accept":"application/json"},
        body:JSON.stringify({
          identifier:id,
          username:id,
          email:id,
          password
        }),
        cache:"no-store",
        credentials:"same-origin"
      });
      break;
    }catch(networkError){
      console.warn("[MINEGRAM AUTO LOGIN RETRY]",attempt,networkError);
      if(attempt<3) await new Promise(r=>setTimeout(r,1500*attempt));
    }
  }

  if(!response) throw new Error("Otomatik giriş için sunucuya bağlanılamadı.");

  const raw=await response.text();
  let data={};
  try{data=raw?JSON.parse(raw):{}}catch{data={}}

  if(!response.ok || data?.ok===false){
    throw new Error(data?.error || data?.message || "Yeni şifreyle otomatik giriş yapılamadı.");
  }

  if(!saveSession(data)){
    throw new Error("Giriş yapıldı fakat oturum tokenı alınamadı.");
  }

  return true;
}

async function resetPassword(){
  const password=String(passwordInput.value||"");
  const confirmPassword=String(confirmInput.value||"");
  showMessage("");
  if(!resetToken){showMessage("Şifre sıfırlama oturumu bulunamadı. Lütfen işlemi yeniden başlat.");return}
  if(password.length<6){showMessage("Yeni şifre en az 6 karakter olmalı.");passwordInput.focus();return}
  if(password!==confirmPassword){showMessage("Şifreler eşleşmiyor.");confirmInput.focus();return}

  continueButton.disabled=true;
  continueButton.textContent="Değiştiriliyor...";
  showMessage("Şifren değiştiriliyor...");

  try{
    const data=await api("/api/forgot/reset-password",{
      method:"POST",
      body:JSON.stringify({
        resetToken,
        reset_token:resetToken,
        token:resetToken,
        recoveryToken:resetToken,
        password,
        newPassword:password,
        confirmPassword
      })
    });

    // 1) Şifre değiştirme cevabı doğrudan oturum verdiyse onu kullan.
    let loggedIn=saveSession(data);

    // 2) Oturum tokenı dönmediyse, Giriş HTML'sindeki /api/login ile
    //    yeni şifreyi kullanarak aynı hesapta otomatik giriş yap.
    if(!loggedIn){
      showMessage("Şifre değiştirildi. Hesabın açılıyor...",true);
      const resetEmail = first(
        data?.email,
        data?.user?.email,
        data?.profile?.email,
        data?.data?.user?.email,
        email,
        identifier
      );
      const resetUsername = first(
        data?.user?.username,
        data?.profile?.username,
        data?.data?.user?.username,
        params.get("username"),
        sessionStorage.getItem("minegram_recovery_username"),
        sessionStorage.getItem("minegram_reset_username")
      );
      loggedIn=await loginFallback(resetEmail || resetUsername,password);
    }

    if(!loggedIn){
      throw new Error("Şifre değişti ancak otomatik giriş yapılamadı.");
    }

    showMessage("Şifren başarıyla değiştirildi. Hesabın açılıyor...",true);

    // Reset bilgilerini yalnızca oturum başarıyla oluşturulduktan sonra temizle.
    for(const key of [
      "minegram_password_reset_token","minegram_reset_token","resetToken",
      "minegram_recovery_id","recoveryId","recovery_id",
      "minegram_recovery_identifier","minegram_recovery_username",
      "minegram_recovery_mode","minegram_recovery_email","minegram_reset_email",
      "minegram_reset_username"
    ]){
      sessionStorage.removeItem(key);
      localStorage.removeItem(key);
    }

    setTimeout(()=>location.replace("index.html"),500);

  }catch(error){
    console.error("[MINEGRAM RESET PASSWORD]",error);
    showMessage(error?.message||"Şifre değiştirilemedi. Lütfen tekrar dene.");
    continueButton.disabled=false;
    continueButton.textContent="Şifreyi değiştir";
  }
}

backButton.addEventListener("click",()=>{location.href="sifremi-unuttum-dogrulama.html"});
continueButton.addEventListener("click",resetPassword);
confirmInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();resetPassword()}});
if(!resetToken){showMessage("Şifre sıfırlama oturumu bulunamadı. Lütfen işlemi yeniden başlat.");continueButton.disabled=true}else{passwordInput.focus()}
</script>
</body>
</html>
