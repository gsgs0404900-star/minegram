<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Yeni şifre - Minegram</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
}

button,input{
    font-family:inherit;
}

.page{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    background:#000;
    padding:max(18px,env(safe-area-inset-top)) 0 calc(28px + env(safe-area-inset-bottom));
}

.header{
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:25px;
    height:35px;
    border:0;
    background:transparent;
    color:#fff;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.back svg{
    width:25px;
    height:35px;
    stroke:currentColor;
    stroke-width:3;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.header-title{
    margin-left:15px;
    font-size:20px;
    line-height:1;
    font-weight:700;
    letter-spacing:-.3px;
}

.content{
    width:317px;
    margin:115px auto 0;
}

h1{
    margin:0 0 34px;
    font-size:30px;
    line-height:1.15;
    font-weight:700;
    letter-spacing:-.5px;
}

.subtitle{
    margin:0 0 38px;
    color:#bdbdbd;
    font-size:18px;
    line-height:1.45;
}

.form{
    width:100%;
    display:flex;
    flex-direction:column;
}

.label{
    margin-bottom:9px;
    color:#fff;
    font-size:13px;
    font-weight:700;
}

.input{
    width:100%;
    height:48px;
    padding:0 14px;
    border:1px solid #252525;
    border-radius:9px;
    background:#050505;
    color:#fff;
    outline:none;
    font-size:15px;
    transition:.15s;
}

.input:focus{
    border-color:#2677b5;
}

.field{
    margin-bottom:18px;
}

.password-wrap{
    position:relative;
}

.password-wrap .input{
    padding-right:48px;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#999;
    cursor:pointer;
    font-size:12px;
}

.main-button{
    width:100%;
    height:48px;
    border:0;
    border-radius:24px;
    background:#2677b5;
    color:#000;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
    margin-top:4px;
}

.main-button:hover{
    opacity:.92;
}

.main-button:active{
    transform:scale(.99);
}

.main-button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.status{
    display:none;
    min-height:18px;
    margin-top:14px;
    font-size:12px;
    line-height:1.4;
}

.status.show{
    display:block;
}

.status.error{
    color:#ff5c5c;
}

.status.success{
    color:#63e6be;
}

.email-box{
    width:100%;
    min-height:48px;
    padding:13px 14px;
    margin-bottom:22px;
    border:1px solid #252525;
    border-radius:9px;
    background:#050505;
    color:#bdbdbd;
    font-size:13px;
    line-height:1.4;
    word-break:break-word;
}

@media(max-width:600px){

    .page{
        padding-left:28px;
        padding-right:28px;
    }

    .header{
        height:70px;
        padding-left:0;
    }

    .back{
        width:30px;
        height:38px;
    }

    .back svg{
        width:30px;
        height:38px;
    }

    .header-title{
        margin-left:15px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 120px);
        max-width:714px;
        margin:105px auto 0;
    }

    h1{
        margin-bottom:30px;
        font-size:42px;
    }

    .subtitle{
        margin-bottom:36px;
        font-size:21px;
        line-height:1.5;
    }

    .label{
        font-size:15px;
        margin-bottom:10px;
    }

    .input{
        height:58px;
        border:2px solid #252525;
        border-radius:9px;
        font-size:18px;
    }

    .main-button{
        height:58px;
        border-radius:32px;
        font-size:20px;
    }

    .status{
        font-size:14px;
    }

    .email-box{
        border:2px solid #252525;
        font-size:15px;
    }
}

@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        margin-top:65px;
    }

    h1{
        font-size:38px;
    }

    .subtitle{
        font-size:20px;
    }

    .input{
        height:55px;
    }

    .main-button{
        height:55px;
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="page">

<header class="header">

<button
    class="back"
    type="button"
    onclick="goBack()"
    aria-label="Geri"
>
<svg viewBox="0 0 32 32">
<path d="M20 5 L9 16 L20 27"></path>
<path d="M10 16 H27"></path>
</svg>
</button>

<div class="header-title">
Yeni şifre
</div>

</header>

<main class="content">

<h1>
Yeni şifreni oluştur
</h1>

<div class="subtitle">
Hesabını doğruladın. Şimdi yeni şifreni oluşturabilirsin.
</div>

<div
    class="email-box"
    id="emailBox"
>
Şifre sıfırlama oturumu doğrulandı.
</div>

<form
    class="form"
    id="resetForm"
>

<div class="field">

<div class="label">
Yeni şifre
</div>

<div class="password-wrap">

<input
    class="input"
    id="password"
    type="password"
    autocomplete="new-password"
    placeholder="Yeni şifren"
>

<button
    type="button"
    class="show-password"
    onclick="togglePassword('password',this)"
>
Göster
</button>

</div>

</div>

<div class="field">

<div class="label">
Yeni şifre tekrar
</div>

<div class="password-wrap">

<input
    class="input"
    id="confirmPassword"
    type="password"
    autocomplete="new-password"
    placeholder="Yeni şifreni tekrar yaz"
>

<button
    type="button"
    class="show-password"
    onclick="togglePassword('confirmPassword',this)"
>
Göster
</button>

</div>

</div>

<button
    class="main-button"
    id="submitButton"
    type="submit"
>
Şifreyi değiştir
</button>

<div
    class="status"
    id="status"
></div>

</form>

</main>

</div>

<script>
"use strict";

/*
=========================================================
 MINEGRAM - YENİ ŞİFRE

 ESKİ AKIŞ:

 Şifre değiştir
       ↓
 /api/forgot/reset-password
       ↓
 /api/login
       ↓
 HATA
       ↓
 index.html'e GİDEMİYOR

 YENİ AKIŞ:

 Şifre değiştir
       ↓
 /api/forgot/reset-password
       ↓
 BAŞARILI
       ↓
 TOKEN VARSA KAYDET
       ↓
 RESET BİLGİLERİNİ TEMİZLE
       ↓
 /index.html

 ÖNEMLİ:
 /api/login ARTIK ÇAĞRILMIYOR.
=========================================================
*/


/* =========================================================
   API
========================================================= */

const API =
    "https://minegram-hwns.onrender.com/api";


/* =========================================================
   URL PARAMETRELERİ
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


/* =========================================================
   RESET TOKEN
========================================================= */

let resetToken =
    (
        params.get("token") ||
        params.get("resetToken") ||
        params.get("reset_token") ||
        params.get("recoveryToken") ||

        sessionStorage.getItem(
            "minegram_password_reset_token"
        ) ||

        sessionStorage.getItem(
            "minegram_reset_token"
        ) ||

        sessionStorage.getItem(
            "resetToken"
        ) ||

        localStorage.getItem(
            "minegram_password_reset_token"
        ) ||

        localStorage.getItem(
            "minegram_reset_token"
        ) ||

        ""
    ).trim();


/* =========================================================
   E-POSTA
========================================================= */

let email =
    (
        params.get("email") ||

        sessionStorage.getItem(
            "minegram_recovery_email"
        ) ||

        localStorage.getItem(
            "minegram_recovery_email"
        ) ||

        ""
    )
    .trim()
    .toLowerCase();


/* =========================================================
   IDENTIFIER
========================================================= */

let recoveryIdentifier =
    (
        params.get("identifier") ||

        params.get("username") ||

        sessionStorage.getItem(
            "minegram_recovery_identifier"
        ) ||

        localStorage.getItem(
            "minegram_recovery_identifier"
        ) ||

        sessionStorage.getItem(
            "minegram_recovery_username"
        ) ||

        localStorage.getItem(
            "minegram_recovery_username"
        ) ||

        email ||

        ""
    ).trim();


/* =========================================================
   ELEMENTLER
========================================================= */

const passwordInput =
    document.getElementById(
        "password"
    );

const confirmInput =
    document.getElementById(
        "confirmPassword"
    );

const submitButton =
    document.getElementById(
        "submitButton"
    );

const status =
    document.getElementById(
        "status"
    );

const emailBox =
    document.getElementById(
        "emailBox"
    );


/* =========================================================
   GERİ
========================================================= */

function goBack(){

    if(history.length > 1){

        history.back();

    }else{

        window.location.href =
            "giris.html";

    }

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    text,
    type=""
){

    status.className =
        "status";

    status.textContent =
        text || "";

    if(text){

        status.classList.add(
            "show"
        );

        if(type){

            status.classList.add(
                type
            );

        }

    }

}


/* =========================================================
   ŞİFRE GÖSTER / GİZLE
========================================================= */

function togglePassword(
    id,
    button
){

    const input =
        document.getElementById(
            id
        );

    if(
        input.type ===
        "password"
    ){

        input.type =
            "text";

        button.textContent =
            "Gizle";

    }else{

        input.type =
            "password";

        button.textContent =
            "Göster";

    }

}


/* =========================================================
   EMAIL KUTUSU
========================================================= */

function updateEmailBox(){

    if(email){

        emailBox.textContent =
            "Hesabın doğrulandı: " +
            email;

    }else if(recoveryIdentifier){

        emailBox.textContent =
            "Hesabın doğrulandı: " +
            recoveryIdentifier;

    }else{

        emailBox.textContent =
            "Hesabın doğrulandı. Yeni şifreni oluşturabilirsin.";

    }

}


/* =========================================================
   TOKEN BUL
   RESET CEVABINDA TOKEN FARKLI FORMATTA OLABİLİR
========================================================= */

function extractToken(data){

    if(!data){

        return "";

    }

    const candidates = [

        data.access_token,
        data.accessToken,
        data.token,
        data.supabaseAccessToken,

        data.session?.access_token,
        data.session?.accessToken,
        data.session?.token,

        data.data?.access_token,
        data.data?.accessToken,
        data.data?.token,

        data.data?.session?.access_token,
        data.data?.session?.accessToken,
        data.data?.session?.token,

        data.auth?.access_token,
        data.auth?.accessToken,
        data.auth?.token,

        data.data?.auth?.access_token,
        data.data?.auth?.accessToken,
        data.data?.auth?.token

    ];

    for(
        const value
        of candidates
    ){

        if(
            value &&
            typeof value === "string" &&
            value.trim() &&
            value !== "null" &&
            value !== "undefined"
        ){

            return value.trim();

        }

    }

    return "";

}


/* =========================================================
   USER BUL
========================================================= */

function extractUser(data){

    if(!data){

        return null;

    }

    return (

        data.user ||

        data.profile ||

        data.account ||

        data.data?.user ||

        data.data?.profile ||

        data.data?.account ||

        (
            Array.isArray(
                data.profiles
            )
                ? data.profiles[0]
                : null
        ) ||

        (
            Array.isArray(
                data.data?.profiles
            )
                ? data.data.profiles[0]
                : null
        ) ||

        null

    );

}


/* =========================================================
   PROFILE BUL
========================================================= */

function extractProfile(data){

    if(!data){

        return null;

    }

    return (

        data.profile ||

        data.data?.profile ||

        (
            Array.isArray(
                data.profiles
            )
                ? data.profiles[0]
                : null
        ) ||

        (
            Array.isArray(
                data.data?.profiles
            )
                ? data.data.profiles[0]
                : null
        ) ||

        null

    );

}


/* =========================================================
   REFRESH TOKEN
========================================================= */

function extractRefreshToken(data){

    return (

        data?.refresh_token ||

        data?.refreshToken ||

        data?.session?.refresh_token ||

        data?.data?.refresh_token ||

        data?.data?.refreshToken ||

        data?.data?.session?.refresh_token ||

        ""

    );

}


/* =========================================================
   RESET CEVABINDAN OTURUM KAYDET
========================================================= */

function saveResetSession(
    data
){

    const token =
        extractToken(
            data
        );

    const user =
        extractUser(
            data
        );

    const profile =
        extractProfile(
            data
        );

    const refreshToken =
        extractRefreshToken(
            data
        );


    /*
    TOKEN VARSA KAYDET.

    Reset endpoint token döndürmüyorsa
    burada hata vermiyoruz.
    */

    if(token){

        localStorage.setItem(
            "minegram_token",
            token
        );

        localStorage.setItem(
            "minegram_supabase_token",
            token
        );

        localStorage.setItem(
            "minegram_access_token",
            token
        );

        localStorage.setItem(
            "access_token",
            token
        );

    }


    if(refreshToken){

        localStorage.setItem(
            "minegram_refresh_token",
            String(
                refreshToken
            )
        );

    }


    /*
    USER
    */

    if(user){

        localStorage.setItem(
            "minegram_user",
            JSON.stringify(
                user
            )
        );


        if(
            user.id != null
        ){

            localStorage.setItem(
                "minegram_user_id",
                String(
                    user.id
                )
            );

        }


        if(user.username){

            localStorage.setItem(
                "minegram_username",
                String(
                    user.username
                )
            );

        }


        if(user.email){

            localStorage.setItem(
                "minegram_email",
                String(
                    user.email
                )
            );

        }

    }


    /*
    PROFILE
    */

    if(profile){

        localStorage.setItem(
            "minegram_profile",
            JSON.stringify(
                profile
            )
        );

    }


    /*
    RESET CEVABINDAN GELEN
    USERNAME / EMAIL
    */

    const finalUsername =
        user?.username ||

        profile?.username ||

        data?.username ||

        data?.data?.username ||

        recoveryIdentifier ||

        "";


    const finalEmail =
        user?.email ||

        profile?.email ||

        data?.email ||

        data?.data?.email ||

        email ||

        "";


    if(finalUsername){

        localStorage.setItem(
            "minegram_username",
            String(
                finalUsername
            )
        );

    }


    if(finalEmail){

        localStorage.setItem(
            "minegram_email",
            String(
                finalEmail
            )
        );

    }


    /*
    USER YOKSA EN AZINDAN RECOVERY
    BİLGİLERİNİ KAYDET.
    */

    if(
        !localStorage.getItem(
            "minegram_username"
        ) &&
        recoveryIdentifier &&
        !recoveryIdentifier.includes("@")
    ){

        localStorage.setItem(
            "minegram_username",
            recoveryIdentifier
        );

    }


    if(
        !localStorage.getItem(
            "minegram_email"
        ) &&
        email
    ){

        localStorage.setItem(
            "minegram_email",
            email
        );

    }


    console.log(
        "[MINEGRAM RESET] Reset cevabı işlendi."
    );

    console.log(
        "[MINEGRAM RESET] Token var:",
        !!token
    );

}


/* =========================================================
   RESET BİLGİLERİNİ TEMİZLE
========================================================= */

function clearResetData(){

    const resetKeys = [

        "minegram_password_reset_token",

        "minegram_reset_token",

        "resetToken",

        "minegram_recovery_id",

        "recoveryId",

        "recovery_id",

        "minegram_recovery_identifier",

        "minegram_recovery_username",

        "minegram_recovery_mode",

        "minegram_recovery_email"

    ];


    for(
        const key
        of resetKeys
    ){

        sessionStorage.removeItem(
            key
        );

        localStorage.removeItem(
            key
        );

    }

}


/* =========================================================
   INDEX'E GİT
========================================================= */

function openIndex(){

    /*
    Burada LOGIN ÇAĞRISI YOK.

    Şifre değişikliği zaten başarılı oldu.
    */

    console.log(
        "[MINEGRAM RESET] index.html açılıyor."
    );


    submitButton.textContent =
        "Minegram açılıyor...";


    /*
    Absolute URL yerine mevcut site
    kökünden index.html.
    */

    window.location.replace(
        "/index.html"
    );

}


/* =========================================================
   INPUT TEMİZLEME
========================================================= */

passwordInput.addEventListener(
    "input",
    function(){

        showStatus("");

    }
);


confirmInput.addEventListener(
    "input",
    function(){

        showStatus("");

    }
);


/* =========================================================
   RESET PASSWORD
========================================================= */

document
.getElementById(
    "resetForm"
)
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        showStatus("");


        const password =
            passwordInput.value;


        const confirmPassword =
            confirmInput.value;


        /* ================================================
           TOKEN KONTROLÜ
        ================================================ */

        if(!resetToken){

            showStatus(
                "Şifre sıfırlama oturumu bulunamadı. Lütfen işlemi yeniden başlat.",
                "error"
            );

            return;

        }


        /* ================================================
           ŞİFRE KONTROLÜ
        ================================================ */

        if(
            password.length < 6
        ){

            showStatus(
                "Yeni şifre en az 6 karakter olmalı.",
                "error"
            );

            passwordInput.focus();

            return;

        }


        if(
            password !==
            confirmPassword
        ){

            showStatus(
                "Şifreler aynı değil.",
                "error"
            );

            confirmInput.focus();

            return;

        }


        /* ================================================
           BUTON
        ================================================ */

        submitButton.disabled =
            true;

        submitButton.textContent =
            "Şifre değiştiriliyor...";


        try{

            /* ============================================
               ŞİFREYİ DEĞİŞTİR
            ============================================ */

            const response =
                await fetch(
                    API +
                    "/forgot/reset-password",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                resetToken:
                                    resetToken,

                                reset_token:
                                    resetToken,

                                token:
                                    resetToken,

                                recoveryToken:
                                    resetToken,

                                password:
                                    password,

                                newPassword:
                                    password,

                                confirmPassword:
                                    confirmPassword

                            }),

                        cache:
                            "no-store",

                        credentials:
                            "include"

                    }
                );


            /* ============================================
               CEVAP
            ============================================ */

            const raw =
                await response.text();


            let data = {};


            try{

                data =
                    raw
                        ? JSON.parse(raw)
                        : {};

            }catch(error){

                console.error(
                    "[MINEGRAM RESET JSON ERROR]",
                    error
                );

                data = {};

            }


            console.log(
                "[MINEGRAM RESET STATUS]",
                response.status
            );


            console.log(
                "[MINEGRAM RESET RESPONSE]",
                data
            );


            /* ============================================
               HATA
            ============================================ */

            if(
                !response.ok ||
                data.ok === false
            ){

                throw new Error(

                    data.error ||

                    data.message ||

                    "Şifre değiştirilemedi."

                );

            }


            /* ============================================
               BAŞARILI
            ============================================ */

            console.log(
                "[MINEGRAM RESET] Şifre başarıyla değiştirildi."
            );


            /*
            Reset cevabında token/user/profile varsa
            kaydet.
            */

            saveResetSession(
                data
            );


            /* ============================================
               RESET VERİLERİNİ TEMİZLE
            ============================================ */

            clearResetData();


            /* ============================================
               BAŞARI MESAJI
            ============================================ */

            showStatus(
                "Şifre başarıyla değiştirildi. Minegram açılıyor...",
                "success"
            );


            submitButton.textContent =
                "Minegram açılıyor...";


            /* ============================================
               INDEX.HTML

               ARTIK /api/login YOK.
            ============================================ */

            setTimeout(
                function(){

                    openIndex();

                },
                500
            );


        }catch(error){

            console.error(
                "[MINEGRAM RESET PASSWORD]",
                error
            );


            showStatus(
                error?.message ||
                "Şifre değiştirilemedi.",
                "error"
            );


            submitButton.disabled =
                false;


            submitButton.textContent =
                "Şifreyi değiştir";

        }

    }
);


/* =========================================================
   SAYFA AÇILIŞI
========================================================= */

updateEmailBox();


if(!resetToken){

    showStatus(
        "Şifre sıfırlama anahtarı bulunamadı. Lütfen şifre sıfırlama işlemini baştan başlat.",
        "error"
    );

}


console.log(
    "[MINEGRAM] Yeni şifre sayfası hazır."
);

console.log(
    "[MINEGRAM] API:",
    API
);

console.log(
    "[MINEGRAM] Recovery email:",
    email
);

console.log(
