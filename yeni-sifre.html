<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Yeni şifre - Minegram</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
}

button,input{
    font-family:inherit;
}

.page{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    background:#000;
    padding:max(18px,env(safe-area-inset-top)) 0 calc(28px + env(safe-area-inset-bottom));
}

.header{
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:25px;
    height:35px;
    border:0;
    background:transparent;
    color:#fff;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.back svg{
    width:25px;
    height:35px;
    stroke:currentColor;
    stroke-width:3;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.header-title{
    margin-left:15px;
    font-size:20px;
    line-height:1;
    font-weight:700;
    letter-spacing:-.3px;
}

.content{
    width:317px;
    margin:115px auto 0;
}

h1{
    margin:0 0 34px;
    font-size:30px;
    line-height:1.15;
    font-weight:700;
    letter-spacing:-.5px;
}

.subtitle{
    margin:0 0 38px;
    color:#bdbdbd;
    font-size:18px;
    line-height:1.45;
}

.form{
    width:100%;
    display:flex;
    flex-direction:column;
}

.label{
    margin-bottom:9px;
    color:#fff;
    font-size:13px;
    font-weight:700;
}

.input{
    width:100%;
    height:48px;
    padding:0 14px;
    border:1px solid #252525;
    border-radius:9px;
    background:#050505;
    color:#fff;
    outline:none;
    font-size:15px;
    transition:.15s;
}

.input:focus{
    border-color:#2677b5;
}

.code{
    letter-spacing:8px;
    text-align:center;
    font-size:20px;
    font-weight:700;
}

.field{
    margin-bottom:18px;
}

.password-wrap{
    position:relative;
}

.password-wrap .input{
    padding-right:48px;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#999;
    cursor:pointer;
    font-size:12px;
}

.main-button{
    width:100%;
    height:48px;
    border:0;
    border-radius:24px;
    background:#2677b5;
    color:#000;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
    margin-top:4px;
}

.main-button:hover{
    opacity:.92;
}

.main-button:active{
    transform:scale(.99);
}

.main-button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.resend{
    width:100%;
    border:0;
    background:transparent;
    color:#2677b5;
    font-size:13px;
    font-weight:700;
    margin-top:18px;
    cursor:pointer;
}

.resend:disabled{
    color:#666;
    cursor:not-allowed;
}

.status{
    display:none;
    min-height:18px;
    margin-top:14px;
    font-size:12px;
    line-height:1.4;
}

.status.show{
    display:block;
}

.status.error{
    color:#ff5c5c;
}

.status.success{
    color:#63e6be;
}

.email-box{
    width:100%;
    min-height:48px;
    padding:13px 14px;
    margin-bottom:22px;
    border:1px solid #252525;
    border-radius:9px;
    background:#050505;
    color:#bdbdbd;
    font-size:13px;
    line-height:1.4;
    word-break:break-word;
}

@media(max-width:600px){

    .page{
        padding-left:28px;
        padding-right:28px;
    }

    .header{
        height:70px;
        padding-left:0;
    }

    .back{
        width:30px;
        height:38px;
    }

    .back svg{
        width:30px;
        height:38px;
    }

    .header-title{
        margin-left:15px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 120px);
        max-width:714px;
        margin:105px auto 0;
    }

    h1{
        margin-bottom:30px;
        font-size:42px;
    }

    .subtitle{
        margin-bottom:36px;
        font-size:21px;
        line-height:1.5;
    }

    .label{
        font-size:15px;
        margin-bottom:10px;
    }

    .input{
        height:58px;
        border:2px solid #252525;
        border-radius:9px;
        font-size:18px;
    }

    .code{
        font-size:23px;
        letter-spacing:10px;
    }

    .main-button{
        height:58px;
        border-radius:32px;
        font-size:20px;
    }

    .resend{
        font-size:15px;
        margin-top:20px;
    }

    .status{
        font-size:14px;
    }

    .email-box{
        border:2px solid #252525;
        font-size:15px;
    }
}

@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        margin-top:65px;
    }

    h1{
        font-size:38px;
    }

    .subtitle{
        font-size:20px;
    }

    .input{
        height:55px;
    }

    .main-button{
        height:55px;
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="page">

<header class="header">

<button class="back" type="button" onclick="goBack()" aria-label="Geri">
<svg viewBox="0 0 32 32">
<path d="M20 5 L9 16 L20 27"></path>
<path d="M10 16 H27"></path>
</svg>
</button>

<div class="header-title">Yeni şifre</div>

</header>

<main class="content">

<h1>Yeni şifreni oluştur</h1>

<div class="subtitle">
E-posta adresine gönderdiğimiz 6 haneli doğrulama kodunu gir ve yeni şifreni oluştur.
</div>

<div class="email-box" id="emailBox">
Doğrulama kodu e-posta adresine gönderildi.
</div>

<form class="form" id="resetForm">

<div class="field">

<div class="label">
6 haneli doğrulama kodu
</div>

<input
class="input code"
id="code"
type="text"
inputmode="numeric"
autocomplete="one-time-code"
maxlength="6"
placeholder="000000"
>

</div>

<div class="field">

<div class="label">
Yeni şifre
</div>

<div class="password-wrap">

<input
class="input"
id="password"
type="password"
autocomplete="new-password"
placeholder="Yeni şifren"
>

<button
type="button"
class="show-password"
onclick="togglePassword('password',this)"
>
Göster
</button>

</div>

</div>

<div class="field">

<div class="label">
Yeni şifre tekrar
</div>

<div class="password-wrap">

<input
class="input"
id="confirmPassword"
type="password"
autocomplete="new-password"
placeholder="Yeni şifreni tekrar yaz"
>

<button
type="button"
class="show-password"
onclick="togglePassword('confirmPassword',this)"
>
Göster
</button>

</div>

</div>

<button
class="main-button"
id="submitButton"
type="submit"
>
Şifreyi değiştir
</button>

<button
class="resend"
id="resendButton"
type="button"
onclick="resendCode()"
>
Kodu yeniden gönder
</button>

<div class="status" id="status"></div>

</form>

</main>
</div>

<script>
"use strict";

const API="/api";

const params=
    new URLSearchParams(
        window.location.search
    );

let recoveryId=(
    params.get("recoveryId") ||
    params.get("recovery_id") ||
    sessionStorage.getItem("minegram_recovery_id") ||
    sessionStorage.getItem("recoveryId") ||
    sessionStorage.getItem("recovery_id") ||
    ""
).trim();

let identifier=(
    params.get("identifier") ||
    params.get("username") ||
    sessionStorage.getItem("minegram_recovery_identifier") ||
    sessionStorage.getItem("minegram_recovery_username") ||
    ""
).trim()
.replace(/^@/,"")
.toLowerCase();

let email=(
    params.get("email") ||
    sessionStorage.getItem("minegram_recovery_email") ||
    ""
).trim()
.toLowerCase();

const codeInput=
    document.getElementById("code");

const passwordInput=
    document.getElementById("password");

const confirmInput=
    document.getElementById("confirmPassword");

const submitButton=
    document.getElementById("submitButton");

const resendButton=
    document.getElementById("resendButton");

const status=
    document.getElementById("status");

const emailBox=
    document.getElementById("emailBox");

function goBack(){

    if(history.length>1){

        history.back();

    }else{

        window.location.href=
            "hesaplarini-bulduk.html";
    }
}

function showStatus(
    text,
    type=""
){

    status.className="status";

    status.textContent=text || "";

    if(text){

        status.classList.add("show");

        if(type){
            status.classList.add(type);
        }
    }
}

function togglePassword(
    id,
    button
){

    const input=
        document.getElementById(id);

    if(input.type==="password"){

        input.type="text";

        button.textContent=
            "Gizle";

    }else{

        input.type="password";

        button.textContent=
            "Göster";
    }
}

function updateEmailBox(){

    if(email){

        emailBox.textContent=
            "Doğrulama kodu şu e-posta adresine gönderildi: "+
            email;

    }else{

        emailBox.textContent=
            "Doğrulama kodu kayıtlı e-posta adresine gönderildi.";
    }
}

codeInput.addEventListener(
    "input",
    ()=>{
        codeInput.value=
            codeInput.value
            .replace(/\D/g,"")
            .slice(0,6);

        showStatus("");
    }
);

passwordInput.addEventListener(
    "input",
    ()=>{
        showStatus("");
    }
);

confirmInput.addEventListener(
    "input",
    ()=>{
        showStatus("");
    }
);

document
.getElementById("resetForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        showStatus("");

        const code=
            codeInput.value.trim();

        const password=
            passwordInput.value;

        const confirmPassword=
            confirmInput.value;

        if(!recoveryId){

            showStatus(
                "Şifre sıfırlama oturumu bulunamadı. Lütfen işlemi baştan başlat.",
                "error"
            );

            return;
        }

        if(!/^\d{6}$/.test(code)){

            showStatus(
                "6 haneli doğrulama kodunu gir.",
                "error"
            );

            codeInput.focus();

            return;
        }

        if(password.length<6){

            showStatus(
                "Yeni şifre en az 6 karakter olmalı.",
                "error"
            );

            passwordInput.focus();

            return;
        }

        if(password!==confirmPassword){

            showStatus(
                "Şifreler aynı değil.",
                "error"
            );

            confirmInput.focus();

            return;
        }

        submitButton.disabled=true;

        submitButton.textContent=
            "Şifre değiştiriliyor...";

        try{

            const response=
                await fetch(
                    API+"/forgot/reset-password",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body:JSON.stringify({

                            recoveryId:
                                recoveryId,

                            recovery_id:
                                recoveryId,

                            code:
                                code,

                            identifier:
                                identifier,

                            email:
                                email,

                            password:
                                password,

                            newPassword:
                                password,

                            confirmPassword:
                                confirmPassword
                        }),

                        cache:"no-store"
                    }
                );

            const data=
                await response
                .json()
                .catch(()=>({}));

            if(
                !response.ok ||
                data.ok===false
            ){

                throw new Error(
                    data.error ||
                    data.message ||
                    "Şifre değiştirilemedi."
                );
            }

            showStatus(
                "Şifren başarıyla değiştirildi. Giriş sayfasına yönlendiriliyorsun...",
                "success"
            );

            sessionStorage.removeItem(
                "minegram_recovery_id"
            );

            sessionStorage.removeItem(
                "recoveryId"
            );

            sessionStorage.removeItem(
                "recovery_id"
            );

            sessionStorage.removeItem(
                "minegram_recovery_identifier"
            );

            sessionStorage.removeItem(
                "minegram_recovery_username"
            );

            sessionStorage.removeItem(
                "minegram_recovery_mode"
            );

            sessionStorage.removeItem(
                "minegram_recovery_email"
            );

            setTimeout(
                ()=>{
                    window.location.href=
                        "giris.html";
                },
                1200
            );

        }catch(error){

            console.error(
                "[MINEGRAM RESET PASSWORD]",
                error
            );

            showStatus(
                error.message ||
                "Şifre değiştirilemedi.",
                "error"
            );

            submitButton.disabled=false;

            submitButton.textContent=
                "Şifreyi değiştir";
        }
    }
);

let resendLocked=false;

async function resendCode(){

    if(resendLocked){
        return;
    }

    if(!identifier){

        showStatus(
            "Hesap bilgisi bulunamadı. Lütfen işlemi baştan başlat.",
            "error"
        );

        return;
    }

    resendLocked=true;

    resendButton.disabled=true;

    let seconds=60;

    resendButton.textContent=
        "Tekrar gönder ("+
        seconds+
        ")";

    const timer=setInterval(
        ()=>{
            seconds--;

            if(seconds<=0){

                clearInterval(timer);

                resendLocked=false;

                resendButton.disabled=false;

                resendButton.textContent=
                    "Kodu yeniden gönder";

            }else{

                resendButton.textContent=
                    "Tekrar gönder ("+
                    seconds+
                    ")";
            }
        },
        1000
    );

    try{

        const response=
            await fetch(
                API+"/forgot/resend",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({

                        identifier:
                            identifier,

                        mode:"username",

                        email:
                            email
                    }),

                    cache:"no-store"
                }
            );

        const data=
            await response
            .json()
            .catch(()=>({}));

        if(
            !response.ok ||
            data.ok===false
        ){

            throw new Error(
                data.error ||
                data.message ||
                "Yeni kod gönderilemedi."
            );
        }

        const newRecoveryId=
            String(
                data.recoveryId ||
                data.recovery_id ||
                ""
            ).trim();

        if(newRecoveryId){

            recoveryId=
                newRecoveryId;

            sessionStorage.setItem(
                "minegram_recovery_id",
                recoveryId
            );

            sessionStorage.setItem(
                "recoveryId",
                recoveryId
            );

            sessionStorage.setItem(
                "recovery_id",
                recoveryId
            );

            const url=
                new URL(
                    window.location.href
                );

            url.searchParams.set(
                "recoveryId",
                recoveryId
            );

            window.history.replaceState(
                {},
                "",
                url.toString()
            );
        }

        if(data.email){

            email=
                String(data.email)
                .trim()
                .toLowerCase();

            sessionStorage.setItem(
                "minegram_recovery_email",
                email
            );

            updateEmailBox();
        }

        showStatus(
            "Yeni doğrulama kodu gönderildi.",
            "success"
        );

    }catch(error){

        console.error(
            "[MINEGRAM RESEND]",
            error
        );

        showStatus(
            error.message ||
            "Yeni kod gönderilemedi.",
            "error"
        );

        clearInterval(timer);

        resendLocked=false;

        resendButton.disabled=false;

        resendButton.textContent=
            "Kodu yeniden gönder";
    }
}

updateEmailBox();

if(!recoveryId){

    showStatus(
        "Şifre sıfırlama oturumu bulunamadı. Lütfen işlemi baştan başlat.",
        "error"
    );
}
</script>

</body>
</html>
