<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Yeni şifre - Minegram</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;overflow-x:hidden}.page{width:100%;min-height:100vh;background:#000}
.topbar{width:100%;height:60px;display:flex;align-items:center;padding-left:38px}.back{width:25px;height:35px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:300;cursor:pointer}.top-title{margin-left:15px;font-size:20px;font-weight:700}
.content{width:317px;margin:115px auto 0}.title{text-align:center;font-size:30px;line-height:1.15;font-weight:700;margin:0 0 34px}.description{font-size:18px;line-height:1.45;color:#bdbdbd;margin:0 0 40px}
.input{display:block;width:100%;height:39px;padding:0 10px;margin-top:12px;border:1px solid #252525;border-radius:6px;background:#050505;color:#fff;outline:none;font-size:12px}.input::placeholder{color:#777}.input:focus{border-color:#555}
.continue-btn{display:block;width:100%;height:37px;margin-top:18px;border:0;border-radius:22px;background:#2677b5;color:#000;font-size:12px;font-weight:700;cursor:pointer}.continue-btn:disabled{opacity:.6;cursor:not-allowed}
.message{min-height:18px;margin-top:12px;text-align:center;font-size:11px;line-height:1.4;color:#ff5c5c}.message.success{color:#55b8ff}
@media(max-width:600px){.topbar{height:70px;padding-left:28px}.back{width:30px;height:38px;font-size:38px}.top-title{margin-left:12px;font-size:21px}.content{width:calc(100% - 40px);max-width:714px;margin:105px auto 0}.title{font-size:42px}.description{font-size:21px;line-height:1.5;margin-bottom:30px}.input{height:68px;padding:0 20px;font-size:18px;border:2px solid #686868;border-radius:9px}.continue-btn{height:58px;font-size:20px;border-radius:32px}.message{font-size:14px}}
@media(max-width:430px){.content{width:calc(100% - 40px);margin-top:65px}.title{font-size:38px}.description{font-size:20px}}
</style>
</head>
<body>
<div class="page"><div class="topbar"><div class="back" id="back">‹</div><div class="top-title">Yeni şifre</div></div>
<main class="content">
<h1 class="title">Yeni şifre oluştur</h1>
<p class="description">Yeni şifreni belirle. Şifren değiştirildiğinde Minegram hesabın otomatik olarak açık kalacak.</p>
<input id="password" class="input" type="password" placeholder="Yeni şifre" autocomplete="new-password" maxlength="128">
<input id="confirm" class="input" type="password" placeholder="Yeni şifreyi tekrar gir" autocomplete="new-password" maxlength="128">
<button id="save" class="continue-btn">Şifreyi değiştir</button>
<div id="message" class="message"></div>
</main></div>
<script>
"use strict";
const passwordInput=document.getElementById("password"),confirmInput=document.getElementById("confirm"),saveButton=document.getElementById("save"),message=document.getElementById("message");
function show(text,success=false){message.textContent=text||"";message.className="message"+(success?" success":"")}
function first(...v){for(const x of v){if(x!==undefined&&x!==null&&String(x).trim()&&String(x)!=="null"&&String(x)!=="undefined")return String(x).trim()}return ""}
function getS(key){return sessionStorage.getItem(key)||localStorage.getItem(key)||""}
function saveSession(data){
 const session=data?.session||{};const nested=data?.data||{};
 const access=first(data?.token,data?.access_token,data?.accessToken,data?.supabaseAccessToken,session.access_token,nested.access_token);
 const refresh=first(data?.refreshToken,data?.refresh_token,session.refresh_token,nested.refresh_token);
 if(!access)return false;
 const keys=["minegram_token","minegram_supabase_token","minegram_access_token","supabase_token","access_token"];
 for(const k of keys){localStorage.setItem(k,access);sessionStorage.setItem(k,access)}
 if(refresh){localStorage.setItem("minegram_refresh_token",refresh);localStorage.setItem("refresh_token",refresh);localStorage.setItem("supabase_refresh_token",refresh)}
 if(data?.user)localStorage.setItem("minegram_user",JSON.stringify(data.user));
 if(data?.profile)localStorage.setItem("minegram_profile",JSON.stringify(data.profile));
 return true;
}
function clearReset(){["minegram_password_reset_token","minegram_reset_token","resetToken"].forEach(k=>{sessionStorage.removeItem(k);localStorage.removeItem(k)})}
const resetToken=first(new URLSearchParams(location.search).get("token"),getS("minegram_password_reset_token"),getS("minegram_reset_token"),getS("resetToken"));
if(!resetToken){saveButton.disabled=true;show("Şifre sıfırlama oturumu bulunamadı. İşlemi yeniden başlat.")}
document.getElementById("back").onclick=()=>location.href="sifremi-unuttum.html";
async function changePassword(){
 const password=passwordInput.value,confirm=confirmInput.value;
 if(!resetToken){show("Şifre sıfırlama oturumu bulunamadı.");return}
 if(password.length<6){show("Yeni şifre en az 6 karakter olmalı.");return}
 if(password!==confirm){show("Şifreler eşleşmiyor.");return}
 saveButton.disabled=true;saveButton.textContent="Değiştiriliyor...";show("Şifren değiştiriliyor...");
 try{
  const r=await fetch("/api/forgot/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({resetToken,reset_token:resetToken,token:resetToken,password,newPassword:password,confirmPassword:confirm})});
  const data=await r.json().catch(()=>({}));
  if(!r.ok||data.ok!==true)throw new Error(data.error||data.message||"Şifre değiştirilemedi.");
  if(!saveSession(data))throw new Error("Şifre değişti ancak oturum anahtarı alınamadı.");
  clearReset();show("Şifre değiştirildi. Oturum açıldı.",true);
  setTimeout(()=>location.replace("index.html"),300);
 }catch(e){show(e?.message||"Şifre değiştirilemedi.");saveButton.disabled=false;saveButton.textContent="Şifreyi değiştir"}
}
saveButton.onclick=changePassword;
confirmInput.addEventListener("keydown",e=>{if(e.key==="Enter")changePassword()});
</script>
</body></html>
