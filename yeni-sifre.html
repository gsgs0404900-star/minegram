<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Yeni şifre - Minegram</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:430px;background:#050505;border:1px solid #262626;border-radius:18px;padding:30px 24px}h1{margin:0 0 10px;font-size:27px}p{color:#aaa;line-height:1.5}label{display:block;font-size:14px;color:#ddd;margin:18px 0 7px}input{width:100%;height:50px;border:1px solid #333;border-radius:10px;background:#101010;color:#fff;padding:0 14px;font-size:16px;outline:none}.code{letter-spacing:8px;text-align:center;font-size:23px;font-weight:700}input:focus{border-color:#777}.btn{width:100%;height:50px;border:0;border-radius:10px;background:#fff;color:#000;font-size:16px;font-weight:700;margin-top:18px;cursor:pointer}.btn:disabled{opacity:.5}.resend{width:100%;background:transparent;color:#aaa;border:0;margin-top:14px;cursor:pointer}.msg{min-height:22px;margin-top:14px;color:#ff7777;font-size:14px}.ok{color:#65d98b}.back{display:block;text-align:center;color:#aaa;text-decoration:none;margin-top:18px;font-size:14px}</style></head><body><main class="card"><h1>Yeni şifre oluştur</h1><p>E-posta adresine gönderilen 6 haneli kodu gir ve yeni şifreni belirle.</p><label>Doğrulama kodu</label><input id="code" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"><label>Yeni şifre</label><input id="password" type="password" autocomplete="new-password" placeholder="En az 6 karakter"><label>Yeni şifre tekrar</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Şifreni tekrar yaz"><div id="msg" class="msg"></div><button id="save" class="btn">Şifreyi değiştir</button><button id="resend" class="resend">Kodu yeniden gönder</button><a class="back" href="giris.html">Giriş ekranına dön</a></main><script>
const q=new URLSearchParams(location.search),msg=document.getElementById('msg'),save=document.getElementById('save'),resend=document.getElementById('resend');
function get(keys){for(const k of keys){const qv=q.get(k);if(qv)return qv;try{const s=sessionStorage.getItem(k);if(s)return s}catch(e){}try{const l=localStorage.getItem(k);if(l)return l}catch(e){}}return ''}function set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}try{localStorage.setItem(k,v)}catch(e){}}
let recoveryId=get(['recoveryId','recovery_id','minegram_recovery_id']);const identifier=get(['identifier','minegram_recovery_identifier','username','email']);const email=get(['email']);
function error(t){msg.className='msg';msg.textContent=t}function ok(t){msg.className='msg ok';msg.textContent=t}
if(!recoveryId){save.disabled=true;resend.disabled=true;error('Şifre sıfırlama oturumu bulunamadı. Lütfen hesap bulma ekranından tekrar devam et.')}
document.getElementById('code').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);error('')});
save.onclick=async()=>{const code=document.getElementById('code').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(!/^\d{6}$/.test(code))return error('6 haneli doğrulama kodunu gir.');if(password.length<6)return error('Yeni şifre en az 6 karakter olmalı.');if(password!==confirm)return error('Şifreler eşleşmiyor.');save.disabled=true;save.textContent='Değiştiriliyor...';try{const r=await fetch('/api/forgot/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recoveryId,recovery_id:recoveryId,code,identifier,email,password,newPassword:password,confirmPassword:confirm})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Şifre değiştirilemedi.');ok('Şifren başarıyla değiştirildi. Giriş ekranına yönlendiriliyorsun...');['minegram_recovery_id','recoveryId','recovery_id','minegram_recovery_identifier','identifier','email','resetToken','minegram_reset_token','minegram_recovery_token'].forEach(k=>{try{sessionStorage.removeItem(k)}catch(e){}try{localStorage.removeItem(k)}catch(e){}});setTimeout(()=>location.href='giris.html',1200)}catch(e){error(e.message);save.disabled=false;save.textContent='Şifreyi değiştir'}};
resend.onclick=async()=>{resend.disabled=true;resend.textContent='Gönderiliyor...';try{const r=await fetch('/api/forgot/resend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier,email,mode:'email'})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Kod gönderilemedi.');recoveryId=d.recoveryId||d.recovery_id;set('minegram_recovery_id',recoveryId);set('recoveryId',recoveryId);set('recovery_id',recoveryId);document.getElementById('code').value='';ok('Yeni kod e-posta adresine gönderildi.');setTimeout(()=>{resend.disabled=false;resend.textContent='Kodu yeniden gönder'},60000)}catch(e){error(e.message);resend.disabled=false;resend.textContent='Kodu yeniden gönder'}};
</script></body></html>
