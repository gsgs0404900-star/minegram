<script>

/* =========================================================
   MINEGRAM PROFİL - DÜZELTİLMİŞ SÜRÜM
========================================================= */

function getToken(){

  const candidates = [

    localStorage.getItem('minegram_token'),

    localStorage.getItem('minegram_access_token'),

    localStorage.getItem('access_token'),

    localStorage.getItem('token')

  ];

  for(const value of candidates){

    if(
      value !== null &&
      value !== undefined &&
      String(value).trim()
    ){

      return String(value).trim();

    }

  }

  return '';

}

let token = getToken();

const params = new URLSearchParams(location.search);

const target = (
  params.get('username') || ''
).trim();

let me = null;

let currentProfile = null;


/* =========================================================
   TOAST
========================================================= */

function toast(msg){

  const el = document.getElementById('toast');

  if(!el) return;

  el.textContent = String(msg || '');

  el.classList.add('show');

  clearTimeout(window.__toast);

  window.__toast = setTimeout(()=>{

    el.classList.remove('show');

  },2200);

}


/* =========================================================
   API
========================================================= */

async function api(url,opt={}){

  const controller = new AbortController();

  const timeout = setTimeout(()=>{

    controller.abort();

  },10000);

  try{

    const headers = {
      ...(opt.headers || {})
    };

    const activeToken = getToken();

    if(activeToken){

      headers.Authorization =
        'Bearer ' + activeToken;

    }

    let body = opt.body;

    if(
      body &&
      typeof body !== 'string'
    ){

      headers['Content-Type'] =
        'application/json';

      body = JSON.stringify(body);

    }

    const response = await fetch(
      url,
      {
        ...opt,
        headers,
        body,
        signal:controller.signal
      }
    );

    let data = {};

    const contentType =
      response.headers.get('content-type') || '';

    if(
      contentType.includes('application/json')
    ){

      try{

        data = await response.json();

      }catch(e){

        data = {};

      }

    }else{

      const text = await response.text();

      try{

        data = JSON.parse(text);

      }catch(e){

        data = {
          message:text
        };

      }

    }

    if(!response.ok){

      throw new Error(
        data.error ||
        data.message ||
        'İşlem başarısız (' +
        response.status +
        ')'
      );

    }

    return data;

  }catch(e){

    if(e.name === 'AbortError'){

      throw new Error(
        'Sunucu yanıt vermedi. Lütfen tekrar deneyin.'
      );

    }

    throw e;

  }finally{

    clearTimeout(timeout);

  }

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value ?? '')
    .replace(
      /[&<>"']/g,
      c=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );

}


/* =========================================================
   OBJEYİ NORMALİZE ET
========================================================= */

function unwrapUser(value){

  if(!value){
    return null;
  }

  if(value.profile){
    return value.profile;
  }

  if(value.user?.profile){
    return value.user.profile;
  }

  if(value.user){
    return value.user;
  }

  if(value.data?.profile){
    return value.data.profile;
  }

  if(value.data?.user){
    return value.data.user;
  }

  if(value.data){
    return value.data;
  }

  return value;

}


/* =========================================================
   STORED USER
========================================================= */

function getStoredUser(){

  const keys = [
    'minegram_user',
    'minegram_current_user',
    'currentUser',
    'user'
  ];

  for(const key of keys){

    try{

      const raw =
        localStorage.getItem(key);

      if(!raw){
        continue;
      }

      const parsed =
        JSON.parse(raw);

      if(parsed){
        return parsed;
      }

    }catch(e){

      console.warn(
        '[Minegram] Local kullanıcı okunamadı:',
        key,
        e
      );

    }

  }

  return null;

}


/* =========================================================
   USERNAME BUL
   YENİ KAYIT VERİSİ ESKİ VERİDEN ÖNCE
========================================================= */

function getLocalUsername(){

  const storedUser =
    getStoredUser();

  const candidates = [

    /* Yeni doğrulama sonrası kayıt */
    localStorage.getItem(
      'minegram_register_username'
    ),

    /* Güncel kullanıcı */
    storedUser?.username,

    storedUser?.user?.username,

    storedUser?.profile?.username,

    storedUser?.data?.username,

    /* Normal giriş */
    localStorage.getItem(
      'minegram_username'
    ),

    localStorage.getItem(
      'username'
    )

  ];

  for(const value of candidates){

    if(
      value !== null &&
      value !== undefined &&
      String(value).trim()
    ){

      return String(value).trim();

    }

  }

  return '';

}


/* =========================================================
   USER ID
========================================================= */

function getLocalUserId(){

  const storedUser =
    getStoredUser();

  const candidates = [

    localStorage.getItem(
      'minegram_user_id'
    ),

    storedUser?.id,

    storedUser?.user?.id,

    storedUser?.profile?.id,

    storedUser?.auth_user_id,

    storedUser?.user?.auth_user_id,

    storedUser?.profile?.auth_user_id

  ];

  for(const value of candidates){

    if(
      value !== null &&
      value !== undefined &&
      String(value).trim()
    ){

      return String(value).trim();

    }

  }

  return '';

}


/* =========================================================
   SERVER USERNAME
========================================================= */

function getServerUsername(user){

  const u =
    unwrapUser(user);

  if(!u){
    return '';
  }

  const candidates = [

    u.username,

    u.user?.username,

    u.profile?.username,

    u.data?.username,

    u.data?.user?.username,

    u.account?.username

  ];

  for(const value of candidates){

    if(
      value !== null &&
      value !== undefined &&
      String(value).trim()
    ){

      return String(value).trim();

    }

  }

  return '';

}


/* =========================================================
   SERVER USER ID
========================================================= */

function getServerUserId(user){

  const u =
    unwrapUser(user);

  if(!u){
    return '';
  }

  const candidates = [

    u.id,

    u.auth_user_id,

    u.user?.id,

    u.user?.auth_user_id,

    u.profile?.id,

    u.profile?.auth_user_id,

    u.data?.id,

    u.data?.user?.id

  ];

  for(const value of candidates){

    if(
      value !== null &&
      value !== undefined &&
      String(value).trim()
    ){

      return String(value).trim();

    }

  }

  return '';

}


/* =========================================================
   CURRENT PROFILE NORMALIZE
========================================================= */

function normalizeProfile(data){

  const p =
    unwrapUser(data);

  if(!p){
    return null;
  }

  return {

    ...p,

    username:
      p.username ||
      p.user?.username ||
      p.profile?.username ||
      '',

    id:
      p.id ||
      p.profile?.id ||
      '',

    auth_user_id:
      p.auth_user_id ||
      p.user?.auth_user_id ||
      p.profile?.auth_user_id ||
      '',

    displayName:
      p.displayName ||
      p.display_name ||
      p.profile?.displayName ||
      p.profile?.display_name ||
      '',

    bio:
      p.bio ||
      p.profile?.bio ||
      '',

    avatar_url:
      p.avatar_url ||
      p.avatar ||
      p.profile?.avatar_url ||
      p.profile?.avatar ||
      '',

    verified:
      Boolean(
        p.verified ||
        p.profile?.verified
      ),

    postCount:
      p.postCount ??
      p.post_count ??
      p.posts_count ??
      p.postsCount ??
      0,

    followers:
      p.followers ??
      p.followerCount ??
      p.follower_count ??
      0,

    following:
      p.following ??
      p.followingCount ??
      p.following_count ??
      0,

    followingByMe:
      Boolean(
        p.followingByMe ??
        p.following_by_me ??
        false
      )

  };

}


/* =========================================================
   USER KAYDET
========================================================= */

function saveCurrentUser(profile){

  if(!profile){
    return;
  }

  const p =
    normalizeProfile(profile);

  if(!p){
    return;
  }

  const username =
    String(
      p.username || ''
    ).trim();

  const id =
    String(
      p.id ||
      p.auth_user_id ||
      ''
    ).trim();

  if(username){

    localStorage.setItem(
      'minegram_username',
      username
    );

    /* Yeni kayıt bilgisini de güncel tut */
    localStorage.setItem(
      'minegram_register_username',
      username
    );

  }

  if(id){

    localStorage.setItem(
      'minegram_user_id',
      id
    );

  }

  try{

    const oldUser =
      getStoredUser() || {};

    const merged = {

      ...oldUser,

      ...p,

      username:
        username ||
        oldUser.username ||
        '',

      id:
        id ||
        oldUser.id ||
        ''

    };

    localStorage.setItem(
      'minegram_user',
      JSON.stringify(merged)
    );

  }catch(e){

    console.warn(
      '[Minegram] Kullanıcı kaydedilemedi:',
      e
    );

  }

}


/* =========================================================
   PROFİLİ GÖSTER
========================================================= */

function renderProfile(){

  if(!currentProfile){
    return;
  }

  currentProfile =
    normalizeProfile(
      currentProfile
    );

  const username =
    currentProfile.username ||
    getLocalUsername() ||
    'Minegram';

  const displayName =
    currentProfile.displayName ||
    '';

  const bio =
    currentProfile.bio ||
    '';

  document.getElementById(
    'title'
  ).textContent =
    username;

  document.getElementById(
    'username'
  ).innerHTML =
    '@' +
    escapeHtml(username) +
    (
      currentProfile.verified
        ? ' <span class="verified">✓</span>'
        : ''
    );

  document.getElementById(
    'display'
  ).textContent =
    displayName;

  document.getElementById(
    'bio'
  ).textContent =
    bio;

  document.getElementById(
    'postCount'
  ).textContent =
    currentProfile.postCount ?? 0;

  document.getElementById(
    'followers'
  ).textContent =
    currentProfile.followers ?? 0;

  document.getElementById(
    'following'
  ).textContent =
    currentProfile.following ?? 0;

  const avatar =
    document.getElementById(
      'avatar'
    );

  const avatarUrl =
    currentProfile.avatar_url ||
    '';

  if(avatarUrl){

    avatar.innerHTML =
      '<img src="' +
      escapeHtml(avatarUrl) +
      '" alt="Profil fotoğrafı">';

  }else{

    const source =
      (
        displayName ||
        username ||
        'M'
      ).trim();

    avatar.textContent =
      source
        ? source.charAt(0).toUpperCase()
        : 'M';

  }

}


/* =========================================================
   GÖNDERİLER
========================================================= */

function renderPosts(posts){

  const grid =
    document.getElementById(
      'grid'
    );

  if(!Array.isArray(posts) || !posts.length){

    grid.innerHTML =
      '<div class="empty">' +
      'Henüz gönderi yok' +
      '</div>';

    return;

  }

  grid.innerHTML =
    posts.map(post=>{

      const media =
        post.media ||
        post.image ||
        post.image_url ||
        post.media_url ||
        post.photo_url ||
        post.file_url ||
        '';

      if(media){

        return `
          <div class="tile">
            <img
              src="${escapeHtml(media)}"
              loading="lazy"
              alt="Gönderi"
            >
          </div>
        `;

      }

      return `
        <div class="tile">
          <div class="txt">
            ${escapeHtml(
              post.caption ||
              post.text ||
              post.content ||
              ''
            )}
          </div>
        </div>
      `;

    }).join('');

}


/* =========================================================
   PROFİL YÜKLE
========================================================= */

async function load(){

  token =
    getToken();

  const grid =
    document.getElementById(
      'grid'
    );

  grid.innerHTML =
    '<div class="empty">Profil yükleniyor...</div>';

  try{

    /* -----------------------------------------------------
       1. LOCAL KULLANICIYI ÖNCEDEN AL
    ----------------------------------------------------- */

    const localUsername =
      getLocalUsername();

    const storedUser =
      getStoredUser();

    console.log(
      '[MINEGRAM] Local username:',
      localUsername
    );

    console.log(
      '[MINEGRAM] Stored user:',
      storedUser
    );


    /* -----------------------------------------------------
       2. /api/me
    ----------------------------------------------------- */

    try{

      me =
        await api(
          '/api/me'
        );

      me =
        unwrapUser(me);

      console.log(
        '[MINEGRAM] /api/me:',
        me
      );

    }catch(error){

      console.warn(
        '[MINEGRAM] /api/me başarısız:',
        error
      );

      me = null;

    }


    /* -----------------------------------------------------
       3. SUNUCUDAN USERNAME
    ----------------------------------------------------- */

    const serverUsername =
      getServerUsername(me);


    /* -----------------------------------------------------
       4. USERNAME SEÇ
       
       URL sadece başka profile gidildiyse kullanılmalı.
       Kendi profile.html sayfasında local/server kullanıcı
       öncelikli.
    ----------------------------------------------------- */

    let username = '';

    if(target){

      username =
        target;

    }else{

      username =
        serverUsername ||
        localUsername ||
        storedUser?.username ||
        storedUser?.user?.username ||
        storedUser?.profile?.username ||
        '';

    }

    username =
      String(username)
        .trim()
        .replace(/^@/,'');


    console.log(
      '[MINEGRAM] Kullanılacak username:',
      username
    );


    /* -----------------------------------------------------
       USERNAME YOKSA
    ----------------------------------------------------- */

    if(!username){

      throw new Error(
        'Giriş yapan hesabın kullanıcı adı bulunamadı.'
      );

    }


    /* -----------------------------------------------------
       5. EKRANA GEÇİCİ OLARAK DOĞRU USERNAME YAZ
    ----------------------------------------------------- */

    document.getElementById(
      'username'
    ).textContent =
      '@' + username;

    document.getElementById(
      'title'
    ).textContent =
      username;


    /* -----------------------------------------------------
       6. PROFİLİ GETİR
    ----------------------------------------------------- */

    const profileResponse =
      await api(
        '/api/users/' +
        encodeURIComponent(
          username
        )
      );


    currentProfile =
      normalizeProfile(
        profileResponse
      );


    if(!currentProfile){

      throw new Error(
        'Profil bilgileri bulunamadı.'
      );

    }


    /* -----------------------------------------------------
       7. API GERÇEK USERNAME DÖNDÜRDÜYSE ONU KULLAN
    ----------------------------------------------------- */

    const realUsername =
      String(
        currentProfile.username ||
        username
      )
      .trim()
      .replace(/^@/,'');

    currentProfile.username =
      realUsername;


    console.log(
      '[MINEGRAM] Gerçek profil:',
      currentProfile
    );


    /* -----------------------------------------------------
       8. LOCAL STORAGE GÜNCELLE
    ----------------------------------------------------- */

    saveCurrentUser(
      currentProfile
    );


    /* -----------------------------------------------------
       9. PROFİLİ RENDER
    ----------------------------------------------------- */

    renderProfile();


    /* -----------------------------------------------------
       10. KENDİ PROFİLİ Mİ?
    ----------------------------------------------------- */

    const currentId =
      String(
        currentProfile.id ||
        currentProfile.auth_user_id ||
        ''
      ).trim();

    const myId =
      String(
        getServerUserId(me) ||
        getLocalUserId() ||
        ''
      ).trim();

    const mine =
      Boolean(
        currentId &&
        myId &&
        currentId === myId
      );


    /* Username karşılaştırması da yap */
    const myUsername =
      String(
        getServerUsername(me) ||
        getLocalUsername() ||
        ''
      )
      .trim()
      .replace(/^@/,'');

    const usernameMine =
      Boolean(
        myUsername &&
        realUsername &&
        myUsername.toLowerCase() ===
        realUsername.toLowerCase()
      );

    const isMine =
      mine ||
      (
        !target &&
        usernameMine
      );


    console.log(
      '[MINEGRAM] currentId:',
      currentId
    );

    console.log(
      '[MINEGRAM] myId:',
      myId
    );

    console.log(
      '[MINEGRAM] myUsername:',
      myUsername
    );

    console.log(
      '[MINEGRAM] Profil sahibi:',
      realUsername
    );

    console.log(
      '[MINEGRAM] Kendi profilim:',
      isMine
    );


    /* -----------------------------------------------------
       11. DÜZENLE / TAKİP
    ----------------------------------------------------- */

    const edit =
      document.getElementById(
        'editBtn'
      );

    if(isMine){

      edit.textContent =
        '✎  Profil düzenle';

      edit.classList.add(
        'primary'
      );

    }else{

      edit.textContent =
        currentProfile.followingByMe
          ? 'Takibi Bırak'
          : 'Takip Et';

      edit.classList.toggle(
        'primary',
        !currentProfile.followingByMe
      );

    }


    /* -----------------------------------------------------
       12. GÖNDERİLER
    ----------------------------------------------------- */

    try{

      const postsResponse =
        await api(
          '/api/users/' +
          encodeURIComponent(
            realUsername
          ) +
          '/posts'
        );

      let posts = postsResponse;

      if(
        postsResponse &&
        Array.isArray(
          postsResponse.posts
        )
      ){

        posts =
          postsResponse.posts;

      }else if(
        postsResponse &&
        Array.isArray(
          postsResponse.data
        )
      ){

        posts =
          postsResponse.data;

      }else if(
        postsResponse &&
        Array.isArray(
          postsResponse.items
        )
      ){

        posts =
          postsResponse.items;

      }

      renderPosts(
        Array.isArray(posts)
          ? posts
          : []
      );

    }catch(error){

      console.warn(
        '[MINEGRAM] Gönderiler yüklenemedi:',
        error
      );

      grid.innerHTML =
        '<div class="empty">' +
        'Henüz gönderi yok' +
        '</div>';

    }

  }catch(error){

    console.error(
      '[MINEGRAM] Profil yükleme hatası:',
      error
    );

    grid.innerHTML =
      '<div class="empty">' +
      'Profil yüklenemedi.<br><br>' +
      escapeHtml(
        error.message ||
        'Bilinmeyen hata'
      ) +
      '</div>';

    toast(
      error.message ||
      'Profil yüklenemedi'
    );

  }

}

/* =========================================================
   MODAL
========================================================= */

function openModal(id){

  const modal =
    document.getElementById(id);

  if(!modal){
    return;
  }

  modal.classList.add(
    'open'
  );

  modal.setAttribute(
    'aria-hidden',
    'false'
  );

}


function closeModal(id){

  const modal =
    document.getElementById(id);

  if(!modal){
    return;
  }

  modal.classList.remove(
    'open'
  );

  modal.setAttribute(
    'aria-hidden',
    'true'
  );

}

/* =========================================================
   PROFİL PAYLAŞ
========================================================= */

document
  .getElementById('shareBtn')
  .addEventListener(
    'click',
    async()=>{

      if(!currentProfile){

        toast(
          'Profil henüz yüklenmedi'
        );

        return;

      }

      const username =
        currentProfile.username ||
        getLocalUsername() ||
        '';

      const profileUrl =
        location.origin +
        location.pathname +
        '?username=' +
        encodeURIComponent(
          username
        );

      try{

        if(navigator.share){

          await navigator.share({
            title:
              'Minegram profili',

            text:
              '@' + username,

            url:
              profileUrl
          });

        }else{

          await navigator.clipboard.writeText(
            profileUrl
          );

          toast(
            'Profil bağlantısı kopyalandı'
          );

        }

      }catch(error){

        if(
          error.name !==
          'AbortError'
        ){

          toast(
            'Paylaşım başarısız'
          );

        }

      }

    }
  );

        'minegram_token',
        'minegram_access_token',
        'access_token',
        'token',

        'minegram_username',
        'minegram_user_id',
        'minegram_user',

        'minegram_register_username',
        'minegram_register_email',
        'minegram_register_phone',
        'minegram_register_displayName',
        'minegram_register_verified'

      ];

      keys.forEach(
        key=>{
          localStorage.removeItem(
            key
          );
        }
      );

      location.href =
        'index.html';

    }
  );

].forEach(

      event=>{

        if(
          event.target === modal
        ){

          closeModal(id);

        }

      }
    );

  }
);
