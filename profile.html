<script>


/* =========================================================
   TEMEL DEĞİŞKENLER
========================================================= */

const params =
new URLSearchParams(location.search);

const target =
(params.get('username') ||
 params.get('user') ||
 '').trim();


let me = null;

let currentProfile = null;

let highlightItems = [];

let openedHighlightIndex = 0;


/* =========================================================
   TOKEN
========================================================= */

function getToken(){

const keys = [
'minegram_token',
'minegram_access_token',
'minegram_supabase_token',
'access_token',
'token'
];

for(const k of keys){

const v =
localStorage.getItem(k);

if(
v &&
v !== 'null' &&
v !== 'undefined'
){
return v;
}

}

return '';

}


/* =========================================================
   USER NORMALIZE
========================================================= */

function unwrapUser(data){

return (
data?.user ||
data?.profile ||
data?.data?.user ||
data?.data?.profile ||
data?.data ||
data ||
{}
);

}


function cleanUsername(v){

return String(v || '')
.trim()
.replace(/^@+/,'');
}


function normalizeUser(data){

const u =
unwrapUser(data);

return {
...u,

id:
u.id ||
u.user_id ||
u.auth_user_id ||
'',

username:
cleanUsername(
u.username ||
u.user_name ||
u.handle ||
''
),

displayName:
u.displayName ||
u.display_name ||
u.full_name ||
'',

bio:
u.bio ||
'',

avatar:
u.avatar ||
u.avatar_url ||
u.avatarUrl ||
''
};

}


/* =========================================================
   LOCAL SESSION
========================================================= */

function getSavedUser(){

const keys = [
'minegram_user',
'minegram_current_user',
'currentUser',
'user'
];

for(const k of keys){

try{

const x =
JSON.parse(
localStorage.getItem(k) || 'null'
);

const u =
normalizeUser(x);

if(
u.username ||
u.id
){
return u;
}

}catch(e){}

}


return normalizeUser({

username:
localStorage.getItem(
'minegram_register_username'
) ||
localStorage.getItem(
'minegram_username'
) ||
localStorage.getItem(
'username'
) ||
'',

displayName:
localStorage.getItem(
'minegram_display_name'
) ||
'',

bio:
localStorage.getItem(
'minegram_bio'
) ||
'',

avatar:
localStorage.getItem(
'minegram_avatar'
) ||
''

});

}


function saveCurrentSessionUser(data){

const u =
normalizeUser(data);

if(
!u.username &&
!u.id
){
return;
}

localStorage.setItem(
'minegram_user',
JSON.stringify(u)
);

if(u.username){

localStorage.setItem(
'minegram_username',
u.username
);

localStorage.setItem(
'minegram_register_username',
u.username
);

}

if(u.id){

localStorage.setItem(
'minegram_user_id',
String(u.id)
);

}

}


/* =========================================================
   TOAST
========================================================= */

function toast(msg){

const el =
document.getElementById('toast');

if(!el){
return;
}

el.textContent =
String(msg || '');

el.classList.add('show');

clearTimeout(
window.__toast
);

window.__toast =
setTimeout(
()=>{
el.classList.remove('show');
},
2200
);

}


/* =========================================================
   API
========================================================= */

async function api(url,opt={}){

const token =
getToken();

const headers =
{
...(opt.headers || {})
};

if(token){

headers.Authorization =
'Bearer ' + token;

}

if(
opt.body &&
typeof opt.body !== 'string'
){

headers['Content-Type'] =
'application/json';

opt.body =
JSON.stringify(opt.body);

}

const r =
await fetch(
url,
{
...opt,
headers
}
);


if(!r.ok){

let j = {};

try{
j = await r.json();
}catch(e){}

const error =
new Error(
j.error ||
j.message ||
'İşlem başarısız'
);

error.status =
r.status;

throw error;

}


const text =
await r.text();

if(!text){
return {};
}

try{

return JSON.parse(text);

}catch(e){

return {
data:text
};

}

}


/* =========================================================
   HTML GÜVENLİ
========================================================= */

function escapeHtml(s){

return String(s ?? '')
.replace(
/[&<>"']/g,
c =>
({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c])
);

}


/* =========================================================
   MODAL
========================================================= */

function openModal(id){

const m =
document.getElementById(id);

if(!m){
return;
}

m.classList.add('open');

m.setAttribute(
'aria-hidden',
'false'
);

}


function closeModal(id){

const m =
document.getElementById(id);

if(!m){
return;
}

m.classList.remove('open');

m.setAttribute(
'aria-hidden',
'true'
);

}


/* =========================================================
   HIGHLIGHTS API
========================================================= */

async function loadHighlights(username){

const section =
document.getElementById(
'highlightsSection'
);

const box =
document.getElementById(
'highlights'
);

if(!section || !box){
return;
}


/*
   Önce temizle.
*/

highlightItems = [];

box.innerHTML = '';

section.hidden = true;


if(!username){
return;
}


try{

const raw =
await api(
'/api/users/' +
encodeURIComponent(username) +
'/highlights'
);


console.log(
'[MINEGRAM HIGHLIGHTS]',
raw
);


let items = [];


if(Array.isArray(raw)){

items = raw;

}else if(
raw &&
Array.isArray(raw.highlights)
){

items =
raw.highlights;

}else if(
raw &&
Array.isArray(raw.data)
){

items =
raw.data;

}else if(
raw &&
raw.data &&
Array.isArray(raw.data.highlights)
){

items =
raw.data.highlights;

}


highlightItems =
items.filter(
item =>
item &&
(
item.media_url ||
item.media ||
item.image ||
item.url
)
);


renderHighlights();


}catch(e){

console.warn(
'[HIGHLIGHTS LOAD]',
e
);

highlightItems = [];

renderHighlights();

}

}


/* =========================================================
   HIGHLIGHTS RENDER
========================================================= */

function getHighlightImage(item){

return (
item?.media_url ||
item?.media ||
item?.image ||
item?.url ||
''
);

}


function getHighlightTitle(item){

return (
item?.title ||
item?.name ||
'Öne çıkan'
);

}


function renderHighlights(){

const section =
document.getElementById(
'highlightsSection'
);

const box =
document.getElementById(
'highlights'
);

if(!section || !box){
return;
}


box.innerHTML = '';


if(
!Array.isArray(highlightItems) ||
highlightItems.length === 0
){

section.hidden = true;

return;

}


section.hidden = false;


highlightItems.forEach(
(item,index)=>{

const button =
document.createElement(
'button'
);

button.type =
'button';

button.className =
'highlight';


const image =
getHighlightImage(item);

const title =
getHighlightTitle(item);


button.innerHTML =
'<span class="highlight-cover">' +

(
image
?
'<img src="' +
escapeHtml(image) +
'" alt="' +
escapeHtml(title) +
'">'
:
'★'
)

+

'</span>' +

'<span class="highlight-title">' +
escapeHtml(title) +
'</span>';


button.addEventListener(
'click',
()=>openHighlightView(index)
);


box.appendChild(
button
);

}

);

}


/* =========================================================
   HIGHLIGHT VIEW
========================================================= */

function openHighlightView(index){

if(
!highlightItems.length
){
return;
}


if(index < 0){
index = 0;
}

if(
index >= highlightItems.length
){
index =
highlightItems.length - 1;
}


openedHighlightIndex =
index;


const item =
highlightItems[index];

const image =
getHighlightImage(item);

const title =
getHighlightTitle(item);


const viewer =
document.getElementById(
'highlightViewer'
);

const imageEl =
document.getElementById(
'highlightViewerImage'
);

const titleEl =
document.getElementById(
'highlightViewerTitle'
);


if(!viewer || !imageEl){
return;
}


imageEl.src =
image || '';


imageEl.alt =
title;


if(titleEl){

titleEl.textContent =
title;

}


viewer.classList.add(
'open'
);

viewer.setAttribute(
'aria-hidden',
'false'
);

}


function closeHighlightView(){

const viewer =
document.getElementById(
'highlightViewer'
);

if(!viewer){
return;
}

viewer.classList.remove(
'open'
);

viewer.setAttribute(
'aria-hidden',
'true'
);

const imageEl =
document.getElementById(
'highlightViewerImage'
);

if(imageEl){

imageEl.src = '';

}

}


function previousHighlight(){

if(
!highlightItems.length
){
return;
}

openedHighlightIndex--;

if(
openedHighlightIndex < 0
){

openedHighlightIndex =
highlightItems.length - 1;

}

openHighlightView(
openedHighlightIndex
);

}


function nextHighlight(){

if(
!highlightItems.length
){
return;
}

openedHighlightIndex++;

if(
openedHighlightIndex >=
highlightItems.length
){

openedHighlightIndex = 0;

}

openHighlightView(
openedHighlightIndex
);

}


/* =========================================================
   GÖNDERİLER
========================================================= */

function renderPosts(posts){

const grid =
document.getElementById(
'grid'
);

if(!grid){
return;
}


const list =
Array.isArray(posts)
?
posts
:
[];


grid.innerHTML =
list.length

?

list.map(
x=>{

const media =
x?.media ||
x?.media_url ||
x?.image ||
x?.image_url ||
'';


if(media){

return (

'<div class="tile">' +

'<img src="' +
escapeHtml(media) +
'" loading="lazy" alt="Gönderi">' +

'</div>'

);

}


return (

'<div class="tile">' +

'<div class="txt">' +

escapeHtml(
x?.caption ||
x?.text ||
''
)

+

'</div>' +

'</div>'

);

}
).join('')

:

'<div class="empty">Henüz gönderi yok</div>';

}


/* =========================================================
   PROFİL YÜKLE
========================================================= */

async function load(){

const token =
getToken();


/*
   TOKEN YOKSA LOCAL SESSION
*/

if(!token){

const saved =
getSavedUser();


if(saved.username){

me = saved;


const username =
cleanUsername(target) ||
saved.username;


currentProfile = {
...saved,
username
};


const usernameEl =
document.getElementById(
'username'
);

const displayEl =
document.getElementById(
'display'
);

const bioEl =
document.getElementById(
'bio'
);

const avatarEl =
document.getElementById(
'avatar'
);


if(usernameEl){

usernameEl.textContent =
'@' + username;

}


if(displayEl){

displayEl.textContent =
saved.displayName || '';

}


if(bioEl){

bioEl.textContent =
saved.bio || '';

}


if(avatarEl){

if(saved.avatar){

avatarEl.innerHTML =
'<img src="' +
escapeHtml(saved.avatar) +
'" alt="Profil fotoğrafı">';

}else{

avatarEl.textContent =
(
saved.displayName ||
username ||
'M'
)[0].toUpperCase();

}

}


renderPosts([]);

await loadHighlights(
username
);

return;

}


location.replace(
'giris.html'
);

return;

}


/* =========================================================
   GERÇEK API
========================================================= */

try{

const meRaw =
await api('/api/me');


me =
normalizeUser(meRaw);


if(!me.username){

const saved =
getSavedUser();

if(saved.username){

me = {
...saved,
...me
};

}

}


if(!me.username){

throw new Error(
'Oturum kullanıcısı bulunamadı.'
);

}


saveCurrentSessionUser(me);


const username =
cleanUsername(target) ||
me.username;


/*
   PROFİL
*/

const profileRaw =
await api(
'/api/users/' +
encodeURIComponent(username)
);


currentProfile =
normalizeUser(profileRaw);


currentProfile.username =
currentProfile.username ||
username;


/*
   PROFİL BİLGİLERİ
*/

const usernameEl =
document.getElementById(
'username'
);

const displayEl =
document.getElementById(
'display'
);

const bioEl =
document.getElementById(
'bio'
);

const postCountEl =
document.getElementById(
'postCount'
);

const followersEl =
document.getElementById(
'followers'
);

const followingEl =
document.getElementById(
'following'
);


if(usernameEl){

usernameEl.innerHTML =
'@' +
escapeHtml(
currentProfile.username
) +

(
currentProfile.verified
?
' <span class="verified">✓</span>'
:
''
);

}


if(displayEl){

displayEl.textContent =
currentProfile.displayName || '';

}


if(bioEl){

bioEl.textContent =
currentProfile.bio || '';

}


if(postCountEl){

postCountEl.textContent =
currentProfile.postCount ??
currentProfile.post_count ??
0;

}


if(followersEl){

followersEl.textContent =
currentProfile.followers ??
currentProfile.followerCount ??
0;

}


if(followingEl){

followingEl.textContent =
currentProfile.following ??
currentProfile.followingCount ??
0;

}


/*
   BENİM PROFİLİM Mİ?
*/

const mine =
String(currentProfile.id || '') ===
String(me.id || '');


const edit =
document.getElementById(
'editBtn'
);


if(edit){

if(mine){

edit.textContent =
'✎  Profil düzenle';

}else{

edit.textContent =
currentProfile.followingByMe
?
'Takibi Bırak'
:
'Takip Et';

}

edit.classList.toggle(
'primary',
mine ||
!currentProfile.followingByMe
);

}


/*
   AVATAR
*/

const avatarEl =
document.getElementById(
'avatar'
);

const avatar =
currentProfile.avatar ||
currentProfile.avatar_url ||
currentProfile.avatarUrl ||
'';


if(avatarEl){

if(avatar){

avatarEl.innerHTML =
'<img src="' +
escapeHtml(avatar) +
'" alt="Profil fotoğrafı">';

}else{

avatarEl.textContent =
(
currentProfile.displayName ||
currentProfile.username ||
'M'
)[0].toUpperCase();

}

}


/*
   HIGHLIGHTS
   Profil verisinden bağımsız yükleniyor.
   Bu nedenle Highlights API hata verse bile
   gönderiler ve diğer butonlar çalışmaya devam eder.
*/

await loadHighlights(
username
);


/*
   GÖNDERİLER
*/

try{

const postsRaw =
await api(
'/api/users/' +
encodeURIComponent(username) +
'/posts'
);


const posts =
Array.isArray(postsRaw)
?
postsRaw
:
(
postsRaw?.posts ||
postsRaw?.data ||
[]
);


renderPosts(posts);


}catch(e){

console.warn(
'[POSTS]',
e
);

renderPosts([]);

}


}catch(e){

console.error(
'[PROFILE]',
e
);


if(
e.status === 401 ||
/401|unauthorized|oturum/i.test(
String(e.message || '')
)
){

[
'minegram_token',
'minegram_access_token',
'minegram_supabase_token',
'access_token',
'token'
]
.forEach(
k =>
localStorage.removeItem(k)
);

location.replace(
'giris.html'
);

return;

}


const grid =
document.getElementById(
'grid'
);

if(grid){

grid.innerHTML =
'<div class="empty">Profil yüklenemedi.</div>';

}


toast(
e.message ||
'Profil yüklenemedi.'
);

}

}

   GERİ
========================================================= */

const backBtn =
document.getElementById(
'backBtn'
);

if(backBtn){

backBtn.addEventListener(
'click',
()=>{

if(
history.length > 1
){

);

editSave.addEventListener(

async()=>{

document.getElementById(
'nameInput'
);

document.getElementById(
'bioInput'
);


await api(
'/api/me',
{

body:{

?
bioInput.value.trim()
:

}

========================================================= */

document.getElementById(
'shareBtn'

'click',
async()=>{

if(!currentProfile){

toast(
'Profil henüz yüklenmedi'
);

const url =
location.href;


try{

navigator.share
){

await navigator.share(
{
title:
'Minegram profili',

text:
'@' +
currentProfile.username,

url
}
);

}else{

await navigator.clipboard.writeText(
url
);

toast(
'Profil bağlantısı kopyalandı'
);

}

}catch(e){

if(
e.name !== 'AbortError'
){

toast(

);

}

}

}
);

}

/* =========================================================

========================================================= */

document.addEventListener(
'keydown',
e=>{

const viewer =
document.getElementById(
'highlightViewer'
);

if(
!viewer ||
!viewer.classList.contains('open')
){
return;
}


if(
e.key === 'ArrowLeft'
){

previousHighlight();

}


if(
e.key === 'ArrowRight'
){

nextHighlight();

}

}
);
