<style>

html,

<script>
"use strict";

/* =========================================================
   MINEGRAM PROFİL
   MEVCUT YAPIN KORUNDU
   SADECE OTURUM / KULLANICI BULMA GÜÇLENDİRİLDİ
========================================================= */

const API = "/api";


/* =========================================================
   TOKEN
   TÜM MEVCUT TOKEN ANAHTARLARI DESTEKLENİR
========================================================= */

function getToken(){

  const keys = [
    "minegram_token",
    "minegram_access_token",
    "minegram_supabase_token",
    "access_token",
    "token"
  ];

  for(const key of keys){

    const value =
      localStorage.getItem(key);

    if(
      value &&
      String(value).trim()
    ){

      return String(value).trim();

    }

  }

  return "";

}

let token = getToken();


/* =========================================================
   URL'DEN BAŞKA PROFİL AÇILMIŞ MI?
========================================================= */

const params =
  new URLSearchParams(
    location.search
  );

const target =
  (
    params.get("username") ||
    ""
  ).trim();


let me = null;

let currentProfile = null;


/* =========================================================
   TOAST
========================================================= */

function toast(msg){

  const el =
    document.getElementById(
      "toast"
    );

  el.textContent =
    msg || "";

  el.classList.add(
    "show"
  );

  clearTimeout(
    window.__toast
  );

  window.__toast =
    setTimeout(
      ()=>{
        el.classList.remove(
          "show"
        );
      },
      2200
    );

}


/* =========================================================
   API
========================================================= */

async function api(url,opt={}){

  const headers = {
    ...(opt.headers || {}),
    "Accept":"application/json"
  };

  const currentToken =
    getToken();

  if(currentToken){

    headers.Authorization =
      "Bearer " +
      currentToken;

  }

  if(
    opt.body &&
    typeof opt.body !== "string"
  ){

    headers["Content-Type"] =
      "application/json";

    opt.body =
      JSON.stringify(
        opt.body
      );

  }

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      ()=>{
        controller.abort();
      },
      10000
    );

  try{

    const r =
      await fetch(
        url,
        {
          ...opt,
          headers,
          signal:
            controller.signal,
          cache:"no-store",
          credentials:"same-origin"
        }
      );

    const raw =
      await r.text();

    let data = {};

    try{

      data =
        raw
          ? JSON.parse(raw)
          : {};

    }catch{

      data = {};

    }

    if(!r.ok){

      throw new Error(
        data.error ||
        data.message ||
        (
          "Sunucu hatası (" +
          r.status +
          ")"
        )
      );

    }

    return data;

  }catch(error){

    if(
      error?.name ===
      "AbortError"
    ){

      throw new Error(
        "Sunucu yanıt vermedi. İnternet bağlantını kontrol et."
      );

    }

    throw error;

  }finally{

    clearTimeout(
      timeout
    );

  }

}


/* =========================================================
   GÜVENLİ HTML
========================================================= */

function escapeHtml(s){

  return String(s ?? "")
    .replace(
      /[&<>"']/g,
      c=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );

}


/* =========================================================
   OBJE İÇİNDEN USER / PROFILE BUL
========================================================= */

function unwrapUser(data){

  if(!data){
    return null;
  }

  if(
    data.profile &&
    typeof data.profile === "object"
  ){

    return data.profile;

  }

  if(
    data.user &&
    typeof data.user === "object"
  ){

    if(
      data.user.profile &&
      typeof data.user.profile === "object"
    ){

      return {
        ...data.user.profile,
        ...data.user
      };

    }

    return data.user;

  }

  if(
    data.data &&
    typeof data.data === "object"
  ){

    if(data.data.profile){

      return data.data.profile;

    }

    if(data.data.user){

      return data.data.user;

    }

    return data.data;

  }

  return data;

}


/* =========================================================
   LOCAL STORAGE KULLANICI BİLGİSİ
========================================================= */

function getStoredUser(){

  const keys = [
    "minegram_user",
    "minegram_profile",
    "user",
    "currentUser"
  ];

  for(const key of keys){

    try{

      const raw =
        localStorage.getItem(
          key
        );

      if(!raw){
        continue;
      }

      const parsed =
        JSON.parse(raw);

      if(
        parsed &&
        typeof parsed === "object"
      ){

        return parsed;

      }

    }catch(e){

      console.warn(
        "[Minegram] " +
        key +
        " okunamadı:",
        e
      );

    }

  }

  return null;

}


/* =========================================================
   DEĞERİ GÜVENLİ AL
========================================================= */

function firstValue(...values){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(
        value
      ).trim();

    }

  }

  return "";

}


/* =========================================================
   KULLANICI ADINI BUL
========================================================= */

function getLocalUsername(){

  const storedUser =
    getStoredUser();

  /*
    ÖNEMLİ:
    Kayıt sırasında oluşturulan gerçek kullanıcı adı,
    eski/stale minegram_username değerinden önce kontrol edilir.
  */

  const candidates = [

    storedUser?.username,

    storedUser?.user?.username,

    storedUser?.profile?.username,

    localStorage.getItem(
      "minegram_register_username"
    ),

    localStorage.getItem(
      "minegram_username"
    ),

    localStorage.getItem(
      "username"
    )

  ];

  for(const value of candidates){

    if(
      value &&
      String(value).trim()
    ){

      return String(
        value
      ).trim();

    }

  }

  return "";

}


/* =========================================================
   KULLANICI ID BUL
========================================================= */

function getLocalUserId(){

  const storedUser =
    getStoredUser();

  return firstValue(

    storedUser?.id,

    storedUser?.user?.id,

    storedUser?.profile?.id,

    storedUser?.auth_user_id,

    storedUser?.user?.auth_user_id,

    localStorage.getItem(
      "minegram_user_id"
    )

  );

}


/* =========================================================
   SUNUCUDAN USERNAME BUL
========================================================= */

function getServerUsername(user){

  if(!user){
    return "";
  }

  const u =
    unwrapUser(user);

  return firstValue(

    u?.username,

    u?.user_name,

    u?.user?.username,

    u?.profile?.username,

    u?.data?.username

  );

}


/* =========================================================
   SUNUCUDAN ID BUL
========================================================= */

function getServerUserId(user){

  if(!user){
    return "";
  }

  const u =
    unwrapUser(user);

  return firstValue(

    u?.id,

    u?.auth_user_id,

    u?.user_id,

    u?.user?.id,

    u?.user?.auth_user_id,

    u?.profile?.id

  );

}


/* =========================================================
   CURRENT USER'I LOCAL STORAGE'A KAYDET
========================================================= */

function saveCurrentUser(profile){

  try{

    const cleanProfile =
      unwrapUser(
        profile
      ) || {};

    const oldUser =
      getStoredUser() || {};

    const username =
      firstValue(
        cleanProfile.username,
        oldUser.username,
        localStorage.getItem(
          "minegram_register_username"
        )
      );

    const id =
      firstValue(
        cleanProfile.id,
        cleanProfile.auth_user_id,
        oldUser.id,
        oldUser.auth_user_id
      );

    const merged = {
      ...oldUser,
      ...(
        me &&
        typeof me === "object"
          ? unwrapUser(me) || {}
          : {}
      ),
      ...cleanProfile
    };

    if(username){

      merged.username =
        username;

      localStorage.setItem(
        "minegram_username",
        username
      );

    }

    if(id){

      merged.id =
        id;

      localStorage.setItem(
        "minegram_user_id",
        id
      );

    }

    localStorage.setItem(
      "minegram_user",
      JSON.stringify(
        merged
      )
    );

    localStorage.setItem(
      "minegram_profile",
      JSON.stringify(
        cleanProfile
      )
    );

  }catch(e){

    console.warn(
      "[Minegram] Kullanıcı localStorage'a kaydedilemedi:",
      e
    );

  }

}


/* =========================================================
   PROFİLİ EKRANA YAZ
========================================================= */

function renderProfile(profile,username){

  const p =
    unwrapUser(
      profile
    ) || {};

  const realUsername =
    firstValue(
      p.username,
      username
    );

  document.getElementById(
    "title"
  ).textContent =
    "Profil";

  document.getElementById(
    "username"
  ).innerHTML =
    "@" +
    escapeHtml(
      realUsername
    ) +
    (
      p.verified
        ? ' <span class="verified">✓</span>'
        : ""
    );

  document.getElementById(
    "display"
  ).textContent =
    firstValue(
      p.displayName,
      p.display_name,
      p.name
    );

  document.getElementById(
    "bio"
  ).textContent =
    p.bio || "";

  document.getElementById(
    "postCount"
  ).textContent =
    p.postCount ??
    p.post_count ??
    p.postsCount ??
    0;

  document.getElementById(
    "followers"
  ).textContent =
    p.followers ??
    p.followerCount ??
    p.follower_count ??
    0;

  document.getElementById(
    "following"
  ).textContent =
    p.following ??
    p.followingCount ??
    p.following_count ??
    0;


  /* AVATAR */

  const av =
    document.getElementById(
      "avatar"
    );

  const avatarUrl =
    firstValue(
      p.avatar,
      p.avatar_url,
      p.avatarUrl,
      p.profile_picture,
      p.profilePicture
    );

  if(avatarUrl){

    av.innerHTML =
      '<img src="' +
      escapeHtml(
        avatarUrl
      ) +
      '" alt="Profil fotoğrafı">';

  }else{

    const avatarText =
      firstValue(
        p.displayName,
        p.display_name,
        p.name,
        p.username,
        username,
        "M"
      );

    av.textContent =
      avatarText
        ? avatarText[0].toUpperCase()
        : "M";

  }

}


/* =========================================================
   KENDİ PROFİLİNİ KONTROL ET
========================================================= */

function isOwnProfile(profile,meUser,username){

  const p =
    unwrapUser(
      profile
    ) || {};

  const m =
    unwrapUser(
      meUser
    ) || {};

  const profileId =
    firstValue(
      p.id,
      p.auth_user_id,
      p.user_id
    );

  const myId =
    firstValue(
      m.id,
      m.auth_user_id,
      m.user_id,
      getLocalUserId()
    );

  if(
    profileId &&
    myId &&
    String(profileId) ===
    String(myId)
  ){

    return true;

  }

  const profileUsername =
    firstValue(
      p.username,
      username
    ).toLowerCase();

  const myUsername =
    firstValue(
      getServerUsername(m),
      getLocalUsername()
    ).toLowerCase();

  if(
    profileUsername &&
    myUsername &&
    profileUsername ===
    myUsername
  ){

    return true;

  }

  return false;

}


/* =========================================================
   PROFİL YÜKLE
========================================================= */

async function load(){

  token =
    getToken();

  /*
    Token yoksa önce kayıt sonrası session bilgilerine bak.
    Eğer token gerçekten yoksa girişe gönder.
  */

  if(!token){

    const fallbackUsername =
      getLocalUsername();

    if(
      fallbackUsername
    ){

      console.warn(
        "[Minegram] Kullanıcı bulundu fakat token yok."
      );

    }

    location.href =
      "index.html";

    return;

  }


  const grid =
    document.getElementById(
      "grid"
    );


  try{

    grid.innerHTML =
      '<div class="empty">Profil yükleniyor...</div>';


    /* -----------------------------------------------------
       /api/me
    ----------------------------------------------------- */

    try{

      me =
        await api(
          "/api/me"
        );

      me =
        unwrapUser(
          me
        ) || me;

      console.log(
        "[MINEGRAM] /api/me:",
        me
      );

    }catch(meError){

      console.warn(
        "[MINEGRAM] /api/me okunamadı:",
        meError
      );

      me = null;

    }


    /* -----------------------------------------------------
       KULLANICI ADI

       BAŞKA PROFİL AÇILDIYSA target kullanılır.

       Normal profile.html'de ise gerçek giriş yapan
       kullanıcı önceliklidir.
    ----------------------------------------------------- */

    const storedUser =
      getStoredUser();

    let username = "";


    if(target){

      username =
        target;

    }else{

      username =
        firstValue(

          getServerUsername(me),

          storedUser?.username,

          storedUser?.user?.username,

          storedUser?.profile?.username,

          localStorage.getItem(
            "minegram_register_username"
          ),

          localStorage.getItem(
            "minegram_username"
          ),

          localStorage.getItem(
            "username"
          )

        );

    }


    console.log(
      "[MINEGRAM] Bulunan kullanıcı adı:",
      username
    );


    if(!username){

      throw new Error(
        "Giriş yapan hesabın kullanıcı adı bulunamadı. Lütfen çıkış yapıp tekrar giriş yap."
      );

    }


    /* -----------------------------------------------------
       PROFİLİ SUNUCUDAN AL
    ----------------------------------------------------- */

    const profileResponse =
      await api(
        "/api/users/" +
        encodeURIComponent(
          username
        )
      );


    currentProfile =
      unwrapUser(
        profileResponse
      );


    if(
      !currentProfile ||
      typeof currentProfile !== "object"
    ){

      throw new Error(
        "Profil bilgileri bulunamadı."
      );

    }


    console.log(
      "[MINEGRAM] Profil:",
      currentProfile
    );


    /* -----------------------------------------------------
       SUNUCUDAN GERÇEK USERNAME GELDİYSE ONU KULLAN
    ----------------------------------------------------- */

    const serverProfileUsername =
      firstValue(
        currentProfile.username,
        username
      );


    if(serverProfileUsername){

      localStorage.setItem(
        "minegram_username",
        serverProfileUsername
      );

    }


    /* -----------------------------------------------------
       PROFİL / USER STORAGE
    ----------------------------------------------------- */

    saveCurrentUser(
      currentProfile
    );


    /* -----------------------------------------------------
       PROFİLİ EKRANA BAS
    ----------------------------------------------------- */

    renderProfile(
      currentProfile,
      serverProfileUsername
    );


    /* -----------------------------------------------------
       KENDİ PROFİLİ Mİ?
    ----------------------------------------------------- */

    const mine =
      isOwnProfile(
        currentProfile,
        me,
        serverProfileUsername
      );


    console.log(
      "[MINEGRAM] Kendi profilim:",
      mine
    );


    /* -----------------------------------------------------
       DÜZENLE / TAKİP BUTONU
    ----------------------------------------------------- */

    const edit =
      document.getElementById(
        "editBtn"
      );


    edit.textContent =
      mine
        ? "✎  Profil düzenle"
        : (
            currentProfile.followingByMe
              ? "Takibi Bırak"
              : "Takip Et"
          );


    edit.classList.toggle(
      "primary",
      mine ||
      !currentProfile.followingByMe
    );


    /* -----------------------------------------------------
       GÖNDERİLER
    ----------------------------------------------------- */

    const postsResponse =
      await api(
        "/api/users/" +
        encodeURIComponent(
          serverProfileUsername
        ) +
        "/posts"
      );


    let posts =
      postsResponse;


    if(
      postsResponse &&
      !Array.isArray(postsResponse)
    ){

      posts =
        postsResponse.posts ||
        postsResponse.data ||
        postsResponse.items ||
        [];

    }


    renderPosts(
      Array.isArray(posts)
        ? posts
        : []
    );


  }catch(e){

    console.error(
      "[Minegram] Profil yükleme hatası:",
      e
    );


    grid.innerHTML =
      '<div class="empty">' +
      "Profil yüklenemedi.<br><br>" +
      escapeHtml(
        e.message ||
        "Bilinmeyen hata"
      ) +
      "</div>";


    toast(
      e.message ||
      "Profil yüklenemedi"
    );

  }

}


/* =========================================================
   GÖNDERİLERİ RENDER
========================================================= */

function renderPosts(posts){

  const grid =
    document.getElementById(
      "grid"
    );


  if(
    !Array.isArray(posts) ||
    posts.length === 0
  ){

    grid.innerHTML =
      '<div class="empty">Henüz gönderi yok</div>';

    return;

  }


  grid.innerHTML =
    posts.map(
      x=>{

        const media =
          x.media ||
          x.image ||
          x.image_url ||
          x.media_url ||
          x.imageUrl ||
          x.mediaUrl ||
          "";


        if(media){

          return (
            '<div class="tile">' +
            '<img src="' +
            escapeHtml(
              media
            ) +
            '" loading="lazy" alt="Gönderi">' +
            "</div>"
          );

        }


        return (
          '<div class="tile">' +
          '<div class="txt">' +
          escapeHtml(
            x.caption ||
            x.text ||
            ""
          ) +
          "</div>" +
          "</div>"
        );

      }
    ).join("");

}

/* =========================================================
   MODAL AÇ
========================================================= */

function openModal(id){

  const m =
    document.getElementById(
      id
    );


  if(!m){
    return;
  }


  m.classList.add(
    "open"
  );


  m.setAttribute(
    "aria-hidden",
    "false"
  );

}


/* =========================================================
   MODAL KAPAT
========================================================= */

function closeModal(id){

  const m =
    document.getElementById(
      id
    );


  if(!m){
    return;
  }


  m.classList.remove(
    "open"
  );


  m.setAttribute(
    "aria-hidden",
    "true"
  );

}

========================================================= */

document
  .getElementById("shareBtn")
  .addEventListener(
    "click",
    async()=>{

      if(!currentProfile){

        toast(
          "Profil henüz yüklenmedi"
        );

        return;

      }


      const username =
        currentProfile.username ||
        getLocalUsername();

      const url =
        location.origin +
        location.pathname +
        "?username=" +
        encodeURIComponent(
          username
        );


      try{

        if(
          navigator.share
        ){

          await navigator.share(
            {
              title:
                "Minegram profili",

              text:
                "@" +
                username,

              url
            }
          );

        }else{

          await navigator.clipboard.writeText(
            url
          );


          toast(
            "Profil bağlantısı kopyalandı"
          );

        }

      }catch(e){

        if(
          e.name !==
          "AbortError"
        ){

          toast(
            "Paylaşım başarısız"
          );

        }

      }

    }
  );
