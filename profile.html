<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Minegram • Profil</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100%;
  overflow-x:hidden
}

button{
  font:inherit;
  cursor:pointer
}

.app{
  min-height:100dvh;
  background:#000;
  padding-bottom:78px
}

.header{
  height:62px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #181818;
  position:sticky;
  top:0;
  background:#000;
  z-index:20
}

.back,
.headmore{
  border:0;
  background:none;
  color:#fff
}

.back{
  font-size:28px;
  width:38px
}

.title{
  font-size:18px;
  font-weight:700
}

.headmore{
  margin-left:auto;
  font-size:25px;
  width:38px
}

.profile{
  width:100%;
  padding:18px 20px 0
}

.top{
  display:flex;
  gap:18px;
  align-items:center;
  max-width:900px
}

.avatar{
  width:68px;
  height:68px;
  border-radius:50%;
  background:#398bc4;
  display:grid;
  place-items:center;
  font-size:24px;
  overflow:hidden;
  flex:none
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}

.info{
  min-width:0;
  flex:1
}

.username{
  font-size:20px;
  font-weight:700
}

.verified{
  color:#398bc4
}

.display{
  font-size:14px;
  margin-top:4px
}

.bio{
  color:#aaa;
  font-size:13px;
  line-height:1.35;
  margin-top:6px;
  white-space:pre-wrap
}

.profile-extra{
  display:none;
  flex-direction:column;
  gap:4px;
  margin-top:8px;
  font-size:13px
}

.profile-extra a{
  color:#398bc4;
  text-decoration:none
}

.stats{
  display:flex;
  justify-content:flex-start;
  gap:42px;
  text-align:center;
  margin:18px 0 12px;
  max-width:500px
}

.stat{
  min-width:65px;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent
}

.stat:active{
  opacity:.65
}

.stat b{
  display:block;
  font-size:16px
}

.stat span{
  font-size:11px;
  color:#aaa
}

.actions{
  display:flex;
  gap:8px;
  width:100%;
  max-width:100%
}

.actions button{
  flex:1;
  height:38px;
  border:1px solid #3a3a3a;
  background:#000;
  color:#fff;
  border-radius:8px;
  font-size:13px;
  font-weight:600
}

.actions .primary{
  background:#398bc4;
  border-color:#398bc4;
  color:#07131c
}

/* HIGHLIGHTS */

.highlights-section{
  margin-top:14px
}

.highlights-section h2{
  margin:0 0 10px;
  font-size:21px
}

.highlights{
  display:flex;
  gap:18px;
  overflow-x:auto;
  padding:4px 0 12px;
  scrollbar-width:none
}

.highlights::-webkit-scrollbar{
  display:none
}

.highlight{
  flex:0 0 82px;
  text-align:center;
  border:0;
  background:none;
  color:#fff;
  padding:0
}

.highlight-cover{
  width:76px;
  height:76px;
  border-radius:50%;
  border:1.5px solid #aaa;
  overflow:hidden;
  background:#000;
  margin:auto;
  display:grid;
  place-items:center;
  font-size:32px
}

.highlight-cover img{
  width:100%;
  height:100%;
  object-fit:cover
}

.highlight-title{
  display:block;
  margin-top:7px;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

/* ACCOUNT */

.account-actions{
  margin-top:2px
}

.account-row{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:66px;
  padding:10px 4px;
  border-bottom:1px solid #181818
}

.account-row .ico{
  width:25px;
  text-align:center;
  font-size:18px
}

.account-row .copy{
  flex:1
}

.account-row strong{
  display:block;
  font-size:13px
}

.account-row small{
  display:block;
  color:#777;
  margin-top:3px;
  font-size:11px
}

.account-row button{
  border:0;
  background:none;
  color:#398bc4;
  font-size:12px
}

/* TABS */

.tabs{
  display:flex;
  border-top:1px solid #222;
  border-bottom:1px solid #222;
  margin-top:18px
}

.tab{
  flex:1;
  height:44px;
  border:0;
  background:none;
  color:#777;
  font-size:22px
}

.tab.active{
  color:#fff;
  border-bottom:2px solid #fff
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  margin-top:2px
}

.tile{
  position:relative;
  aspect-ratio:1/1;
  background:#111;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  padding:0;
  color:#fff
}

.tile img{
  width:100%;
  height:100%;
  object-fit:cover
}

.tile .txt{
  padding:10px;
  font-size:12px;
  color:#ccc
}

.tile-views{
  position:absolute;
  left:7px;
  bottom:7px;
  display:flex;
  align-items:center;
  gap:4px;
  background:rgba(0,0,0,.65);
  padding:4px 7px;
  border-radius:8px;
  font-size:10px;
  color:#fff
}

.tile-views svg{
  width:13px;
  height:13px;
  fill:none;
  stroke:#fff;
  stroke-width:1.7
}

.empty{
  text-align:center;
  color:#777;
  padding:60px 20px;
  grid-column:1/-1
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  padding:5px 4px max(5px,env(safe-area-inset-bottom));
  display:flex;
  background:#19171f;
  border-top:1px solid #25232c;
  z-index:30
}

.nav{
  flex:1;
  border:0;
  background:none;
  color:#ddd;
  font-size:9px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px
}

.nav span{
  font-size:22px
}

.nav.active span{
  background:#3b3450;
  border-radius:18px;
  padding:3px 13px
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translateX(-50%);
  background:#24222a;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:200
}

.toast.show{
  opacity:1
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:90;
  padding:20px
}

.modal.open{
  display:flex
}

.dialog{
  width:min(430px,100%);
  background:#17161b;
  border:1px solid #333;
  border-radius:16px;
  padding:18px
}

.dialog h3{
  margin:0 0 14px;
  font-size:19px
}

.dialog input,
.dialog textarea{
  width:100%;
  background:#0c0c0e;
  color:#fff;
  border:1px solid #444;
  border-radius:10px;
  padding:11px;
  outline:none;
  margin-bottom:10px
}

.dialog textarea{
  min-height:90px;
  resize:none
}

.dialog-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px
}

.dialog-actions button{
  border:0;
  border-radius:9px;
  padding:9px 14px
}

/* HIGHLIGHT VIEWER */

.highlight-viewer{
  position:fixed;
  inset:0;
  background:#000;
  z-index:120;
  display:none;
  align-items:center;
  justify-content:center
}

.highlight-viewer.open{
  display:flex
}

.highlight-viewer img,
.highlight-viewer video{
  max-width:100%;
  max-height:100%;
  object-fit:contain
}

.highlight-viewer-back{
  position:absolute;
  top:14px;
  left:14px;
  z-index:2;
  border:0;
  background:rgba(0,0,0,.55);
  color:#fff;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:26px
}

.highlight-viewer-title{
  position:absolute;
  left:70px;
  right:70px;
  top:22px;
  text-align:center;
  font-weight:700;
  z-index:2
}

#highlightViewContent{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center
}

/* USER LIST */

.profile-list-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:130
}

.profile-list-modal.open{
  display:flex
}

.profile-list-dialog{
  width:min(520px,100%);
  max-height:78dvh;
  background:#17161b;
  border:1px solid #333;
  border-radius:18px 18px 0 0;
  padding:16px;
  overflow:auto
}

.profile-list-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px
}

.profile-list-head strong{
  font-size:17px
}

.profile-list-close{
  border:0;
  background:none;
  color:#fff;
  font-size:25px
}

.profile-list-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 2px;
  border-bottom:1px solid #26252b;
  cursor:pointer
}

.profile-list-item img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#398bc4
}

.profile-list-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#398bc4;
  display:grid;
  place-items:center;
  font-weight:700
}

.profile-list-copy{
  flex:1;
  min-width:0
}

.profile-list-copy strong{
  display:block;
  font-size:14px
}

.profile-list-copy small{
  display:block;
  color:#888;
  margin-top:3px
}

/* RESPONSIVE */

@media(max-width:600px){

  .profile{
    padding-left:14px;
    padding-right:14px
  }

  .stats{
    gap:24px
  }

  .username{
    font-size:18px
  }

  .display{
    font-size:13px
  }

  .bio{
    font-size:12px
  }

  .highlight-cover{
    width:70px;
    height:70px
  }

  .highlight{
    flex-basis:76px
  }

  .highlight-title{
    font-size:12px
  }
}
</style>
</head>

<body>

<script>

'use strict';


/* =========================================================
   GENEL
   ========================================================= */

const params =
  new URLSearchParams(location.search);

const target =
  (
    params.get('username') ||
    params.get('user') ||
    ''
  ).trim();

let me = null;
let currentProfile = null;
let currentPosts = [];
let currentHighlights = [];
let openedHighlightIndex = -1;


/* =========================================================
   TOKEN
   ========================================================= */

function getToken(){

  const keys = [
    'minegram_token',
    'minegram_access_token',
    'minegram_supabase_token',
    'access_token',
    'token'
  ];

  for(const key of keys){

    const value =
      localStorage.getItem(key);

    if(
      value &&
      value !== 'null' &&
      value !== 'undefined'
    ){

      return value;
    }
  }

  return '';
}


/* =========================================================
   USER
   ========================================================= */

function unwrapUser(data){

  return (
    data?.user ||
    data?.profile ||
    data?.data?.user ||
    data?.data?.profile ||
    data?.data ||
    data ||
    {}
  );
}


function cleanUsername(value){

  return String(value || '')
    .trim()
    .replace(/^@+/, '');
}


function normalizeUser(data){

  const u =
    unwrapUser(data);

  const number =
    value => {

      const n =
        Number(value);

      return Number.isFinite(n) &&
             n >= 0
        ? n
        : 0;
    };

  return {

    ...u,

    id:
      u.id ||
      u.user_id ||
      u.auth_user_id ||
      '',

    username:
      cleanUsername(
        u.username ||
        u.user_name ||
        u.handle ||
        u.user?.username ||
        ''
      ),

    displayName:
      u.displayName ||
      u.display_name ||
      u.full_name ||
      u.name ||
      '',

    bio:
      u.bio ||
      '',

    avatar:
      u.avatar ||
      u.avatar_url ||
      u.avatarUrl ||
      '',

    verified:
      !!(
        u.verified ||
        u.is_verified
      ),

    postCount:
      number(
        u.postCount ??
        u.post_count ??
        u.posts_count ??
        u.postsCount ??
        u.total_posts ??
        u.posts_total ??
        u.posts?.length
      ),

    followers:
      number(
        u.followers ??
        u.followerCount ??
        u.follower_count ??
        u.followers_count ??
        u.followersCount
      ),

    following:
      number(
        u.following ??
        u.followingCount ??
        u.following_count ??
        u.followings_count
      ),

    followingByMe:
      Boolean(
        u.followingByMe ??
        u.following_by_me ??
        u.is_following ??
        false
      )
  };
}


/* =========================================================
   LOCAL USER
   ========================================================= */

function getSavedUser(){

  const keys = [
    'minegram_user',
    'minegram_current_user',
    'currentUser',
    'user'
  ];

  for(const key of keys){

    try{

      const raw =
        localStorage.getItem(key);

      const user =
        normalizeUser(
          JSON.parse(raw || 'null')
        );

      if(
        user.username ||
        user.id
      ){

        return user;
      }

    }catch(e){}
  }

  return normalizeUser({

    username:
      localStorage.getItem(
        'minegram_register_username'
      ) ||
      localStorage.getItem(
        'minegram_username'
      ) ||
      localStorage.getItem(
        'username'
      ) ||
      '',

    displayName:
      localStorage.getItem(
        'minegram_display_name'
      ) || '',

    bio:
      localStorage.getItem(
        'minegram_bio'
      ) || '',

    avatar:
      localStorage.getItem(
        'minegram_avatar'
      ) || ''
  });
}


function saveCurrentSessionUser(data){

  const user =
    normalizeUser(data);

  if(
    !user.username &&
    !user.id
  ){
    return;
  }

  localStorage.setItem(
    'minegram_user',
    JSON.stringify(user)
  );

  if(user.username){

    localStorage.setItem(
      'minegram_username',
      user.username
    );

    localStorage.setItem(
      'minegram_register_username',
      user.username
    );
  }

  if(user.id){

    localStorage.setItem(
      'minegram_user_id',
      String(user.id)
    );
  }
}


/* =========================================================
   TOAST
   ========================================================= */

function toast(message){

  const el =
    document.getElementById('toast');

  if(!el) return;

  el.textContent =
    message;

  el.classList.add('show');

  clearTimeout(
    window.__minegramToast
  );

  window.__minegramToast =
    setTimeout(
      () => {
        el.classList.remove('show');
      },
      2200
    );
}


/* =========================================================
   API
   ========================================================= */

async function api(url, options = {}){

  const token =
    getToken();

  options.headers = {

    ...(options.headers || {}),

    ...(token
      ? {
          Authorization:
            'Bearer ' + token
        }
      : {})
  };

  if(
    options.body &&
    typeof options.body !== 'string' &&
    !(options.body instanceof FormData)
  ){

    options.headers[
      'Content-Type'
    ] =
      'application/json';

    options.body =
      JSON.stringify(
        options.body
      );
  }

  const response =
    await fetch(
      url,
      options
    );

  if(!response.ok){

    const data =
      await response
        .json()
        .catch(
          () => ({})
        );

    const error =
      new Error(
        data.error ||
        data.message ||
        'İşlem başarısız'
      );

    error.status =
      response.status;

    throw error;
  }

  const text =
    await response.text();

  if(!text){
    return {};
  }

  try{

    return JSON.parse(text);

  }catch(e){

    return {
      data:text
    };
  }
}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(value){

  return String(
    value ?? ''
  ).replace(
    /[&<>"']/g,
    char => ({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'

    }[char])
  );
}

/* =========================================================
   HIGHLIGHT HELPERS
   ========================================================= */

function highlightMedia(item){

  return String(
    item?.media_url ||
    item?.mediaUrl ||
    item?.image ||
    item?.media ||
    item?.url ||
    ''
  ).trim();
}


function highlightTitle(item){

  return String(
    item?.title ||
    item?.name ||
    'Öne çıkan'
  ).trim() ||
  'Öne çıkan';
}


function highlightType(item){

  const type =
    String(
      item?.media_type ||
      item?.mediaType ||
      item?.type ||
      ''
    ).toLowerCase();

  const media =
    highlightMedia(item);

  return (
    type.includes('video') ||
    /\.(mp4|webm|mov|m4v)(\?|$)/i.test(
      media
    )
  )
    ? 'video'
    : 'image';
}

   ========================================================= */

function renderHighlights(){

  const section =
    document.getElementById(
      'highlightsSection'
    );

  const box =
    document.getElementById(
      'highlights'
    );

  if(!section || !box){
    return;
  }

      currentProfile &&
      me &&

        currentProfile.id || ''
      ) ===
      String(
        me.id || ''
      )
    );

    !mine &&
    !currentHighlights.length;

    '';

      document.createElement(
        'button'
      );

    add.className =
      'highlight';

    add.type =
      'button';

    add.innerHTML =
      '<span class="highlight-cover">＋</span>' +
      '<span class="highlight-title">Yeni</span>';

    add.onclick =
      addHighlight;

    box.appendChild(
      add
    );
  }

  currentHighlights
    .forEach(
      (item,index) => {

        const media =
          highlightMedia(
            item
          );

        if(!media){
          return;
        }

        const button =
          document.createElement(
            'button'
          );

        button.className =
          'highlight';

        button.type =
          'button';

        const cover =

          );

          );
        }

        const title =
          document.createElement(
            'span'
          );

        title.className =
          'highlight-title';

        title.textContent =
          highlightTitle(
            item
          );

        button.append(
          cover,
          title
        );

        button.onclick =
          () =>
            openHighlightView(
              index
            );

        box.appendChild(
          button
        );
      }
    );
}


/* =========================================================
   LOAD HIGHLIGHTS
   ========================================================= */

async function refreshHighlights(
  username
){

  try{

    const raw =
      await api(
        '/api/users/' +
        encodeURIComponent(
          username
        ) +
        '/highlights'
      );

    currentHighlights =
      Array.isArray(raw)
        ? raw
        : (
            Array.isArray(
              raw?.highlights
            )
              ? raw.highlights
              : (
                  Array.isArray(
                    raw?.data
                  )
                    ? raw.data
                    : (
                        Array.isArray(
                          raw?.data?.highlights
                        )
                          ? raw.data.highlights
                          : []
                      )
                )
          );

    if(currentProfile){

      currentProfile.highlights =
        currentHighlights;
    }

  }catch(error){

    console.error(
      'HIGHLIGHTS LOAD ERROR:',
      error
    );

    currentHighlights =
      [];

    if(currentProfile){

      currentProfile.highlights =
        [];
    }
  }

  renderHighlights();
}


/* =========================================================
   ADD HIGHLIGHT
   ========================================================= */

async function addHighlight(){

  if(
    !currentProfile ||
    !me ||
    String(
      currentProfile.id || ''
    ) !==
    String(
      me.id || ''
    )
  ){

    toast(
      'Sadece kendi profilinde öne çıkan ekleyebilirsin'
    );

    return;
  }

  const input =
    document.createElement(
      'input'
    );

  input.type =
    'file';

  input.accept =
    'image/*,video/*';

  input.style.display =
    'none';

  document.body.appendChild(
    input
  );

  input.onchange =
    async () => {

      const file =
        input.files?.[0];

      input.remove();

      if(!file){
        return;
      }

      let title =
        prompt(
          'Öne çıkan başlığı:',
          'Öne çıkan'
        );

      if(title === null){
        return;
      }

      title =
        title.trim() ||
        'Öne çıkan';

      try{

        const formData =
          new FormData();

        formData.append(
          'media',
          file
        );

        formData.append(
          'title',
          title
        );

        const raw =
          await api(
            '/api/highlights',
            {
              method:'POST',
              body:formData
            }
          );

        const created =
          raw?.highlight ||
          raw?.data ||
          raw;

        if(created){

          currentHighlights =
            [
              ...currentHighlights,
              created
            ];
        }

        await refreshHighlights(
          currentProfile.username
        );

        toast(
          'Öne çıkan eklendi'
        );

      }catch(error){

        console.error(
          error
        );

        toast(
          error.message ||
          'Öne çıkan yüklenemedi'
        );
      }
    };

  input.click();
}

    document.getElementById(
      'highlightViewTitle'
    );

  if(!screen || !content){
    return;
  }

  if(title){

  if(
    highlightType(item) ===

  ){

      document.createElement(
        'video'
      );

    document.getElementById(
      'highlightViewScreen'

    document.getElementById(
      'highlightViewContent'

      'aria-hidden',
      'true'
    );
  }

  if(content){

    content.innerHTML =
      '';
  }

  openedHighlightIndex =
    -1;
}


/* =========================================================
   POSTS
   ========================================================= */

function renderPosts(posts){

  currentPosts =
    Array.isArray(posts)
      ? posts
      : [];

  const grid =
    document.getElementById(
      'grid'
    );

  if(!grid){
    return;
  }

  if(!currentPosts.length){

    grid.innerHTML =
      '<div class="empty">Henüz gönderi yok</div>';

    return;
  }

  const eyeIcon =
    '<svg viewBox="0 0 24 24">' +
      '<path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"></path>' +
      '<circle cx="12" cy="12" r="2.8"></circle>' +
    '</svg>';

  const formatViews =
    value => {

      const n =
        Number(
          value || 0
        );

      if(
        !Number.isFinite(n)
      ){

        return '0';
      }

      if(n >= 1000000){

        return (
          n / 1000000
        )
        .toFixed(
          n % 1000000
            ? 1
            : 0
        )
        .replace(
          '.0',
          ''
        ) +
        ' mn';
      }

      if(n >= 10000){

        return (
          n / 1000
        )
        .toFixed(
          n % 1000
            ? 1
            : 0
        )
        .replace(
          '.0',
          ''
        ) +
        ' bin';
      }

      return n.toLocaleString(
        'tr-TR'
      );
    };

  grid.innerHTML =
    currentPosts
      .map(
        post => {

          const media =
            post.media ||
            post.media_url ||
            post.mediaUrl ||
            post.image ||
            '';

          const views =
            post.views ??
            post.viewCount ??
            post.view_count ??
            post.viewsCount ??
            post.impressions ??
            0;

          const encoded =
            encodeURIComponent(
              JSON.stringify(
                post
              )
            );

          const viewHtml =
            '<span class="tile-views">' +
              eyeIcon +
              '<span>' +
                escapeHtml(
                  formatViews(
                    views
                  )
                ) +
              '</span>' +
            '</span>';

          if(media){

            return `
              <button
                type="button"
                class="tile post-tile"
                data-post="${escapeHtml(encoded)}">

                <img
                  src="${escapeHtml(media)}"
                  loading="lazy"
                  alt="Gönderi">

                ${viewHtml}

              </button>
            `;
          }

          return `
            <button
              type="button"
              class="tile post-tile"
              data-post="${escapeHtml(encoded)}">

              <div class="txt">
                ${escapeHtml(
                  post.caption ||
                  ''
                )}
              </div>

              ${viewHtml}

            </button>
          `;
        }
      )
      .join('');

  grid
    .querySelectorAll(
      '.post-tile'
    )
    .forEach(
      tile => {

        tile.onclick =
          () => {

            try{

              const post =
                JSON.parse(
                  decodeURIComponent(
                    tile.dataset.post ||
                    ''
                  )
                );

              sessionStorage.setItem(
                'minegram_selected_post',
                JSON.stringify(
                  post
                )
              );

              sessionStorage.setItem(
                'minegram_selected_profile',
                JSON.stringify(
                  currentProfile ||
                  {}
                )
              );

              location.href =
                'post.html';

            }catch(error){

              console.error(
                error
              );

              toast(
                'Gönderi açılamadı'
              );
            }
          };
      }
    );
}


/* =========================================================
   PROFILE LOAD
   ========================================================= */

async function load(){

  const token =
    getToken();

  if(!token){

    const saved =
      getSavedUser();

    if(saved.username){

      me =
        saved;

      const username =
        cleanUsername(
          target
        ) ||
        cleanUsername(
          saved.username
        );

      currentProfile =
        {
          ...saved,
          username
        };

      document.getElementById(
        'username'
      ).textContent =
        '@' +
        username;

      document.getElementById(
        'display'
      ).textContent =
        saved.displayName ||
        '';

      document.getElementById(
        'bio'
      ).textContent =
        saved.bio ||
        '';

      document.getElementById(
        'postCount'
      ).textContent =
        Number(
          saved.postCount ||
          0
        );

      document.getElementById(
        'followers'
      ).textContent =
        Number(
          saved.followers ||
          0
        );

      document.getElementById(
        'following'
      ).textContent =
        Number(
          saved.following ||
          0
        );

      const avatar =
        document.getElementById(
          'avatar'
        );

      if(saved.avatar){

        avatar.innerHTML =
          '<img src="' +
          escapeHtml(
            saved.avatar
          ) +
          '" alt="Profil fotoğrafı">';

      }else{

        avatar.textContent =
          (
            saved.displayName ||
            username ||
            'M'
          )
          .trim()
          .charAt(0)
          .toUpperCase();
      }

      renderProfileExtra();

      renderHighlights();

      renderPosts([]);

      return;
    }

    location.replace(
      'giris.html'
    );

    return;
  }

  try{

    const meRaw =
      await api(
        '/api/me'
      );

    me =
      normalizeUser(
        meRaw
      );

    if(!me.username){

      const saved =
        getSavedUser();

      if(saved.username){

        me = {
          ...saved,
          ...me
        };
      }
    }

    if(!me.username){

      throw new Error(
        'Oturum kullanıcısı bulunamadı.'
      );
    }

    saveCurrentSessionUser(
      me
    );

    const requestedUsername =
      cleanUsername(
        target
      ) ||
      cleanUsername(
        me.username
      );

    const profileRaw =
      await api(
        '/api/users/' +
        encodeURIComponent(
          requestedUsername
        )
      );

    currentProfile =
      normalizeUser(
        profileRaw
      );

    currentProfile.username =
      cleanUsername(
        currentProfile.username
      ) ||
      requestedUsername;

    await refreshHighlights(
      currentProfile.username
    );

    document.getElementById(
      'username'
    ).innerHTML =
      '@' +
      escapeHtml(
        currentProfile.username
      ) +
      (
        currentProfile.verified
          ? ' <span class="verified">✓</span>'
          : ''
      );

    document.getElementById(
      'display'
    ).textContent =
      currentProfile.displayName ||
      '';

    document.getElementById(
      'bio'
    ).textContent =
      currentProfile.bio ||
      '';

    renderProfileExtra();

    const avatar =
      document.getElementById(
        'avatar'
      );

    const avatarUrl =
      currentProfile.avatar ||
      currentProfile.avatar_url ||
      '';

    if(avatarUrl){

      avatar.innerHTML =
        '<img src="' +
        escapeHtml(
          avatarUrl
        ) +
        '" alt="Profil fotoğrafı">';

    }else{

      avatar.textContent =
        (
          currentProfile.displayName ||
          currentProfile.username ||
          'M'
        )
        .trim()
        .charAt(0)
        .toUpperCase();
    }

    let posts = [];

    try{

      const postsRaw =
        await api(
          '/api/users/' +
          encodeURIComponent(
            currentProfile.username
          ) +
          '/posts'
        );

      posts =
        Array.isArray(
          postsRaw
        )
          ? postsRaw
          : (
              Array.isArray(
                postsRaw?.posts
              )
                ? postsRaw.posts
                : (
                    Array.isArray(
                      postsRaw?.data
                    )
                      ? postsRaw.data
                      : (
                          Array.isArray(
                            postsRaw?.data?.posts
                          )
                            ? postsRaw.data.posts
                            : []
                        )
                  )
            );

    }catch(error){

      console.error(
        'POSTS LOAD ERROR:',
        error
      );
    }

    if(
      !currentProfile.postCount ||
      currentProfile.postCount <
        posts.length
    ){

      currentProfile.postCount =
        posts.length;
    }

    document.getElementById(
      'postCount'
    ).textContent =
      String(
        currentProfile.postCount ||
        0
      );

    document.getElementById(
      'followers'
    ).textContent =
      String(
        currentProfile.followers ||
        0
      );

    document.getElementById(
      'following'
    ).textContent =
      String(
        currentProfile.following ||
        0
      );

    const mine =
      String(
        currentProfile.id ||
        ''
      ) ===
      String(
        me.id ||
        ''
      );

    const edit =
      document.getElementById(
        'editBtn'
      );

    if(edit){

      edit.textContent =
        mine
          ? '✎  Profil düzenle'
          : (
              currentProfile.followingByMe
                ? 'Takibi Bırak'
                : 'Takip Et'
            );

      edit.classList.toggle(
        'primary',
        mine ||
        !currentProfile.followingByMe
      );
    }

    const accountActions =
      document.getElementById(
        'accountActions'
      );

    if(accountActions){

      accountActions.style.display =
        mine
          ? ''
          : 'none';
    }

    renderPosts(
      posts
    );

  }catch(error){

    console.error(
      'PROFILE LOAD ERROR:',
      error
    );

    if(
      error.status === 401 ||
      /401|unauthorized|oturum/i.test(
        String(
          error.message ||
          ''
        )
      )
    ){

      [
        'minegram_token',
        'minegram_access_token',
        'minegram_supabase_token',
        'access_token',
        'token'
      ].forEach(
        key =>
          localStorage.removeItem(
            key
          )
      );

      location.replace(
        'giris.html'
      );

      return;
    }

    const grid =
      document.getElementById(
        'grid'
      );

    if(grid){

      grid.innerHTML =
        '<div class="empty">Profil yüklenemedi.</div>';
    }

    toast(
      error.message ||
      'Profil yüklenemedi'
    );
  }
}

                '<div class="profile-list-copy">' +

                  '<strong>' +
                    name +
                  '</strong>' +

                  '<small>@' +
                    escapeHtml(
                      username
                    ) +
                  '</small>' +

                '</div>' +

              '</div>'
            );
          }
        )
        .join('');

    body
      .querySelectorAll(
        '[data-profile-user]'
      )
      .forEach(
        row => {

          row.onclick =
            () => {

              const username =
                row.getAttribute(
                  'data-profile-user'
                );

              if(!username){
                return;
              }

              location.href =
                profileListUserUrl({
                  username
                });
            };
        }
      );

  }catch(error){

    console.error(
      error
    );

    body.innerHTML =
      '<div class="empty" style="padding:35px 10px">Liste yüklenemedi.</div>';

    toast(
      error.message ||
      'Liste yüklenemedi'
    );
  }
}


/* =========================================================
   PROFİL DÜZENLE
   ========================================================= */

function openEditProfile(){

  if(
    !currentProfile ||
    !me
  ){

    return;
  }

  const nameInput =
    document.getElementById(
      'nameInput'
    );

  const bioInput =
    document.getElementById(
      'bioInput'
    );

  if(nameInput){

    nameInput.value =
      currentProfile.displayName ||
      '';
  }

  if(bioInput){

    bioInput.value =
      currentProfile.bio ||
      '';
  }

  openModal(
    'editModal'
  );
}


/* =========================================================
   SAVE PROFILE
   ========================================================= */

async function saveProfile(){

  if(
    !currentProfile ||
    !me
  ){

    return;
  }

  const nameInput =
    document.getElementById(
      'nameInput'
    );

  const bioInput =
    document.getElementById(
      'bioInput'
    );

  const displayName =
    nameInput?.value
      ?.trim() ||
    '';

  const bio =
    bioInput?.value
      ?.trim() ||
    '';

  try{

    await api(
      '/api/me',
      {
        method:'PATCH',
        body:{
          displayName,
          bio
        }
      }
    );

    currentProfile.displayName =
      displayName;

    currentProfile.bio =
      bio;

    document.getElementById(
      'display'
    ).textContent =
      displayName;

    document.getElementById(
      'bio'
    ).textContent =
      bio;

    saveCurrentSessionUser(
      {
        ...me,
        displayName,
        bio
      }
    );

    closeModal(
      'editModal'
    );

    toast(
      'Profil güncellendi'
    );

  }catch(error){

    toast(
      error.message ||
      'Profil güncellenemedi'
    );
  }
}


/* =========================================================
   SHARE
   ========================================================= */

async function shareProfile(){

  if(!currentProfile){
    return;
  }

  const url =
    location.href;

  try{

    if(
      navigator.share
    ){

      await navigator.share({

        title:
          'Minegram profili',

        text:
          '@' +
          currentProfile.username,

        url
      });

    }else if(
      navigator.clipboard
    ){

      await navigator.clipboard
        .writeText(
          url
        );

      toast(
        'Profil bağlantısı kopyalandı'
      );

    }else{

      window.prompt(
        'Profil bağlantısı:',
        url
      );
    }

  }catch(error){

    if(
      error.name !==
      'AbortError'
    ){

      toast(
        'Paylaşım başarısız'
      );
    }
  }
}


/* =========================================================
   FOLLOW / UNFOLLOW
   ========================================================= */

async function toggleFollow(){

  if(
    !currentProfile ||
    !me
  ){

    return;
  }

  if(
    String(
      currentProfile.id ||
      ''
    ) ===
    String(
      me.id ||
      ''
    )
  ){

    openEditProfile();

    return;
  }

  try{

    await api(
      '/api/users/' +
      encodeURIComponent(
        currentProfile.username
      ) +
      '/follow',
      {
        method:'POST'
      }
    );

    await load();

  }catch(error){

    toast(
      error.message ||
      'Takip işlemi başarısız'
    );
  }
}


/* =========================================================
   PHONE
   ========================================================= */

async function addPhone(){

  const phone =
    prompt(
      'Telefon numaranı gir:',
      me?.phone || ''
    );

  if(phone === null){
    return;
  }

  if(!phone.trim()){

    toast(
      'Telefon numarası boş bırakılamaz'
    );

    return;
  }

  try{

    await api(
      '/api/me',
      {
        method:'PATCH',
        body:{
          phone:
            phone.trim()
        }
      }
    );

    toast(
      'Telefon numarası kaydedildi'
    );

  }catch(error){

    toast(
      error.message ||
      'Telefon numarası kaydedilemedi'
    );
  }
}

      return;
    }

    closeModal(
      'editModal'
    );

    closeModal(

    closeHighlightView();
