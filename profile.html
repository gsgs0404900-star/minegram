<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Minegram • Profil</title>

<style>
*{
  box-sizing:border-box
}

html,
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100%;
  overflow-x:hidden
}

button{
  font:inherit;
  cursor:pointer
}

.app{
  min-height:100dvh;
  background:#000;
  padding-bottom:78px
}

.header{
  height:62px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #181818;
  position:sticky;
  top:0;
  background:#000;
  z-index:20
}

.back,
.headmore{
  border:0;
  background:none;
  color:#fff
}

.back{
  font-size:28px;
  width:38px
}

.title{
  font-size:18px;
  font-weight:700
}

.headmore{
  margin-left:auto;
  font-size:25px;
  width:38px
}

.profile{
  width:100%;
  padding:18px 20px 0
}

.top{
  display:flex;
  gap:18px;
  align-items:center;
  max-width:900px
}

.avatar{
  width:68px;
  height:68px;
  border-radius:50%;
  background:#398bc4;
  display:grid;
  place-items:center;
  font-size:24px;
  overflow:hidden;
  flex:none
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}

.info{
  min-width:0;
  flex:1
}

.username{
  font-size:20px;
  font-weight:700
}

.verified{
  color:#398bc4
}

.display{
  font-size:14px;
  margin-top:4px
}

.bio{
  color:#aaa;
  font-size:13px;
  line-height:1.35;
  margin-top:6px
}

.stats{

  justify-content:flex-start;
  gap:42px;
  text-align:center;
  margin:18px 0 12px;
  max-width:500px
}

.stat b{
  display:block;
  font-size:16px
}

.stat span{
  font-size:11px;
  color:#aaa
}

.actions{
  display:flex;
  gap:8px;
  width:100%;
  max-width:100%
}

.actions button{
  flex:1;
  height:38px;
  border:1px solid #3a3a3a;
  background:#000;
  color:#fff;
  border-radius:8px;
  font-size:13px;
  font-weight:600
}

.actions .primary{
  background:#398bc4;
  border-color:#398bc4;
  color:#07131c
}

.tabs{
  display:flex;
  border-top:1px solid #222;
  border-bottom:1px solid #222;
  margin-top:18px
}

.tab{
  flex:1;
  height:44px;
  border:0;
  background:none;
  color:#777;
  font-size:22px
}

.tab.active{
  color:#fff;
  border-bottom:2px solid #fff
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  margin-top:2px
}

.tile{
  aspect-ratio:1/1;
  background:#111;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center
}

.tile img{
  width:100%;
  height:100%;
  object-fit:cover
}

.tile .txt{
  padding:10px;
  font-size:12px;
  color:#ccc
}

.empty{
  text-align:center;
  color:#777;
  padding:60px 20px;
  grid-column:1/-1
}

.account-actions{
  margin-top:2px
}

.account-row{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:66px;
  padding:10px 4px;
  border-bottom:1px solid #181818
}

.account-row .ico{
  width:25px;
  text-align:center;
  font-size:18px
}

.account-row .copy{
  flex:1
}

.account-row strong{
  display:block;
  font-size:13px
}

.account-row small{
  display:block;
  color:#777;
  margin-top:3px;
  font-size:11px
}

.account-row button{
  border:0;
  background:none;
  color:#398bc4;
  font-size:12px
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  padding:5px 4px max(5px,env(safe-area-inset-bottom));
  display:flex;
  background:#19171f;
  border-top:1px solid #25232c;
  z-index:30
}

.nav{
  flex:1;
  border:0;
  background:none;
  color:#ddd;
  font-size:9px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px
}

.nav span{
  font-size:22px
}

.nav.active span{
  background:#3b3450;
  border-radius:18px;
  padding:3px 13px
}

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translateX(-50%);
  background:#24222a;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:100;
  max-width:90%;
  text-align:center
}

.toast.show{
  opacity:1
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:90;
  padding:20px
}

.modal.open{
  display:flex
}

.dialog{
  width:min(430px,100%);
  background:#17161b;
  border:1px solid #333;
  border-radius:16px;
  padding:18px
}

.dialog h3{
  margin:0 0 14px;
  font-size:19px
}

.dialog input,
.dialog textarea{
  width:100%;
  background:#0c0c0e;
  color:#fff;
  border:1px solid #444;
  border-radius:10px;
  padding:11px;
  outline:none;
  margin-bottom:10px
}

.dialog textarea{
  min-height:90px;
  resize:none
}

.dialog-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px
}

.dialog-actions button{
  border:0;
  border-radius:9px;
  padding:9px 14px
}

@media(max-width:600px){

  .profile{
    padding-left:14px;
    padding-right:14px
  }

  .top{
    gap:14px
  }

  .avatar{
    width:64px;
    height:64px
  }

  .stats{
    gap:28px
  }

}
</style>

<script>

/* =========================================================
   MINEGRAM PROFİL
   GERÇEK KULLANICIYI GÜVENLİ ŞEKİLDE BUL
========================================================= */


/* =========================================================
   TOKEN
========================================================= */

function getToken(){

  const candidates = [

    localStorage.getItem('minegram_token'),

    localStorage.getItem('token'),

    localStorage.getItem('access_token'),

    localStorage.getItem('minegram_access_token')

  ];

  for(const value of candidates){

    if(
      value &&
      String(value).trim()
    ){

      return String(value).trim();

    }

  }

  return '';

}


let token =
  getToken();


/* =========================================================
   URL
========================================================= */

const params =
  new URLSearchParams(
    location.search
  );


const target =
  params.get('username');


let me = null;

let currentProfile = null;


/* =========================================================
   TOAST
========================================================= */

function toast(msg){

  const el =
    document.getElementById(
      'toast'
    );

  if(!el){
    return;
  }

  el.textContent =
    msg;

  el.classList.add(
    'show'
  );

  clearTimeout(
    window.__toast
  );

  window.__toast =
    setTimeout(
      ()=>{
        el.classList.remove(
          'show'
        );
      },
      2200
    );

}


/* =========================================================
   API
   10 SANİYE TIMEOUT
========================================================= */

async function api(url,opt={}){

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      ()=>{
        controller.abort();
      },
      10000
    );


  try{

    const headers = {
      ...(opt.headers || {})
    };


    const activeToken =
      getToken();


    if(activeToken){

      headers.Authorization =
        'Bearer ' +
        activeToken;

    }


    if(
      opt.body &&
      typeof opt.body !== 'string'
    ){

      headers['Content-Type'] =
        'application/json';

      opt.body =
        JSON.stringify(
          opt.body
        );

    }


    const r =
      await fetch(
        url,
        {
          ...opt,
          headers,
          signal:
            controller.signal
        }
      );


    let data = {};


    try{

      data =
        await r.json();

    }catch(e){

      data = {};

    }


    if(!r.ok){

      throw new Error(
        data.error ||
        data.message ||
        'İşlem başarısız (' +
        r.status +
        ')'
      );

    }


    return data;

  }catch(e){

    if(
      e.name ===
      'AbortError'
    ){

      throw new Error(
        'Sunucu yanıt vermedi. Lütfen tekrar deneyin.'
      );

    }

    throw e;

  }finally{

    clearTimeout(
      timeout
    );

  }

}


/* =========================================================
   GÜVENLİ HTML
========================================================= */

function escapeHtml(s){

  return String(
    s ?? ''
  )
  .replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}


/* =========================================================
   LOCAL STORAGE KULLANICI
========================================================= */

function getStoredUser(){

  const keys = [

    'minegram_user',

    'user',

    'currentUser'

  ];


  for(
    const key of keys
  ){

    try{

      const raw =
        localStorage.getItem(
          key
        );


      if(!raw){
        continue;
      }


      const parsed =
        JSON.parse(
          raw
        );


      if(parsed){

        return parsed;

      }

    }catch(e){

      console.warn(
        key +
        ' okunamadı:',
        e
      );

    }

  }


  return null;

}


/* =========================================================
   LOCAL USERNAME BUL
========================================================= */

function getLocalUsername(){

  const storedUser =
    getStoredUser();


  const candidates = [

    localStorage.getItem(
      'minegram_username'
    ),

    storedUser?.username,

    storedUser?.user?.username,

    storedUser?.profile?.username,

    localStorage.getItem(
      'minegram_register_username'
    ),

    localStorage.getItem(
      'username'
    )

  ];


  for(
    const value of candidates
  ){

    if(
      value &&
      String(value).trim()
    ){

      return String(
        value
      ).trim();

    }

  }


  return '';

}


/* =========================================================
   LOCAL USER ID
========================================================= */

function getLocalUserId(){

  const storedUser =
    getStoredUser();


  const candidates = [

    localStorage.getItem(
      'minegram_user_id'
    ),

    storedUser?.id,

    storedUser?.user?.id,

    storedUser?.profile?.id

  ];


  for(
    const value of candidates
  ){

    if(
      value !== null &&
      value !== undefined &&
      String(value).trim()
    ){

      return String(
        value
      ).trim();

    }

  }


  return '';

}


/* =========================================================
   SUNUCU USERNAME BUL
========================================================= */

function getServerUsername(user){

  if(!user){
    return '';
  }


  const candidates = [

    user.username,

    user.user?.username,

    user.profile?.username,

    user.data?.username,

    user.data?.user?.username,

    user.account?.username

  ];


  for(
    const value of candidates
  ){

    if(
      value &&
      String(value).trim()
    ){

      return String(
        value
      ).trim();

    }

  }


  return '';

}


/* =========================================================
   SUNUCU USER ID BUL
========================================================= */

function getServerUserId(user){

  if(!user){
    return '';
  }


  const candidates = [

    user.id,

    user.user?.id,

    user.profile?.id,

    user.data?.id,

    user.data?.user?.id

  ];


  for(
    const value of candidates
  ){

    if(
      value !== null &&
      value !== undefined &&
      String(value).trim()
    ){

      return String(
        value
      ).trim();

    }

  }


  return '';

}


/* =========================================================
   KULLANICI BİLGİSİNİ LOCAL STORAGE'A KAYDET
========================================================= */

function saveCurrentUser(profile){

  if(!profile){
    return;
  }


  const username =
    profile.username ||
    profile.user?.username ||
    '';


  const id =
    profile.id ||
    profile.user?.id ||
    '';


  if(username){

    localStorage.setItem(
      'minegram_username',
      String(
        username
      )
    );

  }


  if(id){

    localStorage.setItem(
      'minegram_user_id',
      String(
        id
      )
    );

  }


  try{

    const oldUser =
      getStoredUser() || {};


    const newUser = {

      ...oldUser,

      ...(profile || {}),

      username:
        username ||
        oldUser.username,

      id:
        id ||
        oldUser.id

    };


    localStorage.setItem(
      'minegram_user',
      JSON.stringify(
        newUser
      )
    );

  }catch(e){

    console.warn(
      'minegram_user kaydedilemedi:',
      e
    );

  }

}


/* =========================================================
   PROFİLİ EKRANA YAZ
========================================================= */

function renderProfile(){

  if(!currentProfile){
    return;
  }


  const username =
    currentProfile.username ||
    currentProfile.user?.username ||
    getLocalUsername() ||
    '';


  const displayName =
    currentProfile.displayName ||
    currentProfile.display_name ||
    '';


  const bio =
    currentProfile.bio ||
    '';


  document.getElementById(
    'title'
  ).textContent =
    'Profil';


  document.getElementById(
    'username'
  ).innerHTML =
    '@' +
    escapeHtml(
      username
    ) +
    (
      currentProfile.verified
        ? ' <span class="verified">✓</span>'
        : ''
    );


  document.getElementById(
    'display'
  ).textContent =
    displayName;


  document.getElementById(
    'bio'
  ).textContent =
    bio;


  document.getElementById(
    'postCount'
  ).textContent =
    currentProfile.postCount ??
    currentProfile.post_count ??
    0;


  document.getElementById(
    'followers'
  ).textContent =
    currentProfile.followers ??
    currentProfile.followerCount ??
    currentProfile.follower_count ??
    0;


  document.getElementById(
    'following'
  ).textContent =
    currentProfile.following ??
    currentProfile.followingCount ??
    currentProfile.following_count ??
    0;


  const avatar =
    document.getElementById(
      'avatar'
    );


  const avatarUrl =
    currentProfile.avatar ||
    currentProfile.avatar_url ||
    '';


  if(avatarUrl){

    avatar.innerHTML =
      '<img src="' +
      escapeHtml(
        avatarUrl
      ) +
      '" alt="Profil fotoğrafı">';

  }else{

    const avatarText =
      (
        displayName ||
        username ||
        'M'
      ).trim();


    avatar.textContent =
      avatarText
        ? avatarText[0].toUpperCase()
        : 'M';

  }

}


/* =========================================================
   PROFİL YÜKLE
========================================================= */

async function load(){

  token =
    getToken();


  /* Token yoksa giriş */

  if(!token){

    location.href =
      'index.html';

    return;

  }


  const grid =
    document.getElementById(
      'grid'
    );


  grid.innerHTML =
    '<div class="empty">Profil yükleniyor...</div>';


  try{

    /* -----------------------------------------------------
       /api/me
    ----------------------------------------------------- */

    try{

      me =
        await api(
          '/api/me'
        );

    }catch(meError){

      console.warn(
        '[MINEGRAM] /api/me hatası:',
        meError
      );

      me = null;

    }


    /* -----------------------------------------------------
       GERÇEK USERNAME
    ----------------------------------------------------- */

    const storedUser =
      getStoredUser();


    const serverUsername =
      getServerUsername(
        me
      );


    const localUsername =
      getLocalUsername();


    const username =
      (
        target ||
        serverUsername ||
        localUsername ||
        storedUser?.username ||
        ''
      )
      .toString()
      .trim();


    console.log(
      '[MINEGRAM] /api/me:',
      me
    );


    console.log(
      '[MINEGRAM] Sunucudan username:',
      serverUsername
    );


    console.log(
      '[MINEGRAM] Local username:',
      localUsername
    );


    console.log(
      '[MINEGRAM] Kullanılacak username:',
      username
    );


    if(!username){

      throw new Error(
        'Giriş yapan hesabın kullanıcı adı bulunamadı.'
      );

    }


    /* -----------------------------------------------------
       PROFİLİ GETİR
    ----------------------------------------------------- */

    currentProfile =
      await api(
        '/api/users/' +
        encodeURIComponent(
          username
        )
      );


    if(!currentProfile){

      throw new Error(
        'Profil bilgileri bulunamadı.'
      );

    }


    console.log(
      '[MINEGRAM] Profil:',
      currentProfile
    );


    /* -----------------------------------------------------
       GERÇEK KULLANICI ADINI KAYDET
    ----------------------------------------------------- */

    saveCurrentUser(
      currentProfile
    );


    /* -----------------------------------------------------
       PROFİLİ HEMEN GÖSTER
    ----------------------------------------------------- */

    renderProfile();


    /* -----------------------------------------------------
       KENDİ PROFİLİ Mİ?
    ----------------------------------------------------- */

    const currentId =
      currentProfile.id ??
      currentProfile.auth_user_id ??
      currentProfile.user?.id ??
      '';


    const myId =
      getServerUserId(
        me
      ) ||
      getLocalUserId();


    const mine =
      String(currentId) ===
      String(myId);


    console.log(
      '[MINEGRAM] Profil ID:',
      currentId
    );


    console.log(
      '[MINEGRAM] Benim ID:',
      myId
    );


    console.log(
      '[MINEGRAM] Kendi profilim:',
      mine
    );


    /* -----------------------------------------------------
       DÜZENLE / TAKİP
    ----------------------------------------------------- */

    const edit =
      document.getElementById(
        'editBtn'
      );


    edit.textContent =
      mine
        ? '✎  Profil düzenle'
        : (
            currentProfile.followingByMe
              ? 'Takibi Bırak'
              : 'Takip Et'
          );


    edit.classList.toggle(
      'primary',
      mine ||
      !currentProfile.followingByMe
    );


    /* -----------------------------------------------------
       GÖNDERİLERİ AYRI YÜKLE
    ----------------------------------------------------- */

    try{

      const posts =
        await api(
          '/api/users/' +
          encodeURIComponent(
            username
          ) +
          '/posts'
        );


      renderPosts(
        Array.isArray(posts)
          ? posts
          : []
      );

    }catch(postsError){

      console.warn(
        '[MINEGRAM] Gönderiler yüklenemedi:',
        postsError
      );


      grid.innerHTML =
        '<div class="empty">' +
        'Henüz gönderi yok' +
        '</div>';

    }


  }catch(e){

    console.error(
      '[Minegram] Profil yükleme hatası:',
      e
    );


    grid.innerHTML =
      '<div class="empty">' +
      'Profil yüklenemedi.<br><br>' +
      escapeHtml(
        e.message ||
        'Bilinmeyen hata'
      ) +
      '</div>';


    toast(
      e.message ||
      'Profil yüklenemedi'
    );

  }

}


/* =========================================================
   GÖNDERİLERİ RENDER
========================================================= */

function renderPosts(posts){

  const grid =
    document.getElementById(
      'grid'
    );


  if(
    !Array.isArray(posts) ||
    posts.length === 0
  ){

    grid.innerHTML =
      '<div class="empty">Henüz gönderi yok</div>';

    return;

  }


  grid.innerHTML =
    posts.map(
      x=>{

        const media =
          x.media ||
          x.image ||
          x.image_url ||
          x.media_url ||
          '';


        if(media){

          return (
            '<div class="tile">' +
            '<img src="' +
            escapeHtml(
              media
            ) +
            '" loading="lazy" alt="Gönderi">' +
            '</div>'
          );

        }


        return (
          '<div class="tile">' +
          '<div class="txt">' +
          escapeHtml(
            x.caption ||
            x.text ||
            ''
          ) +
          '</div>' +
          '</div>'
        );

      }
    ).join('');

}

/* =========================================================
   PROFİL DÜZENLE / TAKİP
========================================================= */

document
  .getElementById(
    'editBtn'
  )
  .addEventListener(
    'click',
    async()=>{

      if(!currentProfile){
        return;
      }


      const currentId =
        currentProfile.id ??
        currentProfile.auth_user_id ??
        currentProfile.user?.id ??
        '';


      const myId =
        getServerUserId(
          me
        ) ||
        getLocalUserId();


      const mine =
        String(currentId) ===
        String(myId);


      /* Başka kullanıcı */

      if(!mine){

        try{

          await api(
            '/api/users/' +
            encodeURIComponent(
              currentProfile.username
            ) +
            '/follow',
            {
              method:'POST'
            }
          );


          await load();

        }catch(e){

          toast(
            e.message
          );

        }

        return;

      }


      /* Kendi profilimiz */

      document.getElementById(
        'nameInput'
      ).value =
        currentProfile.displayName ||
        currentProfile.display_name ||
        '';


      document.getElementById(
        'bioInput'
      ).value =
        currentProfile.bio ||
        '';


      openModal(
        'editModal'
      );

    }
  );


/* =========================================================
   MODAL AÇ
========================================================= */

function openModal(id){

  const m =
    document.getElementById(
      id
    );


  if(!m){
    return;
  }


  m.classList.add(
    'open'
  );


  m.setAttribute(
    'aria-hidden',
    'false'
  );

}


/* =========================================================
   MODAL KAPAT
========================================================= */

function closeModal(id){

  const m =
    document.getElementById(
      id
    );


  if(!m){
    return;
  }


  m.classList.remove(
    'open'
  );


  m.setAttribute(
    'aria-hidden',
    'true'
  );

}

/* =========================================================

========================================================= */

document
  .getElementById(
    'shareBtn'
  )
  .addEventListener(
    'click',
    async()=>{

      if(!currentProfile){

        toast(
          'Profil henüz yüklenmedi'
        );

        return;

      }


      const url =
        location.href;


      try{

        if(
          navigator.share
        ){

          await navigator.share(
            {
              title:
                'Minegram profili',

              text:
                '@' +
                (
                  currentProfile.username ||
                  ''
                ),

              url
            }
          );

        }else{

          await navigator.clipboard.writeText(
            url
          );


          toast(
            'Profil bağlantısı kopyalandı'
          );

        }

      }catch(e){

        if(
          e.name !==
          'AbortError'
        ){

          toast(
            'Paylaşım başarısız'
          );

        }

      }

    }
  );
