<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
name="theme-color"
content="#000000"
>

<title>Şifremi unuttum - Minegram</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body{
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

.topbar{
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:25px;
    height:35px;
    border:0;
    background:transparent;
    color:#fff;
    padding:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.back svg{
    width:25px;
    height:35px;
    stroke:currentColor;
    stroke-width:3;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.top-title{
    margin-left:15px;
    font-size:20px;
    font-weight:700;
}

.content{
    width:317px;
    margin:115px auto 0;
}

.title{
    margin:0 0 34px;
    font-size:30px;
    line-height:1.15;
    font-weight:700;
}

.description{
    margin:0 0 65px;
    color:#bdbdbd;
    font-size:18px;
    line-height:1.45;
}

.code-input{
    width:100%;
    height:39px;
    padding:0 10px;
    border:1px solid #252525;
    border-radius:6px;
    outline:none;
    background:#050505;
    color:#fff;
    font-size:12px;
    letter-spacing:3px;
    text-align:center;
}

.code-input:focus{
    border-color:#555;
}

.verify-btn{
    width:100%;
    height:37px;
    margin-top:8px;
    border:0;
    border-radius:22px;
    background:#2677b5;
    color:#000;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.verify-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.resend-btn{
    display:block;
    margin:12px auto 0;
    border:0;
    background:transparent;
    color:#008cff;
    font-size:12px;
    cursor:pointer;
}

.resend-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.message{
    min-height:18px;
    margin-top:12px;
    text-align:center;
    font-size:11px;
    line-height:1.4;
    color:#ff5c5c;
}

.message.success{
    color:#55b8ff;
}

@media(max-width:600px){

    .topbar{
        height:70px;
        padding-left:28px;
    }

    .back{
        width:30px;
        height:38px;
    }

    .back svg{
        width:30px;
        height:38px;
    }

    .top-title{
        margin-left:12px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 120px);
        max-width:714px;
        margin:105px auto 0;
    }

    .title{
        font-size:42px;
    }

    .description{
        font-size:21px;
        line-height:1.5;
        margin-bottom:55px;
    }

    .code-input{
        height:68px;
        padding:0 20px;
        border:2px solid #686868;
        border-radius:9px;
        font-size:22px;
    }

    .verify-btn{
        height:58px;
        margin-top:18px;
        border-radius:32px;
        font-size:20px;
    }

    .resend-btn{
        margin-top:25px;
        font-size:18px;
        font-weight:700;
    }

    .message{
        font-size:14px;
    }
}

@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        margin-top:65px;
    }

    .title{
        font-size:38px;
    }

    .description{
        font-size:20px;
    }
}

</style>

</head>

<body>

<header class="topbar">

<button
class="back"
type="button"
onclick="goBack()"
aria-label="Geri"
>

<svg viewBox="0 0 32 32">
<path d="M20 5 L9 16 L20 27"></path>
<path d="M10 16 H27"></path>
</svg>

</button>

<div class="top-title">
Şifremi unuttum
</div>

</header>

<main class="content">

<h1 class="title">
Kodu gir
</h1>

<p class="description">
E-posta adresine gönderdiğimiz 6 haneli doğrulama kodunu gir.
</p>

<input
id="code"
class="code-input"
type="text"
inputmode="numeric"
autocomplete="one-time-code"
maxlength="6"
placeholder="6 haneli kod"
aria-label="6 haneli doğrulama kodu"
>

<button
id="verifyBtn"
class="verify-btn"
type="button"
onclick="verifyCode()"
>
Devam et
</button>

<button
id="resendBtn"
class="resend-btn"
type="button"
onclick="resendCode()"
>
Kodu tekrar gönder
</button>

<div
id="message"
class="message"
aria-live="polite"
></div>

</main>

<script>

"use strict";

const API="/api";

const params=
    new URLSearchParams(
        window.location.search
    );

let identifier=(
    params.get("identifier") ||
    params.get("username") ||
    sessionStorage.getItem(
        "minegram_recovery_identifier"
    ) ||
    sessionStorage.getItem(
        "minegram_recovery_username"
    ) ||
    ""
)
.trim()
.replace(/^@/,"")
.toLowerCase();

let mode=(
    params.get("mode") ||
    sessionStorage.getItem(
        "minegram_recovery_mode"
    ) ||
    "username"
)
.trim()
.toLowerCase();

let email=(
    params.get("email") ||
    sessionStorage.getItem(
        "minegram_recovery_email"
    ) ||
    ""
)
.trim()
.toLowerCase();

const codeInput=
    document.getElementById("code");

const verifyBtn=
    document.getElementById("verifyBtn");

const resendBtn=
    document.getElementById("resendBtn");

function showMessage(
    text,
    type=""
){

    const el=
        document.getElementById(
            "message"
        );

    el.className="message";
    el.textContent=text;

    if(type){
        el.classList.add(type);
    }
}

function goBack(){

    if(history.length>1){
        history.back();
    }else{
        window.location.href=
            "hesaplarini-bulduk.html";
    }
}

function cleanCode(value){

    return String(
        value || ""
    )
    .replace(/\D/g,"")
    .slice(0,6);
}

codeInput.addEventListener(
    "input",
    function(){

        this.value=
            cleanCode(
                this.value
            );

        showMessage("");
    }
);

codeInput.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){
            verifyCode();
        }
    }
);

function buildBody(code){

    const body={
        code:code,
        identifier:identifier,
        mode:mode
    };

    if(email){
        body.email=email;
    }

    if(mode==="phone"){
        body.phone=identifier;
    }

    return body;
}

async function verifyCode(){

    const code=
        cleanCode(
            codeInput.value
        );

    showMessage("");

    if(code.length!==6){

        showMessage(
            "6 haneli doğrulama kodunu gir.",
            "error"
        );

        codeInput.focus();

        return;
    }

    if(
        !identifier &&
        !email
    ){

        showMessage(
            "Doğrulama oturumu bulunamadı. İşlemi yeniden başlat.",
            "error"
        );

        return;
    }

    verifyBtn.disabled=true;
    resendBtn.disabled=true;
    verifyBtn.textContent="Kontrol ediliyor...";

    try{

        const response=
            await fetch(
                API + "/forgot/verify",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify(
                        buildBody(code)
                    ),

                    cache:"no-store"
                }
            );

        const data=
            await response
                .json()
                .catch(
                    ()=>({})
                );

        console.log(
            "[MINEGRAM VERIFY]",
            data
        );

        if(
            !response.ok ||
            data.ok===false
        ){

            throw new Error(
                data.error ||
                data.message ||
                "Doğrulama kodu hatalı veya süresi dolmuş."
            );
        }

        const resetToken=String(
            data.resetToken ||
            data.reset_token ||
            data.token ||
            data.recoveryToken ||
            ""
        ).trim();

        if(!resetToken){

            throw new Error(
                "Kod doğrulandı ancak şifre yenileme anahtarı alınamadı."
            );
        }

        sessionStorage.setItem(
            "minegram_reset_token",
            resetToken
        );

        sessionStorage.setItem(
            "resetToken",
            resetToken
        );

        if(
            data.userId ||
            data.user_id ||
            data.id
        ){

            sessionStorage.setItem(
                "minegram_recovery_id",
                String(
                    data.userId ||
                    data.user_id ||
                    data.id
                )
            );
        }

        const next=
            new URLSearchParams();

        next.set(
            "token",
            resetToken
        );

        if(identifier){
            next.set(
                "identifier",
                identifier
            );
        }

        if(email){
            next.set(
                "email",
                email
            );
        }

        showMessage(
            "Kod doğrulandı. Şifre yenileme sayfası açılıyor...",
            "success"
        );

        setTimeout(
            ()=>{
                window.location.href=
                    "yeni-sifre.html?" +
                    next.toString();
            },
            350
        );

    }catch(error){

        console.error(
            "[MINEGRAM VERIFY ERROR]",
            error
        );

        verifyBtn.disabled=false;
        resendBtn.disabled=false;
        verifyBtn.textContent="Devam et";

        showMessage(
            error.message ||
            "Kod doğrulanamadı.",
            "error"
        );
    }
}

async function resendCode(){

    if(
        !identifier &&
        !email
    ){

        showMessage(
            "Doğrulama oturumu bulunamadı.",
            "error"
        );

        return;
    }

    resendBtn.disabled=true;
    verifyBtn.disabled=true;

    resendBtn.textContent=
        "Gönderiliyor...";

    showMessage("");

    try{

        const response=
            await fetch(
                API + "/forgot/start",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({
                        identifier:
                            identifier || email,

                        mode:
                            mode ||
                            (
                                email
                                    ? "email"
                                    : "username"
                            )
                    }),

                    cache:"no-store"
                }
            );

        const data=
            await response
                .json()
                .catch(
                    ()=>({})
                );

        if(
            !response.ok ||
            data.ok===false
        ){

            throw new Error(
                data.error ||
                data.message ||
                "Kod tekrar gönderilemedi."
            );
        }

        if(data.email){

            email=
                String(
                    data.email
                )
                .trim()
                .toLowerCase();

            sessionStorage.setItem(
                "minegram_recovery_email",
                email
            );
        }

        showMessage(
            "Yeni doğrulama kodu gönderildi.",
            "success"
        );

    }catch(error){

        console.error(
            "[MINEGRAM RESEND ERROR]",
            error
        );

        showMessage(
            error.message ||
            "Kod gönderilemedi.",
            "error"
        );

    }finally{

        resendBtn.disabled=false;
        verifyBtn.disabled=false;

        resendBtn.textContent=
            "Kodu tekrar gönder";
    }
}

document.addEventListener(
    "DOMContentLoaded",
    function(){

        codeInput.focus();

    }
);

</script>

</body>
</html>
