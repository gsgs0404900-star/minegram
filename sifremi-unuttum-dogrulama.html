<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>E-posta Kontrol Et - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

.topbar{
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:25px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:34px;
    font-weight:300;
    line-height:1;
    cursor:pointer;
    user-select:none;
}

.top-title{
    margin-left:15px;
    font-size:20px;
    font-weight:700;
    color:#fff;
}

.content{
    width:317px;
    margin:115px auto 0;
}

.title{
    text-align:center;
    font-size:30px;
    line-height:1.15;
    font-weight:700;
    margin:0 0 34px;
    color:#fff;
}

.description{
    font-size:18px;
    line-height:1.45;
    color:#bdbdbd;
    margin:0 0 65px;
}

.code-input{
    display:block;
    width:100%;
    height:39px;
    padding:0 10px;
    border:1px solid #252525;
    border-radius:6px;
    background:#050505;
    color:#fff;
    outline:none;
    font-size:12px;
    font-family:Arial,Helvetica,sans-serif;
    letter-spacing:3px;
    text-align:center;
}

.code-input::placeholder{
    color:#777;
    opacity:1;
    letter-spacing:0;
}

.code-input:focus{
    border-color:#555;
}

.verify-btn{
    display:block;
    width:100%;
    height:37px;
    margin-top:8px;
    border:0;
    border-radius:22px;
    background:#2677b5;
    color:#000;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.verify-btn:active{
    transform:scale(.99);
}

.verify-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.resend-btn{
    display:block;
    width:100%;
    margin-top:12px;
    padding:0;
    border:0;
    background:transparent;
    text-align:center;
    color:#008cff;
    font-size:12px;
    font-weight:400;
    cursor:pointer;
    line-height:1.4;
}

.resend-btn:hover{
    text-decoration:underline;
}

.resend-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    text-decoration:none;
}

.message{
    min-height:18px;
    margin-top:12px;
    text-align:center;
    font-size:11px;
    line-height:1.4;
    color:#ff5c5c;
}

.message.success{
    color:#55b8ff;
}

@media(max-width:600px){

    .topbar{
        height:70px;
        padding-left:28px;
    }

    .back{
        width:30px;
        height:38px;
        font-size:38px;
    }

    .top-title{
        margin-left:12px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 120px);
        max-width:714px;
        margin:105px auto 0;
    }

    .title{
        font-size:42px;
        margin-bottom:30px;
    }

    .description{
        font-size:21px;
        line-height:1.5;
        margin-bottom:55px;
    }

    .code-input{
        height:68px;
        padding:0 20px;
        font-size:22px;
        border:2px solid #686868;
        border-radius:9px;
    }

    .verify-btn{
        height:58px;
        margin-top:18px;
        font-size:20px;
        border-radius:32px;
    }

    .resend-btn{
        margin-top:25px;
        font-size:18px;
        font-weight:700;
        color:#62b5f5;
    }

    .message{
        font-size:14px;
    }
}

@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        margin-top:65px;
    }

    .title{
        font-size:38px;
    }

    .description{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="page">

<div class="topbar">

    <div
        class="back"
        id="backButton"
        aria-label="Geri"
    >
        ‹
    </div>

    <div class="top-title">
        Şifremi unuttum
    </div>

</div>


<main class="content">

    <h1 class="title">
        E-postanı kontrol et
    </h1>

    <p class="description" id="description">
        Hesabını onaylamak için e-posta adresine
        gönderilen 6 haneli kodu aşağıya gir.
    </p>

    <input
        type="text"
        id="code"
        class="code-input"
        placeholder="Kod"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        autocapitalize="none"
        spellcheck="false"
    >

    <div
        id="codeMessage"
        class="message success"
    >
        Kod e-posta adresine gönderildi.
    </div>

    <button
        type="button"
        id="verifyButton"
        class="verify-btn"
    >
        Kodu doğrula
    </button>

    <button
        type="button"
        id="resendButton"
        class="resend-btn"
    >
        Kodu tekrar gönder
    </button>

</main>

</div>


<script>
"use strict";

const API = "/api";

const codeInput =
    document.getElementById("code");

const verifyButton =
    document.getElementById("verifyButton");

const resendButton =
    document.getElementById("resendButton");

const codeMessage =
    document.getElementById("codeMessage");

const description =
    document.getElementById("description");

const backButton =
    document.getElementById("backButton");


/* =========================================
   URL BİLGİLERİ
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const identifier =
    String(
        params.get("identifier") || ""
    ).trim();

const mode =
    String(
        params.get("mode") || "email"
    ).trim().toLowerCase();

const email =
    String(
        params.get("email") || ""
    ).trim();

const phone =
    String(
        params.get("phone") || ""
    ).trim();


/* =========================================
   MESAJ
========================================= */

function showMessage(text,type){

    if(!codeMessage){
        return;
    }

    codeMessage.textContent =
        String(text || "");

    codeMessage.className =
        "message" +
        (
            type === "success"
                ? " success"
                : ""
        );
}


/* =========================================
   SADECE RAKAM
========================================= */

function onlyNumbers(){

    if(!codeInput){
        return;
    }

    codeInput.value =
        codeInput.value
            .replace(/\D/g,"")
            .slice(0,6);
}


/* =========================================
   JSON CEVABI
========================================= */

async function readResponse(response){

    const raw =
        await response.text();

    let data = {};

    try{

        data =
            raw
                ? JSON.parse(raw)
                : {};

    }catch{

        data = {
            error:
                raw ||
                "Sunucudan geçersiz cevap geldi."
        };

    }

    return data;
}


/* =========================================
   GERİ
========================================= */

function goBack(){

    window.location.replace(
        "sifremi-unuttum.html"
    );
}


/* =========================================
   DOĞRULAMA BODY
========================================= */

function buildVerifyBody(code){

    const body = {
        code:code
    };

    /*
     * Backend'in farklı sürümleriyle
     * uyumluluk için bütün gerekli
     * tanımlayıcıları gönderiyoruz.
     */

    if(identifier){
        body.identifier =
            identifier;
    }

    if(mode){
        body.mode =
            mode;
    }

    if(email){
        body.email =
            email;
    }

    if(phone){
        body.phone =
            phone;
    }

    return body;
}


/* =========================================
   KODU DOĞRULA
========================================= */

async function verifyCode(){

    onlyNumbers();

    const code =
        String(
            codeInput?.value || ""
        ).trim();

    if(code.length !== 6){

        showMessage(
            "Lütfen 6 haneli doğrulama kodunu gir.",
            "error"
        );

        codeInput?.focus();

        return;
    }


    /*
     * Sayfa doğrudan açılmışsa
     * hangi hesap için işlem yapıldığını
     * bilemeyiz.
     */

    if(
        !identifier &&
        !email &&
        !phone
    ){

        showMessage(
            "Doğrulama oturumu bulunamadı. Lütfen şifre sıfırlama işlemini yeniden başlat.",
            "error"
        );

        return;
    }


    verifyButton.disabled =
        true;

    resendButton.disabled =
        true;

    verifyButton.textContent =
        "Doğrulanıyor...";


    try{

        const body =
            buildVerifyBody(code);


        console.log(
            "[MINEGRAM FORGOT VERIFY REQUEST]",
            {
                mode:mode,
                hasIdentifier:!!identifier,
                hasEmail:!!email,
                hasPhone:!!phone
            }
        );


        const response =
            await fetch(
                API + "/forgot/verify",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify(body),

                    cache:"no-store",

                    credentials:"same-origin"
                }
            );


        const data =
            await readResponse(
                response
            );


        console.log(
            "[MINEGRAM FORGOT VERIFY RESPONSE]",
            data
        );


        if(
            !response.ok ||
            !data.ok
        ){

            throw new Error(
                data.error ||
                "Doğrulama kodu hatalı veya süresi dolmuş."
            );
        }


        /*
         * Backend'in döndürdüğü token.
         */

        const resetToken =
            String(
                data.resetToken ||
                data.reset_token ||
                ""
            ).trim();


        if(!resetToken){

            throw new Error(
                "Kod doğrulandı ancak şifre yenileme anahtarı alınamadı. Lütfen tekrar kod iste."
            );
        }


        showMessage(
            "Kod doğrulandı. Yeni şifreni oluşturabilirsin.",
            "success"
        );


        /*
         * Yeni şifre ekranına:
         *
         * resetToken
         *
         * gönderilir.
         *
         * Token URL encode edilir.
         */

        const target =
            "yeni-sifre.html" +
            "?token=" +
            encodeURIComponent(
                resetToken
            );


        setTimeout(function(){

            window.location.replace(
                target
            );

        },700);


    }catch(error){

        console.error(
            "[MINEGRAM FORGOT VERIFY ERROR]",
            error
        );

        showMessage(
            error?.message ||
            "Bir hata oluştu. Lütfen tekrar dene.",
            "error"
        );


    }finally{

        verifyButton.disabled =
            false;

        resendButton.disabled =
            false;

        verifyButton.textContent =
            "Kodu doğrula";

    }
}


/* =========================================
   TEKRAR KOD GÖNDER
========================================= */

async function resendCode(){

    /*
     * Yeniden gönderme için identifier
     * kesinlikle gerekli.
     */

    const resendIdentifier =
        identifier ||
        email ||
        phone;


    if(!resendIdentifier){

        showMessage(
            "Hesap bilgisi bulunamadı. Lütfen işlemi yeniden başlat.",
            "error"
        );

        return;
    }


    resendButton.disabled =
        true;

    verifyButton.disabled =
        true;

    resendButton.textContent =
        "Gönderiliyor...";


    try{

        const response =
            await fetch(
                API + "/forgot/start",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({

                        identifier:
                            resendIdentifier,

                        mode:
                            mode === "phone"
                                ? "phone"
                                : "email"

                    }),

                    cache:"no-store",

                    credentials:"same-origin"
                }
            );


        const data =
            await readResponse(
                response
            );


        console.log(
            "[MINEGRAM FORGOT RESEND RESPONSE]",
            data
        );


        if(
            !response.ok ||
            !data.ok
        ){

            throw new Error(
                data.error ||
                "Kod tekrar gönderilemedi."
            );
        }


        showMessage(
            "Yeni doğrulama kodu e-posta adresine gönderildi.",
            "success"
        );


        /*
         * Backend yeni e-posta döndürürse
         * URL'yi güncelle.
         */

        const newEmail =
            String(
                data.email || email || ""
            ).trim();


        if(newEmail){

            const newUrl =
                new URL(
                    window.location.href
                );

            newUrl.searchParams.set(
                "email",
                newEmail
            );

            if(identifier){

                newUrl.searchParams.set(
                    "identifier",
                    identifier
                );

            }

            newUrl.searchParams.set(
                "mode",
                mode === "phone"
                    ? "phone"
                    : "email"
            );

            window.history.replaceState(
                {},
                "",
                newUrl.toString()
            );
        }


    }catch(error){

        console.error(
            "[MINEGRAM FORGOT RESEND ERROR]",
            error
        );

        showMessage(
            error?.message ||
            "Kod gönderilemedi. Lütfen tekrar dene.",
            "error"
        );


    }finally{

        resendButton.disabled =
            false;

        verifyButton.disabled =
            false;

        resendButton.textContent =
            "Kodu tekrar gönder";

    }
}


/* =========================================
   ENTER
========================================= */

codeInput.addEventListener(
    "input",
    onlyNumbers
);

codeInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            verifyCode();

        }

    }
);


/* =========================================
   BUTONLAR
========================================= */

verifyButton.addEventListener(
    "click",
    verifyCode
);

resendButton.addEventListener(
    "click",
    resendCode
);

backButton.addEventListener(
    "click",
    goBack
);


/* =========================================
   BAŞLANGIÇ
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        /*
         * Telefonla başladıysa bile kod
         * e-posta adresine gönderildiği için
         * başlık aynı kalır.
         */

        if(mode === "phone"){

            description.textContent =
                "Hesabını onaylamak için e-posta adresine gönderilen 6 haneli kodu aşağıya gir.";

        }


        console.log(
            "[MINEGRAM] Şifre sıfırlama doğrulama hazır.",
            {
                mode:mode,
                hasIdentifier:!!identifier,
                hasEmail:!!email,
                hasPhone:!!phone
            }
        );


        setTimeout(function(){

            codeInput?.focus();

        },100);

    }
);

</script>

</body>
</html>
