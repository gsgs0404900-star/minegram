<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifremi unuttum - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

/* =========================
   ÜST BAR
========================= */

.topbar{
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:25px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:34px;
    font-weight:300;
    line-height:1;
    cursor:pointer;
    user-select:none;
}

.top-title{
    margin-left:15px;
    font-size:20px;
    font-weight:700;
    color:#fff;
}

/* =========================
   ANA FORM
========================= */

.content{
    width:317px;
    margin:115px auto 0;
}

.title{
    text-align:center;
    font-size:30px;
    line-height:1.15;
    font-weight:700;
    margin:0 0 34px;
    color:#fff;
}

.description{
    font-size:18px;
    line-height:1.45;
    color:#bdbdbd;
    margin:0 0 65px;
}

/* =========================
   INPUT
========================= */

.input{
    display:block;
    width:100%;
    height:39px;
    padding:0 10px;

    border:1px solid #252525;
    border-radius:6px;

    background:#050505;
    color:#fff;

    outline:none;

    font-size:12px;
    font-family:Arial,Helvetica,sans-serif;
}

.input::placeholder{
    color:#777;
    opacity:1;
}

.input:focus{
    border-color:#555;
}

/* =========================
   DEVAM
========================= */

.continue-btn{
    display:block;
    width:100%;
    height:37px;

    margin-top:8px;

    border:0;
    border-radius:22px;

    background:#2677b5;
    color:#000;

    font-size:12px;
    font-weight:700;

    cursor:pointer;
}

.continue-btn:active{
    transform:scale(.99);
}

.continue-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =========================
   ALT LİNKLER
========================= */

.other-method{
    display:block;
    width:100%;

    margin-top:12px;

    text-align:center;

    color:#008cff;

    font-size:12px;
    font-weight:400;

    text-decoration:none;

    cursor:pointer;

    line-height:1.4;
}

.other-method:hover{
    text-decoration:underline;
}

.login-link{
    margin-top:25px;
}

/* =========================
   MESAJ
========================= */

.message{
    min-height:20px;
    margin-top:12px;

    text-align:center;

    font-size:11px;
    line-height:1.4;

    color:#ff5c5c;
}

.message.success{
    color:#55b8ff;
}

/* =========================
   MOBİL
========================= */

@media(max-width:600px){

    .topbar{
        height:70px;
        padding-left:28px;
    }

    .back{
        width:30px;
        height:38px;
        font-size:38px;
    }

    .top-title{
        margin-left:12px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 120px);
        max-width:365px;
        margin:105px auto 0;
    }

    .title{
        font-size:42px;
        margin-bottom:30px;
    }

    .description{
        font-size:21px;
        line-height:1.5;
        margin-bottom:55px;
    }

    .input{
        height:68px;
        padding:0 20px;

        font-size:18px;

        border:2px solid #686868;
        border-radius:9px;
    }

    .continue-btn{
        height:58px;
        margin-top:18px;

        font-size:20px;
        border-radius:32px;
    }

    .other-method{
        margin-top:25px;
        font-size:18px;
        font-weight:700;
        color:#62b5f5;
    }

    .login-link{
        margin-top:25px;
    }

    .message{
        font-size:14px;
    }
}

/* =========================
   KÜÇÜK TELEFON
========================= */

@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:65px;
    }

    .title{
        font-size:38px;
    }

    .description{
        font-size:20px;
    }
}
</style>

</head>

<body>

<div class="page">

```
<!-- =========================
     ÜST BAR
========================= -->

<div class="topbar">

    <div
        class="back"
        onclick="goBack()"
        aria-label="Geri"
    >
        ‹
    </div>

    <div class="top-title">
        Şifremi unuttum
    </div>

</div>


<!-- =========================
     ANA FORM
========================= -->

<main class="content">

    <h1 class="title">
        Profilini bul
    </h1>

    <p class="description">
        Hesabını bulmak için e-posta adresini veya kullanıcı adını gir.
    </p>


    <input
        id="emailUsername"
        class="input"
        type="text"
        placeholder="E-posta adresi veya kullanıcı adı"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
    >


    <button
        id="continueBtn"
        class="continue-btn"
        type="button"
    >
        Devam
    </button>


    <!-- TELEFON SAYFASINA GİT -->

    <a
        href="sifremi-unuttum-telefon.html"
        class="other-method"
    >
        Cep telefonu numarasıyla bul
    </a>


    <!-- GİRİŞE DÖN -->

    <a
        href="giris.html"
        class="other-method login-link"
    >
        Giriş ekranına dön
    </a>


    <!-- MESAJ -->

    <div
        id="message"
        class="message"
    ></div>

</main>
```

</div>

<script>

"use strict";


/* =========================
   ELEMENTLER
========================= */

const emailUsername =
    document.getElementById("emailUsername");

const continueBtn =
    document.getElementById("continueBtn");

const message =
    document.getElementById("message");


/* =========================
   MESAJ
========================= */

function showMessage(text, success = false){

    message.textContent = text || "";

    message.className =
        success
            ? "message success"
            : "message";
}


/* =========================
   GERİ
========================= */

function goBack(){

    /*
     * Önceki sayfa varsa oraya dön.
     *
     * Yoksa giriş ekranına git.
     */

    if(history.length > 1){

        history.back();

    }else{

        window.location.href = "giris.html";

    }

}


/* =========================
   HESAP BUL
========================= */

async function continueEmail(){

    const value =
        emailUsername.value.trim();


    showMessage("");


    /* BOŞ KONTROL */

    if(!value){

        showMessage(
            "Lütfen e-posta adresini veya kullanıcı adını gir."
        );

        emailUsername.focus();

        return;
    }


    /* BUTONU KİLİTLE */

    continueBtn.disabled = true;

    continueBtn.textContent =
        "Kontrol ediliyor...";


    try{

        /*
         * Backend:
         *
         * POST /api/forgot-password/find-account
         *
         * Gönderilen:
         *
         * {
         *   emailOrUsername: value
         * }
         */

        const response =
            await fetch(
                "/api/forgot-password/find-account",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({
                        emailOrUsername:value
                    }),

                    cache:"no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(function(){

                    return {};

                });


        console.log(
            "[MINEGRAM FORGOT ACCOUNT]",
            data
        );


        /* SUNUCU HATASI */

        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                "Bu bilgilerle eşleşen hesap bulunamadı."
            );

        }


        /* HESAP BULUNDU */

        if(data.success){

            showMessage(
                "Hesap bulundu. Yönlendiriliyorsun...",
                true
            );


            /*
             * Backend gerçek e-posta adresini
             * döndürüyorsa onu kullan.
             *
             * Döndürmüyorsa kullanıcının
             * girdiği değeri gönder.
             */

            const email =
                data.email ||
                data.account?.email ||
                value;


            /*
             * Doğrulama sayfasına geç.
             */

            setTimeout(function(){

                window.location.href =
                    "sifremi-unuttum-dogrulama.html?email=" +
                    encodeURIComponent(email);

            },500);


            return;
        }


        /* HESAP BULUNAMADI */

        showMessage(
            data.message ||
            "Bu bilgilerle eşleşen hesap bulunamadı."
        );


    }catch(error){

        console.error(
            "[MINEGRAM ŞİFRE SIFIRLAMA]",
            error
        );


        showMessage(
            error.message ||
            "Bir hata oluştu. Lütfen tekrar dene."
        );


    }finally{

        continueBtn.disabled = false;

        continueBtn.textContent =
            "Devam";

    }

}


/* =========================
   DEVAM BUTONU
========================= */

continueBtn.addEventListener(
    "click",
    continueEmail
);


/* =========================
   ENTER
========================= */

emailUsername.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            continueEmail();

        }

    }
);


/* =========================
   SAYFA AÇILDI
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        console.log(
            "[MINEGRAM] Şifre sıfırlama sayfası hazır."
        );

    }
);

</script>

</body>
</html>
