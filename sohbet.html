<!doctype html
>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Minegram • Mesajlar</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif
}

body{
  padding-bottom:58px;
  overflow-x:hidden
}

button,input{font:inherit}
button{cursor:pointer}

.app{
  min-height:100dvh;
  background:#000;
}

/* HEADER */

.header{
  height:52px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #24242a;
  background:#000;
  position:sticky;
  top:0;
  z-index:20;
}

.back{
  width:34px;
  height:40px;
  border:0;
  background:none;
  color:#fff;
  font-size:34px;
  line-height:1;
  padding:0;
  margin-left:-5px;
}

.title{
  font-size:21px;
  font-weight:700;
  margin-left:4px;
}

/* SEARCH */

.search-wrap{
  padding:9px 13px 0;
}

.search{
  height:48px;
  border:1px solid #77727d;
  border-radius:14px;
  display:flex;
  align-items:center;
  padding:0 13px;
  gap:10px;
}

.search-icon{
  font-size:23px;
  line-height:1;
  transform:rotate(-15deg);
}

.search input{
  flex:1;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
  font-size:15px;
}

.search input::placeholder{
  color:#bbb;
}

/* SECTIONS */

.section{
  padding:18px 0 0;
}

.section h2{
  font-size:20px;
  margin:0 0 12px 15px;
}

/* NOTLAR */

.notes-scroll{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding:0 20px 18px;
  scrollbar-width:none;
}

.notes-scroll::-webkit-scrollbar{
  display:none;
}

.note{
  width:78px;
  min-width:78px;
  text-align:center;
  position:relative;
}

.note-text{
  height:53px;
  background:#071018;
  border-radius:13px;
  padding:8px 7px;
  color:#fff;
  font-size:10px;
  line-height:1.45;
  text-align:left;
  overflow:hidden;
  margin-bottom:0;
}

.note-avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#64afe9;
  margin:-10px auto 8px;
  display:grid;
  place-items:center;
  font-size:18px;
  font-weight:400;
  border:0;
  position:relative;
}

.note-avatar img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
}

.note-name{
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.note-name.bold{
  font-weight:700;
}

.plus{
  position:absolute;
  right:0;
  top:72px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#64afe9;
  border:1px solid #000;
  color:#fff;
  font-size:17px;
  line-height:18px;
  padding:0;
}

.music{
  margin-top:10px;
  font-size:9px;
  white-space:nowrap;
}

.notes-divider{
  border-bottom:1px solid #38383e;
  margin-top:0;
}

/* MESAJLAR */

.messages-section{
  padding-top:17px;
}

.messages-section h2{
  margin-bottom:10px;
}

.message-list{
  border-bottom:1px solid #38383e;
}

.message-row{
  min-height:70px;
  border-top:1px solid #24242a;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:11px;
  text-decoration:none;
  color:#fff;
  cursor:pointer;
}

.message-row:active{
  background:#111;
}

.message-avatar{
  width:52px;
  height:52px;
  min-width:52px;
  border-radius:50%;
  background:#64afe9;
  display:grid;
  place-items:center;
  font-size:18px;
  overflow:hidden;
}

.message-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.message-info{
  min-width:0;
  flex:1;
}

.message-user{
  font-size:17px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:4px;
}

.verified{
  width:17px;
  height:17px;
  border-radius:50%;
  background:#2388df;
  display:inline-grid;
  place-items:center;
  font-size:11px;
  font-weight:400;
}

.message-preview{
  font-size:14px;
  color:#ddd;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chevron{
  font-size:29px;
  font-weight:300;
  margin-left:auto;
  color:#fff;
}

/* ALT MENÜ */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:58px;
  background:#18161e;
  border-top:1px solid #25232c;
  display:flex;
  z-index:100;
  padding:3px 0 env(safe-area-inset-bottom);
}

.bottom-nav a{
  flex:1;
  color:#ddd;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  font-size:8px;
}

.bottom-nav i{
  width:34px;
  height:25px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-style:normal;
  font-size:19px;
}

.bottom-nav a.active i{
  background:#3b3450;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:68px;
  transform:translateX(-50%);
  background:#29272e;
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:200;
}

.toast.show{
  opacity:1;
}

/* DESKTOP */

@media(min-width:700px){

  .app{
    max-width:420px;
    margin:auto;
    border-left:1px solid #202024;
    border-right:1px solid #202024;
  }

  .bottom-nav{
    max-width:420px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
    width:420px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <button class="back" id="back">‹</button>

  <div class="title">
    Mesajlar
  </div>

</header>


<!-- ARAMA -->

<div class="search-wrap">

  <div class="search">

    <span class="search-icon">⌕</span>

    <input
      id="search"
      placeholder="Kişileri ara..."
      autocomplete="off"
    >

  </div>

</div>


<!-- NOTLAR -->

<section class="section">

  <h2>Notlar</h2>

  <div
    class="notes-scroll"
    id="notes"
  ></div>

  <div class="notes-divider"></div>

</section>


<!-- MESAJLAR -->

<section class="section messages-section">

  <h2>Mesajlar</h2>

  <div
    class="message-list"
    id="messageList"
  >
    <div style="
      padding:30px 15px;
      text-align:center;
      color:#777;
      font-size:13px
    ">
      Mesajlar yükleniyor...
    </div>
  </div>

</section>

</div>


<!-- ALT MENÜ -->

<nav class="bottom-nav">

  <a href="index.html">
    <i>⌂</i>
    <span>Ana Sayfa</span>
  </a>

  <a href="ara.html">
    <i>⌕</i>
    <span>Ara</span>
  </a>

  <a href="olustur.html">
    <i>＋</i>
    <span>Oluştur</span>
  </a>

  <a href="reels.html">
    <i>▣</i>
    <span>Reels</span>
  </a>

  <a href="profile.html">
    <i>♙</i>
    <span>Profil</span>
  </a>

</nav>


<div class="toast" id="toast"></div>


<script>

const token =
  localStorage.getItem('minegram_token') ||
  localStorage.getItem('token') ||
  '';

const $ = id =>
  document.getElementById(id);


/* HTML GÜVENLİĞİ */

const esc = s =>
  String(s ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );


/* API */

async function api(url,opt={}){

  const headers = {
    ...(opt.headers || {})
  };

  if(token){
    headers.Authorization =
      'Bearer ' + token;
  }

  if(
    opt.body &&
    typeof opt.body !== 'string'
  ){

    headers['Content-Type'] =
      'application/json';

    opt.body =
      JSON.stringify(opt.body);
  }

  const r =
    await fetch(
      url,
      {
        ...opt,
        headers
      }
    );

  if(!r.ok){

    throw new Error(
      (await r.json().catch(()=>({}))).error ||
      ('HTTP ' + r.status)
    );

  }

  return r.status === 204
    ? {}
    : r.json().catch(()=>({}));
}


/* NOTLAR */

const demoNotes = [

  {
    username:'Notun',
    displayName:'Notun',
    text:'Ahmet kaya',
    avatar:'',
    plus:true
  },

  {
    username:'ahmet',
    displayName:'ahmet',
    text:'Bugün güzel bir gün ☀️',
    avatar:''
  },

  {
    username:'mehmet',
    displayName:'mehmet',
    text:'Biraz müzik dinliyorum 🎵',
    avatar:'',
    music:true
  },

  {
    username:'galatasaray',
    displayName:'galatasaray',
    text:'Maç günü!',
    avatar:''
  }

];


/* AVATAR */

function avatarHtml(item,cls){

  const name =
    (
      item.displayName ||
      item.username ||
      'M'
    )[0].toUpperCase();

  return `
    <div class="${cls}">
      ${
        item.avatar
        ? `<img src="${esc(item.avatar)}" alt="">`
        : esc(name)
      }
    </div>
  `;
}


/* NOTLARI OLUŞTUR */

function renderNotes(list){

  $('notes').innerHTML =
    list.map(n => `

      <div class="note">

        <div class="note-text">
          ${esc(n.text)}
        </div>

        ${avatarHtml(n,'note-avatar')}

        ${
          n.plus
          ? `
            <button
              class="plus"
              type="button"
            >+</button>
          `
          : ''
        }

        <div class="note-name ${n.plus?'bold':''}">
          ${esc(
            n.displayName ||
            n.username
          )}
        </div>

        ${
          n.music
          ? `
            <div class="music">
              ▶ Şarkıyı çal
            </div>
          `
          : ''
        }

      </div>

    `).join('');
}


/* KONUŞMALAR */

function conversationUsers(raw){

  const map = new Map();

  for(const m of raw){

    const sender =
      m.sender ||
      m.from ||
      '';

    const recipient =
      m.recipient ||
      m.to ||
      '';

    const me =
      m.me ||
      '';

    const target =
      String(sender).toLowerCase() ===
      String(me).toLowerCase()
      ? recipient
      : sender;

    if(target){

      map.set(
        target.toLowerCase(),
        {
          username:target,

          displayName:
            m.displayName ||
            target,

          avatar:
            m.avatar || '',

          verified:
            m.verified || false,

          text:
            m.text ||
            m.message ||
            '',

          createdAt:
            Number(
              m.createdAt ||
              m.timestamp ||
              0
            )
        }
      );
    }
  }

  return [...map.values()].sort(
    (a,b) =>
      (b.createdAt || 0) -
      (a.createdAt || 0)
  );
}


/* MESAJ LİSTESİ */

function renderMessages(list){

  if(!list.length){

    $('messageList').innerHTML = `
      <div style="
        padding:35px 15px;
        text-align:center;
        color:#777;
        font-size:13px
      ">
        Henüz mesaj yok.
      </div>
    `;

    return;
  }

  $('messageList').innerHTML =
    list.map(m => `

      <a
        class="message-row"
        href="sohbet.html?username=${encodeURIComponent(
          m.username
        )}"
      >

        ${avatarHtml(
          m,
          'message-avatar'
        )}

        <div class="message-info">

          <div class="message-user">

            ${esc(
              m.displayName ||
              m.username
            )}

            ${
              m.verified
              ? `
                <span class="verified">
                  ✓
                </span>
              `
              : ''
            }

          </div>

          <div class="message-preview">
            ${esc(
              m.text ||
              'Mesaj gönderme için dokun'
            )}
          </div>

        </div>

        <div class="chevron">›</div>

      </a>

    `).join('');
}


/* YÜKLE */

async function load(){

  renderNotes(demoNotes);

  try{

    const me =
      await api('/api/me');

    let raw = [];

    try{

      const data =
        await api('/api/messages');

      raw =
        Array.isArray(data)
        ? data
        : (
          data.messages ||
          data.items ||
          []
        );

    }catch(e){

      raw = [];

    }

    raw =
      raw.map(x => ({
        ...x,
        me:
          me?.username || ''
      }));

    let users =
      conversationUsers(raw);

    if(!users.length){

      users = [
        {
          username:'test',
          displayName:'test',
          text:
            'Mesaj gönderme için dokun',
          verified:true,
          avatar:''
        }
      ];

    }

    renderMessages(users);

  }catch(e){

    renderMessages([
      {
        username:'test',
        displayName:'test',
        text:
          'Mesaj gönderme için dokun',
        verified:true,
        avatar:''
      }
    ]);

  }
}


/* ARAMA */

$('search').addEventListener(
  'input',
  async e => {

    const q =
      e.target.value
        .trim()
        .toLowerCase();

    if(!q){

      load();
      return;
    }

    try{

      const data =
        await api(
          '/api/users?search=' +
          encodeURIComponent(q)
        );

      const users =
        Array.isArray(data)
        ? data
        : (
          data.users ||
          data.items ||
          []
        );

      renderMessages(
        users.map(u => ({
          username:u.username,

          displayName:
            u.displayName ||
            u.username,

          avatar:
            u.avatar || '',

          verified:
            !!u.verified,

          text:
            'Mesaj gönderme için dokun'
        }))
      );

    }catch(e){

      renderMessages([]);

    }

  }
);


/* GERİ */

$('back').onclick = () => {

  if(history.length > 1){

    history.back();

  }else{

    location.href =
      'index.html';

  }

};


/* NOT TIKLAMA */

$('notes').addEventListener(
  'click',
  e => {

    if(
      e.target.closest('.plus')
    ){
      return;
    }

    const n =
      e.target.closest('.note');

    if(!n)return;

    const name =
      n.querySelector(
        '.note-name'
      )?.textContent?.trim();

    if(
      name &&
      name !== 'Notun'
    ){

      location.href =
        'sohbet.html?username=' +
        encodeURIComponent(name);

    }

  }
);


/* BAŞLAT */

load();

</script>

</body>
</html>
