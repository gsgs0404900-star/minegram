<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Minegram • Mesajlar</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}body{overflow-x:hidden}.app{min-height:100dvh;background:#000}button,input{font:inherit}button{cursor:pointer}
.header{height:52px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #24242a;background:#000;position:sticky;top:0;z-index:30}.back{width:34px;height:40px;border:0;background:none;color:#fff;font-size:34px;line-height:1;padding:0;margin-left:-5px}.title{font-size:21px;font-weight:700;margin-left:4px}
.search-wrap{padding:9px 12px 0}.search{height:48px;border:1px solid #77727d;border-radius:14px;display:flex;align-items:center;padding:0 13px;gap:10px}.search-icon{font-size:23px;line-height:1;transform:rotate(-15deg)}.search input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:15px}.search input::placeholder{color:#bbb}.search-clear{display:none;width:26px;height:26px;border:0;border-radius:50%;background:#3b3b40;color:#fff}
.search-results{display:none;max-height:220px;overflow:auto;border-bottom:1px solid #38383e}.search-results.show{display:block}.search-result{min-height:68px;border-top:1px solid #24242a;display:flex;align-items:center;padding:10px 14px;gap:12px}.search-result:active{background:#111}.result-info{min-width:0;flex:1}.result-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-sub{font-size:13px;color:#aaa;margin-top:3px}.chevron{font-size:29px;line-height:1;color:#fff}
.section{padding:17px 0 0}.section h2{font-size:18px;margin:0 0 8px 14px}.notes-scroll{display:flex;gap:14px;overflow-x:auto;padding:0 12px 12px;scrollbar-width:none}.notes-scroll::-webkit-scrollbar{display:none}.note{width:122px;min-width:122px;text-align:center;position:relative;cursor:pointer}.note-card{height:145px;position:relative;display:flex;align-items:flex-end;justify-content:center}.note-bubble{position:absolute;left:2px;right:2px;top:0;min-height:0;background:#20252a;border-radius:14px;padding:8px;color:#fff;font-size:11px;line-height:14px;text-align:center;overflow:hidden}.note-music-title{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-music-artist{font-size:8px;color:#aeb4bc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.note-message{margin-top:7px;background:#343a40;border-radius:10px;padding:7px 8px;font-size:11px;font-weight:600;line-height:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.note-avatar{width:58px;height:58px;border-radius:50%;background:#4f8fbd;display:grid;place-items:center;font-size:18px;border:0;position:relative;z-index:2;overflow:hidden}.note-avatar img{width:100%;height:100%;object-fit:cover}.note-plus{position:absolute;right:5px;bottom:0;width:21px;height:21px;border-radius:50%;background:#64afe9;border:1px solid #000;color:#fff;display:grid;place-items:center;font-size:16px;line-height:18px;z-index:4}.note-name{font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-name.mine{font-weight:700}.music-play{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:2px;font-size:10px;color:#fff}.notes-divider{border-bottom:1px solid #38383e;margin-top:0}
.messages-section{padding-top:12px}.messages-section h2{margin-bottom:4px}.message-list{border-bottom:1px solid #38383e}.message-row{min-height:78px;border-top:1px solid #24242a;display:flex;align-items:center;padding:10px 14px;gap:12px;text-decoration:none;color:#fff;transition:background .15s,transform .18s}.message-row:active{background:#111}.message-row.pulse{animation:msgPulse .55s ease}.message-avatar{width:58px;height:58px;min-width:58px;border-radius:50%;background:#4f8fbd;display:grid;place-items:center;font-size:18px;overflow:hidden}.message-avatar img{width:100%;height:100%;object-fit:cover}.message-info{min-width:0;flex:1}.message-user{font-size:17px;font-weight:700;display:flex;align-items:center;gap:4px;min-width:0}.message-user-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.verified{width:17px;height:17px;min-width:17px;border-radius:50%;background:#2388df;display:inline-grid;place-items:center;font-size:11px}.message-preview{font-size:13px;color:#bbb;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.message-meta{font-size:10px;color:#777;margin-top:3px}.unread{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#2388df;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;margin-left:5px}.loading,.empty{padding:35px 15px;text-align:center;color:#777;font-size:13px}
.pull-indicator{position:fixed;left:50%;top:58px;transform:translate(-50%,-80px);width:58px;height:58px;border-radius:50%;background:#202124;z-index:100;display:grid;place-items:center;opacity:0;transition:transform .12s,opacity .12s;pointer-events:none}.pull-indicator.show{opacity:1}.pull-ring{width:42px;height:42px;border:4px solid #8ab4f8;border-top-color:#fff;border-radius:50%;transform:rotate(0deg)}.pull-indicator.refreshing .pull-ring{animation:spin .8s linear infinite}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#29272e;color:#fff;padding:9px 13px;border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:200}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:150;display:none;align-items:flex-end}.modal-backdrop.show{display:flex}.modal{width:100%;max-height:82dvh;background:#171b1e;border-radius:26px 26px 0 0;padding:12px 16px 20px}.handle{width:42px;height:5px;border-radius:8px;background:#777;margin:0 auto 14px}.modal-head{display:flex;align-items:center;justify-content:space-between}.modal-title{font-size:19px;font-weight:700}.close{width:38px;height:38px;border:0;border-radius:50%;background:#252a2e;color:#fff;font-size:22px}.note-input{width:100%;height:52px;margin-top:14px;border:1px solid #555;border-radius:13px;background:#0d0f10;color:#fff;padding:0 13px;outline:0}.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions button{flex:1;height:44px;border:0;border-radius:11px}.primary{background:#2388df;color:#fff}.secondary{background:#2b3035;color:#fff}.danger{background:#57252a;color:#ffb8be}.music-search{display:flex;gap:8px;margin-top:10px}.music-search input{flex:1;height:42px;background:#0d0f10;border:1px solid #555;border-radius:10px;color:#fff;padding:0 10px;outline:0}.music-search button{width:44px;border:0;border-radius:10px;background:#2388df;color:#fff}.music-results{max-height:170px;overflow:auto;margin-top:8px}.music-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #292d30}.music-art{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#333}.music-info{min-width:0;flex:1}.music-title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.music-artist{font-size:10px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.music-select{width:58px;height:34px;border:0;border-radius:8px;background:#2b3035;color:#fff}.selected-music{margin-top:9px;padding:9px;border-radius:11px;background:#24292d;display:none}.selected-music.show{display:flex;align-items:center;gap:9px}.selected-music button{margin-left:auto;border:0;background:none;color:#fff;font-size:18px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes msgPulse{0%{transform:scale(1)}50%{transform:scale(1.025)}100%{transform:scale(1)}}
@media(min-width:700px){.app{max-width:420px;margin:auto;border-left:1px solid #202024;border-right:1px solid #202024}.modal-backdrop{justify-content:center}.modal{max-width:420px;border-radius:26px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="header"><button class="back" id="back" type="button" aria-label="Geri">‹</button><div class="title">Mesajlar</div></header>
<div class="search-wrap"><div class="search"><span class="search-icon">⌕</span><input id="search" placeholder="Kişileri ara..." autocomplete="off" type="search"><button id="searchClear" class="search-clear" type="button">×</button></div></div>
<div class="search-results" id="searchResults"></div>
<section class="section"><h2>Notlar</h2><div class="notes-scroll" id="notes"></div><div class="notes-divider"></div></section>
<section class="section messages-section"><h2>Mesajlar</h2><div class="message-list" id="messageList"><div class="loading">Mesajlar yükleniyor...</div></div></section>
</div>
<div class="pull-indicator" id="pullIndicator"><div class="pull-ring"></div></div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="noteModal"><div class="modal"><div class="handle"></div><div class="modal-head"><div class="modal-title">Notunu paylaş</div><button class="close" id="noteClose">×</button></div><input class="note-input" id="noteText" maxlength="7" placeholder="Aklından ne geçiyor?" autocomplete="off"><div class="selected-music" id="selectedMusic"><div><div class="music-title" id="selectedMusicTitle"></div><div class="music-artist" id="selectedMusicArtist"></div></div><button id="removeMusic">×</button></div><div class="music-search"><input id="musicQuery" placeholder="Dünyadan müzik ara..."><button id="musicSearchBtn">⌕</button></div><div class="music-results" id="musicResults"></div><div class="modal-actions"><button class="danger" id="deleteNote">Sil</button><button class="secondary" id="cancelNote">İptal</button><button class="primary" id="saveNote">Paylaş</button></div></div></div>
<script>
const API='https://minegram-hwns.onrender.com';
let token='';let currentUser='';let conversations=[];let searchTimer=null;let pollTimer=null;let pulling=false;let pullStartY=0;let pullDistance=0;let selectedMusic=null;let noteMusicAudio=null;
const $=id=>document.getElementById(id);
function getToken(){return localStorage.getItem('minegram_token')||localStorage.getItem('minegram_supabase_token')||localStorage.getItem('minegram_access_token')||localStorage.getItem('supabase_token')||localStorage.getItem('access_token')||localStorage.getItem('token')||sessionStorage.getItem('minegram_token')||sessionStorage.getItem('minegram_access_token')||sessionStorage.getItem('access_token')||sessionStorage.getItem('token')||''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(name){return String(name||'M').trim().charAt(0).toUpperCase()||'M'}
function avatar(item,cls){const name=item?.displayName||item?.username||'M';const src=item?.avatar||item?.avatar_url||item?.profile_image||'';return `<div class="${cls}">${src?`<img src="${esc(src)}" alt="" loading="lazy">`:esc(initials(name))}</div>`}
async function api(url,opt={}){const t=getToken();token=t;const headers={...(opt.headers||{})};if(t)headers.Authorization='Bearer '+t;let body=opt.body;if(body&&typeof body!=='string'&&!(body instanceof FormData)){headers['Content-Type']='application/json';body=JSON.stringify(body)};const c=new AbortController();const timer=setTimeout(()=>c.abort(),15000);try{const r=await fetch(url,{...opt,body,headers,credentials:'include',cache:'no-store',signal:c.signal});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.error||d.message||('HTTP '+r.status));e.status=r.status;throw e}return d}finally{clearTimeout(timer)}}
function authError(e){return e?.status===401||e?.status===403||/jwt|unauthorized|invalid token|expired|authenticated/i.test(String(e?.message||''))}
function login(){location.href='giris.html'}
function toast(text){const el=$('toast');el.textContent=text;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}
function timeText(ts){if(ts===null||ts===undefined||ts==='')return '';let d;if(typeof ts==='number'||/^\d+(\.\d+)?$/.test(String(ts).trim())){let n=Number(ts);if(n>0&&n<100000000000)n*=1000;d=new Date(n)}else{d=new Date(String(ts))}if(Number.isNaN(d.getTime()))return '';const diff=Math.max(0,Date.now()-d.getTime());if(diff<60000)return 'şimdi';if(diff<3600000)return Math.floor(diff/60000)+' dk';if(diff<86400000)return Math.floor(diff/3600000)+' sa';if(diff<604800000)return Math.floor(diff/86400000)+' gün';return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function normalizeMessages(raw,me){const map=new Map();if(!Array.isArray(raw))return [];for(const item of raw){if(!item)continue;const m=item.message&&typeof item.message==='object'?{...item,...item.message}:item;const sender=m.sender||m.from||m.sender_username||m.senderUsername||m.user?.username||m.senderUser?.username||'';const recipient=m.recipient||m.to||m.receiver||m.recipient_username||m.recipientUsername||m.receiverUser?.username||'';const senderClean=String(sender).replace(/^@/,'').trim();const recipientClean=String(recipient).replace(/^@/,'').trim();const other=senderClean.toLowerCase()===String(me).toLowerCase()?recipientClean:senderClean;if(!other||other.toLowerCase()===String(me).toLowerCase())continue;const key=other.toLowerCase();let createdRaw=m.createdAt??m.created_at??m.timestamp??m.time??m.sentAt??m.sent_at??m.message_time??0;let created;if(typeof createdRaw==='number')created=createdRaw;else if(String(createdRaw).trim()&&/^\d+(\.\d+)?$/.test(String(createdRaw).trim())){created=Number(createdRaw);if(created<100000000000)created*=1000}else{created=Date.parse(String(createdRaw))||0}const old=map.get(key);if(old&&Number(old.createdAt||0)>created)continue;const user=m.user||m.profile||m.senderUser||m.recipientUser||{};const last=typeof m.lastMessage==='object'?m.lastMessage:{};const displayName=m.displayName||m.display_name||m.name||user.displayName||user.display_name||user.name||other;const avatarUrl=m.avatar||m.avatar_url||m.profile_image||m.profileImage||user.avatar||user.avatar_url||user.profile_image||'';const text=m.text||m.message||m.content||m.last_message||m.lastMessageText||last.text||last.message||last.content||(m.type==='voice'?'🎙️ Sesli mesaj':'');const verified=!!(m.verified||m.is_verified||m.verified_user||user.verified||user.is_verified);map.set(key,{username:other,displayName,avatar:avatarUrl,verified,text,createdAt:created,read:m.read===true||m.is_read===true||last.read===true})}return [...map.values()]}
function renderNotes(){const saved=loadNote();const mine={username:currentUser||'M',displayName:'Notun',text:saved.text,music:saved.music,avatar:saved.avatar,plus:true};$('notes').innerHTML=noteHtml(mine);}
function noteHtml(n){const music=n.music;const has=!!(n.text||music);return `<div class="note" data-username="${esc(n.username||'')}" data-mine="${n.plus?'1':'0'}"><div class="note-card">${has?`<div class="note-bubble">${music?`<div class="note-music-title">${esc(music.title||'Müzik')}</div><div class="note-music-artist">${esc(music.artist||'')}</div>`:''}${n.text?`<div class="note-message">${esc(n.text)}</div>`:''}</div>`:''}${avatar(n,'note-avatar')}${n.plus?'<button class="note-plus" type="button">+</button>':''}</div><div class="note-name ${n.plus?'mine':''}">${esc(n.plus?'Notun':n.displayName||n.username||'')}</div>${music?'<div class="music-play">▶ Şarkıyı çal</div>':''}</div>`}
function loadNote(){try{const x=JSON.parse(localStorage.getItem('minegram_my_note')||'null');if(!x)return{text:'',music:null,avatar:''};if(x.createdAt&&Date.now()-x.createdAt>=86400000){localStorage.removeItem('minegram_my_note');return{text:'',music:null,avatar:''}}return x}catch{return{text:'',music:null,avatar:''}}}
function saveNote(){const text=$('noteText').value.trim();if(!text&&!selectedMusic){localStorage.removeItem('minegram_my_note')}else{localStorage.setItem('minegram_my_note',JSON.stringify({text,music:selectedMusic,createdAt:Date.now(),avatar:''}))}renderNotes();closeNote()}
function openNote(){const n=loadNote();$('noteText').value=n.text||'';selectedMusic=n.music||null;renderSelectedMusic();$('noteModal').classList.add('show')}
function closeNote(){$('noteModal').classList.remove('show');$('musicResults').innerHTML='';if(noteMusicAudio){noteMusicAudio.pause();noteMusicAudio=null}}
function renderSelectedMusic(){const box=$('selectedMusic');if(!selectedMusic){box.classList.remove('show');return}box.classList.add('show');$('selectedMusicTitle').textContent=selectedMusic.title||'Müzik';$('selectedMusicArtist').textContent=selectedMusic.artist||''}
async function searchMusic(){const q=$('musicQuery').value.trim();if(!q)return;$('musicResults').innerHTML='<div class="loading">Müzik aranıyor...</div>';try{const r=await fetch('https://api.deezer.com/search?q='+encodeURIComponent(q)+'&limit=20');const d=await r.json();$('musicResults').innerHTML=(d.data||[]).map(x=>`<div class="music-item"><img class="music-art" src="${esc(x.album?.cover_small||'')}" alt=""><div class="music-info"><div class="music-title">${esc(x.title)}</div><div class="music-artist">${esc(x.artist?.name||'')}</div></div><button class="music-select" data-id="${esc(x.id)}" data-title="${esc(x.title)}" data-artist="${esc(x.artist?.name||'')}" data-preview="${esc(x.preview||'')}" data-art="${esc(x.album?.cover_small||'')}">Seç</button></div>`).join('')||'<div class="empty">Müzik bulunamadı.</div>'}catch{$('musicResults').innerHTML='<div class="empty">Müzik aranamadı.</div>'}}
function renderMessages(list){conversations=list||[];if(!conversations.length){$('messageList').innerHTML='<div class="empty">Henüz sohbet yok.</div>';return}$('messageList').innerHTML=conversations.map(m=>{const unread=Number(m.unread||0);return `<a class="message-row" href="mesaj.html?username=${encodeURIComponent(m.username)}" data-username="${esc(m.username)}">${avatar(m,'message-avatar')}<div class="message-info"><div class="message-user"><span class="message-user-name">${esc(m.displayName||m.username)}</span>${m.verified?'<span class="verified">✓</span>':''}</div><div class="message-preview">${esc(m.text||'Henüz mesaj yok')}</div><div class="message-meta">${timeText(m.createdAt)}</div></div>${unread?`<span class="unread">${unread>99?'99+':unread}</span>`:''}<div class="chevron">›</div></a>`}).join('')}
async function loadMessages(silent=false){if(!getToken()){login();return}if(!silent)$('messageList').innerHTML='<div class="loading">Mesajlar yükleniyor...</div>';try{const me=await api(API+'/api/me');currentUser=me?.username||me?.user?.username||currentUser;const data=await api(API+'/api/messages');const raw=Array.isArray(data)?data:(data?.messages||data?.items||data?.conversations||data?.chats||data?.data||data?.results||data?.records||data?.rows||[]);const users=normalizeMessages(raw,currentUser);const counts={};raw.forEach(item=>{const m=item?.message&&typeof item.message==='object'?{...item,...item.message}:item;if(!m)return;const sender=String(m.sender||m.from||m.sender_username||m.senderUsername||m.user?.username||'').replace(/^@/,'').trim();const recipient=String(m.recipient||m.to||m.receiver||m.recipient_username||m.recipientUsername||'').replace(/^@/,'').trim();const other=sender.toLowerCase()===String(currentUser).toLowerCase()?recipient:sender;const explicitUnread=Number(m.unreadCount??m.unread_count??m.unread??0);if(explicitUnread>0&&other)counts[other.toLowerCase()]=Math.max(counts[other.toLowerCase()]||0,explicitUnread);else if(other&&other.toLowerCase()!==String(currentUser).toLowerCase()&&m.read!==true&&m.is_read!==true&&sender.toLowerCase()!==String(currentUser).toLowerCase())counts[other.toLowerCase()]=(counts[other.toLowerCase()]||0)+1});users.forEach(x=>x.unread=Number(x.unread||counts[String(x.username).toLowerCase()]||0));users.sort((a,b)=>(b.unread-a.unread)||(Number(b.createdAt)-Number(a.createdAt)));renderMessages(users);renderNotes()}catch(e){console.error(e);if(authError(e)){login();return}if(!silent)renderMessages([])}}
async function searchUsers(q){if(!q){$('searchResults').classList.remove('show');return}$('searchResults').classList.add('show');$('searchResults').innerHTML='<div class="loading">Kullanıcı aranıyor...</div>';try{const data=await api(API+'/api/users?search='+encodeURIComponent(q));const users=(Array.isArray(data)?data:(data?.users||data?.items||data?.profiles||[])).map(u=>({username:u.username||u.user?.username||'',displayName:u.displayName||u.display_name||u.name||u.username||'',avatar:u.avatar||u.avatar_url||u.profile_image||'',verified:!!(u.verified||u.is_verified)})).filter(u=>u.username&&!u.username.toLowerCase().includes(String(currentUser).toLowerCase()));$('searchResults').innerHTML=users.map(u=>`<a class="search-result" href="mesaj.html?username=${encodeURIComponent(u.username)}">${avatar(u,'message-avatar')}<div class="result-info"><div class="result-name">${esc(u.displayName||u.username)} ${u.verified?'✓':''}</div><div class="result-sub">Mesaj göndermek için dokun</div></div><div class="chevron">›</div></a>`).join('')||'<div class="empty">Kullanıcı bulunamadı</div>'}catch{$('searchResults').innerHTML='<div class="empty">Kullanıcı aranamadı.</div>'}}
async function refresh(){if(pulling)return;pulling=true;$('pullIndicator').classList.add('show','refreshing');$('pullIndicator').style.transform='translate(-50%,0)';try{await loadMessages(true);toast('Yenilendi')}finally{setTimeout(()=>{$('pullIndicator').classList.remove('refreshing','show');$('pullIndicator').style.transform='translate(-50%,-80px)';pulling=false},350)}}
function setupPull(){window.addEventListener('touchstart',e=>{if(window.scrollY<=1)pullStartY=e.touches[0].clientY},{passive:true});window.addEventListener('touchmove',e=>{if(pulling||window.scrollY>1||!pullStartY)return;const dy=e.touches[0].clientY-pullStartY;if(dy>0){pullDistance=Math.min(110,dy*.65);$('pullIndicator').classList.add('show');$('pullIndicator').style.transform=`translate(-50%,${Math.max(-30,pullDistance-58)}px)`}},{passive:true});window.addEventListener('touchend',()=>{if(pullDistance>=64)refresh();else{$('pullIndicator').classList.remove('show');$('pullIndicator').style.transform='translate(-50%,-80px)'}pullDistance=0;pullStartY=0})}
$('back').onclick=()=>history.length>1?history.back():(location.href='index.html');$('search').addEventListener('input',e=>{const q=e.target.value.trim();$('searchClear').style.display=q?'block':'none';clearTimeout(searchTimer);searchTimer=setTimeout(()=>searchUsers(q),250)});$('searchClear').onclick=()=>{$('search').value='';$('searchClear').style.display='none';$('searchResults').classList.remove('show');$('search').focus()};$('notes').addEventListener('click',e=>{const note=e.target.closest('.note');if(!note)return;if(note.dataset.mine==='1'){if(e.target.closest('.note-plus')){openNote();return}if(e.target.closest('.music-play')){const n=loadNote();if(n.music?.preview){if(noteMusicAudio){noteMusicAudio.pause();noteMusicAudio=null}else{noteMusicAudio=new Audio(n.music.preview);noteMusicAudio.play().catch(()=>{});}}else openNote();return}openNote()}else{const u=note.dataset.username;if(u)location.href='mesaj.html?username='+encodeURIComponent(u)}});$('messageList').addEventListener('click',async e=>{const row=e.target.closest('.message-row');if(!row)return;const u=row.dataset.username;try{await api(API+'/api/messages/read',{method:'POST',body:{username:u}})}catch{} });$('noteClose').onclick=closeNote;$('cancelNote').onclick=closeNote;$('saveNote').onclick=saveNote;$('deleteNote').onclick=()=>{localStorage.removeItem('minegram_my_note');renderNotes();closeNote()};$('removeMusic').onclick=()=>{selectedMusic=null;renderSelectedMusic()};$('musicSearchBtn').onclick=searchMusic;$('musicQuery').addEventListener('keydown',e=>{if(e.key==='Enter')searchMusic()});$('musicResults').addEventListener('click',e=>{const b=e.target.closest('.music-select');if(!b)return;selectedMusic={id:b.dataset.id,title:b.dataset.title,artist:b.dataset.artist,preview:b.dataset.preview,artwork:b.dataset.art};renderSelectedMusic();$('musicResults').innerHTML=''});$('noteModal').addEventListener('click',e=>{if(e.target===$('noteModal'))closeNote()});setupPull();renderNotes();loadMessages();pollTimer=setInterval(()=>loadMessages(true),5000);window.addEventListener('beforeunload',()=>clearInterval(pollTimer));
</script>
