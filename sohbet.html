<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Minegram • Sohbet</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100dvh;
  background:#000;
  display:flex;
  flex-direction:column;
}


/* ==================================================
   HEADER
================================================== */

.header{
  height:72px;
  min-height:72px;
  display:flex;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid #24242a;
  background:#000;
  position:relative;
  z-index:20;
}

.back{
  width:48px;
  height:48px;
  border:0;
  background:none;
  color:#fff;
  font-size:46px;
  line-height:1;
  padding:0;
  margin-left:-7px;
}

.profile{
  display:flex;
  align-items:center;
  min-width:0;
  flex:1;
  margin-left:3px;
}

.profile-avatar{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:50%;
  background:#64afe9;
  display:grid;
  place-items:center;
  overflow:hidden;
  font-size:20px;
  font-weight:500;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-info{
  min-width:0;
  margin-left:12px;
}

.profile-name{
  font-size:20px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.profile-status{
  color:#999;
  font-size:13px;
  margin-top:3px;
}

.verified{
  display:inline-grid;
  place-items:center;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#2388df;
  color:#fff;
  font-size:12px;
  font-weight:bold;
  vertical-align:middle;
  margin-left:4px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:5px;
}

.header-button{
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:25px;
}

.header-button:active{
  background:#1b1b20;
}


/* ==================================================
   CHAT AREA
================================================== */

.chat{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:18px 15px 20px;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:5px;
}

.chat::-webkit-scrollbar-track{
  background:#000;
}

.chat::-webkit-scrollbar-thumb{
  background:#29272e;
  border-radius:10px;
}


/* DATE */

.date{
  text-align:center;
  color:#888;
  font-size:12px;
  margin:8px 0 20px;
}


/* EMPTY */

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#777;
  font-size:14px;
}


/* MESSAGE */

.message{
  display:flex;
  width:100%;
  margin:5px 0;
}

.message.me{
  justify-content:flex-end;
}

.message.other{
  justify-content:flex-start;
}

.message-content{
  max-width:76%;
  display:flex;
  flex-direction:column;
}

.bubble{
  padding:10px 14px;
  border-radius:21px;
  font-size:16px;
  line-height:1.35;
  word-wrap:break-word;
  overflow-wrap:anywhere;
}

.message.other .bubble{
  background:#26242b;
  color:#fff;
  border-bottom-left-radius:6px;
}

.message.me .bubble{
  background:#3797f0;
  color:#fff;
  border-bottom-right-radius:6px;
}

.time{
  font-size:10px;
  color:#777;
  margin-top:3px;
  padding:0 5px;
}

.message.me .time{
  text-align:right;
}


/* IMAGE MESSAGE */

.message-image{
  max-width:270px;
  max-height:360px;
  border-radius:18px;
  display:block;
  object-fit:cover;
}

.message.me .message-image{
  border-bottom-right-radius:6px;
}

.message.other .message-image{
  border-bottom-left-radius:6px;
}


/* LINK */

.message-link{
  color:#fff;
  text-decoration:underline;
}


/* ==================================================
   TYPING
================================================== */

.typing{
  display:none;
  align-items:center;
  gap:5px;
  background:#26242b;
  width:max-content;
  padding:9px 13px;
  border-radius:20px;
  border-bottom-left-radius:6px;
  margin:6px 0;
}

.typing.show{
  display:flex;
}

.dot{
  width:6px;
  height:6px;
  background:#aaa;
  border-radius:50%;
  animation:typing 1.2s infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.45;
  }

  30%{
    transform:translateY(-4px);
    opacity:1;
  }
}


/* ==================================================
   INPUT AREA
================================================== */

.input-area{
  min-height:70px;
  padding:8px 10px;
  padding-bottom:max(8px,env(safe-area-inset-bottom));
  background:#000;
  border-top:1px solid #24242a;
  display:flex;
  align-items:flex-end;
  gap:7px;
  z-index:30;
}

.input-button{
  width:44px;
  height:44px;
  min-width:44px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:25px;
}

.input-button:active{
  background:#19191e;
}

.input-box{
  flex:1;
  min-width:0;
  min-height:44px;
  max-height:130px;
  background:#18171c;
  border:1px solid #39363f;
  border-radius:23px;
  display:flex;
  align-items:center;
  padding:0 14px;
}

#messageInput{
  width:100%;
  min-height:42px;
  max-height:120px;
  resize:none;
  overflow-y:auto;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:16px;
  line-height:21px;
  padding:10px 0;
}

#messageInput::placeholder{
  color:#888;
}

.send{
  width:45px;
  height:45px;
  min-width:45px;
  border:0;
  border-radius:50%;
  background:#3797f0;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:21px;
}

.send:active{
  transform:scale(.94);
}

.send:disabled{
  opacity:.45;
}


/* ==================================================
   EMOJI PANEL
================================================== */

.emoji-panel{
  display:none;
  position:absolute;
  left:0;
  right:0;
  bottom:70px;
  background:#151419;
  border-top:1px solid #2a2930;
  padding:12px;
  grid-template-columns:repeat(8,1fr);
  gap:8px;
  z-index:25;
}

.emoji-panel.show{
  display:grid;
}

.emoji{
  border:0;
  background:transparent;
  color:#fff;
  font-size:25px;
  padding:7px;
  border-radius:10px;
}

.emoji:active{
  background:#29272e;
}


/* ==================================================
   IMAGE PREVIEW
================================================== */

.preview{
  display:none;
  position:absolute;
  left:12px;
  right:12px;
  bottom:75px;
  background:#18171c;
  border:1px solid #333139;
  border-radius:16px;
  padding:10px;
  z-index:40;
}

.preview.show{
  display:flex;
  align-items:center;
  gap:10px;
}

.preview img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:10px;
}

.preview-info{
  flex:1;
  min-width:0;
  font-size:13px;
  color:#ccc;
}

.preview-remove{
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:#29272e;
  color:#fff;
}


/* ==================================================
   TOAST
================================================== */

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#29272e;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:100;
}

.toast.show{
  opacity:1;
}


/* ==================================================
   DESKTOP
================================================== */

@media(min-width:700px){

  .app{
    max-width:720px;
    margin:auto;
    border-left:1px solid #202024;
    border-right:1px solid #202024;
  }

  .header{
    padding-left:20px;
    padding-right:20px;
  }

  .chat{
    padding-left:25px;
    padding-right:25px;
  }

  .input-area{
    padding-left:15px;
    padding-right:15px;
  }

  .preview{
    max-width:690px;
    left:50%;
    right:auto;
    width:690px;
    transform:translateX(-50%);
  }
}


/* ==================================================
   SMALL MOBILE
================================================== */

@media(max-width:380px){

  .header{
    padding:0 10px;
  }

  .profile-avatar{
    width:43px;
    height:43px;
    min-width:43px;
  }

  .profile-info{
    margin-left:8px;
  }

  .profile-name{
    font-size:17px;
  }

  .header-button{
    width:38px;
    height:38px;
  }

  .bubble{
    font-size:15px;
  }

  .message-content{
    max-width:82%;
  }

  .emoji-panel{
    grid-template-columns:repeat(7,1fr);
  }
}
</style>
</head>


<body>

<script>

/* ==================================================
   TEMEL
================================================== */

const token =
  localStorage.getItem('minegram_token') ||
  localStorage.getItem('token') ||
  '';

const params =
  new URLSearchParams(
    location.search
  );

const username =
  params.get('username') ||
  'test';


const $ = id =>
  document.getElementById(id);


/* ==================================================
   HTML GÜVENLİĞİ
================================================== */

function esc(value){

  return String(
    value ?? ''
  ).replace(
    /[&<>"']/g,
    char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[char])
  );

}


/* ==================================================
   API
================================================== */

async function api(
  url,
  options={}
){

  const headers = {
    ...(options.headers || {})
  };


  if(token){

    headers.Authorization =
      'Bearer ' + token;

  }


  if(
    options.body &&
    typeof options.body !== 'string'
  ){

    headers['Content-Type'] =
      'application/json';

    options.body =
      JSON.stringify(
        options.body
      );

  }


  const response =
    await fetch(
      url,
      {
        ...options,
        headers
      }
    );


  if(!response.ok){

    let error = {};

    try{
      error =
        await response.json();
    }catch(e){}

    throw new Error(
      error.error ||
      'HTTP ' + response.status
    );

  }


  if(
    response.status === 204
  ){

    return {};

  }


  return response
    .json()
    .catch(() => ({}));

}


/* ==================================================
   TOAST
================================================== */

function toast(message){

  $('toast').textContent =
    message;

  $('toast').classList.add(
    'show'
  );

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(
      () => {

        $('toast')
          .classList
          .remove('show');

      },
      1800
    );

}


/* ==================================================
   PROFİL
================================================== */

let currentUser = {

  username,
  displayName:
    username,

  avatar:'',
  verified:false

};


function setProfile(user){

  currentUser = {

    ...currentUser,
    ...user

  };


  const name =
    currentUser.displayName ||
    currentUser.username ||
    username;


  $('profileName').innerHTML =
    esc(name) +

    (
      currentUser.verified

      ? `
        <span class="verified">
          ✓
        </span>
      `

      : ''
    );


  $('profileStatus')
    .textContent =
      currentUser.online
      ? 'Çevrimiçi'
      : '';


  const avatar =
    $('profileAvatar');


  if(currentUser.avatar){

    avatar.innerHTML = `
      <img
        src="${esc(
          currentUser.avatar
        )}"
        alt=""
      >
    `;

  }else{

    avatar.textContent =
      (
        name[0] ||
        'M'
      ).toUpperCase();

  }

}


/* ==================================================
   MESAJ NORMALLEŞTİRME
================================================== */

function normalizeMessage(m){

  const sender =
    m.sender ||
    m.from ||
    m.sender_username ||
    m.username ||
    '';

  const recipient =
    m.recipient ||
    m.to ||
    m.recipient_username ||
    '';

  const text =
    m.text ||
    m.message ||
    m.content ||
    '';


  let mine =
    m.mine;


  if(
    mine === undefined
  ){

    mine =
      String(sender)
        .toLowerCase() !==
      String(username)
        .toLowerCase();

  }


  return {

    id:
      m.id ||
      m.message_id ||
      Date.now() +
      Math.random(),

    sender,

    recipient,

    text,

    image:
      m.image ||
      m.image_url ||
      '',

    mine:!!mine,

    createdAt:
      m.createdAt ||
      m.created_at ||
      m.timestamp ||
      Date.now()

  };

}


/* ==================================================
   TARİH
================================================== */

function formatTime(value){

  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return '';

  }


  return date.toLocaleTimeString(
    'tr-TR',
    {
      hour:'2-digit',
      minute:'2-digit'
    }
  );

}


/* ==================================================
   MESAJ GÖSTER
================================================== */

function renderMessages(messages){

  const chat =
    $('chat');

  const empty =
    $('empty');

  const typing =
    $('typing');


  chat
    .querySelectorAll(
      '.message'
    )
    .forEach(
      el => el.remove()
    );


  if(!messages.length){

    empty.style.display =
      'flex';

    return;

  }


  empty.style.display =
    'none';


  messages
    .sort(
      (a,b) =>
        new Date(a.createdAt) -
        new Date(b.createdAt)
    )
    .forEach(
      message => {

        const wrapper =
          document.createElement(
            'div'
          );


        wrapper.className =
          'message ' +
          (
            message.mine
            ? 'me'
            : 'other'
          );


        const content =
          document.createElement(
            'div'
          );


        content.className =
          'message-content';


        let html = '';


        if(message.image){

          html += `
            <img
              class="message-image"
              src="${esc(
                message.image
              )}"
              alt="Fotoğraf"
            >
          `;

        }


        if(message.text){

          const safe =
            esc(
              message.text
            ).replace(
              /\n/g,
              '<br>'
            );


          html += `
            <div class="bubble">
              ${safe}
            </div>
          `;

        }


        html += `
          <div class="time">
            ${formatTime(
              message.createdAt
            )}
          </div>
        `;


        content.innerHTML =
          html;


        wrapper.appendChild(
          content
        );


        chat.insertBefore(
          wrapper,
          typing
        );

      }
    );


  scrollBottom();

}


/* ==================================================
   SCROLL
================================================== */

function scrollBottom(){

  requestAnimationFrame(
    () => {

      $('chat').scrollTop =
        $('chat').scrollHeight;

    }
  );

}


/* ==================================================
   MESAJLARI API'DEN AL
================================================== */

async function loadMessages(){

  try{

    /*
      Farklı backend isimleriyle
      uyumlu olması için birkaç
      olası endpoint destekleniyor.
    */

    let data;


    try{

      data =
        await api(
          '/api/messages?username=' +
          encodeURIComponent(
            username
          )
        );

    }catch(error){

      data =
        await api(
          '/api/messages/' +
          encodeURIComponent(
            username
          )
        );

    }


    let raw =
      Array.isArray(data)

      ? data

      : (
          data.messages ||
          data.items ||
          data.data ||
          []
        );


    const messages =
      raw.map(
        normalizeMessage
      );


    renderMessages(
      messages
    );


  }catch(error){

    /*
      API yoksa sohbet boş kalır.
      Demo mesaj eklenmez.
    */

    renderMessages([]);

  }

}


/* ==================================================
   PROFİLİ YÜKLE
================================================== */

async function loadProfile(){

  setProfile({

    username,
    displayName:
      username

  });


  try{

    const data =
      await api(
        '/api/users/' +
        encodeURIComponent(
          username
        )
      );


    const user =
      data.user ||
      data;


    if(user){

      setProfile(user);

    }

  }catch(error){

    try{

      const data =
        await api(
          '/api/users?search=' +
          encodeURIComponent(
            username
          )
        );


      const users =
        Array.isArray(data)
        ? data
        : (
            data.users ||
            data.items ||
            []
          );


      const user =
        users.find(
          u =>
            String(
              u.username
            ).toLowerCase() ===
            String(
              username
            ).toLowerCase()
        );


      if(user){

        setProfile(user);

      }

    }catch(e){}

  }

}


/* ==================================================
   GÖNDERME
================================================== */

let selectedImage =
  null;


async function sendMessage(){

  const input =
    $('messageInput');


  const text =
    input.value.trim();


  if(
    !text &&
    !selectedImage
  ){

    return;

  }


  const button =
    $('sendButton');


  button.disabled =
    true;


  try{

    /*
      Fotoğraf seçilmişse önce
      fotoğrafı göndermeyi deniyoruz.
    */

    if(selectedImage){

      const form =
        new FormData();


      form.append(
        'recipient',
        username
      );


      if(text){

        form.append(
          'message',
          text
        );

      }


      form.append(
        'image',
        selectedImage
      );


      const headers = {};


      if(token){

        headers.Authorization =
          'Bearer ' + token;

      }


      let response =
        await fetch(
          '/api/messages',
          {
            method:'POST',
            headers,
            body:form
          }
        );


      if(!response.ok){

        throw new Error(
          'Fotoğraf gönderilemedi'
        );

      }


      clearSelectedImage();


    }else{

      /*
        Normal mesaj
      */

      await api(
        '/api/messages',
        {
          method:'POST',

          body:{
            recipient:
              username,

            to:
              username,

            message:
              text,

            text:
              text
          }
        }
      );

    }


    input.value =
      '';

    resizeInput();


    await loadMessages();

    scrollBottom();


  }catch(error){

    /*
      Backend endpoint'i farklıysa
      kullanıcıya hata gösterilir.
    */

    toast(
      error.message ||
      'Mesaj gönderilemedi'
    );

  }


  updateSendButton();

}


/* ==================================================
   INPUT
================================================== */

$('messageInput')
  .addEventListener(
    'input',
    () => {

      resizeInput();

      updateSendButton();

    }
  );


$('messageInput')
  .addEventListener(
    'keydown',
    event => {

      if(
        event.key === 'Enter' &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


function resizeInput(){

  const input =
    $('messageInput');


  input.style.height =
    '42px';


  input.style.height =
    Math.min(
      input.scrollHeight,
      120
    ) + 'px';

}


function updateSendButton(){

  const hasText =
    $('messageInput')
      .value
      .trim()
      .length > 0;


  $('sendButton').disabled =
    !hasText &&
    !selectedImage;

}


/* ==================================================
   FOTOĞRAF
================================================== */

$('photoButton').onclick =
  () => {

    $('photoInput').click();

  };


$('photoInput').addEventListener(
  'change',
  event => {

    const file =
      event.target.files[0];


    if(!file){

      return;

    }


    if(
      !file.type.startsWith(
        'image/'
      )
    ){

      toast(
        'Lütfen fotoğraf seç.'
      );

      return;

    }


    selectedImage =
      file;


    const url =
      URL.createObjectURL(
        file
      );


    $('previewImage').src =
      url;


    $('previewInfo').textContent =
      file.name;


    $('preview')
      .classList
      .add('show');


    updateSendButton();

  }
);


function clearSelectedImage(){

  selectedImage =
    null;


  $('photoInput').value =
    '';


  $('preview')
    .classList
    .remove('show');


  $('previewImage').src =
    '';

  updateSendButton();

}


$('previewRemove').onclick =
  clearSelectedImage;


/* ==================================================
   EMOJI
================================================== */

$('emojiButton').onclick =
  () => {

    $('emojiPanel')
      .classList
      .toggle('show');

  };


document
  .querySelectorAll(
    '.emoji'
  )
  .forEach(
    button => {

      button.addEventListener(
        'click',
        () => {

          const input =
            $('messageInput');


          const emoji =
            button.textContent;


          const start =
            input.selectionStart;


          const end =
            input.selectionEnd;


          input.value =
            input.value.slice(
              0,
              start
            ) +
            emoji +
            input.value.slice(
              end
            );


          input.focus();


          input.selectionStart =
            input.selectionEnd =
              start +
              emoji.length;


          resizeInput();

          updateSendButton();

        }
      );

    }
  );


/* ==================================================
   GÖNDER BUTONU
================================================== */

$('sendButton').onclick =
  sendMessage;


/* ==================================================
   GERİ
================================================== */

$('back').onclick =
  () => {

    if(
      history.length > 1
    ){

      history.back();

    }else{

      location.href =
        'mesajlar.html';

    }

  };


/* ==================================================
   ARAMA / VİDEO / MENÜ
================================================== */

$('callButton').onclick =
  () => {

    toast(
      'Sesli arama yakında.'
    );

  };


$('videoButton').onclick =
  () => {

    toast(
      'Görüntülü arama yakında.'
    );

  };


$('moreButton').onclick =
  () => {

    toast(
      'Sohbet seçenekleri yakında.'
    );

  };


/* ==================================================
   DIŞARI TIKLAMA
================================================== */

document.addEventListener(
  'click',
  event => {

    const panel =
      $('emojiPanel');

    const button =
      $('emojiButton');


    if(
      panel.classList.contains(
        'show'
      ) &&
      !panel.contains(
        event.target
      ) &&
      event.target !== button
    ){

      panel.classList.remove(
        'show'
      );

    }

  }
);


/* ==================================================
   BAŞLAT
================================================== */

(async function(){

  const today =
    new Date();


  $('date').textContent =
    today.toLocaleDateString(
      'tr-TR',
      {
        day:'numeric',
        month:'long',
        year:'numeric'
      }
    );


  await loadProfile();

  await loadMessages();

  scrollBottom();

})();


/* ==================================================
   OTOMATİK YENİLEME
================================================== */

setInterval(
  () => {

    if(
      document.visibilityState ===
      'visible'
    ){

      loadMessages();

    }

  },
  5000
);

</script>
