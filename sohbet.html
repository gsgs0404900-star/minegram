<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Minegram • Mesajlar</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif
}
body{overflow-x:hidden}
.app{min-height:100dvh;background:#000}
button,input{font:inherit}
button{cursor:pointer}

.header{
  height:52px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #24242a;
  background:#000;
  position:sticky;
  top:0;

}

.back{
  width:34px;
  height:40px;
  border:0;
  background:none;

}

.title{

.search-wrap{padding:9px 12px 0}

.search{

.search-icon{

.note-name{

}

.chat-menu button.danger .menu-icon svg{

.chat-menu button .menu-check{

.chat-menu button.danger{

.chat-menu button.danger .menu-icon{

.chat-flag{

.pull-indicator{

.pull-ring{

<body>

<script>

const API='https://minegram-hwns.onrender.com';

let token='';
let currentUser='';
let conversations=[];
let searchTimer=null;
let pollTimer=null;
let pulling=false;
let pullStartY=0;
let pullDistance=0;
let selectedMusic=null;
let noteMusicAudio=null;

let firebaseReady=false;
let firebaseDb=null;
let firebaseAuth=null;
let firebaseUnsubs=[];
let firebaseData=new Map();
let firebaseUnread=new Map();
let firebaseProfiles=new Map();
let apiUsers=new Map();
let startedUsers=new Set();

let FIREBASE_CONFIG=(()=>{
  try{
    const a=window.MINEGRAM_FIREBASE_CONFIG;
    if(a&&a.projectId)return a;

    const s=localStorage.getItem('minegram_firebase_config');

    if(s){
      const x=JSON.parse(s);
      if(x&&x.projectId)return x;
    }
  }catch{}

  return {
    apiKey:'AIzaSyBgJjz0LOWY2DO55h3sxsovBIlBOGjJwIo',
    authDomain:'mim-ea133.firebaseapp.com',
    projectId:'mim-ea133',
    storageBucket:'mim-ea133.firebasestorage.app',
    messagingSenderId:'303525353436',
    databaseURL:'https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app'
  };
})();

async function discoverFirebaseConfig(){

  if(FIREBASE_CONFIG&&FIREBASE_CONFIG.projectId)
    return FIREBASE_CONFIG;

  const urls=[
    '/api/firebase-config',
    '/firebase-config.json',
    '/api/config/firebase'
  ];

  for(const u of urls){
    try{
      const r=await fetch(
        API+u,
        {
          headers:{
            Authorization:getToken()?'Bearer '+getToken():''
          }
        }
      );

      if(!r.ok)continue;

      const d=await r.json();
      const c=d?.config||d?.firebase||d;

      if(c?.projectId){
        FIREBASE_CONFIG=c;

        try{
          localStorage.setItem(
            'minegram_firebase_config',
            JSON.stringify(c)
          );
        }catch{}

        return c;
      }

    }catch(e){}
  }

  return null;
}

const $=id=>document.getElementById(id);

function getToken(){

  return localStorage.getItem('minegram_token')
    ||localStorage.getItem('minegram_supabase_token')
    ||localStorage.getItem('minegram_access_token')
    ||localStorage.getItem('supabase_token')
    ||localStorage.getItem('access_token')
    ||localStorage.getItem('token')
    ||sessionStorage.getItem('minegram_token')
    ||sessionStorage.getItem('minegram_supabase_token')
    ||sessionStorage.getItem('minegram_access_token')
    ||sessionStorage.getItem('access_token')
    ||sessionStorage.getItem('token')
    ||'';
}

function esc(s){

  return String(s??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function initials(name){

  return String(name||'M')
    .trim()
    .charAt(0)
    .toUpperCase()||'M';
}

function avatar(item,cls){

  const name=item?.displayName||item?.username||'M';

  const src=
    item?.avatar
    ||item?.avatar_url
    ||item?.profile_image
    ||item?.profilePhoto
    ||'';

  return `
    <div class="${cls}">
      ${
        src
        ?`
          <img
            src="${esc(src)}"
            alt=""
            loading="lazy"
            onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"
          >
        `
        :''
      }
      <span style="${src?'display:none':''}">
        ${esc(initials(name))}
      </span>
    </div>
  `;
}

async function api(url,opt={}){

  const t=getToken();
  token=t;

  const headers={...(opt.headers||{})};

  if(t)
    headers.Authorization='Bearer '+t;

  let body=opt.body;

  if(
    body&&
    typeof body!=='string'&&
    !(body instanceof FormData)
  ){
    headers['Content-Type']='application/json';
    body=JSON.stringify(body);
  }

  const c=new AbortController();

  const timer=setTimeout(
    ()=>c.abort(),
    15000
  );

  try{

    const r=await fetch(
      url,
      {
        ...opt,
        body,
        headers,
        credentials:'include',
        cache:'no-store',
        signal:c.signal
      }
    );

    let d={};

    try{
      d=await r.json();
    }catch{}

    if(!r.ok){

      const e=new Error(
        d.error||
        d.message||
        ('HTTP '+r.status)
      );

      e.status=r.status;

      throw e;
    }

    return d;

  }finally{
    clearTimeout(timer);
  }
}

function authError(e){

  return e?.status===401||
    e?.status===403||
    /jwt|unauthorized|invalid token|expired|authenticated/i.test(
      String(e?.message||'')
    );
}

function toast(text){

  const el=$('toast');

  el.textContent=text;

  clearTimeout(el._t);

  el._t=setTimeout(

  );
}

function timeText(ts){

  if(ts===null||ts===undefined||ts==='')
    return '';

  let d;

  if(
    typeof ts==='number'||
    /^\d+(\.\d+)?$/.test(String(ts).trim())
  ){

    let n=Number(ts);

    if(n>0&&n<100000000000)
      n*=1000;

    d=new Date(n);

  }else{

    d=new Date(String(ts));
  }

  if(Number.isNaN(d.getTime()))
    return '';

  const diff=Math.max(
    0,
    Date.now()-d.getTime()
  );

  if(diff<60000)
    return 'şimdi';

  if(diff<3600000)
    return Math.floor(diff/60000)+' dk';

  if(diff<86400000)
    return Math.floor(diff/3600000)+' sa';

  if(diff<604800000)
    return Math.floor(diff/86400000)+' gün';

  return d.toLocaleDateString(
    'tr-TR',
    {
      day:'2-digit',
      month:'2-digit',
      year:'numeric'
    }
  );
}

function toMs(v){

  if(v==null||v==='')
    return 0;

  if(typeof v?.toDate==='function'){

    const d=v.toDate();

    return d instanceof Date
      ?d.getTime()
      :0;
  }

  if(typeof v==='number'){

    return v<100000000000
      ?v*1000
      :v;
  }

  const n=Number(v);

  if(
    Number.isFinite(n)&&
    String(v).trim()!==''
  ){

    return n<100000000000
      ?n*1000
      :n;
  }

  const p=Date.parse(String(v));

  return Number.isFinite(p)
    ?p
    :0;
}

function cleanUser(v){

  return String(v||'')
    .replace(/^@/,'')
    .trim();
}

function conversationKey(a,b){

  return [
    cleanUser(a).toLowerCase(),
    cleanUser(b).toLowerCase()
  ]
  .sort()
  .join('__');
}

function loadStartedUsers(){

  startedUsers.clear();

  try{

    const raw=localStorage.getItem(
      'minegram_chat_started'
    );

    if(raw){

      const x=JSON.parse(raw);

      if(x&&typeof x==='object'){

        Object.entries(x).forEach(
          ([k,v])=>{

            if(
              v===true&&
              k.startsWith('started_')
            ){

              const part=k
                .slice(8)
                .split('__');

              part.forEach(n=>{

                if(
                  n&&
                  n!==currentUser.toLowerCase()
                ){

                  startedUsers.add(n);
                }

              });

            }

          }
        );
      }
    }

    for(
      let i=0;
      i<localStorage.length;
      i++
    ){

      const k=localStorage.key(i)||'';

      if(
        k.startsWith('started_')&&
        localStorage.getItem(k)==='true'
      ){

        k
          .slice(8)
          .split('__')
          .forEach(n=>{

            if(
              n&&
              n!==currentUser.toLowerCase()
            ){

              startedUsers.add(n);
            }

          });
      }
    }

  }catch{}
}

function normalizeApiUser(u){

  u=u||{};

  const x=u.user||u.profile||u;

  return {
    username:cleanUser(
      x.username||
      u.username||
      ''
    ),

    displayName:
      x.displayName||
      x.display_name||
      x.name||
      x.username||
      u.displayName||
      u.display_name||
      u.name||
      u.username||
      '',

    avatar:
      x.avatar||
      x.avatar_url||
      x.profile_image||
      x.profilePhoto||
      u.avatar||
      u.avatar_url||
      u.profile_image||
      '',

    verified:!!(
      x.verified||
      x.is_verified||
      u.verified||
      u.is_verified
    )
  };
}

function normalizeMessage(item){

  const m=
    item?.message&&
    typeof item.message==='object'
    ?{...item,...item.message}
    :item||{};

  const sender=cleanUser(
    m.sender||
    m.from||
    m.sender_username||
    m.senderUsername||
    m.user?.username||
    m.senderUser?.username
  );

  const recipient=cleanUser(
    m.recipient||
    m.to||
    m.receiver||
    m.recipient_username||
    m.recipientUsername||
    m.receiverUser?.username
  );

  const last=
    typeof m.lastMessage==='object'
    ?m.lastMessage
    :{};

  let ts=toMs(
    m.createdAt??
    m.created_at??
    m.timestamp??
    m.sentAt??
    m.sent_at??
    m.message_time??
    last.createdAt??
    m.time
  );

  const other=
    sender.toLowerCase()===
    currentUser.toLowerCase()
    ?recipient
    :sender;

  if(
    !other||
    other.toLowerCase()===
    currentUser.toLowerCase()
  )
    return null;

  const u=normalizeApiUser(
    m.user||
    m.profile||
    m.senderUser||
    m.recipientUser||
    {}
  );

  const text=
    m.text??
    m.message??
    m.content??
    m.last_message??
    m.lastMessageText??
    last.text??
    last.message??
    last.content??
    (
      m.type==='voice'
      ?'🎙️ Sesli mesaj'
      :''
    );

  return {
    username:other,

    displayName:
      m.displayName||
      m.display_name||
      m.name||
      u.displayName||
      other,

    avatar:
      m.avatar||
      m.avatar_url||
      m.profile_image||
      u.avatar||
      '',

    verified:!!(
      m.verified||
      m.is_verified||
      u.verified
    ),

    text:String(text||''),

    createdAt:ts,

    unread:Number(
      m.unreadCount??
      m.unread_count??
      0
    )||0
  };
}

function addConversation(map,item){

  if(!item)
    return;

  const k=item.username.toLowerCase();

  const old=map.get(k);

  if(
    !old||
    item.createdAt>=old.createdAt
  ){

    map.set(
      k,
      {
        ...old,
        ...item,
        createdAt:
          item.createdAt||
          old?.createdAt||
          0
      }
    );
  }

  if(item.unread>0){

    map.get(k).unread=Math.max(
      map.get(k)?.unread||0,
      item.unread
    );
  }
}

function mergeAll(){

  loadStartedUsers();

  const map=new Map();

  for(const [k,v] of apiUsers)
    addConversation(map,v);

  for(const [k,v] of firebaseData)
    addConversation(map,v);

  for(const u of startedUsers){

    if(!map.has(u)){

      const p=
        firebaseProfiles.get(u)||{};

      map.set(
        u,
        {
          username:u,
          displayName:p.displayName||u,
          avatar:p.avatar||'',
          verified:!!p.verified,
          text:'Henüz mesaj yok',
          createdAt:0,
          unread:0
        }
      );
    }
  }

  for(const [k,n] of firebaseUnread){

    if(map.has(k))
      map.get(k).unread=n;
  }

  const out=[
    ...map.values()
  ]
  .filter(
    x=>
      x.username&&
      x.username.toLowerCase()!==
      currentUser.toLowerCase()
  )
  .sort(
    (a,b)=>
      (b.unread-a.unread)||
      (b.createdAt-a.createdAt)||
      a.username.localeCompare(
        b.username,
        'tr'
      )
  );

  renderMessages(out);
}

        text:'',
        music:null,
        avatar:''

      x.createdAt&&

    ){

      localStorage.removeItem(
        'minegram_my_note'
      );

      return {
        text:'',
        music:null,
        avatar:''
      };
    }

    return x;

      music:null,

const CHAT_STATE_KEY=
  'minegram_chat_state_v1';

function chatState(){

  try{

    const x=JSON.parse(
      localStorage.getItem(
        CHAT_STATE_KEY
      )||'{}'
    );

    return x&&typeof x==='object'
      ?x
      :{};

  }catch{

    return {};
  }
}

function saveChatState(x){

  try{

    localStorage.setItem(
      CHAT_STATE_KEY,
      JSON.stringify(x)
    );

  }catch{}
}

function chatEntry(username){

  const k=
    cleanUser(username)
    .toLowerCase();

  const x=chatState();

  return x[k]||{};
}

function setChatState(username,patch){

  const k=
    cleanUser(username)
    .toLowerCase();

  if(!k)
    return;

  const x=chatState();

  x[k]={
    ...(x[k]||{}),
    ...patch
  };

  saveChatState(x);
}

function isChatPinned(username){

  return !!chatEntry(username).pinned;
}

function isChatFlagged(username){

  return !!chatEntry(username).flagged;
}

function isMessagesMuted(username){

  return !!chatEntry(username).messagesMuted;
}

function isCallsMuted(username){

  return !!chatEntry(username).callsMuted;
}

async function deleteConversation(username){

  const u=cleanUser(username);

  if(!u)
    return;

  if(
    !confirm(
      '@'+u+
      ' ile olan tüm mesajlar silinsin mi?'
    )
  )
    return;

  let done=false;

  try{

    if(firebaseDb&&currentUser){

      const sent=
        await firebaseDb
        .collection('chatMessages')
        .where(
          'sender',
          '==',
          currentUser
        )
        .where(
          'recipient',
          '==',
          u
        )
        .get();

      const rec=
        await firebaseDb
        .collection('chatMessages')
        .where(
          'sender',
          '==',
          u
        )
        .where(
          'recipient',
          '==',
          currentUser
        )
        .limit(500)
        .get();

      const docs=[
        ...sent.docs,
        ...rec.docs
      ];

      for(
        let i=0;
        i<docs.length;
        i+=450
      ){

        const batch=
          firebaseDb.batch();

        docs
          .slice(i,i+450)
          .forEach(
            d=>batch.delete(d.ref)
          );

        if(docs.length)
          await batch.commit();
      }

      done=true;
    }

  }catch(e){

    console.warn(
      'Firebase delete',
      e
    );
  }

  try{

    await api(
      API+'/api/messages/delete',
      {
        method:'POST',
        body:{
          username:u
        }
      }
    );

    done=true;

  }catch(e){

    console.warn(
      'API delete',
      e
    );
  }

  const k=u.toLowerCase();

  apiUsers.delete(k);
  firebaseData.delete(k);
  firebaseUnread.delete(k);
  startedUsers.delete(k);

  const st=chatState();

  delete st[k];

  saveChatState(st);

  mergeAll();

  toast(
    done
    ?'Mesajlar silindi'
    :'Sohbet listeden kaldırıldı'
  );
}

async function markUnread(username){

  const u=cleanUser(username);

  if(!u)
    return;

  let count=0;

  try{

    if(firebaseDb&&currentUser){

      const snap=
        await firebaseDb
        .collection('chatMessages')
        .where(
          'recipient',
          '==',
          currentUser
        )
        .where(
          'sender',
          '==',
          u
        )
        .limit(500)
        .get();

      const batch=
        firebaseDb.batch();

      snap.docs.forEach(
        d=>{

          if(d.data()?.read===true){

            batch.update(
              d.ref,
              {
                read:false
              }
            );

            count++;
          }

        }
      );

      if(count)
        await batch.commit();
    }

  }catch(e){

    console.warn(
      'Firebase unread',
      e
    );
  }

  try{

    await api(
      API+'/api/messages/unread',
      {
        method:'POST',
        body:{
          username:u
        }
      }
    );

  }catch(e){}

  firebaseUnread.set(
    u.toLowerCase(),
    Math.max(
      1,
      count||1
    )
  );

  mergeAll();

  toast(
    'Okunmadı olarak işaretlendi'
  );
}

      {
        pinned:
          !isChatPinned(u)
      }
    );

    mergeAll();

    return;
  }

  if(action==='flag'){

    setChatState(
      u,
      {
        flagged:
          !isChatFlagged(u)
      }
    );

    mergeAll();

    return;
  }

  if(action==='messagesMute'){

    setChatState(
      u,
      {
        messagesMuted:
          !isMessagesMuted(u)
      }
    );

    mergeAll();

    return;
  }

  if(action==='callsMute'){

    setChatState(
      u,
      {
        callsMuted:
          !isCallsMuted(u)
      }
    );

    mergeAll();

    return;
  }

  if(action==='unread'){

    markUnread(u);

    return;
  }

  if(action==='delete'){

    deleteConversation(u);

    return;
  }
}

========================================================= */

function renderMessages(list){

  conversations=list||[];

  if(!conversations.length){

    $('messageList').innerHTML=
      '<div class="empty">Henüz sohbet yok.</div>';

    return;
  }

  const state=chatState();

  conversations=[
    ...conversations
  ].sort(
    (a,b)=>{

      const ak=
        state[
          a.username?.toLowerCase()
        ]||{};

      const bk=
        state[
          b.username?.toLowerCase()
        ]||{};

      return (
        Number(!!bk.pinned)-
        Number(!!ak.pinned)
      )||
      (
        b.createdAt-
        a.createdAt
      );
    }
  );

  $('messageList').innerHTML=
    conversations
    .map(
      m=>{

        const unread=
          Number(m.unread||0);

        const pinned=
          isChatPinned(
            m.username
          );

        const flagged=
          isChatFlagged(
            m.username
          );

        return `

          <div
            class="message-row ${unread?'has-unread':''}"
            role="link"
            tabindex="0"
            data-href="mesaj.html?username=${encodeURIComponent(m.username)}"
            data-username="${esc(m.username)}"
          >

            ${avatar(
              m,
              'message-avatar'
            )}

            <div class="message-info">

              <div class="message-user">

                <span class="message-user-name">
                  ${esc(
                    m.displayName||
                    m.username
                  )}
                </span>

                ${
                  m.verified
                  ?'<span class="verified">✓</span>'
                  :''
                }

                ${
                  pinned
                  ?'<span class="chat-pinned">📌</span>'
                  :''
                }

                ${
                  flagged
                  ?'<span class="chat-flag">⚑</span>'
                  :''
                }

              </div>

              <div class="message-preview">
                ${esc(
                  m.text||
                  'Henüz mesaj yok'
                )}
              </div>

              <div class="message-meta">
                ${timeText(m.createdAt)}
              </div>

            </div>

            ${
              unread
              ?`
                <span class="unread">
                  ${
                    unread>99
                    ?'99+'
                    :unread
                  }
                </span>
              `
              :''
            }

            <div class="chevron">
              ›
            </div>


            <!-- 3 NOKTA BUTONU -->
            <button
              class="chat-more"
              type="button"
              aria-label="Sohbet seçenekleri"
              data-chat-more="${esc(m.username)}"
              onclick="
                event.preventDefault();
                event.stopPropagation();
                toggleChatMenu(
                  this.closest('.message-row')
                );
                return false;
              "
            >
              ⋮
            </button>


            <!-- MENÜ -->
            ${chatMenuHtml(m.username)}

          </div>

        `;
      }
    )
    .join('');


  /* Açık menüyü yenileme sonrasında koru */

  if(openChatMenuUser){

    const keep=[
      ...document.querySelectorAll(
        '.message-row'
      )
    ].find(
      r=>
        cleanUser(
          r.dataset.username
        ).toLowerCase()===
        openChatMenuUser
    );

    if(keep){

      keep
        .querySelector('.chat-menu')
        ?.classList.add('show');

    }else{

      openChatMenuUser='';
    }
  }
}

async function loadApiMessages(){

  try{

    let data=
      await api(
        API+'/api/messages'
      );

    let raw=
      Array.isArray(data)
      ?data
      :(
        data?.messages||
        data?.items||
        data?.conversations||
        data?.chats||
        data?.data||
        data?.results||
        data?.records||
        data?.rows||
        []
      );

    if(!raw.length){

      for(
        const path of [
          '/api/chatMessages',
          '/api/messages/firebase',
          '/api/messages/all'
        ]
      ){

        try{

          const d=
            await api(
              API+path
            );

          const a=
            Array.isArray(d)
            ?d
            :(
              d?.messages||
              d?.items||
              d?.data||
              d?.records||
              []
            );

          if(a.length){

            raw=a;

            break;
          }

        }catch{}
      }
    }

    apiUsers.clear();

    for(
      const item of raw
    ){

      const n=
        normalizeMessage(item);

      if(n)
        addConversation(
          apiUsers,
          n
        );
    }

    mergeAll();

  }catch(e){

    if(authError(e)){

      login();

      return;
    }

    console.error(
      'API messages',
      e
    );
  }
}

   PROFİL
========================================================= */

async function loadProfile(username){

  const k=username.toLowerCase();

  if(firebaseProfiles.has(k))
    return firebaseProfiles.get(k);

  try{

    const d=
      await api(
        API+'/api/users/'+
        encodeURIComponent(username)
      );

    const u=
      normalizeApiUser(d);

    if(u.username){

      firebaseProfiles.set(
        k,
        u
      );

      return u;
    }

  }catch{}

  try{

    const d=
      await api(
        API+
        '/api/users?search='+
        encodeURIComponent(username)
      );

    const arr=
      Array.isArray(d)
      ?d
      :(
        d?.users||
        d?.items||
        d?.profiles||
        []
      );

    const u=
      arr
      .map(normalizeApiUser)
      .find(
        x=>
          x.username.toLowerCase()===
          k
      );

    if(u){

      firebaseProfiles.set(
        k,
        u
      );

      return u;
    }

  }catch{}

  return {
    username,
    displayName:username,
    avatar:'',
    verified:false
  };
}


/* =========================================================
   FIREBASE
========================================================= */

async function initFirebase(){

  if(firebaseReady)
    return true;

  if(!window.firebase)
    return false;

  try{

    const cfg=
      await discoverFirebaseConfig();

    if(!cfg)
      return false;

    if(!firebase.apps.length)
      firebase.initializeApp(cfg);

    firebaseAuth=
      firebase.auth();

    if(!firebaseAuth.currentUser)
      await firebaseAuth.signInAnonymously();

    firebaseDb=
      firebase.firestore();

    firebaseReady=true;

    startFirebaseListeners();

    return true;

  }catch(e){

    console.warn(
      'Firebase başlatılamadı',
      e
    );

    return false;
  }
}

function clearFirebaseListeners(){

  firebaseUnsubs.forEach(
    f=>{
      try{
        f();
      }catch{}
    }
  );

  firebaseUnsubs=[];
}

function startFirebaseListeners(){

  if(!firebaseDb||!currentUser)
    return;

  clearFirebaseListeners();

  const me=currentUser.trim();


  /* GÖNDERİLEN MESAJLAR */

  const sentUnsub=
    firebaseDb
    .collection('chatMessages')
    .where(
      'sender',
      '==',
      me
    )
    .limit(200)
    .onSnapshot(
      async snap=>{

        for(
          const d of snap.docs
        ){

          const x=d.data()||{};

          const u=
            cleanUser(
              x.recipient
            );

          if(
            !u||
            u.toLowerCase()===
            me.toLowerCase()
          )
            continue;

          const ts=
            toMs(x.createdAt)||
            toMs(x.time);

          const k=u.toLowerCase();

          const old=
            firebaseData.get(k);

          if(
            !old||
            ts>=old.createdAt
          ){

            firebaseData.set(
              k,
              {
                username:u,
                displayName:u,
                avatar:'',
                verified:false,
                text:
                  x.text||
                  (
                    x.type==='voice'
                    ?'🎙️ Sesli mesaj'
                    :'Mesaj'
                  ),
                createdAt:ts,
                unread:
                  old?.unread||0
              }
            );
          }

          loadProfile(u)
            .then(
              p=>{

                const cur=
                  firebaseData.get(k);

                if(cur){

                  firebaseData.set(
                    k,
                    {
                      ...cur,
                      displayName:
                        p.displayName||u,
                      avatar:
                        p.avatar||'',
                      verified:
                        p.verified
                    }
                  );

                  mergeAll();
                }
              }
            );
        }

        mergeAll();
      }
    );


  /* ALINAN MESAJLAR */

  const recUnsub=
    firebaseDb
    .collection('chatMessages')
    .where(
      'recipient',
      '==',
      me
    )
    .limit(500)
    .onSnapshot(
      async snap=>{

        const counts=new Map();

        for(
          const d of snap.docs
        ){

          const x=d.data()||{};

          const u=
            cleanUser(
              x.sender
            );

          if(
            !u||
            u.toLowerCase()===
            me.toLowerCase()
          )
            continue;

          const k=u.toLowerCase();

          const ts=
            toMs(x.createdAt)||
            toMs(x.time);

          const old=
            firebaseData.get(k);

          if(
            !old||
            ts>=old.createdAt
          ){

            firebaseData.set(
              k,
              {
                username:u,
                displayName:u,
                avatar:'',
                verified:false,
                text:
                  x.text||
                  (
                    x.type==='voice'
                    ?'🎙️ Sesli mesaj'
                    :'Mesaj'
                  ),
                createdAt:ts,
                unread:
                  old?.unread||0
              }
            );
          }

          if(x.read!==true){

            counts.set(
              k,
              (counts.get(k)||0)+1
            );
          }

          loadProfile(u)
            .then(
              p=>{

                const cur=
                  firebaseData.get(k);

                if(cur){

                  firebaseData.set(
                    k,
                    {
                      ...cur,
                      displayName:
                        p.displayName||u,
                      avatar:
                        p.avatar||'',
                      verified:
                        p.verified
                    }
                  );

                  mergeAll();
                }
              }
            );
        }

        firebaseUnread=counts;

        mergeAll();
      }
    );

  firebaseUnsubs.push(
    sentUnsub,
    recUnsub
  );
}

   OKUNDU
========================================================= */

async function markRead(username){

  const u=cleanUser(username);

  if(!u)
    return;

  try{

    await api(
      API+'/api/messages/read',
      {
        method:'POST',
        body:{
          username:u
        }
      }
    );

  }catch{}

  if(firebaseDb&&currentUser){

    try{

      const snap=
        await firebaseDb
        .collection('chatMessages')
        .where(
          'recipient',
          '==',
          currentUser
        )
        .where(
          'sender',
          '==',
          u
        )
        .limit(500)
        .get();

      const batch=
        firebaseDb.batch();

      let n=0;

      snap.docs.forEach(
        d=>{

          if(
            d.data()?.read!==true
          ){

            batch.update(
              d.ref,
              {
                read:true
              }
            );

            n++;
          }
        }
      );

      if(n)
        await batch.commit();

    }catch(e){

      console.warn(
        'Firebase read',
        e
      );
    }
  }

  firebaseUnread.delete(
    u.toLowerCase()
  );

  mergeAll();
}

){

    login();

  }

  if(!silent){

    $('messageList').innerHTML=
      '<div class="loading">Sohbetler yükleniyor...</div>';

        currentUser
      );

    renderNotes();

    loadStartedUsers();

      await initFirebase();

    mergeAll();

    if(
      !fb&&
      !conversations.length&&
      !silent
    ){

      toast(
        'Mesaj verisi için Firebase bağlantısı bulunamadı'
      );
    }

  }catch(e){

    console.error(e);

    if(authError(e)){

      login();

      return;
    }

    if(!silent)
      renderMessages([]);
  }
}

async function searchUsers(q){

  q=cleanUser(q);

  if(!q){

    $('searchResults')
      .classList
      .remove('show');

    return;
  }

  $('searchResults')
    .classList
    .add('show');

  $('searchResults').innerHTML=
    '<div class="loading">Kullanıcı aranıyor...</div>';

  try{

    let users=[];

    try{

      const exact=
        await api(
          API+'/api/users/'+
          encodeURIComponent(q)
        );

      const u=
        normalizeApiUser(exact);

      if(u.username)
        users.push(u);

    }catch{}


    const data=
      await api(
        API+
        '/api/users?search='+
        encodeURIComponent(q)
      );

    const arr=
      Array.isArray(data)
      ?data
      :(
        data?.users||
        data?.items||
        data?.profiles||
        []
      );

    users=users.concat(
      arr.map(normalizeApiUser)
    );


    if(firebaseDb){

      try{

        const d=
          await firebaseDb
          .collection('users')
          .where(
            'usernameLower',
            '>=',
            q.toLowerCase()
          )
          .where(
            'usernameLower',
            '<',
            q.toLowerCase()+'\uf8ff'
          )
          .limit(50)
          .get();

        d.docs.forEach(
          x=>{

            const u=
              normalizeApiUser(
                x.data()
              );

            if(u.username)
              users.push(u);
          }
        );

      }catch{}
    }


    const seen=new Set();

    users=
      users
      .filter(
        u=>
          u.username&&
          !u.username
            .toLowerCase()
            .includes(
              currentUser.toLowerCase()
            )&&
          !seen.has(
            u.username.toLowerCase()
          )&&
          (
            seen.add(
              u.username.toLowerCase()
            ),
            true
          )
      );


    $('searchResults').innerHTML=
      users
      .map(
        u=>`

          <a
            class="search-result"
            href="mesaj.html?username=${encodeURIComponent(u.username)}"
          >

            ${avatar(
              u,
              'message-avatar'
            )}

            <div class="result-info">

              <div class="result-name">

                ${esc(
                  u.displayName||
                  u.username
                )}

                ${
                  u.verified
                  ?'<span class="verified small">✓</span>'
                  :''
                }

              </div>

              <div class="result-sub">
                Mesaj göndermek için dokun
              </div>

            </div>

            <div class="chevron">
              ›
            </div>

          </a>

        `
      )
      .join('')
      ||
      '<div class="empty">Kullanıcı bulunamadı</div>';

  }catch(e){

    console.error(e);

    $('searchResults').innerHTML=
      '<div class="empty">Kullanıcı aranamadı.</div>';
  }
}

async function refresh(){

  if(pulling)
    return;

  pulling=true;

  $('pullIndicator')
    .classList
    .add(
      'show',
      'refreshing'
    );

  $('pullIndicator')
    .style
    .transform=
      'translate(-50%,0)';

  try{

    await loadMessages(true);

    toast('Yenilendi');

  }finally{

    setTimeout(
      ()=>{

        $('pullIndicator')
          .classList
          .remove(
            'refreshing',
            'show'
          );

        $('pullIndicator')
          .style
          .transform=
            'translate(-50%,-80px)';

        pulling=false;

      },
      350
    );
  }
}

function setupPull(){

  window.addEventListener(
    'touchstart',
    e=>{

      if(window.scrollY<=1)
        pullStartY=
          e.touches[0].clientY;

    },
    {
      passive:true
    }
  );


  window.addEventListener(
    'touchmove',
    e=>{

      if(
        pulling||
        window.scrollY>1||
        !pullStartY
      )
        return;

      const dy=
        e.touches[0].clientY-
        pullStartY;

      if(dy>0){

        pullDistance=
          Math.min(
            110,
            dy*.65
          );

        $('pullIndicator')
          .classList
          .add('show');

        $('pullIndicator')
          .style
          .transform=
            `translate(
              -50%,
              ${Math.max(
                -30,
                pullDistance-58
              )}px
            )`;
      }

    },
    {
      passive:true
    }
  );


  window.addEventListener(
    'touchend',
    ()=>{

      if(pullDistance>=64){

        refresh();

      }else{

        $('pullIndicator')
          .classList
          .remove('show');

        $('pullIndicator')
          .style
          .transform=
            'translate(-50%,-80px)';
      }

      pullDistance=0;
      pullStartY=0;
    }
  );
}

        artwork:b.dataset.art
      };

      renderSelectedMusic();

      $('musicResults')
        .innerHTML='';
    }
  );


$('noteModal')
  .addEventListener(
    'click',
    e=>{

      if(
        e.target===
        $('noteModal')
      ){

        closeNote();
      }
    }
  );


/* =========================================================
   BAŞLAT
========================================================= */

setupPull();

renderNotes();

loadMessages();

pollTimer=
  setInterval(
    ()=>loadMessages(true),
    5000
  );

window.addEventListener(
  'beforeunload',
  ()=>{

    clearInterval(
      pollTimer
    );

    clearFirebaseListeners();
  }
);

</script>

</body>
</html>
