<!doctype html>

<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Minegram • Sohbet</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
  padding-bottom:78px;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100dvh;
  background:#000;
}

/* HEADER */

.header{
  height:72px;
  display:flex;
  align-items:center;
  padding:0 25px;
  border-bottom:1px solid #24242a;
  background:#000;
  position:sticky;
  top:0;
  z-index:20;
}

.back{
  width:48px;
  height:48px;
  border:0;
  background:none;
  color:#fff;
  font-size:46px;
  line-height:1;
  padding:0;
  margin-left:-8px;
}

.profile{
  display:flex;
  align-items:center;
  gap:11px;
  margin-left:7px;
  min-width:0;
}

.avatar{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  background:#64afe9;
  display:grid;
  place-items:center;
  font-size:18px;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.username{
  font-size:21px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.verified{
  display:inline-grid;
  place-items:center;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#2388df;
  font-size:12px;
  margin-left:3px;
}

/* CHAT */

.chat{
  min-height:calc(100dvh - 150px);
  padding:20px 18px 95px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.empty{
  text-align:center;
  color:#777;
  font-size:14px;
  padding:20px;
}

.message{
  max-width:75%;
  padding:11px 15px;
  margin:4px 0;
  border-radius:20px;
  font-size:16px;
  line-height:1.4;
  word-wrap:break-word;
}

.message.me{
  align-self:flex-end;
  background:#3797f0;
  border-bottom-right-radius:6px;
}

.message.other{
  align-self:flex-start;
  background:#26262c;
  border-bottom-left-radius:6px;
}

/* INPUT */

.input-area{
  position:fixed;
  bottom:78px;
  left:0;
  right:0;
  height:68px;
  background:#000;
  border-top:1px solid #24242a;
  display:flex;
  align-items:center;
  padding:9px 14px;
  z-index:30;
}

.input-inner{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
}

.message-input{
  flex:1;
  min-width:0;
  height:48px;
  border:1px solid #555;
  border-radius:24px;
  background:#17171b;
  color:#fff;
  outline:none;
  padding:0 17px;
  font-size:16px;
}

.message-input::placeholder{
  color:#999;
}

.send{
  width:48px;
  height:48px;
  min-width:48px;
  border:0;
  border-radius:50%;
  background:#3797f0;
  color:#fff;
  font-size:21px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:78px;
  background:#18161e;
  border-top:1px solid #25232c;
  display:flex;
  z-index:100;
  padding:5px 0 env(safe-area-inset-bottom);
}

.bottom-nav a{
  flex:1;
  color:#ddd;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:9px;
}

.bottom-nav i{
  width:46px;
  height:32px;
  border-radius:18px;
  display:grid;
  place-items:center;
  font-style:normal;
  font-size:25px;
}

.bottom-nav a.active i{
  background:#3b3450;
}

/* DESKTOP */

@media(min-width:700px){

  .app{
    max-width:720px;
    margin:auto;
    border-left:1px solid #202024;
    border-right:1px solid #202024;
  }

  .input-area{
    max-width:720px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
    width:720px;
  }

  .bottom-nav{
    max-width:720px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
    width:720px;
  }
}

/* MOBILE */

@media(max-width:600px){

  .header{
    height:72px;
    padding:0 25px;
  }

  .username{
    font-size:20px;
  }

  .chat{
    padding-left:14px;
    padding-right:14px;
  }

  .message{
    max-width:78%;
    font-size:16px;
  }
}
</style>

</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

```
<button
  class="back"
  id="back"
  type="button"
>
  ‹
</button>

<div class="profile">

  <div
    class="avatar"
    id="avatar"
  >
    M
  </div>

  <div class="username">

    <span id="username">
      Mesaj
    </span>

  </div>

</div>
```

  </header>

  <!-- CHAT -->

  <main
    class="chat"
    id="chat"
  >

```
<div class="empty">
  Sohbet başlat
</div>
```

  </main>

  <!-- MESSAGE INPUT -->

  <div class="input-area">

```
<div class="input-inner">

  <input
    class="message-input"
    id="messageInput"
    type="text"
    placeholder="Mesaj yaz..."
    autocomplete="off"
  >

  <button
    class="send"
    id="send"
    type="button"
  >
    ➤
  </button>

</div>
```

  </div>

</div>

<!-- BOTTOM MENU -->

<nav class="bottom-nav">

  <a href="index.html">
    <i>⌂</i>
    <span>Ana Sayfa</span>
  </a>

  <a href="ara.html">
    <i>⌕</i>
    <span>Ara</span>
  </a>

  <a href="olustur.html">
    <i>＋</i>
    <span>Oluştur</span>
  </a>

  <a href="reels.html">
    <i>▣</i>
    <span>Reels</span>
  </a>

  <a href="profile.html">
    <i>♙</i>
    <span>Profil</span>
  </a>

</nav>

<script>

const params =
  new URLSearchParams(
    location.search
  );

const username =
  params.get('username') ||
  'Mesaj';

const usernameEl =
  document.getElementById('username');

const avatarEl =
  document.getElementById('avatar');

const chat =
  document.getElementById('chat');

const input =
  document.getElementById('messageInput');

const send =
  document.getElementById('send');


/* Kullanıcı adı */

usernameEl.textContent =
  username;


/* Avatar */

avatarEl.textContent =
  username
    .charAt(0)
    .toUpperCase();


/* Mesaj ekleme */

function addMessage(text,type){

  const empty =
    chat.querySelector('.empty');

  if(empty){
    empty.remove();
  }

  const message =
    document.createElement('div');

  message.className =
    'message ' + type;

  message.textContent =
    text;

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;
}


/* Gönder */

function sendMessage(){

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  addMessage(
    text,
    'me'
  );

  input.value = '';

  input.focus();
}


/* Buton */

send.addEventListener(
  'click',
  sendMessage
);


/* Enter */

input.addEventListener(
  'keydown',
  e => {

    if(
      e.key === 'Enter'
    ){

      e.preventDefault();

      sendMessage();

    }

  }
);


/* Geri */

document
  .getElementById('back')
  .addEventListener(
    'click',
    () => {

      if(history.length > 1){

        history.back();

      }else{

        location.href =
          'mesajlar.html';

      }

    }
  );

</script>

</body>
</html>
