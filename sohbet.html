<!doctype html>
<html lang="tr">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#000"
>

<title>Minegram • Mesajlar</title>

<style>

*{
  box-sizing:border-box
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif
}

body{
  overflow-x:hidden;
  padding-bottom:0
}

button,
input{
  font:inherit
}

button{
  cursor:pointer
}

.app{
  min-height:100dvh;
  background:#000;
}


/* =========================
   HEADER
========================= */

.header{
  height:52px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #24242a;
  background:#000;
  position:sticky;
  top:0;
  z-index:20;
}

.back{
  width:34px;
  height:40px;
  border:0;
  background:none;
  color:#fff;
  font-size:34px;
  line-height:1;
  padding:0;
  margin-left:-5px;
}

.title{
  font-size:21px;
  font-weight:700;
  margin-left:4px;
}


/* =========================
   SEARCH
========================= */

.search-wrap{
  padding:9px 13px 0;
}

.search{
  height:48px;
  border:1px solid #77727d;
  border-radius:14px;
  display:flex;
  align-items:center;
  padding:0 13px;
  gap:10px;
}

.search-icon{
  font-size:23px;
  line-height:1;
  transform:rotate(-15deg);
}

.search input{
  flex:1;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
  font-size:15px;
}

.search input::placeholder{
  color:#bbb;
}


/* =========================
   SECTIONS
========================= */

.section{
  padding:18px 0 0;
}

.section h2{
  font-size:20px;
  margin:0 0 12px 15px;
}


/* =========================
   NOTLAR
========================= */

.notes-scroll{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding:0 20px 18px;
  scrollbar-width:none;
}

.notes-scroll::-webkit-scrollbar{
  display:none;
}

.note{
  width:78px;
  min-width:78px;
  text-align:center;
  position:relative;
}

.note-text{
  height:53px;
  background:#071018;
  border-radius:13px;
  padding:8px 7px;
  color:#fff;
  font-size:10px;
  line-height:1.45;
  text-align:left;
  overflow:hidden;
  margin-bottom:0;
}

.note-avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#64afe9;
  margin:-10px auto 8px;
  display:grid;
  place-items:center;
  font-size:18px;
  font-weight:400;
  border:0;
  position:relative;
}

.note-avatar img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
}

.note-name{
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.note-name.bold{
  font-weight:700;
}

.plus{
  position:absolute;
  right:0;
  top:72px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#64afe9;
  border:1px solid #000;
  color:#fff;
  font-size:17px;
  line-height:18px;
  padding:0;
}

.music{
  margin-top:10px;
  font-size:9px;
  white-space:nowrap;
}

.notes-divider{
  border-bottom:1px solid #38383e;
  margin-top:0;
}


/* =========================
   MESAJLAR / SOHBETLER
========================= */

.messages-section{
  padding-top:17px;
}

.messages-section h2{
  margin-bottom:10px;
}

.message-list{
  border-bottom:1px solid #38383e;
}

.message-row{
  min-height:70px;
  border-top:1px solid #24242a;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:11px;
  text-decoration:none;
  color:#fff;
  cursor:pointer;
  transition:background .15s ease;
}

.message-row:hover{
  background:#090909;
}

.message-row:active{
  background:#111;
}

.message-avatar{
  width:52px;
  height:52px;
  min-width:52px;
  border-radius:50%;
  background:#64afe9;
  display:grid;
  place-items:center;
  font-size:18px;
  overflow:hidden;
}

.message-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.message-info{
  min-width:0;
  flex:1;
}

.message-user{
  font-size:17px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:4px;
  min-width:0;
}

.message-user-name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.verified{
  width:17px;
  height:17px;
  min-width:17px;
  border-radius:50%;
  background:#2388df;
  display:inline-grid;
  place-items:center;
  font-size:11px;
  font-weight:400;
}

.message-preview{
  font-size:14px;
  color:#ddd;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chevron{
  font-size:29px;
  font-weight:300;
  margin-left:auto;
  color:#fff;
  line-height:1;
}


/* =========================
   YÜKLENİYOR
========================= */

.loading{
  padding:35px 15px;
  text-align:center;
  color:#777;
  font-size:13px;
}

.empty{
  padding:35px 15px;
  text-align:center;
  color:#777;
  font-size:13px;
}


/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:68px;
  transform:translateX(-50%);
  background:#29272e;
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:200;
}

.toast.show{
  opacity:1;
}


/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

  .app{
    max-width:420px;
    margin:auto;
    border-left:1px solid #202024;
    border-right:1px solid #202024;
  }

}

</style>

</head>

<body>

<div class="app">


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <button
    class="back"
    id="back"
    type="button"
    aria-label="Geri"
  >
    ‹
  </button>

  <div class="title">
    Mesajlar
  </div>

</header>


<!-- =========================
     ARAMA
========================= -->

<div class="search-wrap">

  <div class="search">

    <span class="search-icon">
      ⌕
    </span>

    <input
      id="search"
      placeholder="Kişileri ara..."
      autocomplete="off"
      type="search"
    >

  </div>

</div>


<!-- =========================
     NOTLAR
========================= -->

<section class="section">

  <h2>
    Notlar
  </h2>

  <div
    class="notes-scroll"
    id="notes"
  ></div>

  <div class="notes-divider"></div>

</section>


<!-- =========================
     SOHBETLER
========================= -->

<section class="section messages-section">

  <h2>
    Sohbetler
  </h2>

  <div
    class="message-list"
    id="messageList"
  >

    <div class="loading">
      Sohbetler yükleniyor...
    </div>

  </div>

</section>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =========================================================
   MINEGRAM TOKEN
========================================================= */

function getMinegramToken(){

  return (

    localStorage.getItem(
      'minegram_token'
    ) ||

    localStorage.getItem(
      'minegram_supabase_token'
    ) ||

    localStorage.getItem(
      'minegram_access_token'
    ) ||

    localStorage.getItem(
      'supabase_token'
    ) ||

    localStorage.getItem(
      'access_token'
    ) ||

    localStorage.getItem(
      'token'
    ) ||

    sessionStorage.getItem(
      'minegram_token'
    ) ||

    sessionStorage.getItem(
      'minegram_supabase_token'
    ) ||

    sessionStorage.getItem(
      'minegram_access_token'
    ) ||

    sessionStorage.getItem(
      'supabase_token'
    ) ||

    sessionStorage.getItem(
      'access_token'
    ) ||

    sessionStorage.getItem(
      'token'
    ) ||

    ''

  );

}


/* =========================================================
   TOKEN
========================================================= */

let token =
  getMinegramToken();


/* =========================================================
   ELEMENT
========================================================= */

const $ =
  id =>
    document.getElementById(id);


/* =========================================================
   HTML GÜVENLİĞİ
========================================================= */

function esc(s){

  return String(
    s ?? ''
  ).replace(
    /[&<>"']/g,
    c => ({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'

    }[c])
  );

}


/* =========================================================
   API
========================================================= */

async function api(
  url,
  opt={}
){

  const currentToken =
    getMinegramToken();

  token =
    currentToken;

  const headers = {
    ...(opt.headers || {})
  };

  if(currentToken){

    headers.Authorization =
      'Bearer ' +
      currentToken;

  }

  let body =
    opt.body;

  if(
    body &&
    typeof body !== 'string' &&
    !(body instanceof FormData)
  ){

    headers[
      'Content-Type'
    ] =
      'application/json';

    body =
      JSON.stringify(body);

  }

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      15000
    );

  let r;

  try{

    r =
      await fetch(
        url,
        {
          ...opt,
          body,
          headers,
          credentials:'same-origin',
          cache:'no-store',
          signal:controller.signal
        }
      );

  }catch(error){

    if(
      error?.name ===
      'AbortError'
    ){

      throw new Error(
        'Sunucu zaman aşımına uğradı.'
      );

    }

    throw error;

  }finally{

    clearTimeout(timeout);

  }


  let data =
    {};

  try{

    data =
      await r.json();

  }catch(e){

    data =
      {};

  }


  if(!r.ok){

    const error =
      data.error ||
      data.message ||
      ('HTTP ' + r.status);

    const err =
      new Error(error);

    err.status =
      r.status;

    throw err;

  }

  return data;

}


/* =========================================================
   AUTH KONTROLÜ
========================================================= */

function isAuthError(error){

  const message =
    String(
      error?.message ||
      ''
    );

  return (

    error?.status === 401 ||

    error?.status === 403 ||

    /unauthorized/i.test(
      message
    ) ||

    /invalid token/i.test(
      message
    ) ||

    /token expired/i.test(
      message
    ) ||

    /jwt/i.test(
      message
    ) ||

    /not authenticated/i.test(
      message
    ) ||

    /session expired/i.test(
      message
    )

  );

}


/* =========================================================
   GİRİŞE GÖNDER
========================================================= */

function goLogin(){

  location.href =
    'giris.html';

}


/* =========================================================
   NOTLAR
========================================================= */

const demoNotes = [

  {
    username:'Notun',
    displayName:'Notun',
    text:'Ahmet kaya',
    avatar:'',
    plus:true
  },

  {
    username:'ahmet',
    displayName:'ahmet',
    text:'Bugün güzel bir gün ☀️',
    avatar:''
  },

  {
    username:'mehmet',
    displayName:'mehmet',
    text:'Biraz müzik dinliyorum 🎵',
    avatar:'',
    music:true
  },

  {
    username:'galatasaray',
    displayName:'galatasaray',
    text:'Maç günü!',
    avatar:''
  }

];


/* =========================================================
   AVATAR
========================================================= */

function avatarHtml(
  item,
  cls
){

  const rawName =
    item?.displayName ||
    item?.username ||
    'M';

  const name =
    String(rawName)
      .trim()
      .charAt(0)
      .toUpperCase() ||
    'M';

  return `

    <div class="${cls}">

      ${
        item?.avatar

        ? `

          <img
            src="${esc(item.avatar)}"
            alt=""
            loading="lazy"
          >

        `

        : esc(name)
      }

    </div>

  `;

}


/* =========================================================
   NOTLARI OLUŞTUR
========================================================= */

function renderNotes(
  list
){

  const notes =
    Array.isArray(list)
      ? list
      : [];

  $('notes').innerHTML =
    notes.map(
      n => `

        <div
          class="note"
          data-username="${esc(
            n.username || ''
          )}"
        >

          <div class="note-text">

            ${esc(
              n.text || ''
            )}

          </div>

          ${avatarHtml(
            n,
            'note-avatar'
          )}

          ${
            n.plus

            ? `

              <button
                class="plus"
                type="button"
                aria-label="Not ekle"
              >
                +
              </button>

            `

            : ''
          }

          <div
            class="note-name ${
              n.plus
                ? 'bold'
                : ''
            }"
          >

            ${esc(
              n.displayName ||
              n.username ||
              ''
            )}

          </div>

          ${
            n.music

            ? `

              <div class="music">
                ▶ Şarkıyı çal
              </div>

            `

            : ''
          }

        </div>

      `
    ).join('');

}


/* =========================================================
   KONUŞMA KULLANICILARINI ÇIKAR
========================================================= */

function conversationUsers(
  raw
){

  const map =
    new Map();

  if(
    !Array.isArray(raw)
  ){

    return [];

  }


  for(
    const m of raw
  ){

    if(!m) continue;


    const sender =
      m.sender ||
      m.from ||
      m.sender_username ||
      m.senderUsername ||
      '';


    const recipient =
      m.recipient ||
      m.to ||
      m.receiver ||
      m.recipient_username ||
      m.recipientUsername ||
      '';


    const me =
      m.me ||
      m.currentUser ||
      m.current_username ||
      '';


    let target =
      '';


    if(
      String(sender).toLowerCase() ===
      String(me).toLowerCase()
    ){

      target =
        recipient;

    }else{

      target =
        sender;

    }


    /*
     * Bazı API cevaplarında doğrudan
     * username bulunabilir.
     */

    if(!target){

      target =
        m.username ||
        m.other_username ||
        m.otherUsername ||
        '';

    }


    if(!target){

      continue;

    }


    const key =
      String(target)
        .trim()
        .toLowerCase();


    if(!key){

      continue;

    }


    const createdAt =
      Number(
        m.createdAt ||
        m.created_at ||
        m.timestamp ||
        m.time ||
        0
      );


    const old =
      map.get(key);


    /*
     * Daha yeni mesaj varsa onu kullan.
     */

    if(
      old &&
      Number(old.createdAt || 0) >
      createdAt
    ){

      continue;

    }


    map.set(
      key,
      {

        username:
          target,

        displayName:
          m.displayName ||
          m.display_name ||
          m.name ||
          target,

        avatar:
          m.avatar ||
          m.avatar_url ||
          m.profile_image ||
          '',

        verified:
          !!(
            m.verified ||
            m.is_verified ||
            m.verified_user
          ),

        text:
          m.text ||
          m.message ||
          m.content ||
          m.last_message ||
          m.lastMessage ||
          '',

        createdAt

      }
    );

  }


  return [
    ...map.values()
  ].sort(
    (a,b) =>
      Number(
        b.createdAt || 0
      ) -
      Number(
        a.createdAt || 0
      )
  );

}


/* =========================================================
   MESAJ / SOHBET LİSTESİ
========================================================= */

function renderMessages(
  list
){

  const users =
    Array.isArray(list)
      ? list
      : [];


  if(!users.length){

    $('messageList').innerHTML = `

      <div class="empty">

        Henüz sohbet yok.

      </div>

    `;

    return;

  }


  $('messageList').innerHTML =
    users.map(
      m => {

        const username =
          String(
            m.username ||
            ''
          ).trim();

        if(!username){

          return '';

        }


        return `

          <a
            class="message-row"
            href="mesaj.html?username=${encodeURIComponent(
              username
            )}"
            data-username="${esc(
              username
            )}"
          >

            ${avatarHtml(
              m,
              'message-avatar'
            )}

            <div class="message-info">

              <div class="message-user">

                <span
                  class="message-user-name"
                >
                  ${esc(
                    m.displayName ||
                    username
                  )}
                </span>

                ${
                  m.verified

                  ? `

                    <span
                      class="verified"
                      aria-label="Doğrulanmış"
                    >
                      ✓
                    </span>

                  `

                  : ''
                }

              </div>

              <div class="message-preview">

                ${esc(
                  m.text ||
                  'Mesaj gönderme için dokun'
                )}

              </div>

            </div>

            <div class="chevron">
              ›
            </div>

          </a>

        `;

      }
    ).join('');

}


/* =========================================================
   SOHBETE GİT
========================================================= */

function openChat(
  username
){

  const currentToken =
    getMinegramToken();


  if(!currentToken){

    goLogin();

    return;

  }


  if(!username){

    return;

  }


  location.href =
    'mesaj.html?username=' +
    encodeURIComponent(
      username
    );

}


/* =========================================================
   MESAJ SATIRI TIKLAMA
========================================================= */

$('messageList').addEventListener(
  'click',
  e => {

    const row =
      e.target.closest(
        '.message-row'
      );

    if(!row){

      return;

    }


    e.preventDefault();


    const username =
      row.dataset.username;


    openChat(
      username
    );

  }
);


/* =========================================================
   MESAJLARI YÜKLE
========================================================= */

async function load(){

  renderNotes(
    demoNotes
  );


  const currentToken =
    getMinegramToken();


  /*
   * Gerçek oturum yoksa giriş.
   */

  if(!currentToken){

    goLogin();

    return;

  }


  try{

    /*
     * Önce mevcut kullanıcıyı doğrula.
     */

    const me =
      await api(
        '/api/me'
      );


    /*
     * Mesajları getir.
     */

    let raw =
      [];


    try{

      const data =
        await api(
          '/api/messages'
        );


      raw =
        Array.isArray(data)

        ? data

        : (
            data?.messages ||
            data?.items ||
            data?.conversations ||
            data?.chats ||
            []
          );


    }catch(error){

      console.error(
        'MESAJLAR API HATASI:',
        error
      );


      if(
        isAuthError(error)
      ){

        goLogin();

        return;

      }


      raw =
        [];

    }


    /*
     * API'den gelen mesajlara
     * mevcut kullanıcı adını ekle.
     */

    raw =
      raw.map(
        x => ({

          ...x,

          me:
            x?.me ||
            me?.username ||
            me?.user?.username ||
            ''

        })
      );


    const users =
      conversationUsers(
        raw
      );


    renderMessages(
      users
    );


  }catch(error){

    console.error(
      'MESAJLAR YÜKLEME HATASI:',
      error
    );


    if(
      isAuthError(error)
    ){

      goLogin();

      return;

    }


    renderMessages(
      []
    );

  }

}


/* =========================================================
   ARAMA
========================================================= */

let searchTimer =
  null;


$('search').addEventListener(
  'input',
  e => {

    const q =
      e.target.value
        .trim()
        .toLowerCase();


    clearTimeout(
      searchTimer
    );


    if(!q){

      load();

      return;

    }


    searchTimer =
      setTimeout(
        async () => {

          const currentToken =
            getMinegramToken();


          if(!currentToken){

            goLogin();

            return;

          }


          try{

            const data =
              await api(
                '/api/users?search=' +
                encodeURIComponent(q)
              );


            const users =
              Array.isArray(data)

              ? data

              : (
                  data?.users ||
                  data?.items ||
                  data?.profiles ||
                  []
                );


            renderMessages(

              users
                .map(
                  u => ({

                    username:
                      u.username ||
                      u.user?.username ||
                      '',

                    displayName:
                      u.displayName ||
                      u.display_name ||
                      u.name ||
                      u.username ||
                      '',

                    avatar:
                      u.avatar ||
                      u.avatar_url ||
                      u.profile_image ||
                      '',

                    verified:
                      !!(
                        u.verified ||
                        u.is_verified
                      ),

                    text:
                      'Mesaj gönderme için dokun'

                  })
                )
                .filter(
                  u =>
                    u.username
                )

            );


          }catch(error){

            console.error(
              'KULLANICI ARAMA HATASI:',
              error
            );


            if(
              isAuthError(error)
            ){

              goLogin();

              return;

            }


            renderMessages(
              []
            );

          }

        },
        300
      );

  }
);


/* =========================================================
   GERİ
========================================================= */

$('back').onclick =
  () => {

    if(
      document.referrer &&
      history.length > 1
    ){

      history.back();

    }else{

      location.href =
        'index.html';

    }

  };


/* =========================================================
   NOT TIKLAMA
========================================================= */

$('notes').addEventListener(
  'click',
  e => {

    /*
     * + butonuna basıldıysa
     * sohbet açma.
     */

    if(
      e.target.closest(
        '.plus'
      )
    ){

      return;

    }


    const note =
      e.target.closest(
        '.note'
      );


    if(!note){

      return;

    }


    const username =
      note.dataset.username ||
      note.querySelector(
        '.note-name'
      )?.textContent
        ?.trim();


    if(
      !username ||
      username === 'Notun'
    ){

      return;

    }


    openChat(
      username
    );

  }
);

load();

</script>
