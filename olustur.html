<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reels - Minegram</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#eee;
  font-family:Inter,Arial,sans-serif;
  padding-bottom:76px;
}

body{
  padding-bottom:78px;
}

.app{
  width:100%;
  min-height:100vh;
  background:#000;
}

.page{
  max-width:760px;
  margin:0 auto;
  padding:22px 20px;
}

.top{
  height:62px;
  display:flex;
  align-items:center;
  border-bottom:1px solid #25222b;
  padding:0 20px;
  position:sticky;
  top:0;
  background:#000;
  z-index:3;
}

.top b{
  font-size:19px;
}

.ico{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.empty{
  text-align:center;
  padding:100px 20px;
  color:#999;
}

.empty strong{
  display:block;
  color:#ddd;
  margin-top:14px;
}

.empty small{
  display:block;
  margin-top:5px;
}

/* ALT MENÜ */
.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  background:#121018;
  border-top:1px solid #201d27;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:space-around;
  z-index:100;
  padding:5px 8px env(safe-area-inset-bottom);
}

.nav a{
  flex:1;
  height:100%;
  color:#ddd;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:9px;
  border:0;
  background:transparent;
  cursor:pointer;
}

.nav-icon{
  width:45px;
  height:32px;
  border-radius:18px;
  display:grid;
  place-items:center;
}

.nav a.active .nav-icon{
  background:#3b3150;
}

.nav .svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.toast{
  position:fixed;
  left:50%;
  bottom:95px;
  transform:translateX(-50%);
  background:#252329;
  padding:10px 15px;
  border-radius:20px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:110;
  font-size:12px;
}

.toast.show{
  opacity:1;
}

@media(max-width:699px){
  .page{
    padding:18px 16px;
  }
}

@media(min-width:700px){
  .nav{
    padding-left:calc((100% - 760px)/2);
    padding-right:calc((100% - 760px)/2);
  }
}
</style>
</head>

<body>

<main class="app">

  <section>

    <div class="top">
      <b>Reels</b>
    </div>

    <div class="page">

      <div class="empty" style="padding-top:150px">

        <svg class="ico" style="width:52px;height:52px;margin:auto" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M3 9h18M8 4l3 5M13 4l3 5"/>
        </svg>

        <strong>Henüz Reel yok</strong>

        <small>İlk videoyu sen paylaş.</small>

      </div>

    </div>

  </section>


  <!-- ALT MENÜ -->

  <nav class="nav">

    <a id="homeNav" href="index.html">

      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>
        </svg>
      </span>

      Ana Sayfa

    </a>


    <a id="searchNav" href="ara.html">

      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.5"/>
          <path d="m16 16 5 5"/>
        </svg>
      </span>

      Ara

    </a>


    <a id="createNav" href="olustur.html">

      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <rect x="4" y="4" width="16" height="16" rx="4"/>
          <path d="M12 8v8M8 12h8"/>
        </svg>
      </span>

      Oluştur

    </a>


    <a class="active" id="reelsNav" href="reels.html">

      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M3 9h18M8 4l3 5M13 4l3 5"/>
        </svg>
      </span>

      Reels

    </a>


    <a id="profileNav" href="profile.html">

      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="3.5"/>
          <path d="M5 20a7 7 0 0 1 14 0"/>
        </svg>
      </span>

      Profil

    </a>

  </nav>


  <div id="toast" class="toast"></div>

</main>


<script>

const API="/api";

let token=localStorage.getItem("minegram_token");


async function api(path,opt={}){

  opt.headers={
    ...(opt.headers||{}),
    ...(token?{Authorization:"Bearer "+token}:{})
  };

  let r=await fetch(API+path,opt);

  let j=await r.json().catch(()=>({}));

  if(!r.ok){
    throw Error(j.error||"İşlem başarısız");
  }

  return j;
}


function toast(x){

  const t=document.getElementById("toast");

  if(!t)return;

  t.textContent=x;

  t.classList.add("show");

  setTimeout(()=>{
    t.classList.remove("show");
  },2200);

}


/* Giriş kontrolü */

if(!token){

  location.href="index.html";

}else{

  api("/me")
    .catch(()=>location.href="index.html");

}

</script>

</body>
</html>
