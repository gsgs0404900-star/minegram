<script>

/* =========================================================
   MINEGRAM FIREBASE PUBLIC POSTS - ORTAK SENKRON
========================================================= */
const MINEGRAM_FIREBASE_API_KEY="AIzaSyBgJjz0LOWY2DO55h3sxsovBIlBOGjJwIo";
const MINEGRAM_FIREBASE_PROJECT="mim-ea133";
const MINEGRAM_FIREBASE_DB="(default)";

async function minegramFirebaseToken(){
  const key="minegram_public_post_firebase_token";
  const cached=sessionStorage.getItem(key);
  if(cached)return cached;
  const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+encodeURIComponent(MINEGRAM_FIREBASE_API_KEY),{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({returnSecureToken:true})
  });
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.idToken)throw new Error(j.error?.message||"Firebase oturumu açılamadı");
  sessionStorage.setItem(key,j.idToken); return j.idToken;
}
async function minegramFirestore(url,opt={}){
  const token=await minegramFirebaseToken();
  const r=await fetch(url,{...opt,cache:"no-store",headers:{...(opt.headers||{}),Authorization:"Bearer "+token}});
  if(r.status===401||r.status===403){sessionStorage.removeItem("minegram_public_post_firebase_token");throw new Error("Firebase erişimi reddedildi");}
  if(!r.ok){const t=await r.text().catch(()=>"");throw new Error(t||("Firebase HTTP "+r.status));}
  return r.json().catch(()=>({}));
}
function minegramFirestoreCollection(name){
  return "https://firestore.googleapis.com/v1/projects/"+encodeURIComponent(MINEGRAM_FIREBASE_PROJECT)+"/databases/"+encodeURIComponent(MINEGRAM_FIREBASE_DB)+"/documents/"+encodeURIComponent(name);
}
function fsString(v){return {stringValue:String(v??"")};}
function fsInt(v){return {integerValue:String(Math.trunc(Number(v)||0))};}
function fsFields(d){
  const f={}; for(const [k,v] of Object.entries(d)){ if(Array.isArray(v)) f[k]={arrayValue:{values:v.map(x=>fsString(x))}}; else if(typeof v==='number') f[k]=fsInt(v); else f[k]=fsString(v); } return f;
}
function fsValue(fields,k){const x=fields?.[k]; if(!x)return ""; if(x.stringValue!==undefined)return x.stringValue; if(x.integerValue!==undefined)return Number(x.integerValue); return "";}
async function minegramLoadPublicPosts(){
  const j=await minegramFirestore(minegramFirestoreCollection("minegramPublicPosts")+"?pageSize=500");
  return (j.documents||[]).map(doc=>{
    const f=doc.fields||{}, type=String(fsValue(f,"type")||"");
    if(type!=="public_post")return null;
    const id=String(fsValue(f,"postId")||fsValue(f,"id")||doc.name?.split("/").pop()||"");
    const username=String(fsValue(f,"username")||"").replace(/^@/,"").trim();
    const caption=String(fsValue(f,"text")||fsValue(f,"caption")||"");
    const b64=String(fsValue(f,"mediaBase64")||fsValue(f,"base64")||"");
    const mt=String(fsValue(f,"mediaType")||"image/jpeg");
    const uri=String(fsValue(f,"mediaUri")||fsValue(f,"media")||"");
    const media=b64?(b64.startsWith("data:")?b64:"data:"+mt+";base64,"+b64):uri;
    const created=Number(fsValue(f,"createdAt")||0);
    if(!id||!username||(!media&&!caption))return null;
    return {id,postId:id,username,caption,text:caption,media,mediaType:mt,likes:Number(fsValue(f,"likes")||0),commentCount:Number(fsValue(f,"commentCount")||0),comments:[],createdAt:created||Date.now(),source:"firebase"};
  }).filter(Boolean);
}
async function minegramPublishPublicPost(post){
  const username=String(post.username||"").replace(/^@/,"").trim();
  const id=String(post.id||post.postId||Date.now());
  if(!username)return;
  const media=String(post.media||"");
  let mediaBase64="";
  if(/^data:/i.test(media)) mediaBase64=media.split(",")[1]||"";
  else if(media && !/^https?:\/\//i.test(media)) mediaBase64=media;
  const data={postId:Number(id)||Date.now(),username,usernameLower:username.toLowerCase(),ownerUid:"web",text:String(post.caption||post.text||""),likes:Number(post.likes||0),mediaUri:/^https?:\/\//i.test(media)?media:"",mediaType:String(post.mediaType||"image/jpeg"),music:"",commentCount:0,createdAt:Date.now(),type:"public_post",sender:username,recipient:"__minegram_public_posts__",conversationKey:"__minegram_public_posts__"};
  if(mediaBase64 && mediaBase64.length<=900000)data.mediaBase64=mediaBase64;
  const docId="public_post_"+username.toLowerCase()+"_"+(Number(id)||Date.now());
  const url=minegramFirestoreCollection("minegramPublicPosts")+"/"+encodeURIComponent(docId);
  try{return await minegramFirestore(url,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:fsFields(data)})});}
  catch(e){sessionStorage.removeItem("minegram_public_post_firebase_token");return minegramFirestore(url,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:fsFields(data)})});}
}


const API="/api";
function minegramValidToken(v){
  return !!v && String(v).trim() && String(v)!=="null" && String(v)!=="undefined";
}
function minegramGetToken(){
  const keys=["minegram_token","minegram_supabase_token","minegram_access_token","supabase_token","access_token"];
  for(const key of keys){
    const v=localStorage.getItem(key);
    if(minegramValidToken(v)) return String(v).trim();
  }
  return "";
}
function minegramGetRefreshToken(){
  const keys=["minegram_refresh_token","refresh_token","minegram_refreshToken","refreshToken"];
  for(const key of keys){
    const v=localStorage.getItem(key);
    if(minegramValidToken(v)) return String(v).trim();
  }
  return "";
}
function minegramSaveSession(data){
  const access=String(data?.access_token||data?.token||"").trim();
  const refresh=String(data?.refresh_token||data?.refreshToken||"").trim();
  if(access){
    for(const k of ["minegram_token","minegram_supabase_token","minegram_access_token","access_token"]) localStorage.setItem(k,access);
    token=access;
  }
  if(refresh) localStorage.setItem("minegram_refresh_token",refresh);
  return access;
}
let token=minegramGetToken();


/* =========================
   TOAST
========================= */

function toast(message){

  const el=document.getElementById("toast");

  if(!el)return;

  el.textContent=String(message || "");

  el.style.opacity="1";

  clearTimeout(window.__toast);

  window.__toast=setTimeout(()=>{
    el.style.opacity="0";
  },2500);

}


/* =========================
   GERİ
========================= */

function goBack(){

  if(history.length>1){
    history.back();
  }else{
    location.href="index.html";
  }

}


/* =========================
   DOSYA
========================= */

function openFilePicker(){

  const input=document.getElementById("file");

  if(input){
    input.click();
  }

}


document
.getElementById("file")
.addEventListener("change",previewFile);


/* =========================
   ÖNİZLEME
========================= */

function previewFile(){

  const input=document.getElementById("file");
  const picker=document.getElementById("picker");

  const f=input.files && input.files[0];

  if(!f)return;


  if(f.size>100*1024*1024){

    input.value="";

    toast("Dosya çok büyük. Maksimum 100 MB.");

    return;

  }


  const old=document.getElementById("pickerPreview");

  if(old){

    if(old.src){

      try{
        URL.revokeObjectURL(old.src);
      }catch(e){}

    }

    old.remove();

  }


  const url=URL.createObjectURL(f);

  let tag;


  if(
    String(f.type || "")
      .startsWith("video/")
  ){

    tag=document.createElement("video");

    tag.controls=true;
    tag.muted=true;
    tag.playsInline=true;
    tag.preload="metadata";

  }else{

    tag=document.createElement("img");

    tag.alt="Gönderi önizleme";

  }


  tag.id="pickerPreview";
  tag.className="preview";
  tag.src=url;

  picker.innerHTML="";
  picker.appendChild(tag);

}


/* =========================
   API
========================= */

async function api(path,opt={},retry=true){
  const headers={...(opt.headers||{})};
  const currentToken=token||minegramGetToken();
  if(currentToken) headers.Authorization="Bearer "+currentToken;
  if(opt.body instanceof FormData){
    delete headers["Content-Type"]; delete headers["content-type"];
  }
  let response=await fetch(API+path,{...opt,headers});
  if((response.status===401||response.status===403)&&retry){
    const refresh=minegramGetRefreshToken();
    if(refresh){
      try{
        const rr=await fetch(API+"/refresh",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({refresh_token:refresh})
        });
        const rj=await rr.json().catch(()=>({}));
        const fresh=minegramSaveSession(rj);
        if(rr.ok&&fresh){
          const retryHeaders={...(opt.headers||{}),Authorization:"Bearer "+fresh};
          if(opt.body instanceof FormData){
            delete retryHeaders["Content-Type"]; delete retryHeaders["content-type"];
          }
          response=await fetch(API+path,{...opt,headers:retryHeaders});
        }
      }catch(e){}
    }
  }
  const contentType=response.headers.get("content-type")||"";
  let data={};
  if(contentType.includes("application/json")) data=await response.json().catch(()=>({}));
  else{
    const text=await response.text().catch(()=>"");
    if(text)data={error:text};
  }
  if(!response.ok){
    const err=new Error(data.error||data.message||("İşlem başarısız. HTTP "+response.status));
    err.status=response.status;
    throw err;
  }
  return data;
}){

  const headers={
    ...(opt.headers || {})
  };


  if(token){

    headers.Authorization=
      "Bearer "+token;

  }


  if(opt.body instanceof FormData){

    delete headers["Content-Type"];
    delete headers["content-type"];

  }


  const response=
    await fetch(
      API+path,
      {
        ...opt,
        headers
      }
    );


  const contentType=
    response.headers.get("content-type") || "";


  let data={};


  if(
    contentType.includes("application/json")
  ){

    data=
      await response
        .json()
        .catch(()=>({}));

  }else{

    const text=
      await response
        .text()
        .catch(()=>"");

    if(text){
      data={error:text};
    }

  }


  if(!response.ok){

    throw new Error(
      data.error ||
      data.message ||
      "İşlem başarısız."
    );

  }


  return data;

}


/* =========================
   GÖNDERİ PAYLAŞ
========================= */

async function post(){

  const fileInput=
    document.getElementById("file");

  const caption=
    document.getElementById("cap");

  const button=
    document.getElementById("postBtn");


  if(!fileInput || !caption || !button){
    return;
  }


  const f=
    fileInput.files &&
    fileInput.files[0];


  const text=
    caption.value.trim();


  if(!f && !text){

    toast(
      "Bir fotoğraf/video veya açıklama ekle"
    );

    return;

  }


  if(f){

    if(f.size>100*1024*1024){

      toast(
        "Dosya çok büyük. Maksimum 100 MB."
      );

      return;

    }


    const type=
      String(f.type || "");


    if(
      !type.startsWith("image/") &&
      !type.startsWith("video/")
    ){

      toast(
        "Sadece fotoğraf veya video seçebilirsin."
      );

      return;

    }

  }


  token=minegramGetToken();
  if(!token){
    toast("Oturum bulunamadı. Tekrar giriş yap.");
    setTimeout(()=>{ location.href="giris.html"; },900);
    return;
  }


  const formData=
    new FormData();


  if(f){

    formData.append(
      "media",
      f,
      f.name
    );

  }


  formData.append(
    "caption",
    text
  );


  button.disabled=true;
  button.style.opacity=".6";
  button.textContent="Paylaşılıyor...";


  try{

    console.log(
      "[MINEGRAM] POST /api/posts başlıyor"
    );


    const result=
      await api(
        "/posts",
        {
          method:"POST",
          body:formData
        }
      );


    console.log(
      "[MINEGRAM] GÖNDERİ BAŞARILI",
      result
    );

    /* Site gönderisini Android'in dinlediği ortak Firebase akışına da yaz. */
    try{
      let media="";
      let mediaType=f?.type||"image/jpeg";
      if(f && String(f.type||"").startsWith("image/")){
        media=await new Promise((resolve,reject)=>{
          const fr=new FileReader(); fr.onload=()=>resolve(fr.result||""); fr.onerror=reject; fr.readAsDataURL(f);
        });
        /* Büyük görselleri küçült; Firestore dokümanında güvenli boyutta tut. */
        if(String(media).length>850000){
          media=await new Promise(resolve=>{
            const img=new Image(); img.onload=()=>{
              const scale=Math.min(1,1080/Math.max(img.width,img.height));
              const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale));
              c.getContext("2d").drawImage(img,0,0,c.width,c.height); resolve(c.toDataURL("image/jpeg",0.72));
            }; img.onerror=()=>resolve(""); img.src=String(media);
          });
        }
      }else if(f){
        /* Video için API'nin döndürdüğü kalıcı URL varsa Firebase'e onu koy. */
        media=String(result?.media||result?.url||result?.mediaUrl||"");
      }
      const firebaseId=String(result?.id||result?.postId||Date.now());
      const username=String(result?.username||result?.user?.username||me?.username||"").replace(/^@/,"").trim();
      if(username){
        await minegramPublishPublicPost({id:firebaseId,username,caption:text,media,mediaType});
      }
    }catch(firebaseError){
      console.error("[MINEGRAM] Firebase ortak gönderi aktarımı:",firebaseError);
      /* API gönderisi silinmez; Firebase aktarımı ayrıca tekrar denenebilir. */
    }



    /*
     * Sunucudan dönen gönderiyi
     * tarayıcıda da saklıyoruz.
     */

    try{

      localStorage.setItem(
        "minegram_last_created_post",
        JSON.stringify(result)
      );

      localStorage.setItem(
        "minegram_post_created_at",
        String(Date.now())
      );

    }catch(e){

      console.warn(
        "localStorage kayıt hatası",
        e
      );

    }


    button.disabled=false;
    button.style.opacity="1";
    button.textContent="Paylaş";


    toast(
      "Gönderi başarıyla paylaşıldı"
    );


    /*
     * Profil sayfasına dön.
     * pageshow/load mekanizması profilin
     * gönderileri tekrar çekmesini sağlar.
     */

    setTimeout(()=>{

      location.href="profile.html?refresh="+Date.now();

    },700);


  }catch(error){

    console.error(
      "[MINEGRAM] GÖNDERİ HATASI:",
      error
    );


    button.disabled=false;
    button.style.opacity="1";
    button.textContent="Paylaş";


    toast(
      error?.message ||
      "Gönderi paylaşılırken hata oluştu"
    );

  }

}


/* =========================
   GİRİŞ KONTROLÜ
========================= */

async function init(){
  token=minegramGetToken();
  if(!token){
    location.replace("giris.html");
    return;
  }
  try{
    await api("/me");
  }catch(error){
    console.warn("[OLUŞTUR /me]",error);
    token="";
    for(const k of ["minegram_token","minegram_supabase_token","minegram_access_token","supabase_token","access_token"])
