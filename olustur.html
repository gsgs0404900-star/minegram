<style>

html,body{

  width:100%;

  background:#000;
  color:#eee;

body{

.app{

/* =========================
   ÜST BAR
========================= */

.top{
  height:70px;
  display:flex;
  align-items:center;
  padding:0 22px;
  border-bottom:1px solid #202020;
  position:sticky;
  top:0;
  background:#000;
  z-index:50;
}

.top b{
  font-size:21px;
}

.back{
  width:42px;
  height:42px;
  border:0;
  background:none;
  color:#eee;
  font-size:32px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding:0;
}

/* =========================
   SAYFA
========================= */

.page{
  width:min(680px,100%);
  margin:0 auto;
  padding:22px 20px 40px;
}

/* =========================
   DOSYA SEÇME
========================= */

.picker{
  width:100%;
  height:300px;
  border-radius:15px;
  background:#080808;
  border:1px solid #29262f;
  display:grid;
  place-items:center;
  text-align:center;
  color:#aaa;
  cursor:pointer;
  overflow:hidden;
}

.picker:hover{
  border-color:#4b99d2;
}

.picker span{
  font-size:48px;
  color:#4b99d2;
}

.picker b{
  color:#eee;
  font-size:15px;
}

.picker small{
  display:block;
  margin-top:6px;
  color:#888;
}

/* =========================
   ÖNİZLEME
========================= */

.preview{
  max-width:100%;
  max-height:290px;
  border-radius:12px;
  object-fit:contain;
}

/* =========================
   AÇIKLAMA
========================= */

.field{
  width:100%;
  min-height:90px;
  background:#080808;
  border:1px solid #444;
  color:#eee;
  border-radius:10px;
  padding:12px 14px;
  outline:none;
  resize:vertical;
  font-family:Arial,Helvetica,sans-serif;
  font-size:14px;
  margin-top:12px;
}

.field::placeholder{
  color:#777;
}

.field:focus{
  border-color:#4b99d2;
}

/* =========================
   PAYLAŞ
========================= */

.btn{
  width:100%;
  height:48px;
  border:0;
  border-radius:24px;
  background:#4b99d2;
  color:#101820;
  font-weight:700;
  cursor:pointer;
  margin-top:12px;
  font-size:14px;
}

.btn:hover{
  opacity:.92;
}

/* =========================
   ALT MENÜ
   ARA.HTML İLE AYNI
========================= */

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  width:100%;
  height:76px;

  background:#121018;
  border-top:1px solid #201d27;

  display:flex;
  align-items:stretch;

  z-index:9999;

  padding:
    5px
    max(8px, calc((100% - 760px) / 2))
    env(safe-area-inset-bottom);
}

.nav a{
  flex:1 1 0;

  height:66px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:3px;

  color:#ddd;
  text-decoration:none;

  font-size:9px;

  min-width:0;

  -webkit-tap-highlight-color:transparent;
}

.nav-icon{
  width:45px;
  height:32px;

  border-radius:18px;

  display:grid;
  place-items:center;

  flex:none;
}

/* AKTİF */

.nav a.active .nav-icon{
  background:#3b3150;
}

/* SVG */

.svg{
  width:21px;
  height:21px;

  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================
   MOBİL
========================= */

@media(max-width:699px){

  .top{
    height:62px;
    padding:0 14px;
  }

  .page{
    width:100%;
    padding:18px 14px 35px;
  }

  .nav{
    height:76px;

    padding:
      5px
      8px
      env(safe-area-inset-bottom);
  }

  .nav a{
    height:66px;
  }

  .nav-icon{
    width:45px;
    height:32px;
  }

  .picker{
    height:280px;
  }
}
</style>

<!-- =========================
     TOAST
========================= -->

<div
  id="toast"
  class="toast"
  style="
    position:fixed;
    left:50%;
    bottom:92px;
    transform:translateX(-50%);
    background:#25232a;
    color:#fff;
    padding:10px 16px;
    border-radius:20px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:10000;
  "
></div>

<script>

/* =========================
   API
========================= */

const API="/api";


let token =
  localStorage.getItem("minegram_token") ||
  localStorage.getItem("minegram_supabase_token") ||
  null;


/* =========================
   TOAST
========================= */

function toast(message){

  const el=document.getElementById("toast");

  if(!el)return;

  el.textContent=message;

  el.style.opacity="1";

  clearTimeout(window.__toast);

  window.__toast=setTimeout(()=>{

    el.style.opacity="0";

  },2200);

}


/* =========================
   DOSYA ÖNİZLEME
========================= */

function previewFile(){

  const fileInput=
    document.getElementById("file");

  const picker=
    document.getElementById("picker");

  const f=
    fileInput.files[0];

  if(!f)return;


  const old=
    document.getElementById("pickerPreview");

  if(old){

    old.remove();

  }


  const url=
    URL.createObjectURL(f);

  let tag;


  if(/^video\//.test(f.type)){

    tag=
      document.createElement("video");

    tag.controls=true;
    tag.muted=true;
    tag.playsInline=true;

  }else{

    tag=
      document.createElement("img");

  }


  tag.id="pickerPreview";

  tag.className="preview";

  tag.src=url;


  picker.innerHTML="";

  picker.appendChild(tag);

}


/* =========================
   API
========================= */

async function api(path,opt={}){

  const headers={
    (opt.headers || {})
  };


  if(token){

    headers.Authorization=
      "Bearer "+token;

  }


  const response=
    await fetch(API+path,{
      opt,
      headers
    });


  const data=
    await response
      .json()
      .catch(()=>({}));


  if(!response.ok){

    throw new Error(
      data.error ||
      data.message ||
      "İşlem başarısız."
    );

  }


  return data;

}


/* =========================
   GÖNDERİ PAYLAŞ
========================= */

async function post(){

  const fileInput=
    document.getElementById("file");

  const caption=
    document.getElementById("cap");

  const button=
    document.getElementById("postBtn");


  const f=
    fileInput.files[0];

  const text=
    caption.value.trim();


  if(!f && !text){

    toast(
      "Bir fotoğraf/video veya açıklama ekle"
    );

    return;

  }


  const formData=
    new FormData();


  if(f){

    formData.append(
      "media",
      f
    );

  }


  formData.append(
    "caption",
    caption.value
  );


  button.disabled=true;

  button.style.opacity=".6";


  try{

    await api(
      "/posts",
      {
        method:"POST",
        body:formData
      }
    );


    caption.value="";

    fileInput.value="";


    document.getElementById(
      "picker"
    ).innerHTML=`

      <div id="pickerContent">

        <span>＋</span>

        <br>

        <b>Fotoğraf / Video seç</b>

        <small>
          Galeriyi açmak için dokun
        </small>

      </div>

    `;


    toast(
      "Gönderi paylaşıldı"
    );


    setTimeout(()=>{

      location.href="index.html";

    },700);


  }catch(error){

    console.error(
      "[POST]",
      error
    );


    toast(
      error.message ||
      "Gönderi paylaşılırken hata oluştu"
    );


    button.disabled=false;

    button.style.opacity="1";

  }

}


/* =========================
   GİRİŞ KONTROLÜ
========================= */

async function init(){

  if(!token){

    location.replace(
      "giris.html"
    );

    return;

  }


  try{

    await api("/me");

  }catch(error){

    console.warn(
      "[OLUŞTUR /me]",
      error
    );


    localStorage.removeItem(
      "minegram_token"
    );

    localStorage.removeItem(
      "minegram_supabase_token"
    );


    location.replace(
      "giris.html"
    );

  }

}


init();

</script>
