<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oluştur - Minegram</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#eee;
  font-family:Inter,Arial,sans-serif;
  padding-bottom:80px;
}

body{
  overflow-x:hidden;
}

.app{
  width:100%;
  min-height:100vh;
  background:#000;
}

/* ÜST BAR */
.top{
  height:64px;
  display:flex;
  align-items:center;
  border-bottom:1px solid #25222b;
  padding:0 20px;
  position:sticky;
  top:0;
  background:#000;
  z-index:10;
}

.top b{
  font-size:19px;
}

.back{
  width:42px;
  height:42px;
  border:0;
  background:none;
  color:#eee;
  font-size:32px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding:0;
}

/* SAYFA */
.page{
  width:min(680px,100%);
  margin:0 auto;
  padding:22px 20px 30px;
}

/* DOSYA SEÇME */
.picker{
  width:100%;
  height:300px;
  border-radius:15px;
  background:#080808;
  border:1px solid #29262f;
  display:grid;
  place-items:center;
  text-align:center;
  color:#aaa;
  cursor:pointer;
  overflow:hidden;
}

.picker:hover{
  border-color:#4b99d2;
}

.picker span{
  font-size:48px;
  color:#4b99d2;
}

.picker b{
  color:#eee;
  font-size:15px;
}

.picker small{
  display:block;
  margin-top:6px;
  color:#888;
}

/* ÖNİZLEME */
.preview{
  max-width:100%;
  max-height:290px;
  border-radius:12px;
  object-fit:contain;
}

/* AÇIKLAMA */
.field{
  width:100%;
  min-height:90px;
  background:#080808;
  border:1px solid #555;
  color:#eee;
  border-radius:8px;
  padding:12px 14px;
  outline:none;
  resize:vertical;
  font-family:inherit;
  font-size:14px;
  margin-top:12px;
}

.field::placeholder{
  color:#777;
}

.field:focus{
  border-color:#4b99d2;
}

/* PAYLAŞ */
.btn{
  width:100%;
  height:48px;
  border:0;
  border-radius:24px;
  background:#4b99d2;
  color:#101820;
  font-weight:700;
  cursor:pointer;
  margin-top:12px;
  font-size:14px;
}

.btn:hover{
  opacity:.92;
}

/* ALT MENÜ */
.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  background:#121018;
  border-top:1px solid #201d27;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:space-around;
  z-index:100;
  padding:5px 8px env(safe-area-inset-bottom);
}

/* MENÜ ELEMANLARI */
.nav a{
  flex:1;
  height:100%;
  color:#ddd;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:9px;
  border:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* İKON ALANI */
.nav-icon{
  width:45px;
  height:32px;
  border-radius:18px;
  display:grid;
  place-items:center;
}

/* AKTİF OLAN */
.nav a.active .nav-icon{
  background:#3b3150;
}

/* SVG */
.nav .svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* MOBİL */
@media(max-width:699px){

  .page{
    padding:18px 16px 25px;
  }

  .top{
    padding:0 16px;
  }

  .picker{
    height:280px;
  }

}

/* MASAÜSTÜ */
@media(min-width:700px){

  .nav{
    padding-left:calc((100% - 760px)/2);
    padding-right:calc((100% - 760px)/2);
  }

}
</style>
</head>

<body>

<main class="app">

  <!-- ÜST -->
  <div class="top">
    <button class="back" onclick="location.href='index.html'">‹</button>
    <b>Yeni Gönderi</b>
  </div>

  <!-- OLUŞTUR -->
  <div class="page">

    <div
      id="picker"
      class="picker"
      onclick="document.getElementById('file').click()"
    >
      <div id="pickerContent">
        <span>＋</span>
        <br>
        <b>Fotoğraf / Video seç</b>
        <small>Galeriyi açmak için dokun</small>
      </div>
    </div>

    <input
      id="file"
      type="file"
      accept="image/*,video/*"
      hidden
      onchange="previewFile()"
    >

    <textarea
      id="cap"
      class="field"
      placeholder="Açıklama / etiket"
    ></textarea>

    <button
      class="btn"
      onclick="post()"
    >
      Paylaş
    </button>

  </div>

  <!-- ALT MENÜ -->
  <nav class="nav">

    <!-- ANA SAYFA -->
    <a href="index.html">
      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"></path>
        </svg>
      </span>
      <span>Ana Sayfa</span>
    </a>

    <!-- ARA -->
    <a href="ara.html">
      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="m16 16 5 5"></path>
        </svg>
      </span>
      <span>Ara</span>
    </a>

    <!-- OLUŞTUR -->
    <a class="active" href="olustur.html">
      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <rect x="4" y="4" width="16" height="16" rx="4"></rect>
          <path d="M12 8v8"></path>
          <path d="M8 12h8"></path>
        </svg>
      </span>
      <span>Oluştur</span>
    </a>

    <!-- REELS -->
    <a href="reels.html">
      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="2"></rect>
          <path d="M3 9h18"></path>
          <path d="M8 4l3 5"></path>
          <path d="M13 4l3 5"></path>
        </svg>
      </span>
      <span>Reels</span>
    </a>

    <!-- PROFİL -->
    <a href="profile.html">
      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M5 20a7 7 0 0 1 14 0"></path>
        </svg>
      </span>
      <span>Profil</span>
    </a>

  </nav>

</main>

<div
  id="toast"
  style="
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%);
    background:#252329;
    color:#eee;
    padding:10px 15px;
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:200;
    font-size:12px;
  "
></div>

<script>

const API="/api";

let token=localStorage.getItem("minegram_token");

/* TOAST */
function toast(message){

  const t=document.getElementById("toast");

  if(!t)return;

  t.textContent=message;
  t.style.opacity="1";

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    t.style.opacity="0";
  },2200);
}


/* DOSYA ÖNİZLEME */
function previewFile(){

  const fileInput=document.getElementById("file");
  const picker=document.getElementById("picker");

  const f=fileInput.files[0];

  if(!f)return;

  const old=document.getElementById("pickerPreview");

  if(old){
    old.remove();
  }

  const url=URL.createObjectURL(f);

  let tag;

  if(/^video\//.test(f.type)){

    tag=document.createElement("video");

    tag.controls=true;
    tag.muted=true;
    tag.playsInline=true;

  }else{

    tag=document.createElement("img");

  }

  tag.id="pickerPreview";
  tag.className="preview";
  tag.src=url;

  picker.innerHTML="";
  picker.appendChild(tag);

}


/* API */
async function api(path,opt={}){

  opt.headers={
    ...(opt.headers||{}),
    ...(token
      ? {Authorization:"Bearer "+token}
      : {})
  };

  const response=await fetch(API+path,opt);

  const data=await response
    .json()
    .catch(()=>({}));

  if(!response.ok){

    throw new Error(
      data.error || "İşlem başarısız"
    );

  }

  return data;
}


/* GÖNDERİ PAYLAŞ */
async function post(){

  const fileInput=document.getElementById("file");
  const caption=document.getElementById("cap");

  const f=fileInput.files[0];

  const text=caption.value.trim();

  if(!f && !text){

    toast(
      "Bir fotoğraf/video veya açıklama ekle"
    );

    return;
  }

  const formData=new FormData();

  if(f){
    formData.append("media",f);
  }

  formData.append(
    "caption",
    caption.value
  );

  try{

    await api("/posts",{
      method:"POST",
      body:formData
    });

    caption.value="";
    fileInput.value="";

    document.getElementById("picker").innerHTML=`
      <div id="pickerContent">
        <span>＋</span>
        <br>
        <b>Fotoğraf / Video seç</b>
        <small>Galeriyi açmak için dokun</small>
      </div>
    `;

    toast("Gönderi paylaşıldı");

    setTimeout(()=>{
      location.href="index.html";
    },700);

  }catch(error){

    toast(
      error.message ||
      "Gönderi paylaşılırken hata oluştu"
    );

  }

}


/* GİRİŞ KONTROLÜ */
if(!token){

  location.href="index.html";

}

</script>

</body>
</html>
