<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Oluştur - Minegram</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding-bottom:76px;
  overflow-x:hidden;
}

.app{
  width:100%;
  min-height:100vh;
  background:#000;
}

.top{
  height:70px;
  display:flex;
  align-items:center;
  padding:0 22px;
  border-bottom:1px solid #202020;
  position:sticky;
  top:0;
  background:#000;
  z-index:50;
}

.top b{
  font-size:21px;
}

.back{
  width:42px;
  height:42px;
  border:0;
  background:none;
  color:#eee;
  font-size:32px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding:0;
}

.page{
  width:min(680px,100%);
  margin:0 auto;
  padding:22px 20px 40px;
}

.picker{
  width:100%;
  height:300px;
  border-radius:15px;
  background:#080808;
  border:1px solid #29262f;
  display:grid;
  place-items:center;
  text-align:center;
  color:#aaa;
  cursor:pointer;
  overflow:hidden;
}

.picker:hover{
  border-color:#4b99d2;
}

.picker span{
  font-size:48px;
  color:#4b99d2;
}

.picker b{
  color:#eee;
  font-size:15px;
}

.picker small{
  display:block;
  margin-top:6px;
  color:#888;
}

.preview{
  width:100%;
  height:100%;
  max-width:100%;
  max-height:290px;
  border-radius:12px;
  object-fit:contain;
  display:block;
}

.field{
  width:100%;
  min-height:90px;
  background:#080808;
  border:1px solid #444;
  color:#eee;
  border-radius:10px;
  padding:12px 14px;
  outline:none;
  resize:vertical;
  font-family:Arial,Helvetica,sans-serif;
  font-size:14px;
  margin-top:12px;
}

.field::placeholder{
  color:#777;
}

.field:focus{
  border-color:#4b99d2;
}

.btn{
  width:100%;
  height:48px;
  border:0;
  border-radius:24px;
  background:#4b99d2;
  color:#101820;
  font-weight:700;
  cursor:pointer;
  margin-top:12px;
  font-size:14px;
}

.btn:hover{
  opacity:.92;
}

.btn:disabled{
  cursor:not-allowed;
}

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  height:76px;
  background:#121018;
  border-top:1px solid #201d27;
  display:flex;
  align-items:stretch;
  z-index:9999;
  padding:
    5px
    max(8px, calc((100% - 760px) / 2))
    env(safe-area-inset-bottom);
}

.nav a{
  flex:1 1 0;
  height:66px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:#ddd;
  text-decoration:none;
  font-size:9px;
  min-width:0;
  -webkit-tap-highlight-color:transparent;
}

.nav-icon{
  width:45px;
  height:32px;
  border-radius:18px;
  display:grid;
  place-items:center;
  flex:none;
}

.nav a.active .nav-icon{
  background:#3b3150;
}

.svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%);
  background:#25232a;
  color:#fff;
  padding:10px 16px;
  border-radius:20px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:10000;
  white-space:nowrap;
  max-width:90%;
  overflow:hidden;
  text-overflow:ellipsis;
}

@media(max-width:699px){

  .top{
    height:62px;
    padding:0 14px;
  }

  .page{
    width:100%;
    padding:18px 14px 35px;
  }

  .nav{
    height:76px;
    padding:
      5px
      8px
      env(safe-area-inset-bottom);
  }

  .nav a{
    height:66px;
  }

  .nav-icon{
    width:45px;
    height:32px;
  }

  .picker{
    height:280px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">

  <button
    class="back"
    type="button"
    onclick="goBack()"
  >
    ‹
  </button>

  <b>Yeni Gönderi</b>

</header>

<main class="page">

  <div
    id="picker"
    class="picker"
    onclick="openFilePicker()"
  >

    <div id="pickerContent">

      <span>＋</span>

      <br>

      <b>Fotoğraf / Video seç</b>

      <small>
        Galeriyi açmak için dokun
      </small>

    </div>

  </div>

  <input
    id="file"
    type="file"
    accept="image/*,video/*"
    hidden
  >

  <textarea
    id="cap"
    class="field"
    placeholder="Açıklama / etiket"
  ></textarea>

  <button
    id="postBtn"
    class="btn"
    type="button"
    onclick="post()"
  >
    Paylaş
  </button>

</main>

</div>

<nav class="nav">

<a href="index.html">

<span class="nav-icon">
<svg class="svg" viewBox="0 0 24 24">
<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>
</svg>
</span>

<span>Ana Sayfa</span>

</a>

<a href="ara.html">

<span class="nav-icon">
<svg class="svg" viewBox="0 0 24 24">
<circle cx="11" cy="11" r="6.5"/>
<path d="m16 16 5 5"/>
</svg>
</span>

<span>Ara</span>

</a>

<a class="active" href="olustur.html">

<span class="nav-icon">
<svg class="svg" viewBox="0 0 24 24">
<rect x="4" y="4" width="16" height="16" rx="4"/>
<path d="M12 8v8"/>
<path d="M8 12h8"/>
</svg>
</span>

<span>Oluştur</span>

</a>

<a href="reels.html">

<span class="nav-icon">
<svg class="svg" viewBox="0 0 24 24">
<rect x="3" y="4" width="18" height="16" rx="2"/>
<path d="M3 9h18"/>
<path d="M8 4l3 5"/>
<path d="M13 4l3 5"/>
</svg>
</span>

<span>Reels</span>

</a>

<a href="profile.html">

<span class="nav-icon">
<svg class="svg" viewBox="0 0 24 24">
<circle cx="12" cy="8" r="3.5"/>
<path d="M5 20a7 7 0 0 1 14 0"/>
</svg>
</span>

<span>Profil</span>

</a>

</nav>

<div id="toast" class="toast"></div>

<script>

const API="/api";

let token =
  localStorage.getItem("minegram_token") ||
  localStorage.getItem("minegram_supabase_token") ||
  localStorage.getItem("token") ||
  null;


/* =========================
   TOAST
========================= */

function toast(message){

  const el=document.getElementById("toast");

  if(!el)return;

  el.textContent=String(message || "");

  el.style.opacity="1";

  clearTimeout(window.__toast);

  window.__toast=setTimeout(()=>{
    el.style.opacity="0";
  },2500);

}


/* =========================
   GERİ
========================= */

function goBack(){

  if(history.length>1){
    history.back();
  }else{
    location.href="index.html";
  }

}


/* =========================
   DOSYA
========================= */

function openFilePicker(){

  const input=document.getElementById("file");

  if(input){
    input.click();
  }

}


document
.getElementById("file")
.addEventListener("change",previewFile);


/* =========================
   ÖNİZLEME
========================= */

function previewFile(){

  const input=document.getElementById("file");
  const picker=document.getElementById("picker");

  const f=input.files && input.files[0];

  if(!f)return;


  if(f.size>100*1024*1024){

    input.value="";

    toast("Dosya çok büyük. Maksimum 100 MB.");

    return;

  }


  const old=document.getElementById("pickerPreview");

  if(old){

    if(old.src){

      try{
        URL.revokeObjectURL(old.src);
      }catch(e){}

    }

    old.remove();

  }


  const url=URL.createObjectURL(f);

  let tag;


  if(
    String(f.type || "")
      .startsWith("video/")
  ){

    tag=document.createElement("video");

    tag.controls=true;
    tag.muted=true;
    tag.playsInline=true;
    tag.preload="metadata";

  }else{

    tag=document.createElement("img");

    tag.alt="Gönderi önizleme";

  }


  tag.id="pickerPreview";
  tag.className="preview";
  tag.src=url;

  picker.innerHTML="";
  picker.appendChild(tag);

}


/* =========================
   API
========================= */

async function api(path,opt={}){

  const headers={
    ...(opt.headers || {})
  };


  if(token){

    headers.Authorization=
      "Bearer "+token;

  }


  if(opt.body instanceof FormData){

    delete headers["Content-Type"];
    delete headers["content-type"];

  }


  const response=
    await fetch(
      API+path,
      {
        ...opt,
        headers
      }
    );


  const contentType=
    response.headers.get("content-type") || "";


  let data={};


  if(
    contentType.includes("application/json")
  ){

    data=
      await response
        .json()
        .catch(()=>({}));

  }else{

    const text=
      await response
        .text()
        .catch(()=>"");

    if(text){
      data={error:text};
    }

  }


  if(!response.ok){

    throw new Error(
      data.error ||
      data.message ||
      "İşlem başarısız."
    );

  }


  return data;

}


/* =========================
   GÖNDERİ PAYLAŞ
========================= */

async function post(){

  const fileInput=
    document.getElementById("file");

  const caption=
    document.getElementById("cap");

  const button=
    document.getElementById("postBtn");


  if(!fileInput || !caption || !button){
    return;
  }


  const f=
    fileInput.files &&
    fileInput.files[0];


  const text=
    caption.value.trim();


  if(!f && !text){

    toast(
      "Bir fotoğraf/video veya açıklama ekle"
    );

    return;

  }


  if(f){

    if(f.size>100*1024*1024){

      toast(
        "Dosya çok büyük. Maksimum 100 MB."
      );

      return;

    }


    const type=
      String(f.type || "");


    if(
      !type.startsWith("image/") &&
      !type.startsWith("video/")
    ){

      toast(
        "Sadece fotoğraf veya video seçebilirsin."
      );

      return;

    }

  }


  if(!token){

    toast("Oturum bulunamadı. Tekrar giriş yap.");

    setTimeout(()=>{
      location.href="giris.html";
    },900);

    return;

  }


  const formData=
    new FormData();


  if(f){

    formData.append(
      "media",
      f,
      f.name
    );

  }


  formData.append(
    "caption",
    text
  );


  button.disabled=true;
  button.style.opacity=".6";
  button.textContent="Paylaşılıyor...";


  try{

    console.log(
      "[MINEGRAM] POST /api/posts başlıyor"
    );


    const result=
      await api(
        "/posts",
        {
          method:"POST",
          body:formData
        }
      );


    console.log(
      "[MINEGRAM] GÖNDERİ BAŞARILI",
      result
    );


    /*
     * Sunucudan dönen gönderiyi
     * tarayıcıda da saklıyoruz.
     */

    try{

      localStorage.setItem(
        "minegram_last_created_post",
        JSON.stringify(result)
      );

      localStorage.setItem(
        "minegram_post_created_at",
        String(Date.now())
      );

    }catch(e){

      console.warn(
        "localStorage kayıt hatası",
        e
      );

    }


    button.disabled=false;
    button.style.opacity="1";
    button.textContent="Paylaş";


    toast(
      "Gönderi başarıyla paylaşıldı"
    );


    /*
     * Profil sayfasına dön.
     * pageshow/load mekanizması profilin
     * gönderileri tekrar çekmesini sağlar.
     */

    setTimeout(()=>{

      location.href="profile.html?refresh="+Date.now();

    },700);


  }catch(error){

    console.error(
      "[MINEGRAM] GÖNDERİ HATASI:",
      error
    );


    button.disabled=false;
    button.style.opacity="1";
    button.textContent="Paylaş";


    toast(
      error?.message ||
      "Gönderi paylaşılırken hata oluştu"
    );

  }

}


/* =========================
   GİRİŞ KONTROLÜ
========================= */

async function init(){

  if(!token){

    location.replace("giris.html");

    return;

  }


  try{

    await api("/me");

  }catch(error){

    console.warn(
      "[OLUŞTUR /me]",
      error
    );


    localStorage.removeItem(
      "minegram_token"
    );

    localStorage.removeItem(
      "minegram_supabase_token"
    );

    localStorage.removeItem(
      "token"
    );


    location.replace("giris.html");

  }

}


init();

</script>

</body>
</html>
