<!doctype html>

<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Oluştur - Minegram</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding-bottom:76px;
  overflow-x:hidden;
}

.app{
  width:100%;
  min-height:100vh;
  background:#000;
}

/* =========================
   ÜST BAR
========================= */

.top{
  height:70px;
  display:flex;
  align-items:center;
  padding:0 22px;
  border-bottom:1px solid #202020;
  position:sticky;
  top:0;
  background:#000;
  z-index:50;
}

.top b{
  font-size:21px;
}

.back{
  width:42px;
  height:42px;
  border:0;
  background:none;
  color:#eee;
  font-size:32px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding:0;
}

/* =========================
   SAYFA
========================= */

.page{
  width:min(680px,100%);
  margin:0 auto;
  padding:22px 20px 40px;
}

/* =========================
   DOSYA SEÇME
========================= */

.picker{
  width:100%;
  height:300px;
  border-radius:15px;
  background:#080808;
  border:1px solid #29262f;
  display:grid;
  place-items:center;
  text-align:center;
  color:#aaa;
  cursor:pointer;
  overflow:hidden;
}

.picker:hover{
  border-color:#4b99d2;
}

.picker span{
  font-size:48px;
  color:#4b99d2;
}

.picker b{
  color:#eee;
  font-size:15px;
}

.picker small{
  display:block;
  margin-top:6px;
  color:#888;
}

/* =========================
   ÖNİZLEME
========================= */

.preview{
  width:100%;
  height:100%;
  max-width:100%;
  max-height:290px;
  border-radius:12px;
  object-fit:contain;
  display:block;
}

/* =========================
   AÇIKLAMA
========================= */

.field{
  width:100%;
  min-height:90px;
  background:#080808;
  border:1px solid #444;
  color:#eee;
  border-radius:10px;
  padding:12px 14px;
  outline:none;
  resize:vertical;
  font-family:Arial,Helvetica,sans-serif;
  font-size:14px;
  margin-top:12px;
}

.field::placeholder{
  color:#777;
}

.field:focus{
  border-color:#4b99d2;
}

/* =========================
   PAYLAŞ
========================= */

.btn{
  width:100%;
  height:48px;
  border:0;
  border-radius:24px;
  background:#4b99d2;
  color:#101820;
  font-weight:700;
  cursor:pointer;
  margin-top:12px;
  font-size:14px;
}

.btn:hover{
  opacity:.92;
}

.btn:disabled{
  cursor:not-allowed;
}

/* =========================
   ALT MENÜ
   ARA.HTML İLE AYNI
========================= */

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  width:100%;
  height:76px;

  background:#121018;
  border-top:1px solid #201d27;

  display:flex;
  align-items:stretch;

  z-index:9999;

  padding:
    5px
    max(8px, calc((100% - 760px) / 2))
    env(safe-area-inset-bottom);
}

.nav a{
  flex:1 1 0;

  height:66px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:3px;

  color:#ddd;
  text-decoration:none;

  font-size:9px;

  min-width:0;

  -webkit-tap-highlight-color:transparent;
}

.nav-icon{
  width:45px;
  height:32px;

  border-radius:18px;

  display:grid;
  place-items:center;

  flex:none;
}

.nav a.active .nav-icon{
  background:#3b3150;
}

.svg{
  width:21px;
  height:21px;

  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================
   MOBİL
========================= */

@media(max-width:699px){

  .top{
    height:62px;
    padding:0 14px;
  }

  .page{
    width:100%;
    padding:18px 14px 35px;
  }

  .nav{
    height:76px;

    padding:
      5px
      8px
      env(safe-area-inset-bottom);
  }

  .nav a{
    height:66px;
  }

  .nav-icon{
    width:45px;
    height:32px;
  }

  .picker{
    height:280px;
  }
}
</style>

</head>

<body>

<div class="app">

  <!-- =========================
       ÜST BAR
  ========================== -->

  <header class="top">

    <button
      class="back"
      type="button"
      onclick="location.href='index.html'"
    >
      ‹
    </button>

    <b>Yeni Gönderi</b>

  </header>


  <!-- =========================
       OLUŞTUR
  ========================== -->

  <main class="page">

    <div
      id="picker"
      class="picker"
      onclick="openFilePicker()"
    >

      <div id="pickerContent">

        <span>＋</span>

        <br>

        <b>Fotoğraf / Video seç</b>

        <small>
          Galeriyi açmak için dokun
        </small>

      </div>

    </div>


    <input
      id="file"
      type="file"
      accept="image/*,video/*"
      hidden
    >


    <textarea
      id="cap"
      class="field"
      placeholder="Açıklama / etiket"
    ></textarea>


    <button
      id="postBtn"
      class="btn"
      type="button"
      onclick="post()"
    >
      Paylaş
    </button>

  </main>

</div>


<!-- =========================
     ALT MENÜ
========================= -->

<nav class="nav">

  <!-- ANA SAYFA -->

  <a href="index.html">

    <span class="nav-icon">

      <svg
        class="svg"
        viewBox="0 0 24 24"
      >

        <path
          d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"
        />

      </svg>

    </span>

    <span>Ana Sayfa</span>

  </a>


  <!-- ARA -->

  <a href="ara.html">

    <span class="nav-icon">

      <svg
        class="svg"
        viewBox="0 0 24 24"
      >

        <circle
          cx="11"
          cy="11"
          r="6.5"
        />

        <path
          d="m16 16 5 5"
        />

      </svg>

    </span>

    <span>Ara</span>

  </a>


  <!-- OLUŞTUR -->

  <a
    class="active"
    href="olustur.html"
  >

    <span class="nav-icon">

      <svg
        class="svg"
        viewBox="0 0 24 24"
      >

        <rect
          x="4"
          y="4"
          width="16"
          height="16"
          rx="4"
        />

        <path
          d="M12 8v8"
        />

        <path
          d="M8 12h8"
        />

      </svg>

    </span>

    <span>Oluştur</span>

  </a>


  <!-- REELS -->

  <a href="reels.html">

    <span class="nav-icon">

      <svg
        class="svg"
        viewBox="0 0 24 24"
      >

        <rect
          x="3"
          y="4"
          width="18"
          height="16"
          rx="2"
        />

        <path
          d="M3 9h18"
        />

        <path
          d="M8 4l3 5"
        />

        <path
          d="M13 4l3 5"
        />

      </svg>

    </span>

    <span>Reels</span>

  </a>


  <!-- PROFİL -->

  <a href="profile.html">

    <span class="nav-icon">

      <svg
        class="svg"
        viewBox="0 0 24 24"
      >

        <circle
          cx="12"
          cy="8"
          r="3.5"
        />

        <path
          d="M5 20a7 7 0 0 1 14 0"
        />

      </svg>

    </span>

    <span>Profil</span>

  </a>

</nav>


<!-- =========================
     TOAST
========================= -->

<div
  id="toast"
  class="toast"
  style="
    position:fixed;
    left:50%;
    bottom:92px;
    transform:translateX(-50%);
    background:#25232a;
    color:#fff;
    padding:10px 16px;
    border-radius:20px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:10000;
    white-space:nowrap;
    max-width:90%;
    overflow:hidden;
    text-overflow:ellipsis;
  "
></div>


<script>

/* =========================
   API
========================= */

const API="/api";


let token =
  localStorage.getItem("minegram_token") ||
  localStorage.getItem("minegram_supabase_token") ||
  null;


/* =========================
   TOAST
========================= */

function toast(message){

  const el =
    document.getElementById("toast");

  if(!el)return;

  el.textContent =
    String(message || "");

  el.style.opacity="1";

  clearTimeout(window.__toast);

  window.__toast =
    setTimeout(() => {

      el.style.opacity="0";

    },2200);

}


/* =========================
   DOSYA SEÇME
========================= */

function openFilePicker(){

  const fileInput =
    document.getElementById("file");

  if(!fileInput)return;

  fileInput.click();

}


/* =========================
   DOSYA SEÇİLİNCE
========================= */

document
  .getElementById("file")
  .addEventListener(
    "change",
    previewFile
  );


/* =========================
   DOSYA ÖNİZLEME
========================= */

function previewFile(){

  const fileInput =
    document.getElementById("file");

  const picker =
    document.getElementById("picker");

  const f =
    fileInput.files &&
    fileInput.files[0];

  if(!f){

    return;

  }


  /* Eski önizlemeyi kaldır */

  const old =
    document.getElementById(
      "pickerPreview"
    );

  if(old){

    if(old.src){

      try{

        URL.revokeObjectURL(
          old.src
        );

      }catch(e){}

    }

    old.remove();

  }


  /* Dosya boyutu kontrolü */

  const maxSize =
    100 * 1024 * 1024;

  if(f.size > maxSize){

    fileInput.value="";

    toast(
      "Dosya çok büyük. Maksimum 100 MB."
    );

    return;

  }


  const url =
    URL.createObjectURL(f);


  let tag;


  if(
    f.type &&
    f.type.startsWith("video/")
  ){

    tag =
      document.createElement(
        "video"
      );

    tag.controls=true;
    tag.muted=true;
    tag.playsInline=true;
    tag.preload="metadata";

  }else{

    tag =
      document.createElement(
        "img"
      );

    tag.alt =
      "Gönderi önizleme";

  }


  tag.id =
    "pickerPreview";

  tag.className =
    "preview";

  tag.src =
    url;


  /* Picker'ın içeriğini temizle */

  picker.innerHTML="";


  /* Önizlemeyi ekle */

  picker.appendChild(tag);


  /* Kullanıcıya bilgi */

  console.log(
    "[MINEGRAM FILE]",
    {
      name:f.name,
      type:f.type,
      size:f.size
    }
  );

}


/* =========================
   API
========================= */

async function api(
  path,
  opt={}
){

  const headers = {
    ...(opt.headers || {})
  };


  if(token){

    headers.Authorization =
      "Bearer " + token;

  }


  /*
   * ÖNEMLİ:
   * FormData gönderirken Content-Type
   * elle yazılmıyor.
   *
   * Tarayıcı multipart boundary'yi
   * kendisi oluşturuyor.
   */

  if(
    opt.body instanceof FormData
  ){

    delete headers["Content-Type"];
    delete headers["content-type"];

  }


  const response =
    await fetch(
      API + path,
      {
        ...opt,
        headers
      }
    );


  const contentType =
    response.headers.get(
      "content-type"
    ) || "";


  let data = {};


  if(
    contentType.includes(
      "application/json"
    )
  ){

    data =
      await response
        .json()
        .catch(() => ({}));

  }else{

    const text =
      await response
        .text()
        .catch(() => "");

    if(text){

      data = {
        error:text
      };

    }

  }


  if(!response.ok){

    throw new Error(
      data.error ||
      data.message ||
      "İşlem başarısız."
    );

  }


  return data;

}


/* =========================
   GÖNDERİ PAYLAŞ
========================= */

async function post(){

  const fileInput =
    document.getElementById(
      "file"
    );

  const caption =
    document.getElementById(
      "cap"
    );

  const button =
    document.getElementById(
      "postBtn"
    );


  if(
    !fileInput ||
    !caption ||
    !button
  ){

    return;

  }


  const f =
    fileInput.files &&
    fileInput.files[0];


  const text =
    caption.value.trim();


  /*
   * Hem fotoğraf/video hem de
   * sadece açıklama destekleniyor.
   */

  if(!f && !text){

    toast(
      "Bir fotoğraf/video veya açıklama ekle"
    );

    return;

  }


  /* =========================
     DOSYA KONTROLÜ
  ========================= */

  if(f){

    const maxSize =
      100 * 1024 * 1024;


    if(f.size > maxSize){

      toast(
        "Dosya çok büyük. Maksimum 100 MB."
      );

      return;

    }


    const type =
      String(f.type || "");


    if(
      !type.startsWith("image/") &&
      !type.startsWith("video/")
    ){

      toast(
        "Sadece fotoğraf veya video seçebilirsin."
      );

      return;

    }

  }


  /* =========================
     FORM DATA
  ========================= */

  const formData =
    new FormData();


  if(f){

    /*
     * Sunucunun beklediği alan:
     * media
     */

    formData.append(
      "media",
      f,
      f.name
    );

  }


  /*
   * Sunucunun beklediği alan:
   * caption
   */

  formData.append(
    "caption",
    text
  );


  /* =========================
     BUTON
  ========================= */

  button.disabled=true;

  button.style.opacity=".6";

  button.textContent =
    "Paylaşılıyor...";


  try{

    console.log(
      "[MINEGRAM] Gönderi gönderiliyor...",
      {
        file:f
          ? {
              name:f.name,
              type:f.type,
              size:f.size
            }
          : null,
        caption:text
      }
    );


    const result =
      await api(
        "/posts",
        {
          method:"POST",
          body:formData
        }
      );


    console.log(
      "[MINEGRAM] Gönderi başarılı:",
      result
    );


    /* =========================
       FORMU TEMİZLE
    ========================= */

    caption.value="";

    fileInput.value="";


    const picker =
      document.getElementById(
        "picker"
      );


    if(picker){

      picker.innerHTML = `

        <div id="pickerContent">

          <span>＋</span>

          <br>

          <b>Fotoğraf / Video seç</b>

          <small>
            Galeriyi açmak için dokun
          </small>

        </div>

      `;

    }


    button.disabled=false;

    button.style.opacity="1";

    button.textContent =
      "Paylaş";


    toast(
      "Gönderi başarıyla paylaşıldı"
    );


    /*
     * Ana sayfaya dön
     */

    setTimeout(() => {

      location.href =
        "index.html";

    },700);


  }catch(error){

    console.error(
      "[MINEGRAM] GÖNDERİ HATASI:",
      error
    );


    button.disabled=false;

    button.style.opacity="1";

    button.textContent =
      "Paylaş";


    toast(
      error?.message ||
      "Gönderi paylaşılırken hata oluştu"
    );

  }

}


/* =========================
   GİRİŞ KONTROLÜ
========================= */

async function init(){

  if(!token){

    location.replace(
      "giris.html"
    );

    return;

  }


  try{

    await api(
      "/me"
    );

  }catch(error){

    console.warn(
      "[OLUŞTUR /me]",
      error
    );


    localStorage.removeItem(
      "minegram_token"
    );

    localStorage.removeItem(
      "minegram_supabase_token"
    );


    location.replace(
      "giris.html"
    );

  }

}


init();

</script>

</body>
</html>
