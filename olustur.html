<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Reels - Minegram</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#eee;
    font-family:Arial,sans-serif;
}

body{
    padding-bottom:76px;
}

.app{
    min-height:100vh;
    width:100%;
    background:#000;
}

/* ÜST BAŞLIK */
.top{
    height:62px;
    display:flex;
    align-items:center;
    padding:0 20px;
    border-bottom:1px solid #25222b;
    position:sticky;
    top:0;
    background:#000;
    z-index:10;
}

.top b{
    font-size:19px;
}

/* SAYFA */
.page{
    width:100%;
    max-width:760px;
    margin:0 auto;
    padding:22px 20px;
}

.empty{
    text-align:center;
    padding:150px 20px;
    color:#999;
}

.empty strong{
    display:block;
    margin-top:14px;
    color:#eee;
    font-size:17px;
}

.empty small{
    display:block;
    margin-top:6px;
}

/* SVG */
.ico,
.svg{
    width:22px;
    height:22px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =========================
   ALT MENÜ - TAM YATAY
========================= */

.nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:76px;

    display:flex !important;
    flex-direction:row !important;
    align-items:center !important;
    justify-content:space-around !important;

    background:#121018;
    border-top:1px solid #201d27;

    z-index:9999;
}

.nav a{
    flex:1 !important;
    height:76px;

    display:flex !important;
    flex-direction:column !important;

    align-items:center !important;
    justify-content:center !important;

    gap:3px;

    color:#ddd;
    text-decoration:none;
    font-size:10px;

    min-width:0;
}

.nav-icon{
    width:45px;
    height:32px;

    display:flex !important;
    align-items:center !important;
    justify-content:center !important;

    border-radius:18px;
}

/* AKTİF SAYFA */
.nav a.active .nav-icon{
    background:#3b3150;
}

/* MOBİL */
@media(max-width:500px){

    .nav a{
        font-size:9px;
    }

    .nav-icon{
        width:42px;
    }

    .page{
        padding:18px 16px;
    }

}

/* TOAST */
.toast{
    position:fixed;
    left:50%;
    bottom:90px;
    transform:translateX(-50%);

    background:#252329;
    color:#fff;

    padding:10px 16px;
    border-radius:20px;

    opacity:0;
    pointer-events:none;

    transition:.2s;

    z-index:10000;
}

.toast.show{
    opacity:1;
}

</style>
</head>

<body>

<main class="app">

    <!-- BAŞLIK -->

    <div class="top">
        <b>Reels</b>
    </div>


    <!-- İÇERİK -->

    <div class="page">

        <div class="empty">

            <svg class="ico" style="width:52px;height:52px" viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <path d="M3 9h18M8 4l3 5M13 4l3 5"/>
            </svg>

            <strong>Henüz Reel yok</strong>

            <small>İlk videoyu sen paylaş.</small>

        </div>

    </div>


    <!-- ALT MENÜ -->

    <nav class="nav">

        <!-- ANA SAYFA -->

        <a href="index.html">

            <span class="nav-icon">

                <svg class="svg" viewBox="0 0 24 24">
                    <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>
                </svg>

            </span>

            <span>Ana Sayfa</span>

        </a>


        <!-- ARA -->

        <a href="ara.html">

            <span class="nav-icon">

                <svg class="svg" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="6.5"/>
                    <path d="m16 16 5 5"/>
                </svg>

            </span>

            <span>Ara</span>

        </a>


        <!-- OLUŞTUR -->

        <a href="olustur.html">

            <span class="nav-icon">

                <svg class="svg" viewBox="0 0 24 24">
                    <rect x="4" y="4" width="16" height="16" rx="4"/>
                    <path d="M12 8v8M8 12h8"/>
                </svg>

            </span>

            <span>Oluştur</span>

        </a>


        <!-- REELS -->

        <a href="reels.html" class="active">

            <span class="nav-icon">

                <svg class="svg" viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="16" rx="2"/>
                    <path d="M3 9h18M8 4l3 5M13 4l3 5"/>
                </svg>

            </span>

            <span>Reels</span>

        </a>


        <!-- PROFİL -->

        <a href="profile.html">

            <span class="nav-icon">

                <svg class="svg" viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="3.5"/>
                    <path d="M5 20a7 7 0 0 1 14 0"/>
                </svg>

            </span>

            <span>Profil</span>

        </a>

    </nav>


    <div id="toast" class="toast"></div>

</main>


<script>

/* API */

const API="/api";


/* TOKEN */

let token=localStorage.getItem("minegram_token");


/* API FONKSİYONU */

async function api(path,opt={}){

    opt.headers={
        ...(opt.headers||{}),
        ...(token
            ? {Authorization:"Bearer "+token}
            : {}
        )
    };

    const response=await fetch(API+path,opt);

    const data=await response
        .json()
        .catch(()=>({}));

    if(!response.ok){
        throw new Error(
            data.error || "İşlem başarısız"
        );
    }

    return data;
}


/* TOAST */

function toast(message){

    const element=document.getElementById("toast");

    element.textContent=message;

    element.classList.add("show");

    setTimeout(()=>{

        element.classList.remove("show");

    },2200);

}


/* GİRİŞ KONTROLÜ */

if(!token){

    location.href="index.html";

}else{

    api("/me")

        .catch(()=>{

            localStorage.removeItem("minegram_token");

            location.href="index.html";

        });

}

</script>

</body>
</html>
