<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Minegram • Profil</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;min-height:100%;overflow-x:hidden}button{font:inherit;cursor:pointer}.app{min-height:100dvh;background:#000;padding-bottom:78px}.header{height:62px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #181818;position:sticky;top:0;background:#000;z-index:10}.back{border:0;background:none;color:#fff;font-size:28px;width:38px}.title{font-size:18px;font-weight:700}.headmore{margin-left:auto;border:0;background:none;color:#fff;font-size:21px}.profile{max-width:720px;margin:auto;padding:18px 15px 0}.top{display:flex;gap:18px;align-items:center}.avatar{width:88px;height:88px;border-radius:50%;background:#4597d0;display:grid;place-items:center;font-size:30px;font-weight:700;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.info{flex:1}.username{font-size:20px;font-weight:700}.verified{color:#4597d0}.display{font-size:14px;margin-top:5px}.bio{color:#bbb;font-size:13px;line-height:1.35;margin-top:7px}.stats{display:flex;justify-content:space-around;text-align:center;margin:22px 0 14px}.stat b{display:block;font-size:16px}.stat span{font-size:11px;color:#aaa}.actions{display:flex;gap:8px}.actions button{flex:1;height:38px;border:1px solid #3a3a3a;background:#111;color:#fff;border-radius:8px;font-weight:700}.actions .follow{background:#4597d0;color:#061018;border-color:#4597d0}.tabs{display:flex;border-top:1px solid #222;border-bottom:1px solid #222;margin-top:18px}.tab{flex:1;height:44px;border:0;background:none;color:#888}.tab.active{color:#fff;border-bottom:2px solid #fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:2px}.tile{aspect-ratio:1/1;background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center}.tile img{width:100%;height:100%;object-fit:cover}.tile .txt{padding:10px;font-size:12px;color:#ccc}.empty{text-align:center;color:#777;padding:60px 20px;grid-column:1/-1}.bottom{position:fixed;left:0;right:0;bottom:0;height:76px;padding:5px 4px max(5px,env(safe-area-inset-bottom));display:flex;background:#19171f;border-top:1px solid #25232c;z-index:20}.nav{flex:1;border:0;background:none;color:#ddd;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav span{font-size:22px}.nav.active span{background:#3b3450;border-radius:18px;padding:3px 13px}
</style></head><body><div class="app"><header class="header"><button class="back" onclick="location.href='../'">‹</button><div class="title" id="title">Profil</div><button class="headmore">⋯</button></header><main class="profile"><section class="top"><div id="avatar" class="avatar">M</div><div class="info"><div id="username" class="username">@minegram <span class="verified">✓</span></div><div id="display" class="display"></div><div id="bio" class="bio"></div></div></section><section class="stats"><div class="stat"><b id="postCount">0</b><span>Gönderi</span></div><div class="stat"><b id="followers">0</b><span>Takipçi</span></div><div class="stat"><b id="following">0</b><span>Takip</span></div></section><div class="actions"><button id="edit" onclick="editProfile()">Profili Düzenle</button><button onclick="location.href='../messages/'">Mesaj</button></div><div class="tabs"><button class="tab active">▦</button><button class="tab">♡</button></div><section id="grid" class="grid"></section></main><nav class="bottom"><button class="nav" onclick="location.href='../'"><span>⌂</span>Ana Sayfa</button><button class="nav" onclick="location.href='../#search'"><span>⌕</span>Ara</button><button class="nav" onclick="location.href='../#create'"><span>＋</span>Oluştur</button><button class="nav" onclick="location.href='../#reels'"><span>▣</span>Reels</button><button class="nav active" onclick="location.href='../profile/'"><span>♙</span>Profil</button></nav></div>
<script>
const token=localStorage.getItem('minegram_token')||localStorage.getItem('token');const params=new URLSearchParams(location.search);const target=params.get('username');let me=null;
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(url,opt);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'İşlem başarısız');return r.json()}
async function load(){if(!token){location.href='../';return}try{me=await api('/api/me');const username=target||me.username;const p=await api('/api/users/'+encodeURIComponent(username));document.getElementById('title').textContent='@'+p.username;document.getElementById('username').innerHTML='@'+p.username+(p.verified?' <span class="verified">✓</span>':'');document.getElementById('display').textContent=p.displayName||'';document.getElementById('bio').textContent=p.bio||'';document.getElementById('postCount').textContent=p.postCount||0;document.getElementById('followers').textContent=p.followers||0;document.getElementById('following').textContent=p.following||0;document.getElementById('edit').textContent=p.id===me.id?'Profili Düzenle':(p.followingByMe?'Takibi Bırak':'Takip Et');document.getElementById('edit').classList.toggle('follow',p.id!==me.id&&!p.followingByMe);if(p.avatar){document.getElementById('avatar').innerHTML='<img src="'+p.avatar+'">'}else document.getElementById('avatar').textContent=(p.displayName||p.username||'M')[0].toUpperCase();const posts=await api('/api/users/'+encodeURIComponent(username)+'/posts');document.getElementById('grid').innerHTML=posts.length?posts.map(x=>x.media?'<div class="tile"><img src="'+x.media+'" loading="lazy"></div>':'<div class="tile"><div class="txt">'+escapeHtml(x.caption||'')+'</div></div>').join(''):'<div class="empty">Henüz gönderi yok.</div>'}catch(e){document.getElementById('grid').innerHTML='<div class="empty">Profil yüklenemedi.</div>'}}
async function editProfile(){if(!me)return;const p=await api('/api/users/'+encodeURIComponent(me.username));if(p.id!==me.id){try{const r=await api('/api/users/'+encodeURIComponent(p.username)+'/follow',{method:'POST'});location.reload()}catch(e){alert(e.message)}return}const display=prompt('Görünen ad:',p.displayName||'');if(display===null)return;const bio=prompt('Biyografi:',p.bio||'');if(bio===null)return;try{await api('/api/me',{method:'PATCH',body:{displayName:display,bio}});location.reload()}catch(e){alert(e.message)}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
