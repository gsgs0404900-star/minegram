<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Şifre oluştur - Minegram</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}.page{min-height:100vh}.topbar{height:60px;display:flex;align-items:center;padding-left:38px}
.back{font-size:34px;cursor:pointer}.top-title{margin-left:15px;font-size:20px;font-weight:700}
.content{width:317px;margin:115px auto}.title{text-align:center;font-size:30px}.description{font-size:18px;line-height:1.45;color:#bdbdbd;margin:34px 0 65px}
.password-box{position:relative}.password{width:100%;height:48px;padding:0 60px 0 12px;background:#050505;border:1px solid #444;border-radius:8px;color:#fff}
.show-password{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#aaa;cursor:pointer}
.message{min-height:20px;margin-top:12px;text-align:center;font-size:13px;color:#ff5c5c}.message.success{color:#55b8ff}
.next-button{width:100%;height:48px;margin-top:25px;border:0;border-radius:24px;background:#2677b5;color:#000;font-weight:700;cursor:pointer}
.next-button:disabled{opacity:.6}
@media(max-width:600px){.content{width:calc(100% - 40px);margin-top:65px}.title{font-size:38px}.description{font-size:20px}.password{height:68px;font-size:18px}.next-button{height:58px;font-size:18px}}
</style>
</head>
<body><div class="page">
<div class="topbar"><div class="back" id="topBack">‹</div><div class="top-title">Kayıt ol</div></div>
<main class="content">
<h1 class="title">Şifre oluştur</h1>
<p class="description">Hesabını korumak için güçlü bir şifre oluştur.</p>
<div class="password-box"><input id="password" class="password" type="password" placeholder="Şifre" autocomplete="new-password" maxlength="128"><button type="button" id="showPassword" class="show-password">Göster</button></div>
<div id="message" class="message"></div>
<button type="button" id="nextButton" class="next-button">Hesap Oluştur</button>
</main></div>
<script>
const passwordInput=document.getElementById("password"),nextButton=document.getElementById("nextButton"),message=document.getElementById("message");
const username=(sessionStorage.getItem("minegram_register_username")||"").trim().toLowerCase();
function showMessage(t,s=false){message.textContent=t||"";message.className="message"+(s?" success":"")}
document.getElementById("showPassword").onclick=()=>{const h=passwordInput.type==="password";passwordInput.type=h?"text":"password";document.getElementById("showPassword").textContent=h?"Gizle":"Göster"};
document.getElementById("topBack").onclick=()=>location.href="kayit.html";
async function createAccount(){
 const password=passwordInput.value;
 showMessage("");
 if(!username){showMessage("Kullanıcı adı bulunamadı. Kayıt işlemine yeniden başla.");return}
 if(password.length<6){showMessage("Şifren en az 6 karakter olmalı.");passwordInput.focus();return}
 nextButton.disabled=true;nextButton.textContent="Hesap oluşturuluyor...";
 try{
  const r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password,displayName:username})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.ok) throw new Error(d.error||"Hesap oluşturulamadı.");
  sessionStorage.removeItem("minegram_register_username");
  showMessage("Hesabın başarıyla oluşturuldu. Şimdi kullanıcı adın ve şifren ile giriş yapabilirsin.",true);
  nextButton.textContent="Giriş Sayfasına Git";nextButton.disabled=false;
  nextButton.onclick=()=>location.href="giris.html";
 }catch(e){showMessage(e.message||"Hesap oluşturulamadı.");nextButton.disabled=false;nextButton.textContent="Hesap Oluştur"}
}
nextButton.addEventListener("click",createAccount);
passwordInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();createAccount()}});
</script></body></html>
