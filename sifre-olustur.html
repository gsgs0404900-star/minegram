<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>Şifre oluştur - Minegram</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
    position:relative;
}


/* =========================================
   ÜST BAŞLIK
========================================= */

.topbar{

    width:100%;
    height:60px;

    display:flex;
    align-items:center;

    padding-left:38px;
}

.back{

    width:25px;
    height:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:34px;
    font-weight:300;

    line-height:1;

    cursor:pointer;
    user-select:none;
}

.top-title{

    margin-left:15px;

    font-size:20px;
    font-weight:700;

    color:#fff;
}


/* =========================================
   ANA İÇERİK
========================================= */

.content{

    width:317px;

    margin:115px auto 0;
}


/* =========================================
   BAŞLIK
========================================= */

.title{

    text-align:center;

    font-size:30px;
    line-height:1.15;

    font-weight:700;

    margin:0 0 34px;

    color:#fff;
}


/* =========================================
   AÇIKLAMA
========================================= */

.description{

    font-size:18px;

    line-height:1.45;

    color:#bdbdbd;

    margin:0 0 65px;
}


/* =========================================
   ŞİFRE
========================================= */

.password-box{

    position:relative;

    width:100%;
}

.password{

    display:block;

    width:100%;
    height:39px;

    padding:0 42px 0 10px;

    border:1px solid #252525;
    border-radius:6px;

    background:#050505;

    color:#fff;

    outline:none;

    font-size:12px;

    font-family:Arial,Helvetica,sans-serif;
}

.password::placeholder{

    color:#777;

    opacity:1;
}

.password:focus{

    border-color:#555;
}


/* =========================================
   ŞİFRE GÖSTER
========================================= */

.show-password{

    position:absolute;

    right:12px;
    top:50%;

    transform:translateY(-50%);

    border:0;

    background:transparent;

    color:#888;

    font-size:11px;

    cursor:pointer;

    padding:4px;
}


/* =========================================
   MESAJ
========================================= */

.message{

    min-height:18px;

    margin-top:12px;

    text-align:center;

    font-size:11px;

    line-height:1.4;

    color:#ff5c5c;
}

.message.success{

    color:#55b8ff;
}

.message.loading{

    color:#aaa;
}


/* =========================================
   İLERİ
========================================= */

.next-button{

    display:block;

    width:317px;
    height:37px;

    margin:28px auto 0;

    border:0;

    border-radius:22px;

    background:#2677b5;

    color:#000;

    font-size:12px;

    font-weight:700;

    cursor:pointer;
}

.next-button:active{

    transform:scale(.99);
}

.next-button:disabled{

    opacity:.6;

    cursor:not-allowed;
}


/* =========================================
   MOBİL
========================================= */

@media(max-width:600px){

    .topbar{

        height:70px;

        padding-left:28px;
    }

    .back{

        width:30px;
        height:38px;

        font-size:38px;
    }

    .top-title{

        margin-left:12px;

        font-size:21px;
    }

    .content{

        width:calc(100% - 40px);

        max-width:714px;

        margin:105px auto 0;
    }

    .title{

        font-size:42px;

        margin-bottom:30px;
    }

    .description{

        font-size:21px;

        line-height:1.5;

        margin-bottom:55px;
    }

    .password{

        height:68px;

        padding:0 55px 0 20px;

        font-size:18px;

        border:2px solid #686868;

        border-radius:9px;
    }

    .show-password{

        right:17px;

        font-size:14px;
    }

    .message{

        font-size:14px;
    }

    .next-button{

        width:100%;

        height:58px;

        margin:25px auto 30px;

        font-size:20px;

        border-radius:32px;
    }
}


/* =========================================
   KÜÇÜK TELEFON
========================================= */

@media(max-width:430px){

    .content{

        width:calc(100% - 40px);

        margin-top:65px;
    }

    .title{

        font-size:38px;
    }

    .description{

        font-size:20px;
    }

    .next-button{

        width:100%;
    }
}

</style>

</head>


<body>


<div class="page">


    <!-- =====================================
         ÜST
    ====================================== -->

    <div class="topbar">

        <div
            class="back"
            id="topBack"
            aria-label="Geri"
        >
            ‹
        </div>

        <div class="top-title">
            Kayıt ol
        </div>

    </div>


    <!-- =====================================
         ŞİFRE
    ====================================== -->

    <main class="content">

        <h1 class="title">
            Şifre oluştur
        </h1>


        <p class="description">
            Hesabını korumak için güçlü bir şifre oluştur.
        </p>


        <div class="password-box">

            <input
                id="password"
                class="password"
                type="password"
                placeholder="Şifre"
                autocomplete="new-password"
                maxlength="128"
            >

            <button
                type="button"
                id="showPassword"
                class="show-password"
            >
                Göster
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <button
            type="button"
            id="nextButton"
            class="next-button"
        >
            İleri
        </button>

    </main>


</div>


<!-- =========================================
     FIREBASE
========================================= -->

<script type="module">

/*
 * Firebase SDK
 */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain:
        "mim-ea133.firebaseapp.com",

    databaseURL:
        "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "mim-ea133",

    storageBucket:
        "mim-ea133.firebasestorage.app",

    messagingSenderId:
        "303525353436",

    appId:
        "1:303525353436:web:082fc090b5025e19942119",

    measurementId:
        "G-K962QE5P1R"
};


/* =========================================
   FIREBASE BAŞLAT
========================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const database =
    getDatabase(app);


/* =========================================
   ELEMENTLER
========================================= */

const passwordInput =
    document.getElementById("password");

const nextButton =
    document.getElementById("nextButton");

const message =
    document.getElementById("message");

const showPassword =
    document.getElementById("showPassword");

const topBack =
    document.getElementById("topBack");


/* =========================================
   MESAJ
========================================= */

function showMessage(text,type){

    message.textContent =
        text || "";

    message.className =
        "message";

    if(type){

        message.classList.add(type);
    }
}


/* =========================================
   KULLANICI ADI
========================================= */

function getUsername(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const fromUrl =
        params.get("username");


    if(fromUrl){

        return fromUrl
            .trim()
            .replace(/^@/,"")
            .toLowerCase();
    }


    const saved =
        sessionStorage.getItem(
            "minegram_register_username"
        );


    if(saved){

        return saved
            .trim()
            .replace(/^@/,"")
            .toLowerCase();
    }


    return "";
}


/* =========================================
   E-POSTA
========================================= */

function getEmail(){

    /*
     * Önce URL'den bak
     */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const urlEmail =
        params.get("email");


    if(urlEmail){

        return urlEmail.trim();
    }


    /*
     * Sonra sessionStorage
     */

    const possibleKeys = [

        "minegram_register_email",

        "register_email",

        "email",

        "minegram_email"

    ];


    for(
        const key of possibleKeys
    ){

        const value =
            sessionStorage.getItem(key);


        if(value){

            return value.trim();
        }

    }


    return "";
}


/* =========================================
   ŞİFRE GÖSTER / GİZLE
========================================= */

showPassword.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            showPassword.textContent =
                "Gizle";

        }
        else{

            passwordInput.type =
                "password";

            showPassword.textContent =
                "Göster";
        }

    }
);


/* =========================================
   GERİ
========================================= */

function goBack(){

    /*
     * Kullanıcı adı sayfasına dön.
     */

    window.location.href =
        "./kullanici-adi.html";
}


topBack.addEventListener(
    "click",
    goBack
);


/* =========================================
   ŞİFRE KONTROL
========================================= */

passwordInput.addEventListener(
    "input",
    function(){

        showMessage(
            "",
            ""
        );

        nextButton.disabled =
            false;
    }
);


/* =========================================
   ENTER
========================================= */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            nextButton.click();
        }

    }
);


/* =========================================
   FIREBASE HATA MESAJLARI
========================================= */

function firebaseError(error){

    const code =
        error &&
        error.code
            ? error.code
            : "";


    switch(code){

        case "auth/email-already-in-use":

            return "Bu e-posta adresi zaten kullanılıyor.";

        case "auth/invalid-email":

            return "E-posta adresi geçersiz.";

        case "auth/weak-password":

            return "Şifre çok zayıf. En az 6 karakter kullan.";

        case "auth/network-request-failed":

            return "İnternet bağlantısını kontrol et.";

        case "auth/operation-not-allowed":

            return "Firebase'de E-posta/Şifre girişi etkin değil.";

        default:

            return (
                error &&
                error.message
            )
            ||
            "Kayıt oluşturulamadı.";

    }
}


/* =========================================
   İLERİ
========================================= */

nextButton.addEventListener(
    "click",
    async function(){

        const password =
            passwordInput.value;


        const username =
            getUsername();


        const email =
            getEmail();


        /* -----------------------------
           KULLANICI ADI
        ----------------------------- */

        if(!username){

            showMessage(
                "Kullanıcı adı bulunamadı. Önceki sayfaya dön.",
                ""
            );

            return;
        }


        /* -----------------------------
           E-POSTA
        ----------------------------- */

        if(!email){

            showMessage(
                "E-posta adresi bulunamadı. Önceki kayıt adımına dön.",
                ""
            );

            return;
        }


        /* -----------------------------
           ŞİFRE
        ----------------------------- */

        if(!password){

            showMessage(
                "Lütfen bir şifre oluştur.",
                ""
            );

            passwordInput.focus();

            return;
        }


        if(password.length < 6){

            showMessage(
                "Şifren en az 6 karakter olmalı.",
                ""
            );

            passwordInput.focus();

            return;
        }


        /* -----------------------------
           BUTONU KİLİTLE
        ----------------------------- */

        nextButton.disabled =
            true;

        nextButton.textContent =
            "Kayıt oluşturuluyor...";


        showMessage(
            "Hesabın oluşturuluyor...",
            "loading"
        );


        try{

            /* =========================
               FIREBASE AUTH
            ========================= */

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            /* =========================
               REALTIME DATABASE
            ========================= */

            await set(
                ref(
                    database,
                    "users/" + user.uid
                ),
                {

                    uid:
                        user.uid,

                    username:
                        username,

                    email:
                        email,

                    createdAt:
                        Date.now()

                }
            );


            /* =========================
               SESSION
            ========================= */

            sessionStorage.setItem(
                "minegram_register_username",
                username
            );

            sessionStorage.setItem(
                "minegram_register_email",
                email
            );

            sessionStorage.setItem(
                "minegram_uid",
                user.uid
            );


            /* =========================
               BAŞARILI
            ========================= */

            showMessage(
                "Hesabın başarıyla oluşturuldu.",
                "success"
            );


            nextButton.textContent =
                "Tamamlandı";


            /*
             * Burada kayıt tamamlandı.
             *
             * Şimdilik index.html'e gönderiyoruz.
             *
             * Eğer sende başka bir ana sayfa
             * varsa burayı değiştirebiliriz.
             */

            setTimeout(
                function(){

                    window.location.href =
                        "./index.html";

                },
                800
            );


        }
        catch(error){

            console.error(
                "[MINEGRAM FIREBASE REGISTER]",
                error
            );


            showMessage(
                firebaseError(error),
                ""
            );


            nextButton.disabled =
                false;

            nextButton.textContent =
                "İleri";

        }

    }
);


/* =========================================
   SAYFA AÇILIŞI
========================================= */

const username =
    getUsername();


if(username){

    console.log(
        "[MINEGRAM] Kullanıcı adı:",
        username
    );

}


const email =
    getEmail();


if(email){

    console.log(
        "[MINEGRAM] E-posta:",
        email
    );

}

</script>

</body>

</html>
