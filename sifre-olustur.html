<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>Şifre oluştur - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

.topbar{
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:25px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:34px;
    cursor:pointer;
}

.top-title{
    margin-left:15px;
    font-size:20px;
    font-weight:700;
}

.content{
    width:317px;
    margin:115px auto 0;
}

.title{
    text-align:center;
    font-size:30px;
    font-weight:700;
    margin:0 0 34px;
}

.description{
    font-size:18px;
    line-height:1.45;
    color:#bdbdbd;
    margin:0 0 65px;
}

.password-box{
    position:relative;
    width:100%;
}

.password{
    display:block;
    width:100%;
    height:39px;
    padding:0 42px 0 10px;
    border:1px solid #252525;
    border-radius:6px;
    background:#050505;
    color:#fff;
    outline:none;
    font-size:12px;
}

.password::placeholder{
    color:#777;
}

.password:focus{
    border-color:#555;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#888;
    font-size:11px;
    cursor:pointer;
}

.message{
    min-height:18px;
    margin-top:12px;
    text-align:center;
    font-size:11px;
    line-height:1.4;
    color:#ff5c5c;
}

.message.success{
    color:#55b8ff;
}

.next-button{
    display:block;
    width:317px;
    height:37px;
    margin:28px auto 0;
    border:0;
    border-radius:22px;
    background:#2677b5;
    color:#000;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.next-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

@media(max-width:600px){

    .topbar{
        height:70px;
        padding-left:28px;
    }

    .back{
        width:30px;
        height:38px;
        font-size:38px;
    }

    .top-title{
        margin-left:12px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 40px);
        max-width:714px;
        margin:105px auto 0;
    }

    .title{
        font-size:42px;
    }

    .description{
        font-size:21px;
        margin-bottom:55px;
    }

    .password{
        height:68px;
        padding:0 55px 0 20px;
        font-size:18px;
        border:2px solid #686868;
        border-radius:9px;
    }

    .show-password{
        right:17px;
        font-size:14px;
    }

    .message{
        font-size:14px;
    }

    .next-button{
        width:100%;
        height:58px;
        margin:25px auto 30px;
        font-size:20px;
        border-radius:32px;
    }
}

@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        margin-top:65px;
    }

    .title{
        font-size:38px;
    }

    .description{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="topbar">

        <div
            class="back"
            id="topBack"
        >‹</div>

        <div class="top-title">
            Kayıt ol
        </div>

    </div>


    <main class="content">

        <h1 class="title">
            Şifre oluştur
        </h1>

        <p class="description">
            Hesabını korumak için güçlü bir şifre oluştur.
        </p>

        <div class="password-box">

            <input
                id="password"
                class="password"
                type="password"
                placeholder="Şifre"
                autocomplete="new-password"
                maxlength="128"
            >

            <button
                type="button"
                id="showPassword"
                class="show-password"
            >
                Göster
            </button>

        </div>

        <div
            id="message"
            class="message"
        ></div>

        <button
            type="button"
            id="nextButton"
            class="next-button"
        >
            Hesap Oluştur
        </button>

    </main>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  sendEmailVerification,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {
  apiKey: "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",
  authDomain: "mim-ea133.firebaseapp.com",
  databaseURL: "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mim-ea133",
  storageBucket: "mim-ea133.firebasestorage.app",
  messagingSenderId: "303525353436",
  appId: "1:303525353436:web:082fc090b5025e19942119",
  measurementId: "G-K962QE5P1R"
};

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =========================================
   ELEMENTLER
========================================= */

const passwordInput =
    document.getElementById("password");

const nextButton =
    document.getElementById("nextButton");

const message =
    document.getElementById("message");

const showPassword =
    document.getElementById("showPassword");

const topBack =
    document.getElementById("topBack");


/* =========================================
   E-POSTA
========================================= */

const email =
    (
        sessionStorage.getItem(
            "minegram_register_email"
        ) || ""
    )
    .trim()
    .toLowerCase();


/* =========================================
   MESAJ
========================================= */

function showMessage(
    text,
    success=false
){

    message.textContent =
        text || "";

    message.className =
        "message";

    if(success){

        message.classList.add(
            "success"
        );

    }

}


/* =========================================
   FIREBASE HATALARI
========================================= */

function firebaseError(error){

    switch(error.code){

        case "auth/email-already-in-use":
            return "Bu e-posta adresi zaten kayıtlı. Giriş yap veya Şifremi unuttum seçeneğini kullan.";

        case "auth/invalid-email":
            return "Geçerli bir e-posta adresi gir.";

        case "auth/weak-password":
            return "Şifre en az 6 karakter olmalı.";

        case "auth/operation-not-allowed":
            return "Firebase'de E-posta/Şifre girişi etkin değil.";

        case "auth/network-request-failed":
            return "İnternet bağlantısını kontrol et.";

        case "auth/too-many-requests":
            return "Çok fazla deneme yapıldı. Biraz sonra tekrar dene.";

        default:
            return error.message ||
                "Hesap oluşturulamadı.";
    }

}


/* =========================================
   E-POSTA YOKSA GERİ
========================================= */

if(!email){

    showMessage(
        "E-posta adresi bulunamadı. Kayıt işlemine yeniden başla."
    );

    nextButton.disabled = true;

}


/* =========================================
   ŞİFRE GÖSTER
========================================= */

showPassword.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type === "password"
        ){

            passwordInput.type = "text";
            showPassword.textContent = "Gizle";

        }else{

            passwordInput.type = "password";
            showPassword.textContent = "Göster";

        }

    }
);


/* =========================================
   GERİ
========================================= */

topBack.addEventListener(
    "click",
    function(){

        window.location.href =
            "kayit.html";

    }
);


/* =========================================
   HESAP OLUŞTUR
========================================= */

async function createAccount(){

    const password =
        passwordInput.value;


    showMessage("");


    if(!email){

        showMessage(
            "E-posta adresi bulunamadı."
        );

        return;
    }


    if(!password){

        showMessage(
            "Lütfen bir şifre oluştur."
        );

        passwordInput.focus();

        return;
    }


    if(password.length < 6){

        showMessage(
            "Şifren en az 6 karakter olmalı."
        );

        passwordInput.focus();

        return;
    }


    nextButton.disabled = true;

    nextButton.textContent =
        "Hesap oluşturuluyor...";


    try{

        /*
         * FIREBASE HESABI
         */

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            credential.user;


        /*
         * DOĞRULAMA E-POSTASI
         */

        await sendEmailVerification(user);


        /*
         * ŞİFREYİ HİÇBİR YERE KAYDETMİYORUZ.
         */

        sessionStorage.removeItem(
            "minegram_register_email"
        );


        /*
         * HESAP OLUŞTU.
         * DOĞRULAMA YAPILANA KADAR ÇIKIŞ.
         */

        await signOut(auth);


        showMessage(
            "Hesabın oluşturuldu. E-posta adresine doğrulama bağlantısı gönderildi. Giriş yapmadan önce e-postanı doğrula.",
            true
        );


        nextButton.textContent =
            "Giriş Sayfasına Git";


        nextButton.disabled = false;


        nextButton.onclick =
            function(){

                window.location.href =
                    "giris.html";

            };


    }catch(error){

        console.error(
            "[MINEGRAM FIREBASE REGISTER]",
            error
        );


        showMessage(
            firebaseError(error)
        );


        nextButton.disabled = false;

        nextButton.textContent =
            "Hesap Oluştur";

    }

}


/* =========================================
   BUTON
========================================= */

nextButton.addEventListener(
    "click",
    createAccount
);


/* =========================================
   ENTER
========================================= */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            createAccount();

        }

    }
);

</script>

</body>
</html>
