<!DOCTYPE html>

<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kayıt ol - Minegram</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

/* =========================
   ÜST BAR
========================= */

.topbar{
    width:100%;
    height:60px;

    display:flex;
    align-items:center;

    padding-left:38px;
}

.back{
    width:25px;
    height:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:34px;
    font-weight:300;

    line-height:1;

    cursor:pointer;
    user-select:none;
}

.top-title{
    margin-left:15px;

    font-size:20px;
    font-weight:700;

    color:#fff;
}

/* =========================
   ANA İÇERİK
========================= */

.content{
    width:317px;

    margin:115px auto 0;
}

/* =========================
   BAŞLIK
========================= */

.title{
    text-align:center;

    font-size:30px;
    line-height:1.15;

    font-weight:700;

    margin:0 0 34px;

    color:#fff;
}

/* =========================
   AÇIKLAMA
========================= */

.description{
    font-size:18px;
    line-height:1.45;

    color:#bdbdbd;

    margin:0 0 65px;
}

/* =========================
   ŞİFRE INPUT
========================= */

.password{
    display:block;

    width:100%;
    height:39px;

    padding:0 10px;

    border:1px solid #252525;
    border-radius:6px;

    background:#050505;

    color:#fff;

    outline:none;

    font-size:12px;

    font-family:Arial,Helvetica,sans-serif;
}

.password::placeholder{
    color:#777;
    opacity:1;
}

.password:focus{
    border-color:#555;
}

/* =========================
   ALT BUTONLAR
========================= */

.bottom{
    width:317px;

    margin:18px auto 0;

    display:flex;

    gap:10px;
}

button{
    height:37px;

    border-radius:22px;

    font-size:12px;

    font-weight:700;

    cursor:pointer;
}

.back-btn{
    width:50%;

    background:#000;

    border:1px solid #888;

    color:#62b0ed;
}

.next-btn{
    width:50%;

    background:#62b0ed;

    border:1px solid #62b0ed;

    color:#30207c;
}

button:active{
    transform:scale(.99);
}

/* =========================
   MOBİL
========================= */

@media(max-width:600px){

    .topbar{
        height:70px;

        padding-left:28px;
    }

    .back{
        width:30px;
        height:38px;

        font-size:38px;
    }

    .top-title{
        margin-left:12px;

        font-size:21px;
    }

    .content{
        width:calc(100% - 40px);
        max-width:500px;

        margin:65px auto 0;
    }

    .title{
        font-size:38px;

        margin-bottom:30px;
    }

    .description{
        font-size:20px;

        line-height:1.5;

        margin-bottom:55px;
    }

    .password{
        width:100%;

        height:68px;

        padding:0 20px;

        font-size:18px;

        border:2px solid #686868;

        border-radius:9px;
    }

    .bottom{
        width:calc(100% - 40px);
        max-width:500px;

        margin:18px auto 30px;

        gap:10px;
    }

    button{
        height:58px;

        font-size:18px;

        border-radius:32px;
    }

}

/* =========================
   KÜÇÜK TELEFON
========================= */

@media(max-width:430px){

    .content{
        width:calc(100% - 40px);

        margin-top:65px;
    }

    .title{
        font-size:34px;
    }

    .description{
        font-size:18px;
    }

    .password{
        height:60px;

        font-size:17px;
    }

    .bottom{
        width:calc(100% - 40px);

        gap:8px;
    }

    button{
        height:54px;

        font-size:17px;
    }

}

</style>

</head>

<body>

<div class="page">

<!-- ÜST -->

<div class="topbar">

    <div
        class="back"
        onclick="history.back()"
        aria-label="Geri"
    >
        ‹
    </div>

    <div class="top-title">
        Kayıt ol
    </div>

</div>


<!-- İÇERİK -->

<main class="content">

    <h1 class="title">
        Şifre oluştur
    </h1>

    <p class="description">
        Hesabını korumak için güçlü bir şifre oluştur.
    </p>

    <input
        id="password"
        class="password"
        type="password"
        placeholder="Şifre"
        autocomplete="new-password"
    >

</main>


<!-- BUTONLAR -->

<div class="bottom">

    <button
        type="button"
        class="back-btn"
        onclick="history.back()"
    >
        Geri
    </button>

    <button
        type="button"
        class="next-btn"
        onclick="goNext()"
    >
        İleri
    </button>

</div>

</div>

<script>

"use strict";


function goNext(){

    const password =
        document.getElementById("password").value.trim();


    if(password.length < 6){

        alert("Şifren en az 6 karakter olmalı.");

        return;
    }


    /*
     * Kullanıcı adını koru
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const username =
        params.get("username") ||
        sessionStorage.getItem(
            "minegram_register_username"
        );


    if(username){

        sessionStorage.setItem(
            "minegram_register_username",
            username
        );

    }


    /*
     * Şimdilik sonraki kayıt adımına
     * burada geçiş yapılacak.
     */

    console.log(
        "Kullanıcı adı:",
        username
    );

    console.log(
        "Şifre girildi."
    );

}

</script>

</body>
</html>
