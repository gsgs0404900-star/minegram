<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Þifre oluþtur</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
.page{width:100%;height:100dvh;min-height:100vh;background:#000;position:relative}
.header{height:82px;display:flex;align-items:center;padding:0 48px}
.back{color:#fff;font-size:55px;line-height:1;font-weight:300;margin-right:27px;margin-top:-7px}
.header-title{font-size:29px;font-weight:700}
.content{position:absolute;left:7.2%;right:7.2%;top:17.2%}
.title{text-align:center;font-size:47px;line-height:1.15;font-weight:800;margin:0 0 34px}
.text{color:#b9b9b9;font-size:31px;line-height:1.55;margin:0 0 69px}
.password{width:100%;height:119px;background:#111;border:2px solid #666;border-radius:10px;color:#fff;outline:none;padding:0 32px;font-size:31px}
.password::placeholder{color:#b8b8b8;opacity:1}
.bottom{position:absolute;left:7.2%;right:7.2%;bottom:6.1%;display:flex;gap:22px}
button{height:88px;border-radius:50px;font-size:27px;font-weight:800}
.back-btn{width:50%;background:#000;border:2px solid #888;color:#62b0ed}
.next-btn{width:50%;background:#62b0ed;border:2px solid #62b0ed;color:#30207c}
@media(max-width:600px){
.header{height:72px;padding:0 19px}
.back{font-size:43px;margin-right:17px}
.header-title{font-size:23px}
.content{left:7.2%;right:7.2%;top:16.5%}
.title{font-size:34px;margin-bottom:27px}
.text{font-size:22px;line-height:1.55;margin-bottom:47px}
.password{height:82px;padding:0 22px;font-size:24px;border-radius:9px}
.bottom{left:7.2%;right:7.2%;bottom:5.8%;gap:20px}
button{height:72px;font-size:21px}
}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="back">‹</div>
    <div class="header-title">Kayýt ol</div>
  </div>

  <div class="content">
    <h1 class="title">Þifre oluþtur</h1>
    <p class="text">Hesabýný korumak için güçlü bir þifre<br>oluþtur.</p>
    <input class="password" type="password" placeholder="Þifre" autocomplete="new-password">
  </div>

  <div class="bottom">
    <button class="back-btn">Geri</button>
    <button class="next-btn">Ýleri</button>
  </div>
</div>
</body>
</html>
