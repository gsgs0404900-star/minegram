<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesajlar</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#000;
color:#fff;
}

header{
display:flex;
align-items:center;
padding:18px;
font-size:30px;
font-weight:bold;
gap:20px;
border-bottom:1px solid #222;
}

header i{
font-size:28px;
cursor:pointer;
}

.search{
margin:20px;
background:#111;
border:1px solid #444;
border-radius:18px;
display:flex;
align-items:center;
padding:15px;
}

.search input{
background:transparent;
border:none;
outline:none;
color:#fff;
width:100%;
font-size:20px;
margin-left:15px;
}

.section-title{
font-size:22px;
font-weight:bold;
margin:0 20px 20px;
}

.notes{
display:flex;
overflow-x:auto;
padding:0 20px 20px;
gap:18px;
}

.notes::-webkit-scrollbar{
display:none;
}

.note{
min-width:95px;
text-align:center;
}

.bubble{
background:#111827;
color:#fff;
padding:10px;
border-radius:18px;
font-size:13px;
margin-bottom:10px;
height:58px;
display:flex;
align-items:center;
justify-content:center;
}

.avatar{
width:72px;
height:72px;
border-radius:50%;
background:#61AFFF;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold;
margin:auto;
position:relative;
}

.plus{
position:absolute;
right:-3px;
bottom:-3px;
width:28px;
height:28px;
background:#2196F3;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
border:3px solid #000;
}

.name{
margin-top:10px;
font-size:18px;
}

.messages{
margin-top:10px;
border-top:1px solid #222;
padding-top:20px;
}

.chat{
display:flex;
align-items:center;
padding:20px;
cursor:pointer;
}

.chat:hover{
background:#111;
}

.chat img{
width:70px;
height:70px;
border-radius:50%;
}

.chat-avatar{
width:70px;
height:70px;
border-radius:50%;
background:#61AFFF;
margin-right:15px;
}

.chat-info{
flex:1;
}

.username{
font-size:25px;
font-weight:bold;
display:flex;
align-items:center;
gap:8px;
}

.username i{
color:#1da1f2;
font-size:20px;
}

.last{
color:#bbb;
font-size:21px;
margin-top:5px;
}

.arrow{
font-size:28px;
}

</style>

</head>

<body>

<header>

<i class="fa-solid fa-arrow-left"></i>

<span>Mesajlar</span>

</header>

<div class="search">

<i class="fa fa-search"></i>

<input placeholder="Kişileri ara...">

</div>

<div class="section-title">

Notlar

</div>

<div class="notes">

<div class="note">

<div class="bubble"></div>

<div class="avatar">

N

<div class="plus">

+

</div>

</div>

<div class="name">

Notun

</div>

</div>

<div class="note">

<div class="bubble">

Bugün güzel bir gün ☀

</div>

<div class="avatar">

A

</div>

<div class="name">

ahmet

</div>

</div>

<div class="note">

<div class="bubble">

Biraz müzik 🎵

</div>

<div class="avatar">

M

</div>

<div class="name">

mehmet

</div>

</div>

<div class="note">

<div class="bubble">

Maç günü!

</div>

<div class="avatar">

G

</div>

<div class="name">

galatasaray

</div>

</div>

</div>

<div class="messages">

<div class="section-title">

Mesajlar

</div>

<div class="chat">

<div class="chat-avatar"></div>

<div class="chat-info">

<div class="username">

test

<i class="fa-solid fa-circle-check"></i>

</div>

<div class="last">

Mesaj göndermek için dokun

</div>

</div>

<div class="arrow">

❯

</div>

</div>

</div>

</body>

</html>
