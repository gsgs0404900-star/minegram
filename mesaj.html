<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Minegram Chat</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
background:#000;
color:#fff;
}

.app{
width:100%;
max-width:430px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
background:#000;
}

.topbar{
height:65px;
display:flex;
align-items:center;
padding:0 15px;
border-bottom:1px solid #262626;
}

.back{
color:#fff;
font-size:22px;
text-decoration:none;
margin-right:12px;
}

.user{
flex:1;
display:flex;
align-items:center;
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
background:#3797F0;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:18px;
}

.info{
margin-left:10px;
}

.name{
font-size:15px;
font-weight:600;
}

.profile{
font-size:12px;
color:#999;
margin-top:2px;
}

.actions{
display:flex;
gap:18px;
font-size:20px;
}

.chat-area{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
display:flex;
}

.message.sent{
justify-content:flex-end;
}

.message.received{
justify-content:flex-start;
}

.bubble{
max-width:75%;
padding:10px 14px;
border-radius:22px;
font-size:15px;
word-break:break-word;
}

.sent .bubble{
background:#3797F0;
color:#fff;
}

.received .bubble{
background:#262626;
color:#fff;
}

.input-bar{
height:60px;
display:flex;
align-items:center;
gap:10px;
padding:0 15px;
border-top:1px solid #262626;
}

.input-bar input{
flex:1;
background:#111;
border:1px solid #333;
border-radius:25px;
padding:10px 15px;
color:#fff;
outline:none;
font-size:15px;
}

.input-bar i{
font-size:22px;
color:#fff;
cursor:pointer;
}

#sendBtn{
background:none;
border:none;
color:#3797F0;
font-size:22px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="app">

<header class="topbar">

<a href="messages.html" class="back">
<i class="fa-solid fa-arrow-left"></i>
</a>

<div class="user">

<div class="avatar">T</div>

<div class="info">
<div class="name">test</div>
<div class="profile">Çevrimiçi</div>
</div>

</div>

<div class="actions">
<i class="fa-solid fa-phone"></i>
<i class="fa-solid fa-video"></i>
<i class="fa-solid fa-ellipsis-vertical"></i>
</div>

</header>

<div id="chatArea" class="chat-area">

</div>

<div class="input-bar">

<i class="fa-regular fa-face-smile"></i>

<input
id="messageInput"
type="text"
placeholder="Mesaj">

<button id="sendBtn">
<i class="fa-solid fa-paper-plane"></i>
</button>

</div>

</div>

<script type="module">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",
  authDomain: "mim-ea133.firebaseapp.com",
  databaseURL: "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mim-ea133",
  storageBucket: "mim-ea133.firebasestorage.app",
  messagingSenderId: "303525353436",
  appId: "1:303525353436:web:082fc090b5025e19942119"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

if (!localStorage.getItem("username")) {
  const username = prompt("Kullanıcı adın:");
  localStorage.setItem("username", username);
}

const myUsername = localStorage.getItem("username");

const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const chatArea = document.getElementById("chatArea");

function addMessage(text, mine) {
  const div = document.createElement("div");
  div.className = mine ? "message sent" : "message received";
  div.innerHTML = `<div class="bubble">${text}</div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

sendBtn.onclick = () => {
  const text = input.value.trim();
  if (!text) return;

  push(ref(db, "messages"), {
    text: text,
    sender: myUsername,
    time: Date.now()
  });

  input.value = "";
};

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    sendBtn.click();
  }
});

onChildAdded(ref(db, "messages"), (snapshot) => {
  const data = snapshot.val();
  addMessage(data.text, data.sender === myUsername);
});
</script>

</body>
</html>
