<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesajlar</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

html,body{
width:100%;
height:100%;
background:#000;
}

.chat{
display:flex;
align-items:center;
padding:12px 16px;
text-decoration:none;
color:#fff;
cursor:pointer;
}

.chat:hover{
background:#111;
}
    
body{
display:flex;
justify-content:center;
background:#000;
}

.app{
width:100%;
max-width:430px;
min-height:100vh;
background:#000;
color:#fff;
}

@media(min-width:768px){

body{
padding:20px 0;
}

.app{
border-left:1px solid #262626;
border-right:1px solid #262626;
box-shadow:0 0 30px rgba(0,0,0,.5);
}

header{
display:flex;
align-items:center;
height:56px;
padding:0 16px;
gap:14px;
font-size:20px;
font-weight:700;
border-bottom:1px solid #262626;
}

header i{
font-size:20px;
cursor:pointer;
}

.search{
margin:12px 16px;
height:40px;
background:#262626;
border-radius:10px;
display:flex;
align-items:center;
padding:0 14px;
}

.search i{
color:#8e8e8e;
font-size:14px;
}

.search input{
flex:1;
margin-left:10px;
background:transparent;
border:none;
outline:none;
color:#fff;
font-size:14px;
}

.search input::placeholder{
color:#8e8e8e;
}

.section-title{
font-size:16px;
font-weight:700;
margin:0 16px 14px;
}

.notes{
display:flex;
overflow-x:auto;
gap:14px;
padding:0 16px 16px;
scrollbar-width:none;
}

.notes::-webkit-scrollbar{
display:none;
}

.note{
min-width:72px;
text-align:center;
}

.bubble{
height:40px;
background:#111827;
border-radius:12px;
padding:6px;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
margin-bottom:8px;
white-space:nowrap;
}

.avatar{
width:56px;
height:56px;
border-radius:50%;
background:#61AFFF;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
margin:auto;
position:relative;
}

.plus{
position:absolute;
right:-2px;
bottom:-2px;
width:20px;
height:20px;
border-radius:50%;
background:#0095f6;
border:2px solid #000;
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
}

.name{
margin-top:6px;
font-size:12px;
}

.messages{
margin-top:6px;
border-top:1px solid #262626;
padding-top:8px;
}

.chat{
display:flex;
align-items:center;
padding:12px 16px;
}

.chat-avatar{
width:56px;
height:56px;
border-radius:50%;
background:#61AFFF;
margin-right:12px;
flex-shrink:0;
}

.chat-info{
flex:1;
}

.username{
display:flex;
align-items:center;
gap:5px;
font-size:15px;
font-weight:600;
}

.username i{
color:#0095f6;
font-size:13px;
}

.last{
margin-top:2px;
font-size:13px;
color:#8e8e8e;
}

.arrow{
font-size:18px;
color:#8e8e8e;
}

.back-btn,
.back-btn:link,
.back-btn:visited,
.back-btn:hover,
.back-btn:active{
display:flex;
align-items:center;
justify-content:center;
width:28px;
height:28px;
text-decoration:none;
color:#fff;
}

.back-btn i{
font-size:20px;
color:#fff;
}
    
</style>

</head>

<body>

<div class="app">

<header>

<a href="index.html" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i>
</a>

<span>Mesajlar</span>

</header>

<div class="search">
<i class="fa-solid fa-magnifying-glass"></i>
<input type="text" placeholder="Kişileri ara...">
</div>

<div class="section-title">Notlar</div>

<div class="notes">

<div class="note">
<div class="bubble"></div>
<div class="avatar">N<div class="plus">+</div></div>
<div class="name">Notun</div>
</div>

<div class="note">
<div class="bubble">Bugün güzel bir gün ☀</div>
<div class="avatar">A</div>
<div class="name">ahmet</div>
</div>

<div class="note">
<div class="bubble">Biraz müzik 🎵</div>
<div class="avatar">M</div>
<div class="name">mehmet</div>
</div>

<div class="note">
<div class="bubble">Maç günü!</div>
<div class="avatar">G</div>
<div class="name">galatasaray</div>
</div>

</div>

<div class="messages">

<div class="section-title">Mesajlar</div>

<a href="chat.html" class="chat">

<div class="chat-avatar"></div>

<div class="chat-info">
<div class="username">
test
<i class="fa-solid fa-circle-check"></i>
</div>

<div class="last">
Mesaj göndermek için dokun
</div>
</div>

<div class="arrow">
<i class="fa-solid fa-chevron-right"></i>
</div>

</a>

</div>

</div>

</body>
</html>
