/* =========================
   ÜST BAR

.info{

.verified{

.actions{

.action-btn{

/* =========================
   PROFİL
========================= */

}

/* =========================
   MESAJ ALANI
========================= */

.chat-area{

}

.chat-area::-webkit-scrollbar{
    width:0;

}

.message{
    display:flex;
    width:100%;
}

.message.sent{
    justify-content:flex-end;
}

.message.received{

}

.bubble{

.sent .bubble{

}

.received .bubble{

}

.typing-dot:nth-child(2){

.typing-dot:nth-child(3){

@keyframes typing{

<script type="module">

/* ============================================================
   FIREBASE
============================================================ */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set,
    onChildAdded,
    onValue,
    remove,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

import {
    getStorage,
    storageRef,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";


const firebaseConfig = {

    apiKey: "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain: "mim-ea133.firebaseapp.com",

    databaseURL:
        "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId: "mim-ea133",

    storageBucket:
        "mim-ea133.firebasestorage.app",

    messagingSenderId:
        "303525353436",

    appId:
        "1:303525353436:web:082fc090b5025e19942119"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const storage = getStorage(app);


/* ============================================================
   KULLANICI
============================================================ */

let myUsername =
    localStorage.getItem("username");

if(!myUsername){

    myUsername =
        prompt("Kullanıcı adın:");

    myUsername =
        String(myUsername || "misafir")
        .trim()
        .toLowerCase();

    localStorage.setItem(
        "username",
        myUsername
    );
}


/*
   Karşı taraf.

   Şimdilik test.

   İleride mesaj sayfasından:

   mesaj.html?user=ahmet

   şeklinde açarsan otomatik olarak ahmet'i alır.
*/

const urlParams =
    new URLSearchParams(
        window.location.search
    );

let otherUsername =
    urlParams.get("user") || "test";

otherUsername =
    String(otherUsername)
    .trim()
    .toLowerCase();


/* ============================================================
   CONVERSATION ID
============================================================ */

function makeConversationId(a,b){

    const users = [
        String(a),
        String(b)
    ].sort();

    return (
        users[0]
        .replace(/[.#$[\]/]/g,"_")
        +
        "__" +
        users[1]
        .replace(/[.#$[\]/]/g,"_")
    );
}


const conversationId =
    makeConversationId(
        myUsername,
        otherUsername
    );


const messagesRef =
    ref(
        db,
        "conversations/" +
        conversationId +
        "/messages"
    );


/* ============================================================
   ELEMENTLER
============================================================ */

const input =
    document.getElementById(
        "messageInput"
    );

const sendBtn =
    document.getElementById(
        "sendBtn"
    );

const chatArea =
    document.getElementById(
        "chatArea"
    );

const toast =
    document.getElementById(
        "toast"
    );

const menu =
    document.getElementById(
        "menu"
    );

const emojiPanel =
    document.getElementById(
        "emojiPanel"
    );

const typingBox =
    document.getElementById(
        "typing"
    );

const progress =
    document.getElementById(
        "progress"
    );

const loading =
    document.getElementById(
        "loading"
    );


/* ============================================================
   PROFİL BİLGİSİ
============================================================ */

document.getElementById(
    "userName"
).textContent = otherUsername;

const firstLetter =
    otherUsername
    .charAt(0)
    .toUpperCase();

document.getElementById(
    "smallAvatar"
).textContent = firstLetter;

document.getElementById(
    "largeAvatar"
).textContent = firstLetter;


/* ============================================================
   TOAST
============================================================ */

function showToast(text){

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        },1800);
}


/* ============================================================
   HTML GÜVENLİĞİ
============================================================ */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent =
        String(text || "");

    return div.innerHTML;
}


/* ============================================================
   SAAT
============================================================ */

function formatTime(timestamp){

    let date;

    if(
        timestamp &&
        typeof timestamp === "number"
    ){

        date =
            new Date(timestamp);

    }else{

        date =
            new Date();

    }

    return date.toLocaleTimeString(
        "tr-TR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* ============================================================
   MESAJ GÖRÜNTÜLE
============================================================ */

function addMessage(data,key){

    if(!data){
        return;
    }

    /*
       Aynı mesajın iki kere görünmesini önler.
    */

    if(
        document.querySelector(
            `[data-message-id="${key}"]`
        )
    ){
        return;
    }


    const mine =
        data.sender === myUsername;


    const wrapper =
        document.createElement("div");

    wrapper.className =
        mine
        ? "message sent"
        : "message received";

    wrapper.dataset.messageId =
        key;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    /* =========================
       RESİM
    ========================= */

    if(data.type === "image"){

        bubble.classList.add(
            "media-message"
        );

        const img =
            document.createElement("img");

        img.src =
            data.url;

        img.className =
            "media-content";

        img.alt =
            "Gönderilen fotoğraf";

        bubble.appendChild(img);

    }


    /* =========================
       VİDEO
    ========================= */

    else if(data.type === "video"){

        bubble.classList.add(
            "media-message"
        );

        const video =
            document.createElement("video");

        video.src =
            data.url;

        video.className =
            "media-content";

        video.controls = true;

        video.playsInline = true;

        bubble.appendChild(video);

    }


    /* =========================
       SES
    ========================= */

    else if(data.type === "audio"){

        bubble.classList.add(
            "media-message"
        );

        const audio =
            document.createElement("audio");

        audio.src =
            data.url;

        audio.controls = true;

        audio.className =
            "audio-message";

        bubble.appendChild(audio);

    }


    /* =========================
       GIF
    ========================= */

    else if(data.type === "gif"){

        bubble.classList.add(
            "media-message"
        );

        const img =
            document.createElement("img");

        img.src =
            data.url;

        img.className =
            "media-content";

        bubble.appendChild(img);

    }


    /* =========================
       NORMAL MESAJ
    ========================= */

    else{

        const text =
            document.createElement("span");

        text.className =
            "message-text";

        text.innerHTML =
            escapeHtml(
                data.text || ""
            );

        bubble.appendChild(text);

    }


    /* =========================
       SAAT
    ========================= */

    const time =
        document.createElement("span");

    time.className =
        "message-time";

    time.textContent =
        formatTime(
            data.time
        );

    bubble.appendChild(time);


    /* =========================
       OKUNDU
    ========================= */

    if(mine){

        const status =
            document.createElement("span");

        status.className =
            "message-status";

        status.innerHTML =
            data.read
            ? "✓✓"
            : "✓";

        bubble.appendChild(
            status
        );

    }


    wrapper.appendChild(
        bubble
    );

    chatArea.appendChild(
        wrapper
    );

    requestAnimationFrame(() => {

        chatArea.scrollTop =
            chatArea.scrollHeight;

    });


    /*
       Karşıdan gelen mesajı
       otomatik okundu yap.
    */

    if(
        !mine &&
        key
    ){

        set(
            ref(
                db,
                "conversations/" +
                conversationId +
                "/messages/" +
                key +
                "/read"
            ),
            true
        ).catch(
            console.error
        );

    }

}

async function sendMessage(text){

    text =
        String(text || "")
        .trim();

    if(!text){

    if(

        ) === "1"

        showToast(

        );

        return;
    }


    try{

        await push(
            messagesRef,
            {

                type:"text",

                text:text,

                sender:
                    myUsername,

                receiver:
                    otherUsername,

                time:
                    Date.now(),

                read:false

        );


        input.value = "";

        setTyping(false);

        input.focus();


    }catch(error){

        console.error(
            error
        );

        showToast(
            "Mesaj gönderilemedi"
        );

    }

}

async function uploadMedia(file){

    if(!file){
        return;
    }


    const maxSize =
        100 * 1024 * 1024;


    if(file.size > maxSize){

        showToast(
            "Dosya en fazla 100 MB olabilir"
        );

        return;
    }


    try{

        progress.classList.add(
            "show"
        );


        const safeName =
            file.name
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );


        const path =
            "chat_media/" +
            conversationId +
            "/" +
            Date.now() +
            "_" +
            safeName;


        const fileRef =
            storageRef(
                storage,
                path
            );


        await uploadBytes(
            fileRef,
            file
        );


        const url =
            await getDownloadURL(
                fileRef
            );


        let type =
            "file";


        if(
            file.type.startsWith(
                "image/"
            )
        ){

            type =
                "image";

        }
        else if(
            file.type.startsWith(
                "video/"
            )
        ){

            type =
                "video";

        }


        await push(
            messagesRef,
            {

                type:type,

                url:url,

                name:file.name,

                sender:
                    myUsername,

                receiver:
                    otherUsername,

                time:
                    Date.now(),

                read:false

            }
        );


        showToast(
            "Gönderildi"
        );


    }catch(error){

        console.error(
            error
        );

        showToast(
            "Dosya gönderilemedi"
        );

    }finally{

        progress.classList.remove(
            "show"
        );

    }

}

let mediaRecorder =
    null;

let audioChunks =
    [];

let recording =
    false;


async function toggleRecording(){

    if(recording){

        if(mediaRecorder){

            mediaRecorder.stop();

        }

        recording =
            false;

        return;
    }


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        showToast(
            "Mikrofon desteklenmiyor"
        );

        return;
    }


    try{

        const stream =
            await navigator.mediaDevices
            .getUserMedia({
                audio:true
            });


        audioChunks = [];


        mediaRecorder =
            new MediaRecorder(
                stream
            );


        mediaRecorder.ondataavailable =
            (event) => {

                if(
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            async () => {

                stream
                .getTracks()
                .forEach(
                    track =>
                    track.stop()
                );


                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                            "audio/webm"
                        }
                    );


                await uploadAudio(
                    blob
                );

            };


        mediaRecorder.start();

        recording =
            true;

        showToast(
            "Ses kaydediliyor..."
        );


    }catch(error){

        console.error(
            error
        );

        showToast(
            "Mikrofon izni verilmedi"
        );

    }

}


async function uploadAudio(blob){

    try{

        progress.classList.add(
            "show"
        );


        const path =
            "chat_audio/" +
            conversationId +
            "/" +
            Date.now() +
            ".webm";


        const fileRef =
            storageRef(
                storage,
                path
            );


        await uploadBytes(
            fileRef,
            blob
        );


        const url =
            await getDownloadURL(
                fileRef
            );


        await push(
            messagesRef,
            {

                type:"audio",

                url:url,

                sender:
                    myUsername,

                receiver:
                    otherUsername,

                time:
                    Date.now(),

                read:false

            }
        );


        showToast(
            "Sesli mesaj gönderildi"
        );


    }catch(error){

        console.error(
            error
        );

        showToast(
            "Sesli mesaj gönderilemedi"
        );

    }finally{

        progress.classList.remove(
            "show"
        );

    }

}
