<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minegram Mesaj</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:430px;
    height:100dvh;
    min-height:100vh;
    background:#000;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* =========================
   ÜST BAR
========================= */

.topbar{
    height:72px;
    min-height:72px;
    display:flex;
    align-items:center;
    padding:0 14px;
    border-bottom:1px solid #202020;
    background:#000;
    z-index:5;
}

.back{
    width:38px;
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-decoration:none;
    font-size:25px;
    margin-right:3px;
}

.user{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    cursor:pointer;
}

.avatar-small{
    width:45px;
    height:45px;
    min-width:45px;
    border-radius:50%;
    background:#62afea;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:700;
}

.info{
    margin-left:10px;
    min-width:0;
}

.name-row{
    display:flex;
    align-items:center;
    gap:5px;
}

.name{
    font-size:18px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.verified{
    width:23px;
    height:23px;
    border-radius:50%;
    background:#1877f2;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
}

.profile{
    margin-top:2px;
    color:#aaa;
    font-size:14px;
}

.actions{
    display:flex;
    align-items:center;
    gap:18px;
}

.action-btn{
    width:25px;
    height:42px;
    border:0;
    background:transparent;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:21px;
}

.action-btn:active,
.back:active{
    opacity:.5;
}

/* =========================
   PROFİL
========================= */

.profile-card{
    text-align:center;
    padding-top:30px;
    flex:none;
}

.avatar-large{
    width:162px;
    height:162px;
    margin:auto;
    border-radius:50%;
    background:#62afea;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:72px;
    font-weight:700;
}

.profile-link{
    display:inline-block;
    margin-top:45px;
    color:#62afea;
    font-size:19px;
    font-weight:600;
    text-decoration:none;
}

/* =========================
   MESAJLAR
========================= */

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.chat-area::-webkit-scrollbar{
    width:0;
}

.message{
    display:flex;
    width:100%;
}

.message.sent{
    justify-content:flex-end;
}

.message.received{
    justify-content:flex-start;
}

.bubble{
    max-width:76%;
    padding:9px 13px 8px;
    border-radius:23px;
    font-size:18px;
    line-height:23px;
    word-break:break-word;
}

.sent .bubble{
    background:#62afea;
}

.received .bubble{
    background:#262626;
}

.message-time{
    font-size:10px;
    opacity:.65;
    margin-left:6px;
}

/* =========================
   INPUT
========================= */

.input-bar{
    min-height:91px;
    padding:13px 12px calc(13px + env(safe-area-inset-bottom));
    border-top:1px solid #282828;
    background:#000;
    display:flex;
    align-items:center;
    gap:10px;
}

.tool-buttons{
    display:flex;
    align-items:center;
    gap:12px;
}

.tool-btn{
    width:30px;
    height:48px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:25px;
    cursor:pointer;
}

.gif-btn{
    width:37px;
    height:30px;
    border:2px solid #fff;
    border-radius:5px;
    font-size:11px;
    font-weight:bold;
}

.composer{
    height:60px;
    min-width:0;
    flex:1;
    display:flex;
    align-items:center;
    border:2px solid #777;
    border-radius:9px;
    overflow:hidden;
}

#messageInput{
    flex:1;
    min-width:0;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    padding:0 13px;
    font-size:18px;
}

#messageInput::placeholder{
    color:#ddd;
}

#sendBtn{
    width:58px;
    height:100%;
    border:0;
    background:transparent;
    color:#fff;
    font-size:30px;
}

/* =========================
   MENÜ
========================= */

.menu{
    position:absolute;
    top:63px;
    right:10px;
    width:205px;
    background:#171717;
    border:1px solid #333;
    border-radius:12px;
    padding:6px;
    box-shadow:0 10px 30px #000;
    display:none;
    z-index:50;
}

.menu.show{
    display:block;
}

.menu button{
    width:100%;
    height:45px;
    border:0;
    background:transparent;
    color:#fff;
    text-align:left;
    padding:0 12px;
    border-radius:8px;
    font-size:15px;
}

.menu .danger{
    color:#ff4d67;
}

/* =========================
   TOAST
========================= */

.toast{
    position:absolute;
    left:50%;
    bottom:105px;
    transform:translate(-50%,20px);
    background:#242424;
    padding:10px 15px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:100;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   ARAMA EKRANI
========================= */

.call-screen{
    position:absolute;
    inset:0;
    background:#050505;
    z-index:200;
    display:none;
    flex-direction:column;
}

.call-screen.show{
    display:flex;
}

.call-top{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa;
    font-size:14px;
}

.call-user{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:15px;
}

.call-avatar{
    width:125px;
    height:125px;
    border-radius:50%;
    background:#62afea;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    font-weight:bold;
}

.call-name{
    font-size:26px;
    font-weight:700;
}

.call-status{
    color:#aaa;
    font-size:16px;
}

.call-buttons{
    height:160px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:35px;
    padding-bottom:30px;
}

.call-control{
    width:65px;
    height:65px;
    border-radius:50%;
    border:0;
    background:#292929;
    color:#fff;
    font-size:23px;
}

.call-control.active{
    background:#fff;
    color:#000;
}

.call-end{
    background:#ff304f;
}

/* =========================
   GELEN ARAMA
========================= */

.incoming-screen{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.96);
    z-index:300;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.incoming-screen.show{
    display:flex;
}

.incoming-avatar{
    width:130px;
    height:130px;
    border-radius:50%;
    background:#62afea;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
    font-weight:bold;
    margin-bottom:25px;
}

.incoming-title{
    font-size:26px;
    font-weight:700;
}

.incoming-type{
    color:#aaa;
    margin-top:8px;
}

.incoming-buttons{
    display:flex;
    gap:55px;
    margin-top:60px;
}

.incoming-btn{
    width:70px;
    height:70px;
    border-radius:50%;
    border:0;
    color:#fff;
    font-size:27px;
}

.accept-btn{
    background:#22c55e;
}

.reject-btn{
    background:#ff304f;
}

/* =========================
   VIDEO
========================= */

#remoteVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
}

#localVideo{
    position:absolute;
    width:115px;
    height:165px;
    right:15px;
    top:85px;
    object-fit:cover;
    border-radius:14px;
    background:#222;
    border:2px solid #fff;
    z-index:4;
}

/* =========================
   LOADING
========================= */

.loading{
    color:#777;
    text-align:center;
    padding:20px;
}
</style>
</head>

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set,
    get,
    remove,
    onChildAdded,
    onValue
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


const firebaseConfig = {

    apiKey:"AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain:"mim-ea133.firebaseapp.com",

    databaseURL:
    "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:"mim-ea133",

    storageBucket:"mim-ea133.firebasestorage.app",

    messagingSenderId:"303525353436",

    appId:
    "1:303525353436:web:082fc090b5025e19942119"

};


const firebaseApp = initializeApp(firebaseConfig);

const db = getDatabase(firebaseApp);


/* =====================================================
   KULLANICI
===================================================== */

let myUsername =
localStorage.getItem("username");

if(!myUsername){

    myUsername =
    prompt("Kullanıcı adın:") || "misafir";

    localStorage.setItem(
        "username",
        myUsername
    );
}


/* =====================================================
   HEDEF KULLANICI
===================================================== */

const targetUsername = "test";


/* =====================================================
   ELEMENTLER
===================================================== */

const input =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const chatArea =
document.getElementById("chatArea");

const loading =
document.getElementById("loading");

const toast =
document.getElementById("toast");

const menu =
document.getElementById("menu");

const callScreen =
document.getElementById("callScreen");

const incomingScreen =
document.getElementById("incomingScreen");

const callStatus =
document.getElementById("callStatus");

const callTypeText =
document.getElementById("callTypeText");

const incomingName =
document.getElementById("incomingName");

const incomingType =
document.getElementById("incomingType");

const remoteVideo =
document.getElementById("remoteVideo");

const localVideo =
document.getElementById("localVideo");


/* =====================================================
   TOAST
===================================================== */

function showToast(text){

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer =
    setTimeout(()=>{
        toast.classList.remove("show");
    },1800);
}


/* =====================================================
   HTML GÜVENLİĞİ
===================================================== */

function escapeHtml(text){

    const div =
    document.createElement("div");

    div.textContent =
    text;

    return div.innerHTML;
}


/* =====================================================
   SAAT
===================================================== */

function formatTime(time){

    return new Date(
        time || Date.now()
    ).toLocaleTimeString(
        "tr-TR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* =====================================================
   MESAJ EKLE
===================================================== */

function addMessage(data){

    const mine =
    data.sender === myUsername;

    const wrapper =
    document.createElement("div");

    wrapper.className =
    mine
    ? "message sent"
    : "message received";

    const bubble =
    document.createElement("div");

    bubble.className =
    "bubble";

    bubble.innerHTML =
    escapeHtml(
        String(data.text || "")
    ) +
    `<span class="message-time">
        ${formatTime(data.time)}
    </span>`;

    wrapper.appendChild(bubble);

    chatArea.appendChild(wrapper);

    chatArea.scrollTop =
    chatArea.scrollHeight;
}


/* =====================================================
   MESAJ GÖNDER
===================================================== */

async function sendMessage(text){

    text =
    String(text || "").trim();

    if(!text) return;

    try{

        await push(
            ref(db,"messages"),
            {

                text:text,

                sender:myUsername,

                receiver:targetUsername,

                time:Date.now()

            }
        );

        input.value="";

        input.focus();

    }catch(error){

        console.error(error);

        showToast(
            "Mesaj gönderilemedi"
        );
    }
}


sendBtn.onclick =
()=>{
    sendMessage(input.value);
};


input.addEventListener(
"keydown",
event=>{

    if(event.key==="Enter"){

        event.preventDefault();

        sendMessage(input.value);
    }
});


/* =====================================================
   MESAJLARI DİNLE
===================================================== */

onChildAdded(
    ref(db,"messages"),
    snapshot=>{

        const data =
        snapshot.val();

        if(!data) return;

        const valid =
        (
            data.sender === myUsername &&
            data.receiver === targetUsername
        )
        ||
        (
            data.sender === targetUsername &&
            data.receiver === myUsername
        )
        ||
        !data.receiver;

        if(valid){

            loading.style.display =
            "none";

            addMessage(data);
        }

    }
);


/* =====================================================
   WEBRTC
===================================================== */

let peerConnection = null;

let localStream = null;

let currentCallId = null;

let currentCallType = "audio";

let isCaller = false;

let pendingIncomingCall = null;


/* =====================================================
   WEBRTC SERVERS
===================================================== */

const rtcConfig = {

    iceServers:[

        {
            urls:
            "stun:stun.l.google.com:19302"
        },

        {
            urls:
            "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =====================================================
   ARAMA ID
===================================================== */

function createCallId(){

    return (
        myUsername +
        "_" +
        targetUsername +
        "_" +
        Date.now()
    )
    .replace(
        /[^a-zA-Z0-9_-]/g,
        "_"
    );
}


/* =====================================================
   MEDYA İZNİ
===================================================== */

async function getMedia(type){

    try{

        localStream =
        await navigator.mediaDevices
        .getUserMedia({

            audio:true,

            video:
            type === "video"

        });

        localVideo.srcObject =
        localStream;

        if(type !== "video"){

            localVideo.style.display =
            "none";

        }else{

            localVideo.style.display =
            "block";
        }

        return true;

    }catch(error){

        console.error(
            "Media error:",
            error
        );

        showToast(
            "Mikrofon/kamera izni verilmedi"
        );

        return false;
    }
}


/* =====================================================
   PEER CONNECTION
===================================================== */

function createPeer(){

    peerConnection =
    new RTCPeerConnection(
        rtcConfig
    );


    /* LOCAL TRACK */

    if(localStream){

        localStream
        .getTracks()
        .forEach(track=>{

            peerConnection.addTrack(
                track,
                localStream
            );

        });
    }


    /* REMOTE TRACK */

    peerConnection.ontrack =
    event=>{

        if(event.streams &&
           event.streams[0]){

            remoteVideo.srcObject =
            event.streams[0];

        }

    };


    /* ICE */

    peerConnection.onicecandidate =
    async event=>{

        if(!event.candidate ||
           !currentCallId){

            return;
        }

        const candidateRef =
        push(
            ref(
                db,
                "calls/" +
                currentCallId +
                "/candidates"
            )
        );

        await set(
            candidateRef,
            {

                candidate:
                event.candidate.toJSON(),

                from:
                myUsername

            }
        );

    };


    /* CONNECTION STATE */

    peerConnection.onconnectionstatechange =
    ()=>{

        const state =
        peerConnection.connectionState;

        console.log(
            "WebRTC:",
            state
        );

        if(state==="connected"){

            callStatus.textContent =
            "Bağlandı";

        }

        if(
            state==="failed" ||
            state==="disconnected" ||
            state==="closed"
        ){

            if(
                state !== "closed"
            ){

                endCall(false);
            }
        }

    };


    return peerConnection;
}


/* =====================================================
   GİDEN ARAMA
===================================================== */

async function startCall(type){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        showToast(
            "Tarayıcı mikrofon/kamerayı desteklemiyor"
        );

        return;
    }


    currentCallType =
    type;

    isCaller =
    true;


    const mediaOK =
    await getMedia(type);

    if(!mediaOK)
        return;


    currentCallId =
    createCallId();


    callScreen.classList.add(
        "show"
    );

    incomingScreen.classList.remove(
        "show"
    );


    callTypeText.textContent =
    type === "video"
    ? "Görüntülü arama"
    : "Sesli arama";


    callStatus.textContent =
    "Aranıyor...";


    createPeer();


    const callRef =
    ref(
        db,
        "calls/" +
        currentCallId
    );


    const offer =
    await peerConnection
    .createOffer();


    await peerConnection
    .setLocalDescription(
        offer
    );


    await set(
        callRef,
        {

            caller:
            myUsername,

            receiver:
            targetUsername,

            type:type,

            status:"ringing",

            offer:{
                type:
                offer.type,

                sdp:
                offer.sdp
            },

            createdAt:
            Date.now()

        }
    );


    listenForAnswer(
        currentCallId
    );


    showToast(
        "Arama gönderildi"
    );
}


/* =====================================================
   ANSWER DİNLE
===================================================== */

function listenForAnswer(callId){

    const answerRef =
    ref(
        db,
        "calls/" +
        callId +
        "/answer"
    );


    onValue(
        answerRef,
        async snapshot=>{

            const answer =
            snapshot.val();

            if(
                !answer ||
                !peerConnection
            )
                return;


            if(
                peerConnection
                .signalingState ===
                "have-local-offer"
            ){

                try{

                    await peerConnection
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            answer
                        )
                    );

                    callStatus.textContent =
                    "Bağlanıyor...";

                }catch(error){

                    console.error(
                        error
                    );
                }

            }

        }
    );


    listenCandidates(
        callId
    );
}


/* =====================================================
   ICE DİNLE
===================================================== */

function listenCandidates(callId){

    onChildAdded(

        ref(
            db,
            "calls/" +
            callId +
            "/candidates"
        ),

        async snapshot=>{

            const data =
            snapshot.val();

            if(!data ||
               data.from === myUsername)
                return;

            if(
                peerConnection &&
                peerConnection.remoteDescription
            ){

                try{

                    await peerConnection
                    .addIceCandidate(
                        new RTCIceCandidate(
                            data.candidate
                        )
                    );

                }catch(error){

                    console.error(
                        "ICE:",
                        error
                    );
                }
            }

        }
    );
}


/* =====================================================
   GELEN ARAMA DİNLE
===================================================== */

onChildAdded(

    ref(db,"calls"),

    snapshot=>{

        const call =
        snapshot.val();

        if(!call)
            return;


        if(
            call.receiver !== myUsername
        )
            return;


        if(
            call.status !== "ringing"
        )
            return;


        if(
            currentCallId
        )
            return;


        pendingIncomingCall = {
            id:snapshot.key,
            data:call
        };


        currentCallId =
        snapshot.key;

        currentCallType =
        call.type || "audio";


        incomingName.textContent =
        call.caller;


        incomingType.textContent =
        call.type === "video"
        ? "Gelen görüntülü arama"
        : "Gelen sesli arama";


        incomingScreen.classList.add(
            "show"
        );

    }
);


/* =====================================================
   GELEN ARAMAYI KABUL ET
===================================================== */

async function acceptCall(){

    if(
        !pendingIncomingCall
    )
        return;


    const callId =
    pendingIncomingCall.id;

    const call =
    pendingIncomingCall.data;


    isCaller =
    false;


    const mediaOK =
    await getMedia(
        call.type
    );


    if(!mediaOK){

        rejectCall();

        return;
    }


    incomingScreen.classList.remove(
        "show"
    );

    callScreen.classList.add(
        "show"
    );


    callTypeText.textContent =
    call.type === "video"
    ? "Görüntülü arama"
    : "Sesli arama";


    callStatus.textContent =
    "Bağlanıyor...";


    createPeer();


    try{

        await peerConnection
        .setRemoteDescription(
            new RTCSessionDescription(
                call.offer
            )
        );


        const answer =
        await peerConnection
        .createAnswer();


        await peerConnection
        .setLocalDescription(
            answer
        );


        await set(

            ref(
                db,
                "calls/" +
                callId +
                "/answer"
            ),

            {

                type:
                answer.type,

                sdp:
                answer.sdp

            }
        );


        await set(

            ref(
                db,
                "calls/" +
                callId +
                "/status"
            ),

            "accepted"

        );


        listenCandidates(
            callId
        );


        pendingIncomingCall =
        null;


    }catch(error){

        console.error(
            error
        );

        showToast(
            "Arama başlatılamadı"
        );

        endCall();
    }
}


/* =====================================================
   GELEN ARAMAYI REDDET
===================================================== */

async function rejectCall(){

    if(!currentCallId)
        return;


    try{

        await set(

            ref(
                db,
                "calls/" +
                currentCallId +
                "/status"
            ),

            "rejected"

        );

        await remove(

            ref(
                db,
                "calls/" +
                currentCallId
            )

        );

    }catch(error){

        console.error(
            error
        );
    }


    pendingIncomingCall =
    null;

    currentCallId =
    null;

    incomingScreen.classList.remove(
        "show"
    );
}


/* =====================================================
   ARAMAYI KAPAT
===================================================== */

async function endCall(removeFirebase=true){

    if(localStream){

        localStream
        .getTracks()
        .forEach(
            track =>
            track.stop()
        );

        localStream =
        null;
    }


    if(peerConnection){

        try{
            peerConnection.close();
        }catch(e){}

        peerConnection =
        null;
    }


    remoteVideo.srcObject =
    null;

    localVideo.srcObject =
    null;


    callScreen.classList.remove(
        "show"
    );

    incomingScreen.classList.remove(
        "show"
    );


    if(
        removeFirebase &&
        currentCallId
    ){

        try{

            await set(

                ref(
                    db,
                    "calls/" +
                    currentCallId +
                    "/status"
                ),

                "ended"

            );

            setTimeout(
                async()=>{
                    try{

                        await remove(
                            ref(
                                db,
                                "calls/" +
                                currentCallId
                            )
                        );

                    }catch(e){}
                },
                1000
            );

        }catch(error){

            console.error(
                error
            );
        }
    }


    currentCallId =
    null;

    pendingIncomingCall =
    null;

    isCaller =
    false;
}

    const tracks =
    localStream.getAudioTracks();


    tracks.forEach(
        track=>{
            track.enabled =
            !track.enabled;
        }
    );


    const muted =
    !tracks.some(
        track=>track.enabled
    );


    document
    .getElementById(
        "muteCallBtn"
    )
    .classList.toggle(
        "active",
        muted
    );


    showToast(
        muted
        ? "Mikrofon kapalı"
        : "Mikrofon açık"
    );

});

/* =====================================================
   ARAMA DURUMU DİNLE
===================================================== */

onValue(

    ref(db,"calls"),

    snapshot=>{

        const calls =
        snapshot.val();

        if(!calls)
            return;


        Object
        .entries(calls)
        .forEach(
        ([id,call])=>{

            if(
                !call ||
                call.caller !==
                myUsername
            )
                return;


            if(
                id !== currentCallId
            )
                return;


            if(
                call.status ===
                "rejected"
            ){

                showToast(
                    "Arama reddedildi"
                );

                endCall(false);

            }


            if(
                call.status ===
                "ended"
            ){

                endCall(false);

            }

        });

    }
);

/* =====================================================

===================================================== */

document
.getElementById("micBtn")
.addEventListener(
"click",
()=>{

    const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        showToast(
            "Sesli yazma desteklenmiyor"
        );

        return;
    }


    const recognition =
    new SpeechRecognition();


    recognition.lang =
    "tr-TR";

    recognition.interimResults =
    false;


    showToast(
        "Dinliyorum..."
    );


    recognition.onresult =
    event=>{

        input.value =
        event
        .results[0][0]
        .transcript;

        input.focus();

    };


    recognition.onerror =
    ()=>{

        showToast(
            "Ses alınamadı"
        );

    };


    recognition.start();

});
