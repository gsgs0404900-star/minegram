<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesajlar</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{
background:#000;
color:#fff;
max-width:430px;
margin:auto;
min-height:100vh;
}

header{
display:flex;
align-items:center;
height:56px;
padding:0 16px;
gap:14px;
font-size:20px;
font-weight:700;
border-bottom:1px solid #262626;
}

header i{
font-size:20px;
cursor:pointer;
}

.search{
margin:12px 16px;
height:40px;
background:#262626;
border-radius:10px;
display:flex;
align-items:center;
padding:0 14px;
}

.search i{
color:#8e8e8e;
font-size:14px;
}

.search input{
flex:1;
margin-left:10px;
background:transparent;
border:none;
outline:none;
color:#fff;
font-size:14px;
}

.section-title{
font-size:16px;
font-weight:700;
margin:0 16px 14px;
}

.notes{
display:flex;
overflow-x:auto;
gap:14px;
padding:0 16px 16px;
}

.notes::-webkit-scrollbar{
display:none;
}

.note{
min-width:72px;
text-align:center;
}

.bubble{
height:40px;
background:#1f2937;
border-radius:12px;
padding:6px;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
margin-bottom:8px;
}

.avatar{
width:56px;
height:56px;
border-radius:50%;
background:#61AFFF;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
margin:auto;
position:relative;
}

.plus{
position:absolute;
right:-2px;
bottom:-2px;
width:20px;
height:20px;
background:#0095f6;
border:2px solid #000;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
}

.name{
margin-top:6px;
font-size:12px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.messages{
margin-top:6px;
border-top:1px solid #262626;
padding-top:8px;
}

.chat{
display:flex;
align-items:center;
padding:12px 16px;
cursor:pointer;
}

.chat:hover{
background:#111;
}

.chat-avatar,
.chat img{
width:56px;
height:56px;
border-radius:50%;
background:#61AFFF;
margin-right:12px;
flex-shrink:0;
}

.chat-info{
flex:1;
min-width:0;
}

.username{
display:flex;
align-items:center;
gap:5px;
font-size:15px;
font-weight:600;
}

.username i{
font-size:13px;
color:#0095f6;
}

.last{
margin-top:2px;
font-size:13px;
color:#8e8e8e;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.arrow{
font-size:16px;
color:#8e8e8e;
}

/* ==========================
   MASAÜSTÜ (PC)
==========================*/

@media screen and (min-width:768px){

body{
max-width:none;
margin:0;
background:#000;
display:flex;
justify-content:center;
}

.page{
width:100%;
max-width:1280px;
display:flex;
justify-content:center;
}

.dm{
width:420px;
min-height:100vh;
border-left:1px solid #262626;
border-right:1px solid #262626;
background:#000;
}

header{
height:64px;
padding:0 18px;
font-size:22px;
}

header i{
font-size:22px;
}

.search{
height:44px;
margin:16px 18px;
}

.search input{
font-size:15px;
}

.section-title{
font-size:17px;
margin:0 18px 14px;
}

.notes{
padding:0 18px 18px;
}

.note{
min-width:78px;
}

.avatar{
width:60px;
height:60px;
font-size:24px;
}

.plus{
width:22px;
height:22px;
font-size:14px;
}

.chat{
padding:14px 18px;
}

.chat-avatar{
width:60px;
height:60px;
}

.username{
font-size:16px;
}

.last{
font-size:14px;
}

.arrow{
font-size:18px;
}

}

/* ==========================
   TELEFON
==========================*/

@media screen and (max-width:767px){

body{
max-width:430px;
margin:auto;
}

</style>

</head>

<body>

</div>

</div>

<div class="name">

</div>

</div>

</div>

</body>

</html>
