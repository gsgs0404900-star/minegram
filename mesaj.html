<!DOCTYPE html>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

}

html,
body{
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:430px;
    height:100dvh;
    min-height:100vh;
    background:#000;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar{
    height:72px;
    min-height:72px;
    display:flex;
    align-items:center;
    padding:0 14px;
    border-bottom:1px solid #202020;
    background:#000;
    z-index:20;
}

.back{
    width:38px;
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-decoration:none;
    font-size:25px;
    margin-right:3px;
}

.user{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    cursor:pointer;
}

.avatar-small{
    width:45px;
    height:45px;
    min-width:45px;
    border-radius:50%;
    background:#62afea;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:700;
    overflow:hidden;
}

.avatar-small img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.info{
    margin-left:10px;
    min-width:0;
}

.name-row{
    display:flex;
    align-items:center;
    gap:5px;
}

.name{
    font-size:18px;
    line-height:21px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.verified{
    width:23px;
    height:23px;
    border-radius:50%;
    background:#1877f2;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
}

.profile{
    margin-top:2px;
    color:#aaa;
    font-size:14px;
}

.actions{
    display:flex;
    align-items:center;
    gap:17px;
    padding-left:7px;
}

.action-btn{
    width:28px;
    height:42px;
    border:0;
    background:transparent;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:21px;
}

.action-btn:active{
    opacity:.5;
    transform:scale(.9);
}

/* =====================================================
   PROFILE
===================================================== */

.profile-card{
    text-align:center;
    padding-top:30px;
    flex:none;
}

.avatar-large{
    width:162px;
    height:162px;
    margin:0 auto;
    border-radius:50%;
    background:#62afea;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:72px;
    font-weight:700;
    overflow:hidden;
}

.avatar-large img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-link{
    display:inline-block;
    margin-top:45px;
    color:#62afea;
    font-size:19px;
    font-weight:600;
    text-decoration:none;
}

/* =====================================================
   CHAT
===================================================== */

.chat-area{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    padding:14px 14px 18px;
    display:flex;
    flex-direction:column;
    gap:9px;
    scroll-behavior:smooth;
}

.chat-area::-webkit-scrollbar{
    width:0;
}

.message{
    display:flex;
    width:100%;
}

.message.sent{
    justify-content:flex-end;
}

.message.received{
    justify-content:flex-start;
}

.bubble{
    max-width:76%;
    padding:9px 13px 8px;
    border-radius:23px;
    font-size:18px;
    line-height:23px;
    word-break:break-word;
    position:relative;
    min-width:45px;
}

.sent .bubble{
    background:#62afea;
}

.received .bubble{
    background:#262626;
}

.message-text{
    white-space:pre-wrap;
}

.message-time{
    display:inline-block;
    font-size:10px;
    opacity:.65;
    margin-left:7px;
    white-space:nowrap;
}

.message-status{
    font-size:10px;
    margin-left:4px;
}

.media-message{
    padding:5px!important;
    overflow:hidden;
}

.media-content{
    max-width:280px;
    max-height:350px;
    display:block;
    border-radius:18px;
    object-fit:cover;
}

.audio-message{
    width:230px;
    max-width:100%;
}

/* =====================================================
   TYPING
===================================================== */

.typing{
    display:none;
    align-items:center;
    gap:5px;
    color:#aaa;
    font-size:13px;
    padding:0 15px 7px;
}

.typing.show{
    display:flex;
}

.typing-dot{
    width:5px;
    height:5px;
    background:#aaa;
    border-radius:50%;
    animation:typing 1s infinite;
}

.typing-dot:nth-child(2){
    animation-delay:.15s;
}

.typing-dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{

    0%,60%,100%{
        transform:translateY(0);
        opacity:.4;
    }

    30%{
        transform:translateY(-4px);
        opacity:1;
    }
}

/* =====================================================
   INPUT
===================================================== */

.input-bar{
    min-height:91px;
    padding:13px 12px calc(13px + env(safe-area-inset-bottom));
    border-top:1px solid #282828;
    background:#000;
    display:flex;
    align-items:center;
    gap:9px;
    z-index:20;
}

.tool-buttons{
    display:flex;
    align-items:center;
    gap:9px;
    flex:none;
}

.tool-btn{
    width:29px;
    height:48px;
    border:0;
    background:transparent;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    cursor:pointer;
}

.tool-btn:active{
    opacity:.5;
    transform:scale(.93);
}

.gif-btn{
    width:37px;
    height:30px;
    border:2px solid #fff;
    border-radius:5px;
    background:transparent;
    color:#fff;
    font-size:11px;
    font-weight:800;
}

.composer{
    height:60px;
    min-width:0;
    flex:1;
    display:flex;
    align-items:center;
    border:2px solid #777;
    border-radius:9px;
    overflow:hidden;
    background:#050505;
}

#messageInput{
    flex:1;
    min-width:0;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    padding:0 13px;
    font-size:18px;
}

#messageInput::placeholder{
    color:#e5e5e5;
}

#sendBtn{
    width:58px;
    height:100%;
    border:0;
    background:transparent;
    color:#fff;
    font-size:30px;
    cursor:pointer;
}

/* =====================================================
   EMOJI
===================================================== */

.emoji-panel{
    position:absolute;
    bottom:104px;
    left:10px;
    right:10px;
    background:#181818;
    border:1px solid #333;
    border-radius:14px;
    padding:10px;
    display:none;
    grid-template-columns:repeat(8,1fr);
    gap:5px;
    z-index:40;
}

.emoji-panel.show{
    display:grid;
}

.emoji{
    height:38px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:23px;
    border-radius:8px;
    cursor:pointer;
}

/* =====================================================
   MENU
===================================================== */

.menu{
    position:absolute;
    top:63px;
    right:10px;
    width:215px;
    background:#171717;
    border:1px solid #333;
    border-radius:12px;
    padding:6px;
    display:none;
    z-index:50;
    box-shadow:0 10px 30px rgba(0,0,0,.6);
}

.menu.show{
    display:block;
}

.menu button{
    width:100%;
    height:45px;
    border:0;
    background:transparent;
    color:#fff;
    text-align:left;
    padding:0 12px;
    border-radius:8px;
    font-size:15px;
}

.menu button:hover{
    background:#292929;
}

.menu .danger{
    color:#ff4d67;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:absolute;
    left:50%;
    bottom:105px;
    transform:translate(-50%,20px);
    background:#242424;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:.22s;
    z-index:100;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =====================================================
   PROGRESS
===================================================== */

.progress{
    position:absolute;
    top:71px;
    left:0;
    right:0;
    height:2px;
    display:none;
    overflow:hidden;
    z-index:100;
}

.progress.show{
    display:block;
}

.progress div{
    width:35%;
    height:100%;
    background:#62afea;
    animation:progress 1s infinite;
}

@keyframes progress{

    from{
        transform:translateX(-100%);
    }

    to{
        transform:translateX(400%);
    }
}

.reject-btn{

.active-call{

}

.active-call.show{

}

.remote-video{

.call-controls{

.control-button{

.control-button.active{

.end-call{

        document.createElement(
            "div"

function formatTime(time){

    return new Date(
        time || Date.now()
    )
    .toLocaleTimeString(
        "tr-TR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

/* ============================================================
   ADD MESSAGE
============================================================ */

function addMessage(data,key){

    if(!data){
        return;
    }


    if(
        document.querySelector(
            `[data-message-id="${key}"]`
        )
    ){

        return;

    }


    const mine =
        data.sender === myUsername;


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        mine
        ? "message sent"
        : "message received";


    wrapper.dataset.messageId =
        key;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    if(data.type === "image"){

        bubble.classList.add(
            "media-message"
        );


        const img =
            document.createElement(
                "img"
            );


        img.src =
            data.url;


        img.className =
            "media-content";


        bubble.appendChild(
            img
        );

    }

    else if(data.type === "video"){

        bubble.classList.add(
            "media-message"
        );


        const video =
            document.createElement(
                "video"
            );


        video.src =
            data.url;

        video.controls =
            true;

        video.playsInline =
            true;

        video.className =
            "media-content";


        bubble.appendChild(
            video
        );

    }

    else if(data.type === "audio"){

        bubble.classList.add(
            "media-message"
        );


        const audio =
            document.createElement(
                "audio"
            );


        audio.src =
            data.url;

        audio.controls =
            true;

        audio.className =
            "audio-message";


        bubble.appendChild(
            audio
        );

    }

    else if(data.type === "gif"){

        bubble.classList.add(
            "media-message"
        );


        const img =
            document.createElement(
                "img"
            );


        img.src =
            data.url;

        img.className =
            "media-content";


        bubble.appendChild(
            img
        );

    }

    else{

        const text =
            document.createElement(
                "span"
            );


        text.className =
            "message-text";


        text.innerHTML =
            escapeHtml(
                data.text
            );


        bubble.appendChild(
            text
        );

    }


    const time =
        document.createElement(
            "span"
        );


    time.className =
        "message-time";


    time.textContent =
        formatTime(
            data.time
        );


    bubble.appendChild(
        time
    );


    if(mine){

        const status =
            document.createElement(
                "span"
            );


        status.className =
            "message-status";


        status.textContent =
            data.read
            ? "✓✓"
            : "✓";


        bubble.appendChild(
            status
        );

    }


    wrapper.appendChild(
        bubble
    );


    chatArea.appendChild(
        wrapper
    );


    requestAnimationFrame(
        () => {

            chatArea.scrollTop =
                chatArea.scrollHeight;

        }
    );


    if(
        !mine &&
        key
    ){

        set(
            dbRef(
                db,
                "conversations/" +
                chatId +
                "/messages/" +
                key +
                "/read"
            ),
            true
        )
        .catch(
            console.error
        );

    }

}

        String(text || "")
        .trim();


    if(!text){
        return;
    }


    if(
        localStorage.getItem(
            "blocked_" +
            otherUsername
        ) === "1"
    ){

        showToast(
            "Bu kullanıcıyı engelledin"
        );

        return;

    }


    try{

        await push(
            messagesRef,
            {

                type:
                    "text",

                text:
                    text,

                sender:
                    myUsername,

                receiver:
                    otherUsername,

                time:
                    Date.now(),

                read:
                    false

            }
        );


        input.value = "";

        setTyping(

        );

        input.focus();


    }catch(error){

        console.error(
            error
        );

        showToast(
            "Mesaj gönderilemedi"

    }

}

/* ============================================================
   FILE UPLOAD
============================================================ */

async function uploadMedia(file){

    if(!file){
        return;
    }


    if(
        file.size >
        100 * 1024 * 1024
    ){

        showToast(
            "Dosya 100 MB'dan büyük olamaz"
        );

        return;

    }


    try{

        progress.classList.add(
            "show"
        );


        const safeName =
            file.name.replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );


        const path =
            "chat_media/" +
            chatId +
            "/" +
            Date.now() +
            "_" +
            safeName;


        const fileRef =
            storageRef(
                storage,
                path
            );


        await uploadBytes(
            fileRef,
            file
        );


        const url =
            await getDownloadURL(
                fileRef
            );


        let type =
            "file";


        if(
            file.type.startsWith(
                "image/"
            )
        ){

            type =
                "image";

        }

        else if(
            file.type.startsWith(
                "video/"
            )
        ){

            type =
                "video";

        }


        await push(
            messagesRef,
            {

                type:
                    type,

                url:
                    url,

                name:
                    file.name,

                sender:
                    myUsername,

                receiver:
                    otherUsername,

                time:
                    Date.now(),

                read:
                    false

            }
        );


        showToast(
            "Gönderildi"
        );


    }catch(error){

        console.error(
            "STORAGE:",
            error
        );

        showToast(
            "Dosya gönderilemedi"
        );

    }finally{

        progress.classList.remove(
            "show"
        );

    }

}

/* ============================================================
   CREATE PEER
============================================================ */

function createPeer(type){

    peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );


    remoteStream =
        new MediaStream();


    document.getElementById(
        "remoteVideo"
    ).srcObject =
        remoteStream;


    peerConnection.ontrack =
        event => {

            event.streams[0]
            .getTracks()
            .forEach(
                track => {

                    remoteStream.addTrack(
                        track
                    );

                }
            );


            document.getElementById(
                "callStatus"
            ).textContent =
                "Bağlandı";

        };


    peerConnection.onconnectionstatechange =
        () => {

            const state =
                peerConnection.connectionState;


            console.log(
                "WebRTC:",
                state
            );


            if(
                state === "connected"
            ){

                document.getElementById(
                    "callStatus"
                ).textContent =
                    "Bağlandı";

            }


            if(
                state === "failed" ||
                state === "disconnected"
            ){

                document.getElementById(
                    "callStatus"
                ).textContent =
                    "Bağlantı kesildi";

            }

        };


    peerConnection.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE:",
                peerConnection.iceConnectionState
            );

        };


    peerConnection.onicecandidate =
        event => {

            if(
                !event.candidate ||
                !currentCallId
            ){

                return;

            }


            const path =
                myUsername ===
                pendingIncomingCall?.caller
                ? calleeCandidatesRef(
                    currentCallId
                )
                : callerCandidatesRef(
                    currentCallId
                );


            push(
                path,
                event.candidate.toJSON()
            )
            .catch(
                console.error
            );

        };


    return peerConnection;

}


/* ============================================================
   GET MEDIA
============================================================ */

async function getLocalMedia(type){

    const constraints = {

        audio:true,

        video:
            type === "video"

    };


    localStream =
        await navigator.mediaDevices
        .getUserMedia(
            constraints
        );


    document.getElementById(
        "localVideo"
    ).srcObject =
        localStream;


    localStream
    .getTracks()
    .forEach(
        track => {

            peerConnection.addTrack(
                track,
                localStream
            );

        }
    );

}


/* ============================================================
   START OUTGOING CALL
============================================================ */

async function startCall(type){

    if(
        currentCallId
    ){

        showToast(
            "Zaten bir arama var"
        );

        return;

    }


    try{

        currentCallType =
            type;

        callEnded =
            false;

        callAnswered =
            false;


        const callNode =
            push(
                dbRef(
                    db,
                    "calls"
                )
            );


        currentCallId =
            callNode.key;


        await set(
            callNode,
            {

                caller:
                    myUsername,

                receiver:
                    otherUsername,

                type:
                    type,

                status:
                    "ringing",

                createdAt:
                    Date.now()

            }
        );


        showActiveCall(
            type
        );


        document.getElementById(
            "callStatus"
        ).textContent =
            "Aranıyor...";


        createPeer(
            type
        );


        await getLocalMedia(
            type
        );


        const offer =
            await peerConnection
            .createOffer();


        await peerConnection
        .setLocalDescription(
            offer
        );


        await update(
            callNode,
            {

                offer:{
                    type:
                        offer.type,

                    sdp:
                        offer.sdp

                }

            }
        );


        watchOutgoingCall(
            currentCallId
        );


        watchRemoteCandidates(
            currentCallId,
            false
        );


    }catch(error){

        console.error(
            "ARAMA BAŞLATMA:",
            error
        );


        showToast(
            "Kamera/mikrofon açılamadı"
        );


        await cleanupCall(
            true
        );

    }

}


/* ============================================================
   WATCH OUTGOING CALL
============================================================ */

function watchOutgoingCall(callId){

    onValue(
        callRef(callId),
        async snapshot => {

            const data =
                snapshot.val();


            if(!data){
                return;
            }


            if(
                data.status ===
                "rejected"
            ){

                showToast(
                    "Arama reddedildi"
                );

                await cleanupCall(
                    true
                );

                return;

            }


            if(
                data.status ===
                "ended"
            ){

                showToast(
                    "Arama sonlandırıldı"
                );

                await cleanupCall(
                    false
                );

                return;

            }


            if(
                data.answer &&
                peerConnection &&
                !callAnswered
            ){

                callAnswered =
                    true;


                await peerConnection
                .setRemoteDescription(
                    new RTCSessionDescription(
                        data.answer
                    )
                );


                document.getElementById(
                    "callStatus"
                ).textContent =
                    "Bağlanıyor...";

            }

        }
    );

}


/* ============================================================
   INCOMING CALL LISTENER
============================================================ */

onValue(
    dbRef(
        db,
        "calls"
    ),
    snapshot => {

        const calls =
            snapshot.val();


        if(!calls){
            return;
        }


        let found =
            null;


        for(
            const id in calls
        ){

            const call =
                calls[id];


            if(
                call &&
                call.receiver ===
                    myUsername &&
                call.caller ===
                    otherUsername &&
                call.status ===
                    "ringing"
            ){

                found = {

                    id:id,

                    ...call

                };

                break;

            }

        }


        if(
            found &&
            !currentCallId
        ){

            pendingIncomingCall =
                found;

            pendingOffer =
                found.offer;


            showIncomingCall(
                found.type
            );

        }

    }
);


/* ============================================================
   SHOW INCOMING
============================================================ */

function showIncomingCall(type){

    const screen =
        document.getElementById(
            "incomingCall"
        );


    document.getElementById(
        "incomingType"
    ).innerHTML =
        type === "video"

        ? '<i class="fa-solid fa-video"></i>&nbsp; Görüntülü arama'

        : '<i class="fa-solid fa-phone"></i>&nbsp; Sesli arama';


    screen.classList.add(
        "show"
    );


    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            [300,200,300,200,500]
        );

    }

}


/* ============================================================
   ACCEPT CALL
============================================================ */

document.getElementById(
    "answerCall"
).addEventListener(
    "click",
    async () => {

        if(
            !pendingIncomingCall
        ){

            return;

        }


        try{

            const call =
                pendingIncomingCall;


            currentCallId =
                call.id;

            currentCallType =
                call.type;

            callEnded =
                false;

            callAnswered =
                true;


            document.getElementById(
                "incomingCall"
            ).classList.remove(
                "show"
            );


            showActiveCall(
                call.type
            );


            document.getElementById(
                "callStatus"
            ).textContent =
                "Bağlanıyor...";


            createPeer(
                call.type
            );


            await getLocalMedia(
                call.type
            );


            await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    call.offer
                )
            );


            const answer =
                await peerConnection
                .createAnswer();


            await peerConnection
            .setLocalDescription(
                answer
            );


            await update(
                callRef(
                    currentCallId
                ),
                {

                    status:
                        "answered",

                    answer:{
                        type:
                            answer.type,

                        sdp:
                            answer.sdp

                    }

                }
            );


            watchRemoteCandidates(
                currentCallId,
                true
            );


            pendingIncomingCall =
                null;

            pendingOffer =
                null;


        }catch(error){

            console.error(
                "ARAYI KABUL:",
                error
            );


            showToast(
                "Arama başlatılamadı"
            );


            await cleanupCall(
                true
            );

        }

    }
);


/* ============================================================
   REJECT CALL
============================================================ */

document.getElementById(
    "rejectCall"
).addEventListener(
    "click",
    async () => {

        if(
            !pendingIncomingCall
        ){

            return;

        }


        try{

            await update(
                callRef(
                    pendingIncomingCall.id
                ),
                {

                    status:
                        "rejected",

                    endedAt:
                        Date.now()

                }
            );

        }catch(error){

            console.error(
                error
            );

        }


        document.getElementById(
            "incomingCall"
        ).classList.remove(
            "show"
        );


        pendingIncomingCall =
            null;

        pendingOffer =
            null;

    }
);


/* ============================================================
   REMOTE ICE
============================================================ */

function watchRemoteCandidates(
    callId,
    receivingSide
){

    const candidates =
        receivingSide
        ? callerCandidatesRef(
            callId
        )
        : calleeCandidatesRef(
            callId
        );


    onChildAdded(
        candidates,
        async snapshot => {

            if(
                !peerConnection
            ){

                return;

            }


            try{

                await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        snapshot.val()
                    )
                );

            }catch(error){

                console.error(
                    "ICE EKLEME:",
                    error
                );

            }

        }
    );

}

async function endCall(){

    if(
        currentCallId
    ){

        try{

            await update(
                callRef(
                    currentCallId
                ),
                {

                    status:
                        "ended",

                    endedBy:
                        myUsername,

                    endedAt:
                        Date.now()

                }
            );

        }catch(error){

            console.error(
                error
            );

        }

    }


    await cleanupCall(
        false
    );

}


/* ============================================================
   CLEANUP
============================================================ */

async function cleanupCall(
    removeCall
){

    callEnded =
        true;


    if(
        localStream
    ){

        localStream
        .getTracks()
        .forEach(
            track => {

                track.stop();

            }
        );

        localStream =
            null;

    }


    if(
        peerConnection
    ){

        try{

            peerConnection.close();

        }catch(error){}

        peerConnection =
            null;

    }


    remoteStream =
        null;


    document.getElementById(
        "remoteVideo"
    ).srcObject =
        null;


    document.getElementById(
        "localVideo"
    ).srcObject =
        null;


    document.getElementById(
        "activeCall"
    ).classList.remove(
        "show"
    );


    document.getElementById(
        "incomingCall"
    ).classList.remove(
        "show"
    );


    currentCallId =
        null;

    currentCallType =
        null;

    pendingIncomingCall =
        null;

    pendingOffer =
        null;

    callAnswered =
        false;


    if(
        removeCall
    ){

        showToast(
            "Arama kapatıldı"
        );

    }

}

document.getElementById(
    "switchCameraBtn"
).addEventListener(
    "click",
    async () => {

        if(
            !localStream ||
            !peerConnection
        ){

            return;

        }


        const videoTracks =
            localStream.getVideoTracks();


        if(
            !videoTracks.length
        ){

            return;

        }


        const currentTrack =
            videoTracks[0];


        const facing =
            currentTrack
            .getSettings()
            .facingMode;


        const newFacing =
            facing === "user"
            ? "environment"
            : "user";


        try{

            const newStream =
                await navigator.mediaDevices
                .getUserMedia({

                    audio:false,

                    video:{
                        facingMode:{
                            ideal:
                                newFacing
                        }
                    }

                });


            const newTrack =
                newStream
                .getVideoTracks()[0];


            const sender =
                peerConnection
                .getSenders()
                .find(
                    s =>
                    s.track &&
                    s.track.kind ===
                    "video"
                );


            if(sender){

                await sender.replaceTrack(
                    newTrack
                );

            }


            currentTrack.stop();


            localStream.removeTrack(
                currentTrack
            );


            localStream.addTrack(
                newTrack
            );


            document.getElementById(
                "localVideo"
            ).srcObject =
                localStream;


        }catch(error){

            console.error(
                "KAMERA DEĞİŞTİR:",
                error
            );

            showToast(
                "Kamera değiştirilemedi"
            );

        }

    }
);
