<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesajlar</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#000;
color:#fff;
}

header{
display:flex;
align-items:center;
padding:12px 16px;
font-size:22px;
font-weight:bold;
gap:14px;
border-bottom:1px solid #222;
}

header i{
font-size:20px;
}

.search{
margin:14px 16px;
padding:10px 14px;
border-radius:14px;
}

.search input{
font-size:15px;
margin-left:10px;
}

.section-title{
font-size:17px;
margin:0 16px 14px;
}

.notes{
padding:0 16px 16px;
gap:14px;
}

.note{
min-width:78px;
}

.bubble{
height:45px;
font-size:11px;
padding:8px;
border-radius:14px;
}

.avatar{
width:58px;
height:58px;
font-size:22px;
}

.plus{
width:22px;
height:22px;
font-size:14px;
border:2px solid #000;
}

.name{
font-size:13px;
margin-top:6px;
}

.messages{
padding-top:12px;
}

.chat{
padding:14px 16px;
}

.chat-avatar{
width:56px;
height:56px;
margin-right:12px;
}

.username{
font-size:17px;
gap:6px;
}

.username i{
font-size:15px;
}

.last{
font-size:13px;
margin-top:3px;
}

.arrow{
font-size:18px;
}

</style>

</head>

<body>

<header>

<i class="fa-solid fa-arrow-left"></i>

<span>Mesajlar</span>

</header>

<div class="search">

<i class="fa fa-search"></i>

<input placeholder="Kişileri ara...">

</div>

<div class="section-title">

Notlar

</div>

<div class="notes">

<div class="note">

<div class="bubble"></div>

<div class="avatar">

N

<div class="plus">

+

</div>

</div>

<div class="name">

Notun

</div>

</div>

<div class="note">

<div class="bubble">

Bugün güzel bir gün ☀

</div>

<div class="avatar">

A

</div>

<div class="name">

ahmet

</div>

</div>

<div class="note">

<div class="bubble">

Biraz müzik 🎵

</div>

<div class="avatar">

M

</div>

<div class="name">

mehmet

</div>

</div>

<div class="note">

<div class="bubble">

Maç günü!

</div>

<div class="avatar">

G

</div>

<div class="name">

galatasaray

</div>

</div>

</div>

<div class="messages">

<div class="section-title">

Mesajlar

</div>

<div class="chat">

<div class="chat-avatar"></div>

<div class="chat-info">

<div class="username">

test

<i class="fa-solid fa-circle-check"></i>

</div>

<div class="last">

Mesaj göndermek için dokun

</div>

</div>

<div class="arrow">

❯

</div>

</div>

</div>

</body>

</html>
