<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesajlar</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#000;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
background:#000;
}

/* Telefon görünümü */
.app{
width:100%;
max-width:430px;
min-height:100vh;
background:#000;
}

/* Bilgisayar */
@media (min-width:768px){

body{
padding:20px 0;
}

.app{
width:430px;
min-height:900px;
border-left:1px solid #262626;
border-right:1px solid #262626;
}

</style>

</head>

<body>

<header>

<i class="fa-solid fa-arrow-left"></i>

<span>Mesajlar</span>

</header>

<div class="search">

<i class="fa fa-search"></i>

<input placeholder="Kişileri ara...">

</div>

<div class="section-title">

Notlar

</div>

<div class="notes">

<div class="note">

<div class="bubble"></div>

<div class="avatar">

N

<div class="plus">

+

</div>

</div>

<div class="name">

Notun

</div>

</div>

<div class="note">

<div class="bubble">

Bugün güzel bir gün ☀

</div>

<div class="avatar">

A

</div>

<div class="name">

ahmet

</div>

</div>

<div class="note">

<div class="bubble">

Biraz müzik 🎵

</div>

<div class="avatar">

M

</div>

<div class="name">

mehmet

</div>

</div>

<div class="note">

<div class="bubble">

Maç günü!

</div>

<div class="avatar">

G

</div>

<div class="name">

galatasaray

</div>

</div>

</div>

<div class="messages">

<div class="section-title">

Mesajlar

</div>

<div class="chat">

<div class="chat-avatar"></div>

<div class="chat-info">

<div class="username">

test

<i class="fa-solid fa-circle-check"></i>

</div>

<div class="last">

Mesaj göndermek için dokun

</div>

</div>

<div class="arrow">

❯

</div>

</div>

</div>

</body>

</html>
