<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minegram • Mesajlar</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
button,input{font:inherit}
button{border:0;background:none;color:#fff}

.page{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#000;
}

/* Header */
.top{
  height:62px;
  min-height:62px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 22px;
  border-bottom:1px solid #262626;
}
.back{
  width:30px;
  padding:0;
  font-size:28px;
  line-height:1;
  cursor:pointer;
}
.title{
  font-size:19px;
  font-weight:700;
}

/* Search */
.search-wrap{
  width:min(100%,720px);
  margin:0 auto;
  padding:10px 20px 8px;
}
.search{
  height:40px;
  width:100%;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 12px;
  border:1px solid #666;
  border-radius:8px;
  background:#050505;
}
.search svg{width:17px;height:17px;flex:none}
.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:16px;
}
.search input::placeholder{color:#aaa}

/* Notes */
.section{
  width:min(100%,720px);
  margin:0 auto;
  padding:3px 20px 9px;
}
.section-title{
  margin:0 0 8px;
  font-size:15px;
  font-weight:700;
}
.notes-row{
  display:flex;
  gap:15px;
  overflow-x:auto;
  padding:0 1px;
  scrollbar-width:none;
}
.notes-row::-webkit-scrollbar{display:none}
.note{
  width:58px;
  min-width:58px;
  text-align:center;
}
.note-bubble{
  width:58px;
  height:34px;
  margin:0 auto 5px;
  padding:5px;
  border-radius:9px;
  background:#090d11;
  color:#ddd;
  font-size:7px;
  line-height:1.35;
  overflow:hidden;
}
.note-avatar{
  width:44px;
  height:44px;
  margin:0 auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#378fc8;
  font-size:15px;
  position:relative;
}
.plus{
  position:absolute;
  right:-1px;
  bottom:-1px;
  width:16px;
  height:16px;
  border:2px solid #000;
  border-radius:50%;
  background:#2e89c9;
  font-size:15px;
  line-height:12px;
}
.note-name{
  margin-top:5px;
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.note-sub{
  margin-top:3px;
  font-size:7px;
  color:#aaa;
}

.divider{
  width:min(100%,760px);
  height:1px;
  margin:0 auto;
  background:#292929;
}

/* Message list */
.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  width:min(100%,760px);
  margin:0 auto;
}
.messages-head{
  height:45px;
  display:flex;
  align-items:center;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.list{padding-bottom:10px}
.thread{
  height:64px;
  display:flex;
  align-items:center;
  padding:6px 20px;
  border-top:1px solid #242424;
  cursor:pointer;
}
.thread:last-child{border-bottom:1px solid #242424}
.avatar{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#161616;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-fallback{font-size:15px}
.thread-main{
  flex:1;
  min-width:0;
  margin-left:12px;
}
.userline{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:16px;
  font-weight:700;
}
.verified{
  width:14px;
  height:14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#218bd0;
  font-size:9px;
}
.preview{
  margin-top:4px;
  color:#aaa;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.arrow{
  padding-left:8px;
  color:#aaa;
  font-size:23px;
}
.empty{
  padding:35px 20px;
  text-align:center;
  color:#777;
  font-size:15px;
}

@media(min-width:900px){
  .top{padding-left:28px}
  .search-wrap{padding-left:0;padding-right:0}
  .section{padding-left:0;padding-right:0}
  .messages-head{padding-left:0;padding-right:0}
  .thread{padding-left:0;padding-right:0}
}

<body>
<div class="page">
  <header class="top">
    <button class="back" id="backBtn" aria-label="Geri">‹</button>
    <div class="title">Mesajlar</div>
  </header>

  <div class="search-wrap">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input id="searchInput" placeholder="Kişileri ara..." autocomplete="off">
    </label>
  </div>

  <section class="section">
    <h2 class="section-title">Notlar</h2>
    <div class="notes-row" id="notesRow"></div>
  </section>

  <div class="divider"></div>

  <main class="messages">
    <div class="messages-head">Mesajlar</div>
    <div class="list" id="messageList"></div>
  </main>
</div>

<script>
const token = localStorage.getItem("minegram_token") || localStorage.getItem("token") || "";
const API = "";

const sampleNotes = [
  {name:"Notun", initial:"N", text:"Bugün güzel bir gün ☀️"},
  {name:"ahmet", initial:"A", text:"Biraz müzik dinliyorum 🎵"},
  {name:"mehmet", initial:"M", text:"Maç günü ⚽"},
  {name:"galatasaray", initial:"G", text:""}
];

let profiles = [];
let messages = [];

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function headers(){
  return token ? {Authorization:"Bearer "+token, "Content-Type":"application/json"} : {"Content-Type":"application/json"};
}
function initials(name){
  const s=String(name||"?").trim();
  return (s[0]||"?").toUpperCase();
}
function renderNotes(list=sampleNotes){
  const row=document.getElementById("notesRow");
  row.innerHTML=list.map((n,i)=>`
    <div class="note">
      ${i<4?`<div class="note-bubble">${esc(n.text)}</div>`:""}
      <div class="note-avatar">${i===0?'<button type="button" class="plus note-add" aria-label="Not paylaş">+</button>':esc(initials(n.initial||n.name))}</div>
      <div class="note-name">${esc(n.name)}</div>
      ${i===2?'':''}
    </div>`).join("");
}
function bindNoteAddButtons(){
  document.querySelectorAll(".note-add").forEach(el=>{
    if(el.dataset.bound) return;
    el.dataset.bound="1";
    el.addEventListener("click",openNoteComposer);
  });
}
function openNoteComposer(){
  const modal=document.getElementById("noteComposer");
  const input=document.getElementById("noteText");
  if(!modal) return;
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
  if(input){ input.value=""; setTimeout(()=>input.focus(),30); }
}

function renderMessages(list){
  const el=document.getElementById("messageList");
  if(!list.length){
    el.innerHTML='<div class="empty">Henüz mesaj yok.</div>';
    return;
  }
  el.innerHTML=list.map(m=>{
    const username=m.username || m.fromUsername || m.toUsername || "kullanıcı";
    const text=m.text || "Mesaj göndermek için dokun";
    const avatar=m.avatar || m.avatar_url || "";
    return `<div class="thread" data-user="${esc(username)}">
      <div class="avatar">${avatar?`<img src="${esc(avatar)}" alt="">`:`<div class="avatar-fallback">${esc(initials(username))}</div>`}</div>
      <div class="thread-main">
        <div class="userline"><span>${esc(username)}</span>${m.verified?'<span class="verified">✓</span>':''}</div>
        <div class="preview">${esc(text)}</div>
      </div>
      <div class="arrow">›</div>
    </div>`;
  }).join("");
  document.querySelectorAll(".thread").forEach(t=>{
    t.addEventListener("click",()=>openConversation(t.dataset.user));
  });
}
async function loadMessages(){
  if(!token){ renderMessages([]); return; }
  try{
    const r=await fetch(API+"/api/messages",{headers:headers()});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||"Mesajlar alınamadı");
    messages=data||[];
    const map=new Map();
    for(const m of messages){
      const other = String(m.from)===String(getMeId()) ? m.to : m.from;
      const username=m.username||"kullanıcı";
      map.set(other,{...m,username});
    }
    renderMessages([...map.values()]);
  }catch(e){
    console.warn(e);
    renderMessages([]);
  }
}
function getMeId(){
  try{
    const u=JSON.parse(localStorage.getItem("minegram_user")||localStorage.getItem("user")||"null");
    return u?.id||"";
  }catch{return ""}
}
function openConversation(username){
  const target="messages-chat.html?user="+encodeURIComponent(username);
  window.location.href=target;
}
document.getElementById("backBtn").onclick=()=>history.length>1?history.back():window.location.href="index.html";
document.getElementById("searchInput").addEventListener("input",async e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q){ renderMessages(messages.length?messages:[]); return; }
  const local=messages.filter(m=>String(m.username||"").toLowerCase().includes(q));
  renderMessages(local);
  if(token){
    try{
      const r=await fetch(API+"/api/search?q="+encodeURIComponent(q),{headers:headers()});
      if(r.ok){
        const p=await r.json();
        profiles=p||[];
      }
    }catch{}
  }
});
renderNotes();
loadMessages();
</script>


</div>
<script>
(() => {
  const modal = document.getElementById('noteComposer');
  const input = document.getElementById('noteText');
  const cancel = document.getElementById('noteCancel');
  const publish = document.getElementById('notePublish');

  function openComposer() {
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    input.value = '';
    setTimeout(() => input.focus(), 30);
  }
  function closeComposer() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
  }

  document.querySelectorAll('.note-add').forEach(el => {
    el.addEventListener('click', openComposer);
  });

  cancel.addEventListener('click', closeComposer);
  modal.addEventListener('click', e => {
    if (e.target === modal) closeComposer();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeComposer();
  });

  publish.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }

    // Put the new note into the first available note bubble.
    const bubbles = document.querySelectorAll('.note-bubble');
    if (bubbles.length) {
      const target = bubbles[0];
      target.textContent = text;
      target.classList.add('user-note');
    }
    closeComposer();
  });
})();
</script>




<div class="note-composer" id="noteComposer" aria-hidden="true">
<div class="note-dialog" role="dialog" aria-modal="true" aria-labelledby="noteTitle">
<h3 id="noteTitle">Not paylaş</h3>
<textarea id="noteText" maxlength="80" placeholder="Notun..."></textarea>
<div class="note-actions"><button id="noteCancel" type="button">İptal</button><button id="notePublish" type="button">Paylaş</button></div>
</div></div>
<script id="minegram-note-final-script">
(function(){
function init(){
const modal=document.getElementById('noteComposer'), input=document.getElementById('noteText'),
cancel=document.getElementById('noteCancel'), publish=document.getElementById('notePublish');
if(!modal||!input||!cancel||!publish)return;
function openNote(){modal.classList.add('open');modal.setAttribute('aria-hidden','false');input.value='';setTimeout(()=>input.focus(),20);}
function closeNote(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');}
document.addEventListener('click',e=>{const add=e.target.closest('.note-add');if(add){e.preventDefault();openNote();}});
cancel.addEventListener('click',closeNote);
modal.addEventListener('click',e=>{if(e.target===modal)closeNote();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeNote();});
publish.addEventListener('click',()=>{const text=input.value.trim();if(!text){input.focus();return;}const b=document.querySelector('.note-bubble');if(b)b.textContent=text;closeNote();});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
