<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Instagram Chat</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

.chat-header{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    background:#000;
    border-bottom:1px solid #262626;
    flex-shrink:0;

    position:sticky;
    top:0;
    z-index:100;
}

.header-left{
    display:flex;
    align-items:center;
}

.back{
    color:#fff;
    text-decoration:none;
    font-size:22px;
    margin-right:15px;
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
}

.user-info{
    margin-left:10px;
}

.username{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:16px;
    font-weight:700;
    color:#fff;
}

.verified{
    color:#0095f6;
    font-size:13px;
}

.subtitle{
    margin-top:2px;
    color:#a8a8a8;
    font-size:12px;
}

.next-profile{
    color:#fff;
    font-size:11px;
    margin-left:8px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:22px;
}

.header-right button{
    background:none;
    border:none;
    color:#fff;
    font-size:21px;
    cursor:pointer;
}

.header-right button:hover{
    opacity:.8;
}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

.app{
    max-width:430px;
    margin:auto;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:#000;
}

.profile-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 20px;
    border-bottom:1px solid #262626;
}

.profile-card > img{
    width:96px;
    height:96px;
    border-radius:50%;
    object-fit:cover;
}

.profile-card h2{
    margin:12px 0 4px;
    font-size:22px;
}

.profile-card p{
    color:#a8a8a8;
    margin-bottom:16px;
}

#profileBtn{
    background:#262626;
    color:#fff;
    border:none;
    border-radius:10px;
    padding:10px 18px;
    cursor:pointer;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.msg{
    max-width:75%;
    padding:10px 14px;
    border-radius:22px;
    position:relative;
    word-break:break-word;
    animation:fade .25s ease;
}

.msg.me{
    background:#3797f0;
    margin-left:auto;
}

.msg.other{
    background:#262626;
}

.msg::after{
    content:"";
    position:absolute;
    bottom:0;
    width:12px;
    height:12px;
}

.msg.me::after{
    right:-4px;
    background:#3797f0;
    clip-path:polygon(0 0,100% 100%,0 100%);
}

.msg.other::after{
    left:-4px;
    background:#262626;
    clip-path:polygon(100% 0,100% 100%,0 100%);
}

.msg img{
    max-width:220px;
    border-radius:15px;
    display:block;
}

.seen{
    font-size:12px;
    color:#a8a8a8;
    text-align:right;
    margin:4px 8px 12px 0;
}

.input-area input{
    flex:1;
    background:#111;
    border:1px solid #333;
    border-radius:25px;
    color:#fff;
    padding:10px 15px;
    outline:none;
}

.input-area button{
    background:none;
    border:none;
    color:#0095f6;
    font-size:20px;
    cursor:pointer;
}

/* BURAYA EKLE */

.time{
    font-size:11px;
    color:#d9d9d9;
    text-align:right;
    margin-top:4px;
}

.input-area{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border-top:1px solid #262626;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

</head>

<body>

<div class="app">

<header class="chat-header">

    <div class="header-left">

        <a href="mesaj.html" class="back">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <img
            src="https://i.pravatar.cc/150?img=12"
            class="avatar">

        <div class="user-info">

            <div class="username">
                test
                <i class="fa-solid fa-circle-check verified"></i>
            </div>

            <div class="subtitle">
                Profil
            </div>

        </div>

        <i class="fa-solid fa-chevron-right next-profile"></i>

    </div>

    <div class="header-right">

        <button id="callBtn">
            <i class="fa-solid fa-phone"></i>
        </button>

        <button id="videoBtn">
            <i class="fa-solid fa-video"></i>
        </button>

        <button id="infoBtn">
            <i class="fa-solid fa-ellipsis"></i>
        </button>

    </div>

</header>

<div class="profile-card">

<img src="https://i.pravatar.cc/300?img=12">

<h2>test</h2>

<p>@test</p>

<button id="profileBtn">
Profili Gör
</button>

</div>


<div id="messages" class="messages">

<div class="msg other">
Merhaba 👋
<div class="time">20:14</div>
</div>

<div class="msg me">
Merhaba 😊
<div class="time">20:15</div>
</div>

<div class="msg other">
Nasılsın?
<div class="time">20:16</div>
</div>

<div id="seen" class="seen" style="display:none;">
    Görüldü
</div>

</div>

<div class="input-area">

<button id="emojiBtn">😊</button>

<button id="galleryBtn">
<i class="fa-regular fa-image"></i>
</button>

<button id="cameraBtn">
<i class="fa-solid fa-camera"></i>
</button>

<input
id="messageInput"
type="text"
placeholder="Mesaj">

<button id="micBtn">
<i class="fa-solid fa-microphone"></i>
</button>

<button id="sendBtn">
<i class="fa-solid fa-paper-plane"></i>
</button>

</div>

<input
type="file"
id="galleryInput"
accept="image/*"
hidden>

<script>

const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const messages = document.getElementById("messages");
const seen = document.getElementById("seen");

let typing = false;

function getTime(){
    const d = new Date();
    return d.getHours().toString().padStart(2,"0")+":"+
           d.getMinutes().toString().padStart(2,"0");
}

function scrollBottom(){
    messages.scrollTop = messages.scrollHeight;
}

function showTyping(){

    if(typing) return;

    typing = true;

    const div = document.createElement("div");
    div.className = "msg other";
    div.id = "typing";
    div.innerHTML = "Yazıyor...";

    messages.appendChild(div);

    scrollBottom();

}

function hideTyping(){

    const t = document.getElementById("typing");

    if(t) t.remove();

    typing = false;

}

function autoReply(){

    showTyping();

    setTimeout(function(){

        hideTyping();

        const div = document.createElement("div");

        div.className = "msg other";

        div.innerHTML = `
            ${replies[Math.floor(Math.random()*replies.length)]}
            <div class="time">${getTime()}</div>
        `;

        messages.appendChild(div);

        seen.style.display = "block";
        messages.appendChild(seen);

        scrollBottom();

    },2500);

}

function sendMessage(){

    const text = input.value.trim();

    if(text==="") return;

    const div = document.createElement("div");

    div.className = "msg me";

    div.innerHTML = `
        ${text}
        <div class="time">${getTime()}</div>
    `;

    messages.appendChild(div);

	input.value="";

	scrollBottom();

}

sendBtn.onclick = sendMessage;

input.addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        e.preventDefault();

        sendMessage();

    }

});

input.addEventListener("input",function(){

    if(input.value.trim()===""){

        sendBtn.style.opacity=".4";

    }else{

        sendBtn.style.opacity="1";

    }

});

// Emoji

document.getElementById("emojiBtn").onclick=function(){

    input.value+="😊";

    input.focus();

};

// Galeri

document.getElementById("galleryBtn").onclick=function(){

    document.getElementById("galleryInput").click();

};

document.getElementById("galleryInput").onchange=function(){

    if(!this.files.length) return;

    const file=this.files[0];

    const reader=new FileReader();

    reader.onload=function(){

        const div=document.createElement("div");

        div.className="msg me";

        div.innerHTML=`
            <img src="${reader.result}">
            <div class="time">${getTime()}</div>
        `;

        messages.appendChild(div);

		seen.style.display = "none";

		scrollBottom();

		autoReply();

    };

    reader.readAsDataURL(file);

};

// Kamera

document.getElementById("cameraBtn").onclick=function(){

    alert("Kamera yakında eklenecek.");

};

// Mikrofon

document.getElementById("micBtn").onclick=function(){

    alert("Ses kaydı yakında eklenecek.");

};

// Geri

document.querySelector(".back").onclick=function(e){

    e.preventDefault();

    location.href="mesaj.html";

};

// Profil

document.getElementById("profileBtn").onclick=function(){

    location.href="profile.html";

};

// Üst butonlar

document.getElementById("callBtn").onclick=function(){

    alert("Sesli arama");

};

document.getElementById("videoBtn").onclick=function(){

    alert("Görüntülü arama");

};

document.getElementById("infoBtn").onclick=function(){

    alert("Sohbet bilgileri");

};

window.onload=function(){

    sendBtn.style.opacity=".4";

    scrollBottom();

};

// Mesaj silme
messages.addEventListener("dblclick", function(e){

    const msg = e.target.closest(".msg.me");

    if(msg && confirm("Mesaj silinsin mi?")){
        msg.remove();
    }

});

// Mesaj düzenleme
messages.addEventListener("contextmenu", function(e){

    const msg = e.target.closest(".msg.me");

    if(!msg) return;

    e.preventDefault();

    const eskiMesaj = msg.childNodes[0].textContent.trim();

    const yeniMesaj = prompt("Mesajı düzenle:", eskiMesaj);

    if(yeniMesaj && yeniMesaj.trim() !== ""){

        msg.innerHTML = `
            ${yeniMesaj}
            <div class="time">${getTime()}</div>
        `;

    }

});

// Mesajı kopyala
messages.addEventListener("click", async function(e){

    const msg = e.target.closest(".msg");

    if(!msg) return;

    const text = msg.innerText.replace(/\d{2}:\d{2}/, "").trim();

    if(!text) return;

    try{

        await navigator.clipboard.writeText(text);

        alert("Mesaj kopyalandı 📋");

    }catch{

        alert("Kopyalanamadı.");

    }

});

</script>

</div>

</body>
</html>
