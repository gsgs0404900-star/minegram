async function deletePostFromMenu(){

  if(!currentMenuPost)return;

  /* Devam eden tüm eski feed isteklerinin sonucu geçersiz. */
  minegramPostDeleteVersion++;
  minegramFeedLoadVersion++;

  const id=String(currentMenuPost).trim();
  closeMenu();

  if(!confirm("Bu gönderiyi silmek istediğine emin misin?")) return;

  /* Gönderinin ekrandaki gerçek nesnesini bul. */
  const article=document.querySelector('.post[data-id="'+CSS.escape(id)+'"]');
  const knownPost=(window.__minegramFeedPosts||[]).find(p=>
    String(p?.id||p?.postId||"").trim()===id
  ) || null;

  /* Silindi bilgisini ID + içerik parmak iziyle kalıcı kaydet. */
  addMinegramDeletedPost(id);
  if(knownPost){
    addMinegramDeletedFingerprint(knownPost);
    addMinegramDeletedStableKeys(knownPost);
  }

  /* Kullanıcı silince tekrar yükleme yapmıyoruz. */
  if(article) article.remove();

  let apiOk=false;
  let firebaseOk=false;

  try{
    try{
      await api("/posts/"+encodeURIComponent(id),{method:"DELETE"});
      apiOk=true;
    }catch(e){
      if(Number(e?.status)===404) apiOk=true;
    }

    /* Aynı gönderinin Firebase'de farklı ID'li kopyası varsa onu da bul. */
    try{
      const firebasePosts=await firebaseLoadMinegramPosts();
      const matches=firebasePosts.filter(p=>{
        if(String(p?.id||p?.postId||"").trim()===id)return true;
        if(!knownPost)return false;
        if(minegramPostFingerprint(p)===minegramPostFingerprint(knownPost))return true;
        const a=minegramPostStableKeys(p);
        const b=new Set(minegramPostStableKeys(knownPost));
        return a.some(k=>b.has(k));
      });

      for(const p of matches){
        const fid=String(p?.id||p?.postId||"").trim();
        if(fid){
          addMinegramDeletedPost(fid);
          addMinegramDeletedFingerprint(p);
          const ok=await tryDeleteFirebaseMinegramPost(fid);
          firebaseOk=firebaseOk||ok;
        }
      }
    }catch(_){ }

    /* Başarılı API/Firebase silmesi yeterli. Feed'i yeniden çekmiyoruz. */
    if(apiOk || firebaseOk){
      toast("Gönderi silindi");
    }else{
      /* Sunucuya silme isteği ulaşmadıysa kullanıcıya yanlış başarı verme.
         Ancak fingerprint tombstone'u korumuyoruz. */
      removeMinegramDeletedPost(id);
      if(knownPost){
        const ids=getMinegramDeletedPostIds();
        ids.delete("fp:"+minegramPostFingerprint(knownPost));
        minegramPostStableKeys(knownPost).forEach(k=>ids.delete("stable:"+k));
        localStorage.setItem(MINEGRAM_DELETED_POSTS_KEY,JSON.stringify([...ids]));
      }
      if(article && feedEl) feedEl.insertAdjacentHTML("beforeend",renderPost(knownPost));
      toast("Gönderi silinemedi");
    }

  }catch(e){
    if(!apiOk && !firebaseOk){
      removeMinegramDeletedPost(id);
      if(knownPost){
        const ids=getMinegramDeletedPostIds();
        ids.delete("fp:"+minegramPostFingerprint(knownPost));
        localStorage.setItem(MINEGRAM_DELETED_POSTS_KEY,JSON.stringify([...ids]));
      }
      if(knownPost && feedEl && !document.querySelector('.post[data-id="'+CSS.escape(id)+'"]')){
        feedEl.insertAdjacentHTML("beforeend",renderPost(knownPost));
      }
    }
    toast(e?.message||"Gönderi silinemedi");
  }
}


/* =========================================================
   LOCAL COMMENTS
========================================================= */

function localCommentsKey(id){

  return "minegram_comments_"+
    String(id);

}


function getLocalComments(id){

  try{

    const value=
      JSON.parse(
        localStorage.getItem(
          localCommentsKey(id)
        )||
        "[]"
      );


    return Array.isArray(value)
      ? value
      : [];

  }catch(e){

    return [];

  }

}


function saveLocalComment(id,c){

  const arr=
    getLocalComments(id);


  arr.push(c);


  localStorage.setItem(
    localCommentsKey(id),
    JSON.stringify(
      arr.slice(-100)
    )
  );

}


function mergeComments(server,id){

  const remote=
    Array.isArray(server)
      ? server
      : [];


  const local=
    getLocalComments(id);


  const all=[
    ...remote
  ];


  for(const c of local){

    const exists=
      all.some(
        x=>
          String(x.id||"")===
          String(c.id||"") ||

          (
            x.username===c.username &&
            x.text===c.text &&
            Math.abs(
              new Date(
                x.createdAt||
                x.created_at||
                0
              )-
              new Date(
                c.createdAt||
                0
              )
            )<10000
          )
      );


    if(!exists){

      all.push(c);

    }

  }


  return all;

}


/* =========================================================
   YORUM SIRALAMA
========================================================= */

function sortComments(comments){

  const arr=[
    ...(comments||[])
  ];


  if(
    currentCommentSort===
    "newest"
  ){

    return arr.sort(
      (x,y)=>
        new Date(
          y.createdAt||
          y.created_at||
          0
        )-
        new Date(
          x.createdAt||
          x.created_at||
          0
        )
    );

  }


  if(
    currentCommentSort===
    "popular"
  ){

    return arr.sort(
      (x,y)=>
        Number(
          y.likes||
          y.likeCount||
          0
        )-
        Number(
          x.likes||
          x.likeCount||
          0
        )
    );

  }


  return arr.sort(
    (x,y)=>
      new Date(
        x.createdAt||
        x.created_at||
        0
      )-
      new Date(
        y.createdAt||
        y.created_at||
        0
      )
  );

}


function renderCommentsForPost(
  comments
){

  const sorted=
    sortComments(
      comments
    );


  return sorted.length

    ? sorted
        .map(
          renderComment
        )
        .join("")

    : `

      <div class="empty">
        Henüz yorum yok.
      </div>

    `;

}


function changeCommentSort(
  value
){

  currentCommentSort=
    value;


  if(currentCommentPost){

    const all=
      getLocalComments(
        currentCommentPost
      );


    document.getElementById(
      "commentList"
    ).innerHTML=
      renderCommentsForPost(
        all
      );


    refreshComments(false);

  }

}


/* =========================================================
   YORUM SUNUCU
========================================================= */

async function refreshComments(
  showLoading=true
){

  if(!currentCommentPost)return;


  const id=
    currentCommentPost;


  const list=
    document.getElementById(
      "commentList"
    );


  if(showLoading){

    list.innerHTML=
      renderCommentsForPost(
        getLocalComments(id)
      );

  }


  try{

    const response=
      await api(
        "/posts/"+
        encodeURIComponent(id)+
        "/comments?ts="+Date.now()
      );

    const remote=
      Array.isArray(response?.comments)
        ? response.comments
        : [];

    // Sunucu tek otoritedir. LocalStorage yalnızca
    // başarısız ağ isteğinde geçici önizleme olarak kullanılır.
    list.innerHTML=
      renderCommentsForPost(
        remote
      );


  }catch(e){}

}


/* =========================================================
   YORUM PENCERESİ
========================================================= */

async function openComments(id){

  currentCommentPost=id;
  currentCommentSort="forYou";
  replyingTo=null;

  const input=document.getElementById("commentInput");
  if(input){
    input.value="";
    input.placeholder="Bunun hakkında ne düşünüyorsun?";
  }

  const sort=document.getElementById("commentSort");
  if(sort) sort.value="forYou";

  document.getElementById("commentsModal").classList.add("open");

  const list=document.getElementById("commentList");

  // Önce mevcut yerel önizlemeyi göster; asıl kaynak hemen aşağıdaki API'dir.
  const local=getLocalComments(id);
  list.innerHTML=local.length
    ? renderCommentsForPost(local)
    : `<div class="empty">Yorumlar yükleniyor...</div>`;

  // ÖNEMLİ: Yorumları /posts/:id'den değil, doğrudan
  // /posts/:id/comments endpoint'inden alıyoruz. Site ve Android aynı kaynağı kullanır.
  try{
    const response=await api(
      "/posts/"+
      encodeURIComponent(id)+
      "/comments?ts="+Date.now()
    );

    if(!currentCommentPost || String(currentCommentPost)!==String(id)) return;

    const remote=Array.isArray(response?.comments)
      ? response.comments
      : [];

    // Sunucu başarılı cevap verdiyse TEK OTORİTE sunucudur.
    // Böylece eski localStorage yorumları gerçek sayıya/görüntüye karışmaz.
    list.innerHTML=renderCommentsForPost(remote);

  }catch(e){
    // Ağ hatasında mevcut yerel önizlemeyi koru; hata yokmuş gibi
    // sahte sunucu yorumu üretme.
    const fallback=getLocalComments(id);
    list.innerHTML=fallback.length
      ? renderCommentsForPost(fallback)
      : `<div class="empty">Yorumlar yüklenemedi.</div>`;
  }
}


function closeComments(e){

  const modal=
    document.getElementById(
      "commentsModal"
    );


  if(
    !e ||
    e.target===modal
  ){

    modal.classList.remove(
      "open"
    );


    currentCommentPost=null;

    replyingTo=null;

  }

}


/* =========================================================
   ZAMAN
========================================================= */

function relativeTime(v){

  const d=
    new Date(v);


  if(!v || isNaN(d))return "";


  let seconds=
    Math.floor(
      (Date.now()-
      d.getTime())/
      1000
    );


  if(seconds<60){

    return seconds+
      " saniye önce";

  }


  let minutes=
    Math.floor(
      seconds/60
    );


  if(minutes<60){

    return minutes+
      " dakika önce";

  }


  let hours=
    Math.floor(
      minutes/60
    );


  if(hours<24){

    return hours+
      " saat önce";

  }


  let days=
    Math.floor(
      hours/24
    );


  if(days<7){

    return days+
      " gün önce";

  }


  if(days<365){

    return Math.floor(
      days/7
    )+
    " hafta önce";

  }


  return d.toLocaleDateString(
    "tr-TR"
  );

}


/* =========================================================
   COMMENT RENDER
========================================================= */

function renderComment(c){

  const username=
    esc(
      c.username||
      c.user?.username||
      currentUser?.username||
      "minegram"
    );


  const initial=
    esc(
      username[0]
        .toUpperCase()
    );


  const liked=
    !!c.likedByMe;


  const id=
    esc(
      c.id||""
    );


  const replyCount=
    Array.isArray(c.replies)
      ? c.replies.length
      : Number(
          c.replyCount||
          0
        );


  return `

    <div
      class="comment-wrap"
      data-comment-id="${id}"
    >

      <div class="comment-row">

        <div class="avatar small">
          ${initial}
        </div>


        <div class="comment-body">

          <div
            class="comment-user"
            onclick="location.href='${profileUrl(username)}'"
          >
            @${username}
          </div>


          <div class="comment-text">
            ${esc(
              c.text||
              c.content||
              ""
            )}
          </div>


          <div class="comment-meta">

            ${relativeTime(
              c.createdAt||
              c.created_at
            )}

            &nbsp;

            <button
              class="reply-link"
              onclick="startReply('${id}','${esc(username)}')"
            >
              Yanıtla
            </button>


            ${
              replyCount
                ? `

                  &nbsp;

                  <button
                    class="reply-link reply-count-link"
                    onclick="toggleReplies('${id}')"
                  >
                    ${replyCount} yanıt
                  </button>

                `
                : ""
            }

          </div>

        </div>


        <button
          class="comment-like ${liked?"liked":""}"
          onclick="likeComment('${id}')"
        >
          ${liked?"♥":"♡"}
        </button>

      </div>


      <div
        id="replies-${id}"
        class="replies hidden"
      >

        ${
          Array.isArray(c.replies)
            ? c.replies
                .map(renderReply)
                .join("")
            : ""
        }

      </div>

    </div>

  `;

}


function renderReply(r){

  const username=
    esc(
      r.username||
      r.user?.username||
      "minegram"
    );


  return `

    <div class="reply-row">

      <div class="avatar small">
        ${esc(
          username[0]
            .toUpperCase()
        )}
      </div>


      <div>

        <b>
          @${username}
        </b>


        <div class="comment-text">
          ${esc(
            r.text||
            r.content||
            ""
          )}
        </div>


        <div class="comment-meta">

          ${relativeTime(
            r.createdAt||
            r.created_at
          )}

        </div>

      </div>

    </div>

  `;

}

/* =========================================================
   YORUM GÖNDER
========================================================= */

async function sendComment(){

  const input=
    document.getElementById(
      "commentInput"
    );


  const textValue=
    input.value.trim();


  if(
    !textValue||
    !currentCommentPost
  ){

    return;

  }


  const postId=
    currentCommentPost;


  const replyId=
    replyingTo;


  const sendButton=
    document.querySelector(
      ".comment-compose .send"
    );


  if(sendButton){

    sendButton.disabled=true;

  }


  const me=
    typeof currentUser==="object" &&
    currentUser
      ? currentUser
      : {};


  const username=
    me.username||
    me.name||
    "minegram";


  const now=
    new Date().toISOString();


  const tempId=
    "local-"+
    Date.now()+
    "-"+
    Math.random()
      .toString(36)
      .slice(2);


  const item={

    id:tempId,

    username,

    text:textValue,

    createdAt:now,

    likedByMe:false,

    local:true

  };


  if(replyId){

    const local=
      getLocalComments(
        postId
      );


    let parent=
      local.find(
        c=>
          String(c.id)===
          String(replyId)
      );


    if(parent){

      parent.replies=
        Array.isArray(
          parent.replies
        )
          ? parent.replies
          : [];


      parent.replies.push(
        item
      );


      localStorage.setItem(
        localCommentsKey(postId),
        JSON.stringify(
          local.slice(-100)
        )
      );

    }


    const wrap=
      document.querySelector(
        '.comment-wrap[data-comment-id="'+
        CSS.escape(String(replyId))+
        '"]'
      );


    const replies=
      wrap?.querySelector(
        ".replies"
      );


    if(replies){

      replies.classList.remove(
        "hidden"
      );


      replies.insertAdjacentHTML(
        "beforeend",
        renderReply(item)
      );

    }

  }else{

    saveLocalComment(
      postId,
      item
    );


    const list=
      document.getElementById(
        "commentList"
      );


    if(list){

      const empty=
        list.querySelector(
          ".empty"
        );


      if(empty){

        empty.remove();

      }


      list.insertAdjacentHTML(
        "beforeend",
        renderComment(item)
      );


      list.scrollTop=
        list.scrollHeight;

    }

  }


  input.value="";

  replyingTo=null;

  input.placeholder=
    "Bunun hakkında ne düşünüyorsun?";


  toast(
    replyId
      ? "Yanıt gönderildi"
      : "Yorum gönderildi"
  );


  try{

    let result;


    if(replyId){

      try{

        result=
          await api(
            "/comments/"+
            encodeURIComponent(replyId)+
            "/reply",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  text:textValue
                })
            }
          );

      }catch(firstError){

        result=
          await api(
            "/posts/"+
            encodeURIComponent(postId)+
            "/comments/"+
            encodeURIComponent(replyId)+
            "/reply",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  text:textValue
                })
            }
          );

      }

    }else{

      result=
        await api(
          "/posts/"+
          encodeURIComponent(postId)+
          "/comments",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                text:textValue
              })
          }
        );

    }


    const returned=
      result?.comment||
      result?.data||
      result;


    if(
      returned &&
      typeof returned==="object"
    ){

      const realId=
        returned.id;


      if(realId){

        const local=
          getLocalComments(
            postId
          );


        for(const c of local){

          if(
            String(c.id)===
            String(tempId)
          ){

            c.id=realId;

            c.local=false;

            c.username=
              returned.username||
              returned.user?.username||
              c.username;

            c.text=
              returned.text||
              c.text;

            c.createdAt=
              returned.createdAt||
              returned.created_at||
              c.createdAt;

          }


          if(
            replyId &&
            Array.isArray(c.replies)
          ){

            for(
              const reply
              of c.replies
            ){

              if(
                String(reply.id)===
                String(tempId)
              ){

                reply.id=realId;

                reply.local=false;

              }

            }

          }

        }


        localStorage.setItem(
          localCommentsKey(postId),
          JSON.stringify(
            local.slice(-100)
          )
        );

      }

    }


    refreshComments(false);

    loadFeed();


  }catch(e){

    toast(e?.message || "Yorum sunucuya gönderilemedi");

    const local=
      getLocalComments(
        postId
      );


    if(replyId){

      for(
        const c
        of local
      ){

        if(
          Array.isArray(
            c.replies
          )
        ){

          c.replies=
            c.replies.filter(
              r=>
                String(r.id)!==
                String(tempId)
            );

        }

      }

    }else{

      const filtered=
        local.filter(
          c=>
            String(c.id)!==
            String(tempId)
        );


      local.length=0;

      local.push(
        ...filtered
      );

    }


    localStorage.setItem(
      localCommentsKey(postId),
      JSON.stringify(
        local.slice(-100)
      )
    );


    if(
      currentCommentPost===
      postId
    ){

      document.getElementById(
        "commentList"
      ).innerHTML=
        renderCommentsForPost(
          local
        );

    }


    toast(
      e.message||
      "Gönderilemedi"
    );

  }finally{

    if(sendButton){

      sendButton.disabled=false;

    }

  }

}


/* =========================================================
   YORUM BEĞENİ
========================================================= */

async function likeComment(id){

  if(!id){

    toast(
      "Yorum kimliği bulunamadı"
    );

    return;

  }


  const wrap=
    document.querySelector(
      '.comment-wrap[data-comment-id="'+
      CSS.escape(String(id))+
      '"]'
    );


  const btn=
    wrap?.querySelector(
      ".comment-like"
    );


  const wasLiked=
    !!btn?.classList.contains(
      "liked"
    );


  if(btn){

    btn.classList.toggle(
      "liked",
      !wasLiked
    );


    btn.textContent=
      !wasLiked
        ? "♥"
        : "♡";

  }


  try{

    const r=
      await api(
        "/comments/"+
        encodeURIComponent(id)+
        "/like",
        {
          method:"POST"
        }
      );


    if(
      btn &&
      typeof r.liked==="boolean"
    ){

      btn.classList.toggle(
        "liked",
        r.liked
      );


      btn.textContent=
        r.liked
          ? "♥"
          : "♡";

    }


    toast(
      r.liked
        ? "Yorum beğenildi"
        : "Yorum beğenisi kaldırıldı"
    );


  }catch(e){

    if(btn){

      btn.classList.toggle(
        "liked",
        wasLiked
      );


      btn.textContent=
        wasLiked
          ? "♥"
          : "♡";

    }


    toast(
      e.message||
      "Beğeni işlemi başarısız"
    );

  }

}


/* =========================================================
   ESKİ LOGIN UYUMLULUĞU
========================================================= */

async function login(){

  try{

    const usernameInput=
      document.getElementById("lu");

    const passwordInput=
      document.getElementById("lp");


    const username=
      usernameInput?.value?.trim()||
      "";


    const password=
      passwordInput?.value||
      "";


    if(!username||!password){

      toast(
        "Kullanıcı adı ve şifre gerekli."
      );

      return;

    }


    const j=
      await api(
        "/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              username,
              password
            })
        }
      );


    /*
      Eski endpoint uyumluluğu.
    */

    const oldToken=
      j.token||
      j.access_token||
      j.accessToken||
      j.supabaseAccessToken||
      j.session?.access_token||
      j.data?.access_token||
      "";


    if(!oldToken){

      toast(
        "Giriş tokenı alınamadı."
      );

      return;

    }


    token=
      String(oldToken);


    localStorage.setItem(
      "minegram_token",
      token
    );


    localStorage.setItem(
      "minegram_supabase_token",
      token
    );


    localStorage.setItem(
      "minegram_access_token",
      token
    );


    localStorage.setItem(
      "access_token",
      token
    );


    if(j.user){

      currentUser=
        j.user;


      localStorage.setItem(
        "minegram_user",
        JSON.stringify(
          currentUser
        )
      );

    }


    showHome();

    await loadFeed();


  }catch(e){

    toast(
      e.message||
      "Giriş yapılamadı."
    );

  }

}

async function forgot(){

  const value=
    prompt(
      "E-posta adresini veya kullanıcı adını gir:"
    );


  if(!value)return;


  try{

    await api(
      "/forgot",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            identifier:value
          })
      }
    );


    toast(
      "Kurtarma bağlantısı gönderildi."
    );


  }catch(e){

    toast(
      e.message||
      "Kurtarma işlemi başarısız."
    );

  }

}


/* =========================================================
   INIT
========================================================= */

async function init(){

  /*
    Tokenı yeniden al.
  */

  token=
    getMinegramToken();


  console.log(
    "[MINEGRAM] Token kontrolü:",
    token
      ? "VAR"
      : "YOK"
  );


  /*
    Kullanıcıyı localden al.
  */

  const savedUser=
    localStorage.getItem(
      "minegram_user"
    );


  if(savedUser){

    try{

      currentUser=
        JSON.parse(
          savedUser
        );

    }catch(_){

      currentUser=null;

    }

  }


  showHome();


  /*
    Token yoksa giriş.
  */

  if(!token){

    showLogin();

    return;

  }


  try{

    /*
      Gerçek sunucu oturumunu kontrol et.
    */

    const me=
      await api(
        "/me"
      );


    currentUser=
      me?.user||
      me;


    if(currentUser){

      localStorage.setItem(
        "minegram_user",
        JSON.stringify(
          currentUser
        )
      );

    }


    showHome();


    /*
      Feed.
    */

    await loadFeed();


  }catch(e){

    console.error(
      "[INDEX AUTH ERROR]",
      e
    );


    const msg=
      String(
        e?.message||
        ""
      );


    /*
      GERÇEK AUTH HATASI
    */

    const isAuthError=

      e?.status===401 ||

      /unauthorized/i.test(msg) ||

      /invalid token/i.test(msg) ||

      /token expired/i.test(msg) ||

      /jwt/i.test(msg) ||

      /not authenticated/i.test(msg) ||

      /session expired/i.test(msg);


    if(isAuthError){

      console.error(
        "[MINEGRAM] Token sunucu tarafından reddedildi."
      );


      /*
        Bu durumda gerçekten oturum geçersizdir.
      */

      clearMinegramSession();

      showLogin();

      return;

    }


    /*
      /me geçici hata verdiyse
      kullanıcıyı çıkış yaptırma.
    */

    showHome();


    if(feedEl){

      feedEl.innerHTML=`

        <div class="empty">

          <strong>
            Gönderiler şu anda yüklenemiyor
          </strong>

          <small>
            Oturumun açık.
            Sunucuya bağlanırken geçici bir sorun oluştu.
          </small>

          <br>

          <button
            onclick="loadFeed()"
            style="
              margin-top:16px;
              padding:12px 22px;
              border:0;
              border-radius:22px;
              background:#fff;
              color:#000;
              font-weight:700;
              cursor:pointer
            "
          >
            Tekrar Dene
          </button>

        </div>

      `;

    }

  }

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Escape"){

      closeMenu();

      closeComments();

    }

  }
);


/* =========================================================
   DIŞARI TIKLAMA
========================================================= */

document.addEventListener(
  "click",
  e=>{

    const backdrop=
      document.getElementById(
        "menuBackdrop"
      );


    if(
      backdrop &&
      backdrop.classList.contains(
        "open"
      ) &&
      e.target===backdrop
    ){

      closeMenu();

    }

  }
);


/* =========================================================
   BAŞLAT
========================================================= */

init();

</script>
