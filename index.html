<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#000;
  color:#f5f5f5;
  font-family:Arial,Helvetica,sans-serif
}

body{
  overflow-x:hidden;
  padding-bottom:76px
}

.app{
  min-height:100vh;
  background:#000
}

.topbar{
  height:70px;
  border-bottom:1px solid #202020;
  display:flex;
  align-items:center;
  padding:0 22px;
  position:sticky;
  top:0;
  background:#000;
  z-index:50
}

.logo{
  font-size:22px;

}

.top-actions{
  margin-left:auto;
  display:flex;
  gap:6px

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:#eee;
  display:grid;
  place-items:center;
  cursor:pointer
}

.svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

.stories{
  height:92px;
  border-bottom:1px solid #202020;
  display:flex;
  align-items:center;
  padding:12px 20px;
  overflow:hidden
}

.story{
  width:68px;
  text-align:center;
  font-size:10px;
  color:#aaa;
  flex:none
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#3f91cc;
  display:grid;
  place-items:center;
  font-size:21px;
  color:#eee;
  margin:auto;
  position:relative
}

/* Hikaye */
.story{cursor:pointer;user-select:none}
.story:active{transform:scale(.96)}
.story.has-story .avatar{box-shadow:0 0 0 2px #fff,0 0 0 4px #3f91cc}
.story-image{width:58px;height:58px;border-radius:50%;object-fit:cover;display:block}

.story-viewer{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:9999;display:none;align-items:center;justify-content:center}
.story-viewer.open{display:flex}
.story-stage{position:relative;width:min(100vw,520px);height:100vh;display:flex;align-items:center;justify-content:center}
.story-media{max-width:100%;max-height:100%;object-fit:contain}
.story-close{position:absolute;top:18px;right:18px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:30px;cursor:pointer;z-index:3}
.story-prev,.story-next{position:absolute;top:0;bottom:0;width:35%;border:0;background:transparent;color:transparent;cursor:pointer;z-index:2}
.story-prev{left:0}.story-next{right:0}
.story-progress{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:4}
.story-progress span{height:3px;flex:1;background:rgba(255,255,255,.35);border-radius:10px}.story-progress span.active{background:#fff}


.story-more{position:absolute;top:18px;right:68px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:28px;cursor:pointer;z-index:5}
.story-more-menu{display:none;position:absolute;top:68px;right:12px;width:280px;background:#111;border:1px solid #333;border-radius:12px;overflow:hidden;z-index:6;box-shadow:0 10px 35px rgba(0,0,0,.6)}
.story-more-menu.open{display:block}
.story-more-menu button{display:block;width:100%;padding:13px 15px;border:0;border-bottom:1px solid #242424;background:#111;color:#fff;text-align:left;font-size:14px;cursor:pointer}
.story-more-menu button:last-child{border-bottom:0}
.story-more-menu button:active{background:#222}
.story-more-menu .danger{color:#ff5b5b}
.story-viewer.story-paused .story-media{opacity:.98}

<script>
  
/* =========================================================
   MINEGRAM HİKAYE SİSTEMİ — SUNUCU + SUPABASE SENKRON
========================================================= */
(function(){

  let stories = [];
  let storyGroups = [];
  let storyIndex = 0;
  let storyTimer = null;
  let storyVideo = null;
  let currentGroup = null;
  let loadingStories = false;

  const STORY_AGE = 24 * 60 * 60 * 1000;

  function normalizeStory(s){

    if(!s) return null;

    const profile = s.profiles || s.profile || {};
    const user = s.user || {};

    const media =
      s.media_url ||
      s.mediaUrl ||
      s.media ||
      s.url ||
      "";

    if(!media) return null;

    const username =
      profile.username ||
      user.username ||
      s.username ||
      "minegram";

    return {
      id: s.id || ("story_"+Date.now()),
      userId:
        s.user_id ||
        s.userId ||
        profile.id ||
        user.id ||
        "",

      username: username,

      displayName:
        profile.display_name ||
        profile.displayName ||
        user.display_name ||
        user.displayName ||
        s.display_name ||
        username,

      avatar:
        profile.avatar_url ||
        profile.avatarUrl ||
        user.avatar_url ||
        user.avatarUrl ||
        s.avatar_url ||
        "",

      media: media,

      type:
        s.media_type ||
        s.mediaType ||
        s.type ||
        "",

      createdAt:
        new Date(
          s.created_at ||
          s.createdAt ||
          Date.now()
        ).getTime(),

      commentsEnabled:
        s.comments_enabled !== false &&
        s.commentsEnabled !== false
    };
  }

  function cleanStories(){

    const limit = Date.now() - STORY_AGE;

    stories = stories.filter(function(x){
      return x &&
             x.media &&
             Number(x.createdAt) > limit;
    });
  }

  function getLocalUsername(){

    const keys = [
      "minegram_username",
      "minegram_user",
      "username"
    ];

    for(const key of keys){

      const a = localStorage.getItem(key);

      if(a && a !== "null" && a !== "undefined"){
        return a.replace(/^@/,"").trim();
      }

    }

    return "";
  }

  function getCurrentUserId(){

    if(typeof currentUser !== "undefined" && currentUser){

      return (
        currentUser.id ||
        currentUser.user_id ||
        ""
      );

    }

    return "";
  }

  function isMyStory(story){

    const uid = getCurrentUserId();

    if(uid && story.userId){
      return String(uid) === String(story.userId);
    }

    const username = getLocalUsername();

    if(username && story.username){
      return (
        username.toLowerCase() ===
        String(story.username).replace(/^@/,"").toLowerCase()
      );
    }

    return false;
  }

  async function loadStories(){

    if(loadingStories) return;

    loadingStories = true;

    try{

      /*
       * Burada mevcut api() fonksiyonu kullanılıyor.
       * api() Authorization Bearer token'ı otomatik ekliyor.
       */

      const data = await api("/stories");

      stories = Array.isArray(data)
        ? data.map(normalizeStory).filter(Boolean)
        : [];

      cleanStories();

      buildStoryGroups();

      renderStoryBar();

    }catch(error){

      console.error("MINEGRAM STORY LOAD ERROR:",error);

      /*
       * Sunucu geçici olarak cevap vermezse
       * eski localStorage Story'leri tamamen silmiyoruz.
       */

      try{

        const old =
          JSON.parse(
            localStorage.getItem("minegram_story_v2") || "[]"
          );

        if(Array.isArray(old) && old.length){

          const converted = old.map(function(x){

            return {
              id:x.id,
              userId:"",
              username:getLocalUsername() || "minegram",
              displayName:getLocalUsername() || "minegram",
              avatar:"",
              media:x.data,
              type:x.type || "",
              createdAt:Number(x.createdAt) || Date.now(),
              commentsEnabled:x.commentsEnabled !== false
            };

          });

          stories = converted;

          cleanStories();
          buildStoryGroups();
          renderStoryBar();

        }

      }catch(e){}

    }finally{

      loadingStories = false;

    }
  }

  function buildStoryGroups(){

    const map = new Map();

    stories
      .sort(function(a,b){
        return Number(a.createdAt) - Number(b.createdAt);
      })
      .forEach(function(story){

        const key =
          story.userId ||
          story.username ||
          "minegram";

        if(!map.has(key)){

          map.set(key,{
            key:key,
            userId:story.userId,
            username:story.username,
            displayName:story.displayName,
            avatar:story.avatar,
            stories:[]
          });

        }

        map.get(key).stories.push(story);

      });

    storyGroups = Array.from(map.values());

    /*
     * Kendi hesabın ilk sırada.
     * Diğer hesaplar son Story tarihine göre sıralanıyor.
     */

    storyGroups.sort(function(a,b){

      const am = a.stories.some(isMyStory);
      const bm = b.stories.some(isMyStory);

      if(am && !bm) return -1;
      if(!am && bm) return 1;

      const ad =
        Math.max.apply(
          null,
          a.stories.map(x=>Number(x.createdAt))
        );

      const bd =
        Math.max.apply(
          null,
          b.stories.map(x=>Number(x.createdAt))
        );

      return bd - ad;

    });
  }

  async function addStory(file){

    if(!file) return;

    if(
      !/^image\//.test(file.type) &&
      !/^video\//.test(file.type)
    ){

      alert(
        "Sadece fotoğraf veya video ekleyebilirsin."
      );

      return;

    }

    const maxSize =
      100 * 1024 * 1024;

    if(file.size > maxSize){

      alert(
        "Hikaye dosyası en fazla 100 MB olabilir."
      );

      return;

    }

    try{

      const form =
        new FormData();

      /*
       * SERVER TARAFINDAKİ:
       * upload.single("story")
       *
       * ile aynı isim kullanılmalı.
       */

      form.append(
        "story",
        file,
        file.name
      );

      const result =
        await api(
          "/stories",
          {
            method:"POST",
            body:form
          }
        );

      /*
       * Başarılı yüklemeden sonra
       * sunucudaki gerçek Story'leri tekrar al.
       */

      await loadStories();

      const uploaded =
        normalizeStory(result);

      if(uploaded){

        /*
         * Yeni Story'nin grubunu bul.
         */

        const group =
          storyGroups.find(function(g){

            return (
              (uploaded.userId &&
               String(g.userId) === String(uploaded.userId)) ||

              (
                g.username &&
                uploaded.username &&
                g.username.toLowerCase() ===
                uploaded.username.toLowerCase()
              )
            );

          });

        if(group){

          openGroup(
            group,
            Math.max(
              0,
              group.stories.findIndex(
                x=>String(x.id) === String(uploaded.id)
              )
            )
          );

        }

      }

    }catch(error){

      console.error(
        "MINEGRAM STORY UPLOAD ERROR:",
        error
      );

      if(error && error.status === 401){

        alert(
          "Hikaye paylaşmak için hesabına giriş yapmalısın."
        );

      }else{

        alert(
          "Hikaye yüklenemedi: " +
          (error?.message || "Sunucu hatası")
        );

      }

    }

  }

    storyIndex =
      Math.max(

const API="/api";

/* =========================================================
   MINEGRAM TOKEN SİSTEMİ
========================================================= */

function validToken(value){

  return !!(
    value &&
    typeof value==="string" &&
    value.trim() &&
    value!=="null" &&
    value!=="undefined"
  );

}


function getMinegramToken(){

  const keys=[

    "minegram_token",
    "minegram_supabase_token",
    "minegram_access_token",

    "supabase_token",
    "access_token"

  ];


  /*
    LOCAL STORAGE
  */

  for(const key of keys){

    const value=
      localStorage.getItem(key);

    if(validToken(value)){

      return value.trim();

    }

  }


  /*
    SESSION STORAGE
  */

  for(const key of keys){

    const value=
      sessionStorage.getItem(key);

    if(validToken(value)){

      return value.trim();

    }

  }


  return null;

}

/* =========================================================
   HTML ESCAPE
========================================================= */

function esc(s=""){

  return String(s).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


/* =========================================================
   API
========================================================= */

async function api(path,opt={}){

  const controller=
    new AbortController();

  const timer=
    setTimeout(
      ()=>controller.abort(),
      12000
    );


  try{

    /*
      Her API isteğinden hemen önce
      tokenı yeniden oku.
    */

    token=
      getMinegramToken();


    const headers={
      ...(opt.headers||{}),

      ...(token
        ? {
            Authorization:
              "Bearer "+token
          }
        : {})
    };


    const response=
      await fetch(
        API+path,
        {
          ...opt,

          headers,

          signal:
            controller.signal,

          credentials:
            "same-origin",

          cache:
            "no-store"
        }
      );


    const json=
      await response
        .json()
        .catch(
          ()=>({})
        );


    if(!response.ok){

      const error=
        new Error(
          json.error ||
          json.message ||
          ("HTTP "+response.status)
        );


      error.status=
        response.status;


      throw error;

    }


    return json;

  }catch(e){

    if(
      e.name==="AbortError"
    ){

      const error=
        new Error(
          "Sunucu yanıt vermiyor."
        );

      error.status=0;

      throw error;

    }


    throw e;

  }finally{

    clearTimeout(timer);

  }

}


/* =========================================================
   TOAST
========================================================= */

function toast(text){

  const el=
    document.getElementById(
      "toast"
    );


  if(!el)return;


  el.textContent=
    text;


  el.classList.add(
    "show"
  );


  clearTimeout(
    window.__toast
  );


  window.__toast=
    setTimeout(
      ()=>el.classList.remove("show"),
      2200
    );

}

/* =========================================================
   OTURUM TEMİZLE
========================================================= */

function clearMinegramSession(){

  const keys=[

    "minegram_token",
    "minegram_supabase_token",
    "minegram_access_token",

    "supabase_token",
    "access_token",

    "minegram_refresh_token"

  ];


  for(const key of keys){

    localStorage.removeItem(key);
    sessionStorage.removeItem(key);

  }


  /*
    Kullanıcı bilgisi sadece gerçek logout/auth
    probleminde silinir.
  */

  localStorage.removeItem(
    "minegram_user"
  );

  localStorage.removeItem(
    "minegram_profile"
  );


  token=null;

  currentUser=null;

}

   LOGOUT
========================================================= */

function logout(){

  clearMinegramSession();

  showLogin();

}

/* =========================================================
   POST
========================================================= */

function renderPost(p){

  const username=
    esc(
      p.user?.username ||
      p.username ||
      "minegram"
    );


  const rawUsername=
    p.user?.username ||
    p.username ||
    "M";


  const initial=
    esc(
      String(rawUsername)
        .charAt(0)
        .toUpperCase()
    );


  const liked=
    !!p.likedByMe;


  const likes=
    Array.isArray(p.likes)
      ? p.likes.length
      : Number(p.likes||0);


  const comments=
    mergeComments(
      Array.isArray(p.comments)
        ? p.comments
        : (
          Array.isArray(p.post?.comments)
            ? p.post.comments
            : []
        ),
      p.id
    );


  let media="";


  if(p.media){

    if(
      p.mediaName &&
      /\.(mp4|webm|mov|m4v)$/i.test(
        p.mediaName
      )
    ){

      media=`

        <video
          class="post-media"
          src="${esc(p.media)}"
          controls
          playsinline
        ></video>

      `;

    }else{

      media=`

        <img
          class="post-media"
          src="${esc(p.media)}"
          loading="lazy"
          alt="Gönderi"
        >

      `;

    }

  }


  return `

    <article
      class="post"
      data-id="${esc(p.id)}"
    >

      <div class="post-head">

        <div class="avatar small">
          ${initial}
        </div>

        <div
          class="username"
          onclick="location.href='${profileUrl(username)}'"
        >
          @${username}
        </div>

        <button
          class="icon-btn more"
          onclick="openMenu(event,'${esc(p.id)}')"
          aria-label="Menü"
        >
          ⋯
        </button>

      </div>


      ${
        media
          ? `

          <div
            class="media-wrap"
            ondblclick="doubleLike('${esc(p.id)}')"
          >

            ${media}

            <div
              class="heart-pop"
              id="heart-${esc(p.id)}"
            >
              ♥
            </div>

          </div>

          `
          : ""
      }


      <div class="actions">

        <button
          class="action like ${liked?"liked":""}"
          onclick="likePost('${esc(p.id)}')"
          aria-label="Beğen"
        >

          <svg
            class="svg"
            viewBox="0 0 24 24"
          >

            <path
              d="M20.8 8.8c0 5.4-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.8A4.8 4.8 0 0 1 8 4c1.5 0 2.9.7 4 2 1.1-1.3 2.5-2 4-2a4.8 4.8 0 0 1 4.8 4.8Z"
              ${liked?'fill="currentColor"':""}
            />

          </svg>

        </button>


        <button
          class="action"
          onclick="openComments('${esc(p.id)}')"
          aria-label="Yorumlar"
        >

          <svg
            class="svg"
            viewBox="0 0 24 24"
          >

            <path
              d="M4 5h16v11H8l-4 4Z"
            />

          </svg>

        </button>


        <button
          class="action share-action"
          onclick="sharePost('${esc(p.id)}')"
          aria-label="Gönderiyi paylaş"
        >

          <svg
            class="share-plane"
            viewBox="0 0 32 24"
          >

            <path
              d="M2 2.2 29.8 12 2 21.8l4.4-8.1 13.1-1.7-13.1-1.7Z"
              fill="currentColor"
            />

          </svg>

        </button>

      </div>


      <div class="likes">
        ${likes} beğenme
      </div>


      <div class="caption">

        <b
          onclick="location.href='${profileUrl(username)}'"
        >
          @${username}
        </b>

        ${esc(p.caption||"")}

      </div>


      ${
        comments.length
          ? `

          <div
            class="comments-preview"
            onclick="openComments('${esc(p.id)}')"
          >

            ${
              comments.length>3
                ? "Tüm "+comments.length+" yorumu gör"
                : comments.map(
                    c=>`
                      <div>
                        <b>
                          @${esc(c.username||"")}
                        </b>

                        ${esc(c.text||"")}
                      </div>
                    `
                  ).join("")
            }

          </div>

          `
          : ""
      }

    </article>

  `;

}


/* =========================================================
   FEED
========================================================= */

async function loadFeed(){

  if(!feedEl)return;


  feedEl.innerHTML=`

    <div class="empty">
      Yükleniyor...
    </div>

  `;


  try{

    const result=
      await api(
        "/feed"
      );


    const posts=
      Array.isArray(result)
        ? result
        : (
          Array.isArray(result.posts)
            ? result.posts
            : (
              Array.isArray(result.data)
                ? result.data
                : []
            )
        );


    feedEl.innerHTML=
      posts.length
        ? posts.map(
            renderPost
          ).join("")
        : `

          <div class="empty">

            <strong>
              Henüz gönderi yok
            </strong>

            İlk gönderini oluştur.

          </div>

        `;


  }catch(e){

    const msg=
      String(
        e?.message||""
      );


    /*
      SADECE GERÇEK AUTH HATALARI
    */

    const isAuthError=

      e?.status===401 ||

      /unauthorized/i.test(msg) ||

      /invalid token/i.test(msg) ||

      /token expired/i.test(msg) ||

      /jwt/i.test(msg) ||

      /not authenticated/i.test(msg) ||

      /session expired/i.test(msg);


    if(isAuthError){

      clearMinegramSession();

      showLogin();

      return;

    }


    feedEl.innerHTML=`

      <div class="empty">

        <strong>
          Gönderiler yüklenemedi
        </strong>

        <small>
          ${esc(
            msg ||
            "Sunucuya bağlanılamadı."
          )}
        </small>

        <br>

        <button
          onclick="loadFeed()"
          style="
            margin-top:16px;
            padding:12px 22px;
            border:0;
            border-radius:22px;
            background:#fff;
            color:#000;
            font-weight:700;
            cursor:pointer
          "
        >
          Tekrar Dene
        </button>

      </div>

    `;


    toast(
      msg ||
      "Gönderiler yüklenemedi"
    );

  }

}


/* =========================================================
   BEĞENİ
========================================================= */

async function likePost(id){

  const article=
    document.querySelector(
      '.post[data-id="'+
      CSS.escape(String(id))+
      '"]'
    );


  const btn=
    article?.querySelector(
      ".action.like"
    );


  const path=
    btn?.querySelector(
      "path"
    );


  const likesEl=
    article?.querySelector(
      ".likes"
    );


  const wasLiked=
    !!btn?.classList.contains(
      "liked"
    );


  const nextLiked=
    !wasLiked;


  if(btn){

    btn.classList.toggle(
      "liked",
      nextLiked
    );


    if(path){

      path.setAttribute(
        "fill",
        nextLiked
          ? "currentColor"
          : "none"
      );

    }

  }


  if(likesEl){

    const current=
      parseInt(
        (likesEl.textContent||"0")
          .replace(/\D/g,""),
        10
      )||0;


    likesEl.textContent=
      Math.max(
        0,
        current+
        (nextLiked?1:-1)
      )+
      " beğenme";

  }


  try{

    const r=
      await api(
        "/posts/"+
        encodeURIComponent(id)+
        "/like",
        {
          method:"POST"
        }
      );


    if(
      btn &&
      typeof r.liked==="boolean"
    ){

      btn.classList.toggle(
        "liked",
        r.liked
      );


      if(path){

        path.setAttribute(
          "fill",
          r.liked
            ? "currentColor"
            : "none"
        );

      }

    }


    if(
      likesEl &&
      typeof r.likes==="number"
    ){

      likesEl.textContent=
        r.likes+
        " beğenme";

    }


  }catch(e){

    if(btn){

      btn.classList.toggle(
        "liked",
        wasLiked
      );


      if(path){

        path.setAttribute(
          "fill",
          wasLiked
            ? "currentColor"
            : "none"
        );

      }

    }


    if(likesEl){

      const current=
        parseInt(
          (likesEl.textContent||"0")
            .replace(/\D/g,""),
          10
        )||0;


      likesEl.textContent=
        Math.max(
          0,
          current+
          (nextLiked?-1:1)
        )+
        " beğenme";

    }


    toast(
      e.message ||
      "Beğeni işlemi başarısız"
    );

  }

}


async function doubleLike(id){

  const pop=
    document.getElementById(
      "heart-"+
      CSS.escape(String(id))
    );


  if(pop){

    pop.classList.add(
      "show"
    );


    setTimeout(
      ()=>pop.classList.remove("show"),
      650
    );

  }


  likePost(id);

}

async function sharePost(id){

  const url=
    location.origin+
    "/post.html?id="+
    encodeURIComponent(id);


  try{

    if(navigator.share){

      await navigator.share({
        title:"Minegram gönderisi",
        url

    }else{

      await navigator.clipboard.writeText(
        url

      toast(

      );

    }

  }catch(e){}

/* =========================================================
   LOCAL COMMENTS
========================================================= */

function localCommentsKey(id){

  return "minegram_comments_"+
    String(id);

}


function getLocalComments(id){

  try{

    const value=
      JSON.parse(
        localStorage.getItem(
          localCommentsKey(id)
        )||
        "[]"
      );


    return Array.isArray(value)
      ? value
      : [];

  }catch(e){

    return [];

  }

}


function saveLocalComment(id,c){

  const arr=
    getLocalComments(id);


  arr.push(c);


  localStorage.setItem(
    localCommentsKey(id),
    JSON.stringify(
      arr.slice(-100)
    )
  );

}


function mergeComments(server,id){

  const remote=
    Array.isArray(server)
      ? server
      : [];


  const local=
    getLocalComments(id);


  const all=[
    ...remote
  ];


  for(const c of local){

    const exists=
      all.some(
        x=>
          String(x.id||"")===
          String(c.id||"") ||

          (
            x.username===c.username &&
            x.text===c.text &&
            Math.abs(
              new Date(
                x.createdAt||
                x.created_at||
                0
              )-
              new Date(
                c.createdAt||
                0
              )
            )<10000
          )
      );


    if(!exists){

      all.push(c);

    }

  }


  return all;

}


/* =========================================================
   YORUM SIRALAMA
========================================================= */

function sortComments(comments){

  const arr=[
    ...(comments||[])
  ];


  if(
    currentCommentSort===
    "newest"
  ){

    return arr.sort(
      (x,y)=>
        new Date(
          y.createdAt||
          y.created_at||
          0
        )-
        new Date(
          x.createdAt||
          x.created_at||
          0
        )
    );

  }


  if(
    currentCommentSort===
    "popular"
  ){

    return arr.sort(
      (x,y)=>
        Number(
          y.likes||
          y.likeCount||
          0
        )-
        Number(
          x.likes||
          x.likeCount||
          0
        )
    );

  }


  return arr.sort(
    (x,y)=>
      new Date(
        x.createdAt||
        x.created_at||
        0
      )-
      new Date(
        y.createdAt||
        y.created_at||
        0
      )
  );

}


function renderCommentsForPost(
  comments
){

  const sorted=
    sortComments(
      comments
    );


  return sorted.length

    ? sorted
        .map(
          renderComment
        )
        .join("")

    : `

      <div class="empty">
        Henüz yorum yok.
      </div>

    `;

}


function changeCommentSort(
  value
){

  currentCommentSort=
    value;


  if(currentCommentPost){

    const all=
      getLocalComments(
        currentCommentPost
      );


    document.getElementById(
      "commentList"
    ).innerHTML=
      renderCommentsForPost(
        all

    refreshComments(false);

  }

}

/* =========================================================
   ZAMAN
========================================================= */

function relativeTime(v){

  const d=
    new Date(v);


  if(!v || isNaN(d))return "";


  let seconds=
    Math.floor(
      (Date.now()-
      d.getTime())/
      1000
    );


  if(seconds<60){

    return seconds+
      " saniye önce";

  }


  let minutes=
    Math.floor(
      seconds/60
    );


  if(minutes<60){

    return minutes+
      " dakika önce";

  }


  let hours=
    Math.floor(
      minutes/60
    );


  if(hours<24){

    return hours+
      " saat önce";

  }


  let days=
    Math.floor(
      hours/24
    );


  if(days<7){

    return days+
      " gün önce";

  }


  if(days<365){

    return Math.floor(
      days/7
    )+
    " hafta önce";

  }


  return d.toLocaleDateString(
    "tr-TR"
  );

}


/* =========================================================
   COMMENT RENDER
========================================================= */

function renderComment(c){

  const username=
    esc(
      c.username||
      c.user?.username||
      currentUser?.username||
      "minegram"
    );


  const initial=
    esc(
      username[0]
        .toUpperCase()
    );


  const liked=
    !!c.likedByMe;


  const id=
    esc(
      c.id||""
    );


  const replyCount=
    Array.isArray(c.replies)
      ? c.replies.length
      : Number(
          c.replyCount||
          0
        );


  return `

    <div
      class="comment-wrap"
      data-comment-id="${id}"
    >

      <div class="comment-row">

        <div class="avatar small">
          ${initial}
        </div>


        <div class="comment-body">

          <div
            class="comment-user"
            onclick="location.href='${profileUrl(username)}'"
          >
            @${username}
          </div>


          <div class="comment-text">
            ${esc(
              c.text||
              c.content||
              ""
            )}
          </div>


          <div class="comment-meta">

            ${relativeTime(
              c.createdAt||
              c.created_at
            )}

            &nbsp;

            <button
              class="reply-link"
              onclick="startReply('${id}','${esc(username)}')"
            >
              Yanıtla
            </button>


            ${
              replyCount
                ? `

                  &nbsp;

                  <button
                    class="reply-link reply-count-link"
                    onclick="toggleReplies('${id}')"
                  >
                    ${replyCount} yanıt
                  </button>

                `
                : ""
            }

          </div>

        </div>


        <button
          class="comment-like ${liked?"liked":""}"
          onclick="likeComment('${id}')"
        >
          ${liked?"♥":"♡"}
        </button>

      </div>


      <div
        id="replies-${id}"
        class="replies hidden"
      >

        ${
          Array.isArray(c.replies)
            ? c.replies
                .map(renderReply)
                .join("")
            : ""
        }

      </div>

    </div>

  `;

}


function renderReply(r){

  const username=
    esc(
      r.username||
      r.user?.username||
      "minegram"
    );


  return `

    <div class="reply-row">

      <div class="avatar small">
        ${esc(
          username[0]
            .toUpperCase()
        )}
      </div>


      <div>

        <b>
          @${username}
        </b>


        <div class="comment-text">
          ${esc(
            r.text||
            r.content||
            ""
          )}
        </div>


        <div class="comment-meta">

          ${relativeTime(
            r.createdAt||
            r.created_at
          )}

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   YANIT
========================================================= */

function startReply(
  id,
  username
){

  replyingTo=id;


  const input=
    document.getElementById(
      "commentInput"
    );


  if(!input)return;


  input.placeholder=
    "@"+
    username+
    " kişisine yanıt yaz...";


  input.focus();

}


function toggleReplies(id){

  document
    .getElementById(
      "replies-"+
      CSS.escape(String(id))
    )
    ?.classList
    .toggle(
      "hidden"
    );

}


/* =========================================================
   YORUM GÖNDER
========================================================= */

async function sendComment(){

  const input=
    document.getElementById(
      "commentInput"
    );


  const textValue=
    input.value.trim();


  if(
    !textValue||
    !currentCommentPost
  ){

    return;

  }


  const postId=
    currentCommentPost;


  const replyId=
    replyingTo;


  const sendButton=
    document.querySelector(
      ".comment-compose .send"
    );


  if(sendButton){

    sendButton.disabled=true;

  }


  const me=
    typeof currentUser==="object" &&
    currentUser
      ? currentUser
      : {};


  const username=
    me.username||
    me.name||
    "minegram";


  const now=
    new Date().toISOString();


  const tempId=
    "local-"+
    Date.now()+
    "-"+
    Math.random()
      .toString(36)
      .slice(2);


  const item={

    id:tempId,

    username,

    text:textValue,

    createdAt:now,

    likedByMe:false,

    local:true

  };


  if(replyId){

    const local=
      getLocalComments(
        postId
      );


    let parent=
      local.find(
        c=>
          String(c.id)===
          String(replyId)
      );


    if(parent){

      parent.replies=
        Array.isArray(
          parent.replies
        )
          ? parent.replies
          : [];


      parent.replies.push(
        item
      );


      localStorage.setItem(
        localCommentsKey(postId),
        JSON.stringify(
          local.slice(-100)
        )
      );

    }


    const wrap=
      document.querySelector(
        '.comment-wrap[data-comment-id="'+
        CSS.escape(String(replyId))+
        '"]'
      );


    const replies=
      wrap?.querySelector(
        ".replies"
      );


    if(replies){

      replies.classList.remove(
        "hidden"
      );


      replies.insertAdjacentHTML(
        "beforeend",
        renderReply(item)
      );

    }

  }else{

    saveLocalComment(
      postId,
      item
    );


    const list=
      document.getElementById(
        "commentList"
      );


    if(list){

      const empty=
        list.querySelector(
          ".empty"
        );


      if(empty){

        empty.remove();

      }


      list.insertAdjacentHTML(
        "beforeend",
        renderComment(item)
      );


      list.scrollTop=
        list.scrollHeight;

    }

  }


  input.value="";

  replyingTo=null;

  input.placeholder=
    "Bunun hakkında ne düşünüyorsun?";


  toast(
    replyId
      ? "Yanıt gönderildi"
      : "Yorum gönderildi"
  );


  try{

    let result;


    if(replyId){

      try{

        result=
          await api(
            "/comments/"+
            encodeURIComponent(replyId)+
            "/reply",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  text:textValue
                })
            }
          );

      }catch(firstError){

        result=
          await api(
            "/posts/"+
            encodeURIComponent(postId)+
            "/comments/"+
            encodeURIComponent(replyId)+
            "/reply",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  text:textValue
                })
            }
          );

      }

    }else{

      result=
        await api(
          "/posts/"+
          encodeURIComponent(postId)+
          "/comments",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                text:textValue
              })
          }
        );

    }


    const returned=
      result?.comment||
      result?.data||
      result;


    if(
      returned &&
      typeof returned==="object"
    ){

      const realId=
        returned.id;


      if(realId){

        const local=
          getLocalComments(
            postId
          );


        for(const c of local){

          if(
            String(c.id)===
            String(tempId)
          ){

            c.id=realId;

            c.local=false;

            c.username=
              returned.username||
              returned.user?.username||
              c.username;

            c.text=
              returned.text||
              c.text;

            c.createdAt=
              returned.createdAt||
              returned.created_at||
              c.createdAt;

          }


          if(
            replyId &&
            Array.isArray(c.replies)
          ){

            for(
              const reply
              of c.replies
            ){

              if(
                String(reply.id)===
                String(tempId)
              ){

                reply.id=realId;

                reply.local=false;

              }

            }

          }

        }


        localStorage.setItem(
          localCommentsKey(postId),
          JSON.stringify(
            local.slice(-100)
          )
        );

      }

    }


    refreshComments(false);

    loadFeed();


  }catch(e){

    const local=
      getLocalComments(
        postId
      );


    if(replyId){

      for(
        const c
        of local
      ){

        if(
          Array.isArray(
            c.replies
          )
        ){

          c.replies=
            c.replies.filter(
              r=>
                String(r.id)!==
                String(tempId)
            );

        }

      }

    }else{

      const filtered=
        local.filter(
          c=>
            String(c.id)!==
            String(tempId)
        );


      local.length=0;

      local.push(
        ...filtered
      );

    }


    localStorage.setItem(
      localCommentsKey(postId),
      JSON.stringify(
        local.slice(-100)
      )
    );


    if(
      currentCommentPost===
      postId
    ){

      document.getElementById(
        "commentList"
      ).innerHTML=
        renderCommentsForPost(
          local
        );

    }


    toast(
      e.message||
      "Gönderilemedi"
    );

  }finally{

    if(sendButton){

      sendButton.disabled=false;

    }

  }

}


/* =========================================================
   YORUM BEĞENİ
========================================================= */

async function likeComment(id){

  if(!id){

    toast(
      "Yorum kimliği bulunamadı"
    );

    return;

  }


  const wrap=
    document.querySelector(
      '.comment-wrap[data-comment-id="'+
      CSS.escape(String(id))+
      '"]'
    );


  const btn=
    wrap?.querySelector(
      ".comment-like"
    );


  const wasLiked=
    !!btn?.classList.contains(
      "liked"
    );


  if(btn){

    btn.classList.toggle(
      "liked",
      !wasLiked
    );


    btn.textContent=
      !wasLiked
        ? "♥"
        : "♡";

  }


  try{

    const r=
      await api(
        "/comments/"+
        encodeURIComponent(id)+
        "/like",
        {
          method:"POST"
        }
      );


    if(
      btn &&
      typeof r.liked==="boolean"
    ){

      btn.classList.toggle(
        "liked",
        r.liked
      );


      btn.textContent=
        r.liked
          ? "♥"
          : "♡";

    }


    toast(
      r.liked
        ? "Yorum beğenildi"
        : "Yorum beğenisi kaldırıldı"
    );


  }catch(e){

    if(btn){

      btn.classList.toggle(
        "liked",
        wasLiked
      );


      btn.textContent=
        wasLiked
          ? "♥"
          : "♡";

    }


    toast(
      e.message||
      "Beğeni işlemi başarısız"
    );

  }

}


/* =========================================================
   ESKİ LOGIN UYUMLULUĞU
========================================================= */

async function login(){

  try{

    const usernameInput=
      document.getElementById("lu");

    const passwordInput=
      document.getElementById("lp");


    const username=
      usernameInput?.value?.trim()||
      "";


    const password=
      passwordInput?.value||
      "";


    if(!username||!password){

      toast(
        "Kullanıcı adı ve şifre gerekli."
      );

      return;

    }


    const j=
      await api(
        "/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              username,
              password
            })
        }
      );


    /*
      Eski endpoint uyumluluğu.
    */

    const oldToken=
      j.token||
      j.access_token||
      j.accessToken||
      j.supabaseAccessToken||
      j.session?.access_token||
      j.data?.access_token||
      "";


    if(!oldToken){

      toast(
        "Giriş tokenı alınamadı."
      );

      return;

    }


    token=
      String(oldToken);


    localStorage.setItem(
      "minegram_token",
      token
    );


    localStorage.setItem(
      "minegram_supabase_token",
      token
    );


    localStorage.setItem(
      "minegram_access_token",
      token
    );


    localStorage.setItem(
      "access_token",
      token
    );


    if(j.user){

      currentUser=
        j.user;


      localStorage.setItem(
        "minegram_user",
        JSON.stringify(
          currentUser
        )
      );

    }


    showHome();

    await loadFeed();


  }catch(e){

    toast(
      e.message||
      "Giriş yapılamadı."
    );

  }

}


/* =========================================================
   ŞİFRE KURTARMA ESKİ UYUMLULUK
========================================================= */

async function forgot(){

  const value=
    prompt(
      "E-posta adresini veya kullanıcı adını gir:"
    );


  if(!value)return;


  try{

    await api(
      "/forgot",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            identifier:value
          })
      }
    );


    toast(
      "Kurtarma bağlantısı gönderildi."
    );


  }catch(e){

    toast(
      e.message||
      "Kurtarma işlemi başarısız."
    );

  }

}


/* =========================================================
   INIT
========================================================= */

async function init(){

  /*
    Tokenı yeniden al.
  */

  token=
    getMinegramToken();


  console.log(
    "[MINEGRAM] Token kontrolü:",
    token
      ? "VAR"
      : "YOK"
  );


  /*
    Kullanıcıyı localden al.
  */

  const savedUser=
    localStorage.getItem(
      "minegram_user"
    );


  if(savedUser){

    try{

      currentUser=
        JSON.parse(
          savedUser
        );

    }catch(_){

      currentUser=null;

    }

  }


  showHome();


  /*
    Token yoksa giriş.
  */

  if(!token){

    showLogin();

    return;

  }


  try{

    /*
      Gerçek sunucu oturumunu kontrol et.
    */

    const me=
      await api(
        "/me"
      );


    currentUser=
      me?.user||
      me;


    if(currentUser){

      localStorage.setItem(
        "minegram_user",
        JSON.stringify(
          currentUser
        )
      );

    }


    showHome();


    /*
      Feed.
    */

    await loadFeed();


  }catch(e){

    console.error(
      "[INDEX AUTH ERROR]",
      e
    );


    const msg=
      String(
        e?.message||
        ""
      );


    /*
      GERÇEK AUTH HATASI
    */

    const isAuthError=

      e?.status===401 ||

      /unauthorized/i.test(msg) ||

      /invalid token/i.test(msg) ||

      /token expired/i.test(msg) ||

      /jwt/i.test(msg) ||

      /not authenticated/i.test(msg) ||

      /session expired/i.test(msg);


    if(isAuthError){

      console.error(
        "[MINEGRAM] Token sunucu tarafından reddedildi."
      );


      /*
        Bu durumda gerçekten oturum geçersizdir.
      */

      clearMinegramSession();

      showLogin();

      return;

    }


    /*
      /me geçici hata verdiyse
      kullanıcıyı çıkış yaptırma.
    */

    showHome();


    if(feedEl){

      feedEl.innerHTML=`

        <div class="empty">

          <strong>
            Gönderiler şu anda yüklenemiyor
          </strong>

          <small>
            Oturumun açık.
            Sunucuya bağlanırken geçici bir sorun oluştu.
          </small>

          <br>

          <button
            onclick="loadFeed()"
            style="
              margin-top:16px;
              padding:12px 22px;
              border:0;
              border-radius:22px;
              background:#fff;
              color:#000;
              font-weight:700;
              cursor:pointer
            "
          >
            Tekrar Dene
          </button>

        </div>

      `;

    }

  }

}
