<style>
*{box-sizing:border-box}

html,body{
margin:0;
min-height:100%;
background:#000;
color:#f5f5f5;

}

body{

.app{

/* TOPBAR */
.topbar{
height:70px;
border-bottom:1px solid #202020;

align-items:center;

.logo{

.top-actions{

.icon-btn{
width:42px;
height:42px;
border:0;
background:transparent;
color:#eee;

place-items:center;

.svg{
width:23px;
height:23px;
fill:none;

}

/* STORIES */
.stories{
height:92px;
border-bottom:1px solid #202020;

align-items:center;
padding:12px 20px;

}

.story{
width:68px;
text-align:center;
font-size:10px;
color:#aaa;

.avatar{
width:58px;
height:58px;
border-radius:50%;

.avatar.small{
width:40px;
height:40px;
font-size:15px;
margin:0
}

.plus{
position:absolute;
right:-2px;
bottom:-2px;

height:19px;

/* FEED */

}

.post{

border:1px solid #171717;
border-radius:2px;
background:#000;
margin:15px 0 18px;

}

.post-head{
height:66px;
display:flex;
align-items:center;
padding:0 14px;
gap:10px;
border-bottom:1px solid #161616

.username{
font-size:14px;
font-weight:700;
cursor:pointer
}

.more{
margin-left:auto;
font-size:23px;

}

.media-wrap{
width:100%;
display:flex;
justify-content:center;

.post-media{

.heart-pop{

top:50%;

.heart-pop.show{

/* ACTIONS */

.action .svg{

/* GÖNDERİ KALBİ */

.action.like.liked .svg{

.action.like:not(.liked) .svg{

<script>

const storyInput = document.getElementById("storyInput");
const plusBtn = document.querySelector(".story .plus");

plusBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    storyInput.click();
});

storyInput.addEventListener("change", uploadStory);

async function uploadStory(e) {

    const file = e.target.files[0];
    if (!file) return;

    const fd = new FormData();
    fd.append("story", file);

    const token = localStorage.getItem("minegram_token");
    console.log("TOKEN:", token);

    const res = await fetch("/api/stories", {
        method: "POST",
        headers: {
            Authorization: `Bearer ${token}`
        },
        body: fd
    });

    const data = await res.json();
	console.log("SERVER:", data);

if (!res.ok) {
    alert(data.error || "Hikaye yüklenemedi");
    return;
}

alert("Hikaye paylaşıldı.");
}

const API='/api';

let token=
localStorage.getItem(
'minegram_token'
);

let currentUser=null;
let currentCommentPost=null;
let currentMenuPost=null;
let currentCommentSort='forYou';
let replyingTo=null;

const feedEl=
document.getElementById(
'feed'
);


/* =====================================================
   ESCAPE
===================================================== */

function esc(s=''){

return String(s).replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

}


/* =====================================================
   API
===================================================== */

async function api(
path,
opt={}
){

opt.headers={
...(opt.headers||{}),
...(token
?{Authorization:'Bearer '+token}
:{})
};

const r=
await fetch(
API+path,
opt
);

const j=
await r.json().catch(
()=>({})
);

if(!r.ok){

throw Error(
j.error||
'İşlem başarısız'
);

}

return j;

}


/* =====================================================
   TOAST
===================================================== */

function toast(t){

const e=
document.getElementById(
'toast'
);

e.textContent=t;

e.classList.add('show');

clearTimeout(
window.__toast
);

window.__toast=
setTimeout(
()=>e.classList.remove('show'),
2200
);

}


/* =====================================================
   LOGIN
===================================================== */

function showLogin(){

document
.getElementById('login')
.classList.remove('hidden');

document
.getElementById('home')
.classList.add('hidden');

document
.getElementById('bottomNav')
.classList.add('hidden');

}


function showHome(){

document
.getElementById('login')
.classList.add('hidden');

document
.getElementById('home')
.classList.remove('hidden');

document
.getElementById('bottomNav')
.classList.remove('hidden');

}


function logout(){

localStorage.removeItem(
'minegram_token'
);

token=null;

currentUser=null;

showLogin();

}


async function login(){

try{

const j=
await api(
'/login',
{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
username:lu.value,
password:lp.value
})
}
);

if(!j.token){

return toast(
'E-posta adresini doğrula, sonra giriş yap.'
);

}

token=j.token;

localStorage.setItem(
'minegram_token',
token
);

showHome();

loadFeed();

}catch(e){

toast(e.message);

}

}


async function forgot(){

const x=
prompt(
'E-posta adresini veya kullanıcı adını gir:'
);

if(!x)return;

try{

await api(
'/forgot',
{
method:'POST',
headers:{

/* =====================================================

===================================================== */

async function likePost(id){

const article=
document.querySelector(
'.post[data-id="'+
CSS.escape(String(id))+
'"]'
);

if(!article){

toast(
'Gönderi bulunamadı'
);

return;

}


const btn=
article.querySelector(
'.action.like'
);

const path=
btn?.querySelector('path');

const likesEl=
article.querySelector(
'.likes'
);


if(!btn)return;


/* Çift tıklama engelle */

if(
btn.dataset.loading==='1'
){

return;

}

btn.dataset.loading='1';


/* Eski durum */

const wasLiked=
btn.classList.contains(
'liked'
);


/* Yeni durum */

const nextLiked=
!wasLiked;


/* Ekranda hemen değiştir */

btn.classList.toggle(
'liked',
nextLiked
);

btn.dataset.liked=
nextLiked?'1':'0';


if(path){

path.setAttribute(
'fill',
nextLiked
?'currentColor'
:'none'
);

}


/* Beğeni sayısı */

if(likesEl){

const match=
(likesEl.textContent||'')
.match(/\d+/);

let count=
match
?parseInt(match[0],10)
:0;


count=
Math.max(
0,
count+
(nextLiked?1:-1)
);


likesEl.textContent=
count+' beğenme';

}


try{

const r=
await api(
'/posts/'+
encodeURIComponent(id)+
'/like',
{
method:'POST'
}
);


/*
  API liked değerini burada doğrudan
  kullanmıyoruz.

  Çünkü frontend tarafında sorun:
  API cevabının kalbi tekrar kapatmasıydı.
*/


if(
typeof r.likes==='number' &&
likesEl
){

likesEl.textContent=
r.likes+
' beğenme';

}


/* Son durumu koru */

btn.classList.toggle(
'liked',
nextLiked
);

btn.dataset.liked=
nextLiked?'1':'0';


if(path){

path.setAttribute(
'fill',
nextLiked
?'currentColor'
:'none'
);

}


}catch(e){

/* Hata olursa geri dön */

btn.classList.toggle(
'liked',
wasLiked
);

btn.dataset.liked=
wasLiked?'1':'0';


if(path){

path.setAttribute(
'fill',
wasLiked
?'currentColor'
:'none'
);

}


/* Sayıyı geri al */

if(likesEl){

const match=
(likesEl.textContent||'')
.match(/\d+/);

let count=
match
?parseInt(match[0],10)
:0;


count=
Math.max(
0,
count+
(nextLiked?-1:1)
);


likesEl.textContent=
count+' beğenme';

}


toast(
e.message||
'Beğeni işlemi başarısız'
);

}finally{

btn.dataset.loading='0';

}

}

/* =====================================================
   LOCAL COMMENTS
===================================================== */

function localCommentsKey(id){

return 'minegram_comments_'+
String(id);

}


function getLocalComments(id){

try{

const x=
JSON.parse(
localStorage.getItem(
localCommentsKey(id)
)||'[]'
);

return Array.isArray(x)
?x
:[];

}catch(e){

return [];

}

}


function saveLocalComment(
id,
c
){

const arr=
getLocalComments(id);

arr.push(c);

localStorage.setItem(
localCommentsKey(id),
JSON.stringify(
arr.slice(-100)
)
);

}


function mergeComments(
server,
id
){

const remote=
Array.isArray(server)
?server
:[];

const local=
getLocalComments(id);

const all=[
...remote
];


for(
const c of local
){

const exists=
all.some(
x=>
String(x.id||'')===
String(c.id||'')||

(
x.username===c.username&&
x.text===c.text&&
Math.abs(
new Date(
x.createdAt||
x.created_at||
0
)-
new Date(
c.createdAt||
0
)
)<10000
)
);


if(!exists){

all.push(c);

}

}


return all;

}


/* =====================================================
   COMMENT SORT
===================================================== */

function sortComments(
comments
){

const a=[
...(comments||[])
];


if(
currentCommentSort===
'newest'
){

return a.sort(
(x,y)=>
new Date(
y.createdAt||
y.created_at||
0
)-
new Date(
x.createdAt||
x.created_at||
0
)
);

}


if(
currentCommentSort===
'popular'
){

return a.sort(
(x,y)=>
Number(
y.likes||
y.likeCount||
0
)-
Number(
x.likes||
x.likeCount||
0
)
);

}


return a.sort(
(x,y)=>
new Date(
x.createdAt||
x.created_at||
0
)-
new Date(
y.createdAt||
y.created_at||
0
)
);

}

/* =====================================================
   TIME
===================================================== */

function relativeTime(v){

const d=new Date(v);

if(!v||isNaN(d))
return '';

let s=
Math.floor(
(
Date.now()-
d.getTime()
)/1000
);


if(s<60)
return s+
' saniye önce';


let m=
Math.floor(s/60);


if(m<60)
return m+
' dakika önce';


let h=
Math.floor(m/60);


if(h<24)
return h+
' saat önce';


let days=
Math.floor(h/24);


if(days<7)
return days+
' gün önce';


if(days<365)
return Math.floor(
days/7
)+' hafta önce';


return d.toLocaleDateString(
'tr-TR'
);

}

function addEmoji(

if(!input)return;


/*
  İmlecin olduğu yere emoji ekle.
*/

const start=
input.selectionStart ??
input.value.length;

const end=
input.selectionEnd ??
input.value.length;


const before=
input.value.substring(
0,
start
);

const after=
input.value.substring(
end
);


input.value=
before+
emoji+
after;


const cursorPosition=
start+
emoji.length;


input.focus();


try{

input.setSelectionRange(

cursorPosition
);

}catch(e){}

}


/* =====================================================
   SEND COMMENT
===================================================== */

async function sendComment(){

const input=
document.getElementById(
'commentInput'
);


const textValue=
input.value.trim();


if(
!textValue||
!currentCommentPost
){

return;

}


const postId=
currentCommentPost;

const replyId=
replyingTo;


const sendButton=
document.querySelector(
'.comment-compose .send'
);


if(sendButton){

sendButton.disabled=true;

}


const me=
typeof currentUser==='object'&&
currentUser
?currentUser
:{};


const username=
me.username||
me.name||
'minegram';


const now=
new Date().toISOString();


const tempId=
'local-'+
Date.now()+
'-'+
Math.random()
.toString(36)
.slice(2);


const item={

id:tempId,

username,

text:textValue,

createdAt:now,

likedByMe:false,

local:true

};


if(replyId){

const local=
getLocalComments(
postId
);


let parent=
local.find(
c=>
String(c.id)===
String(replyId)
);


if(parent){

parent.replies=
Array.isArray(
parent.replies
)
?parent.replies
:[];


parent.replies.push(
item
);


localStorage.setItem(
localCommentsKey(postId),
JSON.stringify(
local.slice(-100)
)
);

}


const wrap=
document.querySelector(
'.comment-wrap[data-comment-id="'+
CSS.escape(
String(replyId)
)+
'"]'
);


const replies=
wrap?.querySelector(
'.replies'
);


if(replies){

replies.classList.remove(
'hidden'
);

replies.insertAdjacentHTML(
'beforeend',
renderReply(item)
);

}

}else{

saveLocalComment(
postId,
item
);


const list=
document.getElementById(
'commentList'
);


if(list){

const empty=
list.querySelector(
'.empty'
);


if(empty){

empty.remove();

}


list.insertAdjacentHTML(
'beforeend',
renderComment(item)
);


list.scrollTop=
list.scrollHeight;

}

}


input.value='';

replyingTo=null;

input.placeholder=
'Bunun hakkında ne düşünüyorsun?';


toast(
replyId
?'Yanıt gönderildi'
:'Yorum gönderildi'
);


try{

let result;


if(replyId){

try{

result=
await api(
'/comments/'+
encodeURIComponent(
replyId
)+
'/reply',
{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
text:textValue
})
}
);

}catch(firstError){

result=
await api(
'/posts/'+
encodeURIComponent(
postId
)+
'/comments/'+
encodeURIComponent(
replyId
)+
'/reply',
{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
text:textValue
})
}
);

}

}else{

result=
await api(
'/posts/'+
encodeURIComponent(
postId
)+
'/comments',
{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
text:textValue
})
}
);

}


const returned=
result?.comment||
result?.data||
result;


if(
returned &&
typeof returned==='object'
){

const realId=
returned.id;


if(realId){

const local=
getLocalComments(
postId
);


for(
const c of local
){

if(
String(c.id)===
String(tempId)
){

c.id=realId;

c.local=false;

c.username=
returned.username||
returned.user?.username||
c.username;

c.text=
returned.text||
c.text;

c.createdAt=
returned.createdAt||
returned.created_at||
c.createdAt;

}

}


localStorage.setItem(
localCommentsKey(postId),
JSON.stringify(
local.slice(-100)
)
);

}

}


refreshComments(false);

loadFeed();


}catch(e){

const local=
getLocalComments(
postId
);


if(replyId){

for(
const c of local
){

if(
Array.isArray(
c.replies
)
){

c.replies=
c.replies.filter(
r=>
String(r.id)!==
String(tempId)
);

}

}

}else{

const filtered=
local.filter(
c=>
String(c.id)!==
String(tempId)
);


local.length=0;

local.push(
...filtered
);

}


localStorage.setItem(
localCommentsKey(postId),
JSON.stringify(
local.slice(-100)
)
);


if(
currentCommentPost===
postId
){

document.getElementById(
'commentList'
).innerHTML=
renderCommentsForPost(
local
);

}


toast(
e.message||
'Gönderilemedi'
);


}finally{

if(sendButton){

sendButton.disabled=false;

}

}

}


/* =====================================================
   YORUM BEĞENİSİ
===================================================== */

async function likeComment(id){

if(!id){

toast(
'Yorum kimliği bulunamadı'
);

return;

}


/*
  comment-wrap üzerinde data-comment-id var.
*/

const wrap=
document.querySelector(
'.comment-wrap[data-comment-id="'+
CSS.escape(
String(id)
)+
'"]'
);


const btn=
wrap?.querySelector(
'.comment-like'
);


if(!btn)return;


if(
btn.dataset.loading==='1'
){

return;

}

btn.dataset.loading='1';


const wasLiked=
btn.classList.contains(
'liked'
);


const nextLiked=
!wasLiked;


/* Hemen değiştir */

btn.classList.toggle(
'liked',
nextLiked
);


btn.dataset.commentLiked=
nextLiked?'1':'0';


btn.textContent=
nextLiked
?'♥'
:'♡';


try{

await api(
'/comments/'+
encodeURIComponent(id)+
'/like',
{
method:'POST'
}
);


/*
  API cevabını doğrudan kullanmıyoruz.
  Böylece yanlış liked cevabı kalbi bozmaz.
*/

btn.classList.toggle(
'liked',
nextLiked
);

btn.dataset.commentLiked=
nextLiked?'1':'0';

btn.textContent=
nextLiked
?'♥'
:'♡';


toast(
nextLiked
?'Yorum beğenildi'
:'Yorum beğenisi kaldırıldı'
);


}catch(e){

/* Hata varsa geri dön */

btn.classList.toggle(
'liked',
wasLiked
);

btn.dataset.commentLiked=
wasLiked?'1':'0';

btn.textContent=
wasLiked
?'♥'
:'♡';


toast(
e.message||
'Yorum beğenisi işlemi başarısız'
);


}finally{

btn.dataset.loading='0';

}

}
