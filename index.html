<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Minegram - Ana Sayfa</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#000;
  color:#f5f5f5;
  font-family:Arial,Helvetica,sans-serif
}

body{
  overflow-x:hidden;
  padding-bottom:76px
}

.app{
  min-height:100vh;
  background:#000
}

.topbar{
  height:70px;
  border-bottom:1px solid #202020;
  display:flex;
  align-items:center;
  padding:0 22px;
  position:sticky;
  top:0;
  background:#000;
  z-index:50
}

.logo{
  font-size:22px;
  font-weight:700
}

.top-actions{
  margin-left:auto;
  display:flex;
  gap:6px
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:#eee;
  display:grid;
  place-items:center;
  cursor:pointer
}

.svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

.stories{
  height:92px;
  border-bottom:1px solid #202020;
  display:flex;
  align-items:center;
  padding:12px 20px;
  overflow:hidden
}

.story{
  width:68px;
  text-align:center;
  font-size:10px;
  color:#aaa;
  flex:none
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#3f91cc;
  display:grid;
  place-items:center;
  font-size:21px;
  color:#eee;
  margin:auto;
  position:relative;
  overflow:visible
}

/* Hikaye */
.story{cursor:pointer;user-select:none;position:relative;overflow:visible}
.story:active{transform:scale(.96)}

/* HİKAYEN: tek, ince kırmızı halka.
   Halka avatarın tam içinde kalır; dışarı taşmaz ve + butonunu kapatmaz. */
#myStory.has-new-story #storyAvatar{
  border:2px solid #e53935 !important;
  box-sizing:border-box !important;
  box-shadow:none !important;
  overflow:visible !important;
}

/* + butonu halkanın DIŞINDA kalır. */
#myStory.has-new-story #storyAvatar .story-image{
  width:54px !important;
  height:54px !important;
  border-radius:50%;
  object-fit:cover;
  display:block;
}

/* + sadece kendi küçük alanında kalsın ve halkanın üstünde olsun. */
#myStory .plus{
  right:-4px !important;
  bottom:-4px !important;
  z-index:30 !important;
}

.story-image{width:58px;height:58px;border-radius:50%;object-fit:cover;display:block}

.story-viewer{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:9999;display:none;align-items:center;justify-content:center}
.story-viewer.open{display:flex}
.story-stage{position:relative;width:min(100vw,520px);height:100vh;display:flex;align-items:center;justify-content:center}
.story-media{max-width:100%;max-height:100%;object-fit:contain}
.story-close{position:absolute;top:18px;right:18px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:30px;cursor:pointer;z-index:3}
.story-prev,.story-next{position:absolute;top:0;bottom:0;width:35%;border:0;background:transparent;color:transparent;cursor:pointer;z-index:2}
.story-prev{left:0}.story-next{right:0}
.story-progress{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:4}
.story-progress span{height:3px;flex:1;background:rgba(255,255,255,.35);border-radius:10px;overflow:hidden;position:relative}.story-progress span .story-progress-fill{display:block;height:100%;width:0%;background:#fff;border-radius:10px;transform-origin:left center}.story-progress span.done .story-progress-fill{width:100%}


.story-more{position:absolute;top:18px;right:68px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:28px;cursor:pointer;z-index:5}
.story-header{position:absolute;top:44px;left:12px;right:150px;z-index:12;display:flex;align-items:center;gap:8px;padding-right:8px;pointer-events:auto;cursor:pointer}.story-header-avatar{width:36px;height:36px;border-radius:50%;background:#2D7FF9;color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700;flex:none;overflow:hidden}.story-header-info{display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.15}.story-header-user{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.story-header-time{font-size:10px;color:rgba(255,255,255,.85);white-space:nowrap;margin-top:2px}
.story-more-menu{display:none;position:absolute;left:0;right:0;bottom:0;width:100%;max-height:78vh;overflow-y:auto;background:rgba(0,0,0,.96);border-top:1px solid rgba(255,255,255,.10);border-radius:18px 18px 0 0;padding:14px;z-index:20;box-shadow:0 -12px 35px rgba(0,0,0,.65)}
.story-more-menu.open{display:block}
.story-more-menu:before{content:"";display:block;width:42px;height:4px;margin:0 auto 14px;border-radius:99px;background:#555}
.story-more-menu button{display:block;width:100%;height:42px;min-height:42px;margin:0 0 4px;padding:0 10px;border:0;border-radius:12px;background:transparent;color:#64B5F6;font-size:14px;font-weight:500;text-align:center;cursor:pointer;transition:.15s}
.story-more-menu button:last-child{margin-bottom:0}
.story-more-menu button:active{transform:scale(.99);opacity:.9}
.story-menu-primary{height:46px!important;min-height:46px!important;border:0!important;border-radius:24px!important;background:#64B5F6!important;color:#17366B!important;font-weight:500!important;text-align:center!important}
.story-menu-outline{border:0;background:transparent;color:#64B5F6}
.story-menu-text{border:0;background:transparent;color:#64B5F6}
.story-more-menu .danger{color:#ff5b5b}
.story-more-menu .danger:active{background:#1b0808}
.story-viewer.story-paused .story-media{opacity:.98}


/* STORY GÖRÜNTÜLEYENLER - ANDROID UYUMLU */
.story-viewers-modal{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:10050;display:none;color:#fff}
.story-viewers-modal.open{display:flex;align-items:stretch;justify-content:center}
.story-viewers-sheet{width:min(520px,100vw);height:100%;background:#0B0F14;display:flex;flex-direction:column;overflow:hidden;transform:translateY(0);transition:transform .2s ease}
.story-viewers-preview{height:215px;flex:none;background:#1B1D22;position:relative;display:flex;align-items:center;justify-content:center}
.story-viewers-preview-media{width:125px;height:175px;object-fit:cover;border-radius:14px;background:#000;display:block}
.story-viewers-camera{position:absolute;right:24px;top:50%;transform:translateY(-50%);width:82px;height:82px;border-radius:12px;background:#000;border:0;color:#fff;display:grid;place-items:center;cursor:pointer}
.story-viewers-camera svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.story-viewers-close{position:absolute;right:12px;top:18px;width:42px;height:42px;border:0;background:transparent;color:#fff;font-size:30px;cursor:pointer}
.story-viewers-progress{position:absolute;left:10px;right:10px;bottom:10px;height:3px;display:flex;gap:4px}
.story-viewers-progress span{height:3px;flex:1;background:#666;border-radius:99px}
.story-viewers-progress span.done,.story-viewers-progress span.active{background:#fff}
.story-viewers-tabs{height:60px;flex:none;border-bottom:1px solid #262B33;display:flex;align-items:stretch}
.story-viewers-tab{flex:1;border:0;background:transparent;color:#777;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.story-viewers-tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.story-viewers-tab.active{color:#fff}
.story-viewers-tab.people.active{color:#42A5F5}
.story-viewers-tab .tab-underline{width:64px;height:2px;margin-top:4px;background:transparent}
.story-viewers-tab.active .tab-underline{background:#fff}
.story-viewers-tab.people.active .tab-underline{background:#2196F3}
.story-viewers-count{font-weight:700;margin-left:6px}
.story-viewers-title{padding:12px 18px;color:#fff;font-size:20px;font-weight:700;flex:none}
.story-viewers-list{flex:1;overflow-y:auto;padding-bottom:18px}
.story-viewer-row{display:flex;align-items:center;width:100%;padding:8px 18px;gap:14px}
.story-viewer-avatar-wrap{position:relative;width:60px;height:60px;flex:none}
.story-viewer-avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#3f91cc;display:grid;place-items:center;color:#eee;font-size:20px;font-weight:700;overflow:hidden}
.story-viewer-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.story-viewer-heart{position:absolute;right:-2px;bottom:-2px;width:19px;height:19px;border-radius:50%;background:#fff;color:#ff00a8;display:grid;place-items:center;font-size:12px;line-height:1}
.story-viewer-info{flex:1;min-width:0}
.story-viewer-name{color:#fff;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-viewer-sub{color:#888;font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-viewer-action{width:42px;height:42px;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;font-size:24px}
.story-viewer-action svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.story-viewers-empty{flex:1;display:grid;place-items:center;color:#888;font-size:15px;text-align:center;padding:24px}
.story-viewers-stats{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:24px}
.story-viewers-stats svg{width:56px;height:56px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.story-viewers-stats strong{font-size:22px}
.story-viewers-stats span{color:#888;text-align:center}
@media(max-width:699px){.story-viewers-sheet{width:100vw}.story-viewers-preview{height:215px}.story-viewers-preview-media{width:125px;height:175px}}

.avatar.small{
  width:40px;
  height:40px;
  font-size:15px;
  margin:0
}

/* GÖNDERİ AVATARINDA AKTİF/YENİ STORY HALKASI */
.post-head .avatar.small.post-story-new{
  outline:2px solid #e53935 !important;
  outline-offset:3px;
  position:relative;
  z-index:20;
  cursor:pointer;
}

.post-head .avatar.small.post-story-avatar{
  cursor:pointer;
}

.plus{
  position:absolute;
  right:-2px;
  bottom:-2px;
  width:19px;
  height:19px;
  border-radius:50%;
  background:#eee;
  color:#111;
  display:grid;
  place-items:center;
  font-weight:bold
}

.feed{
  width:min(680px,100%);
  margin:0 auto
}

.post{
  width:100%;
  border:1px solid #171717;
  border-radius:2px;
  background:#000;
  margin:15px 0 18px;
  overflow:hidden
}

.post-head{
  height:66px;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:10px;
  border-bottom:1px solid #161616
}

.username{
  font-size:14px;
  font-weight:700;
  cursor:pointer
}

.more{
  margin-left:auto;
  font-size:23px;
  line-height:1;
  color:#eee
}

.media-wrap{
  width:100%;
  display:flex;
  justify-content:center;
  background:#080808;
  position:relative;
  overflow:hidden
}

.post-media{
  display:block;
  width:100%;
  max-height:610px;
  object-fit:contain;
  background:#080808;
  cursor:pointer
}

.heart-pop{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.55);
  font-size:92px;
  color:#ff1744;
  opacity:0;
  pointer-events:none;
  text-shadow:0 3px 18px #000;
  transition:.18s
}

.heart-pop.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1)
}

.actions{
  height:50px;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:6px
}

.action{
  height:42px;
  min-width:42px;
  border:0;
  background:transparent;
  color:#eee;
  display:flex;
  align-items:center;
  gap:5px;
  padding:0 5px;
  cursor:pointer;
  font-size:14px
}

.action .svg{
  width:25px;
  height:25px
}

.action.like.liked{
  color:#ed1b3a
}

.share-action{
  margin-left:auto
}

.share-plane{
  width:30px;
  height:23px;
  display:block;
  fill:currentColor
}

.likes{
  font-size:14px;
  font-weight:700;
  padding:0 14px;
  margin-top:-2px
}

.caption{
  font-size:14px;
  line-height:1.45;
  padding:7px 14px 14px
}

.caption b{
  cursor:pointer
}

.comments-preview{
  padding:0 14px 12px;
  color:#999;
  font-size:13px;
  cursor:pointer
}

.empty{
  padding:110px 20px;
  text-align:center;
  color:#999
}

.empty strong{
  display:block;
  color:#eee;
  font-size:16px;
  margin-bottom:7px
}

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  background:#121018;
  border-top:1px solid #201d27;
  display:flex;
  z-index:100;
  padding:5px 8px env(safe-area-inset-bottom)
}

.nav a{
  flex:1;
  color:#ddd;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:9px
}

.nav-icon{
  width:45px;
  height:32px;
  border-radius:18px;
  display:grid;
  place-items:center
}

.nav a.active .nav-icon{
  background:#3b3150
}

.nav .svg{
  width:21px;
  height:21px
}

.hidden{
  display:none!important
}

.menu-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  z-index:200;
  display:none
}

.menu-backdrop.open{
  display:block
}

.post-menu{
  position:absolute;
  right:12px;
  top:78px;
  width:285px;
  background:#211f27;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 10px 35px #000
}

.menu-item{
  height:62px;
  padding:0 22px;
  display:flex;
  align-items:center;
  gap:18px;
  color:#f5f5f5;
  font-size:17px;
  border:0;
  background:transparent;
  width:100%;

}

.menu-item:hover{
  background:#2a2731
}

.menu-item.danger{
  color:#ff5267
}

.menu-item .svg{

}

.toast{

  left:50%;

.toast.show{
  opacity:1
}

.comments-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  z-index:250;
  display:none;
  align-items:flex-end
}

.comments-modal.open{
  display:flex
}

.comments-sheet{
  width:min(680px,100%);
  height:min(78vh,720px);
  margin:0 auto;
  background:#171b1e;

  flex-direction:column;

}

.sheet-head{
  height:88px;

  border-bottom:1px solid #25292c;
  display:flex;

}

.sort{

.sort-select{

.comment-list{

.comment-row{

.comment-body{

</div>

<script>
/* =========================================================
   MINEGRAM HİKAYE SİSTEMİ
   ANDROID + WEBSITE + SUPABASE SENKRON
========================================================= */

(function(){

  let stories=[];
  let storyGroups=[];
  let storyIndex=0;
  let storyGroupIndex=0;
  let storyTimer=null;
  let storyVideo=null;

  /* =======================================================
     FIREBASE STORY SİSTEMİ
     Android uygulaması ile aynı Firestore yapısı:
     users/{storyId}

     Android'in yazdığı alanlar:
       id, username, usernameLower, base64, mediaType, createdAt
  ======================================================= */

  const MINEGRAM_FIREBASE_API_KEY =
    "AIzaSyBgJjz0LOWY2DO55h3sxsovBIlBOGjJwIo";

  const MINEGRAM_FIREBASE_PROJECT =
    "mim-ea133";

  const MINEGRAM_FIREBASE_DB =
    "(default)";

  const MINEGRAM_STORY_MAX_AGE =
    24 * 60 * 60 * 1000;

  const MINEGRAM_STORY_MAX_BYTES =
    450000;

  async function getFirebaseStoryToken(){

    const cached =
      sessionStorage.getItem(
        "minegram_firebase_story_token"
      );

    if(
      cached &&
      cached!=="null" &&
      cached!=="undefined"
    ){
      return cached;
    }

    const response =
      await fetch(
        "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" +
        encodeURIComponent(
          MINEGRAM_FIREBASE_API_KEY
        ),
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            returnSecureToken:true
          })
        }
      );

    const json =
      await response
        .json()
        .catch(()=>({}));

    if(
      !response.ok ||
      !json.idToken
    ){
      throw new Error(
        json.error?.message ||
        "Firebase oturumu açılamadı."
      );
    }

    sessionStorage.setItem(
      "minegram_firebase_story_token",
      json.idToken
    );

    return json.idToken;
  }


  async function firebaseStoryRequest(
    url,
    options={}
  ){

    const idToken =
      await getFirebaseStoryToken();

    const headers={
      ...(options.headers||{}),
      Authorization:
        "Bearer " + idToken
    };

    let response =
      await fetch(
        url,
        {
          ...options,
          headers,
          cache:"no-store"
        }
      );

    /*
      Anonim Firebase token süresi dolduysa
      bir kere yenisini alıp tekrar dene.
    */
    if(
      response.status===401 ||
      response.status===403
    ){

      sessionStorage.removeItem(
        "minegram_firebase_story_token"
      );

      const freshToken =
        await getFirebaseStoryToken();

      response =
        await fetch(
          url,
          {
            ...options,
            headers:{
              ...(options.headers||{}),
              Authorization:
                "Bearer " + freshToken
            },
            cache:"no-store"
          }
        );

    }

    const json =
      await response
        .json()
        .catch(()=>({}));

    if(!response.ok){

      const message =
        json.error?.message ||
        json.error ||
        ("HTTP " + response.status);

      const error =
        new Error(
          String(message)
        );

      error.status =
        response.status;

      throw error;
    }

    return json;
  }


  function firestoreString(value){
    return {
      stringValue:
        String(value ?? "")
    };
  }


  function firestoreInteger(value){
    return {
      integerValue:
        String(
          Math.round(
            Number(value)||0
          )
        )
    };
  }


  function firestoreDocFields(data){

    return {
      id:
        firestoreString(data.id),

      username:
        firestoreString(data.username),

      usernameLower:
        firestoreString(
          String(
            data.username||""
          ).toLowerCase()
        ),

      base64:
        firestoreString(data.base64),

      mediaType:
        firestoreString(
          data.mediaType ||
          "image/jpeg"
        ),

      createdAt:
        firestoreInteger(
          data.createdAt
        ),

      type:
        firestoreString(
          data.type ||
          "public_story"
        ),

      sender:
        firestoreString(
          data.sender ||
          data.username
        ),

      recipient:
        firestoreString(
          data.recipient ||
          "__minegram_public_stories__"
        )
    };
  }


  function firestoreField(
    fields,
    name
  ){

    const field =
      fields?.[name];

    if(!field)
      return null;

    if(
      Object.prototype.hasOwnProperty.call(
        field,
        "stringValue"
      )
    ){
      return field.stringValue;
    }

    if(
      Object.prototype.hasOwnProperty.call(
        field,
        "integerValue"
      )
    ){
      return Number(
        field.integerValue
      );
    }

    if(
      Object.prototype.hasOwnProperty.call(
        field,
        "doubleValue"
      )
    ){
      return Number(
        field.doubleValue
      );
    }

    return null;
  }


  function firestoreStoryUrl(username, storyId=""){
    const base =
      "https://firestore.googleapis.com/v1/projects/" + encodeURIComponent(MINEGRAM_FIREBASE_PROJECT) +
      "/databases/" + encodeURIComponent(MINEGRAM_FIREBASE_DB) +
      "/documents/users";
    return storyId ? base + "/" + encodeURIComponent(storyId) : base;
  }

  function firestoreStoryToMineStory(
    doc,
    fallbackUsername
  ){

    const fields =
      doc?.fields || {};

    const id =
      firestoreField(
        fields,
        "id"
      ) ||
      doc?.name?.split("/")?.pop() ||
      "";

    const username =
      firestoreField(
        fields,
        "username"
      ) ||
      fallbackUsername ||
      "";

    const base64 =
      firestoreField(
        fields,
        "base64"
      ) ||
      "";

    const mediaType =
      firestoreField(
        fields,
        "mediaType"
      ) ||
      "image/jpeg";

    const createdAt =
      Number(
        firestoreField(
          fields,
          "createdAt"
        ) || 0
      );

    if(
      !id ||
      !username ||
      !base64 ||
      !createdAt
    ){
      return null;
    }

    if(
      Date.now()-createdAt >=
      MINEGRAM_STORY_MAX_AGE
    ){
      return null;
    }

    return {
      id:String(id),
      userId:String(username),
      username:String(username)
        .replace(/^@/,"")
        .trim(),
      displayName:String(username),
      avatar:"",
      media:
        "data:" +
        mediaType +
        ";base64," +
        base64,
      type:String(mediaType),
      createdAt,
      commentsEnabled:true
    };
  }


  async function firebaseListStoriesForUser(
    username
  ){

    const clean =
      String(username||"")
        .replace(/^@/,"")
        .trim();

    if(!clean)
      return [];

    const result =
      await firebaseStoryRequest(
        firestoreStoryUrl(clean) +
        "?pageSize=100",
        {
          method:"GET"
        }
      );

    const docs =
      Array.isArray(
        result?.documents
      )
        ? result.documents
        : [];

    return docs
      .map(
        doc =>
          firestoreStoryToMineStory(
            doc,
            clean
          )
      )
      .filter(Boolean);
  }


  async function firebaseGetFollowingUsers(){

    const me =
      getLocalUsername();

    if(!me)
      return [];

    const url =
      "https://firestore.googleapis.com/v1/projects/" +
      encodeURIComponent(
        MINEGRAM_FIREBASE_PROJECT
      ) +
      "/databases/" +
      encodeURIComponent(
        MINEGRAM_FIREBASE_DB
      ) +
      "/documents/followRelations?pageSize=300";

    try{

      const result =
        await firebaseStoryRequest(
          url,
          {
            method:"GET"
          }
        );

      const docs =
        Array.isArray(
          result?.documents
        )
          ? result.documents
          : [];

      const names=[];

      docs.forEach(doc=>{

        const fields =
          doc?.fields || {};

        const follower =
          String(
            firestoreField(
              fields,
              "followerUsername"
            ) || ""
          ).trim();

        const following =
          String(
            firestoreField(
              fields,
              "followingUsername"
            ) || ""
          ).trim();

        if(
          follower &&
          following &&
          follower.toLowerCase()===
          me.toLowerCase()
        ){
          names.push(
            following
          );
        }

      });

      return [
        ...new Map(
          names.map(
            name=>[
              name.toLowerCase(),
              name
            ]
          )
        ).values()
      ];

    }catch(error){

      console.warn(
        "FOLLOWING STORY LISTESİ:",
        error
      );

      /*
        Takip ilişkileri okunamazsa eski
        local following listesini kullan.
      */
      try{

        const local=
          JSON.parse(
            localStorage.getItem(
              "minegram_following"
            ) || "[]"
          );

        if(Array.isArray(local))
          return local;

      }catch(e){}

      return [];
    }
  }


  async function firebaseLoadMinegramStories(){
    const url = firestoreStoryUrl("") + "?pageSize=500";
    const json = await firebaseStoryRequest(url, {method:"GET"});
    const docs = Array.isArray(json?.documents) ? json.documents : [];
    const now = Date.now();
    return docs.map(doc => {
      const fields = doc.fields || {};
      const type = firestoreField(fields,"type") || "";
      if(type !== "public_story") return null;
      const story = firestoreStoryToMineStory(doc, firestoreField(fields,"username") || "");
      if(!story || now - Number(story.createdAt) >= MINEGRAM_STORY_MAX_AGE) return null;
      return story;
    }).filter(Boolean).sort((a,b)=>Number(a.createdAt)-Number(b.createdAt));
  }

  function makeStoryId(
    username
  ){

    return (
      "story_" +
      String(username)
        .toLowerCase()
        .replace(/[^a-z0-9_-]/g,"_") +
      "_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,10)
    );
  }


  function blobToBase64(
    blob
  ){

    return new Promise(
      (resolve,reject)=>{

        const reader =
          new FileReader();

        reader.onload=
          ()=>{
            const value =
              String(
                reader.result||""
              );

            resolve(
              value.includes(",")
                ? value.split(",")[1]
                : value
            );
          };

        reader.onerror=
          ()=>reject(
            new Error(
              "Dosya okunamadı."
            )
          );

        reader.readAsDataURL(
          blob
        );
      }
    );
  }


  async function prepareStoryFile(
    file
  ){

    if(
      /^video\//i.test(
        file.type
      )
    ){

      if(
        file.size >
        MINEGRAM_STORY_MAX_BYTES
      ){
        throw new Error(
          "Video hikayesi 450 KB sınırını aşamaz."
        );
      }

      return {
        base64:
          await blobToBase64(file),
        mediaType:
          file.type ||
          "video/mp4"
      };
    }

    if(
      !/^image\//i.test(
        file.type
      )
    ){
      throw new Error(
        "Sadece fotoğraf veya video ekleyebilirsin."
      );
    }

    /*
      Android tarafındaki sisteme benzer:
      maksimum 720 px ve yaklaşık 450 KB.
    */
    const bitmap =
      await new Promise(
        (resolve,reject)=>{

          const img =
            new Image();

          const url =
            URL.createObjectURL(
              file
            );

          img.onload=
            ()=>{
              URL.revokeObjectURL(
                url
              );
              resolve(img);
            };

          img.onerror=
            ()=>{
              URL.revokeObjectURL(
                url
              );
              reject(
                new Error(
                  "Fotoğraf okunamadı."
                )
              );
            };

          img.src=url;
        }
      );

    const maxSide=720;

    const scale =
      Math.min(
        1,
        maxSide /
        Math.max(
          bitmap.width,
          bitmap.height
        )
      );

    const width =
      Math.max(
        1,
        Math.round(
          bitmap.width*scale
        )
      );

    const height =
      Math.max(
        1,
        Math.round(
          bitmap.height*scale
        )
      );

    const canvas =
      document.createElement(
        "canvas"
      );

    canvas.width=width;
    canvas.height=height;

    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha:false
        }
      );

    ctx.drawImage(
      bitmap,
      0,
      0,
      width,
      height
    );

    let quality=0.78;
    let blob=
      await new Promise(
        resolve =>
          canvas.toBlob(
            resolve,
            "image/jpeg",
            quality
          )
      );

    while(
      blob &&
      blob.size >
      MINEGRAM_STORY_MAX_BYTES &&
      quality>0.35
    ){

      quality -= 0.07;

      blob =
        await new Promise(
          resolve =>
            canvas.toBlob(
              resolve,
              "image/jpeg",
              quality
            )
        );
    }

    if(
      !blob ||
      blob.size >
      MINEGRAM_STORY_MAX_BYTES
    ){
      throw new Error(
        "Fotoğraf 450 KB altına küçültülemedi."
      );
    }

    return {
      base64:
        await blobToBase64(
          blob
        ),
      mediaType:
        "image/jpeg"
    };
  }


  async function firebaseUploadStory(
    file
  ){

    const username =
      getLocalUsername();

    if(!username){
      throw new Error(
        "Giriş yapan kullanıcı bulunamadı."
      );
    }

    const prepared =
      await prepareStoryFile(
        file
      );

    const createdAt =
      Date.now();

    const id =
      makeStoryId(
        username
      );

    const fields =
      firestoreDocFields({
        id,
        username,
        base64:
          prepared.base64,
        mediaType:
          prepared.mediaType,
        createdAt
      });

    const url =
      firestoreStoryUrl(
        username
      ) +
      "?documentId=" +
      encodeURIComponent(id);

    const result =
      await firebaseStoryRequest(
        url,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            fields
          })
        }
      );

    const uploaded =
      firestoreStoryToMineStory(
        result,
        username
      );

    if(!uploaded){
      throw new Error(
        "Firebase hikaye kaydı okunamadı."
      );
    }

    return uploaded;
  }


  async function firebaseDeleteStory(
    story
  ){

    if(!story)
      return;

    const username =
      String(
        story.username||""
      ).trim();

    const id =
      String(
        story.id||""
      ).trim();

    if(!username || !id)
      return;

    await firebaseStoryRequest(
      firestoreStoryUrl(
        username,
        id
      ),
      {
        method:"DELETE"
      }
    );
  }

  let loadingStories=false;

  const STORY_AGE=24*60*60*1000;


  /* =======================================================
     STORY NORMALIZE
  ======================================================= */

  function normalizeStory(s){

    if(!s)return null;

    const profile=
      s.profiles ||
      s.profile ||
      {};

    const user=
      s.user ||
      {};

    const media=
      s.media_url ||
      s.mediaUrl ||
      s.media ||
      s.url ||
      "";

    if(!media)return null;

    const username=
      profile.username ||
      profile.user_name ||
      user.username ||
      user.user_name ||
      s.username ||
      "minegram";

    const displayName=
      profile.display_name ||
      profile.displayName ||
      user.display_name ||
      user.displayName ||
      s.display_name ||
      s.displayName ||
      username;

    const avatar=
      profile.avatar_url ||
      profile.avatarUrl ||
      user.avatar_url ||
      user.avatarUrl ||
      s.avatar_url ||
      s.avatarUrl ||
      "";

    const createdAt=
      new Date(
        s.created_at ||
        s.createdAt ||
        Date.now()
      ).getTime();

    return {

      id:
        s.id ||
        (
          "story_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2)
        ),

      userId:
        s.user_id ||
        s.userId ||
        profile.id ||
        user.id ||
        "",

      username:
        String(username)
          .replace(/^@/,"")
          .trim(),

      displayName:
        displayName,

      avatar:
        avatar,

      media:
        media,

      type:
        s.media_type ||
        s.mediaType ||
        s.type ||
        "",

      createdAt:
        createdAt,

      commentsEnabled:
        s.comments_enabled !== false &&
        s.commentsEnabled !== false

    };

  }


  /* =======================================================
     STORY GRUPLARINI OLUŞTUR
     Her kullanıcı için hikayeleri tek grupta toplar.
  ======================================================= */

  function buildStoryGroups(){

    const groupsMap = new Map();

    (Array.isArray(stories) ? stories : []).forEach(function(story){

      if(!story) return;

      const userId = story.userId ? String(story.userId) : "";
      const username = String(story.username || "minegram")
        .replace(/^@/, "")
        .trim();

      const key = userId || username.toLowerCase();
      if(!key) return;

      let group = groupsMap.get(key);

      if(!group){
        group = {
          userId: story.userId || "",
          username: username,
          displayName: story.displayName || username,
          avatar: story.avatar || "",
          stories: []
        };
        groupsMap.set(key, group);
      }

      group.stories.push(story);

      if(!group.avatar && story.avatar) group.avatar = story.avatar;
      if(!group.displayName && story.displayName) group.displayName = story.displayName;
    });

    storyGroups = Array.from(groupsMap.values());
    window.__minegramStoryGroups = storyGroups;
    window.__minegramOpenStoryGroup = function(group,index){
      if(group && Array.isArray(group.stories) && group.stories.length) openGroup(group, Number(index)||0);
    };

    storyGroups.forEach(function(group){
      group.stories.sort(function(a,b){
        return Number(a.createdAt || 0) - Number(b.createdAt || 0);
      });
    });

    storyGroups.sort(function(a,b){
      const aLast = a.stories[a.stories.length - 1];
      const bLast = b.stories[b.stories.length - 1];
      return Number(bLast?.createdAt || 0) - Number(aLast?.createdAt || 0);
    });
  }


  /* =======================================================
     TEMİZLE
  ======================================================= */

  function cleanStories(){

    const limit=
      Date.now() -
      STORY_AGE;

    stories=
      stories.filter(
        s =>
          s &&
          s.media &&
          Number(s.createdAt)>limit
      );

  }


  /* =======================================================
     LOCAL KULLANICI
  ======================================================= */

  function getLocalUsername(){

    const keys=[
      "minegram_username",
      "username"
    ];

    for(const key of keys){

      const value=
        localStorage.getItem(key);

      if(value)
        return String(value)
          .replace(/^@/,"")
          .trim();

    }

    const user=
      localStorage.getItem(
        "minegram_user"
      );

    if(user){

      try{

        const obj=
          JSON.parse(user);

        return String(
          obj.username ||
          obj.user_name ||
          ""
        )
        .replace(/^@/,"")
        .trim();

      }catch(e){}

    }

    return "";

  }


  function getCurrentUserId(){

    if(
      typeof currentUser!=="undefined" &&
      currentUser
    ){

      return String(
        currentUser.id ||
        currentUser.user_id ||
        ""
      );

    }

    const user=
      localStorage.getItem(
        "minegram_user"
      );

    if(user){

      try{

        const obj=
          JSON.parse(user);

        return String(
          obj.id ||
          obj.user_id ||
          ""
        );

      }catch(e){}

    }

    return "";

  }


  function isMyStory(story){

    if(!story)return false;

    const uid=
      getCurrentUserId();

    const username=
      getLocalUsername();

    if(
      uid &&
      story.userId &&
      String(uid)===String(story.userId)
    ){

      return true;

    }

    if(
      username &&
      story.username &&
      username.toLowerCase()===
      story.username.toLowerCase()
    ){

      return true;

    }

    return false;

  }


  /* =======================================================
     SERVERDAN HİKAYELERİ AL
  ======================================================= */

  async function loadStories(){

    if(loadingStories) return;
    loadingStories=true;

    try{
      // Firebase/local eski hikayeleri KULLANMA. Tek kaynak Supabase API.
      try{ localStorage.removeItem("minegram_story_v2"); }catch(e){}

      const result = await api("/stories");
      const list = Array.isArray(result)
        ? result
        : (Array.isArray(result?.stories) ? result.stories : []);

      stories = list.map(normalizeStory).filter(Boolean);
      cleanStories();
      buildStoryGroups();
      renderStoryBar();
      if(typeof window.updateMinegramPostStoryRings === "function") window.updateMinegramPostStoryRings();

      // Yalnızca sunucudan gelen aktif hesap hikayelerini önbellekle.
      try{ localStorage.setItem("minegram_story_v2", JSON.stringify(stories)); }catch(e){}

    }catch(error){
      console.error("STORY API LOAD ERROR:", error);
      stories=[];
      buildStoryGroups();
      renderStoryBar();
    }finally{
      loadingStories=false;
    }
  }

  /* =======================================================
     ANDROID / WEB -> SERVER STORY UPLOAD
  ======================================================= */

  async function addStory(
    file,
    autoOpen=true,
    silent=false
  ){

    if(!file)
      return null;

    try{

      toast(
        "Hikaye yükleniyor..."
      );

      const formData = new FormData();
      formData.append("story", file, file.name || "story");

      const uploaded = await api("/stories", {
        method: "POST",
        body: formData
      });

      const normalizedUploaded = normalizeStory(uploaded);
      if (!normalizedUploaded) {
        throw new Error("Sunucu hikaye kaydı döndürmedi.");
      }

      stories.push(
        normalizedUploaded
      );

      cleanStories();
      buildStoryGroups();
      renderStoryBar();
      if(typeof window.updateMinegramPostStoryRings === "function") window.updateMinegramPostStoryRings();

      try{
        localStorage.setItem(
          "minegram_story_v2",
          JSON.stringify(
            stories
          )
        );
      }catch(e){}

      if(!silent){
        toast(
          "Hikaye paylaşıldı."
        );
      }

      /*
        Uygulamadaki davranış:
        yüklenen hikaye otomatik açılır.
      */
      if(autoOpen){

        const group =
          storyGroups.find(
            function(g){
              return (
                String(g.userId) ===
                  String(normalizedUploaded.userId) ||
                String(g.username).toLowerCase() ===
                  String(normalizedUploaded.username).toLowerCase()
              );
            }
          );

        if(group){

          const uploadedIndex =
            group.stories.findIndex(
              function(story){
                return (
                  String(story.id) ===
                  String(normalizedUploaded.id)
                );
              }
            );

          openGroup(
            group,
            uploadedIndex>=0
              ? uploadedIndex
              : group.stories.length-1
          );

        }

      }

      return normalizedUploaded;

    }catch(error){

      console.error(
        "STORY UPLOAD ERROR:",
        error
      );

      if(
        error?.status===401 ||
        error?.status===403
      ){

        alert(
          "Hikaye API erişimi reddedildi. Oturumunu kontrol edip tekrar dene."
        );

      }else{

        alert(
          "Hikaye yüklenemedi:\n" +
          (
            error?.message ||
            "Sunucu hatası"
          )
        );

      }

      return null;
    }
  }

  let storyProgressRaf=null;

  function stopStoryProgressAnimation(){
    if(storyProgressRaf){ cancelAnimationFrame(storyProgressRaf); storyProgressRaf=null; }
  }

  function clearTimer(){
    stopStoryProgressAnimation();

    if(storyTimer){

      clearTimeout(
        storyTimer
      );

      storyTimer=null;

    }


    if(storyVideo){

      try{
        storyVideo.pause();
      }catch(e){}

  /* =======================================================
     PROGRESS
  ======================================================= */

  function renderProgress(){
    const progress=document.getElementById("storyProgress");
    if(!progress) return;
    const group=storyGroups[storyGroupIndex];
    if(!group) return;
    progress.innerHTML=group.stories.map((_,i)=>`<span class="${i<storyIndex?"done":i===storyIndex?"active":""}"><i class="story-progress-fill"></i></span>`).join("");
    updateStoryProgressBar(0);
  }

  function updateStoryProgressBar(value){
    const progress=document.getElementById("storyProgress");
    if(!progress) return;
    const bars=progress.querySelectorAll("span");
    bars.forEach((bar,i)=>{
      const fill=bar.querySelector(".story-progress-fill");
      if(!fill) return;
      fill.style.width=i<storyIndex?"100%":i===storyIndex?`${Math.max(0,Math.min(1,value))*100}%`:"0%";
    });
  }


  /* =======================================================
     VIEWER
  ======================================================= */

  function renderViewer(){

    clearTimer();


    const viewer=
      document.getElementById(
        "storyViewer"
      );

    const wrap=
      document.getElementById(
        "storyMediaWrap"
      );

    const more=
      document.getElementById(
        "storyMore"
      );


    if(

      !wrap
    )
      return;


    const group=
      storyGroups[
        storyGroupIndex
      ];

    if(
      !group ||
      !group.stories.length
    ){

      closeStory();

      return;

    }


    const item=
      group.stories[
        storyIndex
      ];

    if(!item){

      closeStory();

      return;

    }


    viewer.classList.add(
      "open"
    );


    if(more)
      more.classList.remove(
        "open"
      );

    const deleteButton=document.getElementById("storyDeleteButton");
    if(deleteButton){
      deleteButton.style.display=isMyStory(item) ? "block" : "none";
    }

    renderProgress();

    const header=document.getElementById("storyHeader");
    if(header){
      const username=String(item.username||item.userId||"").replace(/^@/,"").trim()||"Minegram";
      const created=Number(item.createdAt||0);
      const age=Math.max(0,Date.now()-created);
      const timeText=created?new Date(created).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})+" • "+(age<60000?"şimdi":age<3600000?Math.floor(age/60000)+" dk önce":Math.floor(age/3600000)+" sa önce"):"şimdi";
      header.innerHTML=`<div class="story-header-avatar">${esc(username.charAt(0).toUpperCase())}</div><div class="story-header-info"><div class="story-header-user">@${esc(username)}</div><div class="story-header-time">${esc(timeText)}</div></div>`;
    }

    wrap.innerHTML="";


    /*
      Görüntüleyen bilgisi
    */

    const seenKey=
      "minegram_story_viewers_" +
      item.id;


    try{

      const arr=
        JSON.parse(
          localStorage.getItem(
            seenKey
          ) || "[]"
        );


      const username=
        getLocalUsername() ||
        "me";


      if(
        !arr.includes(
          username
        )
      ){

        arr.push(
          username
        );

        localStorage.setItem(
          seenKey,
          JSON.stringify(arr)
        );

      }

      try{
        localStorage.setItem("minegram_story_seen_" + item.id, "1");
      }catch(e){}

      renderStoryBar();
      if(typeof window.updateMinegramPostStoryRings === "function") window.updateMinegramPostStoryRings();

    }catch(e){}


    /*
      VIDEO
    */

    if(
      item.type &&
      item.type.startsWith(
        "video/"
      )
    ){

      const video=
        document.createElement(
          "video"
        );

      video.className=
        "story-media";

      video.src=
        item.media;

      video.autoplay=true;

      video.playsInline=true;

      video.controls=false;

      video.muted=false;

      wrap.appendChild(
        video
      );

      storyVideo=
        video;


      video.onended=
        function(){

          nextStory();

        };


      video.onerror=
        function(){

          nextStory();

        };


      video.play()
        .catch(
          function(){

            video.muted=true;

            video.play()
              .catch(()=>{});

          }
        );


    }else{

      /*
        FOTOĞRAF
      */

      const img=
        document.createElement(
          "img"
        );

      img.className=
        "story-media";

      img.src=
        item.media;

      img.alt=
        "Hikaye";

      wrap.appendChild(
        img
      );


      updateStoryProgressBar(0);
      const started=performance.now();
      const tick=()=>{
        const value=(performance.now()-started)/5000;
        updateStoryProgressBar(value);
        if(value<1) storyProgressRaf=requestAnimationFrame(tick);
      };
      storyProgressRaf=requestAnimationFrame(tick);
      storyTimer=setTimeout(nextStory,5000);

    }

  }


  /* =======================================================
     GRUP AÇ
  ======================================================= */

  function openGroup(
    group,
    index=0
  ){

    if(
      !group ||
      !group.stories ||
      !group.stories.length
    ){

      openPicker();

      return;

    }


    const indexInGroups=
      storyGroups.indexOf(
        group
      );


    if(indexInGroups<0)
      return;


    storyGroupIndex=
      indexInGroups;


    storyIndex=
      Math.max(
        0,
        Math.min(
          Number(index)||0,
          group.stories.length-1
        )
      );


    renderViewer();

  }


  /* =======================================================
     STORY KAPAT
  ======================================================= */

  window.closeStory=
    function(e){

      if(
        e &&
        e.target &&
        e.target.id!=="storyViewer"
      ){

        return;

      }


      clearTimer();


      document
        .getElementById(
          "storyViewer"
        )
        ?.classList
        .remove(
          "open"
        );


      document
        .getElementById(
          "storyMore"
        )
        ?.classList
        .remove(
          "open"
        );

  /* =======================================================
     SONRAKİ STORY
  ======================================================= */

  window.nextStory=
    function(){

      const group=
        storyGroups[
          storyGroupIndex
        ];


      if(!group)
        return;


      if(
        storyIndex<
        group.stories.length-1
      ){

        storyIndex++;

        renderViewer();

        return;

      }


      /*
        Bu kullanıcının Storyleri bitti.
        Sonraki kullanıcıya geç.
      */

      if(
        storyGroupIndex<
        storyGroups.length-1
      ){

        storyGroupIndex++;

        storyIndex=0;

        renderViewer();

        return;

      }


      closeStory();

    };


  /* =======================================================
     ÖNCEKİ STORY
  ======================================================= */

  window.previousStory=
    function(){

      const group=
        storyGroups[
          storyGroupIndex
        ];


      if(!group)
        return;


      if(storyIndex>0){

        storyIndex--;

        renderViewer();

        return;

      }


      if(storyGroupIndex>0){

        storyGroupIndex--;

        const previousGroup=
          storyGroups[
            storyGroupIndex
          ];

        storyIndex=
          previousGroup.stories.length-1;

        renderViewer();

      }

    };

      };

/* =========================================================
   MINEGRAM TOKEN SİSTEMİ
========================================================= */

function validToken(value){

  return !!(
    value &&
    typeof value==="string" &&
    value.trim() &&
    value!=="null" &&
    value!=="undefined"
  );

}


function getMinegramToken(){

  const keys=[

    "minegram_token",
    "minegram_supabase_token",
    "minegram_access_token",

    "supabase_token",
    "access_token"

  ];


  /*
    LOCAL STORAGE
  */

  for(const key of keys){

    const value=
      localStorage.getItem(key);

    if(validToken(value)){

      return value.trim();

    }

  }


  /*
    SESSION STORAGE
  */

  for(const key of keys){

    const value=
      sessionStorage.getItem(key);

    if(validToken(value)){

      return value.trim();

    }

  }


  return null;

}

/* =========================================================
   HTML ESCAPE
========================================================= */

function esc(s=""){

  return String(s).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


/* =========================================================
   API
========================================================= */

async function api(path,opt={}){

  const controller=
    new AbortController();

  const timer=
    setTimeout(
      ()=>controller.abort(),
      12000
    );


  try{

    /*
      Her API isteğinden hemen önce
      tokenı yeniden oku.
    */

    token=
      getMinegramToken();


    const headers={
      ...(opt.headers||{}),

      ...(token
        ? {
            Authorization:
              "Bearer "+token
          }
        : {})
    };


    const response=
      await fetch(
        API+path,
        {
          ...opt,

          headers,

          signal:
            controller.signal,

          credentials:
            "same-origin",

          cache:
            "no-store"
        }
      );


    const json=
      await response
        .json()
        .catch(
          ()=>({})
        );


    if(!response.ok){

      const error=
        new Error(
          json.error ||
          json.message ||
          ("HTTP "+response.status)
        );


      error.status=
        response.status;


      throw error;

    }


    return json;

  }catch(e){

    if(
      e.name==="AbortError"
    ){

      const error=
        new Error(
          "Sunucu yanıt vermiyor."
        );

      error.status=0;

      throw error;

    }


    throw e;

  }finally{

    clearTimeout(timer);

  }

}

function openMinegramPost(post){
  if(!post) return;

  const id=String(
    post.id ??
    post.postId ??
    post._id ??
    post.uuid ??
    ""
  ).trim();

  if(!id){
    toast("Gönderi kimliği bulunamadı");
    return;
  }

  try{
    sessionStorage.setItem(
      "minegram_selected_post",
      JSON.stringify(post)
    );

    const profile={
      username:post.user?.username || post.username || "minegram",
      avatar:post.user?.avatar || post.avatar || post.user?.avatar_url || "",
      displayName:post.user?.displayName || post.displayName || post.user?.display_name || "",
      verified:!!(post.user?.verified || post.verified)
    };

    sessionStorage.setItem(
      "minegram_selected_profile",
      JSON.stringify(profile)
    );
  }catch(e){}

  location.href=
    "post.html?id="+
    encodeURIComponent(id);
}

function openMinegramPostFromElement(event,element){
  if(event){
    const target=event.target;
    if(target?.closest("button,a,input,select,textarea")) return;
    if(target?.closest(".username,.comments-preview")) return;
    event.preventDefault();
    event.stopPropagation();
  }

  const id=String(element?.dataset?.id||"").trim();
  const post=(window.__minegramFeedPosts||[]).find(p=>
    String(p?.id ?? p?.postId ?? p?._id ?? p?.uuid ?? "").trim()===id
  );

  if(post) openMinegramPost(post);
}

function getMinegramStoryGroupForPost(postOrUsername, maybeUserId){
  const groups=Array.isArray(window.__minegramStoryGroups) ? window.__minegramStoryGroups : [];
  const post = (postOrUsername && typeof postOrUsername === "object") ? postOrUsername : null;
  const username=String(post ? (post.user?.username || post.username || "") : (postOrUsername || "")).replace(/^@/,"").trim().toLowerCase();
  const userId=String(post ? (post.user?.id || post.user?.userId || post.user_id || post.userId || post.ownerUid || post.ownerId || "") : (maybeUserId || "")).trim();
  return groups.find(function(g){
    const gid=String(g?.userId || "").trim();
    const gun=String(g?.username || "").replace(/^@/,"").trim().toLowerCase();
    return (userId && gid && userId===gid) || (username && gun===username);
  }) || null;
}

function hasMinegramStoryForPost(post){
  const group=getMinegramStoryGroupForPost(post);
  return !!(group && Array.isArray(group.stories) && group.stories.length);
}

function hasMinegramUnseenStoryForPost(post){
  const group=getMinegramStoryGroupForPost(post);
  if(!group || !Array.isArray(group.stories) || !group.stories.length) return false;
  return group.stories.some(function(story){
    if(!story || !story.id) return false;
    try{ return localStorage.getItem("minegram_story_seen_" + story.id) !== "1"; }catch(e){ return true; }
  });
}

function openMinegramStoryFromPostAvatar(event, element){
  if(event){ event.preventDefault(); event.stopPropagation(); }
  const username=element?.getAttribute("data-story-username") || "";
  const userId=element?.getAttribute("data-story-user-id") || "";
  const group=getMinegramStoryGroupForPost(username,userId);
  if(!group || !Array.isArray(group.stories) || !group.stories.length) return;
  if(typeof window.__minegramOpenStoryGroup === "function") window.__minegramOpenStoryGroup(group,0);
}

window.updateMinegramPostStoryRings=function(){
  document.querySelectorAll(".post-head .post-story-avatar").forEach(function(el){
    const username=el.getAttribute("data-story-username") || "";
    const userId=el.getAttribute("data-story-user-id") || "";
    const group=getMinegramStoryGroupForPost(username,userId);
    const has=!!(group && Array.isArray(group.stories) && group.stories.length);
    const unseen=has && group.stories.some(function(story){
      if(!story || !story.id) return false;
      try{ return localStorage.getItem("minegram_story_seen_" + story.id) !== "1"; }catch(e){ return true; }
    });
    el.classList.toggle("post-story-new",unseen);
    el.title=has ? "Hikayeyi aç" : "";
  });
};

function firestorePostsUrl(collection){

function firestorePostMedia(fields){

  const base64 = String(
    firestoreField(fields,"mediaBase64") ||
    firestoreField(fields,"base64") ||
    ""
  ).trim();

  const mediaType = String(
    firestoreField(fields,"mediaType") ||
    "image/jpeg"
  ).trim();

  if(base64){

    if(/^data:/i.test(base64)){
      return base64;
    }

    return "data:"+
      mediaType+
      ";base64,"+
      base64;

  }

  const uri = String(
    firestoreField(fields,"mediaUri") ||
    firestoreField(fields,"media") ||
    ""
  ).trim();

  if(
    /^https?:\/\//i.test(uri) ||
    /^blob:/i.test(uri) ||
    /^data:/i.test(uri)
  ){
    return uri;
  }

  return "";

}

function firestorePostToMinePost(doc){

  const fields = doc?.fields || {};

  const type = String(
    firestoreField(fields,"type") ||
    ""
  ).trim();

  /*
    Canonical Android kayıtları public_post olarak gelir.
    users koleksiyonunda da aynı kayıt tutulabildiği için
    type boşsa postId/text/media alanları olan kayıtları kabul et.
  */
  if(
    type &&
    type !== "public_post" &&
    type !== "post"
  ){
    return null;
  }

  const id = String(
    firestoreField(fields,"postId") ||
    firestoreField(fields,"id") ||
    doc?.name?.split("/")?.pop() ||
    ""
  ).trim();

  const username = String(
    firestoreField(fields,"username") ||
    ""
  ).replace(/^@/,"").trim();

  const text = String(
    firestoreField(fields,"text") ||
    firestoreField(fields,"caption") ||
    ""
  );

  const createdRaw =
    firestoreField(fields,"createdAt");

  let createdAt = Number(createdRaw || 0);

  /* Firestore timestamp/string ihtimaline karşı. */
  if(!createdAt && createdRaw){
    const parsed = Date.parse(String(createdRaw));
    if(!Number.isNaN(parsed)) createdAt=parsed;
  }

  const media = firestorePostMedia(fields);

  if(!id || !username || (!media && !text)){
    return null;
  }

  const mediaType = String(
    firestoreField(fields,"mediaType") ||
    "image/jpeg"
  );

  const music =
    firestoreField(fields,"music") ||
    "";

  const likesValue =
    firestoreField(fields,"likes");

  const commentsValue =
    firestoreField(fields,"comments");

  const commentCount = Number(
    firestoreField(fields,"commentCount") ||
    (Array.isArray(commentsValue) ? commentsValue.length : 0) ||
    0
  );

  let comments=[];
  if(Array.isArray(commentsValue)){
    comments=commentsValue;
  }

  return {
    id,
    postId:id,
    username,
    ownerUid:String(
      firestoreField(fields,"ownerUid") || ""
    ),
    caption:text,
    text,
    media,
    mediaName:
      mediaType.includes("video")
        ? "minegram.mp4"
        : "minegram.jpg",
    mediaType,
    music,
    likes:
      Array.isArray(likesValue)
        ? likesValue
        : Number(likesValue || 0),
    commentCount,
    comments,
    createdAt: createdAt || Date.now(),
    source:"firebase"
  };
}

async function firebaseLoadMinegramPostsFrom(collection){

  const url =
    firestorePostsUrl(collection)+
    "?pageSize=500";

  const json =
    await firebaseStoryRequest(
      url,
      {method:"GET"}
    );

  const docs =
    Array.isArray(json?.documents)
      ? json.documents
      : [];

  return docs
    .map(firestorePostToMinePost)
    .filter(Boolean);
}

async function firebaseLoadMinegramPosts(){

  const results = await Promise.allSettled([
    firebaseLoadMinegramPostsFrom("minegramPublicPosts"),
    firebaseLoadMinegramPostsFrom("users")
  ]);

  const all=[];

  for(const result of results){
    if(result.status==="fulfilled" && Array.isArray(result.value)){
      all.push(...result.value);
    }
  }

  /* Aynı post canonical + legacy olarak iki kere gelmesin. */
  const map=new Map();

  for(const post of all){
    const key=String(post.id||"");
    if(!key) continue;

    const old=map.get(key);

    if(!old || (post.media && !old.media)){
      map.set(key,post);
    }
  }

  return [...map.values()]
    .sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));
}

const MINEGRAM_DELETED_POSTS_KEY = "minegram_deleted_posts_v3";

function getMinegramDeletedPostIds(){
  try{
    const raw=localStorage.getItem(MINEGRAM_DELETED_POSTS_KEY)||"[]";
    const arr=JSON.parse(raw);
    return new Set(Array.isArray(arr) ? arr.map(v=>String(v)) : []);
  }catch(_){
    return new Set();
  }
}

function addMinegramDeletedPost(id){
  const clean=String(id||"").trim();
  if(!clean)return;
  const ids=getMinegramDeletedPostIds();
  ids.add(clean);
  ids.add("public_post_"+clean);
  localStorage.setItem(
    MINEGRAM_DELETED_POSTS_KEY,
    JSON.stringify([...ids].slice(-2000))
  );
}

function removeMinegramDeletedPost(id){
  const clean=String(id||"").trim();
  const ids=getMinegramDeletedPostIds();
  ids.delete(clean);
  ids.delete("public_post_"+clean);
  localStorage.setItem(
    MINEGRAM_DELETED_POSTS_KEY,
    JSON.stringify([...ids])
  );
}

function minegramPostFingerprint(post){
  if(!post)return "";
  const username=String(post.username||"").toLowerCase().replace(/^@/,"").trim();
  const owner=String(post.ownerUid||"").trim();
  const created=String(post.createdAt||post.created_at||"").trim();
  const media=String(post.media||"").trim();
  const text=String(post.text||post.caption||"").trim();
  return [username,owner,created,media,text].join("|");
}

/* API ve Firebase aynı gönderiye farklı ID verebiliyorsa bile yakala. */
function minegramPostStableKeys(post){
  if(!post)return [];
  const username=String(post.username||"").toLowerCase().replace(/^@/,"").trim();
  const owner=String(post.ownerUid||"").trim();
  const media=String(post.media||"").trim();
  const text=String(post.text||post.caption||"").trim();
  const keys=[];
  if(owner && media) keys.push("om:"+owner+"|"+media);
  if(username && media) keys.push("um:"+username+"|"+media);
  if(owner && text && !media) keys.push("ot:"+owner+"|"+text);
  if(username && text && !media) keys.push("ut:"+username+"|"+text);
  return keys;
}

function addMinegramDeletedStableKeys(post){
  const keys=minegramPostStableKeys(post);
  if(!keys.length)return;
  const ids=getMinegramDeletedPostIds();
  keys.forEach(k=>ids.add("stable:"+k));
  localStorage.setItem(MINEGRAM_DELETED_POSTS_KEY,JSON.stringify([...ids].slice(-5000)));
}

function isMinegramDeletedStable(post){
  const ids=getMinegramDeletedPostIds();
  return minegramPostStableKeys(post).some(k=>ids.has("stable:"+k));
}

function addMinegramDeletedFingerprint(post){
  const fp=minegramPostFingerprint(post);
  if(!fp)return;
  const ids=getMinegramDeletedPostIds();
  ids.add("fp:"+fp);
  localStorage.setItem(MINEGRAM_DELETED_POSTS_KEY,JSON.stringify([...ids].slice(-2000)));
}

function isMinegramDeletedPostFingerprint(post){
  const fp=minegramPostFingerprint(post);
  return !!(fp && getMinegramDeletedPostIds().has("fp:"+fp));
}

function isMinegramDeletedPost(post){
  const ids=getMinegramDeletedPostIds();
  const id=String(post?.id || post?.postId || "").trim();
  const sourceId=String(post?.sourceId || "").trim();
  return !!(
    (id && ids.has(id)) ||
    (sourceId && ids.has(sourceId)) ||
    (id && ids.has("public_post_"+id)) ||
    isMinegramDeletedPostFingerprint(post) ||
    isMinegramDeletedStable(post)
  );
}

function removeDeletedMinegramPosts(posts){
  return (Array.isArray(posts)?posts:[]).filter(p=>!isMinegramDeletedPost(p));
}

async function tryDeleteFirebaseMinegramPost(postId){
  const id=String(postId||"").trim();
  if(!id)return false;

  const targets=[
    firestorePostsUrl("minegramPublicPosts")+"/"+encodeURIComponent(id),
    firestorePostsUrl("users")+"/public_post_"+encodeURIComponent(id),
    firestorePostsUrl("users")+"/"+encodeURIComponent(id)
  ];

  let deleted=false;

  for(const url of targets){
    try{
      await firebaseStoryRequest(url,{method:"DELETE"});
      deleted=true;
    }catch(e){
      /* 404 = kayıt yok; 403 = web anonim hesabının Android kaydını
         silme yetkisi yok. API silmesi yine devam eder. */
    }
  }

  return deleted;
}

function mergeFeedPosts(apiPosts,firebasePosts){

  const map=new Map();

  for(const post of [
    ...(Array.isArray(apiPosts)?apiPosts:[]),
    ...(Array.isArray(firebasePosts)?firebasePosts:[])
  ]){

    if(!post) continue;

    /* Daha önce silinen gönderi API/Firebase tarafından tekrar dönse bile
       bu tarayıcıda asla feed'e alınmaz. */
    if(isMinegramDeletedPost(post)) continue;

    const id=String(
      post.id ||
      post.postId ||
      ""
    ).trim();

    if(!id) continue;

    const existing=map.get(id);

    /* API kaydı varsa onu koru; Firebase medya yoksa doldur. */
    if(!existing){
      map.set(id,post);
    }else{
      map.set(id,{
        ...post,
        ...existing,
        media:existing.media || post.media || "",
        mediaName:existing.mediaName || post.mediaName || "",
        caption:
          existing.caption ??
          post.caption ??
          "",
        comments:
          Array.isArray(existing.comments)
            ? existing.comments
            : (Array.isArray(post.comments)?post.comments:[])
      });
    }
  }

  return removeDeletedMinegramPosts([...map.values()])
    .sort((a,b)=>{
      const ad=Date.parse(a.createdAt||a.created_at||0);
      const bd=Date.parse(b.createdAt||b.created_at||0);
      const an=Number(a.createdAt||0);
      const bn=Number(b.createdAt||0);
      return (Number.isFinite(bd)?bd:bn) - (Number.isFinite(ad)?ad:an);
    });
}

/* =========================================================
   FEED
   Tek seferde yalnızca en güncel yükleme ekrana yazılır.
   Silme sırasında devam eden eski async istekler iptal edilmiş
   sayılır; böylece silinen gönderi sonradan tekrar çizilmez.
========================================================= */

let minegramFeedLoadVersion=0;
let minegramPostDeleteVersion=0;

let minegramActiveUsersCache = null;
let minegramActiveUsersCacheAt = 0;

async function loadMinegramActiveUsers(){
  const now=Date.now();
  if(minegramActiveUsersCache && now-minegramActiveUsersCacheAt < 30000){
    return minegramActiveUsersCache;
  }
  try{
    const result=await api('/api/active-users?ts='+now);
    const rows=Array.isArray(result)?result:(Array.isArray(result?.users)?result.users:(Array.isArray(result?.data)?result.data:[]));
    const byId=new Set();
    const byUsername=new Map();
    for(const u of rows){
      const authId=String(u?.auth_user_id||u?.id||'').trim();
      const username=String(u?.username||'').trim().toLowerCase();
      if(authId)byId.add(authId);
      if(username)byUsername.set(username,authId);
    }
    minegramActiveUsersCache={byId,byUsername};
    minegramActiveUsersCacheAt=now;
    return minegramActiveUsersCache;
  }catch(e){
    console.warn('[MINEGRAM] Aktif kullanıcı listesi alınamadı:',e);
    return null;
  }
}

function filterActiveApiPosts(posts,active){
  if(!Array.isArray(posts)) return [];
  /* Aktif kullanıcı kontrolü cevap veremiyorsa gerçek API gönderilerini
     boşaltma; feed zaten sunucudan geldiği için göster. */
  if(!active || !active.byId || !active.byId.size) return posts;
  return posts.filter(post=>{
    const owner=String(
      post?.userId||post?.user_id||post?.ownerId||post?.owner_id||
      post?.auth_user_id||post?.user?.id||post?.user?.auth_user_id||''
    ).trim();
    const username=String(post?.username||post?.user?.username||'').replace(/^@/,'').trim().toLowerCase();
    /* Owner bilgisi yoksa gönderiyi sırf bu nedenle gizleme. */
    if(!owner) return true;
    if(active.byId.has(owner)) return true;
    if(username && active.byUsername?.get(username)===owner) return true;
    return Array.from(active.byUsername?.values?.()||[]).includes(owner);
  });
}

function filterDeletedFirebasePosts(posts,active){
  if(!Array.isArray(posts)||!active)return [];
  return posts.filter(post=>{
    const owner=String(post?.ownerUid||'').trim();
    const username=String(post?.username||'').replace(/^@/,'').trim().toLowerCase();
    /* ownerUid yoksa eski/kimliği doğrulanamayan Firebase kaydıdır.
       Aynı kullanıcı adı yeniden açılmışsa bile eski hesabın gönderisi
       kesinlikle yeni hesaba taşınmasın. */
    if(!owner)return false;
    const mappedOwner=active.byUsername.get(username)||'';
    return active.byId.has(owner) && (!mappedOwner || mappedOwner===owner);
  });
}

async function loadFeed(){

  if(!feedEl)return;

  const myFeedVersion=++minegramFeedLoadVersion;
  const myDeleteVersion=minegramPostDeleteVersion;

  /* Yeni bir yükleme başladıysa önceki isteğin sonucu ekrana yazamaz. */
  const feedRequestIsCurrent=()=>
    myFeedVersion===minegramFeedLoadVersion &&
    myDeleteVersion===minegramPostDeleteVersion;

  feedEl.innerHTML=`
    <div class="empty">
      Yükleniyor...
    </div>
  `;

  // Eski hesap verisinin tarayıcı yerel önbelleğinden geri gelmesini engelle.
  try{
    ["minegram_posts","minegram_feed","minegram_public_posts"].forEach(k=>localStorage.removeItem(k));
  }catch(e){}

  /*
    İki kaynağı AYNI ANDA oku:
    1) mevcut web API
    2) Android uygulamasının Firebase gönderileri

    Böylece Android'den atılan gönderi site API'sinde
    bulunmasa bile doğrudan Firebase'den görünür.
  */
  /* WEB FEEDİN TEK OTORİTESİ SUPABASE API'DIR.
     Firebase'deki eski/anonim cihaz kayıtları burada kesinlikle okunmaz.
     Böylece silinmiş bir hesabın Firebase'de kalmış gönderisi,
     kullanıcı adı tekrar kullanılsa bile siteye geri dönemez. */
  const apiResult = await Promise.allSettled([
    api("/feed")
  ]).then(r => r[0]);

  let apiPosts=[];
  let firebasePosts=[];

  if(apiResult.status==="fulfilled"){
    const result=apiResult.value;

    apiPosts=
      Array.isArray(result)
        ? result
        : (
          Array.isArray(result?.posts)
            ? result.posts
            : (
              Array.isArray(result?.data)
                ? result.data
                : []
            )
        );
  }

  /* Firebase public-post koleksiyonu artık feed kaynağı değildir. */
  firebasePosts=[];

  /* Silme veya daha yeni bir loadFeed başladıysa bu eski istek
     artık hiçbir şeyi ekrana yazamaz. */
  if(!feedRequestIsCurrent()){
    return;
  }

  /* API cevabı bile ikinci kez doğrulanır: owner ID aktif Auth hesabında
     yoksa, silinmiş hesabın eski postu kesinlikle ekrana çizilmez. */
  const activeUsers = await loadMinegramActiveUsers();
  if(!feedRequestIsCurrent()) return;
  apiPosts = filterActiveApiPosts(apiPosts, activeUsers);

  /* Firebase eski kayıtları feed kaynağı değildir. */
  firebasePosts=[];

  const posts = mergeFeedPosts(apiPosts, []);

  console.log(
    "[MINEGRAM FEED] API:",
    apiPosts.length,
    "Firebase:",
    firebasePosts.length,
    "Toplam:",
    posts.length
  );

  if(posts.length){

    window.__minegramFeedPosts=posts;
    feedEl.innerHTML=
      posts.map(renderPost).join("");

    if(typeof window.updateMinegramPostStoryRings === "function") window.updateMinegramPostStoryRings();

    return;
  }

  if(!feedRequestIsCurrent())return;

  /* İki kaynak da hata verdiyse gerçek hatayı göster. */
  const apiError =
    apiResult.status==="rejected"
      ? apiResult.reason
      : null;

  const firebaseError = null;

  const msg=String(
    apiError?.message ||
    firebaseError?.message ||
    ""
  );

  const isAuthError=
    apiError?.status===401 ||
    /unauthorized/i.test(msg) ||
    /invalid token/i.test(msg) ||
    /token expired/i.test(msg) ||
    /jwt/i.test(msg) ||
    /not authenticated/i.test(msg) ||
    /session expired/i.test(msg);

  /* Firebase'de erişim sorunu varsa siteyi boş göstermeyelim. */
  if(isAuthError && !firebasePosts.length){
    clearMinegramSession();
    showLogin();
    return;
  }

  if(!apiPosts.length && !firebasePosts.length &&
     apiResult.status!=="fulfilled"){

    feedEl.innerHTML=`
      <div class="empty">
        <strong>Gönderiler yüklenemedi</strong>
        <small>${esc(msg || "Sunucuya bağlanılamadı.")}</small>
        <br>
        <button
          onclick="loadFeed()"
          style="margin-top:16px;padding:12px 22px;border:0;border-radius:22px;background:#fff;color:#000;font-weight:700;cursor:pointer"
        >
          Tekrar Dene
        </button>
      </div>
    `;

    if(msg) toast(msg);
    return;
  }

  feedEl.innerHTML=`
    <div class="empty">
      <strong>Henüz gönderi yok</strong>
      <small>İlk gönderini oluştur.</small>
    </div>
  `;
}

async function likePost(id){

  const article=
    document.querySelector(
      '.post[data-id="'+
      CSS.escape(String(id))+
      '"]'
    );


  const btn=
    article?.querySelector(
      ".action.like"
    );


  const path=
    btn?.querySelector(
      "path"
    );


  const likesEl=
    article?.querySelector(
      ".likes"
    );


  const wasLiked=
    !!btn?.classList.contains(
      "liked"
    );


  const nextLiked=
    !wasLiked;


  if(btn){

    btn.classList.toggle(
      "liked",
      nextLiked
    );


    if(path){

      path.setAttribute(
        "fill",
        nextLiked
          ? "currentColor"
          : "none"
      );

    }

  }


  if(likesEl){

    const current=
      parseInt(
        (likesEl.textContent||"0")
          .replace(/\D/g,""),
        10
      )||0;


    likesEl.textContent=
      Math.max(
        0,
        current+
        (nextLiked?1:-1)
      )+
      " beğenme";

  }


  try{

    const r=
      await api(
        "/posts/"+
        encodeURIComponent(id)+
        "/like",
        {
          method:"POST"
        }
      );


    if(
      btn &&
      typeof r.liked==="boolean"
    ){

      btn.classList.toggle(
        "liked",
        r.liked
      );


      if(path){

        path.setAttribute(
          "fill",
          r.liked
            ? "currentColor"
            : "none"
        );

      }

    }


    if(
      likesEl &&
      typeof r.likes==="number"
    ){

      likesEl.textContent=
        r.likes+
        " beğenme";

    }


  }catch(e){

    if(btn){

      btn.classList.toggle(
        "liked",
        wasLiked
      );


      if(path){

        path.setAttribute(
          "fill",
          wasLiked
            ? "currentColor"
            : "none"
        );

      }

    }


    if(likesEl){

      const current=
        parseInt(
          (likesEl.textContent||"0")
            .replace(/\D/g,""),
          10
        )||0;


      likesEl.textContent=
        Math.max(
          0,
          current+
          (nextLiked?-1:1)
        )+
        " beğenme";

    }


    toast(
      e.message ||
      "Beğeni işlemi başarısız"
    );

  }

}


async function doubleLike(id){

  const pop=
    document.getElementById(
      "heart-"+
      CSS.escape(String(id))
    );


  if(pop){

    pop.classList.add(
      "show"
    );


    setTimeout(
      ()=>pop.classList.remove("show"),
      650
    );

  }


  likePost(id);

}

async function sharePost(id){

  const url=
    location.origin+
    "/post.html?id="+
    encodeURIComponent(id);


  try{

    if(navigator.share){

      await navigator.share({
        title:"Minegram gönderisi",
        url

    }else{

      await navigator.clipboard.writeText(
        url

      toast(

      );

    }

  }catch(e){}

}
