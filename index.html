<script>

const API='/api';

let token=null;
let currentUser=null;
let currentCommentPost=null;
let currentMenuPost=null;
let currentCommentSort='forYou';
let replyingTo=null;

const feedEl=document.getElementById('feed');


/* HTML GÜVENLİĞİ */

function esc(s=''){

    return String(s).replace(/[&<>"']/g,m=>({

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'

    }[m]));

}


/* PROFİL */

function profileUrl(username){

    return 'profile.html?user='+
        encodeURIComponent(username);

}


/* TOKEN */

function getToken(){

    return (
        localStorage.getItem('minegram_token') ||
        localStorage.getItem('minegram_supabase_token') ||
        null
    );

}


/* API */

async function api(path,opt={}){

    const apiToken=getToken();

    token=apiToken;

    if(!apiToken){

        showLogin();

        throw new Error('Oturum bulunamadı.');

    }


    const controller=new AbortController();

    const timeout=setTimeout(()=>{

        controller.abort();

    },10000);


    const headers={

        ...(opt.headers||{}),

        Authorization:'Bearer '+apiToken

    };


    try{

        const response=await fetch(

            API+path,

            {

                ...opt,

                headers,
                signal:controller.signal

            }

        );


        const data=await response
            .json()
            .catch(()=>({}));


        if(response.status===401 ||
           response.status===403){

            logout();

            throw new Error(
                'Oturum süresi doldu.'
            );

        }


        if(!response.ok){

            throw new Error(

                data.error ||
                data.message ||
                'İşlem başarısız.'

            );

        }


        return data;


    }catch(error){

        if(error.name==='AbortError'){

            throw new Error(
                'Sunucu 10 saniye içinde yanıt vermedi.'
            );

        }

        throw error;

    }finally{

        clearTimeout(timeout);

    }

}


/* TOAST */

function toast(text){

    const e=document.getElementById('toast');

    e.textContent=text;

    e.classList.add('show');

    clearTimeout(window.__toast);

    window.__toast=setTimeout(()=>{

        e.classList.remove('show');

    },2200);

}


/* LOGIN */

function showLogin(){

    window.location.replace('giris.html');

}


/* HOME */

function showHome(){

    document
        .getElementById('home')
        .classList.remove('hidden');

    document
        .getElementById('bottomNav')
        .classList.remove('hidden');

}


/* ÇIKIŞ */

function logout(){

    localStorage.removeItem('minegram_token');
    localStorage.removeItem('minegram_supabase_token');
    localStorage.removeItem('minegram_user_id');
    localStorage.removeItem('minegram_username');
    localStorage.removeItem('minegram_email');
    localStorage.removeItem('minegram_user');
    localStorage.removeItem('minegram_profile');

    localStorage.removeItem('minegram_firebase_token');
    localStorage.removeItem('minegram_firebase_uid');
    localStorage.removeItem('minegram_firebase_email');

    sessionStorage.removeItem('minegram_token');
    sessionStorage.removeItem('minegram_supabase_token');
    sessionStorage.removeItem('minegram_user_id');
    sessionStorage.removeItem('minegram_username');
    sessionStorage.removeItem('minegram_email');
    sessionStorage.removeItem('minegram_user');
    sessionStorage.removeItem('minegram_profile');

    token=null;
    currentUser=null;

    /* INDEX'TE KALMA */

    window.location.replace('giris.html');

}


/* LOCAL COMMENTS */

function localCommentsKey(id){

    return 'minegram_comments_'+String(id);

}


function getLocalComments(id){

    try{

        const x=JSON.parse(

            localStorage.getItem(
                localCommentsKey(id)
            ) || '[]'

        );

        return Array.isArray(x)?x:[];

    }catch{

        return [];

    }

}


function saveLocalComment(id,c){

    const a=getLocalComments(id);

    a.push(c);

    localStorage.setItem(

        localCommentsKey(id),

        JSON.stringify(a.slice(-100))

    );

}


/* COMMENTS MERGE */

function mergeComments(server,id){

    const remote=
        Array.isArray(server)?server:[];

    const local=
        getLocalComments(id);

    const all=[...remote];


    for(const c of local){

        const exists=all.some(x=>

            String(x.id||'')===String(c.id||'')

            ||

            (

                x.username===c.username &&
                x.text===c.text &&

                Math.abs(

                    new Date(
                        x.createdAt||
                        x.created_at||
                        0
                    )

                    -

                    new Date(
                        c.createdAt||
                        c.created_at||
                        0
                    )

                )<10000

            )

        );


        if(!exists){

            all.push(c);

        }

    }


    return all;

}


/* POST */

function renderPost(p){

    const username=
        p.user?.username ||
        p.username ||
        'minegram';

    const user=esc(username);

    const initial=
        esc(
            username
                .charAt(0)
                .toUpperCase() || 'M'
        );

    const liked=!!p.likedByMe;

    let likes=
        Array.isArray(p.likes)
            ?p.likes.length
            :Number(p.likes||0);


    const comments=mergeComments(

        Array.isArray(p.comments)
            ?p.comments
            :Array.isArray(p.post?.comments)
                ?p.post.comments
                :[],

        p.id

    );

/* LIKE */

async function likePost(id){

    const article=
        document.querySelector(
            '.post[data-id="'+
            CSS.escape(String(id))+
            '"]'
        );


    if(!article)return;


    const btn=
        article.querySelector(
            '.action.like'
        );

    const path=
        btn?.querySelector('path');

    const likesEl=
        article.querySelector('.likes');


    if(
        !btn ||
        btn.dataset.loading==='1'
    )return;


    btn.dataset.loading='1';


    const wasLiked=
        btn.classList.contains('liked');

    const nextLiked=!wasLiked;


    btn.classList.toggle(
        'liked',
        nextLiked
    );

    btn.dataset.liked=
        nextLiked?'1':'0';


    if(path){

        path.setAttribute(
            'fill',
            nextLiked
                ?'currentColor'
                :'none'
        );

    }


    if(likesEl){

        const m=
            (likesEl.textContent||'')
            .match(/\d+/);

        const n=
            m
                ?parseInt(m[0],10)
                :0;

        likesEl.textContent=
            Math.max(
                0,
                n+(nextLiked?1:-1)
            )+' beğenme';

    }


    try{

        const result=
            await api(
                '/posts/'+
                encodeURIComponent(id)+
                '/like',
                {
                    method:'POST'
                }
            );


        if(
            typeof result.likes==='number'
        ){

            likesEl.textContent=
                result.likes+
                ' beğenme';

        }


    }catch(error){

        btn.classList.toggle(
            'liked',
            wasLiked
        );

        btn.dataset.liked=
            wasLiked?'1':'0';


        if(path){

            path.setAttribute(
                'fill',
                wasLiked
                    ?'currentColor'
                    :'none'
            );

        }


        if(likesEl){

            const m=
                (likesEl.textContent||'')
                .match(/\d+/);

            const n=
                m
                    ?parseInt(m[0],10)
                    :0;

            likesEl.textContent=
                Math.max(
                    0,
                    n+(nextLiked?-1:1)
                )+' beğenme';

        }


        toast(error.message);

    }finally{

        btn.dataset.loading='0';

    }

}

/* TIME */

function relativeTime(value){

    if(!value)return '';

    const date=new Date(value);

    if(isNaN(date.getTime()))return '';


    let seconds=Math.max(

        0,

        Math.floor(
            (Date.now()-date.getTime())/1000
        )

    );


    if(seconds<60){

        return seconds+
            ' saniye önce';

    }


    let minutes=
        Math.floor(seconds/60);


    if(minutes<60){

        return minutes+
            ' dakika önce';

    }


    let hours=
        Math.floor(minutes/60);


    if(hours<24){

        return hours+
            ' saat önce';

    }


    let days=
        Math.floor(hours/24);


    if(days<7){

        return days+
            ' gün önce';

    }


    if(days<365){

        return Math.floor(days/7)+
            ' hafta önce';

    }


    return date.toLocaleDateString(
        'tr-TR'
    );

}


/* COMMENT SORT */

function sortComments(comments){

    const list=[...(comments||[])];


    if(currentCommentSort==='newest'){

        return list.sort((a,b)=>

            new Date(
                b.createdAt||
                b.created_at||
                0
            )

            -

            new Date(
                a.createdAt||
                a.created_at||
                0
            )

        );

    }


    if(currentCommentSort==='popular'){

        return list.sort((a,b)=>

            Number(
                b.likes||
                b.likeCount||
                0
            )

            -

            Number(
                a.likes||
                a.likeCount||
                0
            )

        );

    }


    return list.sort((a,b)=>

        new Date(
            a.createdAt||
            a.created_at||
            0
        )

        -

        new Date(
            b.createdAt||
            b.created_at||
            0
        )

    );

}

/* SEND COMMENT */

async function sendComment(){

    const input=
        document.getElementById(
            'commentInput'
        );


    const text=
        input.value.trim();


    if(
        !text ||
        !currentCommentPost
    )return;


    const postId=
        currentCommentPost;


    const replyId=
        replyingTo;


    const send=
        document.querySelector(
            '.comment-compose .send'
        );


    if(send){

        send.disabled=true;

    }


    const username=

        currentUser?.username ||
        currentUser?.name ||
        localStorage.getItem(
            'minegram_username'
        ) ||
        'minegram';


    const now=
        new Date().toISOString();


    const tempId=
        'local-'+Date.now();


    const item={

        id:tempId,
        username,
        text,
        createdAt:now,
        likedByMe:false,
        local:true

    };


    if(!replyId){

        saveLocalComment(
            postId,
            item
        );


        document.getElementById(
            'commentList'
        ).insertAdjacentHTML(

            'beforeend',

            renderComment(item)

        );


        document.getElementById(
            'commentList'
        ).scrollTop=999999;

    }


    input.value='';

    replyingTo=null;

    input.placeholder=
        'Bunun hakkında ne düşünüyorsun?';


    toast(
        replyId
            ?'Yanıt gönderildi'
            :'Yorum gönderildi'
    );


    try{

        let result;


        if(replyId){

            try{

                result=
                    await api(

                        '/comments/'+
                        encodeURIComponent(replyId)+
                        '/reply',

                        {

                            method:'POST',

                            headers:{
                                'Content-Type':
                                'application/json'
                            },

                            body:JSON.stringify({
                                text
                            })

                        }

                    );

            }catch{

                result=
                    await api(

                        '/posts/'+
                        encodeURIComponent(postId)+
                        '/comments/'+
                        encodeURIComponent(replyId)+
                        '/reply',

                        {

                            method:'POST',

                            headers:{
                                'Content-Type':
                                'application/json'
                            },

                            body:JSON.stringify({
                                text
                            })

                        }

                    );

            }

        }else{

            result=
                await api(

                    '/posts/'+
                    encodeURIComponent(postId)+
                    '/comments',

                    {

                        method:'POST',

                        headers:{
                            'Content-Type':
                            'application/json'
                        },

                        body:JSON.stringify({
                            text
                        })

                    }

                );

        }


        const returned=
            result?.comment ||
            result?.data ||
            result;


        if(
            returned?.id &&
            !replyId
        ){

            const comments=
                getLocalComments(postId);


            const local=
                comments.find(
                    x=>x.id===tempId
                );


            if(local){

                local.id=
                    returned.id;

                local.local=false;

                local.username=
                    returned.username ||
                    returned.user?.username ||
                    local.username;


                local.createdAt=
                    returned.createdAt ||
                    returned.created_at ||
                    local.createdAt;

            }


            localStorage.setItem(

                localCommentsKey(postId),

                JSON.stringify(
                    comments.slice(-100)
                )

            );

        }


        await openComments(postId);

        await loadFeed();


    }catch(error){

        if(!replyId){

            const comments=
                getLocalComments(postId)
                .filter(
                    x=>x.id!==tempId
                );


            localStorage.setItem(

                localCommentsKey(postId),

                JSON.stringify(comments)

            );

        }


        toast(
            error.message ||
            'Gönderilemedi'
        );


    }finally{

        if(send){

            send.disabled=false;

        }

    }

}

                        headers:{
                            Authorization:
                            'Bearer '+
                            apiToken
                        },

                        body:form,

                        signal:controller.signal

                    }
                );


            const data=
                await response
                    .json()
                    .catch(()=>({}));


            if(
                response.status===401 ||
                response.status===403
            ){

                logout();

                return;

            }


            if(!response.ok){

                throw new Error(
                    data.error ||
                    'Hikaye yüklenemedi.'
                );

            }


            toast(
                'Hikaye paylaşıldı.'
            );


        }finally{

            clearTimeout(timeout);

        }


    }catch(error){

        toast(
            error.name==='AbortError'
                ?'Hikaye yükleme zaman aşımına uğradı.'
                :(
                    error.message ||
                    'Hikaye yüklenemedi.'
                )
        );

    }

}

/* INIT */

async function init(){

    console.log(
        '[INDEX] Başlatılıyor...'
    );


    token=getToken();


    /* TOKEN YOKSA INDEX'TE KALMA */

    if(!token){

        window.location.replace(
            'giris.html'
        );

        return;

    }


    /* KAYITLI KULLANICI */

    try{

        const saved=
            localStorage.getItem(
                'minegram_user'
            );


        if(saved){

            currentUser=
                JSON.parse(saved);

        }

    }catch{

        currentUser=null;

    }


    showHome();


    /* /ME */

    try{

        const me=
            await api('/me');


        if(me){

            currentUser=me;


            localStorage.setItem(

                'minegram_user',

                JSON.stringify(me)

            );

        }

    }catch(error){

        console.warn(
            '[INDEX /me]',
            error
        );

        /*
         * /me başarısız oldu diye
         * sayfayı sonsuza kadar bekletme.
         * Feed yine çalıştırılacak.
         */

    }


    /* FEED */

    await loadFeed();

}


/* BAŞLAT */

init();

</script>
