<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Minegram • Mesajlar</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;height:100%;overflow:hidden}button,input{font:inherit}button{cursor:pointer}.app{height:100dvh;background:#000}.header{height:62px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #191919;background:#000}.back{border:0;background:none;color:#fff;font-size:28px;width:38px}.title{font-size:19px;font-weight:700}.new{margin-left:auto;border:0;background:none;color:#fff;font-size:14px}.content{height:calc(100dvh - 138px);overflow:auto;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.search{padding:12px 14px}.search input{width:100%;height:40px;border:1px solid #2b2b2b;background:#0a0a0a;border-radius:20px;color:#fff;padding:0 15px;outline:0}.list{padding:0 8px}.chat{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid #141414}.avatar{width:48px;height:48px;border-radius:50%;background:#4597d0;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.meta{min-width:0;flex:1}.name{font-weight:700;font-size:14px}.last{color:#888;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{color:#666;font-size:10px}.empty{text-align:center;color:#777;padding:60px 20px}.composer{position:fixed;left:0;right:0;bottom:76px;padding:8px 10px;background:#090909;border-top:1px solid #191919;display:flex;gap:7px}.composer input{flex:1;height:42px;border:1px solid #333;background:#050505;color:#fff;border-radius:22px;padding:0 14px}.composer button{width:44px;height:42px;border:0;border-radius:50%;background:#4597d0;color:#061018;font-weight:700}.bottom{position:fixed;left:0;right:0;bottom:0;height:76px;padding:5px 4px max(5px,env(safe-area-inset-bottom));display:flex;background:#19171f;border-top:1px solid #25232c}.nav{flex:1;border:0;background:none;color:#ddd;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav span{font-size:22px}.nav.active{color:#fff}.nav.active span{background:#3b3450;border-radius:18px;padding:3px 13px}
</style></head><body><div class="app"><header class="header"><button class="back" onclick="location.href='../'">‹</button><div class="title">Mesajlar</div><button class="new" onclick="newChat()">Yeni</button></header><main class="content"><div class="search"><input id="search" placeholder="Ara"></div><div id="list" class="list"></div></main><div class="composer"><input id="message" placeholder="Mesaj yaz..."><button onclick="sendMessage()">➤</button></div><nav class="bottom"><button class="nav" onclick="location.href='../'"><span>⌂</span>Ana Sayfa</button><button class="nav" onclick="location.href='../#search'"><span>⌕</span>Ara</button><button class="nav" onclick="location.href='../#create'"><span>＋</span>Oluştur</button><button class="nav" onclick="location.href='../#reels'"><span>▣</span>Reels</button><button class="nav" onclick="location.href='../profile/'"><span>♙</span>Profil</button></nav></div>
<script>
const token=localStorage.getItem('minegram_token')||localStorage.getItem('token');let messages=[];
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(url,opt);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'İşlem başarısız');return r.json()}
function render(){const q=document.getElementById('search').value.toLowerCase();const list=document.getElementById('list');const arr=messages.filter(m=>(m.username||'').toLowerCase().includes(q)||(m.text||'').toLowerCase().includes(q));list.innerHTML=arr.length?arr.map(m=>`<div class="chat"><div class="avatar">${(m.username||'M')[0].toUpperCase()}</div><div class="meta"><div class="name">@${m.username||'kullanıcı'}</div><div class="last">${escapeHtml(m.text||'')}</div></div><div class="time">${m.createdAt?new Date(m.createdAt).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):''}</div></div>`).join(''):'<div class="empty">Henüz mesaj yok.<br><small>Bir kullanıcıya mesaj gönderdiğinde burada görünecek.</small></div>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(!token){location.href='../';return}try{messages=await api('/api/messages');render()}catch(e){document.getElementById('list').innerHTML='<div class="empty">Mesajlar yüklenemedi.</div>'}}
async function sendMessage(){const input=document.getElementById('message');const text=input.value.trim();if(!text)return;const to=prompt('Kullanıcı adı (@ olmadan):');if(!to)return;try{const m=await api('/api/messages',{method:'POST',body:{to,text}});messages.push(m);input.value='';render()}catch(e){alert(e.message)}}function newChat(){prompt('Mesaj göndermek istediğin kullanıcı adını yaz:')}document.getElementById('search').oninput=render;load();
</script></body></html>
