<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<title>Minegram - Ana Sayfa</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#000;
  color:#f5f5f5;
  font-family:Arial,Helvetica,sans-serif
}

body{
  overflow-x:hidden;
  padding-bottom:76px
}

.app{
  min-height:100vh;
  background:#000
}

.topbar{
  height:70px;
  border-bottom:1px solid #202020;
  display:flex;
  align-items:center;
  padding:0 22px;
  position:sticky;
  top:0;
  background:#000;
  z-index:50
}

.logo{
  font-size:22px;
  font-weight:700
}

.top-actions{
  margin-left:auto;
  display:flex;
  gap:6px
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:#eee;
  display:grid;
  place-items:center;
  cursor:pointer
}

.svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

.stories{
  height:92px;
  border-bottom:1px solid #202020;
  display:flex;
  align-items:center;
  padding:12px 20px;
  overflow:hidden
}

.story{
  width:68px;
  text-align:center;
  font-size:10px;
  color:#aaa;
  flex:none
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#3f91cc;
  display:grid;
  place-items:center;
  font-size:21px;
  color:#eee;
  margin:auto;
  position:relative
}

.avatar.small{
  width:40px;
  height:40px;
  font-size:15px;
  margin:0
}

.plus{
  position:absolute;
  right:-2px;
  bottom:-2px;
  width:19px;
  height:19px;
  border-radius:50%;
  background:#eee;
  color:#111;
  display:grid;
  place-items:center;
  font-weight:bold
}

.feed{
  width:min(680px,100%);
  margin:0 auto
}

.post{
  width:100%;
  border:1px solid #171717;
  border-radius:2px;
  background:#000;
  margin:15px 0 18px;
  overflow:hidden
}

.post-head{
  height:66px;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:10px;
  border-bottom:1px solid #161616
}

.username{
  font-size:14px;
  font-weight:700;
  cursor:pointer
}

.more{
  margin-left:auto;
  font-size:23px;
  line-height:1;
  color:#eee
}

.media-wrap{
  width:100%;
  display:flex;
  justify-content:center;
  background:#080808;
  position:relative;
  overflow:hidden
}

.post-media{
  display:block;
  width:100%;
  max-height:610px;
  object-fit:contain;
  background:#080808;
  cursor:pointer
}

.heart-pop{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.55);
  font-size:92px;
  color:#ff1744;
  opacity:0;
  pointer-events:none;
  text-shadow:0 3px 18px #000;
  transition:.18s
}

.heart-pop.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1)
}

.actions{
  height:50px;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:6px
}

.action{
  height:42px;
  min-width:42px;
  border:0;
  background:transparent;
  color:#eee;
  display:flex;
  align-items:center;
  gap:5px;
  padding:0 5px;
  cursor:pointer;
  font-size:14px
}

.action .svg{
  width:25px;
  height:25px
}

.action.like.liked{

}

.share-action{

}

.share-plane{
  width:30px;
  height:23px;
  display:block;

}

.likes{

  margin-top:-2px
}

.caption{

  line-height:1.45;

}

.caption b{

}

.comments-preview{

  color:#999;
  font-size:13px;
  cursor:pointer
}

.empty{

  text-align:center;
  color:#999
}

.empty strong{

  color:#eee;

  margin-bottom:7px
}

.nav{

  right:0;
  bottom:0;

  border-top:1px solid #201d27;

}

.nav a{

.nav-icon{

  place-items:center
}

.nav a.active .nav-icon{

}

.nav .svg{

.hidden{

}

.menu-backdrop{

}

.menu-backdrop.open{

.post-menu{

  width:285px;
  background:#211f27;

.grab{

.sort-select{

.comment-list{

.comment-row{

.comment-body{

}

.comment-user{

  font-weight:700;
  cursor:pointer
}

.comment-text{

.comment-meta{

.reply-link{

  cursor:pointer

.reply-link:hover{

.replies{

.replies.hidden{

.reply-row{
  display:flex;

.comment-like{

.comment-like.liked{

.emoji-row{

.comment-compose{

.compose-input{

.gif{

.send{

@media(max-width:699px){

</style>

<script>

const API='/api';


/* =========================================================
   MINEGRAM OTURUM TOKENI
========================================================= */

function getMinegramToken(){

  const keys=[
    'minegram_token',
    'minegram_supabase_token',
    'supabase_token',
    'access_token'
  ];

  /* Önce localStorage */

  for(const key of keys){

    const value=localStorage.getItem(key);

    if(
      value &&
      value!=='null' &&
      value!=='undefined'
    ){
      return value;
    }

  }


  /* Sonra sessionStorage */

  for(const key of keys){

    const value=sessionStorage.getItem(key);

    if(
      value &&
      value!=='null' &&
      value!=='undefined'
    ){
      return value;
    }

  }


  return null;
}


let token=getMinegramToken();

let currentUser=null;
let currentCommentPost=null;
let currentMenuPost=null;
let currentCommentSort='forYou';
let replyingTo=null;

const feedEl=document.getElementById('feed');


/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

function esc(s=''){

  return String(s).replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

}


async function api(path,opt={}){

  const controller=new AbortController();

  const timer=setTimeout(
    ()=>controller.abort(),
    10000
  );

  try{

    const headers={
      ...(opt.headers||{}),
      ...(token
        ? {Authorization:'Bearer '+token}
        : {})
    };

    const response=await fetch(
      API+path,
      {
        ...opt,
        headers,
        signal:controller.signal
      }
    );

    const json=await response
      .json()
      .catch(()=>({}));

    if(!response.ok){

      const error=new Error(
        json.error ||
        json.message ||
        ('HTTP '+response.status)
      );

      error.status=response.status;

      throw error;
    }

    return json;

  }catch(e){

    if(e.name==='AbortError'){
      throw new Error(
        'Sunucu yanıt vermiyor.'
      );
    }

    throw e;

  }finally{

    clearTimeout(timer);

  }

}


function toast(text){

  const el=document.getElementById('toast');

  if(!el)return;

  el.textContent=text;

  el.classList.add('show');

  clearTimeout(window.__toast);

  window.__toast=setTimeout(
    ()=>el.classList.remove('show'),
    2200
  );

}


/* =========================================================
   OTURUM / ANA SAYFA
========================================================= */

function showHome(){

  document
    .getElementById('home')
    ?.classList
    .remove('hidden');

  document
    .getElementById('bottomNav')
    ?.classList
    .remove('hidden');

}


function showLogin(){

  showHome();

  if(!feedEl)return;

  feedEl.innerHTML=`

    <div class="empty">

      <strong>
        Oturum açman gerekiyor
      </strong>

      <small>
        Minegram'ı kullanmak için giriş yap.
      </small>

      <br>

      <button
        onclick="location.href='giris.html'"
        style="
          margin-top:16px;
          padding:12px 22px;
          border:0;
          border-radius:22px;
          background:#fff;
          color:#000;
          font-weight:700;
          cursor:pointer
        "
      >
        Giriş Yap
      </button>

    </div>

  `;

}


function clearMinegramSession(){

  const keys=[
    'minegram_token',
    'minegram_supabase_token',
    'supabase_token',
    'access_token'
  ];

  for(const key of keys){

    localStorage.removeItem(key);
    sessionStorage.removeItem(key);

  }

  localStorage.removeItem('minegram_user');

  token=null;
  currentUser=null;

}


function logout(){

  clearMinegramSession();

  showLogin();

}


function profileUrl(username){

  return 'profile.html?user='+
    encodeURIComponent(username);

}


/* =========================================================
   POST RENDER
========================================================= */

function renderPost(p){

  const username=esc(
    p.user?.username ||
    p.username ||
    'minegram'
  );

  const initial=esc(
    (
      p.user?.username ||
      p.username ||
      'M'
    )[0].toUpperCase()
  );

  const liked=!!p.likedByMe;

  const likes=Array.isArray(p.likes)
    ? p.likes.length
    : Number(p.likes||0);

  const comments=mergeComments(
    Array.isArray(p.comments)
      ? p.comments
      : (
        Array.isArray(p.post?.comments)
          ? p.post.comments
          : []
      ),
    p.id
  );


  let media='';


  if(p.media){

    if(
      p.mediaName &&
      /\.(mp4|webm|mov|m4v)$/i.test(
        p.mediaName
      )
    ){

      media=`

        <video
          class="post-media"
          src="${esc(p.media)}"
          controls
          playsinline
        ></video>

      `;

    }else{

      media=`

        <img
          class="post-media"
          src="${esc(p.media)}"
          loading="lazy"
          alt="Gönderi"
        >

      `;

    }

  }


  return `

    <article
      class="post"
      data-id="${esc(p.id)}"
    >

      <div class="post-head">

        <div class="avatar small">
          ${initial}
        </div>

        <div
          class="username"
          onclick="location.href='${profileUrl(username)}'"
        >
          @${username}
        </div>

        <button
          class="icon-btn more"
          onclick="openMenu(event,'${esc(p.id)}')"
          aria-label="Menü"
        >
          ⋯
        </button>

      </div>


      ${
        media
          ? `

          <div
            class="media-wrap"
            ondblclick="doubleLike('${esc(p.id)}')"
          >

            ${media}

            <div
              class="heart-pop"
              id="heart-${esc(p.id)}"
            >
              ♥
            </div>

          </div>

          `
          : ''
      }


      <div class="actions">

        <button
          class="action like ${liked?'liked':''}"
          onclick="likePost('${esc(p.id)}')"
          aria-label="Beğen"
        >

          <svg
            class="svg"
            viewBox="0 0 24 24"
          >

            <path
              d="M20.8 8.8c0 5.4-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.8A4.8 4.8 0 0 1 8 4c1.5 0 2.9.7 4 2 1.1-1.3 2.5-2 4-2a4.8 4.8 0 0 1 4.8 4.8Z"
              ${liked?'fill="currentColor"':''}
            />

          </svg>

        </button>


        <button
          class="action"
          onclick="openComments('${esc(p.id)}')"
          aria-label="Yorumlar"
        >

          <svg
            class="svg"
            viewBox="0 0 24 24"
          >

            <path

async function loadFeed(){

  if(!feedEl)return;

  feedEl.innerHTML=`

    <div class="empty">
      Yükleniyor...
    </div>

  `;


  try{

    const result=await api('/feed');

    const posts=
      Array.isArray(result)
        ? result
        : (
          Array.isArray(result.posts)
            ? result.posts
            : (
              Array.isArray(result.data)
                ? result.data
                : []
            )
        );


    feedEl.innerHTML=

      posts.length

        ? posts.map(renderPost).join('')

        : `

          <div class="empty">

            <strong>
              Henüz gönderi yok
            </strong>

            İlk gönderini oluştur.

          </div>

        `;


  }catch(e){

    const msg=String(
      e?.message||''
    );


    /*
      SADECE GERÇEK YETKİLENDİRME HATASINDA
      OTURUMU TEMİZLE.
    */

    const isAuthError=

      e?.status===401 ||

      /unauthorized/i.test(msg) ||

      /invalid token/i.test(msg) ||

      /token expired/i.test(msg) ||

      /jwt/i.test(msg) ||

      /not authenticated/i.test(msg);


    if(isAuthError){

      clearMinegramSession();

      showLogin();

      return;

    }


    feedEl.innerHTML=`

      <div class="empty">

        <strong>
          Gönderiler yüklenemedi
        </strong>

        <small>
          ${esc(
            msg ||
            'Sunucuya bağlanılamadı.'
          )}
        </small>

        <br>

        <button
          onclick="loadFeed()"
          style="
            margin-top:16px;
            padding:12px 22px;
            border:0;
            border-radius:22px;
            background:#fff;
            color:#000;
            font-weight:700;
            cursor:pointer
          "
        >
          Tekrar Dene
        </button>

      </div>

    `;

    toast(
      msg ||
      'Gönderiler yüklenemedi'
    );

  }

}

async function likePost(id){

  const article=document.querySelector(
    '.post[data-id="'+
    CSS.escape(String(id))+
    '"]'
  );

  const btn=article?.querySelector(
    '.action.like'
  );

  const path=btn?.querySelector(
    'path'
  );

  const likesEl=article?.querySelector(
    '.likes'
  );


  const wasLiked=
    !!btn?.classList.contains('liked');

  const nextLiked=!wasLiked;


  /*
    Optimistic UI
  */

  if(btn){

    btn.classList.toggle(
      'liked',
      nextLiked
    );

    if(path){

      path.setAttribute(
        'fill',
        nextLiked
          ? 'currentColor'
          : 'none'
      );

    }

  }


  if(likesEl){

    const current=parseInt(
      (likesEl.textContent||'0')
        .replace(/\D/g,''),
      10
    )||0;

    likesEl.textContent=
      Math.max(
        0,
        current+(nextLiked?1:-1)
      )+
      ' beğenme';

  }


  try{

    const r=await api(
      '/posts/'+
      encodeURIComponent(id)+
      '/like',
      {
        method:'POST'
      }
    );


    if(
      btn &&
      typeof r.liked==='boolean'
    ){

      btn.classList.toggle(
        'liked',
        r.liked
      );

      if(path){

        path.setAttribute(
          'fill',
          r.liked
            ? 'currentColor'
            : 'none'
        );

      }

    }


    if(
      likesEl &&
      typeof r.likes==='number'
    ){

      likesEl.textContent=
        r.likes+
        ' beğenme';

    }


  }catch(e){

    /*
      Başarısızsa UI'ı geri al.
    */

    if(btn){

      btn.classList.toggle(
        'liked',
        wasLiked
      );

      if(path){

        path.setAttribute(
          'fill',
          wasLiked
            ? 'currentColor'
            : 'none'
        );

      }

    }


    if(likesEl){

      const current=parseInt(
        (likesEl.textContent||'0')
          .replace(/\D/g,''),
        10
      )||0;

      likesEl.textContent=
        Math.max(
          0,
          current+
          (nextLiked?-1:1)
        )+
        ' beğenme';

    }


    toast(
      e.message ||
      'Beğeni işlemi başarısız'
    );

  }

}


async function doubleLike(id){

  const pop=document.getElementById(
    'heart-'+
    CSS.escape(String(id))

  if(pop){

    pop.classList.add('show');

    setTimeout(
      ()=>pop.classList.remove('show'),

    );

  likePost(id);

}

/* =========================================================
   YORUMLAR - LOCAL
========================================================= */

function localCommentsKey(id){

  return 'minegram_comments_'+
    String(id);

}


function getLocalComments(id){

  try{

    const value=
      JSON.parse(
        localStorage.getItem(
          localCommentsKey(id)
        ) ||
        '[]'
      );

    return Array.isArray(value)
      ? value
      : [];

  }catch(e){

    return [];

  }

}


function saveLocalComment(id,c){

  const arr=
    getLocalComments(id);

  arr.push(c);

  localStorage.setItem(
    localCommentsKey(id),
    JSON.stringify(
      arr.slice(-100)
    )
  );

}


function mergeComments(server,id){

  const remote=
    Array.isArray(server)
      ? server
      : [];

  const local=
    getLocalComments(id);

  const all=[...remote];


  for(const c of local){

    const exists=all.some(
      x=>
        String(x.id||'')===
        String(c.id||'') ||

        (
          x.username===c.username &&
          x.text===c.text &&
          Math.abs(
            new Date(
              x.createdAt||
              x.created_at||
              0
            )-
            new Date(
              c.createdAt||
              0
            )
          )<10000
        )
    );


    if(!exists){

      all.push(c);

    }

  }


  return all;

}


/* =========================================================
   YORUM SIRALAMA
========================================================= */

function sortComments(comments){

  const arr=[
    ...(comments||[])
  ];


  if(
    currentCommentSort===
    'newest'
  ){

    return arr.sort(
      (x,y)=>
        new Date(
          y.createdAt||
          y.created_at||
          0
        )-
        new Date(
          x.createdAt||
          x.created_at||
          0
        )
    );

  }


  if(
    currentCommentSort===
    'popular'
  ){

    return arr.sort(
      (x,y)=>
        Number(
          y.likes||
          y.likeCount||
          0
        )-
        Number(
          x.likes||
          x.likeCount||
          0
        )
    );

  }


  return arr.sort(
    (x,y)=>
      new Date(
        x.createdAt||
        x.created_at||
        0
      )-
      new Date(
        y.createdAt||
        y.created_at||
        0
      )
  );

}


function renderCommentsForPost(
  comments
){

  const sorted=
    sortComments(
      comments
    );


  return sorted.length

    ? sorted
        .map(renderComment)
        .join('')

    : `

      <div class="empty">
        Henüz yorum yok.
      </div>

    `;

}

){

/* =========================================================
   ZAMAN
========================================================= */

function relativeTime(v){

  const d=new Date(v);

  if(!v || isNaN(d))return '';

  let seconds=
    Math.floor(
      (Date.now()-d.getTime())/
      1000
    );


  if(seconds<60){

    return seconds+
      ' saniye önce';

  }


  let minutes=
    Math.floor(
      seconds/60
    );


  if(minutes<60){

    return minutes+
      ' dakika önce';

  }


  let hours=
    Math.floor(
      minutes/60
    );


  if(hours<24){

    return hours+
      ' saat önce';

  }


  let days=
    Math.floor(
      hours/24
    );


  if(days<7){

    return days+
      ' gün önce';

  }


  if(days<365){

    return Math.floor(
      days/7
    )+
    ' hafta önce';

  }


  return d.toLocaleDateString(
    'tr-TR'
  );

}


/* =========================================================
   YORUM RENDER
========================================================= */

function renderComment(c){

  const username=esc(
    c.username||
    c.user?.username||
    currentUser?.username||
    'minegram'
  );


  const initial=esc(
    username[0]
      .toUpperCase()
  );


  const liked=
    !!c.likedByMe;


  const id=esc(
    c.id||''
  );


  const replyCount=
    Array.isArray(c.replies)
      ? c.replies.length
      : Number(
          c.replyCount||
          0
        );


  return `

    <div
      class="comment-wrap"
      data-comment-id="${id}"
    >

      <div class="comment-row">

        <div class="avatar small">
          ${initial}
        </div>


        <div class="comment-body">

          <div
            class="comment-user"
            onclick="location.href='${profileUrl(username)}'"
          >
            @${username}
          </div>


          <div class="comment-text">
            ${esc(
              c.text||
              c.content||
              ''
            )}
          </div>


          <div class="comment-meta">

            ${relativeTime(
              c.createdAt||
              c.created_at
            )}

            &nbsp;

            <button
              class="reply-link"
              onclick="startReply('${id}','${esc(username)}')"
            >
              Yanıtla
            </button>


            ${
              replyCount

                ? `

                  &nbsp;

                  <button
                    class="reply-link reply-count-link"
                    onclick="toggleReplies('${id}')"
                  >
                    ${replyCount} yanıt
                  </button>

                `

                : ''
            }

          </div>

        </div>


        <button
          class="comment-like ${liked?'liked':''}"
          onclick="likeComment('${id}')"
        >
          ${liked?'♥':'♡'}
        </button>

      </div>


      <div
        id="replies-${id}"
        class="replies hidden"
      >

        ${
          Array.isArray(c.replies)
            ? c.replies
                .map(renderReply)
                .join('')
            : ''
        }

      </div>

    </div>

  `;

}


function renderReply(r){

  const username=esc(
    r.username||
    r.user?.username||
    'minegram'
  );


  return `

    <div class="reply-row">

      <div class="avatar small">
        ${esc(
          username[0]
            .toUpperCase()
        )}
      </div>


      <div>

        <b>
          @${username}
        </b>


        <div class="comment-text">
          ${esc(
            r.text||
            r.content||
            ''
          )}
        </div>


        <div class="comment-meta">

          ${relativeTime(
            r.createdAt||
            r.created_at
          )}

        </div>

      </div>

    </div>

  `;

}

/* =========================================================
   YORUM GÖNDER
========================================================= */

async function sendComment(){

  const input=
    document.getElementById(
      'commentInput'
    );


  const textValue=
    input.value.trim();


  if(
    !textValue ||
    !currentCommentPost
  ){
    return;
  }


  const postId=
    currentCommentPost;


  const replyId=
    replyingTo;


  const sendButton=
    document.querySelector(
      '.comment-compose .send'
    );


  if(sendButton){

    sendButton.disabled=true;

  }


  const me=
    typeof currentUser==='object' &&
    currentUser
      ? currentUser
      : {};


  const username=
    me.username||
    me.name||
    'minegram';


  const now=
    new Date().toISOString();


  const tempId=
    'local-'+
    Date.now()+
    '-'+
    Math.random()
      .toString(36)
      .slice(2);


  const item={

    id:tempId,

    username,

    text:textValue,

    createdAt:now,

    likedByMe:false,

    local:true

  };


  /*
    YANIT
  */

  if(replyId){

    const local=
      getLocalComments(
        postId
      );


    let parent=
      local.find(
        c=>
          String(c.id)===
          String(replyId)
      );


    if(parent){

      parent.replies=
        Array.isArray(
          parent.replies
        )
          ? parent.replies
          : [];


      parent.replies.push(
        item
      );


      localStorage.setItem(
        localCommentsKey(postId),
        JSON.stringify(
          local.slice(-100)
        )
      );

    }


    const wrap=
      document.querySelector(
        '.comment-wrap[data-comment-id="'+
        CSS.escape(
          String(replyId)
        )+
        '"]'
      );


    const replies=
      wrap?.querySelector(
        '.replies'
      );


    if(replies){

      replies.classList.remove(
        'hidden'
      );


      replies.insertAdjacentHTML(
        'beforeend',
        renderReply(item)
      );


      const meta=
        wrap.querySelector(
          '.comment-meta'
        );


      if(meta){

        let countBtn=
          meta.querySelector(
            '.reply-count-link'
          );


        if(!countBtn){

          countBtn=
            document.createElement(
              'button'
            );

          countBtn.className=
            'reply-link reply-count-link';


          countBtn.onclick=()=>
            toggleReplies(
              replyId
            );


          meta.appendChild(
            document.createTextNode(
              ' '
            )
          );


          meta.appendChild(
            countBtn
          );

        }


        const currentCount=
          parent &&
          Array.isArray(
            parent.replies
          )
            ? parent.replies.length
            : 1;


        countBtn.textContent=
          currentCount+
          ' yanıt';

      }

    }


  }else{

    /*
      NORMAL YORUM
    */

    saveLocalComment(
      postId,
      item
    );


    const list=
      document.getElementById(
        'commentList'
      );


    if(list){

      const empty=
        list.querySelector(
          '.empty'
        );


      if(empty){
        empty.remove();
      }


      list.insertAdjacentHTML(
        'beforeend',
        renderComment(item)
      );


      list.scrollTop=
        list.scrollHeight;

    }

  }


  input.value='';

  replyingTo=null;

  input.placeholder=
    'Bunun hakkında ne düşünüyorsun?';


  toast(
    replyId
      ? 'Yanıt gönderildi'
      : 'Yorum gönderildi'
  );


  /*
    Sunucuya arka planda gönder.
  */

  try{

    let result;


    if(replyId){

      try{

        result=
          await api(
            '/comments/'+
            encodeURIComponent(
              replyId
            )+
            '/reply',
            {
              method:'POST',
              headers:{
                'Content-Type':
                  'application/json'
              },
              body:
                JSON.stringify({
                  text:textValue
                })
            }
          );

      }catch(firstError){

        result=
          await api(
            '/posts/'+
            encodeURIComponent(
              postId
            )+
            '/comments/'+
            encodeURIComponent(
              replyId
            )+
            '/reply',
            {
              method:'POST',
              headers:{
                'Content-Type':
                  'application/json'
              },
              body:
                JSON.stringify({
                  text:textValue
                })
            }
          );

      }


    }else{

      result=
        await api(
          '/posts/'+
          encodeURIComponent(
            postId
          )+
          '/comments',
          {
            method:'POST',
            headers:{
              'Content-Type':
                'application/json'
            },
            body:
              JSON.stringify({
                text:textValue
              })
          }
        );

    }


    /*
      API gerçek kimlik döndürdüyse
      local kayıtla eşleştir.
    */

    const returned=
      result?.comment||
      result?.data||
      result;


    if(
      returned &&
      typeof returned==='object'
    ){

      const realId=
        returned.id;


      if(realId){

        const local=
          getLocalComments(
            postId
          );


        for(const c of local){

          if(
            String(c.id)===
            String(tempId)
          ){

            c.id=realId;

            c.local=false;

            c.username=
              returned.username||
              returned.user?.username||
              c.username;

            c.text=
              returned.text||
              c.text;

            c.createdAt=
              returned.createdAt||
              returned.created_at||
              c.createdAt;

          }


          if(
            replyId &&
            Array.isArray(
              c.replies
            )
          ){

            for(
              const reply
              of c.replies
            ){

              if(
                String(reply.id)===
                String(tempId)
              ){

                reply.id=realId;
                reply.local=false;

              }

            }

          }

        }


        localStorage.setItem(
          localCommentsKey(postId),
          JSON.stringify(
            local.slice(-100)
          )
        );

      }

    }


    /*
      Arka planda senkronizasyon.
    */

    refreshComments(false);

    loadFeed();


  }catch(e){

    /*
      Sunucuya gönderilemediyse
      geçici local kaydı kaldır.
    */

    const local=
      getLocalComments(
        postId
      );


    if(replyId){

      for(
        const c
        of local
      ){

        if(
          Array.isArray(
            c.replies
          )
        ){

          c.replies=
            c.replies.filter(
              r=>
                String(r.id)!==
                String(tempId)
            );

        }

      }

    }else{

      const filtered=
        local.filter(
          c=>
            String(c.id)!==
            String(tempId)
        );


      local.length=0;

      local.push(
        ...filtered
      );

    }


    localStorage.setItem(
      localCommentsKey(postId),
      JSON.stringify(
        local.slice(-100)
      )
    );


    if(
      currentCommentPost===
      postId
    ){

      document.getElementById(
        'commentList'
      ).innerHTML=
        renderCommentsForPost(
          local
        );

    }


    toast(
      e.message||
      'Gönderilemedi'
    );


  }finally{

    if(sendButton){

      sendButton.disabled=false;

    }

  }

}


/* =========================================================
   YORUM BEĞENİ
========================================================= */

async function likeComment(id){

  if(!id){

    toast(
      'Yorum kimliği bulunamadı'
    );

    return;

  }


  /*
    Doğrudan comment-wrap üzerinden bul.
  */

  const wrap=
    document.querySelector(
      '.comment-wrap[data-comment-id="'+
      CSS.escape(
        String(id)
      )+
      '"]'
    );


  const btn=
    wrap?.querySelector(
      '.comment-like'
    );


  const wasLiked=
    !!btn?.classList.contains(
      'liked'
    );


  if(btn){

    btn.classList.toggle(
      'liked',
      !wasLiked
    );

    btn.textContent=
      !wasLiked
        ? '♥'
        : '♡';

  }


  try{

    const r=
      await api(
        '/comments/'+
        encodeURIComponent(id)+
        '/like',
        {
          method:'POST'
        }
      );


    if(
      btn &&
      typeof r.liked==='boolean'
    ){

      btn.classList.toggle(
        'liked',
        r.liked
      );

      btn.textContent=
        r.liked
          ? '♥'
          : '♡';

    }


    toast(
      r.liked
        ? 'Yorum beğenildi'
        : 'Yorum beğenisi kaldırıldı'
    );


  }catch(e){

    if(btn){

      btn.classList.toggle(
        'liked',
        wasLiked
      );

      btn.textContent=
        wasLiked
          ? '♥'
          : '♡';

    }


    toast(
      e.message||
      'Beğeni işlemi başarısız'
    );

  }

}


/* =========================================================
   LOGIN / ESKİ FONKSİYON UYUMLULUĞU
========================================================= */

async function login(){

  try{

    const usernameInput=
      document.getElementById('lu');

    const passwordInput=
      document.getElementById('lp');


    const username=
      usernameInput?.value?.trim()||
      '';


    const password=
      passwordInput?.value||
      '';


    if(!username || !password){

      toast(
        'Kullanıcı adı ve şifre gerekli.'
      );

      return;

    }


    const j=
      await api(
        '/login',
        {
          method:'POST',
          headers:{
            'Content-Type':
              'application/json'
          },
          body:
            JSON.stringify({
              username,
              password
            })
        }
      );


    if(!j.token){

      toast(
        'E-posta adresini doğrula, sonra giriş yap.'
      );

      return;

    }


    token=j.token;


    /*
      Oturumu bütün sayfaların
      okuyabileceği ana anahtara yaz.
    */

    localStorage.setItem(
      'minegram_token',
      token
    );

    /*
      Eski uyumluluk.
    */

    localStorage.setItem(
      'minegram_supabase_token',
      token
    );


    if(j.user){

      currentUser=
        j.user;

      localStorage.setItem(
        'minegram_user',
        JSON.stringify(
          currentUser
        )
      );

    }


    showHome();

    await loadFeed();


  }catch(e){

    toast(
      e.message||
      'Giriş yapılamadı.'
    );

  }

}


/* =========================================================
   ŞİFRE KURTARMA
========================================================= */

async function forgot(){

  const value=
    prompt(
      'E-posta adresini veya kullanıcı adını gir:'
    );


  if(!value)return;


  try{

    await api(
      '/forgot',
      {
        method:'POST',
        headers:{
          'Content-Type':
            'application/json'
        },
        body:
          JSON.stringify({
            identifier:value
          })
      }
    );


    toast(
      'Kurtarma bağlantısı gönderildi.'
    );


  }catch(e){

    toast(
      e.message||
      'Kurtarma işlemi başarısız.'
    );

  }

}


/* =========================================================
   SAYFA BAŞLATMA
========================================================= */

async function init(){

  /*
    Her sayfa açılışında tokenı
    yeniden oku.
  */

  token=getMinegramToken();


  console.log(
    '[MINEGRAM] Token kontrolü:',
    token
      ? 'VAR'
      : 'YOK'
  );


  showHome();


  /*
    Hiç token yoksa giriş ekranı.
  */

  if(!token){

    showLogin();

    return;

  }


  try{

    /*
      Sunucudan mevcut kullanıcıyı doğrula.
    */

    const me=
      await api('/me');


    currentUser=
      me?.user||
      me;


    /*
      Kullanıcı bilgisini yerel olarak sakla.
    */

    if(currentUser){

      localStorage.setItem(
        'minegram_user',
        JSON.stringify(
          currentUser
        )
      );

    }


    showHome();

    /*
      Feed yükle.
    */

    await loadFeed();


  }catch(e){

    console.error(
      '[INDEX AUTH ERROR]',
      e
    );


    const msg=
      String(
        e?.message||
        ''
      );


    /*
      SADECE gerçek auth hatasıysa
      token sil.
    */

    const isAuthError=

      e?.status===401 ||

      /unauthorized/i.test(msg) ||

      /invalid token/i.test(msg) ||

      /token expired/i.test(msg) ||

      /jwt/i.test(msg) ||

      /not authenticated/i.test(msg);


    if(isAuthError){

      clearMinegramSession();

      showLogin();

      return;

    }


    /*
      Sunucu geçici hata verdiyse
      kullanıcıyı OTURUMDAN ATMA.
    */

    const saved=
      localStorage.getItem(
        'minegram_user'
      );


    if(saved){

      try{

        currentUser=
          JSON.parse(saved);

      }catch(_){

        currentUser=null;

      }

    }


    showHome();


    /*
      Feed tekrar denenebilir.
    */

    if(feedEl){

      feedEl.innerHTML=`

        <div class="empty">

          <strong>
            Gönderiler şu anda yüklenemiyor
          </strong>

          <small>
            Oturumun açık.
            Birkaç saniye sonra tekrar deneyebilirsin.
          </small>

          <br>

          <button
            onclick="loadFeed()"
            style="
              margin-top:16px;
              padding:12px 22px;
              border:0;
              border-radius:22px;
              background:#fff;
              color:#000;
              font-weight:700;
              cursor:pointer
            "
          >
            Tekrar Dene
          </button>

        </div>

      `;

    }

  }

}


/* =========================================================
   ESCAPE - MENÜ / MODAL KAPAT
========================================================= */

document.addEventListener(
  'keydown',
  e=>{

    if(e.key==='Escape'){

      closeMenu();

      closeComments();

    }

  }
);


/* =========================================================
   DIŞARISI TIKLANINCA MENÜ KAPAT
========================================================= */

document.addEventListener(
  'click',
  e=>{

    const backdrop=
      document.getElementById(
        'menuBackdrop'
      );


    if(
      backdrop &&
      backdrop.classList.contains(
        'open'
      ) &&
      e.target===backdrop
    ){

      closeMenu();

    }

  }
);


/* =========================================================
   BAŞLAT
========================================================= */

init();

</script>
