<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minegram - Ana Sayfa</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden;padding-bottom:76px}.app{min-height:100vh;background:#000}
.topbar{height:70px;border-bottom:1px solid #202020;display:flex;align-items:center;padding:0 22px;position:sticky;top:0;background:#000;z-index:50}
.logo{font-size:22px;font-weight:700}.top-actions{margin-left:auto;display:flex;gap:6px}
.icon-btn{width:42px;height:42px;border:0;background:transparent;color:#eee;display:grid;place-items:center;cursor:pointer}
.svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stories{height:92px;border-bottom:1px solid #202020;display:flex;align-items:center;padding:12px 20px;overflow:hidden}
.story{width:68px;text-align:center;font-size:10px;color:#aaa;flex:none}.avatar{width:58px;height:58px;border-radius:50%;background:#3f91cc;display:grid;place-items:center;font-size:21px;color:#eee;margin:auto;position:relative}
.avatar.small{width:40px;height:40px;font-size:15px;margin:0}.plus{position:absolute;right:-2px;bottom:-2px;width:19px;height:19px;border-radius:50%;background:#eee;color:#111;display:grid;place-items:center;font-weight:bold}
.feed{width:min(680px,100%);margin:0 auto}.post{width:100%;border:1px solid #171717;border-radius:2px;background:#000;margin:15px 0 18px;overflow:hidden}
.post-head{height:66px;display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:1px solid #161616}.username{font-size:14px;font-weight:700;cursor:pointer}.more{margin-left:auto;font-size:23px;line-height:1;color:#eee}
.media-wrap{width:100%;display:flex;justify-content:center;background:#080808;position:relative;overflow:hidden}.post-media{display:block;width:100%;max-height:610px;object-fit:contain;background:#080808;cursor:pointer}
.heart-pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.55);font-size:92px;color:#ff1744;opacity:0;pointer-events:none;text-shadow:0 3px 18px #000;transition:.18s}.heart-pop.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.actions{height:50px;display:flex;align-items:center;padding:0 12px;gap:6px}.action{height:42px;min-width:42px;border:0;background:transparent;color:#eee;display:flex;align-items:center;gap:5px;padding:0 5px;cursor:pointer;font-size:14px}.action .svg{width:25px;height:25px}
.action.like{color:#eee;transition:transform .12s,color .15s}.action.like.liked{color:#ed1b3a}.action.like.liked .svg{fill:currentColor}.action.like:not(.liked) .svg{fill:none}.action.like:active{transform:scale(.85)}
.share-action{margin-left:auto}.share-plane{width:30px;height:23px;display:block;fill:currentColor}.likes{font-size:14px;font-weight:700;padding:0 14px;margin-top:-2px}.caption{font-size:14px;line-height:1.45;padding:7px 14px 14px}.caption b{cursor:pointer}
.comments-preview{padding:0 14px 12px;color:#999;font-size:13px;cursor:pointer}.empty{padding:110px 20px;text-align:center;color:#999}.empty strong{display:block;color:#eee;font-size:16px;margin-bottom:7px}
.nav{position:fixed;left:0;right:0;bottom:0;height:76px;background:#121018;border-top:1px solid #201d27;display:flex;z-index:100;padding:5px 8px env(safe-area-inset-bottom)}.nav a{flex:1;color:#ddd;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px}.nav-icon{width:45px;height:32px;border-radius:18px;display:grid;place-items:center}.nav a.active .nav-icon{background:#3b3150}.nav .svg{width:21px;height:21px}
.hidden{display:none!important}
.menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:200;display:none}.menu-backdrop.open{display:block}.post-menu{position:absolute;right:12px;top:78px;width:340px;background:#17141d;border-radius:5px;overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.65)}
.menu-item{height:88px;padding:0 28px;display:flex;align-items:center;gap:24px;color:#d8d6dc;font-size:20px;font-weight:700;border:0;background:transparent;width:100%;text-align:left;cursor:pointer}.menu-item:hover{background:#211e28}.menu-item .svg{width:27px;height:27px;stroke-width:1.9}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#25232a;color:#fff;padding:10px 16px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:300}.toast.show{opacity:1}
.comments-modal{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:250;display:none;align-items:flex-end}.comments-modal.open{display:flex}.comments-sheet{width:min(680px,100%);height:min(78vh,720px);margin:0 auto;background:#171b1e;border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{height:88px;position:relative;border-bottom:1px solid #25292c;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}.grab{position:absolute;top:10px;width:74px;height:8px;border-radius:9px;background:#9aa0a9}.close-comments{position:absolute;left:20px;top:28px;background:none;border:0;color:#fff;font-size:34px;cursor:pointer}
.sort{padding:12px 22px;border-bottom:1px solid #25292c}.sort-select{width:100%;height:42px;border:0;border-radius:10px;background:#20252a;color:#f5f5f5;padding:0 12px;font-size:15px;font-weight:700;outline:none}
.comment-list{flex:1;overflow:auto;padding:0 22px 15px}.comment-row{display:flex;gap:12px;padding:13px 0}.comment-body{flex:1;min-width:0}.comment-user{font-size:15px;font-weight:700;cursor:pointer}.comment-text{font-size:15px;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}.comment-meta{font-size:12px;color:#92979f;margin-top:8px}.reply-link{border:0;background:transparent;color:#858b94;padding:0;margin:0;font:inherit;font-weight:600;cursor:pointer}.replies{margin-left:52px;border-left:1px solid #2c3035;padding-left:12px}.replies.hidden{display:none}
.comment-like{width:34px;background:none;border:0;color:#fff;font-size:21px;cursor:pointer;align-self:flex-start;transition:transform .12s,color .15s}.comment-like.liked{color:#ed1b3a}.comment-like:active{transform:scale(.85)}
.emoji-row{display:flex;justify-content:space-around;align-items:center;padding:10px 20px 5px;gap:4px}.emoji-row button{width:40px;height:40px;padding:0;border:0;background:transparent;color:#fff;font-size:27px;cursor:pointer;display:grid;place-items:center;border-radius:10px;transition:transform .12s,background .12s}.emoji-row button:hover{background:#252a2f}.emoji-row button:active{transform:scale(.82)}
.comment-compose{display:flex;align-items:center;gap:9px;padding:10px 16px 18px}.compose-input{flex:1;min-width:0;height:58px;border:1px solid #3b3e42;border-radius:16px;background:#171b1e;color:#fff;padding:0 15px;font-size:15px;outline:none}.compose-input:focus{border-color:#3f91cc}.gif{height:52px;padding:0 15px;border:0;border-radius:15px;background:#20252a;color:#fff;font-weight:700}.send{height:52px;width:52px;border:0;background:transparent;color:#fff;font-size:27px;cursor:pointer}.send:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:699px){.topbar{height:62px;padding:0 14px}.stories{height:84px;padding-left:14px}.feed{width:100%}.post{margin:0 0 12px;border-left:0;border-right:0}.post-media{max-height:520px}.post-head{height:60px}.comments-sheet{height:82vh}.menu-backdrop .post-menu{right:8px;top:68px;width:min(340px,calc(100vw - 16px))}.emoji-row{padding-left:8px;padding-right:8px}.emoji-row button{width:36px;height:36px;font-size:24px}}
@media(min-width:700px){.nav{padding-left:calc((100% - 760px)/2);padding-right:calc((100% - 760px)/2)}}
</style>
</head>
<body>
<div class="app">
<section id="home">
<header class="topbar"><div class="logo">Minegram</div><div class="top-actions">
<button class="icon-btn" onclick="location.href='bildirimler.html'" aria-label="Bildirimler"><svg class="svg" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></button>
<button class="icon-btn" onclick="location.href='sohbet.html'" aria-label="Mesajlar"><svg class="svg" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg></button>
</div></header>
<div class="stories">
<input id="storyInput" type="file" accept="image/*,video/*" hidden>
<div class="story"><div class="avatar">M<span class="plus">+</span></div><div>Hikayen</div></div>
</div>
<div id="feed" class="feed"><div class="empty">Yükleniyor...</div></div>
</section>

<nav id="bottomNav" class="nav hidden">
<a class="active" href="index.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg></span>Ana Sayfa</a>
<a href="ara.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg></span>Ara</a>
<a href="olustur.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span>Oluştur</a>
<a href="reels.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4l3 5M13 4l3 5"/></svg></span>Reels</a>
<a href="profile.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span>Profil</a>
</nav>
</div>

<div id="menuBackdrop" class="menu-backdrop" onclick="closeMenu(event)"><div id="postMenu" class="post-menu"></div></div>

<div id="commentsModal" class="comments-modal" onclick="closeComments(event)">
<div class="comments-sheet" onclick="event.stopPropagation()">
<div class="sheet-head"><span class="grab"></span><button class="close-comments" onclick="closeComments()">×</button>Yorumlar</div>
<div class="sort"><select id="commentSort" class="sort-select" onchange="changeCommentSort(this.value)"><option value="forYou">Senin için</option><option value="newest">En yeni</option><option value="popular">En çok beğenilen</option></select></div>
<div id="commentList" class="comment-list"></div>
<div class="emoji-row">
<button type="button" onclick="addEmoji('❤️')">❤️</button><button type="button" onclick="addEmoji('🙌')">🙌</button><button type="button" onclick="addEmoji('🔥')">🔥</button><button type="button" onclick="addEmoji('👋')">👋</button><button type="button" onclick="addEmoji('😢')">😢</button><button type="button" onclick="addEmoji('😍')">😍</button><button type="button" onclick="addEmoji('😮')">😮</button><button type="button" onclick="addEmoji('😂')">😂</button>
</div>
<div class="comment-compose"><div id="composeAvatar" class="avatar small">M</div><input id="commentInput" class="compose-input" placeholder="Bunun hakkında ne düşünüyorsun?" onkeydown="if(event.key==='Enter')sendComment()"><button class="gif" type="button">GIF</button><button class="send" type="button" onclick="sendComment()">➤</button></div>
</div></div>
<div id="toast" class="toast"></div>

<script>
const API='/api';
const firebaseConfig={
apiKey:'AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y',
authDomain:'mim-ea133.firebaseapp.com',
databaseURL:'https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app',
projectId:'mim-ea133',
storageBucket:'mim-ea133.firebasestorage.app',
messagingSenderId:'303525353436',
appId:'1:303525353436:web:082fc090b5025e19942119',
measurementId:'G-K962QE5P1R'
};

let token=localStorage.getItem('minegram_firebase_token')||localStorage.getItem('minegram_token')||null;
let currentUser=null,currentCommentPost=null,currentMenuPost=null,currentCommentSort='forYou',replyingTo=null;
let firebaseApp=null,firebaseAuth=null,firebaseUser=null,firebaseReady=null;
const feedEl=document.getElementById('feed');

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

async function initFirebase(){
if(firebaseReady)return firebaseReady;
firebaseReady=(async()=>{
const [{initializeApp},authModule]=await Promise.all([
import('https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js'),
import('https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js')
]);
firebaseApp=initializeApp(firebaseConfig);
firebaseAuth=authModule.getAuth(firebaseApp);
await new Promise(resolve=>{
let done=false;
const unsub=authModule.onAuthStateChanged(firebaseAuth,user=>{
if(done)return;done=true;firebaseUser=user||null;unsub();resolve();
});
});
return firebaseUser;
})().catch(e=>{firebaseReady=null;throw e});
return firebaseReady;
}

async function getApiToken(){
await initFirebase();
if(firebaseUser){
try{
const fresh=await firebaseUser.getIdToken();
if(fresh){
token=fresh;
localStorage.setItem('minegram_firebase_token',fresh);
localStorage.setItem('minegram_token',fresh);
localStorage.setItem('minegram_firebase_uid',firebaseUser.uid||'');
localStorage.setItem('minegram_firebase_email',firebaseUser.email||'');
return fresh;
}
}catch(e){console.error('[FIREBASE TOKEN]',e);}
}
return token||localStorage.getItem('minegram_firebase_token')||localStorage.getItem('minegram_token')||null;
}

async function api(path,opt={}){
const apiToken=await getApiToken();
if(!apiToken)throw Error('Oturum bulunamadı');
const headers={...(opt.headers||{}),Authorization:'Bearer '+apiToken};
const r=await fetch(API+path,{...opt,headers});
const j=await r.json().catch(()=>({}));
if(!r.ok)throw Error(j.error||'İşlem başarısız');
return j;
}

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('show'),2200);}
function showLogin(){location.replace('giris.html');}
function showHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('bottomNav').classList.remove('hidden');}

async function logout(){
try{await initFirebase();if(firebaseAuth){const {signOut}=await import('https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js');await signOut(firebaseAuth);}}catch(e){console.error('[FIREBASE LOGOUT]',e);}
['minegram_token','minegram_firebase_token','minegram_firebase_uid','minegram_firebase_email'].forEach(k=>localStorage.removeItem(k));
token=null;firebaseUser=null;currentUser=null;showLogin();
}

function profileUrl(username){return 'profile.html?user='+encodeURIComponent(username);}

function mergeComments(server,id){
const remote=Array.isArray(server)?server:[],local=getLocalComments(id),all=[...remote];
for(const c of local){const exists=all.some(x=>String(x.id||'')===String(c.id||'')||(x.username===c.username&&x.text===c.text&&Math.abs(new Date(x.createdAt||x.created_at||0)-new Date(c.createdAt||0))<10000));if(!exists)all.push(c);}
return all;
}
function localCommentsKey(id){return 'minegram_comments_'+String(id);}
function getLocalComments(id){try{const x=JSON.parse(localStorage.getItem(localCommentsKey(id))||'[]');return Array.isArray(x)?x:[];}catch{return [];}}
function saveLocalComment(id,c){const a=getLocalComments(id);a.push(c);localStorage.setItem(localCommentsKey(id),JSON.stringify(a.slice(-100)));}

function renderPost(p){
const user=esc(p.user?.username||'minegram'),initial=esc((p.user?.username||'M')[0].toUpperCase()),liked=!!p.likedByMe;
let likes=Array.isArray(p.likes)?p.likes.length:Number(p.likes||0);
const comments=mergeComments(Array.isArray(p.comments)?p.comments:(Array.isArray(p.post?.comments)?p.post.comments:[]),p.id);
let media='';
if(p.media){
if(p.mediaName&&/\.(mp4|webm|mov|m4v)$/i.test(p.mediaName))media=`<video class="post-media" src="${esc(p.media)}" controls playsinline></video>`;
else media=`<img class="post-media" src="${esc(p.media)}" loading="lazy" alt="Gönderi">`;
}
return `<article class="post" data-id="${esc(p.id)}">
<div class="post-head"><div class="avatar small">${initial}</div><div class="username" onclick="location.href='${profileUrl(user)}'">@${user}</div><button class="icon-btn more" onclick="openMenu(event,'${esc(p.id)}')">⋯</button></div>
${media?`<div class="media-wrap" ondblclick="doubleLike('${esc(p.id)}')">${media}<div class="heart-pop" id="heart-${esc(p.id)}">♥</div></div>`:''}
<div class="actions">
<button type="button" class="action like ${liked?'liked':''}" data-liked="${liked?'1':'0'}" onclick="likePost('${esc(p.id)}')"><svg class="svg" viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.4-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.8A4.8 4.8 0 0 1 8 4c1.5 0 2.9.7 4 2 1.1-1.3 2.5-2 4-2a4.8 4.8 0 0 1 4.8 4.8Z" ${liked?'fill="currentColor"':''}></path></svg></button>
<button type="button" class="action" onclick="openComments('${esc(p.id)}')"><svg class="svg" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4Z"></path></svg></button>
<button type="button" class="action share-action" onclick="sharePost('${esc(p.id)}')"><svg class="share-plane" viewBox="0 0 32 24"><path d="M2 2.2 29.8 12 2 21.8l4.4-8.1 13.1-1.7-13.1-1.7Z" fill="currentColor"></path></svg></button>
</div>
<div class="likes">${likes} beğenme</div>
<div class="caption"><b onclick="location.href='${profileUrl(user)}'">@${user}</b> ${esc(p.caption||'')}</div>
${comments.length?`<div class="comments-preview" onclick="openComments('${esc(p.id)}')">${comments.length>3?'Tüm '+comments.length+' yorumu gör':comments.map(c=>`<div><b>@${esc(c.username||'')}</b> ${esc(c.text||'')}</div>`).join('')}</div>`:''}
</article>`;
}

async function loadFeed(){
feedEl.innerHTML='<div class="empty">Yükleniyor...</div>';
try{
const posts=await api('/feed');
feedEl.innerHTML=posts.length?posts.map(renderPost).join(''):'<div class="empty"><strong>Henüz gönderi yok</strong>İlk gönderini oluştur.</div>';
}catch(e){
console.error('[FEED]',e);
if(/token|auth|oturum/i.test(String(e.message)))await logout();
else{feedEl.innerHTML='<div class="empty"><strong>Gönderiler yüklenemedi</strong><small>Sayfayı yenileyip tekrar dene.</small></div>';toast(e.message);}
}
}

async function likePost(id){
const article=document.querySelector('.post[data-id="'+CSS.escape(String(id))+'"]');if(!article)return;
const btn=article.querySelector('.action.like'),path=btn?.querySelector('path'),likesEl=article.querySelector('.likes');if(!btn||btn.dataset.loading==='1')return;
btn.dataset.loading='1';const wasLiked=btn.classList.contains('liked'),nextLiked=!wasLiked;btn.classList.toggle('liked',nextLiked);btn.dataset.liked=nextLiked?'1':'0';if(path)path.setAttribute('fill',nextLiked?'currentColor':'none');
if(likesEl){const m=(likesEl.textContent||'').match(/\d+/);let n=m?parseInt(m[0],10):0;likesEl.textContent=Math.max(0,n+(nextLiked?1:-1))+' beğenme';}
try{const r=await api('/posts/'+encodeURIComponent(id)+'/like',{method:'POST'});if(typeof r.likes==='number')likesEl.textContent=r.likes+' beğenme';}
catch(e){btn.classList.toggle('liked',wasLiked);btn.dataset.liked=wasLiked?'1':'0';if(path)path.setAttribute('fill',wasLiked?'currentColor':'none');if(likesEl){const m=(likesEl.textContent||'').match(/\d+/);let n=m?parseInt(m[0],10):0;likesEl.textContent=Math.max(0,n+(nextLiked?-1:1))+' beğenme';}toast(e.message);}
finally{btn.dataset.loading='0';}
}
async function doubleLike(id){const p=document.getElementById('heart-'+CSS.escape(String(id)));if(p){p.classList.add('show');setTimeout(()=>p.classList.remove('show'),650);}const btn=document.querySelector('.post[data-id="'+CSS.escape(String(id))+'"] .action.like');if(btn&&!btn.classList.contains('liked'))await likePost(id);}
async function savePost(id){try{const r=await api('/posts/'+encodeURIComponent(id)+'/save',{method:'POST'});toast(r.saved?'Kaydedildi':'Kayıttan kaldırıldı');}catch(e){toast(e.message);}}
async function sharePost(id){const url=location.origin+'/post.html?id='+encodeURIComponent(id);try{if(navigator.share)await navigator.share({title:'Minegram gönderisi',url});else{await navigator.clipboard.writeText(url);toast('Gönderi bağlantısı kopyalandı');}}catch{}}

function openMenu(ev,id){
ev.stopPropagation();currentMenuPost=id;const hidden=localStorage.getItem('minegram_hide_comments_'+String(id))==='1';
document.getElementById('postMenu').innerHTML=`<button class="menu-item" onclick="saveFromMenu()">🔖 Kaydet</button><button class="menu-item" onclick="sharePost(currentMenuPost);closeMenu()">↗ Gönderiyi paylaş</button><button class="menu-item" onclick="toggleCommentCountFromMenu();closeMenu()">💬 ${hidden?'Yorum sayısını göster':'Yorum sayısını gizle'}</button><button class="menu-item" onclick="deletePostFromMenu()">🗑 Gönderiyi sil</button>`;
document.getElementById('menuBackdrop').classList.add('open');
}
function closeMenu(e){if(!e||e.target===document.getElementById('menuBackdrop'))document.getElementById('menuBackdrop').classList.remove('open');}
async function saveFromMenu(){if(currentMenuPost)await savePost(currentMenuPost);closeMenu();}
function toggleCommentCountFromMenu(){if(!currentMenuPost)return;const id=String(currentMenuPost),h=localStorage.getItem('minegram_hide_comments_'+id)==='1';localStorage.setItem('minegram_hide_comments_'+id,h?'0':'1');toast(h?'Yorum sayısı gösteriliyor':'Yorum sayısı gizlendi');loadFeed();}
async function deletePostFromMenu(){if(!currentMenuPost)return;const id=currentMenuPost;closeMenu();if(!confirm('Bu gönderiyi silmek istediğine emin misin?'))return;try{await api('/posts/'+encodeURIComponent(id),{method:'DELETE'});toast('Gönderi silindi');loadFeed();}catch(e){toast(e.message);}}

function relativeTime(v){if(!v)return '';const d=new Date(v);if(isNaN(d))return '';let s=Math.max(0,Math.floor((Date.now()-d.getTime())/1000));if(s<60)return s+' saniye önce';let m=Math.floor(s/60);if(m<60)return m+' dakika önce';let h=Math.floor(m/60);if(h<24)return h+' saat önce';let days=Math.floor(h/24);if(days<7)return days+' gün önce';if(days<365)return Math.floor(days/7)+' hafta önce';return d.toLocaleDateString('tr-TR');}
function sortComments(a){const x=[...(a||[])];if(currentCommentSort==='newest')return x.sort((p,q)=>new Date(q.createdAt||q.created_at||0)-new Date(p.createdAt||p.created_at||0));if(currentCommentSort==='popular')return x.sort((p,q)=>Number(q.likes||q.likeCount||0)-Number(p.likes||p.likeCount||0));return x.sort((p,q)=>new Date(p.createdAt||p.created_at||0)-new Date(q.createdAt||q.created_at||0));}
function renderReply(r){const u=esc(r.username||r.user?.username||'minegram');return `<div class="comment-row"><div class="avatar small">${esc(u[0]?.toUpperCase()||'M')}</div><div><b>@${u}</b><div class="comment-text">${esc(r.text||r.content||'')}</div><div class="comment-meta">${relativeTime(r.createdAt||r.created_at)}</div></div></div>`;}
function renderComment(c){
const u=esc(c.username||c.user?.username||currentUser?.username||'minegram'),id=esc(c.id||''),liked=!!c.likedByMe,replies=Array.isArray(c.replies)?c.replies:[];
return `<div class="comment-wrap" data-comment-id="${id}"><div class="comment-row"><div class="avatar small">${esc(u[0]?.toUpperCase()||'M')}</div><div class="comment-body"><div class="comment-user" onclick="location.href='${profileUrl(u)}'">@${u}</div><div class="comment-text">${esc(c.text||c.content||'')}</div><div class="comment-meta">${relativeTime(c.createdAt||c.created_at)} &nbsp;<button class="reply-link" onclick="startReply('${id}','${esc(u)}')">Yanıtla</button>${replies.length?` &nbsp;<button class="reply-link" onclick="toggleReplies('${id}')">${replies.length} yanıt</button>`:''}</div></div><button type="button" class="comment-like ${liked?'liked':''}" data-comment-liked="${liked?'1':'0'}" onclick="likeComment('${id}')">${liked?'♥':'♡'}</button></div><div id="replies-${id}" class="replies hidden">${replies.map(renderReply).join('')}</div></div>`;
}
function renderCommentsForPost(c){const s=sortComments(c);return s.length?s.map(renderComment).join(''):'<div class="empty">Henüz yorum yok.</div>';}
function changeCommentSort(v){currentCommentSort=v;if(currentCommentPost)document.getElementById('commentList').innerHTML=renderCommentsForPost(mergeComments([],currentCommentPost));}
async function openComments(id){
currentCommentPost=id;currentCommentSort='forYou';document.getElementById('commentSort').value='forYou';document.getElementById('commentsModal').classList.add('open');document.getElementById('commentList').innerHTML=renderCommentsForPost(getLocalComments(id));
try{const p=await api('/posts/'+encodeURIComponent(id));const remote=Array.isArray(p.comments)?p.comments:(Array.isArray(p.post?.comments)?p.post.comments:[]);document.getElementById('commentList').innerHTML=renderCommentsForPost(mergeComments(remote,id));}catch(e){}
}
function closeComments(e){if(!e||e.target===document.getElementById('commentsModal')){document.getElementById('commentsModal').classList.remove('open');currentCommentPost=null;}}
function startReply(id,username){replyingTo=id;const i=document.getElementById('commentInput');i.placeholder='@'+username+' kişisine yanıt yaz...';i.focus();}
function toggleReplies(id){document.getElementById('replies-'+CSS.escape(id))?.classList.toggle('hidden');}
function addEmoji(emoji){const i=document.getElementById('commentInput'),s=i.selectionStart??i.value.length,e=i.selectionEnd??i.value.length;i.value=i.value.slice(0,s)+emoji+i.value.slice(e);i.focus();try{i.setSelectionRange(s+emoji.length,s+emoji.length)}catch{}}

async function likeComment(id){
if(!id)return;const wrap=document.querySelector('.comment-wrap[data-comment-id="'+CSS.escape(String(id))+'"]'),btn=wrap?.querySelector('.comment-like');if(!btn||btn.dataset.loading==='1')return;
btn.dataset.loading='1';const was=btn.classList.contains('liked'),next=!was;btn.classList.toggle('liked',next);btn.textContent=next?'♥':'♡';
try{await api('/comments/'+encodeURIComponent(id)+'/like',{method:'POST'});toast(next?'Yorum beğenildi':'Yorum beğenisi kaldırıldı');}catch(e){btn.classList.toggle('liked',was);btn.textContent=was?'♥':'♡';toast(e.message);}finally{btn.dataset.loading='0';}
}

async function sendComment(){
const input=document.getElementById('commentInput'),text=input.value.trim();if(!text||!currentCommentPost)return;
const postId=currentCommentPost,replyId=replyingTo,send=document.querySelector('.comment-compose .send');if(send)send.disabled=true;
const username=currentUser?.username||currentUser?.name||firebaseUser?.email?.split('@')[0]||'minegram',now=new Date().toISOString(),tempId='local-'+Date.now();
const item={id:tempId,username,text,createdAt:now,likedByMe:false,local:true};
if(!replyId){saveLocalComment(postId,item);document.getElementById('commentList').insertAdjacentHTML('beforeend',renderComment(item));document.getElementById('commentList').scrollTop=999999;}
input.value='';replyingTo=null;input.placeholder='Bunun hakkında ne düşünüyorsun?';toast(replyId?'Yanıt gönderildi':'Yorum gönderildi');
try{
let result;
if(replyId){
try{result=await api('/comments/'+encodeURIComponent(replyId)+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});}
catch{result=await api('/posts/'+encodeURIComponent(postId)+'/comments/'+encodeURIComponent(replyId)+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});}
}else result=await api('/posts/'+encodeURIComponent(postId)+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
const returned=result?.comment||result?.data||result;if(returned?.id&&!replyId){const a=getLocalComments(postId);const c=a.find(x=>x.id===tempId);if(c){c.id=returned.id;c.local=false;c.username=returned.username||returned.user?.username||c.username;c.createdAt=returned.createdAt||returned.created_at||c.createdAt;}localStorage.setItem(localCommentsKey(postId),JSON.stringify(a.slice(-100)));}
await openComments(postId);loadFeed();
}catch(e){
if(!replyId){const a=getLocalComments(postId).filter(x=>x.id!==tempId);localStorage.setItem(localCommentsKey(postId),JSON.stringify(a));}
toast(e.message||'Gönderilemedi');
}finally{if(send)send.disabled=false;}
}

async function uploadStory(e){
const file=e.target.files?.[0];if(!file)return;
try{const t=await getApiToken();if(!t){showLogin();return;}const fd=new FormData();fd.append('story',file);const r=await fetch('/api/stories',{method:'POST',headers:{Authorization:'Bearer '+t},body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Hikaye yüklenemedi');toast('Hikaye paylaşıldı.');}
catch(err){toast(err.message||'Hikaye yüklenemedi');}
}
document.getElementById('storyInput').addEventListener('change',uploadStory);
document.querySelector('.story .plus').addEventListener('click',e=>{e.stopPropagation();document.getElementById('storyInput').click();});

async function init(){
try{
await initFirebase();
if(!firebaseUser){showLogin();return;}
token=await getApiToken();if(!token){showLogin();return;}
currentUser=await api('/me');
showHome();await loadFeed();
}catch(e){console.error('[INDEX INIT]',e);await logout();}
}
init();
</script>
</body>
</html>
