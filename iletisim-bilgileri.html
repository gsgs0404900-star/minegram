<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Minegram - İletişim Bilgileri</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:365px;
    margin-top:90px;
    text-align:center;
}

.header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:25px;
}

.back{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    margin-right:8px;
}

.header-title{
    font-size:16px;
    font-weight:700;
}

.title{
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 12px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.45;
    margin:0 0 22px;
}

.tabs{
    display:flex;
    gap:9px;
    width:100%;
    margin-bottom:9px;
}

.tab{
    width:50%;
    height:44px;
    border-radius:7px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.tab.email{
    border:1px solid #554f67;
    background:#554f67;
    color:#eee8fa;
}

.tab.phone{
    border:1px solid #292929;
    background:#000;
    color:#fff;
}

.input{
    width:100%;
    height:44px;
    margin-bottom:9px;
    padding:0 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#000;
    color:#fff;
    outline:none;
    font-size:12px;
}

.input::placeholder{
    color:#777;
}

.input:focus{
    border-color:#555;
}

.note{
    min-height:20px;
    margin:8px 0 0;
    color:#777;
    font-size:12px;
    line-height:1.45;
}

.status{
    min-height:20px;
    margin-top:10px;
    font-size:12px;
    line-height:1.45;
    color:#ff4d4d;
}

.status.success{
    color:#35c759;
}

.status.loading{
    color:#aaa;
}

.bottom{
    display:flex;
    gap:9px;
    width:100%;
    margin-top:25px;
}

.action{
    width:50%;
    height:42px;
    border-radius:22px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.back-btn{
    background:#000;
    border:1px solid #555;
    color:#0095f6;
}

.next-btn{
    background:#2d80bd;
    border:0;
    color:#000;
}

.next-btn:hover{
    background:#348dca;
}

.next-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

@media(max-width:600px){

    .box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:60px;
    }

    .header{
        margin-bottom:22px;
    }

    .header-title{
        font-size:15px;
    }

    .title{
        font-size:21px;
    }

    .description{
        font-size:12px;
    }

    .tab{
        height:44px;
        font-size:12px;
    }

    .input{
        height:44px;
        font-size:12px;
    }

    .note{
        font-size:11px;
    }

    .action{
        height:42px;
        font-size:12px;
    }

    .status{
        font-size:12px;
    }
}
</style>

</head>

<body>

<div class="page">

<div class="box">

<div class="header">

<div
    id="topBack"
    class="back"
    aria-label="Geri"
    role="button"
    tabindex="0"
>‹</div>

<div class="header-title">
    Kayıt ol
</div>

</div>

<h1 class="title">
    İletişim bilgini ekle
</h1>

<p class="description">
    Hesabını doğrulamak için e-posta adresi ya<br>
    da telefon numarası kullan.
</p>

<div class="tabs">

<button
    id="emailTab"
    class="tab email"
    type="button"
>
    E-posta
</button>

<button
    id="phoneTab"
    class="tab phone"
    type="button"
>
    Telefon
</button>

</div>

<input
    id="contact"
    class="input"
    type="email"
    autocomplete="email"
    placeholder="E-posta adresi"
>

<div id="note" class="note">
    Devam ettiğinde e-posta adresine doğrulama e-postası gönderilir.
</div>

<div id="status" class="status"></div>

<div class="bottom">

<button
    id="backBtn"
    class="action back-btn"
    type="button"
>
    Geri
</button>

<button
    id="nextBtn"
    class="action next-btn"
    type="button"
>
    İleri
</button>

</div>

</div>
</div>


<script type="module">

"use strict";


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    setPersistence,
    browserLocalPersistence,
    createUserWithEmailAndPassword,
    sendEmailVerification
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain:
        "mim-ea133.firebaseapp.com",

    databaseURL:
        "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "mim-ea133",

    storageBucket:
        "mim-ea133.firebasestorage.app",

    messagingSenderId:
        "303525353436",

    appId:
        "1:303525353436:web:082fc090b5025e19942119",

    measurementId:
        "G-K962QE5P1R"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =====================================================
   ELEMENTLER
===================================================== */

const emailTab =
    document.getElementById("emailTab");

const phoneTab =
    document.getElementById("phoneTab");

const contact =
    document.getElementById("contact");

const note =
    document.getElementById("note");

const nextBtn =
    document.getElementById("nextBtn");

const backBtn =
    document.getElementById("backBtn");

const topBack =
    document.getElementById("topBack");

const status =
    document.getElementById("status");


let mode = "email";
let busy = false;


/* =====================================================
   USERNAME
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const username =
    (
        params.get("username") ||
        sessionStorage.getItem(
            "minegram_register_username"
        ) ||
        ""
    )
    .trim()
    .replace(/^@/,"")
    .toLowerCase();


if(username){

    sessionStorage.setItem(
        "minegram_register_username",
        username
    );

}


/* =====================================================
   MESAJ
===================================================== */

function showStatus(
    text,
    success = false
){

    status.textContent =
        text || "";

    status.className =
        success
            ? "status success"
            : "status";
}


/* =====================================================
   FIREBASE PERSISTENCE
===================================================== */

try{

    await setPersistence(
        auth,
        browserLocalPersistence
    );

    console.log(
        "[MINEGRAM] Firebase persistence hazır."
    );

}catch(error){

    console.error(
        "[MINEGRAM] Persistence hatası:",
        error
    );

}


/* =====================================================
   E-POSTA
===================================================== */

emailTab.addEventListener(
    "click",
    function(){

        mode = "email";

        emailTab.style.background =
            "#554f67";

        emailTab.style.borderColor =
            "#554f67";

        emailTab.style.color =
            "#eee8fa";


        phoneTab.style.background =
            "#000";

        phoneTab.style.borderColor =
            "#292929";

        phoneTab.style.color =
            "#fff";


        contact.type =
            "email";

        contact.autocomplete =
            "email";

        contact.placeholder =
            "E-posta adresi";


        note.textContent =
            "Devam ettiğinde e-posta adresine doğrulama e-postası gönderilir.";


        showStatus("");

    }
);


/* =====================================================
   TELEFON
===================================================== */

phoneTab.addEventListener(
    "click",
    function(){

        mode = "phone";


        phoneTab.style.background =
            "#554f67";

        phoneTab.style.borderColor =
            "#554f67";

        phoneTab.style.color =
            "#eee8fa";


        emailTab.style.background =
            "#000";

        emailTab.style.borderColor =
            "#292929";

        emailTab.style.color =
            "#fff";


        contact.type =
            "tel";

        contact.autocomplete =
            "tel";

        contact.placeholder =
            "Telefon numarası";


        note.textContent =
            "Telefon doğrulaması bu sürümde kullanılmıyor. E-posta ile devam et.";


        showStatus("");

    }
);


/* =====================================================
   GERİ
===================================================== */

function goBack(){

    window.location.href =
        "./sifre-olustur.html?username=" +
        encodeURIComponent(username);

}


topBack.addEventListener(
    "click",
    goBack
);


backBtn.addEventListener(
    "click",
    goBack
);


topBack.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            goBack();

        }

    }
);


/* =====================================================
   HATA MESAJI
===================================================== */

function firebaseError(error){

    console.error(
        "[MINEGRAM] Firebase hata:",
        error
    );


    switch(error.code){

        case "auth/email-already-in-use":

            return "Bu e-posta adresi zaten kayıtlı.";

        case "auth/invalid-email":

            return "Geçerli bir e-posta adresi gir.";

        case "auth/weak-password":

            return "Şifre çok zayıf. En az 6 karakter kullan.";

        case "auth/operation-not-allowed":

            return "Firebase'de E-posta/Şifre girişi etkin değil.";

        case "auth/network-request-failed":

            return "İnternet bağlantısı kurulamadı.";

        case "auth/too-many-requests":

            return "Çok fazla istek gönderildi. Bir süre sonra tekrar dene.";

        default:

            return (
                "Firebase hatası: " +
                (
                    error.message ||
                    error.code ||
                    "Bilinmeyen hata"
                )
            );
    }
}


/* =====================================================
   İLERİ
===================================================== */

async function goNext(){

    if(busy){

        return;
    }


    const value =
        contact.value.trim();


    /* =================================================
       TELEFON
    ================================================= */

    if(mode === "phone"){

        showStatus(
            "Şimdilik e-posta ile doğrulama kullanılıyor. E-posta sekmesini seç."
        );

        return;
    }


    /* =================================================
       BOŞ
    ================================================= */

    if(!value){

        showStatus(
            "Lütfen e-posta adresini gir."
        );

        contact.focus();

        return;
    }


    /* =================================================
       E-POSTA KONTROL
    ================================================= */

    if(
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)
    ){

        showStatus(
            "Geçerli bir e-posta adresi gir."
        );

        contact.focus();

        return;
    }


    /* =================================================
       ŞİFREYİ AL
    ================================================= */

    const password =
        sessionStorage.getItem(
            "minegram_register_password"
        );


    if(!password){

        showStatus(
            "Kayıt şifresi bulunamadı. Şifre oluşturma sayfasına dön."
        );

        return;
    }


    if(password.length < 6){

        showStatus(
            "Şifre en az 6 karakter olmalı."
        );

        return;
    }


    /* =================================================
       KAYDET
    ================================================= */

    sessionStorage.setItem(
        "minegram_register_email",
        value
    );


    if(username){

        sessionStorage.setItem(
            "minegram_register_username",
            username
        );

    }


    /* =================================================
       BUTON
    ================================================= */

    busy = true;

    nextBtn.disabled =
        true;

    nextBtn.textContent =
        "Hesap oluşturuluyor...";


    showStatus(
        "Firebase hesabı oluşturuluyor...",
        true
    );


    try{

        /* =================================================
           FIREBASE HESABI OLUŞTUR
           
           ÖNEMLİ:
           Bu işlem başarılı olduğunda Firebase
           kullanıcıyı otomatik olarak oturum açtırır.
        ================================================= */

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                value,
                password
            );


        const user =
            userCredential.user;


        console.log(
            "[MINEGRAM] Firebase kullanıcı oluşturuldu:",
            user.uid
        );


        /* =================================================
           SESSION
        ================================================= */

        sessionStorage.setItem(
            "minegram_uid",
            user.uid
        );


        sessionStorage.setItem(
            "minegram_register_email",
            user.email || value
        );


        /* =================================================
           DİL
        ================================================= */

        auth.languageCode =
            "tr";


        /* =================================================
           DOĞRULAMA E-POSTASI GÖNDER
        ================================================= */

        showStatus(
            "Doğrulama e-postası gönderiliyor...",
            true
        );


        await sendEmailVerification(
            user
        );


        console.log(
            "[MINEGRAM] Doğrulama e-postası gönderildi."
        );


        /* =================================================
           SONRAKİ SAYFA
        ================================================= */

        showStatus(
            "Doğrulama e-postası gönderildi. E-postanı kontrol et.",
            true
        );


        nextBtn.textContent =
            "Doğrulama sayfasına geçiliyor...";


        const url =
            "./hesap-doğrulama.html?username=" +
            encodeURIComponent(username) +
            "&email=" +
            encodeURIComponent(value);


        setTimeout(
            function(){

                window.location.assign(
                    url
                );

            },
            500
        );


    }catch(error){

        const errorText =
            firebaseError(error);


        showStatus(
            errorText
        );


        busy = false;

        nextBtn.disabled =
            false;

        nextBtn.textContent =
            "İleri";

    }

}


/* =====================================================
   İLERİ BUTONU
===================================================== */

nextBtn.addEventListener(
    "click",
    goNext
);


/* =====================================================
   ENTER
===================================================== */

contact.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            goNext();

        }

    }
);


/* =====================================================
   KAYITLI BİLGİ
===================================================== */

const savedEmail =
    sessionStorage.getItem(
        "minegram_register_email"
    );


const savedPhone =
    sessionStorage.getItem(
        "minegram_register_phone"
    );


if(savedEmail){

    mode = "email";

    contact.value =
        savedEmail;

}
else if(savedPhone){

    phoneTab.click();

    contact.value =
        savedPhone;

}


/* =====================================================
   HAZIR
===================================================== */

console.log(
    "[MINEGRAM] İletişim sayfası hazır."
);

console.log(
    "[MINEGRAM] Username:",
    username
);

console.log(
    "[MINEGRAM] Firebase Auth hazır."
);

</script>

</body>
</html>
