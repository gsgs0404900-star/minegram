<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Minegram - İletişim Bilgileri</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:365px;
    margin-top:90px;
    text-align:center;
}

.header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:25px;
}

.back{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    margin-right:8px;
}

.header-title{
    font-size:16px;
    font-weight:700;
}

.title{
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 12px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.45;
    margin:0 0 22px;
}

.tabs{
    display:flex;
    gap:9px;
    width:100%;
    margin-bottom:9px;
}

.tab{
    width:50%;
    height:44px;
    border-radius:7px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.tab.email{
    border:1px solid #554f67;
    background:#554f67;
    color:#eee8fa;
}

.tab.phone{
    border:1px solid #292929;
    background:#000;
    color:#fff;
}

.input{
    width:100%;
    height:44px;
    margin-bottom:9px;
    padding:0 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#000;
    color:#fff;
    outline:none;
    font-size:12px;
}

.input::placeholder{
    color:#777;
}

.input:focus{
    border-color:#555;
}

.note{
    min-height:20px;
    margin:8px 0 0;
    color:#777;
    font-size:12px;
    line-height:1.45;
}

.status{
    min-height:20px;
    margin-top:10px;
    font-size:12px;
    color:#ff4d4d;
}

.status.success{
    color:#35c759;
}

.status.loading{
    color:#aaa;
}

.bottom{
    display:flex;
    gap:9px;
    width:100%;
    margin-top:25px;
}

.action{
    width:50%;
    height:42px;
    border-radius:22px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.back-btn{
    background:#000;
    border:1px solid #555;
    color:#0095f6;
}

.next-btn{
    background:#2d80bd;
    border:0;
    color:#000;
}

.next-btn:hover{
    background:#348dca;
}

.next-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

@media(max-width:600px){

    .box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:60px;
    }

    .header{
        margin-bottom:22px;
    }

    .header-title{
        font-size:15px;
    }

    .title{
        font-size:21px;
    }

    .description{
        font-size:12px;
    }

    .tab{
        height:44px;
        font-size:12px;
    }

    .input{
        height:44px;
        font-size:12px;
    }

    .note{
        font-size:11px;
    }

    .action{
        height:42px;
        font-size:12px;
    }

    .status{
        font-size:12px;
    }
}
</style>

</head>

<body>

<div class="page">

<div class="box">

<div class="header">

<div
    id="topBack"
    class="back"
    aria-label="Geri"
    role="button"
    tabindex="0"
>
    ‹
</div>

<div class="header-title">
    Kayıt ol
</div>

</div>

<h1 class="title">
    İletişim bilgini ekle
</h1>

<p class="description">
    Hesabını doğrulamak için e-posta adresi ya<br>
    da telefon numarası kullan.
</p>

<div class="tabs">

<button
    id="emailTab"
    class="tab email"
    type="button"
>
    E-posta
</button>

<button
    id="phoneTab"
    class="tab phone"
    type="button"
>
    Telefon
</button>

</div>

<input
    id="contact"
    class="input"
    type="email"
    autocomplete="email"
    placeholder="E-posta adresi"
>

<div id="note" class="note">
    Devam ettiğinde e-posta adresine 6 haneli doğrulama kodu gönderilir.
</div>

<div id="status" class="status"></div>

<div class="bottom">

<button
    id="backBtn"
    class="action back-btn"
    type="button"
>
    Geri
</button>

<button
    id="nextBtn"
    class="action next-btn"
    type="button"
>
    İleri
</button>

</div>

</div>
</div>


<script type="module">

"use strict";


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFunctions,
    httpsCallable
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-functions.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain:
        "mim-ea133.firebaseapp.com",

    databaseURL:
        "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "mim-ea133",

    storageBucket:
        "mim-ea133.firebasestorage.app",

    messagingSenderId:
        "303525353436",

    appId:
        "1:303525353436:web:082fc090b5025e19942119",

    measurementId:
        "G-K962QE5P1R"
};


/* =====================================================
   FIREBASE BAŞLAT
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const functions =
    getFunctions(app);


/* =====================================================
   PERSISTENCE
===================================================== */

try{

    await setPersistence(
        auth,
        browserLocalPersistence
    );

}catch(error){

    console.error(
        "[MINEGRAM] Persistence:",
        error
    );

}


/* =====================================================
   ELEMENTLER
===================================================== */

const emailTab =
    document.getElementById("emailTab");

const phoneTab =
    document.getElementById("phoneTab");

const contact =
    document.getElementById("contact");

const note =
    document.getElementById("note");

const nextBtn =
    document.getElementById("nextBtn");

const backBtn =
    document.getElementById("backBtn");

const topBack =
    document.getElementById("topBack");

const status =
    document.getElementById("status");


let mode = "email";

let busy = false;


/* =====================================================
   USERNAME
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const username =
    (
        params.get("username") ||
        sessionStorage.getItem(
            "minegram_register_username"
        ) ||
        ""
    )
    .trim()
    .replace(/^@/, "")
    .toLowerCase();


if(username){

    sessionStorage.setItem(
        "minegram_register_username",
        username
    );

}


/* =====================================================
   MESAJ
===================================================== */

function showStatus(
    text,
    success = false,
    loading = false
){

    status.textContent =
        text || "";

    status.className =
        "status";

    if(success){

        status.classList.add(
            "success"
        );
    }

    if(loading){

        status.classList.add(
            "loading"
        );
    }

}


/* =====================================================
   E-POSTA TAB
===================================================== */

emailTab.addEventListener(
    "click",
    function(){

        mode = "email";

        emailTab.style.background =
            "#554f67";

        emailTab.style.borderColor =
            "#554f67";

        emailTab.style.color =
            "#eee8fa";


        phoneTab.style.background =
            "#000";

        phoneTab.style.borderColor =
            "#292929";

        phoneTab.style.color =
            "#fff";


        contact.type =
            "email";

        contact.autocomplete =
            "email";

        contact.placeholder =
            "E-posta adresi";


        note.textContent =
            "Devam ettiğinde e-posta adresine 6 haneli doğrulama kodu gönderilir.";


        showStatus("");

    }
);


/* =====================================================
   TELEFON TAB
===================================================== */

phoneTab.addEventListener(
    "click",
    function(){

        mode = "phone";


        phoneTab.style.background =
            "#554f67";

        phoneTab.style.borderColor =
            "#554f67";

        phoneTab.style.color =
            "#eee8fa";


        emailTab.style.background =
            "#000";

        emailTab.style.borderColor =
            "#292929";

        emailTab.style.color =
            "#fff";


        contact.type =
            "tel";

        contact.autocomplete =
            "tel";

        contact.placeholder =
            "Telefon numarası";


        note.textContent =
            "Telefon doğrulaması bu akışta kullanılmıyor. E-posta ile devam et.";


        showStatus("");

    }
);


/* =====================================================
   GERİ
===================================================== */

function goBack(){

    window.location.href =
        "./sifre-olustur.html?username=" +
        encodeURIComponent(
            username
        );

}


topBack.addEventListener(
    "click",
    goBack
);

backBtn.addEventListener(
    "click",
    goBack
);


/* =====================================================
   6 HANELİ KOD GÖNDER
===================================================== */

async function sendCode(){

    const value =
        contact.value.trim();


    if(mode !== "email"){

        showStatus(
            "Şimdilik e-posta ile doğrulama kullanılabilir."
        );

        return;

    }


    if(!value){

        showStatus(
            "Lütfen e-posta adresini gir."
        );

        contact.focus();

        return;

    }


    if(
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(value)
    ){

        showStatus(
            "Geçerli bir e-posta adresi gir."
        );

        contact.focus();

        return;

    }


    const password =
        sessionStorage.getItem(
            "minegram_register_password"
        );


    if(!password){

        showStatus(
            "Şifre bilgisi bulunamadı. Kayıt işlemini tekrar başlat."
        );

        return;

    }


    if(password.length < 6){

        showStatus(
            "Şifre en az 6 karakter olmalı."
        );

        return;

    }


    busy = true;

    nextBtn.disabled =
        true;

    nextBtn.textContent =
        "Gönderiliyor...";


    showStatus(
        "Hesap hazırlanıyor...",
        false,
        true
    );


    try{

        /* =========================================
           FIREBASE HESABI OLUŞTUR
        ========================================= */

        let userCredential;

        try{

            userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    value,
                    password
                );

        }catch(error){

            /*
             * Kullanıcı zaten kayıtlıysa
             * burada dur.
             */

            if(
                error.code ===
                "auth/email-already-in-use"
            ){

                showStatus(
                    "Bu e-posta adresi zaten kayıtlı. Başka bir e-posta adresi kullan."
                );

                busy = false;

                nextBtn.disabled =
                    false;

                nextBtn.textContent =
                    "İleri";

                return;

            }

            throw error;
        }


        const user =
            userCredential.user;


        /* =========================================
           SESSION
        ========================================= */

        sessionStorage.setItem(
            "minegram_uid",
            user.uid
        );

        sessionStorage.setItem(
            "minegram_register_email",
            value
        );

        sessionStorage.setItem(
            "minegram_verification_email",
            value
        );

        sessionStorage.setItem(
            "minegram_verification_uid",
            user.uid
        );


        if(username){

            sessionStorage.setItem(
                "minegram_register_username",
                username
            );

        }


        /* =========================================
           CLOUD FUNCTION
           
           GERÇEK 6 HANELİ KOD BURADA
           ÜRETİLİP E-POSTA İLE GÖNDERİLİR.
        ========================================= */

        showStatus(
            "6 haneli doğrulama kodu gönderiliyor...",
            false,
            true
        );


        const sendVerificationCode =
            httpsCallable(
                functions,
                "sendVerificationCode"
            );


        await sendVerificationCode({

            email:
                value,

            uid:
                user.uid,

            username:
                username || ""

        });


        /* =========================================
           DOĞRULAMA SAYFASINA GİT
        ========================================= */

        showStatus(
            "Kod gönderildi. E-postanı kontrol et.",
            true
        );


        let url =
            "./hesap-doğrulama.html" +
            "?username=" +
            encodeURIComponent(
                username
            ) +
            "&email=" +
            encodeURIComponent(
                value
            );


        setTimeout(
            function(){

                window.location.href =
                    url;

            },
            500
        );


    }catch(error){

        console.error(
            "[MINEGRAM] Kayıt / kod gönderme hatası:",
            error
        );


        let text =
            "Doğrulama kodu gönderilemedi.";


        if(
            error.code ===
            "functions/not-found"
        ){

            text =
                "sendVerificationCode Cloud Function bulunamadı. Firebase Functions'ı deploy et.";

        }
        else if(
            error.code ===
            "functions/unauthenticated"
        ){

            text =
                "Firebase oturumu oluşturulamadı.";

        }
        else if(
            error.code ===
            "functions/resource-exhausted"
        ){

            text =
                "Çok fazla kod istendi. Biraz sonra tekrar dene.";

        }
        else if(
            error.code ===
            "auth/invalid-credential"
        ){

            text =
                "Firebase hesap bilgileri geçersiz.";

        }
        else if(
            error.code ===
            "auth/weak-password"
        ){

            text =
                "Şifre en az 6 karakter olmalı.";

        }
        else if(
            error.message
        ){

            console.error(
                "[MINEGRAM] Ayrıntı:",
                error.message
            );
        }


        showStatus(
            text
        );


        busy = false;

        nextBtn.disabled =
            false;

        nextBtn.textContent =
            "İleri";

    }

}


/* =====================================================
   İLERİ
===================================================== */

nextBtn.addEventListener(
    "click",
    sendCode
);


/* =====================================================
   ENTER
===================================================== */

contact.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendCode();

        }

    }
);


/* =====================================================
   ÜST GERİ
===================================================== */

topBack.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            goBack();

        }

    }
);


/* =====================================================
   KAYITLI E-POSTA
===================================================== */

const savedEmail =
    sessionStorage.getItem(
        "minegram_register_email"
    );


if(savedEmail){

    mode = "email";

    contact.value =
        savedEmail;

}


/* =====================================================
   BAŞLANGIÇ
===================================================== */

console.log(
    "[MINEGRAM] İletişim bilgileri hazır."
);

console.log(
    "[MINEGRAM] Username:",
    username
);

</script>

</body>
</html>
