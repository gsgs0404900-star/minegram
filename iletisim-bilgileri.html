<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>Minegram - İletişim Bilgileri</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:365px;
    margin-top:90px;
    text-align:center;
}

.header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:25px;
}

.back{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    margin-right:8px;
}

.header-title{
    font-size:16px;
    font-weight:700;
}

.title{
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 12px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.45;
    margin:0 0 22px;
}

.tabs{
    display:flex;
    gap:9px;
    width:100%;
    margin-bottom:9px;
}

.tab{
    width:50%;
    height:44px;
    border-radius:7px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.tab.email{
    border:1px solid #554f67;
    background:#554f67;
    color:#eee8fa;
}

.tab.phone{
    border:1px solid #292929;
    background:#000;
    color:#fff;
}

.input{
    width:100%;
    height:44px;
    margin-bottom:9px;
    padding:0 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#000;
    color:#fff;
    outline:none;
    font-size:12px;
}

.input::placeholder{
    color:#777;
}

.input:focus{
    border-color:#555;
}

.note{
    min-height:20px;
    margin:8px 0 0;
    color:#777;
    font-size:12px;
    line-height:1.45;
}

.status{
    min-height:20px;
    margin-top:10px;
    font-size:12px;
    line-height:1.45;
    color:#ff4d4d;
}

.status.success{
    color:#35c759;
}

.status.loading{
    color:#aaa;
}

.bottom{
    display:flex;
    gap:9px;
    width:100%;
    margin-top:25px;
}

.action{
    width:50%;
    height:42px;
    border-radius:22px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.back-btn{
    background:#000;
    border:1px solid #555;
    color:#0095f6;
}

.next-btn{
    background:#2d80bd;
    border:0;
    color:#000;
}

.next-btn:hover{
    background:#348dca;
}

.next-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

@media(max-width:600px){

    .box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:60px;
    }

    .header{
        margin-bottom:22px;
    }

    .header-title{
        font-size:15px;
    }

    .title{
        font-size:21px;
    }

    .description{
        font-size:12px;
    }

    .tab{
        height:44px;
        font-size:12px;
    }

    .input{
        height:44px;
        font-size:12px;
    }

    .note{
        font-size:11px;
    }

    .action{
        height:42px;
        font-size:12px;
    }

    .status{
        font-size:12px;
    }
}
</style>

</head>

<body>

<div class="page">

<div class="box">

<div class="header">

<div
    id="topBack"
    class="back"
    aria-label="Geri"
    role="button"
    tabindex="0"
>‹</div>

<div class="header-title">
    Kayıt ol
</div>

</div>

<h1 class="title">
    İletişim bilgini ekle
</h1>

<p class="description">
    Hesabını doğrulamak için e-posta adresi ya<br>
    da telefon numarası kullan.
</p>

<div class="tabs">

<button
id="emailTab"
class="tab email"
type="button"

>

```
E-posta
```

</button>

<button
id="phoneTab"
class="tab phone"
type="button"

>

```
Telefon
```

</button>

</div>

<input
id="contact"
class="input"
type="email"
autocomplete="email"
placeholder="E-posta adresi"

>

<div id="note" class="note">
    Devam ettiğinde e-posta adresine doğrulama bağlantısı gönderilir.
</div>

<div id="status" class="status"></div>

<div class="bottom">

<button
id="backBtn"
class="action back-btn"
type="button"

>

```
Geri
```

</button>

<button
id="nextBtn"
class="action next-btn"
type="button"

>

```
İleri
```

</button>

</div>

</div>
</div>

<script type="module">

"use strict";


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    setPersistence,
    browserLocalPersistence,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendEmailVerification,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain:
        "mim-ea133.firebaseapp.com",

    databaseURL:
        "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "mim-ea133",

    storageBucket:
        "mim-ea133.firebasestorage.app",

    messagingSenderId:
        "303525353436",

    appId:
        "1:303525353436:web:082fc090b5025e19942119",

    measurementId:
        "G-K962QE5P1R"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =====================================================
   ELEMENTLER
===================================================== */

const emailTab =
    document.getElementById("emailTab");

const phoneTab =
    document.getElementById("phoneTab");

const contact =
    document.getElementById("contact");

const note =
    document.getElementById("note");

const nextBtn =
    document.getElementById("nextBtn");

const backBtn =
    document.getElementById("backBtn");

const topBack =
    document.getElementById("topBack");

const status =
    document.getElementById("status");


let mode = "email";
let busy = false;


/* =====================================================
   URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const username =
    (
        params.get("username") ||
        sessionStorage.getItem(
            "minegram_register_username"
        ) ||
        ""
    )
    .trim()
    .replace(/^@/, "")
    .toLowerCase();


/* =====================================================
   USERNAME SAKLA
===================================================== */

if(username){

    sessionStorage.setItem(
        "minegram_register_username",
        username
    );

}


/* =====================================================
   MESAJ
===================================================== */

function showStatus(
    text,
    type = ""
){

    status.textContent =
        text || "";

    status.className =
        "status";

    if(type){

        status.classList.add(type);

    }

}


/* =====================================================
   EMAIL TAB
===================================================== */

emailTab.addEventListener(
    "click",
    function(){

        mode = "email";

        emailTab.style.background =
            "#554f67";

        emailTab.style.borderColor =
            "#554f67";

        emailTab.style.color =
            "#eee8fa";


        phoneTab.style.background =
            "#000";

        phoneTab.style.borderColor =
            "#292929";

        phoneTab.style.color =
            "#fff";


        contact.type =
            "email";

        contact.autocomplete =
            "email";

        contact.placeholder =
            "E-posta adresi";


        note.textContent =
            "Devam ettiğinde e-posta adresine doğrulama bağlantısı gönderilir.";


        showStatus("");

    }
);


/* =====================================================
   PHONE TAB
===================================================== */

phoneTab.addEventListener(
    "click",
    function(){

        mode = "phone";


        phoneTab.style.background =
            "#554f67";

        phoneTab.style.borderColor =
            "#554f67";

        phoneTab.style.color =
            "#eee8fa";


        emailTab.style.background =
            "#000";

        emailTab.style.borderColor =
            "#292929";

        emailTab.style.color =
            "#fff";


        contact.type =
            "tel";

        contact.autocomplete =
            "tel";

        contact.placeholder =
            "Telefon numarası";


        note.textContent =
            "Telefon doğrulaması bu sayfada henüz etkin değil. E-posta ile devam edebilirsin.";


        showStatus("");

    }
);


/* =====================================================
   GERİ
===================================================== */

function goBack(){

    window.location.href =
        "./sifre-olustur.html?username=" +
        encodeURIComponent(username);

}


topBack.addEventListener(
    "click",
    goBack
);


backBtn.addEventListener(
    "click",
    goBack
);


topBack.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            goBack();

        }

    }
);


/* =====================================================
   FIREBASE PERSISTENCE
===================================================== */

try{

    await setPersistence(
        auth,
        browserLocalPersistence
    );

    console.log(
        "[MINEGRAM] Firebase Local Persistence hazır."
    );

}catch(error){

    console.error(
        "[MINEGRAM] Persistence hatası:",
        error
    );

    showStatus(
        "Firebase oturumu hazırlanamadı. Sayfayı yenileyip tekrar dene."
    );

}


/* =====================================================
   KAYITLI BİLGİLER
===================================================== */

const savedEmail =
    sessionStorage.getItem(
        "minegram_register_email"
    );

const savedPhone =
    sessionStorage.getItem(
        "minegram_register_phone"
    );


if(savedEmail){

    mode = "email";

    contact.value =
        savedEmail;

}
else if(savedPhone){

    mode = "phone";

    phoneTab.click();

    contact.value =
        savedPhone;

}


/* =====================================================
   FIREBASE KULLANICI OLUŞTUR / GİRİŞ YAP
===================================================== */

async function createOrLoginFirebaseUser(
    email,
    password
){

    /*
     * Önce yeni hesap oluşturmayı deniyoruz.
     */

    try{

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        console.log(
            "[MINEGRAM] Yeni Firebase hesabı oluşturuldu:",
            credential.user.uid
        );

        return credential.user;

    }
    catch(error){

        console.log(
            "[MINEGRAM] Hesap oluşturma sonucu:",
            error.code
        );


        /*
         * E-posta zaten kayıtlıysa
         * eski hesabın şifresiyle giriş yap.
         */

        if(
            error.code ===
            "auth/email-already-in-use"
        ){

            try{

                const credential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                console.log(
                    "[MINEGRAM] Mevcut Firebase hesabına giriş yapıldı:",
                    credential.user.uid
                );

                return credential.user;

            }
            catch(loginError){

                console.error(
                    "[MINEGRAM] Mevcut hesaba giriş hatası:",
                    loginError
                );


                if(
                    loginError.code ===
                    "auth/wrong-password" ||
                    loginError.code ===
                    "auth/invalid-credential"
                ){

                    throw new Error(
                        "Bu e-posta zaten kayıtlı fakat şifre eşleşmiyor. Kayıtta kullandığın şifreyi gir."
                    );

                }

                throw loginError;

            }

        }


        throw error;

    }

}


/* =====================================================
   FIREBASE HATA MESAJI
===================================================== */

function firebaseErrorMessage(error){

    const code =
        error.code || "";


    if(
        code ===
        "auth/invalid-email"
    ){

        return "Geçerli bir e-posta adresi gir.";

    }


    if(
        code ===
        "auth/weak-password"
    ){

        return "Şifre en az 6 karakter olmalı.";

    }


    if(
        code ===
        "auth/user-disabled"
    ){

        return "Bu hesap devre dışı bırakılmış.";

    }


    if(
        code ===
        "auth/network-request-failed"
    ){

        return "İnternet bağlantısını kontrol et.";

    }


    if(
        code ===
        "auth/too-many-requests"
    ){

        return "Çok fazla deneme yapıldı. Biraz sonra tekrar dene.";

    }


    return (
        error.message ||
        "Firebase işlemi sırasında hata oluştu."
    );

}


/* =====================================================
   İLERİ
===================================================== */

async function goNext(){

    if(busy){

        return;

    }


    const value =
        contact.value.trim();


    /* =================================================
       USERNAME
    ================================================= */

    if(!username){

        showStatus(
            "Kullanıcı adı bulunamadı."
        );

        return;

    }


    /* =================================================
       TELEFON
    ================================================= */

    if(mode === "phone"){

        showStatus(
            "Şimdilik e-posta ile doğrulama kullanılabilir."
        );

        return;

    }


    /* =================================================
       EMAIL BOŞ
    ================================================= */

    if(!value){

        showStatus(
            "Lütfen e-posta adresini gir."
        );

        contact.focus();

        return;

    }


    /* =================================================
       EMAIL KONTROL
    ================================================= */

    if(
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)
    ){

        showStatus(
            "Geçerli bir e-posta adresi gir."
        );

        contact.focus();

        return;

    }


    /* =================================================
       PASSWORD
    ================================================= */

    const password =
        sessionStorage.getItem(
            "minegram_register_password"
        );


    if(!password){

        showStatus(
            "Kayıt şifresi bulunamadı. Şifre oluşturma adımına geri dön."
        );

        return;

    }


    if(password.length < 6){

        showStatus(
            "Şifre en az 6 karakter olmalı."
        );

        return;

    }


    /* =================================================
       KAYDET
    ================================================= */

    sessionStorage.setItem(
        "minegram_register_email",
        value
    );

    sessionStorage.setItem(
        "minegram_register_username",
        username
    );


    busy = true;

    nextBtn.disabled =
        true;

    nextBtn.textContent =
        "Hazırlanıyor...";


    showStatus(
        "Firebase hesabı hazırlanıyor...",
        "loading"
    );


    try{

        /*
         * Önce Firebase hesabını oluştur.
         * Zaten varsa giriş yap.
         */

        const user =
            await createOrLoginFirebaseUser(
                value,
                password
            );


        if(!user){

            throw new Error(
                "Firebase kullanıcısı oluşturulamadı."
            );

        }


        /*
         * UID'yi kaydet.
         */

        sessionStorage.setItem(
            "minegram_uid",
            user.uid
        );


        /*
         * E-posta bilgisini kaydet.
         */

        if(user.email){

            sessionStorage.setItem(
                "minegram_register_email",
                user.email
            );

        }


        /*
         * Kullanıcı adı.
         */

        sessionStorage.setItem(
            "minegram_register_username",
            username
        );


        /*
         * Kullanıcı zaten doğrulanmamışsa
         * doğrulama maili gönder.
         */

        if(!user.emailVerified){

            showStatus(
                "Doğrulama e-postası gönderiliyor...",
                "loading"
            );


            await sendEmailVerification(
                user
            );


            console.log(
                "[MINEGRAM] Doğrulama e-postası gönderildi."
            );

        }


        /*
         * HER ŞEY TAMAM.
         */

        showStatus(
            "Doğrulama e-postası gönderildi. E-postanı kontrol et.",
            "success"
        );


        nextBtn.textContent =
            "Doğrulama";


        /*
         * Hesap doğrulama sayfasına geç.
         */

        let url =
            "./hesap-doğrulama.html?username=" +
            encodeURIComponent(username) +
            "&email=" +
            encodeURIComponent(
                user.email || value
            );


        console.log(
            "[MINEGRAM] Firebase UID:",
            user.uid
        );

        console.log(
            "[MINEGRAM] Doğrulama sayfası:",
            url
        );


        setTimeout(
            function(){

                window.location.assign(
                    url
                );

            },
            700
        );

    }
    catch(error){

        console.error(
            "[MINEGRAM] Firebase kayıt/giriş hatası:",
            error
        );


        /*
         * Özel hata mesajı.
         */

        if(
            error.message &&
            error.message.startsWith(
                "Bu e-posta zaten kayıtlı"
            )
        ){

            showStatus(
                error.message
            );

        }
        else{

            showStatus(
                firebaseErrorMessage(
                    error
                )
            );

        }


        busy = false;

        nextBtn.disabled =
            false;

        nextBtn.textContent =
            "İleri";

    }

}


/* =====================================================
   BUTON
===================================================== */

nextBtn.addEventListener(
    "click",
    goNext
);


/* =====================================================
   ENTER
===================================================== */

contact.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            goNext();

        }

    }
);


/* =====================================================
   INPUT TEMİZLE
===================================================== */

contact.addEventListener(
    "input",
    function(){

        if(status.textContent){

            showStatus("");

        }

    }
);


/* =====================================================
   AUTH DURUMU
===================================================== */

onAuthStateChanged(
    auth,
    function(user){

        console.log(
            "[MINEGRAM] Auth durumu:",
            user
                ? user.uid
                : "oturum yok"
        );


        if(user){

            sessionStorage.setItem(
                "minegram_uid",
                user.uid
            );


            if(user.email){

                sessionStorage.setItem(
                    "minegram_register_email",
                    user.email
                );

            }

        }

    }
);


/* =====================================================
   HAZIR
===================================================== */

console.log(
    "[MINEGRAM] İletişim sayfası hazır."
);

console.log(
    "[MINEGRAM] Username:",
    username
);

console.log(
    "[MINEGRAM] Firebase Auth hazır."
);

</script>

</body>
</html>
