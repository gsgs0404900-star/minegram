<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>İletişim bilgini ekle - Minegram</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow:hidden;
}

.page{
  width:100%;
  height:100dvh;
  min-height:100vh;
  background:#000;
  position:relative;
}

/* =========================
   ÜST BAŞLIK
========================= */

.header{
  height:82px;
  display:flex;
  align-items:center;
  padding:0 48px;
}

.back{
  color:#fff;
  font-size:55px;
  line-height:1;
  font-weight:300;
  margin-right:27px;
  margin-top:-7px;
  cursor:pointer;
  user-select:none;
}

.header-title{
  font-size:29px;
  font-weight:700;
}

/* =========================
   ANA İÇERİK
   ŞİFRE OLUŞTUR İLE AYNI
========================= */

.content{
  position:absolute;
  left:7.2%;
  right:7.2%;
  top:17.2%;
}

.title{
  text-align:center;
  font-size:47px;
  line-height:1.15;
  font-weight:800;
  margin:0 0 34px;
}

.description{
  color:#b9b9b9;
  font-size:31px;
  line-height:1.55;
  margin:0 0 69px;
}

/* =========================
   E-POSTA / TELEFON
========================= */

.tabs{
  display:flex;
  gap:22px;
  width:100%;
  margin-bottom:58px;
}

.tab{
  width:50%;
  height:68px;
  border-radius:17px;
  font-size:29px;
  font-weight:800;
  cursor:pointer;
}

.tab.email{
  border:2px solid #554f67;
  background:#554f67;
  color:#eee8fa;
}

.tab.phone{
  border:2px solid #888;
  background:#000;
  color:#fff;
}

/* =========================
   INPUT
========================= */

.input{
  width:100%;
  height:119px;
  background:#111;
  border:2px solid #666;
  border-radius:10px;
  color:#fff;
  outline:none;
  padding:0 32px;
  font-size:31px;
}

.input:focus{
  border-color:#888;
}

.input::placeholder{
  color:#b8b8b8;
  opacity:1;
}

/* =========================
   AÇIKLAMA
========================= */

.note{
  color:#ddd;
  font-size:27px;
  line-height:1.8;
  margin:14px 0 0;
}

/* =========================
   ALT BUTONLAR
========================= */

.bottom{
  position:absolute;
  left:7.2%;
  right:7.2%;
  bottom:6.1%;
  display:flex;
  gap:22px;
}

button.action{
  height:88px;
  border-radius:50px;
  font-size:27px;
  font-weight:800;
  cursor:pointer;
}

.back-btn{
  width:50%;
  background:#000;
  border:2px solid #888;
  color:#62b0ed;
}

.next-btn{
  width:50%;
  background:#62b0ed;
  border:2px solid #62b0ed;
  color:#30207c;
}

/* =========================
   DURUM
========================= */

.status{
  position:fixed;
  left:7.2%;
  right:7.2%;
  bottom:calc(6.1% + 100px);
  text-align:center;
  font-size:16px;
  color:#ff8585;
  display:none;
}

.status.success{
  color:#55b8ff;
}

/* =========================
   TELEFON
   ŞİFRE OLUŞTUR İLE AYNI
========================= */

@media(max-width:600px){

  .header{
    height:72px;
    padding:0 19px;
  }

  .back{
    font-size:43px;
    margin-right:17px;
  }

  .header-title{
    font-size:23px;
  }

  .content{
    left:7.2%;
    right:7.2%;
    top:16.5%;
  }

  .title{
    font-size:34px;
    margin-bottom:27px;
  }

  .description{
    font-size:22px;
    line-height:1.55;
    margin-bottom:47px;
  }

  .tabs{
    gap:20px;
    margin-bottom:59px;
  }

  .tab{
    height:68px;
    font-size:21px;
    border-radius:16px;
  }

  .input{
    height:82px;
    padding:0 22px;
    font-size:24px;
    border-radius:9px;
  }

  .note{
    font-size:21px;
    line-height:1.6;
    margin-top:12px;
  }

  .bottom{
    left:7.2%;
    right:7.2%;
    bottom:5.8%;
    gap:20px;
  }

  button.action{
    height:72px;
    font-size:21px;
  }

  .status{
    bottom:calc(5.8% + 83px);
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="page">

  <!-- =========================
       ÜST
  ========================== -->

  <header class="header">

    <div
      class="back"
      id="topBack"
      aria-label="Geri"
    >
      ‹
    </div>

    <div class="header-title">
      Kayıt ol
    </div>

  </header>


  <!-- =========================
       İÇERİK
  ========================== -->

  <main class="content">

    <h1 class="title">
      İletişim bilgini ekle
    </h1>

    <p class="description">
      Hesabını doğrulamak için e-posta adresi ya<br>
      da telefon numarası kullan.
    </p>


    <div class="tabs">

      <button
        id="emailTab"
        class="tab email"
        type="button"
      >
        E-posta
      </button>

      <button
        id="phoneTab"
        class="tab phone"
        type="button"
      >
        Telefon
      </button>

    </div>


    <input
      id="contact"
      class="input"
      type="email"
      autocomplete="email"
      placeholder="E-posta adresi"
    >


    <div
      id="note"
      class="note"
    >
      Devam ettiğinde e-posta adresine doğrulama
      kodu gönderilir.
    </div>

  </main>


  <div
    id="status"
    class="status"
  ></div>


  <!-- =========================
       ALT BUTONLAR
  ========================== -->

  <div class="bottom">

    <button
      id="backBtn"
      class="action back-btn"
      type="button"
    >
      Geri
    </button>

    <button
      id="nextBtn"
      class="action next-btn"
      type="button"
    >
      İleri
    </button>

  </div>

</div>


<!-- =========================================================
     FIREBASE
========================================================= -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================================
   FIREBASE AYARLARI
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

  authDomain:
    "mim-ea133.firebaseapp.com",

  databaseURL:
    "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "mim-ea133",

  storageBucket:
    "mim-ea133.firebasestorage.app",

  messagingSenderId:
    "303525353436",

  appId:
    "1:303525353436:web:082fc090b5025e19942119",

  measurementId:
    "G-K962QE5P1R"
};


/* Firebase başlat */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


/* =========================================================
   ELEMENTLER
========================================================= */

const emailTab =
  document.getElementById("emailTab");

const phoneTab =
  document.getElementById("phoneTab");

const contact =
  document.getElementById("contact");

const note =
  document.getElementById("note");

const nextBtn =
  document.getElementById("nextBtn");

const backBtn =
  document.getElementById("backBtn");

const topBack =
  document.getElementById("topBack");

const status =
  document.getElementById("status");


/* =========================================================
   DEĞİŞKEN
========================================================= */

let mode = "email";
let busy = false;


/* =========================================================
   KULLANICI ADINI AL
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const usernameFromUrl =
  params.get("username");

const savedUsername =
  sessionStorage.getItem(
    "minegram_register_username"
  );

const username =
  usernameFromUrl ||
  savedUsername ||
  "";


/* =========================================================
   MESAJ
========================================================= */

function showStatus(
  text,
  success = false
){

  status.textContent =
    text;

  status.className =
    "status";

  if(success){

    status.classList.add(
      "success"
    );

  }

  status.style.display =
    "block";
}


/* =========================================================
   E-POSTA
========================================================= */

emailTab.addEventListener(
  "click",
  function(){

    mode = "email";

    emailTab.style.background =
      "#554f67";

    emailTab.style.borderColor =
      "#554f67";

    emailTab.style.color =
      "#eee8fa";

    phoneTab.style.background =
      "#000";

    phoneTab.style.borderColor =
      "#888";

    phoneTab.style.color =
      "#fff";

    contact.type =
      "email";

    contact.autocomplete =
      "email";

    contact.placeholder =
      "E-posta adresi";

    note.textContent =
      "Devam ettiğinde e-posta adresine doğrulama kodu gönderilir.";

    status.style.display =
      "none";
  }
);


/* =========================================================
   TELEFON
========================================================= */

phoneTab.addEventListener(
  "click",
  function(){

    mode = "phone";

    phoneTab.style.background =
      "#554f67";

    phoneTab.style.borderColor =
      "#554f67";

    phoneTab.style.color =
      "#eee8fa";

    emailTab.style.background =
      "#000";

    emailTab.style.borderColor =
      "#888";

    emailTab.style.color =
      "#fff";

    contact.type =
      "tel";

    contact.autocomplete =
      "tel";

    contact.placeholder =
      "Telefon numarası";

    note.textContent =
      "Devam ettiğinde telefon numaran doğrulama için kullanılacaktır.";

    status.style.display =
      "none";
  }
);


/* =========================================================
   GERİ
========================================================= */

function goBack(){

  /*
   * İletişim ekranından bir önceki ekran:
   *
   * sifre-olustur.html
   */

  window.location.href =
    "./sifre-olustur.html?username=" +
    encodeURIComponent(username);
}


topBack.addEventListener(
  "click",
  goBack
);

backBtn.addEventListener(
  "click",
  goBack
);


/* =========================================================
   E-POSTA KAYDET
========================================================= */

async function registerEmail(){

  const email =
    contact.value.trim();


  if(!email){

    showStatus(
      "Lütfen e-posta adresini gir."
    );

    return false;
  }


  if(
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
      .test(email)
  ){

    showStatus(
      "Geçerli bir e-posta adresi gir."
    );

    return false;
  }


  sessionStorage.setItem(
    "minegram_register_email",
    email
  );


  if(username){

    sessionStorage.setItem(
      "minegram_register_username",
      username
    );

  }


  return true;
}


/* =========================================================
   TELEFON KAYDET
========================================================= */

async function registerPhone(){

  const phone =
    contact.value.trim();


  if(!phone){

    showStatus(
      "Lütfen telefon numaranı gir."
    );

    return false;
  }


  const cleanPhone =
    phone.replace(
      /[\s()-]/g,
      ""
    );


  if(
    cleanPhone.length < 10
  ){

    showStatus(
      "Geçerli bir telefon numarası gir."
    );

    return false;
  }


  sessionStorage.setItem(
    "minegram_register_phone",
    phone
  );


  if(username){

    sessionStorage.setItem(
      "minegram_register_username",
      username
    );

  }


  return true;
}


/* =========================================================
   İLERİ
========================================================= */

nextBtn.addEventListener(
  "click",
  async function(){

    if(busy){
      return;
    }

    busy = true;

    let valid = false;

    try{

      if(mode === "email"){

        valid =
          await registerEmail();

      }
      else{

        valid =
          await registerPhone();

      }


      if(!valid){

        busy = false;

        return;
      }


      /*
       * BURASI ÖNEMLİ
       *
       * İletişim bilgilerinden sonraki
       * sayfa artık kayit.html DEĞİL.
       *
       * Kayıt işleminin tamamlanacağı
       * sonraki sayfaya geçiyoruz.
       *
       * Şimdilik kayıt tamamlanması
       * için kayit-tamamla.html kullanılıyor.
       */

      showStatus(
        "Bilgilerin kaydedildi. Devam ediliyor...",
        true
      );

      nextBtn.disabled =
        true;

      nextBtn.textContent =
        "Devam ediliyor...";


      setTimeout(
        function(){

          window.location.href =
            "./iletisim-bilgileri.html?username=" +
            encodeURIComponent(username) +
            "&" +
            (
              mode === "email"
                ? "email=" + encodeURIComponent(
                    contact.value.trim()
                  )
                : "phone=" + encodeURIComponent(
                    contact.value.trim()
                  )
            );

        },
        400
      );

    }
    catch(error){

      console.error(
        "Firebase hata:",
        error
      );

      showStatus(
        error.message ||
        "İşlem sırasında bir hata oluştu."
      );

      busy = false;

      nextBtn.disabled =
        false;

      nextBtn.textContent =
        "İleri";
    }

  }
);


/* =========================================================
   ENTER
========================================================= */

contact.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      nextBtn.click();

    }

  }
);


/* =========================================================
   SAYFA AÇILIŞI
========================================================= */

const savedEmail =
  sessionStorage.getItem(
    "minegram_register_email"
  );

const savedPhone =
  sessionStorage.getItem(
    "minegram_register_phone"
  );


if(savedEmail){

  mode = "email";

  contact.value =
    savedEmail;

}
else if(savedPhone){

  mode = "phone";

  contact.value =
    savedPhone;

  phoneTab.click();

}

</script>

</body>
</html>
