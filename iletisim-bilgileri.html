<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Minegram - İletişim Bilgileri</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:365px;
    margin-top:90px;
    text-align:center;
}

/* ÜST BAŞLIK */

.header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:25px;
}

.back{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    margin-right:8px;
}

.header-title{
    font-size:16px;
    font-weight:700;
}

/* BAŞLIK */

.title{
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 12px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.45;
    margin:0 0 22px;
}

/* SEKME */

.tabs{
    display:flex;
    gap:9px;
    width:100%;
    margin-bottom:9px;
}

.tab{
    width:50%;
    height:44px;
    border-radius:7px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.tab.email{
    border:1px solid #554f67;
    background:#554f67;
    color:#eee8fa;
}

.tab.phone{
    border:1px solid #292929;
    background:#000;
    color:#fff;
}

/* INPUT */

.input{
    width:100%;
    height:44px;
    margin-bottom:9px;
    padding:0 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#000;
    color:#fff;
    outline:none;
    font-size:12px;
}

.input::placeholder{
    color:#777;
}

.input:focus{
    border-color:#555;
}

/* AÇIKLAMA */

.note{
    min-height:20px;
    margin:8px 0 0;
    color:#777;
    font-size:12px;
    line-height:1.45;
}

/* DURUM */

.status{
    min-height:20px;
    margin-top:10px;
    font-size:12px;
    color:#ff4d4d;
}

.status.success{
    color:#35c759;
}

/* ALT BUTONLAR */

.bottom{
    display:flex;
    gap:9px;
    width:100%;
    margin-top:25px;
}

.action{
    width:50%;
    height:42px;
    border-radius:22px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.back-btn{
    background:#000;
    border:1px solid #555;
    color:#0095f6;
}

.next-btn{
    background:#2d80bd;
    border:0;
    color:#000;
}

.next-btn:hover{
    background:#348dca;
}

.next-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* MOBİL */

@media(max-width:600px){

    .box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:60px;
    }

    .header{
        margin-bottom:22px;
    }

    .header-title{
        font-size:15px;
    }

    .title{
        font-size:21px;
    }

    .description{
        font-size:12px;
    }

    .tab{
        height:44px;
        font-size:12px;
    }

    .input{
        height:44px;
        font-size:12px;
    }

    .note{
        font-size:11px;
    }

    .action{
        height:42px;
        font-size:12px;
    }
}
</style>

</head>

<body>

<div class="page">

<div class="box">

<!-- ÜST -->

<div class="header">

    <div
        id="topBack"
        class="back"
        aria-label="Geri"
    >
        ‹
    </div>

    <div class="header-title">
        Kayıt ol
    </div>

</div>


<!-- BAŞLIK -->

<h1 class="title">
    İletişim bilgini ekle
</h1>

<p class="description">
    Hesabını doğrulamak için e-posta adresi ya<br>
    da telefon numarası kullan.
</p>


<!-- E-POSTA / TELEFON -->

<div class="tabs">

    <button
        id="emailTab"
        class="tab email"
        type="button"
    >
        E-posta
    </button>

    <button
        id="phoneTab"
        class="tab phone"
        type="button"
    >
        Telefon
    </button>

</div>


<!-- İLETİŞİM -->

<input
    id="contact"
    class="input"
    type="email"
    autocomplete="email"
    placeholder="E-posta adresi"
>


<div
    id="note"
    class="note"
>
    Devam ettiğinde e-posta adresine doğrulama kodu gönderilir.
</div>


<!-- DURUM -->

<div
    id="status"
    class="status"
></div>


<!-- BUTONLAR -->

<div class="bottom">

    <button
        id="backBtn"
        class="action back-btn"
        type="button"
    >
        Geri
    </button>

    <button
        id="nextBtn"
        class="action next-btn"
        type="button"
    >
        İleri
    </button>

</div>

</div>

</div>

<script type="module">

"use strict";


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain:
        "mim-ea133.firebaseapp.com",

    databaseURL:
        "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "mim-ea133",

    storageBucket:
        "mim-ea133.firebasestorage.app",

    messagingSenderId:
        "303525353436",

    appId:
        "1:303525353436:web:082fc090b5025e19942119",

    measurementId:
        "G-K962QE5P1R"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =====================================================
   ELEMENTLER
===================================================== */

const emailTab =
    document.getElementById("emailTab");

const phoneTab =
    document.getElementById("phoneTab");

const contact =
    document.getElementById("contact");

const note =
    document.getElementById("note");

const nextBtn =
    document.getElementById("nextBtn");

const backBtn =
    document.getElementById("backBtn");

const topBack =
    document.getElementById("topBack");

const status =
    document.getElementById("status");


let mode = "email";
let busy = false;


/* =====================================================
   USERNAME
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const username =
    params.get("username") ||
    sessionStorage.getItem(
        "minegram_register_username"
    ) ||
    "";


/* =====================================================
   MESAJ
===================================================== */

function showStatus(
    text,
    success = false
){

    status.textContent =
        text || "";

    status.className =
        success
            ? "status success"
            : "status";

}


/* =====================================================
   E-POSTA
===================================================== */

emailTab.addEventListener(
    "click",
    function(){

        mode = "email";

        emailTab.style.background =
            "#554f67";

        emailTab.style.borderColor =
            "#554f67";

        emailTab.style.color =
            "#eee8fa";


        phoneTab.style.background =
            "#000";

        phoneTab.style.borderColor =
            "#292929";

        phoneTab.style.color =
            "#fff";


        contact.type =
            "email";

        contact.autocomplete =
            "email";

        contact.placeholder =
            "E-posta adresi";


        note.textContent =
            "Devam ettiğinde e-posta adresine doğrulama kodu gönderilir.";

        showStatus("");

    }
);


/* =====================================================
   TELEFON
===================================================== */

phoneTab.addEventListener(
    "click",
    function(){

        mode = "phone";

        phoneTab.style.background =
            "#554f67";

        phoneTab.style.borderColor =
            "#554f67";

        phoneTab.style.color =
            "#eee8fa";


        emailTab.style.background =
            "#000";

        emailTab.style.borderColor =
            "#292929";

        emailTab.style.color =
            "#fff";


        contact.type =
            "tel";

        contact.autocomplete =
            "tel";

        contact.placeholder =
            "Telefon numarası";


        note.textContent =
            "Devam ettiğinde telefon numaran doğrulama için kullanılacaktır.";

        showStatus("");

    }
);


/* =====================================================
   GERİ
===================================================== */

function goBack(){

    window.location.href =
        "./sifre-olustur.html?username=" +
        encodeURIComponent(username);

}


topBack.addEventListener(
    "click",
    goBack
);


backBtn.addEventListener(
    "click",
    goBack
);


/* =====================================================
   İLERİ
===================================================== */

nextBtn.addEventListener(
    "click",
    function(){

        if(busy){
            return;
        }

        const value =
            contact.value.trim();


        if(!value){

            showStatus(
                mode === "email"
                    ? "Lütfen e-posta adresini gir."
                    : "Lütfen telefon numaranı gir."
            );

            contact.focus();

            return;
        }


        if(
            mode === "email" &&
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)
        ){

            showStatus(
                "Geçerli bir e-posta adresi gir."
            );

            contact.focus();

            return;
        }


        if(mode === "phone"){

            const cleanPhone =
                value.replace(
                    /[\s()-]/g,
                    ""
                );

            if(cleanPhone.length < 10){

                showStatus(
                    "Geçerli bir telefon numarası gir."
                );

                contact.focus();

                return;
            }

        }


        busy = true;

        nextBtn.disabled =
            true;

        nextBtn.textContent =
            "Devam ediliyor...";


        /* Bilgiyi kayıt sürecinde sakla */

        if(mode === "email"){

            sessionStorage.setItem(
                "minegram_register_email",
                value
            );

        }
        else{

            sessionStorage.setItem(
                "minegram_register_phone",
                value
            );

        }


        if(username){

            sessionStorage.setItem(
                "minegram_register_username",
                username
            );

        }


        showStatus(
            "Bilgiler kaydedildi.",
            true
        );


        /*
         * Burada sonraki kayıt sayfasına gidilir.
         *
         * Şimdilik kayit-tamamla.html.
         *
         * Eğer sonraki sayfanın adı farklıysa
         * sadece aşağıdaki adresi değiştir.
         */

        setTimeout(
            function(){

                window.location.href =
                    "./kayit-tamamla.html?username=" +
                    encodeURIComponent(username);

            },
            200
        );

    }
);


/* =====================================================
   ENTER
===================================================== */

contact.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            nextBtn.click();

        }

    }
);


/* =====================================================
   KAYIT BİLGİLERİNİ GERİ YÜKLE
===================================================== */

const savedEmail =
    sessionStorage.getItem(
        "minegram_register_email"
    );

const savedPhone =
    sessionStorage.getItem(
        "minegram_register_phone"
    );


if(savedEmail){

    mode = "email";

    contact.value =
        savedEmail;

}
else if(savedPhone){

    phoneTab.click();

    contact.value =
        savedPhone;

}


/* Firebase bağlantısının hazır olduğunu kontrol et */

console.log(
    "[MINEGRAM] Firebase hazır:",
    !!auth
);

</script>

</body>
</html>
