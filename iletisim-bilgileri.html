<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>Minegram - İletişim Bilgileri</title>


<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:365px;
    margin-top:90px;
    text-align:center;
}

.header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:25px;
}

.back{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    margin-right:8px;
}

.header-title{
    font-size:16px;
    font-weight:700;
}

.title{
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 12px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.45;
    margin:0 0 22px;
}

.tabs{
    display:flex;
    gap:9px;
    width:100%;
    margin-bottom:9px;
}

.tab{
    width:50%;
    height:44px;
    border-radius:7px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.tab.email{
    border:1px solid #554f67;
    background:#554f67;
    color:#eee8fa;
}

.tab.phone{
    border:1px solid #292929;
    background:#000;
    color:#fff;
}

.input{
    width:100%;
    height:44px;
    margin-bottom:9px;
    padding:0 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#000;
    color:#fff;
    outline:none;
    font-size:12px;
}

.input::placeholder{
    color:#777;
}

.input:focus{
    border-color:#555;
}

.note{
    min-height:20px;
    margin:8px 0 0;
    color:#777;
    font-size:12px;
    line-height:1.45;
}

.status{
    min-height:20px;
    margin-top:10px;
    font-size:12px;
    color:#ff4d4d;
}

.status.success{
    color:#35c759;
}

.status.loading{
    color:#aaa;
}

.bottom{
    display:flex;
    gap:9px;
    width:100%;
    margin-top:25px;
}

.action{
    width:50%;
    height:42px;
    border-radius:22px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.back-btn{
    background:#000;
    border:1px solid #555;
    color:#0095f6;
}

.next-btn{
    background:#2d80bd;
    border:0;
    color:#000;
}

.next-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

@media(max-width:600px){

    .box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:60px;
    }

    .title{
        font-size:21px;
    }

    .description{
        font-size:12px;
    }

}

</style>

</head>


<body>


<div class="page">

<div class="box">


<div class="header">

<div
    id="topBack"
    class="back"
    role="button"
    tabindex="0"
    aria-label="Geri"
>
    ‹
</div>

<div class="header-title">
    Kayıt ol
</div>

</div>


<h1 class="title">
    İletişim bilgini ekle
</h1>


<p class="description">

    Hesabını doğrulamak için e-posta adresini<br>
    kullan.

</p>


<div class="tabs">

<button
    id="emailTab"
    class="tab email"
    type="button"
>
    E-posta
</button>


<button
    id="phoneTab"
    class="tab phone"
    type="button"
>
    Telefon
</button>

</div>


<input
    id="contact"
    class="input"
    type="email"
    autocomplete="email"
    placeholder="E-posta adresi"
>


<div id="note" class="note">

    Devam ettiğinde e-posta adresine
    6 haneli doğrulama kodu gönderilir.

</div>


<div id="status" class="status"></div>


<div class="bottom">

<button
    id="backBtn"
    class="action back-btn"
    type="button"
>
    Geri
</button>


<button
    id="nextBtn"
    class="action next-btn"
    type="button"
>
    İleri
</button>

</div>


</div>
</div>



<script>

/* =========================================================
   ELEMENTLER
========================================================= */

const emailTab =
    document.getElementById("emailTab");

const phoneTab =
    document.getElementById("phoneTab");

const contact =
    document.getElementById("contact");

const note =
    document.getElementById("note");

const status =
    document.getElementById("status");

const nextBtn =
    document.getElementById("nextBtn");

const backBtn =
    document.getElementById("backBtn");

const topBack =
    document.getElementById("topBack");


let mode = "email";

let busy = false;


/* =========================================================
   USERNAME
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


let username =
    (
        params.get("username") ||
        sessionStorage.getItem(
            "minegram_register_username"
        ) ||
        ""
    )
    .trim()
    .replace(/^@/, "")
    .toLowerCase();


if(username){

    sessionStorage.setItem(
        "minegram_register_username",
        username
    );

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    text,
    success = false,
    loading = false
){

    status.textContent =
        text || "";


    if(loading){

        status.className =
            "status loading";

        return;

    }


    status.className =
        success
            ? "status success"
            : "status";

}


/* =========================================================
   EMAIL TAB
========================================================= */

emailTab.addEventListener(
    "click",
    function(){

        mode = "email";


        emailTab.style.background =
            "#554f67";

        emailTab.style.borderColor =
            "#554f67";

        emailTab.style.color =
            "#eee8fa";


        phoneTab.style.background =
            "#000";

        phoneTab.style.borderColor =
            "#292929";

        phoneTab.style.color =
            "#fff";


        contact.type =
            "email";

        contact.autocomplete =
            "email";

        contact.placeholder =
            "E-posta adresi";


        note.textContent =
            "Devam ettiğinde e-posta adresine 6 haneli doğrulama kodu gönderilir.";


        showStatus("");

    }
);


/* =========================================================
   PHONE TAB
========================================================= */

phoneTab.addEventListener(
    "click",
    function(){

        mode = "phone";


        phoneTab.style.background =
            "#554f67";

        phoneTab.style.borderColor =
            "#554f67";

        phoneTab.style.color =
            "#eee8fa";


        emailTab.style.background =
            "#000";

        emailTab.style.borderColor =
            "#292929";

        emailTab.style.color =
            "#fff";


        contact.type =
            "tel";

        contact.autocomplete =
            "tel";

        contact.placeholder =
            "Telefon numarası";


        note.textContent =
            "Telefon doğrulaması henüz aktif değil. E-posta seçeneğini kullan.";


        showStatus("");

    }
);


/* =========================================================
   BACK
========================================================= */

function goBack(){

    window.location.href =
        "./sifre-olustur.html?username=" +
        encodeURIComponent(username);

}


topBack.addEventListener(
    "click",
    goBack
);


backBtn.addEventListener(
    "click",
    goBack
);


topBack.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            goBack();

        }

    }
);


/* =========================================================
   SEND OTP
========================================================= */

async function sendOtpEmail(email){

    try{

        console.log(
            "[MINEGRAM] Server'a OTP isteği gönderiliyor:",
            email
        );


        const response =
            await fetch(
                "/api/send-email-otp",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            email:email,
                            username:username
                        })
                }
            );


        let result = null;


        try{

            result =
                await response.json();

        }catch{

            result = null;

        }


        console.log(
            "[MINEGRAM] Server cevabı:",
            result
        );


        if(!response.ok){

            throw new Error(
                result?.error ||
                "Sunucu e-posta gönderirken hata verdi."
            );

        }


        if(!result?.ok){

            throw new Error(
                result?.error ||
                "Doğrulama kodu gönderilemedi."
            );

        }


        return true;


    }catch(error){

        console.error(
            "[MINEGRAM] OTP HATASI:",
            error
        );


        showStatus(
            error.message ||
            "Doğrulama kodu gönderilemedi."
        );


        return false;

    }

}


/* =========================================================
   NEXT
========================================================= */

async function goNext(){

    if(busy){

        return;

    }


    /* -----------------------------------------
       PHONE
    ----------------------------------------- */

    if(mode === "phone"){

        showStatus(
            "Telefon doğrulaması henüz aktif değil. E-posta seçeneğini kullan."
        );

        return;

    }


    /* -----------------------------------------
       EMAIL
    ----------------------------------------- */

    const email =
        contact.value
            .trim()
            .toLowerCase();


    if(!email){

        showStatus(
            "Lütfen e-posta adresini gir."
        );

        contact.focus();

        return;

    }


    const validEmail =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if(!validEmail.test(email)){

        showStatus(
            "Geçerli bir e-posta adresi gir."
        );

        contact.focus();

        return;

    }


    /* -----------------------------------------
       SESSION
    ----------------------------------------- */

    sessionStorage.setItem(
        "minegram_register_email",
        email
    );


    sessionStorage.setItem(
        "minegram_otp_email",
        email
    );


    sessionStorage.setItem(
        "minegram_otp_pending",
        "true"
    );


    if(username){

        sessionStorage.setItem(
            "minegram_register_username",
            username
        );

    }


    /* -----------------------------------------
       BUTTON
    ----------------------------------------- */

    busy = true;

    nextBtn.disabled = true;

    nextBtn.textContent =
        "Kod gönderiliyor...";


    showStatus(
        "6 haneli doğrulama kodu gönderiliyor...",
        false,
        true
    );


    /* -----------------------------------------
       SERVER
    ----------------------------------------- */

    const success =
        await sendOtpEmail(email);


    if(!success){

        busy = false;

        nextBtn.disabled = false;

        nextBtn.textContent =
            "İleri";

        return;

    }


    /* -----------------------------------------
       SUCCESS
    ----------------------------------------- */

    showStatus(
        "Kod gönderildi. E-postanı kontrol et.",
        true
    );


    nextBtn.textContent =
        "Kod gönderildi";


    /* -----------------------------------------
       VERIFY PAGE
    ----------------------------------------- */

    setTimeout(
        function(){

            window.location.href =
                "./hesap-doğrulama.html?username=" +
                encodeURIComponent(username) +
                "&email=" +
                encodeURIComponent(email);

        },
        700
    );

}


/* =========================================================
   NEXT BUTTON
========================================================= */

nextBtn.addEventListener(
    "click",
    goNext
);


/* =========================================================
   ENTER
========================================================= */

contact.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            goNext();

        }

    }
);


/* =========================================================
   SAVED EMAIL
========================================================= */

const savedEmail =
    sessionStorage.getItem(
        "minegram_register_email"
    );


if(savedEmail){

    contact.value =
        savedEmail;

}


/* =========================================================
   READY
========================================================= */

console.log(
    "[MINEGRAM] İletişim sayfası hazır."
);

console.log(
    "[MINEGRAM] Server endpoint:",
    "/api/send-email-otp"
);

console.log(
    "[MINEGRAM] Username:",
    username
);

</script>

</body>
</html>
```
