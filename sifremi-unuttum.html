<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Şifremi unuttum - Minegram</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
}

/* ÜST BAR */
.topbar {
    width: 100%;
    height: 90px;
    display: flex;
    align-items: center;
    padding-left: 48px;
    background: #000;
}

.back {
    border: none;
    background: transparent;
    color: white;
    font-size: 62px;
    font-weight: 300;
    line-height: 1;
    width: 55px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.top-title {
    color: white;
    font-size: 38px;
    font-weight: 700;
    margin-left: 18px;
}

/* ANA ALAN */
.main {
    width: 100%;
    display: flex;
    justify-content: center;
}

.box {
    width: calc(100% - 120px);
    max-width: 1100px;
    margin-top: 205px;
}

/* BAŞLIK */
.title {
    text-align: center;
    color: white;
    font-size: 64px;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 50px;
}

/* AÇIKLAMA */
.description {
    color: #c8c8c8;
    font-size: 34px;
    line-height: 1.5;
    margin-bottom: 70px;
}

/* TELEFON KUTUSU */
.phone {
    width: 100%;
    height: 150px;
    background: #111;
    border: 3px solid #777;
    border-radius: 14px;
    outline: none;

    color: white;
    font-size: 34px;
    padding: 0 34px;
}

.phone::placeholder {
    color: #c8c8c8;
}

/* DEVAM */
.continue {
    width: 100%;
    height: 118px;
    margin-top: 36px;

    border: none;
    border-radius: 70px;

    background: #63b0ee;
    color: #282477;

    font-size: 34px;
    font-weight: 700;

    cursor: pointer;
}

.continue:active {
    transform: scale(.99);
}

/* E-POSTA */
.email-link {
    display: block;
    text-align: center;

    margin-top: 44px;

    color: #55aaf0;
    font-size: 31px;
    font-weight: 700;

    text-decoration: none;
    line-height: 1.35;
}

/* MESAJ */
.message {
    display: none;
    width: 100%;

    margin-top: 30px;
    padding: 20px;

    background: #111;
    border: 1px solid #444;
    border-radius: 12px;

    color: #fff;
    text-align: center;
    font-size: 24px;
}


/* =========================
   TELEFON EKRANI
   ========================= */

@media (max-width: 600px) {

    .topbar {
        height: 82px;
        padding-left: 34px;
    }

    .back {
        font-size: 52px;
        width: 48px;
    }

    .top-title {
        font-size: 28px;
        margin-left: 16px;
    }

    .box {
        width: calc(100% - 120px);
        margin-top: 145px;
    }

    .title {
        font-size: 52px;
        margin-bottom: 42px;
    }

    .description {
        font-size: 29px;
        line-height: 1.55;
        margin-bottom: 68px;
    }

    .phone {
        height: 118px;
        border-width: 2px;
        border-radius: 13px;
        padding: 0 32px;
        font-size: 29px;
    }

    .continue {
        height: 84px;
        margin-top: 35px;
        font-size: 29px;
    }

    .email-link {
        margin-top: 43px;
        font-size: 27px;
    }
}


/* KÜÇÜK TELEFONLAR */
@media (max-width: 430px) {

    .topbar {
        height: 75px;
        padding-left: 25px;
    }

    .back {
        font-size: 46px;
        width: 45px;
    }

    .top-title {
        font-size: 25px;
        margin-left: 13px;
    }

    .box {
        width: calc(100% - 60px);
        margin-top: 135px;
    }

    .title {
        font-size: 45px;
        margin-bottom: 38px;
    }

    .description {
        font-size: 26px;
        line-height: 1.55;
        margin-bottom: 62px;
    }

    .phone {
        height: 116px;
        font-size: 26px;
        padding: 0 30px;
    }

    .continue {
        height: 84px;
        font-size: 27px;
    }

    .email-link {
        font-size: 24px;
        margin-top: 42px;
    }
}
</style>
</head>

<body>

<!-- ÜST BAŞLIK -->
<div class="topbar">

    <button
        class="back"
        onclick="window.location.href='sifremi-unuttum.html'">
        ‹
    </button>

    <div class="top-title">
        Şifremi unuttum
    </div>

</div>


<!-- ANA İÇERİK -->
<div class="main">

    <div class="box">

        <h1 class="title">
            Profilini bul
        </h1>

        <p class="description">
            Hesabını bulmak için cep telefonu numaranı gir.
        </p>

        <input
            id="phone"
            class="phone"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="Cep telefonu numarası"
        >

        <button
            id="continueButton"
            class="continue">
            Devam
        </button>

        <a
            href="sifremi-unuttum.html"
            class="email-link">
            E-posta adresi veya kullanıcı adıyla bul
        </a>

        <div
            id="message"
            class="message">
        </div>

    </div>

</div>


<script>

const phone = document.getElementById("phone");
const continueButton =
    document.getElementById("continueButton");

const message =
    document.getElementById("message");


continueButton.addEventListener("click", function () {

    const number = phone.value.trim();

    if (number === "") {

        message.textContent =
            "Lütfen cep telefonu numaranı gir.";

        message.style.display = "block";

        phone.focus();

        return;
    }

    if (number.length < 10) {

        message.textContent =
            "Lütfen geçerli bir telefon numarası gir.";

        message.style.display = "block";

        phone.focus();

        return;
    }

    message.textContent =
        "Telefon numaran kontrol ediliyor...";

    message.style.display = "block";
});


phone.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        continueButton.click();
    }

});

</script>

</body>
</html>
