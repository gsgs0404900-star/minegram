<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Şifremi unuttum - Minegram</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================
           ÜST BAŞLIK
        ========================= */

        .topbar {
            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;

            padding-left: 38px;

            background: #000;
        }

        .back-button {
            color: #fff;
            text-decoration: none;

            font-size: 46px;
            font-weight: 300;

            line-height: 1;

            margin-right: 20px;

            cursor: pointer;
        }

        .top-title {
            color: #fff;

            font-size: 25px;
            font-weight: 700;
        }


        /* =========================
           ANA ALAN
        ========================= */

        .page {
            width: 100%;
            min-height: calc(100vh - 70px);

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }


        /* =========================
           MASAÜSTÜ BOYUTU
           GİRİŞ.HTML GİBİ
        ========================= */

        .container {
            width: 320px;

            margin-top: 105px;

            display: flex;
            flex-direction: column;
        }


        /* =========================
           BAŞLIK
        ========================= */

        .main-title {
            color: #fff;

            text-align: center;

            font-size: 27px;
            font-weight: 700;

            margin-bottom: 38px;
        }


        /* =========================
           AÇIKLAMA
        ========================= */

        .description {
            color: #bdbdbd;

            font-size: 16px;
            line-height: 1.5;

            margin-bottom: 65px;
        }


        /* =========================
           INPUT
        ========================= */

        .input {
            width: 100%;
            height: 39px;

            background: #050505;

            border: 1px solid #222;
            border-radius: 7px;

            color: #fff;

            padding: 0 12px;

            font-size: 12px;

            outline: none;
        }

        .input::placeholder {
            color: #777;
        }

        .input:focus {
            border-color: #444;
        }


        /* =========================
           DEVAM BUTONU
        ========================= */

        .continue-button {
            width: 100%;
            height: 37px;

            margin-top: 9px;

            border: none;
            border-radius: 22px;

            background: #2478b7;

            color: #000;

            font-size: 12px;
            font-weight: 700;

            cursor: pointer;
        }

        .continue-button:hover {
            background: #2b83c5;
        }

        .continue-button:active {
            transform: scale(0.99);
        }


        /* =========================
           LİNKLER
        ========================= */

        .link {
            display: block;

            width: 100%;

            text-align: center;

            color: #1685d4;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;
        }

        .phone-link {
            margin-top: 20px;
        }

        .login-link {
            margin-top: 28px;
        }

        .link:hover {
            color: #42a5ee;
        }


        /* =========================
           MESAJ
        ========================= */

        #message {
            display: none;

            width: 100%;

            margin-top: 15px;

            text-align: center;

            color: #ff5757;

            font-size: 12px;

            line-height: 1.4;
        }


        /* ==================================================
           TELEFON
           GÖNDERDİĞİN 828x1792 GÖRSELDEKİ BOYUT
        ================================================== */

        @media (max-width: 700px) {

            .topbar {
                height: 72px;

                padding-left: 48px;
            }

            .back-button {
                font-size: 51px;

                margin-right: 24px;
            }

            .top-title {
                font-size: 30px;
            }


            .page {
                min-height: calc(100vh - 72px);
            }


            .container {
                width: calc(100% - 120px);

                max-width: none;

                margin-top: 160px;
            }


            .main-title {
                font-size: 62px;

                margin-bottom: 42px;
            }


            .description {
                font-size: 36px;

                line-height: 1.45;

                margin-bottom: 72px;
            }


            .input {
                width: 100%;

                height: 118px;

                border: 2px solid #666;

                border-radius: 12px;

                background: #111;

                padding: 0 34px;

                font-size: 31px;
            }

            .input::placeholder {
                color: #c5c5c5;
            }


            .continue-button {
                width: 100%;

                height: 84px;

                margin-top: 36px;

                border-radius: 50px;

                background: #61b0ed;

                color: #25206d;

                font-size: 31px;
            }


            .phone-link {
                margin-top: 43px;
            }

            .login-link {
                margin-top: 72px;
            }


            .link {
                font-size: 29px;

                line-height: 1.35;
            }


            #message {
                font-size: 21px;
            }
        }


        /* ==================================================
           DAHA KÜÇÜK TELEFONLAR
        ================================================== */

        @media (max-width: 430px) {

            .topbar {
                height: 65px;

                padding-left: 22px;
            }

            .back-button {
                font-size: 42px;

                margin-right: 16px;
            }

            .top-title {
                font-size: 25px;
            }


            .container {
                width: calc(100% - 60px);

                margin-top: 95px;
            }


            .main-title {
                font-size: 43px;

                margin-bottom: 30px;
            }


            .description {
                font-size: 25px;

                line-height: 1.45;

                margin-bottom: 48px;
            }


            .input {
                height: 82px;

                padding: 0 25px;

                font-size: 23px;

                border-width: 2px;
            }


            .continue-button {
                height: 72px;

                margin-top: 28px;

                font-size: 23px;
            }


            .link {
                font-size: 22px;
            }


            .phone-link {
                margin-top: 34px;
            }


            .login-link {
                margin-top: 55px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         ÜST BAŞLIK
    ========================== -->

    <header class="topbar">

        <a
            href="giris.html"
            class="back-button"
            aria-label="Geri dön"
        >
            ‹
        </a>

        <div class="top-title">
            Şifremi unuttum
        </div>

    </header>


    <!-- =========================
         ANA SAYFA
    ========================== -->

    <main class="page">

        <section class="container">

            <h1 class="main-title">
                Profilini bul
            </h1>


            <p class="description">
                Hesabını bulmak için e-posta adresini veya
                kullanıcı adını gir.
            </p>


            <input
                id="emailUsername"
                class="input"
                type="text"
                placeholder="E-posta adresi veya kullanıcı adı"
                autocomplete="username"
            >


            <button
                id="continueButton"
                class="continue-button"
                type="button"
            >
                Devam
            </button>


            <div id="message"></div>


            <!-- TELEFONLA BUL -->

            <a
                href="sifremi-unuttum-telefon.html"
                class="link phone-link"
            >
                Cep telefonu numarasıyla bul
            </a>


            <!-- GİRİŞE DÖN -->

            <a
                href="giris.html"
                class="link login-link"
            >
                Giriş ekranına dön
            </a>

        </section>

    </main>


    <script>

        const input =
            document.getElementById("emailUsername");

        const continueButton =
            document.getElementById("continueButton");

        const message =
            document.getElementById("message");


        continueButton.addEventListener("click", function () {

            const value = input.value.trim();


            message.style.display = "none";
            message.textContent = "";


            if (value === "") {

                message.textContent =
                    "Lütfen e-posta adresinizi veya kullanıcı adınızı girin.";

                message.style.display = "block";

                input.focus();

                return;
            }


            /*
             * Firebase şifre sıfırlama işlemi
             * mevcut sistemine burada bağlanabilir.
             */

            console.log(
                "Şifre sıfırlama araması:",
                value
            );

        });


        input.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    continueButton.click();

                }

            }
        );

    </script>

</body>
</html>
