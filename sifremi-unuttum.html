<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<title>Şifremi unuttum - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

/* ÜST BAŞLIK */
.topbar{
    height:78px;
    width:100%;
    display:flex;
    align-items:center;
    padding:0 30px;
    background:#000;
}

.back{
    width:48px;
    height:48px;
    border:0;
    background:transparent;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
    margin-right:10px;
}

.back svg{
    width:34px;
    height:34px;
    stroke:#fff;
    stroke-width:2.5;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.header-title{
    font-size:28px;
    font-weight:700;
    line-height:1;
}

/* ANA ALAN */
.content{
    width:min(680px,calc(100% - 60px));
    margin:0 auto;
    padding-top:100px;
}

/* BAŞLIK */
.main-title{
    margin:0;
    text-align:center;
    font-size:52px;
    line-height:1.1;
    font-weight:700;
    letter-spacing:-1px;
}

/* AÇIKLAMA */
.description{
    margin:38px 0 0;
    color:#c8c8c8;
    font-size:27px;
    line-height:1.45;
    font-weight:400;
}

/* INPUT */
.input{
    width:100%;
    height:88px;
    margin-top:72px;
    padding:0 30px;
    border:2px solid #666;
    border-radius:9px;
    outline:none;
    background:#111;
    color:#fff;
    font-size:26px;
    font-family:Arial,Helvetica,sans-serif;
}

.input::placeholder{
    color:#c0c0c0;
    opacity:1;
}

.input:focus{
    border-color:#777;
}

/* DEVAM BUTONU */
.continue-btn{
    width:100%;
    height:84px;
    margin-top:35px;
    border:0;
    border-radius:45px;
    background:#62afe8;
    color:#3d327c;
    font-size:29px;
    font-weight:700;
    cursor:pointer;
    transition:transform .12s,opacity .15s;
}

.continue-btn:active{
    transform:scale(.98);
}

.continue-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* ALT LİNKLER */
.phone-link,
.login-link{
    display:block;
    text-align:center;
    color:#65b3ee;
    font-size:27px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
}

.phone-link{
    margin-top:43px;
}

.login-link{
    margin-top:67px;
}

.phone-link:active,
.login-link:active{
    opacity:.7;
}

/* MESAJ */
.message{
    display:none;
    width:100%;
    margin-top:22px;
    padding:14px 18px;
    border-radius:10px;
    background:#171717;
    color:#ddd;
    font-size:17px;
    line-height:1.4;
    text-align:center;
}

.message.show{
    display:block;
}

.message.error{
    color:#ff6b7d;
}

.message.success{
    color:#65b3ee;
}

/* TELEFON MODAL */
.phone-modal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.7);
}

.phone-modal.open{
    display:flex;
}

.phone-sheet{
    width:min(680px,100%);
    background:#171b1e;
    border-radius:28px 28px 0 0;
    padding:25px 25px 35px;
}

.sheet-line{
    width:65px;
    height:6px;
    border-radius:10px;
    background:#888;
    margin:0 auto 25px;
}

.sheet-title{
    text-align:center;
    font-size:24px;
    font-weight:700;
    margin-bottom:25px;
}

.phone-input{
    width:100%;
    height:58px;
    border:1px solid #555;
    border-radius:14px;
    background:#111;
    color:#fff;
    padding:0 16px;
    font-size:17px;
    outline:none;
}

.phone-input:focus{
    border-color:#62afe8;
}

.phone-submit{
    width:100%;
    height:55px;
    margin-top:15px;
    border:0;
    border-radius:28px;
    background:#62afe8;
    color:#342b70;
    font-size:18px;
    font-weight:700;
}

.close-phone{
    width:100%;
    height:50px;
    margin-top:10px;
    border:0;
    background:transparent;
    color:#65b3ee;
    font-size:17px;
    font-weight:700;
}

/* MOBİL */
@media(max-width:700px){

    .topbar{
        height:70px;
        padding:0 16px;
    }

    .back{
        width:46px;
        height:46px;
        margin-right:7px;
    }

    .back svg{
        width:32px;
        height:32px;
    }

    .header-title{
        font-size:26px;
    }

    .content{
        width:calc(100% - 60px);
        padding-top:91px;
    }

    .main-title{
        font-size:50px;
    }

    .description{
        margin-top:37px;
        font-size:27px;
        line-height:1.48;
    }

    .input{
        height:87px;
        margin-top:72px;
        padding:0 30px;
        font-size:26px;
    }

    .continue-btn{
        height:84px;
        margin-top:35px;
        font-size:28px;
    }

    .phone-link,
    .login-link{
        font-size:26px;
    }

    .phone-link{
        margin-top:43px;
    }

    .login-link{
        margin-top:67px;
    }
}

/* DAHA DAR TELEFONLAR */
@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        padding-top:75px;
    }

    .main-title{
        font-size:42px;
    }

    .description{
        font-size:21px;
        line-height:1.5;
        margin-top:30px;
    }

    .input{
        height:68px;
        margin-top:52px;
        padding:0 20px;
        font-size:20px;
    }

    .continue-btn{
        height:66px;
        margin-top:25px;
        font-size:23px;
    }

    .phone-link,
    .login-link{
        font-size:21px;
    }

    .phone-link{
        margin-top:34px;
    }

    .login-link{
        margin-top:50px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- ÜST BAŞLIK -->
    <header class="topbar">

        <button
            class="back"
            type="button"
            onclick="goBack()"
            aria-label="Geri">

            <svg viewBox="0 0 24 24">
                <path d="M19 12H5"></path>
                <path d="M12 19 5 12l7-7"></path>
            </svg>

        </button>

        <div class="header-title">
            Şifremi unuttum
        </div>

    </header>


    <!-- ANA İÇERİK -->
    <main class="content">

        <h1 class="main-title">
            Profilini bul
        </h1>


        <p class="description">
            Hesabını bulmak için e-posta adresini veya<br>
            kullanıcı adını gir.
        </p>


        <input
            id="accountInput"
            class="input"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            placeholder="E-posta adresi veya kullanıcı adı">


        <button
            id="continueBtn"
            class="continue-btn"
            type="button"
            onclick="findProfile()">

            Devam

        </button>


        <div
            id="message"
            class="message">
        </div>


        <a
            href="#"
            class="phone-link"
            onclick="openPhoneModal(event)">

            Cep telefonu numarasıyla bul

        </a>


        <a
            href="giris.html"
            class="login-link">

            Giriş ekranına dön

        </a>

    </main>

</div>


<!-- TELEFON NUMARASI MODALI -->

<div
    id="phoneModal"
    class="phone-modal"
    onclick="closePhoneModal(event)">

    <div
        class="phone-sheet"
        onclick="event.stopPropagation()">

        <div class="sheet-line"></div>

        <div class="sheet-title">
            Telefon numaranı gir
        </div>

        <input
            id="phoneInput"
            class="phone-input"
            type="tel"
            inputmode="tel"
            placeholder="+90 5xx xxx xx xx">

        <button
            class="phone-submit"
            type="button"
            onclick="findByPhone()">

            Devam

        </button>

        <button
            class="close-phone"
            type="button"
            onclick="closePhoneModal()">

            Vazgeç

        </button>

    </div>

</div>


<script>

const API = '/api';


/* GİRİŞ EKRANINA DÖN */
function goBack(){

    if(history.length > 1){

        history.back();

    }else{

        location.href = 'giris.html';

    }

}


/* MESAJ */
function showMessage(text,type=''){

    const box =
        document.getElementById('message');

    box.textContent = text;

    box.className =
        'message show ' + type;

}


/* MESAJI TEMİZLE */
function clearMessage(){

    const box =
        document.getElementById('message');

    box.className =
        'message';

    box.textContent = '';

}


/* PROFİL BUL */
async function findProfile(){

    const input =
        document.getElementById('accountInput');

    const btn =
        document.getElementById('continueBtn');

    const value =
        input.value.trim();

    clearMessage();


    if(!value){

        showMessage(
            'Lütfen e-posta adresini veya kullanıcı adını gir.',
            'error'
        );

        input.focus();

        return;
    }


    btn.disabled = true;

    btn.textContent = 'Kontrol ediliyor...';


    try{

        /*
         * Minegram API.
         *
         * Eğer backendinde /api/forgot-password
         * endpointi varsa doğrudan çalışır.
         */

        const response =
            await fetch(
                API + '/forgot-password',
                {
                    method:'POST',

                    headers:{
                        'Content-Type':'application/json'
                    },

                    body:JSON.stringify({
                        email:value,
                        username:value,
                        identifier:value
                    })
                }
            );


        const data =
            await response.json()
                .catch(()=>({}));


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                'Hesap bulunamadı.'
            );

        }


        showMessage(
            data.message ||
            'Hesabın bulundu. Şifre sıfırlama bağlantısı gönderildi.',
            'success'
        );


    }catch(error){

        console.error(
            '[ŞİFRE SIFIRLAMA]',
            error
        );


        /*
         * Backend endpointi yoksa kullanıcıya
         * anlaşılır hata göster.
         */

        showMessage(
            error.message ||
            'İşlem sırasında bir hata oluştu.',
            'error'
        );

    }finally{

        btn.disabled = false;

        btn.textContent = 'Devam';

    }

}


/* TELEFON MODALINI AÇ */
function openPhoneModal(event){

    if(event){
        event.preventDefault();
    }

    document
        .getElementById('phoneModal')
        .classList.add('open');

    setTimeout(()=>{

        document
            .getElementById('phoneInput')
            .focus();

    },150);

}


/* TELEFON MODALINI KAPAT */
function closePhoneModal(event){

    if(
        !event ||
        event.target ===
        document.getElementById('phoneModal')
    ){

        document
            .getElementById('phoneModal')
            .classList.remove('open');

    }

}


/* TELEFONLA BUL */
async function findByPhone(){

    const input =
        document.getElementById('phoneInput');

    const phone =
        input.value.trim();


    if(!phone){

        input.focus();

        return;

    }


    try{

        const response =
            await fetch(
                API + '/forgot-password',
                {
                    method:'POST',

                    headers:{
                        'Content-Type':'application/json'
                    },

                    body:JSON.stringify({
                        phone:phone,
                        identifier:phone
                    })
                }
            );


        const data =
            await response.json()
                .catch(()=>({}));


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                'Telefon numarası bulunamadı.'
            );

        }


        closePhoneModal();

        showMessage(
            data.message ||
            'Şifre sıfırlama işlemi başlatıldı.',
            'success'
        );


    }catch(error){

        alert(
            error.message ||
            'İşlem başarısız.'
        );

    }

}


/* ENTER TUŞU */
document
    .getElementById('accountInput')
    .addEventListener(
        'keydown',
        function(event){

            if(event.key === 'Enter'){

                event.preventDefault();

                findProfile();

            }

        }
    );


/* ESC TUŞU */
document.addEventListener(
    'keydown',
    function(event){

        if(event.key === 'Escape'){

            closePhoneModal();

        }

    }
);

</script>

</body>
</html>
