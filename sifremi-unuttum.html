<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Minegram - Şifremi Unuttum</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

/* ÜST BAR */

.topbar{
    height:82px;
    width:100%;
    display:flex;
    align-items:center;
    border-bottom:0;
    padding:0 42px;
}

.back{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    background:transparent;
    border:0;
    padding:0;
    cursor:pointer;
}

.back svg{
    width:38px;
    height:38px;
    fill:none;
    stroke:#fff;
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.title{
    margin-left:18px;
    font-size:27px;
    font-weight:700;
}

/* ANA ALAN */

.content{
    width:100%;
    max-width:700px;
    margin:135px auto 0;
    padding:0 0 60px;
}

.heading{
    text-align:center;
    font-size:62px;
    line-height:1.08;
    font-weight:700;
    margin:0 0 32px;
}

.description{
    margin:0 0 70px;
    padding:0;
    color:#bdbdbd;
    font-size:31px;
    line-height:1.45;
    font-weight:400;
}

/* INPUT */

.field{
    width:100%;
    height:118px;
    padding:0 34px;
    border:2px solid #707070;
    border-radius:10px;
    background:#111;
    color:#fff;
    outline:none;
    font-size:31px;
}

.field::placeholder{
    color:#bcbcbc;
    opacity:1;
}

.field:focus{
    border-color:#929292;
}

/* DEVAM */

.continue{
    width:100%;
    height:84px;
    margin-top:35px;
    border:0;
    border-radius:44px;
    background:#65b5ed;
    color:#3d247d;
    font-size:29px;
    font-weight:700;
    cursor:pointer;
}

.continue:hover{
    background:#72bdf0;
}

.continue:active{
    transform:scale(.99);
}

.continue:disabled{
    opacity:.65;
    cursor:not-allowed;
}

/* ALT LİNKLER */

.phone-link,
.login-link{
    display:block;
    text-align:center;
    color:#69b7ee;
    text-decoration:none;
    font-size:29px;
    font-weight:700;
    cursor:pointer;
}

.phone-link{
    margin-top:45px;
}

.login-link{
    margin-top:68px;
}

/* MESAJ */

.message{
    min-height:28px;
    margin-top:25px;
    text-align:center;
    padding:0 10px;
    font-size:18px;
    line-height:1.4;
}

.message.success{
    color:#35c759;
}

.message.error{
    color:#ff4d4d;
}

/* MOBİL */

@media(max-width:700px){

    .topbar{
        height:78px;
        padding:0 28px;
    }

    .back{
        width:42px;
        height:42px;
    }

    .back svg{
        width:35px;
        height:35px;
    }

    .title{
        margin-left:15px;
        font-size:25px;
    }

    .content{
        width:100%;
        margin-top:115px;
        padding:0 60px 50px;
    }

    .heading{
        font-size:60px;
        margin-bottom:30px;
    }

    .description{
        font-size:29px;
        line-height:1.45;
        margin-bottom:68px;
    }

    .field{
        height:118px;
        font-size:29px;
        padding:0 32px;
    }

    .continue{
        height:84px;
        margin-top:35px;
        font-size:29px;
    }

    .phone-link,
    .login-link{
        font-size:28px;
    }

    .phone-link{
        margin-top:45px;
    }

    .login-link{
        margin-top:68px;
    }
}

/* TELEFON EKRANLARI */

@media(max-width:480px){

    .topbar{
        height:70px;
        padding:0 18px;
    }

    .back{
        width:42px;
        height:42px;
    }

    .title{
        margin-left:10px;
        font-size:22px;
    }

    .content{
        margin-top:115px;
        padding:0 30px 40px;
    }

    .heading{
        font-size:42px;
        margin-bottom:28px;
    }

    .description{
        font-size:21px;
        line-height:1.5;
        margin-bottom:58px;
    }

    .field{
        height:76px;
        border-radius:9px;
        padding:0 20px;
        font-size:20px;
    }

    .continue{
        height:64px;
        margin-top:28px;
        font-size:22px;
    }

    .phone-link,
    .login-link{
        font-size:21px;
    }

    .phone-link{
        margin-top:38px;
    }

    .login-link{
        margin-top:58px;
    }

    .message{
        font-size:15px;
    }
}

/* ÇOK KÜÇÜK TELEFON */

@media(max-width:360px){

    .content{
        padding-left:22px;
        padding-right:22px;
    }

    .heading{
        font-size:37px;
    }

    .description{
        font-size:19px;
    }

    .field{
        font-size:18px;
    }

    .continue{
        font-size:20px;
    }

    .phone-link,
    .login-link{
        font-size:19px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- ÜST KISIM -->

    <header class="topbar">

        <button
            class="back"
            type="button"
            onclick="goBack()"
            aria-label="Geri">

            <svg viewBox="0 0 24 24">
                <path d="M19 12H5"></path>
                <path d="M11 18 5 12l6-6"></path>
            </svg>

        </button>

        <div class="title">
            Şifremi unuttum
        </div>

    </header>


    <!-- ANA İÇERİK -->

    <main class="content">

        <h1 class="heading">
            Profilini bul
        </h1>

        <p class="description">
            Hesabını bulmak için e-posta adresini veya
            kullanıcı adını gir.
        </p>


        <input
            id="accountInput"
            class="field"
            type="text"
            autocomplete="email"
            placeholder="E-posta adresi veya kullanıcı adı"
        >


        <button
            id="continueBtn"
            class="continue"
            type="button">

            Devam

        </button>


        <div
            id="message"
            class="message">
        </div>


        <a
            href="#"
            id="phoneLink"
            class="phone-link">

            Cep telefonu numarasıyla bul

        </a>


        <a
            href="giris.html"
            class="login-link">

            Giriş ekranına dön

        </a>

    </main>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
   MINEGRAM FIREBASE
   Mevcut giris.html ile aynı Firebase projesi
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain:
        "mim-ea133.firebaseapp.com",

    databaseURL:
        "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "mim-ea133",

    storageBucket:
        "mim-ea133.firebasestorage.app",

    messagingSenderId:
        "303525353436",

    appId:
        "1:303525353436:web:082fc090b5025e19942119",

    measurementId:
        "G-K962QE5P1R"
};


/* FIREBASE */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* ELEMENTLER */

const accountInput =
    document.getElementById("accountInput");

const continueBtn =
    document.getElementById("continueBtn");

const message =
    document.getElementById("message");

const phoneLink =
    document.getElementById("phoneLink");


/* MESAJ */

function showMessage(text, type="error"){

    message.textContent = text;

    message.className =
        "message " + type;

}


/* GERİ */

function goBack(){

    if(history.length > 1){

        history.back();

    }else{

        window.location.href =
            "giris.html";

    }

}


/* =====================================================
   ŞİFRE SIFIRLAMA
===================================================== */

async function resetPassword(){

    const value =
        accountInput.value.trim();


    showMessage("");


    if(!value){

        showMessage(
            "E-posta adresini veya kullanıcı adını gir."
        );

        accountInput.focus();

        return;
    }


    /*
       Firebase doğrudan e-posta ile
       şifre sıfırlama gönderir.

       Eğer kullanıcı @ işareti ile kullanıcı
       adı girerse bu aşamada kullanıcı adı
       olarak kabul edilir ve uyarı gösterilir.
    */

    if(
        !value.includes("@")
    ){

        showMessage(
            "Şimdilik şifre sıfırlama için kayıtlı e-posta adresini gir."
        );

        accountInput.focus();

        return;
    }


    continueBtn.disabled = true;

    continueBtn.textContent =
        "Gönderiliyor...";


    try{

        await sendPasswordResetEmail(
            auth,
            value
        );


        showMessage(
            "Şifre sıfırlama bağlantısı e-posta adresine gönderildi.",
            "success"
        );


        continueBtn.textContent =
            "Gönderildi";


    }catch(error){

        console.error(
            "[MINEGRAM PASSWORD RESET]",
            error
        );


        let text =
            "Şifre sıfırlama bağlantısı gönderilemedi.";


        switch(error.code){

            case "auth/invalid-email":

                text =
                    "Geçerli bir e-posta adresi gir.";

                break;


            case "auth/user-not-found":

                text =
                    "Bu e-posta ile kayıtlı hesap bulunamadı.";

                break;


            case "auth/too-many-requests":

                text =
                    "Çok fazla deneme yapıldı. Biraz sonra tekrar dene.";

                break;


            case "auth/network-request-failed":

                text =
                    "İnternet bağlantısını kontrol et.";

                break;


            default:

                break;
        }


        showMessage(text);


        continueBtn.disabled = false;

        continueBtn.textContent =
            "Devam";
    }

}


/* DEVAM BUTONU */

continueBtn.addEventListener(
    "click",
    resetPassword
);


/* ENTER */

accountInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            resetPassword();

        }

    }
);


/* TELEFON */

phoneLink.addEventListener(
    "click",
    event => {

        event.preventDefault();

        showMessage(
            "Telefon numarasıyla hesap bulma özelliği yakında aktif olacak."
        );

    }
);

</script>

</body>
</html>
