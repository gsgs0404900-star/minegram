<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Şifremi unuttum</title>

<style> 
*{ 
    box-sizing:border-box; 
    -webkit-tap-highlight-color:transparent; 
} 
 
html, 
body{ 
    margin:0; 
    padding:0; 
    width:100%; 
    min-height:100%; 
    background:#000; 
    color:#fff; 
    font-family:Arial,Helvetica,sans-serif; 
} 
 
body{ 
    min-height:100vh; 
    overflow-x:hidden; 
} 
 
.page{ 
    width:100%; 
    min-height:100vh; 
    background:#000; 
} 
 
/* ÜST BAŞLIK */ 
.topbar{ 
    width:100%; 
    height:60px; 
    display:flex; 
    align-items:center; 
    padding-left:38px; 
} 
 
.back{ 
    width:25px; 
    height:35px; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    color:#fff; 
    font-size:34px; 
    font-weight:300; 
    line-height:1; 
    cursor:pointer; 
    user-select:none; 
} 
 
.top-title{ 
    margin-left:15px; 
    font-size:20px; 
    font-weight:700; 
    color:#fff; 
} 
 
/* ANA FORM */ 
.content{ 
    width:317px; 
    margin:115px auto 0; 
} 
 
.title{ 
    text-align:center; 
    font-size:30px; 
    line-height:1.15; 
    font-weight:700; 
    margin:0 0 34px; 
    color:#fff; 
} 
 
.description{ 
    font-size:18px; 
    line-height:1.45; 
    color:#bdbdbd; 
    margin:0 0 65px; 
} 
 
.phone-input{ 
    display:block; 
    width:100%; 
    height:39px; 
    padding:0 10px; 
    border:1px solid #252525; 
    border-radius:6px; 
    background:#050505; 
    color:#fff; 
    outline:none; 
    font-size:12px; 
    font-family:Arial,Helvetica,sans-serif; 
} 
 
.phone-input::placeholder{ 
    color:#777; 
    opacity:1; 
} 
 
.phone-input:focus{ 
    border-color:#555; 
} 
 
.continue-btn{ 
    display:block; 
    width:100%; 
    height:37px; 
    margin-top:8px; 
    border:0; 
    border-radius:22px; 
    background:#2677b5; 
    color:#000; 
    font-size:12px; 
    font-weight:700; 
    cursor:pointer; 
} 
 
.continue-btn:active{ 
    transform:scale(.99); 
} 
 
.continue-btn:disabled{ 
    opacity:.6; 
    cursor:not-allowed; 
} 
 
.other-method{ 
    display:block; 
    width:100%; 
    margin-top:12px; 
    text-align:center; 
    color:#008cff; 
    font-size:12px; 
    font-weight:400; 
    text-decoration:underline; 
    cursor:pointer; 
    line-height:1.4; 
} 
 
.message{ 
    min-height:20px; 
    margin-top:12px; 
    text-align:center; 
    font-size:11px; 
    line-height:1.4; 
    color:#ff5c5c; 
} 
 
.message.success{ 
    color:#55b8ff; 
} 
 
/* DOĞRULAMA */ 
.code-box{ 
    display:none; 
    margin-top:20px; 
} 
 
.code-title{ 
    text-align:center; 
    font-size:18px; 
    font-weight:700; 
    margin-bottom:10px; 
} 
 
.code-info{ 
    text-align:center; 
    color:#aaa; 
    font-size:12px; 
    line-height:1.5; 
    margin-bottom:12px; 
} 
 
.code-input{ 
    display:block; 
    width:100%; 
    height:39px; 
    border:1px solid #252525; 
    border-radius:6px; 
    background:#050505; 
    color:#fff; 
    text-align:center; 
    letter-spacing:5px; 
    font-size:17px; 
    outline:none; 
} 
 
.verify-btn{ 
    display:block; 
    width:100%; 
    height:37px; 
    margin-top:8px; 
    border:0; 
    border-radius:22px; 
    background:#2677b5; 
    color:#000; 
    font-size:12px; 
    font-weight:700; 
    cursor:pointer; 
} 
 
/* TELEFON */ 
@media(max-width:600px){ 
 
    .topbar{ 
        height:70px; 
        padding-left:28px; 
    } 
 
    .back{ 
        width:30px; 
        height:38px; 
        font-size:38px; 
    } 
 
    .top-title{ 
        margin-left:12px; 
        font-size:21px; 
    } 
 
    .content{ 
        width:calc(100% - 120px); 
        max-width:365px; 
        margin:105px auto 0; 
    } 
 
    .title{ 
        font-size:42px; 
        margin-bottom:30px; 
    } 
 
    .description{ 
        font-size:21px; 
        line-height:1.5; 
        margin-bottom:55px; 
    } 
 
    .phone-input{ 
        height:68px; 
        padding:0 20px; 
        font-size:18px; 
        border:2px solid #686868; 
        border-radius:9px; 
    } 
 
    .continue-btn{ 
        height:58px; 
        margin-top:18px; 
        font-size:20px; 
        border-radius:32px; 
    } 
 
    .other-method{ 
        margin-top:25px; 
        font-size:18px; 
    } 
 
    .message{ 
        font-size:14px; 
    } 
 
    .code-title{ 
        font-size:22px; 
    } 
 
    .code-info{ 
        font-size:15px; 
    } 
 
    .code-input{ 
        height:58px; 
        font-size:22px; 
    } 
 
    .verify-btn{ 
        height:58px; 
        font-size:18px; 
    } 
} 
 
/* KÜÇÜK TELEFON */ 
@media(max-width:430px){ 
 
    .content{ 
        width:calc(100% - 40px); 
        margin-top:65px; 
    } 
 
    .title{ 
        font-size:38px; 
    } 
 
    .description{ 
        font-size:20px; 
    } 
} 
</style>
</head>

<body>

<div class="page">

    <!-- ÜST BAŞLIK -->
    <div class="topbar">

        <div class="back" onclick="geriDon()">‹</div>

        <div class="top-title">
            Şifremi unuttum
        </div>

    </div>


    <!-- ANA İÇERİK -->
    <main class="content">

        <h1 class="title">
            Profilini bul
        </h1>

        <p class="description">
            Hesabını bulmak için cep telefonu numaranı gir.
        </p>

        <input
            id="phoneInput"
            class="phone-input"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="Cep telefonu numarası"
        >

        <button
            id="continueBtn"
            class="continue-btn"
            onclick="devamEt()"
        >
            Devam
        </button>

        <a
            class="other-method"
            href="sifremi-unuttum.html"
        >
            E-posta adresi veya kullanıcı adıyla bul
        </a>

        <div
            id="message"
            class="message"
        ></div>

    </main>

</div>


<script>

/* GERİ */
function geriDon(){
    window.location.href = "sifremi-unuttum.html";
}


/* DEVAM */
function devamEt(){

    const phoneInput = document.getElementById("phoneInput");
    const message = document.getElementById("message");

    const phone = phoneInput.value.trim();

    message.className = "message";
    message.textContent = "";

    if(!phone){

        message.textContent =
            "Lütfen cep telefonu numaranı gir.";

        phoneInput.focus();

        return;
    }

    /*
       BURASI FIREBASE / SERVER İŞLEMİ İÇİN
       SONRADAN BAĞLANACAK.

       Şimdilik numara girildiğinde
       kullanıcıya bilgi veriyoruz.
    */

    message.className = "message success";

    message.textContent =
        "Telefon numaran kontrol ediliyor...";

}


/* ENTER İLE DEVAM */
document.getElementById("phoneInput").addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            devamEt();
        }

    }
);

</script>

</body>
</html>
