<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Şifremi unuttum - Minegram</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            background: #000;
        }

        /* ÜST BAR */

        .topbar {
            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;

            padding-left: 28px;
        }

        .back {
            width: 30px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #fff;
            font-size: 38px;
            font-weight: 300;
            line-height: 1;

            cursor: pointer;
            user-select: none;
        }

        .top-title {
            margin-left: 12px;

            font-size: 21px;
            font-weight: 700;

            color: #fff;
        }

        /* ANA ALAN */

        .content {
            width: 317px;

            margin: 105px auto 0;
        }

        .title {
            text-align: center;

            font-size: 42px;
            line-height: 1.15;
            font-weight: 700;

            margin: 0 0 30px;

            color: #fff;
        }

        .description {
            font-size: 21px;
            line-height: 1.5;

            color: #bdbdbd;

            margin: 0 0 55px;
        }

        /* INPUT */

        .input {
            display: block;

            width: 100%;
            height: 68px;

            padding: 0 20px;

            border: 2px solid #686868;
            border-radius: 9px;

            background: #111;

            color: #fff;

            outline: none;

            font-size: 18px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .input::placeholder {
            color: #bdbdbd;
            opacity: 1;
        }

        .input:focus {
            border-color: #888;
        }

        /* DEVAM */

        .continue-btn {
            display: block;

            width: 100%;
            height: 58px;

            margin-top: 18px;

            border: 0;
            border-radius: 32px;

            background: #63afea;

            color: #292078;

            font-size: 20px;
            font-weight: 700;

            cursor: pointer;
        }

        .continue-btn:active {
            transform: scale(.99);
        }

        /* DİĞER YÖNTEM */

        .other-method {
            display: block;

            width: 100%;

            margin-top: 25px;

            text-align: center;

            color: #63b3f4;

            font-size: 18px;
            line-height: 1.4;

            font-weight: 700;

            text-decoration: none;

            cursor: pointer;
        }

        .other-method:hover {
            color: #78c0f7;
        }

        /* GİRİŞE DÖN */

        .login-back {
            display: block;

            width: 100%;

            margin-top: 45px;

            text-align: center;

            color: #63b3f4;

            font-size: 18px;
            font-weight: 700;

            text-decoration: none;
        }

        .login-back:hover {
            color: #78c0f7;
        }

        /* MESAJ */

        .message {
            min-height: 20px;

            margin-top: 12px;

            text-align: center;

            font-size: 14px;

            line-height: 1.4;

            color: #ff5c5c;
        }

        .message.success {
            color: #55b8ff;
        }

        /* TABLET / DESKTOP */

        @media (min-width: 601px) {

            .content {
                width: 317px;
                margin-top: 105px;
            }

            .title {
                font-size: 42px;
            }

            .description {
                font-size: 21px;
            }

            .input {
                height: 68px;
                font-size: 18px;
            }

            .continue-btn {
                height: 58px;
                font-size: 20px;
            }

            .other-method,
            .login-back {
                font-size: 18px;
            }
        }

        /* KÜÇÜK TELEFON */

        @media (max-width: 430px) {

            .topbar {
                height: 70px;
                padding-left: 28px;
            }

            .back {
                font-size: 38px;
            }

            .top-title {
                font-size: 21px;
            }

            .content {
                width: calc(100% - 40px);
                max-width: 365px;

                margin-top: 105px;
            }

            .title {
                font-size: 38px;
            }

            .description {
                font-size: 20px;
                line-height: 1.5;
            }

            .input {
                height: 68px;
                font-size: 18px;
            }

            .continue-btn {
                height: 58px;
                font-size: 20px;
            }

            .other-method,
            .login-back {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- ÜST BAR -->
    <div class="topbar">

        <div
            class="back"
            onclick="history.back()"
            aria-label="Geri"
        >
            ‹
        </div>

        <div class="top-title">
            Şifremi unuttum
        </div>

    </div>


    <!-- ANA İÇERİK -->
    <main class="content">

        <h1 class="title">
            Profilini bul
        </h1>

        <p class="description">
            Hesabını bulmak için e-posta adresini veya
            kullanıcı adını gir.
        </p>


        <!-- E-POSTA / KULLANICI -->
        <input
            id="emailOrUsername"
            class="input"
            type="text"
            autocomplete="username"
            placeholder="E-posta adresi veya kullanıcı adı"
        >


        <button
            id="continueBtn"
            class="continue-btn"
            type="button"
        >
            Devam
        </button>


        <!-- TELEFON SAYFASINA GEÇ -->
        <a
            class="other-method"
            href="sifremi-unuttum-telefon.html"
        >
            Cep telefonu numarasıyla bul
        </a>


        <!-- GİRİŞ SAYFASI -->
        <a
            class="login-back"
            href="giris.html"
        >
            Giriş ekranına dön
        </a>


        <div
            id="message"
            class="message"
        ></div>

    </main>

</div>


<script>
    const input = document.getElementById("emailOrUsername");
    const button = document.getElementById("continueBtn");
    const message = document.getElementById("message");

    button.addEventListener("click", function () {

        const value = input.value.trim();

        message.textContent = "";
        message.className = "message";

        if (!value) {
            message.textContent =
                "Lütfen e-posta adresinizi veya kullanıcı adınızı girin.";
            return;
        }

        /*
         * Firebase / server.js işlemini
         * burada bağlayabilirsin.
         */

        message.textContent =
            "Bilgiler kontrol ediliyor...";
        message.classList.add("success");
    });
</script>

</body>
</html>
