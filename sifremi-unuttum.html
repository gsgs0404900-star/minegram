<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Minegram - Şifremi Unuttum</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

/* =========================
   ÜST BAR
========================= */

.topbar{
    width:100%;
    height:70px;
    display:flex;
    align-items:center;
    padding:0 22px;
}

.back{
    width:42px;
    height:42px;
    padding:0;
    border:0;
    background:transparent;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.back svg{
    width:32px;
    height:32px;
    fill:none;
    stroke:#fff;
    stroke-width:2.4;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.page-title{
    margin-left:12px;
    font-size:23px;
    font-weight:700;
}

/* =========================
   ANA ALAN
========================= */

.content{
    width:min(650px,calc(100% - 44px));
    margin:105px auto 0;
}

/* BAŞLIK */

.heading{
    margin:0;
    text-align:center;
    font-size:46px;
    line-height:1.15;
    font-weight:700;
}

/* AÇIKLAMA */

.description{
    margin:30px 0 55px;
    color:#bdbdbd;
    font-size:24px;
    line-height:1.45;
    font-weight:400;
}

/* INPUT */

.input{
    width:100%;
    height:74px;
    border:2px solid #666;
    border-radius:9px;
    background:#111;
    color:#fff;
    padding:0 22px;
    outline:none;
    font-size:22px;
    font-family:Arial,Helvetica,sans-serif;
}

.input::placeholder{
    color:#bcbcbc;
    opacity:1;
}

.input:focus{
    border-color:#8b8b8b;
}

/* DEVAM */

.continue-btn{
    width:100%;
    height:64px;
    margin-top:30px;
    border:0;
    border-radius:34px;
    background:#65b5ed;
    color:#3d267d;
    font-size:23px;
    font-weight:700;
    font-family:Arial,Helvetica,sans-serif;
    cursor:pointer;
}

.continue-btn:active{
    transform:scale(.99);
}

.continue-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =========================
   ALT LİNKLER
========================= */

.phone-link{
    display:block;
    margin-top:34px;
    text-align:center;
    color:#69b7ee;
    font-size:23px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
}

.login-link{
    display:block;
    margin-top:54px;
    text-align:center;
    color:#69b7ee;
    font-size:23px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
}

/* =========================
   MESAJ
========================= */

.message{
    min-height:22px;
    margin-top:18px;
    text-align:center;
    padding:0 8px;
    font-size:15px;
    line-height:1.4;
}

.message.success{
    color:#42d66d;
}

.message.error{
    color:#ff5252;
}

/* =========================
   TELEFON
========================= */

@media(max-width:700px){

    .topbar{
        height:68px;
        padding:0 18px;
    }

    .back{
        width:40px;
        height:40px;
    }

    .back svg{
        width:31px;
        height:31px;
    }

    .page-title{
        margin-left:10px;
        font-size:22px;
    }

    .content{
        width:calc(100% - 48px);
        margin-top:105px;
    }

    .heading{
        font-size:43px;
    }

    .description{
        margin-top:27px;
        margin-bottom:52px;
        font-size:22px;
        line-height:1.48;
    }

    .input{
        height:72px;
        padding:0 20px;
        font-size:21px;
    }

    .continue-btn{
        height:62px;
        margin-top:28px;
        font-size:22px;
    }

    .phone-link{
        margin-top:32px;
        font-size:21px;
    }

    .login-link{
        margin-top:52px;
        font-size:21px;
    }
}

/* =========================
   KÜÇÜK TELEFON
========================= */

@media(max-width:480px){

    .topbar{
        height:64px;
        padding:0 14px;
    }

    .back{
        width:38px;
        height:38px;
    }

    .back svg{
        width:29px;
        height:29px;
    }

    .page-title{
        font-size:21px;
    }

    .content{
        width:calc(100% - 40px);
        margin-top:96px;
    }

    .heading{
        font-size:38px;
    }

    .description{
        margin-top:25px;
        margin-bottom:43px;
        font-size:19px;
        line-height:1.5;
    }

    .input{
        height:68px;
        padding:0 18px;
        font-size:18px;
    }

    .continue-btn{
        height:60px;
        margin-top:25px;
        font-size:21px;
    }

    .phone-link{
        margin-top:31px;
        font-size:19px;
    }

    .login-link{
        margin-top:48px;
        font-size:19px;
    }

    .message{
        font-size:14px;
    }
}

/* =========================
   ÇOK KÜÇÜK EKRAN
========================= */

@media(max-width:360px){

    .content{
        width:calc(100% - 32px);
        margin-top:85px;
    }

    .heading{
        font-size:34px;
    }

    .description{
        font-size:18px;
    }

    .input{
        font-size:17px;
    }

    .continue-btn{
        font-size:20px;
    }

    .phone-link,
    .login-link{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- =====================
         ÜST BAR
    ====================== -->

    <header class="topbar">

        <button
            class="back"
            type="button"
            onclick="goBack()"
            aria-label="Geri">

            <svg viewBox="0 0 24 24">
                <path d="M19 12H5"></path>
                <path d="M11 18L5 12L11 6"></path>
            </svg>

        </button>

        <div class="page-title">
            Şifremi unuttum
        </div>

    </header>


    <!-- =====================
         İÇERİK
    ====================== -->

    <main class="content">

        <h1 class="heading">
            Profilini bul
        </h1>

        <p class="description">
            Hesabını bulmak için e-posta adresini veya
            kullanıcı adını gir.
        </p>


        <input
            id="accountInput"
            class="input"
            type="text"
            autocomplete="email"
            placeholder="E-posta adresi veya kullanıcı adı"
        >


        <button
            id="continueBtn"
            class="continue-btn"
            type="button">

            Devam

        </button>


        <div
            id="message"
            class="message">
        </div>


        <a
            href="#"
            id="phoneLink"
            class="phone-link">

            Cep telefonu numarasıyla bul

        </a>


        <a
            href="giris.html"
            class="login-link">

            Giriş ekranına dön

        </a>

    </main>

</div>


<script type="module">

/* =========================================
   FIREBASE
   MINEGRAM MEVCUT FIREBASE PROJESİ
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain:
        "mim-ea133.firebaseapp.com",

    databaseURL:
        "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "mim-ea133",

    storageBucket:
        "mim-ea133.firebasestorage.app",

    messagingSenderId:
        "303525353436",

    appId:
        "1:303525353436:web:082fc090b5025e19942119",

    measurementId:
        "G-K962QE5P1R"
};


/* FIREBASE BAŞLAT */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* ELEMENTLER */

const accountInput =
    document.getElementById("accountInput");

const continueBtn =
    document.getElementById("continueBtn");

const message =
    document.getElementById("message");

const phoneLink =
    document.getElementById("phoneLink");


/* =========================================
   MESAJ
========================================= */

function showMessage(text,type="error"){

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =========================================
   GERİ
========================================= */

window.goBack = function(){

    if(
        document.referrer &&
        document.referrer.includes(
            location.hostname
        )
    ){

        history.back();

    }else{

        location.href =
            "giris.html";

    }

};


/* =========================================
   ŞİFRE SIFIRLAMA
========================================= */

async function resetPassword(){

    const value =
        accountInput.value.trim();


    showMessage("");


    if(!value){

        showMessage(
            "E-posta adresini veya kullanıcı adını gir."
        );

        accountInput.focus();

        return;
    }


    /*
       Firebase şifre sıfırlama
       e-posta adresiyle çalışır.

       Kullanıcı adı girilmişse mevcut
       Firebase Authentication doğrudan
       kullanıcı adını kabul etmez.
    */

    if(!value.includes("@")){

        showMessage(
            "Şifre sıfırlamak için kayıtlı e-posta adresini gir."
        );

        accountInput.focus();

        return;
    }


    continueBtn.disabled = true;

    continueBtn.textContent =
        "Gönderiliyor...";


    try{

        await sendPasswordResetEmail(
            auth,
            value
        );


        showMessage(
            "Şifre sıfırlama bağlantısı e-posta adresine gönderildi.",
            "success"
        );


        continueBtn.textContent =
            "Gönderildi";


    }catch(error){

        console.error(
            "[MINEGRAM PASSWORD RESET]",
            error
        );


        let text =
            "Şifre sıfırlama bağlantısı gönderilemedi.";


        switch(error.code){

            case "auth/invalid-email":

                text =
                    "Geçerli bir e-posta adresi gir.";

                break;


            case "auth/user-not-found":

                text =
                    "Bu e-posta ile kayıtlı hesap bulunamadı.";

                break;


            case "auth/too-many-requests":

                text =
                    "Çok fazla deneme yapıldı. Biraz sonra tekrar dene.";

                break;


            case "auth/network-request-failed":

                text =
                    "İnternet bağlantısını kontrol et.";

                break;


            case "auth/operation-not-allowed":

                text =
                    "E-posta ile şifre sıfırlama Firebase'de aktif değil.";

                break;


            default:

                text =
                    error.message ||
                    "Bir hata oluştu.";

                break;

        }


        showMessage(text);


        continueBtn.disabled = false;

        continueBtn.textContent =
            "Devam";

    }

}


/* =========================================
   DEVAM BUTONU
========================================= */

continueBtn.addEventListener(
    "click",
    resetPassword
);


/* =========================================
   ENTER
========================================= */

accountInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            resetPassword();

        }

    }
);


/* =========================================
   TELEFON NUMARASI
========================================= */

phoneLink.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        showMessage(
            "Telefon numarasıyla hesap bulma özelliği yakında aktif olacak."
        );

    }
);

</script>

</body>
</html>
