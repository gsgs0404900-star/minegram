<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<title>Minegram - Şifremi Unuttum</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

/* ANA ALAN */
.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

/* ÜST BAR */
.topbar{
    width:100%;
    height:78px;
    display:flex;
    align-items:center;
    padding:0 42px;
    border-bottom:1px solid #171717;
}

.back{
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-decoration:none;
    font-size:52px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
}

.top-title{
    margin-left:20px;
    font-size:28px;
    font-weight:700;
    color:#fff;
}

/* İÇERİK */
.content{
    width:100%;
    max-width:760px;
    margin:0 auto;
    padding:125px 35px 80px;
}

/* BAŞLIK */
.main-title{
    margin:0 0 32px;
    text-align:center;
    font-size:52px;
    line-height:1.1;
    font-weight:700;
    color:#fff;
}

/* AÇIKLAMA */
.description{
    width:100%;
    margin:0 auto 58px;
    font-size:25px;
    line-height:1.5;
    color:#bcbcbc;
    text-align:left;
}

/* FORM */
.form{
    width:100%;
}

/* INPUT */
.input{
    width:100%;
    height:82px;
    padding:0 25px;
    border:2px solid #686868;
    border-radius:9px;
    outline:none;
    background:#111;
    color:#fff;
    font-size:24px;
    font-family:Arial,Helvetica,sans-serif;
}

.input::placeholder{
    color:#bdbdbd;
    opacity:1;
}

.input:focus{
    border-color:#8a8a8a;
    background:#121212;
}

/* DEVAM BUTONU */
.continue-btn{
    width:100%;
    height:82px;
    margin-top:30px;
    border:0;
    border-radius:42px;
    background:#65b4ee;
    color:#302071;
    font-size:25px;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
}

.continue-btn:hover{
    background:#73baf0;
}

.continue-btn:active{
    transform:scale(.985);
}

.continue-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* ALT LİNKLER */
.alt-link{
    display:block;
    width:100%;
    margin-top:42px;
    text-align:center;
    color:#65b4ee;
    font-size:25px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
}

.alt-link:hover{
    text-decoration:none;
    color:#79bdf0;
}

.login-link{
    margin-top:58px;
}

/* MESAJ */
.message{
    display:none;
    width:100%;
    margin-top:25px;
    padding:16px 18px;
    border-radius:10px;
    text-align:center;
    font-size:17px;
    line-height:1.45;
}

.message.show{
    display:block;
}

.message.error{
    background:#2a1115;
    border:1px solid #6e2832;
    color:#ff9ca8;
}

.message.success{
    background:#10251a;
    border:1px solid #285d3a;
    color:#8ee0ad;
}

/* YÜKLENİYOR */
.loading{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.spinner{
    width:21px;
    height:21px;
    border:3px solid rgba(48,32,113,.35);
    border-top-color:#302071;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* TABLET */
@media(max-width:900px){

    .topbar{
        height:74px;
        padding:0 28px;
    }

    .back{
        font-size:48px;
        width:50px;
        height:50px;
    }

    .top-title{
        font-size:26px;
        margin-left:15px;
    }

    .content{
        max-width:700px;
        padding:105px 30px 70px;
    }

    .main-title{
        font-size:48px;
    }

    .description{
        font-size:23px;
    }

    .input,
    .continue-btn{
        height:78px;
    }
}

/* TELEFON */
@media(max-width:600px){

    .topbar{
        height:70px;
        padding:0 18px;
    }

    .back{
        width:46px;
        height:46px;
        font-size:45px;
    }

    .top-title{
        margin-left:12px;
        font-size:25px;
    }

    .content{
        width:100%;
        max-width:none;
        padding:88px 30px 55px;
    }

    .main-title{
        font-size:43px;
        margin-bottom:30px;
    }

    .description{
        font-size:22px;
        line-height:1.5;
        margin-bottom:52px;
    }

    .input{
        height:76px;
        font-size:21px;
        padding:0 22px;
    }

    .continue-btn{
        height:76px;
        margin-top:28px;
        font-size:23px;
    }

    .alt-link{
        font-size:22px;
        margin-top:40px;
    }

    .login-link{
        margin-top:52px;
    }
}

/* KÜÇÜK TELEFON */
@media(max-width:390px){

    .content{
        padding-left:22px;
        padding-right:22px;
        padding-top:72px;
    }

    .topbar{
        padding:0 14px;
    }

    .main-title{
        font-size:37px;
    }

    .description{
        font-size:20px;
    }

    .input{
        font-size:19px;
    }

    .continue-btn{
        font-size:21px;
    }

    .alt-link{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- ÜST BAR -->
    <header class="topbar">

        <a href="giris.html"
           class="back"
           aria-label="Geri dön">‹</a>

        <div class="top-title">
            Şifremi unuttum
        </div>

    </header>


    <!-- ANA İÇERİK -->
    <main class="content">

        <h1 class="main-title">
            Profilini bul
        </h1>

        <p class="description">
            Hesabını bulmak için e-posta adresini veya
            kullanıcı adını gir.
        </p>


        <form id="forgotForm" class="form">

            <input
                id="emailInput"
                class="input"
                type="text"
                autocomplete="username"
                placeholder="E-posta adresi veya kullanıcı adı"
                required
            >

            <button
                id="continueBtn"
                class="continue-btn"
                type="submit">
                Devam
            </button>

        </form>


        <div id="message"
             class="message">
        </div>


        <a href="#"
           id="phoneLink"
           class="alt-link">
            Cep telefonu numarasıyla bul
        </a>


        <a href="giris.html"
           class="alt-link login-link">
            Giriş ekranına dön
        </a>

    </main>

</div>


<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>

/*
====================================================
MINEGRAM ŞİFREMİ UNUTTUM
====================================================

Buradaki Firebase ayarları,
giris.html dosyanda kullandığın ayarlarla
AYNI olmalıdır.

Eğer giriş.html'de firebaseConfig zaten farklı
şekilde tanımlanıyorsa, aşağıdaki bilgileri
oradaki bilgilerle aynı yap.
====================================================
*/

const firebaseConfig = {
    apiKey: "BURAYA_FIREBASE_API_KEY",
    authDomain: "BURAYA_FIREBASE_AUTH_DOMAIN",
    projectId: "BURAYA_FIREBASE_PROJECT_ID",
    storageBucket: "BURAYA_FIREBASE_STORAGE_BUCKET",
    messagingSenderId: "BURAYA_FIREBASE_MESSAGING_SENDER_ID",
    appId: "BURAYA_FIREBASE_APP_ID"
};


/* Firebase başlat */
let firebaseReady = false;

try{

    if(
        firebaseConfig.apiKey !== "BURAYA_FIREBASE_API_KEY"
    ){

        firebase.initializeApp(firebaseConfig);

        firebaseReady = true;
    }

}catch(error){

    console.error(
        "Firebase başlatılamadı:",
        error
    );

}


/* ELEMENTLER */
const form =
    document.getElementById("forgotForm");

const input =
    document.getElementById("emailInput");

const button =
    document.getElementById("continueBtn");

const message =
    document.getElementById("message");

const phoneLink =
    document.getElementById("phoneLink");


/* MESAJ GÖSTER */
function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message show " + type;
}


/* MESAJ TEMİZLE */
function clearMessage(){

    message.textContent = "";

    message.className =
        "message";
}


/* BUTON YÜKLENİYOR */
function setLoading(loading){

    if(loading){

        button.disabled = true;

        button.innerHTML = `
            <span class="loading">
                <span class="spinner"></span>
                Gönderiliyor...
            </span>
        `;

    }else{

        button.disabled = false;

        button.textContent = "Devam";

    }
}


/* E-POSTA KONTROLÜ */
function isEmail(value){

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(value);

}


/*
====================================================
ŞİFRE SIFIRLAMA
====================================================
*/

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage();

        const value =
            input.value.trim();

        if(!value){

            showMessage(
                "Lütfen e-posta adresini veya kullanıcı adını gir.",
                "error"
            );

            input.focus();

            return;
        }


        /*
        Firebase Auth doğrudan kullanıcı adıyla
        şifre sıfırlama yapmaz.

        E-posta girildiyse Firebase'e gönderilir.
        Kullanıcı adı girildiyse Minegram API'si
        üzerinden e-posta bulunmaya çalışılır.
        */

        setLoading(true);


        try{

            let email = value;


            /*
            E-posta değilse Minegram API'den
            kullanıcı adına ait e-posta aranır.
            */

            if(!isEmail(value)){

                try{

                    const response =
                        await fetch(
                            "/api/forgot-password",
                            {
                                method:"POST",
                                headers:{
                                    "Content-Type":
                                        "application/json"
                                },
                                body:JSON.stringify({
                                    username:value
                                })
                            }
                        );


                    const data =
                        await response
                            .json()
                            .catch(()=>({}));


                    if(
                        response.ok &&
                        data.email
                    ){

                        email =
                            data.email;

                    }else{

                        throw new Error(
                            "Kullanıcı adı bulunamadı."
                        );

                    }

                }catch(apiError){

                    /*
                    API yoksa kullanıcıdan e-posta
                    adresi istenmesi daha güvenlidir.
                    */

                    showMessage(
                        "Kullanıcı adıyla arama şu anda kullanılamıyor. Lütfen hesabındaki e-posta adresini gir.",
                        "error"
                    );

                    setLoading(false);

                    return;
                }
            }


            /*
            Firebase e-posta sıfırlama
            */

            if(!firebaseReady){

                throw new Error(
                    "Firebase bağlantısı hazır değil. Firebase ayarlarını kontrol et."
                );

            }


            await firebase
                .auth()
                .sendPasswordResetEmail(
                    email
                );


            showMessage(
                "Şifre sıfırlama bağlantısı e-posta adresine gönderildi. E-posta kutunu ve spam klasörünü kontrol et.",
                "success"
            );


            input.value = "";


        }catch(error){

            console.error(
                "Şifre sıfırlama hatası:",
                error
            );


            let text =
                "İşlem sırasında bir hata oluştu.";


            if(
                error.code ===
                "auth/user-not-found"
            ){

                text =
                    "Bu e-posta adresiyle kayıtlı bir hesap bulunamadı.";

            }else if(
                error.code ===
                "auth/invalid-email"
            ){

                text =
                    "Geçerli bir e-posta adresi gir.";

            }else if(
                error.code ===
                "auth/too-many-requests"
            ){

                text =
                    "Çok fazla deneme yapıldı. Lütfen biraz sonra tekrar dene.";

            }else if(
                error.code ===
                "auth/network-request-failed"
            ){

                text =
                    "İnternet bağlantısını kontrol et.";

            }else if(
                error.message
            ){

                text =
                    error.message;
            }


            showMessage(
                text,
                "error"
            );

        }finally{

            setLoading(false);

        }

    }
);


/*
====================================================
TELEFON NUMARASI
====================================================
*/

phoneLink.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        showMessage(
            "Telefon numarasıyla hesap bulma özelliği yakında aktif olacak.",
            "error"
        );

    }
);


/*
====================================================
GERİ TUŞU
====================================================
*/

document
    .querySelector(".back")
    .addEventListener(
        "click",
        function(event){

            event.preventDefault();

            if(
                window.history.length > 1
            ){

                window.history.back();

            }else{

                location.href =
                    "giris.html";

            }

        }
    );

</script>

</body>
</html>
