<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifremi unuttum - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

/* ÜST BAŞLIK */
.topbar{
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:25px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:34px;
    font-weight:300;
    line-height:1;
    cursor:pointer;
    user-select:none;
}

.top-title{
    margin-left:15px;
    font-size:20px;
    font-weight:700;
    color:#fff;
}

/* ANA FORM */
.content{
    width:317px;
    margin:115px auto 0;
}

/* BAŞLIK */
.title{
    text-align:center;
    font-size:30px;
    line-height:1.15;
    font-weight:700;
    margin:0 0 34px;
    color:#fff;
}

/* AÇIKLAMA */
.description{
    font-size:18px;
    line-height:1.45;
    color:#bdbdbd;
    margin:0 0 65px;
}

/* INPUT */
.input,
.phone-input{
    display:block;
    width:100%;
    height:39px;
    padding:0 10px;

    border:1px solid #252525;
    border-radius:6px;

    background:#050505;
    color:#fff;

    outline:none;

    font-size:12px;
    font-family:Arial,Helvetica,sans-serif;
}

.input::placeholder,
.phone-input::placeholder{
    color:#777;
    opacity:1;
}

.input:focus,
.phone-input:focus{
    border-color:#555;
}

/* DEVAM */
.continue-btn{
    display:block;
    width:100%;
    height:37px;

    margin-top:8px;

    border:0;
    border-radius:22px;

    background:#2677b5;
    color:#000;

    font-size:12px;
    font-weight:700;

    cursor:pointer;
}

.continue-btn:active{
    transform:scale(.99);
}

.continue-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* ALT LİNK */
.other-method{
    display:block;
    width:100%;

    margin-top:12px;

    text-align:center;

    color:#008cff;

    font-size:12px;
    font-weight:400;

    text-decoration:none;

    cursor:pointer;

    line-height:1.4;
}

.other-method:hover{
    text-decoration:underline;
}

/* TELEFON EKRANI */
.phone-screen{
    display:none;
}

/* MESAJ */
.message{
    min-height:18px;
    margin-top:12px;
    text-align:center;
    font-size:11px;
    line-height:1.4;
    color:#ff5c5c;
}

.message.success{
    color:#55b8ff;
}

/* MOBİL */
@media(max-width:600px){

    .topbar{
        height:70px;
        padding-left:28px;
    }

    .back{
        width:30px;
        height:38px;
        font-size:38px;
    }

    .top-title{
        margin-left:12px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 120px);
        max-width:714px;
        margin:105px auto 0;
    }

    .title{
        font-size:42px;
        margin-bottom:30px;
    }

    .description{
        font-size:21px;
        line-height:1.5;
        margin-bottom:55px;
    }

    .input,
    .phone-input{
        height:68px;
        padding:0 20px;

        font-size:18px;

        border:2px solid #686868;
        border-radius:9px;
    }

    .continue-btn{
        height:58px;
        margin-top:18px;

        font-size:20px;
        border-radius:32px;
    }

    .other-method{
        margin-top:25px;
        font-size:18px;
        font-weight:700;
        color:#62b5f5;
    }

    .message{
        font-size:14px;
    }
}

/* KÜÇÜK TELEFON */
@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        margin-top:65px;
    }

    .title{
        font-size:38px;
    }

    .description{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- ÜST -->
    <div class="topbar">

        <div
            class="back"
            onclick="goBack()"
            aria-label="Geri"
        >
            ‹
        </div>

        <div class="top-title">
            Şifremi unuttum
        </div>

    </div>


    <!-- ========================= -->
    <!-- E-POSTA / KULLANICI ADI -->
    <!-- ========================= -->

    <main
        class="content"
        id="emailScreen"
    >

        <h1 class="title">
            Profilini bul
        </h1>

        <p class="description">
            Hesabını bulmak için e-posta adresini veya kullanıcı adını gir.
        </p>

        <input
            type="text"
            id="emailUsername"
            class="input"
            placeholder="E-posta adresi veya kullanıcı adı"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            onkeydown="if(event.key==='Enter') continueEmail()"
        >

        <button
            type="button"
            id="emailContinue"
            class="continue-btn"
            onclick="continueEmail()"
        >
            Devam
        </button>

        <div
            id="emailMessage"
            class="message"
        ></div>

        <!-- TELEFON SAYFASINA GİT -->
        <a
            href="sifremi-unuttum-telefon.html"
            class="other-method"
        >
            Cep telefonu numarasıyla bul
        </a>

        <!-- GİRİŞE DÖN -->
        <a
            href="giris.html"
            class="other-method"
            style="margin-top:25px;"
        >
            Giriş ekranına dön
        </a>

    </main>


    <!-- ========================= -->
    <!-- TELEFON EKRANI -->
    <!-- ========================= -->

    <main
        class="content phone-screen"
        id="phoneScreen"
    >

        <h1 class="title">
            Profilini bul
        </h1>

        <p class="description">
            Hesabını bulmak için cep telefonu numaranı gir.
        </p>

        <input
            type="tel"
            id="phoneNumber"
            class="phone-input"
            placeholder="Cep telefonu numarası"
            autocomplete="tel"
            onkeydown="if(event.key==='Enter') continuePhone()"
        >

        <button
            type="button"
            id="phoneContinue"
            class="continue-btn"
            onclick="continuePhone()"
        >
            Devam
        </button>

        <div
            id="phoneMessage"
            class="message"
        ></div>

        <!-- E-POSTA EKRANINA DÖN -->
        <a
            href="javascript:void(0)"
            class="other-method"
            onclick="showEmailScreen()"
        >
            E-posta adresi veya kullanıcı adıyla bul
        </a>

    </main>

</div>


<script>

/* =========================================
   GENEL GERİ BUTONU
========================================= */

function goBack(){

    if(
        document.getElementById("phoneScreen").style.display === "block"
    ){

        showEmailScreen();
        return;
    }

    history.back();
}


/* =========================================
   E-POSTA EKRANINI GÖSTER
========================================= */

function showEmailScreen(){

    const emailScreen =
        document.getElementById("emailScreen");

    const phoneScreen =
        document.getElementById("phoneScreen");

    phoneScreen.style.display = "none";
    emailScreen.style.display = "block";

    const input =
        document.getElementById("emailUsername");

    if(input){
        setTimeout(function(){
            input.focus();
        },100);
    }
}


/* =========================================
   TELEFON EKRANINI GÖSTER
========================================= */

function showPhoneScreen(){

    const emailScreen =
        document.getElementById("emailScreen");

    const phoneScreen =
        document.getElementById("phoneScreen");

    emailScreen.style.display = "none";
    phoneScreen.style.display = "block";

    const input =
        document.getElementById("phoneNumber");

    if(input){
        setTimeout(function(){
            input.focus();
        },100);
    }
}


/* =========================================
   MESAJ GÖSTER
========================================= */

function showMessage(id,text,type){

    const el =
        document.getElementById(id);

    if(!el)return;

    el.textContent = text;

    el.className =
        "message" +
        (type === "success" ? " success" : "");
}


/* =========================================
   E-POSTA / KULLANICI ADI
========================================= */

async function continueEmail(){

    const input =
        document.getElementById("emailUsername");

    const button =
        document.getElementById("emailContinue");

    const value =
        input.value.trim();

    showMessage(
        "emailMessage",
        "",
        ""
    );


    /* BOŞ */
    if(!value){

        showMessage(
            "emailMessage",
            "Lütfen e-posta adresini veya kullanıcı adını gir.",
            "error"
        );

        input.focus();
        return;
    }


    /* BUTONU KİLİTLE */
    button.disabled = true;
    button.textContent = "Kontrol ediliyor...";


    try{

        /*
         * Minegram server.js tarafında
         * aşağıdaki endpoint varsa kullanılır:
         *
         * POST /api/forgot-password/find-account
         *
         * Gönderilen:
         * {
         *    emailOrUsername: value
         * }
         */

        const response =
            await fetch(
                "/api/forgot-password/find-account",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        emailOrUsername:value
                    })
                }
            );


        const data =
            await response
                .json()
                .catch(function(){
                    return {};
                });


        /* SUNUCU HATASI */
        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                "Hesap bulunamadı."
            );
        }


        /*
         * HESAP BULUNDU
         */
        if(data.success){

            showMessage(
                "emailMessage",
                "Hesap bulundu. Yönlendiriliyor...",
                "success"
            );


            /*
             * Doğrulama sayfası.
             *
             * Eğer server.js email döndürüyorsa
             * buraya aktarılır.
             */

            const email =
                data.email || value;


            setTimeout(function(){

                window.location.href =
                    "sifremi-unuttum-dogrulama.html?email=" +
                    encodeURIComponent(email);

            },500);

            return;
        }


        /*
         * HESAP YOK
         */
        showMessage(
            "emailMessage",
            data.message ||
            "Bu bilgilerle eşleşen hesap bulunamadı.",
            "error"
        );

    }catch(error){

        console.error(
            "[ŞİFRE SIFIRLAMA]",
            error
        );


        showMessage(
            "emailMessage",
            error.message ||
            "Bir hata oluştu. Lütfen tekrar dene.",
            "error"
        );

    }finally{

        button.disabled = false;
        button.textContent = "Devam";
    }
}


/* =========================================
   TELEFON
========================================= */

async function continuePhone(){

    const input =
        document.getElementById("phoneNumber");

    const button =
        document.getElementById("phoneContinue");

    const value =
        input.value.trim();


    showMessage(
        "phoneMessage",
        "",
        ""
    );


    if(!value){

        showMessage(
            "phoneMessage",
            "Lütfen cep telefonu numaranı gir.",
            "error"
        );

        input.focus();
        return;
    }


    button.disabled = true;
    button.textContent = "Kontrol ediliyor...";


    try{

        /*
         * Telefon tarafının server.js bağlantısı
         * burada çalışacak.
         *
         * Endpoint:
         *
         * POST /api/forgot-password/find-phone
         */

        const response =
            await fetch(
                "/api/forgot-password/find-phone",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        phone:value
                    })
                }
            );


        const data =
            await response
                .json()
                .catch(function(){
                    return {};
                });


        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                "Bu telefon numarasıyla hesap bulunamadı."
            );
        }


        if(data.success){

            showMessage(
                "phoneMessage",
                "Hesap bulundu. Yönlendiriliyor...",
                "success"
            );


            setTimeout(function(){

                window.location.href =
                    "sifremi-unuttum-dogrulama.html?phone=" +
                    encodeURIComponent(
                        data.phone || value
                    );

            },500);

            return;
        }


        showMessage(
            "phoneMessage",
            data.message ||
            "Bu telefon numarasıyla eşleşen hesap bulunamadı.",
            "error"
        );

    }catch(error){

        console.error(
            "[TELEFON ŞİFRE SIFIRLAMA]",
            error
        );


        showMessage(
            "phoneMessage",
            error.message ||
            "Bir hata oluştu. Lütfen tekrar dene.",
            "error"
        );

    }finally{

        button.disabled = false;
        button.textContent = "Devam";
    }
}


/* =========================================
   SAYFA BAŞLANGICI
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        showEmailScreen();

    }
);

</script>

</body>
</html>
