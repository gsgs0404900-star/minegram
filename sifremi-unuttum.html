<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Şifremi unuttum - Minegram</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#f5f5f5;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    min-height:100vh;
    background:#000;
}

/* ÜST BAŞLIK */
.top{
    height:70px;
    width:100%;
    display:flex;
    align-items:center;
    padding:0 38px;
}

.back{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
}

.back svg{
    width:30px;
    height:30px;
    fill:none;
    stroke:currentColor;
    stroke-width:2.4;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.top-title{
    margin-left:8px;
    font-size:25px;
    font-weight:700;
    color:#fff;
}

/* ANA ALAN */
.main{
    width:100%;
    display:flex;
    justify-content:center;
    padding-top:105px;
    padding-bottom:80px;
}

/* GİRİŞ SAYFASIYLA AYNI DAR ÖLÇÜ */
.box{
    width:100%;
    max-width:380px;
}

/* BAŞLIK */
.title{
    margin:0;
    text-align:center;
    font-size:28px;
    line-height:1.2;
    font-weight:700;
    color:#fff;
}

/* AÇIKLAMA */
.description{
    margin:38px 0 0;
    font-size:17px;
    line-height:1.55;
    color:#bdbdbd;
    text-align:left;
}

/* FORM */
.form{
    margin-top:36px;
}

/* INPUT */
.input{
    width:100%;
    height:56px;
    border:1px solid #303030;
    border-radius:6px;
    background:#050505;
    color:#fff;
    outline:none;
    padding:0 14px;
    font-size:14px;
}

.input::placeholder{
    color:#777;
}

.input:focus{
    border-color:#555;
}

/* DEVAM */
.continue{
    width:100%;
    height:54px;
    margin-top:13px;
    border:0;
    border-radius:28px;
    background:#277ab8;
    color:#000;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
}

.continue:hover{
    background:#328bd0;
}

.continue:active{
    transform:scale(.99);
}

.continue:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* ALT LİNKLER */
.link{
    display:block;
    width:100%;
    border:0;
    background:transparent;
    color:#168bdc;
    text-align:center;
    font-size:14px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
}

.phone-link{
    margin-top:27px;
}

.login-link{
    margin-top:32px;
}

/* MESAJ */
.message{
    min-height:20px;
    margin-top:17px;
    text-align:center;
    font-size:13px;
    line-height:1.4;
    color:#aaa;
}

.message.success{
    color:#55c878;
}

.message.error{
    color:#ff5d6c;
}

/* MOBİL */
@media(max-width:699px){

    .top{
        height:70px;
        padding:0 28px;
    }

    .top-title{
        font-size:24px;
    }

    .main{
        padding:92px 24px 60px;
    }

    .box{
        max-width:380px;
    }

    .title{
        font-size:30px;
    }

    .description{
        margin-top:38px;
        font-size:18px;
        line-height:1.55;
    }

    .form{
        margin-top:36px;
    }

    .input{
        height:58px;
        font-size:16px;
        padding:0 15px;
    }

    .continue{
        height:56px;
        font-size:16px;
    }

    .link{
        font-size:16px;
    }

    .phone-link{
        margin-top:28px;
    }

    .login-link{
        margin-top:34px;
    }
}

/* ÇOK DAR TELEFONLAR */
@media(max-width:380px){

    .top{
        padding:0 18px;
    }

    .top-title{
        font-size:22px;
    }

    .main{
        padding-left:18px;
        padding-right:18px;
        padding-top:75px;
    }

    .title{
        font-size:27px;
    }

    .description{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- ÜST -->
    <header class="top">

        <button
            class="back"
            type="button"
            onclick="goBack()"
            aria-label="Geri">

            <svg viewBox="0 0 24 24">
                <path d="M19 12H5"></path>
                <path d="M12 19 5 12l7-7"></path>
            </svg>

        </button>

        <div class="top-title">
            Şifremi unuttum
        </div>

    </header>


    <!-- ANA İÇERİK -->
    <main class="main">

        <section class="box">

            <h1 class="title">
                Profilini bul
            </h1>

            <p class="description">
                Hesabını bulmak için e-posta adresini veya<br>
                kullanıcı adını gir.
            </p>


            <form
                id="forgotForm"
                class="form"
                onsubmit="sendReset(event)">

                <input
                    id="accountInput"
                    class="input"
                    type="text"
                    autocomplete="username"
                    placeholder="E-posta adresi veya kullanıcı adı"
                    required>

                <button
                    id="continueButton"
                    class="continue"
                    type="submit">

                    Devam

                </button>

            </form>


            <button
                type="button"
                class="link phone-link"
                onclick="findWithPhone()">

                Cep telefonu numarasıyla bul

            </button>


            <button
                type="button"
                class="link login-link"
                onclick="goLogin()">

                Giriş ekranına dön

            </button>


            <div
                id="message"
                class="message">
            </div>

        </section>

    </main>

</div>


<script>

/* =========================================
   MINEGRAM ŞİFRE SIFIRLAMA
   ========================================= */

const API = "/api";

const input = document.getElementById("accountInput");
const button = document.getElementById("continueButton");
const message = document.getElementById("message");


/* MESAJ */
function showMessage(text,type=""){
    message.textContent = text;
    message.className = "message " + type;
}


/* GİRİŞE DÖN */
function goLogin(){
    location.href = "giris.html";
}


/* GERİ */
function goBack(){

    if(document.referrer){
        history.back();
    }else{
        location.href = "giris.html";
    }

}


/* TELEFONLA BUL */
function findWithPhone(){

    /*
       Telefonla kurtarma ekranın henüz ayrı değilse
       şimdilik kullanıcıya bilgi veriyoruz.
    */

    input.focus();

    showMessage(
        "Telefon numarasıyla hesap bulma yakında kullanılabilir.",
        ""
    );
}


/* ŞİFRE SIFIRLAMA */
async function sendReset(event){

    event.preventDefault();

    const account = input.value.trim();

    if(!account){

        showMessage(
            "Lütfen e-posta adresinizi veya kullanıcı adınızı girin.",
            "error"
        );

        input.focus();
        return;
    }


    button.disabled = true;
    button.textContent = "Gönderiliyor...";

    showMessage("");


    try{

        /*
         * Minegram backend şifre sıfırlama endpoint'i.
         *
         * Backend'de /api/forgot-password varsa
         * doğrudan çalışır.
         */

        const response = await fetch(
            API + "/forgot-password",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    email:account,
                    username:account,
                    account:account
                })
            }
        );


        const data =
            await response
                .json()
                .catch(()=>({}));


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "Hesap bulunamadı veya işlem gerçekleştirilemedi."
            );

        }


        showMessage(
            data.message ||
            "Şifre sıfırlama bağlantısı e-posta adresinize gönderildi.",
            "success"
        );


    }catch(error){

        console.error(
            "[FORGOT PASSWORD]",
            error
        );


        showMessage(
            error.message ||
            "Bir hata oluştu. Lütfen tekrar deneyin.",
            "error"
        );


    }finally{

        button.disabled = false;
        button.textContent = "Devam";

    }

}


/* ENTER İLE GÖNDER */
input.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            document
                .getElementById("forgotForm")
                .requestSubmit();

        }

    }
);

</script>

</body>
</html>
