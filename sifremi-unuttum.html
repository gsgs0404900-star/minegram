<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minegram - Şifremi Unuttum</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:#000;
}

.container{
    width:min(430px,calc(100% - 40px));
    margin-top:70px;
    text-align:center;
}

/* LOGO */
.logo{
    font-size:22px;
    font-weight:700;
    letter-spacing:-.3px;
    margin-bottom:42px;
}

/* BAŞLIK */
.heading{
    margin:0;
    font-size:30px;
    line-height:1.15;
    font-weight:700;
}

/* AÇIKLAMA */
.description{
    margin:18px 0 30px;
    color:#aaa;
    font-size:16px;
    line-height:1.45;
}

/* FORM */
.form{
    width:100%;
}

.input{
    width:100%;
    height:52px;
    padding:0 15px;
    border:1px solid #333;
    border-radius:8px;
    outline:none;
    background:#111;
    color:#fff;
    font-size:15px;
    transition:border-color .15s,background .15s;
}

.input::placeholder{
    color:#777;
}

.input:focus{
    border-color:#777;
    background:#121212;
}

/* DEVAM ET */
.continue-btn{
    width:100%;
    height:48px;
    margin-top:18px;
    border:0;
    border-radius:8px;
    background:#3797f0;
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:opacity .15s,transform .1s;
}

.continue-btn:hover{
    opacity:.9;
}

.continue-btn:active{
    transform:scale(.985);
}

.continue-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* TELEFONLA */
.phone-link{
    display:inline-block;
    margin-top:24px;
    color:#3797f0;
    text-decoration:none;
    font-size:16px;
    font-weight:600;
}

.phone-link:hover{
    text-decoration:underline;
}

/* AYRAÇ */
.divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin:30px 0;
    color:#777;
    font-size:13px;
    font-weight:700;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#262626;
}

/* GİRİŞE DÖN */
.login-link{
    display:inline-block;
    margin-top:0;
    color:#fff;
    text-decoration:none;
    font-size:16px;
    font-weight:600;
}

.login-link:hover{
    text-decoration:underline;
}

/* MESAJ */
.message{
    min-height:20px;
    margin-top:16px;
    padding:0 5px;
    font-size:14px;
    line-height:1.4;
}

.message.success{
    color:#35d07f;
}

.message.error{
    color:#ff5c6c;
}

/* ALT BİLGİ */
.footer{
    margin-top:60px;
    padding-bottom:30px;
    color:#666;
    font-size:12px;
}

/* MOBİL */
@media(max-width:600px){

    .container{
        width:calc(100% - 32px);
        margin-top:55px;
    }

    .logo{
        font-size:21px;
        margin-bottom:38px;
    }

    .heading{
        font-size:28px;
    }

    .description{
        margin-top:16px;
        margin-bottom:27px;
        font-size:15px;
    }

    .input{
        height:50px;
        font-size:15px;
    }

    .continue-btn{
        height:47px;
        font-size:16px;
    }

    .phone-link{
        font-size:15px;
        margin-top:22px;
    }

    .login-link{
        font-size:15px;
    }

    .footer{
        margin-top:50px;
    }
}

/* ÇOK KÜÇÜK EKRAN */
@media(max-width:360px){

    .container{
        width:calc(100% - 28px);
        margin-top:40px;
    }

    .logo{
        margin-bottom:32px;
    }

    .heading{
        font-size:26px;
    }

    .description{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="page">

    <main class="container">

        <div class="logo">Minegram</div>

        <h1 class="heading">Şifreni mi unuttun?</h1>

        <p class="description">
            Hesabına kayıtlı e-posta adresini gir.
            Sana şifreni sıfırlaman için bir bağlantı göndereceğiz.
        </p>

        <form id="resetForm" class="form">

            <input
                id="email"
                class="input"
                type="email"
                autocomplete="email"
                placeholder="E-posta adresi"
                required
            >

            <button
                id="continueBtn"
                class="continue-btn"
                type="submit"
            >
                Şifre sıfırlama bağlantısı gönder
            </button>

        </form>

        <div id="message" class="message"></div>

        <a
            class="phone-link"
            href="giris.html"
        >
            Giriş yap
        </a>

        <div class="divider">
            VEYA
        </div>

        <a
            class="login-link"
            href="kayit.html"
        >
            Yeni hesap oluştur
        </a>

        <div class="footer">
            © 2026 Minegram
        </div>

    </main>

</div>


<!-- Firebase -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
    getAuth,
    sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


/*
====================================================
MINEGRAM FIREBASE AYARLARI
====================================================

BURADAKİ firebaseConfig BÖLÜMÜNÜ
GİRİŞ YAPTIĞIN firebaseConfig İLE AYNI YAP.

ÖRNEK:

const firebaseConfig = {
    apiKey: "....",
    authDomain: "....firebaseapp.com",
    projectId: "....",
    storageBucket: "....",
    messagingSenderId: "....",
    appId: "...."
};

====================================================
*/

const firebaseConfig = {

    apiKey: "BURAYA_API_KEY",

    authDomain: "BURAYA_AUTH_DOMAIN",

    projectId: "BURAYA_PROJECT_ID",

    storageBucket: "BURAYA_STORAGE_BUCKET",

    messagingSenderId: "BURAYA_MESSAGING_SENDER_ID",

    appId: "BURAYA_APP_ID"

};


let app;

try{

    app = initializeApp(firebaseConfig);

}catch(error){

    console.error("Firebase başlatılamadı:",error);

}


const auth = app ? getAuth(app) : null;

const form = document.getElementById("resetForm");
const emailInput = document.getElementById("email");
const button = document.getElementById("continueBtn");
const message = document.getElementById("message");


function showMessage(text,type){

    message.textContent = text;

    message.className = "message " + type;

}


form.addEventListener("submit",async function(event){

    event.preventDefault();

    const email = emailInput.value.trim();

    if(!email){

        showMessage(
            "Lütfen e-posta adresini gir.",
            "error"
        );

        emailInput.focus();

        return;
    }


    if(!auth){

        showMessage(
            "Firebase bağlantısı kurulamadı. Firebase ayarlarını kontrol et.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent = "Gönderiliyor...";

    showMessage("","");


    try{

        await sendPasswordResetEmail(
            auth,
            email
        );


        showMessage(
            "Şifre sıfırlama bağlantısı e-posta adresine gönderildi.",
            "success"
        );


        emailInput.value = "";


        button.textContent = "Bağlantı gönderildi";


        setTimeout(()=>{

            button.disabled = false;

            button.textContent =
                "Şifre sıfırlama bağlantısı gönder";

        },4000);


    }catch(error){

        console.error(
            "Şifre sıfırlama hatası:",
            error
        );


        let text =
            "Şifre sıfırlama işlemi başarısız oldu.";


        switch(error.code){

            case "auth/user-not-found":

                text =
                    "Bu e-posta adresiyle kayıtlı bir hesap bulunamadı.";

                break;


            case "auth/invalid-email":

                text =
                    "Geçerli bir e-posta adresi gir.";

                break;


            case "auth/too-many-requests":

                text =
                    "Çok fazla deneme yapıldı. Biraz sonra tekrar dene.";

                break;


            case "auth/network-request-failed":

                text =
                    "İnternet bağlantısını kontrol et.";

                break;


            case "auth/operation-not-allowed":

                text =
                    "Firebase'de e-posta/şifre girişi etkin değil.";

                break;

        }


        showMessage(
            text,
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Şifre sıfırlama bağlantısı gönder";

    }

});

</script>

</body>
</html>
