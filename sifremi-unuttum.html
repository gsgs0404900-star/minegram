<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Şifremi unuttum - Minegram</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ÜST BAŞLIK */
        .topbar {
            width: 100%;
            height: 72px;
            display: flex;
            align-items: center;
            padding: 0 38px;
            background: #000;
        }

        .back {
            color: #fff;
            text-decoration: none;
            font-size: 48px;
            line-height: 1;
            font-weight: 300;
            margin-right: 24px;
            cursor: pointer;
        }

        .top-title {
            font-size: 30px;
            font-weight: 700;
            color: #fff;
        }

        /* ANA ALAN */
        .page {
            width: 100%;
            min-height: calc(100vh - 72px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 720px;
            padding: 105px 30px 60px;
        }

        /* BAŞLIK */
        h1 {
            margin: 0 0 42px;
            text-align: center;
            font-size: 64px;
            line-height: 1.1;
            font-weight: 700;
            color: #fff;
        }

        /* AÇIKLAMA */
        .description {
            margin: 0 0 70px;
            font-size: 36px;
            line-height: 1.45;
            color: #cfcfcf;
            font-weight: 400;
        }

        /* INPUT */
        .input {
            width: 100%;
            height: 150px;
            border: 3px solid #666;
            border-radius: 12px;
            background: #111;
            color: #fff;
            padding: 0 40px;
            font-size: 34px;
            outline: none;
        }

        .input::placeholder {
            color: #c5c5c5;
            opacity: 1;
        }

        .input:focus {
            border-color: #888;
        }

        /* DEVAM */
        .continue-btn {
            width: 100%;
            height: 105px;
            margin-top: 42px;
            border: none;
            border-radius: 60px;
            background: #61b0ed;
            color: #22216f;
            font-size: 34px;
            font-weight: 700;
            cursor: pointer;
        }

        .continue-btn:active {
            transform: scale(0.99);
        }

        /* ALT LİNKLER */
        .link {
            display: block;
            text-align: center;
            color: #59adf2;
            text-decoration: none;
            font-size: 32px;
            font-weight: 700;
            line-height: 1.3;
            cursor: pointer;
        }

        .phone-link {
            margin-top: 48px;
        }

        .login-link {
            margin-top: 80px;
        }

        .link:hover {
            text-decoration: none;
        }

        /* HATA / BİLGİ */
        #message {
            display: none;
            margin-top: 25px;
            text-align: center;
            color: #ff7070;
            font-size: 24px;
            line-height: 1.4;
        }

        /* MOBİL */
        @media (max-width: 700px) {

            .topbar {
                height: 72px;
                padding: 0 50px;
            }

            .back {
                font-size: 52px;
                margin-right: 24px;
            }

            .top-title {
                font-size: 30px;
            }

            .container {
                max-width: none;
                padding: 135px 60px 50px;
            }

            h1 {
                font-size: 62px;
                margin-bottom: 42px;
            }

            .description {
                font-size: 36px;
                line-height: 1.45;
                margin-bottom: 72px;
            }

            .input {
                height: 150px;
                font-size: 34px;
                padding: 0 40px;
            }

            .continue-btn {
                height: 105px;
                font-size: 34px;
                margin-top: 42px;
            }

            .link {
                font-size: 32px;
            }

            .phone-link {
                margin-top: 48px;
            }

            .login-link {
                margin-top: 80px;
            }
        }

        /* DAHA KÜÇÜK TELEFONLAR */
        @media (max-width: 430px) {

            .topbar {
                padding: 0 22px;
            }

            .back {
                font-size: 42px;
                margin-right: 16px;
            }

            .top-title {
                font-size: 25px;
            }

            .container {
                padding: 100px 30px 40px;
            }

            h1 {
                font-size: 43px;
                margin-bottom: 30px;
            }

            .description {
                font-size: 25px;
                margin-bottom: 48px;
            }

            .input {
                height: 82px;
                font-size: 23px;
                padding: 0 25px;
                border-width: 2px;
            }

            .continue-btn {
                height: 72px;
                font-size: 23px;
                margin-top: 28px;
            }

            .link {
                font-size: 22px;
            }

            .phone-link {
                margin-top: 35px;
            }

            .login-link {
                margin-top: 55px;
            }
        }
    </style>
</head>

<body>

    <!-- ÜST BAŞLIK -->
    <div class="topbar">
        <a href="giris.html" class="back" aria-label="Geri dön">‹</a>
        <div class="top-title">Şifremi unuttum</div>
    </div>

    <!-- SAYFA -->
    <main class="page">

        <div class="container">

            <h1>Profilini bul</h1>

            <p class="description">
                Hesabını bulmak için e-posta adresini veya<br>
                kullanıcı adını gir.
            </p>

            <input
                id="emailUsername"
                class="input"
                type="text"
                autocomplete="username"
                placeholder="E-posta adresi veya kullanıcı adı"
            >

            <button
                id="continueBtn"
                class="continue-btn"
                type="button">
                Devam
            </button>

            <div id="message"></div>

            <!-- TELEFONLA BUL -->
            <a
                href="sifremi-unuttum-telefon.html"
                class="link phone-link">
                Cep telefonu numarasıyla bul
            </a>

            <!-- GİRİŞE DÖN -->
            <a
                href="giris.html"
                class="link login-link">
                Giriş ekranına dön
            </a>

        </div>

    </main>

    <script>
        const input = document.getElementById("emailUsername");
        const continueBtn = document.getElementById("continueBtn");
        const message = document.getElementById("message");

        continueBtn.addEventListener("click", function () {

            const value = input.value.trim();

            message.style.display = "none";
            message.textContent = "";

            if (!value) {
                message.textContent = "Lütfen e-posta adresinizi veya kullanıcı adınızı girin.";
                message.style.display = "block";
                input.focus();
                return;
            }

            /*
             * Firebase / server.js tarafındaki mevcut
             * e-posta-kullanıcı adı şifre sıfırlama sistemin
             * burada çalıştırılabilir.
             *
             * Şimdilik boş bırakıldı ki telefonla bulma
             * ekranının akışını bozmasın.
             */

            console.log("Şifre sıfırlama araması:", value);
        });

        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                continueBtn.click();
            }
        });
    </script>

</body>
</html>
