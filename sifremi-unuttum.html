<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Şifremi unuttum - Minegram</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#000;color:#fff}body{display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:410px;background:#111;border:1px solid #292929;border-radius:18px;padding:28px 22px}.logo{text-align:center;font-size:30px;font-weight:800}.title{text-align:center;font-size:22px;font-weight:700;margin-top:18px}.desc{text-align:center;color:#aaa;font-size:14px;line-height:1.45;margin:10px 0 24px}label{display:block;font-size:13px;color:#ddd;margin:0 0 7px}input{width:100%;height:48px;border:1px solid #333;border-radius:10px;background:#090909;color:#fff;padding:0 14px;font-size:15px;outline:0}input:focus{border-color:#777}button{width:100%;height:48px;border:0;border-radius:10px;background:#fff;color:#000;font-weight:700;font-size:15px;margin-top:14px;cursor:pointer}button:disabled{opacity:.55}.hidden{display:none}.msg{min-height:20px;text-align:center;font-size:13px;line-height:1.4;margin-top:13px}.ok{color:#76e08b}.err{color:#ff7777}.back{display:block;text-align:center;color:#aaa;text-decoration:none;font-size:13px;margin-top:18px}
</style></head>
<body><div class="card">
<div class="logo">Minegram</div><div class="title">Şifremi unuttum</div>
<div class="desc" id="desc">Kullanıcı adını gir. Doğrulama kodunu kayıtlı e-posta adresine göndereceğiz.</div>
<section id="step1"><label>Kullanıcı adı</label><input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="kullaniciadi"><button id="findBtn">Devam et</button></section>
<section id="step2" class="hidden"><label>Doğrulama kodu</label><input id="code" inputmode="numeric" maxlength="6" placeholder="6 haneli kod"><button id="verifyBtn">Kodu doğrula</button></section>
<section id="step3" class="hidden"><label>Yeni şifre</label><input id="password" type="password" autocomplete="new-password" placeholder="En az 6 karakter"><label style="margin-top:12px">Yeni şifre tekrar</label><input id="password2" type="password" autocomplete="new-password" placeholder="Şifreyi tekrar yaz"><button id="resetBtn">Şifreyi değiştir</button></section>
<div id="msg" class="msg"></div><a class="back" href="giris.html">Girişe dön</a>
</div>
<script>
const $=id=>document.getElementById(id);let username="",identifier="",resetToken="";
function msg(t,ok=false){$('msg').textContent=t||'';$('msg').className='msg '+(ok?'ok':'err')}
function busy(b,btn,text){btn.disabled=b;btn.textContent=b?text:btn.dataset.normal}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.success===false)throw new Error(d.error||d.message||'İşlem başarısız.');return d}
$('findBtn').dataset.normal='Devam et';$('verifyBtn').dataset.normal='Kodu doğrula';$('resetBtn').dataset.normal='Şifreyi değiştir';
$('findBtn').onclick=async()=>{username=$('username').value.trim().replace(/^@+/,'').toLowerCase();if(!username)return msg('Kullanıcı adını gir.');busy(true,$('findBtn'),'Kontrol ediliyor...');msg('');try{const d=await post('/api/forgot-password/find-account',{identifier:username,mode:'username'});identifier=username;sessionStorage.setItem('minegram_reset_username',username);if(d.account?.maskedEmail)sessionStorage.setItem('minegram_reset_masked_email',d.account.maskedEmail);await post('/api/forgot/start',{identifier,mode:'username'});$('step1').classList.add('hidden');$('step2').classList.remove('hidden');$('desc').textContent='Doğrulama kodunu kayıtlı e-posta adresine gönderdik. Kodu aşağıya yaz.';msg(d.account?.maskedEmail?d.account.maskedEmail+' adresine kod gönderildi.':'Kod e-posta adresine gönderildi.',true)}catch(e){msg(e.message)}finally{busy(false,$('findBtn'),'');}};
$('verifyBtn').onclick=async()=>{const code=$('code').value.trim();if(!/^\d{6}$/.test(code))return msg('6 haneli doğrulama kodunu gir.');busy(true,$('verifyBtn'),'Doğrulanıyor...');try{const d=await post('/api/forgot/verify',{identifier,username,mode:'username',code});resetToken=d.resetToken||d.reset_token||d.token||'';if(!resetToken)throw new Error('Şifre sıfırlama anahtarı alınamadı.');sessionStorage.setItem('minegram_reset_token',resetToken);$('step2').classList.add('hidden');$('step3').classList.remove('hidden');$('desc').textContent='Yeni şifreni belirle.';msg('Kod doğrulandı.',true)}catch(e){msg(e.message)}finally{busy(false,$('verifyBtn'),'');}};
$('resetBtn').onclick=async()=>{const p=$('password').value,p2=$('password2').value;if(p.length<6)return msg('Yeni şifre en az 6 karakter olmalı.');if(p!==p2)return msg('Şifreler eşleşmiyor.');resetToken=resetToken||sessionStorage.getItem('minegram_reset_token')||'';busy(true,$('resetBtn'),'Değiştiriliyor...');try{await post('/api/forgot/reset-password',{resetToken,password:p,confirmPassword:p2});sessionStorage.removeItem('minegram_reset_token');sessionStorage.removeItem('minegram_reset_username');sessionStorage.removeItem('minegram_reset_email');msg('Şifren başarıyla değiştirildi. Giriş sayfasına yönlendiriliyorsun.',true);setTimeout(()=>location.href='giris.html',1200)}catch(e){msg(e.message)}finally{busy(false,$('resetBtn'),'');}};
</script></body></html>
