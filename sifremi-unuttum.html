<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Şifremi unuttum - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

.topbar{
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:25px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:34px;
    font-weight:300;
    cursor:pointer;
}

.top-title{
    margin-left:15px;
    font-size:20px;
    font-weight:700;
}

.content{
    width:317px;
    margin:115px auto 0;
}

.title{
    text-align:center;
    font-size:30px;
    line-height:1.15;
    font-weight:700;
    margin:0 0 34px;
}

.description{
    font-size:18px;
    line-height:1.45;
    color:#bdbdbd;
    margin:0 0 65px;
}

.input{
    display:block;
    width:100%;
    height:39px;
    padding:0 10px;
    border:1px solid #252525;
    border-radius:6px;
    background:#050505;
    color:#fff;
    outline:none;
    font-size:12px;
}

.input::placeholder{
    color:#777;
}

.input:focus{
    border-color:#555;
}

.continue-btn{
    display:block;
    width:100%;
    height:37px;
    margin-top:18px;
    border:0;
    border-radius:22px;
    background:#2677b5;
    color:#000;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.continue-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    min-height:18px;
    margin-top:12px;
    text-align:center;
    font-size:11px;
    line-height:1.4;
    color:#ff5c5c;
}

.message.success{
    color:#55b8ff;
}

.login-link{
    display:block;
    margin-top:25px;
    text-align:center;
    color:#008cff;
    font-size:12px;
    text-decoration:none;
}

.login-link:hover{
    text-decoration:underline;
}

@media(max-width:600px){

    .topbar{
        height:70px;
        padding-left:28px;
    }

    .back{
        width:30px;
        height:38px;
        font-size:38px;
    }

    .top-title{
        margin-left:12px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 40px);
        max-width:714px;
        margin:105px auto 0;
    }

    .title{
        font-size:42px;
    }

    .description{
        font-size:21px;
        line-height:1.5;
        margin-bottom:55px;
    }

    .input{
        height:68px;
        padding:0 20px;
        font-size:18px;
        border:2px solid #686868;
        border-radius:9px;
    }

    .continue-btn{
        height:58px;
        font-size:20px;
        border-radius:32px;
    }

    .message{
        font-size:14px;
    }

    .login-link{
        font-size:18px;
        font-weight:700;
    }
}

@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        margin-top:65px;
    }

    .title{
        font-size:38px;
    }

    .description{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="topbar">

        <div
            class="back"
            id="backButton"
        >‹</div>

        <div class="top-title">
            Şifremi unuttum
        </div>

    </div>


    <main class="content">

        <h1 class="title">
            Şifreni sıfırla
        </h1>

        <p class="description">
            Hesabına kayıtlı e-posta adresini gir. Sana şifreni sıfırlayabileceğin bir bağlantı gönderelim.
        </p>

        <input
            type="email"
            id="email"
            class="input"
            placeholder="E-posta adresi"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
        >

        <button
            type="button"
            id="continueButton"
            class="continue-btn"
        >
            Sıfırlama bağlantısı gönder
        </button>

        <div
            id="message"
            class="message"
        ></div>

        <a
            href="giris.html"
            class="login-link"
        >
            Giriş ekranına dön
        </a>

    </main>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {
  apiKey: "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",
  authDomain: "mim-ea133.firebaseapp.com",
  databaseURL: "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mim-ea133",
  storageBucket: "mim-ea133.firebasestorage.app",
  messagingSenderId: "303525353436",
  appId: "1:303525353436:web:082fc090b5025e19942119",
  measurementId: "G-K962QE5P1R"
};

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =========================================
   ELEMENTLER
========================================= */

const emailInput =
    document.getElementById("email");

const continueButton =
    document.getElementById(
        "continueButton"
    );

const message =
    document.getElementById("message");

const backButton =
    document.getElementById("backButton");


/* =========================================
   MESAJ
========================================= */

function showMessage(
    text,
    success=false
){

    message.textContent =
        text || "";

    message.className =
        "message";

    if(success){

        message.classList.add(
            "success"
        );

    }

}


/* =========================================
   FIREBASE HATA
========================================= */

function firebaseError(error){

    switch(error.code){

        case "auth/invalid-email":
            return "Geçerli bir e-posta adresi gir.";

        case "auth/user-not-found":
            return "Bu e-posta adresiyle kayıtlı bir hesap bulunamadı.";

        case "auth/too-many-requests":
            return "Çok fazla deneme yapıldı. Biraz sonra tekrar dene.";

        case "auth/network-request-failed":
            return "İnternet bağlantısını kontrol et.";

        default:
            return error.message ||
                "Şifre sıfırlama bağlantısı gönderilemedi.";

    }

}


/* =========================================
   GERİ
========================================= */

backButton.addEventListener(
    "click",
    function(){

        window.location.href =
            "giris.html";

    }
);


/* =========================================
   ŞİFRE SIFIRLAMA
========================================= */

async function resetPassword(){

    const email =
        emailInput.value
            .trim()
            .toLowerCase();


    showMessage("");


    if(!email){

        showMessage(
            "E-posta adresini gir."
        );

        emailInput.focus();

        return;
    }


    continueButton.disabled = true;

    continueButton.textContent =
        "Gönderiliyor...";


    try{

        await sendPasswordResetEmail(
            auth,
            email
        );


        /*
         * BAŞARILI
         */

        showMessage(
            "Şifre sıfırlama bağlantısı e-posta adresine gönderildi. E-postanı kontrol et.",
            true
        );


        continueButton.textContent =
            "Bağlantı gönderildi";


    }catch(error){

        console.error(
            "[MINEGRAM FIREBASE PASSWORD RESET]",
            error
        );


        showMessage(
            firebaseError(error)
        );


        continueButton.disabled =
            false;

        continueButton.textContent =
            "Sıfırlama bağlantısı gönder";

    }

}


continueButton.addEventListener(
    "click",
    resetPassword
);


emailInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            resetPassword();

        }

    }
);

</script>

</body>
</html>
