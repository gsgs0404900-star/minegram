<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifremi unuttum - Minegram</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
}

.page {
    width: 100%;
    min-height: 100vh;
    background: #000;
}

/* ÜST BAŞLIK */
.topbar {
    width: 100%;
    height: 60px;
    display: flex;
    align-items: center;
    padding-left: 38px;
}

.back {
    width: 25px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 34px;
    font-weight: 300;
    line-height: 1;
    cursor: pointer;
    user-select: none;
}

.top-title {
    margin-left: 15px;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
}

/* ANA FORM
   GİRİŞ.HTML İLE AYNI KÜÇÜK MASAÜSTÜ BOYUTU */
.content {
    width: 317px;
    margin: 115px auto 0;
}

/* BAŞLIK */
.title {
    text-align: center;
    font-size: 30px;
    line-height: 1.15;
    font-weight: 700;
    margin: 0 0 34px;
    color: #fff;
}

/* AÇIKLAMA */
.description {
    font-size: 18px;
    line-height: 1.45;
    color: #bdbdbd;
    margin: 0 0 65px;
}

/* INPUT */
.input {
    display: block;
    width: 100%;
    height: 39px;
    padding: 0 10px;

    border: 1px solid #252525;
    border-radius: 6px;

    background: #050505;
    color: #fff;

    outline: none;

    font-size: 12px;
    font-family: Arial, Helvetica, sans-serif;
}

.input::placeholder {
    color: #777;
    opacity: 1;
}

.input:focus {
    border-color: #555;
}

/* DEVAM */
.continue-btn {
    display: block;
    width: 100%;
    height: 37px;

    margin-top: 8px;

    border: 0;
    border-radius: 22px;

    background: #2677b5;
    color: #000;

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;
}

.continue-btn:active {
    transform: scale(.99);
}

/* ALT LİNKLER */
.other-method {
    display: block;
    width: 100%;

    margin-top: 12px;

    text-align: center;

    color: #008cff;

    font-size: 12px;
    font-weight: 400;

    text-decoration: none;

    cursor: pointer;

    line-height: 1.4;
}

.other-method:hover {
    text-decoration: underline;
}

/* TELEFON EKRANI GİZLİ */
.phone-screen {
    display: none;
}

/* TELEFON FORMU */
.phone-input {
    display: block;
    width: 100%;
    height: 39px;
    padding: 0 10px;

    border: 1px solid #252525;
    border-radius: 6px;

    background: #050505;
    color: #fff;

    outline: none;

    font-size: 12px;
}

.phone-input::placeholder {
    color: #777;
}

/* MOBİL */
@media (max-width: 600px) {

    .topbar {
        height: 70px;
        padding-left: 28px;
    }

    .back {
        width: 30px;
        height: 38px;
        font-size: 38px;
    }

    .top-title {
        margin-left: 12px;
        font-size: 21px;
    }

    /*
       TELEFONDA GÖRSELDEKİ GENİŞLİK
       828px ekran görüntüsünde yaklaşık 714px
    */
    .content {
        width: calc(100% - 120px);
        max-width: 714px;
        margin: 105px auto 0;
    }

    .title {
        font-size: 42px;
        margin-bottom: 30px;
    }

    .description {
        font-size: 21px;
        line-height: 1.5;
        margin-bottom: 55px;
    }

    .input,
    .phone-input {
        height: 68px;
        padding: 0 20px;

        font-size: 18px;

        border: 2px solid #686868;
        border-radius: 9px;
    }

    .continue-btn {
        height: 58px;
        margin-top: 18px;

        font-size: 20px;
        border-radius: 32px;
    }

    .other-method {
        margin-top: 25px;
        font-size: 18px;
        font-weight: 700;
        color: #62b5f5;
    }
}

/* KÜÇÜK TELEFON */
@media (max-width: 430px) {

    .content {
        width: calc(100% - 40px);
        margin-top: 65px;
    }

    .title {
        font-size: 38px;
    }

    .description {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- ÜST -->
    <div class="topbar">
        <div class="back" onclick="history.back()">‹</div>
        <div class="top-title">Şifremi unuttum</div>
    </div>


    <!-- E-POSTA / KULLANICI ADI EKRANI -->
    <main class="content" id="emailScreen">

        <h1 class="title">
            Profilini bul
        </h1>

        <p class="description">
            Hesabını bulmak için e-posta adresini veya kullanıcı adını gir.
        </p>

        <input
            type="text"
            id="emailUsername"
            class="input"
            placeholder="E-posta adresi veya kullanıcı adı"
            autocomplete="username"
        >

        <button
            type="button"
            class="continue-btn"
            onclick="continueEmail()"
        >
            Devam
        </button>

        <a
            href="javascript:void(0)"
            class="other-method"
            onclick="showPhoneScreen()"
        >
            Cep telefonu numarasıyla bul
        </a>

        <a
            href="giris.html"
            class="other-method"
            style="margin-top:25px;"
        >
            Giriş ekranına dön
        </a>

    </main>


    <!-- TELEFON EKRANI -->
    <main class="content phone-screen" id="phoneScreen">

        <h1 class="title">
            Profilini bul
        </h1>

        <p class="description">
            Hesabını bulmak için cep telefonu numaranı gir.
        </p>

        <input
            type="tel"
            id="phoneNumber"
            class="phone-input"
            placeholder="Cep telefonu numarası"
            autocomplete="tel"
        >

        <button
            type="button"
            class="continue-btn"
            onclick="continuePhone()"
        >
            Devam
        </button>

        <a
            href="javascript:void(0)"
            class="other-method"
            onclick="showEmailScreen()"
        >
            E-posta adresi veya kullanıcı adıyla bul
        </a>

    </main>

</div>


<script>

/* E-POSTA EKRANI */
function showEmailScreen() {

    document.getElementById("phoneScreen").style.display = "none";

    document.getElementById("emailScreen").style.display = "block";
}


/* TELEFON EKRANI */
function showPhoneScreen() {

    document.getElementById("emailScreen").style.display = "none";

    document.getElementById("phoneScreen").style.display = "block";
}


/* E-POSTA DEVAM */
function continueEmail() {

    const value =
        document.getElementById("emailUsername").value.trim();

    if (!value) {

        alert("Lütfen e-posta adresini veya kullanıcı adını gir.");

        return;
    }

    /*
       BURAYA SONRA FIREBASE KODUNU EKLEYECEĞİZ.
    */

}


/* TELEFON DEVAM */
function continuePhone() {

    const value =
        document.getElementById("phoneNumber").value.trim();

    if (!value) {

        alert("Lütfen cep telefonu numaranı gir.");

        return;
    }

    /*
       BURAYA SONRA FIREBASE TELEFON
       HESAP BULMA KODUNU EKLEYECEĞİZ.
    */

}

</script>

</body>
</html>
