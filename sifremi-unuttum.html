<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Şifremi unuttum</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

/* ÜST BAR */
.topbar{
    width:100%;
    height:70px;
    display:flex;
    align-items:center;
    padding-left:28px;
}

.back{
    width:30px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:38px;
    font-weight:300;
    line-height:1;
    cursor:pointer;
    user-select:none;
}

.top-title{
    margin-left:12px;
    font-size:21px;
    font-weight:700;
    color:#fff;
}

/* ANA ALAN */
.content{
    width:calc(100% - 120px);
    max-width:365px;
    margin:105px auto 0;
}

/* BAŞLIK */
.title{
    text-align:center;
    font-size:42px;
    line-height:1.15;
    font-weight:700;
    margin:0 0 30px;
    color:#fff;
}

/* AÇIKLAMA */
.description{
    font-size:21px;
    line-height:1.5;
    color:#bdbdbd;
    margin:0 0 55px;
}

/* TELEFON INPUT */
.phone-input{
    display:block;
    width:100%;
    height:68px;
    padding:0 20px;
    border:2px solid #686868;
    border-radius:9px;
    background:#111;
    color:#fff;
    outline:none;
    font-size:18px;
    font-family:Arial, Helvetica, sans-serif;
}

.phone-input::placeholder{
    color:#bdbdbd;
    opacity:1;
}

.phone-input:focus{
    border-color:#888;
}

/* DEVAM */
.continue-btn{
    display:block;
    width:100%;
    height:58px;
    margin-top:18px;
    border:0;
    border-radius:32px;
    background:#62b0ed;
    color:#25256e;
    font-size:20px;
    font-weight:700;
    cursor:pointer;
}

.continue-btn:active{
    transform:scale(.99);
}

.continue-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* E-POSTA İLE BUL */
.other-method{
    display:block;
    width:100%;
    margin-top:25px;
    text-align:center;
    color:#62b0ed;
    font-size:18px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
    line-height:1.4;
}

/* MESAJ */
.message{
    min-height:20px;
    margin-top:15px;
    text-align:center;
    font-size:14px;
    line-height:1.4;
    color:#ff5c5c;
}

.message.success{
    color:#55b8ff;
}

/* KÜÇÜK TELEFON */
@media(max-width:430px){

    .topbar{
        height:70px;
        padding-left:28px;
    }

    .back{
        width:30px;
        height:38px;
        font-size:38px;
    }

    .top-title{
        margin-left:12px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 40px);
        max-width:none;
        margin-top:65px;
    }

    .title{
        font-size:38px;
        margin-bottom:30px;
    }

    .description{
        font-size:20px;
        line-height:1.5;
        margin-bottom:55px;
    }

    .phone-input{
        height:68px;
        padding:0 20px;
        font-size:18px;
    }

    .continue-btn{
        height:58px;
        margin-top:18px;
        font-size:20px;
    }

    .other-method{
        margin-top:25px;
        font-size:18px;
    }
}

/* MASAÜSTÜ */
@media(min-width:601px){

    .topbar{
        height:70px;
        padding-left:38px;
    }

    .back{
        font-size:34px;
    }

    .top-title{
        margin-left:15px;
        font-size:20px;
    }

    .content{
        width:317px;
        margin:105px auto 0;
    }

    .title{
        font-size:30px;
        margin-bottom:34px;
    }

    .description{
        font-size:18px;
        line-height:1.45;
        margin-bottom:65px;
    }

    .phone-input{
        height:68px;
        font-size:18px;
    }

    .continue-btn{
        height:58px;
        font-size:20px;
    }

    .other-method{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- ÜST BAŞLIK -->
    <div class="topbar">

        <div class="back" onclick="geriDon()">‹</div>

        <div class="top-title">
            Şifremi unuttum
        </div>

    </div>


    <!-- ANA İÇERİK -->
    <main class="content">

        <h1 class="title">
            Profilini bul
        </h1>

        <p class="description">
            Hesabını bulmak için cep telefonu numaranı gir.
        </p>

        <input
            id="phoneInput"
            class="phone-input"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="Cep telefonu numarası"
        >

        <button
            id="continueBtn"
            class="continue-btn"
            onclick="devamEt()"
        >
            Devam
        </button>

        <a
            class="other-method"
            href="sifremi-unuttum.html"
        >
            E-posta adresi veya kullanıcı adıyla bul
        </a>

        <div
            id="message"
            class="message"
        ></div>

    </main>

</div>


<script>

/* GERİ */
function geriDon(){
    window.location.href = "sifremi-unuttum.html";
}


/* DEVAM */
function devamEt(){

    const phoneInput = document.getElementById("phoneInput");
    const message = document.getElementById("message");

    const phone = phoneInput.value.trim();

    message.className = "message";
    message.textContent = "";

    if(!phone){

        message.textContent =
            "Lütfen cep telefonu numaranı gir.";

        phoneInput.focus();

        return;
    }

    /*
       BURASI FIREBASE / SERVER İŞLEMİ İÇİN
       SONRADAN BAĞLANACAK.

       Şimdilik numara girildiğinde
       kullanıcıya bilgi veriyoruz.
    */

    message.className = "message success";

    message.textContent =
        "Telefon numaran kontrol ediliyor...";

}


/* ENTER İLE DEVAM */
document.getElementById("phoneInput").addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            devamEt();
        }

    }
);

</script>

</body>
</html>
