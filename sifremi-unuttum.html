<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Minegram - Şifremi unuttum</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

/* ÜST BAŞLIK */
.topbar{
    width:100%;
    height:72px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:46px;
    font-weight:300;
    line-height:1;
    cursor:pointer;
    user-select:none;
}

.top-title{
    margin-left:17px;
    font-size:27px;
    font-weight:700;
    color:#fff;
}

/* ANA ALAN */
.content{
    width:365px;
    margin:105px auto 0;
}

.title{
    text-align:center;
    font-size:46px;
    line-height:1.15;
    font-weight:700;
    margin:0 0 36px;
    color:#fff;
}

.description{
    font-size:24px;
    line-height:1.45;
    color:#bdbdbd;
    margin:0 0 68px;
}

.phone-input{
    width:100%;
    height:118px;
    padding:0 34px;
    border:2px solid #686868;
    border-radius:10px;
    background:#111;
    color:#fff;
    outline:none;
    font-size:25px;
    font-family:Arial,Helvetica,sans-serif;
}

.phone-input::placeholder{
    color:#bdbdbd;
    opacity:1;
}

.phone-input:focus{
    border-color:#8a8a8a;
}

.continue-btn{
    width:100%;
    height:84px;
    margin-top:35px;
    border:0;
    border-radius:44px;
    background:#64b5ed;
    color:#30206f;
    font-size:27px;
    font-weight:700;
    cursor:pointer;
}

.continue-btn:active{
    transform:scale(.99);
}

.continue-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.other-method{
    display:block;
    width:100%;
    margin-top:45px;
    text-align:center;
    color:#55aaf0;
    font-size:24px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
}

.message{
    min-height:30px;
    margin-top:28px;
    text-align:center;
    font-size:17px;
    line-height:1.4;
    color:#ff5c5c;
}

.message.success{
    color:#55b8ff;
}

/* DOĞRULAMA KODU ALANI */
.code-box{
    display:none;
    margin-top:35px;
}

.code-title{
    text-align:center;
    font-size:25px;
    font-weight:700;
    margin-bottom:18px;
}

.code-info{
    text-align:center;
    color:#aaa;
    font-size:17px;
    line-height:1.5;
    margin-bottom:25px;
}

.code-input{
    width:100%;
    height:75px;
    border:2px solid #686868;
    border-radius:10px;
    background:#111;
    color:#fff;
    text-align:center;
    letter-spacing:8px;
    font-size:27px;
    outline:none;
}

.verify-btn{
    width:100%;
    height:70px;
    margin-top:20px;
    border:0;
    border-radius:35px;
    background:#64b5ed;
    color:#30206f;
    font-size:22px;
    font-weight:700;
    cursor:pointer;
}

/* MASAÜSTÜNDE DAHA BÜYÜK GÖRÜNÜM */
@media(min-width:900px){

    .topbar{
        height:72px;
        padding-left:38px;
    }

    .content{
        width:365px;
        margin-top:105px;
    }
}

/* TELEFON */
@media(max-width:600px){

    .topbar{
        height:90px;
        padding-left:38px;
    }

    .back{
        width:45px;
        height:45px;
        font-size:48px;
    }

    .top-title{
        margin-left:17px;
        font-size:28px;
    }

    .content{
        width:calc(100% - 120px);
        max-width:none;
        margin-top:105px;
    }

    .title{
        font-size:58px;
        margin-bottom:38px;
    }

    .description{
        font-size:27px;
        line-height:1.55;
        margin-bottom:72px;
    }

    .phone-input{
        height:118px;
        padding:0 34px;
        font-size:26px;
        border-radius:10px;
    }

    .continue-btn{
        height:84px;
        margin-top:35px;
        font-size:27px;
        border-radius:45px;
    }

    .other-method{
        margin-top:45px;
        font-size:25px;
        line-height:1.35;
    }

    .message{
        font-size:18px;
    }
}

/* ÇOK DAR TELEFONLAR */
@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        margin-top:65px;
    }

    .topbar{
        padding-left:20px;
    }

    .title{
        font-size:42px;
    }

    .description{
        font-size:21px;
    }

    .phone-input{
        height:68px;
        font-size:18px;
    }

    .continue-btn{
        height:58px;
        font-size:20px;
    }

    .other-method{
        font-size:19px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="topbar">
        <div class="back" id="backBtn">‹</div>
        <div class="top-title">Şifremi unuttum</div>
    </div>

    <main class="content">

        <h1 class="title">Profilini bul</h1>

        <p class="description">
            Hesabını bulmak için cep telefonu numaranı gir.
        </p>

        <input
            id="phone"
            class="phone-input"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="Cep telefonu numarası"
        >

        <button
            id="continueBtn"
            class="continue-btn"
            type="button">
            Devam
        </button>

        <a
            href="sifremi-unuttum.html"
            class="other-method">
            E-posta adresi veya kullanıcı adıyla bul
        </a>

        <div id="message" class="message"></div>

        <div id="codeBox" class="code-box">

            <div class="code-title">
                Doğrulama kodu
            </div>

            <div id="codeInfo" class="code-info">
                Doğrulama kodu e-posta adresine gönderildi.
            </div>

            <input
                id="code"
                class="code-input"
                type="text"
                inputmode="numeric"
                maxlength="6"
                autocomplete="one-time-code"
                placeholder="••••••"
            >

            <button
                id="verifyBtn"
                class="verify-btn"
                type="button">
                Kodu doğrula
            </button>

        </div>

    </main>

</div>


<script>
const phoneInput = document.getElementById("phone");
const continueBtn = document.getElementById("continueBtn");
const otherMethod = document.querySelector(".other-method");
const message = document.getElementById("message");

const codeBox = document.getElementById("codeBox");
const codeInput = document.getElementById("code");
const verifyBtn = document.getElementById("verifyBtn");
const codeInfo = document.getElementById("codeInfo");

let currentPhone = "";


/* GERİ */
document.getElementById("backBtn").addEventListener("click", function(){
    window.location.href = "giris.html";
});


/* TELEFON NUMARASINI NORMALLEŞTİR */
function normalizePhone(value){

    let digits = String(value || "").replace(/\D/g, "");

    /*
       Türkiye numarası:
       05xxxxxxxxx
       5xxxxxxxxx
       +905xxxxxxxxx
    */

    if(digits.startsWith("0090")){
        digits = digits.slice(4);
    }

    if(digits.startsWith("90") && digits.length >= 12){
        digits = digits.slice(2);
    }

    if(digits.startsWith("0") && digits.length === 11){
        digits = digits.slice(1);
    }

    return digits;
}


/* MESAJ */
function showMessage(text, success=false){

    message.textContent = text;

    if(success){
        message.classList.add("success");
    }else{
        message.classList.remove("success");
    }
}


/* DEVAM */
continueBtn.addEventListener("click", async function(){

    const rawPhone = phoneInput.value.trim();
    const phone = normalizePhone(rawPhone);

    showMessage("");

    if(!phone){
        showMessage("Lütfen cep telefonu numaranı gir.");
        phoneInput.focus();
        return;
    }

    if(phone.length !== 10){
        showMessage("Geçerli bir cep telefonu numarası gir.");
        phoneInput.focus();
        return;
    }

    continueBtn.disabled = true;
    continueBtn.textContent = "Kontrol ediliyor...";

    try{

        /*
          Mevcut server.js içindeki:
          POST /api/forgot/start

          endpoint'ine bağlanıyoruz.
        */

        const response = await fetch("/api/forgot/start", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                identifier: phone,
                mode:"phone"
            })
        });

        const data = await response.json().catch(() => ({}));

        if(!response.ok){

            showMessage(
                data.error || "Bu telefon numarasıyla eşleşen hesap bulunamadı."
            );

            continueBtn.disabled = false;
            continueBtn.textContent = "Devam";
            return;
        }

        currentPhone = phone;

        /*
          Sunucu e-postayı gizleyerek döndürüyor.
        */

        if(data.maskedEmail){

            codeInfo.textContent =
                data.maskedEmail +
                " adresine doğrulama kodu gönderildi.";
        }else{

            codeInfo.textContent =
                "Doğrulama kodu hesabının e-posta adresine gönderildi.";
        }

        showMessage(
            "Doğrulama kodu gönderildi.",
            true
        );

        codeBox.style.display = "block";

        phoneInput.disabled = true;
        continueBtn.style.display = "none";
        otherMethod.style.display = "none";

        codeInput.focus();

    }catch(error){

        console.error(error);

        showMessage(
            "Sunucuya bağlanılamadı. Lütfen tekrar dene."
        );

        continueBtn.disabled = false;
        continueBtn.textContent = "Devam";
    }

});


/* SADECE RAKAM */
codeInput.addEventListener("input", function(){

    this.value = this.value
        .replace(/\D/g, "")
        .slice(0,6);

});


/* KOD DOĞRULAMA */
verifyBtn.addEventListener("click", async function(){

    const code = codeInput.value.trim();

    showMessage("");

    if(code.length !== 6){

        showMessage("6 haneli doğrulama kodunu gir.");

        codeInput.focus();

        return;
    }

    verifyBtn.disabled = true;
    verifyBtn.textContent = "Kontrol ediliyor...";

    try{

        const response = await fetch("/api/forgot/verify", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                identifier: currentPhone,
                mode:"phone",
                code: code
            })
        });

        const data = await response.json().catch(() => ({}));

        if(!response.ok){

            showMessage(
                data.error || "Kod yanlış veya süresi dolmuş."
            );

            verifyBtn.disabled = false;
            verifyBtn.textContent = "Kodu doğrula";

            return;
        }

        showMessage(
            "Kod doğrulandı. Şifre sıfırlama bağlantısı hazırlanıyor...",
            true
        );

        /*
          Doğrulama başarılı olduktan sonra
          server'a reset e-postası gönderiyoruz.
        */

        const resetResponse = await fetch("/api/forgot/send-reset", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                email:data.email
            })
        });

        const resetData = await resetResponse.json().catch(() => ({}));

        if(!resetResponse.ok){

            showMessage(
                resetData.error ||
                "Şifre sıfırlama bağlantısı gönderilemedi."
            );

            verifyBtn.disabled = false;
            verifyBtn.textContent = "Kodu doğrula";

            return;
        }

        showMessage(
            "Şifre sıfırlama bağlantısı e-posta adresine gönderildi.",
            true
        );

        codeInput.disabled = true;
        verifyBtn.disabled = true;
        verifyBtn.textContent = "Gönderildi";

    }catch(error){

        console.error(error);

        showMessage(
            "Sunucuya bağlanılamadı. Lütfen tekrar dene."
        );

        verifyBtn.disabled = false;
        verifyBtn.textContent = "Kodu doğrula";
    }

});


/* ENTER İLE DEVAM */
phoneInput.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        continueBtn.click();
    }

});


/* ENTER İLE KOD DOĞRULA */
codeInput.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        verifyBtn.click();
    }

});
</script>

</body>
</html>
