<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Minegram - Şifremi Unuttum</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

/* ÜST BAR */
.topbar{
    width:100%;
    height:76px;
    display:flex;
    align-items:center;
    padding:0 42px;
}

.back{
    border:0;
    background:transparent;
    color:#fff;
    font-size:48px;
    line-height:1;
    padding:0;
    margin:0 24px 0 0;
    cursor:pointer;
}

.top-title{
    font-size:30px;
    font-weight:700;
    color:#fff;
}

/* ANA ALAN */
.content{
    width:100%;
    max-width:760px;
    margin:0 auto;
    padding:95px 34px 80px;
}

/* BAŞLIK */
.title{
    margin:0 0 34px;
    text-align:center;
    font-size:56px;
    line-height:1.15;
    font-weight:800;
    color:#fff;
}

/* AÇIKLAMA */
.description{
    margin:0 auto 68px;
    width:100%;
    max-width:680px;
    font-size:29px;
    line-height:1.55;
    color:#bdbdbd;
}

/* FORM */
.form{
    width:100%;
}

/* INPUT */
.input{
    width:100%;
    height:92px;
    border:2px solid #666;
    border-radius:9px;
    background:#111;
    color:#fff;
    outline:none;
    padding:0 32px;
    font-size:27px;
}

.input::placeholder{
    color:#bdbdbd;
}

.input:focus{
    border-color:#888;
}

/* DEVAM */
.continue{
    width:100%;
    height:92px;
    margin-top:36px;
    border:0;
    border-radius:48px;
    background:#65b3ed;
    color:#25206d;
    font-size:29px;
    font-weight:700;
    cursor:pointer;
}

.continue:active{
    transform:scale(.99);
}

/* ALT LİNKLER */
.link{
    display:block;
    width:100%;
    border:0;
    background:transparent;
    text-align:center;
    color:#65b3ed;
    font-size:27px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
}

.phone-link{
    margin-top:45px;
}

.login-link{
    margin-top:66px;
}

/* MESAJ */
.message{
    display:none;
    margin-top:25px;
    padding:16px 18px;
    border-radius:12px;
    text-align:center;
    font-size:18px;
    line-height:1.4;
    background:#171717;
    color:#ddd;
}

.message.show{
    display:block;
}

/* YÜKLENİYOR */
.continue.loading{
    opacity:.65;
    pointer-events:none;
}

/* TELEFON */
@media(max-width:700px){

    .topbar{
        height:72px;
        padding:0 22px;
    }

    .back{
        font-size:43px;
        margin-right:18px;
    }

    .top-title{
        font-size:26px;
    }

    .content{
        max-width:none;
        padding:72px 30px 60px;
    }

    .title{
        font-size:43px;
        margin-bottom:28px;
    }

    .description{
        font-size:23px;
        line-height:1.55;
        margin-bottom:56px;
    }

    .input{
        height:76px;
        padding:0 24px;
        font-size:21px;
    }

    .continue{
        height:76px;
        margin-top:30px;
        font-size:24px;
    }

    .link{
        font-size:22px;
    }

    .phone-link{
        margin-top:38px;
    }

    .login-link{
        margin-top:54px;
    }
}

/* DAHA KÜÇÜK TELEFONLAR */
@media(max-width:430px){

    .topbar{
        height:64px;
        padding:0 16px;
    }

    .back{
        font-size:38px;
        margin-right:14px;
    }

    .top-title{
        font-size:22px;
    }

    .content{
        padding:60px 22px 50px;
    }

    .title{
        font-size:36px;
    }

    .description{
        font-size:20px;
        margin-bottom:42px;
    }

    .input{
        height:66px;
        font-size:18px;
        padding:0 18px;
    }

    .continue{
        height:66px;
        font-size:21px;
        margin-top:24px;
    }

    .link{
        font-size:19px;
    }

    .phone-link{
        margin-top:32px;
    }

    .login-link{
        margin-top:45px;
    }
}

/* BÜYÜK EKRAN / TARAYICI */
@media(min-width:701px){

    .page{
        min-height:100vh;
    }

    .content{
        padding-top:95px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- ÜST BAR -->
    <header class="topbar">

        <button
            class="back"
            type="button"
            onclick="goBack()"
            aria-label="Geri">
            ‹
        </button>

        <div class="top-title">
            Şifremi unuttum
        </div>

    </header>


    <!-- ANA İÇERİK -->
    <main class="content">

        <h1 class="title">
            Profilini bul
        </h1>

        <p class="description">
            Hesabını bulmak için e-posta adresini veya
            kullanıcı adını gir.
        </p>


        <form class="form" id="forgotForm">

            <input
                id="accountInput"
                class="input"
                type="text"
                autocomplete="username"
                placeholder="E-posta adresi veya kullanıcı adı"
                required
            >

            <button
                id="continueBtn"
                class="continue"
                type="submit">
                Devam
            </button>

        </form>


        <button
            class="link phone-link"
            type="button"
            onclick="findWithPhone()">
            Cep telefonu numarasıyla bul
        </button>


        <button
            class="link login-link"
            type="button"
            onclick="goLogin()">
            Giriş ekranına dön
        </button>


        <div
            id="message"
            class="message">
        </div>

    </main>

</div>


<script>

const API = '/api';


/* GİRİŞ EKRANINA DÖN */
function goLogin(){

    window.location.href = 'giris.html';

}


/* GERİ */
function goBack(){

    if(document.referrer){

        window.history.back();

    }else{

        window.location.href = 'giris.html';

    }

}


/* TELEFONLA BUL */
function findWithPhone(){

    showMessage(
        'Telefon numarasıyla hesap bulma yakında kullanılabilir.',
        false
    );

}


/* MESAJ */
function showMessage(text,error=true){

    const box = document.getElementById('message');

    box.textContent = text;

    box.style.color = error
        ? '#ff7777'
        : '#ddd';

    box.classList.add('show');

}


/* FORM */
document
.getElementById('forgotForm')
.addEventListener('submit', async function(event){

    event.preventDefault();


    const input =
        document.getElementById('accountInput');

    const button =
        document.getElementById('continueBtn');

    const value =
        input.value.trim();


    if(!value){

        showMessage(
            'Lütfen e-posta adresinizi veya kullanıcı adınızı girin.'
        );

        input.focus();

        return;

    }


    button.classList.add('loading');

    button.textContent = 'Bekleyin...';


    try{

        /*
         * Minegram backend destekliyorsa
         * şifre sıfırlama isteği gönderilir.
         */

        const response = await fetch(
            API + '/forgot-password',
            {
                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({
                    email:value,
                    username:value,
                    identifier:value
                })
            }
        );


        const data =
            await response.json().catch(
                ()=>({})
            );


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                'Hesap bulunamadı veya işlem gerçekleştirilemedi.'
            );

        }


        showMessage(
            data.message ||
            'Şifre sıfırlama bağlantısı gönderildi.',
            false
        );


    }catch(error){

        console.error(
            '[FORGOT PASSWORD]',
            error
        );


        /*
         * Backend endpoint henüz yoksa
         * kullanıcıya hata gösterilir.
         */

        showMessage(
            error.message ||
            'Bir hata oluştu. Lütfen tekrar deneyin.'
        );

    }finally{

        button.classList.remove('loading');

        button.textContent = 'Devam';

    }

});


/* ENTER İLE GÖNDER */
document
.getElementById('accountInput')
.addEventListener(
    'keydown',
    function(event){

        if(event.key === 'Enter'){

            event.preventDefault();

            document
            .getElementById('forgotForm')
            .requestSubmit();

        }

    }
);

</script>

</body>
</html>
