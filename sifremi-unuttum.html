<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Şifremi unuttum - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

.topbar{
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:25px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:34px;
    font-weight:300;
    line-height:1;
    cursor:pointer;
    user-select:none;
}

.top-title{
    margin-left:15px;
    font-size:20px;
    font-weight:700;
    color:#fff;
}

.content{
    width:317px;
    margin:115px auto 0;
}

.title{
    text-align:center;
    font-size:30px;
    line-height:1.15;
    font-weight:700;
    margin:0 0 34px;
    color:#fff;
}

.description{
    font-size:18px;
    line-height:1.45;
    color:#bdbdbd;
    margin:0 0 65px;
}

.input,
.phone-input{
    display:block;
    width:100%;
    height:39px;
    padding:0 10px;
    border:1px solid #252525;
    border-radius:6px;
    background:#050505;
    color:#fff;
    outline:none;
    font-size:12px;
    font-family:Arial,Helvetica,sans-serif;
}

.input::placeholder,
.phone-input::placeholder{
    color:#777;
    opacity:1;
}

.input:focus,
.phone-input:focus{
    border-color:#555;
}

.continue-btn{
    display:block;
    width:100%;
    height:37px;
    margin-top:8px;
    border:0;
    border-radius:22px;
    background:#2677b5;
    color:#000;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.continue-btn:active{
    transform:scale(.99);
}

.continue-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.other-method{
    display:block;
    width:100%;
    margin-top:12px;
    text-align:center;
    color:#008cff;
    font-size:12px;
    font-weight:400;
    text-decoration:none;
    cursor:pointer;
    line-height:1.4;
}

.other-method:hover{
    text-decoration:underline;
}

.phone-screen{
    display:none;
}

.message{
    min-height:18px;
    margin-top:12px;
    text-align:center;
    font-size:11px;
    line-height:1.4;
    color:#ff5c5c;
}

.message.success{
    color:#55b8ff;
}

@media(max-width:600px){

    .topbar{
        height:70px;
        padding-left:28px;
    }

    .back{
        width:30px;
        height:38px;
        font-size:38px;
    }

    .top-title{
        margin-left:12px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 120px);
        max-width:714px;
        margin:105px auto 0;
    }

    .title{
        font-size:42px;
        margin-bottom:30px;
    }

    .description{
        font-size:21px;
        line-height:1.5;
        margin-bottom:55px;
    }

    .input,
    .phone-input{
        height:68px;
        padding:0 20px;
        font-size:18px;
        border:2px solid #686868;
        border-radius:9px;
    }

    .continue-btn{
        height:58px;
        margin-top:18px;
        font-size:20px;
        border-radius:32px;
    }

    .other-method{
        margin-top:25px;
        font-size:18px;
        font-weight:700;
        color:#62b5f5;
    }

    .message{
        font-size:14px;
    }
}

@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        margin-top:65px;
    }

    .title{
        font-size:38px;
    }

    .description{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="page">

<div class="topbar">

    <div
        class="back"
        onclick="goBack()"
        aria-label="Geri"
    >‹</div>

    <div class="top-title">
        Şifremi unuttum
    </div>

</div>


<!-- =========================================
     E-POSTA / KULLANICI ADI
========================================= -->

<main
    class="content"
    id="emailScreen"
>

    <h1 class="title">
        Profilini bul
    </h1>

    <p class="description">
        Hesabını bulmak için e-posta adresini veya kullanıcı adını gir.
    </p>

    <input
        type="text"
        id="emailUsername"
        class="input"
        placeholder="E-posta adresi veya kullanıcı adı"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
    >

    <button
        type="button"
        id="emailContinue"
        class="continue-btn"
    >
        Devam
    </button>

    <div
        id="emailMessage"
        class="message"
    ></div>

    <a
        href="javascript:void(0)"
        class="other-method"
        id="phoneMethod"
    >
        Cep telefonu numarasıyla bul
    </a>

    <a
        href="./giris.html"
        class="other-method"
        style="margin-top:25px;"
    >
        Giriş ekranına dön
    </a>

</main>


<!-- =========================================
     TELEFON
========================================= -->

<main
    class="content phone-screen"
    id="phoneScreen"
>

    <h1 class="title">
        Profilini bul
    </h1>

    <p class="description">
        Hesabını bulmak için cep telefonu numaranı gir.
    </p>

    <input
        type="tel"
        id="phoneNumber"
        class="phone-input"
        placeholder="Cep telefonu numarası"
        autocomplete="tel"
    >

    <button
        type="button"
        id="phoneContinue"
        class="continue-btn"
    >
        Devam
    </button>

    <div
        id="phoneMessage"
        class="message"
    ></div>

    <a
        href="javascript:void(0)"
        class="other-method"
        id="emailMethod"
    >
        E-posta adresi veya kullanıcı adıyla bul
    </a>

</main>

</div>


<script>
"use strict";

/* =========================================
   API
========================================= */

const API = "/api";

/*
 * DOĞRULAMA SAYFASININ ADRESİ
 *
 * Aynı klasörde olması gerekiyor.
 */
const VERIFICATION_PAGE =
    new URL(
        "./sifremi-unuttum-dogrulama.html",
        window.location.href
    ).href;


/* =========================================
   ELEMENTLER
========================================= */

const emailScreen =
    document.getElementById("emailScreen");

const phoneScreen =
    document.getElementById("phoneScreen");

const emailUsername =
    document.getElementById("emailUsername");

const phoneNumber =
    document.getElementById("phoneNumber");

const emailContinue =
    document.getElementById("emailContinue");

const phoneContinue =
    document.getElementById("phoneContinue");

const phoneMethod =
    document.getElementById("phoneMethod");

const emailMethod =
    document.getElementById("emailMethod");


/* =========================================
   MESAJ
========================================= */

function showMessage(id,text,type){

    const el =
        document.getElementById(id);

    if(!el){
        return;
    }

    el.textContent =
        String(text || "");

    el.className =
        "message" +
        (
            type === "success"
                ? " success"
                : ""
        );
}


function clearMessage(id){

    showMessage(
        id,
        "",
        ""
    );
}


/* =========================================
   GİRİŞ EKRANINA GİT
========================================= */

function goLogin(){

    window.location.href =
        "./giris.html";
}


/* =========================================
   DOĞRULAMA SAYFASINA GİT
========================================= */

function goVerification(
    identifier,
    mode,
    email
){

    /*
     * Bilgileri geçici olarak sakla.
     * Böylece URL'de sorun olsa bile
     * doğrulama sayfası bilgileri bulabilir.
     */

    try{

        sessionStorage.setItem(
            "minegram_recovery_identifier",
            String(identifier || "")
        );

        sessionStorage.setItem(
            "minegram_recovery_mode",
            String(mode || "")
        );

        sessionStorage.setItem(
            "minegram_recovery_email",
            String(email || "")
        );

        sessionStorage.setItem(
            "minegram_recovery_started",
            "1"
        );

    }catch(error){

        console.warn(
            "sessionStorage kullanılamadı:",
            error
        );

    }


    /*
     * URL oluştur
     */

    const url =
        new URL(
            VERIFICATION_PAGE
        );

    url.searchParams.set(
        "identifier",
        String(identifier || "")
    );

    url.searchParams.set(
        "mode",
        String(mode || "")
    );

    if(email){

        url.searchParams.set(
            "email",
            String(email)
        );

    }


    console.log(
        "[MINEGRAM] DOĞRULAMA SAYFASINA GİDİLİYOR:",
        url.href
    );


    /*
     * BEKLEME YOK.
     * Direkt yönlendir.
     */

    window.location.href =
        url.href;
}


/* =========================================
   GERİ
========================================= */

function goBack(){

    if(
        phoneScreen &&
        phoneScreen.style.display === "block"
    ){

        showEmailScreen();

        return;
    }

    goLogin();
}


/* =========================================
   E-POSTA EKRANI
========================================= */

function showEmailScreen(){

    if(!emailScreen || !phoneScreen){
        return;
    }

    phoneScreen.style.display =
        "none";

    emailScreen.style.display =
        "block";

    clearMessage(
        "phoneMessage"
    );

    setTimeout(function(){

        if(emailUsername){
            emailUsername.focus();
        }

    },100);
}


/* =========================================
   TELEFON EKRANI
========================================= */

function showPhoneScreen(){

    if(!emailScreen || !phoneScreen){
        return;
    }

    emailScreen.style.display =
        "none";

    phoneScreen.style.display =
        "block";

    clearMessage(
        "emailMessage"
    );

    setTimeout(function(){

        if(phoneNumber){
            phoneNumber.focus();
        }

    },100);
}


/* =========================================
   JSON CEVABI
========================================= */

async function readResponse(response){

    const raw =
        await response.text();

    let data = {};

    try{

        data =
            raw
                ? JSON.parse(raw)
                : {};

    }catch{

        data = {
            error:
                raw ||
                "Sunucudan geçersiz cevap geldi."
        };

    }

    console.log(
        "[MINEGRAM API]",
        response.status,
        data
    );

    return data;
}


/* =========================================
   E-POSTA / KULLANICI ADI
========================================= */

async function continueEmail(){

    const value =
        String(
            emailUsername?.value || ""
        )
        .trim()
        .replace(/^@/,"");

    clearMessage(
        "emailMessage"
    );

    if(!value){

        showMessage(
            "emailMessage",
            "Lütfen e-posta adresini veya kullanıcı adını gir.",
            "error"
        );

        emailUsername?.focus();

        return;
    }


    emailContinue.disabled =
        true;

    emailContinue.textContent =
        "Kontrol ediliyor...";


    try{

        const response =
            await fetch(
                API + "/forgot/start",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({

                        identifier:value,

                        /*
                         * E-posta VE kullanıcı adı
                         * destekleniyor.
                         */
                        mode:
                            value.includes("@")
                                ? "email"
                                : "username"

                    }),

                    cache:"no-store",

                    credentials:"same-origin"
                }
            );


        const data =
            await readResponse(
                response
            );


        if(
            !response.ok ||
            data.ok !== true
        ){

            throw new Error(
                data.error ||
                "Bu bilgilerle eşleşen hesap bulunamadı."
            );
        }


        /*
         * BAŞARILI
         */

        const targetEmail =
            String(
                data.email ||
                ""
            ).trim();


        showMessage(
            "emailMessage",
            "Doğrulama kodu gönderildi. Yönlendiriliyorsun...",
            "success"
        );


        /*
         * ARTIK BEKLEME YOK.
         * Direkt doğrulama sayfasına git.
         */

        goVerification(
            value,
            value.includes("@")
                ? "email"
                : "username",
            targetEmail
        );


    }catch(error){

        console.error(
            "[MINEGRAM FORGOT EMAIL ERROR]",
            error
        );

        showMessage(
            "emailMessage",
            error?.message ||
            "Bir hata oluştu. Lütfen tekrar dene.",
            "error"
        );


        emailContinue.disabled =
            false;

        emailContinue.textContent =
            "Devam";

        return;
    }

}


/* =========================================
   TELEFON
========================================= */

async function continuePhone(){

    const value =
        String(
            phoneNumber?.value || ""
        ).trim();

    clearMessage(
        "phoneMessage"
    );

    if(!value){

        showMessage(
            "phoneMessage",
            "Lütfen cep telefonu numaranı gir.",
            "error"
        );

        phoneNumber?.focus();

        return;
    }


    phoneContinue.disabled =
        true;

    phoneContinue.textContent =
        "Kontrol ediliyor...";


    try{

        const response =
            await fetch(
                API + "/forgot/start",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({

                        identifier:value,

                        mode:"phone"

                    }),

                    cache:"no-store",

                    credentials:"same-origin"
                }
            );


        const data =
            await readResponse(
                response
            );


        if(
            !response.ok ||
            data.ok !== true
        ){

            throw new Error(
                data.error ||
                "Bu telefon numarasıyla eşleşen hesap bulunamadı."
            );
        }


        const targetEmail =
            String(
                data.email ||
                ""
            ).trim();


        showMessage(
            "phoneMessage",
            "Doğrulama kodu gönderildi. Yönlendiriliyorsun...",
            "success"
        );


        /*
         * DİREKT DOĞRULAMA SAYFASI
         */

        goVerification(
            value,
            "phone",
            targetEmail
        );


    }catch(error){

        console.error(
            "[MINEGRAM FORGOT PHONE ERROR]",
            error
        );

        showMessage(
            "phoneMessage",
            error?.message ||
            "Bir hata oluştu. Lütfen tekrar dene.",
            "error"
        );


        phoneContinue.disabled =
            false;

        phoneContinue.textContent =
            "Devam";

        return;
    }

}


/* =========================================
   EVENTLER
========================================= */

emailContinue.addEventListener(
    "click",
    continueEmail
);

phoneContinue.addEventListener(
    "click",
    continuePhone
);


phoneMethod.addEventListener(
    "click",
    function(){

        showPhoneScreen();

    }
);


emailMethod.addEventListener(
    "click",
    function(){

        showEmailScreen();

    }
);


emailUsername.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            continueEmail();

        }

    }
);


phoneNumber.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            continuePhone();

        }

    }
);


/* =========================================
   BAŞLANGIÇ
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        showEmailScreen();

        console.log(
            "[MINEGRAM] Şifre sıfırlama sistemi hazır."
        );

        console.log(
            "[MINEGRAM] Doğrulama sayfası:",
            VERIFICATION_PAGE
        );

    }
);

</script>

</body>
</html>
