<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minegram - Ana Sayfa</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
    background:#000;
    color:#f5f5f5;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
    padding-bottom:76px;
}

button,input,select{
    font:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.app{
    min-height:100vh;
    background:#000;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    height:70px;
    border-bottom:1px solid #202020;
    display:flex;
    align-items:center;
    padding:0 22px;
    position:sticky;
    top:0;
    background:#000;
    z-index:50;
}

.logo{
    font-size:22px;
    font-weight:700;
}

.top-actions{
    margin-left:auto;
    display:flex;
    gap:6px;
}

.icon-btn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:#eee;
    display:grid;
    place-items:center;
    cursor:pointer;
}

.svg{
    width:23px;
    height:23px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =========================
   STORIES
========================= */

.stories{
    height:92px;
    border-bottom:1px solid #202020;
    display:flex;
    align-items:center;
    padding:12px 20px;
    overflow:hidden;
}

.story{
    width:68px;
    text-align:center;
    font-size:10px;
    color:#aaa;
    flex:none;
}

.avatar{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#3f91cc;
    display:grid;
    place-items:center;
    font-size:21px;
    color:#eee;
    margin:auto;
    position:relative;
    overflow:hidden;
    flex:none;
}

.avatar.small{
    width:40px;
    height:40px;
    font-size:15px;
    margin:0;
}

.plus{
    position:absolute;
    right:-2px;
    bottom:-2px;
    width:19px;
    height:19px;
    border-radius:50%;
    background:#eee;
    color:#111;
    display:grid;
    place-items:center;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   FEED
========================= */

.feed{
    width:min(680px,100%);
    margin:0 auto;
}

.post{
    width:100%;
    border:1px solid #171717;
    border-radius:2px;
    background:#000;
    margin:15px 0 18px;
    overflow:hidden;
}

.post-head{
    min-height:66px;
    display:flex;
    align-items:center;
    padding:0 14px;
    gap:10px;
    border-bottom:1px solid #161616;
}

.username{
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.more{
    margin-left:auto;
    font-size:23px;
    line-height:1;
    color:#eee;
}

.media-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    background:#080808;
    position:relative;
    overflow:hidden;
}

.post-media{
    display:block;
    width:100%;
    max-height:610px;
    object-fit:contain;
    background:#080808;
    cursor:pointer;
}

video.post-media{
    outline:none;
}

.heart-pop{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.55);
    font-size:92px;
    color:#ff1744;
    opacity:0;
    pointer-events:none;
    text-shadow:0 3px 18px #000;
    transition:.18s;
    z-index:5;
}

.heart-pop.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

/* =========================
   ACTIONS
========================= */

.actions{
    min-height:50px;
    display:flex;
    align-items:center;
    padding:0 12px;
    gap:6px;
}

.action{
    height:42px;
    min-width:42px;
    border:0;
    background:transparent;
    color:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    padding:0 5px;
    cursor:pointer;
    font-size:14px;
}

.action .svg{
    width:25px;
    height:25px;
}

.action.like{
    color:#eee;
    transition:transform .12s,color .15s;
}

.action.like.liked{
    color:#ed1b3a;
}

.action.like.liked .svg{
    fill:currentColor;
}

.action.like:not(.liked) .svg{

}

.action.like:active{
    transform:scale(.85);
}

.share-action{
    margin-left:auto;
}

.share-plane{

    height:23px;
    display:block;
    fill:currentColor;
}

.likes{
    font-size:14px;
    font-weight:700;
    padding:0 14px;
    margin-top:-2px;
}

.caption{
    font-size:14px;
    line-height:1.45;
    padding:7px 14px 14px;
    overflow-wrap:anywhere;
}

.caption b{

}

.comments-preview{

    color:#999;
    font-size:13px;

}

.comments-preview div{

}

.empty{

}

.empty strong{

}

.empty small{

/* =========================

.nav{

.nav a.active .nav-icon{

.nav .svg{

/* =========================

<script>

'use strict';


/* =====================================================
   AYARLAR
===================================================== */

const API = '/api';

let token = null;
let currentUser = null;

let currentCommentPost = null;
let currentMenuPost = null;

let currentCommentSort = 'forYou';
let replyingTo = null;

let feedLoading = false;

const feedEl =
    document.getElementById('feed');


/* =====================================================
   GÜVENLİ METİN
===================================================== */

function esc(value = ''){

    return String(value).replace(
        /[&<>"']/g,
        function(m){

            return {
                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                '"':'&quot;',
                "'":'&#039;'
            }[m];

        }
    );

}


/* =====================================================
   TOKEN
   SADECE SENİN /api/login SİSTEMİN
===================================================== */

function getApiToken(){

    return (
        localStorage.getItem(
            'minegram_token'
        ) ||
        localStorage.getItem(
            'minegram_supabase_token'
        ) ||
        null
    );

}


/* =====================================================
   API
===================================================== */

async function api(path,opt = {}){

    const apiToken =
        getApiToken();

    token =
        apiToken;


    if(!apiToken){

        const error =
            new Error(
                'Oturum bulunamadı.'
            );

        error.status = 401;

        throw error;

    }


    const headers = {
        ...(opt.headers || {}),
        Authorization:
            'Bearer ' + apiToken
    };


    let response;


    try{

        response =
            await fetch(
                API + path,
                {
                    ...opt,
                    headers
                }
            );

    }catch(error){

        const e =
            new Error(
                'Sunucuya bağlanılamadı.'
            );

        e.network = true;

        throw e;

    }


    let data = {};


    try{

        data =
            await response.json();

    }catch{

        data = {};

    }


    if(
        response.status === 401 ||
        response.status === 403
    ){

        const e =
            new Error(
                data.error ||
                data.message ||
                'Oturum süresi dolmuş.'
            );

        e.status =
            response.status;

        throw e;

    }


    if(!response.ok){

        throw new Error(
            data.error ||
            data.message ||
            'İşlem başarısız.'
        );

    }


    return data;

}


/* =====================================================
   OTURUM TEMİZLE
===================================================== */

function clearAuth(){

    [
        'minegram_token',
        'minegram_supabase_token',
        'minegram_user_id',
        'minegram_username',
        'minegram_email',
        'minegram_user',
        'minegram_profile',
        'minegram_firebase_token',
        'minegram_firebase_uid',
        'minegram_firebase_email'
    ].forEach(
        key =>
            localStorage.removeItem(key)
    );


    token = null;
    currentUser = null;

}


/* =====================================================
   GİRİŞE GÖNDER
===================================================== */

function showLogin(){

    clearAuth();

    window.location.replace(
        'giris.html'
    );

}


/* =====================================================
   ÇIKIŞ
===================================================== */

function logout(){

    clearAuth();

    window.location.replace(
        'giris.html'
    );

}


/* =====================================================
   HOME GÖSTER
===================================================== */

function showHome(){

    const home =
        document.getElementById(
            'home'
        );

    const nav =
        document.getElementById(
            'bottomNav'
        );


    if(home){

        home.classList.remove(
            'hidden'
        );

    }

/* =====================================================
   LOCAL COMMENTS
===================================================== */

function localCommentsKey(id){

    return (
        'minegram_comments_' +
        String(id)
    );

}


function getLocalComments(id){

    try{

        const value =
            JSON.parse(
                localStorage.getItem(
                    localCommentsKey(id)
                ) || '[]'
            );


        return Array.isArray(value)
            ? value
            : [];

    }catch{

        return [];

    }

}


function setLocalComments(id,list){

    try{

        localStorage.setItem(
            localCommentsKey(id),
            JSON.stringify(
                Array.isArray(list)
                    ? list.slice(-100)
                    : []
            )
        );

    }catch{}

}


function saveLocalComment(id,comment){

    const list =
        getLocalComments(id);


    list.push(
        comment
    );


    setLocalComments(
        id,
        list
    );

}


/* =====================================================
   YORUMLARI BİRLEŞTİR
===================================================== */

function mergeComments(server,id){

    const remote =
        Array.isArray(server)
            ? server
            : [];


    const local =
        getLocalComments(id);


    const all = [
        ...remote
    ];


    for(
        const localComment of local
    ){

        const exists =
            all.some(
                remoteComment => {

                    if(
                        localComment.id &&
                        remoteComment.id &&
                        String(
                            localComment.id
                        ) ===
                        String(
                            remoteComment.id
                        )
                    ){

                        return true;

                    }


                    const a =
                        new Date(
                            localComment.createdAt ||
                            localComment.created_at ||
                            0
                        ).getTime();


                    const b =
                        new Date(
                            remoteComment.createdAt ||
                            remoteComment.created_at ||
                            0
                        ).getTime();


                    return (
                        localComment.username ===
                        (
                            remoteComment.username ||
                            remoteComment.user?.username
                        )
                        &&
                        localComment.text ===
                        (
                            remoteComment.text ||
                            remoteComment.content ||
                            ''
                        )
                        &&
                        a &&
                        b &&
                        Math.abs(a - b) < 15000
                    );

                }
            );


        if(!exists){

            all.push(
                localComment
            );

        }

    }


    return all;

}

/* =====================================================
   LIKE
===================================================== */

async function likePost(id){

    const article =
        getPostElement(id);


    if(!article){

        return;

    }


    const button =
        article.querySelector(
            '.action.like'
        );


    const path =
        button?.querySelector(
            'path'
        );


    const likesElement =
        article.querySelector(
            '.likes'
        );


    if(
        !button ||
        button.dataset.loading === '1'
    ){

        return;

    }


    button.dataset.loading = '1';


    const wasLiked =
        button.classList.contains(
            'liked'
        );


    const nextLiked =
        !wasLiked;


    button.classList.toggle(
        'liked',
        nextLiked
    );


    button.dataset.liked =
        nextLiked ? '1' : '0';


    if(path){

        path.setAttribute(
            'fill',
            nextLiked
                ? 'currentColor'
                : 'none'
        );

    }


    if(likesElement){

        const match =
            likesElement.textContent
                .match(/\d+/);


        const oldCount =
            match
                ? Number(match[0])
                : 0;


        likesElement.textContent =
            Math.max(
                0,
                oldCount +
                (nextLiked ? 1 : -1)
            ) +
            ' beğenme';

    }


    try{

        const result =
            await api(
                '/posts/' +
                encodeURIComponent(id) +
                '/like',
                {
                    method:'POST'
                }
            );


        if(
            result &&
            typeof result.likes ===
                'number'
        ){

            likesElement.textContent =
                result.likes +
                ' beğenme';

        }


    }catch(error){

        button.classList.toggle(
            'liked',
            wasLiked
        );


        button.dataset.liked =
            wasLiked
                ? '1'
                : '0';


        if(path){

            path.setAttribute(
                'fill',
                wasLiked
                    ? 'currentColor'
                    : 'none'
            );

        }


        if(likesElement){

            const match =
                likesElement.textContent
                    .match(/\d+/);


            const current =
                match
                    ? Number(match[0])
                    : 0;


            likesElement.textContent =
                Math.max(
                    0,
                    current +
                    (nextLiked ? -1 : 1)
                ) +
                ' beğenme';

        }


        if(
            error.status === 401 ||
            error.status === 403
        ){

            showLogin();

            return;

        }


        toast(
            error.message ||
            'Beğeni işlemi başarısız.'
        );

    }finally{

        button.dataset.loading = '0';

    }

}

/* =====================================================
   SHARE
===================================================== */

async function sharePost(id){

    const url =
        location.origin +
        '/post.html?id=' +
        encodeURIComponent(id);


    try{

        if(navigator.share){

            await navigator.share({
                title:'Minegram gönderisi',
                url:url
            });

        }else if(
            navigator.clipboard
        ){

            await navigator.clipboard
                .writeText(url);


            toast(
                'Gönderi bağlantısı kopyalandı'
            );

        }else{

            const textarea =
                document.createElement(
                    'textarea'
                );


            textarea.value = url;

            textarea.style.position =
                'fixed';

            textarea.style.opacity =
                '0';


            document.body.appendChild(
                textarea
            );


            textarea.select();


            document.execCommand(
                'copy'
            );


            textarea.remove();


            toast(
                'Gönderi bağlantısı kopyalandı'
            );

        }

    }catch(error){

        if(
            error?.name !==
            'AbortError'
        ){

            toast(
                'Paylaşma başarısız.'
            );

        }

    }

}

/* =====================================================
   RELATIVE TIME
===================================================== */

function relativeTime(value){

    if(!value){

        return '';

    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return '';

    }


    const seconds =
        Math.max(
            0,
            Math.floor(
                (
                    Date.now() -
                    date.getTime()
                ) / 1000
            )
        );


    if(seconds < 60){

        return (
            seconds +
            ' saniye önce'
        );

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    if(minutes < 60){

        return (
            minutes +
            ' dakika önce'
        );

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    if(hours < 24){

        return (
            hours +
            ' saat önce'
        );

    }


    const days =
        Math.floor(
            hours / 24
        );


    if(days < 7){

        return (
            days +
            ' gün önce'
        );

    }


    if(days < 365){

        return (
            Math.floor(days / 7) +
            ' hafta önce'
        );

    }


    return date.toLocaleDateString(
        'tr-TR'
    );

}


/* =====================================================
   COMMENT SORT
===================================================== */

function sortComments(list){

    const comments = [
        ...(Array.isArray(list)
            ? list
            : [])
    ];


    if(
        currentCommentSort ===
        'newest'
    ){

        return comments.sort(
            (a,b) =>
                new Date(
                    b.createdAt ||
                    b.created_at ||
                    0
                ) -
                new Date(
                    a.createdAt ||
                    a.created_at ||
                    0
                )
        );

    }


    if(
        currentCommentSort ===
        'popular'
    ){

        return comments.sort(
            (a,b) =>
                Number(
                    b.likes ||
                    b.likeCount ||
                    0
                ) -
                Number(
                    a.likes ||
                    a.likeCount ||
                    0
                )
        );

    }


    return comments.sort(
        (a,b) =>
            new Date(
                a.createdAt ||
                a.created_at ||
                0
            ) -
            new Date(
                b.createdAt ||
                b.created_at ||
                0
            )
    );

}

   LOAD COMMENTS
===================================================== */

async function loadComments(id){

    const listElement =
        document.getElementById(
            'commentList'
        );


    if(!listElement){

        return;

    }


    listElement.innerHTML =
        '<div class="empty">Yorumlar yükleniyor...</div>';


    const local =
        getLocalComments(id);


    if(local.length){

        listElement.innerHTML =
            renderCommentsForPost(
                local
            );

    }


    try{

        const response =
            await api(
                '/posts/' +
                encodeURIComponent(id)
            );


        const remote =
            Array.isArray(
                response?.comments
            )
                ? response.comments
                :
                Array.isArray(
                    response?.post?.comments
                )
                    ? response.post.comments
                    :
                    Array.isArray(
                        response?.data?.comments
                    )
                        ? response.data.comments
                        : [];


        const merged =
            mergeComments(
                remote,
                id
            );


        listElement.innerHTML =
            renderCommentsForPost(
                merged
            );


    }catch(error){

        console.warn(
            '[COMMENTS]',
            error
        );


        if(!local.length){

            listElement.innerHTML =
                '<div class="empty">Yorumlar yüklenemedi.</div>';

        }

    }

}


/* =====================================================
   OPEN COMMENTS
===================================================== */

async function openComments(id){

    currentCommentPost =
        String(id);


    currentCommentSort =

    replyingTo = null;


    const select =
        document.getElementById(
            'commentSort'
        );


    if(select){

        select.value =
            'forYou';

    }


    const input =
        document.getElementById(
            'commentInput'
        );


    if(input){

        input.value = '';

        input.placeholder =
            'Bunun hakkında ne düşünüyorsun?';

    }


    document.getElementById(
        'commentsModal'
    ).classList.add(
        'open'
    );


    await loadComments(
        currentCommentPost
    );

}


/* =====================================================
   CLOSE COMMENTS
===================================================== */

function closeComments(event){

    const modal =
        document.getElementById(
            'commentsModal'
        );


    if(
        !event ||
        event.target === modal
    ){

        modal.classList.remove(
            'open'
        );

        currentCommentPost = null;

        replyingTo = null;

    }

}

/* =====================================================
   EMOJI
===================================================== */

function addEmoji(emoji){

    const input =
        document.getElementById(
            'commentInput'
        );


    if(!input){

        return;

    }


    const start =
        typeof input.selectionStart ===
        'number'
            ? input.selectionStart
            : input.value.length;


    const end =
        typeof input.selectionEnd ===
        'number'
            ? input.selectionEnd
            : input.value.length;


    input.value =
        input.value.slice(0,start) +
        emoji +
        input.value.slice(end);


    input.focus();


    try{

        const position =
            start +
            emoji.length;


        input.setSelectionRange(
            position,
            position
        );

    }catch{}

}


/* =====================================================
   COMMENT LIKE
===================================================== */

async function likeComment(id){

    if(!id){

        return;

    }


    const wrapper =
        Array
            .from(
                document.querySelectorAll(
                    '.comment-wrap'
                )
            )
            .find(
                element =>
                    String(
                        element.dataset.commentId
                    ) ===
                    String(id)
            );


    const button =
        wrapper?.querySelector(
            '.comment-like'
        );


    if(
        !button ||
        button.dataset.loading === '1'
    ){

        return;

    }


    button.dataset.loading =
        '1';


    const wasLiked =
        button.classList.contains(
            'liked'
        );


    const next =
        !wasLiked;


    button.classList.toggle(
        'liked',
        next
    );


    button.textContent =
        next ? '♥' : '♡';


    try{

        await api(
            '/comments/' +
            encodeURIComponent(id) +
            '/like',
            {
                method:'POST'
            }
        );


    }catch(error){

        button.classList.toggle(
            'liked',
            wasLiked
        );


        button.textContent =
            wasLiked
                ? '♥'
                : '♡';


        if(
            error.status === 401 ||
            error.status === 403
        ){

            showLogin();

            return;

        }


        toast(
            error.message ||
            'Yorum beğenilemedi.'
        );

    }finally{

        button.dataset.loading =
            '0';

    }

}


/* =====================================================
   SEND COMMENT
===================================================== */

async function sendComment(){

    const input =
        document.getElementById(
            'commentInput'
        );


    const text =
        input.value.trim();


    if(
        !text ||
        !currentCommentPost
    ){

        return;

    }


    const postId =
        currentCommentPost;


    const replyId =
        replyingTo;


    const sendButton =
        document.querySelector(
            '.comment-compose .send'
        );


    if(sendButton){

        sendButton.disabled =
            true;

    }


    const username =
        currentUser?.username ||
        currentUser?.name ||
        localStorage.getItem(
            'minegram_username'
        ) ||
        'minegram';


    const now =
        new Date().toISOString();


    const temporaryId =
        'local-' +
        Date.now() +
        '-' +
        Math.random()
            .toString(36)
            .slice(2);


    const localComment = {
        id:temporaryId,
        username:username,
        text:text,
        createdAt:now,
        likedByMe:false,
        local:true
    };


    if(!replyId){

        saveLocalComment(
            postId,
            localComment
        );

    }


    input.value = '';

    replyingTo = null;

    input.placeholder =
        'Bunun hakkında ne düşünüyorsun?';


    try{

        let result;


        if(replyId){

            result =
                await api(
                    '/comments/' +
                    encodeURIComponent(
                        replyId
                    ) +
                    '/reply',
                    {
                        method:'POST',
                        headers:{
                            'Content-Type':
                                'application/json'
                        },
                        body:
                            JSON.stringify({
                                text:text
                            })
                    }
                );

        }else{

            result =
                await api(
                    '/posts/' +
                    encodeURIComponent(
                        postId
                    ) +
                    '/comments',
                    {
                        method:'POST',
                        headers:{
                            'Content-Type':
                                'application/json'
                        },
                        body:
                            JSON.stringify({
                                text:text
                            })
                    }
                );

        }


        const returned =
            result?.comment ||
            result?.data ||
            result;


        if(
            returned?.id &&
            !replyId
        ){

            const comments =
                getLocalComments(
                    postId
                );


            const local =
                comments.find(
                    comment =>
                        comment.id ===
                        temporaryId
                );


            if(local){

                local.id =
                    returned.id;

                local.local =
                    false;

                local.username =
                    returned.username ||
                    returned.user?.username ||
                    local.username;

                local.createdAt =
                    returned.createdAt ||
                    returned.created_at ||
                    local.createdAt;

            }


            setLocalComments(
                postId,
                comments
            );

        }


        toast(
            replyId
                ? 'Yanıt gönderildi'
                : 'Yorum gönderildi'
        );


        await loadComments(
            postId
        );


        await loadFeed();


    }catch(error){

        if(!replyId){

            const comments =
                getLocalComments(
                    postId
                ).filter(
                    comment =>
                        comment.id !==
                        temporaryId
                );


            setLocalComments(
                postId,
                comments
            );

        }


        if(
            error.status === 401 ||
            error.status === 403
        ){

            showLogin();

            return;

        }


        toast(
            error.message ||
            'Yorum gönderilemedi.'
        );

    }finally{

        if(sendButton){

            sendButton.disabled =
                false;

        }

    }

}


/* =====================================================
   STORY
===================================================== */

async function uploadStory(event){

    const file =
        event.target.files?.[0];


    if(!file){

        return;

    }


    try{

        const apiToken =
            getApiToken();


        if(!apiToken){

            showLogin();

            return;

        }


        const form =
            new FormData();


        form.append(
            'story',
            file
        );


        const response =
            await fetch(
                '/api/stories',
                {
                    method:'POST',
                    headers:{
                        Authorization:
                            'Bearer ' +
                            apiToken
                    },
                    body:form
                }
            );


        let data = {};


        try{

            data =
                await response.json();

        }catch{}


        if(
            response.status === 401 ||
            response.status === 403
        ){

            showLogin();

            return;

        }


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                'Hikaye yüklenemedi.'
            );

        }


        toast(
            'Hikaye paylaşıldı.'
        );


        event.target.value = '';


    }catch(error){

        toast(
            error.message ||
            'Hikaye yüklenemedi.'
        );

    }

}


document
    .getElementById(
        'storyInput'
    )
    .addEventListener(
        'change',
        uploadStory
    );


document
    .querySelector(
        '.story .plus'
    )
    .addEventListener(
        'click',
        function(event){

            event.stopPropagation();

            document
                .getElementById(
                    'storyInput'
                )
                .click();

        }
    );

document
    .getElementById(

    )
    .addEventListener(
        'keydown',
        function(event){

            if(
                event.key === 'Enter' &&
                !event.shiftKey
            ){

                event.preventDefault();

                sendComment();

            }

        }
    );


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    'keydown',
    function(event){

        if(
            event.key !== 'Escape'
        ){

            return;

        }


        const comments =
            document.getElementById(
                'commentsModal'
            );


        const menu =
            document.getElementById(
                'menuBackdrop'
            );


        if(
            comments.classList.contains(
                'open'
            )
        ){

            closeComments();

        }


        if(
            menu.classList.contains(
                'open'
            )
        ){

            closeMenu();

        }

    }
);


/* =====================================================
   SAYFA BAŞLANGICI
===================================================== */

async function init(){

    console.log(
        '[INDEX] Başlatılıyor...'
    );


    /*
     * BURADA ARTIK FIREBASE YOK.
     * Giriş sayfasının oluşturduğu
     * minegram_token kullanılacak.
     */

    token =
        getApiToken();


    console.log(
        '[INDEX] Token:',
        token
            ? 'VAR'
            : 'YOK'
    );


    /*
     * Token yoksa giriş yapmamıştır.
     */

    if(!token){

        showLogin();

        return;

    }


    /* =================================================
       KAYITLI KULLANICI
    ================================================= */

    try{

        const saved =
            localStorage.getItem(
                'minegram_user'
            );


        if(saved){

            currentUser =
                JSON.parse(saved);

        }

    }catch{

        currentUser = null;

    }


    /*
     * Eğer kullanıcı bilgisi eski giriş
     * sisteminden ayrı ayrı tutulduysa
     * onları da kullan.
     */

    if(!currentUser){

        const username =
            localStorage.getItem(
                'minegram_username'
            );


        const userId =
            localStorage.getItem(
                'minegram_user_id'
            );


        const email =
            localStorage.getItem(
                'minegram_email'
            );


        if(
            username ||
            userId ||
            email
        ){

            currentUser = {
                id:userId || null,
                username:username || null,
                email:email || null
            };

        }

    }


    /* =================================================
       /ME
    ================================================= */

    try{

        const me =
            await api('/me');


        if(me){

            currentUser =
                me;


            localStorage.setItem(
                'minegram_user',
                JSON.stringify(me)
            );


            if(me.username){

                localStorage.setItem(
                    'minegram_username',
                    String(me.username)
                );

            }

        }


    }catch(error){

        console.warn(
            '[INDEX] /me:',
            error
        );


        /*
         * SADECE gerçek yetkisiz token
         * durumunda giriş sayfasına gönder.
         */

        if(
            error.status === 401 ||
            error.status === 403
        ){

            showLogin();

            return;

        }


        /*
         * Ağ/sunucu hatasında
         * kullanıcıyı atma.
         */

    }


    /* =================================================
       ANA SAYFA
    ================================================= */

    showHome();


    /* =================================================
       GÖNDERİLER
    ================================================= */

    await loadFeed();

}


/* =====================================================
   BAŞLAT
===================================================== */

init();

</script>
