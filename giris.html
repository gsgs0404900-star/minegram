<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minegram - Giriş</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.login-page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.login-box{
    width:365px;
    margin-top:145px;
    text-align:center;
}

.logo{
    font-size:27px;
    font-weight:700;
    margin-bottom:29px;
}

.field{
    width:100%;
    height:44px;
    margin-bottom:9px;
    padding:0 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#000;
    color:#fff;
    outline:none;
    font-size:12px;
}

.field::placeholder{
    color:#777;
}

.field:focus{
    border-color:#555;
}

.login-btn{
    width:100%;
    height:42px;
    border:0;
    border-radius:22px;
    background:#2d80bd;
    color:#000;
    font-weight:700;
    cursor:pointer;
    font-size:12px;
}

.login-btn:hover{
    background:#348dca;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.forgot{
    display:block;
    margin-top:14px;
    color:#0095f6;
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
}

.register{
    display:block;
    margin-top:28px;
    color:#0095f6;
    font-size:13px;
    text-decoration:none;
}

.message{
    min-height:20px;
    margin-top:14px;
    font-size:12px;
    color:#ff4d4d;
}

@media(max-width:600px){

    .login-box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:90px;
    }

}
</style>
</head>

<body>

<div class="login-page">

    <div class="login-box">

        <div class="logo">
            Minegram
        </div>

        <input
            id="email"
            class="field"
            type="email"
            autocomplete="email"
            placeholder="E-posta adresi"
        >

        <input
            id="password"
            class="field"
            type="password"
            autocomplete="current-password"
            placeholder="Şifre"
        >

        <button
            id="loginBtn"
            class="login-btn"
            type="button"
        >
            Giriş Yap
        </button>

        <a
            id="forgotBtn"
            class="forgot"
            href="javascript:void(0)"
        >
            Şifremi unuttum
        </a>

        <a
            href="kayit.html"
            class="register"
        >
            Hesabın yok mu? Kayıt ol
        </a>

        <div
            id="message"
            class="message"
        ></div>

    </div>

</div>


<script>

/* =====================================================
   MINEGRAM GİRİŞ
   Firebase YOK
   Supabase backend /api/login kullanılıyor
===================================================== */

const API = "/api";


/* =====================================================
   ELEMENTLER
===================================================== */

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const forgotBtn =
    document.getElementById("forgotBtn");

const message =
    document.getElementById("message");


/* =====================================================
   MESAJ
===================================================== */

function showMessage(
    text,
    success = false
){

    message.textContent = text;

    message.style.color =
        success
            ? "#35c759"
            : "#ff4d4d";
}


/* =====================================================
   TOKEN TEMİZLE
===================================================== */

function clearSession(){

    localStorage.removeItem(
        "minegram_token"
    );

    localStorage.removeItem(
        "minegram_supabase_token"
    );

    localStorage.removeItem(
        "minegram_user_id"
    );

    localStorage.removeItem(
        "minegram_username"
    );

    localStorage.removeItem(
        "minegram_email"
    );

    /*
     * Eski Firebase anahtarlarını da temizliyoruz.
     */

    localStorage.removeItem(
        "minegram_firebase_token"
    );

    localStorage.removeItem(
        "minegram_firebase_uid"
    );

    localStorage.removeItem(
        "minegram_firebase_email"
    );
}


/* =====================================================
   MEVCUT OTURUM KONTROLÜ
===================================================== */

async function checkExistingSession(){

    const token =
        localStorage.getItem(
            "minegram_token"
        ) ||
        localStorage.getItem(
            "minegram_supabase_token"
        );

    if(!token){
        return;
    }

    try{

        const response =
            await fetch(
                API + "/me",
                {
                    method:"GET",
                    headers:{
                        Authorization:
                            "Bearer " + token
                    }
                }
            );

        if(response.ok){

            /*
             * Geçerli oturum zaten var.
             */

            window.location.replace(
                "index.html"
            );

            return;
        }

        /*
         * Token geçersiz.
         */

        clearSession();

    }catch(error){

        console.warn(
            "[SESSION CHECK]",
            error
        );

    }
}


/* =====================================================
   GİRİŞ
===================================================== */

async function login(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    showMessage("");


    /* -------------------------------------------------
       KONTROLLER
    ------------------------------------------------- */

    if(!email){

        showMessage(
            "E-posta adresini gir."
        );

        emailInput.focus();

        return;
    }


    if(!password){

        showMessage(
            "Şifreni gir."
        );

        passwordInput.focus();

        return;
    }


    /* -------------------------------------------------
       BUTONU KİLİTLE
    ------------------------------------------------- */

    loginBtn.disabled = true;

    loginBtn.textContent =
        "Giriş yapılıyor...";


    try{

        /* -------------------------------------------------
           BACKEND LOGIN
        ------------------------------------------------- */

        const response =
            await fetch(
                API + "/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        email:email,
                        password:password
                    })
                }
            );


        const data =
            await response
                .json()
                .catch(() => ({}));


        /* -------------------------------------------------
           HATA
        ------------------------------------------------- */

        if(!response.ok){

            throw new Error(
                data.error ||
                "E-posta veya şifre hatalı."
            );

        }


        /* -------------------------------------------------
           TOKEN KONTROL
        ------------------------------------------------- */

        if(!data.token){

            throw new Error(
                "Oturum tokenı alınamadı."
            );

        }


        /* -------------------------------------------------
           ESKİ OTURUMU TEMİZLE
        ------------------------------------------------- */

        clearSession();


        /* -------------------------------------------------
           SUPABASE TOKEN
        ------------------------------------------------- */

        localStorage.setItem(
            "minegram_token",
            data.token
        );

        localStorage.setItem(
            "minegram_supabase_token",
            data.token
        );


        /* -------------------------------------------------
           KULLANICI BİLGİLERİ
        ------------------------------------------------- */

        const user =
            data.user || {};


        if(user.id){

            localStorage.setItem(
                "minegram_user_id",
                String(user.id)
            );

        }


        if(user.username){

            localStorage.setItem(
                "minegram_username",
                String(user.username)
            );

        }


        if(user.email){

            localStorage.setItem(
                "minegram_email",
                String(user.email)
            );

        }
        

        /* -------------------------------------------------
           BAŞARILI
        ------------------------------------------------- */

        showMessage(
            "Giriş başarılı. Ana sayfaya yönlendiriliyorsun...",
            true
        );


        /*
         * Token localStorage'a yazıldıktan sonra
         * direkt index.html.
         */

        window.location.replace(
            "index.html"
        );


    }catch(error){

        console.error(
            "[MINEGRAM LOGIN]",
            error
        );


        let text =
            "Giriş yapılamadı.";


        const errorText =
            String(
                error.message || ""
            ).toLowerCase();


        if(
            errorText.includes(
                "invalid"
            ) ||
            errorText.includes(
                "credential"
            ) ||
            errorText.includes(
                "password"
            ) ||
            errorText.includes(
                "şifre"
            )
        ){

            text =
                "E-posta veya şifre hatalı.";

        }
        else if(
            errorText.includes(
                "email"
            ) ||
            errorText.includes(
                "e-posta"
            )
        ){

            text =
                "Geçerli bir e-posta adresi gir.";

        }
        else{

            text =
                error.message ||
                "Giriş yapılamadı.";

        }


        showMessage(text);


        loginBtn.disabled =
            false;

        loginBtn.textContent =
            "Giriş Yap";

    }

}


/* =====================================================
   ŞİFREMİ UNUTTUM
===================================================== */

async function forgotPassword(){

    const email =
        emailInput.value.trim();


    if(!email){

        showMessage(
            "Şifre sıfırlamak için önce e-posta adresini gir."
        );

        emailInput.focus();

        return;
    }


    try{

        /*
         * Sunucunun auth-config sistemi üzerinden
         * Supabase şifre sıfırlama akışını kullanıyoruz.
         */

        const configResponse =
            await fetch(
                API + "/auth-config"
            );


        const config =
            await configResponse
                .json()
                .catch(() => ({}));


        if(
            !configResponse.ok ||
            !config.url ||
            !config.key
        ){

            throw new Error(
                "Şifre sıfırlama sistemi kullanılamıyor."
            );

        }


        /*
         * Supabase REST API
         */

        const resetResponse =
            await fetch(
                config.url +
                "/auth/v1/recover",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        apikey:
                            config.key
                    },

                    body:JSON.stringify({
                        email:email
                    })
                }
            );


        if(!resetResponse.ok){

            const resetData =
                await resetResponse
                    .json()
                    .catch(() => ({}));

            throw new Error(
                resetData.msg ||
                resetData.message ||
                "Şifre sıfırlama bağlantısı gönderilemedi."
            );

        }


        showMessage(
            "Şifre sıfırlama bağlantısı e-posta adresine gönderildi.",
            true
        );


    }catch(error){

        console.error(
            "[FORGOT PASSWORD]",
            error
        );


        showMessage(
            error.message ||
            "Şifre sıfırlama bağlantısı gönderilemedi."
        );

    }

}


/* =====================================================
   BUTON
===================================================== */

loginBtn.addEventListener(
    "click",
    login
);


forgotBtn.addEventListener(
    "click",
    forgotPassword
);


/* =====================================================
   ENTER
===================================================== */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            login();

        }

    }
);


emailInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            passwordInput.focus();

        }

    }
);


/* =====================================================
   SAYFA AÇILINCA OTURUM KONTROL
===================================================== */

checkExistingSession();

</script>

</body>
</html>
