<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Minegram - Giriş</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
    background:#000;
    color:#f5f5f5;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.login{
    width:min(420px,calc(100% - 32px));
    margin-top:85px;
}

.login h1{
    text-align:center;
    font-size:30px;
    margin:0 0 34px;
}

.field{
    width:100%;
    height:50px;
    margin-bottom:10px;

    border:1px solid #444;
    border-radius:8px;

    background:#050505;
    color:#fff;

    padding:0 14px;

    outline:none;
}

.field:focus{
    border-color:#3f91cc;
}

.login-btn{
    width:100%;
    height:48px;

    border:0;
    border-radius:24px;

    background:#3f91cc;
    color:#06111a;

    font-weight:700;
    cursor:pointer;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.forgot{
    text-align:center;
    margin-top:16px;
}

.forgot a{
    color:#2ba9ed;
}

.message{
    text-align:center;
    margin-top:16px;
    font-size:13px;
    color:#aaa;
}

</style>
</head>

<body>

<section class="login">

<h1>Minegram</h1>

<input
    id="username"
    class="field"
    placeholder="E-posta adresi"
    type="email"
    autocomplete="username"
>

<input
    id="password"
    class="field"
    type="password"
    placeholder="Şifre"
    autocomplete="current-password"
>

<button
    id="loginBtn"
    class="login-btn"
    type="button"
>
Giriş Yap
</button>

<div class="forgot">

<a
    href="#"
    id="forgotBtn"
>
Şifremi unuttum
</a>

</div>

<div
    id="message"
    class="message"
></div>

</section>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain:
    "mim-ea133.firebaseapp.com",

    databaseURL:
    "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
    "mim-ea133",

    storageBucket:
    "mim-ea133.firebasestorage.app",

    messagingSenderId:
    "303525353436",

    appId:
    "1:303525353436:web:082fc090b5025e19942119",

    measurementId:
    "G-K962QE5P1R"
};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


/* =====================================================
   ELEMENTLER
===================================================== */

const username =
document.getElementById("username");

const password =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const forgotBtn =
document.getElementById("forgotBtn");

const message =
document.getElementById("message");


/* =====================================================
   MESAJ
===================================================== */

function showMessage(text){

    message.textContent = text;

}


/* =====================================================
   ZATEN GİRİŞ YAPILDIYSA
===================================================== */

onAuthStateChanged(auth, async (user) => {

    if(!user){

        return;

    }

    try{

        const firebaseToken =
        await user.getIdToken(true);

        localStorage.setItem(
			"minegram_firebase_token",
				firebaseToken
		);

		localStorage.setItem(
			"minegram_token",
				firebaseToken
		);

        localStorage.setItem(
            "minegram_user_email",
            user.email || ""
        );

        location.replace("index.html");

    }catch(error){

        console.error(error);

    }

});


/* =====================================================
   GİRİŞ
===================================================== */

async function login(){

    const email =
    username.value.trim();

    const pass =
    password.value;

    if(!email){

        showMessage(
            "E-posta adresini gir."
        );

        return;

    }

    if(!pass){

        showMessage(
            "Şifreni gir."
        );

        return;

    }


    loginBtn.disabled=true;

    loginBtn.textContent=
    "Giriş yapılıyor...";


    try{

        const result =
        await signInWithEmailAndPassword(
            auth,
            email,
            pass
        );


        const user =
        result.user;


        const firebaseToken =
        await user.getIdToken(true);


        /*
          Firebase ID TOKEN
          index.html tarafından kullanılacak.
        */

        localStorage.setItem(
            "minegram_firebase_token",
            firebaseToken
        );


        localStorage.setItem(
            "minegram_user_email",
            user.email || ""
        );


        /*
          index.html
        */

        location.replace(
            "index.html"
        );


    }catch(error){

        console.error(
            "Firebase Login:",
            error
        );


        let text =
        "Giriş yapılamadı.";


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            text =
            "E-posta veya şifre yanlış.";

        }

        else if(
            error.code ===
            "auth/user-not-found"
        ){

            text =
            "Bu kullanıcı bulunamadı.";

        }

        else if(
            error.code ===
            "auth/wrong-password"
        ){

            text =
            "Şifre yanlış.";

        }

        else if(
            error.code ===
            "auth/invalid-email"
        ){

            text =
            "Geçerli bir e-posta adresi gir.";

        }

        else if(
            error.code ===
            "auth/too-many-requests"
        ){

            text =
            "Çok fazla deneme yapıldı. Biraz bekle.";

        }


        showMessage(text);

    }


    loginBtn.disabled=false;

    loginBtn.textContent=
    "Giriş Yap";

}


/* =====================================================
   BUTON
===================================================== */

loginBtn.addEventListener(
    "click",
    login
);


/* =====================================================
   ENTER
===================================================== */

password.addEventListener(
    "keydown",
    (e) => {

        if(e.key === "Enter"){

            login();

        }

    }
);


/* =====================================================
   ŞİFRE SIFIRLAMA
===================================================== */

forgotBtn.addEventListener(
    "click",
    async (e) => {

        e.preventDefault();


        const email =
        username.value.trim();


        if(!email){

            showMessage(
                "Önce e-posta adresini yaz."
            );

            username.focus();

            return;

        }


        try{

            await sendPasswordResetEmail(
                auth,
                email
            );


            showMessage(
                "Şifre yenileme bağlantısı e-posta adresine gönderildi."
            );


        }catch(error){

            console.error(error);

            showMessage(
                "Şifre yenileme bağlantısı gönderilemedi."
            );

        }

    }
);

</script>

</body>
</html>
