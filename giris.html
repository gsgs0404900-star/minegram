<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minegram - Giriş</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif
}

body{min-height:100vh}

.login-page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start
}

.login-box{
    width:365px;
    margin-top:145px;
    text-align:center
}

.logo{
    font-size:27px;
    font-weight:700;
    margin-bottom:29px
}

.field{
    width:100%;
    height:44px;
    margin-bottom:9px;
    padding:0 12px;
    border:1px solid #292929;
    border-radius:7px;
    background:#000;
    color:#fff;
    outline:none;
    font-size:12px
}

.field::placeholder{color:#777}
.field:focus{border-color:#555}

.login-btn{
    width:100%;
    height:42px;
    border:0;
    border-radius:22px;
    background:#2d80bd;
    color:#000;
    font-weight:700;
    cursor:pointer;
    font-size:12px
}

.login-btn:hover{background:#348dca}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed
}

.forgot{
    display:block;
    margin-top:14px;
    color:#0095f6;
    font-size:13px;
    text-decoration:underline;
    cursor:pointer
}

.register{
    display:block;
    margin-top:28px;
    color:#0095f6;
    font-size:13px;
    text-decoration:none
}

.message{
    min-height:20px;
    margin-top:14px;
    font-size:12px;
    color:#ff4d4d
}

@media(max-width:600px){
    .login-box{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:90px
    }
}
</style>
</head>

<body>

<div class="login-page">
    <div class="login-box">

        <div class="logo">Minegram</div>

        <input
            id="email"
            class="field"
            type="email"
            autocomplete="email"
            placeholder="E-posta adresi"
        >

        <input
            id="password"
            class="field"
            type="password"
            autocomplete="current-password"
            placeholder="Şifre"
        >

        <button id="loginBtn" class="login-btn" type="button">
            Giriş Yap
        </button>

        <a id="forgotBtn" class="forgot">
            Şifremi unuttum
        </a>

        <a href="kayit.html" class="register">
            Hesabın yok mu? Kayıt ol
        </a>

        <div id="message" class="message"></div>

    </div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",
    authDomain: "mim-ea133.firebaseapp.com",
    databaseURL: "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "mim-ea133",
    storageBucket: "mim-ea133.firebasestorage.app",
    messagingSenderId: "303525353436",
    appId: "1:303525353436:web:082fc090b5025e19942119",
    measurementId: "G-K962QE5P1R"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


/* =====================================================
   ELEMENTLER
===================================================== */

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const forgotBtn = document.getElementById("forgotBtn");
const message = document.getElementById("message");


/* =====================================================
   MESAJ
===================================================== */

function showMessage(text, success = false){
    message.textContent = text;
    message.style.color = success ? "#35c759" : "#ff4d4d";
}


/* =====================================================
   TOKENLARI KAYDET
   index.html bu anahtarları kullanabilir.
===================================================== */

async function saveFirebaseSession(user){

    if(!user) return false;

    try{

        const firebaseToken = await user.getIdToken(true);

        if(!firebaseToken){
            return false;
        }

        localStorage.setItem(
            "minegram_firebase_token",
            firebaseToken
        );

        localStorage.setItem(
            "minegram_token",
            firebaseToken
        );

        localStorage.setItem(
            "minegram_firebase_uid",
            user.uid || ""
        );

        localStorage.setItem(
            "minegram_firebase_email",
            user.email || ""
        );

        return true;

    }catch(error){

        console.error(
            "[MINEGRAM SESSION]",
            error
        );

        return false;
    }
}


/* =====================================================
   ZATEN GİRİŞ YAPILMIŞSA
   giris.html tekrar açılırsa index'e gönder.
===================================================== */

let firstAuthCheck = true;

onAuthStateChanged(auth, async (user) => {

    if(!firstAuthCheck) return;

    firstAuthCheck = false;

    if(!user) return;

    const saved = await saveFirebaseSession(user);

    if(saved){
        window.location.replace("index.html");
    }

});


/* =====================================================
   GİRİŞ
===================================================== */

async function login(){

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    showMessage("");

    if(!email){
        showMessage("E-posta adresini gir.");
        emailInput.focus();
        return;
    }

    if(!password){
        showMessage("Şifreni gir.");
        passwordInput.focus();
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Giriş yapılıyor...";

    try{

        const result = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        const user = result.user;

        /*
         * ÖNEMLİ:
         * index.html açılmadan önce Firebase ID token
         * ve gerekli localStorage anahtarları hazırlanıyor.
         */
        const saved = await saveFirebaseSession(user);

        if(!saved){
            throw new Error(
                "Oturum anahtarı oluşturulamadı."
            );
        }

        showMessage(
            "Giriş başarılı. Ana sayfaya yönlendiriliyorsun...",
            true
        );

        /*
         * 500 ms beklemek yerine doğrudan ve güvenli şekilde
         * index.html'e geç.
         */
        window.location.replace("index.html");

    }catch(error){

        console.error(
            "[FIREBASE LOGIN]",
            error
        );

        let text = "Giriş yapılamadı.";

        switch(error.code){

            case "auth/invalid-credential":
                text = "E-posta veya şifre hatalı.";
                break;

            case "auth/user-not-found":
                text = "Bu hesap bulunamadı.";
                break;

            case "auth/wrong-password":
                text = "Şifre hatalı.";
                break;

            case "auth/invalid-email":
                text = "Geçerli bir e-posta adresi gir.";
                break;

            case "auth/too-many-requests":
                text = "Çok fazla deneme yapıldı. Biraz sonra tekrar dene.";
                break;

            case "auth/network-request-failed":
                text = "İnternet bağlantısını kontrol et.";
                break;

            default:
                if(error.message){
                    text = error.message;
                }
        }

        showMessage(text);

        loginBtn.disabled = false;
        loginBtn.textContent = "Giriş Yap";
    }
}


/* =====================================================
   ŞİFRE SIFIRLAMA
===================================================== */

async function forgotPassword(){

    const email = emailInput.value.trim();

    if(!email){
        showMessage(
            "Şifre sıfırlamak için önce e-posta adresini gir."
        );
        emailInput.focus();
        return;
    }

    try{

        await sendPasswordResetEmail(
            auth,
            email
        );

        showMessage(
            "Şifre sıfırlama bağlantısı e-posta adresine gönderildi.",
            true
        );

    }catch(error){

        console.error(error);

        if(error.code === "auth/user-not-found"){
            showMessage(
                "Bu e-posta ile kayıtlı hesap bulunamadı."
            );
        }
        else if(error.code === "auth/invalid-email"){
            showMessage(
                "Geçerli bir e-posta adresi gir."
            );
        }
        else{
            showMessage(
                "Şifre sıfırlama bağlantısı gönderilemedi."
            );
        }
    }
}


/* =====================================================
   BUTONLAR
===================================================== */

loginBtn.addEventListener(
    "click",
    login
);

forgotBtn.addEventListener(
    "click",
    forgotPassword
);

passwordInput.addEventListener(
    "keydown",
    event => {
        if(event.key === "Enter"){
            login();
        }
    }
);

emailInput.addEventListener(
    "keydown",
    event => {
        if(event.key === "Enter"){
            passwordInput.focus();
        }
    }
);

</script>

</body>
</html>
