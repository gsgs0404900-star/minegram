<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Minegram - Giriş</title>

<style>
*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif
}

body{
  min-height:100vh
}

.login-page{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start
}

.login-box{
  width:365px;
  margin-top:145px;
  text-align:center
}

.logo{
  font-size:27px;
  font-weight:700;
  margin-bottom:29px
}

.field{
  width:100%;
  height:44px;
  margin-bottom:9px;
  padding:0 12px;
  border:1px solid #292929;
  border-radius:7px;
  background:#000;
  color:#fff;
  outline:none;
  font-size:12px
}

.field::placeholder{
  color:#777
}

.field:focus{
  border-color:#555
}

.login-btn{
  width:100%;
  height:42px;
  border:0;
  border-radius:22px;
  background:#2d80bd;
  color:#000;
  font-weight:700;
  cursor:pointer;
  font-size:12px
}

.login-btn:hover{
  background:#348dca
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed
}

.forgot{
  display:block;
  margin-top:14px;
  color:#0095f6;
  font-size:13px;
  text-decoration:underline;
  cursor:pointer
}

.register{
  display:block;
  margin-top:28px;
  color:#0095f6;
  font-size:13px;
  text-decoration:none
}

.message{
  min-height:20px;
  margin-top:14px;
  font-size:12px;
  line-height:1.5
}

@media(max-width:600px){

  .login-box{
    width:calc(100% - 40px);
    max-width:365px;
    margin-top:90px
  }

}
</style>
</head>

<body>

<div class="login-page">

  <div class="login-box">

    <div class="logo">
      Minegram
    </div>


    <!-- KULLANICI ADI -->

    <input
      id="username"
      class="field"
      type="text"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      placeholder="Kullanıcı adı"
    >


    <!-- ŞİFRE -->

    <input
      id="password"
      class="field"
      type="password"
      autocomplete="current-password"
      placeholder="Şifre"
    >


    <!-- GİRİŞ -->

    <button
      id="loginBtn"
      class="login-btn"
      type="button"
    >
      Giriş Yap
    </button>


    <!-- ŞİFREMİ UNUTTUM -->

    <a
      class="forgot"
      href="sifremi-unuttum.html"
    >
      Şifremi unuttum
    </a>


    <!-- KAYIT -->

    <a
      href="kayit.html"
      class="register"
    >
      Hesabın yok mu? Kayıt ol
    </a>


    <!-- MESAJ -->

    <div
      id="message"
      class="message"
    ></div>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

  authDomain:
    "mim-ea133.firebaseapp.com",

  databaseURL:
    "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "mim-ea133",

  storageBucket:
    "mim-ea133.firebasestorage.app",

  messagingSenderId:
    "303525353436",

  appId:
    "1:303525353436:web:082fc090b5025e19942119",

  measurementId:
    "G-K962QE5P1R"

};


/* =========================================
   FIREBASE BAŞLAT
========================================= */

const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


/* =========================================
   ELEMENTLER
========================================= */

const usernameInput =
  document.getElementById("username");


const passwordInput =
  document.getElementById("password");


const loginBtn =
  document.getElementById("loginBtn");


const message =
  document.getElementById("message");


/* =========================================
   MESAJ
========================================= */

function showMessage(
  text,
  success = false
){

  message.textContent =
    text || "";


  message.style.color =
    success
      ? "#35c759"
      : "#ff4d4d";

}


/* =========================================
   KULLANICI ADINI
   FIREBASE GİRİŞ ADRESİNE ÇEVİR

   KAYIT SAYFASIYLA
   AYNI SİSTEM
========================================= */

function usernameToInternalEmail(
  name
){

  return (
    encodeURIComponent(name)
      .replace(/%/g, "_")
      +
      "@minegram-user.invalid"
  );

}


/* =========================================
   HATA MESAJLARI
========================================= */

function firebaseError(
  error
){

  switch(
    error.code
  ){

    case "auth/invalid-credential":

    case "auth/wrong-password":

    case "auth/user-not-found":

      return
        "Kullanıcı adı veya şifre yanlış.";


    case "auth/user-disabled":

      return
        "Bu hesap devre dışı bırakılmış.";


    case "auth/too-many-requests":

      return
        "Çok fazla deneme yapıldı. Biraz sonra tekrar dene.";


    case "auth/network-request-failed":

      return
        "İnternet bağlantısını kontrol et.";


    case "auth/invalid-email":

      return
        "Kullanıcı adı geçersiz.";


    default:

      return
        "Giriş yapılamadı. Kullanıcı adını ve şifreni kontrol et.";

  }

}


/* =========================================
   GİRİŞ YAP
========================================= */

async function login(){


  /* -----------------------------------------
     KULLANICI ADI
  ----------------------------------------- */

  const username =
    usernameInput.value
      .trim()
      .toLowerCase();


  /* -----------------------------------------
     ŞİFRE
  ----------------------------------------- */

  const password =
    passwordInput.value;


  /* -----------------------------------------
     MESAJ TEMİZLE
  ----------------------------------------- */

  showMessage("");


  /* -----------------------------------------
     KULLANICI ADI BOŞ
  ----------------------------------------- */

  if(
    !username
  ){

    showMessage(
      "Kullanıcı adını gir."
    );


    usernameInput.focus();


    return;

  }


  /* -----------------------------------------
     ŞİFRE BOŞ
  ----------------------------------------- */

  if(
    !password
  ){

    showMessage(
      "Şifreni gir."
    );


    passwordInput.focus();


    return;

  }


  /* -----------------------------------------
     KULLANICI ADINI
     DAHİLİ FIREBASE ADRESİNE ÇEVİR
  ----------------------------------------- */

  const internalEmail =
    usernameToInternalEmail(
      username
    );


  /* -----------------------------------------
     BUTON
  ----------------------------------------- */

  loginBtn.disabled =
    true;


  loginBtn.textContent =
    "Giriş yapılıyor...";


  /* =========================================
     FIREBASE GİRİŞ
  ========================================= */

  try{


    const credential =
      await signInWithEmailAndPassword(

        auth,

        internalEmail,

        password

      );


    const user =
      credential.user;


    console.log(
      "[MINEGRAM LOGIN SUCCESS]",
      user.uid
    );


    /* -----------------------------------------
       BAŞARILI
    ----------------------------------------- */

    showMessage(

      "Giriş başarılı. Yönlendiriliyorsun...",

      true

    );


    loginBtn.textContent =
      "Giriş başarılı";


    /* -----------------------------------------
       ANA SAYFA
    ----------------------------------------- */

    setTimeout(

      function(){

        window.location.href =
          "index.html";

      },

      500

    );


  }


  /* =========================================
     HATA
  ========================================= */

  catch(
    error
  ){


    console.error(

      "[MINEGRAM LOGIN ERROR]",

      error

    );


    showMessage(

      firebaseError(
        error
      )

    );


    loginBtn.disabled =
      false;


    loginBtn.textContent =
      "Giriş Yap";


  }

}


/* =========================================
   GİRİŞ BUTONU
========================================= */

loginBtn.addEventListener(

  "click",

  login

);


/* =========================================
   KULLANICI ADI ENTER
========================================= */

usernameInput.addEventListener(

  "keydown",

  function(
    event
  ){


    if(
      event.key === "Enter"
    ){


      event.preventDefault();


      passwordInput.focus();


    }


  }

);


/* =========================================
   ŞİFRE ENTER
========================================= */

passwordInput.addEventListener(

  "keydown",

  function(
    event
  ){


    if(
      event.key === "Enter"
    ){


      event.preventDefault();


      login();


    }


  }

);

</script>

</body>
</html>
