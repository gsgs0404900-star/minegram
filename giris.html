<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minegram - Giriş</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}.login-page{width:100%;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}.login-box{width:365px;margin-top:145px;text-align:center}.logo{font-size:27px;font-weight:700;margin-bottom:29px}.field{width:100%;height:44px;margin-bottom:9px;padding:0 12px;border:1px solid #292929;border-radius:7px;background:#000;color:#fff;outline:none;font-size:12px}.field::placeholder{color:#777}.field:focus{border-color:#555}.login-btn{width:100%;height:42px;border:0;border-radius:22px;background:#2d80bd;color:#000;font-weight:700;cursor:pointer;font-size:12px}.login-btn:hover{background:#348dca}.login-btn:disabled{opacity:.6;cursor:not-allowed}.forgot,.register{display:block;margin-top:14px;color:#0095f6;font-size:13px;text-decoration:underline;cursor:pointer}.register{margin-top:28px;text-decoration:none}.message{min-height:20px;margin-top:14px;font-size:12px;color:#ff4d4d}@media(max-width:600px){.login-box{width:calc(100% - 40px);max-width:365px;margin-top:90px}}
</style>
</head>
<body>
<div class="login-page"><div class="login-box">
<div class="logo">Minegram</div>
<input id="email" class="field" type="email" autocomplete="email" placeholder="E-posta adresi">
<input id="password" class="field" type="password" autocomplete="current-password" placeholder="Şifre">
<button id="loginBtn" class="login-btn" type="button">Giriş Yap</button>
<a id="forgotBtn" class="forgot" href="javascript:void(0)">Şifremi unuttum</a>
<a href="kayit.html" class="register">Hesabın yok mu? Kayıt ol</a>
<div id="message" class="message"></div>
</div></div>
<script>
'use strict';
const API='/api';
const emailInput=document.getElementById('email');
const passwordInput=document.getElementById('password');
const loginBtn=document.getElementById('loginBtn');
const forgotBtn=document.getElementById('forgotBtn');
const message=document.getElementById('message');

function showMessage(text,success=false){message.textContent=text||'';message.style.color=success?'#35c759':'#ff4d4d'}

function clearSession(){
['minegram_token','minegram_supabase_token','minegram_user_id','minegram_username','minegram_email','minegram_user','minegram_profile','minegram_firebase_token','minegram_firebase_uid','minegram_firebase_email'].forEach(k=>localStorage.removeItem(k));
}

function saveSession(data){
if(!data||!data.token)throw new Error('Oturum tokenı alınamadı.');
localStorage.setItem('minegram_token',String(data.token));
localStorage.setItem('minegram_supabase_token',String(data.token));
if(data.user){
localStorage.setItem('minegram_user',JSON.stringify(data.user));
if(data.user.id!=null)localStorage.setItem('minegram_user_id',String(data.user.id));
if(data.user.username)localStorage.setItem('minegram_username',String(data.user.username));
if(data.user.email)localStorage.setItem('minegram_email',String(data.user.email));
}
}

async function checkExistingSession(){
const token=localStorage.getItem('minegram_token')||localStorage.getItem('minegram_supabase_token');
if(!token)return;
try{
const r=await fetch(API+'/me',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
if(r.ok){window.location.replace('index.html');return;}
if(r.status===401||r.status===403)clearSession();
}catch(e){console.warn('[SESSION CHECK]',e)}
}

async function login(){
const email=emailInput.value.trim();
const password=passwordInput.value;
showMessage('');
if(!email){showMessage('E-posta adresini gir.');emailInput.focus();return}
if(!password){showMessage('Şifreni gir.');passwordInput.focus();return}
loginBtn.disabled=true;loginBtn.textContent='Giriş yapılıyor...';
try{
const response=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password}),cache:'no-store'});
const data=await response.json().catch(()=>({}));
if(!response.ok)throw new Error(data.error||data.message||'E-posta veya şifre hatalı.');
saveSession(data);
showMessage('Giriş başarılı. Ana sayfaya yönlendiriliyorsun...',true);
/* Token yazıldıktan sonra index.html. */
setTimeout(()=>window.location.replace('index.html'),80);
}catch(error){
console.error('[MINEGRAM LOGIN]',error);
const t=String(error.message||'');
showMessage(/invalid|credential|password|şifre/i.test(t)?'E-posta veya şifre hatalı.':t||'Giriş yapılamadı.');
loginBtn.disabled=false;loginBtn.textContent='Giriş Yap';
}
}

async function forgotPassword(){
const email=emailInput.value.trim();
if(!email){showMessage('Şifre sıfırlamak için önce e-posta adresini gir.');emailInput.focus();return}
try{
const cr=await fetch(API+'/auth-config',{cache:'no-store'});const config=await cr.json().catch(()=>({}));
if(!cr.ok||!config.url||!config.key)throw new Error('Şifre sıfırlama sistemi kullanılamıyor.');
const rr=await fetch(config.url+'/auth/v1/recover',{method:'POST',headers:{'Content-Type':'application/json',apikey:config.key},body:JSON.stringify({email})});
if(!rr.ok){const d=await rr.json().catch(()=>({}));throw new Error(d.msg||d.message||'Şifre sıfırlama bağlantısı gönderilemedi.')}
showMessage('Şifre sıfırlama bağlantısı e-posta adresine gönderildi.',true);
}catch(e){console.error('[FORGOT]',e);showMessage(e.message||'Şifre sıfırlama bağlantısı gönderilemedi.')}
}

loginBtn.addEventListener('click',login);
forgotBtn.addEventListener('click',forgotPassword);
passwordInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();login()}});
emailInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();passwordInput.focus()}});
checkExistingSession();
</script>
</body>
</html>
