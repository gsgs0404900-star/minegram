<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Minegram - Giriş</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif
}

body{min-height:100vh}

.login-page{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start
}

.login-box{
  width:365px;
  margin-top:145px;
  text-align:center
}

.logo{
  font-size:27px;
  font-weight:700;
  margin-bottom:29px
}

.field{
  width:100%;
  height:44px;
  margin-bottom:9px;
  padding:0 12px;
  border:1px solid #292929;
  border-radius:7px;
  background:#000;
  color:#fff;
  outline:none;
  font-size:12px
}

.field::placeholder{color:#777}
.field:focus{border-color:#555}

.login-btn{
  width:100%;
  height:42px;
  border:0;
  border-radius:22px;
  background:#2d80bd;
  color:#000;
  font-weight:700;
  cursor:pointer;
  font-size:12px
}

.login-btn:hover{background:#348dca}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed
}

.forgot{
  display:block;
  margin-top:14px;
  color:#0095f6;
  font-size:13px;
  text-decoration:underline;
  cursor:pointer
}

.register{
  display:block;
  margin-top:28px;
  color:#0095f6;
  font-size:13px;
  text-decoration:none
}

.message{
  min-height:20px;
  margin-top:14px;
  font-size:12px;
  line-height:1.5
}

@media(max-width:600px){
  .login-box{
    width:calc(100% - 40px);
    max-width:365px;
    margin-top:90px
  }
}
</style>
</head>

<body>

<div class="login-page">

  <div class="login-box">

    <div class="logo">Minegram</div>

    <input
      id="email"
      class="field"
      type="email"
      autocomplete="email"
      autocapitalize="none"
      spellcheck="false"
      placeholder="E-posta"
    >

    <input
      id="password"
      class="field"
      type="password"
      autocomplete="current-password"
      placeholder="Şifre"
    >

    <button
      id="loginBtn"
      class="login-btn"
      type="button"
    >
      Giriş Yap
    </button>

    <a
      class="forgot"
      href="sifremi-unuttum.html"
    >
      Şifremi unuttum
    </a>

    <a
      href="kayit.html"
      class="register"
    >
      Hesabın yok mu? Kayıt ol
    </a>

    <div id="message" class="message"></div>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  sendEmailVerification,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {
  apiKey: "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",
  authDomain: "mim-ea133.firebaseapp.com",
  databaseURL: "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mim-ea133",
  storageBucket: "mim-ea133.firebasestorage.app",
  messagingSenderId: "303525353436",
  appId: "1:303525353436:web:082fc090b5025e19942119",
  measurementId: "G-K962QE5P1R"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


/* =========================================
   ELEMENTLER
========================================= */

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const message =
  document.getElementById("message");


/* =========================================
   MESAJ
========================================= */

function showMessage(text, success=false){

  message.textContent = text || "";

  message.style.color =
    success ? "#35c759" : "#ff4d4d";

}


/* =========================================
   FIREBASE HATA MESAJLARI
========================================= */

function firebaseError(error){

  switch(error.code){

    case "auth/invalid-email":
      return "Geçerli bir e-posta adresi gir.";

    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found":
      return "E-posta veya şifre yanlış.";

    case "auth/user-disabled":
      return "Bu hesap devre dışı bırakılmış.";

    case "auth/too-many-requests":
      return "Çok fazla deneme yapıldı. Biraz sonra tekrar dene.";

    case "auth/network-request-failed":
      return "İnternet bağlantısını kontrol et.";

    default:
      return error.message || "Giriş yapılamadı.";
  }

}


/* =========================================
   GİRİŞ
========================================= */

async function login(){

  const email =
    emailInput.value.trim().toLowerCase();

  const password =
    passwordInput.value;


  showMessage("");


  if(!email){

    showMessage("E-posta adresini gir.");

    emailInput.focus();

    return;
  }


  if(!password){

    showMessage("Şifreni gir.");

    passwordInput.focus();

    return;
  }


  loginBtn.disabled = true;
  loginBtn.textContent = "Giriş yapılıyor...";


  try{

    const credential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    const user =
      credential.user;


    /*
     * E-POSTA DOĞRULAMA KONTROLÜ
     */

    await user.reload();


    if(!user.emailVerified){

      /*
       * Yeni doğrulama e-postası gönder
       */

      try{

        await sendEmailVerification(user);

      }catch(_){

        /*
         * Çok kısa sürede tekrar gönderildiyse
         * giriş yine engellenir.
         */

      }


      await signOut(auth);


      showMessage(
        "E-posta adresin henüz doğrulanmamış. Yeni doğrulama bağlantısı gönderildi."
      );

      loginBtn.disabled = false;
      loginBtn.textContent = "Giriş Yap";

      return;
    }


    /*
     * BAŞARILI
     */

    showMessage(
      "Giriş başarılı. Yönlendiriliyorsun...",
      true
    );


    loginBtn.textContent =
      "Giriş başarılı";


    setTimeout(function(){

      window.location.href =
        "index.html";

    },500);


  }catch(error){

    console.error(
      "[MINEGRAM FIREBASE LOGIN]",
      error
    );


    showMessage(
      firebaseError(error)
    );


    loginBtn.disabled = false;
    loginBtn.textContent = "Giriş Yap";

  }

}


/* =========================================
   BUTON
========================================= */

loginBtn.addEventListener(
  "click",
  login
);


/* =========================================
   ENTER
========================================= */

emailInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      passwordInput.focus();

    }

  }
);


passwordInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      login();

    }

  }
);

</script>

</body>
</html>
