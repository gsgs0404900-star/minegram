<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kayıt ol - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

/* =========================================
   ÜST BAŞLIK
========================================= */

.topbar{
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:25px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:34px;
    font-weight:300;
    line-height:1;
    cursor:pointer;
    user-select:none;
}

.top-title{
    margin-left:15px;
    font-size:20px;
    font-weight:700;
    color:#fff;
}

/* =========================================
   ANA İÇERİK
========================================= */

.content{
    width:317px;
    margin:115px auto 0;
}

/* =========================================
   BAŞLIK
========================================= */

.title{
    text-align:center;
    font-size:30px;
    line-height:1.15;
    font-weight:700;
    margin:0 0 34px;
    color:#fff;
}

/* =========================================
   AÇIKLAMA
========================================= */

.description{
    font-size:18px;
    line-height:1.45;
    color:#bdbdbd;
    margin:0 0 65px;
}

/* =========================================
   KULLANICI ADI INPUT
========================================= */

.username-input{
    display:block;
    width:100%;
    height:39px;

    padding:0 10px;

    border:1px solid #252525;
    border-radius:6px;

    background:#050505;
    color:#fff;

    outline:none;

    font-size:12px;
    font-family:Arial,Helvetica,sans-serif;
}

.username-input::placeholder{
    color:#777;
    opacity:1;
}

.username-input:focus{
    border-color:#555;
}

/* =========================================
   DURUM MESAJI
========================================= */

.message{
    min-height:18px;
    margin-top:12px;

    text-align:center;

    font-size:11px;
    line-height:1.4;

    color:#ff5c5c;
}

.message.success{
    color:#55b8ff;
}

.message.checking{
    color:#aaa;
}

/* =========================================
   OTOMATİK ÖNER
========================================= */

.suggest{
    display:block;

    width:fit-content;

    margin:18px auto 0;

    padding:0;

    border:0;
    background:transparent;

    color:#008cff;

    font-size:12px;
    font-weight:400;

    text-decoration:none;

    cursor:pointer;
}

.suggest:hover{
    text-decoration:underline;
}

/* =========================================
   İLERİ
========================================= */

.next-button{
    display:block;

    width:317px;
    height:37px;

    margin:18px auto 0;

    border:0;
    border-radius:22px;

    background:#2677b5;

    color:#000;

    font-size:12px;
    font-weight:700;

    cursor:pointer;
}

.next-button:active{
    transform:scale(.99);
}

.next-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =========================================
   MOBİL
========================================= */

@media(max-width:600px){

    .topbar{
        height:70px;
        padding-left:28px;
    }

    .back{
        width:30px;
        height:38px;
        font-size:38px;
    }

    .top-title{
        margin-left:12px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 120px);
        max-width:714px;
        margin:105px auto 0;
    }

    .title{
        font-size:42px;
        margin-bottom:30px;
    }

    .description{
        font-size:21px;
        line-height:1.5;
        margin-bottom:55px;
    }

    .username-input{
        height:68px;
        padding:0 20px;

        font-size:18px;

        border:2px solid #686868;
        border-radius:9px;
    }

    .message{
        font-size:14px;
    }

    .suggest{
        margin-top:25px;
        font-size:18px;
        font-weight:700;
        color:#62b5f5;
    }

    .next-button{
        width:calc(100% - 120px);
        max-width:714px;

        height:58px;

        margin:18px auto 30px;

        font-size:20px;
        border-radius:32px;
    }
}

/* =========================================
   KÜÇÜK TELEFON
========================================= */

@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        margin-top:65px;
    }

    .title{
        font-size:38px;
    }

    .description{
        font-size:20px;
    }

    .next-button{
        width:calc(100% - 40px);
    }
}
</style>

</head>

<body>

<div class="page">

<!-- =====================================
     ÜST
====================================== -->

<div class="topbar">

    <div
        class="back"
        onclick="goBack()"
        aria-label="Geri"
    >
        ‹
    </div>

    <div class="top-title">
        Kayıt ol
    </div>

</div>


<!-- =====================================
     KULLANICI ADI
====================================== -->

<main class="content">

    <h1 class="title">
        Kullanıcı adı oluştur
    </h1>

    <p class="description">
        Önce Minegram hesabın için bir kullanıcı adı oluştur.
    </p>

    <input
        type="text"
        id="username"
        class="username-input"
        placeholder="Kullanıcı adı"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        maxlength="30"
    >

    <div
        id="usernameMessage"
        class="message"
    ></div>

    <button
        type="button"
        id="suggestUsername"
        class="suggest"
    >
        Otomatik kullanıcı adı öner
    </button>

    <button
        type="button"
        id="nextButton"
        class="next-button"
        disabled
    >
        İleri
    </button>

</main>

</div>

<script>

"use strict";


/* =========================================
   ELEMENTLER
========================================= */

const usernameInput =
    document.getElementById("username");

const usernameMessage =
    document.getElementById("usernameMessage");

const nextButton =
    document.getElementById("nextButton");

const suggestUsername =
    document.getElementById("suggestUsername");


let usernameAvailable = false;
let checkTimer = null;


/* =========================================
   GERİ
========================================= */

function goBack(){

    if(document.referrer){

        history.back();

        return;
    }

    window.location.href =
        "giris.html";
}


/* =========================================
   KULLANICI ADI TEMİZLE
========================================= */

function cleanUsername(value){

    return String(value || "")
        .trim()
        .replace(/^@/, "")
        .toLowerCase();

}


/* =========================================
   GEÇERLİ KULLANICI ADI
========================================= */

function validUsername(username){

    return /^[a-z0-9._]{3,30}$/.test(
        username
    );

}


/* =========================================
   MESAJ
========================================= */

function showMessage(text,type){

    usernameMessage.textContent =
        text || "";

    usernameMessage.className =
        "message";

    if(type){

        usernameMessage.classList.add(
            type
        );

    }

}


/* =========================================
   SERVER'A KULLANICI ADI KONTROLÜ
========================================= */

async function checkUsername(username){

    usernameAvailable = false;
    nextButton.disabled = true;

    if(!username){

        showMessage("", "");

        return;
    }

    if(!validUsername(username)){

        showMessage(
            "3-30 karakter kullan. Harf, sayı, _ veya . kullanabilirsin.",
            ""
        );

        return;
    }

    showMessage(
        "Kullanıcı adı kontrol ediliyor...",
        "checking"
    );

    try{

        const response =
            await fetch(
                "/api/check-username?username=" +
                encodeURIComponent(username),
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );

        const data =
            await response
                .json()
                .catch(function(){
                    return {};
                });

        console.log(
            "[MINEGRAM USERNAME CHECK]",
            data
        );

        if(!response.ok){

            throw new Error(
                data.error ||
                "Kullanıcı adı kontrol edilemedi."
            );
        }

        /*
         * SERVER:
         *
         * available:true
         *  = kullanıcı adı BOŞTA
         *
         * available:false
         *  = kullanıcı adı ALINMIŞ
         */

        if(data.available === true){

            usernameAvailable = true;

            nextButton.disabled = false;

            showMessage(
                "Kullanıcı adı kullanılabilir.",
                "success"
            );

            return;
        }

        usernameAvailable = false;

        nextButton.disabled = true;

        showMessage(
            "Bu kullanıcı adı zaten alınmış.",
            ""
        );

    }
    catch(error){

        console.error(
            "[MINEGRAM USERNAME CHECK ERROR]",
            error
        );

        usernameAvailable = false;

        nextButton.disabled = true;

        showMessage(
            error.message ||
            "Kullanıcı adı kontrol edilemedi.",
            ""
        );
    }
}

/* =========================================
   INPUT
========================================= */

usernameInput.addEventListener(
    "input",
    function(){

        clearTimeout(
            checkTimer
        );


        const username =
            cleanUsername(
                usernameInput.value
            );


        usernameInput.value =
            username;


        checkTimer =
            setTimeout(
                function(){

                    checkUsername(
                        username
                    );

                },
                400
            );

    }
);


/* =========================================
   ENTER
========================================= */

usernameInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            usernameAvailable
        ){

            event.preventDefault();

            nextButton.click();

        }

    }
);


/* =========================================
   OTOMATİK KULLANICI ADI
========================================= */

suggestUsername.addEventListener(
    "click",
    async function(){

        const suggestions = [

            "minegram_user",
            "minegram2026",
            "minegram01",
            "minegram_user1",
            "my_minegram",
            "minegram_official",
            "minegram2026_",
            "minegram_user01"

        ];


        /*
         * Her seferinde bir öneri dene.
         */

        for(
            let i = 0;
            i < suggestions.length;
            i++
        ){

            const randomIndex =
                Math.floor(
                    Math.random() *
                    suggestions.length
                );


            const username =
                suggestions[randomIndex];


            usernameInput.value =
                username;


            await checkUsername(
                username
            );


            if(usernameAvailable){

                return;

            }

        }

    }
);

/* =========================================
   İLERİ
========================================= */

nextButton.addEventListener(
    "click",
    function(){

        const username =
            cleanUsername(
                usernameInput.value
            );

        if(
            !usernameAvailable ||
            !validUsername(username)
        ){
            showMessage(
                "Önce kullanılabilir bir kullanıcı adı seç.",
                ""
            );
            return;
        }

        /* Kullanıcı adını kaydet */
        sessionStorage.setItem(
            "minegram_register_username",
            username
        );

        /* Butonu kilitle */
        nextButton.disabled = true;

        nextButton.textContent =
            "Devam ediliyor...";

        /* Şifre oluşturma sayfasına git */
        window.location.assign(
            "./kayit.html?username=" +
            encodeURIComponent(username)
        );
    }
);

/* =========================================
   SAYFA AÇILIŞI
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const savedUsername =
            sessionStorage.getItem(
                "minegram_register_username"
            );


        if(savedUsername){

            usernameInput.value =
                cleanUsername(
                    savedUsername
                );

            checkUsername(
                usernameInput.value
            );

        }

    }
);

</script>

</body>
</html>
