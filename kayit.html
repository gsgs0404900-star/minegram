</div>

<script>

    const usernameInput =
        document.getElementById("username");

    const nextButton =
        document.getElementById("nextButton");

    const suggestUsername =
        document.getElementById("suggestUsername");

    const status =
        document.getElementById("status");


    let usernameValid = false;


    /* ==================================================
       KULLANICI ADI TEMİZLE
    ================================================== */

    function cleanUsername(value) {

        return String(value || "")
            .trim()
            .replace(/^@/, "")
            .toLowerCase();

    }


    /* ==================================================
       KULLANICI ADI GEÇERLİ Mİ?
    ================================================== */

    function validUsername(username) {

        return /^[a-z0-9._]{3,30}$/.test(
            username
        );

    }


    /* ==================================================
       KULLANICI ADI KONTROL
    ================================================== */

    function checkUsername(username) {

        usernameValid = false;

        nextButton.disabled = true;


        if (!username) {

            status.textContent = "";
            status.className = "";

            return;

        }


        if (!validUsername(username)) {

            status.textContent =
                "3-30 karakter kullan. Harf, sayı, _ veya . kullanabilirsin.";

            status.className = "taken";

            return;

        }


        usernameValid = true;

        status.textContent =
            "Kullanıcı adı uygun.";

        status.className =
            "available";

        nextButton.disabled = false;

    }


    /* ==================================================
       INPUT
    ================================================== */

    usernameInput.addEventListener(
        "input",
        () => {

            const username =
                cleanUsername(
                    usernameInput.value
                );

            usernameInput.value =
                username;

            checkUsername(username);

        }
    );


    /* ==================================================
       OTOMATİK KULLANICI ADI
    ================================================== */

    suggestUsername.addEventListener(
        "click",
        (event) => {

            event.preventDefault();


            const suggestions = [

                "minegram_user",
                "minegram2026",
                "minegram01",
                "minegram_user1",
                "my_minegram",
                "minegram_official"

            ];


            let random =
                suggestions[
                    Math.floor(
                        Math.random() *
                        suggestions.length
                    )
                ];


            usernameInput.value =
                random;

            checkUsername(random);

        }
    );


    /* ==================================================
       İLERİ
    ================================================== */

    nextButton.addEventListener(
        "click",
        () => {

            const username =
                cleanUsername(
                    usernameInput.value
                );


            if (!usernameValid) {
                return;
            }


            /*
             * Kullanıcı adını sonraki kayıt
             * sayfasına gönderiyoruz.
             */

            window.location.href =
                "kayit-email.html?username=" +
                encodeURIComponent(
                    username
                );

        }
    );

</script>
