<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayıt ol - Minegram</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

.topbar{
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:25px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:34px;
    font-weight:300;
    line-height:1;
    cursor:pointer;
    user-select:none;
}

.top-title{
    margin-left:15px;
    font-size:20px;
    font-weight:700;
    color:#fff;
}

.content{
    width:317px;
    margin:115px auto 0;
}

.title{
    text-align:center;
    font-size:30px;
    line-height:1.15;
    font-weight:700;
    margin:0 0 34px;
    color:#fff;
}

.description{
    font-size:18px;
    line-height:1.45;
    color:#bdbdbd;
    margin:0 0 65px;
}

.input{
    display:block;
    width:100%;
    height:39px;
    padding:0 10px;
    border:1px solid #252525;
    border-radius:6px;
    background:#050505;
    color:#fff;
    outline:none;
    font-size:12px;
    font-family:Arial,Helvetica,sans-serif;
}

.input::placeholder{
    color:#777;
    opacity:1;
}

.input:focus{
    border-color:#555;
}

.suggest{
    display:block;
    width:100%;
    margin-top:12px;
    text-align:center;
    color:#008cff;
    font-size:12px;
    font-weight:400;
    text-decoration:none;
    cursor:pointer;
    line-height:1.4;
}

.suggest:hover{
    text-decoration:underline;
}

.continue-btn{
    display:block;
    width:100%;
    height:37px;
    margin-top:12px;
    border:0;
    border-radius:22px;
    background:#2677b5;
    color:#000;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.continue-btn:active{
    transform:scale(.99);
}

.continue-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    min-height:20px;
    margin-top:12px;
    text-align:center;
    font-size:11px;
    line-height:1.4;
    color:#ff5c5c;
}

.message.success{
    color:#55b8ff;
}

@media(max-width:600px){

    .topbar{
        height:70px;
        padding-left:28px;
    }

    .back{
        width:30px;
        height:38px;
        font-size:38px;
    }

    .top-title{
        margin-left:12px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 120px);
        max-width:365px;
        margin:105px auto 0;
    }

    .title{
        font-size:42px;
        margin-bottom:30px;
    }

    .description{
        font-size:21px;
        line-height:1.5;
        margin-bottom:55px;
    }

    .input{
        height:68px;
        padding:0 20px;
        font-size:18px;
        border:2px solid #686868;
        border-radius:9px;
    }

    .continue-btn{
        height:58px;
        margin-top:18px;
        font-size:20px;
        border-radius:32px;
    }

    .suggest{
        margin-top:25px;
        font-size:18px;
        font-weight:700;
        color:#62b5f5;
    }

    .message{
        font-size:14px;
    }
}

@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        max-width:365px;
        margin-top:65px;
    }

    .title{
        font-size:38px;
    }

    .description{
        font-size:20px;
    }
}

</style>

</head>

<body>

<div class="page">

<div class="topbar">

<div
    class="back"
    onclick="goBack()"
    aria-label="Geri"
>
    ‹
</div>

<div class="top-title">
    Kayıt ol
</div>

</div>

<main class="content">

<h1 class="title">
    Kullanıcı adı oluştur
</h1>

<p class="description">
    Önce Minegram hesabın için bir kullanıcı adı oluştur.
</p>

<input
    id="username"
    class="input"
    type="text"
    placeholder="Kullanıcı adı"
    autocomplete="username"
    autocapitalize="none"
    spellcheck="false"
    maxlength="30"
>

<a
    href="#"
    id="suggestUsername"
    class="suggest"
>
    Otomatik kullanıcı adı öner
</a>

<button
    id="continueBtn"
    class="continue-btn"
    type="button"
    disabled
>
    İleri
</button>

<div
    id="message"
    class="message"
></div>

</main>

</div>

<script type="module">

"use strict";


/* =========================
   FIREBASE
========================= */

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAP7bj8ZrpQu6FcJi_Ncl91L7rm-KukF4Y",

    authDomain:
        "mim-ea133.firebaseapp.com",

    databaseURL:
        "https://mim-ea133-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "mim-ea133",

    storageBucket:
        "mim-ea133.firebasestorage.app",

    messagingSenderId:
        "303525353436",

    appId:
        "1:303525353436:web:082fc090b5025e19942119",

    measurementId:
        "G-K962QE5P1R"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);

console.log(
    "[MINEGRAM] Firebase bağlantısı başarılı."
);


/* =========================
   ELEMENTLER
========================= */

const usernameInput =
    document.getElementById("username");

const continueBtn =
    document.getElementById("continueBtn");

const suggestUsername =
    document.getElementById("suggestUsername");

const message =
    document.getElementById("message");


/* =========================
   DURUM
========================= */

let usernameAvailable = false;
let checkingUsername = false;


/* =========================
   MESAJ
========================= */

function showMessage(text, success = false){

    message.textContent = text || "";

    message.className =
        success
            ? "message success"
            : "message";

}


/* =========================
   GERİ
========================= */

function goBack(){

    if(history.length > 1){

        history.back();

    }else{

        window.location.href =
            "giris.html";

    }

}


/* =========================
   KULLANICI ADI TEMİZLE
========================= */

function cleanUsername(value){

    return value
        .trim()
        .replace(/^@/, "")
        .toLowerCase();

}


/* =========================
   GEÇERLİ Mİ?
========================= */

function validUsername(username){

    return /^[a-zA-Z0-9_.]{3,30}$/.test(username);

}


/* =========================
   KULLANICI ADI KONTROLÜ
========================= */

async function checkUsername(){

    const username =
        cleanUsername(
            usernameInput.value
        );


    usernameAvailable = false;
    continueBtn.disabled = true;


    if(!username){

        showMessage("");

        return;

    }


    if(!validUsername(username)){

        showMessage(
            "Kullanıcı adı 3-30 karakter olmalı."
        );

        return;

    }


    checkingUsername = true;

    continueBtn.disabled = true;

    continueBtn.textContent =
        "Kontrol ediliyor...";


    try{

        const usernameRef =
            doc(
                db,
                "usernames",
                username
            );


        const usernameDoc =
            await getDoc(
                usernameRef
            );


        /*
         * Kullanıcı adı mevcutsa
         */

        if(usernameDoc.exists()){

            usernameAvailable = false;

            showMessage(
                "Bu kullanıcı adı zaten alınmış."
            );

        }

        /*
         * Kullanıcı adı boşsa
         */

        else{

            usernameAvailable = true;

            showMessage(
                "Kullanıcı adı kullanılabilir.",
                true
            );

            continueBtn.disabled = false;

        }


    }catch(error){

        console.error(
            "[MINEGRAM FIREBASE]",
            error
        );


        usernameAvailable = false;

        continueBtn.disabled = true;


        /*
         * Firebase Rules hatasını
         * kullanıcıya daha anlaşılır göster.
         */

        if(
            error.code ===
            "permission-denied"
        ){

            showMessage(
                "Kullanıcı adı kontrolüne izin verilmiyor. Firebase Rules ayarlarını kontrol et."
            );

        }else{

            showMessage(
                "Bir hata oluştu. Lütfen tekrar dene."
            );

        }

    }


    checkingUsername = false;

    continueBtn.textContent =
        "İleri";

}


/* =========================
   INPUT
========================= */

usernameInput.addEventListener(
    "input",
    function(){

        usernameInput.value =
            cleanUsername(
                usernameInput.value
            );


        usernameAvailable = false;

        continueBtn.disabled = true;

        showMessage("");


        clearTimeout(
            usernameInput.checkTimer
        );


        usernameInput.checkTimer =
            setTimeout(
                checkUsername,
                500
            );

    }
);


/* =========================
   ÖNERİ
========================= */

suggestUsername.addEventListener(
    "click",
    function(event){

        event.preventDefault();


        const suggestions = [

            "minegram_user",
            "minegram2026",
            "minegram01",
            "minegram_user1",
            "minegram123",
            "mine_user"

        ];


        const random =
            suggestions[
                Math.floor(
                    Math.random() *
                    suggestions.length
                )
            ];


        usernameInput.value =
            random;


        clearTimeout(
            usernameInput.checkTimer
        );


        checkUsername();

    }
);


/* =========================
   İLERİ
========================= */

continueBtn.addEventListener(
    "click",
    function(){

        if(checkingUsername){

            return;

        }


        const username =
            cleanUsername(
                usernameInput.value
            );


        if(!validUsername(username)){

            showMessage(
                "Geçerli bir kullanıcı adı gir."
            );

            return;

        }


        if(!usernameAvailable){

            showMessage(
                "Önce kullanıcı adının uygunluğunu kontrol et."
            );

            return;

        }


        window.location.href =
            "kayit-email.html?username=" +
            encodeURIComponent(username);

    }
);


/* =========================
   ENTER
========================= */

usernameInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();


            if(
                !continueBtn.disabled &&
                usernameAvailable
            ){

                continueBtn.click();

            }

        }

    }
);

</script>

</body>
</html>
