<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kayıt ol - Minegram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
}

.topbar{
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    padding-left:38px;
}

.back{
    width:25px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:34px;
    font-weight:300;
    line-height:1;
    cursor:pointer;
    user-select:none;
}

.top-title{
    margin-left:15px;
    font-size:20px;
    font-weight:700;
    color:#fff;
}

.content{
    width:317px;
    margin:115px auto 0;
}

.title{
    text-align:center;
    font-size:30px;
    line-height:1.15;
    font-weight:700;
    margin:0 0 34px;
    color:#fff;
}

.description{
    font-size:18px;
    line-height:1.45;
    color:#bdbdbd;
    margin:0 0 65px;
}

.email-input{
    display:block;
    width:100%;
    height:39px;
    padding:0 10px;
    border:1px solid #252525;
    border-radius:6px;
    background:#050505;
    color:#fff;
    outline:none;
    font-size:12px;
}

.email-input::placeholder{
    color:#777;
}

.email-input:focus{
    border-color:#555;
}

.message{
    min-height:18px;
    margin-top:12px;
    text-align:center;
    font-size:11px;
    line-height:1.4;
    color:#ff5c5c;
}

.message.success{
    color:#55b8ff;
}

.next-button{
    display:block;
    width:317px;
    height:37px;
    margin:18px auto 0;
    border:0;
    border-radius:22px;
    background:#2677b5;
    color:#000;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.next-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

@media(max-width:600px){

    .topbar{
        height:70px;
        padding-left:28px;
    }

    .back{
        width:30px;
        height:38px;
        font-size:38px;
    }

    .top-title{
        margin-left:12px;
        font-size:21px;
    }

    .content{
        width:calc(100% - 40px);
        max-width:714px;
        margin:105px auto 0;
    }

    .title{
        font-size:42px;
        margin-bottom:30px;
    }

    .description{
        font-size:21px;
        line-height:1.5;
        margin-bottom:55px;
    }

    .email-input{
        height:68px;
        padding:0 20px;
        font-size:18px;
        border:2px solid #686868;
        border-radius:9px;
    }

    .message{
        font-size:14px;
    }

    .next-button{
        width:100%;
        height:58px;
        margin:25px auto 30px;
        font-size:20px;
        border-radius:32px;
    }
}

@media(max-width:430px){

    .content{
        width:calc(100% - 40px);
        margin-top:65px;
    }

    .title{
        font-size:38px;
    }

    .description{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="topbar">

        <div
            class="back"
            id="backButton"
            aria-label="Geri"
        >‹</div>

        <div class="top-title">
            Kayıt ol
        </div>

    </div>


    <main class="content">

        <h1 class="title">
            Hesap oluştur
        </h1>

        <p class="description">
            Minegram hesabın için e-posta adresini gir.
        </p>

        <input
            type="email"
            id="email"
            class="email-input"
            placeholder="E-posta adresi"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            maxlength="254"
        >

        <div
            id="message"
            class="message"
        ></div>

        <button
            type="button"
            id="nextButton"
            class="next-button"
        >
            İleri
        </button>

    </main>

</div>


<script>

"use strict";


const emailInput =
    document.getElementById("email");

const nextButton =
    document.getElementById("nextButton");

const message =
    document.getElementById("message");

const backButton =
    document.getElementById("backButton");


function showMessage(
    text,
    success=false
){

    message.textContent =
        text || "";

    message.className =
        "message";

    if(success){

        message.classList.add("success");

    }

}


function validEmail(email){

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

}


/* =========================================
   GERİ
========================================= */

backButton.addEventListener(
    "click",
    function(){

        window.location.href =
            "giris.html";

    }
);


/* =========================================
   DEVAM
========================================= */

function goNext(){

    const email =
        emailInput.value
            .trim()
            .toLowerCase();


    showMessage("");


    if(!email){

        showMessage(
            "E-posta adresini gir."
        );

        emailInput.focus();

        return;

    }


    if(!validEmail(email)){

        showMessage(
            "Geçerli bir e-posta adresi gir."
        );

        emailInput.focus();

        return;

    }


    /*
     * SADECE E-POSTA SAKLANIYOR.
     * ŞİFRE HENÜZ YOK.
     */

    sessionStorage.setItem(
        "minegram_register_email",
        email
    );


    nextButton.disabled = true;

    nextButton.textContent =
        "Devam ediliyor...";


    window.location.href =
        "sifre-olustur.html";

}


nextButton.addEventListener(
    "click",
    goNext
);


emailInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            goNext();

        }

    }
);

</script>

</body>
</html>
