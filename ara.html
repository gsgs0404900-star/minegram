<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keşfet - Minegram</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif
}
body{padding-bottom:76px}
button,input,select{font:inherit}
button{cursor:pointer}

/* TOP */
.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#000;
  border-bottom:1px solid #222;
  padding:12px 12px 10px
}
.title{
  margin-bottom:10px;
  font-size:21px;
  font-weight:800
}
.search{
  display:flex;
  align-items:center;
  gap:8px;
  height:44px;
  padding:0 12px;
  background:#202020;
  border-radius:12px
}
.search-icon{
  flex:0 0 auto;
  color:#aaa;
  font-size:20px
}
.search input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:none;
  color:#fff;
  font-size:16px
}
.search input::placeholder{color:#888}
.clear,.tag-back{
  display:none;
  flex:0 0 auto;
  border:0;
  background:none;
  color:#aaa
}
.clear{font-size:22px}
.tag-back{font-size:30px;line-height:1}

/* CONTENT */
.content{min-height:calc(100vh - 125px)}
.loading,.empty{
  padding:34px 20px;
  text-align:center;
  color:#888
}
.section-title{
  padding:12px;
  font-size:18px;
  font-weight:800
}

/* SADE KULLANICI ARAMA */
.users{border-bottom:1px solid #222}
.user{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 14px;
  border-bottom:1px solid #191919;
  cursor:pointer
}
.user-info{
  min-width:0;
  flex:1
}
.user-name-row{
  display:flex;
  align-items:center;
  min-width:0;
  width:100%
}
.username{
  min-width:0;
  font-size:16px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.sub{
  margin-top:5px;
  color:#888;
  font-size:12px
}
.avatar{
  width:55px;
  height:55px;
  flex:0 0 55px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:50%;
  background:#2196f3;
  color:#fff;
  font-size:20px;
  font-weight:800
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}
.story-ring{
  padding:2px;
  border-radius:50%;
  background:conic-gradient(#f9ce34,#ee2a7b,#6228d7,#f9ce34)
}
.story-ring .avatar{border:2px solid #000}

/* TAG */
.tag-result{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  border-bottom:1px solid #222;
  cursor:pointer
}
.tag-icon{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#333;
  font-size:24px;
  font-weight:800
}
.tag-search-head{
  padding:14px 12px 8px;
  font-size:18px;
  font-weight:800
}
.tag-search-count{
  padding:0 12px 12px;
  color:#888;
  font-size:13px
}
.tag-empty{
  padding:50px 20px;
  text-align:center;
  color:#888
}
.hashtag{
  color:#4da3ff;
  font-weight:700;
  cursor:pointer
}
.hashtag:hover{text-decoration:underline}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  padding:2px
}
.tile{
  position:relative;
  aspect-ratio:9/16;
  overflow:hidden;
  background:#111;
  cursor:pointer
}
.tile img,.tile video{
  width:100%;
  height:100%;
  object-fit:cover
}
.play{
  position:absolute;
  top:6px;
  right:6px;
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#0009;
  font-size:14px
}
.discovery-tile{min-width:0}
.discovery-user{
  position:absolute;
  left:6px;
  right:6px;
  bottom:6px;
  z-index:5;
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
  padding:5px 7px;
  border-radius:9px;
  background:linear-gradient(transparent,#000b);
  font-size:11px;
  cursor:pointer
}
.discovery-user img,
.discovery-user span{
  width:24px;
  height:24px;
  flex:0 0 24px;
  border-radius:50%;
  object-fit:cover;
  display:grid;
  place-items:center;
  background:#333
}
.discovery-user b{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.discovery-time{
  position:absolute;
  top:6px;
  left:6px;
  padding:3px 6px;
  border-radius:7px;
  background:#0009;
  color:#fff;
  font-size:10px
}
.discovery-caption{
  position:absolute;
  left:6px;
  right:6px;
  bottom:6px;
  z-index:4;
  padding:30px 6px 4px;
  background:linear-gradient(transparent,#000c);
  font-size:11px;
  line-height:1.3;
  pointer-events:none
}
.discovery-caption .hashtag{pointer-events:auto}

/* POSTS */
.posts{padding-bottom:20px}
.post{
  padding:12px;
  border-bottom:1px solid #222
}
.post-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:9px;
  cursor:pointer
}
.post-head .avatar{
  width:38px;
  height:38px;
  flex-basis:38px;
  font-size:14px
}
.post-media{
  width:100%;
  max-height:600px;
  border-radius:8px;
  object-fit:cover;
  background:#111
}
.caption{
  margin-top:8px;
  font-size:14px;
  line-height:1.4
}

/* ALT BAR - DEĞİŞTİRİLMEDİ */
.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:9999;
  display:flex;
  align-items:stretch;
  width:100%;
  height:76px;
  padding:5px max(8px,calc((100% - 760px)/2)) env(safe-area-inset-bottom);
  background:#121018;
  border-top:1px solid #201d27
}
.nav a{
  flex:1 1 0;
  min-width:0;
  height:66px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:#ddd;
  text-decoration:none;
  font-size:9px;
  -webkit-tap-highlight-color:transparent
}
.nav-icon{
  width:45px;
  height:32px;
  display:grid;
  place-items:center;
  border-radius:18px
}
.nav a.active .nav-icon{background:#3b3150}
.svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

/* REELS */
.reel-viewer{
  position:fixed;
  inset:0;
  z-index:10000;
  display:none;
  overflow:hidden;
  background:#000
}
.reel-viewer.show{display:block}
.reel-viewer-shell{
  width:100%;
  height:100%;
  background:#000
}
.reel-phone{
  position:relative;
  width:390px;
  height:100%;
  min-height:0;
  max-height:896px;
  margin:0 auto;
  overflow:hidden;
  background:#000
}
.reel-feed{
  width:100%;
  height:100%;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scrollbar-width:none
}
.reel-feed::-webkit-scrollbar{display:none}
.reel{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  scroll-snap-align:start
}
.reel-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
  cursor:pointer
}
.reel-shade{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.08) 42%,transparent 67%);
  pointer-events:none
}
.reel-back{
  position:absolute;
  top:12px;
  left:12px;
  z-index:20;
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border:0;
  background:transparent;
  color:#fff;
  font-size:36px;
  font-weight:300;
  text-shadow:0 1px 3px #000
}
.reel-center-play{
  position:absolute;
  top:50%;
  left:50%;
  z-index:15;
  width:58px;
  height:58px;
  display:none;
  place-items:center;
  transform:translate(-50%,-50%);
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.48);
  color:#fff
}
.reel-center-play svg{
  width:30px;
  height:30px;
  fill:currentColor
}
.reel-progress{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  height:46px;
  display:flex;
  align-items:center;
  gap:4px;
  padding:0 8px;
  background:rgba(0,0,0,.9)
}
.reel-time{
  width:82px;
  min-width:82px;
  color:#fff;
  font-size:12px;
  font-variant-numeric:tabular-nums;
  text-align:left;
  white-space:nowrap
}
.reel-range{
  flex:1;
  min-width:0;
  height:4px;
  appearance:none;
  -webkit-appearance:none;
  margin:0;
  border-radius:99px;
  outline:none;
  background:#4b435d;
  cursor:pointer
}
.reel-range::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:12px;
  height:12px;
  border:0;
  border-radius:50%;
  background:#fff
}
.reel-range::-moz-range-thumb{
  width:12px;
  height:12px;
  border:0;
  border-radius:50%;
  background:#fff
}
.reel-sound{
  width:30px;
  height:30px;
  flex:0 0 30px;
  display:grid;
  place-items:center;
  padding:0;
  border:0;
  background:transparent;
  color:#fff;
  text-shadow:0 1px 3px #000
}
.reel-sound svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round
}
.reel-sound .mute-slash{display:none}
.reel-sound.muted .mute-slash{display:block}
.reel-actions{
  position:absolute;
  right:12px;
  bottom:106px;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px
}
.reel-action{
  width:52px;
  min-height:48px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:0;
  border:0;
  background:transparent;
  color:#fff;
  text-shadow:0 2px 5px #000
}
.reel-action .ico{
  width:27px;
  height:27px;
  display:grid;
  place-items:center
}
.reel-action .ico svg{
  width:26px;
  height:26px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round
}
.reel-action.liked{color:#ff3150}
.reel-action.liked .ico svg{fill:currentColor}
.reel-action .num{
  font-size:13px;
  font-weight:700
}
.reel-info{
  position:absolute;
  left:18px;
  right:72px;
  bottom:24px;
  z-index:20;
  text-shadow:0 2px 5px #000
}
.reel-user-row{
  display:flex;
  align-items:center;
  gap:8px
}
.reel-avatar{
  width:46px;
  height:46px;
  flex:0 0 46px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:50%;
  background:#3f91cc;
  color:#fff;
  font-size:18px;
  font-weight:800;
  cursor:pointer
}
.reel-avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}
.reel-user-col{
  flex:0 0 auto;
  min-width:0;
  max-width:150px
}
.reel-username{
  font-size:16px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer
}
.reel-follow-btn{
  flex:0 0 auto;
  min-width:78px;
  height:30px;
  padding:0 10px;
  margin-left:2px;
  border:0;
  border-radius:8px;
  background:#2196f3;
  color:#fff;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
  text-shadow:none
}
.reel-follow-btn.following{
  background:#333;
  color:#fff
}
.reel-follow-btn:disabled{
  opacity:.6;
  cursor:default
}
.reel-date{
  margin:2px 0 0 54px;
  color:#bbb;
  font-size:12px
}
.reel-description{
  margin-top:6px;
  font-size:15px;
  line-height:1.35
}

/* COMMENTS */
.comments-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  z-index:250;
  display:none;
  align-items:flex-end
}
.comments-modal.open{display:flex}
.comments-sheet{
  width:min(680px,100%);
  height:min(78vh,720px);
  margin:0 auto;
  background:#171b1e;
  border-radius:28px 28px 0 0;
  display:flex;
  flex-direction:column;
  overflow:hidden
}
.sheet-head{
  height:88px;
  position:relative;
  border-bottom:1px solid #25292c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:700
}
.grab{
  position:absolute;
  top:10px;
  width:74px;
  height:8px;
  border-radius:9px;
  background:#9aa0a9
}
.close-comments{
  position:absolute;
  left:20px;
  top:28px;
  background:none;
  border:0;
  color:#fff;
  font-size:34px;
  cursor:pointer
}
.sort{
  padding:12px 22px;
  border-bottom:1px solid #25292c
}
.sort-select{
  width:100%;
  height:42px;
  border:0;
  border-radius:10px;
  background:#20252a;
  color:#f5f5f5;
  padding:0 12px;
  font-size:15px;
  font-weight:700;
  outline:none
}
.comment-list{
  flex:1;
  overflow:auto;
  padding:0 22px 15px
}
.comment-row{
  display:flex;
  gap:12px;
  padding:13px 0
}
.comment-body{
  flex:1;
  min-width:0
}
.comment-user{
  font-size:15px;
  font-weight:700;
  cursor:pointer
}
.comment-text{
  font-size:15px;
  margin-top:5px;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}
.comment-meta{
  font-size:12px;
  color:#92979f;
  margin-top:8px
}
.reply-link{
  border:0;
  background:transparent;
  color:#858b94;
  padding:0;
  margin:0;
  font:inherit;
  font-weight:600;
  cursor:pointer
}
.reply-link:hover{color:#aeb4bd}
.replies{
  margin-left:52px;
  border-left:1px solid #2c3035;
  padding-left:12px
}
.replies.hidden{display:none}
.comment-like{
  width:34px;
  background:none;
  border:0;
  color:#fff;
  font-size:21px;
  cursor:pointer;
  align-self:flex-start;
  transition:transform .12s,color .15s
}
.comment-like.liked{color:#ed1b3a}
.comment-like:active{transform:scale(.85)}
.emoji-row{
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:10px 20px 5px;
  gap:4px
}
.emoji-row button{
  width:40px;
  height:40px;
  padding:0;
  border:0;
  background:transparent;
  color:#fff;
  font-size:27px;
  cursor:pointer;
  display:grid;
  place-items:center;
  border-radius:10px
}
.emoji-row button:hover{background:#252a2f}
.comment-compose{
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px 16px 18px
}
.compose-input{
  flex:1;
  min-width:0;
  height:58px;
  border:1px solid #3b3e42;
  border-radius:16px;
  background:#171b1e;
  color:#fff;
  padding:0 15px;
  font-size:15px;
  outline:none
}
.compose-input:focus{border-color:#3f91cc}
.gif{
  height:52px;
  padding:0 15px;
  border:0;
  border-radius:15px;
  background:#20252a;
  color:#fff;
  font-weight:700
}
.send{
  height:52px;
  width:52px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:27px;
  cursor:pointer
}
.send:disabled{
  opacity:.5;
  cursor:not-allowed
}

/* MENU */
.menu-backdrop{
  position:fixed;
  inset:0;
  z-index:12000;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.55)
}
.menu-backdrop.open{display:flex}
.post-menu{
  width:min(520px,100%);
  padding:10px;
  border-radius:20px 20px 0 0;
  background:#111
}
.toast{
  position:fixed;
  left:50%;
  bottom:95px;
  z-index:15000;
  transform:translateX(-50%);
  padding:10px 15px;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-size:13px;
  display:none
}
.toast.show{display:block}

@media(min-width:700px){
  .content,.top{
    max-width:700px;
    margin:auto
  }
  .reel-phone{width:390px}
}
@media(max-width:699px){
  .reel-phone{width:100vw}
  .reel-back{
    top:10px;
    left:8px
  }
  .reel-info{bottom:24px}
  .reel-actions{bottom:105px}
}
</style>
</head>

<body>

<header class="top">
  <div class="title">Keşfet</div>

  <div class="search">

    <span class="search-icon">⌕</span>

    <button
      type="button"
      class="tag-back"
      id="tagBack"
      aria-label="Geri"
    >‹</button>

    <input
      id="sq"
      autocomplete="off"
      placeholder="#etiket veya kullanıcı adı ara"
    >

    <button
      type="button"
      class="clear"
      id="clear"
      aria-label="Temizle"
    >×</button>

  </div>
</header>

<main id="content" class="content"></main>

<!-- ALT BAR AYNI -->
<nav class="nav">

  <a href="index.html">
    <span class="nav-icon">
      <svg class="svg" viewBox="0 0 24 24">
        <path d="M3 11.5 12 4l9 7.5"></path>
        <path d="M5 10.5V20h14v-9.5"></path>
      </svg>
    </span>
    Ana Sayfa
  </a>

  <a href="ara.html" class="active">
    <span class="nav-icon">
      <svg class="svg" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6"></circle>
        <path d="m16 16 5 5"></path>
      </svg>
    </span>
    Keşfet
  </a>

  <a href="paylas.html">
    <span class="nav-icon">
      <svg class="svg" viewBox="0 0 24 24">
        <path d="M12 5v14"></path>
        <path d="M5 12h14"></path>
      </svg>
    </span>
    Paylaş
  </a>

  <a href="bildirimler.html">
    <span class="nav-icon">
      <svg class="svg" viewBox="0 0 24 24">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
        <path d="M10 21h4"></path>
      </svg>
    </span>
    Bildirim
  </a>

  <a href="profil.html">
    <span class="nav-icon">
      <svg class="svg" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21c1.5-4 4-6 8-6s6.5 2 8 6"></path>
      </svg>
    </span>
    Profil
  </a>

</nav>

<!-- REEL VIEWER -->
<div class="reel-viewer" id="viewer">
  <div class="reel-viewer-shell">
    <div class="reel-phone">
      <div id="viewerFeed" class="reel-feed"></div>
    </div>
  </div>
</div>

<!-- MENU -->
<div
  id="menuBackdrop"
  class="menu-backdrop"
  onclick="closeMenu(event)"
>
  <div
    id="postMenu"
    class="post-menu"
    onclick="event.stopPropagation()"
  ></div>
</div>

<!-- COMMENTS -->
<div
  id="commentsModal"
  class="comments-modal"
  onclick="closeComments(event)"
>
  <div
    class="comments-sheet"
    onclick="event.stopPropagation()"
  >

    <div class="sheet-head">
      <span class="grab"></span>

      <button
        class="close-comments"
        onclick="closeComments()"
      >×</button>

      Yorumlar
    </div>

    <div class="sort">
      <select
        id="commentSort"
        class="sort-select"
        onchange="changeCommentSort(this.value)"
      >
        <option value="forYou">Senin için</option>
        <option value="newest">En yeni</option>

<script>

const API="/api";

const token=
  localStorage.getItem("minegram_token")||
  localStorage.getItem("minegram_supabase_token")||
  "";

const $=id=>document.getElementById(id);

const content=$("content");
const input=$("sq");
const clearButton=$("clear");
const tagBack=$("tagBack");

let users=[];
let stories=[];
let feed=[];
let reels=[];

let currentUsername="";
let followingUsers=new Set();

let selectedTag="";
let searchTimer=null;

let viewerObserver=null;
let currentViewerComment=null;
let currentCommentPost=null;
let currentCommentSort="forYou";
let replyingTo=null;

const viewerSeen=new Set();


function esc(value=""){
  return String(value).replace(
    /[&<>'"]/g,
    char=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"
    }[char])
  );
}


function normalizeUsername(value=""){
  return String(value)
    .replace(/^@/,"")
    .trim()
    .toLowerCase();
}


function escapeRegExp(value=""){
  return String(value).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}


function hashtagHtml(text=""){

  const safe=esc(text);

  return safe.replace(
    /(^|[\s(])#([\p{L}\p{N}_]+)/gu,
    (full,before,tag)=>{

      return before+
        `<span
          class="hashtag"
          data-hashtag="${esc(tag)}"
          onclick="openHashtag(event,'#${esc(tag)}')"
        >#${esc(tag)}</span>`;

    }
  );
}


function hasExactHashtag(text,tag){

  const clean=
    String(tag||"")
      .replace(/^#/,"")
      .trim()
      .toLowerCase();

  if(!clean)return false;

  const regex=new RegExp(
    "(^|[^\\p{L}\\p{N}_])#"+
    escapeRegExp(clean)+
    "(?![\\p{L}\\p{N}_])",
    "iu"
  );

  return regex.test(String(text||""));
}


/* HASHTAG TIKLAMA */
function openHashtag(event,tag){

  event?.preventDefault();
  event?.stopPropagation();

  const clean=String(tag||"").trim();

  if(!clean)return;

  try{
    sessionStorage.setItem(
      "minegram_search_tag",
      clean
    );
  }catch{}

  location.href=
    "ara.html?query="+
    encodeURIComponent(clean);
}


async function api(path,options={}){

  const headers=Object.assign(
    {Accept:"application/json"},
    options.headers||{}
  );

  if(token){
    headers.Authorization="Bearer "+token;
  }

  const requestOptions={
    ...options,
    headers
  };

  if(
    requestOptions.body &&
    typeof requestOptions.body==="object" &&
    !(requestOptions.body instanceof FormData)
  ){

    requestOptions.headers={
      ...requestOptions.headers,
      "Content-Type":"application/json"
    };

    requestOptions.body=
      JSON.stringify(requestOptions.body);
  }

  const response=await fetch(
    API+path,
    requestOptions
  );

  const text=await response.text();

  let data;

  try{
    data=JSON.parse(text);
  }catch{
    data=text;
  }

  if(!response.ok){

    throw new Error(
      data?.error||
      data?.message||
      response.statusText||
      "API hatası"
    );
  }

  return data;
}


function getAvatar(user){

  return(
    user?.avatar||
    user?.avatar_url||
    user?.avatarUrl||
    user?.profile?.avatar||
    user?.profile?.avatar_url||
    user?.profile?.avatarUrl||
    ""
  );
}


function privateUser(user){

  const settings=user?.settings||{};

  return Boolean(
    settings.private_account||
    settings.privateAccount||
    settings.private||
    user?.private_account||
    user?.privateAccount||
    user?.is_private||
    user?.isPrivate||
    user?.private
  );
}


function storyFor(username){

  const wanted=normalizeUsername(username);

  return stories.filter(story=>
    normalizeUsername(
      story?.username||
      story?.user?.username||
      story?.profile?.username||
      ""
    )===wanted
  );
}


function isVideo(post){

  const mediaType=String(
    post?.media_type||
    post?.mediaType||
    post?.type||
    ""
  ).toLowerCase();

  const url=String(
    post?.media||
    post?.media_url||
    post?.mediaUrl||
    post?.mediaUri||
    post?.video||
    post?.videoUrl||
    post?.video_url||
    post?.reel||
    post?.reelUrl||
    post?.reel_url||
    post?.url||
    post?.fileUrl||
    post?.file_url||
    ""
  ).toLowerCase();

  return(
    mediaType.includes("video")||
    mediaType.includes("reel")||
    /\.(mp4|webm|mov|m4v|3gp)(\?|$)/.test(url)
  );
}


function mediaUrl(post){

  return(
    post?.media||
    post?.media_url||
    post?.mediaUrl||
    post?.mediaUri||
    post?.video||
    post?.videoUrl||
    post?.video_url||
    post?.reel||
    post?.reelUrl||
    post?.reel_url||
    post?.url||
    post?.fileUrl||
    post?.file_url||
    ""
  );
}


function postText(post){

  return(
    post?.text||
    post?.caption||
    post?.description||
    ""
  );
}


function postId(post){

  return(
    post?.id??
    post?.post_id??
    post?.postId??
    ""
  );
}


function avatarHtml(url,username,story=false){

  const letter=esc(
    (username||"?")
      .slice(0,1)
      .toUpperCase()
  );

  const image=url
    ?`<img class="avatar" src="${esc(url)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid';">`
    :"";

  const fallback=
    `<span class="avatar" style="${url?"display:none":""}">${letter}</span>`;

  if(story){

    return`
      <div class="story-ring">
        ${image}
        ${fallback}
      </div>
    `;
  }

  return image+fallback;
}


function extractFollowingList(source){

  const candidates=[
    source?.following,
    source?.followingUsers,
    source?.following_users,
    source?.data?.following,
    source?.data?.followingUsers,
    source?.data?.following_users,
    source?.user?.following,
    source?.user?.followingUsers,
    source?.user?.following_users,
    source?.profile?.following,
    source?.profile?.followingUsers,
    source?.profile?.following_users
  ];

  return candidates.find(Array.isArray)||[];
}


function loadFollowingFromMe(me){

  followingUsers=new Set();

  const list=extractFollowingList(me);

  list.forEach(item=>{

    const username=
      typeof item==="string"
        ?item
        :(
          item?.username||
          item?.user?.username||
          item?.profile?.username||
          ""
        );

    const key=normalizeUsername(username);

    if(key)followingUsers.add(key);

  });
}


async function loadData(){

  content.innerHTML=
    '<div class="loading">Yükleniyor...</div>';

  try{

    const me=await api("/me");

    if(!me)throw new Error("auth");

    const meUser=
      me?.user||
      me?.profile||
      me;

    currentUsername=
      normalizeUsername(
        meUser?.username||
        me?.username||
        me?.user?.username||
        me?.profile?.username||
        ""
      );

    loadFollowingFromMe(me);

    const avatar=getAvatar(meUser);

    if(avatar){

      const composeAvatar=$("composeAvatar");

      if(composeAvatar){

        composeAvatar.innerHTML=
          `<img src="${esc(avatar)}" style="width:100%;height:100%;object-fit:cover" alt="">`;

      }
    }

  }catch{

    location.href="giris.html";
    return;
  }

  try{

    const[
      feedResponse,
      storyResponse
    ]=await Promise.all([

      api("/feed?ts="+Date.now()),

      api(
        "/stories?ts="+Date.now()
      ).catch(()=>[])

    ]);

    feed=
      Array.isArray(feedResponse)
        ?feedResponse
        :(
          feedResponse?.posts||
          feedResponse?.data||
          feedResponse?.items||
          []
        );

    stories=
      Array.isArray(storyResponse)
        ?storyResponse
        :(
          storyResponse?.stories||
          storyResponse?.data||
          storyResponse?.items||
          []
        );

    normalizeReels();
    renderDiscovery();

  }catch{

    content.innerHTML=
      '<div class="empty">İçerikler alınamadı. Tekrar deneyin.</div>';
  }
}


/* KULLANICI ARAMA */
async function searchUsers(query){

  try{

    const data=await api(
      "/search?q="+
      encodeURIComponent(query)
    );

    const array=
      Array.isArray(data)
        ?data
        :(
          data?.users||
          data?.results||
          data?.profiles||
          data?.data||
          data?.items||
          []
        );

    return array
      .map(user=>{

        const profile=
          user?.user||
          user?.profile||
          {};

        const username=
          String(
            user?.username||
            profile?.username||
            user?.name||
            ""
          )
          .trim()
          .replace(/^@/,"");

        if(!username)return null;

        return{
          username,
          avatar:
            getAvatar(user)||
            getAvatar(profile),
          private:
            privateUser(user)||
            privateUser(profile)
        };

      })
      .filter(Boolean)
      .filter(
        (user,index,array)=>
          index===
          array.findIndex(
            item=>
              normalizeUsername(item.username)===
              normalizeUsername(user.username)
          )
      );

  }catch{

    return[];
  }
}


/*
  KULLANICI SONUÇLARI SADELEŞTİRİLDİ.
  TAKİP ET / TAKİP EDİLİYOR BUTONU YOK.
*/
function renderUsers(array){

  if(!array.length){

    content.innerHTML=
      '<div class="empty">Kullanıcı bulunamadı</div>';

    return;
  }

  content.innerHTML=`

    <div class="users">

      ${array.map(user=>{

        const username=
          String(user.username||"")
            .replace(/^@/,"")
            .trim();

        const storiesForUser=
          storyFor(username);

        const hasStory=
          !user.private&&
          storiesForUser.length>0;

        return`

          <div
            class="user"
            data-user="${esc(username)}"
            data-story="${hasStory?"1":"0"}"
          >

            ${avatarHtml(
              user.avatar,
              username,
              hasStory
            )}

            <div class="user-info">

              <div class="user-name-row">
                <div class="username">
                  @${esc(username)}
                </div>
              </div>

              <div class="sub">
                ${
                  hasStory
                    ?"Hikayeyi görmek için fotoğrafa dokun"
                    :"Profili görüntüle"
                }
              </div>

            </div>

          </div>

        `;

      }).join("")}

    </div>
  `;

  document
    .querySelectorAll("[data-user]")
    .forEach(element=>{

      element.onclick=event=>{

        const username=
          element.dataset.user;

        if(
          element.dataset.story==="1"&&
          element.querySelector(".story-ring")
        ){

          openStory(username);

        }else{

          openProfile(username);

        }
      };
    });
}


/* REELS */
function normalizeReels(){

  reels=
    feed
      .filter(isVideo)
      .map(post=>{

        const user=
          post?.user||
          post?.profile||
          {};

        return{

          id:postId(post),

          username:
            String(
              post?.username||
              user?.username||
              ""
            )
            .replace(/^@/,"")
            .trim(),

          description:postText(post),
          mediaUri:mediaUrl(post),

          likes:
            Array.isArray(post?.likes)
              ?post.likes.length
              :Number(post?.likes||0),

          views:Number(
            post?.views||
            post?.view_count||
            post?.viewCount||
            0
          ),

          commentCount:Number(
            post?.commentCount||
            post?.comment_count||
            0
          ),

          date:
            post?.date||
            post?.createdAt||
            post?.created_at||
            "",

          avatar:
            getAvatar(post)||
            getAvatar(user),

          raw:post
        };

      })
      .filter(
        reel=>
          reel.username&&
          reel.mediaUri
      )
      .filter(
        (reel,index,array)=>
          index===
          array.findIndex(
            item=>
              String(item.id)===String(reel.id)&&
              normalizeUsername(item.username)===
              normalizeUsername(reel.username)&&
              item.mediaUri===reel.mediaUri
          )
      );
}


/* GÖNDERİYİ DOĞRUDAN AÇ */
function openPostById(id){

  if(!id){

    showToast(
      "Gönderi bulunamadı."
    );

    return;
  }

  location.href=
    "post.html?id="+
    encodeURIComponent(id);
}


/* KEŞFET */
function renderDiscovery(){

  const discoveryPosts=
    feed
      .filter(post=>mediaUrl(post))
      .map(post=>{

        const id=postId(post);
        const video=isVideo(post);
        const media=mediaUrl(post);

        const reelIndex=
          reels.findIndex(
            reel=>
              String(reel.id)===
              String(id)
          );

        return{
          post,
          id,
          video,
          media,
          reelIndex
        };
      });

  if(!discoveryPosts.length){

    content.innerHTML=`
      <div class="empty">
        <div style="font-size:52px">⌕</div>
        <div>Keşfetmek için içerik bulunamadı</div>
      </div>
    `;

    return;
  }

  content.innerHTML=`

    <div class="section-title">
      Keşfet
    </div>

    <div class="grid">

      ${discoveryPosts.map(item=>{

        const post=item.post;

        const user=
          post?.user||
          post?.profile||
          {};

        const username=
          String(
            post?.username||
            user?.username||
            ""
          )
          .replace(/^@/,"")
          .trim();

        const avatar=
          getAvatar(post)||
          getAvatar(user);

        const initial=esc(
          (username||"?")
            .slice(0,1)
            .toUpperCase()
        );

        const time=relativeTime(
          post?.createdAt||
          post?.created_at||
          post?.date||
          post?.timestamp
        );

        const text=postText(post);

        return`

          <div
            class="tile discovery-tile"
            data-discovery-id="${esc(item.id)}"
            data-reel-index="${item.reelIndex}"
            data-username="${esc(username)}"
          >

            ${
              item.video
                ?`
                  <video
                    src="${esc(item.media)}"
                    muted
                    playsinline
                    preload="metadata"
                  ></video>

                  <span class="play">▶</span>
                `
                :`
                  <img
                    src="${esc(item.media)}"
                    loading="lazy"
                    alt="${esc(username)}"
                  >
                `
            }

            ${
              username
                ?`
                  <div class="discovery-user">

                    ${
                      avatar
                        ?`
                          <img
                            src="${esc(avatar)}"
                            alt=""
                          >
                        `
                        :`
                          <span>
                            ${initial}
                          </span>
                        `
                    }

                    <b>
                      @${esc(username)}
                    </b>

                  </div>
                `
                :""
            }

            ${
              text
                ?`
                  <div class="discovery-caption">
                    ${hashtagHtml(text)}
                  </div>
                `
                :""
            }

            ${
              time
                ?`
                  <span class="discovery-time">
                    ${esc(time)}
                  </span>
                `
                :""
            }

          </div>

        `;

      }).join("")}

    </div>
  `;

  document
    .querySelectorAll("[data-discovery-id]")
    .forEach(tile=>{

      tile.onclick=event=>{

        if(
          event.target.closest(".hashtag")
        ){
          return;
        }

        const username=
          tile.dataset.username||"";

        if(
          event.target.closest(".discovery-user")&&
          username
        ){

          openProfile(username);
          return;
        }

        const reelIndex=
          Number(
            tile.dataset.reelIndex
          );

        /* REELS → REELS */
        if(
          Number.isInteger(reelIndex)&&
          reelIndex>=0
        ){

          openReel(reelIndex);
          return;
        }

        /* NORMAL GÖNDERİ → POST.HTML */
        const id=
          tile.dataset.discoveryId;

        if(id){
          openPostById(id);
        }

      };

    });
}


/* REEL HTML */
function createReelHtml(reel,index){

  const usernameKey=
    normalizeUsername(reel.username);

  const isMe=
    Boolean(
      currentUsername&&
      usernameKey===currentUsername
    );

  const isFollowing=
    followingUsers.has(usernameKey);

  const avatar=
    reel.avatar
      ?`<img src="${esc(reel.avatar)}" alt="">`
      :esc(
        (reel.username||"?")
          .slice(0,1)
          .toUpperCase()
      );

  return`

    <article
      class="reel"
      data-reel-index="${index}"
    >

      <video
        class="reel-video"
        playsinline
        loop
        preload="metadata"
        data-src="${esc(reel.mediaUri)}"
      ></video>

      <div class="reel-shade"></div>

      <button
        class="reel-back"
        type="button"
        onclick="closeReel()"

      <button
        class="reel-center-play"
        type="button"
        onclick="toggleViewerPlay(${index})"
      >
        <svg viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"></path>
        </svg>
      </button>

      <div class="reel-actions">

        <button
          class="reel-action"
          type="button"
          onclick="likeViewerReel(${index})"
        >
          <span class="ico">
            <svg viewBox="0 0 24 24">
              <path d="M20.8 8.6c0 5.5-8.8 10.4-8.8 10.4S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.4Z"></path>
            </svg>
          </span>

          <span class="num">
            ${Number(reel.likes||0)}
          </span>
        </button>

        <button
          class="reel-action"
          type="button"
          onclick="openComments(${index})"
        >
          <span class="ico">
            <svg viewBox="0 0 24 24">
              <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 2 1.2-4A7.5 7.5 0 1 1 20 11.5Z"></path>
            </svg>
          </span>

          <span class="num">
            ${Number(reel.commentCount||0)}
          </span>
        </button>

        <button
          class="reel-action"
          type="button"
          onclick="shareViewerReel(${index})"
        >
          <span class="ico">
            <svg viewBox="0 0 24 24">
              <path d="m21 3-7.2 18-3.5-7.3L3 10.2 21 3Z"></path>
              <path d="m10.3 13.7 5.4-5.4"></path>
            </svg>
          </span>
        </button>

      </div>

      <div class="reel-info">

        <div class="reel-user-row">

          <div
            class="reel-avatar"
            onclick="openProfile('${esc(reel.username)}')"
          >
            ${avatar}
          </div>

          <div class="reel-user-col">

            <div
              class="reel-username"
              onclick="openProfile('${esc(reel.username)}')"
            >
              @${esc(reel.username)}
            </div>

          </div>

          ${
            !isMe
              ?`
                <button
                  type="button"
                  class="reel-follow-btn ${
                    isFollowing
                      ?"following"
                      :""
                  }"
                  data-follow-user="${esc(reel.username)}"
                >
                  ${
                    isFollowing
                      ?"Takip Ediliyor"
                      :"Takip Et"
                  }
                </button>
              `
              :""
          }

        </div>

        <div class="reel-date">
          ${esc(reel.date||"")}
        </div>

        <div class="reel-description">
          ${hashtagHtml(reel.description||"")}
        </div>

      </div>

      <div class="reel-progress">

        <span class="reel-time">
          0:00 / 0:00
        </span>

        <input
          class="reel-range"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
          oninput="seekViewer(event,${index})"
        >

        <button
          class="reel-sound"
          type="button"
          onclick="toggleViewerMute(${index})"
        >
          <svg viewBox="0 0 24 24">
            <path d="M4 9v6h4l5 4V5L8 9H4Z"></path>
            <path d="M16 9a4 4 0 0 1 0 6"></path>
            <path class="mute-slash" d="m4 4 16 16"></path>
          </svg>
        </button>

      </div>

    </article>

  `;
}


function openReel(startIndex=0){

  const viewer=$("viewer");
  const viewerFeed=$("viewerFeed");

  viewerFeed.innerHTML=
    reels
      .map(
        (reel,index)=>
          createReelHtml(reel,index)
      )
      .join("");

  viewer.classList.add("show");
  document.body.style.overflow="hidden";

  setupViewerReels(startIndex);
}


function setupViewerReels(startIndex=0){

  const feedElement=$("viewerFeed");

  const articles=
    Array.from(
      feedElement.querySelectorAll(".reel")
    );

  document
    .querySelectorAll(
      "#viewerFeed [data-follow-user]"
    )
    .forEach(button=>{

      button.onclick=async event=>{

        event.preventDefault();
        event.stopPropagation();

        await toggleFollowUser(
          button.dataset.followUser,
          button
        );
      };
    });


  articles.forEach(article=>{

    const video=
      article.querySelector(".reel-video");

    if(
      video&&
      !video.src&&
      video.dataset.src
    ){
      video.src=video.dataset.src;
    }

    video.addEventListener(
      "timeupdate",
      ()=>{
        updateViewerProgress(
          Number(article.dataset.reelIndex)
        );
      }
    );

    video.addEventListener(
      "loadedmetadata",
      ()=>{
        updateViewerProgress(
          Number(article.dataset.reelIndex)
        );
      }
    );

    video.addEventListener(
      "click",
      ()=>{
        toggleViewerPlay(
          Number(article.dataset.reelIndex)
        );
      }
    );

  });


  if(viewerObserver){
    viewerObserver.disconnect();
  }

  viewerObserver=
    new IntersectionObserver(
      entries=>{

        entries.forEach(entry=>{

          const article=entry.target;

          const video=
            article.querySelector(
              ".reel-video"
            );

          const index=
            Number(article.dataset.reelIndex);

          if(entry.isIntersecting){

            document
              .querySelectorAll(".reel-video")
              .forEach(other=>{

                if(other!==video){
                  other.pause();
                }

              });

            video.play().catch(()=>{});

            viewViewerCount(index);

          }else{

            video.pause();

          }

        });

      },
      {
        root:feedElement,
        threshold:.7
      }
    );


  articles.forEach(
    article=>
      viewerObserver.observe(article)
  );


  requestAnimationFrame(()=>{

    const target=articles[startIndex];

    if(target){

      feedElement.scrollTo({
        top:target.offsetTop,
        behavior:"instant"
      });

    }

  });
}

function updateViewerProgress(index){

  const article=
    document.querySelector(
      `.reel[data-reel-index="${index}"]`
    );

  if(!article)return;

  const video=
    article.querySelector(".reel-video");

  const range=
    article.querySelector(".reel-range");

  const time=
    article.querySelector(".reel-time");

  if(!video||!range||!time)return;

  const current=
    Number(video.currentTime||0);

  const duration=
    Number(video.duration||0);

  range.value=
    duration
      ?(current/duration)*100
      :0;

  time.textContent=
    viewerTime(current)+
    " / "+
    viewerTime(duration);
}


function viewerTime(seconds){

  if(!Number.isFinite(seconds)){
    return "0:00";
  }

  seconds=Math.max(
    0,
    Math.floor(seconds)
  );

  const minutes=
    Math.floor(seconds/60);

  const secs=
    String(seconds%60)
      .padStart(2,"0");

  return minutes+":"+secs;
}


function seekViewer(event,index){

  const article=
    document.querySelector(
      `.reel[data-reel-index="${index}"]`
    );

  if(!article)return;

  const video=
    article.querySelector(".reel-video");

  if(
    !video||
    !Number.isFinite(video.duration)
  )return;

  video.currentTime=
    (Number(event.target.value)/100)*
    video.duration;
}

/* COMMENTS */
function localCommentsKey(id){
  return "minegram_comments_"+String(id);
}


function getLocalComments(id){

  try{

    const x=
      JSON.parse(
        localStorage.getItem(
          localCommentsKey(id)
        )||"[]"
      );

    return Array.isArray(x)?x:[];

  }catch{

    return[];
  }
}


function saveLocalComment(id,c){

  const arr=getLocalComments(id);

  arr.push(c);

  localStorage.setItem(
    localCommentsKey(id),
    JSON.stringify(arr.slice(-100))
  );
}


function mergeComments(server,id){

  const remote=
    Array.isArray(server)
      ?server
      :[];

  const local=
    getLocalComments(id);

  const all=[...remote];

  for(const c of local){

    const exists=
      all.some(x=>
        String(x.id||"")===
        String(c.id||"")||
        (
          x.username===c.username&&
          x.text===c.text
        )
      );

    if(!exists){
      all.push(c);
    }
  }

  return all;
}


function sortComments(comments){

  const a=[...(comments||[])];

  if(currentCommentSort==="newest"){

    return a.sort(
      (x,y)=>
        new Date(
          y.createdAt||
          y.created_at||
          0
        )-
        new Date(
          x.createdAt||
          x.created_at||
          0
        )
    );
  }

  if(currentCommentSort==="popular"){

    return a.sort(
      (x,y)=>
        Number(
          y.likes||
          y.likeCount||
          0
        )-
        Number(
          x.likes||
          x.likeCount||
          0
        )
    );
  }

  return a;
}


function renderCommentsForPost(comments){

  const sorted=
    sortComments(comments);

  return sorted.length
    ?sorted.map(renderComment).join("")
    :'<div class="empty">Henüz yorum yok.</div>';
}


function changeCommentSort(value){

async function refreshComments(showLoading=true){

  if(!currentCommentPost)return;

  const id=currentCommentPost;
  const list=$("commentList");

  if(showLoading){
    list.innerHTML=
      renderCommentsForPost(
        getLocalComments(id)
      );
  }

  try{

    const p=
      await api(
        "/posts/"+
        encodeURIComponent(id)
      );

    const remote=
      Array.isArray(p.comments)
        ?p.comments
        :(
          Array.isArray(p.post?.comments)
            ?p.post.comments
            :[]
        );

    list.innerHTML=
      renderCommentsForPost(

          remote,
          id
        )
      );

  }catch{}
}

function relativeTime(v){

  const d=new Date(v);

  if(!v||isNaN(d.getTime()))return "";

  const diff=
    Math.max(
      0,
      Date.now()-d.getTime()
    );

  const seconds=
    Math.floor(diff/1000);

  if(seconds<60)
    return `${seconds} saniye önce`;

  const minutes=
    Math.floor(seconds/60);

  if(minutes<60)
    return `${minutes} dakika önce`;

  const hours=
    Math.floor(minutes/60);

  if(hours<24)
    return `${hours} saat önce`;

  const days=
    Math.floor(hours/24);

  if(days<7)
    return `${days} gün önce`;

  if(days<365)
    return `${Math.floor(days/7)} hafta önce`;

  return `${Math.floor(days/365)} yıl önce`;
}

async function sendComment(){

  const input=$("commentInput");

  const textValue=
    input.value.trim();

  if(
    !textValue||
    !currentCommentPost
  )return;

  const postIdValue=currentCommentPost;
  const replyId=replyingTo;

  const sendButton=
    document.querySelector(
      ".comment-compose .send"
    );

  if(sendButton)
    sendButton.disabled=true;

  const username=
    currentUsername||
    "minegram";

  const now=
    new Date().toISOString();

  const tempId=
    "local-"+Date.now();

  const item={
    id:tempId,
    username,
    text:textValue,
    createdAt:now,
    likedByMe:false,
    local:true
  };

  if(replyId){

    const local=
      getLocalComments(postIdValue);

    const parent=
      local.find(
        c=>String(c.id)===String(replyId)
      );

    if(parent){

      parent.replies=
        Array.isArray(parent.replies)
          ?parent.replies
          :[];

      parent.replies.push(item);

      localStorage.setItem(
        localCommentsKey(postIdValue),
        JSON.stringify(local.slice(-100))
      );
    }

  }else{

    saveLocalComment(
      postIdValue,
      item
    );

    const list=$("commentList");

    const empty=
      list.querySelector(".empty");

    if(empty)empty.remove();

    list.insertAdjacentHTML(
      "beforeend",
      renderComment(item)
    );

    list.scrollTop=list.scrollHeight;
  }

  input.value="";
  replyingTo=null;

  input.placeholder=
    "Bunun hakkında ne düşünüyorsun?";

  showToast(
    replyId
      ?"Yanıt gönderildi"
      :"Yorum gönderildi"
  );

  try{

    let result;

    if(replyId){

      result=
        await api(
          "/comments/"+
          encodeURIComponent(replyId)+
          "/reply",
          {
            method:"POST",
            body:{text:textValue}
          }
        );

    }else{

      result=
        await api(
          "/posts/"+
          encodeURIComponent(postIdValue)+
          "/comments",
          {
            method:"POST",
            body:{text:textValue}
          }
        );
    }

    const returned=
      result?.comment||
      result?.data||
      result;

    if(returned?.id){

      const local=
        getLocalComments(postIdValue);

      const found=
        local.find(
          c=>String(c.id)===String(tempId)
        );

      if(found){

        found.id=returned.id;
        found.local=false;
      }

      localStorage.setItem(
        localCommentsKey(postIdValue),
        JSON.stringify(local.slice(-100))
      );
    }

    await refreshComments(false);

  }catch(e){

    showToast(
      e?.message||
      "Yorum gönderilemedi"
    );

  }finally{

    if(sendButton)
      sendButton.disabled=false;
  }
}

async function doSearch(){

  const value=
    input.value.trim();

  clearButton.style.display=
    value?"block":"none";

  if(!value){

    selectedTag="";
    tagBack.style.display="none";

    renderDiscovery();

    return;
  }


  /* HASHTAG */

  if(value.startsWith("#")){

    selectedTag=
      value.slice(1).trim();

    tagBack.style.display="block";

    const tag=
      selectedTag
        .toLowerCase()
        .trim();

    if(!tag){

      renderDiscovery();
      return;
    }

    const posts=
      feed.filter(post=>
        hasExactHashtag(
          postText(post),
          tag
        )
      );

    if(!posts.length){

      content.innerHTML=`

        <div class="tag-empty">

          <div
            style="
              font-size:52px;
              margin-bottom:12px
            "
          >
            #
          </div>

          <div>
            #${esc(selectedTag)}
          </div>

          <div
            style="
              margin-top:7px;
              font-size:13px
            "
          >
            Bu etikete ait gönderi bulunamadı.
          </div>

        </div>

      `;

      return;
    }

    content.innerHTML=`

      <div class="tag-search-head">
        #${esc(selectedTag)}
      </div>

      <div class="tag-search-count">
        ${posts.length} gönderi
      </div>

      <div class="grid">

        ${posts.map(post=>{

          const id=postId(post);
          const media=mediaUrl(post);
          const video=isVideo(post);

          const reelIndex=
            reels.findIndex(
              reel=>
                String(reel.id)===
                String(id)
            );

          const user=
            post?.user||
            post?.profile||
            {};

          const username=
            String(
              post?.username||
              user?.username||
              ""
            )
            .replace(/^@/,"")
            .trim();

          const avatar=
            getAvatar(post)||
            getAvatar(user);

          const text=
            postText(post);

          return`

            <div
              class="tile discovery-tile"
              data-tag-post-id="${esc(id)}"
              data-tag-reel-index="${reelIndex}"
            >

              ${
                video
                  ?`
                    <video
                      src="${esc(media)}"
                      muted
                      playsinline
                      preload="metadata"
                    ></video>

                    <span class="play">
                      ▶
                    </span>
                  `
                  :`
                    <img
                      src="${esc(media)}"
                      loading="lazy"
                      alt="${esc(username)}"
                    >
                  `
              }

              ${
                username
                  ?`
                    <div
                      class="discovery-user"
                      data-tag-profile="${esc(username)}"
                    >

                      ${
                        avatar
                          ?`
                            <img
                              src="${esc(avatar)}"
                              alt=""
                            >
                          `
                          :`
                            <span>
                              ${esc(
                                (username||"?")
                                  .slice(0,1)
                                  .toUpperCase()
                              )}
                            </span>
                          `
                      }

                      <b>
                        @${esc(username)}
                      </b>

                    </div>
                  `
                  :""
              }

              ${
                text
                  ?`
                    <div class="discovery-caption">
                      ${hashtagHtml(text)}
                    </div>
                  `
                  :""
              }

            </div>

          `;

        }).join("")}

      </div>

    `;


    document
      .querySelectorAll(
        "[data-tag-post-id]"
      )
      .forEach(tile=>{

        tile.onclick=event=>{

          const profile=
            event.target.closest(
              "[data-tag-profile]"
            );

          if(profile){

            event.stopPropagation();

            openProfile(
              profile.dataset.tagProfile
            );

            return;
          }

          if(
            event.target.closest(".hashtag")
          ){
            return;
          }

          const reelIndex=
            Number(
              tile.dataset.tagReelIndex
            );

          /* ETİKET SONUCUNDA REELS */
          if(
            Number.isInteger(reelIndex)&&
            reelIndex>=0
          ){

            openReel(reelIndex);

          }

          /* ETİKET SONUCUNDA NORMAL GÖNDERİ */
          const id=
            tile.dataset.tagPostId;

          if(id){
            openPostById(id);
          }

        };

      });

    return;
  }


  /* KULLANICI ARAMA */
  users=
    await searchUsers(value);

  renderUsers(users);
}


input.addEventListener(
  "input",
  ()=>{

    clearTimeout(searchTimer);

    searchTimer=
      setTimeout(
        doSearch,
        250
      );

  }
);


clearButton.onclick=()=>{

  input.value="";
  selectedTag="";

  try{
    sessionStorage.removeItem(
      "minegram_search_tag"
    );
  }catch{}

  tagBack.style.display="none";
  clearButton.style.display="none";

  renderDiscovery();

  input.focus();
};


tagBack.onclick=()=>{

  input.value="";
  selectedTag="";

  try{
    sessionStorage.removeItem(
      "minegram_search_tag"
    );
  }catch{}

  tagBack.style.display="none";
  clearButton.style.display="none";

  renderDiscovery();

};


document.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Escape"){

      if(
        $("commentsModal")
          .classList
          .contains("open")
      ){

        closeComments();

      }else if(
        $("viewer")
          .classList
          .contains("show")
      ){

        closeReel();

      }

    }

  }
);


/* URL'DEN HASHTAG ARA */
function loadSearchFromUrl(){

  const params=
    new URLSearchParams(
      location.search
    );

  let query=
    params.get("query")||
    "";

  if(!query){

    try{

      query=
        sessionStorage.getItem(
          "minegram_search_tag"
        )||"";

    }catch{}

  }

  if(!query)return;

  query=
    String(query)
      .trim();

  if(!query)return;

  if(!query.startsWith("#")){
    query="#"+query;
  }

  input.value=query;

  selectedTag=
    query.slice(1);

  clearButton.style.display="block";
  tagBack.style.display="block";

  setTimeout(
    ()=>doSearch(),
    0
  );
}


/* BAŞLAT */
loadData().then(()=>{
  loadSearchFromUrl();
});
