.viewer{position:fixed;inset:0;background:#000;z-index:10000;display:none;overflow:hidden}.viewer.show{display:block}.viewer-shell{height:100%;width:100%;background:#000}.viewer-phone{width:390px;height:100%;min-height:0;max-height:896px;margin:0 auto;background:#000;position:relative;overflow:hidden}.viewer-feed{height:100%;width:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.viewer-feed::-webkit-scrollbar{display:none}.viewer-reel{height:100%;width:100%;position:relative;background:#000;scroll-snap-align:start;overflow:hidden}.viewer-reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;cursor:pointer}.viewer-reel .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.08) 42%,transparent 67%);pointer-events:none}.viewer-reel .topbtn{position:absolute;top:12px;width:42px;height:42px;border:0;border-radius:0;background:transparent;color:#fff;z-index:5;display:grid;place-items:center;cursor:pointer;text-shadow:0 1px 3px #000}.viewer-reel .back{left:12px;font-size:36px;font-weight:300}.viewer-reel .reel-progress{position:absolute;left:18px;right:10px;bottom:14px;height:30px;z-index:8;display:flex;align-items:center;gap:8px;color:#fff;text-shadow:0 1px 3px #000}.viewer-reel .reel-time{font-size:11px;font-variant-numeric:tabular-nums;min-width:68px;text-align:left;white-space:nowrap}.viewer-reel .reel-range{appearance:none;-webkit-appearance:none;flex:1;min-width:0;height:5px;margin:0;background:#4b435d;border-radius:99px;outline:none;cursor:pointer}.viewer-reel .reel-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:#ff1744;border:0;box-shadow:0 0 0 1px rgba(0,0,0,.15)}.viewer-reel .reel-range::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#ff1744;border:0}.viewer-reel .reel-range::-moz-range-progress{height:5px;background:#ff1744;border-radius:99px}.viewer-reel .reel-sound.m id;place-items:center;width:18px;height:18px;border-radius:50%;background:#1976d2;font-size:12px;margin-left:4px;text-shadow:none}.viewer-reel .follow{margin-left:5px;height:32px;border:1px solid rgba(255,255,255,.75);border-radius:9px;background:transparent;color:#fff;padding:0 11px;font-weight:700;cursor:pointer}.viewer-reel .date{color:#bbb;font-size:12px;margin:2px 0 0 54px}.viewer-reel .desc{font-size:15px;line-height:1.35;margin-top:6px}.viewer-comments{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(390px,100%);height:72%;background:#000;border-radius:24px 24px 0 0;z-index:100;display:none;flex-direction:column;padding:8px 12px 12px;box-shadow:0 -6px 24px rgba(0,0,0,.45)}.viewer-comments.open{display:flex}.viewer-comments .comments-head{position:relative;display:flex;justify-content:center;align-items:center;height:48px;padding:0 4px;border-bottom:1px solid #202020;font-size:16px}.viewer-comments .comments-head:before{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:99px;background:#666}.viewer-comments .comments-head b{font-size:16px;font-weight:700}.viewer-comments .close-comments{position:absolute;right:0;top:5px;background:transparent;padding:0;width:38px;height:38px;font-size:28px;line-height:1;color:#fff;border:0}.viewer-comments .comments-list{flex:1;overflow:auto;padding:10px 3px}.viewer-comments .comment{padding:9px 0;border-bottom:1px solid #202020}.viewer-comments .comment b{font-size:13px}.viewer-comments .comment p{margin:4px 0 0;color:#ddd;font-size:13px}.viewer-comments .comment-form{display:flex;gap:7px;padding-top:8px}.viewer-comments .comment-form input{flex:1;background:#191919;color:#fff;border:1px solid #333;border-radius:10px;padding:11px}.viewer-comments .comment-form button{width:46px;height:46px;padding:0;display:grid;place-items:center;border:0;background:transparent;color:#fff;border-radius:10px}.viewer-comments .comment-empty{color:#777;text-align: <script>
const API='/api';
const token=localStorage.getItem('minegram_token')||localStorage.getItem('minegram_supabase_token')||'';
const $=id=>document.getElementById(id); const content=$('content'), input=$('sq'), clear=$('clear'), tagBack=$('tagBack');
let users=[], stories=[], feed=[], reels=[]; let selectedTag=''; let timer;
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function api(path,opt={}){const headers=Object.assign({'Accept':'application/json'},opt.headers||{});if(token)headers.Authorization='Bearer '+token;return fetch(API+path,{...opt,headers}).then(async r=>{const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error((d&&d.error)||r.statusText);return d})}
function avatar(url,name,story=false){const letter=esc((name||'?').slice(0,1).toUpperCase());const inner=url?`<img class="avatar" src="${esc(url)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" alt="">`:'';const fallback=`<span class="avatar" style="${url?'display:none':''}">${letter}</span>`;return story?`<div class="story-ring">${inner}${fallback}</div>`:`${inner}${fallback}`}
function getAvatar(u){return u?.avatar||u?.avatar_url||u?.avatarUrl||u?.profile?.avatar_url||u?.profile?.avatarUrl||''}
function privateUser(u){const s=u?.settings||{};return !!(s.private_account||s.privateAccount||s.private||u?.private_account||u?.privateAccount||u?.private)}
function storyFor(name){return stories.filter(s=>String(s.username||'').toLowerCase()===String(name||'').toLowerCase())}
function isVideo(p){const m=String(p?.media_type||p?.mediaType||p?.type||'').toLowerCase();const u=String(p?.media||p?.media_url||p?.mediaUrl||p?.mediaUri||p?.video||p?.videoUrl||p?.video_url||p?.reel||p?.reelUrl||p?.reel_url||p?.url||p?.fileUrl||p?.file_url||'').toLowerCase();return m.includes('video')||m.includes('reel')||/\.(mp4|webm|mov|m4v|3gp)(\?|$)/.test(u)}
function mediaUrl(p){return p?.media||p?.media_url||p?.mediaUrl||p?.mediaUri||p?.video||p?.videoUrl||p?.video_url||p?.reel||p?.reelUrl||p?.reel_url||p?.url||p?.fileUrl||p?.file_url||''}
function postText(p){return p?.text||p?.caption||p?.description||''}
function postId(p){return p?.id??p?.post_id??p?.postId??''}
function normalizeReels(){reels=feed.filter(isVideo).map(p=>{const user=p?.user||p?.profile||{};return{id:postId(p),username:String(p.username||user.username||'').replace(/^@/,''),description:postText(p),mediaUri:mediaUrl(p),likes:Array.isArray(p.likes)?p.likes.length:Number(p.likes||0),views:Number(p.views||0)}}).filter(r=>r.username&&r.mediaUri).filter((r,i,a)=>i===a.findIndex(x=>String(x.id)==String(r.id)&&x.username.toLowerCase()===r.username.toLowerCase()&&x.mediaUri===r.mediaUri));}
async function loadData(){
 content.innerHTML='<div class="loading">Yükleniyor...</div>';
 try{const me=await api('/me');if(!me)throw new Error('auth');}catch(e){location.href='giris.html';return}
 try{const [f,s]=await Promise.all([api('/feed?ts='+Date.now()),api('/stories?ts='+Date.now()).catch(()=>[]) ]);feed=Array.isArray(f)?f:(f?.posts||f?.data||f?.items||[]);stories=Array.isArray(s)?s:(s?.stories||s?.data||s?.items||[]);normalizeReels();renderDiscovery();}catch(e){content.innerHTML='<div class="empty">İçerikler alınamadı. Tekrar deneyin.</div>'}
}
async function searchUsers(q){try{const d=await api('/search?q='+encodeURIComponent(q));const arr=Array.isArray(d)?d:(d?.users||d?.data||[]);return arr.map(u=>{const x=u?.user||u?.profile||u||{};return{username:String(u.username||x.username||'').trim().replace(/^@/,''),avatar:getAvatar(u)||getAvatar(x),private:privateUser(u)||privateUser(x)}}).filter(u=>u.username)}catch{return []}}
function renderTagIntro(tag){content.innerHTML=`<div class="tag-result" id="openTag"><div class="tag-icon">#</div><div><div class="username">#${esc(tag)}</div><div class="sub">Etiket gönderilerini gör</div></div></div>`;$('openTag').onclick=()=>{selectedTag=tag;renderTagPosts()}}
function renderTagPosts(){tagBack.style.display='inline';const re=new RegExp('#'+selectedTag.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');const posts=feed.filter(p=>re.test(postText(p)));if(!posts.length){content.innerHTML='<div class="empty">Bu etikette henüz gönderi yok</div>';return}content.innerHTML='<div class="posts">'+posts.map(p=>postHtml(p)).join('')+'</div>';bindPosts()}
function postHtml(p){const name=esc(p.username||'');const a=getAvatar(p);const u=mediaUrl(p);let media='';if(u){if(isVideo(p))media=`<video class="post-media" src="${esc(u)}" controls playsinline preload="metadata"></video>`;else media=`<img class="post-media" src="${esc(u)}" loading="lazy" alt="">`;}return `<article class="post" data-id="${esc(postId(p))}" data-user="${name}"><div class="post-head" data-profile="${name}">${avatar(a,name,false)}<strong>@${name}</strong></div>${media}<div class="caption">${esc(postText(p))}</div></article>`}
function bindPosts(){document.querySelectorAll('[data-profile]').forEach(x=>x.onclick=()=>openProfile(x.dataset.profile))}
function renderDiscovery(){if(!reels.length){content.innerHTML='<div class="empty"><div style="font-size:52px">⌕</div><div>Kullanıcı ara</div></div>';return}content.innerHTML='<div class="section-title">Videolar</div><div class="grid">'+reels.map((r,i)=>`<div class="tile" data-reel="${i}"><video src="${esc(r.mediaUri)}" muted playsinline preload="metadata"></video><span class="play">▶</span></div>`).join('')+'</div>';document.querySelectorAll('[data-reel]').forEach(x=>x.onclick=()=>openReel(+x.dataset.reel))}
function renderUsers(arr){if(!arr.length){content.innerHTML='<div class="empty">Kullanıcı bulunamadı</div>';return}content.innerHTML='<div class="users">'+arr.map(u=>{const st=storyFor(u.username);const has=!u.private&&st.length;return `<div class="user" data-user="${esc(u.username)}" data-story="${has?'1':'0'}">${avatar(u.avatar,u.username,has)}<div class="user-info"><div class="username">@${esc(u.username)}</div><div class="sub">${has?'Hikayeyi görmek için fotoğrafa dokun':'Hesabı görüntüle'}</div></div></div>`}).join('')+'</div>';document.querySelectorAll('[data-user]').forEach(el=>el.onclick=()=>{const n=el.dataset.user;if(el.dataset.story==='1'&&el.querySelector('.story-ring'))openStory(n);else openProfile(n)})}
async function doSearch(q){q=q.trim();clear.style.display=q?'block':'none';tagBack.style.display=selectedTag?'inline':'none';if(selectedTag){renderTagPosts();return}if(!q){renderDiscovery();return}if(q.startsWith('#')){const tag=q.slice(1).trim();if(tag)renderTagIntro(tag);else renderDiscovery();return}content.innerHTML='<div class="loading">Kullanıcılar aranıyor...</div>';const found=await searchUsers(q.replace(/^@/,''));renderUsers(found)}
function openProfile(name){if(name)location.href='profile.html?username='+encodeURIComponent(name)}
function openReel(i){
 const feedEl=$('viewerFeed');
 if(!reels.length)return;
 feedEl.innerHTML=reels.map((r,k)=>{
  const av=r.avatar||getAvatar(r.raw||r)||''; const letter=esc((r.username||'M').charAt(0).toUpperCase());
  const avatarHtml=av?`<img src="${esc(av)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`+`<span style="display:none">${letter}</span>`:`<span>${letter}</span>`;
  return `<article class="viewer-reel" data-index="${k}"><video data-src="${esc(r.mediaUri)}" playsinline muted loop preload="metadata"></video><div class="shade"></div><button class="center-play" onclick="toggleViewerPlay(${k})"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button><div class="reel-progress"><span class="reel-time current-time">0:00 / 0:00</span><input class="reel-range" type="range" min="0" max="100" value="0" step="0.1" oninput="seekViewer(${k},this.value)"><button class="reel-sound muted" onclick="toggleViewerMute(${k})"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path class="waves" d="M16 9.5c1.7 1.7 1.7 3.3 0 5M18.5 7c3 3 3 7 0 10"/></svg></button></div><button class="topbtn back" onclick="closeViewer()">‹</button><div class="actions"><button class="action like" onclick="likeViewerReel(${k})"><span class="ico"><svg viewBox="0 0 24 24"><path d="M20.8 8.7c0 5.1-8.8 10.8-8.8 10.8S3.2 13.8 3.2 8.7A4.7 4.7 0 0 1 8 4c1.5 0 3 .8 4 2 1-1.2 2.5-2 4-2a4.7 4.7 0 0 1 4.8 4.7z"/></svg></span><span class="num">${r.likes||0}</span></button><div class="action view-stat"><span class="ico"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.5"/></svg></span><span class="num">${r.views||0}</span></div><button class="action" onclick="openViewerComments(${k})"><span class="ico"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5c-1.14 0-2.22-.25-3.19-.69L4 20l1.69-4.19A7.46 7.46 0 0 1 5 11.5 7.5 7.5 0 1 1 20 11.5Z"/></svg></span><span class="num comment-count">${r.commentCount||0}</span></button><button class="action" onclick="shareViewerReel(${k})"><span class="ico"><svg viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2 .01 7z"/></svg></span></button></div><div class="info"><div class="userrow"><div class="avatar" onclick="openProfile('${encodeURIComponent(r.username)}')">${avatarHtml}</div><div class="usercol"><div><span class="username" onclick="openProfile('${encodeURIComponent(r.username)}')">@${esc(r.username)}</span></div></div></div><div class="date">${esc(r.date||'')}</div><div class="desc">${esc(r.description||'')}</div></div></article>`;
 }).join('');
 $('viewer').classList.add('show'); document.body.style.overflow='hidden'; setupViewerReels(i);
}
let viewerObserver=null;
function setupViewerReels(start){const arts=[...document.querySelectorAll('.viewer-reel')];if(viewerObserver)viewerObserver.disconnect();viewerObserver=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video'),i=Number(e.target.dataset.index);if(e.isIntersecting&&e.intersectionRatio>.65){arts.forEach(a=>{const x=a.querySelector('video');if(x!==v)x.pause()});v.play().catch(()=>showViewerPlay(i,true));viewViewerCount(i)}else v.pause()}),{threshold:[.65]});arts.forEach((a,i)=>{const v=a.querySelector('video');v.src=reels[i].mediaUri;v.addEventListener('loadedmetadata',()=>updateViewerProgress(i));v.addEventListener('timeupdate',()=>updateViewerProgress(i));v.addEventListener('play',()=>showViewerPlay(i,false));v.addEventListener('pause',()=>showViewerPlay(i,true));v.addEventListener('click',()=>toggleViewerPlay(i));viewerObserver.observe(a)});requestAnimationFrame(()=>arts[start]?.scrollIntoView({block:'start'}));}
function showViewerPlay(i,show){const b=document.querySelectorAll('.viewer-reel')[i]?.querySelector('.center-play');if(b)b.style.display=show?'grid':'none'}
function toggleViewerPlay(i){const v=document.querySelectorAll('.viewer-reel video')[i];if(!v)return;if(v.paused){v.play().catch(()=>{});showViewerPlay(i,false)}else{v.pause();showViewerPlay(i,true)}}
function toggleViewerMute(i){const v=document.querySelectorAll('.viewer-reel video')[i];const b=document.querySelectorAll('.viewer-reel .reel-sound')[i];if(!v||!b)return;v.muted=!v.muted;document.querySelectorAll('.viewer-reel video').forEach((x,j)=>{if(j!==i){x.muted=true;document.querySelectorAll('.viewer-reel .reel-sound')[j]?.classList.add('muted')}});b.classList.toggle('muted',v.muted);if(!v.muted)v.play().catch(()=>{})}
function updateViewerProgress(i){const a=document.querySelectorAll('.viewer-reel')[i],v=a?.querySelector('video'),r=a?.querySelector('.reel-range'),t=a?.querySelector('.current-time');if(!v||!r)return;const p=v.duration?Math.min(100,v.currentTime/v.duration*100):0;r.value=p;r.style.background=`linear-gradient(to right,#42a5f5 0%,#ff1744 ${p}%,#4b435d ${p}%,#4b435d 100%)`;if(t)t.textContent=viewerTime(v.currentTime)+' / '+viewerTime(v.duration)}
function viewerTime(s){s=Number.isFinite(s)&&s>=0?Math.floor(s):0;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function seekViewer(i,p){const v=document.querySelectorAll('.viewer-reel video')[i];if(v&&Number.isFinite(v.duration))v.currentTime=Number(p)/100*v.duration}
const viewerSeen=new Set();function viewViewerCount(i){const r=reels[i];if(!r||viewerSeen.has(r.id))return;viewerSeen.add(r.id);r.views=(Number(r.views)||0)+1;const n=document.querySelectorAll('.viewer-reel')[i]?.querySelector('.view-stat .num');if(n)n.textContent=r.views}
async function likeViewerReel(i){const r=reels[i],a=document.querySelectorAll('.viewer-reel')[i],b=a?.querySelector('.like');if(!r||!b)return;const liked=b.classList.contains('liked');r.likes=Math.max(0,(Number(r.likes)||0)+(liked?-1:1));b.classList.toggle('liked',!liked);b.querySelector('.num').textContent=r.likes;try{await api('/posts/'+encodeURIComponent(r.id)+'/like',{method:'POST'})}catch{}}
async function openViewerComments(i){currentViewerComment=i;$('viewerComments').classList.add('open');const list=$('viewerCommentsList');list.innerHTML='<div class="loading">Yorumlar yükleniyor...</div>';try{const j=await api('/posts/'+encodeURIComponent(reels[i].id)+'/comments?ts='+Date.now());const arr=Array.isArray(j)?j:(j?.comments||j?.data||[]);renderViewerComments(arr)}catch{list.innerHTML='<div class="comment-empty">Yorumlar alınamadı.</div>'}}
let currentViewerComment=null;
function renderViewerComments(arr){const list=$('viewerCommentsList');list.innerHTML=arr.length?arr.map(c=>{const u=c.user||c.author||{};const n=esc(c.username||u.username||'minegram'),tx=esc(c.text||c.comment||c.body||'');return `<div class="comment"><div class="comment-meta"><div class="comment-avatar">${esc((n.replace('@','')||'M').charAt(0).toUpperCase())}</div><div class="comment-body"><b>@${n.replace(/^@/,'')}</b><p>${tx}</p><div class="comment-actions">${esc(c.createdAt||c.created_at||'')}</div></div></div></div>`}).join(''):'<div class="comment-empty">Henüz yorum yok.<br>İlk yorumu sen yap.</div>'}
async function sendViewerComment(){const inp=$('viewerCommentInput'),text=inp.value.trim();if(!text||currentViewerComment===null)return;try{const r=reels[currentViewerComment];await api('/posts/'+encodeURIComponent(r.id)+'/comments',{method:'POST',body:{text}});inp.value='';await openViewerComments(currentViewerComment)}catch(e){alert(e.message||'Yorum gönderilemedi')}}
function closeViewerComments(){$('viewerComments').classList.remove('open');currentViewerComment=null}
async function shareViewerReel(i){const r=reels[i],text='🎬 @'+r.username+' Reels: '+(r.description||'');if(navigator.share){try{await navigator.share({text})}catch{}}else{try{await navigator.clipboard.writeText(text)}catch{}}}
function closeViewer(){closeViewerComments();if(viewerObserver)viewerObserver.disconnect();document.querySelectorAll('.viewer-reel video').forEach(v=>{v.pause();v.removeAttribute('src');v.load()});$('viewer').classList.remove('show');document.body.style.overflow='';$('viewerFeed').innerHTML=''}
input.addEventListener('input',()=>{clearTimeout(timer);selectedTag='';timer=setTimeout(()=>doSearch(input.value),100)});clear.onclick=()=>{input.value='';selectedTag='';doSearch('');input.focus()};tagBack.onclick=()=>{selectedTag='';tagBack.style.display='none';doSearch(input.value)};
let sy=0;document.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(window.scrollY<=2&&e.changedTouches[0].clientY-sy>100)loadData()},{passive:true});
loadData();
</script>
</body></html>
