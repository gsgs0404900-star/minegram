<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ara • Minegram</title>

<style>
:root{
  --bg:#000;
  --card:#121212;
  --border:#222;
  --text:#fff;
  --muted:#999;
  --accent:#3797f0;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  padding-bottom:75px;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:#000;
  border-bottom:1px solid var(--border);
  padding:14px;
}

.title{
  font-size:24px;
  font-weight:700;
  margin-bottom:12px;
}

.search-box{
  height:46px;
  background:#1a1a1a;
  border-radius:12px;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:10px;
}

.search-box input{
  flex:1;
  background:none;
  border:none;
  color:#fff;
  outline:none;
  font-size:15px;
}

.search-box input::placeholder{
  color:#777;
}

.content{
  max-width:700px;
  margin:auto;
}

.section-title{
  font-size:17px;
  font-weight:700;
  padding:16px;
}

.users{
  display:flex;
  flex-direction:column;
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
  border-bottom:1px solid #161616;
  cursor:pointer;
}

.user:hover{
  background:#0d0d0d;
}

.avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  background:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-weight:700;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  flex:1;
}

.username{
  font-weight:700;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
}

.tile{
  aspect-ratio:1;
  background:#111;
  overflow:hidden;
  cursor:pointer;
}

.tile img,
.tile video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.empty,
.loading{
  text-align:center;
  color:var(--muted);
  padding:40px 20px;
}

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  background:#111;
  border-top:1px solid #222;
  display:flex;
}

.nav a{
  flex:1;
  text-decoration:none;
  color:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
}

.nav a.active{
  color:#fff;
  font-weight:700;
}
</style>
</head>
<body>

<header class="header">
  <div class="title">Ara</div>

  <div class="search-box">
    🔍
    <input
      id="searchInput"
      type="text"
      placeholder="Kullanıcı veya #etiket ara">
  </div>
</header>

<main id="content" class="content">
  <div class="loading">Yükleniyor...</div>
</main>

<nav class="nav">
  <a href="index.html">Ana Sayfa</a>
  <a href="ara.html" class="active">Ara</a>
  <a href="olustur.html">Oluştur</a>
  <a href="reels.html">Reels</a>
  <a href="profile.html">Profil</a>
</nav>

<script>
const API = "/api";

const token =
localStorage.getItem("minegram_token") ||
localStorage.getItem("minegram_supabase_token") ||
"";

const content = document.getElementById("content");
const searchInput = document.getElementById("searchInput");

let feed = [];

function esc(str=""){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

async function api(path){

  const headers = {
    Accept:"application/json"
  };

  if(token){
    headers.Authorization = "Bearer " + token;
  }

  const res = await fetch(API + path,{headers});

  if(!res.ok){
    throw new Error("API Error");
  }

  return res.json();
}

function mediaUrl(post){
  return (
    post.media ||
    post.media_url ||
    post.mediaUrl ||
    post.video ||
    post.videoUrl ||
    ""
  );
}

function renderExplore(){

  const posts = feed.filter(
    p => mediaUrl(p)
  );

  if(!posts.length){
    content.innerHTML =
      '<div class="empty">Gösterilecek içerik yok.</div>';
    return;
  }

  content.innerHTML = `
    <div class="section-title">
      Keşfet
    </div>

    <div class="grid">
      ${posts.map(post=>{

        const media = mediaUrl(post);

        return `
          <div class="tile">
            <img
              src="${media}"
              loading="lazy">
          </div>
        `;

      }).join("")}
    </div>
  `;
}

function renderUsers(users){

  if(!users.length){
    content.innerHTML =
      '<div class="empty">Sonuç bulunamadı.</div>';
    return;
  }

  content.innerHTML =
  '<div class="users">' +

  users.map(user=>{

    const username =
      user.username || "";

    const avatar =
      user.avatar ||
      user.avatar_url ||
      "";

    return `
      <div
        class="user"
        onclick="location.href='profile.html?username=${encodeURIComponent(username)}'">

        <div class="avatar">

          ${
            avatar
            ? `<img src="${avatar}">`
            : username.charAt(0).toUpperCase()
          }

        </div>

        <div class="info">
          <div class="username">
            @${esc(username)}
          </div>

          <div class="sub">
            Profili görüntüle
          </div>
        </div>

      </div>
    `;

  }).join("")

  + "</div>";
}

async function searchUsers(query){

  try{

    const result =
      await api(
        "/search?q=" +
        encodeURIComponent(query)
      );

    return (
      result.users ||
      result.data ||
      result ||
      []
    );

  }catch{
    return [];
  }
}

async function load(){

  try{

    await api("/me");

    const data =
      await api(
        "/feed?ts=" +
        Date.now()
      );

    feed =
      data.posts ||
      data.data ||
      data ||
      [];

    renderExplore();

  }catch{

    location.href = "giris.html";

  }

}

let timer;

searchInput.addEventListener(
  "input",
  ()=>{

    clearTimeout(timer);

    timer = setTimeout(
      async ()=>{

        const q =
          searchInput.value.trim();

        if(!q){
          renderExplore();
          return;
        }

        if(q.startsWith("#")){

          const tag =
            q.slice(1).toLowerCase();

          const posts =
            feed.filter(post =>
              String(
                post.caption ||
                post.text ||
                ""
              )
              .toLowerCase()
              .includes("#"+tag)
            );

          content.innerHTML =
          `
            <div class="section-title">
              #${esc(tag)}
            </div>

            <div class="grid">
              ${
                posts.map(post=>`
                  <div class="tile">
                    <img src="${mediaUrl(post)}">
                  </div>
                `).join("")
              }
            </div>
          `;

          return;
        }

        const users =
          await searchUsers(q);

        renderUsers(users);

      },
      250
    );

  }
);

load();
</script>

</body>
</html
