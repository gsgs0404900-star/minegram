<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keşfet - Minegram</title>

<style>
*{
  box-sizing:border-box
}

html,body{
  margin:0;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif
}

body{
  padding-bottom:76px
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

/* ÜST */

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#000;
  border-bottom:1px solid #222;
  padding:12px 12px 10px
}

.title{
  margin-bottom:10px;
  font-size:21px;
  font-weight:800
}

.search{
  display:flex;
  align-items:center;
  gap:8px;
  height:44px;
  padding:0 12px;
  background:#202020;
  border-radius:12px
}

.search-icon{
  color:#aaa;
  font-size:20px
}

.search input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:none;
  color:#fff;
  font-size:16px
}

.search input::placeholder{
  color:#888
}

.clear,
.tag-back{
  display:none;
  flex:0 0 auto;
  border:0;
  background:none;
  color:#aaa
}

.clear{
  font-size:22px
}

.tag-back{
  font-size:30px;
  line-height:1
}

/* İÇERİK */

.content{
  min-height:calc(100vh - 125px)
}

.loading,
.empty{
  padding:34px 20px;
  text-align:center;
  color:#888
}

.section-title{
  padding:12px;
  font-size:18px;
  font-weight:800
}

/* KULLANICI */

.users{
  border-bottom:1px solid #222
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  border-bottom:1px solid #191919;
  cursor:pointer
}

.user-info{
  min-width:0;
  flex:1
}

.user-name-row{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0
}

.username{
  min-width:0;
  font-size:16px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.sub{
  margin-top:4px;
  color:#888;
  font-size:12px
}

.follow-btn{
  flex:0 0 auto;
  min-width:78px;
  padding:7px 10px;
  border:0;
  border-radius:8px;
  background:#2196f3;
  color:#fff;
  font-size:12px;
  font-weight:800
}

.follow-btn.following{
  background:#333
}

.follow-btn:disabled{
  opacity:.6
}

/* AVATAR */

.avatar{
  width:55px;
  height:55px;
  flex:0 0 55px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:50%;
  background:#2196f3;
  color:#fff;
  font-size:20px;
  font-weight:800
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}

.story-ring{
  padding:2px;
  border-radius:50%;
  background:conic-gradient(
    #f9ce34,
    #ee2a7b,
    #6228d7,
    #f9ce34
  )
}

.story-ring .avatar{
  border:2px solid #000
}

/* ETİKET */

.tag-search-head{
  padding:14px 12px 8px;
  font-size:18px;
  font-weight:800
}

.tag-search-count{
  padding:0 12px 12px;
  color:#888;
  font-size:13px
}

.tag-empty{
  padding:50px 20px;
  text-align:center;
  color:#888
}

.hashtag{
  color:#4da3ff;
  font-weight:700;
  cursor:pointer
}

.hashtag:hover{
  text-decoration:underline
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  padding:2px
}

.tile{
  position:relative;
  aspect-ratio:9/16;
  overflow:hidden;
  background:#111;
  cursor:pointer
}

.tile img,
.tile video{
  width:100%;
  height:100%;
  object-fit:cover
}

.play{
  position:absolute;
  top:7px;
  right:7px;
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#0009;
  font-size:14px
}

.discovery-user{
  position:absolute;
  left:5px;
  right:5px;
  bottom:5px;
  z-index:5;
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
  padding:5px 7px;
  border-radius:9px;
  background:linear-gradient(
    transparent,
    #000d
  );
  font-size:11px;
  cursor:pointer
}

.discovery-user img,
.discovery-user span{
  width:24px;
  height:24px;
  flex:0 0 24px;
  border-radius:50%;
  object-fit:cover;
  display:grid;
  place-items:center;
  background:#333
}

.discovery-user b{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.discovery-caption{
  position:absolute;
  left:5px;
  right:5px;
  bottom:4px;
  z-index:4;
  padding:30px 6px 4px;
  background:linear-gradient(
    transparent,
    #000c
  );
  font-size:11px;
  line-height:1.3;
  pointer-events:none
}

.discovery-caption .hashtag{
  pointer-events:auto
}

/* ALT MENÜ - ESKİ HALİ KORUNDU */

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:9999;
  display:flex;
  height:76px;
  padding:5px 8px env(safe-area-inset-bottom);
  background:#121018;
  border-top:1px solid #201d27
}

.nav a{
  flex:1;
  min-width:0;
  height:66px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:#ddd;
  text-decoration:none;
  font-size:9px
}

.nav-icon{
  width:45px;
  height:32px;
  display:grid;
  place-items:center;
  border-radius:18px
}

.nav a.active .nav-icon{
  background:#3b3150
}

.svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

/* REELS */

.reel-viewer{
  position:fixed;
  inset:0;
  z-index:10000;
  display:none;
  background:#000
}

.reel-viewer.show{
  display:block
}

.reel-phone{
  position:relative;
  width:390px;
  height:100%;
  max-height:896px;
  margin:auto;
  overflow:hidden;
  background:#000
}

.reel-feed{
  width:100%;
  height:100%;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scrollbar-width:none
}

.reel-feed::-webkit-scrollbar{
  display:none
}

.reel{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  scroll-snap-align:start
}

.reel-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000
}

.reel-shade{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    #000d,
    #0001 45%,
    transparent 70%
  );
  pointer-events:none
}

.reel-back{
  position:absolute;
  top:12px;
  left:12px;
  z-index:20;
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:36px
}

.reel-center-play{
  position:absolute;
  top:50%;
  left:50%;
  z-index:15;
  width:58px;
  height:58px;
  display:none;
  place-items:center;
  transform:translate(-50%,-50%);
  border:0;
  border-radius:50%;
  background:#0008;
  color:#fff
}

.reel-actions{
  position:absolute;
  right:10px;
  bottom:105px;
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:10px
}

.reel-action{
  width:52px;
  min-height:48px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:0;
  background:transparent;
  color:#fff;
  text-shadow:0 2px 5px #000
}

.reel-action .ico{
  width:28px;
  height:28px
}

.reel-action svg{
  width:27px;
  height:27px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round
}

.reel-action .num{
  font-size:13px;
  font-weight:700
}

.reel-info{
  position:absolute;
  left:18px;
  right:75px;
  bottom:22px;
  z-index:20;
  text-shadow:0 2px 5px #000
}

.reel-user-row{
  display:flex;
  align-items:center;
  gap:8px
}

.reel-avatar{
  width:46px;
  height:46px;
  flex:0 0 46px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:50%;
  background:#398dcc;
  font-weight:800;
  cursor:pointer
}

.reel-avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}

.reel-username{
  font-size:16px;
  font-weight:800;
  cursor:pointer
}

.reel-follow-btn{
  min-width:78px;
  height:30px;
  padding:0 10px;
  border:0;
  border-radius:8px;
  background:#2196f3;
  color:#fff;
  font-size:12px;
  font-weight:800
}

.reel-follow-btn.following{
  background:#333
}

.reel-description{
  margin-top:7px;
  font-size:14px;
  line-height:1.4
}

.reel-progress{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  height:45px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:0 8px;
  background:#000e
}

.reel-time{
  width:78px;
  font-size:11px;
  white-space:nowrap
}

.reel-range{
  flex:1;
  min-width:0
}

.reel-sound{
  width:30px;
  height:30px;
  border:0;
  background:none;
  color:#fff
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:95px;
  z-index:15000;
  display:none;
  transform:translateX(-50%);
  padding:10px 15px;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-size:13px
}

.toast.show{
  display:block
}

@media(max-width:699px){

  .reel-phone{
    width:100vw
  }

}

@media(min-width:700px){

  .top,
  .content{
    max-width:700px;
    margin:auto
  }

}
</style>

<script>

const API="/api";

const token=
  localStorage.getItem("minegram_token")||
  localStorage.getItem("minegram_supabase_token")||
  "";

const $=id=>
  document.getElementById(id);

const content=$("content");
const input=$("sq");
const clearButton=$("clear");
const tagBack=$("tagBack");

let feed=[];
let stories=[];
let reels=[];

let currentUsername="";
let followingUsers=new Set();

let selectedTag="";
let searchTimer=null;
let viewerObserver=null;
let viewerSeen=new Set();


/* GÜVENLİ HTML */

function esc(value=""){

  return String(value).replace(
    /[&<>'"]/g,
    char=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"
    }[char])
  );

}


/* API */

async function api(path,options={}){

  const headers={
    Accept:"application/json",
    ...(options.headers||{})
  };

  if(token){
    headers.Authorization=
      "Bearer "+token;
  }

  const request={
    ...options,
    headers
  };

  if(
    request.body &&
    typeof request.body==="object" &&
    !(request.body instanceof FormData)
  ){

    request.headers={
      ...request.headers,
      "Content-Type":"application/json"
    };

    request.body=
      JSON.stringify(request.body);
  }

  const response=
    await fetch(
      API+path,
      request
    );

  const text=
    await response.text();

  let data;

  try{
    data=JSON.parse(text);
  }catch{
    data=text;
  }

  if(!response.ok){

    throw new Error(
      data?.error||
      data?.message||
      response.statusText||
      "API hatası"
    );

  }

  return data;

}


/* KULLANICI */

function normalizeUsername(value=""){

  return String(value)
    .replace(/^@/,"")
    .trim()
    .toLowerCase();

}


function getAvatar(user){

  return(
    user?.avatar||
    user?.avatar_url||
    user?.avatarUrl||
    user?.profile?.avatar||
    user?.profile?.avatar_url||
    user?.profile?.avatarUrl||
    ""
  );

}


function privateUser(user){

  return Boolean(
    user?.private_account||
    user?.privateAccount||
    user?.is_private||
    user?.isPrivate||
    user?.private||
    user?.settings?.private_account||
    user?.settings?.privateAccount
  );

}


function postId(post){

  return(
    post?.id??
    post?.post_id??
    post?.postId??
    ""
  );

}


function postText(post){

  return(
    post?.text||
    post?.caption||
    post?.description||
    ""
  );

}


function mediaUrl(post){

  return(
    post?.media||
    post?.media_url||
    post?.mediaUrl||
    post?.mediaUri||
    post?.video||
    post?.video_url||
    post?.videoUrl||
    post?.reel||
    post?.reel_url||
    post?.reelUrl||
    post?.url||
    post?.file_url||
    post?.fileUrl||
    ""
  );

}


function isVideo(post){

  const type=
    String(
      post?.media_type||
      post?.mediaType||
      post?.type||
      ""
    ).toLowerCase();

  const url=
    String(
      mediaUrl(post)
    ).toLowerCase();

  return(
    type.includes("video")||
    type.includes("reel")||
    /\.(mp4|webm|mov|m4v|3gp)(\?|$)/.test(url)
  );

}


/* HASHTAG */

function escapeRegExp(value=""){

  return String(value).replace(
    /[.*+?^${}()|[\]\\]/g,
    "\\$&"
  );

}


function hasExactHashtag(text,tag){

  const clean=
    String(tag||"")
      .replace(/^#/,"")
      .trim()
      .toLowerCase();

  if(!clean){
    return false;
  }

  const regex=
    new RegExp(
      "(^|[^\\p{L}\\p{N}_])#"+
      escapeRegExp(clean)+
      "(?![\\p{L}\\p{N}_])",
      "iu"
    );

  return regex.test(
    String(text||"")
  );

}


function hashtagHtml(text=""){

  const safe=esc(text);

  return safe.replace(
    /(^|[\s(])#([\p{L}\p{N}_]+)/gu,
    (full,before,tag)=>{

      return(
        before+
        `<span
          class="hashtag"
          onclick="openHashtag(event,'#${esc(tag)}')"
        >#${esc(tag)}</span>`
      );

    }
  );

}


/*
  HASHTAG AÇ
  ALT BAR DEĞİŞMEZ
*/

function openHashtag(event,tag){

  event?.preventDefault();
  event?.stopPropagation();

  const clean=
    String(tag||"").trim();

  if(!clean){
    return;
  }

  try{

    sessionStorage.setItem(
      "minegram_search_tag",
      clean
    );

  }catch{}

  location.href=
    "ara.html?query="+
    encodeURIComponent(clean);

}


/* STORY */

function storyFor(username){

  const key=
    normalizeUsername(username);

  return stories.filter(story=>
    normalizeUsername(
      story?.username||
      story?.user?.username||
      story?.profile?.username||
      ""
    )===key
  );

}


/* VERİ */

async function loadData(){

  content.innerHTML=
    '<div class="loading">Yükleniyor...</div>';

  try{

    const me=
      await api("/me");

    const user=
      me?.user||
      me?.profile||
      me;

    currentUsername=
      normalizeUsername(
        user?.username||
        me?.username||
        ""
      );

    const following=
      me?.following||
      me?.followingUsers||
      me?.following_users||
      [];

    followingUsers=new Set();

    if(Array.isArray(following)){

      following.forEach(item=>{

        const username=
          typeof item==="string"
            ?item
            :(
              item?.username||
              item?.user?.username||
              ""
            );

        const key=
          normalizeUsername(username);

        if(key){
          followingUsers.add(key);
        }

      });

    }

  }catch{

    location.href="giris.html";
    return;

  }


  try{

    const [
      feedData,
      storyData
    ]=await Promise.all([

      api(
        "/feed?ts="+Date.now()
      ),

      api(
        "/stories?ts="+Date.now()
      ).catch(()=>[])

    ]);

    feed=
      Array.isArray(feedData)
        ?feedData
        :(
          feedData?.posts||
          feedData?.data||
          feedData?.items||
          []
        );

    stories=
      Array.isArray(storyData)
        ?storyData
        :(
          storyData?.stories||
          storyData?.data||
          storyData?.items||
          []
        );

    normalizeReels();

    renderDiscovery();

  }catch{

    content.innerHTML=
      `
      <div class="empty">
        İçerikler yüklenemedi.
      </div>
      `;

  }

}


/* REELS VERİSİ */

function normalizeReels(){

  reels=
    feed
      .filter(post=>isVideo(post))
      .map(post=>{

        const user=
          post?.user||
          post?.profile||
          {};

        return{

          id:postId(post),

          username:
            String(
              post?.username||
              user?.username||
              ""
            )
            .replace(/^@/,"")
            .trim(),

          description:
            postText(post),

          mediaUri:
            mediaUrl(post),

          avatar:
            getAvatar(post)||
            getAvatar(user),

          likes:
            Number(
              post?.likes_count||
              post?.like_count||
              post?.likes||
              0
            ),

          commentCount:
            Number(
              post?.comment_count||
              post?.commentCount||
              0
            ),

          raw:post

        };

      })
      .filter(
        reel=>
          reel.mediaUri
      );

}


/* KEŞFET */

function renderDiscovery(){

  const posts=
    feed.filter(
      post=>mediaUrl(post)
    );

  if(!posts.length){

    content.innerHTML=
      `
      <div class="empty">

        <div style="font-size:52px">
          ⌕
        </div>

        <div>
          Henüz içerik bulunamadı.
        </div>

      </div>
      `;

    return;

  }


  content.innerHTML=
    `

    <div class="section-title">
      Keşfet
    </div>

    <div class="grid">

      ${
        posts.map(post=>{

          const id=postId(post);
          const media=mediaUrl(post);
          const video=isVideo(post);

          const reelIndex=
            reels.findIndex(
              reel=>
                String(reel.id)===
                String(id)
            );

          const user=
            post?.user||
            post?.profile||
            {};

          const username=
            String(
              post?.username||
              user?.username||
              ""
            )
            .replace(/^@/,"")
            .trim();

          const avatar=
            getAvatar(post)||
            getAvatar(user);

          const text=
            postText(post);

          return`

          <div
            class="tile"
            data-discovery-id="${esc(id)}"
            data-reel-index="${reelIndex}"
            data-username="${esc(username)}"
          >

            ${
              video
                ?`

                  <video
                    src="${esc(media)}"
                    muted
                    playsinline
                    preload="metadata"
                  ></video>

                  <span class="play">
                    ▶
                  </span>

                `
                :`

                  <img
                    src="${esc(media)}"
                    loading="lazy"
                    alt="${esc(username)}"
                  >

                `
            }


            ${
              username
                ?`

                <div class="discovery-user">

                  ${
                    avatar
                      ?`

                        <img
                          src="${esc(avatar)}"
                          alt=""
                        >

                      `
                      :`

                        <span>
                          ${esc(
                            username
                              .slice(0,1)
                              .toUpperCase()
                          )}
                        </span>

                      `
                  }

                  <b>
                    @${esc(username)}
                  </b>

                </div>

                `
                :""
            }


            ${
              text
                ?`

                <div class="discovery-caption">
                  ${hashtagHtml(text)}
                </div>

                `
                :""
            }

          </div>

          `;

        }).join("")
      }

    </div>

    `;


  document
    .querySelectorAll(
      "[data-discovery-id]"
    )
    .forEach(tile=>{

      tile.onclick=event=>{

        /* HASHTAG */

        if(
          event.target.closest(
            ".hashtag"
          )
        ){
          return;
        }


        /* PROFİL */

        const profile=
          event.target.closest(
            ".discovery-user"
          );

        if(profile){

          const username=
            tile.dataset.username;

          if(username){
            openProfile(username);
          }

          return;
        }


        /* REELS */

        const reelIndex=
          Number(
            tile.dataset.reelIndex
          );

        if(
          Number.isInteger(reelIndex)&&
          reelIndex>=0
        ){

          openReel(reelIndex);
          return;

        }


        /* NORMAL GÖNDERİ */

        const id=
          tile.dataset.discoveryId;

        if(id){

          openPostById(id);

        }

      };

    });

}


/* KULLANICI ARAMA */

async function searchUsers(query){

  try{

    const data=
      await api(
        "/search?q="+
        encodeURIComponent(query)
      );

    const list=
      Array.isArray(data)
        ?data
        :(
          data?.users||
          data?.results||
          data?.profiles||
          data?.data||
          data?.items||
          []
        );

    return list
      .map(item=>{

        const user=
          item?.user||
          item?.profile||
          item||
          {};

        const username=
          String(
            item?.username||
            user?.username||
            ""
          )
          .replace(/^@/,"")
          .trim();

        if(!username){
          return null;
        }

        const key=
          normalizeUsername(username);

        return{

          username,

          avatar:
            getAvatar(item)||
            getAvatar(user),

          private:
            privateUser(item)||
            privateUser(user),

          isFollowing:
            Boolean(
              item?.isFollowing||
              item?.is_following||
              user?.isFollowing||
              user?.is_following||
              followingUsers.has(key)
            )

        };

      })
      .filter(Boolean);

  }catch{

    return[];

  }

}

/* TAKİP */

async function toggleFollow(username){

  const key=
    normalizeUsername(username);

  const currently=
    followingUsers.has(key);

  const next=
    !currently;

  if(next){
    followingUsers.add(key);
  }else{
    followingUsers.delete(key);
  }

  document
    .querySelectorAll(
      "[data-follow-user]"
    )
    .forEach(button=>{

      if(
        normalizeUsername(
          button.dataset.followUser
        )!==key
      ){
        return;
      }

      button.textContent=
        next
          ?"Takip Ediliyor"
          :"Takip Et";

      button.classList.toggle(
        "following",
        next
      );

    });


  try{

    await api(
      "/users/"+
      encodeURIComponent(username)+
      "/follow",
      {
        method:"POST",
        body:{
          follow:next
        }
      }
    );

  }catch(error){

    if(currently){
      followingUsers.add(key);
    }else{
      followingUsers.delete(key);
    }

    showToast(
      error?.message||
      "Takip işlemi başarısız."
    );

    await doSearch();

  }

}

function openReelPost(index){

  const reel=
    reels[index];

  if(!reel){
    return;
  }

  const id=
    reel.id||
    postId(reel.raw);

  if(id){

    openPostById(id);

  }

}


function setupReels(startIndex){

  const feedElement=
    $("viewerFeed");

  const articles=
    Array.from(
      feedElement.querySelectorAll(".reel")
    );


  articles.forEach(article=>{

    const video=
      article.querySelector(
        ".reel-video"
      );

    video.addEventListener(
      "timeupdate",
      ()=>{

        updateReelProgress(
          Number(
            article.dataset.reelIndex
          )
        );

      }
    );

    video.addEventListener(
      "click",
      ()=>{

        toggleReel(
          Number(
            article.dataset.reelIndex
          )
        );

      }
    );

  });


  document
    .querySelectorAll(
      "[data-reel-follow]"
    )
    .forEach(button=>{

      button.onclick=async event=>{

        event.preventDefault();
        event.stopPropagation();

        await toggleFollow(
          button.dataset.reelFollow
        );

      };

    });


  if(viewerObserver){

    viewerObserver.disconnect();

  }


  viewerObserver=
    new IntersectionObserver(
      entries=>{

        entries.forEach(entry=>{

          const article=
            entry.target;

          const video=
            article.querySelector(
              ".reel-video"
            );

          const index=
            Number(
              article.dataset.reelIndex
            );


          if(entry.isIntersecting){

            document
              .querySelectorAll(
                ".reel-video"
              )
              .forEach(other=>{

                if(other!==video){
                  other.pause();
                }

              });

            video.play().catch(()=>{});

            countReelView(index);

          }else{

            video.pause();

          }

        });

      },
      {
        root:feedElement,
        threshold:.7
      }
    );


  articles.forEach(
    article=>
      viewerObserver.observe(article)
  );


  setTimeout(()=>{

    const target=
      articles[startIndex];

    if(target){

      feedElement.scrollTop=
        target.offsetTop;

    }

  },50);

}


function closeReel(){

  if(viewerObserver){

    viewerObserver.disconnect();
    viewerObserver=null;

  }


  document
    .querySelectorAll(
      ".reel-video"
    )
    .forEach(
      video=>video.pause()
    );


  $("viewer")
    .classList
    .remove("show");


  document.body.style.overflow="";

}


function toggleReel(index){

  const article=
    document.querySelector(
      `.reel[data-reel-index="${index}"]`
    );

  if(!article){
    return;
  }

  const video=
    article.querySelector(
      ".reel-video"
    );

  if(video.paused){

    video.play().catch(()=>{});

  }else{

    video.pause();

  }

}


function muteReel(index){

  const article=
    document.querySelector(
      `.reel[data-reel-index="${index}"]`
    );

  if(!article){
    return;
  }

  const video=
    article.querySelector(
      ".reel-video"
    );

  video.muted=
    !video.muted;

}


function seekReel(event,index){

  const article=
    document.querySelector(
      `.reel[data-reel-index="${index}"]`
    );

  if(!article){
    return;
  }

  const video=
    article.querySelector(
      ".reel-video"
    );

  if(
    !video||
    !Number.isFinite(
      video.duration
    )
  ){

    return;

  }

  video.currentTime=
    (
      Number(
        event.target.value
      )/100
    )*
    video.duration;

}


function updateReelProgress(index){

  const article=
    document.querySelector(
      `.reel[data-reel-index="${index}"]`
    );

  if(!article){
    return;
  }

  const video=
    article.querySelector(
      ".reel-video"
    );

  const range=
    article.querySelector(
      ".reel-range"
    );

  const time=
    article.querySelector(
      ".reel-time"
    );

  if(!video){
    return;
  }

  const duration=
    Number(video.duration||0);

  const current=
    Number(video.currentTime||0);

  if(duration){

    range.value=
      (current/duration)*100;

  }

  time.textContent=
    formatTime(current)+
    " / "+
    formatTime(duration);

}


function formatTime(seconds){

  if(!Number.isFinite(seconds)){
    return "0:00";
  }

  seconds=
    Math.floor(seconds);

  const minutes=
    Math.floor(seconds/60);

  const sec=
    String(seconds%60)
      .padStart(2,"0");

  return minutes+":"+sec;

}


async function countReelView(index){

  if(viewerSeen.has(index)){
    return;
  }

  viewerSeen.add(index);

  const reel=
    reels[index];

  if(!reel){
    return;
  }

  const id=
    reel.id||
    postId(reel.raw);

  if(!id){
    return;
  }

  try{

    await api(
      "/posts/"+
      encodeURIComponent(id)+
      "/view",
      {
        method:"POST"
      }
    );

  }catch{}

}


async function likeReel(index){

  const reel=
    reels[index];

  if(!reel){
    return;
  }

  const id=
    reel.id||
    postId(reel.raw);

  if(!id){
    return;
  }

  try{

    const result=
      await api(
        "/posts/"+
        encodeURIComponent(id)+
        "/like",
        {
          method:"POST"
        }
      );

    const article=
      document.querySelector(
        `.reel[data-reel-index="${index}"]`
      );

    const num=
      article?.querySelector(
        ".reel-action .num"
      );

    if(num){

      const likes=
        result?.likes||
        result?.count||
        result?.likeCount;

      if(likes!==undefined){

        num.textContent=
          String(likes);

      }

    }

  }catch(error){

    showToast(
      error?.message||
      "Beğeni başarısız."
    );

  }

}


async function shareReel(index){

  const reel=
    reels[index];

  if(!reel){
    return;
  }

  const id=
    reel.id||
    postId(reel.raw);

  const url=
    location.origin+
    "/post.html?id="+
    encodeURIComponent(id);


  try{

    if(navigator.share){

      await navigator.share({
        title:"Minegram",
        text:
          reel.description||"",
        url
      });

    }else{

      await navigator.clipboard.writeText(
        url
      );

      showToast(
        "Bağlantı kopyalandı."
      );

    }

  }catch{}

}


/* URL HASHTAG */

function loadSearchFromUrl(){

  const params=
    new URLSearchParams(
      location.search
    );

  let query=
    params.get("query")||
    "";


  if(!query){

    try{

      query=
        sessionStorage.getItem(
          "minegram_search_tag"
        )||"";

    }catch{}

  }


  if(!query){
    return;
  }


  query=
    String(query).trim();

  if(!query){
    return;
  }


  if(
    !query.startsWith("#")
  ){

    query=
      "#"+query;

  }


  input.value=query;

  selectedTag=
    query.slice(1);

  clearButton.style.display=
    "block";

  tagBack.style.display=
    "block";


  setTimeout(
    ()=>doSearch(),
    0
  );

}


/* TOAST */

function showToast(message){

  const toast=
    $("toast");

  toast.textContent=
    message;

  toast.classList.add(
    "show"
  );

  setTimeout(
    ()=>{
      toast.classList.remove(
        "show"
      );
    },
    2200
  );

}


/* ESC */

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Escape"
    ){

      if(
        $("viewer")
          .classList
          .contains("show")
      ){

        closeReel();

      }

    }

  }
);


/* BAŞLAT */

loadData().then(()=>{

  loadSearchFromUrl();

});
