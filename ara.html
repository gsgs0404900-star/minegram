*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100%;}body{padding-bottom:64px}.top{position:sticky;top:0;z-index:20;background:#000;border-bottom:1px solid #222;padding:12px 12px 10px}.title{font-size:21px;font-weight:800;margin-bottom:10px}.search{display:flex;align-items:center;background:#202020;border-radius:12px;height:44px;padding:0 12px;gap:8px}.search span{font-size:20px;color:#aaa}.search input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:16px}.search input::placeholder{color:#888}.clear{border:0;background:none;color:#aaa;font-size:22px;display:none}.content{min-height:calc(100vh - 125px)}.loading,.empty{text-align:center;color:#888;padding:34px 20px}.section-title{font-weight:800;font-size:18px;padding:12px}.users{border-bottom:1px solid #222}.user{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #191919;cursor:pointer}.avatar{width:55px;height:55px;border-radius:50%;object-fit:cover;background:#4b99d2;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}.story-ring{padding:2px;border-radius:50%;background:conic-gradient(#f9ce34,#ee2a7b,#6228d7,#f9ce34)}.story-ring .avatar{border:2px solid #000}.user-info{min-width:0}.username{font-size:16px;font-weight:800}.sub{font-size:12px;color:#888;margin-top:4px}.tag-result{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #222;cursor:pointer}.tag-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#333;font-size:24px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}.tile{aspect-ratio:9/16;background:#111;overflow:hidden;position:relative;cursor:pointer}.tile img,.tile video{width:100%;height:100%;object-fit:cover}.play{position:absolute;right:6px;top:6px;background:#0009;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:14px}.posts{padding-bottom:20px}.post{border-bottom:1px solid #222;padding:12px}.post-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}.post-head .avatar{width:38px;height:38px;font-size:14px}.post-media{width:100%;max-height:600px;border-radius:8px;object-fit:cover;background:#111}.caption{font-size:14px;line-height:1.4;margin-top:8px}.nav{position:fixed;left:0;right:0;bottom:0;width:100%;height:76px;background:#121018;border-top:1px solid #201d27;display:flex;align-items:stretch;z-index:9999;padding:5px max(8px,calc((100% - 760px) / 2)) env(safe-area-inset-bottom)}.nav a{flex:1 1 0;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#ddd;text-decoration:none;font-size:9px;min-width:0;-webkit-tap-highlight-color:transparent}.nav-icon{width:45px;height:32px;border-radius:18px;display:grid;place-items:center;flex:none}.nav a.active .nav-icon{background:#3b3150}.svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round} .viewer{position:fixed;inset:0;background:#000;z-index:10000;display:none;overflow:hidden}.viewer.show{display:block}.reels-view-feed{height:100%;width:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.reels-view-feed::-webkit-scrollbar{display:none}.reel-card{height:100%;width:100%;position:relative;scroll-snap-align:start;overflow:hidden;background:#000}.reel-card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}.reel-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.86),rgba(0,0,0,.08) 45%,transparent 68%);pointer-events:none}.reel-close{position:absolute;top:10px;left:10px;z-index:20;width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:38px;line-height:1;text-shadow:0 2px 5px #000}.reel-actions{position:absolute;right:10px;bottom:112px;z-index:10;display:flex;flex-direction:column;gap:10px;align-items:center}.reel-action{width:50px;min-height:48px;border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 2px 5px #000}.reel-action .ri{font-size:28px;line-height:28px}.reel-action .rn{font-size:12px;font-weight:700}.reel-info{position:absolute;left:16px;right:70px;bottom:28px;z-index:10;text-shadow:0 2px 5px #000}.reel-user{font-size:16px;font-weight:800;margin-bottom:7px}.reel-desc{font-size:14px;line-height:1.35}.reel-progress{position:absolute;left:16px;right:12px;bottom:12px;height:5px;background:#ffffff55;border-radius:99px;z-index:12;overflow:hidden}.reel-progress i{display:block;height:100%;width:0;background:#42a5f5;border-radius:99px}.reel-sound{position:absolute;right:12px;top:13px;z-index:20;border:0;background:#0008;color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px}.reel-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;width:62px;height:62px;border:0;border-radius:50%;background:#0008;color:#fff;font-size:28px;display:none}.reel-comments{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(420px,100%);height:68%;background:#000;border-radius:22px 22px 0 0;z-index:11000;display:none;flex-direction:column;padding:12px}.reel-comments.open{display:flex}.rc-head{text-align:center;font-weight:800;border-bottom:1px solid #222;padding:8px}.rc-list{flex:1;overflow:auto;padding:10px}.rc-form{display:flex;gap:7px}.rc-form input{flex:1;background:#191919;color:#fff;border:1px solid #333;border-radius:10px;padding:12px}.rc-form button{width:48px;border:0;border-radius:10px;background:#333;color:#fff}.rc-close{position:absolute;right:10px;top:7px;border:0;background:none;color:#fff;font-size:27px}@media(min-width:700px){.reel-card{max-width:700px;margin:auto}.reels-view-feed{background:#000}}.back{border:0;background:none;color:#fff;font-size:24px;margin-right:5px;display:none}@media(min-width:700px){.content{max-width:700px;margin:auto}.top{max-width:700px;margin:auto}.bottom{max-width:700px;margin:auto;left:50%;transform:translateX(-50%)} }

<div class="viewer" id="viewer"><div id="reelsViewFeed" class="reels-view-feed"></div><div id="reelComments" class="reel-comments"><button class="rc-close" onclick="closeReelComments()">×</button><div class="rc-head">Yorumlar</div><div id="rcList" class="rc-list"></div><div class="rc-form"><input id="rcInput" placeholder="Yorum yaz..."><button onclick="sendReelComment()">➤</button></div></div></div>
<script>
const API='/api';
const token=localStorage.getItem('minegram_token')||localStorage.getItem('minegram_supabase_token')||'';
const $=id=>document.getElementById(id); const content=$('content'), input=$('sq'), clear=$('clear'), tagBack=$('tagBack');
let users=[], stories=[], feed=[], reels=[]; let selectedTag=''; let timer;
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function api(path,opt={}){const headers=Object.assign({'Accept':'application/json'},opt.headers||{});if(token)headers.Authorization='Bearer '+token;return fetch(API+path,{...opt,headers}).then(async r=>{const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error((d&&d.error)||r.statusText);return d})}
function avatar(url,name,story=false){const letter=esc((name||'?').slice(0,1).toUpperCase());const inner=url?`<img class="avatar" src="${esc(url)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" alt="">`:'';const fallback=`<span class="avatar" style="${url?'display:none':''}">${letter}</span>`;return story?`<div class="story-ring">${inner}${fallback}</div>`:`${inner}${fallback}`}
function getAvatar(u){return u?.avatar||u?.avatar_url||u?.avatarUrl||u?.profile?.avatar_url||u?.profile?.avatarUrl||''}
function privateUser(u){const s=u?.settings||{};return !!(s.private_account||s.privateAccount||s.private||u?.private_account||u?.privateAccount||u?.private)}
function storyFor(name){return stories.filter(s=>String(s.username||'').toLowerCase()===String(name||'').toLowerCase())}
function isVideo(p){const m=String(p?.media_type||p?.mediaType||p?.type||'').toLowerCase();const u=String(p?.media||p?.media_url||p?.mediaUrl||p?.mediaUri||p?.video||p?.videoUrl||p?.video_url||p?.reel||p?.reelUrl||p?.reel_url||p?.url||p?.fileUrl||p?.file_url||'').toLowerCase();return m.includes('video')||m.includes('reel')||/\.(mp4|webm|mov|m4v|3gp)(\?|$)/.test(u)}
function mediaUrl(p){return p?.media||p?.media_url||p?.mediaUrl||p?.mediaUri||p?.video||p?.videoUrl||p?.video_url||p?.reel||p?.reelUrl||p?.reel_url||p?.url||p?.fileUrl||p?.file_url||''}
function postText(p){return p?.text||p?.caption||p?.description||''}
function postId(p){return p?.id??p?.post_id??p?.postId??''}
function normalizeReels(){reels=feed.filter(isVideo).map(p=>{const user=p?.user||p?.profile||{};return{id:postId(p),username:String(p.username||user.username||'').replace(/^@/,''),description:postText(p),mediaUri:mediaUrl(p),likes:Array.isArray(p.likes)?p.likes.length:Number(p.likes||0),views:Number(p.views||0)}}).filter(r=>r.username&&r.mediaUri).filter((r,i,a)=>i===a.findIndex(x=>String(x.id)==String(r.id)&&x.username.toLowerCase()===r.username.toLowerCase()&&x.mediaUri===r.mediaUri));}
async function loadData(){
 content.innerHTML='<div class="loading">Yükleniyor...</div>';
 try{const me=await api('/me');if(!me)throw new Error('auth');}catch(e){location.href='giris.html';return}
 try{const [f,s]=await Promise.all([api('/feed?ts='+Date.now()),api('/stories?ts='+Date.now()).catch(()=>[]) ]);feed=Array.isArray(f)?f:(f?.posts||f?.data||f?.items||[]);stories=Array.isArray(s)?s:(s?.stories||s?.data||s?.items||[]);normalizeReels();renderDiscovery();}catch(e){content.innerHTML='<div class="empty">İçerikler alınamadı. Tekrar deneyin.</div>'}
}
async function searchUsers(q){try{const d=await api('/search?q='+encodeURIComponent(q));const arr=Array.isArray(d)?d:(d?.users||d?.data||[]);return arr.map(u=>{const x=u?.user||u?.profile||u||{};return{username:String(u.username||x.username||'').trim().replace(/^@/,''),avatar:getAvatar(u)||getAvatar(x),private:privateUser(u)||privateUser(x)}}).filter(u=>u.username)}catch{return []}}
function renderTagIntro(tag){content.innerHTML=`<div class="tag-result" id="openTag"><div class="tag-icon">#</div><div><div class="username">#${esc(tag)}</div><div class="sub">Etiket gönderilerini gör</div></div></div>`;$('openTag').onclick=()=>{selectedTag=tag;renderTagPosts()}}
function renderTagPosts(){tagBack.style.display='inline';const re=new RegExp('#'+selectedTag.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');const posts=feed.filter(p=>re.test(postText(p)));if(!posts.length){content.innerHTML='<div class="empty">Bu etikette henüz gönderi yok</div>';return}content.innerHTML='<div class="posts">'+posts.map(p=>postHtml(p)).join('')+'</div>';bindPosts()}
function postHtml(p){const name=esc(p.username||'');const a=getAvatar(p);const u=mediaUrl(p);let media='';if(u){if(isVideo(p))media=`<video class="post-media" src="${esc(u)}" controls playsinline preload="metadata"></video>`;else media=`<img class="post-media" src="${esc(u)}" loading="lazy" alt="">`;}return `<article class="post" data-id="${esc(postId(p))}" data-user="${name}"><div class="post-head" data-profile="${name}">${avatar(a,name,false)}<strong>@${name}</strong></div>${media}<div class="caption">${esc(postText(p))}</div></article>`}
function bindPosts(){document.querySelectorAll('[data-profile]').forEach(x=>x.onclick=()=>openProfile(x.dataset.profile))}
function renderDiscovery(){if(!reels.length){content.innerHTML='<div class="empty"><div style="font-size:52px">⌕</div><div>Kullanıcı ara</div></div>';return}content.innerHTML='<div class="section-title">Videolar</div><div class="grid">'+reels.map((r,i)=>`<div class="tile" data-reel="${i}"><video src="${esc(r.mediaUri)}" muted playsinline preload="metadata"></video><span class="play">▶</span></div>`).join('')+'</div>';document.querySelectorAll('[data-reel]').forEach(x=>x.onclick=()=>openReel(+x.dataset.reel))}
function renderUsers(arr){if(!arr.length){content.innerHTML='<div class="empty">Kullanıcı bulunamadı</div>';return}content.innerHTML='<div class="users">'+arr.map(u=>{const st=storyFor(u.username);const has=!u.private&&st.length;return `<div class="user" data-user="${esc(u.username)}" data-story="${has?'1':'0'}">${avatar(u.avatar,u.username,has)}<div class="user-info"><div class="username">@${esc(u.username)}</div><div class="sub">${has?'Hikayeyi görmek için fotoğrafa dokun':'Hesabı görüntüle'}</div></div></div>`}).join('')+'</div>';document.querySelectorAll('[data-user]').forEach(el=>el.onclick=()=>{const n=el.dataset.user;if(el.dataset.story==='1'&&el.querySelector('.story-ring'))openStory(n);else openProfile(n)})}
async function doSearch(q){q=q.trim();clear.style.display=q?'block':'none';tagBack.style.display=selectedTag?'inline':'none';if(selectedTag){renderTagPosts();return}if(!q){renderDiscovery();return}if(q.startsWith('#')){const tag=q.slice(1).trim();if(tag)renderTagIntro(tag);else renderDiscovery();return}content.innerHTML='<div class="loading">Kullanıcılar aranıyor...</div>';const found=await searchUsers(q.replace(/^@/,''));renderUsers(found)}
function openProfile(name){if(name)location.href='profile.html?username='+encodeURIComponent(name)}
let activeReelIndex=0, reelObserver=null, activeCommentReel=null;
function openReel(i){if(!reels.length)return;activeReelIndex=Math.max(0,Math.min(i,reels.length-1));const feedEl=$('reelsViewFeed');feedEl.innerHTML=reels.map((r,j)=>`<article class="reel-card" data-ri="${j}"><video src="${esc(r.mediaUri)}" playsinline muted loop preload="metadata"></video><div class="reel-shade"></div><button class="reel-close" onclick="closeViewer()">‹</button><button class="reel-sound" onclick="toggleSearchReelSound(${j})">🔇</button><button class="reel-play" onclick="toggleSearchReel(${j})">▶</button><div class="reel-actions"><button class="reel-action" onclick="likeSearchReel(${j})"><span class="ri">♡</span><span class="rn">${r.likes||0}</span></button><button class="reel-action" onclick="openReelComments(${j})"><span class="ri">💬</span><span class="rn">Yorum</span></button><button class="reel-action" onclick="shareSearchReel(${j})"><span class="ri">➤</span><span class="rn">Paylaş</span></button></div><div class="reel-info"><div class="reel-user">@${esc(r.username)}</div><div class="reel-desc">${esc(r.description||'')}</div></div><div class="reel-progress"><i></i></div></article>`).join('');$('viewer').classList.add('show');document.body.style.overflow='hidden';feedEl.scrollTop=feedEl.clientHeight*activeReelIndex;setupSearchReels();}
function setupSearchReels(){if(reelObserver)reelObserver.disconnect();const cards=[...document.querySelectorAll('.reel-card')];reelObserver=new IntersectionObserver(entries=>entries.forEach(e=>{const card=e.target,v=card.querySelector('video'),i=Number(card.dataset.ri);if(e.isIntersecting&&e.intersectionRatio>.65){activeReelIndex=i;cards.forEach(c=>{const x=c.querySelector('video');if(x!==v)x.pause()});v.play().catch(()=>{});setSearchReelIcon(i,false)}else v.pause()}),{threshold:[.65]});cards.forEach((card,i)=>{const v=card.querySelector('video');v.addEventListener('timeupdate',()=>{const bar=card.querySelector('.reel-progress i');if(bar&&v.duration)bar.style.width=(v.currentTime/v.duration*100)+'%'});v.addEventListener('pause',()=>setSearchReelIcon(i,true));v.addEventListener('play',()=>setSearchReelIcon(i,false));v.addEventListener('click',()=>toggleSearchReel(i));reelObserver.observe(card)});requestAnimationFrame(()=>{const v=cards[activeReelIndex]?.querySelector('video');v?.play().catch(()=>{})})}
function setSearchReelIcon(i,show){const b=document.querySelectorAll('.reel-card')[i]?.querySelector('.reel-play');if(b)b.style.display=show?'block':'none'}
function toggleSearchReel(i){const v=document.querySelectorAll('.reel-card video')[i];if(!v)return;if(v.paused){v.play().catch(()=>{});setSearchReelIcon(i,false)}else{v.pause();setSearchReelIcon(i,true)}}
function toggleSearchReelSound(i){const v=document.querySelectorAll('.reel-card video')[i];if(!v)return;v.muted=!v.muted;document.querySelectorAll('.reel-card video').forEach((x,j)=>{if(j!==i)x.muted=true});const b=document.querySelectorAll('.reel-card .reel-sound')[i];if(b)b.textContent=v.muted?'🔇':'🔊';if(!v.muted)v.play().catch(()=>{})}
function likeSearchReel(i){const r=reels[i];if(!r)return;r.likes=Number(r.likes||0)+1;const b=document.querySelectorAll('.reel-action')[i*3];if(b){b.querySelector('.ri').textContent='♥';b.querySelector('.rn').textContent=r.likes}}
async function shareSearchReel(i){const r=reels[i];const text='🎬 @'+r.username+' '+(r.description||'');if(navigator.share){try{await navigator.share({text})}catch{}}else{try{await navigator.clipboard.writeText(text)}catch{}}}
async function openReelComments(i){activeCommentReel=i;$('reelComments').classList.add('open');const list=$('rcList');list.innerHTML='<div style="color:#777;text-align:center;padding:30px">Yorumlar yükleniyor...</div>';try{const r=reels[i],j=await api('/posts/'+encodeURIComponent(r.id)+'/comments?ts='+Date.now());const arr=Array.isArray(j)?j:(j?.comments||j?.data||[]);list.innerHTML=arr.length?arr.map(c=>`<div style="padding:10px 0;border-bottom:1px solid #222"><b>@${esc(c.username||c.user?.username||'minegram')}</b><div style="margin-top:4px;color:#ddd">${esc(c.text||c.comment||'')}</div></div>`).join(''):'<div style="color:#777;text-align:center;padding:30px">Henüz yorum yok.</div>'}catch(e){list.innerHTML='<div style="color:#777;text-align:center;padding:30px">Henüz yorum yok.</div>'}}
function closeReelComments(){$('reelComments').classList.remove('open');activeCommentReel=null}
async function sendReelComment(){const inp=$('rcInput'),text=inp.value.trim();if(!text||activeCommentReel===null)return;const r=reels[activeCommentReel];try{await api('/posts/'+encodeURIComponent(r.id)+'/comments',{method:'POST',body:JSON.stringify({text}),headers:{'Content-Type':'application/json'}});inp.value='';openReelComments(activeCommentReel)}catch{}}
function closeViewer(){$('viewer').classList.remove('show');document.body.style.overflow='';if(reelObserver)reelObserver.disconnect();document.querySelectorAll('.reel-card video').forEach(v=>{v.pause();v.removeAttribute('src')});$('reelsViewFeed').innerHTML='';closeReelComments()}
function openStory(name){const st=storyFor(name);const s=st[0];if(!s)return;const u=s.mediaUrl||s.media_url||s.mediaUri||s.url||s.imageUrl||s.image_url||'';if(!u){openProfile(name);return}$('viewerUser').textContent='@'+name;$('viewerText').textContent='';$('viewerVideo').src=u;$('viewer').classList.add('show');$('viewerVideo').play().catch(()=>{})}

input.addEventListener('input',()=>{clearTimeout(timer);selectedTag='';timer=setTimeout(()=>doSearch(input.value),100)});clear.onclick=()=>{input.value='';selectedTag='';doSearch('');input.focus()};tagBack.onclick=()=>{selectedTag='';tagBack.style.display='none';doSearch(input.value)};
let sy=0;document.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(window.scrollY<=2&&e.changedTouches[0].clientY-sy>100)loadData()},{passive:true});
loadData();
</script>
</body></html>
