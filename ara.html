<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:90px;
}

body{
    overflow-x:hidden;
}

.app{
    width:100%;
    min-height:100vh;
    background:#000;
}

/* =========================
   ÜST BAR
========================= */

.topbar{
    height:70px;
    border-bottom:1px solid #202020;

    display:flex;
    align-items:center;

    padding:0 22px;

    position:sticky;
    top:0;

    background:#000;
    z-index:50;
}

.logo{
    font-size:22px;
    font-weight:700;
}

.top-actions{
    margin-left:auto;
    display:flex;
    gap:6px;
}

.icon-btn{
    width:42px;
    height:42px;

    border:0;
    background:transparent;

    color:#eee;

    display:grid;
    place-items:center;

    cursor:pointer;
}

.svg{
    width:23px;
    height:23px;

    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =========================
   ARAMA ALANI
========================= */

.page{
    width:min(680px,100%);
    margin:0 auto;

    padding:22px 20px;
}

.field{
    width:100%;
    height:50px;

    background:#080808;

    border:1px solid #3b3b3b;
    border-radius:10px;

    color:#eee;

    padding:0 15px;

    outline:none;

    font-size:15px;
}

.field::placeholder{
    color:#777;
}

.field:focus{
    border-color:#4b99d2;
}

.results{
    width:100%;
    margin-top:12px;
}


/* =========================
   KULLANICI SONUÇLARI
========================= */

.userrow{
    width:100%;
    min-height:68px;

    display:flex;
    align-items:center;

    gap:12px;

    padding:10px 4px;

    border-bottom:1px solid #222;

    cursor:pointer;
}

.userrow:hover{
    background:#080808;
}

.avatar{
    width:48px;
    height:48px;

    flex:none;

    border-radius:50%;

    background:#3f91cc;

    display:grid;
    place-items:center;

    font-size:18px;
    color:#eee;
}

.user-name{
    font-size:14px;
    font-weight:700;
}

.user-action{
    margin-left:auto;

    color:#4b99d2;

    font-size:13px;
    font-weight:700;
}


/* =========================
   BOŞ
========================= */

.empty{
    padding:100px 20px;

    text-align:center;

    color:#999;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;
    bottom:95px;

    transform:translateX(-50%);

    background:#25232a;
    color:#fff;

    padding:10px 16px;

    border-radius:20px;

    font-size:12px;

    opacity:0;
    pointer-events:none;

    transition:.2s;

    z-index:300;
}

.toast.show{
    opacity:1;
}


/* =====================================================
   ALT MENÜ
   INDEX.HTML İLE AYNI
   MASAÜSTÜNDE ORTADA VE KISA
===================================================== */

.nav{
    position:fixed;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:680px;
    max-width:calc(100% - 30px);

    height:76px;

    background:#121018;

    border:1px solid #201d27;
    border-bottom:0;

    border-radius:18px 18px 0 0;

    display:flex;

    align-items:stretch;
    justify-content:center;

    padding:5px 8px env(safe-area-inset-bottom);

    z-index:100;
}

.nav a{
    flex:1 1 0;

    width:20%;
    min-width:0;

    color:#ddd;

    text-decoration:none;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:3px;

    font-size:9px;

    text-align:center;
}

.nav-icon{
    width:45px;
    height:32px;

    border-radius:18px;

    display:grid;
    place-items:center;
}

.nav a.active .nav-icon{
    background:#3b3150;
}

.nav .svg{
    width:21px;
    height:21px;
}


/* =========================
   MOBİL
========================= */

@media(max-width:699px){

    .topbar{
        height:62px;
        padding:0 14px;
    }

    .page{
        width:100%;
        padding:18px 14px;
    }

    .nav{
        width:100%;
        max-width:none;

        border-left:0;
        border-right:0;

        border-radius:18px 18px 0 0;

        padding:5px 8px env(safe-area-inset-bottom);
    }

    .nav a{
        width:20%;
        font-size:9px;
    }

    .nav-icon{
        width:45px;
        height:32px;
    }
}
</style>

</head>

<script>

const API="/api";

let token =
    localStorage.getItem("minegram_token") ||
    localStorage.getItem("minegram_supabase_token") ||
    null;


/* =========================
   API
========================= */

async function api(path,opt={}){

    const headers={
        ...(opt.headers||{})
    };

    if(token){
        headers.Authorization="Bearer "+token;
    }

    const r=await fetch(
        API+path,
        {
            ...opt,
            headers
        }
    );

    const j=await r
        .json()
        .catch(()=>({}));

    if(!r.ok){

        throw new Error(
            j.error ||
            j.message ||
            "İşlem başarısız"
        );

    }

    return j;
}


/* =========================
   HTML GÜVENLİ
========================= */

function escapeHtml(s=""){

    return String(s).replace(
        /[&<>"']/g,
        m=>({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[m])
    );

}


/* =========================
   TOAST
========================= */

function toast(text){

    const t=
        document.getElementById("toast");

    if(!t)return;

    t.textContent=text;

    t.classList.add("show");

    clearTimeout(
        window.__toastTimer
    );

    window.__toastTimer=
        setTimeout(
            ()=>{
                t.classList.remove("show");
            },
            2200
        );
}


/* =========================
   ARAMA
========================= */

let searchTimer=null;

async function searchUsers(){

    const input=
        document.getElementById("sq");

    const results=
        document.getElementById("results");

    const q=
        input.value.trim();


    clearTimeout(searchTimer);


    if(!q){

        results.innerHTML="";

        return;
    }


    searchTimer=
        setTimeout(
            async()=>{

                try{

                    const response=
                        await api(
                            "/search?q="+
                            encodeURIComponent(q)
                        );


                    const users=
                        Array.isArray(response)
                            ? response

                            : Array.isArray(response.users)
                                ? response.users

                                : Array.isArray(response.results)
                                    ? response.results

                                    : [];


                    if(!users.length){

                        results.innerHTML=
                            `<div class="empty">
                                Sonuç bulunamadı.
                            </div>`;

                        return;
                    }


                    results.innerHTML=
                        users.map(
                            user=>{

                                const username=
                                    user.username ||
                                    user.name ||
                                    "minegram";


                                const initial=
                                    username
                                        .charAt(0)
                                        .toUpperCase();


                                return `

                                <div
                                    class="userrow"
                                    onclick="openProfile('${escapeHtml(username)}')">

                                    <div class="avatar">
                                        ${escapeHtml(initial)}
                                    </div>

                                    <div class="user-name">
                                        @${escapeHtml(username)}
                                    </div>

                                    <div class="user-action">
                                        Profil ›
                                    </div>

                                </div>

                                `;

                            }
                        ).join("");


                }catch(error){

                    console.error(
                        "[SEARCH]",
                        error
                    );

                    toast(
                        error.message ||
                        "Arama başarısız."
                    );

                }

            },
            250
        );
}


/* =========================
   PROFİL
========================= */

function openProfile(username){

    location.href=
        "profile.html?user="+
        encodeURIComponent(username);

}


/* =========================
   OTURUM KONTROLÜ
========================= */

async function init(){

    token =
        localStorage.getItem("minegram_token") ||
        localStorage.getItem("minegram_supabase_token") ||
        null;


    if(!token){

        location.replace("giris.html");

        return;
    }


    try{

        await api("/me");

    }catch(error){

        console.warn(
            "[ARA /me]",
            error
        );

        /*
         * Token mevcutsa ara sayfasında kal.
         * /me hatası yüzünden kullanıcıyı
         * gereksiz yere giriş ekranına gönderme.
         */

    }

}


init();

</script>
