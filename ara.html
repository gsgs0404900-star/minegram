<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ara - Minegram</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100%;}body{padding-bottom:64px}.top{position:sticky;top:0;z-index:20;background:#000;border-bottom:1px solid #222;padding:12px 12px 10px}.title{font-size:21px;font-weight:800;margin-bottom:10px}.search{display:flex;align-items:center;background:#202020;border-radius:12px;height:44px;padding:0 12px;gap:8px}.search span{font-size:20px;color:#aaa}.search input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:16px}.search input::placeholder{color:#888}.clear{border:0;background:none;color:#aaa;font-size:22px;display:none}.content{min-height:calc(100vh - 125px)}.loading,.empty{text-align:center;color:#888;padding:34px 20px}.section-title{font-weight:800;font-size:18px;padding:12px}.users{border-bottom:1px solid #222}.user{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #191919;cursor:pointer}.avatar{width:55px;height:55px;border-radius:50%;object-fit:cover;background:#222;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}.story-ring{padding:2px;border-radius:50%;background:conic-gradient(#f9ce34,#ee2a7b,#6228d7,#f9ce34)}.story-ring .avatar{border:2px solid #000}.user-info{min-width:0}.username{font-size:16px;font-weight:800}.sub{font-size:12px;color:#888;margin-top:4px}.tag-result{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #222;cursor:pointer}.tag-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#333;font-size:24px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}.tile{aspect-ratio:9/16;background:#111;overflow:hidden;position:relative;cursor:pointer}.tile img,.tile video{width:100%;height:100%;object-fit:cover}.play{position:absolute;right:6px;top:6px;background:#0009;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:14px}.posts{padding-bottom:20px}.post{border-bottom:1px solid #222;padding:12px}.post-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}.post-head .avatar{width:38px;height:38px;font-size:14px}.post-media{width:100%;max-height:600px;border-radius:8px;object-fit:cover;background:#111}.caption{font-size:14px;line-height:1.4;margin-top:8px}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:#050505;border-top:1px solid #222;display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}.nav{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#aaa;text-decoration:none;font-size:10px;gap:3px}.nav b{font-size:22px;line-height:20px}.nav.active{color:#fff}.viewer{position:fixed;inset:0;background:#000;z-index:100;display:none}.viewer.show{display:block}.viewer video,.viewer img{width:100%;height:100%;object-fit:contain}.close{position:absolute;z-index:5;top:12px;left:12px;width:42px;height:42px;border-radius:50%;background:#0009;color:#fff;border:0;font-size:24px}.viewer-info{position:absolute;left:16px;right:16px;bottom:28px;z-index:5;text-shadow:0 1px 4px #000}.viewer-info strong{font-size:16px}.viewer-info div{margin-top:6px;font-size:14px}.back{border:0;background:none;color:#fff;font-size:24px;margin-right:5px;display:none}@media(min-width:700px){.content{max-width:700px;margin:auto}.top{max-width:700px;margin:auto}.bottom{max-width:700px;margin:auto;left:50%;transform:translateX(-50%)} }
</style>
</head>
<body>
<header class="top"><div class="title">Ara</div><div class="search"><span>⌕</span><button class="back" id="tagBack">‹</button><input id="sq" autocomplete="off" placeholder="#etiket veya kullanıcı adı ara"><button class="clear" id="clear">×</button></div></header>
<main id="content" class="content"></main>
<nav class="bottom">
<a class="nav" href="index.html"><b>⌂</b>Ana Sayfa</a><a class="nav active" href="ara.html"><b>⌕</b>Ara</a><a class="nav" href="olustur.html"><b>＋</b>Oluştur</a><a class="nav" href="reels.html"><b>▶</b>Reels</a><a class="nav" href="profile.html"><b>♙</b>Profil</a>
</nav>
<div class="viewer" id="viewer"><button class="close" id="viewerClose">×</button><video id="viewerVideo" controls playsinline></video><div class="viewer-info"><strong id="viewerUser"></strong><div id="viewerText"></div></div></div>
<script>
const API='/api';
const token=localStorage.getItem('minegram_token')||localStorage.getItem('minegram_supabase_token')||'';
const $=id=>document.getElementById(id); const content=$('content'), input=$('sq'), clear=$('clear'), tagBack=$('tagBack');
let users=[], stories=[], feed=[], reels=[]; let selectedTag=''; let timer;
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function api(path,opt={}){const headers=Object.assign({'Accept':'application/json'},opt.headers||{});if(token)headers.Authorization='Bearer '+token;return fetch(API+path,{...opt,headers}).then(async r=>{const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error((d&&d.error)||r.statusText);return d})}
function avatar(url,name,story=false){const letter=esc((name||'?').slice(0,1).toUpperCase());const inner=url?`<img class="avatar" src="${esc(url)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" alt="">`:'';const fallback=`<span class="avatar" style="${url?'display:none':''}">${letter}</span>`;return story?`<div class="story-ring">${inner}${fallback}</div>`:`${inner}${fallback}`}
function getAvatar(u){return u?.avatar||u?.avatar_url||u?.avatarUrl||u?.profile?.avatar_url||u?.profile?.avatarUrl||''}
function privateUser(u){const s=u?.settings||{};return !!(s.private_account||s.privateAccount||s.private||u?.private_account||u?.privateAccount||u?.private)}
function storyFor(name){return stories.filter(s=>String(s.username||'').toLowerCase()===String(name||'').toLowerCase())}
function isVideo(p){const m=String(p?.media_type||p?.mediaType||p?.type||'').toLowerCase();const u=String(p?.media_url||p?.mediaUrl||p?.mediaUri||p?.url||'').toLowerCase();return m.includes('video')||m.includes('reel')||/\.(mp4|webm|mov|m4v)(\?|$)/.test(u)}
function mediaUrl(p){return p?.media_url||p?.mediaUrl||p?.mediaUri||p?.url||''}
function postText(p){return p?.text||p?.caption||p?.description||''}
function postId(p){return p?.id??p?.post_id??p?.postId??''}
function normalizeReels(){reels=feed.filter(isVideo).map(p=>({id:postId(p),username:p.username||'',description:postText(p),mediaUri:mediaUrl(p),likes:p.likes||0,views:p.views||0}));}
async function loadData(){
 content.innerHTML='<div class="loading">Yükleniyor...</div>';
 try{const me=await api('/me');if(!me)throw new Error('auth');}catch(e){location.href='giris.html';return}
 try{const [f,s]=await Promise.all([api('/feed?ts='+Date.now()),api('/stories?ts='+Date.now()).catch(()=>[]) ]);feed=Array.isArray(f)?f:(f?.posts||f?.data||[]);stories=Array.isArray(s)?s:(s?.stories||s?.data||[]);normalizeReels();render();}catch(e){content.innerHTML='<div class="empty">İçerikler alınamadı. Tekrar deneyin.</div>'}
}
async function searchUsers(q){try{const d=await api('/search?q='+encodeURIComponent(q));const arr=Array.isArray(d)?d:(d?.users||d?.data||[]);return arr.map(u=>({username:String(u.username||'').trim().replace(/^@/,''),avatar:getAvatar(u),private:privateUser(u)})).filter(u=>u.username)}catch{return []}}
function renderTagIntro(tag){content.innerHTML=`<div class="tag-result" id="openTag"><div class="tag-icon">#</div><div><div class="username">#${esc(tag)}</div><div class="sub">Etiket gönderilerini gör</div></div></div>`;$('openTag').onclick=()=>{selectedTag=tag;renderTagPosts()}}
function renderTagPosts(){tagBack.style.display='inline';const re=new RegExp('#'+selectedTag.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');const posts=feed.filter(p=>re.test(postText(p)));if(!posts.length){content.innerHTML='<div class="empty">Bu etikette henüz gönderi yok</div>';return}content.innerHTML='<div class="posts">'+posts.map(p=>postHtml(p)).join('')+'</div>';bindPosts()}
function postHtml(p){const name=esc(p.username||'');const a=getAvatar(p);const u=mediaUrl(p);let media='';if(u){if(isVideo(p))media=`<video class="post-media" src="${esc(u)}" controls playsinline preload="metadata"></video>`;else media=`<img class="post-media" src="${esc(u)}" loading="lazy" alt="">`;}return `<article class="post" data-id="${esc(postId(p))}" data-user="${name}"><div class="post-head" data-profile="${name}">${avatar(a,name,false)}<strong>@${name}</strong></div>${media}<div class="caption">${esc(postText(p))}</div></article>`}
function bindPosts(){document.querySelectorAll('[data-profile]').forEach(x=>x.onclick=()=>openProfile(x.dataset.profile))}
function renderDiscovery(){if(!reels.length){content.innerHTML='<div class="empty"><div style="font-size:52px">⌕</div><div>Kullanıcı ara</div></div>';return}content.innerHTML='<div class="section-title">Videolar</div><div class="grid">'+reels.map((r,i)=>`<div class="tile" data-reel="${i}"><video src="${esc(r.mediaUri)}" muted playsinline preload="metadata"></video><span class="play">▶</span></div>`).join('')+'</div>';document.querySelectorAll('[data-reel]').forEach(x=>x.onclick=()=>openReel(+x.dataset.reel))}
function renderUsers(arr){if(!arr.length){content.innerHTML='<div class="empty">Kullanıcı bulunamadı</div>';return}content.innerHTML='<div class="users">'+arr.map(u=>{const st=storyFor(u.username);const has=!u.private&&st.length;return `<div class="user" data-user="${esc(u.username)}" data-story="${has?'1':'0'}">${avatar(u.avatar,u.username,has)}<div class="user-info"><div class="username">@${esc(u.username)}</div><div class="sub">${has?'Hikayeyi görmek için fotoğrafa dokun':'Hesabı görüntüle'}</div></div></div>`}).join('')+'</div>';document.querySelectorAll('[data-user]').forEach(el=>el.onclick=()=>{const n=el.dataset.user;if(el.dataset.story==='1'&&el.querySelector('.story-ring'))openStory(n);else openProfile(n)})}
async function doSearch(q){q=q.trim();clear.style.display=q?'block':'none';tagBack.style.display=selectedTag?'inline':'none';if(selectedTag){renderTagPosts();return}if(!q){renderDiscovery();return}if(q.startsWith('#')){const tag=q.slice(1).trim();if(tag)renderTagIntro(tag);else renderDiscovery();return}content.innerHTML='<div class="loading">Kullanıcılar aranıyor...</div>';const found=await searchUsers(q.replace(/^@/,''));renderUsers(found)}
function openProfile(name){if(name)location.href='profile.html?username='+encodeURIComponent(name)}
function openReel(i){const r=reels[i];if(!r)return; $('viewerUser').textContent='@'+r.username;$('viewerText').textContent=r.description||'';$('viewerVideo').src=r.mediaUri;$('viewer').classList.add('show');$('viewerVideo').play().catch(()=>{})}
function openStory(name){const st=storyFor(name);const s=st[0];if(!s)return;const u=s.mediaUrl||s.media_url||s.mediaUri||s.url||s.imageUrl||s.image_url||'';if(!u){openProfile(name);return}$('viewerUser').textContent='@'+name;$('viewerText').textContent='';$('viewerVideo').src=u;$('viewer').classList.add('show');$('viewerVideo').play().catch(()=>{})}
$('viewerClose').onclick=closeViewer;function closeViewer(){$('viewer').classList.remove('show');$('viewerVideo').pause();$('viewerVideo').removeAttribute('src');$('viewerVideo').load()}
input.addEventListener('input',()=>{clearTimeout(timer);selectedTag='';timer=setTimeout(()=>doSearch(input.value),100)});clear.onclick=()=>{input.value='';selectedTag='';doSearch('');input.focus()};tagBack.onclick=()=>{selectedTag='';tagBack.style.display='none';doSearch(input.value)};
let sy=0;document.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(window.scrollY<=2&&e.changedTouches[0].clientY-sy>100)loadData()},{passive:true});
loadData();
</script>
</body></html>
