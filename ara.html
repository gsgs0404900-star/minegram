<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ara - Minegram</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    padding-bottom:76px;
    overflow-x:hidden;
}

.app{
    width:100%;
    min-height:100vh;
    background:#000;
}

/* =========================
   ÜST BAR
========================= */

.top{
    height:70px;
    display:flex;
    align-items:center;
    padding:0 22px;
    border-bottom:1px solid #202020;
    position:sticky;
    top:0;
    background:#000;
    z-index:50;
}

.top b{
    font-size:21px;
}

/* =========================
   ARAMA ALANI
========================= */

.page{
    width:min(680px,100%);
    margin:0 auto;
    padding:22px 20px 40px;
}

.field{
    width:100%;
    height:50px;
    background:#080808;
    border:1px solid #444;
    color:#eee;
    border-radius:10px;
    padding:0 15px;
    outline:none;
    font-size:15px;
}

.field:focus{
    border-color:#4b99d2;
}

#results{
    margin-top:14px;
}

/* =========================
   KULLANICI SONUÇLARI
========================= */

.userrow{
    width:100%;
    min-height:66px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 4px;
    border-bottom:1px solid #222;
    cursor:pointer;
}

.avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#3f91cc;
    display:grid;
    place-items:center;
    color:#eee;
    font-size:18px;
    flex:none;
}

.userrow b{
    font-size:14px;
}

.profile-link{
    margin-left:auto;
    color:#4b99d2;
    font-size:13px;
}

/* =========================
   BOŞ DURUM
========================= */

.empty{
    text-align:center;
    padding:100px 20px;
    color:#999;
}

.empty strong{
    display:block;
    color:#eee;
    margin-bottom:7px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:92px;
    transform:translateX(-50%);
    background:#25232a;
    color:#fff;
    padding:10px 16px;
    border-radius:20px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:10000;
}

.toast.show{
    opacity:1;
}

/* =====================================================
   ALT MENÜ
   INDEX.HTML İLE AYNI SİSTEM
===================================================== */

.nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    width:100%;
    height:76px;

    background:#121018;
    border-top:1px solid #201d27;

    display:flex;
    align-items:stretch;

    z-index:9999;

    padding:
        5px
        max(8px, calc((100% - 760px) / 2))
        env(safe-area-inset-bottom);
}

/*
   Her buton eşit alanı kaplar.
   İçerik ise kendi alanının tam ortasında durur.
*/
.nav a{
    flex:1 1 0;

    height:66px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:3px;

    color:#ddd;
    text-decoration:none;

    font-size:9px;

    min-width:0;
}

/*
   Sadece ikon alanı kısa.
   Butonun tamamı uzun görünmüyor.
*/
.nav-icon{
    width:45px;
    height:32px;

    border-radius:18px;

    display:grid;
    place-items:center;

    flex:none;
}

/* AKTİF */
.nav a.active .nav-icon{
    background:#3b3150;
}

/* SVG */
.svg{
    width:21px;
    height:21px;

    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =========================
   MOBİL
========================= */

@media(max-width:699px){

    .top{
        height:62px;
        padding:0 14px;
    }

    .page{
        width:100%;
        padding:18px 14px 35px;
    }

    .nav{
        height:76px;

        padding:
            5px
            8px
            env(safe-area-inset-bottom);
    }

    .nav a{
        height:66px;
    }

    .nav-icon{
        width:45px;
        height:32px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- ÜST -->
    <header class="top">
        <b>Ara</b>
    </header>

    <!-- ARAMA -->
    <main class="page">

        <input
            id="sq"
            class="field"
            type="text"
            autocomplete="off"
            placeholder="#etiket veya kullanıcı adı ara"
        >

        <div id="results"></div>

    </main>

</div>


<!-- =====================================================
     ALT MENÜ
===================================================== -->

<nav class="nav">

    <!-- ANA SAYFA -->
    <a href="index.html">
        <span class="nav-icon">
            <svg class="svg" viewBox="0 0 24 24">
                <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>
            </svg>
        </span>
        <span>Ana Sayfa</span>
    </a>


    <!-- ARA -->
    <a class="active" href="ara.html">
        <span class="nav-icon">
            <svg class="svg" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="6.5"/>
                <path d="m16 16 5 5"/>
            </svg>
        </span>
        <span>Ara</span>
    </a>


    <!-- OLUŞTUR -->
    <a href="olustur.html">
        <span class="nav-icon">
            <svg class="svg" viewBox="0 0 24 24">
                <rect x="4" y="4" width="16" height="16" rx="4"/>
                <path d="M12 8v8M8 12h8"/>
            </svg>
        </span>
        <span>Oluştur</span>
    </a>


    <!-- REELS -->
    <a href="reels.html">
        <span class="nav-icon">
            <svg class="svg" viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <path d="M3 9h18M8 4l3 5M13 4l3 5"/>
            </svg>
        </span>
        <span>Reels</span>
    </a>


    <!-- PROFİL -->
    <a href="profile.html">
        <span class="nav-icon">
            <svg class="svg" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="3.5"/>
                <path d="M5 20a7 7 0 0 1 14 0"/>
            </svg>
        </span>
        <span>Profil</span>
    </a>

</nav>


<div id="toast" class="toast"></div>


<script>

const API="/api";

let token =
    localStorage.getItem("minegram_token") ||
    localStorage.getItem("minegram_supabase_token") ||
    null;


/* =========================
   API
========================= */

async function api(path,opt={}){

    const headers={
        ...(opt.headers||{})
    };

    if(token){
        headers.Authorization="Bearer "+token;
    }

    const response=await fetch(API+path,{
        ...opt,
        headers
    });

    const data=await response
        .json()
        .catch(()=>({}));

    if(!response.ok){
        throw new Error(
            data.error ||
            data.message ||
            "İşlem başarısız."
        );
    }

    return data;
}


/* =========================
   TOAST
========================= */

function toast(message){

    const el=document.getElementById("toast");

    el.textContent=message;

    el.classList.add("show");

    clearTimeout(window.__toast);

    window.__toast=setTimeout(()=>{
        el.classList.remove("show");
    },2200);
}


/* =========================
   HTML GÜVENLİĞİ
========================= */

function escapeHtml(value=""){

    return String(value).replace(
        /[&<>"']/g,
        char=>({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[char])
    );
}


/* =========================
   ARAMA
========================= */

const searchInput=
    document.getElementById("sq");

const results=
    document.getElementById("results");


let searchTimer=null;


searchInput.addEventListener(
    "input",
    ()=>{

        clearTimeout(searchTimer);

        searchTimer=setTimeout(
            searchUsers,
            250
        );

    }
);


async function searchUsers(){

    const q=
        searchInput.value.trim();

    if(!q){

        results.innerHTML="";

        return;
    }


    results.innerHTML=
        `<div style="color:#777;padding:20px 4px">
            Aranıyor...
        </div>`;


    try{

        const data=
            await api(
                "/search?q="+
                encodeURIComponent(q)
            );


        const users=
            Array.isArray(data)
                ? data
                : Array.isArray(data.users)
                    ? data.users
                    : [];


        if(!users.length){

            results.innerHTML=`
                <div class="empty">
                    <strong>Sonuç bulunamadı</strong>
                    Farklı bir kullanıcı adı dene.
                </div>
            `;

            return;
        }


        results.innerHTML=
            users.map(user=>{

                const username=
                    user.username ||
                    user.name ||
                    "minegram";

                const initial=
                    username
                        .charAt(0)
                        .toUpperCase();


                return `
                    <div
                        class="userrow"
                        onclick="openProfile('${escapeHtml(username)}')"
                    >

                        <div class="avatar">
                            ${escapeHtml(initial)}
                        </div>

                        <b>
                            @${escapeHtml(username)}
                        </b>

                        <span class="profile-link">
                            Profil ›
                        </span>

                    </div>
                `;

            }).join("");


    }catch(error){

        console.error(
            "[SEARCH]",
            error
        );

        results.innerHTML="";

        toast(
            error.message ||
            "Arama yapılamadı."
        );
    }
}


/* =========================
   PROFİLE GİT
========================= */

function openProfile(username){

    location.href=
        "profile.html?user="+
        encodeURIComponent(username);
}


/* =========================
   OTURUM KONTROLÜ
========================= */

async function init(){

    if(!token){

        location.replace(
            "giris.html"
        );

        return;
    }


    try{

        await api("/me");

    }catch(error){

        console.warn(
            "[ARA /me]",
            error
        );

        /*
           Token geçersizse giriş sayfasına git.
        */

        localStorage.removeItem(
            "minegram_token"
        );

        localStorage.removeItem(
            "minegram_supabase_token"
        );

        location.replace(
            "giris.html"
        );

        return;
    }
}


init();

</script>

</body>
</html>
