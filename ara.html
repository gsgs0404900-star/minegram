<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keşfet • Minegram</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;

  padding-bottom:76px;
}

body{
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  outline:0;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  width:100%;
  background:#000;
  border-bottom:1px solid #202020;
  padding:10px 12px;
}

.topbar-inner{
  width:100%;
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-title{
  flex:0 0 auto;
  font-size:21px;
  font-weight:800;
  letter-spacing:-.5px;
  white-space:nowrap;
}

.search-wrap{
  flex:1;
  min-width:0;
  position:relative;
}

.search-input{
  width:100%;
  height:42px;
  border-radius:13px;
  border:1px solid #292929;
  outline:none;
  background:#151515;
  color:#fff;
  padding:0 42px 0 42px;
  font-size:15px;
}

.search-input::placeholder{
  color:#777;
}

.search-input:focus{
  border-color:#444;
}

.search-icon{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  color:#aaa;
  pointer-events:none;
}

.search-clear{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  width:30px;
  height:30px;
  border-radius:50%;
  background:#292929;
  color:#fff;
  display:none;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.tag-back{
  display:none;
  flex:0 0 auto;
  height:40px;
  padding:0 12px;
  border-radius:11px;
  background:#191919;
  color:#fff;
  border:1px solid #2c2c2c;
  cursor:pointer;
}

/* =========================
   MAIN
========================= */

main{
  width:100%;
  max-width:1000px;
  margin:0 auto;
  padding-bottom:90px;
}

.page-info{
  padding:15px 14px 8px;
}

.page-info-title{
  font-size:18px;
  font-weight:800;
}

.page-info-sub{
  margin-top:4px;
  color:#888;
  font-size:13px;
}

/* =========================
   USER SEARCH
========================= */

.users{
  width:100%;
  padding:5px 10px 20px;
}

.user{
  width:100%;
  min-height:65px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 8px;
  border-radius:12px;
  cursor:pointer;
}

.user:hover{
  background:#111;
}

.user:active{
  background:#181818;
}

.user-info{
  min-width:0;
  flex:1;
}

.user-name-row{
  display:flex;
  align-items:center;
  min-width:0;
}

.username{
  font-size:15px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* =========================
   AVATAR
========================= */

.avatar{
  width:48px;
  height:48px;
  flex:0 0 48px;
  border-radius:50%;
  overflow:hidden;
  background:#202020;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:800;
  font-size:16px;
  position:relative;
}

.avatar img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.story-ring{
  padding:2px;
  background:linear-gradient(
    135deg,
    #ff3040,
    #ff006e,
    #8b2cff,
    #ff9d00
  );
}

.story-ring .avatar-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.story-ring img{
  border:2px solid #000;
  border-radius:50%;
}

/* =========================
   EMPTY / LOADING
========================= */

.state{
  width:100%;
  min-height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#777;
  padding:30px;
}

.loader{
  width:30px;
  height:30px;
  border:3px solid #333;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:auto;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   EXPLORE GRID
========================= */

.grid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  padding:2px;
}

.tile{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  overflow:hidden;
  background:#111;
  cursor:pointer;
}

.tile img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.tile-info{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:34px 8px 8px;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.85)
  );
  pointer-events:none;
}

.tile-user{
  font-size:12px;
  font-weight:700;
}

.tile-caption{
  margin-top:3px;
  font-size:11px;
  color:#ddd;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.hashtag{
  color:#4da3ff;
}

/* =========================
   HASHTAG FEED
========================= */

.hashtag-header{
  width:100%;
  padding:15px 14px;
  border-bottom:1px solid #202020;
}

.hashtag-title{
  font-size:19px;
  font-weight:800;
}

.hashtag-count{
  margin-top:4px;
  color:#888;
  font-size:13px;
}

.hashtag-feed{
  width:100%;
  max-width:700px;
  margin:0 auto;
  padding-bottom:25px;
}

.hashtag-post{
  width:100%;
  padding:14px 12px 18px;
  border-bottom:1px solid #222;
  background:#000;
}

.hashtag-post-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.hashtag-post-user{
  min-width:0;
  flex:1;
}

.hashtag-post-username{
  font-size:14px;
  font-weight:800;
}

.hashtag-post-time{
  margin-top:3px;
  color:#777;
  font-size:11px;
}

.hashtag-post-media{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:10px;
  background:#111;
  cursor:pointer;
}

.hashtag-post-media img,
.hashtag-post-media video{
  display:block;
  width:100%;
  max-height:720px;
  object-fit:contain;
  background:#000;
}

.hashtag-post-media img{
  min-height:180px;
}

.hashtag-video-badge{
  position:absolute;
  right:9px;
  top:9px;
  z-index:3;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.18);
  padding:5px 8px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
}

.hashtag-post-caption{
  margin-top:9px;
  color:#eee;
  font-size:14px;
  line-height:1.45;
  word-break:break-word;
}

.hashtag-no-result{
  padding:70px 20px;
  text-align:center;
  color:#777;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:200;
  height:66px;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(0,0,0,.97);
  border-top:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bottom-nav-inner{
  width:100%;
  max-width:700px;
  height:100%;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.bottom-nav a{
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:#888;
  font-size:10px;
  font-weight:600;
}

.bottom-nav a.active{
  color:#fff;
}

.nav-icon{
  width:25px;
  height:25px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================
   REEL VIEWER
========================= */

.viewer{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  background:#000;
}

.viewer.open{
  display:block;
}

.viewer-feed{
  width:100%;
  height:100%;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}

.reel-item{
  width:100%;
  height:100vh;
  min-height:100vh;
  position:relative;
  scroll-snap-align:start;
  background:#000;
  overflow:hidden;
}

.reel-video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.reel-top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:4;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px;
  padding-top:max(15px,env(safe-area-inset-top));
  background:linear-gradient(
    rgba(0,0,0,.55),
    transparent
  );
}

.reel-close{
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.reel-actions{
  position:absolute;
  right:12px;
  bottom:100px;
  z-index:5;
  display:flex;
  flex-direction:column;
  gap:13px;
}

.reel-action{
  width:45px;
  height:45px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.reel-bottom{
  position:absolute;
  left:12px;
  right:70px;
  bottom:22px;
  z-index:5;
  padding-bottom:env(safe-area-inset-bottom);
}

.reel-user{
  display:flex;
  align-items:center;
  gap:9px;
}

.reel-user .avatar{
  width:38px;
  height:38px;
  flex-basis:38px;
}

.reel-username{
  font-weight:800;
  font-size:14px;
}

.reel-caption{
  margin-top:8px;
  font-size:14px;
  line-height:1.4;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:700;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.65);
}

.modal.open{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:700px;
  max-height:82vh;
  overflow:hidden;
  background:#111;
  border-radius:20px 20px 0 0;
  border:1px solid #292929;
}

.modal-head{
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #292929;
}

.modal-title{
  font-size:16px;
  font-weight:800;
}

.modal-close{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#222;
  color:#fff;
  cursor:pointer;
}

.comments{
  max-height:calc(82vh - 56px);
  overflow-y:auto;
  padding:10px 14px 25px;
}

.comment{
  display:flex;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid #222;
}

.comment .avatar{
  width:36px;
  height:36px;
  flex-basis:36px;
  font-size:12px;
}

.comment-body{
  min-width:0;
  flex:1;
}

.comment-user{
  font-size:13px;
  font-weight:800;
}

.comment-text{
  margin-top:3px;
  color:#ddd;
  font-size:13px;
  line-height:1.4;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

  .logo-title{
    display:none;
  }

  .topbar-inner{
    gap:8px;
  }

  .search-input{
    height:44px;
  }

  .grid{
    gap:1px;
    padding:1px;
  }

  .hashtag-post{
    padding-left:8px;
    padding-right:8px;
  }

  .hashtag-post-media img,
  .hashtag-post-media video{
    max-height:620px;
  }

}

@media(min-width:800px){

  .grid{
    gap:4px;
    padding:4px;
  }

}
</style>

<script>
"use strict";

/* =========================================================
   API
========================================================= */

const API = "/api";

const TOKEN =
  localStorage.getItem("minegram_token") ||
  localStorage.getItem("minegram_supabase_token") ||
  localStorage.getItem("token") ||
  "";


/* =========================================================
   GLOBAL DATA
========================================================= */

let me = null;

let feed = [];

let stories = [];

let users = [];

let reels = [];

let commentsCache = {};

let currentSearch = "";

let currentTag = "";

let viewerIndex = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const content =
  document.getElementById("content");

const sq =
  document.getElementById("sq");

const clearBtn =
  document.getElementById("clear");

const tagBack =
  document.getElementById("tagBack");

const viewer =
  document.getElementById("viewer");

const viewerFeed =
  document.getElementById("viewerFeed");

const commentModal =
  document.getElementById("commentModal");

const commentsBox =
  document.getElementById("comments");

const commentClose =
  document.getElementById("commentClose");


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeRegExp(value){

  return String(value ?? "")
    .replace(/[.*+?^${}()|[\]\\]/g,"\\$&");

}


function initials(name){

  const value =
    String(name || "U")
      .trim()
      .replace(/^@/,"");

  if(!value){
    return "U";
  }

  return value
    .split(/\s+/)
    .slice(0,2)
    .map(x => x.charAt(0))
    .join("")
    .toUpperCase();

}


function authHeaders(){

  const headers = {
    "Content-Type":"application/json"
  };

  if(TOKEN){

    headers.Authorization =
      "Bearer " + TOKEN;

  }

  return headers;

}


async function apiFetch(
  path,
  options={}
){

  const response =
    await fetch(
      API + path,
      {
        ...options,
        headers:{
          ...authHeaders(),
          ...(options.headers || {})
        }
      }
    );

  if(!response.ok){

    throw new Error(
      "HTTP " + response.status
    );

  }

  const text =
    await response.text();

  if(!text){
    return null;
  }

  try{
    return JSON.parse(text);
  }catch{
    return text;
  }

}


/* =========================================================
   NORMALIZE
========================================================= */

function unwrapArray(data){

  if(Array.isArray(data)){
    return data;
  }

  if(!data || typeof data !== "object"){
    return [];
  }

  const keys = [
    "data",
    "items",
    "results",
    "users",
    "posts",
    "feed",
    "stories",
    "reels",
    "comments"
  ];

  for(const key of keys){

    if(Array.isArray(data[key])){
      return data[key];
    }

  }

  return [];

}


function normalizeUser(user){

  user = user || {};

  return {

    ...user,

    id:
      user.id ??
      user.user_id ??
      user.userId ??
      "",

    username:
      user.username ??
      user.user_name ??
      user.name ??
      user.handle ??
      "",

    avatar:
      user.avatar ??
      user.avatar_url ??
      user.avatarUrl ??
      user.profile_photo ??
      user.profilePhoto ??
      user.photo ??
      user.image ??
      "",

    private:
      Boolean(
        user.private ??
        user.is_private ??
        false
      )

  };

}


function normalizePost(post){

  post = post || {};

  return {

    ...post,

    id:
      post.id ??
      post.post_id ??
      post.postId ??
      "",

    user:
      post.user ??
      post.author ??
      post.owner ??
      null,

    username:
      post.username ??
      post.user_name ??
      post.author_username ??
      "",

    avatar:
      post.avatar ??
      post.avatar_url ??
      "",

    caption:
      post.caption ??
      post.text ??
      post.description ??
      "",

    text:
      post.text ??
      post.caption ??
      post.description ??
      "",

    image:
      post.image ??
      post.image_url ??
      post.imageUrl ??
      post.photo ??
      post.photo_url ??
      "",

    video:
      post.video ??
      post.video_url ??
      post.videoUrl ??
      post.video_src ??
      "",

    media:
      post.media ??
      post.media_url ??
      post.mediaUrl ??
      "",

    created_at:
      post.created_at ??
      post.createdAt ??
      post.date ??
      post.timestamp ??
      "",

    is_reel:
      Boolean(
        post.is_reel ??
        post.isReel ??
        post.reel ??
        false
      )

  };

}


/* =========================================================
   USERNAME
========================================================= */

function postUsername(post){

  const user =
    post?.user &&
    typeof post.user === "object"
      ? normalizeUser(post.user)
      : null;

  return String(
    post?.username ||
    user?.username ||
    post?.author_username ||
    post?.user_name ||
    ""
  ).replace(/^@/,"");

}


function postAvatar(post){

  const user =
    post?.user &&
    typeof post.user === "object"
      ? normalizeUser(post.user)
      : null;

  return (
    post?.avatar ||
    post?.avatar_url ||
    user?.avatar ||
    ""
  );

}


function postText(post){

  return String(
    post?.caption ??
    post?.text ??
    post?.description ??
    ""
  );

}


/* =========================================================
   MEDIA
========================================================= */

function mediaUrl(post){

  if(!post){
    return "";
  }

  return (
    post.image ||
    post.image_url ||
    post.imageUrl ||
    post.photo ||
    post.photo_url ||
    post.media ||
    post.media_url ||
    post.mediaUrl ||
    post.video ||
    post.video_url ||
    post.videoUrl ||
    ""
  );

}


function videoUrl(post){

  if(!post){
    return "";
  }

  return (
    post.video ||
    post.video_url ||
    post.videoUrl ||
    post.video_src ||
    (
      post.media_type === "video"
        ? post.media
        : ""
    ) ||
    (
      post.type === "video"
        ? post.media
        : ""
    ) ||
    ""
  );

}


function isVideo(post){

  if(!post){
    return false;
  }

  if(
    post.is_reel === true ||
    post.isReel === true ||
    post.reel === true
  ){
    return true;
  }

  if(
    post.media_type === "video" ||
    post.mediaType === "video" ||
    post.type === "video" ||
    post.content_type === "video"
  ){
    return true;
  }

  return Boolean(videoUrl(post));

}


/* =========================================================
   HASHTAG
========================================================= */

function hasExactHashtag(
  text,
  tag
){

  const clean =
    String(tag || "")
      .replace(/^#/,"")
      .trim()
      .toLowerCase();

  if(!clean){
    return false;
  }

  const regex =
    new RegExp(
      "(^|[^\\p{L}\\p{N}_])#" +
      escapeRegExp(clean) +
      "(?![\\p{L}\\p{N}_])",
      "iu"
    );

  return regex.test(
    String(text || "")
  );

}


function hashtagHtml(text){

  const source =
    esc(String(text || ""));

  return source.replace(
    /(^|[^\wçğıöşüÇĞİÖŞÜ])#([a-zA-Z0-9_çğıöşüÇĞİÖŞÜ]+)/gu,
    function(
      full,
      before,
      tag
    ){

      return (
        before +
        '<a class="hashtag" href="ara.html?query=' +
        encodeURIComponent("#"+tag) +
        '" onclick="openHashtag(event,\'' +
        esc(tag) +
        '\')">' +
        "#" + tag +
        "</a>"
      );

    }
  );

}


/* =========================================================
   STORIES
========================================================= */

function storyFor(username){

  const clean =
    String(username || "")
      .replace(/^@/,"")
      .toLowerCase();

  if(!clean){
    return [];
  }

  return stories.filter(story => {

    const storyUser =
      String(
        story.username ??
        story.user?.username ??
        story.user_name ??
        ""
      )
      .replace(/^@/,"")
      .toLowerCase();

    return storyUser === clean;

  });

}


function avatarHtml(
  avatar,
  username,
  hasStory=false
){

  const letter =
    esc(initials(username));

  if(hasStory){

    if(avatar){

      return `
        <div class="avatar story-ring">
          <div class="avatar-inner">
            <img
              src="${esc(avatar)}"
              alt=""
              onerror="this.style.display='none'"
            >
          </div>
        </div>
      `;

    }

    return `
      <div class="avatar story-ring">
        <div class="avatar-inner">
          ${letter}
        </div>
      </div>
    `;

  }

  if(avatar){

    return `
      <div class="avatar">
        <img
          src="${esc(avatar)}"
          alt=""
          onerror="this.style.display='none'"
        >
      </div>
    `;

  }

  return `
    <div class="avatar">
      ${letter}
    </div>
  `;

}

/* =========================================================
   SEARCH USERS
========================================================= */

async function searchUsers(query){

  const clean =
    String(query || "")
      .trim()
      .replace(/^@/,"");

  if(!clean){

    renderDiscovery();

    return;

  }

  currentSearch = clean;

  showLoading();

  try{

    const data =
      await apiFetch(
        "/search?q=" +
        encodeURIComponent(clean)
      );

    const result =
      unwrapArray(data)
        .map(normalizeUser)
        .filter(user => user.username);

    users = result;

    renderUsers(result);

  }catch(error){

    console.error(error);

    /*
      API araması çalışmazsa mevcut feed
      içerisindeki kullanıcıları da kontrol et.
    */

    const fallback =
      feed
        .map(post => {

          if(
            post.user &&
            typeof post.user === "object"
          ){
            return normalizeUser(post.user);
          }

          return normalizeUser({
            username:post.username,
            avatar:post.avatar
          });

        })
        .filter(user => {

          return (
            user.username &&
            user.username
              .toLowerCase()
              .includes(
                clean.toLowerCase()
              )
          );

        });

    const unique = [];

    const seen =
      new Set();

    for(const user of fallback){

      const key =
        user.username.toLowerCase();

      if(!seen.has(key)){

        seen.add(key);
        unique.push(user);

      }

    }

    renderUsers(unique);

  }

}

/* =========================================================
   DATE
========================================================= */

function formatDate(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return "";
  }

  return date.toLocaleDateString(
    "tr-TR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}

/* =========================================================
   HASHTAG OPEN
========================================================= */

function openHashtag(
  event,
  tag
){

  event?.preventDefault();
  event?.stopPropagation();

  const clean =
    String(tag || "")
      .trim();

  if(!clean){
    return;
  }

  try{

    sessionStorage.setItem(
      "minegram_search_tag",
      clean
    );

  }catch{}

  location.href =
    "ara.html?query=" +
    encodeURIComponent(
      clean.startsWith("#")
        ? clean
        : "#" + clean
    );

}


/* =========================================================
   REELS NORMALIZE
========================================================= */

function normalizeReels(){

  reels =
    feed
      .map(normalizePost)
      .filter(post => isVideo(post));

}


/* =========================================================
   OPEN REEL
========================================================= */

function openReel(index){

  if(index < 0){

    showToast(
      "Reel bulunamadı."
    );

    return;

  }

  normalizeReels();

  if(!reels.length){
    return;
  }

  viewerIndex =
    Math.max(
      0,
      Math.min(
        index,
        reels.length - 1
      )
    );

  renderViewer();

  viewer.classList.add("open");

  document.body.style.overflow =
    "hidden";

  setTimeout(() => {

    const item =
      viewerFeed.children[
        viewerIndex
      ];

    if(item){

      item.scrollIntoView({
        block:"start"
      });

    }

  },50);

}

/* =========================================================
   REEL OBSERVER
========================================================= */

function setupReelObserver(){

  const observer =
    new IntersectionObserver(
      entries => {

        entries.forEach(entry => {

          const video =
            entry.target.querySelector(
              ".reel-video"
            );

          if(!video){
            return;
          }

          if(entry.isIntersecting){

            video.play()
              .catch(() => {});

            viewerIndex =
              Number(
                entry.target.dataset.index
              );

          }else{

            video.pause();

          }

        });

      },
      {
        root:viewerFeed,
        threshold:.7
      }
    );

  document
    .querySelectorAll(".reel-item")
    .forEach(item => {

      observer.observe(item);

    });

}


/* =========================================================
   CLOSE VIEWER
========================================================= */

function closeViewer(){

  viewer.classList.remove("open");

  document.body.style.overflow =
    "";

  document
    .querySelectorAll(".reel-video")
    .forEach(video => {

      video.pause();

    });

}

async function openCommentsByPostId(id){

    return;
  }

  commentModal.classList.add("open");

  commentsBox.innerHTML = `
    <div class="state">
      <div class="loader"></div>
    </div>
  `;

  try{

    let data;

    try{

      data =
        await apiFetch(
          "/posts/" +
          encodeURIComponent(id) +
          "/comments"
        );

    }catch{

      data =
        await apiFetch(
          "/posts/" +
          encodeURIComponent(id)
        );

    }

    let comments =
      unwrapArray(data);

    if(
      data &&
      Array.isArray(data.comments)
    ){

      comments =
        data.comments;

    }

    comments =
      comments || [];

    renderComments(comments);

  }catch(error){

    console.error(error);

    commentsBox.innerHTML = `
      <div class="state">
        Yorumlar yüklenemedi.
      </div>
    `;

  }

}


function renderComments(comments){

  if(!comments.length){

    commentsBox.innerHTML = `
      <div class="state">
        Henüz yorum yok.
      </div>
    `;

    return;

  }

  commentsBox.innerHTML =
    comments.map(comment => {

      const user =
        normalizeUser(
          comment.user ||
          comment.author ||
          comment
        );

      const username =
        user.username ||
        comment.username ||
        "kullanıcı";

      const avatar =
        user.avatar ||
        comment.avatar ||
        "";

      const text =
        comment.text ||
        comment.comment ||
        comment.content ||
        comment.body ||
        "";

      return `

        <div class="comment">

          ${avatarHtml(
            avatar,
            username,
            false
          )}

          <div class="comment-body">

            <div class="comment-user">
              @${esc(username)}
            </div>

            <div class="comment-text">
              ${esc(text)}
            </div>

          </div>

        </div>

      `;

    }).join("");

}


function openComments(index){

  normalizeReels();

  const reel =
    reels[index];

  if(!reel){
    return;
  }

  openCommentsByPostId(
    reel.id
  );

}

/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  showLoading();

  try{

    const results =
      await Promise.allSettled([

        apiFetch("/me"),

        apiFetch("/feed"),

        apiFetch("/stories")

      ]);


    /* ME */

    if(
      results[0].status ===
      "fulfilled"
    ){

      me =
        results[0].value;

      if(
        me &&
        me.data
      ){

        me =
          me.data;

      }

    }


    /* FEED */

    if(
      results[1].status ===
      "fulfilled"
    ){

      const rawFeed =
        results[1].value;

      feed =
        unwrapArray(rawFeed)
          .map(normalizePost);

    }else{

      feed = [];

    }


    /* STORIES */

    if(
      results[2].status ===
      "fulfilled"
    ){

      stories =
        unwrapArray(
          results[2].value
        );

    }else{

      stories = [];

    }


    normalizeReels();

    initFromUrl();

  }catch(error){

    console.error(error);

    content.innerHTML = `
      <div class="state">
        İçerikler yüklenemedi.
      </div>
    `;

  }

}


/* =========================================================
   URL SEARCH
========================================================= */

function initFromUrl(){

  const params =
    new URLSearchParams(
      location.search
    );

  let query =
    params.get("query") ||
    params.get("q") ||
    "";

  if(!query){

    try{

      query =
        sessionStorage.getItem(
          "minegram_search_tag"
        ) || "";

    }catch{}

  }

  query =
    String(query).trim();

  if(query){

    sq.value =
      query;

    updateClearButton();

    if(
      query.startsWith("#")
    ){

      renderHashtagResults(
        query
      );

    }else{

      searchUsers(
        query
      );

    }

  }else{

    sq.value = "";

    updateClearButton();

    renderDiscovery();

  }

}


/* =========================================================
   SEARCH INPUT
========================================================= */

let searchTimer = null;

sq.addEventListener(
  "input",
  () => {

    updateClearButton();

    const value =
      sq.value.trim();

    clearTimeout(
      searchTimer
    );

    searchTimer =
      setTimeout(() => {

        runSearch(
          value
        );

      },250);

  }
);


sq.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      event.preventDefault();

      clearTimeout(
        searchTimer
      );

      runSearch(
        sq.value.trim()
      );

    }

  }
);


/* =========================================================
   RUN SEARCH
========================================================= */

function runSearch(value){

  const query =
    String(value || "")
      .trim();

  if(!query){

    currentSearch = "";

    currentTag = "";

    try{

      sessionStorage.removeItem(
        "minegram_search_tag"
      );

    }catch{}

    history.replaceState(
      {},
      "",
      "ara.html"
    );

    renderDiscovery();

    return;

  }


  history.replaceState(
    {},
    "",
    "ara.html?query=" +
    encodeURIComponent(query)
  );


  if(
    query.startsWith("#")
  ){

    try{

      sessionStorage.setItem(
        "minegram_search_tag",
        query
      );

    }catch{}

    renderHashtagResults(
      query
    );

    return;

  }


  try{

    sessionStorage.removeItem(
      "minegram_search_tag"
    );

  }catch{}

  searchUsers(
    query
  );

}


/* =========================================================
   CLEAR
========================================================= */

function updateClearButton(){

  clearBtn.style.display =
    sq.value.trim()
      ? "flex"
      : "none";

}


clearBtn.addEventListener(
  "click",
  () => {

    sq.value = "";

    currentSearch = "";

    currentTag = "";

    updateClearButton();

    try{

      sessionStorage.removeItem(
        "minegram_search_tag"
      );

    }catch{}

    history.replaceState(
      {},
      "",
      "ara.html"
    );

    renderDiscovery();

    sq.focus();

  }
);


/* =========================================================
   TAG BACK
========================================================= */

tagBack.addEventListener(
  "click",
  () => {

    sq.value = "";

    currentTag = "";

    currentSearch = "";

    updateClearButton();

    try{

      sessionStorage.removeItem(
        "minegram_search_tag"
      );

    }catch{}

    history.replaceState(
      {},
      "",
      "ara.html"
    );

    renderDiscovery();

  }
);


/* =========================================================
   ESC / CLOSE
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Escape"
    ){

      if(
        commentModal.classList.contains(
          "open"
        )
      ){

        closeComments();

        return;

      }

      if(
        viewer.classList.contains(
          "open"
        )
      ){

        closeViewer();

      }

    }

  }
);


/* =========================================================
   VIEWER SCROLL
========================================================= */

viewerFeed.addEventListener(
  "scroll",
  () => {

    const items =
      Array.from(
        viewerFeed.children
      );

    if(!items.length){
      return;
    }

    let closest =
      0;

    let distance =
      Infinity;

    items.forEach(
      (item,index) => {

        const rect =
          item.getBoundingClientRect();

        const d =
          Math.abs(
            rect.top
          );

        if(d < distance){

          distance = d;
          closest = index;

        }

      }
    );

    viewerIndex =
      closest;

  }
);


/* =========================================================
   INIT
========================================================= */

loadData();

</script>
