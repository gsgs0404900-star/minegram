<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ara - Minegram</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#000;color:#eee;font-family:Inter,Arial,sans-serif;padding-bottom:76px}
body{padding-bottom:78px}.app{width:100%;min-height:100vh;background:#000}.head{height:72px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:3}.head h1{font-size:21px;margin:0}.spacer{margin-left:auto}.icon{background:none;border:0;color:#eee;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.storybar{display:flex;padding:14px 18px 18px;border-bottom:1px solid #222}.story{text-align:center;font-size:10px;color:#aaa}.avatar{width:54px;height:54px;border-radius:50%;background:#4b99d2;display:grid;place-items:center;font-size:20px;position:relative}.plus{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;background:#ddd;color:#111;border-radius:50%;display:grid;place-items:center}
.feed{width:min(680px,100%);margin:0 auto}.card{margin:15px auto;border-bottom:1px solid #222;padding-bottom:16px;width:100%;max-width:680px}.posthead{display:flex;align-items:center;gap:10px;padding:0 14px}.posthead b{cursor:pointer}.postmedia{display:block;width:100%;max-height:680px;object-fit:cover;background:#111;margin-top:12px}.actions{display:flex;gap:18px;margin-top:9px;padding:0 14px}.actions button{background:none;border:0;color:#eee;font-size:15px;cursor:pointer}.caption{font-size:14px;margin-top:8px;padding:0 14px}
.nav{position:fixed;bottom:0;left:0;right:0;height:78px;background:#18161e;display:flex;padding:8px 5px;z-index:20}.nav a{flex:1;color:#ddd;text-decoration:none;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav i{display:grid;place-items:center;height:29px;width:46px;font-style:normal}.nav a.active i{background:#3c3450;border-radius:20px}.nav .ico{width:22px;height:22px}
.page{max-width:760px;margin:0 auto;padding:22px 20px}.top{height:62px;display:flex;align-items:center;border-bottom:1px solid #25222b;padding:0 20px;position:sticky;top:0;background:#000;z-index:3}.top b{font-size:19px}.back{background:none;border:0;color:#eee;font-size:30px;cursor:pointer}.field{width:100%;height:50px;background:#080808;border:1px solid #555;color:#eee;border-radius:8px;padding:0 14px;outline:none}.field:focus{border-color:#4b99d2}.btn{width:100%;height:48px;border:0;border-radius:24px;background:#4b99d2;color:#101820;font-weight:700;cursor:pointer}.picker{height:300px;border-radius:15px;background:#080808;border:1px solid #222;display:grid;place-items:center;text-align:center;color:#aaa;cursor:pointer}.picker span{font-size:48px;color:#4b99d2}.preview{max-width:100%;max-height:290px;border-radius:12px}.empty{text-align:center;padding:100px 20px;color:#999}.empty strong{display:block;color:#ddd;margin-top:14px}.empty small{display:block;margin-top:5px}.userrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #222;cursor:pointer}.userrow div:last-child{margin-left:auto;color:#4b99d2}
.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#252329;padding:10px 15px;border-radius:20px;opacity:0;pointer-events:none;transition:.2s;z-index:30;font-size:12px}.toast.show{opacity:1}
@media(max-width:699px){.feed{width:100%}.card{max-width:100%;margin:0 auto 16px}.postmedia{max-height:520px}.head{padding:0 16px}.page{padding:18px 16px}}
.nav{position:fixed;left:0;right:0;bottom:0;height:76px;background:#121018;border-top:1px solid #201d27;display:flex;z-index:100;padding:5px 8px env(safe-area-inset-bottom)}.nav a,.nav button{flex:1;color:#ddd;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;border:0;background:transparent;cursor:pointer}.nav-icon,.nav i{width:45px;height:32px;border-radius:18px;display:grid;place-items:center;font-style:normal}.nav a.active .nav-icon,.nav button.active .nav-icon,.nav.active .nav-icon{background:#3b3150}.nav .ico,.nav .svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><main class="app"><section><div class="top"><b>Ara</b></div><div class="page"><input id="sq" class="field" placeholder="#etiket veya kullanıcı adı ara" oninput="searchUsers()"><div id="results" style="margin-top:12px"></div></div></section><div id="toast" class="toast"></div></main><script>const API="/api";
const PREVIEW=new URLSearchParams(location.search).get("preview")==="1";
let token=localStorage.getItem("minegram_token"),me=null;
function navHTML(active){return `<div class="nav"><button class="${active==="home"?"on":""}" onclick="go('home')"><i><svg class="ico" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg></i>Ana Sayfa</button><button class="${active==="search"?"on":""}" onclick="go('search')"><i><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg></i>Ara</button><button onclick="go('create')"><i><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></i>Oluştur</button><button class="${active==="reels"?"on":""}" onclick="go('reels')"><i><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4l3 5M13 4l3 5"/></svg></i>Reels</button><button class="${active==="profile"?"on":""}" onclick="go('profile')"><i><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></i>Profil</button></div>`}
document.querySelectorAll("section#home,section#search,section#profile").forEach(s=>s.insertAdjacentHTML("beforeend",navHTML(s.id)));
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(API+path,opt);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"İşlem başarısız");return j}
function go(id){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
let el=document.getElementById(id);if(!el)return;el.classList.add("active");
if(PREVIEW){previewRender(id);return}
if(id==="home")feed();if(id==="profile")profile();if(id==="messages")messages();if(id==="search")searchUsers();if(id==="saved")saved();if(id==="notifications")notifications();if(id==="settings")loadSettings()
}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function previewRender(id){
  if(id==="home") previewHome();
  if(id==="search") previewSearch();
  if(id==="create") previewCreate();
  if(id==="reels") previewReels();
  if(id==="profile") previewProfile();
  if(id==="messages") previewMessages();
  if(id==="saved") previewSaved();
  if(id==="notifications") previewNotifications();
  if(id==="settings") previewSettings();
}
const previewPosts=[
 {id:"p1",user:{username:"minegram"},likes:12,comments:[{username:"ali",text:"Harika!"}],caption:"Minegram'a hoş geldiniz.",media:"",likedByMe:false,savedByMe:false},
 {id:"p2",user:{username:"demo_user"},likes:7,comments:[],caption:"İlk gönderini sen de paylaş.",media:"",likedByMe:false,savedByMe:false}
];
function previewHome(){
  const el=document.getElementById("feed");
  el.className="";
  el.innerHTML=previewPosts.map(p=>`<article class="card"><div class="posthead"><div class="avatar" style="width:38px;height:38px;font-size:14px">${p.user.username[0].toUpperCase()}</div><b>@${p.user.username}</b><button class="icon spacer" onclick="toast('Gönderi seçenekleri')">⋯</button></div><div class="caption"><b>@${p.user.username}</b> ${escapeHtml(p.caption)}</div><div class="actions"><button onclick="previewLike('${p.id}')">${p.likedByMe?'♥':'♡'} ${p.likes}</button><button onclick="toast('Yorumlar')">○ ${p.comments.length}</button><button onclick="previewSave('${p.id}')">${p.savedByMe?'🔖':'♧'}</button></div></article>`).join("");
}
function previewLike(id){const p=previewPosts.find(x=>x.id===id);if(!p)return;p.likedByMe=!p.likedByMe;p.likes+=p.likedByMe?1:-1;previewHome();toast(p.likedByMe?"Beğenildi":"Beğeni kaldırıldı")}
function previewSave(id){const p=previewPosts.find(x=>x.id===id);if(!p)return;p.savedByMe=!p.savedByMe;toast(p.savedByMe?"Kaydedildi":"Kayıttan kaldırıldı")}
function previewSearch(){results.innerHTML=`<div class="userrow"><div class="avatar">M</div><b>@minegram</b><div onclick="go('profile')">Profil ›</div></div><div class="userrow"><div class="avatar">D</div><b>@demo_user</b><div onclick="go('profile')">Profil ›</div></div>`}
function previewCreate(){toast("Önizleme: gönderi oluşturma ekranı")}
function previewReels(){toast("Önizleme: Reels sistemi")}
function previewProfile(){pname.textContent="minegram";pa.textContent="M";pc.textContent=previewPosts.length}
function previewMessages(){messagesList.innerHTML=`<div class="bubble">Minegram'a hoş geldin 👋</div><div class="bubble mine">Teşekkürler!</div>`}
function previewSaved(){savedList.className="";savedList.innerHTML=`<article class="card"><div class="caption"><b>@minegram</b> Kaydedilmiş örnek gönderi</div></article>`}
function previewNotifications(){notificationsList.innerHTML=`<div class="userrow"><div class="avatar">♥</div><div><b>@demo_user</b> gönderini beğendi.</div></div><div class="userrow"><div class="avatar">•</div><div><b>@ali</b> seni takip etti.</div></div>`}
function previewSettings(){document.getElementById("notifToggle").style.color="#4b99d2";document.getElementById("privateToggle").style.color="#777"}
function previewHomeEntry(){go("home");toast("Önizleme modu — gerçek giriş sistemi aktif")}
async function login(){try{let j=await api("/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:lu.value,password:lp.value})});token=j.token;if(!token){return toast("E-posta adresini doğrula, sonra giriş yap.")}localStorage.setItem("minegram_token",token);me=j.user;go("home")}catch(e){toast(e.message)}}
async function register(){try{let j=await api("/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:ru.value,email:re.value,password:rp.value,displayName:ru.value})});if(j.needsConfirmation){toast("E-posta adresine gelen doğrulama bağlantısını aç.");return}token=j.token;localStorage.setItem("minegram_token",token);me=j.user;go("home")}catch(e){toast(e.message)}}
async function forgotPassword(){try{await api("/forgot",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identifier:forgotId.value})});toast("Eğer hesap varsa kurtarma bağlantısı e-postana gönderildi.")}catch(e){toast(e.message)}}
function logout(){localStorage.removeItem("minegram_token");token=null;me=null;go("login")}
function toast(x){const t=document.getElementById("toast");if(!t)return;t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function escapeHtml(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

async function searchUsers(){let q=sq.value.trim();if(!q){results.innerHTML="";return}try{let u=await api("/search?q="+encodeURIComponent(q));results.innerHTML=u.map(x=>`<div class="userrow" onclick="location.href='profile.html?user=${encodeURIComponent(x.username)}'"><div class="avatar">${(x.username[0]||"M").toUpperCase()}</div><b>@${escapeHtml(x.username)}</b><div>Profil ›</div></div>`).join("")||"<p style='color:#999'>Sonuç bulunamadı.</p>"}catch(e){toast(e.message)}}
if(!token){location.href="index.html"}else{api("/me").then(u=>me=u).catch(()=>location.href="index.html")}
</script>
