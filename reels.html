<script>
let token=localStorage.getItem('minegram_token')||localStorage.getItem('minegram_supabase_token')||'';
let me=null,reels=[],currentCommentReel=null,observer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const first=(...v)=>v.find(x=>x!==undefined&&x!==null&&String(x).trim()!=='')??'';
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2600)}
async function api(url,opt={}){if(!token){location.replace('giris.html');throw Error('Oturum gerekli')}const headers={...(opt.headers||{}),Authorization:'Bearer '+token};if(opt.body&&!(opt.body instanceof FormData)){headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(url,{...opt,headers,credentials:'same-origin'});if(r.status===401){localStorage.removeItem('minegram_token');localStorage.removeItem('minegram_supabase_token');token='';location.replace('giris.html');throw Error('Oturum süresi doldu')}const raw=await r.text();let j=null;try{j=raw?JSON.parse(raw):null}catch{}if(!r.ok)throw Error(j?.error||j?.message||'Sunucu işlemi başarısız ('+r.status+')');return j}
function getList(x){return Array.isArray(x)?x:Array.isArray(x?.posts)?x.posts:Array.isArray(x?.feed)?x.feed:Array.isArray(x?.data)?x.data:Array.isArray(x?.items)?x.items:Array.isArray(x?.results)?x.results:[]}
function usernameFromMe(){return String(first(me?.username,me?.user?.username,me?.profile?.username,localStorage.getItem('username'),localStorage.getItem('currentUser'))).trim()}
function hasVerified(p){const v=first(p?.verified,p?.isVerified,p?.premiumVerified,p?.premium_verified,p?.user?.verified,p?.author?.verified);const prem=first(p?.premium,p?.isPremium,p?.user?.premium,p?.user?.isPremium,p?.author?.premium,p?.author?.isPremium);return v===true||String(v).toLowerCase()==='true'||prem===true||String(prem).toLowerCase()==='true'}
function mediaUrl(p){const m=p?.media;if(m&&typeof m==='object')return first(p?.mediaUrl,p?.media_url,p?.videoUrl,p?.video_url,p?.mediaUri,m?.url,m?.uri,m?.src);return first(p?.mediaUrl,p?.media_url,p?.videoUrl,p?.video_url,p?.mediaUri,p?.media,p?.video)}
function isVideo(p){const m=p?.media;const t=String(first(p?.mediaType,p?.type,p?.mimeType,p?.videoType,m?.type)).toLowerCase();const u=String(mediaUrl(p)).toLowerCase().split(/[?#]/)[0];return t.includes('video')||/\.(mp4|webm|mov|m4v|3gp)$/.test(u)||!!p?.videoUrl||!!p?.video_url||!!p?.video}
function normalize(p,i){const u=p?.user||p?.author||p?.owner||{};return{raw:p,id:String(first(p?.id,p?.postId,p?.uuid,'reel-'+i)),username:String(first(p?.username,u?.username,p?.ownerUsername,p?.author?.username,p?.owner?.username)).trim(),caption:String(first(p?.caption,p?.text,p?.description,'Yeni Reels 🔥')),likes:Array.isArray(p?.likes)?p.likes.length:Number(first(p?.likesCount,p?.like_count,p?.likes,0))||0,views:Number(first(p?.views,p?.viewCount,p?.view_count,0))||0,url:String(mediaUrl(p)),avatar:String(first(p?.avatar,p?.avatar_url,p?.avatarUrl,p?.profilePhoto,p?.profile_photo,u?.avatar,u?.avatar_url,u?.avatarUrl)).trim(),following:Boolean(first(p?.followingByMe,p?.following,false)),date:first(p?.createdAt,p?.created_at,p?.date,p?.timestamp,''),music:p?.music||null}}
function render(){window.__minegramReels=reels;const feed=document.getElementById('feed');if(observer){observer.disconnect();observer=null}if(!reels.length){feed.innerHTML='<div class="empty"><div class="movie">🎬</div><b>Henüz Reel yok</b><span>İlk videoyu sen paylaş.</span></div>'+addButton();return}feed.innerHTML=reels.map((r,i)=>{const name=esc(r.username);const avatar=r.avatar?'<img src="'+esc(r.avatar)+'" alt="">':esc((r.username||'M').charAt(0).toUpperCase());const music=typeof r.music==='object'&&r.music?'<div class="music">'+(r.music.artworkUrl?'<img src="'+esc(r.music.artworkUrl)+'">':'')+'<div><b>'+esc(first(r.music.title,r.music.name,''))+'</b><span>'+esc(first(r.music.artist,''))+'</span></div></div>':'';const own=r.username&&r.username.toLowerCase()===usernameFromMe().toLowerCase();return '<article class="reel" data-index="'+i+'" data-id="'+esc(r.id)+'"><video data-src="'+esc(r.url)+'" playsinline loop preload="metadata"></video><div class="shade"></div><button class="center-play" onclick="togglePlay('+i+')" aria-label="Oynat"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button><div class="reel-progress"><span class="reel-time current-time">0:00 / 0:00</span><input class="reel-range" type="range" min="0" max="100" value="0" step="0.1" oninput="seekReel('+i+',this.value)" aria-label="Video ilerlemesi"><button class="reel-sound" onclick="toggleMute('+i+')" aria-label="Ses"><svg class="sound-svg" viewBox="0 0 24 24"><path class="speaker" d="M4 10v4h4l5 4V6l-5 4H4z"/><path class="waves" d="M16 9.5c1.7 1.7 1.7 3.3 0 5M18.5 7c3 3 3 7 0 10"/><path class="mute-slash" d="M5 5L19 19"/></svg></button></div><button class="topbtn back" onclick="location.href=\'index.html\'">‹</button>'+addButton()+'<div class="actions"><button class="action like" onclick="likeReel('+i+')"><span class="ico"><svg viewBox="0 0 24 24"><path d="M20.8 8.7c0 5.1-8.8 10.8-8.8 10.8S3.2 13.8 3.2 8.7A4.7 4.7 0 0 1 8 4c1.5 0 3 .8 4 2 1-1.2 2.5-2 4-2a4.7 4.7 0 0 1 4.8 4.7z"/></svg></span><span class="num">'+r.likes+'</span></button><div class="action view-stat"><span class="ico"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.5"/></svg></span><span class="num">'+r.views+'</span></div><button class="action" onclick="openComments('+i+')"><span class="ico"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5c-1.14 0-2.22-.25-3.19-.69L4 20l1.69-4.19A7.46 7.46 0 0 1 5 11.5 7.5 7.5 0 1 1 20 11.5Z"/></svg></span><span class="num comment-count">'+(r.commentCount||0)+'</span></button><button class="action share" onclick="shareReel('+i+')"><span class="ico"><svg viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2 .01 7z"/></svg></span></button></div><div class="info"><div class="userrow"><div class="avatar" onclick="goProfile(\''+encodeURIComponent(r.username)+'\')">'+avatar+'</div><div class="usercol"><div><span class="username" onclick="goProfile(\''+encodeURIComponent(r.username)+'\')">@'+name+'</span>'+(hasVerified(r.raw)?'<span class="verify">✓</span>':'')+(own?'':'<button class="follow" onclick="toggleFollow('+i+')">'+(r.following?'Takibi Bırak':'Takip Et')+'</button>')+'</div></div></div><div class="date">'+esc(formatDate(r.date))+'</div>'+music+'<div class="desc">'+esc(r.caption)+'</div></div></article>'}).join('');setupVideos()}
function addButton(){return '<button class="topbtn add" onclick="openPicker()">+</button>'}
function formatDate(v){if(!v)return '';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function goProfile(u){location.href='ara.html?username='+u}
async function loadAuthenticatedVideo(url){if(!url||!token)return url;try{const r=await fetch(url,{headers:{Authorization:'Bearer '+token},credentials:'same-origin'});if(r.ok){const b=await r.blob();return URL.createObjectURL(b)}}catch{}return url}
async function setupVideos(){
 const articles=[...document.querySelectorAll('.reel')];
 await Promise.all(articles.map(async(a,i)=>{
  const v=a.querySelector('video'); const reel=reels[i]; if(!reel?.url)return;
  const u=await loadAuthenticatedVideo(reel.url); if(!u)return;
  v.src=u; v.muted=true; v.defaultMuted=true; v.volume=0; v.load();
  v.addEventListener('loadedmetadata',()=>{updateProgress(i);updateSoundIcon(i,true)},{once:true});
  v.addEventListener('timeupdate',()=>updateProgress(i));
  v.addEventListener('play',()=>setPlayIcon(i,false));
  v.addEventListener('pause',()=>setPlayIcon(i,true));
  v.addEventListener('ended',()=>{setPlayIcon(i,true);updateProgress(i)});
 }));
 observer=new IntersectionObserver(()=>{
  let active=null,best=0;
  articles.forEach((a)=>{const r=a.getBoundingClientRect();const vh=window.innerHeight||document.documentElement.clientHeight;const visible=Math.max(0,Math.min(r.bottom,vh)-Math.max(r.top,0));const ratio=r.height>0?visible/r.height:0;if(ratio>best){best=ratio;active=a;}});
  articles.forEach((a,j)=>{const x=a.querySelector('video');if(!x)return;if(a===active&&best>.55){x.muted=false;x.defaultMuted=false;x.volume=1;x.play().catch(()=>{});updateSoundIcon(j,false);viewCount(j,true);}else{x.pause();x.muted=true;x.defaultMuted=true;x.volume=0;updateSoundIcon(j,true);}});
},{threshold:[0,.25,.55,.75,.95]});
 articles.forEach(a=>{const v=a.querySelector('video');v.addEventListener('click',()=>togglePlay(Number(a.dataset.index)));observer.observe(a)});
}
function setPlayIcon(i,show){const a=document.querySelectorAll('.reel')[i];if(!a)return;const b=a.querySelector('.center-play');if(b)b.style.display=show?'grid':'none'}
function togglePlay(i){const v=document.querySelectorAll('.reel video')[i];if(!v)return;if(v.paused){v.play().catch(()=>{});setPlayIcon(i,false)}else{v.pause();setPlayIcon(i,true)}}
function toggleMute(i){const v=document.querySelectorAll('.reel video')[i];if(!v)return;v.muted=!v.muted;v.volume=v.muted?0:1;updateSoundIcon(i,v.muted);if(!v.muted)v.play().catch(()=>{})}
function updateSoundIcon(i,muted){const a=document.querySelectorAll('.reel')[i];const x=a?.querySelector('.sound-svg');if(!x)return;x.innerHTML='<path class=\"speaker\" d=\"M4 10v4h4l5 4V6l-5 4H4z\"/><path class=\"waves\" d=\"M16 9.5c1.7 1.7 1.7 3.3 0 5M18.5 7c3 3 3 7 0 10\"/><path class=\"mute-slash\" d=\"M5 5L19 19\"/>';a.querySelector('.reel-sound')?.classList.toggle('muted',!!muted)}
function formatVideoTime(sec){if(!Number.isFinite(sec)||sec<0)sec=0;sec=Math.floor(sec);const m=Math.floor(sec/60),s=String(sec%60).padStart(2,'0');return m+':'+s}function updateProgress(i){const a=document.querySelectorAll('.reel')[i];const v=a?.querySelector('video');const range=a?.querySelector('.reel-range');const cur=a?.querySelector('.current-time');const dur=a?.querySelector('.duration-time');if(!v||!range)return;const pct=v.duration?Math.min(100,(v.currentTime/v.duration)*100):0;range.value=pct;if(cur)cur.textContent=formatVideoTime(v.currentTime)+' / '+formatVideoTime(v.duration);range.style.background='linear-gradient(to right,#42a5f5 0%,#42a5f5 '+pct+'%,#4b435d '+pct+'%,#4b435d 100%)'}function seekReel(i,pct){const a=document.querySelectorAll('.reel')[i];const v=a?.querySelector('video');if(!v||!Number.isFinite(v.duration))return;v.currentTime=(Number(pct)/100)*v.duration;updateProgress(i)}
const seen=new Set();function viewCount(i){const r=reels[i];if(!r||seen.has(r.id))return;seen.add(r.id);const key='viewed_'+usernameFromMe()+'_'+r.id;const p=localStorage.getItem(key);if(!p){r.views++;localStorage.setItem(key,'1');const el=document.querySelectorAll('.reel')[i]?.querySelector('.action:nth-child(2) .num');if(el)el.textContent=r.views}}
async function likeReel(i){const r=reels[i];if(!r)return;const btn=document.querySelectorAll('.reel')[i]?.querySelector('.like');const liked=btn?.classList.contains('liked');r.likes=Math.max(0,r.likes+(liked?-1:1));btn?.classList.toggle('liked',!liked);if(btn)btn.querySelector('.ico').textContent=liked?'♡':'♥';if(btn)btn.querySelector('.num').textContent=r.likes;try{await api('/api/posts/'+encodeURIComponent(r.id)+'/like',{method:'POST'})}catch(e){/* UI remains usable if backend route differs */}}

function readMinegramRequestedReel(){
  const params=new URLSearchParams(location.search);

  const fromUrl={
    id:params.get("id") || "",
    username:params.get("username") || "",
    media:params.get("media") || "",
    mediaType:params.get("type") || ""
  };

  let session=null;
  let local=null;
  let selected=null;

  try{
    session=JSON.parse(
      sessionStorage.getItem("minegram_requested_reel") || "null"
    );
  }catch(_){ session=null; }

  try{
    local=JSON.parse(
      localStorage.getItem("minegram_requested_reel") || "null"
    );
  }catch(_){ local=null; }

  try{
    selected=JSON.parse(
      sessionStorage.getItem("minegram_selected_post") ||
      localStorage.getItem("minegram_selected_post") ||
      "null"
    );
  }catch(_){ selected=null; }

  const cached=session || local || {};
  const cachedPost=cached?.post || selected || {};

  const pickMedia=function(p){
    if(!p) return "";
    const m=p.media;

    if(typeof m === "object" && m){
      return String(
        p.mediaUrl || p.media_url ||
        p.videoUrl || p.video_url ||
        p.mediaUri ||
        m.url || m.uri || m.src || m.href ||
        m.downloadURL || m.downloadUrl ||
        ""
      ).trim();
    }

    return String(
      p.media ||
      p.mediaUri ||
      p.media_url ||
      p.mediaUrl ||
      p.video ||
      p.videoUrl ||
      p.video_url ||
      p.url ||
      p.src ||
      ""
    ).trim();
  };

  const media=
    fromUrl.media ||
    pickMedia(cached) ||
    pickMedia(cachedPost);

  const id=
    fromUrl.id ||
    String(cached.id || cachedPost.id || cachedPost.postId || cachedPost.uuid || cachedPost._id || "");

  const username=
    fromUrl.username ||
    String(
      cached.username ||
      cachedPost.username ||
      cachedPost.user?.username ||
      cachedPost.author?.username ||
      cachedPost.owner?.username ||
      ""
    );

  const mediaType=
    fromUrl.mediaType ||
    String(
      cached.mediaType ||
      cachedPost.mediaType ||
      cachedPost.media_type ||
      cachedPost.mimeType ||
      cachedPost.type ||
      "video"
    );

  return {
    requested:
      params.get("openMinegramReel")==="1" ||
      !!session ||
      !!local,
    id:id,
    username:username,
    media:media,
    mediaType:mediaType,
    caption:String(
      cached.caption ||
      cachedPost.caption ||
      cachedPost.text ||
      cachedPost.description ||
      ""
    ),
    avatar:String(
      cached.avatar ||
      cachedPost.avatar ||
      cachedPost.avatar_url ||
      cachedPost.avatarUrl ||
      cachedPost.user?.avatar ||
      cachedPost.user?.avatar_url ||
      cachedPost.user?.avatarUrl ||
      ""
    ),
    likes:Number(
      cached.likes ??
      cachedPost.likesCount ??
      cachedPost.like_count ??
      (Array.isArray(cachedPost.likes) ? cachedPost.likes.length : cachedPost.likes) ??
      0
    ) || 0,
    views:Number(
      cached.views ??
      cachedPost.views ??
      cachedPost.viewCount ??
      cachedPost.view_count ??
      0
    ) || 0,
    commentCount:Number(
      cached.commentCount ??
      cachedPost.commentCount ??
      cachedPost.comment_count ??
      0
    ) || 0,
    date:String(
      cached.date ||
      cachedPost.createdAt ||
      cachedPost.created_at ||
      cachedPost.date ||
      cachedPost.timestamp ||
      ""
    ),
    post:cachedPost
  };
}

async function loadReels(){
  const feed=document.getElementById('feed');
  const requested=readMinegramRequestedReel();
  const params=new URLSearchParams(location.search);
  const direct=params.get('openMinegramReel')==='1';

  feed.innerHTML='<div class="loading"><span class="spinner"></span>Reels yükleniyor...</div>';

  try{
    if(!token){
      location.href='giris.html';
      return;
    }

    try{me=await api('/api/me')}catch(_){}

    /*
     * =====================================================
     * ANASAYFADAN TIKLANAN REEL
     * =====================================================
     *
     * Burada KESİNLİKLE /api/feed çağrılmıyor.
     * URL + sessionStorage + localStorage içindeki
     * aynı Reel kullanılıyor.
     */
    if(direct){

      if(!requested.media){
        reels=[];
        window.__minegramReels=[];
        feed.innerHTML=
          '<div class="empty">'+
            '<div class="movie">⚠️</div>'+
            '<b>Bu Reel bulunamadı</b>'+
            '<span>Tıklanan videonun adresi alınamadı. Başka bir Reel açılmadı.</span>'+
          '</div>';
        return;
      }

      const exact={
        id:String(requested.id || 'clicked-reel'),
        username:String(requested.username || ''),
        media:String(requested.media),
        mediaType:String(requested.mediaType || 'video'),
        caption:String(requested.caption || 'Yeni Reels 🔥'),
        avatar:String(requested.avatar || ''),
        likes:Number(requested.likes || 0),
        views:Number(requested.views || 0),
        commentCount:Number(requested.commentCount || 0),
        date:String(requested.date || '')
      };

      /*
       * Sadece tıklanan video.
       * Feed'deki diğer videolar buraya kesinlikle eklenmez.
       */
      reels=[{
        raw:requested.post && typeof requested.post==='object'
          ? {...requested.post,...exact}
          : exact,
        id:exact.id,
        username:exact.username,
        caption:exact.caption,
        likes:exact.likes,
        views:exact.views,
        url:exact.media,
        avatar:exact.avatar,
        following:false,
        date:exact.date,
        music:null,
        commentCount:exact.commentCount
      }];

      window.__minegramReels=reels;
      render();

      /*
       * Tek Reel olduğu için her zaman 0. Reel tıklanan Reel'dir.
       */
      setTimeout(function(){
        const el=document.querySelector('.reel[data-index="0"]');
        if(!el)return;

        el.scrollIntoView({block:'start'});

        document.querySelectorAll('.reel video').forEach(function(x){
          x.pause();
          x.muted=true;
          x.defaultMuted=true;
          x.volume=0;
        });

        const v=el.querySelector('video');

        if(v){
          const playSelected=function(){
            v.muted=false;
            v.defaultMuted=false;
            v.volume=1;
            v.play().catch(function(){});
            updateSoundIcon(0,false);
          };

          if(v.readyState>=2){
            playSelected();
          }else{
            v.addEventListener('loadeddata',playSelected,{once:true});
            v.addEventListener('loadedmetadata',playSelected,{once:true});
          }
        }
      },350);

      try{
        sessionStorage.removeItem('minegram_requested_reel');
        localStorage.removeItem('minegram_requested_reel');
      }catch(_){ }

      return;
    }

    /*
     * =====================================================
     * NORMAL REELS SAYFASI
     * =====================================================
     *
     * Reels sekmesine normal girişte eski sistem aynen
     * çalışmaya devam eder ve tüm Reels yüklenir.
     */
    let response;

    try{
      response=await api('/api/feed');
    }catch(feedErr){
      console.warn(
        '[REELS] /api/feed failed, trying /api/posts',
        feedErr
      );
      response=await api('/api/posts');
    }

    const posts=getList(response);

    reels=posts
      .filter(isVideo)
      .map(normalize)
      .filter(r=>r.url&&r.username);

    window.__minegramReels=reels;
    render();

  }catch(e){
    console.error('[REELS]',e);

    feed.innerHTML=
      '<div class="empty">'+
        '<div class="movie">⚠️</div>'+
        '<b>Reels yüklenemedi</b>'+
        '<span>'+esc(e.message||'Sunucuya bağlanılamadı.')+'</span>'+
      '</div>'+addButton();
  }
}
