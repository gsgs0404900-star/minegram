<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding-bottom:76px;
  overflow-x:hidden;
}

.app{
  width:100%;
  min-height:100vh;
  background:#000;
}

/* =========================
   ÜST BAR
========================= */

.top{
  height:70px;

  display:flex;
  align-items:center;

  padding:0 22px;

  border-bottom:1px solid #202020;

  position:sticky;
  top:0;

  background:#000;

  z-index:50;
}

.top b{
  font-size:21px;
}


/* =========================
   ORTA ALAN
========================= */

.page{
  width:min(680px,100%);

  margin:0 auto;

  padding:22px 20px 40px;
}


/* =========================
   REELS ALANI
========================= */

.reels-box{

  width:100%;

  min-height:calc(100vh - 150px);

  display:flex;

  align-items:center;

  justify-content:center;
}

.empty{

  width:100%;

  text-align:center;

  color:#999;
}

.empty svg{

  width:52px;
  height:52px;

  margin:0 auto;

  display:block;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;

  stroke-linejoin:round;
}

.empty strong{

  display:block;

  color:#ddd;

  margin-top:14px;

  font-size:16px;
}

.empty small{

  display:block;

  margin-top:6px;

  color:#888;

  font-size:13px;
}


/* =========================
   ALT MENÜ
   ARA.HTML İLE AYNI
========================= */

.nav{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  width:100%;

  height:76px;

  background:#121018;

  border-top:1px solid #201d27;

  display:flex;

  align-items:stretch;

  z-index:9999;

  padding:
    5px
    max(8px, calc((100% - 760px) / 2))
    env(safe-area-inset-bottom);
}


/* MENÜ BUTONLARI */

.nav a{

  flex:1 1 0;

  height:66px;

  min-width:0;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:3px;

  color:#ddd;

  text-decoration:none;

  font-size:9px;

  -webkit-tap-highlight-color:transparent;
}


/* İKON ALANI */

.nav-icon{

  width:45px;

  height:32px;

  border-radius:18px;

  display:grid;

  place-items:center;

  flex:none;
}


/* AKTİF */

.nav a.active .nav-icon{

  background:#3b3150;
}


/* SVG */

.svg{

  width:21px;

  height:21px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;

  stroke-linejoin:round;
}


/* =========================
   MOBİL
========================= */

@media(max-width:699px){

  .top{

    height:62px;

    padding:0 14px;
  }


  .page{

    width:100%;

    padding:18px 14px 35px;
  }


  .reels-box{

    min-height:calc(100vh - 145px);
  }


  .nav{

    height:76px;

    padding:
      5px
      8px
      env(safe-area-inset-bottom);
  }


  .nav a{

    height:66px;
  }


  .nav-icon{

    width:45px;

    height:32px;
  }

}


/* =========================
   MASAÜSTÜ
========================= */

@media(min-width:700px){

  .nav{

    padding-left:
      calc((100% - 760px) / 2);

    padding-right:
      calc((100% - 760px) / 2);
  }

}
</style>


<style id="minegram-reels-system">

.reel-comments{position:fixed;left:0;right:0;bottom:0;height:55%;background:rgba(0,0,0,.94);z-index:2147483646;color:#fff;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding:8px}
.reel-comments-head{display:flex;align-items:center;padding:8px}.reel-comments-head b{flex:1}.reel-comments-list{flex:1;overflow:auto;padding:12px}.reel-comments-input{display:flex;gap:8px;padding:8px}.reel-comments-input input{flex:1;background:#111;color:#fff;border:1px solid #555;border-radius:10px;padding:12px}.reel-comments-input button{border:0;background:#3b3150;color:#fff;border-radius:10px;padding:0 15px}
@media(max-width:699px){.reel-card{height:calc(100vh - 145px);min-height:0;border-radius:0}.reels-back{top:70px}.reel-info{bottom:15px}.reel-actions{bottom:15px}#reelAddButton{bottom:84px!important}}

<script>

/* =========================
   API
========================= */

const API="/api";


/* =========================
   TOKEN
========================= */

let token =
  localStorage.getItem("minegram_token") ||
  localStorage.getItem("minegram_supabase_token") ||
  null;


/* =========================
   API KONTROL
========================= */

async function checkSession(){

  /* TOKEN YOKSA GİRİŞ */

  if(!token){

    location.replace("giris.html");

    return;
  }


  try{

    const response =
      await fetch(
        API + "/me",
        {
          headers:{
            Authorization:
              "Bearer " + token
          }
        }
      );


    if(!response.ok){

      throw new Error(
        "Oturum geçersiz"
      );

    }


    await response
      .json()
      .catch(()=>({}));


  }catch(error){

    console.warn(
      "[REELS /me]",
      error
    );


    localStorage.removeItem(
      "minegram_token"
    );

    localStorage.removeItem(
      "minegram_supabase_token"
    );


    location.replace(
      "giris.html"
    );

  }

}


/* =========================
   BAŞLAT
========================= */

checkSession();

</script>


<script id="minegram-reels-system-js">
(function(){
 const DB='minegram_reels_db', STORE='reels';
 let dbPromise;
 function username(){return localStorage.getItem('username')||localStorage.getItem('currentUser')||localStorage.getItem('minegram_username')||'kullanici'}
 function db(){
  if(dbPromise)return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
   const r=indexedDB.open(DB,1);
   r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE)){r.result.createObjectStore(STORE,{keyPath:'id'})}};
   r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  }); return dbPromise;
 }
 async function load(){const d=await db();return new Promise((res,rej)=>{const q=d.transaction(STORE,'readonly').objectStore(STORE).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
 async function saveAll(a){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite'),st=tx.objectStore(STORE);st.clear();a.forEach(x=>st.put(x));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 async function render(){
  const box=document.querySelector('.reels-box'); if(!box)return;
  let reels=[]; try{reels=await load()}catch(e){console.error(e);box.innerHTML='<div class="empty"><strong>Reels yüklenemedi</strong><small>Sayfayı yenileyip tekrar deneyin.</small></div>';return}
  box.innerHTML='';
  if(!reels.length){box.innerHTML='<div class="empty"><strong>Henüz Reel yok</strong><small>İlk videoyu sen paylaş.</small></div>';return}
  const creators=[...new Set(reels.map(r=>String(r.username||'').trim()).filter(Boolean))]; const discover=document.createElement('div');discover.className='reels-discover-tags';discover.innerHTML='<b>Keşfet</b> '+creators.map(u=>'<button type="button" class="discover-tag" data-creator="'+esc(u)+'">@'+esc(u)+'</button>').join('');box.appendChild(discover); creators.forEach(u=>{const b=[...discover.querySelectorAll('.discover-tag')].find(x=>x.dataset.creator===u);if(b)b.onclick=()=>openCreator(u)}); const feed=document.createElement('div');feed.className='reels-feed';box.appendChild(feed);
  reels.forEach(r=>{
   const card=document.createElement('article');card.className='reel-card';card.dataset.id=r.id;
   card.innerHTML='<video playsinline muted loop preload="metadata"></video><div class="reel-overlay"></div><div class="reel-info"><a class="reel-user-tag" href="ara.html?username='+encodeURIComponent(r.username||'')+'" data-creator="'+esc(r.username||'')+'">@'+esc(r.username||'')+'</a><div class="reel-desc">'+esc(r.description||'')+'</div></div><div class="reel-actions"><button class="reel-action like" type="button">♥</button><div class="reel-count">'+(Number(r.likes)||0)+'</div><div class="reel-view">◉ '+(Number(r.views)||0)+'</div><button class="reel-action comment" type="button">💬</button><button class="reel-action share" type="button">➤</button></div>';
   const video=card.querySelector('video');
   if(r.mediaBlob){video.src=URL.createObjectURL(r.mediaBlob)} else if(r.mediaUri){video.src=r.mediaUri} else if(r.mediaData){video.src=r.mediaData}
   card.querySelector('.like').onclick=async()=>{r._liked=!r._liked;r.likes=Math.max(0,(Number(r.likes)||0)+(r._liked?1:-1));card.querySelector('.reel-count').textContent=r.likes;await saveAll(reels)};
   card.querySelector('.comment').onclick=()=>comments(r.username);
   card.querySelector('.share').onclick=()=>share(r);
   feed.appendChild(card);
  });
  const io=new IntersectionObserver(entries=>entries.forEach(async e=>{const v=e.target.querySelector('video');if(e.isIntersecting&&e.intersectionRatio>.6){document.querySelectorAll('.reel-card video').forEach(x=>{if(x!==v)x.pause()});v.play().catch(()=>{});const id=e.target.dataset.id;const k=username()+'_'+id;const seen=JSON.parse(localStorage.getItem('minegram_reel_views')||'{}');if(!seen[k]){seen[k]=1;localStorage.setItem('minegram_reel_views',JSON.stringify(seen));const a=await load(),r=a.find(x=>String(x.id)===String(id));if(r){r.views=(Number(r.views)||0)+1;await saveAll(a);const el=e.target.querySelector('.reel-view');if(el)el.textContent='◉ '+r.views}}}else v.pause()}),{threshold:[.6]});
  document.querySelectorAll('.reel-card').forEach(x=>io.observe(x));
 }
 function openCreator(u){u=String(u||'').trim();if(!u)return;try{localStorage.setItem('minegram_discover_creator',u)}catch(e){}location.href='ara.html?username='+encodeURIComponent(u)}
 function comments(un){const old=document.querySelector('.reel-comments');if(old)old.remove();const ov=document.createElement('div');ov.className='reel-comments';ov.innerHTML='<div class="reel-comments-head"><b>'+esc(un)+' yorumları</b><button type="button" class="close">✕</button></div><div class="reel-comments-list"></div><div class="reel-comments-input"><input placeholder="Yorum yaz..."/><button type="button">Gönder</button></div>';document.body.appendChild(ov);const list=ov.querySelector('.reel-comments-list'),input=ov.querySelector('input');function add(){if(input.value.trim()){const d=document.createElement('div');d.textContent=input.value.trim();d.style.padding='8px 0';list.appendChild(d);input.value=''}}ov.querySelector('.close').onclick=()=>ov.remove();ov.querySelector('.reel-comments-input button').onclick=add;input.onkeydown=e=>{if(e.key==='Enter')add()}}
 function share(r){const text='🎬 @'+r.username+' Reels: '+(r.description||'');if(navigator.share)navigator.share({text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>alert('Reels mesajı panoya kopyalandı.')).catch(()=>alert(text));else alert(text)}
 async function pickFile(){const input=document.getElementById('reelFileInput');if(!input)return;input.value='';input.click()}
 function picker(){const input=document.getElementById('reelFileInput');if(!input)return;input.addEventListener('change',async function(){const f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith('video/')){alert('Lütfen bir video dosyası seç.');input.value='';return}try{const a=await load();const id=Math.max(0,...a.map(x=>Number(x.id)||0))+1;a.push({id,username:username(),description:'Yeni Reels 🔥',likes:0,views:0,mediaBlob:f});await saveAll(a);await render();alert('Reels başarıyla siteye eklendi.')}catch(e){console.error(e);alert('Video eklenemedi. Tarayıcı depolama alanına erişilemedi.');}input.value='';})}
 function init(){
  picker();
  const btn=document.getElementById('reelAddButton');
  if(btn)btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();pickFile()});
  const back=document.querySelector('.reels-back');if(back)back.onclick=()=>{if(history.length>1)history.back();else location.href='index.html'};
  render();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
