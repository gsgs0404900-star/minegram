<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{padding:0}
#reelsApp{position:fixed;inset:0;background:#000;overflow:hidden}
.reels-box{position:absolute;inset:0;background:#000;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels-box::-webkit-scrollbar{display:none}
.reels-feed{width:100%;min-height:100%;display:flex;flex-direction:column}
.reel-card{position:relative;width:100%;height:100dvh;min-height:100vh;background:#000;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always}
.reel-card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:block}
.reel-card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.28) 20%,transparent 46%,rgba(0,0,0,.08) 100%)}
.reels-back{position:fixed;top:20px;left:20px;z-index:50;width:44px;height:44px;padding:0;border:0;background:transparent;color:#fff;font-size:44px;line-height:52px;font-weight:300;cursor:pointer;text-shadow:0 2px 5px rgba(0,0,0,.65)}
#reelAddButton{position:fixed;top:20px;right:20px;z-index:50;width:64px;height:64px;border-radius:18px;border:0;background:#573b9b;color:#fff;font-size:38px;font-weight:300;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:none;user-select:none;text-decoration:none}
#reelFileInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.reel-info{position:absolute;left:24px;right:120px;bottom:58px;z-index:10;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.8)}
.reel-user-tag{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:36px;line-height:1.1;font-weight:700;letter-spacing:-.5px}
.verified{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#1684dc;color:#fff;font-size:23px;font-weight:700;text-shadow:none}
.reel-desc{margin-top:22px;font-size:28px;line-height:1.2;font-weight:400}
.reel-actions{position:absolute;right:20px;bottom:52px;z-index:20;width:64px;display:flex;flex-direction:column;align-items:center;color:#fff;text-align:center}
.reel-action{width:70px;height:70px;border:0;background:transparent;color:#fff;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:54px;line-height:1;text-shadow:0 2px 5px rgba(0,0,0,.8)}
.reel-count{font-size:28px;line-height:1;margin:5px 0 22px;font-weight:400;text-shadow:0 2px 5px rgba(0,0,0,.8)}
.reel-view{font-size:28px;line-height:1;margin:0 0 22px;font-weight:400;text-shadow:0 2px 5px rgba(0,0,0,.8)}
.reel-view-icon{font-size:40px;vertical-align:-3px;margin-right:4px}
.like.liked{color:#ff2d55}
.comment{font-size:58px}
.share{font-size:60px;margin-top:2px}
.empty{height:100%;min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:12px}
.empty strong{font-size:28px}.empty small{font-size:18px;color:#aaa}
.reel-comments{position:fixed;left:0;right:0;bottom:0;height:55%;background:rgba(0,0,0,.96);z-index:100;color:#fff;border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding:12px}
.reel-comments-head{display:flex;align-items:center;padding:12px 8px;font-size:18px}.reel-comments-head b{flex:1}.reel-comments-head button{background:transparent;color:#fff;border:0;font-size:22px;cursor:pointer}
.reel-comments-list{flex:1;overflow:auto;padding:12px}.reel-comments-input{display:flex;gap:8px;padding:8px}.reel-comments-input input{flex:1;background:#151515;color:#fff;border:1px solid #444;border-radius:12px;padding:13px}.reel-comments-input button{border:0;background:#573b9b;color:#fff;border-radius:12px;padding:0 18px;cursor:pointer}
@media(max-width:700px){
  .reels-back{top:18px;left:18px;width:44px;height:44px;font-size:44px}
  #reelAddButton{top:16px;right:18px;width:64px;height:64px;border-radius:18px;font-size:38px}
  .reel-info{left:40px;right:130px;bottom:92px}
  .reel-user-tag{font-size:30px;gap:8px}.verified{width:31px;height:31px;font-size:20px}.reel-desc{font-size:23px;margin-top:18px}
  .reel-actions{right:30px;bottom:78px;width:76px}.reel-action{width:44px;height:44px;font-size:32px}.reel-count,.reel-view{font-size:15px}.reel-view-icon{font-size:22px}
}
@media(max-width:420px){
  .reels-back{left:14px}.reel-info{left:22px;right:95px;bottom:72px}.reel-user-tag{font-size:18px}.verified{width:20px;height:20px;font-size:13px}.reel-desc{font-size:14px;margin-top:7px}.reel-actions{right:10px;bottom:42px}.reel-action{width:44px;height:44px;font-size:32px}.reel-count,.reel-view{font-size:15px;margin-bottom:9px}.reel-view-icon{font-size:22px}
  #reelAddButton{top:14px;right:10px;width:58px;height:58px;border-radius:17px;font-size:36px}
}
</style>

@media(max-width:700px){
  #reelsApp{left:0!important;top:0!important;transform:none!important;width:100vw!important;height:100dvh!important;max-height:none!important;border-radius:0!important;box-shadow:none!important}
}
</style>

<script>
const API="/api";
let token=localStorage.getItem("minegram_token")||localStorage.getItem("minegram_supabase_token")||null;
async function checkSession(){
  if(!token){location.replace("giris.html");return}
  try{
    const response=await fetch(API+"/me",{headers:{Authorization:"Bearer "+token}});
    if(!response.ok)throw new Error("Oturum geçersiz");
    const me=await response.json().catch(()=>({}));
    const realUsername=me?.username||me?.user?.username||me?.profile?.username||me?.data?.username||me?.data?.user?.username||me?.data?.profile?.username||me?.user_metadata?.username||me?.user_metadata?.user_name||me?.user_metadata?.preferred_username||me?.email?.split?.("@")[0]||"";
    if(realUsername)window.minegramCurrentUser=String(realUsername).trim();
  }catch(error){
    console.warn("[REELS /me]",error);
    localStorage.removeItem("minegram_token");localStorage.removeItem("minegram_supabase_token");location.replace("giris.html");
  }
}
window.minegramSessionReady=checkSession();
</script>

<script>
(function(){
 const API='/api';
 function token(){return localStorage.getItem('minegram_token')||localStorage.getItem('minegram_supabase_token')||localStorage.getItem('token')||null}
 function authHeaders(){const t=token();return t?{Authorization:'Bearer '+t}:{} }
 function username(){return String(window.minegramCurrentUser||localStorage.getItem('username')||localStorage.getItem('currentUser')||localStorage.getItem('minegram_username')||'').replace(/^@/,'').trim()||'kullanici'}
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function openCreator(u){u=String(u||'').replace(/^@/,'').trim();if(!u)return;try{localStorage.setItem('minegram_discover_creator',u)}catch(e){}location.href='ara.html?username='+encodeURIComponent(u)}
 function toast(msg){let t=document.getElementById('reelToast');if(!t){t=document.createElement('div');t.id='reelToast';t.style='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:2147483647;background:rgba(20,20,20,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none';document.body.appendChild(t)}t.textContent=msg;t.style.display='block';clearTimeout(window.__reelToast);window.__reelToast=setTimeout(()=>t.style.display='none',2200)}
 async function api(path,opt={}){const h={...authHeaders(),...(opt.headers||{})};if(opt.body instanceof FormData){delete h['Content-Type'];delete h['content-type']}const r=await fetch(API+path,{...opt,headers:h,cache:'no-store'});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
 async function loadReels(){
  const data=await api('/feed');
  const list=Array.isArray(data)?data:(Array.isArray(data?.posts)?data.posts:(Array.isArray(data?.data)?data.data:[]));
  return list.map(p=>({
    ...p,
    media:p.media||p.mediaUrl||p.media_url||p.mediaUri||p.media_uri||p.url||'',
    mediaType:p.mediaType||p.media_type||'',
    user:p.user||p.profile||{username:p.username||p.sender||'',verified:!!p.verified}
  })).filter(p=>{
    const m=String(p.mediaType||'').toLowerCase();
    const u=String(p.media||'');
    return u && (m.startsWith('video') || /\.(mp4|webm|mov|m4v|ogg)(\?|$)/i.test(u));
  });
}
 async function toggleLike(r,card){try{const d=await api('/posts/'+encodeURIComponent(r.id)+'/like',{method:'POST'});r.likedByMe=!!d.liked;const n=Number(d.likes??(r.likes?.length||0));card.querySelector('.reel-count').textContent=n;const b=card.querySelector('.like');b.textContent=r.likedByMe?'♥':'♡';b.classList.toggle('liked',r.likedByMe)}catch(e){toast('Beğeni işlemi yapılamadı')}}
 function comments(r){const old=document.querySelector('.reel-comments');if(old)old.remove();const ov=document.createElement('div');ov.className='reel-comments';ov.innerHTML='<div class="reel-comments-head"><b>@'+esc(r.user?.username||'kullanici')+' yorumları</b><button type="button" class="close">✕</button></div><div class="reel-comments-list"></div><div class="reel-comments-input"><input placeholder="Yorum yaz..."/><button type="button">Gönder</button></div>';document.body.appendChild(ov);const list=ov.querySelector('.reel-comments-list'),input=ov.querySelector('input');(r.comments||[]).forEach(c=>{const d=document.createElement('div');d.innerHTML='<b>@'+esc(c.username||'user')+'</b> '+esc(c.text||'');d.style.padding='8px 0';list.appendChild(d)});async function add(){const txt=input.value.trim();if(!txt)return;try{const d=await api('/posts/'+encodeURIComponent(r.id)+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:txt})});const c=d.comment||d;const el=document.createElement('div');el.innerHTML='<b>@'+esc(c.username||username())+'</b> '+esc(c.text||txt);el.style.padding='8px 0';list.appendChild(el);input.value=''}catch(e){toast('Yorum gönderilemedi')}}ov.querySelector('.close').onclick=()=>ov.remove();ov.querySelector('.reel-comments-input button').onclick=add;input.onkeydown=e=>{if(e.key==='Enter')add()}}
 function share(r){const text='🎬 @'+(r.user?.username||username())+' Reels: '+(r.caption||'');if(navigator.share)navigator.share({title:'Minegram Reels',text,url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(text).then(()=>toast('Reels mesajı panoya kopyalandı')).catch(()=>toast(text))}
 async function render(){const box=document.getElementById('reelsBox');if(!box)return;try{const reels=await loadReels();if(window.__newMinegramReel && !reels.some(x=>String(x.id)===String(window.__newMinegramReel.id))){reels.unshift(window.__newMinegramReel)}box.innerHTML='';if(!reels.length){box.innerHTML='<div class="empty"><strong>Henüz Reel yok</strong><small>İlk videoyu sen paylaş.</small></div>';return}const feed=document.createElement('div');feed.className='reels-feed';box.appendChild(feed);reels.forEach(r=>{const u=String(r.user?.username||'').replace(/^@/,'').trim()||'kullanici';const card=document.createElement('article');card.className='reel-card';card.dataset.id=r.id;card.innerHTML='<video src="'+esc(r.media)+'" playsinline muted loop preload="metadata"></video><div class="reel-info"><a class="reel-user-tag" href="ara.html?username='+encodeURIComponent(u)+'">@'+esc(u)+(r.user?.verified?'<span class="verified">✓</span>':'')+'</a><div class="reel-desc">'+esc(r.caption||'Bugünün videosu 🔥')+'</div></div><div class="reel-actions"><button class="reel-action like '+(r.likedByMe?'liked':'')+'" type="button">'+(r.likedByMe?'♥':'♡')+'</button><div class="reel-count">'+((r.likes||[]).length)+'</div><div class="reel-view"><span class="reel-view-icon">◉</span> '+(Number(r.views)||0)+'</div><button class="reel-action comment" type="button">▢</button><button class="reel-action share" type="button">➤</button></div>';const v=card.querySelector('video');card.querySelector('.reel-user-tag').onclick=e=>{e.preventDefault();openCreator(u)};card.querySelector('.like').onclick=()=>toggleLike(r,card);card.querySelector('.comment').onclick=()=>comments(r);card.querySelector('.share').onclick=()=>share(r);v.addEventListener('error',()=>{console.warn('Reel video yüklenemedi',r.media);const m=document.createElement('div');m.style='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:14px;z-index:5;pointer-events:none';m.textContent='Video yüklenemedi';card.appendChild(m)});v.addEventListener('click',()=>v.paused?v.play().catch(()=>{}):v.pause());feed.appendChild(card)});const io=new IntersectionObserver(entries=>entries.forEach(e=>{const v=e.target.querySelector('video');if(e.isIntersecting&&e.intersectionRatio>.65){document.querySelectorAll('.reel-card video').forEach(x=>{if(x!==v)x.pause()});v.play().catch(()=>{})}else v.pause()}),{threshold:[.65]});feed.querySelectorAll('.reel-card').forEach(x=>io.observe(x))}catch(e){console.error('[REELS]',e);box.innerHTML='<div class="empty"><strong>Reels yüklenemedi</strong><small>Sunucuya bağlanılamadı. Sayfayı yenileyin.</small></div>'}}
 async function uploadReel(){
  const input=document.getElementById('reelFileInput');
  const f=input?.files?.[0];
  if(!f)return;
  if(!String(f.type).startsWith('video/')){toast('Lütfen video seç.');return}
  if(f.size>100*1024*1024){toast('Video en fazla 100 MB olabilir.');return}
  if(!token()){toast('Oturum bulunamadı.');return}
  const fd=new FormData();
  fd.append('media',f,f.name);
  fd.append('caption','Bugünün videosu 🔥');
  const btn=document.getElementById('reelAddButton');
  if(btn)btn.disabled=true;
  try{
    toast('Video yükleniyor...');
    const result=await api('/posts',{method:'POST',body:fd});
    const uploadedMedia=String(result?.media||result?.mediaUrl||result?.media_url||result?.url||result?.mediaUri||'');
    if(!uploadedMedia)throw new Error('Sunucu video adresi döndürmedi');
    /* Yeni yüklenen videoyu feed beklemeden doğrudan göster. */
    const currentUser=String(result?.username||result?.user?.username||window.minegramCurrentUser||username()).replace(/^@/,'').trim()||username();
    const reel={
      id:result?.id||result?.postId||('new-'+Date.now()),
      media:uploadedMedia,
      mediaType:result?.mediaType||result?.media_type||f.type,
      caption:result?.caption||result?.text||'Bugünün videosu 🔥',
      likes:Array.isArray(result?.likes)?result.likes:[],
      comments:Array.isArray(result?.comments)?result.comments:[],
      views:Number(result?.views)||0,
      likedByMe:!!result?.likedByMe,
      user:{username:currentUser,verified:!!(result?.user?.verified||result?.verified)}
    };
    window.__newMinegramReel=reel;
    toast('Reels başarıyla siteye eklendi');
    try{await render()}catch(e){console.warn('[REELS RENDER]',e)}
    /* Feed gecikmeli gelirse de yeni videoyu kaybetme. */
    setTimeout(async()=>{try{await render()}catch(e){}},1200);
    setTimeout(()=>{
      const first=document.querySelector('.reel-card');
      if(first)first.scrollIntoView({behavior:'smooth',block:'start'});
      const v=first?.querySelector('video');
      if(v)v.play().catch(()=>{});
    },150);
  }catch(e){
    console.error('[REELS UPLOAD]',e);
    toast('Video siteye yüklenemedi: '+(e?.message||'Bilinmeyen hata'));
  }finally{
    if(btn)btn.disabled=false;
    input.value='';
  }
} function init(){const input=document.getElementById('reelFileInput'),btn=document.getElementById('reelAddButton'),back=document.getElementById('reelsBack');if(input)input.addEventListener('change',uploadReel);if(btn)btn.onclick=()=>{if(input){input.value='';input.click()}}if(back)back.onclick=()=>{if(history.length>1)history.back();else location.href='index.html'};render();if(window.minegramSessionReady)window.minegramSessionReady.then(()=>render()).catch(()=>{})}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
