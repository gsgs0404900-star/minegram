<style>
*{

html,body{

  color:#eee;

/* =========================

========================= */

.top{
  height:70px;

  align-items:center;

  padding:0 22px;

  border-bottom:1px solid #202020;

  position:sticky;
  top:0;

  background:#000;

}

}


/* =========================
   ORTA ALAN
========================= */

.page{
  width:min(680px,100%);

  margin:0 auto;

  padding:22px 20px 40px;
}


/* =========================
   REELS ALANI
========================= */

.reels-box{

  width:100%;

  min-height:calc(100vh - 150px);

  display:flex;

  align-items:center;

  justify-content:center;
}

.empty{

  width:100%;

  text-align:center;

  color:#999;
}

.empty svg{

  width:52px;
  height:52px;

  margin:0 auto;

  display:block;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;

  stroke-linejoin:round;
}

.empty strong{

  display:block;

  color:#ddd;

  margin-top:14px;

  font-size:16px;
}

.empty small{

  display:block;

  margin-top:6px;

  color:#888;

  font-size:13px;
}


/* =========================
   ALT MENÜ
   ARA.HTML İLE AYNI
========================= */

.nav{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  width:100%;

  height:76px;

  background:#121018;

  border-top:1px solid #201d27;

  display:flex;

  align-items:stretch;

  z-index:9999;

  padding:
    5px
    max(8px, calc((100% - 760px) / 2))
    env(safe-area-inset-bottom);
}


/* MENÜ BUTONLARI */

.nav a{

  flex:1 1 0;

  height:66px;

  min-width:0;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:3px;

  color:#ddd;

  text-decoration:none;

  font-size:9px;

  -webkit-tap-highlight-color:transparent;
}


/* İKON ALANI */

.nav-icon{

  width:45px;

  height:32px;

  border-radius:18px;

  display:grid;

  place-items:center;

  flex:none;
}


/* AKTİF */

.nav a.active .nav-icon{

  background:#3b3150;
}


/* SVG */

.svg{

  width:21px;

  height:21px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;

  stroke-linejoin:round;
}


/* =========================
   MOBİL
========================= */

@media(max-width:699px){

  .top{

    padding:0 14px;

<script>

/* =========================
   API
========================= */

const API="/api";


/* =========================
   TOKEN
========================= */

let token =
  localStorage.getItem("minegram_token") ||
  localStorage.getItem("minegram_supabase_token") ||
  null;


/* =========================
   API KONTROL
========================= */

async function checkSession(){

  /* TOKEN YOKSA GİRİŞ */

  if(!token){

    location.replace("giris.html");

    return;
  }


  try{

    const response =
      await fetch(
        API + "/me",
        {
          headers:{
            Authorization:
              "Bearer " + token
          }
        }
      );


    if(!response.ok){

      throw new Error(
        "Oturum geçersiz"
      );

    }


    await response
      .json()
      .catch(()=>({}));


  }catch(error){

    console.warn(
      "[REELS /me]",
      error
    );


    localStorage.removeItem(
      "minegram_token"
    );

    localStorage.removeItem(
      "minegram_supabase_token"
    );


    location.replace(
      "giris.html"
    );

  }

}


/* =========================
   BAŞLAT
========================= */

checkSession();

</script>
