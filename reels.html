<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reels - Minegram</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
body{padding-bottom:76px}
.app{min-height:calc(100vh - 76px);background:#000}
.phone{width:390px;height:calc(100vh - 76px);min-height:650px;max-height:896px;margin:0 auto;background:#000;position:relative;overflow:hidden}
.reels-feed{height:100%;width:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels-feed::-webkit-scrollbar{display:none}
.reel{height:100%;width:100%;position:relative;background:#000;scroll-snap-align:start;overflow:hidden}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.08) 38%,transparent 65%);pointer-events:none}
.back{position:absolute;left:18px;top:20px;width:42px;height:42px;border:0;background:transparent;color:#fff;font-size:42px;line-height:35px;z-index:5;cursor:pointer}
.add{position:absolute;right:18px;top:20px;width:58px;height:58px;border:0;border-radius:18px;background:#5137a5;color:#fff;font-size:37px;line-height:58px;text-align:center;z-index:5;cursor:pointer}
#reelInput{display:none}
.actions{position:absolute;right:14px;bottom:105px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:9px}
.action{border:0;background:transparent;color:#fff;width:48px;min-height:44px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-shadow:0 2px 5px #000}
.action .ico{font-size:29px;line-height:31px}.eye-ico svg{width:27px;height:27px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 4px #000)}.action .num{font-size:13px;font-weight:700;margin-top:2px}
.info{position:absolute;left:18px;right:76px;bottom:28px;z-index:6;text-shadow:0 2px 5px #000}
.user{display:inline-flex;align-items:center;gap:7px;font-size:20px;font-weight:800;cursor:pointer}
.verify{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#1976d2;color:#fff;font-size:13px;text-shadow:none}
.desc{font-size:16px;margin-top:10px;line-height:1.35}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#aaa;text-align:center}
.empty .movie{font-size:64px;opacity:.45}.empty b{font-size:18px;color:#ddd;margin-top:12px}.empty span{font-size:13px;margin-top:6px;color:#777}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#888;font-size:14px}
.nav{position:fixed;left:0;right:0;bottom:0;height:76px;background:#121018;border-top:1px solid #201d27;display:flex;z-index:9999;padding:5px max(8px,calc((100% - 760px)/2)) env(safe-area-inset-bottom)}
.nav a{flex:1;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#ddd;text-decoration:none;font-size:9px;min-width:0}.nav-icon{width:45px;height:32px;border-radius:18px;display:grid;place-items:center}.nav a.active .nav-icon{background:#3b3150}.svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#25222d;color:#fff;padding:11px 15px;border-radius:12px;font-size:13px;z-index:10001;display:none;max-width:90%;text-align:center}.toast.show{display:block}
.comments{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(390px,100%);height:58%;background:#111;border-radius:20px 20px 0 0;z-index:10000;display:none;flex-direction:column;padding:10px}.comments.open{display:flex}.comments-head{display:flex;justify-content:space-between;align-items:center;padding:7px 4px 12px;border-bottom:1px solid #252525}.comments-list{flex:1;overflow:auto;padding:10px 3px}.comment{padding:9px 0;border-bottom:1px solid #202020}.comment b{font-size:13px}.comment p{margin:4px 0 0;color:#ddd;font-size:13px}.comment-form{display:flex;gap:7px;padding-top:8px}.comment-form input{flex:1;background:#191919;color:#fff;border:1px solid #333;border-radius:10px;padding:11px}.comment-form button,.close-comments{border:0;background:#3b3150;color:#fff;border-radius:10px;padding:0 13px}
@media(max-width:699px){.phone{width:100vw;height:calc(100vh - 76px);min-height:0}.back{top:14px}.add{top:14px;right:14px}.actions{bottom:105px}.info{bottom:24px}.nav{padding-left:8px;padding-right:8px}}
</style>
</head>
<body>
<div class="app"><div class="phone"><div id="feed" class="reels-feed"><div class="loading">Reels yükleniyor...</div></div></div></div>
<nav class="nav">
<a href="index.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg></span>Ana Sayfa</a>
<a href="ara.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg></span>Ara</a>
<a href="olustur.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span>Oluştur</a>
<a class="active" href="reels.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4l3 5M13 4l3 5"/></svg></span>Reels</a>
<a href="profile.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span>Profil</a>
</nav>
<input id="reelInput" type="file" accept="video/*">
<div id="toast" class="toast"></div>
<div id="comments" class="comments"><div class="comments-head"><b>Yorumlar</b><button class="close-comments" onclick="closeComments()">✕</button></div><div id="commentsList" class="comments-list"></div><div class="comment-form"><input id="commentInput" placeholder="Yorum yaz..."><button onclick="sendComment()">Gönder</button></div></div>
<script>
const API='/api';
const token=localStorage.getItem('minegram_token')||localStorage.getItem('minegram_supabase_token')||'';
let me=null, reels=[], currentCommentReel=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}
async function api(url,opt={}){
  if(!token){location.replace('giris.html');throw new Error('Oturum gerekli')}
  const headers={...(opt.headers||{}),Authorization:'Bearer '+token};
  if(opt.body&&!(opt.body instanceof FormData)){headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}
  const r=await fetch(url,{...opt,headers,credentials:'same-origin'});
  if(r.status===401){localStorage.removeItem('minegram_token');localStorage.removeItem('minegram_supabase_token');token='';location.replace('giris.html');throw new Error('Oturum süresi doldu')}
  const raw=await r.text();let j=null;try{j=raw?JSON.parse(raw):null}catch(e){}
  if(!r.ok)throw new Error(j?.error||j?.message||'Sunucu işlemi başarısız ('+r.status+')');
  return j;
}
function getList(x){return Array.isArray(x)?x:Array.isArray(x?.posts)?x.posts:Array.isArray(x?.data)?x.data:[]}
function usernameFromMe(){return String(me?.username||me?.user?.username||me?.profile?.username||localStorage.getItem('username')||localStorage.getItem('currentUser')||'').trim()}
function hasPremiumVerification(p){
  const v=p?.verified ?? p?.isVerified ?? p?.premiumVerified ?? p?.premium_verified ?? p?.user?.verified ?? p?.author?.verified ?? false;
  const premium=p?.premium ?? p?.isPremium ?? p?.user?.premium ?? p?.user?.isPremium ?? p?.author?.premium ?? p?.author?.isPremium ?? false;
  return v===true || String(v).toLowerCase()==='true' || premium===true || String(premium).toLowerCase()==='true';
}
function verifiedBadge(r){return hasPremiumVerification(r.raw)?' <span class="verify">✓</span>':''}
function isVideo(p){const t=String(p?.mediaType||p?.type||p?.mimeType||'').toLowerCase();const u=String(p?.mediaUrl||p?.media_url||p?.mediaUri||p?.media||'').toLowerCase();return t.includes('video')||/\.(mp4|webm|mov|m4v)(\?|$)/.test(u)||!!p?.videoUrl||!!p?.video_url}
function mediaUrl(p){return p?.mediaUrl||p?.media_url||p?.videoUrl||p?.video_url||p?.mediaUri||p?.media||''}
function pid(p,i){return String(p?.id??p?.postId??p?.uuid??('reel-'+i))}
function normalize(p,i){const u=p?.user||p?.author||{};return {raw:p,id:pid(p,i),username:String(p?.username||u?.username||p?.ownerUsername||p?.author?.username||'').trim(),caption:String(p?.caption??p?.text??p?.description??'Yeni Reels 🔥'),likes:Array.isArray(p?.likes)?p.likes.length:Number(p?.likesCount??p?.likes??p?.like_count??0)||0,views:Number(p?.views??p?.viewCount??p?.view_count??0)||0,url:mediaUrl(p)}}
function render(){const feed=document.getElementById('feed');if(!reels.length){feed.innerHTML='<div class="empty"><div class="movie">🎬</div><b>Henüz Reel yok</b><span>Sağ üstteki + ile ilk videonu paylaş.</span></div><button class="add" onclick="openPicker()">+</button>';return}feed.innerHTML=reels.map((r,i)=>`<article class="reel" data-id="${esc(r.id)}"><video src="${esc(r.url)}" playsinline muted loop preload="metadata"></video><div class="shade"></div><button class="back" onclick="location.href='index.html'">‹</button><button class="add" onclick="openPicker()">+</button><div class="actions"><button class="action like" onclick="likeReel(${i})"><span class="ico">♡</span><span class="num">${r.likes}</span></button><button class="action view-btn" onclick="viewCount(${i})"><span class="ico eye-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></span><span class="num">${r.views}</span></button><button class="action" onclick="openComments(${i})"><span class="ico">▢</span></button><button class="action" onclick="shareReel(${i})"><span class="ico">➤</span></button></div><div class="info"><div class="user" onclick="goProfile('${encodeURIComponent(r.username)}')">@${esc(r.username)}${verifiedBadge(r)}</div><div class="desc">${esc(r.caption)}</div></div></article>`).join('');observeVideos()}
function goProfile(u){location.href='ara.html?username='+u}

async function loadAuthenticatedVideo(url){
  if(!url||!token)return url;
  try{
    const r=await fetch(url,{headers:{Authorization:'Bearer '+token},credentials:'same-origin'});
    if(r.ok){const blob=await r.blob();return URL.createObjectURL(blob)}
  }catch(e){}
  return url;
}
async function hydrateVideoSources(){
  const vids=[...document.querySelectorAll('.reel video')];
  await Promise.all(vids.map(async (v,i)=>{const r=reels[i];if(!r?.url)return;const u=await loadAuthenticatedVideo(r.url);if(u&&u!==r.url){v.src=u;v.load()}}));
}
function observeVideos(){const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(e.isIntersecting&&e.intersectionRatio>.65){document.querySelectorAll('.reel video').forEach(x=>{if(x!==v)x.pause()});v.play().catch(()=>{});const i=[...document.querySelectorAll('.reel')].indexOf(e.target);if(i>=0)viewCount(i,true)}else v.pause()}),{threshold:[.65]});document.querySelectorAll('.reel').forEach(x=>io.observe(x))}
const seen=new Set();function viewCount(i,silent=false){const r=reels[i];if(!r||seen.has(r.id))return;seen.add(r.id);r.views++;const el=document.querySelectorAll('.reel')[i]?.querySelector('.actions .action:nth-child(2) .num');if(el)el.textContent=r.views;/* API endpoint bilinmediği için görüntülenme yalnızca güvenli UI sayacıdır. */}
async function likeReel(i){const r=reels[i];r.likes++;const el=document.querySelectorAll('.reel')[i]?.querySelector('.like .num');const ic=document.querySelectorAll('.reel')[i]?.querySelector('.like .ico');if(el)el.textContent=r.likes;if(ic)ic.textContent='♥';/* mevcut backend'in like endpoint'i farklı olabilir; Reel ekranı bozulmaması için UI anında güncellenir */}
function openPicker(){document.getElementById('reelInput').click()}
document.getElementById('reelInput').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(!file.type.startsWith('video/')){toast('Lütfen video seç.');return}if(!token){location.href='giris.html';return}try{toast('Video yükleniyor...');const fd=new FormData();fd.append('media',file,file.name);fd.append('caption','Yeni Reels 🔥');const j=await api('/api/posts',{method:'POST',body:fd});toast('Reels başarıyla siteye eklendi.');await loadReels();}catch(err){console.error(err);toast(err.message||'Video yüklenemedi.')}});
async function loadReels(){try{if(!token){location.href='giris.html';return}me=await api('/api/me');const posts=getList(await api('/api/feed'));reels=posts.filter(isVideo).map(normalize).filter(r=>r.url&&r.username);render()}catch(e){console.error('[REELS]',e);document.getElementById('feed').innerHTML='<div class="empty"><div class="movie">⚠️</div><b>Reels yüklenemedi</b><span>'+esc(e.message)+'</span></div><button class="add" onclick="openPicker()">+</button>'}}
function openComments(i){currentCommentReel=i;document.getElementById('comments').classList.add('open');document.getElementById('commentsList').innerHTML='<div class="comment"><b>@'+esc(reels[i].username)+'</b><p>Bu Reel için yorumlar</p></div>'}
function closeComments(){document.getElementById('comments').classList.remove('open')}
function sendComment(){const inp=document.getElementById('commentInput');if(!inp.value.trim())return;const d=document.createElement('div');d.className='comment';d.innerHTML='<b>@'+esc(usernameFromMe()||'kullanici')+'</b><p>'+esc(inp.value.trim())+'</p>';document.getElementById('commentsList').appendChild(d);inp.value=''}
async function shareReel(i){const r=reels[i];const text='🎬 @'+r.username+' Reels: '+r.caption;if(navigator.share){try{await navigator.share({text})}catch(e){}}else{try{await navigator.clipboard.writeText(text);toast('Reels bilgisi panoya kopyalandı.')}catch(e){toast(text)}}}
loadReels();
</script>
</body>
</html>
