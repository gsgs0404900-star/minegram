<!doctype html>

<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reels - Minegram</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#eee;
  font-family:Inter,Arial,sans-serif;
}

body{
  padding-bottom:88px;
}

.app{
  width:100%;
  min-height:100vh;
  background:#000;
}

/* ÜST BAR */
.top{
  height:62px;
  display:flex;
  align-items:center;
  border-bottom:1px solid #25222b;
  padding:0 20px;
  position:sticky;
  top:0;
  background:#000;
  z-index:10;
}

.top b{
  font-size:19px;
}

/* SAYFA */
.page{
  max-width:760px;
  margin:0 auto;
  padding:22px 20px;
}

/* REELS */
.feed{
  width:min(680px,100%);
  margin:0 auto;
}

.reel-card{
  margin:15px auto;
  border-bottom:1px solid #222;
  padding-bottom:16px;
  width:100%;
  max-width:680px;
}

.reel-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px 12px;
}

.reel-head b{
  cursor:pointer;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#4b99d2;
  display:grid;
  place-items:center;
  font-size:14px;
  font-weight:700;
}

.reel-video{
  display:block;
  width:100%;
  max-height:680px;
  object-fit:cover;
  background:#111;
  border-radius:4px;
}

.reel-actions{
  display:flex;
  gap:18px;
  margin-top:9px;
  padding:0 14px;
}

.reel-actions button{
  background:none;
  border:0;
  color:#eee;
  font-size:15px;
  cursor:pointer;
}

.reel-caption{
  font-size:14px;
  margin-top:8px;
  padding:0 14px;
}

/* BOŞ */
.empty{
  text-align:center;
  padding:150px 20px;
  color:#999;
}

.empty svg{
  width:52px;
  height:52px;
  margin:auto;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.empty strong{
  display:block;
  color:#ddd;
  margin-top:14px;
}

.empty small{
  display:block;
  margin-top:5px;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:95px;
  transform:translateX(-50%);
  background:#252329;
  padding:10px 15px;
  border-radius:20px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:999999;
  font-size:12px;
}

.toast.show{
  opacity:1;
}

/* ALT MENÜ */
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  height:78px;
  display:flex;
  flex-direction:row;
  align-items:stretch;
  justify-content:space-evenly;
  padding:8px 5px;
  margin:0;
  background:#18161e;
  border-top:1px solid #201d27;
  z-index:99999;
}

.bottom-nav a{
  flex:1 1 0;
  width:20%;
  max-width:none;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  text-align:center;
  text-decoration:none;
  color:#ddd;
  box-sizing:border-box;
  font-size:9px;
}

.bottom-nav a i{
  display:grid;
  place-items:center;
  width:46px;
  height:32px;
  border-radius:20px;
  font-style:normal;
}

.bottom-nav a.active i{
  background:#3c3450;
}

.bottom-nav svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* MOBİL */
@media(max-width:699px){

  .page{
    padding:18px 0;
  }

  .feed{
    width:100%;
  }

  .reel-card{
    max-width:100%;
    margin:0 auto 16px;
  }

  .reel-head{
    padding:10px 14px;
  }

  .reel-video{
    max-height:520px;
    border-radius:0;
  }

  .reel-actions{
    padding:0 14px;
  }

  .reel-caption{
    padding:0 14px;
  }

  .top{
    padding:0 16px;
  }
}
</style>

</head>

<body>

<main class="app">

  <!-- REELS ÜST BAR -->

  <div class="top">

  </div>

  <!-- REELS İÇERİĞİ -->

  </div>

</main>

<!-- TOAST -->

<div id="toast" class="toast"></div>

<!-- ALT MENÜ -->

<nav class="bottom-nav">

  <!-- ANA SAYFA -->

  <a href="index.html">
    <i>
      <svg viewBox="0 0 24 24">

<script>

const API="/api";

const PREVIEW=
  new URLSearchParams(location.search).get("preview")==="1";

let token=
  localStorage.getItem("minegram_token");

let me=null;


/* API */
async function api(path,opt={}){

  opt.headers={
    ...(opt.headers||{}),
    ...(token
      ? {Authorization:"Bearer "+token}
      : {})
  };

  const r=
    await fetch(API+path,opt);

  const j=
    await r.json().catch(()=>({}));

  if(!r.ok){
    throw Error(
      j.error ||
      "İşlem başarısız"
    );
  }

  return j;
}


/* TOAST */
function toast(x){

  const t=
    document.getElementById("toast");

  if(!t)return;

  t.textContent=x;

  t.classList.add("show");

  setTimeout(
    ()=>t.classList.remove("show"),
    2200
  );
}


/* HTML GÜVENLİĞİ */
function escapeHtml(s=""){

  return String(s).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


/* REELS */
async function loadReels(){

  const feed=
    document.getElementById("feed");

  const empty=
    document.getElementById("emptyReels");

  try{

    const data=
      await api("/reels");

    const reels=
      Array.isArray(data)
      ? data
      : (data.reels||[]);

    if(!reels.length){

      empty.style.display="block";

      return;
    }

    empty.style.display="none";

    reels.forEach(reel=>{

      const username=
        reel.user?.username ||
        reel.username ||
        "kullanıcı";

      const caption=
        reel.caption || "";

      const video=
        reel.media ||
        reel.video ||
        reel.url ||
        "";

      const likes=
        reel.likes || 0;

      const comments=
        reel.comments?.length ||
        reel.commentCount ||
        0;


      const article=
        document.createElement("article");

      article.className="reel-card";


      article.innerHTML=`

        <div class="reel-head">

          <div class="avatar">
            ${escapeHtml(
              username
                .charAt(0)
                .toUpperCase()
            )}
          </div>

          <b>
            @${escapeHtml(username)}
          </b>

        </div>


        ${
          video
          ?
          `
          <video
            class="reel-video"
            src="${escapeHtml(video)}"
            controls
            playsinline
            preload="metadata">
          </video>
          `
          :
          ""
        }


        <div class="reel-actions">

          <button
            onclick="likeReel('${escapeHtml(reel.id||"")}')">
            ♡ ${likes}
          </button>

          <button
            onclick="commentReel('${escapeHtml(reel.id||"")}')">
            ○ ${comments}
          </button>

          <button
            onclick="saveReel('${escapeHtml(reel.id||"")}')">
            ♧
          </button>

        </div>


        ${
          caption
          ?
          `
          <div class="reel-caption">
            <b>@${escapeHtml(username)}</b>
            ${escapeHtml(caption)}
          </div>
          `
          :
          ""
        }

      `;

      feed.appendChild(article);

    });

  }catch(e){

    /*
      API /reels henüz hazır değilse
      boş ekran gösterilir.
    */

    empty.style.display="block";

    console.log(
      "Reels yüklenemedi:",
      e
    );

  }

}


/* BEĞEN */
async function likeReel(id){

  if(!id)return;

  try{

    await api(
      "/reels/"+encodeURIComponent(id)+"/like",
      {
        method:"POST"
      }
    );

    loadReels();

  }catch(e){

    toast(e.message);

  }

}


/* KAYDET */
async function saveReel(id){

  if(!id)return;

  try{

    await api(
      "/reels/"+encodeURIComponent(id)+"/save",
      {
        method:"POST"
      }
    );

    toast("Kaydedildi");

  }catch(e){

    toast(e.message);

  }

}


/* YORUM */
function commentReel(id){

  if(!id)return;

  toast("Yorumlar yakında");

}


/* GİRİŞ KONTROLÜ */
async function checkLogin(){

  if(!token){

    location.href="index.html";

    return;
  }

  try{

    me=
      await api("/me");

    loadReels();

  }catch(e){

    localStorage.removeItem(
      "minegram_token"
    );

    location.href="index.html";

  }

}


/* BAŞLAT */
checkLogin();

</script>

</body>
