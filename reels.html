<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Reels - Minegram</title>

<style>
*{
box-sizing:border-box
}

html,body{
margin:0;
width:100%;
min-height:100%;
background:#000;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
overflow:hidden
}

body{
padding-bottom:76px
}

.app{
height:calc(100vh - 76px);
background:#000
}

.phone{
width:390px;
height:100%;
min-height:0;
max-height:896px;
margin:0 auto;
background:#000;
position:relative;
overflow:hidden
}

.reels-feed{
height:100%;
width:100%;
overflow-y:auto;
scroll-snap-type:y mandatory;
scrollbar-width:none
}

.reels-feed::-webkit-scrollbar{
display:none
}

.reel{
height:100%;
width:100%;
position:relative;
background:#000;
scroll-snap-align:start;
overflow:hidden
}

.reel video{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
background:#000;
cursor:pointer
}

.reel-progress{
position:absolute;
left:18px;
right:10px;
bottom:14px;
height:30px;
z-index:8;
display:flex;
align-items:center;
gap:8px;
color:#fff;
text-shadow:0 1px 3px #000
}

.reel-time{
font-size:11px;
font-variant-numeric:tabular-nums;
min-width:68px;
white-space:nowrap
}

.reel-range{
appearance:none;
-webkit-appearance:none;
flex:1;
height:5px;
background:#4b435d;
border-radius:99px;
outline:none
}

.reel-sound{
width:30px;
height:30px;
border:0;
background:transparent;
color:#fff;
display:grid;
place-items:center;
cursor:pointer
}

.shade{
position:absolute;
inset:0;
background:linear-gradient(
to top,
rgba(0,0,0,.82),
rgba(0,0,0,.08) 42%,
transparent 67%
);
pointer-events:none
}

.topbtn{
position:absolute;
top:12px;
width:42px;
height:42px;
border:0;
background:transparent;
color:#fff;
z-index:5;
display:grid;
place-items:center
}

.back{
left:12px;
font-size:36px
}

.add{
right:8px;
font-size:32px
}

.actions{
position:absolute;
right:12px;
bottom:106px;
z-index:6;
display:flex;
flex-direction:column;
gap:8px;
align-items:center
}

.action{
border:0;
background:transparent;
color:#fff;
width:52px;
display:flex;
flex-direction:column;
align-items:center;
cursor:pointer
}

.action .ico svg{
width:26px;
height:26px;
fill:none;
stroke:#fff;
stroke-width:1.9
}

.info{
position:absolute;
left:18px;
right:72px;
bottom:24px;
z-index:6;
text-shadow:0 2px 5px #000
}

.avatar{
width:46px;
height:46px;
border-radius:50%;
background:#3f91cc;
overflow:hidden;
display:grid;
place-items:center;
font-weight:800
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.userrow{
display:flex;
align-items:center;
gap:8px
}

.username{
font-size:16px;
font-weight:800
}

.desc{
font-size:15px;
margin-top:6px
}

.empty,.loading{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:76px;
background:#121018;
display:flex;
z-index:9999
}

.nav a{
flex:1;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
color:#ddd;
text-decoration:none;
font-size:9px
}

.toast{
position:fixed;
left:50%;
bottom:92px;
transform:translateX(-50%);
background:#25222d;
padding:12px;
border-radius:12px;
z-index:10001;
display:none
}

.toast.show{
display:block
}

.comments-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:30000;
display:none;
align-items:flex-end
}

.comments-sheet{
width:100%;
height:72%;
background:#000;
border-radius:25px 25px 0 0;
padding:15px
}

.comment-list{
height:calc(100% - 160px);
overflow:auto
}

.comment-compose{
display:flex;
gap:8px
}

.compose-input{
flex:1;
background:#222;
color:#fff;
border-radius:20px;
padding:12px
}

@media(max-width:699px){
.phone{
width:100vw
}
}

</style>
</head>
<body>

<div class="app">
<div class="phone">

<div id="refresh" class="refresh">
<span class="mini-spin"></span>
</div>

<div id="feed" class="reels-feed">
<div class="loading">
Reels yükleniyor...
</div>
</div>

</div>
</div>


<nav class="nav">

<a href="index.html">
Ana Sayfa
</a>

<a href="ara.html">
Ara
</a>

<a href="olustur.html">
Oluştur
</a>

<a class="active" href="reels.html">
Reels
</a>

<a href="profile.html">
Profil
</a>

</nav>


<input id="reelInput" type="file" accept="video/*">

<div id="toast" class="toast"></div>



<div id="commentsModal" class="comments-modal">

<div class="comments-sheet">

<div class="sheet-head">
Yorumlar

<button 
class="close-comments"
onclick="closeComments()">
×
</button>

</div>


<div id="commentList" class="comment-list"></div>


<div class="comment-compose">

<input
id="commentInput"
class="compose-input"
placeholder="Yorum yaz..."
>


<button
onclick="sendComment()">
➤
</button>


</div>


</div>

</div>



<script>


let token =
localStorage.getItem("minegram_token") ||
localStorage.getItem("minegram_supabase_token") ||
"";


let reels=[];
let currentCommentReel=null;
let observer=null;



function toast(t){

let x=document.getElementById("toast");

x.innerHTML=t;

x.classList.add("show");


setTimeout(()=>{

x.classList.remove("show");

},2500);

}




async function api(url,opt={}){


let headers={

Authorization:"Bearer "+token,

...(opt.headers||{})

};



if(
opt.body &&
!(opt.body instanceof FormData)

){

headers["Content-Type"]="application/json";

opt.body=JSON.stringify(opt.body);

}



let r=await fetch(url,{

...opt,

headers,

credentials:"same-origin"

});



let text=await r.text();

let data=null;


try{

data=JSON.parse(text);

}catch{}



if(!r.ok){

throw Error(
data?.error ||
"İşlem başarısız"
);

}



return data;


}





function mediaUrl(p){

return (

p.mediaUrl ||

p.media_url ||

p.videoUrl ||

p.video_url ||

p.media ||

p.video ||

""

);

}





function isVideo(p){

let u=String(mediaUrl(p)).toLowerCase();


return (

u.includes(".mp4") ||

u.includes(".webm") ||

u.includes(".mov") ||

p.type==="video"

);

}




function normalize(p,i){


let user=p.user || p.author || {};

return {


id:String(
p.id ||
p.postId ||
"reel-"+i
),


username:

user.username ||

p.username ||

"kullanici",



caption:

p.caption ||

p.text ||

"Yeni Reels",



likes:Number(

p.likesCount ||

p.likes ||

0

),



views:Number(

p.views ||

0

),



comments:Number(

p.commentCount ||

0

),



url:mediaUrl(p),



avatar:

user.avatar ||

p.avatar ||

""



};


}





function render(){


let feed=document.getElementById("feed");



feed.innerHTML=reels.map((r,i)=>`


<div class="reel" data-index="${i}">


<video

playsinline

preload="metadata">

</video>



<div class="shade"></div>



<button 
class="topbtn back"
onclick="history.back()">

‹

</button>




<div class="actions">


<button class="action">

❤️

<span>${r.likes}</span>

</button>



<button 
class="action"
onclick="openComments(${i})">

💬

<span>${r.comments}</span>

</button>



<div class="action">

👁

<span>${r.views}</span>

</div>



</div>





<div class="info">


<div class="userrow">

<div class="avatar">

${
r.avatar
?
`<img src="${r.avatar}">`
:
(r.username[0]||"M")
}

</div>


<div class="username">

@${r.username}

</div>


</div>



<div class="desc">

${r.caption}

</div>


</div>





<div class="reel-progress">


<span class="reel-time">

0:00 / 0:00

</span>


<input

class="reel-range"

type="range"

min="0"

max="100"

value="0">


<button 
class="reel-sound"
onclick="toggleMute(${i})">

🔊

</button>



</div>



</div>


`).join("");



setupVideos();


}




async function setupVideos(){


let items=document.querySelectorAll(".reel");



items.forEach((box,i)=>{


let video=box.querySelector("video");


video.src=reels[i].url;


video.muted=true;



video.addEventListener(

"loadedmetadata",

()=>updateTime(i)

);



video.addEventListener(

"timeupdate",

()=>updateTime(i)

);



video.onclick=()=>{


if(video.paused)

video.play();

else

video.pause();



};



});




observer=new IntersectionObserver(entries=>{


entries.forEach(e=>{


let video=e.target.querySelector("video");



if(e.isIntersecting){


video.play().catch(()=>{});


}else{


video.pause();


}



});


},{threshold:.7});



items.forEach(x=>observer.observe(x));


}




function updateTime(i){


let box=document.querySelectorAll(".reel")[i];

let video=box.querySelector("video");


if(!video.duration)return;



let time=box.querySelector(".reel-time");


let cur=Math.floor(video.currentTime);

let dur=Math.floor(video.duration);



time.innerHTML=

Math.floor(cur/60)+":"+
String(cur%60).padStart(2,"0")
+
" / "+
Math.floor(dur/60)+":"+
String(dur%60).padStart(2,"0");



}




function toggleMute(i){


let video=document.querySelectorAll(".reel video")[i];


video.muted=!video.muted;


}
async function loadReels(){

try{

let data=await api("/api/feed");


let posts=
Array.isArray(data)
?data
:(data.posts||data.data||[]);



reels=posts
.filter(isVideo)
.map(normalize);



render();



}catch(e){

console.log(e);


document.getElementById("feed").innerHTML=
`
<div class="empty">
Reels yüklenemedi
</div>
`;

}

}




function openComments(i){

currentCommentReel=reels[i];


let modal=
document.getElementById("commentsModal");


modal.style.display="flex";


loadComments(i);

}





async function loadComments(i){


let list=
document.getElementById("commentList");


list.innerHTML="Yükleniyor...";


try{


let data=
await api(
"/api/posts/"+
reels[i].id+
"/comments"
);



let comments=
Array.isArray(data)
?data
:data.comments||[];



if(!comments.length){

list.innerHTML=
"Henüz yorum yok";

return;

}



list.innerHTML=
comments.map(c=>`

<div style="padding:10px;border-bottom:1px solid #333">

<b>
@${c.username||"kullanıcı"}
</b>

<br>

${c.text||""}

</div>

`).join("");



}catch(e){

list.innerHTML=
"Yorumlar yüklenemedi";

}

}





function closeComments(){

document.getElementById(
"commentsModal"
).style.display="none";

}




async function sendComment(){


let input=
document.getElementById(
"commentInput"
);


let text=input.value.trim();



if(!text || !currentCommentReel)
return;



await api(
"/api/posts/"+
currentCommentReel.id+
"/comments",
{

method:"POST",

body:{
text:text
}

}
);



input.value="";


let index=
reels.findIndex(
x=>x.id===currentCommentReel.id
);



loadComments(index);

}





document
.getElementById("reelInput")
.addEventListener(
"change",
async e=>{


let file=e.target.files[0];


if(!file)
return;



let fd=new FormData();


fd.append(
"media",
file
);


fd.append(
"caption",
"Yeni Reels"
);



try{


toast(
"Video yükleniyor..."
);



await api(
"/api/posts",
{
method:"POST",
body:fd
}
);



toast(
"Reels yüklendi"
);



loadReels();



}catch(err){

toast(
"Video yüklenemedi"
);

}


});






window.onload=function(){

loadReels();

};

</script>
 <script>

function shareReel(i){

const r=reels[i];

if(!r)return;


if(navigator.share){

navigator.share({

title:"Minegram Reels",

text:"@"+r.username+" Reels videosu",

url:location.href

}).catch(()=>{});

}else{

toast("Paylaşım desteklenmiyor");

}

}



function goProfile(username){

location.href=
"ara.html?username="+
encodeURIComponent(username);

}



function formatTime(sec){

if(!Number.isFinite(sec))
return "0:00";


let m=Math.floor(sec/60);

let s=Math.floor(sec%60)
.toString()
.padStart(2,"0");


return m+":"+s;

}





function addView(i){

let key=
"minegram_view_"+reels[i].id;


if(localStorage.getItem(key))
return;


localStorage.setItem(key,"1");


reels[i].views++;


let box=
document.querySelectorAll(".reel")[i];


if(box){

let spans=
box.querySelectorAll(".action span");


if(spans[2])
spans[2].innerHTML=
reels[i].views;

}

}




async function likeReel(i){

let r=reels[i];

if(!r)
return;


r.likes++;


try{

await api(
"/api/posts/"+r.id+"/like",
{
method:"POST"
}
);


}catch(e){}



render();

}




function createReel(){

document
.getElementById("reelInput")
.click();

}





document.addEventListener(
"visibilitychange",
()=>{


document
.querySelectorAll(".reel video")
.forEach(v=>{


if(document.hidden){

v.pause();

}


});


});



</script>

</body>
</html>

<script>

function updateSoundIcon(i){

let video=
document.querySelectorAll(".reel video")[i];

let btn=
document.querySelectorAll(".reel-sound")[i];


if(!btn || !video)
return;


btn.innerHTML=
video.muted
?
"🔇"
:
"🔊";

}



function toggleMute(i){

let video=
document.querySelectorAll(".reel video")[i];


if(!video)
return;


video.muted=
!video.muted;


updateSoundIcon(i);


if(!video.paused){

video.play()
.catch(()=>{});

}

}





function seekReel(i,value){

let video=
document.querySelectorAll(".reel video")[i];


if(!video || !video.duration)
return;


video.currentTime=
(video.duration * value) / 100;

}




function updateProgress(i){

let box=
document.querySelectorAll(".reel")[i];


if(!box)
return;


let video=
box.querySelector("video");


let time=
box.querySelector(".reel-time");


let range=
box.querySelector(".reel-range");



if(!video.duration)
return;



let current=
formatTime(video.currentTime);


let total=
formatTime(video.duration);



if(time){

time.innerHTML=
current+" / "+total;

}



if(range){

range.value=
(video.currentTime / video.duration) * 100;

}

}




function setupRange(){

document
.querySelectorAll(".reel-range")
.forEach((r,i)=>{


r.addEventListener(
"input",
()=>{

seekReel(
i,
r.value
);

}

);


});

}



setInterval(()=>{


document
.querySelectorAll(".reel video")
.forEach((v,i)=>{


if(!v.paused){

updateProgress(i);

}


});


},500);



window.addEventListener(
"load",
()=>{

setupRange();

}

);

</script>
