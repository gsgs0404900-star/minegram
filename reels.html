<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Reels - Minegram</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{padding:0}
#reelsApp{position:fixed;inset:0;background:#000;overflow:hidden}
.reels-box{position:absolute;inset:0;background:#000;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels-box::-webkit-scrollbar{display:none}
.reels-feed{width:100%;min-height:100%;display:flex;flex-direction:column}
.reel-card{position:relative;width:100%;height:100dvh;min-height:100vh;background:#000;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always}
.reel-card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:block}
.reel-card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.28) 20%,transparent 46%,rgba(0,0,0,.08) 100%)}
.reels-back{position:fixed;top:20px;left:20px;z-index:50;width:44px;height:44px;padding:0;border:0;background:transparent;color:#fff;font-size:44px;line-height:52px;font-weight:300;cursor:pointer;text-shadow:0 2px 5px rgba(0,0,0,.65)}
#reelAddButton{position:fixed;top:20px;right:20px;z-index:50;width:64px;height:64px;border-radius:18px;border:0;background:#573b9b;color:#fff;font-size:38px;font-weight:300;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:none;user-select:none;text-decoration:none}
#reelFileInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.reel-info{position:absolute;left:24px;right:120px;bottom:58px;z-index:10;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.8)}
.reel-user-tag{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:36px;line-height:1.1;font-weight:700;letter-spacing:-.5px}
.verified{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#1684dc;color:#fff;font-size:23px;font-weight:700;text-shadow:none}
.reel-desc{margin-top:22px;font-size:28px;line-height:1.2;font-weight:400}
.reel-actions{position:absolute;right:20px;bottom:52px;z-index:20;width:64px;display:flex;flex-direction:column;align-items:center;color:#fff;text-align:center}
.reel-action{width:70px;height:70px;border:0;background:transparent;color:#fff;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:54px;line-height:1;text-shadow:0 2px 5px rgba(0,0,0,.8)}
.reel-count{font-size:28px;line-height:1;margin:5px 0 22px;font-weight:400;text-shadow:0 2px 5px rgba(0,0,0,.8)}
.reel-view{font-size:28px;line-height:1;margin:0 0 22px;font-weight:400;text-shadow:0 2px 5px rgba(0,0,0,.8)}
.reel-view-icon{font-size:40px;vertical-align:-3px;margin-right:4px}
.like.liked{color:#ff2d55}
.comment{font-size:58px}
.share{font-size:60px;margin-top:2px}
.empty{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:12px}
.empty strong{font-size:28px}.empty small{font-size:18px;color:#aaa}
.reel-comments{position:fixed;left:0;right:0;bottom:0;height:55%;background:rgba(0,0,0,.96);z-index:100;color:#fff;border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding:12px}
.reel-comments-head{display:flex;align-items:center;padding:12px 8px;font-size:18px}.reel-comments-head b{flex:1}.reel-comments-head button{background:transparent;color:#fff;border:0;font-size:22px;cursor:pointer}
.reel-comments-list{flex:1;overflow:auto;padding:12px}.reel-comments-input{display:flex;gap:8px;padding:8px}.reel-comments-input input{flex:1;background:#151515;color:#fff;border:1px solid #444;border-radius:12px;padding:13px}.reel-comments-input button{border:0;background:#573b9b;color:#fff;border-radius:12px;padding:0 18px;cursor:pointer}
@media(max-width:700px){
  .reels-back{top:18px;left:18px;width:44px;height:44px;font-size:44px}
  #reelAddButton{top:16px;right:18px;width:64px;height:64px;border-radius:18px;font-size:38px}
  .reel-info{left:40px;right:130px;bottom:92px}
  .reel-user-tag{font-size:30px;gap:8px}.verified{width:31px;height:31px;font-size:20px}.reel-desc{font-size:23px;margin-top:18px}
  .reel-actions{right:30px;bottom:78px;width:76px}.reel-action{width:44px;height:44px;font-size:32px}.reel-count,.reel-view{font-size:15px}.reel-view-icon{font-size:22px}
}
@media(max-width:420px){
  .reels-back{left:14px}.reel-info{left:22px;right:95px;bottom:72px}.reel-user-tag{font-size:18px}.verified{width:20px;height:20px;font-size:13px}.reel-desc{font-size:14px;margin-top:7px}.reel-actions{right:10px;bottom:42px}.reel-action{width:44px;height:44px;font-size:32px}.reel-count,.reel-view{font-size:15px;margin-bottom:9px}.reel-view-icon{font-size:22px}
  #reelAddButton{top:14px;right:10px;width:58px;height:58px;border-radius:17px;font-size:36px}
}
</style>
<style id="minegram-reels-tiny">
/* VERY SMALL REELS UI */
.reel-card{height:calc(100vh - 190px)!important;min-height:300px!important;border-radius:10px!important;max-width:92%!important;margin:0 auto!important}
.reel-user{font-size:12px!important}.reel-desc{font-size:10px!important;margin-top:3px!important}.reel-info{left:9px!important;bottom:9px!important}
.reel-actions{right:6px!important;bottom:9px!important;gap:1px!important}.reel-action{width:30px!important;height:30px!important;font-size:15px!important}.reel-count,.reel-view{font-size:9px!important;margin-bottom:2px!important}.reel-view{margin:1px 0 3px!important}
.reels-back{width:28px!important;height:28px!important;font-size:17px!important;top:70px!important;left:8px!important}
#reelAddButton{width:38px!important;height:38px!important;font-size:23px!important;bottom:82px!important}
@media(max-width:699px){.reel-card{height:calc(100vh - 185px)!important;min-height:300px!important;max-width:92%!important;border-radius:10px!important}.reels-back{top:66px!important}#reelAddButton{width:38px!important;height:38px!important;font-size:23px!important;bottom:82px!important}.reel-info{bottom:9px!important}.reel-actions{bottom:9px!important}}
</style>
</head>
<body>
<div id="reelsApp">
  <div class="reels-box" id="reelsBox"></div>
  <input id="reelFileInput" type="file" accept="video/*">
  <button id="reelAddButton" type="button" aria-label="Reels ekle">+</button>
  <button class="reels-back" id="reelsBack" type="button" aria-label="Geri">‹</button>
</div>

<script>
const API="/api";
let token=localStorage.getItem("minegram_token")||localStorage.getItem("minegram_supabase_token")||null;
async function checkSession(){
  if(!token){location.replace("giris.html");return}
  try{
    const response=await fetch(API+"/me",{headers:{Authorization:"Bearer "+token}});
    if(!response.ok)throw new Error("Oturum geçersiz");
    const me=await response.json().catch(()=>({}));
    const realUsername=me?.username||me?.user?.username||me?.profile?.username||me?.data?.username||me?.data?.user?.username||me?.data?.profile?.username||me?.user_metadata?.username||me?.user_metadata?.user_name||me?.user_metadata?.preferred_username||me?.email?.split?.("@")[0]||"";
    if(realUsername)window.minegramCurrentUser=String(realUsername).trim();
  }catch(error){
    console.warn("[REELS /me]",error);
    localStorage.removeItem("minegram_token");localStorage.removeItem("minegram_supabase_token");location.replace("giris.html");
  }
}
window.minegramSessionReady=checkSession();
</script>

<script>
(function(){
 const DB='minegram_reels_db',STORE='reels';let dbPromise;
 function username(){return String(window.minegramCurrentUser||localStorage.getItem('username')||localStorage.getItem('currentUser')||localStorage.getItem('minegram_username')||'').trim()||'kullanici'}
 function db(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbPromise}
 async function load(){const d=await db();return new Promise((res,rej)=>{const q=d.transaction(STORE,'readonly').objectStore(STORE).getAll();q.onsuccess=()=>res((q.result||[]).sort((a,b)=>Number(a.id)-Number(b.id)));q.onerror=()=>rej(q.error)})}
 async function saveAll(a){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite'),st=tx.objectStore(STORE);st.clear();a.forEach(x=>st.put(x));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function openCreator(u){u=String(u||'').trim();if(!u)return;try{localStorage.setItem('minegram_discover_creator',u)}catch(e){}location.href='ara.html?username='+encodeURIComponent(u)}
 function comments(un){const old=document.querySelector('.reel-comments');if(old)old.remove();const ov=document.createElement('div');ov.className='reel-comments';ov.innerHTML='<div class="reel-comments-head"><b>'+esc(un)+' yorumları</b><button type="button" class="close">✕</button></div><div class="reel-comments-list"></div><div class="reel-comments-input"><input placeholder="Yorum yaz..."/><button type="button">Gönder</button></div>';document.body.appendChild(ov);const list=ov.querySelector('.reel-comments-list'),input=ov.querySelector('input');function add(){if(input.value.trim()){const d=document.createElement('div');d.textContent=input.value.trim();d.style.padding='9px 0';list.appendChild(d);input.value=''}}ov.querySelector('.close').onclick=()=>ov.remove();ov.querySelector('.reel-comments-input button').onclick=add;input.onkeydown=e=>{if(e.key==='Enter')add()}}
 function share(r){const text='🎬 @'+r.username+' Reels: '+(r.description||'');if(navigator.share)navigator.share({text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>alert('Reels mesajı panoya kopyalandı.')).catch(()=>alert(text));else alert(text)}
 function playVisible(card){const v=card.querySelector('video');document.querySelectorAll('.reel-card video').forEach(x=>{if(x!==v)x.pause()});v.play().catch(()=>{})}
 async function render(){
  const box=document.getElementById('reelsBox');if(!box)return;let reels=[];try{reels=await load()}catch(e){console.error(e);box.innerHTML='<div class="empty"><strong>Reels yüklenemedi</strong><small>Sayfayı yenileyip tekrar deneyin.</small></div>';return}
  box.innerHTML='';
  if(!reels.length){box.innerHTML='<div class="empty"><strong>Henüz Reel yok</strong><small>İlk videoyu sen paylaş.</small></div>';return}
  const feed=document.createElement('div');feed.className='reels-feed';box.appendChild(feed);
  reels.forEach(r=>{
    const card=document.createElement('article');card.className='reel-card';card.dataset.id=r.id;
    const u=String(r.username||r.creatorUsername||'').trim()||'kullanici';
    card.innerHTML='<video playsinline muted loop preload="metadata"></video><div class="reel-info"><a class="reel-user-tag" href="ara.html?username='+encodeURIComponent(u)+'" data-creator="'+esc(u)+'">@'+esc(u)+'<span class="verified">✓</span></a><div class="reel-desc">'+esc(r.description||'Bugünün videosu 🔥')+'</div></div><div class="reel-actions"><button class="reel-action like" type="button" aria-label="Beğen">♡</button><div class="reel-count">'+(Number(r.likes)||0)+'</div><div class="reel-view"><span class="reel-view-icon">◉</span> '+(Number(r.views)||0)+'</div><button class="reel-action comment" type="button" aria-label="Yorum">▢</button><button class="reel-action share" type="button" aria-label="Paylaş">➤</button></div>';
    const video=card.querySelector('video');if(r.mediaBlob)video.src=URL.createObjectURL(r.mediaBlob);else if(r.mediaUri)video.src=r.mediaUri;else if(r.mediaData)video.src=r.mediaData;
    card.querySelector('.reel-user-tag').onclick=e=>{e.preventDefault();openCreator(u)};
    card.querySelector('.like').onclick=async()=>{r._liked=!r._liked;r.likes=Math.max(0,(Number(r.likes)||0)+(r._liked?1:-1));const b=card.querySelector('.like');b.textContent=r._liked?'♥':'♡';b.classList.toggle('liked',r._liked);card.querySelector('.reel-count').textContent=r.likes;await saveAll(reels)};
    card.querySelector('.comment').onclick=()=>comments(u);card.querySelector('.share').onclick=()=>share(r);
    video.addEventListener('click',()=>{if(video.paused)video.play().catch(()=>{});else video.pause()});
    feed.appendChild(card);
  });
  const io=new IntersectionObserver(entries=>entries.forEach(async e=>{const v=e.target.querySelector('video');if(e.isIntersecting&&e.intersectionRatio>.65){playVisible(e.target);const id=e.target.dataset.id;const k=username()+'_'+id;let seen={};try{seen=JSON.parse(localStorage.getItem('minegram_reel_views')||'{}')}catch(x){}if(!seen[k]){seen[k]=1;localStorage.setItem('minegram_reel_views',JSON.stringify(seen));const a=await load(),r=a.find(x=>String(x.id)===String(id));if(r){r.views=(Number(r.views)||0)+1;await saveAll(a);const el=e.target.querySelector('.reel-view');if(el)el.innerHTML='<span class="reel-view-icon">◉</span> '+r.views}}}else v.pause()}),{threshold:[.65]});
  box.querySelectorAll('.reel-card').forEach(x=>io.observe(x));
 }
 async function pickFile(){const input=document.getElementById('reelFileInput');if(!input)return;input.value='';input.click()}
 function picker(){const input=document.getElementById('reelFileInput');input.addEventListener('change',async function(){const f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith('video/')){alert('Lütfen bir video dosyası seç.');return}try{const a=await load();const id=Math.max(0,...a.map(x=>Number(x.id)||0))+1;const creator=username();a.push({id,username:creator,creatorUsername:creator,description:'Bugünün videosu 🔥',likes:0,views:0,mediaBlob:f});await saveAll(a);await render();const last=document.querySelector('.reel-card:last-child');if(last)last.scrollIntoView({behavior:'smooth'});alert('Reels başarıyla siteye eklendi.')}catch(e){console.error(e);alert('Video eklenemedi. Tarayıcı depolama alanına erişilemedi.')}input.value=''})}
 async function init(){try{if(window.minegramSessionReady)await window.minegramSessionReady}catch(e){}picker();document.getElementById('reelAddButton').addEventListener('click',pickFile);document.getElementById('reelsBack').onclick=()=>{if(history.length>1)history.back();else location.href='index.html'};await render()}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
