<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reels - Minegram</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}body{padding-bottom:76px}.app{height:calc(100vh - 76px);background:#000}.phone{width:390px;height:100%;min-height:0;max-height:896px;margin:0 auto;background:#000;position:relative;overflow:hidden}.reels-feed{height:100%;width:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.reels-feed::-webkit-scrollbar{display:none}.reel{height:100%;width:100%;position:relative;background:#000;scroll-snap-align:start;overflow:hidden}.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.08) 42%,transparent 67%);pointer-events:none}.topbtn{position:absolute;top:16px;width:52px;height:52px;border:0;border-radius:50%;background:rgba(0,0,0,.52);color:#fff;z-index:5;display:grid;place-items:center;cursor:pointer}.back{left:16px;font-size:34px}.add{right:16px;font-size:31px}.actions{position:absolute;right:12px;bottom:106px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px}.action{border:0;background:transparent;color:#fff;width:52px;min-height:48px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-shadow:0 2px 5px #000}.action .ico{font-size:29px;line-height:31px}.action.liked .ico{color:#ff3150}.view-stat{cursor:default}.action .num{font-size:13px;font-weight:700}.info{position:absolute;left:18px;right:72px;bottom:24px;z-index:6;text-shadow:0 2px 5px #000}.userrow{display:flex;align-items:center;gap:8px}.avatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:#3f91cc;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:18px;cursor:pointer}.avatar img{width:100%;height:100%;object-fit:cover}.usercol{min-width:0}.username{font-size:16px;font-weight:800;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.verify{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#1976d2;font-size:12px;margin-left:4px;text-shadow:none}.follow{margin-left:5px;height:32px;border:1px solid rgba(255,255,255,.75);border-radius:9px;background:transparent;color:#fff;padding:0 11px;font-weight:700;cursor:pointer}.date{color:#bbb;font-size:12px;margin:2px 0 0 54px}.music{margin:7px 0 0 54px;display:flex;align-items:center;gap:6px;max-width:220px;background:rgba(0,0,0,.45);border-radius:10px;padding:6px}.music img{width:30px;height:30px;object-fit:cover;border-radius:6px}.music b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.music span{font-size:9px;color:#bbb}.desc{font-size:15px;line-height:1.35;margin-top:6px}.empty,.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.empty{color:#aaa}.empty .movie{font-size:58px;opacity:.5}.empty b{font-size:17px;color:#ddd;margin-top:10px}.empty span{font-size:13px;color:#777;margin-top:5px}.loading{color:#999;font-size:14px}.spinner{width:28px;height:28px;border:3px solid #555;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:9px}@keyframes spin{to{transform:rotate(360deg)}}.nav{position:fixed;left:0;right:0;bottom:0;height:76px;background:#121018;border-top:1px solid #201d27;display:flex;z-index:9999;padding:5px max(8px,calc((100% - 760px)/2)) env(safe-area-inset-bottom)}.nav a{flex:1;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#ddd;text-decoration:none;font-size:9px;min-width:0}.nav-icon{width:45px;height:32px;border-radius:18px;display:grid;place-items:center}.nav a.active .nav-icon{background:#3b3150}.svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#25222d;color:#fff;padding:11px 15px;border-radius:12px;font-size:13px;z-index:10001;display:none;max-width:90%;text-align:center}.toast.show{display:block}.comments{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(390px,100%);height:72%;background:#000;border-radius:22px 22px 0 0;z-index:10000;display:none;flex-direction:column;padding:10px}.comments.open{display:flex}.comments-head{display:flex;justify-content:space-between;align-items:center;padding:7px 4px 12px;border-bottom:1px solid #252525}.comments-list{flex:1;overflow:auto;padding:10px 3px}.comment{padding:9px 0;border-bottom:1px solid #202020}.comment b{font-size:13px}.comment p{margin:4px 0 0;color:#ddd;font-size:13px}.comment-form{display:flex;gap:7px;padding-top:8px}.comment-form input{flex:1;background:#191919;color:#fff;border:1px solid #333;border-radius:10px;padding:11px}.comment-form button,.close-comments{border:0;background:#3b3150;color:#fff;border-radius:10px;padding:10px 13px}.refresh{position:absolute;top:0;left:0;right:0;height:46px;z-index:20;display:none;align-items:center;justify-content:center;background:linear-gradient(#000,transparent)}.refresh.show{display:flex}.mini-spin{width:23px;height:23px;border:2.5px solid #555;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}@media(max-width:699px){.phone{width:100vw}.topbtn{top:14px}.back{left:14px}.add{right:14px}.info{bottom:24px}.actions{bottom:105px}}
</style>
</head>
<body>
<div class="app"><div class="phone"><div id="refresh" class="refresh"><span class="mini-spin"></span></div><div id="feed" class="reels-feed"><div class="loading"><span class="spinner"></span>Reels yükleniyor...</div></div></div></div>
<nav class="nav">
<a href="index.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg></span>Ana Sayfa</a>
<a href="ara.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg></span>Ara</a>
<a href="olustur.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span>Oluştur</a>
<a class="active" href="reels.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4l3 5M13 4l3 5"/></svg></span>Reels</a>
<a href="profile.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span>Profil</a>
</nav>
<input id="reelInput" type="file" accept="video/*"><div id="toast" class="toast"></div>
<div id="comments" class="comments"><div class="comments-head"><b>Reels yorumları</b><button class="close-comments" onclick="closeComments()">✕</button></div><div id="commentsList" class="comments-list"></div><div class="comment-form"><input id="commentInput" placeholder="Yorum yaz..."><button onclick="sendComment()">Gönder</button></div></div>
<script>
let token=localStorage.getItem('minegram_token')||localStorage.getItem('minegram_supabase_token')||'';
let me=null,reels=[],currentCommentReel=null,observer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const first=(...v)=>v.find(x=>x!==undefined&&x!==null&&String(x).trim()!=='')??'';
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2600)}
async function api(url,opt={}){if(!token){location.replace('giris.html');throw Error('Oturum gerekli')}const headers={...(opt.headers||{}),Authorization:'Bearer '+token};if(opt.body&&!(opt.body instanceof FormData)){headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(url,{...opt,headers,credentials:'same-origin'});if(r.status===401){localStorage.removeItem('minegram_token');localStorage.removeItem('minegram_supabase_token');token='';location.replace('giris.html');throw Error('Oturum süresi doldu')}const raw=await r.text();let j=null;try{j=raw?JSON.parse(raw):null}catch{}if(!r.ok)throw Error(j?.error||j?.message||'Sunucu işlemi başarısız ('+r.status+')');return j}
function getList(x){return Array.isArray(x)?x:Array.isArray(x?.posts)?x.posts:Array.isArray(x?.feed)?x.feed:Array.isArray(x?.data)?x.data:Array.isArray(x?.items)?x.items:Array.isArray(x?.results)?x.results:[]}
function usernameFromMe(){return String(first(me?.username,me?.user?.username,me?.profile?.username,localStorage.getItem('username'),localStorage.getItem('currentUser'))).trim()}
function hasVerified(p){const v=first(p?.verified,p?.isVerified,p?.premiumVerified,p?.premium_verified,p?.user?.verified,p?.author?.verified);const prem=first(p?.premium,p?.isPremium,p?.user?.premium,p?.user?.isPremium,p?.author?.premium,p?.author?.isPremium);return v===true||String(v).toLowerCase()==='true'||prem===true||String(prem).toLowerCase()==='true'}
function mediaUrl(p){const m=p?.media;if(m&&typeof m==='object')return first(p?.mediaUrl,p?.media_url,p?.videoUrl,p?.video_url,p?.mediaUri,m?.url,m?.uri,m?.src);return first(p?.mediaUrl,p?.media_url,p?.videoUrl,p?.video_url,p?.mediaUri,p?.media,p?.video)}
function isVideo(p){const m=p?.media;const t=String(first(p?.mediaType,p?.type,p?.mimeType,p?.videoType,m?.type)).toLowerCase();const u=String(mediaUrl(p)).toLowerCase().split(/[?#]/)[0];return t.includes('video')||/\.(mp4|webm|mov|m4v|3gp)$/.test(u)||!!p?.videoUrl||!!p?.video_url||!!p?.video}
function normalize(p,i){const u=p?.user||p?.author||p?.owner||{};return{raw:p,id:String(first(p?.id,p?.postId,p?.uuid,'reel-'+i)),username:String(first(p?.username,u?.username,p?.ownerUsername,p?.author?.username,p?.owner?.username)).trim(),caption:String(first(p?.caption,p?.text,p?.description,'Yeni Reels 🔥')),likes:Array.isArray(p?.likes)?p.likes.length:Number(first(p?.likesCount,p?.like_count,p?.likes,0))||0,views:Number(first(p?.views,p?.viewCount,p?.view_count,0))||0,url:String(mediaUrl(p)),avatar:String(first(p?.avatar,p?.avatar_url,p?.avatarUrl,p?.profilePhoto,p?.profile_photo,u?.avatar,u?.avatar_url,u?.avatarUrl)).trim(),following:Boolean(first(p?.followingByMe,p?.following,false)),date:first(p?.createdAt,p?.created_at,p?.date,p?.timestamp,''),music:p?.music||null}}
function render(){const feed=document.getElementById('feed');if(observer){observer.disconnect();observer=null}if(!reels.length){feed.innerHTML='<div class="empty"><div class="movie">🎬</div><b>Henüz Reel yok</b><span>İlk videoyu sen paylaş.</span></div>'+addButton();return}feed.innerHTML=reels.map((r,i)=>{const name=esc(r.username);const avatar=r.avatar?'<img src="'+esc(r.avatar)+'" alt="">':esc((r.username||'M').charAt(0).toUpperCase());const music=typeof r.music==='object'&&r.music?'<div class="music">'+(r.music.artworkUrl?'<img src="'+esc(r.music.artworkUrl)+'">':'')+'<div><b>'+esc(first(r.music.title,r.music.name,''))+'</b><span>'+esc(first(r.music.artist,''))+'</span></div></div>':'';return '<article class="reel" data-index="'+i+'" data-id="'+esc(r.id)+'"><video data-src="'+esc(r.url)+'" playsinline muted loop preload="metadata"></video><div class="shade"></div><button class="topbtn back" onclick="location.href=\'index.html\'">‹</button>'+addButton()+'<div class="actions"><button class="action like" onclick="likeReel('+i+')"><span class="ico">♡</span><span class="num">'+r.likes+'</span></button><div class="action view-stat"><span class="ico">◉</span><span class="num">'+r.views+'</span></div><button class="action" onclick="openComments('+i+')"><span class="ico">▢</span></button><button class="action" onclick="shareReel('+i+')"><span class="ico">➤</span></button></div><div class="info"><div class="userrow"><div class="avatar" onclick="goProfile(\''+encodeURIComponent(r.username)+'\')">'+avatar+'</div><div class="usercol"><div><span class="username" onclick="goProfile(\''+encodeURIComponent(r.username)+'\')">@'+name+'</span>'+(hasVerified(r.raw)?'<span class="verify">✓</span>':'')+(r.username && r.username.toLowerCase()!==usernameFromMe().toLowerCase()?'<button class="follow" onclick="toggleFollow('+i+')">'+(r.following?'Takibi Bırak':'Takip Et')+'</button>':'')</div></div></div><div class="date">'+esc(formatDate(r.date))+'</div>'+music+'<div class="desc">'+esc(r.caption)+'</div></div></article>'}).join('');setupVideos()}
function addButton(){return '<button class="topbtn add" onclick="openPicker()">+</button>'}
function formatDate(v){if(!v)return '';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function goProfile(u){location.href='ara.html?username='+u}
async function loadAuthenticatedVideo(url){if(!url||!token)return url;try{const r=await fetch(url,{headers:{Authorization:'Bearer '+token},credentials:'same-origin'});if(r.ok){const b=await r.blob();return URL.createObjectURL(b)}}catch{}return url}
async function setupVideos(){const articles=[...document.querySelectorAll('.reel')];await Promise.all(articles.map(async(a,i)=>{const v=a.querySelector('video');const r=reels[i];if(r?.url){const u=await loadAuthenticatedVideo(r.url);if(u){v.src=u;v.load()}}}));observer=new IntersectionObserver(entries=>entries.forEach(e=>{const v=e.target.querySelector('video');if(e.isIntersecting&&e.intersectionRatio>.65){document.querySelectorAll('.reel video').forEach(x=>{if(x!==v)x.pause()});v.play().catch(()=>{});viewCount(Number(e.target.dataset.index),true)}else v.pause()}),{threshold:[.65]});articles.forEach(a=>observer.observe(a))}
const seen=new Set();function viewCount(i){const r=reels[i];if(!r||seen.has(r.id))return;seen.add(r.id);const key='viewed_'+usernameFromMe()+'_'+r.id;const p=localStorage.getItem(key);if(!p){r.views++;localStorage.setItem(key,'1');const el=document.querySelectorAll('.reel')[i]?.querySelector('.action:nth-child(2) .num');if(el)el.textContent=r.views}}
async function likeReel(i){const r=reels[i];if(!r)return;const btn=document.querySelectorAll('.reel')[i]?.querySelector('.like');const liked=btn?.classList.contains('liked');r.likes=Math.max(0,r.likes+(liked?-1:1));btn?.classList.toggle('liked',!liked);if(btn)btn.querySelector('.ico').textContent=liked?'♡':'♥';if(btn)btn.querySelector('.num').textContent=r.likes;try{await api('/api/posts/'+encodeURIComponent(r.id)+'/like',{method:'POST'})}catch(e){/* UI remains usable if backend route differs */}}
async function toggleFollow(i){const r=reels[i];if(!r||!r.username)return;try{const j=await api('/api/users/'+encodeURIComponent(r.username)+'/follow',{method:'POST'});r.following=Boolean(j?.following??!r.following);render()}catch(e){toast(e.message||'Takip işlemi başarısız')}}
function openPicker(){document.getElementById('reelInput').click()}
document.getElementById('reelInput').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(!file.type.startsWith('video/'))return toast('Lütfen video seç.');try{toast('Video yükleniyor...');const fd=new FormData();fd.append('media',file,file.name);fd.append('caption','Yeni Reels 🔥');await api('/api/posts',{method:'POST',body:fd});toast('Reels başarıyla siteye eklendi.');await loadReels()}catch(err){toast(err.message||'Video yüklenemedi.')}});
async function loadReels(){try{if(!token){location.href='giris.html';return}me=await api('/api/me');const posts=getList(await api('/api/feed'));reels=posts.filter(isVideo).map(normalize).filter(r=>r.url&&r.username);render()}catch(e){console.error('[REELS]',e);document.getElementById('feed').innerHTML='<div class="empty"><div class="movie">⚠️</div><b>Reels yüklenemedi</b><span>'+esc(e.message)+'</span></div>'+addButton()}}
function openComments(i){currentCommentReel=i;document.getElementById('comments').classList.add('open');document.getElementById('commentsList').innerHTML='<div class="comment"><b>@'+esc(reels[i].username)+'</b><p>Bu Reel için yorumlar</p></div>'}
function closeComments(){document.getElementById('comments').classList.remove('open')}
function sendComment(){const inp=document.getElementById('commentInput');const text=inp.value.trim();if(!text)return;const d=document.createElement('div');d.className='comment';d.innerHTML='<b>@'+esc(usernameFromMe()||'kullanici')+'</b><p>'+esc(text)+'</p>';document.getElementById('commentsList').appendChild(d);inp.value=''}
async function shareReel(i){const r=reels[i];const text='🎬 @'+r.username+' Reels: '+r.caption;if(navigator.share){try{await navigator.share({text})}catch{}}else{try{await navigator.clipboard.writeText(text);toast('Reels bilgisi panoya kopyalandı.')}catch{toast(text)}}}
let pullStart=0,pulling=false;const feed=document.getElementById('feed');feed.addEventListener('touchstart',e=>{if(feed.scrollTop===0){pullStart=e.touches[0].clientY;pulling=true}}, {passive:true});feed.addEventListener('touchmove',e=>{if(!pulling)return;const d=e.touches[0].clientY-pullStart;if(d>70)document.getElementById('refresh').classList.add('show')},{passive:true});feed.addEventListener('touchend',async e=>{if(!pulling)return;pulling=false;const d=e.changedTouches[0].clientY-pullStart;if(d>70){document.getElementById('refresh').classList.add('show');await loadReels();document.getElementById('refresh').classList.remove('show')}});
loadReels();
</script>
</body></html>
