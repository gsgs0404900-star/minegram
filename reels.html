<script>
let token=localStorage.getItem('minegram_token')||localStorage.getItem('minegram_supabase_token')||'';
let me=null,reels=[],observer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const first=(...v)=>v.find(x=>x!==undefined&&x!==null&&String(x).trim()!=='')??'';
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2600)}
async function api(url,opt={}){if(!token){location.replace('giris.html');throw Error('Oturum gerekli')}const headers={...(opt.headers||{}),Authorization:'Bearer '+token};if(opt.body&&!(opt.body instanceof FormData)){headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(url,{...opt,headers,credentials:'same-origin'});if(r.status===401){localStorage.removeItem('minegram_token');localStorage.removeItem('minegram_supabase_token');token='';location.replace('giris.html');throw Error('Oturum süresi doldu')}const raw=await r.text();let j=null;try{j=raw?JSON.parse(raw):null}catch{}if(!r.ok)throw Error(j?.error||j?.message||'Sunucu işlemi başarısız ('+r.status+')');return j}
function getList(x){return Array.isArray(x)?x:Array.isArray(x?.posts)?x.posts:Array.isArray(x?.feed)?x.feed:Array.isArray(x?.data)?x.data:Array.isArray(x?.items)?x.items:Array.isArray(x?.results)?x.results:[]}
function usernameFromMe(){return String(first(me?.username,me?.user?.username,me?.profile?.username,localStorage.getItem('username'),localStorage.getItem('currentUser'))).trim()}
function hasVerified(p){const v=first(p?.verified,p?.isVerified,p?.premiumVerified,p?.premium_verified,p?.user?.verified,p?.author?.verified);const prem=first(p?.premium,p?.isPremium,p?.user?.premium,p?.user?.isPremium,p?.author?.premium,p?.author?.isPremium);return v===true||String(v).toLowerCase()==='true'||prem===true||String(prem).toLowerCase()==='true'}
function mediaUrl(p){const m=p?.media;if(m&&typeof m==='object')return first(p?.mediaUrl,p?.media_url,p?.videoUrl,p?.video_url,p?.mediaUri,m?.url,m?.uri,m?.src);return first(p?.mediaUrl,p?.media_url,p?.videoUrl,p?.video_url,p?.mediaUri,p?.media,p?.video)}
function isVideo(p){const m=p?.media;const t=String(first(p?.mediaType,p?.type,p?.mimeType,p?.videoType,m?.type)).toLowerCase();const u=String(mediaUrl(p)).toLowerCase().split(/[?#]/)[0];return t.includes('video')||/\.(mp4|webm|mov|m4v|3gp)$/.test(u)||!!p?.videoUrl||!!p?.video_url||!!p?.video}

async function setupVideos(){const articles=[...document.querySelectorAll('.reel')];await Promise.all(articles.map(async(a,i)=>{const v=a.querySelector('video');const r=reels[i];if(!r?.url)return;const u=await loadAuthenticatedVideo(r.url);if(u){v.src=u;v.muted=false;v.volume=1;v.load();v.addEventListener('loadedmetadata',()=>{updateProgress(i);updateSoundIcon(i,false)},{once:true});v.addEventListener('timeupdate',()=>updateProgress(i));v.addEventListener('play',()=>setPlayIcon(i,false));v.addEventListener('pause',()=>setPlayIcon(i,true));v.addEventListener('ended',()=>{setPlayIcon(i,true);updateProgress(i)});}}));observer=new IntersectionObserver(entries=>entries.forEach(e=>{const v=e.target.querySelector('video');const i=Number(e.target.dataset.index);if(e.isIntersecting&&e.intersectionRatio>.65){document.querySelectorAll('.reel video').forEach((x,j)=>{if(x!==v){x.pause();x.muted=true;x.volume=0;updateSoundIcon(j,true)}});v.muted=false;v.volume=1;updateSoundIcon(i,false);v.play().catch(()=>{setPlayIcon(i,true)});viewCount(i,true)}else v.pause()}),{threshold:[.65]});articles.forEach(a=>{const v=a.querySelector('video');v.addEventListener('click',()=>togglePlay(Number(a.dataset.index)));observer.observe(a)})}

   REELS YORUMLARI — ANASAYFA İLE AYNI SİSTEM

let currentCommentReel=null;
let currentCommentSort="forYou";
let replyingTo=null;

function localCommentsKey(id){return "minegram_comments_"+String(id)}
function getLocalComments(id){
  try{const x=JSON.parse(localStorage.getItem(localCommentsKey(id))||"[]");return Array.isArray(x)?x:[]}catch(e){return []}
}
function saveLocalComment(id,c){
  const arr=getLocalComments(id);arr.push(c);
  try{localStorage.setItem(localCommentsKey(id),JSON.stringify(arr.slice(-100)))}catch(e){}
}
function mergeComments(server,id){
  const all=Array.isArray(server)?[...server]:[];
  const local=getLocalComments(id);
  for(const c of local){
    const same=all.find(x=>String(x.id||"")===String(c.id||""));
    if(same){
      if(Array.isArray(c.replies)&&c.replies.length){
        same.replies=Array.isArray(same.replies)?same.replies:[];
        for(const r of c.replies){
          if(!same.replies.some(x=>String(x.id||"")===String(r.id||"") || (x.username===r.username&&x.text===r.text))){same.replies.push(r)}
        }
        same.replyCount=Math.max(Number(same.replyCount||0),same.replies.length);
      }
      continue;
    }
    if(c.localReplyParent)continue;
    const exists=all.some(x=>x.username===c.username&&x.text===c.text);
    if(!exists)all.push(c);
  }
  return all;
}
function relativeTime(v){
  const d=new Date(v);if(!v||isNaN(d))return "";
  let sec=Math.floor((Date.now()-d.getTime())/1000);if(sec<60)return sec+" saniye önce";
  let min=Math.floor(sec/60);if(min<60)return min+" dakika önce";
  let h=Math.floor(min/60);if(h<24)return h+" saat önce";
  let day=Math.floor(h/24);if(day<7)return day+" gün önce";
  if(day<365)return Math.floor(day/7)+" hafta önce";
  return d.toLocaleDateString("tr-TR");
}
function commentObj(x){
  if(typeof x==='string')return{id:'local-'+Date.now(),text:x,username:usernameFromMe()||'minegram',createdAt:new Date().toISOString(),likedByMe:false,replies:[]};
  const u=x?.user||x?.author||{};
  return {
    id:String(first(x?.id,x?.commentId,'local-'+Math.random().toString(36).slice(2))),
    text:String(first(x?.text,x?.comment,x?.body,x?.content,'')),
    username:String(first(x?.username,u?.username,x?.authorUsername,'')),
    avatar:String(first(x?.avatar,x?.avatarUrl,x?.avatar_url,u?.avatar,u?.avatarUrl,'')),
    createdAt:first(x?.createdAt,x?.created_at,x?.timestamp,Date.now()),
    likes:Number(first(x?.likesCount,x?.like_count,x?.likes,0))||0,
    likedByMe:!!(x?.likedByMe||x?.liked),
    replies:Array.isArray(x?.replies)?x.replies:[],
    replyCount:Number(first(x?.replyCount,x?.reply_count,0))||0
  };
}
function sortComments(arr){
  const a=[...(arr||[])];
  if(currentCommentSort==='newest')return a.sort((x,y)=>new Date(y.createdAt||y.created_at||0)-new Date(x.createdAt||x.created_at||0));
  if(currentCommentSort==='popular')return a.sort((x,y)=>Number(y.likes||y.likeCount||0)-Number(x.likes||x.likeCount||0));
  return a;
}
function renderReply(r){
  const u=esc(r.username||r.user?.username||'minegram');
  return '<div class="reply-row"><div class="avatar small">'+esc(u.charAt(0).toUpperCase())+'</div><div><b>@'+u+'</b><div class="comment-text">'+esc(r.text||r.content||'')+'</div><div class="comment-meta">'+relativeTime(r.createdAt||r.created_at)+'</div></div></div>';
}
function renderComment(c){
  const username=esc(c.username||c.user?.username||me?.username||'minegram');
  const id=esc(c.id||'');
  const liked=!!c.likedByMe;
  const replies=Array.isArray(c.replies)?c.replies:[];
  const replyCount=replies.length||Number(c.replyCount||0);
  return '<div class="comment-wrap" data-comment-id="'+id+'"><div class="comment-row">'+
    '<div class="avatar small">'+esc(username.charAt(0).toUpperCase())+'</div>'+
    '<div class="comment-body">'+
      '<div class="comment-user" onclick="goProfile(\''+encodeURIComponent(username)+'\')">@'+username+'</div>'+ 
      '<div class="comment-text">'+esc(c.text||c.content||'')+'</div>'+ 
      '<div class="comment-meta">'+relativeTime(c.createdAt||c.created_at)+'&nbsp;'+
        '<button class="reply-link" onclick="startReply(\''+id+'\',\''+username.replace(/'/g,"&#39;")+'\')">Yanıtla</button>'+ 
        (replyCount?'&nbsp;<button class="reply-link reply-count-link" onclick="toggleReplies(\''+id+'\')">'+replyCount+' yanıt</button>':'')+
      '</div>'+ 
    '</div>'+ 
    '<button class="comment-like '+(liked?'liked':'')+'" onclick="likeComment(\''+id+'\')">'+(liked?'♥':'♡')+'</button>'+ 
    '</div><div id="replies-'+id+'" class="replies hidden">'+replies.map(renderReply).join('')+'</div></div>';
}
function renderCommentsForReel(arr){
  const list=document.getElementById('commentsList');
  const sorted=sortComments(arr);
  list.innerHTML=sorted.length?sorted.map(renderComment).join(''):'<div class="comment-empty">Henüz yorum yok.</div>';
}
async function syncLegacyLocalCommentsToServer(id){
  const local=getLocalComments(id).filter(c=>c&&c.local===true&&c.text);
  for(const c of local){
    try{
      const result=await api('/api/posts/'+encodeURIComponent(id)+'/comments',{method:'POST',body:{text:String(c.text).trim()}});
      const returned=result?.comment||result?.data||result;
      if(returned?.id){c.id=returned.id;c.local=false;c.username=returned.username||c.username;c.text=returned.text||c.text;c.createdAt=returned.createdAt||returned.created_at||c.createdAt}
    }catch(e){}
  }
  try{localStorage.setItem(localCommentsKey(id),JSON.stringify(getLocalComments(id).slice(-100)))}catch(e){}
}
async function refreshComments(showLoading=true){
  if(currentCommentReel===null)return;
  const r=reels[currentCommentReel];if(!r)return;
  const list=document.getElementById('commentsList');
  if(showLoading)renderCommentsForReel(getLocalComments(r.id));
  try{
    await syncLegacyLocalCommentsToServer(r.id);
    const j=await api('/api/posts/'+encodeURIComponent(r.id)+'/comments?ts='+Date.now());
    const remote=Array.isArray(j?.comments)?j.comments:(Array.isArray(j)?j:(Array.isArray(j?.data)?j.data:[]));
    const merged=mergeComments(remote.map(commentObj),r.id);
    r.commentCount=Number(j?.commentCount??merged.length??r.commentCount??0);
    renderCommentsForReel(merged);
    const n=document.querySelectorAll('.reel')[currentCommentReel]?.querySelector('.comment-count');if(n)n.textContent=r.commentCount;
  }catch(e){
    renderCommentsForReel(getLocalComments(r.id).map(commentObj));
    if(!getLocalComments(r.id).length)toast(e.message||'Yorumlar alınamadı');
  }
}
async function openComments(i){
  currentCommentReel=i;currentCommentSort='forYou';replyingTo=null;cancelReply();
  const input=document.getElementById('commentInput');if(input){input.value='';input.placeholder='Bunun hakkında ne düşünüyorsun?'}
  const sort=document.getElementById('commentSort');if(sort)sort.value='forYou';
  document.getElementById('comments').classList.add('open');
  const r=reels[i];
  if(r)renderCommentsForReel(getLocalComments(r.id).map(commentObj));
  await refreshComments(true);
}
function closeComments(){document.getElementById('comments')?.classList.remove('open');currentCommentReel=null;cancelReply()}
function changeCommentSort(value){currentCommentSort=value||'forYou';if(currentCommentReel!==null){const r=reels[currentCommentReel];if(r)refreshComments(false)}}
function startReply(id,username){
  replyingTo=decodeURIComponent(String(id));
  const cleanUser=String(username||'minegram').replace(/^@/,'');
  const input=document.getElementById('commentInput');
  const bar=document.getElementById('replyingBar');
  const text=document.getElementById('replyingText');
  if(bar)bar.classList.add('show');
  if(text)text.textContent='@'+cleanUser+' kişisine yanıt yazıyorsun';
  if(input){input.placeholder='@'+cleanUser+' kişisine yanıt yaz...';input.focus()}
}
function cancelReply(){
  replyingTo=null;
  const bar=document.getElementById('replyingBar');
  const input=document.getElementById('commentInput');
  if(bar)bar.classList.remove('show');
  if(input)input.placeholder='Bunun hakkında ne düşünüyorsun?';
}
function toggleReplies(id){document.getElementById('replies-'+CSS.escape(String(id)))?.classList.toggle('hidden')}
async function sendComment(){
  const input=document.getElementById('commentInput');const textValue=String(input?.value||'').trim();
  if(!textValue||currentCommentReel===null)return;
  const r=reels[currentCommentReel];if(!r)return;
  const postId=r.id,replyId=replyingTo,sendButton=document.querySelector('.comment-compose .send');
  if(sendButton)sendButton.disabled=true;
  const username=usernameFromMe()||'minegram';
  const item={id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2),username,text:textValue,createdAt:new Date().toISOString(),likedByMe:false,local:true,replies:[]};
  if(replyId){
    const local=getLocalComments(postId);let parent=local.find(c=>String(c.id)===String(replyId));
    if(!parent){parent={id:String(replyId),username:'',text:'',createdAt:new Date().toISOString(),replies:[],localReplyParent:true};local.push(parent)}
    parent.replies=Array.isArray(parent.replies)?parent.replies:[];parent.replies.push(item);
    try{localStorage.setItem(localCommentsKey(postId),JSON.stringify(local.slice(-100)))}catch(e){}
    const wrap=document.querySelector('.comment-wrap[data-comment-id="'+CSS.escape(String(replyId))+'"]');const replies=wrap?.querySelector('.replies');if(replies){replies.classList.remove('hidden');replies.insertAdjacentHTML('beforeend',renderReply(item))}
  }else{
    saveLocalComment(postId,item);renderCommentsForReel(getLocalComments(postId).map(commentObj));const list=document.getElementById('commentsList');if(list)list.scrollTop=list.scrollHeight;
  }
  input.value='';cancelReply();toast(replyId?'Yanıt gönderildi':'Yorum gönderildi');
  try{
    let result;
    if(replyId){
      try{result=await api('/api/comments/'+encodeURIComponent(replyId)+'/reply',{method:'POST',body:{text:textValue}})}
      catch(firstError){result=await api('/api/posts/'+encodeURIComponent(postId)+'/comments/'+encodeURIComponent(replyId)+'/reply',{method:'POST',body:{text:textValue}})}
    }else result=await api('/api/posts/'+encodeURIComponent(postId)+'/comments',{method:'POST',body:{text:textValue}});
    const returned=result?.comment||result?.data||result;
    if(returned?.id){
      const local=getLocalComments(postId);
      for(const c of local){
        if(String(c.id)===String(item.id)){c.id=returned.id;c.local=false;c.username=returned.username||c.username;c.text=returned.text||c.text;c.createdAt=returned.createdAt||returned.created_at||c.createdAt}
        if(replyId&&Array.isArray(c.replies))for(const q of c.replies)if(String(q.id)===String(item.id)){q.id=returned.id;q.local=false}
      }
      try{localStorage.setItem(localCommentsKey(postId),JSON.stringify(local.slice(-100)))}catch(e){}
    }
    await refreshComments(false);await loadReels();
  }catch(e){
    const local=getLocalComments(postId);
    if(replyId){for(const c of local)if(Array.isArray(c.replies))c.replies=c.replies.filter(q=>String(q.id)!==String(item.id))}
    else{const filtered=local.filter(c=>String(c.id)!==String(item.id));local.length=0;local.push(...filtered)}
    try{localStorage.setItem(localCommentsKey(postId),JSON.stringify(local.slice(-100)))}catch(_){ }
    renderCommentsForReel(local.map(commentObj));toast(e.message||'Gönderilemedi');
  }finally{if(sendButton)sendButton.disabled=false}
}
async function likeComment(id){

  if(!id)return;
  const was=!!btn?.classList.contains('liked');if(btn){btn.classList.toggle('liked',!was);btn.textContent=!was?'♥':'♡'}

}

async function getMe(){

 try{
