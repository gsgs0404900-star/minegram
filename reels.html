<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reels - Minegram</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#eee;
  font-family:Inter,Arial,sans-serif;
  padding-bottom:88px;
}

body{
  overflow-x:hidden;
}

.app{
  width:100%;
  min-height:100vh;
  background:#000;
}

/* ÜST BAŞLIK */
.top{
  height:62px;
  display:flex;
  align-items:center;
  border-bottom:1px solid #25222b;
  padding:0 20px;
  position:sticky;
  top:0;
  background:#000;
  z-index:10;
}

.top b{
  font-size:19px;
}

/* ORTA ALAN */
.page{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:22px 20px;
}

/* REELS ALANI */
.reels-box{
  width:100%;
  min-height:calc(100vh - 150px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.empty{
  width:100%;
  text-align:center;
  color:#999;
}

.empty svg{
  width:52px;
  height:52px;
  margin:0 auto;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.empty strong{
  display:block;
  color:#ddd;
  margin-top:14px;
  font-size:16px;
}

.empty small{
  display:block;
  margin-top:6px;
  color:#888;
  font-size:13px;
}

/* ALT MENÜ */
.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  height:76px;
  background:#121018;
  border-top:1px solid #201d27;

  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:space-around;

  z-index:1000;

  padding:5px 8px env(safe-area-inset-bottom);
}

.nav a{
  flex:1;
  height:100%;
  min-width:0;

  color:#ddd;
  text-decoration:none;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:3px;
  font-size:9px;

  border:0;
  background:transparent;
  cursor:pointer;
}

.nav-icon{
  width:45px;
  height:32px;
  border-radius:18px;

  display:grid;
  place-items:center;
}

.nav a.active .nav-icon{
  background:#3b3150;
}

.nav .svg{
  width:21px;
  height:21px;

  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* MASAÜSTÜNDE DE TAM ORTADA */
@media(min-width:700px){

  .nav{
    padding-left:calc((100% - 760px)/2);
    padding-right:calc((100% - 760px)/2);
  }

}

/* TELEFON */
@media(max-width:699px){

  .page{
    padding:18px 16px;
  }

  .reels-box{
    min-height:calc(100vh - 145px);
  }

}
</style>
</head>

<body>

<main class="app">

  <!-- ÜST -->
  <div class="top">
    <b>Reels</b>
  </div>

  <!-- REELS İÇERİĞİ -->
  <div class="page">

    <div class="reels-box">

      <div class="empty">

        <svg viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="2"></rect>
          <path d="M3 9h18"></path>
          <path d="M8 4l3 5"></path>
          <path d="M13 4l3 5"></path>
        </svg>

        <strong>Henüz Reel yok</strong>

        <small>
          İlk videoyu sen paylaş.
        </small>

      </div>

    </div>

  </div>

  <!-- ALT MENÜ -->
  <nav class="nav">

    <!-- ANA SAYFA -->
    <a href="index.html">
      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"></path>
        </svg>
      </span>
      <span>Ana Sayfa</span>
    </a>

    <!-- ARA -->
    <a href="ara.html">
      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="m16 16 5 5"></path>
        </svg>
      </span>
      <span>Ara</span>
    </a>

    <!-- OLUŞTUR -->
    <a href="olustur.html">
      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <rect x="4" y="4" width="16" height="16" rx="4"></rect>
          <path d="M12 8v8"></path>
          <path d="M8 12h8"></path>
        </svg>
      </span>
      <span>Oluştur</span>
    </a>

    <!-- REELS -->
    <a class="active" href="reels.html">
      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="2"></rect>
          <path d="M3 9h18"></path>
          <path d="M8 4l3 5"></path>
          <path d="M13 4l3 5"></path>
        </svg>
      </span>
      <span>Reels</span>
    </a>

    <!-- PROFİL -->
    <a href="profile.html">
      <span class="nav-icon">
        <svg class="svg" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M5 20a7 7 0 0 1 14 0"></path>
        </svg>
      </span>
      <span>Profil</span>
    </a>

  </nav>

</main>

<script>
const API="/api";

let token=localStorage.getItem("minegram_token");

if(!token){
  location.href="index.html";
}else{
  fetch(API+"/me",{
    headers:{
      Authorization:"Bearer "+token
    }
  })
  .then(r=>{
    if(!r.ok) throw new Error();
    return r.json();
  })
  .catch(()=>{
    location.href="index.html";
  });
}
</script>

</body>
</html>
