.comments{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(680px,100%);
  height:min(78vh,720px);
  margin:0 auto;
  background:#171b1e;
  border-radius:28px 28px 0 0;
  z-index:10000;
  display:none;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 -6px 24px rgba(0,0,0,.45),0 -100vh 0 100vh rgba(0,0,0,.58);
}
.comments.open{display:flex}

.comments-head{
  height:88px;
  min-height:88px;
  position:relative;
  border-bottom:1px solid #25292c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:700;
  padding:0;
}
.comments-head:before{
  content:"";
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  width:74px;
  height:8px;
  border-radius:9px;
  background:#9aa0a9;
}
.comments-head b{font-size:22px;font-weight:700}
.comments-head .close-comments{
  position:absolute;
  left:20px;
  top:28px;
  width:auto;
  height:auto;
  background:none;
  border:0;
  color:#fff;
  font-size:34px;
  line-height:1;
  padding:0;
  cursor:pointer;
}

.comments-tools{
  padding:12px 22px;
  border-bottom:1px solid #25292c;
  display:block;
}
.comment-sort{
  width:100%;
  height:42px;
  border:0;
  border-radius:10px;
  background:#20252a;
  color:#f5f5f5;
  padding:0 12px;
  font-size:15px;
  font-weight:700;
  outline:none;
}

.comments-list{
  flex:1;
  overflow:auto;
  padding:0 22px 15px;
  min-height:0;
}
.comment{
  display:flex;
  gap:12px;
  padding:13px 0;
  border-bottom:0;
}
.comment-meta{
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
}
.comment-avatar{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border-radius:50%;
  background:#3f91cc;
  display:grid;
  place-items:center;
  font-weight:800;
  overflow:hidden;
}
.comment-avatar img{width:100%;height:100%;object-fit:cover}
.comment-body{flex:1;min-width:0}
.comment b{font-size:15px}
.comment p{
  margin:5px 0 0;
  color:#fff;
  font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.comment-actions{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:8px;
  color:#92979f;
  font-size:12px;
}
.comment-like{
  width:34px;
  background:none;
  border:0;
  color:#fff;
  font-size:21px;
  cursor:pointer;
  padding:0;
}
.comment-like.liked{color:#ed1b3a}

.comment-empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  text-align:center;
  padding:30px 10px;
  font-size:14px;
}

.emoji-row{
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:10px 20px 5px;
  font-size:27px;
  flex:0 0 auto;
}

.comment-compose{
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px 16px 18px;
  flex:0 0 auto;
}
.avatar.small{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border-radius:50%;
  background:#3f91cc;
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:700;
  font-size:15px;
  margin:0;
}
.compose-input{
  flex:1;
  min-width:0;
  height:58px;
  border:1px solid #3b3e42;
  border-radius:16px;
  background:#171b1e;
  color:#fff;
  padding:0 15px;
  font-size:15px;
  outline:none;
}
.compose-input::placeholder{color:#777}
.gif{
  height:52px;
  padding:0 15px;
  border:0;
  border-radius:15px;
  background:#20252a;
  color:#fff;
  font-weight:700;
}
.send{
  height:52px;
  width:52px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:27px;
  cursor:pointer;
}

 .comment-reply{
  border:0;
  background:none;
  color:#aaa;
  font-size:12px;
  cursor:pointer;
  padding:0;
}

.comment-reply:hover{
  color:#fff;
} 
@media(max-width:699px){
  .comments{width:100vw;height:82vh}
  .comments-head{height:78px;min-height:78px}
  .comments-head b{font-size:18px}
  .comments-head .close-comments{left:16px;top:24px}
  .comments-tools{padding:12px 18px}
  .comments-list{padding-left:18px;padding-right:18px}
  .comment-compose{padding-left:12px;padding-right:12px}
}

</style>

<script>
let token=localStorage.getItem('minegram_token')||localStorage.getItem('minegram_supabase_token')||'';
let me=null,reels=[],currentCommentReel=null,observer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const first=(...v)=>v.find(x=>x!==undefined&&x!==null&&String(x).trim()!=='')??'';
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2600)}
async function api(url,opt={}){if(!token){location.replace('giris.html');throw Error('Oturum gerekli')}const headers={...(opt.headers||{}),Authorization:'Bearer '+token};if(opt.body&&!(opt.body instanceof FormData)){headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(url,{...opt,headers,credentials:'same-origin'});if(r.status===401){localStorage.removeItem('minegram_token');localStorage.removeItem('minegram_supabase_token');token='';location.replace('giris.html');throw Error('Oturum süresi doldu')}const raw=await r.text();let j=null;try{j=raw?JSON.parse(raw):null}catch{}if(!r.ok)throw Error(j?.error||j?.message||'Sunucu işlemi başarısız ('+r.status+')');return j}
function getList(x){return Array.isArray(x)?x:Array.isArray(x?.posts)?x.posts:Array.isArray(x?.feed)?x.feed:Array.isArray(x?.data)?x.data:Array.isArray(x?.items)?x.items:Array.isArray(x?.results)?x.results:[]}
function usernameFromMe(){return String(first(me?.username,me?.user?.username,me?.profile?.username,localStorage.getItem('username'),localStorage.getItem('currentUser'))).trim()}
function hasVerified(p){const v=first(p?.verified,p?.isVerified,p?.premiumVerified,p?.premium_verified,p?.user?.verified,p?.author?.verified);const prem=first(p?.premium,p?.isPremium,p?.user?.premium,p?.user?.isPremium,p?.author?.premium,p?.author?.isPremium);return v===true||String(v).toLowerCase()==='true'||prem===true||String(prem).toLowerCase()==='true'}
function mediaUrl(p){const m=p?.media;if(m&&typeof m==='object')return first(p?.mediaUrl,p?.media_url,p?.videoUrl,p?.video_url,p?.mediaUri,m?.url,m?.uri,m?.src);return first(p?.mediaUrl,p?.media_url,p?.videoUrl,p?.video_url,p?.mediaUri,p?.media,p?.video)}
function isVideo(p){const m=p?.media;const t=String(first(p?.mediaType,p?.type,p?.mimeType,p?.videoType,m?.type)).toLowerCase();const u=String(mediaUrl(p)).toLowerCase().split(/[?#]/)[0];return t.includes('video')||/\.(mp4|webm|mov|m4v|3gp)$/.test(u)||!!p?.videoUrl||!!p?.video_url||!!p?.video}

   text:"🎬 @"+r.username+" Reels",postId:r.id,postUsername:r.username,postText:r.caption||"",
   postLikes:r.likes||0,postMediaUri:r.url||"",postMediaType:"video",postMediaBase64:null,postCommentCount:r.commentCount||0
  });
  modal.classList.remove("show"); toast("@"+recipient+" kullanıcısına gönderildi");
 }catch(e){toast("Gönderilemedi");}
}

window.shareReel=async function(i){
 const r=window.__minegramReels?.[i];
 if(!r){return}
 window.__minegramShareReel=r;
 modal.classList.add("show");
 listEl.innerHTML="<div class='reel-share-loading'>Kullanıcılar yükleniyor...</div>";
 await getMe();
 searchEl.value="";
 paint("");
};
document.getElementById("reelShareClose").onclick=()=>modal.classList.remove("show");
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("show")});
searchEl.addEventListener("input",e=>paint(e.target.value));
</script>
