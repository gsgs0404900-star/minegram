<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Minegram • Bildirimler</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
}

body{
    overflow-x:hidden;
}

button,
a{
    -webkit-tap-highlight-color:transparent;
}

button{
    font-family:inherit;
}

.app{
    min-height:100vh;
    background:#000;
    padding-bottom:72px;
}


/* =========================
   ÜST BAR
========================= */

.topbar{
    height:62px;
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:#000;
    border-bottom:1px solid #24242a;
}

.top-left{
    width:42px;
}

.back-btn{
    width:40px;
    height:40px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:30px;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    cursor:pointer;
}

.logo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-size:20px;
    font-weight:800;
    letter-spacing:-.5px;
}

.top-home{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    color:#fff;
    font-size:22px;
    text-decoration:none;
}


/* =========================
   BAŞLIK
========================= */

.page-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 16px 13px;
}

.page-title{
    font-size:25px;
    font-weight:800;
}

.read-all{
    border:0;
    background:transparent;
    color:#63b1ed;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.read-all:disabled{
    opacity:.5;
}


/* =========================
   BİLDİRİMLER
========================= */

.notifications{
    width:100%;
}

.notification{
    width:100%;
    min-height:72px;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:11px;
    border-bottom:1px solid #151515;
    background:#000;
    cursor:pointer;
    transition:background .15s ease;
}

.notification:active{
    background:#111;
}

.notification.unread{
    background:#070707;
}


/* =========================
   ORİJİNAL MAVİ PROFİL YERİ
========================= */

.avatar{
    width:46px;
    height:46px;
    min-width:46px;
    border-radius:50%;
    overflow:hidden;
    display:grid;
    place-items:center;
    flex-shrink:0;

    /* ORİJİNAL MAVİ */
    background:#63b1ed;

    color:#fff;
    font-size:16px;
    font-weight:700;
}

.avatar img{
    width:100%;
    height:100%;
    display:block;
    border-radius:50%;
    object-fit:cover;
    object-position:center;
}


/* =========================
   METİN
========================= */

.notification-main{
    min-width:0;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.notification-text{
    color:#fff;
    font-size:14px;
    line-height:19px;
    word-break:break-word;
}

.notification-text .username{
    font-weight:800;
}

.notification-time{
    margin-top:4px;
    color:#777;
    font-size:11px;
}


/* =========================
   SAĞ ALAN
========================= */

.notification-right{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}


/* =========================
   CANLI
========================= */

.live-notification-icon{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#ff3040;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.live-notification-icon::before{
    content:"";
    width:11px;
    height:11px;
    border-radius:50%;
    background:#fff;
}

.live-notification-icon::after{
    content:"";
    position:absolute;
    inset:-3px;
    border:2px solid rgba(255,48,64,.35);
    border-radius:50%;
}

.live-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:18px;
    padding:0 6px;
    margin-left:5px;
    border-radius:5px;
    background:#ff3040;
    color:#fff;
    font-size:9px;
    font-weight:900;
    vertical-align:middle;
}

.live-go{
    border:0;
    background:#63b1ed;
    color:#fff;
    height:32px;
    padding:0 11px;
    border-radius:8px;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    white-space:nowrap;
}

.live-go:disabled{
    opacity:.55;
}


/* =========================
   DİĞER İKONLAR
========================= */

.type-icon{
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    background:#202020;
}

.type-icon.like{
    color:#ff3040;
}

.type-icon.comment{
    color:#63b1ed;
}

.type-icon.follow{
    color:#fff;
}

.type-icon.reply{
    color:#63b1ed;
}


/* =========================
   BOŞ
========================= */

.empty{
    min-height:55vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:8px;
    padding:40px 20px;
    color:#777;
    text-align:center;
}

.empty-icon{
    font-size:38px;
    opacity:.55;
}

.empty-title{
    color:#aaa;
    font-size:16px;
    font-weight:700;
}

.empty-text{
    color:#666;
    font-size:13px;
}


/* =========================
   LOADING
========================= */

.loading{
    min-height:40vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    font-size:13px;
}

.spinner{
    width:24px;
    height:24px;
    border:2px solid #292929;
    border-top-color:#63b1ed;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin-right:9px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================
   ALT MENÜ
========================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:200;

    height:66px;

    padding:
        5px
        8px
        calc(5px + env(safe-area-inset-bottom));

    background:#19171f;
    border-top:1px solid #24242a;

    display:grid;
    grid-template-columns:repeat(5,1fr);
    align-items:center;
}

.nav-item{
    height:54px;
    color:#aaa;
    text-decoration:none;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    gap:3px;

    border-radius:12px;

    font-size:10px;
    font-weight:600;
}

.nav-item i{
    font-size:20px;
    line-height:20px;
    font-style:normal;
}

.nav-item.active{
    color:#fff;
    background:#3b3150;
}

.nav-item:active{
    opacity:.7;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:82px;

    transform:translate(-50%,20px);

    z-index:500;

    max-width:calc(100vw - 30px);

    padding:12px 16px;

    border-radius:11px;

    background:#252525;
    color:#fff;

    font-size:13px;
    font-weight:600;

    text-align:center;

    opacity:0;
    pointer-events:none;

    transition:
        opacity .2s ease,
        transform .2s ease;

    box-shadow:0 8px 25px rgba(0,0,0,.4);
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}


/* =========================
   MASAÜSTÜ
========================= */

@media(min-width:700px){

    .app{
        width:680px;
        margin:0 auto;
        border-left:1px solid #181818;
        border-right:1px solid #181818;
    }

    .bottom-nav{
        width:680px;
        left:50%;
        right:auto;
        transform:translateX(-50%);
    }
}


/* =========================
   KÜÇÜK TELEFON
========================= */

@media(max-width:380px){

    .notification{
        padding-left:10px;
        padding-right:10px;
        gap:9px;
    }

    .avatar{
        width:43px;
        height:43px;
        min-width:43px;
    }

    .notification-text{
        font-size:13px;
    }

    .live-go{
        padding:0 8px;
        font-size:10px;
    }

    .page-title{
        font-size:23px;
    }
}
</style>
</head>


<body>

<div class="app">

    <!-- ÜST BAR -->
    <header class="topbar">

        </div>

<!-- TOAST -->

<div
    id="toast"
    class="toast">

<script>

/* =========================================================
   AYARLAR
========================================================= */

const API = '/api';

const TOKEN_KEYS = [
    'minegram_token',
    'minegram_supabase_token',
    'access_token',
    'minegram_access_token'
];

let currentUser = null;
let allNotifications = [];

let toastTimer = null;


/* =========================================================
   TOKEN
========================================================= */

function getToken(){

    for(const key of TOKEN_KEYS){

        const value =
            localStorage.getItem(key);

        if(value){
            return value;
        }
    }

    return '';
}


/* =========================================================
   API
========================================================= */

async function api(path, options = {}){

    const token =
        getToken();

    const headers = {
        ...(options.headers || {})
    };

    if(!(options.body instanceof FormData)){

        headers['Content-Type'] =
            'application/json';

    }

    if(token){

        headers.Authorization =
            'Bearer ' + token;

    }


    const response =
        await fetch(
            API + path,
            {
                ...options,
                headers
            }
        );


    const text =
        await response.text();

    let data = null;


    try{

        data =
            text
            ? JSON.parse(text)
            : null;

    }
    catch{

        data = text;

    }


    if(!response.ok){

        const message =
            data?.detail ||
            data?.message ||
            data?.error ||
            'İstek başarısız oldu.';

        throw new Error(message);
    }


    return data;
}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

    clearTimeout(toastTimer);

    const el =
        document.getElementById('toast');

    el.textContent =
        message;

    el.classList.add('show');


    toastTimer =
        setTimeout(
            () => {

                el.classList.remove('show');

            },
            2800
        );
}


/* =========================================================
   ESC
========================================================= */

function esc(value){

    return String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');

}


/* =========================================================
   GERİ
========================================================= */

function goBack(){

    if(
        window.history.length > 1
    ){

        history.back();

    }
    else{

        location.href =
            'index.html';

    }
}


/* =========================================================
   KULLANICI ADI
========================================================= */

function notificationUsername(n){

    return (

        n.username ||

        n.actor?.username ||

        n.fromUser?.username ||
        n.from_user?.username ||

        n.user?.username ||

        n.sender?.username ||

        n.requester?.username ||

        n.requesterUsername ||

        n.actor_username ||

        n.from_username ||

        n.user_username ||

        n.sender_username ||

        n.live_username ||

        n.liveUsername ||

        n.hostUsername ||

        n.host_username ||

        n.broadcaster ||

        n.broadcasterUsername ||

        n.broadcaster_username ||

        n.live?.username ||

        n.live?.user?.username ||

        n.data?.live_username ||

        n.data?.liveUsername ||

        n.data?.live?.username ||

        n.data?.username ||

        n.handle ||

        'Minegram'

    );

}


/* =========================================================
   PROFİL RESMİ
========================================================= */

function notificationAvatar(n){

    const candidates = [

        n.avatar,
        n.avatarUrl,
        n.avatar_url,

        n.profileImage,
        n.profile_image,
        n.profileImageUrl,
        n.profile_image_url,

        n.profilePhoto,
        n.profile_photo,

        n.photo,
        n.photoUrl,
        n.photo_url,

        n.image,
        n.imageUrl,
        n.image_url,


        n.actor?.avatar,
        n.actor?.avatarUrl,
        n.actor?.avatar_url,

        n.actor?.profileImage,
        n.actor?.profile_image,


        n.fromUser?.avatar,
        n.fromUser?.avatarUrl,
        n.fromUser?.avatar_url,

        n.fromUser?.profileImage,
        n.fromUser?.profile_image,


        n.from_user?.avatar,
        n.from_user?.avatarUrl,
        n.from_user?.avatar_url,

        n.from_user?.profileImage,
        n.from_user?.profile_image,


        n.user?.avatar,
        n.user?.avatarUrl,
        n.user?.avatar_url,

        n.user?.profileImage,
        n.user?.profile_image,


        n.sender?.avatar,
        n.sender?.avatarUrl,
        n.sender?.avatar_url,

        n.sender?.profileImage,
        n.sender?.profile_image,


        n.requester?.avatar,
        n.requester?.avatarUrl,
        n.requester?.avatar_url,

        n.requester?.profileImage,
        n.requester?.profile_image,


        n.live?.avatar,
        n.live?.avatarUrl,
        n.live?.avatar_url,

        n.live?.profileImage,
        n.live?.profile_image,


        n.live?.user?.avatar,
        n.live?.user?.avatarUrl,
        n.live?.user?.avatar_url,

        n.live?.user?.profileImage,
        n.live?.user?.profile_image,


        n.data?.avatar,
        n.data?.avatarUrl,
        n.data?.avatar_url,

        n.data?.profileImage,
        n.data?.profile_image,


        n.data?.user?.avatar,
        n.data?.user?.avatarUrl,
        n.data?.user?.avatar_url,

        n.data?.user?.profileImage,
        n.data?.user?.profile_image

    ];


    for(const item of candidates){

        if(
            typeof item === 'string' &&
            item.trim()
        ){

            return item.trim();

        }

    }


    return '';

}


/* =========================================================
   AVATAR
========================================================= */

function avatarHTML(n){

    const username =
        notificationUsername(n);

    const initial =
        String(username || 'M')
            .trim()
            .charAt(0)
            .toUpperCase() || 'M';


    const avatar =
        notificationAvatar(n);


    /*
      PROFİL RESMİ VARSA
    */

    if(avatar){

        const safe =
            esc(avatar);

        return `

            <div class="avatar">

                <img
                    src="${safe}"
                    alt=""
                    loading="lazy"
                    onerror="
                        this.remove();
                        this.parentElement.textContent='${esc(initial)}';
                    "
                >

            </div>

        `;
    }


    /*
      PROFİL RESMİ YOKSA
      ORİJİNAL MAVİ DAİRE
    */

    return `

        <div class="avatar">
            ${esc(initial)}
        </div>

    `;

}


/* =========================================================
   BİLDİRİM TİPİ
========================================================= */

function notificationType(n){

    const type =
        String(

            n.type ||
            n.notification_type ||
            n.notificationType ||
            n.kind ||
            n.event ||
            n.action ||
            ''

        )
        .toLowerCase()
        .trim();


    /* =========================
       CANLI
    ========================= */

    if(

        type === 'live' ||

        type === 'live_start' ||
        type === 'live-start' ||

        type === 'live_started' ||
        type === 'live-started' ||

        type === 'live_notification' ||

        type === 'live_started_notification' ||

        type === 'live_start_notification' ||

        type === 'started_live' ||

        type === 'started_live_stream' ||

        type === 'live_stream_started' ||

        type === 'live-stream-started' ||

        type === 'canli' ||
        type === 'canlı' ||

        type === 'canli_yayin' ||
        type === 'canlı_yayın' ||

        type === 'canli-yayin' ||
        type === 'canlı-yayın' ||

        type.includes('live_start') ||
        type.includes('live-start') ||

        type.includes('live_started') ||
        type.includes('live-started') ||

        type.includes('canli_yayin') ||
        type.includes('canlı_yayın') ||

        type.includes('canli-yayin') ||
        type.includes('canlı-yayın')

    ){

        return 'live';

    }


    /* =========================
       YORUM BEĞENİSİ
    ========================= */

    if(

        type === 'comment_like' ||
        type === 'comment-like' ||

        type === 'comment_liked' ||
        type === 'comment-liked' ||

        type === 'commentlike' ||

        type.includes('comment_like') ||
        type.includes('comment-like') ||

        type.includes('comment_liked') ||
        type.includes('comment-liked')

    ){

        return 'comment_like';

    }


    /* =========================
       BEĞENİ
    ========================= */

    if(

        type === 'like' ||

        type === 'liked' ||

        type === 'post_like' ||
        type === 'post-like' ||

        type === 'post_liked' ||
        type === 'post-liked' ||

        type.includes('post_like') ||
        type.includes('post-like') ||

        type.includes('liked')

    ){

        return 'like';

    }


    /* =========================
       YORUM
    ========================= */

    if(

        type === 'comment' ||

        type === 'commented' ||

        type === 'new_comment' ||

        type === 'new-comment' ||

        type.includes('commented')

    ){

        return 'comment';

    }


    /* =========================
       TAKİP İSTEĞİ
    ========================= */

    if(

        type === 'follow_request' ||
        type === 'follow-request' ||

        type === 'followrequest' ||

        type === 'follow_requested' ||
        type === 'follow-requested' ||

        type.includes('follow_request') ||
        type.includes('follow-request')

    ){

        return 'follow_request';

    }


    /* =========================
       TAKİP KABUL
    ========================= */

    if(

        type === 'follow_accepted' ||
        type === 'follow-accepted' ||

        type === 'followaccepted' ||

        type === 'follow_accept' ||
        type === 'follow-accept' ||

        type.includes('follow_accepted') ||
        type.includes('follow-accepted') ||

        type.includes('follow_accept')

    ){

        return 'follow_accepted';

    }


    /* =========================
       TAKİP RED
    ========================= */

    if(

        type === 'follow_rejected' ||
        type === 'follow-rejected' ||

        type === 'follow_declined' ||
        type === 'follow-declined' ||

        type === 'follow_denied' ||
        type === 'follow-denied' ||

        type === 'follow_reject' ||
        type === 'follow-reject' ||

        type.includes('follow_rejected') ||
        type.includes('follow-rejected') ||

        type.includes('follow_declined') ||
        type.includes('follow-declined') ||

        type.includes('follow_denied') ||
        type.includes('follow-denied')

    ){

        return 'follow_rejected';

    }


    /* =========================
       TAKİP
    ========================= */

    if(

        type === 'follow' ||

        type === 'followed' ||

        type === 'new_follow' ||

        type === 'new-follow' ||

        type.includes('followed')

    ){

        return 'follow';

    }


    /* =========================
       CEVAP
    ========================= */

    if(

        type === 'reply' ||

        type === 'replied' ||

        type === 'comment_reply' ||

        type === 'comment-reply' ||

        type.includes('replied')

    ){

        return 'reply';

    }


    return type || 'default';

}


/* =========================================================
   CANLI ID
========================================================= */

function notificationLiveId(n){

    return String(

        n.liveId ||
        n.live_id ||
        n.liveID ||

        n.broadcastId ||
        n.broadcast_id ||

        n.broadcastID ||

        n.streamId ||
        n.stream_id ||

        n.streamID ||

        n.live?.id ||
        n.live?.liveId ||
        n.live?.live_id ||

        n.live?.broadcastId ||
        n.live?.broadcast_id ||

        n.live?.streamId ||
        n.live?.stream_id ||

        n.data?.liveId ||
        n.data?.live_id ||

        n.data?.broadcastId ||
        n.data?.broadcast_id ||

        n.data?.streamId ||
        n.data?.stream_id ||

        n.data?.live?.id ||

        ''

    );

}


/* =========================================================
   POST ID
========================================================= */

function notificationPostId(n){

    return String(

        n.postId ||
        n.post_id ||

        n.postID ||

        n.post?.id ||

        n.data?.postId ||
        n.data?.post_id ||

        n.data?.post?.id ||

        n.content?.postId ||
        n.content?.post_id ||

        ''

    );

}


/* =========================================================
   COMMENT ID
========================================================= */

function notificationCommentId(n){

    return String(

        n.commentId ||
        n.comment_id ||

        n.commentID ||

        n.comment?.id ||

        n.data?.commentId ||
        n.data?.comment_id ||

        n.data?.comment?.id ||

        ''

    );

}


/* =========================================================
   MESAJ
========================================================= */

function notificationMessage(n){

    const type =
        notificationType(n);

    const username =
        notificationUsername(n);


    /* CANLI */

    if(type === 'live'){

        const custom =
            String(
                n.message ||
                n.text ||
                n.description ||
                ''
            ).trim();


        if(
            custom &&
            (
                custom.toLowerCase().includes('canlı') ||
                custom.toLowerCase().includes('canli') ||
                custom.toLowerCase().includes('live')
            )
        ){

            return `

                <span class="username">
                    @${esc(username)}
                </span>

                ${esc(custom)}

                <span class="live-badge">
                    CANLI
                </span>

            `;

        }


        return `

            <span class="username">
                @${esc(username)}
            </span>

            canlı yayına başladı.

            <span class="live-badge">
                CANLI
            </span>

        `;

    }


    /* BEĞENİ */

    if(type === 'like'){

        return `

            <span class="username">
                @${esc(username)}
            </span>

            gönderini beğendi.

        `;

    }


    /* YORUM BEĞENİSİ */

    if(type === 'comment_like'){

        return `

            <span class="username">
                @${esc(username)}
            </span>

            yorumunu beğendi.

        `;

    }


    /* YORUM */

    if(type === 'comment'){

        return `

            <span class="username">
                @${esc(username)}
            </span>

            gönderine yorum yaptı.

        `;

    }


    /* TAKİP İSTEĞİ */

    if(type === 'follow_request'){

        return `

            <span class="username">
                @${esc(username)}
            </span>

            seni takip etmek istiyor.

        `;

    }


    /* TAKİP KABUL */

    if(type === 'follow_accepted'){

        return `

            <span class="username">
                @${esc(username)}
            </span>

            takip isteğini kabul etti.

        `;

    }


    /* TAKİP RED */

    if(type === 'follow_rejected'){

        return `

            <span class="username">
                @${esc(username)}
            </span>

            takip isteğini reddetti.

        `;

    }


    /* TAKİP */

    if(type === 'follow'){

        return `

            <span class="username">
                @${esc(username)}
            </span>

            seni takip etmeye başladı.

        `;

    }


    /* CEVAP */

    if(type === 'reply'){

        return `

            <span class="username">
                @${esc(username)}
            </span>

            yorumuna cevap verdi.

        `;

    }


    /* BACKEND MESAJI */

    const custom =
        n.message ||
        n.text ||
        n.description ||
        'Yeni bildirimin var.';


    return esc(custom);

}


/* =========================================================
   TARİH
========================================================= */

function notificationDate(n){

    const raw =

        n.createdAt ||
        n.created_at ||

        n.date ||

        n.timestamp ||

        n.time;


    if(!raw){
        return '';
    }


    const date =
        new Date(raw);


    if(Number.isNaN(date.getTime())){
        return '';
    }


    const diff =
        Date.now() - date.getTime();


    const seconds =
        Math.floor(diff / 1000);

    const minutes =
        Math.floor(seconds / 60);

    const hours =
        Math.floor(minutes / 60);

    const days =
        Math.floor(hours / 24);


    if(seconds < 30){
        return 'şimdi';
    }

    if(minutes < 60){
        return minutes + ' dk';
    }

    if(hours < 24){
        return hours + ' sa';
    }

    if(days < 7){
        return days + ' gün';
    }


    return date.toLocaleDateString(
        'tr-TR',
        {
            day:'2-digit',
            month:'2-digit',
            year:'numeric'
        }
    );

}


/* =========================================================
   İKON
========================================================= */

function notificationIcon(n){

    const type =
        notificationType(n);


    if(type === 'live'){

        return `

            <div class="live-notification-icon"></div>

        `;

    }


    if(
        type === 'like' ||
        type === 'comment_like'
    ){

        return `

            <div class="type-icon like">
                ♥
            </div>

        `;

    }


    if(
        type === 'comment' ||
        type === 'reply'
    ){

        return `

            <div class="type-icon comment">
                ●
            </div>

        `;

    }


    if(
        type === 'follow' ||
        type === 'follow_request' ||
        type === 'follow_accepted' ||
        type === 'follow_rejected'
    ){

        return `

            <div class="type-icon follow">
                ♡
            </div>

        `;

    }


    return `

        <div class="type-icon">
            •
        </div>

    `;

}


/* =========================================================
   ARRAY NORMALİZE
========================================================= */

function normalizeNotifications(data){

    if(Array.isArray(data)){
        return data;
    }

    if(Array.isArray(data?.notifications)){
        return data.notifications;
    }

    if(Array.isArray(data?.result)){
        return data.result;
    }

    if(Array.isArray(data?.data)){
        return data.data;
    }

    if(Array.isArray(data?.items)){
        return data.items;
    }

    if(Array.isArray(data?.results)){
        return data.results;
    }

    return [];

}


/* =========================================================
   CANLI ARRAY
========================================================= */

function normalizeLives(data){

    if(Array.isArray(data)){
        return data;
    }

    if(Array.isArray(data?.live)){
        return data.live;
    }

    if(Array.isArray(data?.lives)){
        return data.lives;
    }

    if(Array.isArray(data?.result)){
        return data.result;
    }

    if(Array.isArray(data?.result?.live)){
        return data.result.live;
    }

    if(Array.isArray(data?.result?.lives)){
        return data.result.lives;
    }

    if(Array.isArray(data?.result?.data)){
        return data.result.data;
    }

    if(Array.isArray(data?.result?.items)){
        return data.result.items;
    }

    if(Array.isArray(data?.data)){
        return data.data;
    }

    if(Array.isArray(data?.items)){
        return data.items;
    }


    if(
        data &&
        typeof data === 'object' &&
        (
            data.id ||
            data.liveId ||
            data.live_id ||
            data.broadcastId ||
            data.broadcast_id
        )
    ){

        return [data];

    }


    return [];

}


/* =========================================================
   CANLI AKTİF KONTROL
========================================================= */

function liveIsActive(live){

    if(!live){
        return false;
    }


    const status =
        String(

            live.status ||
            live.state ||

            live.liveStatus ||
            live.live_status ||

            live.broadcastStatus ||
            live.broadcast_status ||

            ''

        )
        .toLowerCase()
        .trim();


    /* KESİN KAPALI DURUMLAR */

    if(

        status === 'ended' ||
        status === 'offline' ||
        status === 'closed' ||
        status === 'finished' ||
        status === 'completed' ||
        status === 'stopped' ||
        status === 'cancelled' ||
        status === 'canceled'

    ){

        return false;

    }


    /* AÇIK FALSE DEĞERLER */

    const explicitFlags = [

        live.active,
        live.isActive,
        live.is_active,

        live.online,
        live.isOnline,
        live.is_online,

        live.isLive,
        live.is_live,

        live.broadcasting,
        live.isBroadcasting,
        live.is_broadcasting

    ];


    if(
        explicitFlags.some(
            value => value === false
        )
    ){

        return false;

    }


    /* AÇIK TRUE DEĞER */

    if(
        explicitFlags.some(
            value => value === true
        )
    ){

        return true;

    }


    /* DURUM */

    if(

        status === 'live' ||
        status === 'active' ||
        status === 'online' ||
        status === 'started' ||
        status === 'streaming' ||
        status === 'broadcasting'

    ){

        return true;

    }


    /*
      API gerçekten bir canlı kaydı döndürdüyse,
      kapalı olduğuna dair bilgi yoksa aktif kabul edilir.
    */

    return true;

}


/* =========================================================
   CANLI ID
========================================================= */

function getLiveId(live){

    return String(

        live?.id ||

        live?.liveId ||
        live?.live_id ||

        live?.broadcastId ||
        live?.broadcast_id ||

        live?.streamId ||
        live?.stream_id ||

        live?.data?.id ||

        ''

    );

}


/* =========================================================
   CANLI KULLANICI ADI
========================================================= */

function getLiveUsername(live){

    return String(

        live?.username ||

        live?.user?.username ||

        live?.hostUsername ||
        live?.host_username ||

        live?.broadcasterUsername ||
        live?.broadcaster_username ||

        live?.broadcaster ||

        ''

    )
    .toLowerCase()
    .replace('@','')
    .trim();

}


/* =========================================================
   CANLI BİLDİRİMİ AÇ
========================================================= */

async function openLiveNotification(
    event,
    username,
    notificationLiveIdValue
){

    if(event){

        event.stopPropagation();

    }


    const button =
        event?.currentTarget;


    if(button){

        button.disabled = true;
        button.textContent = 'Kontrol...';

    }


    try{

        /*
          Canlıları backend'den tekrar kontrol ediyoruz.
        */

        const result =
            await api(
                '/live?ts=' +
                Date.now(),
                {
                    method:'GET'
                }
            );


        const lives =
            normalizeLives(result);


        const activeLives =
            lives.filter(
                live =>
                    liveIsActive(live)
            );


        const targetId =
            String(
                notificationLiveIdValue || ''
            ).trim();


        const targetUsername =
            String(
                username || ''
            )
            .toLowerCase()
            .replace('@','')
            .trim();


        let found = null;


        /*
          1 — CANLI ID
        */

        if(targetId){

            found =
                activeLives.find(
                    live =>
                        getLiveId(live) === targetId
                ) || null;

        }


        /*
          2 — KULLANICI ADI
        */

        if(!found && targetUsername){

            found =
                activeLives.find(
                    live =>
                        getLiveUsername(live) ===
                        targetUsername
                ) || null;

        }


        /*
          CANLI YOK
        */

        if(!found){

            toast(
                'Şu an bir canlı yayın yok.'
            );

            return;

        }


        const activeLiveId =
            getLiveId(found);


        /*
          ID YOKSA YİNE GÖNDERME
        */

        if(!activeLiveId){

            /*
              Bazı backendlerde ID yerine
              kullanıcı adı kullanılabilir.
            */

            if(targetUsername){

                window.location.href =
                    'reels.html?live=' +
                    encodeURIComponent(
                        targetUsername
                    );

                return;

            }


            toast(
                'Şu an bir canlı yayın yok.'
            );

            return;

        }


        /*
          AKTİF CANLI VAR
          → DOĞRUDAN CANLIYA GİT
        */

        window.location.href =
            'reels.html?live=' +
            encodeURIComponent(
                activeLiveId
            );

    }
    catch(error){

        console.error(
            'Canlı kontrol hatası:',
            error
        );


        /*
          API kontrol edilemiyorsa
          yanlışlıkla Reels'e göndermiyoruz.
        */

        toast(
            'Şu an bir canlı yayın yok.'
        );

    }
    finally{

        if(button){

            button.disabled = false;
            button.textContent = 'Canlıya Git';

        }

    }

}


/* =========================================================
   BİLDİRİM AÇ
========================================================= */

function openNotification(element){

    const type =
        element.dataset.type || '';

    const username =
        element.dataset.username || '';

    const postId =
        element.dataset.postId || '';

    const liveId =
        element.dataset.liveId || '';


    /*
      CANLI
    */

    if(type === 'live'){

        openLiveNotification(
            null,
            username,
            liveId
        );

        return;

    }


    /*
      GÖNDERİ
    */

    if(postId){

        window.location.href =
            'post.html?id=' +
            encodeURIComponent(postId);

        return;

    }


    /*
      PROFİL
    */

    if(username){

        window.location.href =
            'profile.html?username=' +
            encodeURIComponent(username);

        return;

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderNotification(n){

    const type =
        notificationType(n);

    const username =
        notificationUsername(n);

    const postId =
        notificationPostId(n);

    const liveId =
        notificationLiveId(n);

    const commentId =
        notificationCommentId(n);

    const message =
        notificationMessage(n);

    const time =
        notificationDate(n);


    const unread =

        n.read === false ||

        n.isRead === false ||

        n.is_read === false ||

        n.unread === true;


    const id =

        n.id ??

        n.notificationId ??

        n.notification_id ??

        '';


    let rightContent;


    if(type === 'live'){

        rightContent = `

            <button
                class="live-go"
                type="button"
                data-live-button="1">

                Canlıya Git

            </button>

        `;

    }
    else{

        rightContent =
            notificationIcon(n);

    }


    return `

        <article

            class="notification ${
                unread ? 'unread' : ''
            }"

            data-id="${esc(id)}"

            data-notification-id="${
                esc(
                    n.notificationId ??
                    n.notification_id ??
                    id
                )
            }"

            data-username="${esc(username)}"

            data-post-id="${esc(postId)}"

            data-live-id="${esc(liveId)}"

            data-comment-id="${esc(commentId)}"

            data-type="${esc(type)}"

        >

            ${avatarHTML(n)}


            <div class="notification-main">

                <div class="notification-text">

                    ${message}

                </div>


                ${
                    time
                    ?
                    `
                        <div class="notification-time">
                            ${esc(time)}
                        </div>
                    `
                    :
                    ''
                }

            </div>


            <div class="notification-right">

                ${rightContent}

            </div>

        </article>

    `;

}


/* =========================================================
   BİLDİRİMLERİ GÖSTER
========================================================= */

function renderNotifications(){

    if(!allNotifications.length){

        document
            .getElementById('notifications')
            .innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        ♡
                    </div>

                    <div class="empty-title">
                        Henüz bildirimin yok
                    </div>

                    <div class="empty-text">
                        Yeni etkileşimler burada görünecek.
                    </div>

                </div>

            `;

        return;

    }


    const container =
        document.getElementById(
            'notifications'
        );


    container.innerHTML =
        allNotifications
            .map(renderNotification)
            .join('');


    /*
      Tıklama olayları
    */

    container
        .querySelectorAll('.notification')
        .forEach(element => {


            element.addEventListener(
                'click',
                async function(){

                    /*
                      Canlı butonu ayrı çalışacak.
                    */

                    if(
                        event &&
                        event.target &&
                        event.target.closest(
                            '[data-live-button="1"]'
                        )
                    ){

                        return;

                    }


                    /*
                      Okundu yap
                    */

                    const id =
                        element.dataset.id ||
                        element.dataset.notificationId;


                    await markOneRead(id);


                    /*
                      Yönlendir
                    */

                    openNotification(
                        element
                    );

                }
            );


            /*
              Canlı butonu
            */

            const liveButton =
                element.querySelector(
                    '[data-live-button="1"]'
                );


            if(liveButton){

                liveButton.addEventListener(
                    'click',
                    async function(event){

                        event.stopPropagation();


                        const id =
                            element.dataset.liveId || '';


                        const username =
                            element.dataset.username || '';


                        await markOneRead(
                            element.dataset.id ||
                            element.dataset.notificationId
                        );


                        await openLiveNotification(
                            event,
                            username,
                            id
                        );

                    }
                );

            }

        });

}


/* =========================================================
   BİLDİRİMLERİ YÜKLE
========================================================= */

async function loadNotifications(){

    const container =
        document.getElementById(
            'notifications'
        );


    try{

        let result;


        try{

            result =
                await api(
                    '/notifications'
                );

        }
        catch{

            try{

                result =
                    await api(
                        '/notifications/list'
                    );

            }
            catch{

                result =
                    await api(
                        '/notification'
                    );

            }

        }


        allNotifications =
            normalizeNotifications(
                result
            );


        /*
          Yeniden eskiye
        */

        allNotifications.sort(
            (a,b) => {

                const da =
                    new Date(
                        a.createdAt ||
                        a.created_at ||
                        a.timestamp ||
                        0
                    ).getTime();


                const db =
                    new Date(
                        b.createdAt ||
                        b.created_at ||
                        b.timestamp ||
                        0
                    ).getTime();


                return db - da;

            }
        );


        renderNotifications();

    }
    catch(error){

        console.error(
            'Bildirim yükleme hatası:',
            error
        );


        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    !
                </div>

                <div class="empty-title">
                    Bildirimler yüklenemedi
                </div>

                <div class="empty-text">
                    Sayfayı yenileyip tekrar dene.
                </div>

            </div>

        `;

    }

}


/* =========================================================
   TEK BİLDİRİM OKUNDU
========================================================= */

async function markOneRead(id){

    if(!id){
        return;
    }


    try{

        try{

            await api(
                '/notifications/' +
                encodeURIComponent(id) +
                '/read',
                {
                    method:'POST'
                }
            );

        }
        catch{

            try{

                await api(
                    '/notifications/' +
                    encodeURIComponent(id),
                    {
                        method:'PATCH',
                        body:JSON.stringify({
                            read:true
                        })
                    }
                );

            }
            catch{

                /*
                  Backend endpoint'i farklıysa
                  yerel durum yine güncellenir.
                */

            }

        }


        const item =
            allNotifications.find(
                n =>
                    String(
                        n.id ??
                        n.notificationId ??
                        n.notification_id ??
                        ''
                    ) === String(id)
            );


        if(item){

            item.read = true;
            item.isRead = true;
            item.is_read = true;
            item.unread = false;

        }


        const element =
            document.querySelector(
                `[data-id="${CSS.escape(String(id))}"]`
            );


        if(element){

            element.classList.remove(
                'unread'
            );

        }

    }
    catch(error){

        console.log(
            'Okundu işaretleme:',
            error
        );

    }

}


/* =========================================================
   TÜMÜNÜ OKUNDU
========================================================= */

async function markAllRead(){

    const button =
        document.getElementById(
            'readAllBtn'
        );


    button.disabled = true;
    button.textContent =
        'İşleniyor...';


    try{

        let success = false;


        try{

            await api(
                '/notifications/read-all',
                {
                    method:'POST'
                }
            );

            success = true;

        }
        catch{}


        if(!success){

            try{

                await api(
                    '/notifications/mark-all-read',
                    {
                        method:'POST'
                    }
                );

                success = true;

            }
            catch{}

        }


        if(!success){

            try{

                await api(
                    '/notifications/read',
                    {
                        method:'POST',
                        body:JSON.stringify({
                            all:true
                        })
                    }
                );

                success = true;

            }
            catch{}

        }


        /*
          Yerel durum
        */

        allNotifications =
            allNotifications.map(
                n => ({

                    ...n,

                    read:true,
                    isRead:true,
                    is_read:true,
                    unread:false

                })
            );


        renderNotifications();


        toast(
            'Tüm bildirimler okundu.'
        );

    }
    catch(error){

        console.error(
            'Tümünü okundu hatası:',
            error
        );


        toast(
            'Bildirimler güncellenemedi.'
        );

    }
    finally{

        button.disabled = false;

        button.textContent =
            'Tümünü okundu yap';

    }

}


/* =========================================================
   ME
========================================================= */

async function loadMe(){

    try{

        const me =
            await api('/me');


        currentUser =
            me?.user ||
            me ||
            null;


        if(currentUser){

            try{

                localStorage.setItem(
                    'minegram_user',
                    JSON.stringify(
                        currentUser
                    )
                );

            }
            catch{}

        }

    }
    catch(error){

        console.log(
            'Me alınamadı:',
            error
        );


        try{

            const stored =
                localStorage.getItem(
                    'minegram_user'
                );


            if(stored){

                currentUser =
                    JSON.parse(stored);

            }

        }
        catch{}

    }

}


/* =========================================================
   BAŞLAT
========================================================= */

async function init(){

    await loadMe();

    await loadNotifications();

}


/* =========================================================
   TÜMÜ OKUNDU BUTONU
========================================================= */

document
    .getElementById('readAllBtn')
    .addEventListener(
        'click',
        markAllRead
    );


/* =========================================================
   DOM
========================================================= */

if(
    document.readyState ===
    'loading'
){

    document.addEventListener(
        'DOMContentLoaded',
        init
    );

}
else{

    init();

}


/* =========================================================
   SAYFA GERİ GELDİĞİNDE
========================================================= */

window.addEventListener(
    'pageshow',
    function(event){

        if(event.persisted){

            loadNotifications();

        }

    }
);


/* =========================================================
   30 SANİYEDE BİR YENİLE
========================================================= */

setInterval(
    function(){

        if(
            document.visibilityState ===
            'visible'
        ){

            loadNotifications();

        }

    },
    30000
);

</script>
