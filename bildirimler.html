<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Minegram - Bildirimler</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    min-height:100%;
    background:#000;
    color:#f5f5f5;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
    padding-bottom:76px;
}

button,
a{
    -webkit-tap-highlight-color:transparent;
}

.app{
    min-height:100vh;
    background:#000;
}

/* =========================
   ÜST BAR
========================= */

.topbar{
    height:70px;
    border-bottom:1px solid #202020;
    display:flex;
    align-items:center;
    padding:0 22px;
    position:sticky;
    top:0;
    background:#000;
    z-index:50;
}

.back-btn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:#eee;
    display:grid;
    place-items:center;
    cursor:pointer;
    padding:0;
}

.back-btn svg{
    width:25px;
    height:25px;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.logo{
    font-size:22px;
    font-weight:700;
    margin-left:8px;
}

.top-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:4px;
}

.icon-btn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:#eee;
    display:grid;
    place-items:center;
    cursor:pointer;
}

.svg{
    width:23px;
    height:23px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =========================
   ANA ALAN
========================= */

.notifications{
    width:min(680px,100%);
    margin:0 auto;
}

.notifications-head{
    min-height:64px;
    display:flex;
    align-items:center;
    padding:0 18px;
    border-bottom:1px solid #202020;
}

.notifications-title{
    font-size:19px;
    font-weight:700;
}

.mark-all{
    margin-left:auto;
    border:0;
    background:transparent;
    color:#63b1ed;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

/* =========================
   BİLDİRİM
========================= */

.notification-list{
    width:100%;
}

.notification{
    width:100%;
    min-height:78px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid #171717;
    cursor:pointer;
    transition:background .15s;
}

.notification:hover{
    background:#090909;
}

.notification.unread{
    background:#0d1115;
}

.notification.unread:hover{
    background:#11161b;
}

/* =========================
   ORİJİNAL YUVARLAK AVATAR
========================= */

.avatar{
    width:48px;
    height:48px;
    min-width:48px;
    border-radius:50%;
    background:#63b1ed;
    display:grid;
    place-items:center;
    color:#fff;
    font-size:18px;
    font-weight:500;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
}

/* =========================
   İÇERİK
========================= */

.notification-content{
    min-width:0;
    flex:1;
}

.notification-text{
    font-size:14px;
    line-height:20px;
    color:#ddd;
    overflow-wrap:anywhere;
}

.notification-text b{
    color:#fff;
    font-weight:700;
}

.notification-time{
    margin-top:4px;
    color:#777d84;
    font-size:12px;
}

.notification-icon{
    width:38px;
    height:38px;
    min-width:38px;
    display:grid;
    place-items:center;
    font-size:21px;
}

.notification-thumb{
    width:48px;
    height:48px;
    min-width:48px;
    border-radius:4px;
    background:#222;
    overflow:hidden;
}

.notification-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* =========================
   TAKİP
========================= */

.follow-btn{
    min-width:82px;
    height:34px;
    padding:0 12px;
    border:1px solid #63b1ed;
    border-radius:8px;
    background:#63b1ed;
    color:#fff;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.follow-btn.following{
    background:#222;
    border-color:#3a3a3a;
    color:#eee;
}

.follow-actions{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
}

.follow-actions .follow-btn{
    min-width:72px;
}

.follow-btn.request-reject{
    background:#222;
    border-color:#3a3a3a;
    color:#eee;
}

/* =========================
   YORUM
========================= */

.comment-preview{
    margin-top:6px;
    color:#a9a9a9;
    font-size:12px;
    line-height:17px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.comment-like-btn{
    min-width:38px;
    height:32px;
    padding:0 9px;
    border:1px solid #333;
    border-radius:16px;
    background:#111;
    color:#aaa;
    font-size:17px;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
}

.comment-like-btn.liked{
    color:#ff3b5c;
    border-color:#5b2631;
    background:#211014;
}

.notification-actions{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
}

.unread-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#63b1ed;
    min-width:8px;
}

/* =========================
   CANLI BİLDİRİM
========================= */

.live-notification .notification-icon{
    color:#ff304f;
}

.live-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    margin-left:6px;
    padding:3px 6px;
    border-radius:5px;
    background:#ff304f;
    color:#fff;
    font-size:9px;
    font-weight:800;
    vertical-align:middle;
}

.live-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#fff;
}

/* =========================
   BOŞ
========================= */

.empty{
    padding:110px 20px;
    text-align:center;
    color:#777;
}

.empty-icon{
    width:70px;
    height:70px;
    margin:0 auto 18px;
    border:1px solid #303030;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:30px;
}

.empty strong{
    display:block;
    color:#eee;
    font-size:16px;
    margin-bottom:7px;
}

.empty span{
    font-size:13px;
}

.loading{
    padding:70px 20px;
    text-align:center;
    color:#888;
    font-size:14px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:92px;
    transform:translateX(-50%);
    background:#25232a;
    color:#fff;
    padding:10px 16px;
    border-radius:20px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:300;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
}

/* =====================================================
   ALT BAR — SENİN VERDİĞİN HALİ
===================================================== */

.nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:76px;
    background:#121018;
    border-top:1px solid #201d27;
    display:flex;
    z-index:100;
    padding:5px 8px env(safe-area-inset-bottom);
}

.nav a{
    flex:1;
    color:#ddd;
    text-decoration:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-size:9px;
}

.nav-icon{
    width:45px;
    height:32px;
    border-radius:18px;
    display:grid;
    place-items:center;
}

.nav a.active .nav-icon{
    background:#3b3150;
}

.nav .svg{
    width:21px;
    height:21px;
}

/* =========================
   MOBİL
========================= */

@media(max-width:699px){

    .topbar{
        height:62px;
        padding:0 10px;
    }

    .logo{
        font-size:20px;
    }

    .notifications-head{
        min-height:58px;
        padding:0 14px;
    }

    .notification{
        min-height:74px;
        padding:11px 12px;
        gap:10px;
    }

    .avatar{
        width:44px;
        height:44px;
        min-width:44px;
        font-size:16px;
    }

    .notification-text{
        font-size:13px;
        line-height:19px;
    }

    .notification-time{
        font-size:11px;
    }

    .notification-thumb{
        width:44px;
        height:44px;
        min-width:44px;
    }

    .notification-icon{
        width:32px;
        min-width:32px;
        font-size:19px;
    }

    .follow-btn{
        min-width:72px;
        height:32px;
        font-size:11px;
        padding:0 9px;
    }

    .follow-actions{
        gap:5px;
    }

    .follow-actions .follow-btn{
        min-width:60px;
        padding:0 7px;
    }

    .mark-all{
        font-size:12px;
    }
}

/* =========================
   MASAÜSTÜ
========================= */

@media(min-width:700px){

    .nav{
        padding-left:calc((100% - 760px)/2);
        padding-right:calc((100% - 760px)/2);
    }
}

.hidden{
    display:none!important;
}
</style>
</head>

<script>

/* =====================================================
   MINEGRAM BİLDİRİMLER
===================================================== */

const API = '/api';

let token =
    localStorage.getItem('minegram_token') ||
    localStorage.getItem('minegram_supabase_token') ||
    localStorage.getItem('access_token') ||
    localStorage.getItem('minegram_access_token') ||
    null;

let currentUser = null;
let notificationCache = [];

/* =====================================================
   ESCAPE
===================================================== */

function esc(s=''){
    return String(s).replace(/[&<>"']/g,m=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
    }[m]));
}

/* =====================================================
   TOAST
===================================================== */

function toast(text){

    const el=document.getElementById('toast');

    el.textContent=text;
    el.classList.add('show');

    clearTimeout(window.__toast);

    window.__toast=setTimeout(()=>{
        el.classList.remove('show');
    },2200);
}

/* =====================================================
   TOKEN
===================================================== */

function getToken(){

    token =
        localStorage.getItem('minegram_token') ||
        localStorage.getItem('minegram_supabase_token') ||
        localStorage.getItem('access_token') ||
        localStorage.getItem('minegram_access_token') ||
        null;

    return token;
}

/* =====================================================
   API
===================================================== */

async function api(path,opt={}){

    const apiToken=getToken();

    if(!apiToken){
        throw new Error('Oturum bulunamadı.');
    }

    const headers={
        ...(opt.headers || {}),
        Authorization:'Bearer '+apiToken
    };

    const response=await fetch(
        API+path,
        {
            ...opt,
            headers
        }
    );

    const data=await response.json().catch(()=>({}));

    if(!response.ok){

        throw new Error(
            data.error ||
            data.message ||
            'İşlem başarısız.'
        );

    }

    return data;
}

/* =====================================================
   PROFİL
===================================================== */

function profileUrl(username){

    return 'profile.html?username='+
        encodeURIComponent(
            String(username||'')
                .replace(/^@/,'')
                .trim()
        );

}

/* =====================================================
   ZAMAN
===================================================== */

function relativeTime(value){

    if(!value)return '';

    const date=new Date(value);

    if(isNaN(date.getTime()))return '';

    const seconds=Math.max(
        0,
        Math.floor((Date.now()-date.getTime())/1000)
    );

    if(seconds<60){
        return seconds+' saniye önce';
    }

    const minutes=Math.floor(seconds/60);

    if(minutes<60){
        return minutes+' dakika önce';
    }

    const hours=Math.floor(minutes/60);

    if(hours<24){
        return hours+' saat önce';
    }

    const days=Math.floor(hours/24);

    if(days<7){
        return days+' gün önce';
    }

    if(days<30){
        return Math.floor(days/7)+' hafta önce';
    }

    if(days<365){
        return Math.floor(days/30)+' ay önce';
    }

    return date.toLocaleDateString('tr-TR');
}

/* =====================================================
   TİP
===================================================== */

function notificationType(n){

    const raw=String(
        n.type ||
        n.notificationType ||
        n.notification_type ||
        n.kind ||
        n.event ||
        n.action ||
        n.eventType ||
        ''
    ).toLowerCase().trim();

    if(
        raw.includes('live') ||
        raw.includes('canli') ||
        raw.includes('canlı') ||
        raw.includes('stream') ||
        raw.includes('broadcast')
    ){
        return 'live';
    }

    if(
        raw.includes('comment_like') ||
        raw.includes('comment-like') ||
        raw.includes('commentlike') ||
        raw.includes('comment_liked') ||
        raw.includes('liked_comment') ||
        raw.includes('yorum_begeni') ||
        raw.includes('yorum-beğeni') ||
        raw.includes('yorumlike')
    ){
        return 'comment_like';
    }

    if(
        raw.includes('follow_request') ||
        raw.includes('follow-request') ||
        raw.includes('followrequest') ||
        raw.includes('takip_iste') ||
        raw.includes('takip-iste') ||
        raw.includes('takipiste') ||
        raw.includes('pending')
    ){
        return 'follow_request';
    }

    if(
        raw.includes('follow_accepted') ||
        raw.includes('follow-accepted') ||
        raw.includes('followaccepted') ||
        raw.includes('takip_kabul') ||
        raw.includes('takip-kabul')
    ){
        return 'follow_accepted';
    }

    if(
        raw.includes('follow_rejected') ||
        raw.includes('follow-rejected') ||
        raw.includes('followrejected') ||
        raw.includes('takip_red') ||
        raw.includes('takip-redd') ||
        raw.includes('takipredd')
    ){
        return 'follow_rejected';
    }

    if(
        raw.includes('like') ||
        raw.includes('liked') ||
        raw.includes('beğeni') ||
        raw.includes('begeni')
    ){
        return 'like';
    }

    if(
        raw.includes('comment') ||
        raw.includes('yorum')
    ){
        return 'comment';
    }

    if(
        raw.includes('reply') ||
        raw.includes('yanıt') ||
        raw.includes('yanit')
    ){
        return 'reply';
    }

    if(
        raw.includes('follow') ||
        raw.includes('takip')
    ){
        return 'follow';
    }

    return 'default';
}

/* =====================================================
   KULLANICI
===================================================== */

function notificationUsername(n){

    const direct =
        n.username ||
        n.actor?.username ||
        n.fromUser?.username ||
        n.from_user?.username ||
        n.user?.username ||
        n.sender?.username ||
        n.requester?.username ||
        n.requesterUsername ||
        n.actor_username ||
        n.from_username ||
        n.user_username ||
        n.sender_username ||
        n.handle;

    if(direct){
        return String(direct).replace(/^@/,'').trim();
    }

    const text=String(
        n.message ||
        n.text ||
        n.content ||
        n.description ||
        ''
    );

    const match=text.match(/@([A-Za-z0-9._-]+)/);

    return match?.[1] || '';
}

/* =====================================================
   ID
===================================================== */

function notificationId(n){

    return String(
        n.id ||
        n.notificationId ||
        n.notification_id ||
        ('local-'+Date.now()+'-'+Math.random())
    );

}

/* =====================================================
   POST ID
===================================================== */

function notificationPostId(n){

    return (
        n.postId ||
        n.post_id ||
        n.post?.id ||
        n.comment?.postId ||
        n.comment?.post_id ||
        n.comment?.post?.id ||
        n.data?.postId ||
        n.data?.post_id ||
        n.data?.post?.id ||
        n.data?.comment?.postId ||
        n.data?.comment?.post_id ||
        ''
    );
}

/* =====================================================
   COMMENT ID
===================================================== */

function notificationCommentId(n){

    return String(
        n.commentId ||
        n.comment_id ||
        n.comment?.id ||
        n.comment?.commentId ||
        n.data?.commentId ||
        n.data?.comment_id ||
        n.data?.comment?.id ||
        ''
    );
}

/* =====================================================
   COMMENT TEXT
===================================================== */

function notificationCommentText(n){

    return String(
        n.commentText ||
        n.comment_text ||
        n.comment?.text ||
        n.comment?.content ||
        n.comment?.message ||
        n.data?.commentText ||
        n.data?.comment_text ||
        n.data?.comment?.text ||
        n.data?.comment?.content ||
        ''
    ).trim();
}

/* =====================================================
   MEDIA
===================================================== */

function notificationMedia(n){

    return (
        n.post?.media ||
        n.post?.image ||
        n.post?.imageUrl ||
        n.post?.mediaUrl ||
        n.post?.thumbnail ||
        n.post?.thumbnailUrl ||
        n.media ||
        n.image ||
        n.imageUrl ||
        n.mediaUrl ||
        n.thumbnail ||
        n.thumbnailUrl ||
        n.data?.post?.media ||
        n.data?.post?.image ||
        n.data?.media ||
        n.data?.image ||
        ''
    );
}

/* =====================================================
   MEDIA TÜRÜ
===================================================== */

function notificationMediaKind(n){

    const raw=String(
        n.post?.mediaType ||
        n.post?.media_type ||
        n.post?.type ||
        n.mediaType ||
        n.media_type ||
        ''
    ).toLowerCase();

    if(
        raw.includes('video') ||
        raw.includes('reel') ||
        raw.includes('mp4') ||
        raw.includes('webm') ||
        raw.includes('mov')
    ){
        return 'video';
    }

    return 'photo';
}

/* =====================================================
   MESAJ
===================================================== */

function notificationMessage(n){

    const type=notificationType(n);

    if(type==='live'){
        return 'canlı yayın açtı.';
    }

    if(type==='comment_like'){
        return 'yorumunu beğendi.';
    }

    if(type==='like'){
        return notificationMediaKind(n)==='video'
            ? 'REELS videonu beğendi.'
            : 'fotoğrafını beğendi.';
    }

    if(type==='comment'){

        const text =
            n.text ||
            n.comment?.text ||
            n.comment?.content ||
            '';

        if(text){
            return notificationMediaKind(n)==='video'
                ? 'REELS videona yorum yaptı: '+esc(String(text))
                : 'gönderine yorum yaptı: '+esc(String(text));
        }

        return notificationMediaKind(n)==='video'
            ? 'REELS videona yorum yaptı.'
            : 'gönderine yorum yaptı.';
    }

    if(type==='comment_like'){
        return 'yorumunu beğendi.';
    }

    if(type==='reply'){
        return 'yorumuna yanıt verdi.';
    }

    if(type==='follow_request'){
        return 'seni takip etmek istiyor.';
    }

    if(type==='follow_accepted'){
        return 'takip isteğini kabul etti.';
    }

    if(type==='follow_rejected'){
        return 'takip isteğini reddetti.';
    }

    if(type==='follow'){
        return 'seni takip etmeye başladı.';
    }

    if(n.message){
        return esc(n.message);
    }

    if(n.text){
        return esc(n.text);
    }

    return 'seninle etkileşime geçti.';
}

function notificationAvatar(n){

    const username=notificationUsername(n);

    const avatar =
        n.avatar ||
        n.avatarUrl ||
        n.avatar_url ||
        n.profileImage ||
        n.profile_image ||
        n.profileImageUrl ||
        n.profile_image_url ||
        n.profilePhoto ||
        n.profile_photo ||
        n.photo ||
        n.photoUrl ||
        n.photo_url ||
        n.image ||
        n.imageUrl ||
        n.image_url ||
        n.actor?.avatar ||
        n.actor?.avatarUrl ||
        n.actor?.profileImage ||
        n.actor?.profile_image ||
        n.fromUser?.avatar ||
        n.fromUser?.avatarUrl ||
        n.fromUser?.profileImage ||
        n.from_user?.avatar ||
        n.user?.avatar ||
        n.user?.avatarUrl ||
        n.user?.profileImage ||
        n.sender?.avatar ||
        n.sender?.profileImage ||
        n.requester?.avatar ||
        n.requester?.profileImage ||
        '';

    const first =

            ? username.charAt(0).toUpperCase()

    if(avatar){

                    this.remove();
                    this.parentElement.textContent='${esc(first)}';
                "
            >
        </div>
        `;

    }

    return `
    <div class="avatar">
        ${esc(first)}
    </div>
    `;
}

/* =====================================================
   LIVE ID
===================================================== */

function notificationLiveId(n){

    return String(
        n.liveId ||
        n.live_id ||
        n.liveID ||
        n.broadcastId ||
        n.broadcast_id ||
        n.broadcastID ||
        n.streamId ||
        n.stream_id ||
        n.streamID ||
        n.live?.id ||
        n.live?.liveId ||
        n.live?.live_id ||
        n.broadcast?.id ||
        n.broadcast?.liveId ||
        n.data?.liveId ||
        n.data?.live_id ||
        n.data?.broadcastId ||
        n.data?.broadcast_id ||
        n.data?.streamId ||
        n.data?.stream_id ||
        n.data?.live?.id ||
        ''
    );
}

/* =====================================================
   LIVE VERİSİ
===================================================== */

function normalizeLiveList(result){

    if(Array.isArray(result)){
        return result;
    }

    if(Array.isArray(result?.live)){
        return result.live;
    }

    if(Array.isArray(result?.lives)){
        return result.lives;
    }

    if(Array.isArray(result?.data)){
        return result.data;
    }

    if(Array.isArray(result?.items)){
        return result.items;
    }

    if(result?.live && typeof result.live==='object'){
        return [result.live];
    }

    if(result?.data && typeof result.data==='object'){
        return [result.data];
    }

    if(result && typeof result==='object'){
        return [result];
    }

    return [];
}

function liveIsActive(live){

    if(!live)return false;

    const status=String(
        live.status ||
        live.state ||
        live.liveStatus ||
        live.streamStatus ||
        ''
    ).toLowerCase();

    const endedWords=[
        'ended',
        'offline',
        'closed',
        'finished',
        'completed',
        'stopped',
        'cancelled',
        'canceled',
        'ended_at'
    ];

    if(endedWords.some(x=>status.includes(x))){
        return false;
    }

    const bools=[
        live.active,
        live.isActive,
        live.is_active,
        live.live,
        live.isLive,
        live.is_live,
        live.online,
        live.isOnline,
        live.is_online
    ];

    const defined=bools.filter(v=>v!==undefined && v!==null);

    if(
        defined.length &&
        !defined.some(v =>
            v===true ||
            String(v).toLowerCase()==='true' ||
            String(v).toLowerCase()==='1'
        )
    ){
        return false;
    }

    return true;
}

/* =====================================================
   CANLIYA GİT
===================================================== */

async function openLiveNotification(
    event,
    username,
    liveId
){

    event.stopPropagation();

    try{

        const result=await api(
            '/live?ts='+Date.now()
        );

        const lives=normalizeLiveList(result)
            .filter(liveIsActive);

        let live=null;

        if(liveId){

            live=lives.find(l=>{

                const id=String(
                    l.id ||
                    l.liveId ||
                    l.live_id ||
                    l.broadcastId ||
                    l.broadcast_id ||
                    l.streamId ||
                    l.stream_id ||
                    ''
                );

                return id===String(liveId);
            });
        }

        if(!live && username){

            live=lives.find(l=>{

                const u=String(
                    l.username ||
                    l.user?.username ||
                    l.host?.username ||
                    l.owner?.username ||
                    l.creator?.username ||
                    ''
                ).replace(/^@/,'');

                return u.toLowerCase()===
                    String(username)
                        .replace(/^@/,'')
                        .toLowerCase();
            });
        }

        if(!live){

            toast('Şu an bir canlı yayın yok.');
            return;
        }

        const activeLiveId=
            live.id ||
            live.liveId ||
            live.live_id ||
            live.broadcastId ||
            live.broadcast_id ||
            live.streamId ||
            live.stream_id ||
            '';

        if(!activeLiveId){

            toast('Şu an bir canlı yayın yok.');
            return;
        }

        location.href=
            'reels.html?live='+
            encodeURIComponent(activeLiveId);

    }catch(error){

        console.error(
            '[LIVE NOTIFICATION]',
            error
        );

        toast('Şu an bir canlı yayın yok.');
    }
}

/* =====================================================
   RENDER
===================================================== */

function renderNotification(n){

    const id=notificationId(n);
    const username=notificationUsername(n);
    const type=notificationType(n);

    const read=!!(
        n.read===true ||
        n.isRead===true ||
        n.seen===true
    );

    const postId=notificationPostId(n);
    const commentId=notificationCommentId(n);
    const liveId=notificationLiveId(n);

    const time=
        n.createdAt ||
        n.created_at ||
        n.date ||
        n.timestamp ||
        '';

    const following=!!(
        n.following ||
        n.isFollowing ||
        n.is_following
    );

    let action='';

    if(type==='follow_request'){

        action=followButtonHTML(
            username,
            false,
            'request'
        );

    }else if(
        type==='follow' ||
        type==='follow_accepted'
    ){

        action=followButtonHTML(
            username,
            following,
            'follow'
        );

    }else if(type==='comment_like' && commentId){

        action=`
        <div class="notification-actions">

            ${postThumbnailHTML(n)}

            <button
                class="comment-like-btn"
                type="button"
                data-comment-id="${esc(commentId)}"
                data-liked="0"
                onclick="toggleNotificationCommentLike(event,this)">
                ♡
            </button>

        </div>
        `;

    }else if(type==='live'){

        action=`
        <div class="notification-actions">

            <button
                class="follow-btn"
                type="button"
                style="background:#ff304f;border-color:#ff304f;"
                onclick="openLiveNotification(
                    event,
                    '${esc(username)}',
                    '${esc(liveId)}'
                )">
                Canlıya Git
            </button>

        </div>
        `;

    }else{

        action=
            postThumbnailHTML(n) ||
            `<div class="notification-icon">
                ${type==='like'?'♥':
                  type==='comment'?'💬':
                  type==='reply'?'↩':
                  type==='follow'?'👤':'🔔'}
            </div>`;
    }

    const liveClass=
        type==='live'
            ? ' live-notification'
            : '';

    const liveBadge=
        type==='live'
            ? `<span class="live-badge">
                <span class="live-dot"></span>
                CANLI
               </span>`
            : '';

    return `
    <div
        class="notification${read?'':' unread'}${liveClass}"
        data-id="${esc(id)}"
        data-notification-id="${esc(id)}"
        data-username="${esc(username)}"
        data-post-id="${esc(postId)}"
        data-comment-id="${esc(commentId)}"
        data-live-id="${esc(liveId)}"
        onclick="openNotification(event,this)">

        ${notificationAvatar(n)}

        <div class="notification-content">

            <div class="notification-text">

                ${
                    username
                    ? `<b>@${esc(username)}</b>`
                    : ''
                }

                ${notificationMessage(n)}

                ${liveBadge}

            </div>

            ${
                notificationCommentText(n)
                ? `<div class="comment-preview">
                    “${esc(notificationCommentText(n))}”
                   </div>`
                : ''
            }

            <div class="notification-time">
                ${esc(relativeTime(time))}
            </div>

        </div>

        ${action}

        ${
            read
            ? ''
            : '<span class="unread-dot"></span>'
        }

    </div>
    `;
}

/* =====================================================
   NORMALIZE
===================================================== */

function normalizeNotifications(result){

    if(Array.isArray(result)){
        return result;
    }

    if(Array.isArray(result?.notifications)){
        return result.notifications;
    }

    if(Array.isArray(result?.data)){
        return result.data;
    }

    if(Array.isArray(result?.items)){
        return result.items;
    }

    return [];
}

/* =====================================================
   BİLDİRİMLERİ YÜKLE
===================================================== */

async function loadNotifications(){

    const list=
        document.getElementById('notificationList');

    list.innerHTML=`
        <div class="loading">
            Bildirimler yükleniyor...
        </div>
    `;

    try{

        let result;

        try{

            result=await api('/notifications');

        }catch{

            try{

                result=await api('/notifications/me');

            }catch{

                result=await api('/notification');

            }
        }

        const notifications=
            normalizeNotifications(result);

        notificationCache=notifications;

        if(!notifications.length){

            list.innerHTML=`
                <div class="empty">

                    <div class="empty-icon">
                        ♡
                    </div>

                    <strong>
                        Henüz bildirimin yok
                    </strong>

                    <span>
                        Etkileşimler burada görünecek.
                    </span>

                </div>
            `;

            return;
        }

        notifications.sort((a,b)=>{

            const da=new Date(
                a.createdAt ||
                a.created_at ||
                a.date ||
                0
            ).getTime();

            const db=new Date(
                b.createdAt ||
                b.created_at ||
                b.date ||
                0
            ).getTime();

            return db-da;
        });

        list.innerHTML=
            notifications
                .map(renderNotification)
                .join('');

    }catch(error){

        console.error(
            '[NOTIFICATIONS]',
            error
        );

        list.innerHTML=`
            <div class="empty">

                <div class="empty-icon">
                    🔔
                </div>

                <strong>
                    Bildirimler yüklenemedi
                </strong>

                <span>
                    ${esc(
                        error.message ||
                        'Sunucu bağlantısı kurulamadı.'
                    )}
                </span>

            </div>
        `;

        toast(
            error.message ||
            'Bildirimler yüklenemedi'
        );
    }
}

/* =====================================================
   BİLDİRİM TIKLAMA
===================================================== */

async function openNotification(event,element){

    if(
        event.target.closest('.follow-btn') ||
        event.target.closest('.comment-like-btn')
    ){
        return;
    }

    const id=element.dataset.notificationId;
    const username=element.dataset.username;
    const postId=element.dataset.postId;
    const type=
        notificationType(
            notificationCache.find(
                n=>notificationId(n)===id
            ) || {}
        );

    element.classList.remove('unread');

    element
        .querySelector('.unread-dot')
        ?.remove();

    if(id && !id.startsWith('local-')){

        try{

            await api(
                '/notifications/'+
                encodeURIComponent(id)+
                '/read',
                {
                    method:'POST'
                }
            );

        }catch{

            try{

                await api(
                    '/notifications/'+
                    encodeURIComponent(id),
                    {
                        method:'PATCH',
                        headers:{
                            'Content-Type':
                                'application/json'
                        },
                        body:JSON.stringify({
                            read:true
                        })
                    }
                );

            }catch{}
        }
    }

    if(type==='live'){

        await openLiveNotification(
            event,
            username,
            element.dataset.liveId
        );

        return;
    }

    if(postId){

        location.href=
            'post.html?id='+
            encodeURIComponent(postId);

        return;
    }

    if(username){

        location.href=
            profileUrl(username);
    }
}

/* =====================================================
   YORUM BEĞENİSİ
===================================================== */

async function toggleNotificationCommentLike(
    event,
    button
){

    event.stopPropagation();

    const commentId=
        button?.dataset?.commentId || '';

    if(!commentId){
        toast('Yorum kimliği bulunamadı.');
        return;
    }

    if(button.dataset.loading==='1'){
        return;
    }

    button.dataset.loading='1';

    const wasLiked=
        button.dataset.liked==='1';

    const next=!wasLiked;

    button.classList.toggle(
        'liked',
        next
    );

    button.dataset.liked=
        next?'1':'0';

    button.textContent=
        next?'♥':'♡';

    try{

        const result=
            await api(
                '/comments/'+
                encodeURIComponent(commentId)+
                '/like',
                {
                    method:'POST'
                }
            );

        const liked=
            typeof result.liked==='boolean'
                ? result.liked
                : next;

        button.classList.toggle(
            'liked',
            liked
        );

        button.dataset.liked=
            liked?'1':'0';

        button.textContent=
            liked?'♥':'♡';

    }catch(error){

        button.classList.toggle(
            'liked',
            wasLiked
        );

        button.dataset.liked=
            wasLiked?'1':'0';

        button.textContent=
            wasLiked?'♥':'♡';

        toast(
            error.message ||
            'Yorum beğenisi başarısız.'
        );

    }finally{

        button.dataset.loading='0';
    }
}

/* =====================================================
   TAKİP İSTEĞİ
===================================================== */

async function followRequestAction(
    event,
    username,
    decision
){

    event.stopPropagation();

    const button=event.currentTarget;
    const actions=button.closest('.follow-actions');

    if(!username || !actions){
        return;
    }

    actions
        .querySelectorAll('button')
        .forEach(b=>b.disabled=true);

    try{

        const endpoint=
            decision==='accept'
                ? '/follow-requests/accept'
                : '/follow-requests/reject';

        await api(
            endpoint,
            {
                method:'POST',
                headers:{
                    'Content-Type':
                        'application/json'
                },
                body:JSON.stringify({
                    username:username
                })
            }
        );

        if(decision==='accept'){

            actions.outerHTML=
                followButtonHTML(
                    username,
                    false,
                    'follow'
                );

            toast(
                '@'+username+
                ' takip isteği kabul edildi.'
            );

        }else{

            actions.outerHTML=`
                <span style="
                    color:#777;
                    font-size:12px;
                ">
                    İstek reddedildi
                </span>
            `;

            toast(
                '@'+username+
                ' takip isteği reddedildi.'
            );
        }

    }catch(error){

        actions
            .querySelectorAll('button')
            .forEach(b=>b.disabled=false);

        toast(
            error.message ||
            'Takip isteği işlemi başarısız.'
        );
    }
}

/* =====================================================
   TAKİP
===================================================== */

async function followAction(
    event,
    username,
    currentlyFollowing
){

    event.stopPropagation();

    if(!username)return;

    const button=event.currentTarget;

    if(button.dataset.loading==='1'){
        return;
    }

    button.dataset.loading='1';

    const next=!currentlyFollowing;

    button.textContent=
        next
            ? 'Takiptesin'
            : 'Sen de Takip Et';

    button.classList.toggle(
        'following',
        next
    );

    try{

        const result=
            await api(
                '/users/'+
                encodeURIComponent(username)+
                '/follow',
                {
                    method:'POST'
                }
            );

        if(
            typeof result.following==='boolean'
        ){

            button.classList.toggle(
                'following',
                result.following
            );

            button.textContent=
                result.following
                    ? 'Takiptesin'
                    : 'Sen de Takip Et';
        }

        toast(
            next
                ? '@'+username+' takip edildi.'
                : '@'+username+' takipten çıkarıldı.'
        );

    }catch(error){

        try{

            const result=
                await api(
                    '/follow/'+
                    encodeURIComponent(username),
                    {
                        method:'POST'
                    }
                );

            if(
                typeof result.following==='boolean'
            ){

                button.classList.toggle(
                    'following',
                    result.following
                );

                button.textContent=
                    result.following
                        ? 'Takiptesin'
                        : 'Sen de Takip Et';
            }

        }catch{

            button.classList.toggle(
                'following',
                currentlyFollowing
            );

            button.textContent=
                currentlyFollowing
                    ? 'Takiptesin'
                    : 'Sen de Takip Et';

            toast(
                error.message ||
                'Takip işlemi başarısız.'
            );
        }

    }finally{

        button.dataset.loading='0';
    }
}
