<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Minegram - Bildirimler</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family:Arial,Helvetica,sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
}

body{
    overflow-x:hidden;
    padding-bottom:76px;
}

button{
    font-family:inherit;
}

button:disabled{
    opacity:.55;
}


/* =====================================================
   ÜST BAR
===================================================== */

.topbar{
    height:62px;
    width:100%;
    position:sticky;
    top:0;
    z-index:50;

    display:flex;
    align-items:center;

    padding:0 12px;

    background:#000;
    border-bottom:1px solid #24242a;
}

.back-btn{
    width:42px;
    height:42px;

    border:0;
    background:transparent;
    color:#fff;

    display:grid;
    place-items:center;

    cursor:pointer;
}

.back-btn svg{
    width:25px;
    height:25px;

    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.logo{
    margin-left:6px;

    color:#fff;

    font-size:20px;
    font-weight:700;
}

.top-actions{
    margin-left:auto;

    display:flex;
    align-items:center;
}

.icon-btn{
    width:42px;
    height:42px;

    border:0;
    background:transparent;
    color:#fff;

    display:grid;
    place-items:center;

    cursor:pointer;
}

.svg{
    width:23px;
    height:23px;

    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =====================================================
   ANA ALAN
===================================================== */

.notifications{
    width:min(680px,100%);
    margin:0 auto;
}

.notifications-head{
    min-height:62px;

    display:flex;
    align-items:center;

    padding:0 16px;

    border-bottom:1px solid #1d1d1d;
}

.notifications-title{
    font-size:19px;
    font-weight:700;
}

.mark-all{
    margin-left:auto;

    border:0;
    background:transparent;

    color:#63b1ed;

    font-size:12px;
    font-weight:700;

    cursor:pointer;
}


/* =====================================================
   BİLDİRİM LİSTESİ
===================================================== */

.notification-list{
    width:100%;
}

.notification{
    width:100%;
    min-height:78px;

    display:flex;
    align-items:center;

    gap:11px;

    padding:11px 14px;

    border-bottom:1px solid #171717;

    cursor:pointer;

    transition:
        background .15s ease;
}

.notification:hover{
    background:#080808;
}

.notification:active{
    background:#101010;
}

.notification.unread{
    background:#0b1015;
}


/* =====================================================
   AVATAR
===================================================== */

.avatar{
    width:46px;
    height:46px;
    min-width:46px;

    border-radius:50%;

    overflow:hidden;

    display:grid;
    place-items:center;

    background:#333;

    color:#fff;

    font-size:16px;
    font-weight:700;
}

.avatar img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}


/* =====================================================
   BİLDİRİM YAZISI
===================================================== */

.notification-content{
    min-width:0;
    flex:1;
}

.notification-text{
    color:#ddd;

    font-size:13px;
    line-height:19px;

    overflow-wrap:anywhere;
}

.notification-text b{
    color:#fff;
    font-weight:700;
}

.notification-time{
    margin-top:3px;

    color:#777;

    font-size:11px;
}

.notification-icon{
    width:40px;
    min-width:40px;
    height:40px;

    display:grid;
    place-items:center;

    font-size:20px;
}


/* =====================================================
   GÖNDERİ RESMİ
===================================================== */

.notification-thumb{
    width:46px;
    height:46px;
    min-width:46px;

    border-radius:4px;

    overflow:hidden;

    background:#222;
}

.notification-thumb img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}


/* =====================================================
   TAKİP BUTONU
===================================================== */

.follow-btn{
    min-width:82px;
    height:33px;

    padding:0 11px;

    border:1px solid #63b1ed;
    border-radius:8px;

    background:#63b1ed;
    color:#fff;

    font-size:11px;
    font-weight:700;

    cursor:pointer;
}

.follow-btn.following{
    background:#222;
    border-color:#363636;
}

.follow-actions{
    display:flex;
    align-items:center;
    gap:5px;

    flex-shrink:0;
}

.follow-actions .follow-btn{
    min-width:62px;
}

.request-reject{
    background:#222 !important;
    border-color:#383838 !important;
}


/* =====================================================
   YORUM
===================================================== */

.comment-preview{
    margin-top:4px;

    color:#929292;

    font-size:11px;
    line-height:16px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.comment-like-btn{
    width:38px;
    height:32px;

    border:1px solid #333;
    border-radius:17px;

    background:#111;
    color:#aaa;

    font-size:18px;

    cursor:pointer;

    flex-shrink:0;
}

.comment-like-btn.liked{
    color:#ff375f;
    border-color:#572633;
    background:#210f14;
}


/* =====================================================
   ACTION
===================================================== */

.notification-actions{
    display:flex;
    align-items:center;
    gap:6px;

    flex-shrink:0;
}


/* =====================================================
   OKUNMAMIŞ NOKTA
===================================================== */

.unread-dot{
    width:7px;
    height:7px;
    min-width:7px;

    border-radius:50%;

    background:#63b1ed;
}


/* =====================================================
   CANLI YAYIN
===================================================== */

.live-notification-icon{
    width:40px;
    height:40px;
    min-width:40px;

    border-radius:50%;

    display:grid;
    place-items:center;

    background:#25090d;

    border:1px solid #591b26;

    color:#ff3152;

    font-size:16px;
}

.live-notification-icon::before{
    content:"";
    width:10px;
    height:10px;

    border-radius:50%;

    background:#ff3152;
}

.live-badge{
    display:inline-flex;

    margin-left:6px;

    padding:2px 5px;

    border-radius:4px;

    background:#e51d3e;
    color:#fff;

    font-size:8px;
    font-weight:800;

    vertical-align:middle;
}

.live-open{
    height:31px;
    min-width:64px;

    padding:0 9px;

    border:1px solid #e51d3e;
    border-radius:8px;

    background:#e51d3e;
    color:#fff;

    font-size:10px;
    font-weight:700;

    cursor:pointer;
}

.live-open:active{
    transform:scale(.97);
}


/* =====================================================
   BOŞ
===================================================== */

.empty{
    padding:100px 20px;

    text-align:center;

    color:#777;
}

.empty-icon{
    width:68px;
    height:68px;

    margin:0 auto 17px;

    border:1px solid #333;
    border-radius:50%;

    display:grid;
    place-items:center;

    font-size:28px;
}

.empty strong{
    display:block;

    margin-bottom:7px;

    color:#eee;

    font-size:16px;
}

.empty span{
    color:#777;
    font-size:12px;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
    padding:70px 20px;

    text-align:center;

    color:#777;

    font-size:13px;
}


/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    left:50%;
    bottom:92px;

    transform:
        translateX(-50%)
        translateY(10px);

    padding:10px 16px;

    border-radius:20px;

    background:#28262d;
    color:#fff;

    font-size:12px;

    opacity:0;

    pointer-events:none;

    transition:.2s;

    z-index:500;

    white-space:nowrap;

    max-width:90%;
    overflow:hidden;
    text-overflow:ellipsis;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =====================================================
   ALT MENÜ
===================================================== */

.nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    width:100%;
    height:76px;

    z-index:100;

    display:flex;
    align-items:stretch;

    padding:5px 7px
        env(safe-area-inset-bottom);

    background:#19171f;

    border-top:1px solid #24212b;
}

.nav a{
    flex:1;

    min-width:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:2px;

    color:#ddd;

    text-decoration:none;

    font-size:9px;
}

.nav-icon{
    width:44px;
    height:31px;

    border-radius:17px;

    display:grid;
    place-items:center;
}

.nav a.active .nav-icon{
    background:#3b3150;
}

.nav .svg{
    width:21px;
    height:21px;
}


/* =====================================================
   MOBİL
===================================================== */

@media(max-width:699px){

    .topbar{
        height:60px;
    }

    .logo{
        font-size:19px;
    }

    .notifications-head{
        min-height:57px;
        padding:0 13px;
    }

    .notifications-title{
        font-size:18px;
    }

    .notification{
        min-height:73px;
        padding:10px 11px;
        gap:9px;
    }

    .avatar{
        width:43px;
        height:43px;
        min-width:43px;
    }

    .notification-text{
        font-size:12.5px;
        line-height:18px;
    }

    .notification-thumb{
        width:43px;
        height:43px;
        min-width:43px;
    }

    .notification-icon{
        width:34px;
        min-width:34px;
        font-size:18px;
    }

    .live-notification-icon{
        width:34px;
        height:34px;
        min-width:34px;
    }

    .follow-btn{
        min-width:68px;
        height:31px;
        padding:0 8px;
        font-size:10px;
    }

    .follow-actions{
        gap:4px;
    }

    .follow-actions .follow-btn{
        min-width:54px;
        padding:0 6px;
    }

    .live-open{
        min-width:56px;
        height:30px;
        padding:0 7px;
        font-size:9px;
    }

    .mark-all{
        font-size:11px;
    }

}


/* =====================================================
   MASAÜSTÜ
===================================================== */

@media(min-width:700px){

    .nav{
        padding-left:calc((100% - 760px)/2);
        padding-right:calc((100% - 760px)/2);
    }

}

</style>
</head>


<body>

     TOAST
===================================================== -->

<script>

/* =====================================================
   API
===================================================== */

const API = '/api';


let token =
    localStorage.getItem('minegram_token') ||
    localStorage.getItem('minegram_supabase_token') ||
    localStorage.getItem('access_token') ||
    localStorage.getItem('minegram_access_token') ||
    null;


let currentUser = null;


/* =====================================================
   ESC
===================================================== */

function esc(value=''){

    return String(value).replace(
        /[&<>"']/g,
        function(match){

            return {

                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                '"':'&quot;',
                "'":'&#039;'

            }[match];

        }
    );

}


/* =====================================================
   TOAST
===================================================== */

function toast(message){

    const element =
        document.getElementById('toast');


    element.textContent =
        message;


    element.classList.add('show');


    clearTimeout(
        window.__minegramToast
    );


    window.__minegramToast =
        setTimeout(function(){

            element.classList.remove(
                'show'
            );

        },2500);

}


/* =====================================================
   TOKEN
===================================================== */

function getToken(){

    token =
        localStorage.getItem('minegram_token') ||
        localStorage.getItem('minegram_supabase_token') ||
        localStorage.getItem('access_token') ||
        localStorage.getItem('minegram_access_token') ||
        null;

    return token;

}


/* =====================================================
   API İSTEĞİ
===================================================== */

async function api(
    path,
    options={}
){

    const apiToken =
        getToken();


    if(!apiToken){

        throw new Error(
            'Oturum bulunamadı.'
        );

    }


    const headers = {

        ...(options.headers || {}),

        'Authorization':
            'Bearer ' + apiToken

    };


    if(
        options.body &&
        !headers['Content-Type']
    ){

        headers['Content-Type'] =
            'application/json';

    }


    const response =
        await fetch(
            API + path,
            {
                ...options,
                headers:headers
            }
        );


    const data =
        await response
            .json()
            .catch(function(){

                return {};

            });


    if(!response.ok){

        throw new Error(

            data.error ||
            data.message ||
            'İşlem başarısız.'

        );

    }


    return data;

}


/* =====================================================
   PROFİL URL
===================================================== */

function profileUrl(
    username
){

    return (
        'profile.html?username=' +
        encodeURIComponent(
            String(
                username || ''
            )
            .replace(/^@/,'')
            .trim()
        )
    );

}


/* =====================================================
   ZAMAN
===================================================== */

function relativeTime(
    value
){

    if(!value){

        return '';

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return '';

    }


    const seconds =
        Math.max(
            0,
            Math.floor(
                (
                    Date.now() -
                    date.getTime()
                ) / 1000
            )
        );


    if(seconds < 60){

        return (
            seconds +
            ' saniye önce'
        );

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    if(minutes < 60){

        return (
            minutes +
            ' dakika önce'
        );

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    if(hours < 24){

        return (
            hours +
            ' saat önce'
        );

    }


    const days =
        Math.floor(
            hours / 24
        );


    if(days < 7){

        return (
            days +
            ' gün önce'
        );

    }


    if(days < 30){

        return (
            Math.floor(days / 7) +
            ' hafta önce'
        );

    }


    if(days < 365){

        return (
            Math.floor(days / 30) +
            ' ay önce'
        );

    }


    return date.toLocaleDateString(
        'tr-TR'
    );

}


/* =====================================================
   BİLDİRİM TİPİ
===================================================== */

function notificationType(n){

    const type =
        String(
            n.type ||
            n.notificationType ||
            n.kind ||
            n.event ||
            n.action ||
            ''
        )
        .toLowerCase();


    /* CANLI */

    if(

        type === 'live' ||
        type.includes('live_start') ||
        type.includes('live-start') ||
        type.includes('live_started') ||
        type.includes('live-started') ||
        type.includes('live_notification') ||
        type.includes('live_started_notification') ||
        type.includes('canli') ||
        type.includes('canlı') ||
        type.includes('canli_yayin') ||
        type.includes('canlı_yayın') ||
        type.includes('canli-yayin') ||
        type.includes('canlı-yayın')

    ){

        return 'live';

    }


    /* YORUM BEĞENİ */

    if(

        type.includes('comment_like') ||
        type.includes('comment-like') ||
        type.includes('commentlike') ||
        type.includes('comment_liked') ||
        type.includes('comment-liked') ||
        type.includes('liked_comment') ||
        type.includes('yorum_begeni') ||
        type.includes('yorum-beğeni') ||
        type.includes('yorumlike')

    ){

        return 'comment_like';

    }


    /* BEĞENİ */

    if(

        type.includes('like') ||
        type.includes('begeni') ||
        type.includes('beğeni')

    ){

        return 'like';

    }


    /* YORUM */

    if(

        type.includes('comment') ||
        type.includes('yorum')

    ){

        return 'comment';

    }


    /* TAKİP İSTEĞİ */

    if(

        type.includes('follow_request') ||
        type.includes('follow-request') ||
        type.includes('followrequest') ||
        type.includes('takip_iste') ||
        type.includes('takip-iste') ||
        type.includes('pending')

    ){

        return 'follow_request';

    }


    /* TAKİP KABUL */

    if(

        type.includes('follow_accepted') ||
        type.includes('follow-accepted') ||
        type.includes('followaccepted') ||
        type.includes('takip_kabul') ||
        type.includes('takip-kabul')

    ){

        return 'follow_accepted';

    }


    /* TAKİP */

    if(

        type.includes('follow') ||
        type.includes('takip')

    ){

        return 'follow';

    }


    /* YANIT */

    if(

        type.includes('reply') ||
        type.includes('yanit') ||
        type.includes('yanıt')

    ){

        return 'reply';

    }


    return 'default';

}


/* =====================================================
   KULLANICI ADI
===================================================== */

function notificationUsername(n){

    const username =

        n.username ||
        n.actor?.username ||
        n.fromUser?.username ||
        n.from_user?.username ||
        n.user?.username ||
        n.sender?.username ||
        n.requester?.username ||
        n.requesterUsername ||
        n.actor_username ||
        n.from_username ||
        n.user_username ||
        n.sender_username ||
        n.live_username ||
        n.liveUsername ||
        n.hostUsername ||
        n.host_username ||
        n.broadcaster ||
        n.broadcasterUsername ||
        n.broadcaster_username ||
        n.live?.username ||
        n.live?.user?.username ||
        n.data?.live_username ||
        n.data?.liveUsername ||
        n.data?.live?.username ||
        n.data?.username ||
        n.handle;


    if(username){

        return String(
            username
        )
        .replace(/^@/,'')
        .trim();

    }


    const text =
        String(
            n.message ||
            n.text ||
            n.content ||
            n.description ||
            ''
        );


    const match =
        text.match(
            /@([A-Za-z0-9._-]+)/
        );


    if(match){

        return match[1];

    }


    return '';

}


/* =====================================================
   BİLDİRİM ID
===================================================== */

function notificationId(n){

    return String(

        n.id ||
        n.notificationId ||
        n.notification_id ||
        ''

    );

}

   POST ID
===================================================== */

    return (

        n.postId ||
        n.post_id ||
        n.post?.id ||
        n.comment?.postId ||
        n.comment?.post_id ||
        n.comment?.post?.id ||
        n.data?.postId ||
        n.data?.post_id ||
        n.data?.post?.id ||
        n.data?.comment?.postId ||
        n.data?.comment?.post_id ||
        ''

    );

}

   CANLI ID

        n.streamId ||
        n.stream_id ||
        n.live?.id ||
        n.live?.liveId ||

/* =====================================================
   YORUM METNİ
===================================================== */

function notificationCommentText(n){

    return String(

        n.commentText ||
        n.comment_text ||
        n.comment?.text ||
        n.comment?.content ||
        n.comment?.message ||
        n.data?.commentText ||
        n.data?.comment_text ||
        n.data?.comment?.text ||
        n.data?.comment?.content ||
        ''

    ).trim();

}


/* =====================================================
   YORUM BEĞENİ DURUMU
===================================================== */

function notificationCommentLikedByMe(n){

    const values = [

        n.commentLikedByMe,
        n.comment_liked_by_me,
        n.comment?.likedByMe,
        n.comment?.liked_by_me,
        n.comment?.isLiked,
        n.comment?.is_liked,
        n.data?.commentLikedByMe,
        n.data?.comment_liked_by_me,
        n.data?.comment?.likedByMe,
        n.data?.comment?.liked_by_me

    ];


    for(
        const value of values
    ){

        if(
            typeof value ===
            'boolean'
        ){

            return value;

        }


        if(
            String(value || '')
            .toLowerCase() === 'true'
        ){

            return true;

        }


        if(
            String(value || '')
            .toLowerCase() === 'false'
        ){

            return false;

        }

    }


    return false;

}


/* =====================================================
   MEDYA
===================================================== */

function notificationMedia(n){

    return (

        n.post?.media ||
        n.post?.image ||
        n.post?.imageUrl ||
        n.post?.mediaUrl ||
        n.post?.thumbnail ||
        n.post?.thumbnailUrl ||
        n.media ||
        n.image ||
        n.imageUrl ||
        n.mediaUrl ||
        n.thumbnail ||
        n.thumbnailUrl ||
        n.data?.post?.media ||
        n.data?.post?.image ||
        n.data?.media ||
        n.data?.image ||
        ''

    );

}


function notificationMediaKind(n){

    const type =
        String(

            n.post?.mediaType ||
            n.post?.media_type ||
            n.post?.type ||
            n.mediaType ||
            n.media_type ||
            ''

        )
        .toLowerCase();


    if(

        type.includes('video') ||
        type.includes('reel') ||
        type.includes('mp4') ||
        type.includes('webm') ||
        type.includes('mov')

    ){

        return 'video';

    }


    return 'photo';

}


/* =====================================================
   TAKİP İSTEĞİ
===================================================== */

function isFollowRequestNotification(n){

    const type =
        String(
            n.type ||
            n.notificationType ||
            n.kind ||
            ''
        )
        .toLowerCase();


    return (

        type === 'follow_request' ||
        type === 'follow-request' ||
        type.includes('follow_request') ||
        type.includes('follow request') ||
        type.includes('takip_iste') ||
        type.includes('takip iste')

    );

}


/* =====================================================
   TAKİP KABUL
===================================================== */

function isFollowAcceptedNotification(n){

    const type =
        String(
            n.type ||
            n.notificationType ||
            n.kind ||
            ''
        )
        .toLowerCase();


    return (

        type === 'follow_accepted' ||
        type === 'follow-accepted' ||
        type.includes('follow_accepted') ||
        type.includes('follow accepted') ||
        type.includes('takip_kabul') ||
        type.includes('takip kabul')

    );

}


/* =====================================================
   TAKİP BUTONU
===================================================== */

function followButtonHTML(
    username,
    following,
    mode='follow'
){

    const safe =
        esc(username);


    if(mode === 'request'){

        return `

        <div class="follow-actions">

            <button
                class="follow-btn"
                type="button"
                onclick="followRequestAction(
                    event,
                    '${safe}',
                    'accept'
                )">

                Onayla

            </button>


            <button
                class="follow-btn request-reject"
                type="button"
                onclick="followRequestAction(
                    event,
                    '${safe}',
                    'reject'
                )">

                Reddet

            </button>

        </div>

        `;

    }


    return `

    <button
        class="follow-btn ${following?'following':''}"
        type="button"
        onclick="followAction(
            event,
            '${safe}',
            ${following}
        )">

        ${
            following
                ? 'Takiptesin'
                : 'Sen de Takip Et'
        }

    </button>

    `;

}


/* =====================================================
   MESAJ
===================================================== */

function notificationMessage(n){

    const type =
        notificationType(n);


    if(type === 'live'){

        const custom =
            String(
                n.message ||
                n.text ||
                n.description ||
                ''
            ).trim();


        if(
            custom &&
            (
                custom.toLowerCase().includes(
                    'canlı'
                ) ||
                custom.toLowerCase().includes(
                    'canli'
                ) ||
                custom.toLowerCase().includes(
                    'live'
                )
            )
        ){

            return esc(custom);

        }


        return 'canlı yayına başladı.';

    }


    if(
        n.message &&
        type !== 'like' &&
        type !== 'comment' &&
        type !== 'comment_like'
    ){

        return esc(n.message);

    }


    if(
        n.text &&
        type !== 'like' &&
        type !== 'comment' &&
        type !== 'comment_like'
    ){

        return esc(n.text);

    }


    if(type === 'comment_like'){

        return 'yorumunu beğendi.';

    }


    if(type === 'like'){

        return notificationMediaKind(n) === 'video'
            ? 'REELS videonu beğendi.'
            : 'fotoğrafını beğendi.';

    }


    if(type === 'comment'){

        const text =
            notificationCommentText(n);


        if(text){

            return (
                'yorum yaptı: ' +
                esc(text)
            );

        }


        return 'gönderine yorum yaptı.';

    }


    if(type === 'reply'){

        return 'yorumuna yanıt verdi.';

    }


    if(
        isFollowRequestNotification(n)
    ){

        return 'seni takip etmek istiyor.';

    }


    if(
        isFollowAcceptedNotification(n)
    ){

        return 'takip isteğini kabul etti.';

    }


    if(type === 'follow'){

        return 'seni takip etmeye başladı.';

    }


    return 'seninle etkileşime geçti.';

}


/* =====================================================
   İKON
===================================================== */

function notificationIcon(n){

    const type =
        notificationType(n);


    if(type === 'live'){

        return `

            <div
                class="live-notification-icon">
            </div>

        `;

    }


    if(type === 'comment_like'){

        return '♥';

    }


    if(type === 'like'){

        return '♥';

    }


    if(type === 'comment'){

        return '💬';

    }


    if(type === 'reply'){

        return '↩';

    }


    if(type === 'follow'){

        return '👤';

    }


    return '🔔';

}


/* =====================================================
   AVATAR
===================================================== */

function avatarHTML(n){

    const username =
        notificationUsername(n);


    const avatar =

        n.avatar ||
        n.avatarUrl ||
        n.profileImage ||
        n.profile_image ||
        n.profileImageUrl ||
        n.user?.avatar ||
        n.user?.avatarUrl ||
        n.actor?.avatar ||
        n.actor?.avatarUrl ||
        n.live?.avatar ||

        return `

        <div class="avatar">

                src="${esc(avatar)}"

        </div>

        `;

    }


    return `

    <div class="avatar">

        ${esc(
            username
                .charAt(0)
                .toUpperCase() ||
            'M'
        )}

    </div>

    `;

}


/* =====================================================
   GÖNDERİ THUMBNAIL
===================================================== */

function postThumbnailHTML(n){

    const media =
        notificationMedia(n);


    if(!media){

        return '';

    }


    return `

    <div class="notification-thumb">

        <img
            src="${esc(media)}"
            alt=""

/* =====================================================
   BİLDİRİM RENDER
===================================================== */

function renderNotification(n){

    const id =
        notificationId(n);


    const username =
        notificationUsername(n);


    const type =
        notificationType(n);


    const postId =
        notificationPostId(n);


    const liveId =
        notificationLiveId(n);


    const commentId =
        notificationCommentId(n);


    const time =

        n.createdAt ||
        n.created_at ||
        n.date ||
        n.timestamp ||
        '';


    const read =
        n.read === true ||
        n.isRead === true ||
        n.seen === true;


    const following =
        n.following === true ||
        n.isFollowing === true;


    const followRequest =
        isFollowRequestNotification(n);


    const followAccepted =
        isFollowAcceptedNotification(n);


    let action = '';


    /* =================================================
       CANLI
    ================================================= */

    if(type === 'live'){

        action = `

        <button
            class="live-open"
            type="button"
            onclick="openLiveNotification(
                event,
                '${esc(username)}',
                '${esc(liveId)}'
            )">

            Canlıya Git

        </button>

        `;

    }


    /* =================================================
       TAKİP İSTEĞİ
    ================================================= */

    else if(followRequest){

        action =
            followButtonHTML(
                username,
                false,
                'request'
            );

    }


    /* =================================================
       TAKİP / KABUL
    ================================================= */

    else if(
        type === 'follow' ||
        followAccepted
    ){

        action =
            followButtonHTML(
                username,
                following,
                'follow'
            );

    }


    /* =================================================
       YORUM BEĞENİ
    ================================================= */

    else if(
        type === 'comment_like' &&
        commentId
    ){

        const liked =
            notificationCommentLikedByMe(n);


        action = `

        <div class="notification-actions">

            ${postThumbnailHTML(n)}


            <button
                class="comment-like-btn ${
                    liked ? 'liked' : ''
                }"
                type="button"
                data-comment-id="${esc(commentId)}"
                data-liked="${
                    liked ? '1' : '0'
                }"
                onclick="toggleNotificationCommentLike(
                    event,
                    this
                )">

                ${liked ? '♥' : '♡'}

            </button>

        </div>

        `;

    }


    /* =================================================
       DİĞER
    ================================================= */

    else{

        action =
            postThumbnailHTML(n) ||

            `

            <div class="notification-icon">

                ${notificationIcon(n)}

            </div>

            `;

    }


    return `

    <div
        class="notification ${
            read ? '' : 'unread'
        }"
        data-id="${esc(id)}"
        data-notification-id="${esc(id)}"
        data-username="${esc(username)}"
        data-post-id="${esc(postId)}"
        data-live-id="${esc(liveId)}"
        data-comment-id="${esc(commentId)}"
        data-type="${esc(type)}"
        onclick="openNotification(
            event,
            this
        )">


        ${avatarHTML(n)}


        <div class="notification-content">

            <div class="notification-text">

                ${
                    username
                        ? `<b>@${esc(username)}</b> `
                        : ''
                }

                ${notificationMessage(n)}

                ${
                    type === 'live'
                        ? '<span class="live-badge">CANLI</span>'
                        : ''
                }

            </div>


            ${
                notificationCommentText(n)

                    ? `

                    <div class="comment-preview">

                        “${esc(
                            notificationCommentText(n)
                        )}”

                    </div>

                    `

                    : ''
            }


            <div class="notification-time">

                ${esc(
                    relativeTime(time)
                )}

            </div>

        </div>


        ${action}


        ${
            read
                ? ''
                : '<span class="unread-dot"></span>'
        }

    </div>

    `;

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalizeNotifications(
    result
){

    if(Array.isArray(result)){

        return result;

    }


    if(
        Array.isArray(
            result.notifications
        )
    ){

        return result.notifications;

    }


    if(
        Array.isArray(
            result.data
        )
    ){

        return result.data;

    }


    if(
        Array.isArray(
            result.items
        )
    ){

        return result.items;

    }


    return [];

}


/* =====================================================
   BİLDİRİMLERİ YÜKLE
===================================================== */

async function loadNotifications(){

    const list =
        document.getElementById(
            'notificationList'
        );


    list.innerHTML = `

        <div class="loading">
            Bildirimler yükleniyor...
        </div>

    `;


    try{

        let result;


        try{

            result =
                await api(
                    '/notifications'
                );

        }catch(error){

            result =
                await api(
                    '/notifications/me'
                );

        }


        const notifications =
            normalizeNotifications(
                result
            );


        if(!notifications.length){

            list.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        ♡
                    </div>

                    <strong>
                        Henüz bildirimin yok
                    </strong>

                    <span>
                        Etkileşimler burada görünecek.
                    </span>

                </div>

            `;

            return;

        }


        notifications.sort(
            function(a,b){

                const da =
                    new Date(
                        a.createdAt ||
                        a.created_at ||
                        a.date ||
                        a.timestamp ||
                        0
                    ).getTime();


                const db =
                    new Date(
                        b.createdAt ||
                        b.created_at ||
                        b.date ||
                        b.timestamp ||
                        0
                    ).getTime();


                return db - da;

            }
        );


        list.innerHTML =
            notifications
                .map(
                    renderNotification
                )
                .join('');


    }catch(error){

        console.error(
            '[NOTIFICATIONS]',
            error
        );


        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔔
                </div>

                <strong>
                    Bildirimler yüklenemedi
                </strong>

                <span>
                    ${esc(
                        error.message ||
                        'Sunucu bağlantısı kurulamadı.'
                    )}
                </span>

            </div>

        `;

    }

}


/* =====================================================
   🔴 EN ÖNEMLİ KISIM:
   CANLI YAYINI KONTROL ET
===================================================== */

async function openLiveNotification(
    event,
    username,
    notificationLiveId
){

    /*
     * Bildirim satırının normal tıklamasına
     * gitmesini engelle.
     */

    event.stopPropagation();


    const cleanUsername =
        String(
            username || ''
        )
        .replace(/^@/,'')
        .trim();


    const cleanNotificationLiveId =
        String(
            notificationLiveId || ''
        ).trim();


    toast(
        'Canlı yayın kontrol ediliyor...'
    );


    try{

        /*
         * Aktif canlı yayınların listesini al.
         *
         * BURADA REELS'E GİTMİYORUZ.
         *
         * Önce /api/live kontrol ediliyor.
         */

        const result =
            await api(
                '/live?ts=' +
                Date.now()
            );


        let lives = [];


        if(Array.isArray(result)){

            lives = result;

        }

        else if(
            Array.isArray(result.live)
        ){

            lives = result.live;

        }

        else if(
            Array.isArray(result.lives)
        ){

            lives = result.lives;

        }

        else if(
            Array.isArray(result.data)
        ){

            lives = result.data;

        }

        else if(
            Array.isArray(result.items)
        ){

            lives = result.items;

        }

        else if(
            result.live &&
            typeof result.live ===
            'object'
        ){

            lives = [
                result.live
            ];

        }

        else if(
            result.data &&
            typeof result.data ===
            'object' &&
            !Array.isArray(result.data)
        ){

            lives = [
                result.data
            ];

        }


        console.log(
            '[MINEGRAM ACTIVE LIVES]',
            lives
        );


        /*
         * SADECE GERÇEKTEN AKTİF OLAN
         * canlı yayınlar kabul edilir.
         */

        lives =
            lives.filter(
                function(live){

                    if(!live){
                        return false;
                    }


                    /*
                     * Bazı backend sistemlerinde
                     * aktiflik bilgisi bulunabilir.
                     */

                    const status =
                        String(

                            live.status ||
                            live.state ||
                            live.liveStatus ||
                            live.live_status ||
                            ''

                        )
                        .toLowerCase();


                    if(

                        status === 'ended' ||
                        status === 'ended_live' ||
                        status === 'finished' ||
                        status === 'offline' ||
                        status === 'closed' ||
                        status === 'stopped' ||
                        status === 'deleted' ||
                        status === 'cancelled' ||
                        status === 'canceled'

                    ){

                        return false;

                    }


                    if(

                        live.active === false ||
                        live.isActive === false ||
                        live.is_active === false ||
                        live.liveActive === false ||
                        live.live_active === false ||
                        live.online === false ||
                        live.isLive === false ||
                        live.is_live === false

                    ){

                        return false;

                    }


                    /*
                     * true ise kesin aktif.
                     */

                    if(

                        live.active === true ||
                        live.isActive === true ||
                        live.is_active === true ||
                        live.liveActive === true ||
                        live.live_active === true ||
                        live.online === true ||
                        live.isLive === true ||
                        live.is_live === true

                    ){

                        return true;

                    }


                    /*
                     * Backend aktif yayınları zaten
                     * /api/live altında döndürüyorsa,
                     * burada ayrıca false yoksa aktif
                     * kabul edilir.
                     */

                    return true;

                }
            );


        let activeLive = null;


        /* =================================================
           1. ÖNCE CANLI ID İLE ARA
        ================================================= */

        if(
            cleanNotificationLiveId
        ){

            activeLive =
                lives.find(
                    function(live){

                        const id =
                            String(

                                live.id ||
                                live.liveId ||
                                live.live_id ||
                                live.broadcastId ||
                                live.broadcast_id ||
                                live.streamId ||
                                live.stream_id ||
                                ''

                            ).trim();


                        return (
                            id ===
                            cleanNotificationLiveId
                        );

                    }
                );

        }


        /* =================================================
           2. ID BULUNAMAZSA KULLANICI ADIYLA ARA
        ================================================= */

        if(
            !activeLive &&
            cleanUsername
        ){

            activeLive =
                lives.find(
                    function(live){

                        const host =
                            String(

                                live.username ||
                                live.user?.username ||
                                live.hostUsername ||
                                live.host_username ||
                                live.broadcaster ||
                                live.broadcasterUsername ||
                                live.broadcaster_username ||
                                live.creator?.username ||
                                live.owner?.username ||
                                ''

                            )
                            .replace(/^@/,'')
                            .trim()
                            .toLowerCase();


                        return (

                            host ===
                            cleanUsername
                                .toLowerCase()

                        );

                    }
                );

        }


        /* =================================================
           3. CANLI YAYIN YOK
        ================================================= */

        if(!activeLive){

            toast(
                'Bu canlı yayın şu anda yok.'
            );

            return;

        }


        /* =================================================
           4. GERÇEK CANLI ID
        ================================================= */

        const activeLiveId =
            String(

                activeLive.id ||
                activeLive.liveId ||
                activeLive.live_id ||
                activeLive.broadcastId ||
                activeLive.broadcast_id ||
                activeLive.streamId ||
                activeLive.stream_id ||
                ''

            ).trim();


        /*
         * Aktif canlı bulundu ama ID yoksa
         * yine Reels'e gönderme.
         */

        if(!activeLiveId){

            toast(
                'Bu canlı yayın şu anda yok.'
            );

            return;

        }


        /*
         * HER ŞEY TAMAM.
         *
         * Artık gerçekten aktif canlı var.
         *
         * Reels ana sayfasına değil,
         * aktif canlı ID'sine gidiyoruz.
         */

        location.href =
            'reels.html?live=' +
            encodeURIComponent(
                activeLiveId
            );

    }

    catch(error){

        console.error(
            '[LIVE CHECK ERROR]',
            error
        );


        /*
         * API kontrolü başarısızsa bile
         * kullanıcıyı Reels'e atma.
         */

        toast(
            'Bu canlı yayın şu anda yok.'
        );

    }

}


/* =====================================================
   BİLDİRİME TIKLAMA
===================================================== */

async function openNotification(
    event,
    element
){

    if(
        event.target.closest(
            '.follow-btn'
        ) ||
        event.target.closest(
            '.comment-like-btn'
        ) ||
        event.target.closest(
            '.live-open'
        )
    ){

        return;

    }


    const id =
        element.dataset.notificationId;


    const username =
        element.dataset.username;


    const postId =
        element.dataset.postId;


    const liveId =
        element.dataset.liveId;


    const type =
        element.dataset.type;


    /*
     * Okundu yap.
     */

    element.classList.remove(
        'unread'
    );


    element
        .querySelector(
            '.unread-dot'
        )
        ?.remove();


    /*
     * Backend okundu.
     */

    if(
        id &&
        !id.startsWith('local-')
    ){

        try{

            await api(

                '/notifications/' +
                encodeURIComponent(id) +
                '/read',

                {
                    method:'POST'
                }

            );

        }catch(error){

            try{

                await api(

                    '/notifications/' +
                    encodeURIComponent(id),

                    {
                        method:'PATCH',

                        headers:{
                            'Content-Type':
                                'application/json'
                        },

                        body:JSON.stringify({
                            read:true
                        })

                    }

                );

            }catch{}

        }

    }


    /* =================================================
       🔴 CANLI
       
       DİKKAT:
       BURADA ASLA REELS'E DOĞRUDAN GİTMİYOR.
       
       ÖNCE CANLI KONTROL EDİLİYOR.
    ================================================= */

    if(type === 'live'){

        await openLiveNotification(
            event,
            username,
            liveId
        );

        return;

    }


    /* =================================================
       GÖNDERİ
    ================================================= */

    if(postId){

        location.href =
            'post.html?id=' +
            encodeURIComponent(
                postId
            );

        return;

    }


    /* =================================================
       PROFİL
    ================================================= */

    if(username){

        location.href =
            profileUrl(username);

    }

}


/* =====================================================
   TÜMÜNÜ OKUNDU
===================================================== */

async function markAllRead(){

    const button =
        document.getElementById(
            'markAllBtn'
        );


    const unread =
        document.querySelectorAll(
            '.notification.unread'
        );


    if(!unread.length){

        toast(
            'Tüm bildirimler zaten okundu.'
        );

        return;

    }


    button.disabled = true;


    unread.forEach(
        function(item){

            item.classList.remove(
                'unread'
            );


            item
                .querySelector(
                    '.unread-dot'
                )
                ?.remove();

        }
    );


    try{

        try{

            await api(
                '/notifications/read-all',
                {
                    method:'POST'
                }
            );

        }

        catch(error){

            await api(
                '/notifications/mark-all-read',
                {
                    method:'POST'
                }
            );

        }


        toast(
            'Tüm bildirimler okundu.'
        );


    }

    catch(error){

        toast(

            error.message ||
            'Bildirimler güncellenemedi.'

        );

    }

    finally{

        button.disabled = false;

    }

}


/* =====================================================
   TAKİP İSTEĞİ
===================================================== */

async function followRequestAction(
    event,
    username,
    decision
){

    event.stopPropagation();


    if(!username){

        return;

    }


    const actions =
        event.currentTarget.closest(
            '.follow-actions'
        );


    if(!actions){

        return;

    }


    const buttons =
        actions.querySelectorAll(
            'button'
        );


    buttons.forEach(
        function(button){

            button.disabled = true;

        }
    );


    try{

        const endpoint =

            decision === 'accept'

                ? '/follow-requests/accept'

                : '/follow-requests/reject';


        await api(
            endpoint,
            {
                method:'POST',

                headers:{
                    'Content-Type':
                        'application/json'
                },

                body:JSON.stringify({
                    username:username
                })
            }
        );


        if(
            decision === 'accept'
        ){

            actions.outerHTML =
                followButtonHTML(
                    username,
                    false,
                    'follow'
                );


            toast(
                '@' +
                username +
                ' takip isteği kabul edildi.'
            );

        }

        else{

            actions.outerHTML = `

                <span
                    style="
                        color:#777;
                        font-size:11px;
                    ">

                    İstek reddedildi

                </span>

            `;


            toast(
                'Takip isteği reddedildi.'
            );

        }

    }

    catch(error){

        buttons.forEach(
            function(button){

                button.disabled = false;

            }
        );


        toast(

            error.message ||
            'Takip isteği işlemi başarısız.'

        );

    }

}


/* =====================================================
   TAKİP
===================================================== */

async function followAction(
    event,
    username,
    currentlyFollowing
){

    event.stopPropagation();


    const button =
        event.currentTarget;


    if(
        !username ||
        button.dataset.loading === '1'
    ){

        return;

    }


    button.dataset.loading =
        '1';


    const next =
        !currentlyFollowing;


    button.textContent =
        next
            ? 'Takiptesin'
            : 'Sen de Takip Et';


    button.classList.toggle(
        'following',
        next
    );


    try{

        let result;


        try{

            result =
                await api(

                    '/users/' +
                    encodeURIComponent(
                        username
                    ) +
                    '/follow',

                    {
                        method:'POST'
                    }

                );

        }

        catch(error){

            result =
                await api(

                    '/follow/' +
                    encodeURIComponent(
                        username
                    ),

                    {
                        method:'POST'
                    }

                );

        }


        if(
            typeof result.following ===
            'boolean'
        ){

            button.classList.toggle(
                'following',
                result.following
            );


            button.textContent =
                result.following
                    ? 'Takiptesin'
                    : 'Sen de Takip Et';

        }


    }

    catch(error){

        button.classList.toggle(
            'following',
            currentlyFollowing
        );


        button.textContent =
            currentlyFollowing
                ? 'Takiptesin'
                : 'Sen de Takip Et';


        toast(

            error.message ||
            'Takip işlemi başarısız.'

        );

    }

    finally{

        button.dataset.loading =
            '0';

    }

}


/* =====================================================
   YORUM BEĞEN
===================================================== */

async function toggleNotificationCommentLike(
    event,
    button
){

    event.stopPropagation();


    const commentId =
        button.dataset.commentId;


    if(!commentId){

        toast(
            'Yorum bulunamadı.'
        );

        return;

    }


    if(
        button.dataset.loading === '1'
    ){

        return;

    }


    button.dataset.loading =
        '1';


    const oldLiked =
        button.dataset.liked === '1';


    const newLiked =
        !oldLiked;


    button.dataset.liked =
        newLiked ? '1' : '0';


    button.classList.toggle(
        'liked',
        newLiked
    );


    button.textContent =
        newLiked ? '♥' : '♡';


    try{

        const result =
            await api(

                '/comments/' +
                encodeURIComponent(
                    commentId
                ) +
                '/like',

                {
                    method:'POST'
                }

            );


        if(
            typeof result.liked ===
            'boolean'
        ){

            button.dataset.liked =
                result.liked
                    ? '1'
                    : '0';


            button.classList.toggle(
                'liked',
                result.liked
            );


            button.textContent =
                result.liked
                    ? '♥'
                    : '♡';

        }

    }

    catch(error){

        button.dataset.liked =
            oldLiked
                ? '1'
                : '0';


        button.classList.toggle(
            'liked',
            oldLiked
        );


        button.textContent =
            oldLiked
                ? '♥'
                : '♡';


        toast(

            error.message ||
            'Yorum beğenilemedi.'

        );

    }

    finally{

        button.dataset.loading =
            '0';

    }

}


/* =====================================================
   SAYFA BAŞLAT
===================================================== */

async function init(){

    getToken();


    if(!token){

        location.replace(
            'giris.html'
        );

        return;

    }


    try{

        currentUser =
            await api('/me');


        if(currentUser){

            localStorage.setItem(

                'minegram_user',

                JSON.stringify(
                    currentUser
                )

            );

        }


        await loadNotifications();

    }

    catch(error){

        console.error(
            '[INIT]',
            error
        );


        /*
         * Sadece gerçekten oturum hatası
         * ise giriş sayfasına gönder.
         */

        const message =
            String(
                error.message || ''
            ).toLowerCase();


        if(

            message.includes(
                'oturum bulunamadı'
            ) ||
            message.includes(
                'unauthorized'
            ) ||
            message.includes(
                '401'
            ) ||
            message.includes(
                'token'
            )

        ){

            localStorage.removeItem(
                'minegram_token'
            );

            localStorage.removeItem(
                'minegram_supabase_token'
            );

            localStorage.removeItem(
                'access_token'
            );

            localStorage.removeItem(
                'minegram_access_token'
            );


            location.replace(
                'giris.html'
            );

            return;

        }


        toast(
            error.message ||
            'Bildirimler yüklenemedi.'
        );

    }

}


/* =====================================================
   BAŞLAT
===================================================== */

init();
