/* =====================================================

===================================================== */

.page{

.avatar.small{

height:40px;

}

.username{

height:18px;

/* =====================================================
   MEDIA
===================================================== */

.media-wrap{
width:100%;

justify-content:center;
align-items:center;

.post-media{

.heart-pop{
position:absolute;
left:50%;
top:50%;

color:#ff1744;
opacity:0;
pointer-events:none;

}

.heart-pop.show{
opacity:1;

}


/* =====================================================
   ACTIONS
===================================================== */

.actions{
height:50px;
display:flex;
align-items:center;
padding:0 12px;
gap:6px
}

.action{
height:42px;
min-width:42px;

background:transparent;

gap:5px;

</style>

<script>

const API='/api';

let token=
localStorage.getItem(
'minegram_token'
);

let currentUser=null;
let currentPost=null;
let currentCommentPost=null;
let currentMenuPost=null;
let currentCommentSort='forYou';
let replyingTo=null;


/* =====================================================
   ESCAPE
===================================================== */

function esc(s=''){

return String(s).replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

}


/* =====================================================
   API
===================================================== */

async function api(
path,
opt={}
){

opt.headers={
...(opt.headers||{}),
...(token
?{Authorization:'Bearer '+token}
:{})
};

const r=
await fetch(
API+path,
opt
);

const j=
await r.json().catch(
()=>({})
);

if(!r.ok){

throw Error(
j.error||
'İşlem başarısız'
);

}

return j;

}


/* =====================================================
   TOAST
===================================================== */

function toast(t){

const e=
document.getElementById(
'toast'
);

e.textContent=t;

e.classList.add('show');

clearTimeout(
window.__toast
);

window.__toast=
setTimeout(
()=>e.classList.remove('show'),
2200
);

}


/* =====================================================
   PROFILE
===================================================== */

function profileUrl(username){

return 'profile.html?user='+
encodeURIComponent(username);

}


/* =====================================================
   TIME
===================================================== */

function relativeTime(v){

const d=new Date(v);

if(!v||isNaN(d))
return '';

let s=
Math.floor(
(Date.now()-d.getTime())/1000
);

if(s<60)
return s+' saniye önce';

let m=Math.floor(s/60);

if(m<60)
return m+' dakika önce';

let h=Math.floor(m/60);

if(h<24)
return h+' saat önce';

let days=Math.floor(h/24);

if(days<7)
return days+' gün önce';

if(days<365)
return Math.floor(days/7)+' hafta önce';

return d.toLocaleDateString('tr-TR');

}


/* =====================================================
   COMMENTS LOCAL
===================================================== */

function localCommentsKey(id){

return 'minegram_comments_'+String(id);

}


function getLocalComments(id){

try{

const x=
JSON.parse(
localStorage.getItem(
localCommentsKey(id)
)||'[]'
);

return Array.isArray(x)
?x
:[];

}catch(e){

return [];

}

}


function saveLocalComment(id,c){

const arr=
getLocalComments(id);

arr.push(c);

localStorage.setItem(
localCommentsKey(id),
JSON.stringify(
arr.slice(-100)
)
);

}


function mergeComments(server,id){

const remote=
Array.isArray(server)
?server
:[];

const local=
getLocalComments(id);

const all=[...remote];

for(const c of local){

const exists=
all.some(
x=>
String(x.id||'')===
String(c.id||'')||

(
x.username===c.username&&
x.text===c.text&&
Math.abs(
new Date(
x.createdAt||
x.created_at||
0
)-
new Date(
c.createdAt||
0
)
)<10000
)
);

if(!exists){

all.push(c);

}

}

return all;

}


/* =====================================================
   COMMENT SORT
===================================================== */

function sortComments(comments){

const a=[...(comments||[])];

if(
currentCommentSort===
'newest'
){

return a.sort(
(x,y)=>
new Date(
y.createdAt||
y.created_at||
0
)-
new Date(
x.createdAt||
x.created_at||
0
)
);

}

if(
currentCommentSort===
'popular'
){

return a.sort(
(x,y)=>
Number(
y.likes||
y.likeCount||
0
)-
Number(
x.likes||
x.likeCount||
0
)
);

}

return a.sort(
(x,y)=>
new Date(
x.createdAt||
x.created_at||
0
)-
new Date(
y.createdAt||
y.created_at||
0
)
);

}


/* =====================================================
   RENDER REPLY
===================================================== */

function renderReply(r){

const u=
esc(
r.username||
r.user?.username||
'minegram'
);

return `

<div class="comment-row">

<div class="avatar small">
${esc(
u[0].toUpperCase()
)}
</div>

<div class="comment-body">

<div class="comment-user">
@${u}
</div>

<div class="comment-text">
${esc(
r.text||
r.content||
''
)}
</div>

<div class="comment-meta">
${relativeTime(
r.createdAt||
r.created_at
)}
</div>

</div>

</div>

`;

}


/* =====================================================
   RENDER COMMENT
===================================================== */

function renderComment(c){

const u=
esc(
c.username||
c.user?.username||
currentUser?.username||
'minegram'
);

const initial=
esc(
u[0].toUpperCase()
);

const liked=
!!c.likedByMe;

const id=
esc(c.id||'');

const replyCount=
Array.isArray(c.replies)
?c.replies.length
:Number(
c.replyCount||0
);

return `

<div
class="comment-wrap"
data-comment-id="${id}"
>

<div class="comment-row">

<div class="avatar small">
${initial}
</div>

<div class="comment-body">

<div
class="comment-user"
onclick="location.href='${profileUrl(u)}'"
>
@${u}
</div>

<div class="comment-text">
${esc(c.text||c.content||'')}
</div>

<div class="comment-meta">

${relativeTime(
c.createdAt||
c.created_at
)}

&nbsp;

<button
class="reply-link"
onclick="startReply('${id}','${esc(u)}')"
>
Yanıtla
</button>

${
replyCount
?`
&nbsp;

<button
class="reply-link"
onclick="toggleReplies('${id}')"
>
${replyCount} yanıt
</button>
`
:''
}

</div>

</div>


<button
type="button"
class="comment-like ${liked?'liked':''}"
data-comment-liked="${liked?'1':'0'}"
onclick="likeComment('${id}')"
>
${liked?'♥':'♡'}
</button>

</div>


<div
id="replies-${id}"
class="replies hidden"
>

${
Array.isArray(c.replies)

async function likePost(id){

if(!id){

toast(
'Gönderi kimliği bulunamadı'
);

return;

}


const article=
document.querySelector(
'.post-card[data-id="'+
CSS.escape(String(id))+
'"]'
);

const btn=
article?.querySelector(
'.action.like'
);

const likesEl=
document.getElementById(
'likesCount'
);

if(!btn)return;


if(
btn.dataset.loading==='1'
){

return;

}

btn.dataset.loading='1';


const wasLiked=
btn.classList.contains(
'liked'
);

const nextLiked=
!wasLiked;


btn.classList.toggle(
'liked',
nextLiked
);

btn.dataset.liked=
nextLiked?'1':'0';


const path=
btn.querySelector('path');

if(path){

path.setAttribute(
'fill',
nextLiked
?'currentColor'
:'none'
);

}


if(likesEl){

const match=
likesEl.textContent.match(/\d+/);

let count=
match
?parseInt(match[0],10)
:0;

count=
Math.max(
0,
count+
(nextLiked?1:-1)
);

likesEl.textContent=
count+' beğenme';

}


try{

const r=
await api(
'/posts/'+
encodeURIComponent(id)+
'/like',
{
method:'POST'
}
);


if(
typeof r.likes==='number'
){

likesEl.textContent=
r.likes+
' beğenme';

}


btn.classList.toggle(
'liked',
nextLiked
);

btn.dataset.liked=
nextLiked?'1':'0';

if(path){

path.setAttribute(
'fill',
nextLiked
?'currentColor'
:'none'
);

}

}catch(e){

btn.classList.toggle(
'liked',
wasLiked
);

btn.dataset.liked=
wasLiked?'1':'0';

if(path){

path.setAttribute(
'fill',
wasLiked
?'currentColor'
:'none'
);

}

if(likesEl){

const match=
likesEl.textContent.match(/\d+/);

let count=
match
?parseInt(match[0],10)
:0;

count=
Math.max(
0,
count+
(nextLiked?-1:1)
);

likesEl.textContent=
count+' beğenme';

}

toast(
e.message||
'Beğeni işlemi başarısız'
);

}finally{

btn.dataset.loading='0';

}

}

);

}

}else{

   NORMAL COMMENT
===================================================== */

saveLocalComment(
postId,
item
);

const list=
document.getElementById(
'commentList'
);

const empty=
list.querySelector('.empty');

if(empty){

empty.remove();

}

list.insertAdjacentHTML(
'beforeend',
renderComment(item)
);

list.scrollTop=
list.scrollHeight;

}


input.value='';

replyingTo=null;

input.placeholder=
'Bunun hakkında ne düşünüyorsun?';


toast(
replyId
?'Yanıt gönderildi'
:'Yorum gönderildi'
);


try{

let result;

if(replyId){

try{

result=
await api(
'/comments/'+
encodeURIComponent(replyId)+
'/reply',
{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
text:textValue
})
}
);

}catch(firstError){

result=
await api(

encodeURIComponent(postId)+
'/comments/'+
encodeURIComponent(replyId)+
'/reply',
{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
text:textValue
})
}
);

}

}else{

result=
await api(
'/posts/'+
encodeURIComponent(postId)+
'/comments',
{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
text:textValue
})
}
);

}


const returned=
result?.comment||
result?.data||
result;


if(
returned &&
typeof returned==='object' &&
returned.id
){

const local=
getLocalComments(postId);

for(const c of local){

String(c.id)===
String(tempId)

c.id=
returned.id;

returned.username||

c.username;

c.text;

returned.createdAt||
returned.created_at||
c.createdAt;

localCommentsKey(postId),

local.slice(-100)
)
);

c.replies=
c.replies.filter(

String(tempId)
);

}else{

local.filter(
c=>
String(c.id)!==
String(tempId)
);

local.length=0;

local.push(...filtered);

localCommentsKey(postId),
JSON.stringify(
local.slice(-100)
)

'commentList'

location.href='profile.html';

}

};


/* =====================================================
   INIT
===================================================== */

async function init(){

if(!token){

location.href='index.html';

return;

}

try{

currentUser=
await api('/me');

}catch(e){

localStorage.removeItem(
'minegram_token'
);

location.href='index.html';

return;

}


/* Avatar */

const composeAvatar=
document.getElementById(
'composeAvatar'
);

if(
composeAvatar &&
currentUser
){

if(currentUser.avatar){

composeAvatar.innerHTML=
`
<img
src="${esc(currentUser.avatar)}"
alt=""
>
`;

}else{

composeAvatar.textContent=
(
currentUser.username||
currentUser.name||
'M'
)[0].toUpperCase();

}

}


await loadPost();

}


init();

</script>
