<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Minegram • Gönderi</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;min-height:100%;overflow-x:hidden;padding-bottom:76px}
button,input{font:inherit}button{cursor:pointer}
.app{min-height:100dvh;background:#000;padding-bottom:78px}
.header{height:62px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #24242a;position:sticky;top:0;background:#000;z-index:20}
.back{border:0;background:none;color:#fff;font-size:39px;line-height:1;width:42px}
.title{font-size:20px;font-weight:700}
.more{margin-left:auto;border:0;background:none;color:#fff;font-size:29px;width:42px}
.post-menu{position:fixed;inset:0;display:none;z-index:80}.post-menu.open{display:block}.post-menu-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.58)}.post-menu-box{position:absolute;top:165px;right:0;width:340px;background:#242229;border-radius:4px;overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.55)}.post-menu-btn{width:100%;height:88px;border:0;background:transparent;color:#fff;display:flex;align-items:center;gap:24px;padding:0 25px;text-align:left;font-size:20px;font-weight:600;letter-spacing:0}.post-menu-btn:hover{background:#2b2931}.post-menu-btn .mi{width:30px;height:30px;display:grid;place-items:center;flex:none}.post-menu-btn .mi svg{width:30px;height:30px;stroke:#fff}.post-menu-btn.danger{color:#fff}.post-menu-btn[aria-pressed="true"]{background:#302e37}.hidden-comments{display:none!important}
.page{width:min(100%,1120px);margin:0 auto;padding:26px 24px 40px}
.post-layout{display:flex;justify-content:center;align-items:flex-start;width:100%;margin:0 auto}
.post-card{border:1px solid #292929;border-radius:8px;overflow:hidden;background:#050505;width:min(720px,100%);margin:0 auto}
.post-head{height:74px;display:flex;align-items:center;padding:0 18px;gap:12px;border-bottom:1px solid #222}
.avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;background:#3d91cf;display:grid;place-items:center;font-weight:700;font-size:19px;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.user{font-size:17px;font-weight:700;flex:1}.verified{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#2388df;font-size:12px;margin-left:4px}
.post-media{width:100%;background:#111;display:flex;justify-content:center;align-items:center;height:620px;min-height:280px;overflow:hidden}
.post-media img,.post-media video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.post-caption{padding:12px 18px 4px;color:#ddd;white-space:pre-wrap;line-height:1.45;font-size:15px}
.post-actions{height:60px;display:flex;align-items:center;padding:0 15px;gap:16px}
.action{border:0;background:none;color:#fff;font-size:30px;padding:0;display:flex;align-items:center;gap:8px}
.action span{font-size:15px;color:#aaa}.send{margin-left:auto;font-size:31px}
.likes{font-size:16px;font-weight:700;padding:0 18px 10px}
.comments{border-top:1px solid #222;padding:14px 18px;color:#999;font-size:14px}
.side{border:1px solid #292929;border-radius:8px;padding:18px;position:sticky;top:84px}
.side-title{font-size:15px;color:#999;margin-bottom:16px}.profile-row{display:flex;align-items:center;gap:12px}.profile-row .avatar{width:48px;height:48px}.profile-row b{font-size:16px}.side-bio{color:#aaa;font-size:13px;line-height:1.4;margin-top:15px}
.empty{text-align:center;color:#777;padding:80px 20px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#24222a;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1}
@media(max-width:899px){.post-menu-box{width:340px;max-width:100vw;right:0;top:165px}.post-menu-btn{height:88px;font-size:20px;padding:0 25px;gap:24px}.page{padding:0 0 30px}.post-layout{display:block}.post-card{border-left:0;border-right:0;border-radius:0}.side{display:none}.post-head{height:68px}.post-media{height:520px;min-height:220px}.post-media img,.post-media video{height:100%;object-fit:cover}.app{padding-bottom:78px}}
@media(min-width:900px){.header{padding:0 24px}.post-card{box-shadow:0 2px 18px rgba(0,0,0,.25)}}
.nav{
position:fixed;
left:0;
right:0;
bottom:0;
height:76px;
background:#121018;
border-top:1px solid #201d27;
display:flex;
flex-direction:row;
align-items:center;
justify-content:space-around;
z-index:100;
padding:5px 8px env(safe-area-inset-bottom);
}
.nav a{
flex:1;
height:100%;
color:#ddd;
text-decoration:none;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px;
font-size:9px;
background:transparent;
border:0;
cursor:pointer;
}
.nav-icon{
width:45px;
height:32px;
border-radius:18px;
display:grid;
place-items:center;
}
.nav a.active .nav-icon{background:#3b3150}
.nav .svg{
width:21px;
height:21px;
fill:none;
stroke:currentColor;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round;
}
@media(min-width:700px){
.nav{
padding-left:calc((100% - 760px)/2);
padding-right:calc((100% - 760px)/2);
}
}
</style>
</head>
<body>
<div class="app">
<header class="header"><button class="back" id="backBtn" aria-label="Geri">‹</button><div class="title">Gönderi</div></header>
<main class="page"><div id="content" class="empty">Gönderi yükleniyor...</div></main>
<nav class="nav">
<a class="" id="homeNav" href="index.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg></span>Ana Sayfa</a>
<a class="" id="searchNav" href="ara.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg></span>Ara</a>
<a class="" id="createNav" href="olustur.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span>Oluştur</a>
<a class="" id="reelsNav" href="reels.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4l3 5M13 4l3 5"/></svg></span>Reels</a>
<a class="" id="profileNav" href="profile.html"><span class="nav-icon"><svg class="svg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span>Profil</a>
</nav></div>
<div id="toast" class="toast"></div>
<div id="postMenu" class="post-menu" aria-hidden="true">
  <div class="post-menu-backdrop" id="postMenuBackdrop"></div>
  <div class="post-menu-box" role="menu">
    <button class="post-menu-btn" id="savePostBtn" role="menuitem"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg></span><span>Kaydet</span></button>
    <button class="post-menu-btn" id="shareMenuBtn" role="menuitem"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.5-4.2M8.2 13.2l7.5 4.2"/></svg></span><span>Gönderiyi paylaş</span></button>
    <button class="post-menu-btn" id="hideCommentsBtn" role="menuitem"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H8l-4 4V4z"/></svg></span><span>Yorum sayısını gizle</span></button>
    <button class="post-menu-btn danger" id="deletePostBtn" role="menuitem"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14M9 7V4h6v3m-8 0 1 14h8l1-14M10 11v6m4-6v6"/></svg></span><span>Gönderiyi sil</span></button>
  </div>
</div>
<script>
const token=localStorage.getItem('minegram_token')||localStorage.getItem('token');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(url,opt);if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||'İşlem başarısız')}return r.json().catch(()=>({}))}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)}
function formatViews(v){const n=Number(v||0);if(!Number.isFinite(n))return '0';if(n>=1000000)return (n/1000000).toFixed(n%1000000?1:0).replace('.0','')+' mn';if(n>=10000)return (n/1000).toFixed(n%1000?1:0).replace('.0','')+' bin';return n.toLocaleString('tr-TR')}
const eye='<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.8"/></svg>';
function load(){
 let post=null,profile={};
 try{post=JSON.parse(sessionStorage.getItem('minegram_selected_post')||'null');profile=JSON.parse(sessionStorage.getItem('minegram_selected_profile')||'{}')}catch(e){}
 if(!post){document.getElementById('content').innerHTML='<div class="empty">Gönderi bulunamadı.</div>';return}
 const username=profile.username||post.username||'minegram';
 const avatar=profile.avatar||post.avatar||'';
 const verified=profile.verified||post.verified;
 const views=post.views??post.viewCount??post.viewsCount??post.impressions??0;
 const postId=post.id??post._id??post.postId??post.uuid??null;
 const media=post.media||post.image||'';
 const keyBase=postId||media||username;
 const savedKey='minegram_saved_post_'+btoa(unescape(encodeURIComponent(String(keyBase)))).slice(0,40);
 const hiddenKey='minegram_hidden_comments_'+btoa(unescape(encodeURIComponent(String(keyBase)))).slice(0,40);
 const type=post.type||'';
 const mediaHtml=media?(type.startsWith('video')||post.video?'<video src="'+esc(media)+'" controls playsinline></video>':'<img src="'+esc(media)+'" alt="Gönderi">'):'<div class="empty">Bu gönderide medya yok.</div>';
 document.getElementById('content').className='post-layout';
 document.getElementById('content').innerHTML=`
 <article class="post-card">
  <div class="post-head"><div class="avatar">${avatar?'<img src="'+esc(avatar)+'" alt="">':esc((profile.displayName||username)[0]?.toUpperCase()||'M')}</div><div class="user">${esc(username)}${verified?'<span class="verified">✓</span>':''}</div><button class="more" id="moreBtn" aria-label="Gönderi seçenekleri" aria-expanded="false">⋮</button></div>
  <div class="post-media">${mediaHtml}</div>
  <div class="post-actions"><button class="action" id="likeBtn">♡</button><button class="action" onclick="toast('Yorumlar yakında')">▢ <span>Yorum</span></button><button class="action send" onclick="sharePost()">➤</button></div>
  <div class="likes">${Number(post.likes??post.likeCount??0).toLocaleString('tr-TR')} beğenme</div>
  ${post.caption?'<div class="post-caption"><b>'+esc(username)+'</b> '+esc(post.caption)+'</div>':''}
  <div class="comments" id="commentsCount">${Number(post.comments??post.commentCount??0).toLocaleString('tr-TR')} yorum</div>
 </article>`;
 document.getElementById('likeBtn').onclick=function(){this.textContent=this.textContent==='♡'?'♥':'♡';};
 const menu=document.getElementById('postMenu');
 const saveBtn=document.getElementById('savePostBtn');
 const hideBtn=document.getElementById('hideCommentsBtn');
 const commentsEl=document.getElementById('commentsCount');
 const isSaved=localStorage.getItem(savedKey)==='1';
 const isHidden=localStorage.getItem(hiddenKey)==='1';
 saveBtn.setAttribute('aria-pressed',String(isSaved));
 saveBtn.querySelector('span:last-child').textContent=isSaved?'Kaydedildi':'Kaydet';
 if(isHidden){commentsEl.classList.add('hidden-comments');hideBtn.querySelector('span:last-child').textContent='Yorum sayısını göster';hideBtn.setAttribute('aria-pressed','true');}
 document.getElementById('moreBtn').onclick=()=>{menu.classList.add('open');menu.setAttribute('aria-hidden','false');document.getElementById('moreBtn').setAttribute('aria-expanded','true')};
 function closePostMenu(){menu.classList.remove('open');menu.setAttribute('aria-hidden','true');document.getElementById('moreBtn').setAttribute('aria-expanded','false')}
 document.getElementById('postMenuBackdrop').onclick=closePostMenu;
 saveBtn.onclick=()=>{const next=localStorage.getItem(savedKey)!=='1';if(next)localStorage.setItem(savedKey,'1');else localStorage.removeItem(savedKey);saveBtn.querySelector('span:last-child').textContent=next?'Kaydedildi':'Kaydet';saveBtn.setAttribute('aria-pressed',String(next));toast(next?'Gönderi kaydedildi':'Kayıt kaldırıldı');closePostMenu()};
 document.getElementById('shareMenuBtn').onclick=async()=>{closePostMenu();await sharePost()};
 hideBtn.onclick=()=>{const next=!commentsEl.classList.contains('hidden-comments');commentsEl.classList.toggle('hidden-comments',next);if(next)localStorage.setItem(hiddenKey,'1');else localStorage.removeItem(hiddenKey);hideBtn.querySelector('span:last-child').textContent=next?'Yorum sayısını göster':'Yorum sayısını gizle';hideBtn.setAttribute('aria-pressed',String(next));toast(next?'Yorum sayısı gizlendi':'Yorum sayısı gösteriliyor');closePostMenu()};
 document.getElementById('deletePostBtn').onclick=async()=>{closePostMenu();if(!confirm('Bu gönderiyi silmek istediğine emin misin?'))return;if(!postId){toast('Gönderi kimliği bulunamadı');return}try{await api('/api/posts/'+encodeURIComponent(postId),{method:'DELETE'});sessionStorage.removeItem('minegram_selected_post');toast('Gönderi silindi');setTimeout(()=>location.href='profile.html',500)}catch(e){toast(e.message||'Gönderi silinemedi')}};
}
async function sharePost(){try{if(navigator.share)await navigator.share({title:'Minegram gönderisi',url:location.href});else{await navigator.clipboard.writeText(location.href);toast('Bağlantı kopyalandı')}}catch(e){}}
document.getElementById('backBtn').onclick=()=>history.length>1?history.back():location.href='profile.html';
document.getElementById('homeNav').onclick=()=>location.href='index.html';
document.getElementById('searchNav').onclick=()=>location.href='ara.html';
document.getElementById('createNav').onclick=()=>location.href='olustur.html';
document.getElementById('reelsNav').onclick=()=>location.href='reels.html';
document.getElementById('profileNav').onclick=()=>location.href='profile.html';
load();
</script>
</body></html>
