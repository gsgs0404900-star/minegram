<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Minegram • Gönderi</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100%;
  overflow-x:hidden;
}

body{
  padding-bottom:76px;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:focus-visible,
a:focus-visible{
  outline:2px solid #777;
  outline-offset:2px;
}

/* APP */
.app{
  min-height:100dvh;
  background:#000;
  padding-bottom:76px;
}

/* HEADER */
.header{
  height:62px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #24242a;
  position:sticky;
  top:0;
  background:#000;
  z-index:20;
}

.back{
  width:42px;
  height:46px;
  border:0;
  background:none;
  color:#fff;
  font-size:39px;
  line-height:1;
  padding:0;
}

.title{
  font-size:20px;
  font-weight:700;
}

/* PAGE */
.page{
  width:min(100%,1120px);
  margin:0 auto;
  padding:26px 24px 40px;
}

.post-layout{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  width:100%;
  margin:0 auto;
}

.post-card{
  width:100%;
  border:1px solid #171717;
  border-radius:2px;
  background:#000;
  margin:0 auto;
  overflow:hidden;
}

/* POST HEADER */
.post-head{
  min-height:66px;
  display:flex;
  align-items:center;
  padding:10px 14px;
  gap:10px;
  border-bottom:1px solid #161616;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  overflow:hidden;
  background:#3f91cc;
  display:grid;
  place-items:center;
  font-weight:700;
  font-size:19px;
  flex:none;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user{
  min-width:0;
  font-size:17px;
  font-weight:700;
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.verified{
  display:inline-grid;
  place-items:center;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#2388df;
  font-size:12px;
  margin-left:5px;
  vertical-align:-2px;
}

/* MORE */
.more{
  width:42px;
  height:42px;
  margin-left:auto;
  border:0;
  background:none;
  color:#eee;
  font-size:25px;
  line-height:1;
  flex:none;
}

/* MEDIA */
.post-media{
  width:100%;
  background:#080808;
  display:flex;
  justify-content:center;
  align-items:center;
  max-height:610px;
  min-height:220px;
  overflow:hidden;
}

.post-media img,
.post-media video{
  display:block;
  width:100%;
  max-height:610px;
  object-fit:contain;
  background:#080808;
}

.post-media video{
  outline:none;
}

/* CAPTION */
.post-caption{
  font-size:14px;
  line-height:1.45;
  padding:7px 14px 14px;
  color:#ddd;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.post-caption b{
  color:#fff;
}

/* ACTIONS */
.post-actions{
  height:52px;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:3px;
}

.action{
  height:44px;
  min-width:42px;
  border:0;
  background:transparent;
  color:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:0 5px;
  cursor:pointer;
  font-size:14px;
  transition:transform .12s ease,opacity .12s ease;
}

.action:active{
  transform:scale(.92);
}

.action .post-action-svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.action.liked{
  color:#ff3040;
}

.action.liked .post-action-svg{
  fill:#ff3040;
  stroke:#ff3040;
}

.send{
  margin-left:auto;
}

.send-icon{
  width:30px;
  height:23px;
  display:block;
  fill:currentColor;
}

/* LIKE / COMMENTS */
.likes{
  font-size:14px;
  font-weight:700;
  padding:0 14px;
  margin-top:-2px;
}

.comments{
  padding:0 14px 12px;
  color:#999;
  font-size:13px;
  cursor:pointer;
}

.hidden-comments{
  display:none!important;
}

/* EMPTY */
.empty{
  text-align:center;
  color:#777;
  padding:80px 20px;
}

/* SIDE */
.side{
  border:1px solid #292929;

}

.side-title{

}

.profile-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.profile-row .avatar{
  width:48px;
  height:48px;
}

.profile-row b{
  font-size:16px;
}

.side-bio{
  color:#aaa;
  font-size:13px;
  line-height:1.4;
  margin-top:15px;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translateX(-50%) translateY(8px);
  background:#24222a;
  color:#fff;
  padding:11px 16px;
  border-radius:10px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.2s ease;
  z-index:200;
  max-width:calc(100vw - 30px);
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* POST MENU */
.post-menu{
  position:fixed;
  inset:0;
  display:none;
  z-index:180;
}

.post-menu.open{
  display:block;
}

.post-menu-backdrop{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.58);
}

.post-menu-box{
  position:absolute;
  top:165px;

  overflow:hidden;
  box-shadow:0 10px 35px rgba(0,0,0,.55);
}

.post-menu-btn{

  gap:24px;
  padding:0 25px;
  text-align:left;

}

.post-menu-btn:hover{

}

.post-menu-btn .mi{
  width:30px;

  flex:none;
}

.post-menu-btn .mi svg{
  width:30px;

  stroke:#fff;
}

.post-menu-btn[aria-pressed="true"]{
  background:#302e37;
}

/* BOTTOM NAV */
.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  background:#121018;
  border-top:1px solid #201d27;
  display:flex;
  flex-direction:row;
  align-items:center;

}

.nav a{

  display:flex;
  flex-direction:column;

  gap:3px;

  background:transparent;
  border:0;
  cursor:pointer;
}

.nav-icon{
  width:45px;

  place-items:center;
}

.nav a.active .nav-icon{
  background:#3b3150;
}

.nav .svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* MOBILE */
@media(max-width:899px){

  .page{
    padding:0 0 30px;
  }

  .post-layout{
    display:block;
  }

  .post-card{
    border-left:0;
    border-right:0;

  }

  .post-head{
    min-height:60px;
  }

  .post-media{
    max-height:520px;
    min-height:220px;
  }

  .post-media img,
  .post-media video{
    max-height:520px;
    object-fit:contain;
  }

  .post-menu-box{
    top:62px;
    right:0;
    width:340px;
    max-width:100vw;
    border-radius:0 0 6px 6px;
  }

  .post-menu-btn{
    min-height:72px;
    font-size:18px;
  }

  .app{
    padding-bottom:76px;
  }
}

/* DESKTOP */
@media(min-width:900px){

  .header{
    padding:0 24px;
  }

  .post-card{
    box-shadow:0 2px 18px rgba(0,0,0,.25);
  }
}

/* TABLET NAV */
@media(min-width:700px){

  .nav{
    padding-left:calc((100% - 760px)/2);
    padding-right:calc((100% - 760px)/2);
  }
}

/* SMALL PHONES */
@media(max-width:380px){

  .post-menu-btn{
    gap:18px;

    font-size:17px;
  }

  .post-menu-btn .mi{
    width:27px;
  }

  .post-menu-btn .mi svg{
    width:27px;
    height:27px;
  }

  .nav a{
    font-size:8px;
  }
}
</style>
</head>

<script>
/* =========================
   AUTH
========================= */

const token =
  localStorage.getItem('minegram_token') ||
  localStorage.getItem('token') ||
  '';

/* =========================
   HELPERS
========================= */

const esc = value =>
  String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[char]));

function toast(message){
  const element = document.getElementById('toast');

  element.textContent = message;
  element.classList.add('show');

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(() => {
    element.classList.remove('show');
  },2000);
}

function formatNumber(value){
  const number = Number(value ?? 0);

  if(!Number.isFinite(number)){
    return '0';
  }

  return number.toLocaleString('tr-TR');
}

function makeStorageKey(prefix,value){
  const raw = String(value ?? '');

  let encoded = '';

  try{
    encoded = btoa(
      unescape(
        encodeURIComponent(raw)
      )
    );
  }catch{
    encoded = btoa(
      raw.replace(/[^\x00-\xFF]/g,'')
    );
  }

  return prefix + encoded.slice(0,50);
}

/* =========================
   API
========================= */

async function api(url,options = {}){

  const config = {
    ...options,
    headers:{
      ...(options.headers || {})
    }
  };

  if(token){
    config.headers.Authorization = 'Bearer ' + token;
  }

  if(
    config.body &&
    typeof config.body !== 'string'
  ){
    config.headers['Content-Type'] = 'application/json';
    config.body = JSON.stringify(config.body);
  }

  const response = await fetch(url,config);

  if(!response.ok){

    const data =
      await response.json().catch(() => ({}));

    throw new Error(
      data.error ||
      data.message ||
      'İşlem başarısız'
    );
  }

  return response
    .json()
    .catch(() => ({}));
}

/* =========================
   SELECTED POST
========================= */

let currentPost = null;
let currentPostId = null;
let currentSavedKey = '';
let currentHiddenKey = '';

/* =========================
   LOAD POST
========================= */

function load(){

  let post = null;
  let profile = {};

  try{

    post = JSON.parse(
      sessionStorage.getItem(
        'minegram_selected_post'
      ) || 'null'
    );

    profile = JSON.parse(
      sessionStorage.getItem(
        'minegram_selected_profile'
      ) || '{}'
    );

  }catch(error){

    post = null;
    profile = {};

  }

  if(!post){

    document.getElementById('content').innerHTML =
      '<div class="empty">Gönderi bulunamadı.</div>';

    return;
  }

  currentPost = post;

  const username =
    profile.username ||
    post.username ||
    'minegram';

  const displayName =
    profile.displayName ||
    post.displayName ||
    username;

  const avatar =
    profile.avatar ||
    post.avatar ||
    '';

  const verified =
    Boolean(
      profile.verified ??
      post.verified
    );

  const views =
    post.views ??
    post.viewCount ??
    post.viewsCount ??
    post.impressions ??
    0;

  currentPostId =
    post.id ??
    post._id ??
    post.postId ??
    post.uuid ??
    null;

  const media =
    post.media ||
    post.image ||
    post.video ||
    '';

  const type =
    String(post.type || '').toLowerCase();

  const isVideo =
    type.startsWith('video') ||
    Boolean(post.video) ||
    /\.(mp4|webm|ogg|mov)(\?|#|$)/i.test(
      String(media)
    );

  const keyBase =
    currentPostId ||
    media ||
    username ||
    'post';

  currentSavedKey =
    makeStorageKey(
      'minegram_saved_post_',
      keyBase
    );

  currentHiddenKey =
    makeStorageKey(
      'minegram_hidden_comments_',
      keyBase
    );

  let mediaHtml = '';

  if(media){

    if(isVideo){

      mediaHtml = `
        <video
          src="${esc(media)}"
          controls
          playsinline
          preload="metadata"
        ></video>
      `;

    }else{

      mediaHtml = `
        <img
          src="${esc(media)}"
          alt="Gönderi"
          loading="eager"
          onerror="this.parentElement.innerHTML='<div class=&quot;empty&quot;>Medya yüklenemedi.</div>'"
        >
      `;

    }

  }else{

    mediaHtml =
      '<div class="empty">Bu gönderide medya yok.</div>';

  }

  const likes =
    Number(
      post.likes ??
      post.likeCount ??
      0
    );

  const comments =
    Number(
      post.comments ??
      post.commentCount ??
      0
    );

  const liked =
    Boolean(
      post.liked ??
      post.isLiked ??
      false
    );

  document.getElementById('content').className =
    'post-layout';

  document.getElementById('content').innerHTML = `

    <article class="post-card">

      <div class="post-head">

        <div class="avatar">
          ${
            avatar
            ? `<img src="${esc(avatar)}" alt="">`
            : esc(
                String(displayName || username)
                .charAt(0)
                .toUpperCase() || 'M'
              )
          }
        </div>

        <div class="user">
          ${esc(username)}
          ${
            verified
            ? '<span class="verified" aria-label="Doğrulanmış">✓</span>'
            : ''
          }
        </div>

        <button
          class="more"
          id="moreBtn"
          aria-label="Gönderi seçenekleri"
          aria-expanded="false"
          type="button"
        >⋯</button>

      </div>

      <div class="post-media">
        ${mediaHtml}
      </div>

      <div class="post-actions">

        <button
          class="action ${liked ? 'liked' : ''}"
          id="likeBtn"
          aria-label="${liked ? 'Beğeniyi kaldır' : 'Gönderiyi beğen'}"
          aria-pressed="${liked}"
          type="button"
        >

          <svg
            class="post-action-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M20.8 8.8c0 5.4-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.8A4.8 4.8 0 0 1 8 4c1.5 0 2.9.7 4 2 1.1-1.3 2.5-2 4-2a4.8 4.8 0 0 1 4.8 4.8Z"/>
          </svg>

        </button>

        <button
          class="action"
          id="commentBtn"
          aria-label="Yorumlar"
          type="button"
        >

          <svg
            class="post-action-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M4 5h16v11H8l-4 4Z"/>
          </svg>

        </button>

        <button
          class="action send"
          id="sharePostBtn"
          aria-label="Gönderiyi paylaş"
          type="button"
        >

          <svg
            class="send-icon"
            viewBox="0 0 32 24"
            aria-hidden="true"
          >
            <path d="M2 2.2 29.8 12 2 21.8l4.4-8.1 13.1-1.7-13.1-1.7Z"/>
          </svg>

        </button>

      </div>

      <div class="likes" id="likesCount">
        ${formatNumber(likes)} beğenme
      </div>

      ${
        post.caption
        ? `
          <div class="post-caption">
            <b>${esc(username)}</b>
            ${esc(post.caption)}
          </div>
        `
        : ''
      }

      <div
        class="comments"
        id="commentsCount"
        role="button"
        tabindex="0"
      >
        ${formatNumber(comments)} yorum
      </div>

    </article>
  `;

  setupPostActions();

  setupPostMenu();

  setupCommentAction();

  setupImageErrorHandling();

  /* VIEW */
  if(
    currentPostId &&
    !sessionStorage.getItem(
      'minegram_viewed_' + currentPostId
    )
  ){

    sessionStorage.setItem(
      'minegram_viewed_' + currentPostId,
      '1'
    );

    /* API'nizde görüntülenme endpoint'i varsa
       burada kullanılabilir. */
  }

  void views;
}

/* =========================
   POST ACTIONS
========================= */

function setupPostActions(){

  const likeBtn =
    document.getElementById('likeBtn');

  const shareBtn =
    document.getElementById('sharePostBtn');

  if(likeBtn){

    likeBtn.addEventListener(
      'click',
      () => {

        const next =
          likeBtn.getAttribute('aria-pressed')
          !== 'true';

        likeBtn.setAttribute(
          'aria-pressed',
          String(next)
        );

        likeBtn.classList.toggle(
          'liked',
          next
        );

        likeBtn.setAttribute(
          'aria-label',
          next
          ? 'Beğeniyi kaldır'
          : 'Gönderiyi beğen'
        );

        const likesElement =
          document.getElementById(
            'likesCount'
          );

        if(likesElement){

          let count =
            Number(
              currentPost.likes ??
              currentPost.likeCount ??
              0
            );

          if(next && !currentPost.liked){
            count++;
          }

          if(!next && currentPost.liked){
            count = Math.max(0,count - 1);
          }

          currentPost.liked = next;
          currentPost.likes = count;

          likesElement.textContent =
            formatNumber(count) +
            ' beğenme';
        }

      }
    );
  }

  if(shareBtn){

    shareBtn.addEventListener(
      'click',
      sharePost
    );

  }
}

   COMMENTS
========================= */

function setupCommentAction(){

  const commentBtn =
    document.getElementById(
      'commentBtn'
    );

  const comments =
    document.getElementById(
      'commentsCount'
    );

  const openComments = () => {

    toast('Yorumlar yakında');

  if(commentBtn){

  if(comments){

    comments.addEventListener(

          event.key === ' '
        ){

          event.preventDefault();
          openComments();

        }

      }
    );
  }
}

/* =========================
   MENU
========================= */

function setupPostMenu(){

  const menu =
    document.getElementById(
      'postMenu'
    );

  const moreBtn =
    document.getElementById(
      'moreBtn'
    );

  const saveBtn =
    document.getElementById(
      'savePostBtn'
    );

  const shareMenuBtn =
    document.getElementById(
      'shareMenuBtn'
    );

  const hideBtn =
    document.getElementById(
      'hideCommentsBtn'
    );

  const deleteBtn =
    document.getElementById(
      'deletePostBtn'
    );

  const commentsEl =
    document.getElementById(
      'commentsCount'
    );

  const closeMenu = () => {

    menu.classList.remove('open');

    menu.setAttribute(
      'aria-hidden',
      'true'
    );

    if(moreBtn){

      moreBtn.setAttribute(
        'aria-expanded',
        'false'
      );

    }

  };

  const openMenu = () => {

    menu.classList.add('open');

    menu.setAttribute(
      'aria-hidden',
      'false'
    );

    if(moreBtn){

      moreBtn.setAttribute(
        'aria-expanded',
        'true'
      );

    }

  };

  /* SAVED */

  const isSaved =
    localStorage.getItem(
      currentSavedKey
    ) === '1';

  saveBtn.setAttribute(
    'aria-pressed',
    String(isSaved)
  );

  saveBtn.querySelector(
    'span:last-child'
  ).textContent =
    isSaved
    ? 'Kaydedildi'
    : 'Kaydet';

  /* HIDDEN COMMENTS */

  const isHidden =
    localStorage.getItem(
      currentHiddenKey
    ) === '1';

  if(isHidden){

    commentsEl.classList.add(
      'hidden-comments'
    );

    hideBtn.querySelector(
      'span:last-child'
    ).textContent =
      'Yorum sayısını göster';

    hideBtn.setAttribute(
      'aria-pressed',
      'true'
    );

  }else{

    hideBtn.setAttribute(
      'aria-pressed',
      'false'
    );

  }

  if(moreBtn){
    moreBtn.addEventListener(
      'click',
      openMenu
    );
  }

  document
    .getElementById('postMenuBackdrop')
    .addEventListener(
      'click',
      closeMenu
    );

  /* SAVE */

  saveBtn.addEventListener(
    'click',
    () => {

      const next =
        localStorage.getItem(
          currentSavedKey
        ) !== '1';

      if(next){

        localStorage.setItem(
          currentSavedKey,
          '1'
        );

      }else{

        localStorage.removeItem(
          currentSavedKey
        );

      }

      saveBtn.querySelector(
        'span:last-child'
      ).textContent =
        next
        ? 'Kaydedildi'
        : 'Kaydet';

      saveBtn.setAttribute(
        'aria-pressed',
        String(next)
      );

      toast(
        next
        ? 'Gönderi kaydedildi'
        : 'Kayıt kaldırıldı'
      );

      closeMenu();

    }
  );

  /* SHARE */

  shareMenuBtn.addEventListener(
    'click',
    async () => {

      closeMenu();

      await sharePost();

    }
  );

  /* HIDE COMMENTS */

  hideBtn.addEventListener(
    'click',
    () => {

      const next =
        !commentsEl.classList.contains(
          'hidden-comments'
        );

      commentsEl.classList.toggle(
        'hidden-comments',
        next
      );

      if(next){

        localStorage.setItem(
          currentHiddenKey,
          '1'
        );

      }else{

        localStorage.removeItem(
          currentHiddenKey
        );

      }

      hideBtn.querySelector(
        'span:last-child'
      ).textContent =
        next
        ? 'Yorum sayısını göster'
        : 'Yorum sayısını gizle';

      hideBtn.setAttribute(
        'aria-pressed',
        String(next)
      );

      toast(
        next
        ? 'Yorum sayısı gizlendi'
        : 'Yorum sayısı gösteriliyor'
      );

      closeMenu();

    }
  );

  /* DELETE */

  deleteBtn.addEventListener(
    'click',
    async () => {

      closeMenu();

      const confirmed =
        window.confirm(
          'Bu gönderiyi silmek istediğine emin misin?'
        );

      if(!confirmed){
        return;
      }

      if(!currentPostId){

        toast(
          'Gönderi kimliği bulunamadı'
        );

        return;
      }

      try{

        await api(
          '/api/posts/' +
          encodeURIComponent(
            currentPostId
          ),
          {
            method:'DELETE'
          }
        );

        sessionStorage.removeItem(
          'minegram_selected_post'
        );

        toast(
          'Gönderi silindi'
        );

        setTimeout(
          () => {
            location.href =
              'profile.html';
          },
          500
        );

      }catch(error){

        toast(
          error.message ||
          'Gönderi silinemedi'
        );

      }

    }
  );
}

/* =========================
   SHARE
========================= */

async function sharePost(){

  try{

    const shareData = {
      title:'Minegram gönderisi',
      text:'Minegram gönderisi',
      url:location.href
    };

    if(
      navigator.share &&
      typeof navigator.share === 'function'
    ){

      await navigator.share(
        shareData
      );

      return;
    }

    if(
      navigator.clipboard &&
      navigator.clipboard.writeText
    ){

      await navigator.clipboard.writeText(
        location.href
      );

      toast(
        'Bağlantı kopyalandı'
      );

      return;
    }

    toast(
      'Paylaşım desteklenmiyor'
    );

  }catch(error){

    if(
      error &&
      error.name === 'AbortError'
    ){
      return;
    }

    try{

      const textarea =
        document.createElement(
          'textarea'
        );

      textarea.value =
        location.href;

      textarea.style.position =
        'fixed';

      textarea.style.opacity =
        '0';

      document.body.appendChild(
        textarea
      );

      textarea.select();

      document.execCommand(
        'copy'
      );

      textarea.remove();

      toast(
        'Bağlantı kopyalandı'
      );

    }catch{

      toast(
        'Paylaşım başarısız'
      );

    }

  }
}
