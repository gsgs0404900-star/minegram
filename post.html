<script>

const API = '/api';

const token =
    localStorage.getItem('minegram_token') ||
    localStorage.getItem('token');

let post = null;
let currentPostId = null;


/* =====================================================
   ESCAPE
===================================================== */

function esc(s = '') {

    return String(s ?? '').replace(
        /[&<>"']/g,
        c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[c])
    );

}


/* =====================================================
   API
===================================================== */

async function api(path, options = {}) {

    options.headers = {
        ...(options.headers || {}),
        ...(token
            ? { Authorization: 'Bearer ' + token }
            : {})
    };

    if (
        options.body &&
        typeof options.body !== 'string'
    ) {

        options.headers['Content-Type'] =
            'application/json';

        options.body =
            JSON.stringify(options.body);

    }

    const response =
        await fetch(
            API + path,
            options
        );

    const data =
        await response
            .json()
            .catch(() => ({}));

    if (!response.ok) {

        throw new Error(
            data.error ||
            'İşlem başarısız'
        );

    }

    return data;

}


/* =====================================================
   TOAST
===================================================== */

function toast(message) {

    const el =
        document.getElementById('toast');

    el.textContent = message;

    el.classList.add('show');

    clearTimeout(window.__toast);

    window.__toast =
        setTimeout(
            () => el.classList.remove('show'),
            2200
        );

}


/* =====================================================
   MEDIA URL
===================================================== */

function getMediaUrl(value) {

    if (!value) {
        return '';
    }

    /* API bazen object döndürebilir */

    if (typeof value === 'object') {

        return (
            value.url ||
            value.src ||
            value.path ||
            value.location ||
            value.secure_url ||
            ''
        );

    }

    let url = String(value);

    /*
       Tam URL ise olduğu gibi bırak
    */

    if (
        url.startsWith('http://') ||
        url.startsWith('https://') ||
        url.startsWith('blob:') ||
        url.startsWith('data:')
    ) {

        return url;

    }

    /*
       /uploads/... gibi ise
       doğrudan kullan
    */

    if (url.startsWith('/')) {

        return url;

    }

    /*
       uploads/... ise
    */

    if (
        url.startsWith('uploads/') ||
        url.startsWith('media/')
    ) {

        return '/' + url;

    }

    /*
       Geri kalan relatif yollar
    */

    return '/' + url;

}


/* =====================================================
   MEDIA TYPE
===================================================== */

function isVideo(post) {

    const type =
        String(
            post.type ||
            post.mediaType ||
            ''
        ).toLowerCase();

    const name =
        String(
            post.mediaName ||
            post.filename ||
            post.fileName ||
            post.media?.name ||
            ''
        ).toLowerCase();

    if (
        type.includes('video')
    ) {

        return true;

    }

    return /\.(mp4|webm|mov|m4v|ogg)$/i.test(name);

}


/* =====================================================
   POST DATA NORMALIZE
===================================================== */

function normalizePost(raw) {

    /*
       API bazen:

       { id, user, media, ... }

       bazen:

       { post: {...} }

       döndürebilir.
    */

    const p =
        raw?.post &&
        typeof raw.post === 'object'
            ? raw.post
            : raw;

    if (!p) {
        return null;
    }

    const user =
        p.user ||
        p.author ||
        {};

    const username =
        user.username ||
        p.username ||
        'minegram';

    const avatar =
        user.avatar ||
        user.avatarUrl ||
        p.avatar ||
        p.avatarUrl ||
        '';

    const media =
        getMediaUrl(
            p.media ||
            p.image ||
            p.imageUrl ||
            p.photo ||
            p.video ||
            ''
        );

    const likes =
        Array.isArray(p.likes)
            ? p.likes.length
            : Number(
                p.likes ??
                p.likeCount ??
                0
            );

    const comments =
        Array.isArray(p.comments)
            ? p.comments.length
            : Number(
                p.commentsCount ??
                p.commentCount ??
                p.comments ??
                0
            );

    return {

        ...p,

        id:
            p.id ??
            p._id ??
            p.postId ??
            p.uuid,

        username,

        avatar,

        media,

        mediaName:
            p.mediaName ||
            p.filename ||
            p.fileName ||
            '',

        verified:
            !!(
                user.verified ||
                p.verified
            ),

        likes,

        comments,

        likedByMe:
            !!(
                p.likedByMe ||
                p.isLiked ||
                p.liked
            )

    };

}


/* =====================================================
   POST ID
===================================================== */

function getPostId() {

    const params =
        new URLSearchParams(
            location.search
        );

    return (
        params.get('id') ||
        params.get('postId')
    );

}


/* =====================================================
   LOAD SELECTED POST
===================================================== */

async function loadPost() {

    const content =
        document.getElementById('content');

    /*
       Önce sessionStorage
    */

    try {

        const saved =
            sessionStorage.getItem(
                'minegram_selected_post'
            );

        if (saved) {

            const parsed =
                JSON.parse(saved);

            post =
                normalizePost(parsed);

        }

    } catch (e) {

        post = null;

    }


    /*
       URL'deki ID varsa onu önceliklendir.
       Böylece post.html?id=123 çalışır.
    */

    const urlId =
        getPostId();


    if (urlId) {

        try {

            const result =
                await api(
                    '/posts/' +
                    encodeURIComponent(urlId)
                );

            post =
                normalizePost(result);

        } catch (e) {

            /*
               Eğer API endpoint yoksa
               sessionStorage'daki gönderiyi kullan.
            */

            if (!post) {

                content.innerHTML = `
                    <div class="empty">
                        Gönderi yüklenemedi.<br>
                        <small>${esc(e.message)}</small>
                    </div>
                `;

                return;

            }

        }

    }


    if (!post || !post.id) {

        content.innerHTML = `
            <div class="empty">
                Gönderi bulunamadı.
            </div>
        `;

        return;

    }


    currentPostId =
        String(post.id);


    renderPost();

}


/* =====================================================
   RENDER POST
===================================================== */

function renderPost() {

    const content =
        document.getElementById('content');

    const username =
        post.username ||
        'minegram';

    const initial =
        String(username)
            .charAt(0)
            .toUpperCase();

    const avatar =
        getMediaUrl(post.avatar);

    let avatarHtml = '';

    if (avatar) {

        avatarHtml = `
            <img
                src="${esc(avatar)}"
                alt=""
                onerror="this.style.display='none'"
            >
        `;

    } else {

        avatarHtml =
            esc(initial || 'M');

    }


    /*
       MEDIA
    */

    let mediaHtml = '';

    if (post.media) {

        if (isVideo(post)) {

            mediaHtml = `
                <video
                    src="${esc(post.media)}"
                    controls
                    playsinline
                    preload="metadata"
                ></video>
            `;

        } else {

            mediaHtml = `
                <img
                    src="${esc(post.media)}"
                    alt="Gönderi"
                    loading="eager"
                    onerror="
                        this.style.display='none';
                        this.parentElement.insertAdjacentHTML(
                            'beforeend',
                            '<div class=&quot;empty&quot;>Resim yüklenemedi.</div>'
                        );
                    "
                >
            `;

        }

    } else {

        mediaHtml = `
            <div class="empty">
                Bu gönderide medya yok.
            </div>
        `;

    }


    const liked =
        !!post.likedByMe;


    content.className =
        'post-layout';


    content.innerHTML = `

        <article
            class="post-card"
            id="postCard"
        >

            <div class="post-head">

                <div class="avatar">
                    ${avatarHtml}
                </div>

                <div class="user">
                    ${esc(username)}

                    ${
                        post.verified
                            ? '<span class="verified">✓</span>'
                            : ''
                    }
                </div>

                <button
                    class="more"
                    id="moreBtn"
                    type="button"
                    aria-label="Gönderi seçenekleri"
                    aria-expanded="false"
                >
                    ⋯
                </button>

            </div>


            <div class="post-media">

                ${mediaHtml}

            </div>


            <div class="post-actions">

                <button
                    class="action ${liked ? 'liked' : ''}"
                    id="likeBtn"
                    type="button"
                    aria-label="Gönderiyi beğen"
                >

                    <svg
                        class="post-action-svg"
                        viewBox="0 0 24 24"
                    >

                        <path
                            d="M20.8 8.8c0 5.4-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.8A4.8 4.8 0 0 1 8 4c1.5 0 2.9.7 4 2 1.1-1.3 2.5-2 4-2a4.8 4.8 0 0 1 4.8 4.8Z"
                            ${
                                liked
                                    ? 'fill="currentColor"'
                                    : ''
                            }
                        >
                        </path>

                    </svg>

                </button>


                <button
                    class="action"
                    id="commentsBtn"
                    type="button"
                    aria-label="Yorumlar"
                >

                    <svg
                        class="post-action-svg"
                        viewBox="0 0 24 24"
                    >

                        <path
                            d="M4 5h16v11H8l-4 4Z"
                        >
                        </path>

                    </svg>

                </button>


                <button
                    class="action send"
                    id="sharePostBtn"
                    type="button"
                    aria-label="Gönderiyi paylaş"
                >

                    <svg
                        class="send-icon"
                        viewBox="0 0 32 24"
                    >

                        <path
                            d="M2 2.2 29.8 12 2 21.8l4.4-8.1 13.1-1.7-13.1-1.7Z"
                        >
                        </path>

                    </svg>

                </button>

            </div>


            <div
                class="likes"
                id="likesCount"
            >
                ${Number(post.likes || 0).toLocaleString('tr-TR')}
                beğenme
            </div>


            ${
                post.caption
                    ? `
                        <div class="post-caption">
                            <b>${esc(username)}</b>
                            ${esc(post.caption)}
                        </div>
                    `
                    : ''
            }


            <div
                class="comments"
                id="commentsCount"
            >
                ${Number(post.comments || 0).toLocaleString('tr-TR')}
                yorum
            </div>

        </article>

    `;


    setupPostEvents();

}


/* =====================================================
   POST EVENTS
===================================================== */

function setupPostEvents() {

    const moreBtn =
        document.getElementById('moreBtn');

    const menu =
        document.getElementById('postMenu');

    const backdrop =
        document.getElementById(
            'postMenuBackdrop'
        );


    /*
       3 NOKTA
    */

    moreBtn.onclick =
        function(event) {

            event.preventDefault();
            event.stopPropagation();

            menu.classList.add('open');

            menu.setAttribute(
                'aria-hidden',
                'false'
            );

            moreBtn.setAttribute(
                'aria-expanded',
                'true'
            );

        };


    /*
       Menü arka planı
    */

    backdrop.onclick =
        closePostMenu;


    /*
       BEĞENİ
    */

    document
        .getElementById('likeBtn')
        .onclick =
        likePost;


    /*
       YORUMLAR
    */

    document
        .getElementById('commentsBtn')
        .onclick =
        function() {

            toast(
                'Yorumlar için ana sayfadaki yorumlar bölümünü kullanabilirsin.'
            );

        };


    /*
       PAYLAŞ
    */

    document
        .getElementById('sharePostBtn')
        .onclick =
        sharePost;


    /*
       MENÜ BUTONLARI
    */

    document
        .getElementById('savePostBtn')
        .onclick =
        savePost;


    document
        .getElementById('shareMenuBtn')
        .onclick =
        async function() {

            closePostMenu();

            await sharePost();

        };


    document
        .getElementById('hideCommentsBtn')
        .onclick =
        toggleComments;


    document
        .getElementById('deletePostBtn')
        .onclick =
        deletePost;

}


/* =====================================================
   CLOSE MENU
===================================================== */

function closePostMenu() {

    const menu =
        document.getElementById(
            'postMenu'
        );

    const moreBtn =
        document.getElementById(
            'moreBtn'
        );

    menu.classList.remove('open');

    menu.setAttribute(
        'aria-hidden',
        'true'
    );

    if (moreBtn) {

        moreBtn.setAttribute(
            'aria-expanded',
            'false'
        );

    }

}


/* =====================================================
   LIKE POST
===================================================== */

async function likePost() {

    const button =
        document.getElementById(
            'likeBtn'
        );

    const likesEl =
        document.getElementById(
            'likesCount'
        );

    if (!button || !currentPostId) {

        return;

    }


    /*
       Çift tıklama sırasında
       ikinci request gönderme.
    */

    if (
        button.dataset.loading === '1'
    ) {

        return;

    }

    button.dataset.loading = '1';


    const wasLiked =
        button.classList.contains(
            'liked'
        );

    const nextLiked =
        !wasLiked;


    /*
       Önce UI
    */

    button.classList.toggle(
        'liked',
        nextLiked
    );


    const path =
        button.querySelector('path');

    if (path) {

        if (nextLiked) {

            path.setAttribute(
                'fill',
                'currentColor'
            );

        } else {

            path.removeAttribute(
                'fill'
            );

        }

    }


    let count =
        Number(post.likes || 0);


    count =
        Math.max(
            0,
            count +
            (nextLiked ? 1 : -1)
        );


    post.likes = count;

    post.likedByMe =
        nextLiked;


    likesEl.textContent =
        count.toLocaleString(
            'tr-TR'
        ) +
        ' beğenme';


    try {

        const result =
            await api(
                '/posts/' +
                encodeURIComponent(
                    currentPostId
                ) +
                '/like',
                {
                    method: 'POST'
                }
            );


        /*
           API sayı döndürüyorsa
           sadece sayıyı güncelle.
        */

        if (
            result &&
            typeof result.likes === 'number'
        ) {

            post.likes =
                result.likes;

            likesEl.textContent =
                result.likes.toLocaleString(
                    'tr-TR'
                ) +
                ' beğenme';

        }


        /*
           ÖNEMLİ:
           API'nin yanlış liked değerinin
           UI'ı bozmasına izin vermiyoruz.
        */

        button.classList.toggle(
            'liked',
            nextLiked
        );

        if (path) {

            if (nextLiked) {

                path.setAttribute(
                    'fill',
                    'currentColor'
                );

            } else {

                path.removeAttribute(
                    'fill'
                );

            }

        }


    } catch (error) {

        /*
           Hata olursa geri al
        */

        button.classList.toggle(
            'liked',
            wasLiked
        );

        post.likedByMe =
            wasLiked;


        post.likes =
            Math.max(
                0,
                count +
                (nextLiked ? -1 : 1)
            );


        likesEl.textContent =
            post.likes.toLocaleString(
                'tr-TR'
            ) +
            ' beğenme';


        if (path) {

            if (wasLiked) {

                path.setAttribute(
                    'fill',
                    'currentColor'
                );

            } else {

                path.removeAttribute(
                    'fill'
                );

            }

        }


        toast(
            error.message ||
            'Beğeni işlemi başarısız'
        );

    } finally {

        button.dataset.loading =
            '0';

    }

}


/* =====================================================
   SAVE
===================================================== */

function savePost() {

    if (!currentPostId) {

        closePostMenu();

        return;

    }


    const key =
        'minegram_saved_post_' +
        String(currentPostId);


    const saved =
        localStorage.getItem(key) === '1';


    if (saved) {

        localStorage.removeItem(key);

        document
            .getElementById('savePostBtn')
            .querySelector(
                'span:last-child'
            )
            .textContent =
            'Kaydet';

        toast(
            'Kayıt kaldırıldı'
        );

    } else {

        localStorage.setItem(
            key,
            '1'
        );

        document
            .getElementById('savePostBtn')
            .querySelector(
                'span:last-child'
            )
            .textContent =
            'Kaydedildi';

        toast(
            'Gönderi kaydedildi'
        );

    }


    closePostMenu();

}


/* =====================================================
   HIDE COMMENTS COUNT
===================================================== */

function toggleComments() {

    const comments =
        document.getElementById(
            'commentsCount'
        );

    const button =
        document.getElementById(
            'hideCommentsBtn'
        );


    const key =
        'minegram_hide_comments_' +
        String(currentPostId);


    const hidden =
        comments.classList.contains(
            'hidden-comments'
        );


    if (hidden) {

        comments.classList.remove(
            'hidden-comments'
        );

        localStorage.removeItem(
            key
        );

        button
            .querySelector(
                'span:last-child'
            )
            .textContent =
            'Yorum sayısını gizle';

        toast(
            'Yorum sayısı gösteriliyor'
        );

    } else {

        comments.classList.add(
            'hidden-comments'
        );

        localStorage.setItem(
            key,
            '1'
        );

        button
            .querySelector(
                'span:last-child'
            )
            .textContent =
            'Yorum sayısını göster';

        toast(
            'Yorum sayısı gizlendi'
        );

    }


    closePostMenu();

}


/* =====================================================
   DELETE
===================================================== */

async function deletePost() {

    closePostMenu();


    if (
        !confirm(
            'Bu gönderiyi silmek istediğine emin misin?'
        )
    ) {

        return;

    }


    if (!currentPostId) {

        toast(
            'Gönderi kimliği bulunamadı'
        );

        return;

    }


    try {

        await api(
            '/posts/' +
            encodeURIComponent(
                currentPostId
            ),
            {
                method: 'DELETE'
            }
        );


        sessionStorage.removeItem(
            'minegram_selected_post'
        );


        toast(
            'Gönderi silindi'
        );


        setTimeout(
            () => {
                location.href =
                    'profile.html';
            },
            600
        );


    } catch (error) {

        toast(
            error.message ||
            'Gönderi silinemedi'
        );

    }

}


/* =====================================================
   SHARE
===================================================== */

async function sharePost() {

    const url =
        location.origin +
        '/post.html?id=' +
        encodeURIComponent(
            currentPostId
        );


    try {

        if (
            navigator.share
        ) {

            await navigator.share({

                title:
                    'Minegram gönderisi',

                url

            });

        } else {

            await navigator.clipboard.writeText(
                url
            );

            toast(
                'Gönderi bağlantısı kopyalandı'
            );

        }

    } catch (error) {

        /*
           Kullanıcı paylaşım penceresini
           kapattıysa hata gösterme.
        */

    }

}


/* =====================================================
   SAVED / HIDDEN STATE
===================================================== */

function restoreMenuState() {

    const saveBtn =
        document.getElementById(
            'savePostBtn'
        );

    const hideBtn =
        document.getElementById(
            'hideCommentsBtn'
        );

    const comments =
        document.getElementById(
            'commentsCount'
        );


    const savedKey =
        'minegram_saved_post_' +
        String(currentPostId);


    const hiddenKey =
        'minegram_hide_comments_' +
        String(currentPostId);


    const saved =
        localStorage.getItem(
            savedKey
        ) === '1';


    const hidden =
        localStorage.getItem(
            hiddenKey
        ) === '1';


    saveBtn
        .querySelector(
            'span:last-child'
        )
        .textContent =
        saved
            ? 'Kaydedildi'
            : 'Kaydet';


    saveBtn.setAttribute(
        'aria-pressed',
        String(saved)
    );


    if (hidden) {

        comments.classList.add(
            'hidden-comments'
        );

        hideBtn
            .querySelector(
                'span:last-child'
            )
            .textContent =
            'Yorum sayısını göster';

    } else {

        comments.classList.remove(
            'hidden-comments'
        );

        hideBtn
            .querySelector(
                'span:last-child'
            )
            .textContent =
            'Yorum sayısını gizle';

    }

}

document

document

/* =====================================================
   INIT
===================================================== */

async function init() {

    if (!token) {

        location.href =
            'index.html';

        return;

    }


    try {

        await loadPost();

        if (post) {

            restoreMenuState();

        }

    } catch (error) {

        console.error(
            error
        );

        document
            .getElementById('content')
            .innerHTML = `
                <div class="empty">
                    Gönderi yüklenemedi.<br>
                    <small>
                        ${esc(error.message)}
                    </small>
                </div>
            `;

    }

}


init();
