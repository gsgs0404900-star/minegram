<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Minegram • Gönderi</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;min-height:100%;overflow-x:hidden;padding-bottom:76px}
button,input{font:inherit}button{cursor:pointer}
.app{min-height:100dvh;background:#000;padding-bottom:78px}
.header{height:62px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #24242a;position:sticky;top:0;background:#000;z-index:20}
.back{border:0;background:none;color:#fff;font-size:39px;line-height:1;width:42px}
.title{font-size:20px;font-weight:700}
.more{margin-left:auto;border:0;background:none;color:#fff;font-size:29px;width:42px}
.post-menu{position:fixed;inset:0;display:none;z-index:80}.post-menu.open{display:block}.post-menu-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.58)}.post-menu-box{position:absolute;top:165px;right:0;width:340px;background:#242229;border-radius:4px;overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.55)}.post-menu-btn{width:100%;height:88px;border:0;background:transparent;color:#fff;display:flex;align-items:center;gap:24px;padding:0 25px;text-align:left;font-size:20px;font-weight:600;letter-spacing:0}.post-menu-btn:hover{background:#2b2931}.post-menu-btn .mi{width:30px;height:30px;display:grid;place-items:center;flex:none}.post-menu-btn .mi svg{width:30px;height:30px;stroke:#fff}.post-menu-btn.danger{color:#fff}.post-menu-btn[aria-pressed="true"]{background:#302e37}.hidden-comments{display:none!important}
.page{width:min(100%,1120px);margin:0 auto;padding:26px 24px 40px}
.post-layout{display:flex;justify-content:center;align-items:flex-start;width:100%;margin:0 auto}
.post-card{border:1px solid #292929;border-radius:8px;overflow:hidden;background:#050505;width:min(720px,100%);margin:0 auto}
.post-head{height:74px;display:flex;align-items:center;padding:0 18px;gap:12px;border-bottom:1px solid #222}
.avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;background:#3d91cf;display:grid;place-items:center;font-weight:700;font-size:19px;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.user{font-size:17px;font-weight:700;flex:1}.verified{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#2388df;font-size:12px;margin-left:4px}
.post-media{width:100%;background:#111;display:flex;justify-content:center;align-items:center;height:620px;min-height:280px;overflow:hidden}
.post-media img,.post-media video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.post-caption{padding:12px 18px 4px;color:#ddd;white-space:pre-wrap;line-height:1.45;font-size:15px}
.post-actions{height:60px;display:flex;align-items:center;padding:0 15px;gap:16px}
.action{border:0;background:none;color:#fff;font-size:30px;padding:0;display:flex;align-items:center;gap:8px}
.action span{font-size:15px;color:#aaa}.send{margin-left:auto;font-size:31px}
.likes{font-size:16px;font-weight:700;padding:0 18px 10px}
.comments{border-top:1px solid #222;padding:14px 18px;color:#999;font-size:14px}
.side{border:1px solid #292929;border-radius:8px;padding:18px;position:sticky;top:84px}
.side-title{font-size:15px;color:#999;margin-bottom:16px}.profile-row{display:flex;align-items:center;gap:12px}.profile-row .avatar{width:48px;height:48px}.profile-row b{font-size:16px}.side-bio{color:#aaa;font-size:13px;line-height:1.4;margin-top:15px}
.empty{text-align:center;color:#777;padding:80px 20px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:76px;padding:5px 4px max(5px,env(safe-area-inset-bottom));display:flex;background:#19171f;border-top:1px solid #25232c;z-index:30}
.nav{flex:1;border:0;background:none;color:#ddd;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav span{font-size:24px}.nav.active span{background:#3b3450;border-radius:18px;padding:3px 13px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#24222a;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1}
@media(max-width:899px){.post-menu-box{width:340px;max-width:100vw;right:0;top:165px}.post-menu-btn{height:88px;font-size:20px;padding:0 25px;gap:24px}.page{padding:0 0 30px}.post-layout{display:block}.post-card{border-left:0;border-right:0;border-radius:0}.side{display:none}.post-head{height:68px}.post-media{height:520px;min-height:220px}.post-media img,.post-media video{height:100%;object-fit:cover}.app{padding-bottom:78px}}
@media(min-width:900px){.header{padding:0 24px}.post-card{box-shadow:0 2px 18px rgba(0,0,0,.25)}}
.nav{position:fixed;left:0;right:0;bottom:0;height:76px;background:#121018;border-top:1px solid #201d27;display:flex;z-index:100;padding:5px 8px env(safe-area-inset-bottom)}.nav a,.nav button{flex:1;color:#ddd;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;border:0;background:transparent;cursor:pointer}.nav-icon,.nav i{width:45px;height:32px;border-radius:18px;display:grid;place-items:center;font-style:normal}.nav a.active .nav-icon,.nav button.active .nav-icon,.nav.active .nav-icon{background:#3b3150}.nav .ico,.nav .svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app">
<header class="header"><button class="back" id="backBtn" aria-label="Geri">‹</button><div class="title">Gönderi</div></header>
<main class="page"><div id="content" class="empty">Gönderi yükleniyor...</div></main>
</div>
<div id="toast" class="toast"></div>
<div id="postMenu" class="post-menu" aria-hidden="true">
  <div class="post-menu-backdrop" id="postMenuBackdrop"></div>
  <div class="post-menu-box" role="menu">
    <button class="post-menu-btn" id="savePostBtn" role="menuitem"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg></span><span>Kaydet</span></button>
    <button class="post-menu-btn" id="shareMenuBtn" role="menuitem"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.5-4.2M8.2 13.2l7.5 4.2"/></svg></span><span>Gönderiyi paylaş</span></button>
    <button class="post-menu-btn" id="hideCommentsBtn" role="menuitem"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H8l-4 4V4z"/></svg></span><span>Yorum sayısını gizle</span></button>
    <button class="post-menu-btn danger" id="deletePostBtn" role="menuitem"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14M9 7V4h6v3m-8 0 1 14h8l1-14M10 11v6m4-6v6"/></svg></span><span>Gönderiyi sil</span></button>
  </div>
</div>
<script>
const token=localStorage.getItem('minegram_token')||localStorage.getItem('token');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){opt={...opt,headers:{...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})}};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(url,opt);if(!r.ok){const j=await r.json().catch(()=>({}));const e=new Error(j.error||'İşlem başarısız');e.status=r.status;throw e}return r.json().catch(()=>({}))}
function toast(m){const e=document.getElementById('toast');if(!e)return;e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function postIdOf(p){return String(p?.id??p?.postId??p?._id??p?.uuid??'').trim()}
function getPostIdFromUrl(){const q=new URLSearchParams(location.search||'');return String(q.get('id')||q.get('postId')||q.get('post')||'').trim()}
function normalizePost(x,id=''){if(!x)return null;if(x.post)return normalizePost(x.post,id);if(x.result)return normalizePost(x.result,id);if(Array.isArray(x))return x.find(p=>postIdOf(p)===id)||x[0]||null;if(Array.isArray(x.posts))return x.posts.find(p=>postIdOf(p)===id)||null;if(Array.isArray(x.data))return x.data.find(p=>postIdOf(p)===id)||null;if(typeof x==='object'&&postIdOf(x))return x;return null}
function sessionPost(id){try{const p=JSON.parse(sessionStorage.getItem('minegram_selected_post')||'null');if(!p)return null;return !id||postIdOf(p)===id?p:null}catch(e){return null}}
function profileFromPost(post){let p={};try{p=JSON.parse(sessionStorage.getItem('minegram_selected_profile')||'{}')}catch(e){};const u=post?.user||post?.author||{};return {...p,username:p.username||u.username||post?.username||'minegram',displayName:p.displayName||u.displayName||post?.displayName||'',avatar:p.avatar||u.avatar||post?.avatar||'',verified:p.verified??u.verified??post?.verified??false}}
function formatViews(v){const n=Number(v||0);if(!Number.isFinite(n))return '0';return n.toLocaleString('tr-TR')}
const eye='<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.8"/></svg>';
function renderPost(post){
 const profile=profileFromPost(post); const username=profile.username; const avatar=profile.avatar; const verified=profile.verified;
 const id=postIdOf(post); const media=post.media||post.image||post.imageUrl||post.videoUrl||post.url||''; const type=String(post.type||post.mediaType||'').toLowerCase(); const isVideo=!!post.video||type.includes('video')||/\.(mp4|webm|mov)(\?|$)/i.test(media);
 const likes=post.likes??post.likeCount??0, comments=post.comments??post.commentCount??0, views=post.views??post.viewCount??post.viewsCount??post.impressions??0;
 const key=encodeURIComponent(id||media||username); const savedKey='minegram_saved_post_'+key; const hiddenKey='minegram_hidden_comments_'+key;
 const mediaHtml=media?(isVideo?'<video src="'+esc(media)+'" controls playsinline preload="metadata"></video>':'<img src="'+esc(media)+'" alt="Gönderi" loading="eager">'):'<div class="empty">Bu gönderide medya yok.</div>';
 const content=document.getElementById('content');content.className='post-layout';content.innerHTML=`<article class="post-card" data-id="${esc(id)}"><div class="post-head"><div class="avatar">${avatar?'<img src="'+esc(avatar)+'" alt="">':esc((profile.displayName||username||'M').charAt(0).toUpperCase())}</div><div class="user">${esc(username)}${verified?'<span class="verified">✓</span>':''}</div><button class="more" id="moreBtn" aria-label="Gönderi seçenekleri" aria-expanded="false">⋮</button></div><div class="post-media">${mediaHtml}</div><div class="post-actions"><button class="action" id="likeBtn">♡</button><button class="action" onclick="toast('Yorumlar yakında')">▢ <span>Yorum</span></button><button class="action send" id="shareBtn">➤</button></div><div class="likes">${Number(likes||0).toLocaleString('tr-TR')} beğenme</div>${post.caption?'<div class="post-caption"><b>'+esc(username)+'</b> '+esc(post.caption)+'</div>':''}<div class="comments" id="commentsCount">${Number(comments||0).toLocaleString('tr-TR')} yorum</div>${views?'<div class="views">'+eye+' '+formatViews(views)+' görüntülenme</div>':''}</article>`;
 sessionStorage.setItem('minegram_selected_post',JSON.stringify(post)); sessionStorage.setItem('minegram_selected_profile',JSON.stringify(profile));
 const like=document.getElementById('likeBtn');like.onclick=()=>{like.textContent=like.textContent==='♡'?'♥':'♡'}; document.getElementById('shareBtn').onclick=sharePost;
 const menu=document.getElementById('postMenu'), saveBtn=document.getElementById('savePostBtn'), hideBtn=document.getElementById('hideCommentsBtn'), delBtn=document.getElementById('deletePostBtn'), commentsEl=document.getElementById('commentsCount');
 if(menu&&saveBtn&&hideBtn&&commentsEl&&delBtn){const saved=localStorage.getItem(savedKey)==='1';const hidden=localStorage.getItem(hiddenKey)==='1';saveBtn.setAttribute('aria-pressed',String(saved));saveBtn.querySelector('span:last-child').textContent=saved?'Kaydedildi':'Kaydet';if(hidden){commentsEl.classList.add('hidden-comments');hideBtn.querySelector('span:last-child').textContent='Yorum sayısını göster';hideBtn.setAttribute('aria-pressed','true')};document.getElementById('moreBtn').onclick=()=>{menu.classList.add('open');menu.setAttribute('aria-hidden','false')};const close=()=>{menu.classList.remove('open');menu.setAttribute('aria-hidden','true')};document.getElementById('postMenuBackdrop').onclick=close;saveBtn.onclick=()=>{const n=localStorage.getItem(savedKey)!=='1';n?localStorage.setItem(savedKey,'1'):localStorage.removeItem(savedKey);saveBtn.querySelector('span:last-child').textContent=n?'Kaydedildi':'Kaydet';saveBtn.setAttribute('aria-pressed',String(n));toast(n?'Gönderi kaydedildi':'Kayıt kaldırıldı');close()};document.getElementById('shareMenuBtn').onclick=async()=>{close();await sharePost()};hideBtn.onclick=()=>{const n=!commentsEl.classList.contains('hidden-comments');commentsEl.classList.toggle('hidden-comments',n);n?localStorage.setItem(hiddenKey,'1'):localStorage.removeItem(hiddenKey);hideBtn.querySelector('span:last-child').textContent=n?'Yorum sayısını göster':'Yorum sayısını gizle';hideBtn.setAttribute('aria-pressed',String(n));close()};delBtn.onclick=async()=>{close();if(!confirm('Bu gönderiyi silmek istediğine emin misin?'))return;if(!id){toast('Gönderi kimliği bulunamadı');return}try{await api('/posts/'+encodeURIComponent(id),{method:'DELETE'});sessionStorage.removeItem('minegram_selected_post');location.href='profile.html'}catch(e){toast(e.message||'Gönderi silinemedi')}}}
}
async function loadPost(){const content=document.getElementById('content');const id=getPostIdFromUrl();let post=null;
 if(id){try{post=normalizePost(await api('/posts/'+encodeURIComponent(id)+'?ts='+Date.now()),id)}catch(e){} }
 if(!post)post=sessionPost(id);
 if(!post&&id){try{post=normalizePost(await api('/feed?ts='+Date.now()),id)}catch(e){} }
 if(!post){content.className='empty';content.innerHTML=id?'<strong>Gönderi bulunamadı</strong><small>Gönderi silinmiş, erişim iznin olmayabilir veya bağlantı geçersiz.</small>':'<strong>Henüz gönderi yok</strong><small>Gönderiyi ana sayfadan açmayı dene.</small>';return}
 renderPost(post);
}
async function sharePost(){try{if(navigator.share)await navigator.share({title:'Minegram gönderisi',url:location.href});else{await navigator.clipboard.writeText(location.href);toast('Bağlantı kopyalandı')}}catch(e){}
}
const back=document.getElementById('backBtn');if(back)back.onclick=()=>history.length>1?history.back():location.href='index.html';
document.querySelectorAll('.bottom-nav a').forEach(a=>a.addEventListener('click',()=>{}));
loadPost();
</script>
<style id="uniform-bottom-nav">
.bottom-nav{position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;height:78px!important;display:flex!important;flex-direction:row!important;align-items:stretch!important;justify-content:space-between!important;padding:8px 0!important;margin:0!important;background:#18161e!important;border-top:1px solid #25232c!important;z-index:99999!important;box-sizing:border-box!important}
.bottom-nav a{flex:1 1 20%!important;width:20%!important;max-width:20%!important;min-width:20%!important;height:100%!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:3px!important;margin:0!important;padding:0!important;border:0!important;background:transparent!important;text-align:center!important;text-decoration:none!important;color:#ddd!important;box-sizing:border-box!important}
.bottom-nav a i{display:grid!important;place-items:center!important;width:46px!important;height:29px!important;margin:0!important;padding:0!important;font-style:normal!important;border-radius:20px!important;box-sizing:border-box!important}
.bottom-nav a.active i{background:#3c3450!important}
.bottom-nav svg{width:22px!important;height:22px!important;fill:none!important;stroke:currentColor!important;stroke-width:1.8!important;stroke-linecap:round!important;stroke-linejoin:round!important}
.bottom-nav span{font-size:9px!important;line-height:1!important;white-space:nowrap!important}
body{padding-bottom:88px!important}
</style><nav class="bottom-nav">
