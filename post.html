<!doctype html>

<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minegram - Gönderi</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
min-height:100%;
background:#000;
color:#f5f5f5;
font-family:Arial,Helvetica,sans-serif
}

body{
overflow-x:hidden;
padding-bottom:20px
}

.app{
min-height:100vh;
background:#000
}

/* TOPBAR */

.topbar{
height:70px;
border-bottom:1px solid #202020;
display:flex;
align-items:center;
padding:0 22px;
position:sticky;
top:0;
background:#000;
z-index:50
}

.logo{
font-size:22px;
font-weight:700
}

.top-actions{
margin-left:auto;
display:flex;
gap:6px
}

.icon-btn{
width:42px;
height:42px;
border:0;
background:transparent;
color:#eee;
display:grid;
place-items:center;
cursor:pointer
}

.svg{
width:23px;
height:23px;
fill:none;
stroke:currentColor;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round
}

/* FEED */

.feed{
width:min(680px,100%);
margin:0 auto
}

.post{
width:100%;
border:1px solid #171717;
border-radius:2px;
background:#000;
margin:15px 0 18px;
overflow:hidden
}

.post-head{
height:66px;
display:flex;
align-items:center;
padding:0 14px;
gap:10px;
border-bottom:1px solid #161616
}

.username{
font-size:14px;
font-weight:700;
cursor:pointer
}

.more{
margin-left:auto;
font-size:25px;
line-height:1;
color:#eee;
cursor:pointer
}

.media-wrap{
width:100%;
display:flex;
justify-content:center;
background:#080808;
position:relative;
overflow:hidden
}

.post-media{
display:block;
width:100%;
max-height:610px;
object-fit:contain;
background:#080808;
cursor:pointer
}

.heart-pop{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%) scale(.55);
font-size:92px;
color:#ff1744;
opacity:0;
pointer-events:none;
text-shadow:0 3px 18px #000;
transition:.18s
}

.heart-pop.show{
opacity:1;
transform:translate(-50%,-50%) scale(1)
}

/* ACTIONS */

.actions{
height:50px;
display:flex;
align-items:center;
padding:0 12px;
gap:6px
}

.action{
height:42px;
min-width:42px;
border:0;
background:transparent;
color:#eee;
display:flex;
align-items:center;
gap:5px;
padding:0 5px;
cursor:pointer;
font-size:14px
}

.action .svg{
width:25px;
height:25px
}

.action.like{
color:#eee;
transition:transform .12s,color .15s
}

.action.like.liked{
color:#ed1b3a
}

.action.like.liked .svg{
fill:currentColor
}

.action.like:not(.liked) .svg{
fill:none
}

.action.like:active{
transform:scale(.85)
}

.likes{
font-size:14px;
font-weight:700;
padding:0 14px;
margin-top:-2px
}

.caption{
font-size:14px;
line-height:1.45;
padding:7px 14px 14px
}

.caption b{
cursor:pointer
}

.comments-preview{
padding:0 14px 12px;
color:#999;
font-size:13px;
cursor:pointer
}

.empty{
padding:110px 20px;
text-align:center;
color:#999
}

.empty strong{
display:block;
color:#eee;
font-size:16px;
margin-bottom:7px
}

/* MENU */

.menu-backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.58);
z-index:200;
display:none
}

.menu-backdrop.open{
display:block
}

.post-menu{
position:absolute;
right:12px;
top:78px;
width:300px;
background:#17141d;
border-radius:7px;
overflow:hidden;
box-shadow:0 10px 35px rgba(0,0,0,.65)
}

.menu-item{
height:72px;
padding:0 24px;
display:flex;
align-items:center;
gap:18px;
color:#d8d6dc;
font-size:17px;
font-weight:700;
border:0;
background:transparent;
width:100%;
text-align:left;
cursor:pointer
}

.menu-item:hover{
background:#211e28
}

.menu-item .svg{
width:25px;
height:25px;
stroke-width:1.9
}

/* TOAST */

.toast{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%);
background:#25232a;
color:#fff;
padding:10px 16px;
border-radius:20px;
font-size:12px;
opacity:0;
pointer-events:none;
transition:.2s;
z-index:300
}

.toast.show{
opacity:1
}

/* COMMENTS */

.comments-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.58);
z-index:250;
display:none;
align-items:flex-end
}

.comments-modal.open{
display:flex
}

.comments-sheet{
width:min(680px,100%);
height:min(78vh,720px);
margin:0 auto;
background:#171b1e;
border-radius:28px 28px 0 0;
display:flex;
flex-direction:column;
overflow:hidden
}

.sheet-head{
height:88px;
position:relative;
border-bottom:1px solid #25292c;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:700
}

.grab{
position:absolute;
top:10px;
width:74px;
height:8px;
border-radius:9px;
background:#9aa0a9
}

.close-comments{
position:absolute;
left:20px;
top:28px;
background:none;
border:0;
color:#fff;
font-size:34px;
cursor:pointer
}

/* SORT */

.sort{
padding:12px 22px;
border-bottom:1px solid #25292c
}

.sort-select{
width:100%;
height:42px;
border:0;
border-radius:10px;
background:#20252a;
color:#f5f5f5;
padding:0 12px;
font-size:15px;
font-weight:700;
outline:none
}

/* COMMENT LIST */

.comment-list{
flex:1;
overflow:auto;
padding:0 22px 15px
}

.comment-row{
display:flex;
gap:12px;
padding:13px 0
}

.comment-body{
flex:1;
min-width:0
}

.comment-user{
font-size:15px;
font-weight:700;
cursor:pointer
}

.comment-text{
font-size:15px;
margin-top:5px;
white-space:pre-wrap;
overflow-wrap:anywhere
}

.comment-meta{
font-size:12px;
color:#92979f;
margin-top:8px
}

.reply-link{
border:0;
background:transparent;
color:#858b94;
padding:0;
margin:0;
font:inherit;
font-weight:600;
cursor:pointer
}

.reply-link:hover{
color:#aeb4bd
}

/* REPLIES */

.replies{
margin-left:52px;
border-left:1px solid #2c3035;
padding-left:12px
}

.replies.hidden{
display:none
}

.reply-row{
display:flex;
gap:10px;
padding:10px 0
}

/* COMMENT LIKE */

.comment-like{
width:34px;
background:none;
border:0;
color:#fff;
font-size:21px;
cursor:pointer;
align-self:flex-start;
transition:transform .12s,color .15s
}

.comment-like.liked{
color:#ed1b3a
}

.comment-like:active{
transform:scale(.85)
}

/* EMOJIS */

.emoji-row{
display:flex;
justify-content:space-around;
align-items:center;
padding:10px 20px 5px;
gap:4px
}

.emoji-row button{
width:40px;
height:40px;
padding:0;
border:0;
background:transparent;
color:#fff;
font-size:27px;
cursor:pointer;
display:grid;
place-items:center;
border-radius:10px;
transition:transform .12s,background .12s
}

.emoji-row button:hover{
background:#252a2f
}

.emoji-row button:active{
transform:scale(.82)
}

/* COMMENT COMPOSE */

.comment-compose{
display:flex;
align-items:center;
gap:9px;
padding:10px 16px 18px
}

.compose-input{
flex:1;
min-width:0;
height:58px;
border:1px solid #3b3e42;
border-radius:16px;
background:#171b1e;
color:#fff;
padding:0 15px;
font-size:15px;
outline:none
}

.compose-input:focus{
border-color:#3f91cc
}

.send{
height:52px;
width:52px;
border:0;
background:transparent;
color:#fff;
font-size:27px;
cursor:pointer
}

.send:disabled{
opacity:.5;
cursor:not-allowed
}

/* AVATAR */

.avatar{
width:58px;
height:58px;
border-radius:50%;
background:#3f91cc;
display:grid;
place-items:center;
font-size:21px;
color:#eee;
margin:auto;
position:relative
}

.avatar.small{
width:40px;
height:40px;
font-size:15px;
margin:0;
flex:none
}

/* RESPONSIVE */

@media(max-width:699px){

.topbar{
height:62px;
padding:0 14px
}

.feed{
width:100%
}

.post{
margin:0 0 12px;
border-left:0;
border-right:0
}

.post-media{
max-height:520px
}

.post-head{
height:60px
}

.comments-sheet{
height:82vh
}

.post-menu{
right:8px;
top:68px;
width:min(300px,calc(100vw - 16px))
}

.emoji-row{
padding-left:8px;
padding-right:8px
}

.emoji-row button{
width:36px;
height:36px;
font-size:24px
}

}
</style>

</head>

<script>

const API='/api';

let token=
localStorage.getItem('minegram_token');

let currentUser=null;
let currentPost=null;
let currentCommentPost=null;
let currentCommentSort='forYou';
let replyingTo=null;

const feedEl=
document.getElementById('feed');


/* ESCAPE */

function esc(s=''){

return String(s).replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

}


/* API */

async function api(path,opt={}){

opt.headers={
...(opt.headers||{}),
...(token
?{Authorization:'Bearer '+token}
:{})
};

const r=
await fetch(API+path,opt);

const j=
await r.json().catch(()=>({}));

if(!r.ok){

throw Error(
j.error||
'İşlem başarısız'
);

}

return j;

}


/* TOAST */

function toast(t){

const e=
document.getElementById('toast');

e.textContent=t;

e.classList.add('show');

clearTimeout(window.__toast);

window.__toast=
setTimeout(
()=>e.classList.remove('show'),
2200
);

}


/* PROFILE */

function profileUrl(username){

return 'profile.html?user='+
encodeURIComponent(username);

}


/* POST */

function renderPost(p){

const user=
esc(
p.user?.username||
'minegram'
);

const initial=
esc(
(p.user?.username||'M')[0]
.toUpperCase()
);

const liked=
!!p.likedByMe;

let likes=0;

if(Array.isArray(p.likes)){

likes=p.likes.length;

}else{

likes=Number(p.likes||0);

}

const comments=
Array.isArray(p.comments)
?p.comments
:[];


let media='';

if(p.media){

if(
p.mediaName &&
/\.(mp4|webm|mov|m4v)$/i
.test(p.mediaName)
){

media=`

<video
class="post-media"
src="${esc(p.media)}"
controls
playsinline
></video>

`;

}else{

media=`

<img
class="post-media"
src="${esc(p.media)}"
loading="lazy"
alt="Gönderi"
>

`;

}

}


return `

<article
class="post"
data-id="${esc(p.id)}"
>

<div class="post-head">

<div class="avatar small">
${initial}
</div>

<div
class="username"
onclick="location.href='${profileUrl(user)}'"
>
@${user}
</div>

<button
class="icon-btn more"
onclick="openMenu(event,'${esc(p.id)}')"
>
⋯
</button>

</div>


${
media
?`

<div
class="media-wrap"
ondblclick="doubleLike('${esc(p.id)}')"
>

${media}

<div
class="heart-pop"
id="heart-${esc(p.id)}"
>
♥
</div>

</div>

`
:''
}


<div class="actions">

<button
type="button"
class="action like ${liked?'liked':''}"
onclick="likePost('${esc(p.id)}')"
>

<svg
class="svg"
viewBox="0 0 24 24"
>

<path
d="M20.8 8.8c0 5.4-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.8A4.8 4.8 0 0 1 8 4c1.5 0 2.9.7 4 2 1.1-1.3 2.5-2 4-2a4.8 4.8 0 0 1 4.8 4.8Z"
${liked?'fill="currentColor"':''}
>
</path>

</svg>

</button>


<button
type="button"
class="action"
onclick="openComments('${esc(p.id)}')"
>

<svg
class="svg"
viewBox="0 0 24 24"
>

<path d="M4 5h16v11H8l-4 4Z"></path>

</svg>

</button>

</div>


<div class="likes">
${likes} beğenme
</div>


<div class="caption">

<b
onclick="location.href='${profileUrl(user)}'"
>
@${user}
</b>

${esc(p.caption||'')}

</div>


${
comments.length
?`

<div
class="comments-preview"
onclick="openComments('${esc(p.id)}')"
>

${
comments.length>3
?'Tüm '+comments.length+' yorumu gör'
:comments.map(
c=>`
<div>
<b>@${esc(c.username||c.user?.username||'')}</b>
${esc(c.text||c.content||'')}
</div>
`
).join('')
}

</div>

`
:''
}

</article>

`;

}


/* LOAD */

async function loadFeed(){

feedEl.innerHTML=
'<div class="empty">Yükleniyor...</div>';

try{

const posts=
await api('/feed');

feedEl.innerHTML=
posts.length
?posts.map(renderPost).join('')
:`

<div class="empty">

<strong>
Henüz gönderi yok
</strong>

İlk gönderini oluştur.

</div>

`;

}catch(e){

feedEl.innerHTML=`

<div class="empty">

<strong>
Gönderiler yüklenemedi
</strong>

<small>
Sayfayı yenileyip tekrar dene.
</small>

</div>

`;

toast(e.message);

}

}


/* LIKE POST */

async function likePost(id){

const article=
document.querySelector(
'.post[data-id="'+
CSS.escape(String(id))+
'"]'
);

if(!article)return;

const btn=
article.querySelector('.action.like');

const likesEl=
article.querySelector('.likes');

if(!btn)return;

if(btn.dataset.loading==='1')return;

btn.dataset.loading='1';

const wasLiked=
btn.classList.contains('liked');

const nextLiked=
!wasLiked;

btn.classList.toggle(
'liked',
nextLiked
);

const path=
btn.querySelector('path');

if(path){

path.setAttribute(
'fill',
nextLiked
?'currentColor'
:'none'
);

}

if(likesEl){

const match=
(likesEl.textContent||'').match(/\d+/);

let count=
match?parseInt(match[0],10):0;

count=Math.max(
0,
count+(nextLiked?1:-1)
);

likesEl.textContent=
count+' beğenme';

}


try{

const r=
await api(
'/posts/'+
encodeURIComponent(id)+
'/like',
{
method:'POST'
}
);

if(
typeof r.likes==='number'
){

likesEl.textContent=
r.likes+' beğenme';

}

btn.classList.toggle(
'liked',
nextLiked
);

}catch(e){

btn.classList.toggle(
'liked',
wasLiked
);

if(path){

path.setAttribute(
'fill',
wasLiked
?'currentColor'
:'none'
);

}

toast(e.message);

}finally{

btn.dataset.loading='0';

}

}


/* DOUBLE LIKE */

async function doubleLike(id){

const heart=
document.getElementById(
'heart-'+CSS.escape(String(id))
);

if(heart){

heart.classList.add('show');

setTimeout(
()=>heart.classList.remove('show'),
650
);

}

const article=
document.querySelector(
'.post[data-id="'+
CSS.escape(String(id))+
'"]'
);

const btn=
article?.querySelector('.action.like');

if(
btn &&
btn.classList.contains('liked')
){

return;

}

await likePost(id);

}


/* MENU */

function openMenu(ev,id){

if(ev)ev.stopPropagation();

currentPost=id||currentPost;

document
.getElementById('menuBackdrop')
.classList.add('open');

}

function closeMenu(e){

if(
!e||
e.target===
document.getElementById('menuBackdrop')
){

document
.getElementById('menuBackdrop')
.classList.remove('open');

}

}


/* MENU SHARE */

async function shareCurrentPost(){

closeMenu();

if(!currentPost)return;

const url=
location.origin+
'/post.html?id='+
encodeURIComponent(currentPost);

try{

if(navigator.share){

await navigator.share({
title:'Minegram gönderisi',
url
});

}else{

await navigator.clipboard.writeText(url);

toast(
'Gönderi bağlantısı kopyalandı'
);

}

}catch(e){}

}


/* COMMENTS */

async function openComments(id){

currentCommentPost=id;
currentCommentSort='forYou';
replyingTo=null;

document
.getElementById('commentsModal')
.classList.add('open');

document
.getElementById('commentSort')
.value='forYou';

document
.getElementById('commentInput')
.value='';

document
.getElementById('commentInput')
.placeholder=
'Bunun hakkında ne düşünüyorsun?';

await refreshComments();

}


function closeComments(e){

if(
!e||
e.target===
document.getElementById('commentsModal')
){

document
.getElementById('commentsModal')
.classList.remove('open');

currentCommentPost=null;
replyingTo=null;

}

}


/* SORT */

function changeCommentSort(value){

currentCommentSort=value;

refreshComments();

}


function sortComments(comments){

const a=[...(comments||[])];

if(currentCommentSort==='newest'){

return a.sort(
(x,y)=>
new Date(
y.createdAt||y.created_at||0
)-
new Date(
x.createdAt||x.created_at||0
)
);

}

if(currentCommentSort==='popular'){

return a.sort(
(x,y)=>
Number(y.likes||y.likeCount||0)-
Number(x.likes||x.likeCount||0)
);

}

return a;

}


/* REFRESH */

async function refreshComments(){

if(!currentCommentPost)return;

const list=
document.getElementById('commentList');

try{

const p=
await api(
'/posts/'+
encodeURIComponent(currentCommentPost)
);

const comments=
Array.isArray(p.comments)
?p.comments
:(Array.isArray(p.post?.comments)
?p.post.comments
:[]);

list.innerHTML=
renderCommentsForPost(comments);

}catch(e){

list.innerHTML=
'<div class="empty">Yorumlar yüklenemedi.</div>';

}

}


/* RENDER COMMENTS */

function renderCommentsForPost(comments){

const sorted=
sortComments(comments);

return sorted.length
?sorted.map(renderComment).join('')
:'<div class="empty">Henüz yorum yok.</div>';

}


/* COMMENT */

function renderComment(c){

const username=
esc(
c.username||
c.user?.username||
'minegram'
);

const initial=
esc(
username[0].toUpperCase()
);

const id=
esc(c.id||'');

const liked=
!!c.likedByMe;

const replies=
Array.isArray(c.replies)
?c.replies
:[];

return `

<div
class="comment-wrap"
data-comment-id="${id}"
>

<div class="comment-row">

<div class="avatar small">
${initial}
</div>

<div class="comment-body">

<div
class="comment-user"
onclick="location.href='${profileUrl(username)}'"
>
@${username}
</div>

<div class="comment-text">
${esc(c.text||c.content||'')}
</div>

<div class="comment-meta">

${relativeTime(c.createdAt||c.created_at)}

&nbsp;

<button
class="reply-link"
onclick="startReply('${id}','${username}')"
>
Yanıtla
</button>

${
replies.length
?`

&nbsp;

<button
class="reply-link"
onclick="toggleReplies('${id}')"
>
${replies.length} yanıt
</button>

`
:''
}

</div>

</div>


<button
class="comment-like ${liked?'liked':''}"
onclick="likeComment('${id}')"
>
${liked?'♥':'♡'}
</button>

</div>


<div
id="replies-${id}"
class="replies hidden"
>

${replies.map(renderReply).join('')}

</div>

</div>

`;

}


/* REPLY */

function renderReply(r){

const username=
esc(
r.username||
r.user?.username||
'minegram'
);

return `

<div class="reply-row">

<div class="avatar small">
${username[0].toUpperCase()}
</div>

<div>

<b>
@${username}
</b>

<div class="comment-text">
${esc(r.text||r.content||'')}
</div>

<div class="comment-meta">
${relativeTime(r.createdAt||r.created_at)}
</div>

</div>

</div>

`;

}


/* START REPLY */

function startReply(id,username){

replyingTo=id;

const input=
document.getElementById('commentInput');

input.placeholder=
'@'+username+
' kişisine yanıt yaz...';

input.focus();

}


/* TOGGLE REPLIES */

function toggleReplies(id){

document
.getElementById(
'replies-'+CSS.escape(id)
)
?.classList.toggle('hidden');

}


/* EMOJI */

function addEmoji(emoji){

const input=
document.getElementById('commentInput');

if(!input)return;

const start=
input.selectionStart??
input.value.length;

const end=
input.selectionEnd??
input.value.length;

input.value=
input.value.substring(0,start)+
emoji+
input.value.substring(end);

const pos=
start+emoji.length;

input.focus();

try{

input.setSelectionRange(pos,pos);

}catch(e){}

}

const input=
document.getElementById('commentInput');

const text=
input.value.trim();

if(
!text||
!currentCommentPost
)return;

const button=
document.querySelector('.comment-compose .send');

if(button)
button.disabled=true;

const postId=
currentCommentPost;

const replyId=
replyingTo;

try{

let result;

if(replyId){

try{

result=
await api(
'/comments/'+
encodeURIComponent(replyId)+
'/reply',
{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
text
})
}
);

}catch(e){

result=
await api(
'/posts/'+
encodeURIComponent(postId)+
'/comments/'+
encodeURIComponent(replyId)+
'/reply',
{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
text
})
}
);

}

}else{

result=
await api(
'/posts/'+
encodeURIComponent(postId)+
'/comments',
{
method:'POST',
headers:{
'Content-Type':
'application/json'
},
body:JSON.stringify({
text
})
}
);

}

input.value='';

replyingTo=null;

input.placeholder=
'Bunun hakkında ne düşünüyorsun?';

toast(
replyId
?'Yanıt gönderildi'
:'Yorum gönderildi'
);

loadFeed();

}catch(e){

toast(
e.message||
'Yorum gönderilemedi'
);

button.disabled=false;

}


/* COMMENT LIKE */

async function likeComment(id){

const wrap=
document.querySelector(
'.comment-wrap[data-comment-id="'+
CSS.escape(String(id))+
'"]'
);

const btn=
wrap?.querySelector('.comment-like');

if(!btn)return;

if(btn.dataset.loading==='1')
return;

btn.dataset.loading='1';

const wasLiked=
btn.classList.contains('liked');

const nextLiked=
!wasLiked;

btn.classList.toggle(
'liked',
nextLiked
);

btn.textContent=
nextLiked?'♥':'♡';

try{

await api(
'/comments/'+
encodeURIComponent(id)+
'/like',
{
method:'POST'
}
);

btn.classList.toggle(
'liked',
nextLiked
);

btn.textContent=
nextLiked?'♥':'♡';

}catch(e){

btn.classList.toggle(
'liked',
wasLiked
);

btn.textContent=
wasLiked?'♥':'♡';

toast(e.message);

}finally{

btn.dataset.loading='0';

}

}


/* TIME */

function relativeTime(v){

const d=new Date(v);

if(!v||isNaN(d))
return '';

let s=
Math.floor(
(Date.now()-d.getTime())/1000
);

if(s<60)
return s+' saniye önce';

let m=
Math.floor(s/60);

if(m<60)
return m+' dakika önce';

let h=
Math.floor(m/60);

if(h<24)
return h+' saat önce';

let days=
Math.floor(h/24);

if(days<7)
return days+' gün önce';

if(days<365)
return Math.floor(days/7)+' hafta önce';

return d.toLocaleDateString('tr-TR');

}
