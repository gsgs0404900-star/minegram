<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minegram - E-posta Doğrulama</title>
<style>body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}.box{width:365px;margin-top:90px;text-align:center}.title{font-size:22px;font-weight:700;margin-bottom:12px}.desc{color:#888;font-size:13px;line-height:1.5}.btn{width:100%;height:44px;margin-top:12px;border:0;border-radius:22px;background:#2d80bd;color:#000;font-weight:700;cursor:pointer}.secondary{background:#000;color:#0095f6;border:1px solid #555}.status{min-height:24px;margin-top:15px;font-size:13px;color:#aaa}.ok{color:#35c759}.err{color:#ff4d4d}</style>
</head><body><div class="box"><div class="title">E-posta adresini doğrula</div><div class="desc">Firebase doğrulama e-postası gönderildi.<br>E-postandaki doğrulama bağlantısını aç.</div><button class="btn" id="check">Doğrulamayı kontrol et</button><button class="btn secondary" id="resend">Doğrulama e-postasını yeniden gönder</button><div class="status" id="status"></div></div>
<script>
const API=""; const key="AIzaSyCabJgEl6jhE_ucVBhA69LLQSCJ9qUuwXo";
const email=(new URLSearchParams(location.search).get("email")||sessionStorage.getItem("minegram_register_email")||"").trim().toLowerCase();
const username=new URLSearchParams(location.search).get("username")||sessionStorage.getItem("minegram_register_username")||"";
const statusEl=document.getElementById("status");
function status(t,c=""){statusEl.className="status "+c;statusEl.textContent=t;}
async function refreshFirebaseToken(){const refreshToken=sessionStorage.getItem("minegram_firebase_refresh_token")||""; if(!refreshToken)return sessionStorage.getItem("minegram_firebase_id_token")||""; const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(key)}`,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:`grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`}); const j=await r.json().catch(()=>({})); if(!r.ok)throw new Error(j?.error?.message||"Firebase oturumu yenilenemedi."); sessionStorage.setItem("minegram_firebase_id_token",j.id_token||""); if(j.refresh_token)sessionStorage.setItem("minegram_firebase_refresh_token",j.refresh_token); return j.id_token||"";}
async function check(){try{status("Firebase doğrulaması kontrol ediliyor...");const token=await refreshFirebaseToken(); if(!token)throw new Error("Firebase doğrulama oturumu bulunamadı. Kayıt işlemine yeniden başla."); const r=await fetch("/api/register/firebase-verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,idToken:token,password:sessionStorage.getItem("minegram_register_password")||""})}); const j=await r.json().catch(()=>({})); if(!r.ok||!j.verified)throw new Error(j.error||"E-posta henüz doğrulanmadı."); if(j.access_token)sessionStorage.setItem("minegram_api_token",j.access_token); if(j.refresh_token)sessionStorage.setItem("minegram_refresh_token",j.refresh_token); sessionStorage.removeItem("minegram_firebase_id_token");sessionStorage.removeItem("minegram_firebase_refresh_token");sessionStorage.removeItem("minegram_otp_pending");status("E-posta başarıyla doğrulandı. Hesabın hazır.","ok");setTimeout(()=>location.href="./giris.html",900);}catch(e){status(e.message||"Henüz doğrulanmadı. E-postadaki bağlantıyı aç ve tekrar dene.","err");}}
async function resend(){try{const token=sessionStorage.getItem("minegram_firebase_id_token")||await refreshFirebaseToken();if(!token)throw new Error("Firebase oturumu bulunamadı.");const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=${encodeURIComponent(key)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({requestType:"VERIFY_EMAIL",idToken:token})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j?.error?.message||"E-posta gönderilemedi.");status("Doğrulama e-postası yeniden gönderildi.","ok");}catch(e){status(e.message||"E-posta gönderilemedi.","err");}}
document.getElementById("check").onclick=check;document.getElementById("resend").onclick=resend;
</script></body></html>
