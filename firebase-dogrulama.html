<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Minegram - E-posta Doğrulama</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
.page{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.box{width:365px;margin-top:90px;text-align:center}
.title{font-size:22px;font-weight:700;line-height:1.25;margin:0 0 12px}
.desc{color:#777;font-size:13px;line-height:1.5;margin:0 0 24px}
.email{font-weight:700;word-break:break-word}
.status{min-height:24px;margin:15px 0;color:#aaa;font-size:13px;line-height:1.5}
.status.ok{color:#35c759}.status.err{color:#ff4d4d}
button{width:100%;height:44px;border:0;border-radius:22px;background:#2d80bd;color:#000;font-weight:700;cursor:pointer;margin-top:10px}
button.secondary{background:#000;border:1px solid #555;color:#0095f6}
</style>
</head>
<body>
<div class="page"><div class="box">
<h1 class="title">E-posta adresini doğrula</h1>
<p class="desc">
E-posta adresine Firebase tarafından doğrulama bağlantısı gönderildi.<br>
Gmail'ini açıp Minegram doğrulama bağlantısına tıkla.
</p>
<div id="email" class="email"></div>
<div id="status" class="status">Doğrulama bekleniyor...</div>
<button id="check" type="button">Doğrulamayı kontrol et</button>
<button id="resend" class="secondary" type="button">Doğrulama e-postasını yeniden gönder</button>
</div></div>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const email = String(params.get("email") || sessionStorage.getItem("minegram_register_email") || "").trim().toLowerCase();
const username = String(params.get("username") || sessionStorage.getItem("minegram_register_username") || "").trim().toLowerCase();
const password = sessionStorage.getItem("minegram_register_password") || sessionStorage.getItem("minegram_password") || "";
const emailEl = document.getElementById("email");
const statusEl = document.getElementById("status");
const checkBtn = document.getElementById("check");
const resendBtn = document.getElementById("resend");
emailEl.textContent = email || "E-posta adresi bulunamadı.";

function status(text, cls=""){ statusEl.textContent=text; statusEl.className="status "+cls; }

async function checkVerified(){
  if(!email || !password){ status("Kayıt bilgileri bulunamadı. Lütfen kayıt işlemine baştan başla.","err"); return; }
  checkBtn.disabled=true;
  status("Firebase doğrulaması kontrol ediliyor...");
  try{
    const r=await fetch("/api/register/firebase-status",{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({email,password}),
      cache:"no-store"
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok || data.ok===false) throw new Error(data.error || "Doğrulama kontrol edilemedi.");
    if(data.verified){
      sessionStorage.setItem("minegram_email_verified","true");
      sessionStorage.removeItem("minegram_otp_pending");
      status("E-posta doğrulandı. Kayıt tamamlandı.","ok");
      setTimeout(()=>{ location.href="./giris.html"; },1200);
    }else{
      status("Henüz doğrulanmadı. Gmail'deki bağlantıya tıklayıp tekrar kontrol et.");
    }
  }catch(e){ status(e.message || "Doğrulama kontrol edilemedi.","err"); }
  finally{ checkBtn.disabled=false; }
}

async function resend(){
  if(!email || !password){ status("Kayıt bilgileri bulunamadı.","err"); return; }
  resendBtn.disabled=true;
  status("Yeni doğrulama e-postası gönderiliyor...");
  try{
    const r=await fetch("/api/register/firebase-resend",{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({email,password}),
      cache:"no-store"
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok || data.ok===false) throw new Error(data.error || "E-posta gönderilemedi.");
    status("Yeni Firebase doğrulama e-postası gönderildi.","ok");
  }catch(e){ status(e.message || "E-posta gönderilemedi.","err"); }
  finally{ resendBtn.disabled=false; }
}
checkBtn.addEventListener("click",checkVerified);
resendBtn.addEventListener("click",resend);
setInterval(()=>{ if(document.visibilityState==="visible") checkVerified(); },15000);
</script>
</body>
</html>
